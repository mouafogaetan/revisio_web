<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page non trouvée - Revisio</title>
    <meta name="robots" content="noindex, nofollow" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #f0f4ff 0%, #e6f0fa 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: white;
            border-radius: 24px;
            padding: 48px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
            text-align: center;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .error-icon {
            font-size: 72px;
            margin-bottom: 16px;
            display: block;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 12px;
        }

        .subtitle {
            font-size: 18px;
            color: #4a4a5e;
            margin-bottom: 8px;
        }

        .description {
            font-size: 15px;
            color: #6b6b80;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 14px 32px;
            background: #2d6a4f;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            width: 100%;
            max-width: 280px;
            cursor: pointer;
        }

        .btn-primary:hover {
            background: #1b4d3e;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(45, 106, 79, 0.3);
        }

        .btn-secondary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 28px;
            background: transparent;
            color: #2d6a4f;
            border: 2px solid #2d6a4f;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            width: 100%;
            max-width: 280px;
            cursor: pointer;
        }

        .btn-secondary:hover {
            background: #f0f7f4;
            transform: translateY(-2px);
        }

        .suggestions {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid #e8ecf1;
            text-align: left;
        }

        .suggestions h3 {
            font-size: 14px;
            font-weight: 600;
            color: #1a1a2e;
            margin-bottom: 12px;
            text-align: center;
        }

        .suggestions-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .suggestion-link {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            background: #f8fafc;
            border-radius: 8px;
            color: #2d6a4f;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .suggestion-link:hover {
            background: #f0f7f4;
            transform: translateX(4px);
        }

        .suggestion-link .icon {
            font-size: 18px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 32px 20px;
            }

            h1 {
                font-size: 24px;
            }

            .error-icon {
                font-size: 56px;
            }

            .suggestions-grid {
                grid-template-columns: 1fr;
            }

            .btn-primary,
            .btn-secondary {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <span class="error-icon">🔍</span>
        <h1>Page non trouvée</h1>
        <p class="subtitle">Désolé, cette page n'existe pas ou a été déplacée.</p>
        <p class="description">
            Le contenu que vous recherchez n'est pas disponible. <br />
            Vérifiez l'URL ou revenez à l'accueil.
        </p>

        <div class="button-group">
            <a href="/" class="btn-primary">
                🏠 Retour à l'accueil
            </a>
            <button onclick="window.history.back()" class="btn-secondary">
                ⬅️ Page précédente
            </button>
        </div>

        <div class="suggestions">
            <h3>📚 Liens utiles</h3>
            <div class="suggestions-grid">
                <a href="/" class="suggestion-link">
                    <span class="icon">📖</span>
                    Révision
                </a>
                <a href="/evaluation" class="suggestion-link">
                    <span class="icon">📝</span>
                    Évaluation
                </a>
                <a href="/actu" class="suggestion-link">
                    <span class="icon">📰</span>
                    Actualités
                </a>
                <a href="/contact" class="suggestion-link">
                    <span class="icon">📧</span>
                    Contact
                </a>
            </div>
        </div>
    </div>

    <script>
        // Empêcher le chargement des scripts analytics sur la page 404
        console.log('Page 404 - Contenu non trouvé');
    </script>
</body>
</html>
