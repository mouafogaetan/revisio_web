<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Hygiène",
  "classe": "1ère Année",
  "sequence": "Séquence 6",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Maîtrise des connaissances fondamentales (7 points)",
      "points": "7 pts",
      "enonce": "<p style='font-weight: bold; font-size: 1.1em;'>Ce premier exercice évalue vos connaissances sur les notions essentielles de la santé reproductive, de la nutrition et de l'environnement.</p>",
      "questions": [
        {
          "question": "<p><strong>1.1) Questions à Choix Multiples (QCM) (4 points)</strong></p><p>Pour chaque question, une seule proposition est exacte. Choisissez la bonne réponse.</p><p><strong>1.1.1)</strong> La puberté est une période de transition marquée par :</p><ul><li>a) La fin de la croissance</li><li>b) L'apparition des caractères sexuels secondaires</li><li>c) La ménopause</li><li>d) L'arrêt de la production d'hormones</li></ul>",
          "reponse": "<p><strong>Réponse :</strong> b) L'apparition des caractères sexuels secondaires</p><p>La puberté est la période durant laquelle les caractères sexuels secondaires se développent sous l'action des hormones, rendant l'individu capable de se reproduire.</p>"
        },
        {
          "question": "<p><strong>1.1.2)</strong> Parmi les conséquences d'une grossesse précoce, laquelle est d'ordre médical ?</p><ul><li>a) L'abandon scolaire</li><li>b) La précarité financière</li><li>c) Les complications obstétricales</li><li>d) La stigmatisation sociale</li></ul>",
          "reponse": "<p><strong>Réponse :</strong> c) Les complications obstétricales</p><p>Les grossesses précoces exposent à des risques médicaux graves comme la pré-éclampsie, l'anémie et l'accouchement prématuré, pouvant mettre en danger la vie de la mère et de l'enfant.</p>"
        },
        {
          "question": "<p><strong>1.1.3)</strong> Le VIH se transmet principalement par :</p><ul><li>a) Les piqûres de moustiques</li><li>b) Les poignées de main</li><li>c) Les rapports sexuels non protégés</li><li>d) L'air ambiant</li></ul>",
          "reponse": "<p><strong>Réponse :</strong> c) Les rapports sexuels non protégés</p><p>Le VIH se transmet par contact avec du sang, du sperme ou des sécrétions vaginales infectés, principalement lors de rapports sexuels non protégés. Ce mode de transmission est essentiel à connaître pour se protéger.</p>"
        },
        {
          "question": "<p><strong>1.1.4)</strong> L'eutrophisation des cours d'eau est un phénomène lié à :</p><ul><li>a) Un manque de nutriments dans l'eau</li><li>b) Un excès de nitrates et de phosphates</li><li>c) La présence de métaux lourds</li><li>d) L'augmentation de la température de l'eau</li></ul>",
          "reponse": "<p><strong>Réponse :</strong> b) Un excès de nitrates et de phosphates</p><p>L'eutrophisation est la prolifération excessive d'algues due à un apport excessif en nutriments (nitrates, phosphates) provenant des engrais agricoles, ce qui prive l'eau d'oxygène et tue la faune aquatique.</p>"
        },
        {
          "question": "<p><strong>1.2) Exploitation des documents (3 points)</strong></p><p>Lisez le texte suivant et répondez aux questions : <em>'Au Cameroun, environ 25 % des adolescentes ont déjà vécu une grossesse avant l'âge de 18 ans. Cette situation est préoccupante car elle expose les jeunes filles à des risques médicaux, psychologiques et sociaux importants. Par ailleurs, les pratiques culturelles comme les mutilations génitales féminines (MGF) persistent dans certaines régions.'</em></p><p><strong>1.2.1)</strong> Quelles sont les trois catégories de conséquences d'une grossesse précoce mentionnées dans le texte ?</p>",
          "reponse": "<p>Les trois catégories de conséquences mentionnées sont :</p><ul><li><strong>Médicales :</strong> risques de complications obstétricales, anémie, fistule.</li><li><strong>Psychologiques :</strong> dépression, anxiété, sentiment de honte et d'isolement.</li><li><strong>Sociales :</strong> abandon scolaire, précarité financière, dépendance familiale.</li></ul>"
        },
        {
          "question": "<p><strong>1.2.2)</strong> Citez deux moyens de lutte contre les pratiques culturelles néfastes comme les MGF.</p>",
          "reponse": "<p>Deux moyens de lutte sont :</p><ol><li><strong>L'éducation et la sensibilisation</strong> des communautés sur les dangers et les droits des femmes.</li><li><strong>L'application des lois</strong> existantes, comme la loi de 2016 qui interdit les MGF au Cameroun.</li></ol>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Développement de compétences en santé (6 points)",
      "points": "6 pts",
      "enonce": "<p style='font-weight: bold; font-size: 1.1em;'>Situation :</p><p>Dans le cadre de la lutte contre les IST et les grossesses précoces, le club santé de votre lycée organise une journée de sensibilisation. En tant que membre du club, vous êtes chargé de préparer une intervention sur le thème : <em>'Protéger sa santé reproductive : un choix d'avenir'</em>.</p>",
      "questions": [
        {
          "question": "<p><strong>2.1) Questions à développement (6 points)</strong></p><p><strong>2.1.1)</strong> Expliquez la différence entre le VIH et le SIDA.</p>",
          "reponse": "<p>Le <strong>VIH</strong> (Virus de l'Immunodéficience Humaine) est le virus qui provoque l'infection. Il attaque les cellules du système immunitaire. Le <strong>SIDA</strong> (Syndrome d'Immunodéficience Acquise) est le stade avancé de l'infection, lorsque le système immunitaire est gravement affaibli, exposant la personne à des infections opportunistes. Une personne peut être infectée par le VIH pendant des années sans développer le SIDA, surtout si elle suit un traitement antirétroviral.</p>"
        },
        {
          "question": "<p><strong>2.1.2)</strong> Citez trois moyens de prévention contre le VIH/SIDA.</p>",
          "reponse": "<p>Trois moyens de prévention sont :</p><ol><li><strong>L'utilisation systématique du préservatif</strong> lors des rapports sexuels.</li><li><strong>Le dépistage volontaire</strong> pour connaître son statut et accéder aux traitements.</li><li><strong>La fidélité mutuelle</strong> entre partenaires non infectés, ou l'abstinence.</li></ol>"
        },
        {
          "question": "<p><strong>2.1.3)</strong> Décrivez les trois grandes catégories d'aliments en donnant un exemple pour chacune et expliquez les conséquences d'un déséquilibre alimentaire.</p>",
          "reponse": "<p>Les trois catégories d'aliments sont :</p><ol><li><strong>Les aliments énergétiques</strong> (pain, riz, huile) qui fournissent de l'énergie.</li><li><strong>Les aliments bâtisseurs</strong> (viande, poisson, œufs) qui aident à la construction et à la réparation des tissus.</li><li><strong>Les aliments protecteurs</strong> (fruits, légumes) qui apportent vitamines et minéraux.</li></ol><p>Un déséquilibre alimentaire peut causer des <strong>maladies par carence</strong> (kwashiorkor, scorbut) ou des <strong>maladies par excès</strong> (obésité, diabète de type 2).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Résolution de problèmes environnementaux (7 points)",
      "points": "7 pts",
      "enonce": "<p style='font-weight: bold; font-size: 1.1em;'>Contexte :</p><p>Le chef d'un village de la région de l'Est du Cameroun vous sollicite. La rivière dont dépendent les habitants pour l'eau est polluée. Les cas de diarrhées et de paludisme ont augmenté. Vous devez les aider à résoudre ce problème de santé publique.</p>",
      "questions": [
        {
          "question": "<p><strong>3.1)</strong> Identifiez et expliquez deux sources possibles de pollution de l'eau dans ce village.</p>",
          "reponse": "<ol><li><strong>Rejets domestiques :</strong> Les eaux usées et les déchets ménagers (plastiques, déchets organiques) jetés dans la rivière la contaminent avec des bactéries et des produits chimiques, pouvant causer des maladies comme le choléra ou la typhoïde.</li><li><strong>Défécation en plein air :</strong> Les matières fécales près des points d'eau introduisent des agents pathogènes, propagant des parasitoses et des infections.</li></ol>"
        },
        {
          "question": "<p><strong>3.2)</strong> Proposez trois méthodes de gestion durable de l'eau que les villageois peuvent adopter pour prévenir la pollution et économiser l'eau.</p>",
          "reponse": "<ol><li><strong>Récupération de l'eau de pluie :</strong> Installer des systèmes de collecte (gouttières, cuves) pour utiliser l'eau de pluie dans les tâches ménagères et l'arrosage, réduisant la pression sur la rivière.</li><li><strong>Construction de latrines :</strong> Bâtir des latrines pour éliminer la défécation en plein air et protéger les sources d'eau.</li><li><strong>Traitement de l'eau à domicile :</strong> Encourager l'ébullition de l'eau de boisson pendant 5 minutes, une méthode simple et efficace pour éliminer les micro-organismes pathogènes.</li></ol>"
        },
        {
          "question": "<p><strong>3.3)</strong> Expliquez comment la pollution de l'eau peut favoriser la transmission du paludisme et impacte particulièrement les enfants.</p>",
          "reponse": "<p><strong>Lien avec le paludisme :</strong> La pollution de l'eau, notamment par les déchets et les eaux stagnantes, crée des lieux de reproduction pour les moustiques <em>Anopheles</em>, vecteurs du paludisme. Une eau polluée favorise donc la prolifération des moustiques.</p><p><strong>Impact sur les enfants :</strong> Les enfants sont particulièrement vulnérables car leur système immunitaire est en développement. L'eau contaminée leur cause des diarrhées, des infections, du choléra et peut les rendre plus sensibles à la malnutrition. Associé au paludisme, cela aggrave leur état de santé.</p>"
        },
        {
          "question": "<p><strong>3.4)</strong> Proposez une action de sensibilisation concrète pour la communauté.</p>",
          "reponse": "<p>Je proposerai d'organiser des <strong>séances d'information participatives</strong> avec les villageois sur les risques de l'eau non traitée et les bonnes pratiques : faire bouillir l'eau, se laver les mains, utiliser des latrines, et éviter de jeter des déchets dans la rivière. Des affiches en langue locale pourraient être créées pour rappeler les gestes simples.</p>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
