<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Hygiène",
  "classe": "1ère Année",
  "sequence": "Séquence 3",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Santé de la reproduction et prévention (8 points)",
      "points": "8 pts",
      "enonce": "<p style='font-weight: bold; font-size: 1.1em;'>Document :</p><p>Au Cameroun, selon les données de l'UNFPA, environ 25% des adolescentes ont déjà eu une grossesse avant l'âge de 18 ans. Cette situation est préoccupante car elle expose les jeunes filles à des risques médicaux, psychologiques et sociaux importants. Par ailleurs, les pratiques culturelles comme les mutilations génitales féminines (MGF) persistent dans certaines régions, avec un taux de prévalence d'environ 11% chez les femmes de 15 à 49 ans.</p><p style='margin-top: 10px;'>Vous êtes agent de santé communautaire chargé de mener une campagne de sensibilisation dans un lycée de Douala. Vous devez préparer des réponses aux questions des élèves.</p>",
      "questions": [
        {
          "question": "<p><strong>1.1)</strong> Expliquez le phénomène de la puberté en identifiant les principaux changements physiques qui la caractérisent chez la fille et chez le garçon.</p>",
          "reponse": "<p>La puberté est la période de transition entre l'enfance et l'âge adulte, marquée par le développement des caractères sexuels secondaires et l'acquisition de la capacité à se reproduire. Chez la fille, on observe : le développement des seins, l'élargissement des hanches, l'apparition des règles (ménarche) et de la pilosité pubienne et axillaire. Chez le garçon, on note : l'élargissement des épaules, le développement des organes génitaux, l'apparition de la pilosité, la mue de la voix et la production de spermatozoïdes.</p>"
        },
        {
          "question": "<p><strong>1.2)</strong> Identifiez trois conséquences d'une grossesse précoce (médicale, psychologique et socio-économique) et proposez un moyen de protection pour prévenir ce phénomène.</p>",
          "reponse": "<p><strong>Conséquences :</strong></p><ul><li><strong>Médicale :</strong> risques de complications obstétricales (pré-éclampsie, anémie, accouchement prématuré) et de fistule obstétricale.</li><li><strong>Psychologique :</strong> dépression, anxiété, sentiment de honte et d'isolement.</li><li><strong>Socio-économique :</strong> abandon scolaire, précarité financière, dépendance familiale.</li></ul><p><strong>Moyens de protection :</strong> utilisation de préservatifs, accès à la contraception, éducation sexuelle, communication avec les parents.</p>"
        },
        {
          "question": "<p><strong>1.3)</strong> Définissez ce qu'est une mutilation génitale féminine (MGF) et décrivez deux conséquences graves de cette pratique sur la santé des femmes.</p>",
          "reponse": "<p>Les mutilations génitales féminines (MGF) sont l'ablation partielle ou totale des organes génitaux externes de la femme, pour des raisons non médicales. Les conséquences sont : 1) Hémorragie et infections immédiates pouvant entraîner la mort. 2) Douleurs chroniques et complications obstétricales (accouchement difficile, fistule). 3) Traumatisme psychologique et dépression. 4) Infertilité et douleurs lors des rapports sexuels.</p>"
        },
        {
          "question": "<p><strong>1.4)</strong> Proposez trois moyens de lutte contre les pratiques culturelles néfastes comme les MGF au Cameroun.</p>",
          "reponse": "<p>1) L'éducation et la sensibilisation des communautés sur les dangers de ces pratiques. 2) L'application des lois existantes qui interdisent ces pratiques (loi de 2016 contre les MGF au Cameroun). 3) L'autonomisation des femmes par l'éducation et la formation professionnelle. 4) L'implication des leaders religieux et traditionnels pour changer les mentalités.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : IST, VIH/SIDA et alimentation (6 points)",
      "points": "6 pts",
      "enonce": "<p style='font-weight: bold; font-size: 1.1em;'>Contexte :</p><p>Dans le cadre de la lutte contre le VIH/SIDA au Cameroun, le gouvernement et les associations mènent des campagnes de sensibilisation. Par ailleurs, la malnutrition reste un problème de santé publique majeur, touchant particulièrement les enfants et les adolescents. Vous êtes chargé de répondre à des questions lors d'une émission radio sur la santé.</p>",
      "questions": [
        {
          "question": "<p><strong>2.1)</strong> Distinguez le VIH du SIDA et décrivez les trois principaux modes de transmission du VIH.</p>",
          "reponse": "<p>Le VIH (Virus de l'Immunodéficience Humaine) est le virus qui cause l'infection. Le SIDA (Syndrome d'Immunodéficience Acquise) est le stade avancé de l'infection lorsque le système immunitaire est gravement affaibli. Les trois modes de transmission sont : 1) La transmission sexuelle (rapports non protégés). 2) La transmission sanguine (partage de seringues, transfusions). 3) La transmission mère-enfant (pendant la grossesse, l'accouchement ou l'allaitement).</p>"
        },
        {
          "question": "<p><strong>2.2)</strong> Citez quatre moyens de prévention contre le VIH/SIDA.</p>",
          "reponse": "<p>1) L'utilisation systématique du préservatif lors des rapports sexuels. 2) Le dépistage volontaire pour connaître son statut et accéder aux traitements. 3) La fidélité mutuelle entre partenaires non infectés. 4) L'abstinence sexuelle. 5) L'utilisation de matériel stérile pour les soins médicaux.</p>"
        },
        {
          "question": "<p><strong>2.3)</strong> Identifiez les trois catégories d'aliments et donnez deux exemples pour chacune. Expliquez les conséquences d'un déséquilibre alimentaire.</p>",
          "reponse": "<p>Les trois catégories d'aliments sont : 1) Les aliments énergétiques (pain, riz, huile, beurre) qui fournissent de l'énergie. 2) Les aliments bâtisseurs (viande, poisson, œufs, lait) qui aident à la construction des tissus. 3) Les aliments protecteurs (fruits, légumes) qui apportent vitamines et minéraux.</p><p>Un déséquilibre alimentaire peut causer des maladies par carence (kwashiorkor, scorbut, rachitisme) ou par excès (obésité, diabète de type 2, maladies cardiovasculaires).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Pollution de l'eau et gestion durable (6 points)",
      "points": "6 pts",
      "enonce": "<p style='font-weight: bold; font-size: 1.1em;'>Situation :</p><p>Dans un village de la région de l'Est du Cameroun, les habitants constatent que l'eau de la rivière est devenue trouble et dégage une mauvaise odeur. Les enfants souffrent de diarrhées fréquentes. Vous êtes envoyé par le centre de santé pour enquêter et proposer des solutions.</p>",
      "questions": [
        {
          "question": "<p><strong>3.1)</strong> Identifiez trois sources possibles de pollution de l'eau dans ce village et expliquez comment elles peuvent affecter la santé des habitants.</p>",
          "reponse": "<p>Sources de pollution : 1) Rejets domestiques (eaux usées, déchets ménagers) pouvant causer des maladies hydriques (choléra, typhoïde). 2) Activités agricoles (pesticides, engrais) pouvant intoxiquer les populations. 3) Défécation en plein air contaminant l'eau par des bactéries et parasites.</p><p>Les effets sur la santé sont : diarrhées, choléra, typhoïde, hépatite A, parasitoses intestinales.</p>"
        },
        {
          "question": "<p><strong>3.2)</strong> Expliquez les quatre grandes étapes de l'épuration de l'eau usée dans une station d'épuration.</p>",
          "reponse": "<p>Les quatre étapes de l'épuration sont : 1) Prétraitement : élimination des gros déchets (dégrillage), des sables (dessablage) et des graisses (déshuilage). 2) Traitement primaire : décantation pour éliminer les matières solides en suspension. 3) Traitement secondaire : dégradation de la matière organique par des bactéries dans les bassins d'aération. 4) Traitement tertiaire : désinfection (chloration, ozonation ou rayons UV) pour éliminer les micro-organismes pathogènes.</p>"
        },
        {
          "question": "<p><strong>3.3)</strong> Proposez trois méthodes de gestion durable de l'eau que les villageois peuvent adopter à domicile pour prévenir la pollution et économiser l'eau.</p>",
          "reponse": "<p>1) Récupération de l'eau de pluie pour l'arrosage et le nettoyage. 2) Construction de latrines pour éviter la défécation en plein air. 3) Gestion des déchets (compostage des déchets organiques, collecte des plastiques). 4) Faire bouillir l'eau avant de la consommer (ébullition 5 minutes). 5) Sensibiliser la communauté aux bonnes pratiques d'hygiène.</p>"
        },
        {
          "question": "<p><strong>3.4)</strong> Expliquez comment la pollution de l'eau peut avoir des effets écotoxicologiques sur les écosystèmes aquatiques.</p>",
          "reponse": "<p>La pollution de l'eau a des effets écotoxicologiques graves : 1) Perte de biodiversité : les polluants tuent les poissons et les plantes aquatiques. 2) Eutrophisation : l'excès de nutriments (nitrates, phosphates) provoque une prolifération d'algues qui consomment l'oxygène de l'eau, créant des zones mortes. 3) Bioaccumulation : les polluants (métaux lourds) s'accumulent dans la chaîne alimentaire, menaçant la faune et la santé humaine.</p>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
