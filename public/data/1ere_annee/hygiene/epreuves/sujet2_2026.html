<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Hygi\u00e8ne",
  "classe": "1\u00e8re Ann\u00e9e",
  "sequence": "S\u00e9quence 2",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Questions \u00e0 Choix Multiples (QCM) - Gestion de l'eau (12 pts)",
      "points": "12 pts",
      "enonce": "<div style='font-size:1.1em; line-height:1.8; padding:10px; background:#f8f9fa; border-radius:8px; color:#222;'>Pour chacune des propositions suivantes, une seule r\u00e9ponse est correcte. Recopiez sur votre copie le num\u00e9ro de chaque question et la lettre correspondant \u00e0 la bonne r\u00e9ponse.</div>",
      "questions": [
        {
          "question": "<div style='font-weight:bold; margin-top:15px;'>1) (2 pts) L'eau est une ressource essentielle \u00e0 la vie. Parmi les propositions suivantes, laquelle d\u00e9crit un usage <span style='color:#b33;'>domestique</span> de l'eau ?</div><div style='margin:8px 0 0 20px;'>A- Arroser les cultures pour la production agricole<br>B- Refroidir les machines dans une usine<br>C- Boire, cuisiner et se laver<br>D- Produire de l'\u00e9lectricit\u00e9 dans un barrage</div>",
          "reponse": "<div style='background:#e7f3e7; padding:12px; border-radius:6px; border-left:5px solid #2a7a2a; color:#1a3a1a;'><strong>R\u00e9ponse : C</strong><br><br>Les usages domestiques de l'eau sont ceux qui se font \u00e0 la maison, comme boire, pr\u00e9parer les repas, et l'hygi\u00e8ne personnelle. Les autres propositions (arroser les cultures, refroidir des machines, produire de l'\u00e9lectricit\u00e9) correspondent respectivement aux usages <strong>agricole</strong>, <strong>industriel</strong> et <strong>\u00e9nerg\u00e9tique</strong>.</div>"
        },
        {
          "question": "<div style='font-weight:bold; margin-top:15px;'>2) (2 pts) Pour lutter contre le gaspillage de l'eau \u00e0 la maison, quelle est l'attitude la plus efficace ?</div><div style='margin:8px 0 0 20px;'>A- Laisser le robinet couler pendant qu'on se brosse les dents<br>B- Utiliser un jet d'eau puissant pour laver la voiture<br>C- R\u00e9cup\u00e9rer l'eau de pluie pour arroser le jardin<br>D- Prendre de longs bains tous les jours</div>",
          "reponse": "<div style='background:#e7f3e7; padding:12px; border-radius:6px; border-left:5px solid #2a7a2a; color:#1a3a1a;'><strong>R\u00e9ponse : C</strong><br><br>R\u00e9cup\u00e9rer l'eau de pluie est une m\u00e9thode de <strong>gestion durable</strong> de l'eau qui permet d'\u00e9conomiser l'eau potable pour des usages qui n'en n\u00e9cessitent pas (comme l'arrosage). Les autres options sont des exemples de gaspillage.</div>"
        },
        {
          "question": "<div style='font-weight:bold; margin-top:15px;'>3) (2 pts) Parmi ces m\u00e9thodes, laquelle est une technique de <span style='color:#b33;'>gestion durable</span> de l'eau \u00e0 domicile ?</div><div style='margin:8px 0 0 20px;'>A- Utiliser de l'eau en bouteille pour toutes les t\u00e2ches m\u00e9nag\u00e8res<br>B- Installer des mousseurs sur les robinets<br>C- Jeter les m\u00e9dicaments p\u00e9rim\u00e9s dans les toilettes<br>D- Vider l'eau de la piscine tous les jours</div>",
          "reponse": "<div style='background:#e7f3e7; padding:12px; border-radius:6px; border-left:5px solid #2a7a2a; color:#1a3a1a;'><strong>R\u00e9ponse : B</strong><br><br>Les mousseurs sont des dispositifs \u00e9conomiseurs d'eau qui, en m\u00e9langeant l'eau avec de l'air, r\u00e9duisent le d\u00e9bit. C'est une technique simple et durable. Les autres propositions sont soit inefficaces, soit n\u00e9fastes pour l'environnement.</div>"
        },
        {
          "question": "<div style='font-weight:bold; margin-top:15px;'>4) (2 pts) Quel est l'impact d'une mauvaise gestion de l'eau sur l'environnement et la sant\u00e9 ?</div><div style='margin:8px 0 0 20px;'>A- Elle peut entra\u00eener la p\u00e9nurie d'eau et des maladies<br>B- Elle favorise la biodiversit\u00e9<br>C- Elle am\u00e9liore la qualit\u00e9 des sols<br>D- Elle ne cause aucun probl\u00e8me</div>",
          "reponse": "<div style='background:#e7f3e7; padding:12px; border-radius:6px; border-left:5px solid #2a7a2a; color:#1a3a1a;'><strong>R\u00e9ponse : A</strong><br><br>Une mauvaise gestion de l'eau (pollution, gaspillage) conduit \u00e0 une rar\u00e9faction de la ressource, ce qui peut provoquer des p\u00e9nuries et favoriser le d\u00e9veloppement de <strong>maladies li\u00e9es \u00e0 l'eau insalubre</strong>.</div>"
        },
        {
          "question": "<div style='font-weight:bold; margin-top:15px;'>5) (2 pts) Pour r\u00e9duire sa consommation d'eau au quotidien, il est conseill\u00e9 de :</div><div style='margin:8px 0 0 20px;'>A- Privil\u00e9gier les bains aux douches<br>B- Laisser couler l'eau pendant la vaisselle<br>C- R\u00e9parer les fuites d'eau d\u00e8s qu'elles sont d\u00e9tect\u00e9es<br>D- Utiliser l'eau potable pour nettoyer le sol</div>",
          "reponse": "<div style='background:#e7f3e7; padding:12px; border-radius:6px; border-left:5px solid #2a7a2a; color:#1a3a1a;'><strong>R\u00e9ponse : C</strong><br><br>Une simple fuite d'eau peut gaspiller des litres d'eau par jour. La r\u00e9parer est donc une action concr\u00e8te et essentielle pour une <strong>gestion durable</strong>. Les autres choix sont des comportements de gaspillage.</div>"
        },
        {
          "question": "<div style='font-weight:bold; margin-top:15px;'>6) (2 pts) Quelles sont les deux grandes cat\u00e9gories d'usages de l'eau identifi\u00e9es dans l'environnement ?</div><div style='margin:8px 0 0 20px;'>A- Usages essentiels et superflus<br>B- Usages urbains et ruraux<br>C- Usages consumptifs et non-consumptifs<br>D- Usages collectifs et individuels</div>",
          "reponse": "<div style='background:#e7f3e7; padding:12px; border-radius:6px; border-left:5px solid #2a7a2a; color:#1a3a1a;'><strong>R\u00e9ponse : C</strong><br><br>Les usages de l'eau se divisent en deux grandes cat\u00e9gories. Les usages <strong>consumptifs</strong> sont ceux o\u00f9 l'eau n'est pas restitu\u00e9e \u00e0 son milieu d'origine apr\u00e8s usage (ex: agriculture, consommation). Les usages <strong>non-consumptifs</strong> sont ceux o\u00f9 l'eau est restitu\u00e9e \u00e0 l'environnement, bien que parfois modifi\u00e9e (ex: hydro\u00e9lectricit\u00e9, navigation).</div>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Questions \u00e0 Choix Multiples (QCM) - Suite (6 pts)",
      "points": "6 pts",
      "enonce": "<div style='font-size:1.1em; line-height:1.8; padding:10px; background:#f8f9fa; border-radius:8px; color:#222;'>Pour chacune des propositions suivantes, une seule r\u00e9ponse est correcte. Recopiez sur votre copie le num\u00e9ro de chaque question et la lettre correspondant \u00e0 la bonne r\u00e9ponse.</div>",
      "questions": [
        {
          "question": "<div style='font-weight:bold; margin-top:15px;'>7) (2 pts) Le plan d'eau suivant est utilis\u00e9 \u00e0 la fois pour l'irrigation des champs et comme source d'\u00e9nergie. Il s'agit d'un usage :</div><div style='margin:8px 0 0 20px;'>A- Domestique uniquement<br>B- Agricole et \u00e9nerg\u00e9tique<br>C- Industriel et de loisir<br>D- Domestique et industriel</div>",
          "reponse": "<div style='background:#e7f3e7; padding:12px; border-radius:6px; border-left:5px solid #2a7a2a; color:#1a3a1a;'><strong>R\u00e9ponse : B</strong><br><br>L'irrigation des champs est un usage <strong>agricole</strong>. La production d'\u00e9nergie (ex: hydro\u00e9lectricit\u00e9) est un usage <strong>\u00e9nerg\u00e9tique</strong>. Le plan d'eau est donc utilis\u00e9 pour ces deux usages.</div>"
        },
        {
          "question": "<div style='font-weight:bold; margin-top:15px;'>8) (2 pts) Laquelle de ces propositions est une m\u00e9thode de gestion durable de l'eau particuli\u00e8rement adapt\u00e9e aux r\u00e9gions \u00e0 climat sec ?</div><div style='margin:8px 0 0 20px;'>A- Arroser les jardins en plein midi<br>B- Utiliser des plantes r\u00e9sistantes \u00e0 la s\u00e9cheresse (x\u00e9rophytes)<br>C- Laver les voitures avec un tuyau d'arrosage sans arr\u00eat<br>D- Remplir compl\u00e8tement sa piscine en p\u00e9riode de canicule</div>",
          "reponse": "<div style='background:#e7f3e7; padding:12px; border-radius:6px; border-left:5px solid #2a7a2a; color:#1a3a1a;'><strong>R\u00e9ponse : B</strong><br><br>Dans les r\u00e9gions s\u00e8ches, l'eau est rare. Planter des esp\u00e8ces r\u00e9sistantes \u00e0 la s\u00e9cheresse est une strat\u00e9gie de <strong>gestion durable</strong> qui r\u00e9duit consid\u00e9rablement les besoins en eau d'arrosage. C'est une adaptation intelligente au climat local.</div>"
        },
        {
          "question": "<div style='font-weight:bold; margin-top:15px;'>9) (2 pts) Outre le gaspillage, qu'est-ce qui menace le plus la ressource en eau \u00e0 l'\u00e9chelle locale et mondiale ?</div><div style='margin:8px 0 0 20px;'>A- La pollution d'origine domestique, agricole et industrielle<br>B- La pr\u00e9sence excessive de poissons dans les rivi\u00e8res<br>C- L'eau de pluie qui est trop froide<br>D- Le manque de barrages</div>",
          "reponse": "<div style='background:#e7f3e7; padding:12px; border-radius:6px; border-left:5px solid #2a7a2a; color:#1a3a1a;'><strong>R\u00e9ponse : A</strong><br><br>La <strong>pollution</strong> est l'une des principales menaces pour les ressources en eau. Les rejets domestiques, les pesticides agricoles et les d\u00e9chets industriels d\u00e9gradent la qualit\u00e9 de l'eau, la rendant impropre \u00e0 la consommation et nuisible pour les \u00e9cosyst\u00e8mes. La gestion durable de l'eau implique aussi de lutter contre ces pollutions.</div>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Questions \u00e0 Choix Multiples (QCM) - Suite et fin (6 pts)",
      "points": "6 pts",

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
