<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Présentation mobile</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' },
            options: { skipHtmlTypes: 'script' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 500px;
        margin: 0 auto;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    .slide-header {
        flex-shrink: 0;
        padding: 18px 16px 10px 16px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        z-index: 10;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .slide-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
    }

    .content-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 18px 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        flex-shrink: 0;
    }

    .content-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .content-card li {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        line-height: 1.5;
    }

    .content-card li:last-child {
        border-bottom: none;
    }

    .bullet-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
    }

    .math-block {
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        overflow-x: auto;
        flex-shrink: 0;
        margin: 4px 0;
    }

    .math-block .math {
        font-size: 1.2rem;
        color: #e2e8f0;
    }

    .note-box {
        background: rgba(96, 165, 250, 0.08);
        border-left: 4px solid #60a5fa;
        padding: 12px 16px;
        border-radius: 12px;
        font-style: italic;
        font-size: 0.9rem;
        color: #cbd5e1;
        flex-shrink: 0;
    }

    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        border-radius: 0;
        flex-direction: column;
    }

    .loading-card {
        background: #1e293b;
        padding: 32px 28px;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #334155;
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px auto;
    }

    .loading-text {
        font-weight: 600;
        font-size: 1.1rem;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    .loading-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 16px;
    }
    .loading-progress {
        height: 3px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        animation: loadingProgress 30s ease-out forwards;
    }

    .loading-timeout {
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 12px;
    }

    .btn-cancel-loading {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 40px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #f87171;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }

    .btn-cancel-loading:active {
        transform: scale(0.94);
        background: rgba(239, 68, 68, 0.25);
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
    }

    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .slide-counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255,255,255,0.05);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(255,255,255,0.04);
    }

    .status-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 30px;
        background: rgba(96, 165, 250, 0.12);
        color: #93bbfc;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
    }

    .status-badge .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: pulse-dot 1.2s infinite;
        flex-shrink: 0;
    }

    .status-badge.idle .dot {
        animation: none;
        background: #64748b;
    }
    .status-badge.speaking .dot {
        background: #34d399;
        animation: pulse-dot 0.8s infinite;
    }
    .status-badge.error .dot {
        background: #f87171;
        animation: none;
    }
    .status-badge.paused .dot {
        animation: none;
        background: #fbbf24;
    }
    .status-badge.waiting .dot {
        animation: pulse-dot 1.5s infinite;
        background: #fbbf24;
    }
    .status-badge.loading .dot {
        animation: pulse-dot 0.5s infinite;
        background: #60a5fa;
    }

    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.7); }
    }

    .footer-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(255,255,255,0.1);
    }

    .btn-secondary {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-play {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
        min-width: 80px;
        justify-content: center;
    }
    .btn-play:active {
        background: rgba(52, 211, 153, 0.25);
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
    }

    .auto-indicator {
        font-size: 0.65rem;
        color: #64748b;
        text-align: center;
        letter-spacing: 0.3px;
        padding: 2px 0;
    }

    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.2rem;
        }
        .content-card li {
            font-size: 0.9rem;
            padding: 8px 0;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .btn-play {
            min-width: 60px;
        }
        .footer-buttons {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
        .loading-card {
            padding: 20px 16px;
        }
        .math-block .math {
            font-size: 1rem;
        }
    }

    @media (min-width: 600px) {
        .app-container {
            max-width: 480px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
        .loading-overlay {
            border-radius: 32px;
        }
    }

    /* Mode jour (par défaut) */
    html, body {
        background: #f0f4f8 !important;
        color: #1a202c !important;
    }
    .app-container {
        background: linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%) !important;
    }
    .slide-header {
        background: rgba(255, 255, 255, 0.85) !important;
        border-bottom: 1px solid rgba(0,0,0,0.08) !important;
    }
    .slide-header h1 {
        background: linear-gradient(135deg, #2b6cb0, #6b46c1) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        background-clip: text !important;
    }
    .slide-footer {
        background: rgba(255, 255, 255, 0.9) !important;
        border-top: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card {
        background: rgba(255,255,255,0.8) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card li {
        border-bottom: 1px solid rgba(0,0,0,0.05) !important;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.12) !important;
        border-left: 4px solid #4299e1 !important;
        color: #2c3e50 !important;
    }
    .math-block {
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .math-block .math {
        color: #2d3748 !important;
    }
    .slide-counter {
        color: #4a5568 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .status-badge {
        background: rgba(96, 165, 250, 0.15) !important;
        color: #2b6cb0 !important;
        border: 1px solid rgba(96, 165, 250, 0.15) !important;
    }
    .btn {
        color: #2d3748 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .btn-secondary {
        background: rgba(0,0,0,0.04) !important;
        border-color: rgba(0,0,0,0.08) !important;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15) !important;
        border-color: rgba(52, 211, 153, 0.2) !important;
        color: #38a169 !important;
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15) !important;
        border-color: rgba(251, 191, 36, 0.2) !important;
        color: #d69e2e !important;
    }
    .auto-indicator {
        color: #718096 !important;
    }
    .loading-card {
        background: #ffffff !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .loading-text {
        color: #1a202c !important;
    }
    .loading-sub {
        color: #4a5568 !important;
    }
</style>
</head>
<body>

<div class="app-container">

    <header class="slide-header">
        <h1 id="slideTitle">Chargement...</h1>
    </header>

    <main class="slide-body" id="slideBody"></main>

    <!-- LOADING OVERLAY AVEC BOUTON ANNULER -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Préparation vocale...</div>
            <div class="loading-sub" id="loadingSub">Synthèse en cours</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loadingProgressBar"></div>
            </div>
            <div class="loading-timeout" id="loadingTimeout">⏱️ 30 secondes maximum</div>
            <button class="btn-cancel-loading" id="cancelLoadingBtn">
                <span>✕</span> Annuler
            </button>
        </div>
    </div>

    <footer class="slide-footer">
        <div class="footer-top">
            <span class="slide-counter" id="slideCounter">1 / 3</span>
            <span class="status-badge idle" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">Prêt</span>
            </span>
        </div>

        <div class="footer-buttons">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-secondary" id="replayBtn">
                <span class="btn-icon">🔁</span> <span class="btn-label">Relire</span>
            </button>
            <button class="btn btn-play" id="playBtn">
                <span class="btn-icon">▶</span> <span class="btn-label">Play</span>
            </button>
        </div>

        <div class="auto-indicator" id="autoIndicator">⏸ Lecture manuelle</div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // SLIDES
    // ================================================================
    const slides = [
  {
    "titre": "Bienvenue dans le monde des nombres relatifs",
    "contenu": "<div style='background: linear-gradient(135deg, #1a365d, #2b6cb0); color: white; padding: 20px; border-radius: 16px;'>\n  <h2 style='color: #fbd38d; font-size: 1.3em; margin-top: 0;'>🌡️ Les nombres relatifs dans notre vie</h2>\n  <p style='font-size: 1em; line-height: 1.6;'>Les nombres relatifs sont partout autour de nous :</p>\n  <div style='display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px;'>\n    <div style='background: rgba(255,255,255,0.15); padding: 12px; border-radius: 8px; text-align: center;'>\n      <div style='font-size: 2em;'>❄️</div>\n      <p style='margin: 4px 0 0; font-size: 0.9em;'>Températures négatives</p>\n    </div>\n    <div style='background: rgba(255,255,255,0.15); padding: 12px; border-radius: 8px; text-align: center;'>\n      <div style='font-size: 2em;'>🏔️</div>\n      <p style='margin: 4px 0 0; font-size: 0.9em;'>Altitudes (en dessous du niveau de la mer)</p>\n    </div>\n    <div style='background: rgba(255,255,255,0.15); padding: 12px; border-radius: 8px; text-align: center;'>\n      <div style='font-size: 2em;'>💰</div>\n      <p style='margin: 4px 0 0; font-size: 0.9em;'>Dettes et gains (comptes bancaires)</p>\n    </div>\n    <div style='background: rgba(255,255,255,0.15); padding: 12px; border-radius: 8px; text-align: center;'>\n      <div style='font-size: 2em;'>⬇️⬆️</div>\n      <p style='margin: 4px 0 0; font-size: 0.9em;'>Variations (baisse/hausse)</p>\n    </div>\n  </div>\n  <p style='margin-top: 12px; font-style: italic; text-align: center;'>\"Les nombres relatifs : pour compter tout ce qui est au-dessus et en dessous de zéro !\"</p>\n</div>",
    "texteParle": "Bonjour à toutes et à tous. Aujourd'hui, nous allons découvrir les nombres relatifs. Ces nombres sont très importants dans notre vie quotidienne. On les rencontre quand on parle de températures négatives, par exemple en hiver quand il fait moins cinq degrés. On les rencontre aussi avec les altitudes, quand on est en dessous du niveau de la mer. Ou encore avec les comptes bancaires, quand on a une dette, c'est un nombre négatif. Les nombres relatifs permettent donc de compter tout ce qui est au-dessus et en dessous de zéro.",
    "note": "Les nombres relatifs sont utilisés pour représenter des quantités positives ou négatives."
  },
  {
    "titre": "Définition des nombres relatifs",
    "contenu": "<div style='background: #f0f4f8; color: #1e293b; padding: 18px; border-radius: 12px;'>\n  <h3 style='color: #2b6cb0; margin-top: 0;'>📖 Qu'est-ce qu'un nombre relatif ?</h3>\n  <div style='background: white; padding: 16px; border-radius: 8px; border-left: 4px solid #2b6cb0;'>\n    <p style='font-size: 1.05em; line-height: 1.6;'>Un <strong>nombre relatif</strong> est un nombre qui peut être :</p>\n    <ul style='font-size: 0.95em; line-height: 1.8;'>\n      <li><strong>Positif</strong> : précédé du signe <span class='math'>\\( +\\)</span> ou sans signe (ex: <span class='math'>\\( +3 \\)</span> ou <span class='math'>\\( 3 \\)</span>)</li>\n      <li><strong>Négatif</strong> : précédé du signe <span class='math'>\\( -\\)</span> (ex: <span class='math'>\\( -3 \\)</span>)</li>\n      <li><strong>Nul</strong> : égal à <span class='math'>\\( 0 \\)</span> (ni positif, ni négatif)</li>\n    </ul>\n  </div>\n  <div style='display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px;'>\n    <div style='background: #e6fffa; padding: 12px; border-radius: 8px; border: 1px solid #38b2ac; text-align: center;'>\n      <strong style='color: #2c7a7b;'>🔢 Exemples de nombres relatifs</strong>\n      <p style='margin: 4px 0 0; font-size: 1.1em;'><span class='math'>\\( +5; -3; +12; -7; 0 \\)</span></p>\n    </div>\n    <div style='background: #fefcbf; padding: 12px; border-radius: 8px; border: 1px solid #ecc94b; text-align: center;'>\n      <strong style='color: #975a16;'>⚠️ Attention</strong>\n      <p style='margin: 4px 0 0; font-size: 0.9em;'>Le signe <span class='math'>\\( +\\)</span> est souvent sous-entendu pour les nombres positifs.</p>\n    </div>\n  </div>\n  <div style='background: #e2e8f0; padding: 10px; border-radius: 8px; margin-top: 12px;'>\n    <p style='margin: 0; font-size: 0.95em;'><strong>💡 Exemple :</strong> -5°C est un nombre relatif négatif, 25°C est un nombre relatif positif.</p>\n  </div>\n</div>",
    "texteParle": "Voyons maintenant ce qu'est exactement un nombre relatif. Un nombre relatif est un nombre qui peut être positif, négatif ou nul. Un nombre positif est précédé du signe plus ou n'a pas de signe. Par exemple, trois est un nombre positif. Un nombre négatif est précédé du signe moins. Par exemple, moins trois est un nombre négatif. Zéro est un cas particulier, il n'est ni positif, ni négatif. Les nombres relatifs sont donc des nombres qui ont un signe, ce qui permet de représenter des quantités au-dessus ou en dessous de zéro.",
    "note": "Un nombre relatif est un nombre muni d'un signe (+ ou -) ou égal à 0."
  },
  {
    "titre": "Les nombres entiers relatifs",
    "contenu": "<div style='background: #f0f4f8; color: #1e293b; padding: 18px; border-radius: 12px;'>\n  <h3 style='color: #2b6cb0; margin-top: 0;'>🔢 Les entiers relatifs</h3>\n  <div style='background: white; padding: 16px; border-radius: 8px; border-left: 4px solid #2b6cb0;'>\n    <p style='font-size: 1em; line-height: 1.6;'>Les <strong>entiers relatifs</strong> sont l'ensemble des nombres :</p>\n    <div style='text-align: center; font-size: 1.3em; margin: 12px 0; font-weight: bold;'>\n      <span style='background: #e2e8f0; padding: 8px 16px; border-radius: 8px;'>\\( \\mathbb{Z} = \\{ ...; -3; -2; -1; 0; 1; 2; 3; ... \\} \\)</span>\n    </div>\n    <p style='font-size: 0.95em; line-height: 1.6;'>Ils regroupent :</p>\n    <ul style='font-size: 0.95em; line-height: 1.8;'>\n      <li>Les <strong>entiers naturels</strong> (<span class='math'>\\( \\mathbb{N} \\)</span>) : 0; 1; 2; 3; ...</li>\n      <li>Leurs <strong>opposés</strong> : -1; -2; -3; ...</li>\n    </ul>\n  </div>\n  <div style='display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px;'>\n    <div style='background: #e6fffa; padding: 12px; border-radius: 8px; border: 1px solid #38b2ac;'>\n      <strong style='color: #2c7a7b;'>✅ Exemples d'entiers relatifs</strong>\n      <p style='margin: 4px 0 0; font-size: 0.9em;'>-10; -5; 0; 2; 15 sont des entiers relatifs.</p>\n    </div>\n    <div style='background: #fefcbf; padding: 12px; border-radius: 8px; border: 1px solid #ecc94b;'>\n      <strong style='color: #975a16;'>❌ Contre-exemples</strong>\n      <p style='margin: 4px 0 0; font-size: 0.9em;'>-3,5; 2,7 ne sont pas des entiers relatifs (ce sont des décimaux relatifs).</p>\n    </div>\n  </div>\n</div>",
    "texteParle": "Il existe différentes catégories de nombres relatifs. Les entiers relatifs sont les nombres qui n'ont pas de partie décimale. Ils sont représentés par l'ensemble Z, qui contient tous les nombres entiers positifs, tous les nombres entiers négatifs, et zéro. On peut donc dire que les entiers relatifs sont formés des entiers naturels, c'est-à-dire les nombres 0, 1, 2, 3, et ainsi de suite, et de leurs opposés, c'est-à-dire -1, -2, -3, et ainsi de suite. Par exemple, -5, 0, 7 et -12 sont des entiers relatifs, mais -3,5 n'en est pas un.",
    "note": "L'ensemble des entiers relatifs est noté \\( \\mathbb{Z} \\)."
  },
  {
    "titre": "Les nombres décimaux relatifs",
    "contenu": "<div style='background: #f0f4f8; color: #1e293b; padding: 18px; border-radius: 12px;'>\n  <h3 style='color: #2b6cb0; margin-top: 0;'>🔢 Les décimaux relatifs</h3>\n  <div style='background: white; padding: 16px; border-radius: 8px; border-left: 4px solid #2b6cb0;'>\n    <p style='font-size: 1em; line-height: 1.6;'>Les <strong>décimaux relatifs</strong> sont des nombres qui peuvent s'écrire avec une virgule et un nombre fini de chiffres après la virgule.</p>\n  </div>\n  <div style='display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px;'>\n    <div style='background: #e6fffa; padding: 14px; border-radius: 8px; border: 1px solid #38b2ac;'>\n      <strong style='color: #2c7a7b;'>✅ Exemples :</strong>\n      <ul style='font-size: 0.9em; line-height: 1.8;'>\n        <li><span class='math'>\\( -3,5 \\)</span></li>\n        <li><span class='math'>\\( +2,75 \\)</span></li>\n        <li><span class='math'>\\( -0,5 \\)</span></li>\n        <li><span class='math'>\\( 0,25 \\)</span></li>\n      </ul>\n    </div>\n    <div style='background: #fefcbf; padding: 14px; border-radius: 8px; border: 1px solid #ecc94b;'>\n      <strong style='color: #975a16;'>📝 Rappel :</strong>\n      <p style='font-size: 0.9em; line-height: 1.6;'>Un nombre décimal relatif peut aussi être un entier relatif (ex: <span class='math'>\\( -5 = -5,0 \\)</span>)</p>\n    </div>\n  </div>\n  <div style='background: #e2e8f0; padding: 10px; border-radius: 8px; margin-top: 12px;'>\n    <p style='margin: 0; font-size: 0.95em;'><strong>💡 Astuce :</strong> Les nombres décimaux relatifs sont très utilisés dans les mesures et les calculs de prix.</p>\n  </div>\n</div>",
    "texteParle": "Il existe aussi les nombres décimaux relatifs. Ce sont des nombres qui ont une partie décimale, c'est-à-dire des chiffres après la virgule, mais en nombre fini. Par exemple, moins trois virgule cinq, ou plus deux virgule soixante-quinze, sont des nombres décimaux relatifs. Il faut noter qu'un nombre entier relatif est aussi un nombre décimal relatif, car on peut l'écrire avec une virgule suivie de zéro. Les nombres décimaux relatifs sont très pratiques dans la vie courante, surtout pour les mesures et les calculs de prix.",
    "note": "Tout nombre entier relatif est aussi un nombre décimal relatif."
  },
  {
    "titre": "Placer les nombres relatifs sur une droite graduée",
    "contenu": "<div style='background: #f0f4f8; color: #1e293b; padding: 18px; border-radius: 12px;'>\n  <h3 style='color: #2b6cb0; margin-top: 0;'>📏 La droite graduée</h3>\n  <div style='background: white; padding: 14px; border-radius: 8px;'>\n    <p style='font-size: 0.95em; line-height: 1.6;'>On peut représenter les nombres relatifs sur une <strong>droite graduée</strong> :</p>\n    <ul style='font-size: 0.95em; line-height: 1.8;'>\n      <li>Le <strong>0</strong> est placé au centre</li>\n      <li>Les nombres <strong>positifs</strong> sont à droite de 0</li>\n      <li>Les nombres <strong>négatifs</strong> sont à gauche de 0</li>\n    </ul>\n  </div>\n  <div style='background: #e2e8f0; padding: 16px; border-radius: 8px; margin-top: 12px; text-align: center;'>\n    <p style='font-weight: bold; margin: 0;'>Exemple de droite graduée :</p>\n    <div style='font-size: 1.1em; letter-spacing: 4px;'>\n      <span style='color: #e53e3e;'>-3</span>  <span style='color: #e53e3e;'>-2</span>  <span style='color: #e53e3e;'>-1</span>  <span style='font-weight: bold;'>0</span>  <span style='color: #2b6cb0;'>1</span>  <span style='color: #2b6cb0;'>2</span>  <span style='color: #2b6cb0;'>3</span>\n    </div>\n    <div style='display: flex; justify-content: space-between; margin-top: 4px;'>\n      <span style='color: #e53e3e;'>← Négatifs</span>\n      <span style='color: #2b6cb0;'>Positifs →</span>\n    </div>\n  </div>\n  <div style='background: #e6fffa; padding: 12px; border-radius: 8px; margin-top: 12px; border: 1px solid #38b2ac;'>\n    <p style='margin: 0; font-size: 0.95em;'><strong>✅ Exercice :</strong> Placez -2, 3, -1,5 et 0,5 sur une droite graduée.</p>\n  </div>\n</div>",
    "texteParle": "Pour mieux visualiser les nombres relatifs, on peut les placer sur une droite graduée. Sur cette droite, le zéro est placé au centre. Les nombres positifs se trouvent à droite de zéro, et les nombres négatifs se trouvent à gauche de zéro. Plus un nombre est grand, plus il est à droite. Par exemple, 3 est à droite de 2. Pour les nombres négatifs, c'est l'inverse : -3 est à gauche de -2, donc plus petit. La droite graduée est un outil très utile pour comprendre et comparer les nombres relatifs.",
    "note": "Sur une droite graduée, les nombres négatifs sont à gauche de 0 et les positifs à droite."
  },
  {
    "titre": "Opposé d'un nombre relatif",
    "contenu": "<div style='background: #f0f4f8; color: #1e293b; padding: 18px; border-radius: 12px;'>\n  <h3 style='color: #2b6cb0; margin-top: 0;'>🔄 L'opposé d'un nombre</h3>\n  <div style='background: white; padding: 14px; border-radius: 8px;'>\n    <p style='font-size: 1em; line-height: 1.6;'>L'<strong>opposé</strong> d'un nombre relatif est le nombre qui a la même distance à zéro mais de signe contraire.</p>\n  </div>\n  <div style='display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px;'>\n    <div style='background: #e6fffa; padding: 14px; border-radius: 8px; border: 1px solid #38b2ac;'>\n      <strong style='color: #2c7a7b;'>📝 Exemples :</strong>\n      <ul style='font-size: 0.95em; line-height: 1.8;'>\n        <li>L'opposé de <span class='math'>\\( +3 \\)</span> est <span class='math'>\\( -3 \\)</span></li>\n        <li>L'opposé de <span class='math'>\\( -5 \\)</span> est <span class='math'>\\( +5 \\)</span></li>\n        <li>L'opposé de <span class='math'>\\( 0 \\)</span> est <span class='math'>\\( 0 \\)</span></li>\n      </ul>\n    </div>\n    <div style='background: #fefcbf; padding: 14px; border-radius: 8px; border: 1px solid #ecc94b;'>\n      <strong style='color: #975a16;'>✏️ À retenir :</strong>\n      <p style='font-size: 1em; margin: 4px 0;'>L'opposé de <span class='math'>\\( a \\)</span> se note <span class='math'>\\( -a \\)</span></p>\n      <p style='font-size: 0.9em;'>On a toujours : <span class='math'>\\( a + (-a) = 0 \\)</span></p>\n    </div>\n  </div>\n  <div style='background: #e2e8f0; padding: 10px; border-radius: 8px; margin-top: 12px;'>\n    <p style='margin: 0; font-size: 0.95em;'><strong>💡 Astuce :</strong> Pour trouver l'opposé d'un nombre, il suffit de changer son signe.</p>\n  </div>\n</div>",
    "texteParle": "Une notion importante avec les nombres relatifs est celle de l'opposé. L'opposé d'un nombre relatif est le nombre qui a la même valeur absolue, c'est-à-dire la même distance à zéro, mais avec un signe contraire. Par exemple, l'opposé de plus 3 est moins 3, et l'opposé de moins 5 est plus 5. Un cas particulier : zéro est son propre opposé. Pour trouver l'opposé d'un nombre, il suffit donc de changer son signe. Si on additionne un nombre et son opposé, on obtient toujours zéro.",
    "note": "La somme d'un nombre et de son opposé est toujours égale à 0."
  },
  {
    "titre": "Comparer et ranger des nombres relatifs",
    "contenu": "<div style='background: #f0f4f8; color: #1e293b; padding: 18px; border-radius: 12px;'>\n  <h3 style='color: #2b6cb0; margin-top: 0;'>⚖️ Comparer des nombres relatifs</h3>\n  <div style='background: white; padding: 14px; border-radius: 8px;'>\n    <p style='font-weight: 500; color: #2b6cb0;'>Règles de comparaison :</p>\n    <ul style='font-size: 0.95em; line-height: 1.8;'>\n      <li>Un nombre <strong>positif</strong> est toujours <strong>plus grand</strong> qu'un nombre <strong>négatif</strong></li>\n      <li>Parmi les nombres <strong>positifs</strong>, le plus grand est celui qui a la plus grande valeur</li>\n      <li>Parmi les nombres <strong>négatifs</strong>, le plus grand est celui qui a la plus <strong>petite</strong> valeur absolue</li>\n    </ul>\n  </div>\n  <div style='display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px;'>\n    <div style='background: #e6fffa; padding: 12px; border-radius: 8px; border: 1px solid #38b2ac;'>\n      <strong style='color: #2c7a7b;'>✅ Exemples :</strong>\n      <ul style='font-size: 0.9em; line-height: 1.8;'>\n        <li><span class='math'>\\( -5 < 3 \\)</span> (tout négatif est plus petit qu'un positif)</li>\n        <li><span class='math'>\\( -8 < -3 \\)</span> (sur la droite, -8 est à gauche de -3)</li>\n        <li><span class='math'>\\( 2 < 5 \\)</span> (parmi les positifs, 2 est plus petit que 5)</li>\n      </ul>\n    </div>\n    <div style='background: #fefcbf; padding: 12px; border-radius: 8px; border: 1px solid #ecc94b;'>\n      <strong style='color: #975a16;'>📝 À retenir :</strong>\n      <p style='font-size: 0.9em; line-height: 1.6;'>Sur la droite graduée, le nombre le plus grand est toujours à <strong>droite</strong>.</p>\n    </div>\n  </div>\n</div>",
    "texteParle": "Comparer des nombres relatifs est une compétence importante. Il y a quelques règles à retenir. D'abord, un nombre positif est toujours plus grand qu'un nombre négatif. Ensuite, pour comparer deux nombres positifs, c'est simple : le plus grand est celui qui a la plus grande valeur. Pour comparer deux nombres négatifs, c'est l'inverse : le plus grand est celui qui est le plus proche de zéro, c'est-à-dire celui qui a la plus petite valeur absolue. Par exemple, -3 est plus grand que -8. Sur la droite graduée, le nombre le plus grand est toujours celui qui est le plus à droite.",
    "note": "Pour comparer des nombres négatifs, le plus grand est celui qui est le plus proche de 0."
  },
  {
    "titre": "Addition de nombres relatifs",
    "contenu": "<div style='background: #f0f4f8; color: #1e293b; padding: 18px; border-radius: 12px;'>\n  <h3 style='color: #2b6cb0; margin-top: 0;'>➕ Additionner des nombres relatifs</h3>\n  <div style='background: white; padding: 14px; border-radius: 8px;'>\n    <p style='font-weight: 500; color: #2b6cb0;'>Règles d'addition :</p>\n    <ul style='font-size: 0.95em; line-height: 1.8;'>\n      <li>Même signe : on <strong>additionne</strong> les valeurs et on garde le signe</li>\n      <li>Signes différents : on <strong>soustrait</strong> les valeurs et on prend le signe du plus grand</li>\n    </ul>\n  </div>\n  <div style='display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px;'>\n    <div style='background: #e6fffa; padding: 12px; border-radius: 8px; border: 1px solid #38b2ac;'>\n      <strong style='color: #2c7a7b;'>📝 Exemple 1 : même signe</strong>\n      <div class='math' style='text-align: center; font-size: 1.1em; margin: 4px 0;'>\\( (-3) + (-5) = -8 \\)</div>\n      <p style='font-size: 0.85em;'>3 + 5 = 8, on garde le signe -</p>\n    </div>\n    <div style='background: #e6fffa; padding: 12px; border-radius: 8px; border: 1px solid #38b2ac;'>\n      <strong style='color: #2c7a7b;'>📝 Exemple 2 : signes différents</strong>\n      <div class='math' style='text-align: center; font-size: 1.1em; margin: 4px 0;'>\\( (+7) + (-3) = +4 \\)</div>\n      <p style='font-size: 0.85em;'>7 - 3 = 4, on prend le signe du plus grand (7)</p>\n    </div>\n  </div>\n  <div style='background: #fefcbf; padding: 10px; border-radius: 8px; margin-top: 12px;'>\n    <p style='margin: 0; font-size: 0.95em;'><strong>💡 Astuce :</strong> Pour additionner, pensez à la droite graduée !</p>\n  </div>\n</div>",
    "texteParle": "Passons maintenant à l'addition de nombres relatifs. Il y a deux cas à considérer. Si les deux nombres ont le même signe, on additionne leurs valeurs et on garde le signe commun. Par exemple, moins 3 plus moins 5 égale moins 8. Si les deux nombres ont des signes différents, on soustrait les valeurs et on prend le signe du nombre qui a la plus grande valeur. Par exemple, plus 7 plus moins 3 égale plus 4. N'hésitez pas à utiliser la droite graduée pour visualiser ces opérations.",
    "note": "Pour additionner des nombres relatifs, on regarde d'abord leurs signes."
  },
  {
    "titre": "Soustraction de nombres relatifs",
    "contenu": "<div style='background: #f0f4f8; color: #1e293b; padding: 18px; border-radius: 12px;'>\n  <h3 style='color: #2b6cb0; margin-top: 0;'>➖ Soustraire des nombres relatifs</h3>\n  <div style='background: white; padding: 14px; border-radius: 8px;'>\n    <p style='font-weight: 500; color: #2b6cb0;'>Règle de soustraction :</p>\n    <div style='text-align: center; font-size: 1.2em; margin: 8px 0;'>\n      <span style='font-weight: bold;'>\\( a - b = a + (-b) \\)</span>\n    </div>\n    <p style='font-size: 0.95em; line-height: 1.6;'>Pour soustraire un nombre relatif, on <strong>ajoute son opposé</strong>.</p>\n  </div>\n  <div style='display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px;'>\n    <div style='background: #e6fffa; padding: 14px; border-radius: 8px; border: 1px solid #38b2ac;'>\n      <strong style='color: #2c7a7b;'>📝 Exemple 1 :</strong>\n      <div class='math' style='text-align: center; font-size: 1.1em; margin: 4px 0;'>\\( (+5) - (+3) = (+5) + (-3) = +2 \\)</div>\n    </div>\n    <div style='background: #e6fffa; padding: 14px; border-radius: 8px; border: 1px solid #38b2ac;'>\n      <strong style='color: #2c7a7b;'>📝 Exemple 2 :</strong>\n      <div class='math' style='text-align: center; font-size: 1.1em; margin: 4px 0;'>\\( (+4) - (-2) = (+4) + (+2) = +6 \\)</div>\n    </div>\n  </div>\n  <div style='background: #e2e8f0; padding: 10px; border-radius: 8px; margin-top: 12px;'>\n    <p style='margin: 0; font-size: 0.95em;'><strong>🔑 La clé :</strong> Soustraire, c'est ajouter l'opposé !</p>\n  </div>\n</div>",
    "texteParle": "Pour la soustraction de nombres relatifs, il y a une règle très simple à retenir. Soustraire un nombre, c'est ajouter son opposé. Par exemple, pour calculer 5 moins 3, on fait 5 plus l'opposé de 3, c'est-à-dire 5 plus moins 3, ce qui donne 2. De même, 4 moins moins 2, c'est 4 plus l'opposé de moins 2, c'est-à-dire 4 plus 2, ce qui donne 6. Cette règle est très importante car elle transforme toute soustraction en une addition, ce qui est souvent plus simple à effectuer.",
    "note": "Soustraire un nombre revient à additionner son opposé : \\( a - b = a + (-b) \\)"
  }];
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentIndex = 0;
    let isSpeaking = false;
    let isPaused = false;
    let currentUtterance = null;
    let isLoading = false;
    let loadingTimeout = null;
    let isTransitioning = false;
    let speechSupported = true;
    let userInteracted = false;
    let isPlaying = false;
    let loadingCancelled = false;

    const total = slides.length;
    const synth = window.speechSynthesis;

    // Références jQuery
    const $title = $('#slideTitle');
    const $body = $('#slideBody');
    const $counter = $('#slideCounter');
    const $statusText = $('#statusText');
    const $statusBadge = $('#statusBadge');
    const $loading = $('#loadingOverlay');
    const $loadingText = $('#loadingText');
    const $loadingSub = $('#loadingSub');
    const $loadingTimeout = $('#loadingTimeout');
    const $loadingProgressBar = $('#loadingProgressBar');
    const $autoIndicator = $('#autoIndicator');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $replay = $('#replayBtn');
    const $play = $('#playBtn');
    const $cancelLoading = $('#cancelLoadingBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function setStatus(text, type) {
        $statusText.text(text);
        $statusBadge.removeClass('idle speaking error paused waiting loading');
        if (type === 'speaking') $statusBadge.addClass('speaking');
        else if (type === 'error') $statusBadge.addClass('error');
        else if (type === 'paused') $statusBadge.addClass('paused');
        else if (type === 'waiting') $statusBadge.addClass('waiting');
        else if (type === 'loading') $statusBadge.addClass('loading');
        else $statusBadge.addClass('idle');
    }

    function updatePlayButton() {
        if (isPlaying) {
            $play.addClass('playing');
            $play.find('.btn-icon').text('⏸');
            $play.find('.btn-label').text('Pause');
        } else {
            $play.removeClass('playing');
            $play.find('.btn-icon').text('▶');
            $play.find('.btn-label').text('Play');
        }
    }

    function showLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        
        loadingCancelled = false;
        isLoading = true;
        
        // Réinitialiser la barre de progression
        $loadingProgressBar.css('animation', 'none');
        $loadingProgressBar.css('width', '0%');
        // Forcer un reflow
        $loadingProgressBar[0].offsetHeight;
        $loadingProgressBar.css('animation', 'loadingProgress 30s ease-out forwards');
        
        $loadingText.text('Préparation vocale...');
        $loadingSub.text('Synthèse en cours');
        $loadingTimeout.text('⏱️ 30 secondes maximum');
        $loading.fadeIn(300);
        setStatus("⏳ Chargement...", 'loading');
        
        // 🔥 TIMEOUT DE 30 SECONDES
        loadingTimeout = setTimeout(() => {
            if (isLoading && !loadingCancelled) {
                hideLoading();
                setStatus("⚠️ Délai dépassé (30s)", 'error');
                isPlaying = false;
                updatePlayButton();
                $loadingSub.text('La synthèse vocale a pris trop de temps');
                $loadingTimeout.text('❌ Délai dépassé');
            }
        }, 30000);
    }

    function hideLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        isLoading = false;
        loadingCancelled = false;
        $loading.fadeOut(300);
        // Ne pas changer le statut si on est en train de parler
        if (!isSpeaking && !isPlaying) {
            setStatus("⏸ Lecture arrêtée", 'paused');
        }
    }

    function cancelLoading() {
        loadingCancelled = true;
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        hideLoading();
        stopSpeaking();
        setStatus("⏸ Annulé", 'paused');
        isPlaying = false;
        updatePlayButton();
        $loadingText.text('Annulé par l\'utilisateur');
        $loadingSub.text('Vous pouvez réessayer');
        $loadingTimeout.text('✕ Annulation');
    }

    // Arrêter la parole proprement
    function stopSpeaking() {
        try {
            if (synth && (synth.speaking || synth.pending)) {
                synth.cancel();
            }
        } catch(e) {
            console.warn('Erreur stopSpeaking:', e);
        }
        if (currentUtterance) {
            try {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance.onstart = null;
            } catch(e) {}
            currentUtterance = null;
        }
        isSpeaking = false;
        isPlaying = false;
        updatePlayButton();
    }

    // Mettre en pause la parole
    function pauseSpeaking() {
        try {
            if (synth && synth.speaking) {
                synth.pause();
                isPaused = true;
                isPlaying = false;
                setStatus("⏸ Lecture en pause", 'paused');
                updatePlayButton();
            }
        } catch(e) {
            console.warn('Erreur pauseSpeaking:', e);
            stopSpeaking();
        }
    }

    // Reprendre la parole
    function resumeSpeaking() {
        try {
            if (synth && synth.paused) {
                synth.resume();
                isPaused = false;
                isPlaying = true;
                setStatus("🔊 Lecture en cours", 'speaking');
                updatePlayButton();
            } else if (!isSpeaking && !synth.speaking && !synth.pending) {
                speakSlide(currentIndex);
            }
        } catch(e) {
            console.warn('Erreur resumeSpeaking:', e);
            speakSlide(currentIndex);
        }
    }

    function renderSlide(index) {
        const slide = slides[index];
        $title.text(slide.titre);

        let html = '';
        html += `<div class="content-card">${slide.contenu}</div>`;
        if (slide.note) {
            html += `<div class="note-box">${slide.note}</div>`;
        }
        $body.html(html);
        $counter.text(`${index+1} / ${total}`);

        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
        }
    }

    // ================================================================
    // LECTURE VOCALE
    // ================================================================
    function speakSlide(index) {
        return new Promise((resolve) => {
            const slide = slides[index];
            const text = slide.texteParle;
            
            if (!text || text.trim() === '' || !speechSupported) {
                resolve();
                return;
            }

            if (!window.speechSynthesis) {
                setStatus("❌ Synthèse vocale non supportée", 'error');
                speechSupported = false;
                resolve();
                return;
            }

            // Arrêter toute lecture en cours
            stopSpeaking();
            
            // Réinitialiser l'état de pause
            isPaused = false;
            
            showLoading();
            setStatus("Initialisation...", 'loading');

            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.92;
                utterance.pitch = 1.05;
                utterance.volume = 1;

                let isFinished = false;
                let errorHandled = false;

                utterance.onstart = function() {
                    if (loadingCancelled) {
                        stopSpeaking();
                        resolve();
                        return;
                    }
                    hideLoading();
                    isSpeaking = true;
                    isPlaying = true;
                    isPaused = false;
                    setStatus("🔊 Lecture en cours", 'speaking');
                    updatePlayButton();
                };

                utterance.onend = function() {
                    if (isFinished) return;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    setStatus("✅ Terminé", 'idle');
                    hideLoading();
                    updatePlayButton();
                    resolve();
                };

                utterance.onerror = function(e) {
                    if (isFinished || errorHandled) return;
                    errorHandled = true;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    hideLoading();
                    updatePlayButton();
                    
                    if (e.error === 'not-allowed') {
                        setStatus("⚠️ Permission refusée", 'error');
                    } else if (e.error === 'synthesis-unavailable') {
                        setStatus("⚠️ Synthèse indisponible", 'error');
                    } else if (e.error === 'canceled') {
                        setStatus("⏸ Annulé", 'paused');
                    } else {
                        setStatus("❌ Erreur audio: " + (e.error || 'inconnue'), 'error');
                    }
                    
                    resolve();
                };

                // Gestion du chargement des voix
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = function() {
                        if (!loadingCancelled) {
                            try {
                                synth.speak(utterance);
                            } catch(err) {
                                // Silencieux
                            }
                        }
                        synth.onvoiceschanged = null;
                    };
                }

                currentUtterance = utterance;
                
                if (!loadingCancelled) {
                    try {
                        synth.speak(utterance);
                    } catch(err) {
                        setTimeout(() => {
                            if (!loadingCancelled) {
                                try {
                                    synth.speak(utterance);
                                } catch(e) {
                                    setStatus("❌ Erreur de lecture", 'error');
                                    isPlaying = false;
                                    updatePlayButton();
                                    hideLoading();
                                    resolve();
                                }
                            } else {
                                resolve();
                            }
                        }, 100);
                    }
                } else {
                    resolve();
                }

            } catch(err) {
                hideLoading();
                setStatus("❌ Erreur générale", 'error');
                isPlaying = false;
                updatePlayButton();
                console.error('Erreur speakSlide:', err);
                resolve();
            }
        });
    }

    // ================================================================
    // NAVIGATION
    // ================================================================
    async function goToSlide(index) {
        if (isTransitioning) return;
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        
        // Si on est en train de lire, on met en pause avant de naviguer
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        // Arrêter complètement la lecture
        stopSpeaking();
        
        await new Promise(r => setTimeout(r, 50));
        
        if (index === currentIndex) {
            setStatus("📄 Slide actuel", 'idle');
            return;
        }

        isTransitioning = true;
        currentIndex = index;
        renderSlide(index);
        
        // Réinitialiser l'état de lecture
        isPlaying = false;
        updatePlayButton();
        setStatus("⏸ Lecture arrêtée", 'paused');

        await new Promise(r => setTimeout(r, 150));
        isTransitioning = false;
    }

    async function goToNext() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex + 1 < total) {
            await goToSlide(currentIndex + 1);
        } else {
            setStatus("🏁 Dernier slide", 'idle');
        }
    }

    async function goToPrev() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex - 1 >= 0) {
            await goToSlide(currentIndex - 1);
        } else {
            setStatus("🔁 Premier slide", 'idle');
        }
    }

    // ================================================================
    // GESTION PLAY/PAUSE
    // ================================================================
    function togglePlay() {
        if (!userInteracted) {
            userInteracted = true;
        }

        // Si le chargement est en cours, on l'annule
        if (isLoading) {
            cancelLoading();
            return;
        }

        // Si le synthétiseur est en pause, on reprend
        if (synth && synth.paused) {
            resumeSpeaking();
            return;
        }

        // Si la lecture est en cours, on met en pause
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
            return;
        }

        // Sinon, on démarre la lecture du slide courant
        if (!isSpeaking && !isPlaying) {
            stopSpeaking();
            speakSlide(currentIndex);
        }
    }

    // ================================================================
    // INIT
    // ================================================================
    async function init() {
        // Vérifier la compatibilité
        if (!window.speechSynthesis) {
            setStatus("❌ Synthèse vocale non supportée", 'error');
            speechSupported = false;
        }

        // Précharger les voix
        try {
            if (synth.getVoices) {
                synth.getVoices();
                setTimeout(() => {
                    try {
                        synth.getVoices();
                    } catch(e) {}
                }, 200);
            }
        } catch(e) {
            console.warn('Erreur chargement voix:', e);
        }

        // Afficher le premier slide
        renderSlide(0);
        $counter.text(`1 / ${total}`);
        
        // État initial
        setStatus("⏸ Appuie sur Play", 'paused');
        updatePlayButton();
        $autoIndicator.text('⏸ Lecture manuelle');

        // ================================================================
        // ÉVÉNEMENTS
        // ================================================================
        
        // Bouton Play/Pause
        $play.on('click', function() {
            togglePlay();
        });

        // Bouton Annuler le chargement
        $cancelLoading.on('click', function() {
            cancelLoading();
        });

        // Navigation
        $prev.on('click', function() {
            // Si chargement en cours, on annule
            if (isLoading) cancelLoading();
            goToPrev();
        });

        $next.on('click', function() {
            if (isLoading) cancelLoading();
            goToNext();
        });

        // Replay - relire le slide courant
        $replay.on('click', function() {
            if (isLoading) cancelLoading();
            stopSpeaking();
            setTimeout(() => {
                speakSlide(currentIndex);
            }, 100);
        });

        // Support du clavier (espace pour play/pause)
        $(document).on('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });

        // Nettoyage
        $(window).on('beforeunload', function() {
            try {
                if (synth.speaking) synth.cancel();
            } catch(e) {}
            hideLoading();
        });

        // Gérer les cas où la synthèse se termine de manière inattendue
        setInterval(() => {
            if (isPlaying && !synth.speaking && !synth.pending && !isPaused && !isLoading) {
                isPlaying = false;
                updatePlayButton();
                setStatus("⏸ Lecture arrêtée", 'paused');
            }
        }, 1000);
    }

    init();
});



    // ================================================================
    // GESTION DU THÈME JOUR/NUIT
    // ================================================================
    let isDarkMode = false;

    function toggleTheme() {
        isDarkMode = !isDarkMode;
        const body = document.body;
        const appContainer = document.querySelector('.app-container');
        const header = document.querySelector('.slide-header');
        const footer = document.querySelector('.slide-footer');
        const contentCards = document.querySelectorAll('.content-card');
        const noteBoxes = document.querySelectorAll('.note-box');
        const mathBlocks = document.querySelectorAll('.math-block');
        const buttons = document.querySelectorAll('.btn');
        const statusBadge = document.querySelector('.status-badge');
        const slideCounter = document.querySelector('.slide-counter');
        const autoIndicator = document.querySelector('.auto-indicator');
        const themeBtn = document.getElementById('themeToggle');

        if (isDarkMode) {
            // Mode nuit
            body.style.background = '#0b1120';
            body.style.color = '#f1f5f9';
            appContainer.style.background = 'linear-gradient(145deg, #0f172a 0%, #1e293b 100%)';
            header.style.background = 'rgba(15, 23, 42, 0.85)';
            footer.style.background = 'rgba(15, 23, 42, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.05)';
                card.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.08)';
                note.style.color = '#cbd5e1';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.25)';
                block.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#e2e8f0';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.12)';
                statusBadge.style.color = '#93bbfc';
            }
            if (slideCounter) {
                slideCounter.style.color = '#94a3b8';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#64748b';
            }
            if (themeBtn) {
                themeBtn.textContent = '☀️';
                themeBtn.title = 'Passer en mode jour';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#e2e8f0';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#e2e8f0';
                }
            });
        } else {
            // Mode jour (par défaut)
            body.style.background = '#f0f4f8';
            body.style.color = '#1a202c';
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
            header.style.background = 'rgba(255, 255, 255, 0.85)';
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.8)';
                card.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.12)';
                note.style.color = '#2c3e50';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.05)';
                block.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#2d3748';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
                statusBadge.style.color = '#2b6cb0';
            }
            if (slideCounter) {
                slideCounter.style.color = '#4a5568';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#718096';
            }
            if (themeBtn) {
                themeBtn.textContent = '🌓';
                themeBtn.title = 'Passer en mode nuit';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#2c3e50';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#2d3748';
                }
            });
        }
    }

    // Initialiser en mode jour
    document.addEventListener('DOMContentLoaded', function() {
        // Appliquer le mode jour par défaut
        const body = document.body;
        body.style.background = '#f0f4f8';
        body.style.color = '#1a202c';
        
        const appContainer = document.querySelector('.app-container');
        if (appContainer) {
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
        }
        
        const header = document.querySelector('.slide-header');
        if (header) {
            header.style.background = 'rgba(255, 255, 255, 0.85)';
        }
        
        const footer = document.querySelector('.slide-footer');
        if (footer) {
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
        }
        
        document.querySelectorAll('.content-card').forEach(card => {
            card.style.background = 'rgba(255,255,255,0.8)';
            card.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.note-box').forEach(note => {
            note.style.background = 'rgba(96, 165, 250, 0.12)';
            note.style.color = '#2c3e50';
        });
        
        document.querySelectorAll('.math-block').forEach(block => {
            block.style.background = 'rgba(0,0,0,0.05)';
            block.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.btn').forEach(btn => {
            btn.style.color = '#2d3748';
        });
        
        const statusBadge = document.querySelector('.status-badge');
        if (statusBadge) {
            statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
            statusBadge.style.color = '#2b6cb0';
        }
        
        const slideCounter = document.querySelector('.slide-counter');
        if (slideCounter) {
            slideCounter.style.color = '#4a5568';
        }
        
        const autoIndicator = document.querySelector('.auto-indicator');
        if (autoIndicator) {
            autoIndicator.style.color = '#718096';
        }
        
        document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
            if (!el.closest('.note-box')) {
                el.style.color = '#2c3e50';
            }
        });
        
        document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
            if (!el.closest('.note-box') && !el.closest('.math-block')) {
                el.style.color = '#2d3748';
            }
        });
        
        const themeBtn = document.getElementById('themeToggle');
        if (themeBtn) {
            themeBtn.textContent = '🌓';
            themeBtn.title = 'Passer en mode nuit';
        }
    });
</script>
