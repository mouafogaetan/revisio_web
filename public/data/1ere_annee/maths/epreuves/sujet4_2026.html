<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
 "matiere": "Mathématiques",
 "classe": "1ère année",
 "sequence": "Séquence 4",
 "anneeScolaire": "2025-2026",
 "exercices": [
   {
     "titre": "Exercice 1 : Nombres entiers et arithmétique (Chap 1)",
     "points": "4 pts",
     "enonce": "<div style='font-family: Arial, sans-serif; font-size: 1em; line-height: 1.6; color: #333;'>Cet exercice porte sur les nombres entiers naturels, les critères de divisibilité, le PGCD et le PPCM.<br><br><div style='background-color: #f9f9f9; padding: 15px; border-radius: 8px; border-left: 5px solid #005a9c; color: #222;'><strong>Contexte :</strong> Un agriculteur souhaite planter des arbres dans son champ. Il dispose de 126 pommiers et 180 poiriers. Il veut utiliser tous les arbres et faire le maximum de rangées identiques contenant le même nombre de pommiers et le même nombre de poiriers.</div></div>",
     "questions": [
       {
         "question": "<div style='font-size: 1em;'>1. Peut-on planter les arbres en 6 rangées identiques ? Justifie ta réponse.</div>",
         "reponse": "<div style='font-size: 1em; color: #222;'>Pour 6 rangées, il faut que 126 et 180 soient divisibles par 6.<br>126 est divisible par 6 car il est pair (divisible par 2) et la somme de ses chiffres est 1+2+6=9 (divisible par 3).<br>180 est aussi divisible par 6.<br>Donc, <strong>oui, on peut planter les arbres en 6 rangées identiques</strong>. [citation:1]</div>"
       },
       {
         "question": "<div style='font-size: 1em;'>2. Décompose les nombres 126 et 180 en produits de facteurs premiers.</div>",
         "reponse": "<div style='font-size: 1em; color: #222;'>126 = 2 × 3 × 3 × 7 = 2 × 3² × 7<br>180 = 2 × 2 × 3 × 3 × 5 = 2² × 3² × 5</div>"
       },
       {
         "question": "<div style='font-size: 1em;'>3. Quel est le nombre maximal de rangées identiques que l'agriculteur peut faire ?</div>",
         "reponse": "<div style='font-size: 1em; color: #222;'>Le nombre maximal de rangées est le <strong>PGCD</strong> de 126 et 180.<br>D'après la décomposition :<br>PGCD(126, 180) = 2 × 3² = 2 × 9 = 18.<br>Il peut donc faire au maximum <strong>18 rangées identiques</strong>. [citation:2]</div>"
       },
       {
         "question": "<div style='font-size: 1em;'>4. Combien y aura-t-il de pommiers et de poiriers dans chaque rangée ?</div>",
         "reponse": "<div style='font-size: 1em; color: #222;'>Nombre de pommiers par rangée : 126 ÷ 18 = 7<br>Nombre de poiriers par rangée : 180 ÷ 18 = 10<br>Chaque rangée contiendra <strong>7 pommiers et 10 poiriers</strong>.</div>"
       }
     ]
   },
   {
     "titre": "Exercice 2 : Fractions et opérations (Chap 2)",
     "points": "3 pts",
     "enonce": "<div style='font-family: Arial, sans-serif; font-size: 1em; line-height: 1.6; color: #333;'>Cet exercice permet de tester la maîtrise des opérations sur les fractions.</div>",
     "questions": [
       {
         "question": "<div style='font-size: 1em;'>1. Calcule et donne le résultat sous forme de fraction irréductible : <div class='math-block' style='text-align: center; padding: 10px;'><div class='math'>$$ A = \\frac{3}{4} + \\frac{5}{6} $$</div></div></div>",
         "reponse": "<div style='font-size: 1em; color: #222;'>Le dénominateur commun est 12 (PPCM de 4 et 6).<br>A = \\(\\frac{3 \\times 3}{4 \\times 3} + \\frac{5 \\times 2}{6 \\times 2} = \\frac{9}{12} + \\frac{10}{12} = \\frac{19}{12}\\).<br><strong>Résultat : \\(\\frac{19}{12}\\)</strong> (déjà irréductible).</div>"
       },
       {
         "question": "<div style='font-size: 1em;'>2. Calcule et donne le résultat sous forme de fraction irréductible : <div class='math-block' style='text-align: center; padding: 10px;'><div class='math'>$$ B = \\frac{7}{2} - \\frac{4}{3} \\times \\frac{9}{8} $$</div></div></div>",
         "reponse": "<div style='font-size: 1em; color: #222;'>La multiplication est prioritaire.<br>\\( \\frac{4}{3} \\times \\frac{9}{8} = \\frac{4 \\times 9}{3 \\times 8} = \\frac{36}{24} = \\frac{3}{2} \\) (après simplification par 12).<br>B = \\( \\frac{7}{2} - \\frac{3}{2} = \\frac{4}{2} = 2 \\).<br><strong>Résultat : \\(2\\)</strong> (ou \\(\\frac{2}{1}\\)).</div>"
       },
       {
         "question": "<div style='font-size: 1em;'>3. Calcule la fraction des élèves d'une classe qui portent des lunettes, sachant que les \\(\\frac{2}{5}\\) sont des filles et que \\(\\frac{3}{4}\\) d'entre elles portent des lunettes.</div>",
         "reponse": "<div style='font-size: 1em; color: #222;'>La fraction des filles qui portent des lunettes est \\(\\frac{2}{5} \\times \\frac{3}{4} = \\frac{6}{20} = \\frac{3}{10}\\).<br><strong>\\(\\frac{3}{10}\\) des élèves</strong> de la classe sont des filles qui portent des lunettes.</div>"
       }
     ]
   },
   {
     "titre": "Exercice 3 : Nombres décimaux et relatifs (Chap 3 & 4)",
     "points": "4 pts",
     "enonce": "<div style='font-family: Arial, sans-serif; font-size: 1em; line-height: 1.6; color: #333;'>Cet exercice combine les nombres décimaux et les nombres relatifs.</div>",
     "questions": [
       {
         "question": "<div style='font-size: 1em;'>1. Calcule en respectant les priorités opératoires : <div class='math-block' style='text-align: center; padding: 10px;'><div class='math'>$$ C = 3,5 \\times (2 - 5) + 12 \\div 4 $$</div></div></div>",
         "reponse": "<div style='font-size: 1em; color: #222;'>C = 3,5 × (-3) + 3<br>C = -10,5 + 3<br>C = <strong>-7,5</strong></div>"
       },
       {
         "question": "<div style='font-size: 1em;'>2. Donne l'écriture fractionnaire de 2,45.</div>",
         "reponse": "<div style='font-size: 1em; color: #222;'>2,45 = \\( \\frac{245}{100} = \\frac{49}{20} \\) (après simplification par 5).</div>"
       },
       {
         "question": "<div style='font-size: 1em;'>3. Place les nombres suivants sur une droite graduée (dans le format texte, décris l'ordre) : -2,5 ; 3 ; 0 ; -1,5.</div>",
         "reponse": "<div style='font-size: 1em; color: #222;'>Dans l'ordre croissant : <strong>-2,5 < -1,5 < 0 < 3</strong>.<br>Donc, sur une droite, -2,5 est le plus à gauche et 3 le plus à droite.</div>"
       },
       {
         "question": "<div style='font-size: 1em;'>4. Un plongeur est à -15 m (15 m sous le niveau de la mer). Il remonte de 8 m. À quelle profondeur se trouve-t-il maintenant ?</div>",
         "reponse": "<div style='font-size: 1em; color: #222;'>Nouvelle profondeur = -15 + 8 = -7 m.<br>Il se trouve donc à <strong>-7 mètres</strong> (7 mètres sous le niveau de la mer). [citation:1]</div>"
       }
     ]
   },
   {
     "titre": "Exercice 4 : Proportionnalité, pourcentages et échelles (Chap 5)",
     "points": "4 pts",
     "enonce": "<div style='font-family: Arial, sans-serif; font-size: 1em; line-height: 1.6; color: #333;'>Ce problème aborde les situations de proportionnalité dans la vie courante.</div>",
     "questions": [
       {
         "question": "<div style='font-size: 1em;'>1. Un article coûte 120 000 FCFA. Il subit une réduction de 15 %. Quel est son nouveau prix ?</div>",
         "reponse": "<div style='font-size: 1em; color: #222;'>Montant de la réduction : 120 000 × 15/100 = 120 000 × 0,15 = 18 000 FCFA.<br>Nouveau prix : 120 000 - 18 000 = <strong>102 000 FCFA</strong>.<br>(Autre méthode : 120 000 × 0,85 = 102 000 FCFA).</div>"
       },
       {
         "question": "<div style='font-size: 1em;'>2. Sur un plan à l'échelle 1/200, une longueur mesure 12 cm. Quelle est la longueur réelle en mètres ?</div>",
         "reponse": "<div style='font-size: 1em; color: #222;'>L'échelle 1/200 signifie que 1 cm sur le plan représente 200 cm en réalité.<br>Longueur réelle = 12 × 200 = 2400 cm = <strong>24 m</strong>.</div>"
       },
       {
         "question": "<div style='font-size: 1em;'>3. Complète le tableau de proportionnalité suivant. <div style='overflow-x: auto; margin: 10px 0;'><table style='width: 100%; border-collapse: collapse; background-color: #fff; color: #222;'><tr><th style='border: 1px solid #ccc; padding: 8px; background-color: #e9ecef;'>Nombre de kg</th><td style='border: 1px solid #ccc; padding: 8px; text-align: center;'>5</td><td style='border: 1px solid #ccc; padding: 8px; text-align: center;'>12</td></tr><tr><th style='border: 1px solid #ccc; padding: 8px; background-color: #e9ecef;'>Prix (FCFA)</th><td style='border: 1px solid #ccc; padding: 8px; text-align: center;'>2000</td><td style='border: 1px solid #ccc; padding: 8px; text-align: center;'>?</td></tr></table></div></div>",
         "reponse": "<div style='font-size: 1em; color: #222;'>Le coefficient de proportionnalité est 2000 / 5 = 400.<br>Prix pour 12 kg = 12 × 400 = <strong>4800 FCFA</strong>.</div>"
       }
     ]
   },
   {
     "titre": "Exercice 5 : Géométrie du plan (Chap 6 à 11)",
     "points": "5 pts",
     "enonce": "<div style='font-family: Arial, sans-serif; font-size: 1em; line-height: 1.6; color: #333;'>Cet exercice porte sur les droites, les segments, les cercles, les angles et les triangles.</div>",
     "questions": [
       {
         "question": "<div style='font-size: 1em;'>1. Construis un angle \\(\\widehat{ABC} = 50°\\) (décris la construction).</div>",
         "reponse": "<div style='font-size: 1em; color: #222;'>Pour construire un angle de 50° :<br>1. Tracer une demi-droite [BA).<br>2. Placer le rapporteur sur le point B (le sommet), en alignant le 0 sur la demi-droite.<br>3. Marquer un point C à la graduation 50°.<br>4. Tracer la demi-droite [BC).<br>L'angle \\(\\widehat{ABC}\\) mesure 50°.</div>"
       },
       {
         "question": "<div style='font-size: 1em;'>2. Un cercle a un rayon de 4 cm. Calcule son périmètre (arrondi au centième) et l'aire du disque correspondant.</div>",
         "reponse": "<div style='font-size: 1em; color: #222;'>Périmètre : P = 2πr = 2 × π × 4 = 8π ≈ 25,13 cm.<br>Aire : A = πr² = π × 4² = 16π ≈ 50,27 cm².</div>"
       },
       {
         "question": "<div style='font-size: 1em;'>3. Un triangle ABC est rectangle en A. AB = 3 cm et AC = 4 cm. Calcule la longueur de l'hypoténuse BC.</div>",
         "reponse": "<div style='font-size: 1em; color: #222;'>D'après le théorème de Pythagore : BC² = AB² + AC² = 3² + 4² = 9 + 16 = 25.<br>Donc BC = √25 = 5 cm.</div>"
       },
       {
         "question": "<div style='font-size: 1em;'>4. Qu'est-ce qu'une médiatrice ? Construis la médiatrice d'un segment [AB] de 6 cm.</div>",
         "reponse": "<div style='font-size: 1em; color: #222;'>La médiatrice d'un segment est la droite perpendiculaire à ce segment en son milieu.<br>Pour la construire :<br>1. Tracer le segment [AB] de 6 cm.<br>2. Placer le compas au point A, prendre un écartement supérieur à la moitié du segment (plus de 3 cm) et tracer un arc de cercle au-dessus et en dessous du segment.<br>3. Garder le même écartement, placer le compas en B et tracer deux autres arcs de cercle qui croisent les premiers.<br>4. Relier les deux points d'intersection des arcs. Cette droite est la médiatrice du segment [AB].</div>"
       }
     ]
   }
 ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
