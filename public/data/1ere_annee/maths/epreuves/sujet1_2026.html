<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Mathématiques",
  "classe": "1ère année",
  "sequence": "Séquence 1",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Nombres entiers naturels et opérations",
      "points": "4 pts",
      "enonce": "<div style='background-color: #f0f4f8; padding: 15px; border-radius: 10px; color: #1e293b; font-size: 1em;'>Cet exercice porte sur la lecture, l'écriture et les opérations sur les nombres entiers naturels.</div>",
      "questions": [
        {
          "question": "1) Écrire en chiffres le nombre <strong>deux cent trente-quatre mille cinq cent soixante-douze</strong>.",
          "reponse": "234 572"
        },
        {
          "question": "2) Dans le nombre 7 583 421, quel est le chiffre des dizaines de mille ?",
          "reponse": "Le chiffre des dizaines de mille est 8."
        },
        {
          "question": "3) Calculer : <span class='math'>\\(48 + 37 - 15\\)</span>",
          "reponse": "<span class='math'>\\(48 + 37 - 15 = 85 - 15 = 70\\)</span>"
        },
        {
          "question": "4) Effectuer la division euclidienne de 157 par 12. Donner le quotient et le reste.",
          "reponse": "<span class='math'>\\(157 = 12 \\times 13 + 1\\)</span><br>Le quotient est 13 et le reste est 1."
        },
        {
          "question": "5) Un élève achète 4 cahiers à 250 FCFA l'unité et 3 stylos à 150 FCFA l'unité. Combien dépense-t-il ?",
          "reponse": "Coût des cahiers : <span class='math'>\\(4 \\times 250 = 1000\\)</span> FCFA<br>Coût des stylos : <span class='math'>\\(3 \\times 150 = 450\\)</span> FCFA<br>Dépense totale : <span class='math'>\\(1000 + 450 = 1450\\)</span> FCFA"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Divisibilité, PGCD et PPCM",
      "points": "3 pts",
      "enonce": "<div style='background-color: #f0f4f8; padding: 15px; border-radius: 10px; color: #1e293b; font-size: 1em;'>On considère les nombres 24 et 36.</div>",
      "questions": [
        {
          "question": "1) Déterminer tous les diviseurs de 24.",
          "reponse": "Les diviseurs de 24 sont : 1, 2, 3, 4, 6, 8, 12, 24."
        },
        {
          "question": "2) Déterminer tous les diviseurs de 36.",
          "reponse": "Les diviseurs de 36 sont : 1, 2, 3, 4, 6, 9, 12, 18, 36."
        },
        {
          "question": "3) En déduire le PGCD de 24 et 36.",
          "reponse": "Les diviseurs communs de 24 et 36 sont : 1, 2, 3, 4, 6, 12.<br>Le plus grand d'entre eux est 12, donc <span class='math'>\\(PGCD(24;36) = 12\\)</span>."
        },
        {
          "question": "4) Calculer le PPCM de 24 et 36.",
          "reponse": "On utilise la relation : <span class='math'>\\(PPCM(24;36) = \\dfrac{24 \\times 36}{PGCD(24;36)} = \\dfrac{864}{12} = 72\\)</span>.<br>Donc <span class='math'>\\(PPCM(24;36) = 72\\)</span>."
        },
        {
          "question": "5) Un fleuriste veut repartir 24 roses et 36 tulipes dans des bouquets identiques en utilisant toutes les fleurs. Quel est le nombre maximal de bouquets qu'il peut faire ?",
          "reponse": "Le nombre maximal de bouquets est le PGCD de 24 et 36, soit 12 bouquets. Chaque bouquet contiendra alors 2 roses et 3 tulipes."
        }
      ]
    },
    {
      "titre": "Exercice 3 : Fractions",
      "points": "4 pts",
      "enonce": "<div style='background-color: #f0f4f8; padding: 15px; border-radius: 10px; color: #1e293b; font-size: 1em;'>On considère les fractions suivantes : <span class='math'>\\( \\dfrac{2}{3}, \\dfrac{4}{9}, \\dfrac{5}{6}, \\dfrac{7}{12} \\)</span></div>",
      "questions": [
        {
          "question": "1) Mettre les fractions <span class='math'>\\( \\dfrac{2}{3} \\)</span> et <span class='math'>\\( \\dfrac{5}{6} \\)</span> au même dénominateur.",
          "reponse": "Le dénominateur commun est 6.<br><span class='math'>\\( \\dfrac{2}{3} = \\dfrac{2 \\times 2}{3 \\times 2} = \\dfrac{4}{6} \\)</span><br><span class='math'>\\( \\dfrac{5}{6} = \\dfrac{5}{6} \\)</span>"
        },
        {
          "question": "2) Calculer la somme <span class='math'>\\( \\dfrac{2}{3} + \\dfrac{5}{6} \\)</span>",
          "reponse": "<span class='math'>\\( \\dfrac{2}{3} + \\dfrac{5}{6} = \\dfrac{4}{6} + \\dfrac{5}{6} = \\dfrac{9}{6} = \\dfrac{3}{2} \\)</span>"
        },
        {
          "question": "3) Calculer le produit <span class='math'>\\( \\dfrac{4}{9} \\times \\dfrac{3}{8} \\)</span>",
          "reponse": "<span class='math'>\\( \\dfrac{4}{9} \\times \\dfrac{3}{8} = \\dfrac{4 \\times 3}{9 \\times 8} = \\dfrac{12}{72} = \\dfrac{1}{6} \\)</span>"
        },
        {
          "question": "4) Simplifier la fraction <span class='math'>\\( \\dfrac{36}{48} \\)</span> pour la rendre irréductible.",
          "reponse": "<span class='math'>\\( \\dfrac{36}{48} = \\dfrac{36 \\div 12}{48 \\div 12} = \\dfrac{3}{4} \\)</span>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Nombres décimaux et relatifs",
      "points": "4 pts",
      "enonce": "<div style='background-color: #f0f4f8; padding: 15px; border-radius: 10px; color: #1e293b; font-size: 1em;'>Cet exercice porte sur les nombres décimaux arithmétiques et relatifs.</div>",
      "questions": [
        {
          "question": "1) Ranger les nombres suivants dans l'ordre croissant : <span class='math'>\\(3,2 \\; ; \\; 3,02 \\; ; \\; 3,21 \\; ; \\; 3,12\\)</span>",
          "reponse": "<span class='math'>\\(3,02 < 3,12 < 3,2 < 3,21\\)</span>"
        },
        {
          "question": "2) Donner l'écriture fractionnaire de <span class='math'>\\(2,45\\)</span>.",
          "reponse": "<span class='math'>\\(2,45 = \\dfrac{245}{100} = \\dfrac{49}{20}\\)</span>"
        },
        {
          "question": "3) Calculer : <span class='math'>\\((-5) + (-3)\\)</span>",
          "reponse": "<span class='math'>\\((-5) + (-3) = -8\\)</span>"
        },
        {
          "question": "4) Calculer : <span class='math'>\\((+7) - (-2)\\)</span>",
          "reponse": "<span class='math'>\\((+7) - (-2) = (+7) + (+2) = +9\\)</span>"
        },
        {
          "question": "5) Calculer : <span class='math'>\\((-4) \\times (-6)\\)</span>",
          "reponse": "<span class='math'>\\((-4) \\times (-6) = +24\\)</span>"
        }
      ]
    },
    {
      "titre": "Exercice 5 : Proportionnalité",
      "points": "3 pts",
      "enonce": "<div style='background-color: #f0f4f8; padding: 15px; border-radius: 10px; color: #1e293b; font-size: 1em;'>Un commerçant vend des mangues. Le tableau suivant donne le prix à payer en fonction du nombre de mangues achetées.</div>",
      "questions": [
        {
          "question": "1) Compléter le tableau de proportionnalité suivant :",
          "reponse": "<div style='overflow-x: auto;'><table style='width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden;'><thead><tr style='background: #2b6cb0; color: white;'><th style='padding: 8px; border: 1px solid #cbd5e0;'>Nombre de mangues</th><th style='padding: 8px; border: 1px solid #cbd5e0;'>2</th><th style='padding: 8px; border: 1px solid #cbd5e0;'>4</th><th style='padding: 8px; border: 1px solid #cbd5e0;'>6</th><th style='padding: 8px; border: 1px solid #cbd5e0;'>8</th><th style='padding: 8px; border: 1px solid #cbd5e0;'>10</th></tr></thead><tbody><tr><td style='padding: 8px; border: 1px solid #cbd5e0; font-weight: bold;'>Prix (FCFA)</td><td style='padding: 8px; border: 1px solid #cbd5e0; text-align: center;'>300</td><td style='padding: 8px; border: 1px solid #cbd5e0; text-align: center;'>600</td><td style='padding: 8px; border: 1px solid #cbd5e0; text-align: center;'>900</td><td style='padding: 8px; border: 1px solid #cbd5e0; text-align: center;'>1200</td><td style='padding: 8px; border: 1px solid #cbd5e0; text-align: center;'>1500</td></tr></tbody></table></div>"
        },
        {
          "question": "2) Quel est le coefficient de proportionnalité ?",
          "reponse": "Le coefficient de proportionnalité est le prix d'une mangue : <span class='math'>\\(\\dfrac{300}{2} = 150\\)</span> FCFA."
        },
        {
          "question": "3) Combien coûtent 12 mangues ?",
          "reponse": "<span class='math'>\\(12 \\times 150 = 1800\\)</span> FCFA."
        }
      ]
    },
    {
      "titre": "Exercice 6 : Géométrie",
      "points": "3 pts",
      "enonce": "<div style='background-color: #f0f4f8; padding: 15px; border-radius: 10px; color: #1e293b; font-size: 1em;'>Construire les figures suivantes avec les instruments de géométrie.</div>",
      "questions": [
        {
          "question": "1) Tracer un segment [AB] de 6 cm, puis construire sa médiatrice.",
          "reponse": "Pour construire la médiatrice de [AB] :<br>1. Tracer le segment [AB] de 6 cm.<br>2. Placer le milieu M de [AB] à 3 cm de chaque extrémité.<br>3. Tracer la droite perpendiculaire à [AB] passant par M."
        },
        {
          "question": "2) Tracer un cercle de centre O et de rayon 3 cm. Placer un point A sur ce cercle. Tracer un rayon [OA] et une corde [AB] avec B un autre point du cercle.",
          "reponse": "Pour tracer le cercle :<br>1. Placer le point O.<br>2. Ouvrir le compas de 3 cm et tracer le cercle.<br>3. Placer A sur le cercle.<br>4. Tracer [OA] (rayon).<br>5. Placer B sur le cercle et tracer [AB] (corde)."
        },
        {
          "question": "3) Construire un triangle ABC tel que AB = 5 cm, BC = 4 cm et CA = 6 cm.",
          "reponse": "Pour construire le triangle ABC :<br>1. Tracer le segment [AB] de 5 cm.<br>2. Avec le compas, prendre 6 cm et tracer un arc de cercle de centre A.<br>3. Avec le compas, prendre 4 cm et tracer un arc de cercle de centre B.<br>4. L'intersection des deux arcs donne le point C.<br>5. Tracer [AC] et [BC]."
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
