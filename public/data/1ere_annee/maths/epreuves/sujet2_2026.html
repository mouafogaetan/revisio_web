<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "mathématiques",
  "classe": "1ère année",
  "sequence": "Séquence 2",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Fractions et nombres décimaux",
      "points": "4 pts",
      "enonce": "<p>Cet exercice permet d'évaluer la maîtrise des opérations sur les fractions et les nombres décimaux, des notions essentielles pour résoudre des problèmes de partage, de mesure et de proportion.</p><div style='background-color: #f0f4f8; padding: 12px; border-radius: 8px; color: #1a202c;'><p><strong>Rappel :</strong></p><ul><li>Pour additionner ou soustraire des fractions, il faut les mettre au même dénominateur.</li><li>Pour multiplier des fractions, on multiplie les numérateurs entre eux et les dénominateurs entre eux.</li><li>Pour diviser par une fraction, on multiplie par son inverse.</li></ul></div>",
      "questions": [
        {
          "question": "1) Calculer et donner le résultat sous forme de fraction irréductible : \\( \\dfrac{2}{3} + \\dfrac{5}{6} - \\dfrac{1}{2} \\)",
          "reponse": "On met toutes les fractions au même dénominateur (6) : <br>\\( \\dfrac{2}{3} = \\dfrac{4}{6} \\), \\( \\dfrac{5}{6} = \\dfrac{5}{6} \\), \\( \\dfrac{1}{2} = \\dfrac{3}{6} \\).<br>Donc \\( \\dfrac{2}{3} + \\dfrac{5}{6} - \\dfrac{1}{2} = \\dfrac{4}{6} + \\dfrac{5}{6} - \\dfrac{3}{6} = \\dfrac{4+5-3}{6} = \\dfrac{6}{6} = 1 \\)."
        },
        {
          "question": "2) Calculer : \\( \\dfrac{3}{4} \\times \\dfrac{8}{9} \\)",
          "reponse": "On multiplie les numérateurs entre eux et les dénominateurs entre eux : <br>\\( \\dfrac{3}{4} \\times \\dfrac{8}{9} = \\dfrac{3 \\times 8}{4 \\times 9} = \\dfrac{24}{36} \\).<br>On simplifie par 12 : \\( \\dfrac{24 \\div 12}{36 \\div 12} = \\dfrac{2}{3} \\)."
        },
        {
          "question": "3) Calculer : \\( \\dfrac{5}{7} \\div \\dfrac{10}{21} \\)",
          "reponse": "Diviser par une fraction revient à multiplier par son inverse : <br>\\( \\dfrac{5}{7} \\div \\dfrac{10}{21} = \\dfrac{5}{7} \\times \\dfrac{21}{10} = \\dfrac{5 \\times 21}{7 \\times 10} = \\dfrac{105}{70} \\).<br>On simplifie par 35 : \\( \\dfrac{105 \\div 35}{70 \\div 35} = \\dfrac{3}{2} \\)."
        },
        {
          "question": "4) Calculer : 12,5 + 3,75 - 4,2",
          "reponse": "On aligne les virgules et on additionne puis on soustrait : <br>12,50 + 3,75 = 16,25<br>16,25 - 4,20 = 12,05"
        },
        {
          "question": "5) Calculer : 2,4 × 3,5",
          "reponse": "On multiplie sans les virgules : 24 × 35 = 840.<br>Il y a 2 chiffres après la virgule au total (1 dans 2,4 et 1 dans 3,5), donc on place la virgule pour avoir 2 chiffres après : 8,40 = 8,4."
        }
      ]
    },
    {
      "titre": "Exercice 2 : Nombres relatifs",
      "points": "3 pts",
      "enonce": "<p>Cet exercice porte sur les nombres relatifs, qui permettent de modéliser des situations de la vie courante comme les variations de température, les altitudes ou les gains et pertes.</p>",
      "questions": [
        {
          "question": "1) Placer sur une droite graduée les nombres suivants : -5 ; -2 ; 0 ; 3 ; 4,5",
          "reponse": "Sur une droite graduée, on place les nombres négatifs à gauche de 0 et les nombres positifs à droite de 0, dans l'ordre croissant : -5 ; -2 ; 0 ; 3 ; 4,5."
        },
        {
          "question": "2) Donner l'opposé de chacun des nombres suivants : 7 ; -3 ; 0 ; -5,2",
          "reponse": "L'opposé d'un nombre est le nombre qui a la même distance à zéro mais de signe contraire : <br>- L'opposé de 7 est -7.<br>- L'opposé de -3 est 3.<br>- L'opposé de 0 est 0.<br>- L'opposé de -5,2 est 5,2."
        },
        {
          "question": "3) Calculer : (-5) + (+8)",
          "reponse": "On soustrait les valeurs absolues : 8 - 5 = 3. Le signe du résultat est celui du nombre qui a la plus grande valeur absolue, soit +8. Donc (-5) + (+8) = +3 = 3."
        },
        {
          "question": "4) Calculer : (-12) - (-7)",
          "reponse": "Soustraire un nombre négatif revient à additionner son opposé : (-12) - (-7) = (-12) + (+7) = -5."
        },
        {
          "question": "5) Calculer : (-6) × (+4)",
          "reponse": "Le produit d'un nombre négatif et d'un nombre positif est négatif. On multiplie les valeurs absolues : 6 × 4 = 24. Donc (-6) × (+4) = -24."
        }
      ]
    },
    {
      "titre": "Exercice 3 : Proportionnalité",
      "points": "4 pts",
      "enonce": "<p>La proportionnalité est une notion fondamentale pour résoudre des problèmes de la vie courante et professionnelle : calculs de prix, de vitesses, d'échelles, de pourcentages, etc.</p>",
      "questions": [
        {
          "question": "1) Un commerçant achète 15 kg de farine pour 900 FCFA. Quel est le prix de 8 kg de cette même farine ?",
          "reponse": "On calcule le prix d'un kilogramme : 900 ÷ 15 = 60 FCFA. <br>Le prix de 8 kg est donc : 8 × 60 = 480 FCFA."
        },
        {
          "question": "2) Une voiture consomme 6 litres d'essence pour 100 km. Quelle quantité d'essence consomme-t-elle pour 250 km ?",
          "reponse": "On peut utiliser un tableau de proportionnalité : <br>Pour 100 km → 6 L<br>Pour 1 km → 6 ÷ 100 = 0,06 L<br>Pour 250 km → 250 × 0,06 = 15 L.<br>La voiture consomme 15 litres d'essence pour 250 km."
        },
        {
          "question": "3) Sur un plan, 3 cm représentent 15 m dans la réalité. Quelle est l'échelle de ce plan ?",
          "reponse": "L'échelle est le rapport entre la distance sur le plan et la distance réelle, exprimées dans la même unité. <br>15 m = 1500 cm.<br>L'échelle est donc 3/1500 = 1/500.<br>Le plan est à l'échelle 1/500."
        },
        {
          "question": "4) Un article coûte 24 000 FCFA. Il bénéficie d'une réduction de 15%. Quel est le nouveau prix de l'article ?",
          "reponse": "La réduction est de 15% de 24 000 FCFA : 24 000 × 15/100 = 24 000 × 0,15 = 3 600 FCFA.<br>Le nouveau prix est : 24 000 - 3 600 = 20 400 FCFA."
        }
      ]
    },
    {
      "titre": "Exercice 4 : Problème (Synthèse)",
      "points": "4 pts",
      "enonce": "<p>Cet exercice de synthèse mobilise les compétences sur les fractions, les nombres décimaux et la proportionnalité.</p><p><strong>Énoncé :</strong> Un père de famille veut partager une somme de 150 000 FCFA entre ses trois enfants : A, B et C. Il décide de partager cette somme proportionnellement à leurs âges : A a 12 ans, B a 15 ans et C a 18 ans.</p>",
      "questions": [
        {
          "question": "1) Quelle est la part de chaque enfant ?",
          "reponse": "La somme des âges est : 12 + 15 + 18 = 45 ans.<br>La part de A est : 150 000 × 12/45 = 150 000 × 4/15 = 40 000 FCFA.<br>La part de B est : 150 000 × 15/45 = 150 000 × 1/3 = 50 000 FCFA.<br>La part de C est : 150 000 × 18/45 = 150 000 × 2/5 = 60 000 FCFA.<br>Vérification : 40 000 + 50 000 + 60 000 = 150 000 FCFA."
        },
        {
          "question": "2) Exprimer la part de chaque enfant sous forme de fraction de la somme totale.",
          "reponse": "La part de A est 40 000/150 000 = 4/15 de la somme totale.<br>La part de B est 50 000/150 000 = 1/3 = 5/15 de la somme totale.<br>La part de C est 60 000/150 000 = 2/5 = 6/15 de la somme totale."
        },
        {
          "question": "3) Si le père de famille décide de donner 25% de la somme totale à un quatrième enfant D, quelle est la part de chacun des trois premiers enfants ?",
          "reponse": "25% de 150 000 = 37 500 FCFA pour D.<br>Il reste 150 000 - 37 500 = 112 500 FCFA à partager entre A, B et C.<br>La part de A devient : 112 500 × 4/15 = 30 000 FCFA.<br>La part de B devient : 112 500 × 5/15 = 37 500 FCFA.<br>La part de C devient : 112 500 × 6/15 = 45 000 FCFA.<br>Vérification : 30 000 + 37 500 + 45 000 + 37 500 = 150 000 FCFA."
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
