<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Physique-Chimie",
  "classe": "1ère année",
  "sequence": "Séquence 2",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : La matière, ses propriétés et transformations",
      "points": "4 pts",
      "enonce": "<div style='font-size: 1rem; line-height: 1.6;'>Cet exercice porte sur les propriétés de la matière et les transformations physiques et chimiques.</div>",
      "questions": [
        {
          "question": "<div style='display: flex; align-items: baseline; gap: 0.5rem; flex-wrap: wrap;'><span style='font-weight: bold;'>1)</span> <span>Quelle est la différence entre une transformation physique et une transformation chimique ? Donnez un exemple pour chaque.</span></div>",
          "reponse": "<div style='font-size: 0.95rem; line-height: 1.6;'><span style='font-weight: bold;'>Réponse :</span><div style='margin-top: 0.3rem;'>Une transformation physique est un changement qui n'altère pas la nature de la matière (ex : la fusion de la glace). Une transformation chimique est un changement qui produit de nouvelles substances (ex : la combustion du bois).</div></div>"
        },
        {
          "question": "<div style='display: flex; align-items: baseline; gap: 0.5rem; flex-wrap: wrap;'><span style='font-weight: bold;'>2)</span> <span>Citez trois méthodes de séparation des mélanges et précisez pour quel type de mélange (homogène ou hétérogène) chacune est utilisée.</span></div>",
          "reponse": "<div style='font-size: 0.95rem; line-height: 1.6;'><span style='font-weight: bold;'>Réponse :</span><div style='margin-top: 0.3rem;'><ul style='list-style-type: disc; margin-left: 1.2rem;'><li>Filtration : mélange hétérogène (solide-liquide).</li><li>Décantation : mélange hétérogène (liquide-liquide non miscible).</li><li>Distillation : mélange homogène (liquide-liquide miscible).</li></ul></div></div>"
        },
        {
          "question": "<div style='display: flex; align-items: baseline; gap: 0.5rem; flex-wrap: wrap;'><span style='font-weight: bold;'>3)</span> <span>Un morceau de sucre se dissout dans l'eau. S'agit-il d'une transformation physique ou chimique ? Justifiez votre réponse.</span></div>",
          "reponse": "<div style='font-size: 0.95rem; line-height: 1.6;'><span style='font-weight: bold;'>Réponse :</span><div style='margin-top: 0.3rem;'>C'est une transformation physique. Le sucre se dissout mais reste du sucre. On peut récupérer le sucre par évaporation de l'eau, ce qui prouve qu'il n'y a pas eu de transformation chimique.</div></div>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Énergie et sources d'énergie",
      "points": "4 pts",
      "enonce": "<div style='font-size: 1rem; line-height: 1.6;'>L'énergie se présente sous différentes formes et provient de diverses sources.</div>",
      "questions": [
        {
          "question": "<div style='display: flex; align-items: baseline; gap: 0.5rem; flex-wrap: wrap;'><span style='font-weight: bold;'>1)</span> <span>Donnez trois formes d'énergie et pour chacune, un exemple d'utilisation dans la vie courante.</span></div>",
          "reponse": "<div style='font-size: 0.95rem; line-height: 1.6;'><span style='font-weight: bold;'>Réponse :</span><div style='margin-top: 0.3rem;'><ul style='list-style-type: disc; margin-left: 1.2rem;'><li>Énergie électrique : éclairage.</li><li>Énergie calorifique : chauffage.</li><li>Énergie mécanique : déplacement d'un véhicule.</li></ul></div></div>"
        },
        {
          "question": "<div style='display: flex; align-items: baseline; gap: 0.5rem; flex-wrap: wrap;'><span style='font-weight: bold;'>2)</span> <span>Le cuivre est-il un conducteur ou un isolant électrique ? Citez deux matériaux isolants.</span></div>",
          "reponse": "<div style='font-size: 0.95rem; line-height: 1.6;'><span style='font-weight: bold;'>Réponse :</span><div style='margin-top: 0.3rem;'>Le cuivre est un conducteur électrique. Des exemples d'isolants sont le plastique et le verre.</div></div>"
        },
        {
          "question": "<div style='display: flex; align-items: baseline; gap: 0.5rem; flex-wrap: wrap;'><span style='font-weight: bold;'>3)</span> <span>Dans la réaction de combustion \\( C + O_2 \\rightarrow CO_2 \\), quels sont les réactifs ? Quels sont les produits ?</span></div>",
          "reponse": "<div style='font-size: 0.95rem; line-height: 1.6;'><span style='font-weight: bold;'>Réponse :</span><div style='margin-top: 0.3rem;'>Les réactifs sont le carbone (C) et le dioxygène (O₂). Le produit est le dioxyde de carbone (CO₂).</div></div>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Échanges d'énergie et électricité",
      "points": "4 pts",
      "enonce": "<div style='font-size: 1rem; line-height: 1.6;'>Les transferts d'énergie se font sous différentes formes. L'électricité est une forme d'énergie couramment utilisée.</div>",
      "questions": [
        {
          "question": "<div style='display: flex; align-items: baseline; gap: 0.5rem; flex-wrap: wrap;'><span style='font-weight: bold;'>1)</span> <span>Citez les trois modes de transfert de chaleur et donnez un exemple pour chacun.</span></div>",
          "reponse": "<div style='font-size: 0.95rem; line-height: 1.6;'><span style='font-weight: bold;'>Réponse :</span><div style='margin-top: 0.3rem;'><ul style='list-style-type: disc; margin-left: 1.2rem;'><li>Conduction : chaleur transmise par une barre de fer chauffée à une extrémité.</li><li>Convection : chaleur transmise par l'air dans une pièce chauffée par un radiateur.</li><li>Rayonnement : chaleur transmise par le Soleil.</li></ul></div></div>"
        },
        {
          "question": "<div style='display: flex; align-items: baseline; gap: 0.5rem; flex-wrap: wrap;'><span style='font-weight: bold;'>2)</span> <span>Qu'est-ce qu'un circuit électrique ? Citez trois éléments qui le composent.</span></div>",
          "reponse": "<div style='font-size: 0.95rem; line-height: 1.6;'><span style='font-weight: bold;'>Réponse :</span><div style='margin-top: 0.3rem;'>Un circuit électrique est un ensemble de composants connectés par des conducteurs permettant le passage du courant électrique. Trois éléments : un générateur (pile), des fils conducteurs, une lampe (récepteur).</div></div>"
        },
        {
          "question": "<div style='display: flex; align-items: baseline; gap: 0.5rem; flex-wrap: wrap;'><span style='font-weight: bold;'>3)</span> <span>Citez une méthode de protection contre les risques électriques.</span></div>",
          "reponse": "<div style='font-size: 0.95rem; line-height: 1.6;'><span style='font-weight: bold;'>Réponse :</span><div style='margin-top: 0.3rem;'>Une méthode est l'utilisation d'un interrupteur différentiel ou un disjoncteur qui coupe le courant en cas de fuite ou de surcharge.</div></div>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Actions mécaniques et forces",
      "points": "4 pts",
      "enonce": "<div style='font-size: 1rem; line-height: 1.6;'>Les actions mécaniques sont des interactions entre objets. Elles peuvent modifier le mouvement ou la forme des objets.</div>",
      "questions": [
        {
          "question": "<div style='display: flex; align-items: baseline; gap: 0.5rem; flex-wrap: wrap;'><span style='font-weight: bold;'>1)</span> <span>Donnez la définition d'une action mécanique.</span></div>",
          "reponse": "<div style='font-size: 0.95rem; line-height: 1.6;'><span style='font-weight: bold;'>Réponse :</span><div style='margin-top: 0.3rem;'>Une action mécanique est une action qui peut mettre un objet en mouvement, modifier son mouvement ou le déformer.</div></div>"
        },
        {
          "question": "<div style='display: flex; align-items: baseline; gap: 0.5rem; flex-wrap: wrap;'><span style='font-weight: bold;'>2)</span> <span>Citez deux effets possibles d'une action mécanique sur un objet.</span></div>",
          "reponse": "<div style='font-size: 0.95rem; line-height: 1.6;'><span style='font-weight: bold;'>Réponse :</span><div style='margin-top: 0.3rem;'>Une action mécanique peut déformer un objet (ex : écraser une canette) ou modifier son mouvement (ex : lancer une balle).</div></div>"
        }
      ]
    },
    {
      "titre": "Exercice 5 : Projets techniques",
      "points": "4 pts",
      "enonce": "<div style='font-size: 1rem; line-height: 1.6;'>Les projets techniques permettent de répondre à des besoins concrets. Ils nécessitent une planification et le choix approprié des matériaux et outils.</div>",
      "questions": [
        {
          "question": "<div style='display: flex; align-items: baseline; gap: 0.5rem; flex-wrap: wrap;'><span style='font-weight: bold;'>1)</span> <span>Qu'est-ce qu'un projet technique ? Donnez un exemple.</span></div>",
          "reponse": "<div style='font-size: 0.95rem; line-height: 1.6;'><span style='font-weight: bold;'>Réponse :</span><div style='margin-top: 0.3rem;'>Un projet technique est une démarche organisée pour réaliser un objet ou un système répondant à un besoin. Exemple : fabriquer un filtre à eau pour rendre l'eau potable.</div></div>"
        },
        {
          "question": "<div style='display: flex; align-items: baseline; gap: 0.5rem; flex-wrap: wrap;'><span style='font-weight: bold;'>2)</span> <span>Quelles sont les étapes essentielles à la réalisation d'un projet technique ?</span></div>",
          "reponse": "<div style='font-size: 0.95rem; line-height: 1.6;'><span style='font-weight: bold;'>Réponse :</span><div style='margin-top: 0.3rem;'><ul style='list-style-type: disc; margin-left: 1.2rem;'><li>Identifier le besoin.</li><li>Rechercher des solutions.</li><li>Choisir le matériel et les outils.</li><li>Réaliser le projet.</li><li>Évaluer le résultat.</li></ul></div></div>"
        },
        {
          "question": "<div style='display: flex; align-items: baseline; gap: 0.5rem; flex-wrap: wrap;'><span style='font-weight: bold;'>3)</span> <span>Pourquoi est-il important de bien choisir les outils pour un projet technique ?</span></div>",
          "reponse": "<div style='font-size: 0.95rem; line-height: 1.6;'><span style='font-weight: bold;'>Réponse :</span><div style='margin-top: 0.3rem;'>Le choix des outils est important car il garantit la qualité du travail, la sécurité de l'opérateur et l'efficacité de la réalisation du projet.</div></div>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
