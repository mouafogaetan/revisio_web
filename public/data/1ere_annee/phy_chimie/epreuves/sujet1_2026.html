<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
 "matiere": "Physique-Chimie",
 "classe": "1ère année",
 "sequence": "Séquence 1",
 "anneeScolaire": "2025-2026",
 "exercices": [
   {
     "titre": "Exercice 1 : La matière et ses propriétés",
     "points": "4 pts",
     "enonce": "<p>Cet exercice porte sur les propriétés et les caractéristiques de la matière.</p>",
     "questions": [
       {
         "question": "<p><strong>1.1</strong> (2 pts) Définis la matière et donne un exemple de corps à l'état solide, liquide et gazeux.</p>",
         "reponse": "<p><strong>Solution :</strong></p><p>La <strong>matière</strong> est tout ce qui a une masse et occupe un volume.</p><ul><li><strong>État solide :</strong> une pierre, du bois, de la glace</li><li><strong>État liquide :</strong> l'eau, l'huile, le lait</li><li><strong>État gazeux :</strong> l'air, la vapeur d'eau, le dioxygène</li></ul>"
       },
       {
         "question": "<p><strong>1.2</strong> (2 pts) Explique la différence entre la perméabilité et l'imperméabilité. Donne un exemple pour chaque cas.</p>",
         "reponse": "<p><strong>Solution :</strong></p><ul><li>La <strong>perméabilité</strong> est la capacité d'un matériau à laisser passer un fluide (liquide ou gaz). <strong>Exemple :</strong> un tissu poreux laisse passer l'eau.</li><li>L'<strong>imperméabilité</strong> est la capacité d'un matériau à empêcher le passage d'un fluide. <strong>Exemple :</strong> un imperméable en plastique empêche la pluie de traverser.</li></ul>"
       }
     ]
   },
   {
     "titre": "Exercice 2 : Masse, volume et température",
     "points": "3 pts",
     "enonce": "<p>Un élève mesure la masse et le volume d'un objet en métal.</p>",
     "questions": [
       {
         "question": "<p><strong>2.1</strong> (1 pt) Il trouve une masse de 250 g. Exprime cette masse en kilogrammes.</p>",
         "reponse": "<p><strong>Solution :</strong></p><p>1 kg = 1000 g. Donc 250 g = 0,250 kg.</p><p>La masse est de <strong>0,250 kg</strong>.</p>"
       },
       {
         "question": "<p><strong>2.2</strong> (1 pt) Le volume de l'objet est de 50 cm³. Convertis ce volume en litres.</p>",
         "reponse": "<p><strong>Solution :</strong></p><p>1 L = 1000 cm³. Donc 50 cm³ = 0,050 L.</p><p>Le volume est de <strong>0,050 L</strong>.</p>"
       },
       {
         "question": "<p><strong>2.3</strong> (1 pt) L'objet est chauffé et sa température atteint 80°C. Quelle est cette température en degrés Fahrenheit ? (Formule : °F = °C × 9/5 + 32)</p>",
         "reponse": "<p><strong>Solution :</strong></p><p>°F = 80 × 9/5 + 32 = 80 × 1,8 + 32 = 144 + 32 = 176°F.</p><p>La température est de <strong>176°F</strong>.</p>"
       }
     ]
   },
   {
     "titre": "Exercice 3 : Acidité et basicité",
     "points": "3 pts",
     "enonce": "<p>On dispose de trois liquides : le jus de citron, l'eau pure et une solution d'eau de Javel.</p>",
     "questions": [
       {
         "question": "<p><strong>3.1</strong> (2 pts) En utilisant du papier pH, on obtient les couleurs suivantes : rouge, vert et bleu. Associe chaque liquide à la couleur correspondante. Justifie.</p>",
         "reponse": "<p><strong>Solution :</strong></p><ul><li><strong>Jus de citron :</strong> couleur <strong>rouge</strong> (pH acide &lt; 7)</li><li><strong>Eau pure :</strong> couleur <strong>verte</strong> (pH neutre = 7)</li><li><strong>Eau de Javel :</strong> couleur <strong>bleue</strong> (pH basique &gt; 7)</li></ul>"
       },
       {
         "question": "<p><strong>3.2</strong> (1 pt) Quel est le pH de l'eau pure ?</p>",
         "reponse": "<p><strong>Solution :</strong></p><p>Le pH de l'eau pure est de <strong>7</strong>.</p>"
       }
     ]
   },
   {
     "titre": "Exercice 4 : Énergie et combustion",
     "points": "5 pts",
     "enonce": "<p>On réalise la combustion complète du méthane (CH₄) dans le dioxygène (O₂). L'équation-bilan de cette combustion est :</p><p style='text-align:center;'><strong>CH₄ + 2 O₂ → CO₂ + 2 H₂O</strong></p>",
     "questions": [
       {
         "question": "<p><strong>4.1</strong> (1 pt) Identifie les réactifs et les produits de cette réaction.</p>",
         "reponse": "<p><strong>Solution :</strong></p><ul><li><strong>Réactifs :</strong> le méthane (CH₄) et le dioxygène (O₂).</li><li><strong>Produits :</strong> le dioxyde de carbone (CO₂) et l'eau (H₂O).</li></ul>"
       },
       {
         "question": "<p><strong>4.2</strong> (1 pt) Cette combustion est-elle une transformation physique ou chimique ? Justifie.</p>",
         "reponse": "<p><strong>Solution :</strong></p><p>C'est une <strong>transformation chimique</strong> car de nouvelles substances (CO₂ et H₂O) se forment à partir des réactifs (CH₄ et O₂).</p>"
       },
       {
         "question": "<p><strong>4.3</strong> (1 pt) Quelle forme d'énergie est libérée lors de cette combustion ?</p>",
         "reponse": "<p><strong>Solution :</strong></p><p>La combustion libère de l'<strong>énergie calorifique (chaleur)</strong>.</p>"
       },
       {
         "question": "<p><strong>4.4</strong> (2 pts) Le méthane est une source d'énergie. Cite deux autres sources d'énergie et précise si elles sont renouvelables ou non renouvelables.</p>",
         "reponse": "<p><strong>Solution :</strong></p><ul><li><strong>Énergie solaire :</strong> source d'énergie renouvelable.</li><li><strong>Pétrole :</strong> source d'énergie non renouvelable.</li><li><strong>Énergie éolienne :</strong> source d'énergie renouvelable.</li><li><strong>Charbon :</strong> source d'énergie non renouvelable.</li></ul>"
       }
     ]
   },
   {
     "titre": "Exercice 5 : Actions mécaniques",
     "points": "5 pts",
     "enonce": "<p>Un ouvrier pousse une caisse de 40 kg sur un sol horizontal. La caisse se déplace à vitesse constante. On donne g = 10 N/kg.</p>",
     "questions": [
       {
         "question": "<p><strong>5.1</strong> (1 pt) Calcule le poids de la caisse.</p>",
         "reponse": "<p><strong>Solution :</strong></p><p>P = m × g = 40 × 10 = <strong>400 N</strong>.</p>"
       },
       {
         "question": "<p><strong>5.2</strong> (1 pt) Quelles sont les forces qui s'exercent sur la caisse ? Donne leur direction et leur sens.</p>",
         "reponse": "<p><strong>Solution :</strong></p><ul><li><strong>Poids (P) :</strong> vertical, dirigé vers le bas.</li><li><strong>Réaction du sol (R) :</strong> verticale, dirigée vers le haut.</li><li><strong>Force de poussée (F) :</strong> horizontale, dans le sens du mouvement.</li><li><strong>Force de frottement (f) :</strong> horizontale, opposée au mouvement.</li></ul>"
       },
       {
         "question": "<p><strong>5.3</strong> (1 pt) Sachant que la caisse se déplace à vitesse constante, que peut-on dire de la force de poussée et de la force de frottement ?</p>",
         "reponse": "<p><strong>Solution :</strong></p><p>Comme la vitesse est constante, la force de poussée et la force de frottement se compensent : elles ont la <strong>même valeur</strong> et des sens <strong>opposés</strong>.</p>"
       },
       {
         "question": "<p><strong>5.4</strong> (2 pts) Représente ces forces sur un schéma en utilisant une échelle de 1 cm pour 100 N.</p>",
         "reponse": "<p><strong>Solution :</strong></p><p>On représente la caisse par un point (son centre de gravité).</p><ul><li>Le poids <strong>P</strong> : 400 N → flèche de 4 cm vers le bas.</li><li>La réaction <strong>R</strong> : 400 N → flèche de 4 cm vers le haut.</li><li>La poussée <strong>F</strong> : par exemple 200 N → flèche de 2 cm vers la droite.</li><li>Le frottement <strong>f</strong> : 200 N → flèche de 2 cm vers la gauche.</li></ul><p>Sur le schéma, les forces verticales se compensent et les forces horizontales se compensent.</p>"
       }
     ]
   }
 ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
