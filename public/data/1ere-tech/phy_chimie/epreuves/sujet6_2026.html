<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
 "matiere": "Physique-Chimie",
 "classe": "1ère technique",
 "sequence": "Séquence 6",
 "anneeScolaire": "2025-2026",
 "exercices": [
   {
     "titre": "Exercice 1 : Travail d'une force",
     "points": "4 pts",
     "enonce": "<p>Un tracteur tire une remorque sur une route horizontale avec une force constante \\( \\vec{F} \\) de valeur 2000 N. Le déplacement de la remorque est de 150 m et la force \\( \\vec{F} \\) fait un angle de 30° avec la direction du mouvement.</p><p>On donne : cos 30° = 0,87 ; g = 10 N/kg</p>",
     "questions": [
       {
         "question": "<p><strong>1.1</strong> (2 pts) Calcule le travail de la force \\( \\vec{F} \\) lors de ce déplacement.</p>",
         "reponse": "<p><strong>Solution :</strong></p><p>Le travail d'une force constante en translation est donné par :</p><div class='math-block'><div class='math'>$$ W(\\vec{F}) = \\vec{F} \\cdot \\overrightarrow{AB} = F \\times AB \\times \\cos\\alpha $$</div></div><p>Ici, \\( F = 2000\\,N \\), \\( AB = 150\\,m \\) et \\( \\alpha = 30° \\).</p><p><span class='math'>\\( W(\\vec{F}) = 2000 \\times 150 \\times \\cos 30° = 300\\,000 \\times 0,87 = 261\\,000\\,J \\)</span></p><p>Le travail est moteur car la force favorise le déplacement.</p>"
       },
       {
         "question": "<p><strong>1.2</strong> (2 pts) La force de frottement entre la remorque et le sol a une valeur constante de 500 N. Calcule le travail de la force de frottement. Que peut-on dire de ce travail ?</p>",
         "reponse": "<p><strong>Solution :</strong></p><p>La force de frottement s'oppose au mouvement, donc l'angle entre \\( \\vec{f} \\) et le déplacement est de 180° (cos 180° = -1).</p><p><span class='math'>\\( W(\\vec{f}) = f \\times AB \\times \\cos 180° = -f \\times AB = -500 \\times 150 = -75\\,000\\,J \\)</span></p><p>Le travail est <strong>résistant</strong> (négatif) car la force s'oppose au mouvement.</p>"
       }
     ]
   },
   {
     "titre": "Exercice 2 : Énergie cinétique et théorème",
     "points": "5 pts",
     "enonce": "<p>Un véhicule de masse 800 kg roule à la vitesse de 72 km/h sur une route horizontale. Le conducteur freine et s'arrête sur une distance de 40 m.</p><p>On donne : g = 10 N/kg</p>",
     "questions": [
       {
         "question": "<p><strong>2.1</strong> (1,5 pts) Calcule l'énergie cinétique initiale du véhicule.</p>",
         "reponse": "<p><strong>Solution :</strong></p><p>La vitesse en m/s : <span class='math'>\\( v = 72\\,km/h = 72 \\times \\dfrac{1000}{3600} = 20\\,m/s \\)</span></p><div class='math-block'><div class='math'>$$ E_c = \\dfrac{1}{2}mv^2 = \\dfrac{1}{2} \\times 800 \\times 20^2 = 400 \\times 400 = 160\\,000\\,J $$</div></div><p>L'énergie cinétique initiale est de <strong>160 kJ</strong>.</p>"
       },
       {
         "question": "<p><strong>2.2</strong> (1,5 pts) Applique le théorème de l'énergie cinétique pour déterminer le travail des forces de frottement lors du freinage.</p>",
         "reponse": "<p><strong>Solution :</strong></p><div class='math-block'><div class='math'>$$ \\Delta E_c = \\sum W(\\vec{F}) $$</div></div><p><span class='math'>\\( \\Delta E_c = E_c(finale) - E_c(initiale) = 0 - 160\\,000 = -160\\,000\\,J \\)</span></p><p>Les forces qui travaillent sont : le poids (travail nul car perpendiculaire au mouvement) et la réaction du sol (travail nul pour la même raison), et les forces de frottement.</p><p>Donc <span class='math'>\\( W(\\vec{f}) = -160\\,000\\,J \\)</span></p>"
       },
       {
         "question": "<p><strong>2.3</strong> (2 pts) En déduire la valeur de la force de frottement (supposée constante) lors du freinage.</p>",
         "reponse": "<p><strong>Solution :</strong></p><p>Le travail d'une force constante est : <span class='math'>\\( W(\\vec{f}) = -f \\times d \\)</span></p><p>D'où : <span class='math'>\\( -f \\times 40 = -160\\,000 \\)</span></p><p><span class='math'>\\( f = \\dfrac{160\\,000}{40} = 4\\,000\\,N \\)</span></p><p>La force de frottement a pour valeur <strong>4 000 N</strong>.</p>"
       }
     ]
   },
   {
     "titre": "Exercice 3 : Lentille convergente",
     "points": "6 pts",
     "enonce": "<p>On place un objet lumineux AB de hauteur 2 cm devant une lentille convergente de distance focale \\( f' = 10\\,cm \\). L'objet est placé à 15 cm de la lentille.</p>",
     "questions": [
       {
         "question": "<p><strong>3.1</strong> (2 pts) Schématise la lentille, l'objet et les foyers. Indique sur le schéma la position de l'objet par rapport aux foyers.</p>",
         "reponse": "<p><strong>Solution :</strong></p><p>Schéma à réaliser par l'élève :</p><ul><li>Lentille convergente représentée par une double flèche</li><li>Centre optique O</li><li>Foyers F et F' situés à 10 cm de O</li><li>Objet AB placé à gauche de la lentille, entre F (le foyer objet) et 2F</li></ul>"
       },
       {
         "question": "<p><strong>3.2</strong> (2 pts) Construis graphiquement l'image A'B' de l'objet AB à travers cette lentille.</p>",
         "reponse": "<p><strong>Solution :</strong></p><p>Construction à réaliser par l'élève :</p><ul><li>Rayon passant par le centre optique : non dévié</li><li>Rayon parallèle à l'axe optique : émerge en passant par le foyer image F'</li><li>Rayon passant par le foyer objet F : émerge parallèlement à l'axe optique</li></ul><p>L'image A'B' est réelle, renversée et plus grande que l'objet.</p>"
       },
       {
         "question": "<p><strong>3.3</strong> (2 pts) En utilisant les relations de conjugaison, calcule la position de l'image et sa taille.</p>",
         "reponse": "<p><strong>Solution :</strong></p><p>On donne <span class='math'>\\( \\overline{OA} = -15\\,cm \\)</span> (car l'objet est à gauche de la lentille) et <span class='math'>\\( f' = 10\\,cm \\)</span>.</p><p>Relation de Descartes :</p><div class='math-block'><div class='math'>$$ \\dfrac{1}{\\overline{OA'}} - \\dfrac{1}{\\overline{OA}} = \\dfrac{1}{f'} $$</div></div><p><span class='math'>\\( \\dfrac{1}{\\overline{OA'}} = \\dfrac{1}{f'} + \\dfrac{1}{\\overline{OA}} = \\dfrac{1}{10} + \\dfrac{1}{-15} = \\dfrac{3 - 2}{30} = \\dfrac{1}{30} \\)</span></p><p><span class='math'>\\( \\overline{OA'} = 30\\,cm \\)</span></p><p>Grandissement : <span class='math'>\\( \\gamma = \\dfrac{\\overline{OA'}}{\\overline{OA}} = \\dfrac{30}{-15} = -2 \\)</span></p><p>Donc <span class='math'>\\( \\overline{A'B'} = \\gamma \\times \\overline{AB} = -2 \\times 2 = -4\\,cm \\)</span></p><p>L'image est à <strong>30 cm</strong> de la lentille, <strong>4 cm</strong> de hauteur, réelle et renversée.</p>"
       }
     ]
   },
   {
     "titre": "Exercice 4 : Circuit électrique et lois des réseaux",
     "points": "5 pts",
     "enonce": "<p>Dans le circuit suivant, on donne : <span class='math'>\\( E_1 = 12\\,V \\)</span>, <span class='math'>\\( E_2 = 6\\,V \\)</span>, <span class='math'>\\( R_1 = 10\\,\\Omega \\)</span>, <span class='math'>\\( R_2 = 20\\,\\Omega \\)</span> et <span class='math'>\\( R_3 = 30\\,\\Omega \\)</span>.</p><p>Les générateurs sont parfaits (résistance interne nulle).</p>",
     "questions": [
       {
         "question": "<p><strong>4.1</strong> (1 pt) Schématise le circuit avec une source de tension équivalente et une résistance équivalente aux trois résistances.</p>",
         "reponse": "<p><strong>Solution :</strong></p><p>Les trois résistances sont en série, donc :</p><p><span class='math'>\\( R_{eq} = R_1 + R_2 + R_3 = 10 + 20 + 30 = 60\\,\\Omega \\)</span></p><p>Les deux générateurs sont en série mais en opposition, donc :</p><p><span class='math'>\\( E_{eq} = E_1 - E_2 = 12 - 6 = 6\\,V \\)</span></p>"
       },
       {
         "question": "<p><strong>4.2</strong> (2 pts) Calcule l'intensité du courant qui circule dans le circuit.</p>",
         "reponse": "<p><strong>Solution :</strong></p><p>D'après la loi d'Ohm :</p><p><span class='math'>\\( I = \\dfrac{E_{eq}}{R_{eq}} = \\dfrac{6}{60} = 0,1\\,A = 100\\,mA \\)</span></p><p>L'intensité du courant est de <strong>0,1 A</strong>.</p>"
       },
       {
         "question": "<p><strong>4.3</strong> (2 pts) Calcule la tension aux bornes de chaque résistance.</p>",
         "reponse": "<p><strong>Solution :</strong></p><p>D'après la loi d'Ohm <span class='math'>\\( U = R \\times I \\)</span> :</p><ul><li><span class='math'>\\( U_1 = R_1 \\times I = 10 \\times 0,1 = 1\\,V \\)</span></li><li><span class='math'>\\( U_2 = R_2 \\times I = 20 \\times 0,1 = 2\\,V \\)</span></li><li><span class='math'>\\( U_3 = R_3 \\times I = 30 \\times 0,1 = 3\\,V \\)</span></li></ul><p>Vérification : <span class='math'>\\( U_1 + U_2 + U_3 = 1 + 2 + 3 = 6\\,V = E_{eq} \\)</span></p><p>La loi des mailles est bien vérifiée.</p>"
       }
     ]
   }
 ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
