<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
 "matiere": "Physique-Chimie",
 "classe": "1ère technique",
 "sequence": "Séquence 2",
 "anneeScolaire": "2025-2026",
 "exercices": [
   {
     "titre": "Exercice 1 : Travail d'une force en translation",
     "points": "4 pts",
     "enonce": "<p>Un ouvrier du bâtiment à Douala pousse une caisse de matériaux sur une distance de 8 mètres. Il exerce une force constante \\( \\vec{F} \\) d'intensité 150 N, inclinée d'un angle de 30° par rapport au sol horizontal.</p><p>On rappelle que le travail d'une force constante \\( \\vec{F} \\) lors d'un déplacement rectiligne \\( \\vec{AB} \\) est donné par :</p><div class='math-block'><div class='math'>$$ W = \\vec{F} \\cdot \\vec{AB} = F \\times AB \\times \\cos(\\theta) $$</div></div>",
     "questions": [
       {
         "question": "<p><strong>1.1</strong> (1.5 pt) Calculer le travail effectué par l'ouvrier sur la caisse.</p>",
         "reponse": "<p><strong>Solution :</strong></p><p>On applique la formule : \\( W = F \\times AB \\times \\cos(\\theta) \\)</p><p>\\( W = 150 \\times 8 \\times \\cos(30°) \\)</p><p>\\( W = 1200 \\times \\frac{\\sqrt{3}}{2} \\approx 1039,2 \\, J \\)</p><p>Le travail effectué par l'ouvrier est d'environ \\( 1039 \\, J \\).</p>"
       },
       {
         "question": "<p><strong>1.2</strong> (1.5 pt) Ce travail est-il moteur ou résistant ? Justifier votre réponse.</p>",
         "reponse": "<p><strong>Solution :</strong></p><p>Le travail est <strong>moteur</strong> car la force exercée par l'ouvrier favorise le déplacement de la caisse. L'angle entre la force et le déplacement est inférieur à 90°, donc \\( \\cos(\\theta) > 0 \\), ce qui donne un travail positif.</p>"
       },
       {
         "question": "<p><strong>1.3</strong> (1 pt) Si la force était perpendiculaire au déplacement, quel serait le travail effectué ? Justifier.</p>",
         "reponse": "<p><strong>Solution :</strong></p><p>Si la force est perpendiculaire au déplacement, l'angle \\( \\theta = 90° \\), donc \\( \\cos(90°) = 0 \\). Le travail serait nul : \\( W = 0 \\, J \\). Une force perpendiculaire au déplacement ne travaille pas.</p>"
       }
     ]
   },
   {
     "titre": "Exercice 2 : Énergie cinétique et théorème de l'énergie cinétique",
     "points": "5 pts",
     "enonce": "<p>Un camion de masse \\( m = 3000 \\, kg \\) roule à une vitesse de \\( 72 \\, km/h \\) sur une route nationale au Cameroun.</p><p>On rappelle que l'énergie cinétique de translation est donnée par :</p><div class='math-block'><div class='math'>$$ E_c = \\frac{1}{2} m v^2 $$</div></div>",
     "questions": [
       {
         "question": "<p><strong>2.1</strong> (1 pt) Convertir la vitesse en \\( m/s \\).</p>",
         "reponse": "<p><strong>Solution :</strong></p><p>\\( v = 72 \\, km/h = \\frac{72}{3,6} = 20 \\, m/s \\).</p>"
       },
       {
         "question": "<p><strong>2.2</strong> (1.5 pt) Calculer l'énergie cinétique du camion.</p>",
         "reponse": "<p><strong>Solution :</strong></p><p>\\( E_c = \\frac{1}{2} \\times 3000 \\times 20^2 = 1500 \\times 400 = 600\\,000 \\, J \\)</p><p>L'énergie cinétique du camion est de \\( 600 \\, kJ \\).</p>"
       },
       {
         "question": "<p><strong>2.3</strong> (2.5 pt) Le camion freine et s'arrête sur une distance de 50 mètres. En utilisant le théorème de l'énergie cinétique, déterminer l'intensité de la force de freinage supposée constante.</p>",
         "reponse": "<p><strong>Solution :</strong></p><p>Le théorème de l'énergie cinétique s'écrit : \\( \\Delta E_c = \\sum W(\\vec{F}) \\).</p><p>La variation d'énergie cinétique est : \\( \\Delta E_c = 0 - 600\\,000 = -600\\,000 \\, J \\).</p><p>Le travail de la force de freinage est : \\( W = F \\times d \\times \\cos(180°) = -F \\times d \\).</p><p>On a donc : \\( -600\\,000 = -F \\times 50 \\)</p><p>\\( F = \\frac{600\\,000}{50} = 12\\,000 \\, N \\).</p><p>La force de freinage a une intensité de \\( 12\\,000 \\, N \\).</p>"
       }
     ]
   },
   {
     "titre": "Exercice 3 : Conservation de l'énergie mécanique",
     "points": "5 pts",
     "enonce": "<p>Un skateur de masse \\( m = 60 \\, kg \\) descend une piste sans frottement. Il part du point A situé à une hauteur \\( h_A = 5 \\, m \\) par rapport au sol, avec une vitesse initiale nulle. Il passe par le point B situé à une hauteur \\( h_B = 2 \\, m \\).</p><p>On prendra \\( g = 10 \\, N/kg \\).</p>",
     "questions": [
       {
         "question": "<p><strong>3.1</strong> (1 pt) Calculer l'énergie mécanique du skateur au point A.</p>",
         "reponse": "<p><strong>Solution :</strong></p><p>Au point A, la vitesse est nulle, donc \\( E_c(A) = 0 \\).</p><p>L'énergie potentielle de pesanteur est : \\( E_{pp}(A) = m g h_A = 60 \\times 10 \\times 5 = 3000 \\, J \\).</p><p>L'énergie mécanique est : \\( E_m(A) = E_c(A) + E_{pp}(A) = 3000 \\, J \\).</p>"
       },
       {
         "question": "<p><strong>3.2</strong> (1.5 pt) En appliquant le principe de conservation de l'énergie mécanique, déterminer la vitesse du skateur au point B.</p>",
         "reponse": "<p><strong>Solution :</strong></p><p>D'après le principe de conservation de l'énergie mécanique (pas de frottement) : \\( E_m(B) = E_m(A) \\).</p><p>\\( E_c(B) + E_{pp}(B) = 3000 \\)</p><p>\\( \\frac{1}{2} m v_B^2 + m g h_B = 3000 \\)</p><p>\\( \\frac{1}{2} \\times 60 \\times v_B^2 + 60 \\times 10 \\times 2 = 3000 \\)</p><p>\\( 30 v_B^2 + 1200 = 3000 \\)</p><p>\\( 30 v_B^2 = 1800 \\)</p><p>\\( v_B^2 = 60 \\)</p><p>\\( v_B = \\sqrt{60} \\approx 7,75 \\, m/s \\).</p>"
       },
       {
         "question": "<p><strong>3.3</strong> (1.5 pt) Si la piste n'était pas lisse, l'énergie mécanique serait-elle conservée ? Justifier.</p>",
         "reponse": "<p><strong>Solution :</strong></p><p>Non, l'énergie mécanique ne serait pas conservée s'il y avait des frottements. Une partie de l'énergie mécanique serait dissipée sous forme de chaleur. L'énergie mécanique diminuerait donc au cours du mouvement.</p>"
       },
       {
         "question": "<p><strong>3.4</strong> (1 pt) Quelle est l'énergie cinétique du skateur au point B ?</p>",
         "reponse": "<p><strong>Solution :</strong></p><p>\\( E_c(B) = \\frac{1}{2} m v_B^2 = 30 \\times 60 = 1800 \\, J \\).</p><p>L'énergie cinétique au point B est de \\( 1800 \\, J \\).</p>"
       }
     ]
   },
   {
     "titre": "Exercice 4 : Lentilles minces convergentes",
     "points": "6 pts",
     "enonce": "<p>Un objet lumineux est placé à 20 cm devant une lentille mince convergente de distance focale 10 cm.</p><p>On rappelle la relation de Descartes :</p><div class='math-block'><div class='math'>$$ \\frac{1}{f} = \\frac{1}{\\overline{OA'}} - \\frac{1}{\\overline{OA}} $$</div></div><p>et la relation de grandissement :</p><div class='math-block'><div class='math'>$$ \\gamma = \\frac{\\overline{OA'}}{\\overline{OA}} $$</div></div>",
     "questions": [
       {
         "question": "<p><strong>4.1</strong> (1.5 pt) Déterminer la position de l'image \\( \\overline{OA'} \\).</p>",
         "reponse": "<p><strong>Solution :</strong></p><p>On a \\( f = 10 \\, cm \\) et \\( \\overline{OA} = -20 \\, cm \\) (l'objet est placé devant la lentille).</p><p>Relation de Descartes : \\( \\frac{1}{10} = \\frac{1}{\\overline{OA'}} - \\frac{1}{-20} = \\frac{1}{\\overline{OA'}} + \\frac{1}{20} \\)</p><p>\\( \\frac{1}{\\overline{OA'}} = \\frac{1}{10} - \\frac{1}{20} = \\frac{2 - 1}{20} = \\frac{1}{20} \\)</p><p>Donc \\( \\overline{OA'} = 20 \\, cm \\).</p><p>L'image se forme à 20 cm derrière la lentille.</p>"
       },
       {
         "question": "<p><strong>4.2</strong> (1.5 pt) Calculer le grandissement \\( \\gamma \\) et caractériser l'image.</p>",
         "reponse": "<p><strong>Solution :</strong></p><p>\\( \\gamma = \\frac{\\overline{OA'}}{\\overline{OA}} = \\frac{20}{-20} = -1 \\).</p><p>Le grandissement est négatif, donc l'image est <strong>renversée</strong>. Sa taille est égale à celle de l'objet (|\\gamma| = 1).</p><p>L'image est <strong>réelle</strong> car \\( \\overline{OA'} > 0 \\).</p>"
       },
       {
         "question": "<p><strong>4.3</strong> (1.5 pt) Où faudrait-il placer l'objet pour que l'image soit virtuelle, droite et plus grande que l'objet ?</p>",
         "reponse": "<p><strong>Solution :</strong></p><p>Pour obtenir une image virtuelle, droite et plus grande que l'objet avec une lentille convergente, il faut que l'objet soit placé <strong>entre le centre optique et le foyer objet</strong>, c'est-à-dire que \\( 0 < \\overline{OA} < f \\).</p>"
       },
       {
         "question": "<p><strong>4.4</strong> (1.5 pt) Proposer une application pratique de ce cas (objet entre le centre optique et le foyer).</p>",
         "reponse": "<p><strong>Solution :</strong></p><p>Cette configuration correspond au fonctionnement d'une <strong>loupe</strong> ou d'un <strong>verre grossissant</strong>. L'image est virtuelle, droite et agrandie, ce qui permet d'observer des détails d'un objet.</p>"
       }
     ]
   }
 ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
