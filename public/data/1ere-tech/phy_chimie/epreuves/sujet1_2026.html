<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Physique-Chimie",
  "classe": "1ère technique",
  "sequence": "Séquence 1",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Évaluation des acquis sur les composants électroniques (Ressources)",
      "points": "6 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; line-height: 1.6; color: #333;'><p style='text-align: justify;'>Cet exercice permet de vérifier la maîtrise des notions fondamentales sur les composants électroniques simples, comme vus dans la leçon 10. Il est composé de questions de cours et d'identification.</p></div>",
      "questions": [
        {
          "question": "<p style='font-weight: bold;'>1) Identifier et décrire le rôle de deux composants électroniques simples (parmi la résistance, le condensateur, la diode et le transistor).</p>",
          "reponse": "<div style='background-color: #f0f8ff; padding: 10px; border-radius: 5px; color: #000;'><p><strong>Réponse :</strong></p><ul style='list-style-type: disc;'><li><strong>Résistance :</strong> Un composant qui s'oppose au passage du courant électrique. Son rôle est de limiter l'intensité du courant dans un circuit.</li><li><strong>Condensateur :</strong> Un composant qui peut stocker des charges électriques. Son rôle est de lisser une tension ou de filtrer un signal.</li><li><strong>Diode :</strong> Un composant qui ne laisse passer le courant que dans un seul sens. Son rôle est de redresser un courant alternatif ou de protéger un circuit contre une inversion de polarité.</li><li><strong>Transistor :</strong> Un composant qui peut amplifier un signal ou agir comme un interrupteur commandé. Son rôle est de commuter ou d'amplifier des signaux électriques.</li></ul><p><em>(Seulement deux composants sont demandés à l'élève).</em></p></div>"
        },
        {
          "question": "<p style='font-weight: bold;'>2) Expliquer la différence entre une résistance et une diode en termes de fonctionnement.</p>",
          "reponse": "<div style='background-color: #f0f8ff; padding: 10px; border-radius: 5px; color: #000;'><p><strong>Réponse :</strong> Une résistance est un composant passif linéaire qui obéit à la loi d'Ohm (<span class='math'>\\(U = R \\times I\\)</span>) et dont la caractéristique est symétrique. Une diode est un composant non-linéaire qui ne conduit le courant que dans un seul sens (sens passant). Dans le sens inverse, elle se comporte comme un interrupteur ouvert (sauf à la tension de claquage).</p></div>"
        },
        {
          "question": "<p style='font-weight: bold;'>3) Citer l'unité de mesure de la résistance électrique et celle de la capacité d'un condensateur.</p>",
          "reponse": "<div style='background-color: #f0f8ff; padding: 10px; border-radius: 5px; color: #000;'><p><strong>Réponse :</strong> L'unité de la résistance est l'Ohm (noté <span class='math'>\\(\\Omega\\)</span>). L'unité de la capacité est le Farad (noté <span class='math'>\\(F\\)</span>).</p></div>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Application des connaissances sur un circuit simple (Compétences)",
      "points": "7 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; line-height: 1.6; color: #333;'><p style='text-align: justify;'>Le montage ci-dessous représente un circuit électronique simple. Un générateur délivrant une tension continue <span class='math'>\\(U = 12\\, V\\)</span> alimente une résistance <span class='math'>\\(R = 100\\, \\Omega\\)</span> et une diode en série.</p><div style='background-color: #f4f4f4; padding: 15px; border-radius: 8px; text-align: center; margin: 10px 0;'><img alt='Schéma d un circuit simple avec une source de tension continue 12V, une diode et une résistance de 100Ω en série. Le sens conventionnel du courant est indiqué de la borne positive vers la borne négative.' src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22300%22 height=%22150%22%3E%3Crect width=%22300%22 height=%22150%22 fill=%22%23f4f4f4%22/%3E%3Cline x1=%2250%22 y1=%2230%22 x2=%2250%22 y2=%22120%22 stroke=%22black%22 stroke-width=%222%22/%3E%3Cline x1=%2250%22 y1=%2230%22 x2=%22250%22 y2=%2230%22 stroke=%22black%22 stroke-width=%222%22/%3E%3Cline x1=%22250%22 y1=%2230%22 x2=%22250%22 y2=%2260%22 stroke=%22black%22 stroke-width=%222%22/%3E%3Cpolygon points=%22240,60 250,50 260,60%22 fill=%22black%22/%3E%3Cline x1=%22240%22 y1=%2260%22 x2=%22260%22 y2=%2260%22 stroke=%22black%22 stroke-width=%222%22/%3E%3Crect x=%22230%22 y=%2270%22 width=%2240%22 height=%2230%22 stroke=%22black%22 stroke-width=%222%22 fill=%22white%22/%3E%3Ctext x=%22235%22 y=%2290%22 font-size=%2212%22 fill=%22black%22 font-family=%22Arial%22%3ER%3C/text%3E%3Cline x1=%22250%22 y1=%22100%22 x2=%22250%22 y2=%22120%22 stroke=%22black%22 stroke-width=%222%22/%3E%3Cline x1=%2250%22 y1=%22120%22 x2=%22250%22 y2=%22120%22 stroke=%22black%22 stroke-width=%222%22/%3E%3Ctext x=%2240%22 y=%2220%22 font-size=%2214%22 fill=%22black%22 font-family=%22Arial%22%3E%2B%3C/text%3E%3Ctext x=%2240%22 y=%22140%22 font-size=%2214%22 fill=%22black%22 font-family=%22Arial%22%3E-%3C/text%3E%3Ctext x=%22120%22 y=%22140%22 font-size=%2214%22 fill=%22black%22 font-family=%22Arial%22%3EU = 12 V%3C/text%3E%3C/svg%3E' style='max-width: 100%; height: auto; border-radius: 5px;' /></div></div>",
      "questions": [
        {
          "question": "<p style='font-weight: bold;'>1) Rappeler la loi d'Ohm et l'appliquer pour calculer l'intensité du courant <span class='math'>\\(I\\)</span> qui traverse le circuit si la diode est parfaite (tension de seuil nulle).</p>",
          "reponse": "<div style='background-color: #f0f8ff; padding: 10px; border-radius: 5px; color: #000;'><p><strong>Réponse :</strong> La loi d'Ohm stipule que la tension aux bornes d'une résistance est égale au produit de sa résistance par l'intensité du courant qui la traverse : <span class='math'>\\(U_R = R \\times I\\)</span>. Si la diode est parfaite, sa tension de seuil est nulle, donc toute la tension du générateur s'applique aux bornes de la résistance : <span class='math'>\\(I = \\frac{U}{R} = \\frac{12}{100} = 0,12\\, A\\)</span>.</p></div>"
        },
        {
          "question": "<p style='font-weight: bold;'>2) Analyser le fonctionnement du circuit et justifier l'état de la diode (passante ou bloquée) si on inverse la polarité du générateur.</p>",
          "reponse": "<div style='background-color: #f0f8ff; padding: 10px; border-radius: 5px; color: #000;'><p><strong>Réponse :</strong> Si la polarité du générateur est inversée, la diode est polarisée en sens inverse (la cathode est reliée au + et l'anode au -). Elle se bloque et se comporte comme un interrupteur ouvert. Aucun courant ne circule dans le circuit, ce qui protège les composants éventuellement sensibles en aval.</p></div>"
        },
        {
          "question": "<p style='font-weight: bold;'>3) La diode utilisée a une tension de seuil <span class='math'>\\(U_{seuil} = 0,7\\, V\\)</span>. Évaluer l'effet de cette tension sur l'intensité du courant dans le circuit.</p>",
          "reponse": "<div style='background-color: #f0f8ff; padding: 10px; border-radius: 5px; color: #000;'><p><strong>Réponse :</strong> Avec une diode réelle, la tension à ses bornes n'est pas nulle en sens passant. La tension disponible pour la résistance est donc <span class='math'>\\(U_R = U - U_{seuil} = 12 - 0,7 = 11,3\\, V\\)</span>. L'intensité du courant devient : <span class='math'>\\(I = \\frac{U_R}{R} = \\frac{11,3}{100} = 0,113\\, A\\)</span>. L'intensité est légèrement inférieure à celle calculée avec une diode parfaite.</p></div>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Problème de synthèse sur un montage à transistor (Compétences)",
      "points": "7 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; line-height: 1.6; color: #333;'><p style='text-align: justify;'>Un montage à transistor bipolaire NPN est utilisé pour commander une LED, comme illustré ci-dessous. La tension d'alimentation est <span class='math'>\\(V_{CC} = 5\\, V\\)</span>. On donne : <span class='math'>\\(\\beta = 100\\)</span> et <span class='math'>\\(V_{BE(sat)} = 0,7\\, V\\)</span>.</p><div style='background-color: #f4f4f4; padding: 15px; border-radius: 8px; text-align: center; margin: 10px 0;'><img alt='Schéma d un montage avec un transistor NPN. La base est reliée à une source de tension Vin à travers une résistance Rb. L émetteur est relié à la masse. Le collecteur est relié à une LED et à une résistance Rc, le tout en série avec une source de tension Vcc (5V).' src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22350%22 height=%22200%22%3E%3Crect width=%22350%22 height=%22200%22 fill=%22%23f4f4f4%22/%3E%3Cline x1=%2250%22 y1=%2230%22 x2=%22300%22 y2=%2230%22 stroke=%22black%22 stroke-width=%222%22/%3E%3Cline x1=%2250%22 y1=%2230%22 x2=%2250%22 y2=%2250%22 stroke=%22black%22 stroke-width=%222%22/%3E%3Crect x=%2235%22 y=%2250%22 width=%2230%22 height=%2220%22 stroke=%22black%22 stroke-width=%222%22 fill=%22white%22/%3E%3Ctext x=%2238%22 y=%2263%22 font-size=%2210%22 fill=%22black%22 font-family=%22Arial%22%3ERc%3C/text%3E%3Cline x1=%2250%22 y1=%2270%22 x2=%2250%22 y2=%22100%22 stroke=%22black%22 stroke-width=%222%22/%3E%3Cpolygon points=%2240,100 50,80 60,100%22 fill=%22black%22/%3E%3Cline x1=%2240%22 y1=%22100%22 x2=%2260%22 y2=%22100%22 stroke=%22black%22 stroke-width=%222%22/%3E%3Cline x1=%2250%22 y1=%22100%22 x2=%2250%22 y2=%22130%22 stroke=%22black%22 stroke-width=%222%22/%3E%3Cline x1=%22150%22 y1=%2230%22 x2=%22150%22 y2=%2250%22 stroke=%22black%22 stroke-width=%222%22/%3E%3Crect x=%22135%22 y=%2250%22 width=%2230%22 height=%2220%22 stroke=%22black%22 stroke-width=%222%22 fill=%22white%22/%3E%3Ctext x=%22138%22 y=%2263%22 font-size=%2210%22 fill=%22black%22 font-family=%22Arial%22%3ERb%3C/text%3E%3Cline x1=%22150%22 y1=%2270%22 x2=%22150%22 y2=%22100%22 stroke=%22black%22 stroke-width=%222%22/%3E%3Ccircle cx=%22150%22 cy=%22115%22 r=%2220%22 stroke=%22black%22 stroke-width=%222%22 fill=%22none%22/%3E%3Ctext x=%22145%22 y=%22120%22 font-size=%2212%22 fill=%22black%22 font-family=%22Arial%22%3ET%3C/text%3E%3Cline x1=%22150%22 y1=%22135%22 x2=%22150%22 y2=%22170%22 stroke=%22black%22 stroke-width=%222%22/%3E%3Cline x1=%22150%22 y1=%22170%22 x2=%22300%22 y2=%22170%22 stroke=%22black%22 stroke-width=%222%22/%3E%3Ctext x=%22170%22 y=%2230%22 font-size=%2214%22 fill=%22black%22 font-family=%22Arial%22%3EVcc = 5V%3C/text%3E%3Ctext x=%2240%22 y=%22180%22 font-size=%2214%22 fill=%22black%22 font-family=%22Arial%22%3EVin%3C/text%3E%3C/svg%3E' style='max-width: 100%; height: auto; border-radius: 5px;' /></div></div>",

};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
