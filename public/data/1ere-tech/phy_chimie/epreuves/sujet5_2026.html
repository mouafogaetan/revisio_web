<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Physique-Chimie",
  "classe": "1ère technique",
  "sequence": "Séquence 5",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Travail et énergie",
      "points": "4 pts",
      "enonce": "<div style='font-size: 1rem; line-height: 1.6;'>Un chariot de masse \\( m = 200 \\, \\text{kg} \\) est déplacé horizontalement sur une distance \\( d = 50 \\, \\text{m} \\) par une force constante \\( \\vec{F} \\) d'intensité \\( F = 150 \\, \\text{N} \\), faisant un angle \\( \\alpha = 60° \\) avec la direction du déplacement.</div>",
      "questions": [
        {
          "question": "<div style='display: flex; align-items: baseline; gap: 0.5rem; flex-wrap: wrap;'><span style='font-weight: bold;'>1)</span> <span>Calculer le travail de la force \\( \\vec{F} \\).</span></div>",
          "reponse": "<div style='font-size: 0.95rem; line-height: 1.6;'><span style='font-weight: bold;'>Réponse :</span><div style='margin-top: 0.3rem;'>Le travail est \\( W = F \\times d \\times \\cos(\\alpha) = 150 \\times 50 \\times \\cos(60°) = 7500 \\times 0,5 = 3750 \\, \\text{J} \\).</div></div>"
        },
        {
          "question": "<div style='display: flex; align-items: baseline; gap: 0.5rem; flex-wrap: wrap;'><span style='font-weight: bold;'>2)</span> <span>Quelle est l'énergie cinétique du chariot s'il part du repos ? (On suppose que le travail calculé est entièrement converti en énergie cinétique.)</span></div>",
          "reponse": "<div style='font-size: 0.95rem; line-height: 1.6;'><span style='font-weight: bold;'>Réponse :</span><div style='margin-top: 0.3rem;'>D'après le théorème de l'énergie cinétique, la variation d'énergie cinétique est égale au travail total. \\( \\Delta E_c = W = 3750 \\, \\text{J} \\). Si le chariot part du repos, \\( E_{c finale} = 3750 \\, \\text{J} \\).</div></div>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Lentilles minces",
      "points": "5 pts",
      "enonce": "<div style='font-size: 1rem; line-height: 1.6;'>Une lentille convergente a une distance focale \\( f' = 20 \\, \\text{cm} \\). Un objet de hauteur \\( \\overline{AB} = 2 \\, \\text{cm} \\) est placé à \\( 30 \\, \\text{cm} \\) devant la lentille.</div>",
      "questions": [
        {
          "question": "<div style='display: flex; align-items: baseline; gap: 0.5rem; flex-wrap: wrap;'><span style='font-weight: bold;'>1)</span> <span>Déterminer la position de l'image \\( A'B' \\) par la relation de conjugaison de Descartes.</span></div>",
          "reponse": "<div style='font-size: 0.95rem; line-height: 1.6;'><span style='font-weight: bold;'>Réponse :</span><div style='margin-top: 0.3rem;'>La relation de Descartes est \\( \\frac{1}{\\overline{OA'}} - \\frac{1}{\\overline{OA}} = \\frac{1}{f'} \\). \\( \\overline{OA} = -30 \\, \\text{cm} \\) (signe selon l'axe optique). Donc \\( \\frac{1}{\\overline{OA'}} = \\frac{1}{20} + \\frac{1}{-30} = \\frac{3-2}{60} = \\frac{1}{60} \\). D'où \\( \\overline{OA'} = 60 \\, \\text{cm} \\). L'image est réelle, située à 60 cm après la lentille.</div></div>"
        },
        {
          "question": "<div style='display: flex; align-items: baseline; gap: 0.5rem; flex-wrap: wrap;'><span style='font-weight: bold;'>2)</span> <span>Calculer le grandissement \\( \\gamma \\) et la taille de l'image \\( \\overline{A'B'} \\).</span></div>",
          "reponse": "<div style='font-size: 0.95rem; line-height: 1.6;'><span style='font-weight: bold;'>Réponse :</span><div style='margin-top: 0.3rem;'>Le grandissement est \\( \\gamma = \\frac{\\overline{OA'}}{\\overline{OA}} = \\frac{60}{-30} = -2 \\). La taille de l'image est \\( \\overline{A'B'} = \\gamma \\times \\overline{AB} = -2 \\times 2 = -4 \\, \\text{cm} \\). Le signe négatif indique que l'image est renversée.</div></div>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Générateur et lois des réseaux",
      "points": "5 pts",
      "enonce": "<div style='font-size: 1rem; line-height: 1.6;'>Un générateur de force électromotrice \\( E = 12 \\, \\text{V} \\) et de résistance interne \\( r = 0,5 \\, \\Omega \\) alimente un circuit composé de deux résistances \\( R_1 = 6 \\, \\Omega \\) et \\( R_2 = 3 \\, \\Omega \\) montées en parallèle.</div>",
      "questions": [
        {
          "question": "<div style='display: flex; align-items: baseline; gap: 0.5rem; flex-wrap: wrap;'><span style='font-weight: bold;'>1)</span> <span>Calculer la résistance équivalente du circuit extérieur.</span></div>",
          "reponse": "<div style='font-size: 0.95rem; line-height: 1.6;'><span style='font-weight: bold;'>Réponse :</span><div style='margin-top: 0.3rem;'>Pour deux résistances en parallèle, \\( R_{eq} = \\frac{R_1 \\times R_2}{R_1 + R_2} = \\frac{6 \\times 3}{6 + 3} = \\frac{18}{9} = 2 \\, \\Omega \\).</div></div>"
        },
        {
          "question": "<div style='display: flex; align-items: baseline; gap: 0.5rem; flex-wrap: wrap;'><span style='font-weight: bold;'>2)</span> <span>Quelle est l'intensité du courant délivré par le générateur ?</span></div>",
          "reponse": "<div style='font-size: 0.95rem; line-height: 1.6;'><span style='font-weight: bold;'>Réponse :</span><div style='margin-top: 0.3rem;'>La résistance totale du circuit est \\( R_t = R_{eq} + r = 2 + 0,5 = 2,5 \\, \\Omega \\). Le courant est \\( I = \\frac{E}{R_t} = \\frac{12}{2,5} = 4,8 \\, \\text{A} \\).</div></div>"
        },
        {
          "question": "<div style='display: flex; align-items: baseline; gap: 0.5rem; flex-wrap: wrap;'><span style='font-weight: bold;'>3)</span> <span>Quelle est la tension \\( U \\) aux bornes du générateur ?</span></div>",
          "reponse": "<div style='font-size: 0.95rem; line-height: 1.6;'><span style='font-weight: bold;'>Réponse :</span><div style='margin-top: 0.3rem;'>La tension aux bornes du générateur est \\( U = E - rI = 12 - 0,5 \\times 4,8 = 12 - 2,4 = 9,6 \\, \\text{V} \\).</div></div>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Optique et instruments",
      "points": "3 pts",
      "enonce": "<div style='font-size: 1rem; line-height: 1.6;'>Répondre aux questions suivantes.</div>",
      "questions": [
        {
          "question": "<div style='display: flex; align-items: baseline; gap: 0.5rem; flex-wrap: wrap;'><span style='font-weight: bold;'>1)</span> <span>Citer deux défauts de l'œil et la correction appropriée.</span></div>",
          "reponse": "<div style='font-size: 0.95rem; line-height: 1.6;'><span style='font-weight: bold;'>Réponse :</span><div style='margin-top: 0.3rem;'>La myopie se corrige avec une lentille divergente (verre concave). L'hypermétropie se corrige avec une lentille convergente (verre convexe).</div></div>"
        },
        {
          "question": "<div style='display: flex; align-items: baseline; gap: 0.5rem; flex-wrap: wrap;'><span style='font-weight: bold;'>2)</span> <span>Donner un exemple d'instrument d'optique et son rôle.</span></div>",
          "reponse": "<div style='font-size: 0.95rem; line-height: 1.6;'><span style='font-weight: bold;'>Réponse :</span><div style='margin-top: 0.3rem;'>La loupe est un instrument d'optique qui permet d'agrandir l'image d'un petit objet. Elle utilise une lentille convergente.</div></div>"
        }
      ]
    },
    {
      "titre": "Exercice 5 : Électronique",
      "points": "3 pts",
      "enonce": "<div style='font-size: 1rem; line-height: 1.6;'>On réalise un montage simple pour allumer une LED. La LED a une tension de seuil \\( U_D = 1,8 \\, \\text{V} \\) et doit être traversée par un courant \\( I_D = 20 \\, \\text{mA} \\). La tension d'alimentation est \\( E = 5 \\, \\text{V} \\).</div>",
      "questions": [
        {
          "question": "<div style='display: flex; align-items: baseline; gap: 0.5rem; flex-wrap: wrap;'><span style='font-weight: bold;'>1)</span> <span>Quelle est la valeur de la résistance \\( R \\) à placer en série avec la LED ?</span></div>",
          "reponse": "<div style='font-size: 0.95rem; line-height: 1.6;'><span style='font-weight: bold;'>Réponse :</span><div style='margin-top: 0.3rem;'>La tension aux bornes de la résistance est \\( U_R = E - U_D = 5 - 1,8 = 3,2 \\, \\text{V} \\). Le courant est \\( I = I_D = 20 \\, \\text{mA} = 0,02 \\, \\text{A} \\). Donc \\( R = \\frac{U_R}{I} = \\frac{3,2}{0,02} = 160 \\, \\Omega \\).</div></div>"
        },
        {
          "question": "<div style='display: flex; align-items: baseline; gap: 0.5rem; flex-wrap: wrap;'><span style='font-weight: bold;'>2)</span> <span>Si on utilise une résistance de 100 Ω, que risque-t-il de se passer ?</span></div>",
          "reponse": "<div style='font-size: 0.95rem; line-height: 1.6;'><span style='font-weight: bold;'>Réponse :</span><div style='margin-top: 0.3rem;'>Avec une résistance plus petite, le courant augmente. \\( I' = \\frac{3,2}{100} = 0,032 \\, \\text{A} = 32 \\, \\text{mA} \\). Ce courant risque de dépasser le courant maximal admissible pour la LED et de la détruire.</div></div>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
