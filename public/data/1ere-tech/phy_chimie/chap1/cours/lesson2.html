<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Présentation mobile</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' },
            options: { skipHtmlTypes: 'script' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 500px;
        margin: 0 auto;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    .slide-header {
        flex-shrink: 0;
        padding: 18px 16px 10px 16px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        z-index: 10;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .slide-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
    }

    .content-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 18px 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        flex-shrink: 0;
    }

    .content-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .content-card li {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        line-height: 1.5;
    }

    .content-card li:last-child {
        border-bottom: none;
    }

    .bullet-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
    }

    .math-block {
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        overflow-x: auto;
        flex-shrink: 0;
        margin: 4px 0;
    }

    .math-block .math {
        font-size: 1.2rem;
        color: #e2e8f0;
    }

    .note-box {
        background: rgba(96, 165, 250, 0.08);
        border-left: 4px solid #60a5fa;
        padding: 12px 16px;
        border-radius: 12px;
        font-style: italic;
        font-size: 0.9rem;
        color: #cbd5e1;
        flex-shrink: 0;
    }

    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        border-radius: 0;
        flex-direction: column;
    }

    .loading-card {
        background: #1e293b;
        padding: 32px 28px;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #334155;
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px auto;
    }

    .loading-text {
        font-weight: 600;
        font-size: 1.1rem;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    .loading-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 16px;
    }
    .loading-progress {
        height: 3px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        animation: loadingProgress 30s ease-out forwards;
    }

    .loading-timeout {
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 12px;
    }

    .btn-cancel-loading {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 40px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #f87171;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }

    .btn-cancel-loading:active {
        transform: scale(0.94);
        background: rgba(239, 68, 68, 0.25);
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
    }

    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .slide-counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255,255,255,0.05);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(255,255,255,0.04);
    }

    .status-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 30px;
        background: rgba(96, 165, 250, 0.12);
        color: #93bbfc;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
    }

    .status-badge .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: pulse-dot 1.2s infinite;
        flex-shrink: 0;
    }

    .status-badge.idle .dot {
        animation: none;
        background: #64748b;
    }
    .status-badge.speaking .dot {
        background: #34d399;
        animation: pulse-dot 0.8s infinite;
    }
    .status-badge.error .dot {
        background: #f87171;
        animation: none;
    }
    .status-badge.paused .dot {
        animation: none;
        background: #fbbf24;
    }
    .status-badge.waiting .dot {
        animation: pulse-dot 1.5s infinite;
        background: #fbbf24;
    }
    .status-badge.loading .dot {
        animation: pulse-dot 0.5s infinite;
        background: #60a5fa;
    }

    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.7); }
    }

    .footer-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(255,255,255,0.1);
    }

    .btn-secondary {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-play {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
        min-width: 80px;
        justify-content: center;
    }
    .btn-play:active {
        background: rgba(52, 211, 153, 0.25);
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
    }

    .auto-indicator {
        font-size: 0.65rem;
        color: #64748b;
        text-align: center;
        letter-spacing: 0.3px;
        padding: 2px 0;
    }

    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.2rem;
        }
        .content-card li {
            font-size: 0.9rem;
            padding: 8px 0;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .btn-play {
            min-width: 60px;
        }
        .footer-buttons {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
        .loading-card {
            padding: 20px 16px;
        }
        .math-block .math {
            font-size: 1rem;
        }
    }

    @media (min-width: 600px) {
        .app-container {
            max-width: 480px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
        .loading-overlay {
            border-radius: 32px;
        }
    }

    /* Mode jour (par défaut) */
    html, body {
        background: #f0f4f8 !important;
        color: #1a202c !important;
    }
    .app-container {
        background: linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%) !important;
    }
    .slide-header {
        background: rgba(255, 255, 255, 0.85) !important;
        border-bottom: 1px solid rgba(0,0,0,0.08) !important;
    }
    .slide-header h1 {
        background: linear-gradient(135deg, #2b6cb0, #6b46c1) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        background-clip: text !important;
    }
    .slide-footer {
        background: rgba(255, 255, 255, 0.9) !important;
        border-top: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card {
        background: rgba(255,255,255,0.8) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card li {
        border-bottom: 1px solid rgba(0,0,0,0.05) !important;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.12) !important;
        border-left: 4px solid #4299e1 !important;
        color: #2c3e50 !important;
    }
    .math-block {
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .math-block .math {
        color: #2d3748 !important;
    }
    .slide-counter {
        color: #4a5568 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .status-badge {
        background: rgba(96, 165, 250, 0.15) !important;
        color: #2b6cb0 !important;
        border: 1px solid rgba(96, 165, 250, 0.15) !important;
    }
    .btn {
        color: #2d3748 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .btn-secondary {
        background: rgba(0,0,0,0.04) !important;
        border-color: rgba(0,0,0,0.08) !important;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15) !important;
        border-color: rgba(52, 211, 153, 0.2) !important;
        color: #38a169 !important;
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15) !important;
        border-color: rgba(251, 191, 36, 0.2) !important;
        color: #d69e2e !important;
    }
    .auto-indicator {
        color: #718096 !important;
    }
    .loading-card {
        background: #ffffff !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .loading-text {
        color: #1a202c !important;
    }
    .loading-sub {
        color: #4a5568 !important;
    }
</style>
</head>
<body>

<div class="app-container">

    <header class="slide-header">
        <h1 id="slideTitle">Chargement...</h1>
    </header>

    <main class="slide-body" id="slideBody"></main>

    <!-- LOADING OVERLAY AVEC BOUTON ANNULER -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Préparation vocale...</div>
            <div class="loading-sub" id="loadingSub">Synthèse en cours</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loadingProgressBar"></div>
            </div>
            <div class="loading-timeout" id="loadingTimeout">⏱️ 30 secondes maximum</div>
            <button class="btn-cancel-loading" id="cancelLoadingBtn">
                <span>✕</span> Annuler
            </button>
        </div>
    </div>

    <footer class="slide-footer">
        <div class="footer-top">
            <span class="slide-counter" id="slideCounter">1 / 3</span>
            <span class="status-badge idle" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">Prêt</span>
            </span>
        </div>

        <div class="footer-buttons">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-secondary" id="replayBtn">
                <span class="btn-icon">🔁</span> <span class="btn-label">Relire</span>
            </button>
            <button class="btn btn-play" id="playBtn">
                <span class="btn-icon">▶</span> <span class="btn-label">Play</span>
            </button>
        </div>

        <div class="auto-indicator" id="autoIndicator">⏸ Lecture manuelle</div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // SLIDES
    // ================================================================
    const slides = [
  {
    "titre": "Introduction à l'énergie cinétique",
    "contenu": "<div style='padding: 10px; background: #f0f4f8; border-radius: 15px; color: #1a202c;'> <div style='text-align: justify;'> <p><strong>L'énergie cinétique</strong> est l'énergie qu'un corps possède du fait de son mouvement. Plus un corps se déplace rapidement, plus son énergie cinétique est grande.</p> <p>On distingue deux types d'énergie cinétique :</p> <ul style='list-style: none; padding: 0;'> <li style='background: #ffffff; margin: 8px 0; padding: 10px; border-radius: 8px; border-left: 4px solid #2b6cb0;'>• <strong>Énergie cinétique de translation</strong> : liée au mouvement de translation (un objet qui se déplace en ligne droite).</li> <li style='background: #ffffff; margin: 8px 0; padding: 10px; border-radius: 8px; border-left: 4px solid #2b6cb0;'>• <strong>Énergie cinétique de rotation</strong> : liée au mouvement de rotation autour d'un axe (une roue qui tourne, une toupie).</li> </ul> <div style='background: #e2e8f0; padding: 12px; border-radius: 10px; margin: 15px 0; text-align: center;'> <p><strong>Unité :</strong> Le joule (J) dans le système international.</p> </div> </div> </div>",
    "texteParle": "Bonjour à tous. Aujourd'hui, nous allons parler de l'énergie cinétique. C'est l'énergie qu'un objet possède parce qu'il est en mouvement. Plus un objet est rapide, plus il a d'énergie cinétique. Il y a deux types d'énergie cinétique : celle de translation, quand l'objet se déplace en ligne droite, et celle de rotation, quand l'objet tourne sur lui-même. L'unité de l'énergie est le joule, noté J. Nous allons voir comment calculer ces énergies et comment elles interviennent dans les problèmes de mécanique.",
    "note": "L'énergie cinétique est une énergie liée au mouvement d'un corps."
  },
  {
    "titre": "Énergie cinétique de translation",
    "contenu": "<div style='padding: 10px; background: #f0f4f8; border-radius: 15px; color: #1a202c;'> <div style='text-align: justify;'> <p><strong>Définition :</strong> L'énergie cinétique de translation d'un corps de masse \\( m \\) se déplaçant à la vitesse \\( v \\) est donnée par :</p> <div class='math-block' style='background: #e2e8f0; padding: 15px; border-radius: 10px; margin: 15px 0; text-align: center;'> <div class='math' style='font-size: 1.2rem;'>$$ E_c = \\dfrac{1}{2} m v^2 $$</div> </div> <ul style='list-style: none; padding: 0;'> <li style='background: #ffffff; margin: 8px 0; padding: 10px; border-radius: 8px; border-left: 4px solid #2b6cb0;'>• \\( m \\) est la masse du corps (en kg).</li> <li style='background: #ffffff; margin: 8px 0; padding: 10px; border-radius: 8px; border-left: 4px solid #2b6cb0;'>• \\( v \\) est la vitesse du corps (en m/s).</li> <li style='background: #ffffff; margin: 8px 0; padding: 10px; border-radius: 8px; border-left: 4px solid #2b6cb0;'>• \\( E_c \\) est en joules (J).</li> </ul> <div style='background: #ffffff; padding: 12px; border-radius: 10px; margin: 15px 0; border-left: 4px solid #2b6cb0;'> <p><strong>Exemple :</strong> Une voiture de 1000 kg roulant à 20 m/s (72 km/h) a une énergie cinétique de :</p> <p>\\( E_c = \\dfrac{1}{2} \\times 1000 \\times 20^2 = 500 \\times 400 = 200\\,000 \\) J = 200 kJ.</p> </div> </div> </div>",
    "texteParle": "Commençons par l'énergie cinétique de translation. La formule est très simple : un demi fois la masse fois la vitesse au carré. L'énergie est proportionnelle à la masse et au carré de la vitesse. Cela signifie que si vous doublez la vitesse, l'énergie est multipliée par quatre. C'est pour cela que les accidents à grande vitesse sont si violents : l'énergie à dissiper est énorme. Prenons un exemple : une voiture de 1000 kg à 72 km/h, soit 20 mètres par seconde, a une énergie cinétique de 200 000 joules, soit 200 kilojoules.",
    "note": "L'énergie cinétique est proportionnelle au carré de la vitesse."
  },
  {
    "titre": "Énergie cinétique de rotation",
    "contenu": "<div style='padding: 10px; background: #f0f4f8; border-radius: 15px; color: #1a202c;'> <div style='text-align: justify;'> <p><strong>Définition :</strong> L'énergie cinétique de rotation d'un corps en rotation autour d'un axe est donnée par :</p> <div class='math-block' style='background: #e2e8f0; padding: 15px; border-radius: 10px; margin: 15px 0; text-align: center;'> <div class='math' style='font-size: 1.2rem;'>$$ E_c = \\dfrac{1}{2} J \\omega^2 $$</div> </div> <ul style='list-style: none; padding: 0;'> <li style='background: #ffffff; margin: 8px 0; padding: 10px; border-radius: 8px; border-left: 4px solid #2b6cb0;'>• \\( J \\) est le <strong>moment d'inertie</strong> du corps par rapport à l'axe de rotation (en kg·m²).</li> <li style='background: #ffffff; margin: 8px 0; padding: 10px; border-radius: 8px; border-left: 4px solid #2b6cb0;'>• \\( \\omega \\) est la <strong>vitesse angulaire</strong> (en rad/s).</li> <li style='background: #ffffff; margin: 8px 0; padding: 10px; border-radius: 8px; border-left: 4px solid #2b6cb0;'>• \\( E_c \\) est en joules (J).</li> </ul> <div style='background: #ffffff; padding: 12px; border-radius: 10px; margin: 15px 0; border-left: 4px solid #2b6cb0;'> <p><strong>Exemple :</strong> Un volant d'inertie de moment d'inertie \\( J = 2 \\) kg·m² tournant à \\( \\omega = 10 \\) rad/s a une énergie cinétique de rotation :</p> <p>\\( E_c = \\dfrac{1}{2} \\times 2 \\times 10^2 = 100 \\) J.</p> </div> </div> </div>",
    "texteParle": "Passons maintenant à l'énergie cinétique de rotation. La formule est similaire à celle de la translation, mais avec des grandeurs adaptées à la rotation. Au lieu de la masse, on utilise le moment d'inertie, qui mesure la résistance d'un corps à la mise en rotation. Au lieu de la vitesse linéaire, on utilise la vitesse angulaire. Le moment d'inertie dépend de la forme du corps et de la distribution de sa masse par rapport à l'axe de rotation. Par exemple, un volant d'inertie de moment d'inertie 2 kg·m² tournant à 10 radians par seconde a une énergie cinétique de 100 joules.",
    "note": "L'énergie cinétique de rotation dépend du moment d'inertie et de la vitesse angulaire."
  },
  {
    "titre": "Le théorème de l'énergie cinétique",
    "contenu": "<div style='padding: 10px; background: #f0f4f8; border-radius: 15px; color: #1a202c;'> <div style='text-align: justify;'> <p><strong>Théorème :</strong> La variation de l'énergie cinétique d'un corps entre deux instants est égale au travail de la résultante des forces qui s'exercent sur lui.</p> <div class='math-block' style='background: #e2e8f0; padding: 15px; border-radius: 10px; margin: 15px 0; text-align: center;'> <div class='math' style='font-size: 1.2rem;'>$$ \\Delta E_c = E_c(B) - E_c(A) = W(\\sum \\vec{F}) $$</div> </div> <ul style='list-style: none; padding: 0;'> <li style='background: #ffffff; margin: 8px 0; padding: 10px; border-radius: 8px; border-left: 4px solid #2b6cb0;'>• \\( \\Delta E_c \\) est la variation d'énergie cinétique.</li> <li style='background: #ffffff; margin: 8px 0; padding: 10px; border-radius: 8px; border-left: 4px solid #2b6cb0;'>• \\( W(\\sum \\vec{F}) \\) est le travail de la résultante des forces.</li> <li style='background: #ffffff; margin: 8px 0; padding: 10px; border-radius: 8px; border-left: 4px solid #2b6cb0;'>• Si le travail est positif, l'énergie cinétique augmente (accélération).</li> <li style='background: #ffffff; margin: 8px 0; padding: 10px; border-radius: 8px; border-left: 4px solid #2b6cb0;'>• Si le travail est négatif, l'énergie cinétique diminue (freinage).</li> </ul> </div> </div>",
    "texteParle": "Le théorème de l'énergie cinétique est un outil très puissant. Il dit que la variation d'énergie cinétique d'un corps est égale au travail de la force totale qui s'applique sur lui. Si le travail est positif, le corps accélère et son énergie augmente. Si le travail est négatif, le corps freine et son énergie diminue. Ce théorème relie le travail des forces à l'énergie cinétique. Il est très utile pour résoudre des problèmes de mécanique sans avoir à utiliser les lois de Newton directement.",
    "note": "Le théorème de l'énergie cinétique relie le travail des forces à la variation d'énergie cinétique."

  {
    "titre": "Application : voiture en accélération",
    "contenu": "<div style='padding: 10px; background: #f0f4f8; border-radius: 15px; color: #1a202c;'> <div style='text-align: justify;'> <p><strong>Problème :</strong> Une voiture de 1200 kg accélère de 0 à 25 m/s (90 km/h) sur une distance de 100 m. Calculer le travail fourni par le moteur.</p> <div style='background: #ffffff; padding: 15px; border-radius: 10px; margin: 15px 0;'> <p><strong>Solution :</strong></p> <ul style='list-style: none; padding: 0;'> <li style='margin: 5px 0;'>1. Calculer la variation d'énergie cinétique :</li> <li style='margin: 5px 0;'>\\( \\Delta E_c = \\dfrac{1}{2} m v^2 - \\dfrac{1}{2} m v_0^2 = \\dfrac{1}{2} \\times 1200 \\times 25^2 - 0 \\)</li> <li style='margin: 5px 0;'>\\( \\Delta E_c = 600 \\times 625 = 375\\,000 \\) J.</li> <li style='margin: 5px 0;'>2. D'après le théorème de l'énergie cinétique :</li> <li style='margin: 5px 0;'>\\( W = \\Delta E_c = 375\\,000 \\) J = 375 kJ.</li> </ul> </div> <div style='background: #e2e8f0; padding: 12px; border-radius: 10px; margin: 15px 0; text-align: center;'> <p><strong>Interprétation :</strong> Le moteur a fourni 375 kJ de travail pour accélérer la voiture.</p> </div> </div> </div>",
    "texteParle": "Voyons une application concrète du théorème de l'énergie cinétique. Une voiture de 1200 kg accélère de 0 à 25 mètres par seconde sur 100 mètres. Nous voulons calculer le travail fourni par le moteur. La variation d'énergie cinétique est égale à la moitié de la masse fois la vitesse finale au carré. Cela donne 375 000 joules. Le travail du moteur est donc de 375 kilojoules. Ce travail a permis d'augmenter l'énergie cinétique de la voiture. C'est ainsi que le théorème nous permet de calculer le travail sans connaître la force exacte.",

  {
    "titre": "Application : freinage d'un véhicule",
    "contenu": "<div style='padding: 10px; background: #f0f4f8; border-radius: 15px; color: #1a202c;'> <div style='text-align: justify;'> <p><strong>Problème :</strong> Un camion de 3000 kg roule à 20 m/s (72 km/h). Il freine et s'arrête sur une distance de 50 m. Calculer la force de freinage moyenne.</p> <div style='background: #ffffff; padding: 15px; border-radius: 10px; margin: 15px 0;'> <p><strong>Solution :</strong></p> <ul style='list-style: none; padding: 0;'> <li style='margin: 5px 0;'>1. Variation d'énergie cinétique :</li> <li style='margin: 5px 0;'>\\( \\Delta E_c = 0 - \\dfrac{1}{2} \\times 3000 \\times 20^2 = -600\\,000 \\) J.</li> <li style='margin: 5px 0;'>2. Travail des forces de freinage :</li> <li style='margin: 5px 0;'>\\( W = F \\times d \\times \\cos(180°) = -F \\times 50 \\) (car la force est opposée au mouvement).</li> <li style='margin: 5px 0;'>3. D'après le théorème : \\( -F \\times 50 = -600\\,000 \\)</li> <li style='margin: 5px 0;'>\\( F = \\dfrac{600\\,000}{50} = 12\\,000 \\) N.</li> </ul> </div> <div style='background: #e2e8f0; padding: 12px; border-radius: 10px; margin: 15px 0; text-align: center;'> <p><strong>Interprétation :</strong> La force de freinage moyenne est de 12 000 N (12 kN).</p> </div> </div> </div>",

    "contenu": "<div style='padding: 10px; background: #f0f4f8; border-radius: 15px; color: #1a202c;'> <div style='text-align: justify;'> <p><strong>Analogies entre translation et rotation :</strong></p> <table style='width: 100%; border-collapse: collapse; background: #ffffff; border-radius: 10px; overflow: hidden; margin: 15px 0;'> <thead> <tr style='background: #2b6cb0; color: #ffffff;'> <th style='padding: 10px; text-align: center;'>Translation</th> <th style='padding: 10px; text-align: center;'>Rotation</th> </tr> </thead> <tbody> <tr style='border-bottom: 1px solid #e2e8f0;'> <td style='padding: 10px; text-align: center;'>Masse \\( m \\)</td> <td style='padding: 10px; text-align: center;'>Moment d'inertie \\( J \\)</td> </tr> <tr style='border-bottom: 1px solid #e2e8f0;'> <td style='padding: 10px; text-align: center;'>Vitesse \\( v \\)</td> <td style='padding: 10px; text-align: center;'>Vitesse angulaire \\( \\omega \\)</td> </tr> <tr style='border-bottom: 1px solid #e2e8f0;'> <td style='padding: 10px; text-align: center;'>Force \\( F \\)</td> <td style='padding: 10px; text-align: center;'>Moment de force \\( M \\)</td> </tr> <tr style='border-bottom: 1px solid #e2e8f0;'> <td style='padding: 10px; text-align: center;'>\\( E_c = \\dfrac{1}{2}mv^2 \\)</td> <td style='padding: 10px; text-align: center;'>\\( E_c = \\dfrac{1}{2}J\\omega^2 \\)</td> </tr> <tr> <td style='padding: 10px; text-align: center;'>\\( W = F \\times d \\)</td> <td style='padding: 10px; text-align: center;'>\\( W = M \\times \\theta \\)</td> </tr> </tbody> </table> </div> </div>",
    "texteParle": "Il est intéressant de comparer la translation et la rotation. Les deux mouvements sont régis par des formules analogues. À la place de la masse, on a le moment d'inertie. À la place de la vitesse, on a la vitesse angulaire. À la place de la force, on a le moment de force. L'énergie cinétique de translation est un demi fois la masse fois la vitesse au carré, et l'énergie cinétique de rotation est un demi fois le moment d'inertie fois la vitesse angulaire au carré. Cette analogie est très utile pour comprendre les mouvements de rotation.</p>",

    "contenu": "<div style='padding: 10px; background: #f0f4f8; border-radius: 15px; color: #1a202c;'> <div style='text-align: justify;'> <p><strong>Problème :</strong> Un volant d'inertie de moment d'inertie \\( J = 0,5 \\) kg·m² tourne à une vitesse de \\( \\omega = 20 \\) rad/s. Il est freiné par un couple de freinage constant de \\( M = 2 \\) N·m. Calculer le temps d'arrêt.</p> <div style='background: #ffffff; padding: 15px; border-radius: 10px; margin: 15px 0;'> <p><strong>Solution :</strong></p> <ul style='list-style: none; padding: 0;'> <li style='margin: 5px 0;'>1. Énergie cinétique initiale :</li> <li style='margin: 5px 0;'>\\( E_c = \\dfrac{1}{2} \\times 0,5 \\times 20^2 = 100 \\) J.</li> <li style='margin: 5px 0;'>2. Travail du couple de freinage :</li> <li style='margin: 5px 0;'>\\( W = M \\times \\theta \\) (où \\( \\theta \\) est l'angle de rotation).</li> <li style='margin: 5px 0;'>3. D'après le théorème : \\( -2 \\times \\theta = -100 \\Rightarrow \\theta = 50 \\) rad.</li> <li style='margin: 5px 0;'>4. Si la décélération est uniforme :</li> <li style='margin: 5px 0;'>\\( \\omega_f^2 = \\omega_i^2 - 2\\alpha\\theta \\Rightarrow 0 = 400 - 2\\alpha \\times 50 \\Rightarrow \\alpha = 4 \\) rad/s².</li> <li style='margin: 5px 0;'>5. Temps d'arrêt : \\( t = \\dfrac{\\omega_i}{\\alpha} = \\dfrac{20}{4} = 5 \\) s.</li> </ul> </div> </div> </div>",

    "texteParle": "Pour terminer, retenez les points essentiels. L'énergie cinétique de translation est un demi fois la masse fois la vitesse au carré. L'énergie cinétique de rotation est un demi fois le moment d'inertie fois la vitesse angulaire au carré. Le théorème de l'énergie cinétique relie la variation d'énergie cinétique au travail des forces. Le travail est positif quand la force accélère le corps, et négatif quand elle le freine. L'unité de l'énergie est le joule. Dans le prochain cours, nous verrons l'énergie mécanique et sa conservation, un concept fondamental de la physique.",

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentIndex = 0;
    let isSpeaking = false;
    let isPaused = false;
    let currentUtterance = null;
    let isLoading = false;
    let loadingTimeout = null;
    let isTransitioning = false;
    let speechSupported = true;
    let userInteracted = false;
    let isPlaying = false;
    let loadingCancelled = false;

    const total = slides.length;
    const synth = window.speechSynthesis;

    // Références jQuery
    const $title = $('#slideTitle');
    const $body = $('#slideBody');
    const $counter = $('#slideCounter');
    const $statusText = $('#statusText');
    const $statusBadge = $('#statusBadge');
    const $loading = $('#loadingOverlay');
    const $loadingText = $('#loadingText');
    const $loadingSub = $('#loadingSub');
    const $loadingTimeout = $('#loadingTimeout');
    const $loadingProgressBar = $('#loadingProgressBar');
    const $autoIndicator = $('#autoIndicator');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $replay = $('#replayBtn');
    const $play = $('#playBtn');
    const $cancelLoading = $('#cancelLoadingBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function setStatus(text, type) {
        $statusText.text(text);
        $statusBadge.removeClass('idle speaking error paused waiting loading');
        if (type === 'speaking') $statusBadge.addClass('speaking');
        else if (type === 'error') $statusBadge.addClass('error');
        else if (type === 'paused') $statusBadge.addClass('paused');
        else if (type === 'waiting') $statusBadge.addClass('waiting');
        else if (type === 'loading') $statusBadge.addClass('loading');
        else $statusBadge.addClass('idle');
    }

    function updatePlayButton() {
        if (isPlaying) {
            $play.addClass('playing');
            $play.find('.btn-icon').text('⏸');
            $play.find('.btn-label').text('Pause');
        } else {
            $play.removeClass('playing');
            $play.find('.btn-icon').text('▶');
            $play.find('.btn-label').text('Play');
        }
    }

    function showLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        
        loadingCancelled = false;
        isLoading = true;
        
        // Réinitialiser la barre de progression
        $loadingProgressBar.css('animation', 'none');
        $loadingProgressBar.css('width', '0%');
        // Forcer un reflow
        $loadingProgressBar[0].offsetHeight;
        $loadingProgressBar.css('animation', 'loadingProgress 30s ease-out forwards');
        
        $loadingText.text('Préparation vocale...');
        $loadingSub.text('Synthèse en cours');
        $loadingTimeout.text('⏱️ 30 secondes maximum');
        $loading.fadeIn(300);
        setStatus("⏳ Chargement...", 'loading');
        
        // 🔥 TIMEOUT DE 30 SECONDES
        loadingTimeout = setTimeout(() => {
            if (isLoading && !loadingCancelled) {
                hideLoading();
                setStatus("⚠️ Délai dépassé (30s)", 'error');
                isPlaying = false;
                updatePlayButton();
                $loadingSub.text('La synthèse vocale a pris trop de temps');
                $loadingTimeout.text('❌ Délai dépassé');
            }
        }, 30000);
    }

    function hideLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        isLoading = false;
        loadingCancelled = false;
        $loading.fadeOut(300);
        // Ne pas changer le statut si on est en train de parler
        if (!isSpeaking && !isPlaying) {
            setStatus("⏸ Lecture arrêtée", 'paused');
        }
    }

    function cancelLoading() {
        loadingCancelled = true;
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        hideLoading();
        stopSpeaking();
        setStatus("⏸ Annulé", 'paused');
        isPlaying = false;
        updatePlayButton();
        $loadingText.text('Annulé par l\'utilisateur');
        $loadingSub.text('Vous pouvez réessayer');
        $loadingTimeout.text('✕ Annulation');
    }

    // Arrêter la parole proprement
    function stopSpeaking() {
        try {
            if (synth && (synth.speaking || synth.pending)) {
                synth.cancel();
            }
        } catch(e) {
            console.warn('Erreur stopSpeaking:', e);
        }
        if (currentUtterance) {
            try {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance.onstart = null;
            } catch(e) {}
            currentUtterance = null;
        }
        isSpeaking = false;
        isPlaying = false;
        updatePlayButton();
    }

    // Mettre en pause la parole
    function pauseSpeaking() {
        try {
            if (synth && synth.speaking) {
                synth.pause();
                isPaused = true;
                isPlaying = false;
                setStatus("⏸ Lecture en pause", 'paused');
                updatePlayButton();
            }
        } catch(e) {
            console.warn('Erreur pauseSpeaking:', e);
            stopSpeaking();
        }
    }

    // Reprendre la parole
    function resumeSpeaking() {
        try {
            if (synth && synth.paused) {
                synth.resume();
                isPaused = false;
                isPlaying = true;
                setStatus("🔊 Lecture en cours", 'speaking');
                updatePlayButton();
            } else if (!isSpeaking && !synth.speaking && !synth.pending) {
                speakSlide(currentIndex);
            }
        } catch(e) {
            console.warn('Erreur resumeSpeaking:', e);
            speakSlide(currentIndex);
        }
    }

    function renderSlide(index) {
        const slide = slides[index];
        $title.text(slide.titre);

        let html = '';
        html += `<div class="content-card">${slide.contenu}</div>`;
        if (slide.note) {
            html += `<div class="note-box">${slide.note}</div>`;
        }
        $body.html(html);
        $counter.text(`${index+1} / ${total}`);

        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
        }
    }

    // ================================================================
    // LECTURE VOCALE
    // ================================================================
    function speakSlide(index) {
        return new Promise((resolve) => {
            const slide = slides[index];
            const text = slide.texteParle;
            
            if (!text || text.trim() === '' || !speechSupported) {
                resolve();
                return;
            }

            if (!window.speechSynthesis) {
                setStatus("❌ Synthèse vocale non supportée", 'error');
                speechSupported = false;
                resolve();
                return;
            }

            // Arrêter toute lecture en cours
            stopSpeaking();
            
            // Réinitialiser l'état de pause
            isPaused = false;
            
            showLoading();
            setStatus("Initialisation...", 'loading');

            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.92;
                utterance.pitch = 1.05;
                utterance.volume = 1;

                let isFinished = false;
                let errorHandled = false;

                utterance.onstart = function() {
                    if (loadingCancelled) {
                        stopSpeaking();
                        resolve();
                        return;
                    }
                    hideLoading();
                    isSpeaking = true;
                    isPlaying = true;
                    isPaused = false;
                    setStatus("🔊 Lecture en cours", 'speaking');
                    updatePlayButton();
                };

                utterance.onend = function() {
                    if (isFinished) return;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    setStatus("✅ Terminé", 'idle');
                    hideLoading();
                    updatePlayButton();
                    resolve();
                };

                utterance.onerror = function(e) {
                    if (isFinished || errorHandled) return;
                    errorHandled = true;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    hideLoading();
                    updatePlayButton();
                    
                    if (e.error === 'not-allowed') {
                        setStatus("⚠️ Permission refusée", 'error');
                    } else if (e.error === 'synthesis-unavailable') {
                        setStatus("⚠️ Synthèse indisponible", 'error');
                    } else if (e.error === 'canceled') {
                        setStatus("⏸ Annulé", 'paused');
                    } else {
                        setStatus("❌ Erreur audio: " + (e.error || 'inconnue'), 'error');
                    }
                    
                    resolve();
                };

                // Gestion du chargement des voix
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = function() {
                        if (!loadingCancelled) {
                            try {
                                synth.speak(utterance);
                            } catch(err) {
                                // Silencieux
                            }
                        }
                        synth.onvoiceschanged = null;
                    };
                }

                currentUtterance = utterance;
                
                if (!loadingCancelled) {
                    try {
                        synth.speak(utterance);
                    } catch(err) {
                        setTimeout(() => {
                            if (!loadingCancelled) {
                                try {
                                    synth.speak(utterance);
                                } catch(e) {
                                    setStatus("❌ Erreur de lecture", 'error');
                                    isPlaying = false;
                                    updatePlayButton();
                                    hideLoading();
                                    resolve();
                                }
                            } else {
                                resolve();
                            }
                        }, 100);
                    }
                } else {
                    resolve();
                }

            } catch(err) {
                hideLoading();
                setStatus("❌ Erreur générale", 'error');
                isPlaying = false;
                updatePlayButton();
                console.error('Erreur speakSlide:', err);
                resolve();
            }
        });
    }

    // ================================================================
    // NAVIGATION
    // ================================================================
    async function goToSlide(index) {
        if (isTransitioning) return;
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        
        // Si on est en train de lire, on met en pause avant de naviguer
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        // Arrêter complètement la lecture
        stopSpeaking();
        
        await new Promise(r => setTimeout(r, 50));
        
        if (index === currentIndex) {
            setStatus("📄 Slide actuel", 'idle');
            return;
        }

        isTransitioning = true;
        currentIndex = index;
        renderSlide(index);
        
        // Réinitialiser l'état de lecture
        isPlaying = false;
        updatePlayButton();
        setStatus("⏸ Lecture arrêtée", 'paused');

        await new Promise(r => setTimeout(r, 150));
        isTransitioning = false;
    }

    async function goToNext() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex + 1 < total) {
            await goToSlide(currentIndex + 1);
        } else {
            setStatus("🏁 Dernier slide", 'idle');
        }
    }

    async function goToPrev() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex - 1 >= 0) {
            await goToSlide(currentIndex - 1);
        } else {
            setStatus("🔁 Premier slide", 'idle');
        }
    }

    // ================================================================
    // GESTION PLAY/PAUSE
    // ================================================================
    function togglePlay() {
        if (!userInteracted) {
            userInteracted = true;
        }

        // Si le chargement est en cours, on l'annule
        if (isLoading) {
            cancelLoading();
            return;
        }

        // Si le synthétiseur est en pause, on reprend
        if (synth && synth.paused) {
            resumeSpeaking();
            return;
        }

        // Si la lecture est en cours, on met en pause
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
            return;
        }

        // Sinon, on démarre la lecture du slide courant
        if (!isSpeaking && !isPlaying) {
            stopSpeaking();
            speakSlide(currentIndex);
        }
    }

    // ================================================================
    // INIT
    // ================================================================
    async function init() {
        // Vérifier la compatibilité
        if (!window.speechSynthesis) {
            setStatus("❌ Synthèse vocale non supportée", 'error');
            speechSupported = false;
        }

        // Précharger les voix
        try {
            if (synth.getVoices) {
                synth.getVoices();
                setTimeout(() => {
                    try {
                        synth.getVoices();
                    } catch(e) {}
                }, 200);
            }
        } catch(e) {
            console.warn('Erreur chargement voix:', e);
        }

        // Afficher le premier slide
        renderSlide(0);
        $counter.text(`1 / ${total}`);
        
        // État initial
        setStatus("⏸ Appuie sur Play", 'paused');
        updatePlayButton();
        $autoIndicator.text('⏸ Lecture manuelle');

        // ================================================================
        // ÉVÉNEMENTS
        // ================================================================
        
        // Bouton Play/Pause
        $play.on('click', function() {
            togglePlay();
        });

        // Bouton Annuler le chargement
        $cancelLoading.on('click', function() {
            cancelLoading();
        });

        // Navigation
        $prev.on('click', function() {
            // Si chargement en cours, on annule
            if (isLoading) cancelLoading();
            goToPrev();
        });

        $next.on('click', function() {
            if (isLoading) cancelLoading();
            goToNext();
        });

        // Replay - relire le slide courant
        $replay.on('click', function() {
            if (isLoading) cancelLoading();
            stopSpeaking();
            setTimeout(() => {
                speakSlide(currentIndex);
            }, 100);
        });

        // Support du clavier (espace pour play/pause)
        $(document).on('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });

        // Nettoyage
        $(window).on('beforeunload', function() {
            try {
                if (synth.speaking) synth.cancel();
            } catch(e) {}
            hideLoading();
        });

        // Gérer les cas où la synthèse se termine de manière inattendue
        setInterval(() => {
            if (isPlaying && !synth.speaking && !synth.pending && !isPaused && !isLoading) {
                isPlaying = false;
                updatePlayButton();
                setStatus("⏸ Lecture arrêtée", 'paused');
            }
        }, 1000);
    }

    init();
});



    // ================================================================
    // GESTION DU THÈME JOUR/NUIT
    // ================================================================
    let isDarkMode = false;

    function toggleTheme() {
        isDarkMode = !isDarkMode;
        const body = document.body;
        const appContainer = document.querySelector('.app-container');
        const header = document.querySelector('.slide-header');
        const footer = document.querySelector('.slide-footer');
        const contentCards = document.querySelectorAll('.content-card');
        const noteBoxes = document.querySelectorAll('.note-box');
        const mathBlocks = document.querySelectorAll('.math-block');
        const buttons = document.querySelectorAll('.btn');
        const statusBadge = document.querySelector('.status-badge');
        const slideCounter = document.querySelector('.slide-counter');
        const autoIndicator = document.querySelector('.auto-indicator');
        const themeBtn = document.getElementById('themeToggle');

        if (isDarkMode) {
            // Mode nuit
            body.style.background = '#0b1120';
            body.style.color = '#f1f5f9';
            appContainer.style.background = 'linear-gradient(145deg, #0f172a 0%, #1e293b 100%)';
            header.style.background = 'rgba(15, 23, 42, 0.85)';
            footer.style.background = 'rgba(15, 23, 42, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.05)';
                card.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.08)';
                note.style.color = '#cbd5e1';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.25)';
                block.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#e2e8f0';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.12)';
                statusBadge.style.color = '#93bbfc';
            }
            if (slideCounter) {
                slideCounter.style.color = '#94a3b8';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#64748b';
            }
            if (themeBtn) {
                themeBtn.textContent = '☀️';
                themeBtn.title = 'Passer en mode jour';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#e2e8f0';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#e2e8f0';
                }
            });
        } else {
            // Mode jour (par défaut)
            body.style.background = '#f0f4f8';
            body.style.color = '#1a202c';
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
            header.style.background = 'rgba(255, 255, 255, 0.85)';
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.8)';
                card.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.12)';
                note.style.color = '#2c3e50';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.05)';
                block.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#2d3748';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
                statusBadge.style.color = '#2b6cb0';
            }
            if (slideCounter) {
                slideCounter.style.color = '#4a5568';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#718096';
            }
            if (themeBtn) {
                themeBtn.textContent = '🌓';
                themeBtn.title = 'Passer en mode nuit';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#2c3e50';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#2d3748';
                }
            });
        }
    }

    // Initialiser en mode jour
    document.addEventListener('DOMContentLoaded', function() {
        // Appliquer le mode jour par défaut
        const body = document.body;
        body.style.background = '#f0f4f8';
        body.style.color = '#1a202c';
        
        const appContainer = document.querySelector('.app-container');
        if (appContainer) {

        }

        }

            note.style.background = 'rgba(96, 165, 250, 0.12)';
            note.style.color = '#2c3e50';
        });
        
        document.querySelectorAll('.math-block').forEach(block => {
            block.style.background = 'rgba(0,0,0,0.05)';
            block.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.btn').forEach(btn => {

        });
        
        const statusBadge = document.querySelector('.status-badge');
        if (statusBadge) {
            statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
            statusBadge.style.color = '#2b6cb0';
        }
        
        const slideCounter = document.querySelector('.slide-counter');
        if (slideCounter) {
            slideCounter.style.color = '#4a5568';
        }
        
        const autoIndicator = document.querySelector('.auto-indicator');
        if (autoIndicator) {
            autoIndicator.style.color = '#718096';
        }
        
        document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
            if (!el.closest('.note-box')) {
                el.style.color = '#2c3e50';
            }
        });
        
        document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
            if (!el.closest('.note-box') && !el.closest('.math-block')) {
                el.style.color = '#2d3748';
            }
        });
        
        const themeBtn = document.getElementById('themeToggle');
        if (themeBtn) {
            themeBtn.textContent = '🌓';
            themeBtn.title = 'Passer en mode nuit';
        }
    });
</script>
