<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
 "matiere": "Biologie",
 "classe": "1ère technique",
 "sequence": "Séquence 2 - Éducation à la Santé et à l'Environnement",
 "anneeScolaire": "2025-2026",
 "exercices": [
   {
     "titre": "Exercice 1 : Les risques liés à l'activité professionnelle (Module 2)",
     "points": "6 pts",
     "enonce": "<p>Les risques professionnels sont nombreux dans les métiers de la restauration, de l'agriculture et du bâtiment. Lisez attentivement les situations suivantes et répondez aux questions.</p>",
     "questions": [
       {
         "question": "<p><strong>1.</strong> (2 pts) Un cuisinier se brûle gravement en renversant une marmite d'huile bouillante sur son bras gauche.</p><p><strong>a)</strong> (1 pt) Identifiez le type de risque professionnel dont il s'agit.</p>",
         "reponse": "<p>Il s'agit d'une <strong>brûlure</strong> (risque physique/thermique).</p>"
       },
       {
         "question": "<p><strong>b)</strong> (1 pt) Proposez deux mesures de prévention pour éviter ce type d'accident en cuisine.</p>",
         "reponse": "<p>Les mesures de prévention sont : <strong>1)</strong> Utiliser des gants de protection thermiques pour manipuler les récipients chauds ; <strong>2)</strong> Ne pas remplir les marmites à ras bord et les poser sur des surfaces stables.</p>"
       },
       {
         "question": "<p><strong>2.</strong> (2 pts) Un maçon transporte des sacs de ciment de 50 kg toute la journée. Il se plaint de douleurs intenses dans le bas du dos, qui irradient parfois jusqu'aux jambes.</p><p><strong>a)</strong> (1 pt) Quel risque professionnel ce maçon est-il en train de développer ?</p>",
         "reponse": "<p>Il développe une <strong>lombalgie</strong>, qui peut évoluer vers une <strong>sciatique</strong> si la douleur irradie dans les jambes.</p>"
       },
       {
         "question": "<p><strong>b)</strong> (1 pt) Expliquez la bonne technique pour soulever une charge lourde en toute sécurité.</p>",
         "reponse": "<p>La bonne technique consiste à : <strong>1)</strong> Fléchir les genoux en gardant le dos droit ; <strong>2)</strong> Utiliser les muscles des jambes pour soulever la charge ; <strong>3)</strong> Tenir la charge près du corps.</p>"
       },
       {
         "question": "<p><strong>3.</strong> (2 pts) Une employée de bureau travaille 8 heures par jour devant un ordinateur dans une mauvaise posture.</p><p><strong>a)</strong> (1 pt) Quels risques professionnels peut-elle développer ?</p>",
         "reponse": "<p>Elle peut développer une <strong>dorsalgie</strong> (douleur dorsale), une <strong>fatigue musculaire</strong> au niveau du cou et des épaules, ainsi que des troubles musculo-squelettiques.</p>"
       },
       {
         "question": "<p><strong>b)</strong> (1 pt) Proposez deux solutions pour prévenir ces risques au bureau.</p>",
         "reponse": "<p>Les solutions sont : <strong>1)</strong> Utiliser une chaise ergonomique avec un bon soutien lombaire ; <strong>2)</strong> Faire des pauses régulières et des étirements toutes les heures.</p>"
       }
     ]
   },
   {
     "titre": "Exercice 2 : La santé de la reproduction : VIH/SIDA (Module 2)",
     "points": "6 pts",
     "enonce": "<p>Le VIH/SIDA reste une préoccupation majeure de santé publique au Cameroun. La connaissance du virus, de son mode de transmission et de son évolution dans l'organisme est essentielle pour la prévention.</p>",
     "questions": [
       {
         "question": "<p><strong>1.</strong> (2 pts) Définissez le VIH et le SIDA.</p><p><strong>a)</strong> (1 pt) Qu'est-ce que le VIH ?</p>",
         "reponse": "<p>Le <strong>VIH</strong> (Virus de l'Immunodéficience Humaine) est un <strong>rétrovirus</strong> qui attaque le système immunitaire, en particulier les <strong>lymphocytes T4</strong> (CD4+).</p>"
       },
       {
         "question": "<p><strong>b)</strong> (1 pt) Qu'est-ce que le SIDA ?</p>",
         "reponse": "<p>Le <strong>SIDA</strong> (Syndrome d'Immunodéficience Acquise) est le <strong>stade avancé</strong> de l'infection par le VIH, caractérisé par une destruction massive du système immunitaire (< 200 lymphocytes CD4/mm³) et l'apparition de maladies opportunistes (tuberculose, pneumonies, cancers).</p>"
       },
       {
         "question": "<p><strong>2.</strong> (2 pts) Décrivez la structure du VIH et expliquez son mode de pénétration dans la cellule hôte.</p><p><strong>a)</strong> (1 pt) Quels sont les principaux composants du VIH ?</p>",
         "reponse": "<p>Le VIH est constitué : <strong>1)</strong> D'une <strong>enveloppe externe</strong> portant des glycoprotéines (gp120 et gp41) ; <strong>2)</strong> D'une <strong>capside</strong> (coque protéique) ; <strong>3)</strong> D'un génome composé de <strong>deux brins d'ARN</strong> ; <strong>4)</strong> De l'enzyme <strong>transcriptase inverse</strong>.</p>"
       },
       {
         "question": "<p><strong>b)</strong> (1 pt) Expliquez comment le VIH pénètre dans la cellule hôte.</p>",
         "reponse": "<p>La pénétration se fait en trois étapes : <strong>1)</strong> La <strong>fixation</strong> : la protéine <strong>gp120</strong> se fixe sur le récepteur <strong>CD4</strong> de la cellule ; <strong>2)</strong> La <strong>fusion</strong> : la protéine <strong>gp41</strong> permet la fusion des membranes ; <strong>3)</strong> La <strong>pénétration</strong> : le contenu viral (ARN et enzymes) entre dans le cytoplasme de la cellule.</p>"
       },
       {
         "question": "<p><strong>3.</strong> (2 pts) Décrivez les différentes phases de l'évolution du VIH dans l'organisme.</p><p><strong>a)</strong> (1 pt) Qu'est-ce que la primo-infection ?</p>",
         "reponse": "<p>La <strong>primo-infection</strong> est la première phase de l'infection, survenant <strong>2 à 6 semaines</strong> après la contamination. Le virus se multiplie activement, provoquant parfois des symptômes pseudo-grippaux (fièvre, fatigue, ganglions). La personne devient <strong>contagieuse</strong> sans le savoir.</p>"
       },
       {
         "question": "<p><strong>b)</strong> (1 pt) Expliquez la différence entre la phase asymptomatique et le stade SIDA.</p>",
         "reponse": "<p>La <strong>phase asymptomatique</strong> est une période de <strong>2 à 15 ans</strong> où la personne séropositive ne présente aucun symptôme, mais le virus continue de détruire les lymphocytes CD4. Le <strong>stade SIDA</strong> survient lorsque le taux de CD4 est très bas (< 200/mm³), permettant aux infections opportunistes de se développer.</p>"
       }
     ]
   },
   {
     "titre": "Exercice 3 : Gestion des déchets et pollution des sols (Module 3)",
     "points": "8 pts",
     "enonce": "<p>Dans un quartier de Douala, la mairie souhaite améliorer la gestion des déchets pour lutter contre la pollution des sols. Des habitants se plaignent de l'accumulation de déchets dans les rues.</p>",
     "questions": [
       {
         "question": "<p><strong>1.</strong> (2 pts) Identifiez les polluants ménagers présents dans les déchets du quartier.</p><p><strong>a)</strong> (1 pt) Citez trois types de polluants ménagers que l'on trouve couramment dans les déchets urbains.</p>",
         "reponse": "<p>Les polluants ménagers sont : <strong>1)</strong> Les <strong>déchets organiques</strong> (épluchures, restes alimentaires) ; <strong>2)</strong> Les <strong>plastiques</strong> (emballages, sachets) ; <strong>3)</strong> Les <strong>déchets dangereux</strong> (piles, solvants, produits chimiques).</p>"
       },
       {
         "question": "<p><strong>b)</strong> (1 pt) Expliquez comment les déchets plastiques polluent les sols.</p>",
         "reponse": "<p>Les plastiques se dégradent en <strong>microplastiques</strong> qui contaminent le sol. Ils modifient la <strong>structure du sol</strong>, réduisent sa <strong>perméabilité</strong> et peuvent être absorbés par les plantes, entrant ainsi dans la <strong>chaîne alimentaire</strong>.</p>"
       },
       {
         "question": "<p><strong>2.</strong> (3 pts) Analysez les conséquences de la pollution des sols par les déchets ménagers.</p><p><strong>a)</strong> (1 pt) Quelles sont les conséquences sur l'environnement ?</p>",
         "reponse": "<p>Les conséquences environnementales sont : <strong>1)</strong> La <strong>contamination des nappes phréatiques</strong> par lessivage des polluants ; <strong>2)</strong> La <strong>diminution de la fertilité des sols</strong> ; <strong>3)</strong> La <strong>prolifération des insectes et rongeurs</strong> vecteurs de maladies ; <strong>4)</strong> La <strong>destruction de la biodiversité</strong> du sol.</p>"
       },
       {
         "question": "<p><strong>b)</strong> (1 pt) Quelles sont les conséquences sur la santé humaine ?</p>",
         "reponse": "<p>Les conséquences sur la santé sont : <strong>1)</strong> Des <strong>maladies infectieuses</strong> (choléra, typhoïde) par contact avec les déchets ; <strong>2)</strong> Des <strong>intoxications</strong> par ingestion de polluants via les aliments cultivés sur des sols pollués ; <strong>3)</strong> Des <strong>maladies respiratoires</strong> liées aux émanations toxiques ; <strong>4)</strong> Des <strong>risques de cancers</strong> à long terme.</p>"
       },
       {
         "question": "<p><strong>c)</strong> (1 pt) Expliquez l'impact économique de la pollution des sols.</p>",
         "reponse": "<p>L'impact économique est important : <strong>1)</strong> <strong>Baisse de la productivité agricole</strong> (sols moins fertiles) ; <strong>2)</strong> <strong>Coûts de dépollution</strong> élevés pour les collectivités ; <strong>3)</strong> <strong>Perte de valeur des terrains</strong> pollués ; <strong>4)</strong> <strong>Réduction du tourisme</strong> dans les zones dégradées.</p>"
       },
       {
         "question": "<p><strong>3.</strong> (3 pts) Proposez des moyens de lutte contre la pollution des sols dans ce quartier.</p><p><strong>a)</strong> (1 pt) Quels équipements de collecte la mairie doit-elle installer ?</p>",
         "reponse": "<p>La mairie doit installer : <strong>1)</strong> Des <strong>poubelles publiques</strong> en nombre suffisant ; <strong>2)</strong> Des <strong>conteneurs de tri sélectif</strong> (couleurs différentes) pour séparer les déchets recyclables, organiques et autres ; <strong>3)</strong> Un système de <strong>collecte régulière</strong> avec des camions-bennes.</p>"
       },
       {
         "question": "<p><strong>b)</strong> (1 pt) Comment valoriser les déchets organiques du quartier ?</p>",
         "reponse": "<p>Les déchets organiques peuvent être valorisés par : <strong>1)</strong> Le <strong>compostage</strong> pour produire un engrais naturel ; <strong>2)</strong> La <strong>méthanisation</strong> pour produire du biogaz (énergie) ; <strong>3)</strong> L'<strong>alimentation animale</strong> pour les élevages locaux.</p>"
       },
       {
         "question": "<p><strong>c)</strong> (1 pt) Proposez deux mesures de sensibilisation pour les habitants du quartier.</p>",
         "reponse": "<p>Les mesures de sensibilisation sont : <strong>1)</strong> Organiser des <strong>campagnes d'information</strong> sur le tri des déchets et le compostage ; <strong>2)</strong> Mettre en place des <strong>clubs de santé environnementale</strong> dans les écoles et les quartiers pour former les jeunes aux bonnes pratiques.</p>"
       }
     ]
   }
 ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
