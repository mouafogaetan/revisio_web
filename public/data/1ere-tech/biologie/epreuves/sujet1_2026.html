<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Biologie",
  "classe": "1ère technique",
  "sequence": "Séquence 1",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Les transformations des aliments et la conservation des nutriments",
      "points": "4 pts",
      "enonce": "<div style='font-size:0.95rem; line-height:1.6; padding:10px;'><p>Lors de la préparation des repas, les aliments subissent des transformations physiques et chimiques.</p><p>Mme Ateba, une restauratrice à Douala, prépare chaque jour du riz, des légumes et de la viande pour ses clients. Elle constate que certains aliments perdent leur valeur nutritionnelle après la cuisson.</p><p><strong>Document :</strong> <br> - Les vitamines sont des molécules fragiles, sensibles à la chaleur et à l'oxygène.<br> - Les sels minéraux sont stables à la chaleur mais peuvent se dissoudre dans l'eau de cuisson.</p></div>",
      "questions": [
        {
          "question": "<p><strong>1.</strong> Cite deux vitamines sensibles à la chaleur. (0,5 pt)</p>",
          "reponse": "<p>Les vitamines B et C sont sensibles à la chaleur. (Les vitamines hydrosolubles en général)</p>"
        },
        {
          "question": "<p><strong>2.</strong> Explique pourquoi la cuisson à l'eau bouillante peut entraîner une perte importante de sels minéraux. Propose une méthode pour limiter cette perte. (1,5 pt)</p>",
          "reponse": "<p>La cuisson à l'eau bouillante entraîne une perte de sels minéraux car ces derniers se dissolvent dans l'eau de cuisson. Pour limiter cette perte, on peut : <br> - Cuire les aliments à la vapeur ou avec très peu d'eau.<br> - Réutiliser l'eau de cuisson pour préparer des sauces ou des bouillons.</p>"
        },
        {
          "question": "<p><strong>3.</strong> Quelles sont les transformations subies par les glucides et les protéines lors de la cuisson ? (2 pts)</p>",
          "reponse": "<p><strong>Glucides :</strong> Gélatinisation de l'amidon (absorption d'eau, gonflement) et caramélisation des sucres à haute température.<br><strong>Protéines :</strong> Dénaturation (modification de la structure des protéines, coagulation).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Les maladies d'origine alimentaire",
      "points": "4 pts",
      "enonce": "<div style='font-size:0.95rem; line-height:1.6; padding:10px;'><p>Au Cameroun, les maladies d'origine alimentaire sont fréquentes en raison des conditions de conservation et de préparation des aliments.</p><p><strong>Document :</strong> <br> - L'oxyurose est due à un ver parasite. Elle se caractérise par des démangeaisons anales, surtout la nuit.<br> - La salmonellose est une toxi-infection alimentaire provoquée par la bactérie <em>Salmonella</em>. Elle survient après la consommation d'œufs crus ou de volailles mal cuites.</p></div>",
      "questions": [
        {
          "question": "<p><strong>1.</strong> Distingue une parasitose alimentaire d'une toxi-infection alimentaire. (1 pt)</p>",
          "reponse": "<p>Une parasitose alimentaire est causée par un parasite (comme un ver) qui se développe dans l'organisme. Une toxi-infection alimentaire est causée par une bactérie ou une toxine présente dans l'aliment.</p>"
        },
        {
          "question": "<p><strong>2.</strong> Un enfant se plaint de démangeaisons anales intenses la nuit. Quelle maladie suspectes-tu ? Justifie ta réponse. (1 pt)</p>",
          "reponse": "<p>Je suspecte l'<strong>oxyurose</strong> car les démangeaisons anales nocturnes sont le symptôme caractéristique de cette parasitose.</p>"
        },
        {
          "question": "<p><strong>3.</strong> Quels sont les aliments les plus souvent impliqués dans la salmonellose ? Propose une mesure de prévention. (2 pts)</p>",
          "reponse": "<p>Les aliments les plus souvent impliqués sont les <strong>œufs crus et les volailles mal cuites</strong>. Pour prévenir la salmonellose, il faut bien cuire les œufs et les viandes de volaille, et respecter la chaîne du froid.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Les risques liés à l'activité professionnelle",
      "points": "3 pts",
      "enonce": "<div style='font-size:0.95rem; line-height:1.6; padding:10px;'><p>M. Essomba est maçon sur un chantier de construction. Il transporte chaque jour des sacs de ciment de 50 kg et travaille en hauteur sur des échafaudages. Il se plaint de douleurs lombaires et a déjà eu une fracture du poignet après une chute.</p></div>",
      "questions": [
        {
          "question": "<p><strong>1.</strong> Identifie les risques professionnels auxquels M. Essomba est exposé. (1 pt)</p>",
          "reponse": "<p>Les risques sont : <br> - <strong>Lombalgie</strong> et <strong>hernie discale</strong> (port de charges lourdes).<br> - <strong>Fractures</strong> et <strong>brûlures</strong> (chutes sur le chantier).</p>"
        },
        {
          "question": "<p><strong>2.</strong> Explique pourquoi le port de charges lourdes peut entraîner une hernie discale. (1 pt)</p>",
          "reponse": "<p>Le port de charges lourdes exerce une pression sur les disques intervertébraux, ce qui peut provoquer leur rupture ou leur déplacement, entraînant une hernie discale.</p>"
        },
        {
          "question": "<p><strong>3.</strong> Propose deux mesures pour améliorer la sécurité de M. Essomba sur son lieu de travail. (1 pt)</p>",
          "reponse": "<p>1. Utiliser des <strong>équipements de protection individuelle</strong> (casque, gants, chaussures de sécurité).<br>2. Former les travailleurs aux <strong>gestes et postures</strong> adaptés pour le port de charges.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Lutte contre la pollution des sols",
      "points": "4 pts",
      "enonce": "<div style='font-size:0.95rem; line-height:1.6; padding:10px;'><p>Dans un quartier de Yaoundé, les habitants jettent leurs déchets dans une décharge sauvage. Les pluies lessivent ces déchets et contaminent le sol et les eaux souterraines. Des cas de maladies (diarrhées, infections cutanées) sont signalés.</p></div>",
      "questions": [
        {
          "question": "<p><strong>1.</strong> Cite deux polluants ménagers que l'on peut trouver dans cette décharge sauvage. (1 pt)</p>",
          "reponse": "<p>1. <strong>Déchets organiques</strong> (restes alimentaires).<br>2. <strong>Plastiques</strong> (sachets, bouteilles).</p>"
        },
        {
          "question": "<p><strong>2.</strong> Explique les conséquences de cette pollution sur la santé des populations et sur l'environnement. (1,5 pt)</p>",
          "reponse": "<p>Sur la santé : <strong>maladies infectieuses</strong> (diarrhées, infections), <strong>contamination des aliments</strong> (plantes cultivées dans un sol pollué).<br>Sur l'environnement : <strong>perte de fertilité des sols</strong>, <strong>pollution des nappes phréatiques</strong>, émission de gaz à effet de serre.</p>"
        },
        {
          "question": "<p><strong>3.</strong> Propose un plan d'action pour lutter contre cette pollution des sols. (1,5 pt)</p>",
          "reponse": "<p>1. <strong>Prévention :</strong> Sensibiliser les populations à la réduction et au tri des déchets.<br>2. <strong>Gestion durable :</strong> Mettre en place des <strong>décharges contrôlées</strong> et un système de <strong>collecte régulière</strong> des déchets.<br>3. <strong>Dépollution :</strong> Nettoyer la décharge sauvage et traiter les sols contaminés (phytoremédiation par exemple).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 5 : La santé de la reproduction",
      "points": "5 pts",
      "enonce": "<div style='font-size:0.95rem; line-height:1.6; padding:10px;'><p>La santé de la reproduction est essentielle pour le bien-être des individus et des familles. Elle comprend la connaissance des cycles sexuels, des troubles associés et la prévention des infections sexuellement transmissibles (IST), dont le VIH/SIDA.</p></div>",
      "questions": [
        {
          "question": "<p><strong>1.</strong> Définis le cycle menstruel chez la femme en citant ses deux principales phases. (1 pt)</p>",
          "reponse": "<p>Le cycle menstruel est une période d'environ 28 jours qui prépare l'organisme à une éventuelle grossesse. Ses deux phases principales sont la <strong>phase folliculaire</strong> (maturation de l'ovule) et la <strong>phase lutéale</strong> (préparation de l'utérus).</p>"
        },
        {
          "question": "<p><strong>2.</strong> Une femme présente des règles douloureuses et abondantes. Quels troubles du cycle sexuel peut-elle avoir ? (1 pt)</p>",
          "reponse": "<p>Elle peut souffrir de <strong>dysménorrhée</strong> (règles douloureuses) et de <strong>ménorragies</strong> (règles abondantes).</p>"
        },
        {
          "question": "<p><strong>3.</strong> Explique comment le VIH pénètre dans l'organisme et quelles sont les cellules ciblées par ce virus. (1,5 pt)</p>",
          "reponse": "<p>Le VIH pénètre par les <strong>muqueuses</strong> ou par le <strong>sang</strong> lors de rapports sexuels non protégés, du partage de seringues ou de la transmission mère-enfant. Il cible les <strong>lymphocytes T4</strong>, des cellules clés du système immunitaire.</p>"
        },
        {
          "question": "<p><strong>4.</strong> Décris l'évolution du VIH dans l'organisme en citant les deux premières phases de l'infection. (1,5 pt)</p>",
          "reponse": "<p>Phase 1 : <strong>Primo-infection</strong> (2 à 6 semaines après la contamination), avec des symptômes grippaux.<br>Phase 2 : <strong>Séropositivité</strong> (phase asymptomatique), pendant laquelle la personne peut transmettre le virus sans le savoir.</p>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
