<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
 "matiere": "Biologie",
 "classe": "1ère technique",
 "sequence": "Séquence 5 - Évaluation sommative du Module 2 (Santé) et Module 3 (Environnement)",
 "anneeScolaire": "2025-2026",
 "exercices": [
   {
     "titre": "Exercice 1 : Maladies d'origine alimentaire et risques professionnels (Module 2)",
     "points": "6 pts",
     "enonce": "<p>Dans un restaurant de Douala, plusieurs clients ont présenté des symptômes après avoir consommé du poulet rôti. Par ailleurs, le cuisinier principal se plaint de douleurs lombaires.</p>",
     "questions": [
       {
         "question": "<p><strong>1.</strong> (2 pts) Après analyse, on suspecte une toxi-infection alimentaire.</p><p><strong>a)</strong> (1 pt) Identifiez deux toxi-infections alimentaires possibles et nommez les bactéries responsables.</p>",
         "reponse": "<p>Les deux toxi-infections possibles sont : <strong>1) La salmonellose</strong> causée par la bactérie <strong>Salmonella</strong> ; <strong>2) La toxi-infection staphylococcique</strong> causée par la bactérie <strong>Staphylococcus aureus</strong>.</p>"
       },
       {
         "question": "<p><strong>b)</strong> (1 pt) Expliquez pourquoi la salmonellose est une <em>infection</em> alimentaire tandis que la toxi-infection staphylococcique est une <em>intoxication</em> alimentaire.</p>",
         "reponse": "<p>La <strong>salmonellose</strong> est une <strong>infection</strong> car ce sont les bactéries vivantes qui se multiplient dans l'organisme après ingestion. La <strong>toxi-infection staphylococcique</strong> est une <strong>intoxication</strong> car ce sont les <strong>toxines</strong> produites par les bactéries dans l'aliment avant consommation qui provoquent les symptômes (incubation très courte de 1 à 6 heures).</p>"
       },
       {
         "question": "<p><strong>2.</strong> (2 pts) Le cuisinier du restaurant se plaint de douleurs intenses dans le bas du dos.</p><p><strong>a)</strong> (1 pt) Nommez deux pathologies professionnelles qu'il pourrait développer et expliquez leur cause.</p>",
         "reponse": "<p>Il pourrait développer : <strong>1) Une lombalgie</strong> (douleur lombaire) due au port de charges lourdes avec le dos rond ; <strong>2) Une sciatique</strong> (douleur irradiant dans la jambe) due à une compression du nerf sciatique par une hernie discale.</p>"
       },
       {
         "question": "<p><strong>b)</strong> (1 pt) Proposez deux mesures de prévention pour éviter ces risques dans son métier.</p>",
         "reponse": "<p>Les mesures de prévention sont : <strong>1)</strong> Fléchir les genoux et garder le dos droit pour soulever les charges (chaudrons, sacs) ; <strong>2)</strong> Alterner les positions de travail (debout/assis) et faire des pauses avec des étirements du dos.</p>"
       },
       {
         "question": "<p><strong>3.</strong> (2 pts) Les clients du restaurant ont présenté des symptômes de toxi-infection alimentaire (vomissements, diarrhée, fièvre).</p><p><strong>a)</strong> (1 pt) Distinguez les modes de transmission des <strong>parasitoses alimentaires</strong> (oxyurose, ténia, ascaridiose) de ceux des <strong>toxi-infections</strong>.</p>",
         "reponse": "<p>Les <strong>parasitoses</strong> se transmettent par ingestion d'<strong>œufs ou de larves</strong> présents dans les aliments (légumes non lavés, viande insuffisamment cuite). Les <strong>toxi-infections</strong> se transmettent par ingestion de <strong>bactéries ou de leurs toxines</strong> dans des aliments contaminés par manque d'hygiène ou mauvaise conservation.</p>"
       },
       {
         "question": "<p><strong>b)</strong> (1 pt) Quelles mesures d'hygiène aurait-on dû respecter pour éviter cette toxi-infection alimentaire ?</p>",
         "reponse": "<p>Les mesures d'hygiène sont : <strong>1)</strong> Bien cuire la viande (à cœur à $70^\\circ C$) ; <strong>2)</strong> Conserver les aliments au froid ($+4^\\circ C$) ; <strong>3)</strong> Se laver les mains et nettoyer les ustensiles ; <strong>4)</strong> Éviter la contamination croisée entre aliments crus et cuits.</p>"
       }
     ]
   },
   {
     "titre": "Exercice 2 : La santé de la reproduction (Module 2)",
     "points": "6 pts",
     "enonce": "<p>La santé de la reproduction est un sujet important pour les jeunes. Abordons les cycles sexuels et le VIH/SIDA.</p>",
     "questions": [
       {
         "question": "<p><strong>1.</strong> (2 pts) Questions sur les cycles sexuels.</p><p><strong>a)</strong> (1 pt) Définissez ce qu'est un <strong>cycle sexuel</strong> chez la femme et précisez sa durée moyenne.</p>",
         "reponse": "<p>Un <strong>cycle sexuel</strong> est une série de modifications physiologiques périodiques se produisant dans l'appareil génital féminin, sous l'influence des hormones, pour préparer l'organisme à une éventuelle grossesse. Sa durée moyenne est de <strong>28 jours</strong>.</p>"
       },
       {
         "question": "<p><strong>b)</strong> (1 pt) Nommez et décrivez brièvement deux troubles liés aux cycles sexuels.</p>",
         "reponse": "<p>Les troubles sont : <strong>1) La dysménorrhée</strong> : douleurs menstruelles intenses (crampes, douleurs lombaires) ; <strong>2) La ménorragie</strong> : règles très abondantes et/ou prolongées (plus de 7 jours) pouvant entraîner une anémie. <strong>3) L'aménorrhée</strong> : absence de règles.</p>"
       },
       {
         "question": "<p><strong>2.</strong> (2 pts) Questions sur le VIH/SIDA.</p><p><strong>a)</strong> (1 pt) Qu'est-ce que le <strong>VIH</strong> et qu'est-ce que le <strong>SIDA</strong> ?</p>",
         "reponse": "<p>Le <strong>VIH</strong> (Virus de l'Immunodéficience Humaine) est un <strong>rétrovirus</strong> qui attaque le système immunitaire. Le <strong>SIDA</strong> (Syndrome d'Immunodéficience Acquise) est le <strong>stade avancé</strong> de l'infection, caractérisé par une destruction massive des lymphocytes CD4 (< 200/mm³) et l'apparition de maladies opportunistes (tuberculose, pneumonies, cancers).</p>"
       },
       {
         "question": "<p><strong>b)</strong> (1 pt) Expliquez l'évolution du VIH dans l'organisme : <strong>primo-infection</strong> et <strong>séropositivité</strong>.</p>",
         "reponse": "<p>La <strong>primo-infection</strong> survient 2 à 6 semaines après la contamination : le virus se multiplie activement, pouvant provoquer des symptômes pseudo-grippaux. La <strong>séropositivité</strong> est la phase où les tests de dépistage deviennent positifs (présence d'anticorps). La personne peut rester asymptomatique pendant des années avant de développer le SIDA.</p>"
       },
       {
         "question": "<p><strong>3.</strong> (2 pts) Le VIH, sa structure et son mode d'action.</p><p><strong>a)</strong> (1 pt) Décrivez la structure du VIH.</p>",
         "reponse": "<p>Le VIH est constitué : <strong>1)</strong> D'une <strong>enveloppe externe</strong> avec des glycoprotéines (gp120, gp41) ; <strong>2)</strong> D'une <strong>capside</strong> protéique ; <strong>3)</strong> D'un génome composé de <strong>deux brins d'ARN</strong> ; <strong>4)</strong> De l'enzyme <strong>transcriptase inverse</strong>.</p>"
       },
       {
         "question": "<p><strong>b)</strong> (1 pt) Expliquez comment le VIH pénètre dans la cellule hôte.</p>",
         "reponse": "<p>Le VIH pénètre en trois étapes : <strong>1)</strong> <strong>Fixation</strong> : la protéine <strong>gp120</strong> se fixe sur le récepteur <strong>CD4</strong> de la cellule ; <strong>2)</strong> <strong>Fusion</strong> : la protéine <strong>gp41</strong> fusionne les membranes ; <strong>3)</strong> <strong>Pénétration</strong> : le contenu viral (ARN et enzymes) entre dans le cytoplasme de la cellule.</p>"
       }
     ]
   },
   {
     "titre": "Exercice 3 : Gestion des déchets et pollution des sols (Module 3)",
     "points": "8 pts",
     "enonce": "<p>Dans un quartier de Bafoussam, la mairie veut lutter contre la pollution des sols causée par les déchets ménagers. Une enquête révèle des dépôts sauvages de déchets alimentaires, plastiques et eaux usées.</p>",
     "questions": [
       {
         "question": "<p><strong>1.</strong> (2 pts) Identification des polluants.</p><p><strong>a)</strong> (1 pt) Citez trois types de <strong>polluants ménagers</strong> présents dans les déchets du quartier.</p>",
         "reponse": "<p>Les polluants ménagers sont : <strong>1)</strong> Les <strong>déchets organiques</strong> (épluchures, restes alimentaires) ; <strong>2)</strong> Les <strong>plastiques</strong> (emballages, sachets, bouteilles) ; <strong>3)</strong> Les <strong>eaux usées</strong> (contenant détergents, bactéries, produits chimiques).</p>"
       },
       {
         "question": "<p><strong>b)</strong> (1 pt) Expliquez comment les déchets plastiques polluent durablement les sols.</p>",
         "reponse": "<p>Les plastiques ne se décomposent pas facilement ; ils se fragmentent en <strong>microplastiques</strong> qui persistent dans le sol. Ils modifient la <strong>structure</strong> et la <strong>perméabilité</strong> du sol, contaminent les eaux souterraines et peuvent être absorbés par les plantes, entrant dans la <strong>chaîne alimentaire</strong>.</p>"
       },
       {
         "question": "<p><strong>2.</strong> (3 pts) Conséquences de la pollution des sols.</p><p><strong>a)</strong> (1 pt) Quelles sont les conséquences sur la <strong>santé humaine</strong> ?</p>",
         "reponse": "<p>Les conséquences sur la santé sont : <strong>1)</strong> <strong>Maladies infectieuses</strong> (choléra, diarrhées, typhoïde) par contact avec les déchets ou les eaux usées ; <strong>2)</strong> <strong>Intoxications</strong> par ingestion de polluants (métaux lourds, pesticides) via les aliments cultivés sur sols pollués ; <strong>3)</strong> <strong>Maladies respiratoires</strong> liées aux émanations toxiques et aux poussières ; <strong>4)</strong> <strong>Risques de cancers</strong> à long terme.</p>"
       },
       {
         "question": "<p><strong>b)</strong> (1 pt) Quelles sont les conséquences sur <strong>l'environnement</strong> ?</p>",
         "reponse": "<p>Les conséquences sur l'environnement sont : <strong>1)</strong> <strong>Contamination des nappes phréatiques</strong> par lessivage des polluants ; <strong>2)</strong> <strong>Perte de fertilité des sols</strong> ; <strong>3)</strong> <strong>Prolifération d'insectes et de rongeurs</strong> ; <strong>4)</strong> <strong>Destruction de la biodiversité</strong> du sol (micro-organismes, vers).</p>"
       },
       {
         "question": "<p><strong>c)</strong> (1 pt) Quel est l'<strong>impact économique</strong> de cette pollution pour la commune ?</p>",
         "reponse": "<p>L'impact économique inclut : <strong>1)</strong> <strong>Coûts de dépollution</strong> et de gestion des déchets élevés ; <strong>2)</strong> <strong>Baisse de la productivité agricole</strong> dans les zones touchées ; <strong>3)</strong> <strong>Perte de valeur des terrains</strong> pollués ; <strong>4)</strong> <strong>Réduction du tourisme</strong> et des activités économiques.</p>"
       },
       {
         "question": "<p><strong>3.</strong> (3 pts) Propositions de lutte contre la pollution des sols.</p><p><strong>a)</strong> (1 pt) Quels <strong>équipements de collecte et de stockage</strong> la mairie doit-elle installer ?</p>",
         "reponse": "<p>La mairie doit installer : <strong>1)</strong> Des <strong>poubelles publiques</strong> pour la collecte régulière ; <strong>2)</strong> Des <strong>conteneurs de tri sélectif</strong> (différentes couleurs) pour séparer les déchets organiques, plastiques, verre et cartons ; <strong>3)</strong> Un <strong>système de collecte régulière</strong> avec camions-bennes ; <strong>4)</strong> Un <strong>site de stockage contrôlé</strong> avec étanchéité pour éviter la contamination des nappes.</p>"
       },
       {
         "question": "<p><strong>b)</strong> (1 pt) Proposez deux méthodes de <strong>traitement</strong> des déchets adaptées à ce quartier.</p>",
         "reponse": "<p>Les méthodes de traitement sont : <strong>1)</strong> Le <strong>compostage</strong> des déchets organiques pour produire de l'engrais naturel ; <strong>2)</strong> Le <strong>recyclage</strong> des plastiques, verres et métaux (via des filières de récupération). On peut aussi envisager la <strong>méthanisation</strong> des déchets organiques pour produire du biogaz.</p>"
       },
       {
         "question": "<p><strong>c)</strong> (1 pt) Proposez un programme de <strong>sensibilisation</strong> pour les habitants et les commerçants du quartier.</p>",
         "reponse": "<p>Le programme de sensibilisation doit inclure : <strong>1)</strong> Des <strong>campagnes d'information</strong> sur le tri des déchets et les nuisances des dépôts sauvages ; <strong>2)</strong> Des <strong>formations</strong> au compostage domestique ; <strong>3)</strong> La mise en place de <strong>clubs environnementaux</strong> dans les écoles ; <strong>4)</strong> Des <strong>récompenses</strong> pour les quartiers les plus propres ; <strong>5)</strong> Des <strong>panneaux de sensibilisation</strong> aux abords des marchés et lieux publics.</p>"
       }
     ]
   }
 ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
