<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Biologie",
  "classe": "1ère technique",
  "sequence": "Séquence 3",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Identification des polluants ménagers",
      "points": "4 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; font-size: 16px; line-height: 1.6; color: #333; padding: 10px;'><p>Dans le cadre de la lutte contre la pollution des sols, un groupe d'élèves de 1<sup>ère</sup> technique mène une enquête sur les déchets domestiques dans leur quartier à Douala.</p><p>Ils relèvent la présence des déchets suivants dans les poubelles des ménages :</p><ul style='list-style-type: disc; padding-left: 20px;'><li>Bouteilles en plastique</li><li>Épluchures de manioc et de banane</li><li>Piles usagées</li><li>Restes de poisson et de viande</li><li>Huile de vidange</li><li>Détergents ménagers</li><li>Emballages en carton</li><li>Pesticides périmés</li></ul></div>",
      "questions": [
        {
          "question": "<div style='font-family: Arial, sans-serif; font-size: 16px; line-height: 1.6; color: #333; padding: 10px;'><p>1) Classez ces déchets en deux catégories : <strong>polluants biodégradables</strong> et <strong>polluants non biodégradables ou toxiques</strong> pour le sol.</p></div>",
          "reponse": "<div style='font-family: Arial, sans-serif; font-size: 16px; line-height: 1.6; color: #333; padding: 10px;'><p><strong>Polluants biodégradables :</strong></p><ul style='list-style-type: disc; padding-left: 20px;'><li>Épluchures de manioc et de banane</li><li>Restes de poisson et de viande</li><li>Emballages en carton</li></ul><p><strong>Polluants non biodégradables ou toxiques :</strong></p><ul style='list-style-type: disc; padding-left: 20px;'><li>Bouteilles en plastique</li><li>Piles usagées</li><li>Huile de vidange</li><li>Détergents ménagers</li><li>Pesticides périmés</li></ul></div>"
        },
        {
          "question": "<div style='font-family: Arial, sans-serif; font-size: 16px; line-height: 1.6; color: #333; padding: 10px;'><p>2) Expliquez pourquoi les piles usagées et les pesticides sont particulièrement dangereux pour les sols.</p></div>",
          "reponse": "<div style='font-family: Arial, sans-serif; font-size: 16px; line-height: 1.6; color: #333; padding: 10px;'><p>Les piles usagées contiennent des métaux lourds (mercure, cadmium, plomb) qui sont toxiques et peuvent contaminer les sols pendant des siècles, rendant les terres impropres à la culture et polluant les nappes phréatiques. Les pesticides sont des substances chimiques conçues pour tuer des organismes vivants ; ils perturbent l'écosystème du sol en détruisant les micro-organismes bénéfiques et peuvent persister longtemps dans l'environnement, contaminant la chaîne alimentaire.</p></div>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Analyse des conséquences de la pollution",
      "points": "6 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; font-size: 16px; line-height: 1.6; color: #333; padding: 10px;'><p>Dans le quartier de Nkolbisson à Yaoundé, une décharge sauvage s'est installée à proximité d'un cours d'eau et de jardins potagers. Les habitants se plaignent de mauvaises odeurs, de l'apparition de rats et de mouches, et remarquent que les légumes de leurs jardins poussent moins bien qu'avant.</p></div>",
      "questions": [
        {
          "question": "<div style='font-family: Arial, sans-serif; font-size: 16px; line-height: 1.6; color: #333; padding: 10px;'><p>1) Analysez les conséquences de cette pollution des sols sur l'environnement et la santé des populations locales.</p></div>",
          "reponse": "<div style='font-family: Arial, sans-serif; font-size: 16px; line-height: 1.6; color: #333; padding: 10px;'><p><strong>Conséquences environnementales :</strong></p><ul style='list-style-type: disc; padding-left: 20px;'><li>Contamination des sols par les déchets organiques et chimiques</li><li>Pollution du cours d'eau par ruissellement des eaux de pluie chargées de polluants</li><li>Déséquilibre de l'écosystème du sol (disparition de la faune et flore du sol)</li><li>Apparition de nuisibles (rats, mouches, moustiques)</li></ul><p><strong>Conséquences sanitaires :</strong></p><ul style='list-style-type: disc; padding-left: 20px;'><li>Risques de maladies hydriques (typhoïde, choléra, diarrhées)</li><li>Contamination des légumes par les métaux lourds et agents pathogènes</li><li>Problèmes respiratoires liés aux mauvaises odeurs</li><li>Propagation de maladies vectorielles par les rongeurs et insectes</li></ul></div>"
        },
        {
          "question": "<div style='font-family: Arial, sans-serif; font-size: 16px; line-height: 1.6; color: #333; padding: 10px;'><p>2) Expliquez le lien possible entre cette décharge sauvage et la baisse de productivité des jardins potagers.</p></div>",
          "reponse": "<div style='font-family: Arial, sans-serif; font-size: 16px; line-height: 1.6; color: #333; padding: 10px;'><p>La baisse de productivité peut s'expliquer par plusieurs facteurs :</p><ul style='list-style-type: disc; padding-left: 20px;'><li>Les substances toxiques des déchets (métaux lourds, produits chimiques) inhibent la croissance des plantes.</li><li>Le déséquilibre du pH du sol rend les nutriments moins disponibles pour les plantes.</li><li>La présence de polluants perturbe la vie microbienne du sol nécessaire à la décomposition de la matière organique et à la nutrition des plantes.</li><li>Les eaux de ruissellement polluées peuvent asphyxier les racines et apporter des agents pathogènes.</li></ul></div>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Proposition de solutions",
      "points": "6 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; font-size: 16px; line-height: 1.6; color: #333; padding: 10px;'><p>La commune de Bafoussam souhaite mettre en place un plan de lutte contre la pollution des sols causée par les déchets ménagers. Vous êtes consultant en environnement et devez proposer des solutions durables pour ce problème.</p></div>",
      "questions": [
        {
          "question": "<div style='font-family: Arial, sans-serif; font-size: 16px; line-height: 1.6; color: #333; padding: 10px;'><p>1) Proposez un plan d'action complet comprenant des mesures préventives, des mesures curatives et des mesures éducatives.</p></div>",
          "reponse": "<div style='font-family: Arial, sans-serif; font-size: 16px; line-height: 1.6; color: #333; padding: 10px;'><p><strong>Mesures préventives :</strong></p><ul style='list-style-type: disc; padding-left: 20px;'><li>Mettre en place un système de collecte sélective des déchets (bacs de couleurs différentes) dans toute la ville</li><li>Instaurer une taxe incitative (moins on produit de déchets, moins on paie)</li><li>Promouvoir le compostage domestique pour les déchets organiques</li><li>Interdire les sacs plastiques non biodégradables</li></ul><p><strong>Mesures curatives :</strong></p><ul style='list-style-type: disc; padding-left: 20px;'><li>Créer une décharge contrôlée avec système d'étanchéité et de collecte des lixiviats</li><li>Mettre en place des unités de traitement des déchets (compostage industriel, incinération des déchets médicaux)</li><li>Dépolluer les sites contaminés (phytoremédiation, excavation)</li><li>Valoriser les déchets organiques par méthanisation (production de biogaz)</li></ul><p><strong>Mesures éducatives :</strong></p><ul style='list-style-type: disc; padding-left: 20px;'><li>Lancer des campagnes de sensibilisation dans les écoles et les quartiers</li><li>Former des ambassadeurs de l'environnement dans chaque quartier</li><li>Organiser des journées de nettoyage communautaire</li><li>Intégrer l'éducation environnementale dans les programmes scolaires</li></ul></div>"
        },
        {
          "question": "<div style='font-family: Arial, sans-serif; font-size: 16px; line-height: 1.6; color: #333; padding: 10px;'><p>2) Quel est le rôle des populations locales dans la réussite de ce plan de lutte ? Justifiez.</p></div>",
          "reponse": "<div style='font-family: Arial, sans-serif; font-size: 16px; line-height: 1.6; color: #333; padding: 10px;'><p>Les populations jouent un rôle central car la pollution des sols est souvent le résultat de comportements individuels (jets de déchets sauvages, utilisation de produits chimiques, etc.). Leur participation est essentielle à plusieurs niveaux :</p><ul style='list-style-type: disc; padding-left: 20px;'><li>Adopter des gestes écoresponsables (tri des déchets, compostage)</li><li>Participer aux actions de nettoyage et de surveillance</li><li>Sensibiliser leur entourage</li><li>Signaler les dépôts sauvages aux autorités</li></ul><p>Sans l'adhésion des populations, aucune politique de lutte ne peut être efficace à long terme.</p></div>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Étude de cas - Pollution d'un périmètre maraîcher",
      "points": "4 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; font-size: 16px; line-height: 1.6; color: #333; padding: 10px;'><p>Dans le lit de la rivière Mfoundi à Yaoundé, des populations cultivent des légumes (laitues, tomates, choux) vendus sur les marchés de la ville. Des analyses ont révélé une contamination des sols et des eaux par des métaux lourds (plomb, cadmium) et des bactéries pathogènes (salmonelles, E. coli).</p></div>",
      "questions": [
        {
          "question": "<div style='font-family: Arial, sans-serif; font-size: 16px; line-height: 1.6; color: #333; padding: 10px;'><p>1) Identifiez les sources possibles de cette pollution et évaluez ses conséquences sur la santé des consommateurs.</p></div>",
          "reponse": "<div style='font-family: Arial, sans-serif; font-size: 16px; line-height: 1.6; color: #333; padding: 10px;'><p><strong>Sources possibles de pollution :</strong></p><ul style='list-style-type: disc; padding-left: 20px;'><li>Rejets d'eaux usées (domestiques et industrielles) non traitées dans la rivière</li><li>Lessivage des sols pollués par les déchets solides en amont</li><li>Utilisation d'engrais chimiques et de pesticides non contrôlés</li><li>Dépôts sauvages de déchets dans les zones humides</li></ul><p><strong>Conséquences sur la santé des consommateurs :</strong></p><ul style='list-style-type: disc; padding-left: 20px;'><li><strong>Métaux lourds :</strong> troubles neurologiques (plomb), lésions rénales (cadmium)</li><li><strong>Bactéries pathogènes :</strong> toxi-infections alimentaires (salmonelles), infections digestives sévères (E. coli)</li><li><strong>Effets cumulatifs :</strong> accumulation des toxines dans l'organisme, augmentation du risque de cancers à long terme</li></ul></div>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
