<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Présentation mobile</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' },
            options: { skipHtmlTypes: 'script' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 500px;
        margin: 0 auto;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    .slide-header {
        flex-shrink: 0;
        padding: 18px 16px 10px 16px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        z-index: 10;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .slide-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
    }

    .content-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 18px 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        flex-shrink: 0;
    }

    .content-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .content-card li {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        line-height: 1.5;
    }

    .content-card li:last-child {
        border-bottom: none;
    }

    .bullet-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
    }

    .math-block {
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        overflow-x: auto;
        flex-shrink: 0;
        margin: 4px 0;
    }

    .math-block .math {
        font-size: 1.2rem;
        color: #e2e8f0;
    }

    .note-box {
        background: rgba(96, 165, 250, 0.08);
        border-left: 4px solid #60a5fa;
        padding: 12px 16px;
        border-radius: 12px;
        font-style: italic;
        font-size: 0.9rem;
        color: #cbd5e1;
        flex-shrink: 0;
    }

    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        border-radius: 0;
        flex-direction: column;
    }

    .loading-card {
        background: #1e293b;
        padding: 32px 28px;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #334155;
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px auto;
    }

    .loading-text {
        font-weight: 600;
        font-size: 1.1rem;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    .loading-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 16px;
    }
    .loading-progress {
        height: 3px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        animation: loadingProgress 30s ease-out forwards;
    }

    .loading-timeout {
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 12px;
    }

    .btn-cancel-loading {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 40px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #f87171;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }

    .btn-cancel-loading:active {
        transform: scale(0.94);
        background: rgba(239, 68, 68, 0.25);
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
    }

    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .slide-counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255,255,255,0.05);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(255,255,255,0.04);
    }

    .status-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 30px;
        background: rgba(96, 165, 250, 0.12);
        color: #93bbfc;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
    }

    .status-badge .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: pulse-dot 1.2s infinite;
        flex-shrink: 0;
    }

    .status-badge.idle .dot {
        animation: none;
        background: #64748b;
    }
    .status-badge.speaking .dot {
        background: #34d399;
        animation: pulse-dot 0.8s infinite;
    }
    .status-badge.error .dot {
        background: #f87171;
        animation: none;
    }
    .status-badge.paused .dot {
        animation: none;
        background: #fbbf24;
    }
    .status-badge.waiting .dot {
        animation: pulse-dot 1.5s infinite;
        background: #fbbf24;
    }
    .status-badge.loading .dot {
        animation: pulse-dot 0.5s infinite;
        background: #60a5fa;
    }

    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.7); }
    }

    .footer-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(255,255,255,0.1);
    }

    .btn-secondary {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-play {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
        min-width: 80px;
        justify-content: center;
    }
    .btn-play:active {
        background: rgba(52, 211, 153, 0.25);
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
    }

    .auto-indicator {
        font-size: 0.65rem;
        color: #64748b;
        text-align: center;
        letter-spacing: 0.3px;
        padding: 2px 0;
    }

    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.2rem;
        }
        .content-card li {
            font-size: 0.9rem;
            padding: 8px 0;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .btn-play {
            min-width: 60px;
        }
        .footer-buttons {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
        .loading-card {
            padding: 20px 16px;
        }
        .math-block .math {
            font-size: 1rem;
        }
    }

    @media (min-width: 600px) {
        .app-container {
            max-width: 480px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
        .loading-overlay {
            border-radius: 32px;
        }
    }

    /* Mode jour (par défaut) */
    html, body {
        background: #f0f4f8 !important;
        color: #1a202c !important;
    }
    .app-container {
        background: linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%) !important;
    }
    .slide-header {
        background: rgba(255, 255, 255, 0.85) !important;
        border-bottom: 1px solid rgba(0,0,0,0.08) !important;
    }
    .slide-header h1 {
        background: linear-gradient(135deg, #2b6cb0, #6b46c1) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        background-clip: text !important;
    }
    .slide-footer {
        background: rgba(255, 255, 255, 0.9) !important;
        border-top: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card {
        background: rgba(255,255,255,0.8) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card li {
        border-bottom: 1px solid rgba(0,0,0,0.05) !important;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.12) !important;
        border-left: 4px solid #4299e1 !important;
        color: #2c3e50 !important;
    }
    .math-block {
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .math-block .math {
        color: #2d3748 !important;
    }
    .slide-counter {
        color: #4a5568 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .status-badge {
        background: rgba(96, 165, 250, 0.15) !important;
        color: #2b6cb0 !important;
        border: 1px solid rgba(96, 165, 250, 0.15) !important;
    }
    .btn {
        color: #2d3748 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .btn-secondary {
        background: rgba(0,0,0,0.04) !important;
        border-color: rgba(0,0,0,0.08) !important;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15) !important;
        border-color: rgba(52, 211, 153, 0.2) !important;
        color: #38a169 !important;
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15) !important;
        border-color: rgba(251, 191, 36, 0.2) !important;
        color: #d69e2e !important;
    }
    .auto-indicator {
        color: #718096 !important;
    }
    .loading-card {
        background: #ffffff !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .loading-text {
        color: #1a202c !important;
    }
    .loading-sub {
        color: #4a5568 !important;
    }
</style>
</head>
<body>

<div class="app-container">

    <header class="slide-header">
        <h1 id="slideTitle">Chargement...</h1>
    </header>

    <main class="slide-body" id="slideBody"></main>

    <!-- LOADING OVERLAY AVEC BOUTON ANNULER -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Préparation vocale...</div>
            <div class="loading-sub" id="loadingSub">Synthèse en cours</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loadingProgressBar"></div>
            </div>
            <div class="loading-timeout" id="loadingTimeout">⏱️ 30 secondes maximum</div>
            <button class="btn-cancel-loading" id="cancelLoadingBtn">
                <span>✕</span> Annuler
            </button>
        </div>
    </div>

    <footer class="slide-footer">
        <div class="footer-top">
            <span class="slide-counter" id="slideCounter">1 / 3</span>
            <span class="status-badge idle" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">Prêt</span>
            </span>
        </div>

        <div class="footer-buttons">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-secondary" id="replayBtn">
                <span class="btn-icon">🔁</span> <span class="btn-label">Relire</span>
            </button>
            <button class="btn btn-play" id="playBtn">
                <span class="btn-icon">▶</span> <span class="btn-label">Play</span>
            </button>
        </div>

        <div class="auto-indicator" id="autoIndicator">⏸ Lecture manuelle</div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // SLIDES
    // ================================================================
    const slides = [
  {
    "titre": "Bienvenue en Mécanique",
    "contenu": "<div style='display: flex; flex-direction: column; align-items: center; justify-content: center; height: 80vh; text-align: center; background: linear-gradient(135deg, #1a237e, #0d47a1); color: white; padding: 20px; border-radius: 15px;'><h1 style='font-size: 2.5rem; margin-bottom: 10px;'>🔧 Mécanique Appliquée</h1><h2 style='font-size: 2rem; margin-bottom: 20px;'>Classe de 1ère Technique</h2><p style='font-size: 1.2rem; margin-bottom: 30px;'>Bienvenue à tous ! Préparez-vous à découvrir comment les objets du quotidien fonctionnent.</p><div style='background: rgba(255,255,255,0.1); padding: 15px 25px; border-radius: 50px;'><p style='font-size: 1.1rem;'>📚 Une aventure scientifique au cœur du Cameroun</p></div></div>",
    "texteParle": "Bienvenue dans le cours de Mécanique Appliquée, chers élèves de la classe de 1ère Technique. Je suis ravi de vous accueillir pour cette nouvelle année scolaire. La mécanique est une science fascinante qui nous permet de comprendre pourquoi et comment les objets bougent, s'arrêtent ou restent en équilibre. Au fil de cette leçon, nous allons découvrir ensemble les bases qui vous permettront de résoudre des problèmes concrets, que ce soit sur un chantier, dans un atelier ou dans la vie de tous les jours. Préparez vos cahiers, vos stylos et votre curiosité, car l'aventure commence maintenant.",
    "note": "Présentation générale de la matière : objectifs et programme de l'année."
  },
  {
    "titre": "Plan du cours",
    "contenu": "<div style='display: flex; flex-direction: column; padding: 15px; background: #f5f5f5; border-radius: 15px;'><h3 style='color: #1a237e; margin-bottom: 15px;'>📖 Programme de l'année</h3><div style='display: flex; flex-wrap: wrap; gap: 15px; justify-content: center;'><div style='background: #e3f2fd; padding: 15px; border-radius: 10px; width: 100%; max-width: 280px; border-left: 5px solid #1565c0;'><h4 style='color: #0d47a1; margin-bottom: 5px;'>Chapitre 1 : Généralités</h4><ul style='list-style: none; padding: 0; margin: 5px 0;'><li>• Vecteurs</li><li>• Forces</li><li>• Couples</li></ul></div><div style='background: #fff3e0; padding: 15px; border-radius: 10px; width: 100%; max-width: 280px; border-left: 5px solid #e65100;'><h4 style='color: #bf360c; margin-bottom: 5px;'>Chapitre 2 : Statique</h4><ul style='list-style: none; padding: 0; margin: 5px 0;'><li>• Équilibre des solides</li><li>• Résolution de problèmes</li></ul></div><div style='background: #e8f5e9; padding: 15px; border-radius: 10px; width: 100%; max-width: 280px; border-left: 5px solid #2e7d32;'><h4 style='color: #1b5e20; margin-bottom: 5px;'>Chapitre 3 : Cinématique</h4><ul style='list-style: none; padding: 0; margin: 5px 0;'><li>• Mouvements</li><li>• Vitesse, accélération</li></ul></div></div><p style='margin-top: 15px; text-align: center; font-style: italic;'>Nous allons construire ensemble ces notions pas à pas.</p></div>",
    "texteParle": "Le programme de cette année est structuré en trois grands chapitres. Le premier chapitre concerne les généralités, où nous aborderons les vecteurs, les forces et les couples. Ces notions sont la base de toute la mécanique. Le deuxième chapitre, la statique, nous permettra d'étudier les conditions d'équilibre des solides, c'est-à-dire les objets qui ne bougent pas ou qui bougent à vitesse constante. Enfin, le troisième chapitre, la cinématique, portera sur l'étude des mouvements des corps solides. Nous allons apprendre à décrire ces mouvements, calculer des vitesses et des accélérations. Ne vous inquiétez pas, nous prendrons le temps de bien comprendre chaque étape ensemble.",
    "note": "Présentation des trois chapitres : généralités, statique, cinématique."
  },
  {
    "titre": "La mécanique dans la vie",
    "contenu": "<div style='padding: 15px; background: #ffffff; border-radius: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);'><h3 style='color: #1a237e;'>🔍 Pourquoi la mécanique ?</h3><p style='margin: 10px 0;'>La mécanique est partout autour de nous :</p><ul style='list-style: none; padding: 0;'><li style='padding: 8px; background: #e8eaf6; margin: 5px 0; border-radius: 8px;'>🚗 <strong>Les voitures</strong> : comprendre comment elles avancent, freinent et tournent</li><li style='padding: 8px; background: #e8eaf6; margin: 5px 0; border-radius: 8px;'>🏗️ <strong>Les constructions</strong> : savoir pourquoi les bâtiments ne s'effondrent pas</li><li style='padding: 8px; background: #e8eaf6; margin: 5px 0; border-radius: 8px;'>🛠️ <strong>Les outils</strong> : maîtriser l'utilisation des leviers, poulies, engrenages</li><li style='padding: 8px; background: #e8eaf6; margin: 5px 0; border-radius: 8px;'>⚙️ <strong>Les machines</strong> : concevoir et réparer des équipements industriels</li></ul><div style='margin-top: 15px; background: #fff3e0; padding: 10px; border-radius: 10px; text-align: center;'><p>🇨🇲 Un ingénieur camerounais doit maîtriser ces principes pour construire demain.</p></div></div>",
    "texteParle": "Vous vous demandez peut-être à quoi va vous servir la mécanique ? La réponse est simple : elle est partout dans votre vie quotidienne. Quand vous prenez un taxi à Douala ou à Yaoundé, la mécanique explique comment le moteur fonctionne. Quand vous voyez un bâtiment en construction, la mécanique assure sa stabilité. Les outils que vous utilisez, comme un tournevis ou une clé, sont des applications directes des principes mécaniques. Les machines dans les usines, les ponts, les avions, tout repose sur la mécanique. En tant que futurs techniciens et ingénieurs camerounais, vous aurez le pouvoir de construire, de réparer et d'innover dans notre pays. C'est une grande responsabilité, mais aussi une formidable aventure.",
    "note": "Illustration de l'importance de la mécanique dans la vie courante et dans le contexte camerounais."
  },
  {
    "titre": "Outils mathématiques",
    "contenu": "<div style='padding: 15px; background: #f5f5f5; border-radius: 15px;'><h3 style='color: #1a237e;'>📐 Les mathématiques en mécanique</h3><p style='margin: 10px 0;'>La mécanique utilise des outils mathématiques puissants :</p><div style='display: flex; flex-direction: column; gap: 10px;'><div style='background: #ffffff; padding: 12px; border-radius: 10px; border: 1px solid #ddd;'><h4 style='color: #0d47a1; margin: 0 0 5px 0;'>Les vecteurs</h4><p style='margin: 0;'>Représentent des grandeurs ayant une direction, un sens et une intensité (ex : force, vitesse).</p><div class='math-block' style='background: #e3f2fd; padding: 10px; border-radius: 8px; text-align: center; margin-top: 5px;'><div class='math'>$$\\vec{F} = (F_x, F_y)$$</div></div></div><div style='background: #ffffff; padding: 12px; border-radius: 10px; border: 1px solid #ddd;'><h4 style='color: #0d47a1; margin: 0 0 5px 0;'>La trigonométrie</h4><p style='margin: 0;'>Permet de décomposer les forces selon les axes.</p><div class='math-block' style='background: #e3f2fd; padding: 10px; border-radius: 8px; text-align: center; margin-top: 5px;'><div class='math'>$$\\cos(\\theta) = \\frac{\\text{côté adjacent}}{\\text{hypoténuse}}$$</div></div></div></div></div>",
    "texteParle": "Pour bien comprendre la mécanique, nous allons utiliser des outils mathématiques que vous connaissez déjà ou que nous allons réviser ensemble. Les vecteurs sont essentiels : ils représentent des grandeurs qui ont une direction, un sens et une intensité. Par exemple, une force est un vecteur. Nous allons apprendre à additionner des vecteurs, à les multiplier et à les projeter sur des axes. La trigonométrie, avec le cosinus et le sinus, nous servira à décomposer les forces dans des directions précises. Ces outils sont comme un langage qui nous permet de décrire et de calculer ce qui se passe dans le monde physique. Ne vous inquiétez pas, nous allons pratiquer ensemble pour les maîtriser.",
    "note": "Introduction aux outils mathématiques utilisés en mécanique : vecteurs et trigonométrie."

  {
    "titre": "Les grandeurs scalaires",
    "contenu": "<div style='padding: 15px; background: #ffffff; border-radius: 15px;'><h3 style='color: #1a237e;'>📏 Grandeurs scalaires et vectorielles</h3><div style='display: flex; flex-wrap: wrap; gap: 15px; margin-top: 10px;'><div style='flex: 1; min-width: 200px; background: #e3f2fd; padding: 15px; border-radius: 10px;'><h4 style='color: #0d47a1;'>Scalaire</h4><ul style='list-style: disc; padding-left: 20px;'><li>Ne possède qu'une <strong>valeur numérique</strong></li><li>Exemples : masse, température, longueur</li><li>Se note simplement avec un nombre</li></ul></div><div style='flex: 1; min-width: 200px; background: #ffebee; padding: 15px; border-radius: 10px;'><h4 style='color: #b71c1c;'>Vectorielle</h4><ul style='list-style: disc; padding-left: 20px;'><li>Possède une <strong>valeur, une direction et un sens</strong></li><li>Exemples : vitesse, force, accélération</li><li>Se note avec une flèche : \\(\\vec{v}\\)</li></ul></div></div><div style='margin-top: 15px; background: #fff8e1; padding: 12px; border-radius: 10px;'><p><strong>À retenir :</strong> Une grandeur vectorielle s'écrit avec une flèche et a toujours une direction et un sens.</p></div></div>",
    "texteParle": "En mécanique, on distingue deux types de grandeurs. Les grandeurs scalaires, comme la masse, la température ou la longueur, sont simplement des nombres. Quand je dis qu'un sac pèse 5 kilogrammes, c'est un scalaire. Par contre, les grandeurs vectorielles sont plus complexes : elles ont une valeur numérique, mais aussi une direction et un sens. Par exemple, si je pousse une caisse vers la droite, je crée une force vectorielle. Cette force a une intensité, une direction et un sens. On note les vecteurs avec une flèche, comme \\(\\vec{F}\\) pour une force. Cette distinction est fondamentale, nous y reviendrons tout au long de l'année.",
    "note": "Distinction entre grandeurs scalaires (valeur seulement) et vectorielles (valeur, direction, sens)."

  {
    "titre": "Les opérations sur les vecteurs",
    "contenu": "<div style='padding: 15px; background: #f5f5f5; border-radius: 15px;'><h3 style='color: #1a237e;'>➕ Opérations vectorielles</h3><div style='display: flex; flex-direction: column; gap: 15px; margin-top: 10px;'><div style='background: #e8f5e9; padding: 12px; border-radius: 10px;'><h4 style='color: #2e7d32;'>Addition de vecteurs</h4><p>On additionne les composantes entre elles :</p><div class='math-block' style='background: #c8e6c9; padding: 10px; border-radius: 8px; text-align: center;'><div class='math'>$$\\vec{R} = \\vec{A} + \\vec{B} = (A_x + B_x, A_y + B_y)$$</div></div></div><div style='background: #fff3e0; padding: 12px; border-radius: 10px;'><h4 style='color: #e65100;'>Produit scalaire</h4><p>Donne un nombre :</p><div class='math-block' style='background: #ffe0b2; padding: 10px; border-radius: 8px; text-align: center;'><div class='math'>$$\\vec{A} \\cdot \\vec{B} = A_x B_x + A_y B_y = |\\vec{A}| \\times |\\vec{B}| \\times \\cos(\\theta)$$</div></div></div><div style='background: #e3f2fd; padding: 12px; border-radius: 10px;'><h4 style='color: #0d47a1;'>Produit vectoriel</h4><p>Donne un vecteur perpendiculaire :</p><div class='math-block' style='background: #bbdefb; padding: 10px; border-radius: 8px; text-align: center;'><div class='math'>$$\\vec{C} = \\vec{A} \\wedge \\vec{B} = |\\vec{A}| \\times |\\vec{B}| \\times \\sin(\\theta) \\cdot \\vec{n}$$</div></div></div></div></div>",
    "texteParle": "Nous allons maintenant aborder les opérations que l'on peut faire avec les vecteurs. L'addition de vecteurs consiste à ajouter leurs composantes. Par exemple, si je tire une corde vers la droite et que mon ami tire vers le haut, la force résultante est la somme des deux. Le produit scalaire, lui, donne un nombre qui mesure la projection d'un vecteur sur un autre. C'est utile pour calculer le travail d'une force. Enfin, le produit vectoriel donne un vecteur perpendiculaire aux deux vecteurs de départ. Ces opérations sont fondamentales en mécanique, car elles permettent de modéliser des situations réelles comme des forces qui s'additionnent ou des moments qui font tourner des objets.",
    "note": "Présentation des opérations vectorielles : addition, produit scalaire et produit vectoriel."

    "contenu": "<div style='padding: 15px; background: #ffffff; border-radius: 15px;'><h3 style='color: #1a237e;'>💪 Qu'est-ce qu'une force ?</h3><p style='margin: 10px 0;'>Une force est une <strong>action mécanique</strong> qui peut :</p><ul style='list-style: none; padding: 0;'><li style='padding: 8px; background: #e3f2fd; margin: 5px 0; border-radius: 8px;'>🔹 Modifier le mouvement d'un corps (l'accélérer, le ralentir)</li><li style='padding: 8px; background: #e3f2fd; margin: 5px 0; border-radius: 8px;'>🔹 Déformer un corps (le comprimer, l'étirer)</li><li style='padding: 8px; background: #e3f2fd; margin: 5px 0; border-radius: 8px;'>🔹 Maintenir un corps en équilibre</li></ul><div style='background: #fff3e0; padding: 12px; border-radius: 10px; margin-top: 10px;'><p>Une force se caractérise par :</p><ul style='list-style: disc; padding-left: 20px;'><li>Son <strong>intensité</strong> (en Newtons N)</li><li>Sa <strong>direction</strong> (horizontale, verticale, inclinée)</li><li>Son <strong>sens</strong> (vers la droite, vers la gauche)</li><li>Son <strong>point d'application</strong> (où elle agit)</li></ul></div></div>",
    "texteParle": "Passons maintenant à la notion de force. Une force est une action mécanique qui peut modifier le mouvement d'un corps, le déformer ou le maintenir en équilibre. Par exemple, quand vous poussez une table, vous exercez une force. Cette force peut faire avancer la table, la déformer légèrement ou simplement la maintenir en place si elle est contre un mur. Une force se caractérise par son intensité, exprimée en Newtons, sa direction, son sens et son point d'application. Le point d'application est l'endroit précis où la force agit. Ces caractéristiques nous permettent de modéliser toutes les situations mécaniques que nous rencontrerons.",
    "note": "Définition de la notion de force et de ses caractéristiques."

    "contenu": "<div style='padding: 15px; background: #f5f5f5; border-radius: 15px;'><h3 style='color: #1a237e;'>🔗 Les différents types de forces</h3><div style='display: flex; flex-direction: column; gap: 15px; margin-top: 10px;'><div style='background: #e8f5e9; padding: 12px; border-radius: 10px;'><h4 style='color: #2e7d32;'>Actions à distance</h4><ul style='list-style: none; padding: 0;'><li>• <strong>Poids</strong> : force exercée par la Terre sur un corps</li><li>• <strong>Attraction magnétique</strong> : entre aimants</li><li>• <strong>Force électrostatique</strong> : entre charges électriques</li></ul></div><div style='background: #fff3e0; padding: 12px; border-radius: 10px;'><h4 style='color: #e65100;'>Actions de contact</h4><ul style='list-style: none; padding: 0;'><li>• <strong>Réaction d'un support</strong> : une table qui soutient un objet</li><li>• <strong>Frottement</strong> : entre deux surfaces en contact</li><li>• <strong>Tension</strong> : dans une corde, un câble</li></ul></div><div style='background: #e3f2fd; padding: 12px; border-radius: 10px;'><h4 style='color: #0d47a1;'>Actions localisées</h4><ul style='list-style: none; padding: 0;'><li>• <strong>Force ponctuelle</strong> : s'exerce en un seul point</li><li>• <strong>Force répartie</strong> : s'exerce sur une surface (ex : pression)</li></ul></div></div></div>",
    "texteParle": "Les forces peuvent être classées en différentes catégories. Les actions à distance sont des forces qui s'exercent sans contact direct entre les objets. Le poids, par exemple, est une force exercée par la Terre sur nous, même si nous ne sommes pas en contact direct avec le centre de la Terre. L'attraction magnétique ou électrique sont d'autres exemples. Les actions de contact, elles, nécessitent un contact direct. C'est le cas de la réaction d'une table qui soutient un livre, du frottement entre deux surfaces ou de la tension dans une corde. Les forces peuvent aussi être localisées, c'est-à-dire exercées en un point précis, ou réparties sur une surface. Cette classification nous aidera à modéliser les situations que nous rencontrerons.",
    "note": "Classification des forces : actions à distance, de contact, localisées ou réparties."

    "titre": "Unité et notation",
    "contenu": "<div style='padding: 15px; background: #ffffff; border-radius: 15px;'><h3 style='color: #1a237e;'>📝 Unité et notation des forces</h3><div style='display: flex; flex-wrap: wrap; gap: 15px; margin-top: 10px;'><div style='flex: 1; min-width: 200px; background: #e8f5e9; padding: 15px; border-radius: 10px;'><h4 style='color: #2e7d32;'>Unité</h4><p style='font-size: 1.2rem;'><strong>Le Newton (N)</strong></p><p>1 N = force pour déplacer 1 kg à 1 m/s²</p><p>Exemple : Une pomme de 100 g pèse environ 1 N.</p></div><div style='flex: 1; min-width: 200px; background: #e3f2fd; padding: 15px; border-radius: 10px;'><h4 style='color: #0d47a1;'>Notation</h4><p>Une force se note :</p><div class='math-block' style='background: #bbdefb; padding: 10px; border-radius: 8px; text-align: center;'><div class='math'>$$\\vec{F} = F_x \\vec{i} + F_y \\vec{j}$$</div></div><p>avec \\(\\vec{i}\\) et \\(\\vec{j}\\) les vecteurs unitaires des axes.</p></div></div><div style='margin-top: 15px; background: #fff3e0; padding: 12px; border-radius: 10px; text-align: center;'><p>Le poids \\(\\vec{P}\\) d'un corps de masse \\(m\\) est : \\(\\vec{P} = m \\times \\vec{g}\\) avec \\(g \\approx 9,81 \\text{ m/s}^2\\)</p></div></div>",
    "texteParle": "En mécanique, les forces sont mesurées dans une unité appelée le Newton, en l'honneur du grand physicien Isaac Newton. Un Newton est la force nécessaire pour déplacer une masse d'un kilogramme avec une accélération d'un mètre par seconde carrée. Pour vous donner une idée, une pomme d'environ 100 grammes exerce une force d'environ un Newton. Pour noter une force, on utilise la lettre F avec une flèche au-dessus pour indiquer qu'il s'agit d'un vecteur. On peut décomposer cette force selon les axes x et y en utilisant les vecteurs unitaires \\(\\vec{i}\\) et \\(\\vec{j}\\). Le poids d'un objet est une force importante : il est égal au produit de sa masse par l'accélération de la pesanteur, qui vaut environ 9,81 mètres par seconde carrée au Cameroun.",
    "note": "Présentation de l'unité de force (Newton) et de la notation vectorielle."

    "texteParle": "Nous abordons maintenant la notion de couple. Un couple est un système de deux forces parallèles, de même intensité mais de sens opposé. Ces deux forces ne s'annulent pas, elles créent un effet de rotation sur le solide. C'est ce qui permet de faire tourner un volant de voiture, d'ouvrir un robinet ou de visser un boulon. L'effet de rotation est mesuré par le moment du couple, qui est le produit de l'intensité de la force par la distance entre les deux forces, appelée bras de levier. Le moment s'exprime en Newton-mètres. Nous utiliserons cette notion dans de nombreux problèmes de mécanique, notamment pour l'équilibre des solides.",

    "texteParle": "Les couples sont très présents dans notre vie quotidienne et dans l'industrie. Prenons l'exemple du volant d'une voiture. Quand vous tournez le volant, vos deux mains exercent des forces opposées, ce qui crée un couple qui fait tourner le volant. Une clé à molette fonctionne de la même façon pour serrer ou desserrer un boulon. Quand vous poussez une porte à son extrémité, vous créez un couple qui la fait pivoter sur ses gonds. Les engrenages, que vous trouvez dans de nombreuses machines, utilisent également des couples pour transmettre le mouvement de rotation. Ces exemples montrent que la notion de couple est partout autour de nous, et nous allons apprendre à la maîtriser pour résoudre des problèmes pratiques.",

    // ================================================================

    let currentIndex = 0;
    let isSpeaking = false;
    let isPaused = false;
    let currentUtterance = null;
    let isLoading = false;
    let loadingTimeout = null;
    let isTransitioning = false;
    let speechSupported = true;
    let userInteracted = false;
    let isPlaying = false;
    let loadingCancelled = false;

    const total = slides.length;
    const synth = window.speechSynthesis;

    // Références jQuery
    const $title = $('#slideTitle');
    const $body = $('#slideBody');
    const $counter = $('#slideCounter');
    const $statusText = $('#statusText');
    const $statusBadge = $('#statusBadge');
    const $loading = $('#loadingOverlay');
    const $loadingText = $('#loadingText');
    const $loadingSub = $('#loadingSub');
    const $loadingTimeout = $('#loadingTimeout');
    const $loadingProgressBar = $('#loadingProgressBar');
    const $autoIndicator = $('#autoIndicator');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $replay = $('#replayBtn');
    const $play = $('#playBtn');
    const $cancelLoading = $('#cancelLoadingBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function setStatus(text, type) {
        $statusText.text(text);
        $statusBadge.removeClass('idle speaking error paused waiting loading');
        if (type === 'speaking') $statusBadge.addClass('speaking');
        else if (type === 'error') $statusBadge.addClass('error');
        else if (type === 'paused') $statusBadge.addClass('paused');
        else if (type === 'waiting') $statusBadge.addClass('waiting');
        else if (type === 'loading') $statusBadge.addClass('loading');
        else $statusBadge.addClass('idle');
    }

    function updatePlayButton() {
        if (isPlaying) {
            $play.addClass('playing');
            $play.find('.btn-icon').text('⏸');
            $play.find('.btn-label').text('Pause');
        } else {
            $play.removeClass('playing');
            $play.find('.btn-icon').text('▶');
            $play.find('.btn-label').text('Play');
        }
    }

    function showLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        
        loadingCancelled = false;
        isLoading = true;
        
        // Réinitialiser la barre de progression
        $loadingProgressBar.css('animation', 'none');
        $loadingProgressBar.css('width', '0%');
        // Forcer un reflow
        $loadingProgressBar[0].offsetHeight;
        $loadingProgressBar.css('animation', 'loadingProgress 30s ease-out forwards');
        
        $loadingText.text('Préparation vocale...');
        $loadingSub.text('Synthèse en cours');
        $loadingTimeout.text('⏱️ 30 secondes maximum');
        $loading.fadeIn(300);
        setStatus("⏳ Chargement...", 'loading');
        
        // 🔥 TIMEOUT DE 30 SECONDES
        loadingTimeout = setTimeout(() => {
            if (isLoading && !loadingCancelled) {
                hideLoading();
                setStatus("⚠️ Délai dépassé (30s)", 'error');
                isPlaying = false;
                updatePlayButton();
                $loadingSub.text('La synthèse vocale a pris trop de temps');
                $loadingTimeout.text('❌ Délai dépassé');
            }
        }, 30000);
    }

    function hideLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        isLoading = false;
        loadingCancelled = false;
        $loading.fadeOut(300);
        // Ne pas changer le statut si on est en train de parler
        if (!isSpeaking && !isPlaying) {
            setStatus("⏸ Lecture arrêtée", 'paused');
        }
    }

    function cancelLoading() {
        loadingCancelled = true;
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        hideLoading();
        stopSpeaking();
        setStatus("⏸ Annulé", 'paused');
        isPlaying = false;
        updatePlayButton();
        $loadingText.text('Annulé par l\'utilisateur');
        $loadingSub.text('Vous pouvez réessayer');
        $loadingTimeout.text('✕ Annulation');
    }

    // Arrêter la parole proprement
    function stopSpeaking() {
        try {
            if (synth && (synth.speaking || synth.pending)) {
                synth.cancel();
            }
        } catch(e) {
            console.warn('Erreur stopSpeaking:', e);
        }
        if (currentUtterance) {
            try {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance.onstart = null;
            } catch(e) {}
            currentUtterance = null;
        }
        isSpeaking = false;
        isPlaying = false;
        updatePlayButton();
    }

    // Mettre en pause la parole
    function pauseSpeaking() {
        try {
            if (synth && synth.speaking) {
                synth.pause();
                isPaused = true;
                isPlaying = false;
                setStatus("⏸ Lecture en pause", 'paused');
                updatePlayButton();
            }
        } catch(e) {
            console.warn('Erreur pauseSpeaking:', e);
            stopSpeaking();
        }
    }

    // Reprendre la parole
    function resumeSpeaking() {
        try {
            if (synth && synth.paused) {
                synth.resume();
                isPaused = false;
                isPlaying = true;
                setStatus("🔊 Lecture en cours", 'speaking');
                updatePlayButton();
            } else if (!isSpeaking && !synth.speaking && !synth.pending) {
                speakSlide(currentIndex);
            }
        } catch(e) {
            console.warn('Erreur resumeSpeaking:', e);
            speakSlide(currentIndex);
        }
    }

    function renderSlide(index) {
        const slide = slides[index];
        $title.text(slide.titre);

        let html = '';
        html += `<div class="content-card">${slide.contenu}</div>`;
        if (slide.note) {
            html += `<div class="note-box">${slide.note}</div>`;
        }
        $body.html(html);
        $counter.text(`${index+1} / ${total}`);

        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
        }
    }

    // ================================================================
    // LECTURE VOCALE
    // ================================================================
    function speakSlide(index) {
        return new Promise((resolve) => {
            const slide = slides[index];
            const text = slide.texteParle;
            
            if (!text || text.trim() === '' || !speechSupported) {
                resolve();
                return;
            }

            if (!window.speechSynthesis) {
                setStatus("❌ Synthèse vocale non supportée", 'error');
                speechSupported = false;
                resolve();
                return;
            }

            // Arrêter toute lecture en cours
            stopSpeaking();
            
            // Réinitialiser l'état de pause
            isPaused = false;
            
            showLoading();
            setStatus("Initialisation...", 'loading');

            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.92;
                utterance.pitch = 1.05;
                utterance.volume = 1;

                let isFinished = false;
                let errorHandled = false;

                utterance.onstart = function() {
                    if (loadingCancelled) {
                        stopSpeaking();
                        resolve();
                        return;
                    }
                    hideLoading();
                    isSpeaking = true;
                    isPlaying = true;
                    isPaused = false;
                    setStatus("🔊 Lecture en cours", 'speaking');
                    updatePlayButton();
                };

                utterance.onend = function() {
                    if (isFinished) return;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    setStatus("✅ Terminé", 'idle');
                    hideLoading();
                    updatePlayButton();
                    resolve();
                };

                utterance.onerror = function(e) {
                    if (isFinished || errorHandled) return;
                    errorHandled = true;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    hideLoading();
                    updatePlayButton();
                    
                    if (e.error === 'not-allowed') {
                        setStatus("⚠️ Permission refusée", 'error');
                    } else if (e.error === 'synthesis-unavailable') {
                        setStatus("⚠️ Synthèse indisponible", 'error');
                    } else if (e.error === 'canceled') {
                        setStatus("⏸ Annulé", 'paused');
                    } else {
                        setStatus("❌ Erreur audio: " + (e.error || 'inconnue'), 'error');
                    }
                    
                    resolve();
                };

                // Gestion du chargement des voix
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = function() {
                        if (!loadingCancelled) {
                            try {
                                synth.speak(utterance);
                            } catch(err) {
                                // Silencieux
                            }
                        }
                        synth.onvoiceschanged = null;
                    };
                }

                currentUtterance = utterance;
                
                if (!loadingCancelled) {
                    try {
                        synth.speak(utterance);
                    } catch(err) {
                        setTimeout(() => {
                            if (!loadingCancelled) {
                                try {
                                    synth.speak(utterance);
                                } catch(e) {
                                    setStatus("❌ Erreur de lecture", 'error');
                                    isPlaying = false;
                                    updatePlayButton();
                                    hideLoading();
                                    resolve();
                                }
                            } else {
                                resolve();
                            }
                        }, 100);
                    }
                } else {
                    resolve();
                }

            } catch(err) {
                hideLoading();
                setStatus("❌ Erreur générale", 'error');
                isPlaying = false;
                updatePlayButton();
                console.error('Erreur speakSlide:', err);
                resolve();
            }
        });
    }

    // ================================================================
    // NAVIGATION
    // ================================================================
    async function goToSlide(index) {
        if (isTransitioning) return;
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        
        // Si on est en train de lire, on met en pause avant de naviguer
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        // Arrêter complètement la lecture
        stopSpeaking();
        
        await new Promise(r => setTimeout(r, 50));
        
        if (index === currentIndex) {
            setStatus("📄 Slide actuel", 'idle');
            return;
        }

        isTransitioning = true;
        currentIndex = index;
        renderSlide(index);
        
        // Réinitialiser l'état de lecture
        isPlaying = false;
        updatePlayButton();
        setStatus("⏸ Lecture arrêtée", 'paused');

        await new Promise(r => setTimeout(r, 150));
        isTransitioning = false;
    }

    async function goToNext() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex + 1 < total) {
            await goToSlide(currentIndex + 1);
        } else {
            setStatus("🏁 Dernier slide", 'idle');
        }
    }

    async function goToPrev() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex - 1 >= 0) {
            await goToSlide(currentIndex - 1);
        } else {
            setStatus("🔁 Premier slide", 'idle');
        }
    }

    // ================================================================
    // GESTION PLAY/PAUSE
    // ================================================================
    function togglePlay() {
        if (!userInteracted) {
            userInteracted = true;
        }

        // Si le chargement est en cours, on l'annule
        if (isLoading) {
            cancelLoading();
            return;
        }

        // Si le synthétiseur est en pause, on reprend
        if (synth && synth.paused) {
            resumeSpeaking();
            return;
        }

        // Si la lecture est en cours, on met en pause
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
            return;
        }

        // Sinon, on démarre la lecture du slide courant
        if (!isSpeaking && !isPlaying) {
            stopSpeaking();
            speakSlide(currentIndex);
        }
    }

    // ================================================================
    // INIT
    // ================================================================
    async function init() {
        // Vérifier la compatibilité
        if (!window.speechSynthesis) {
            setStatus("❌ Synthèse vocale non supportée", 'error');
            speechSupported = false;
        }

        // Précharger les voix
        try {
            if (synth.getVoices) {
                synth.getVoices();
                setTimeout(() => {
                    try {
                        synth.getVoices();
                    } catch(e) {}
                }, 200);
            }
        } catch(e) {
            console.warn('Erreur chargement voix:', e);
        }

        // Afficher le premier slide
        renderSlide(0);
        $counter.text(`1 / ${total}`);
        
        // État initial
        setStatus("⏸ Appuie sur Play", 'paused');
        updatePlayButton();
        $autoIndicator.text('⏸ Lecture manuelle');

        // ================================================================
        // ÉVÉNEMENTS
        // ================================================================
        
        // Bouton Play/Pause
        $play.on('click', function() {
            togglePlay();
        });

        // Bouton Annuler le chargement
        $cancelLoading.on('click', function() {
            cancelLoading();
        });

        // Navigation
        $prev.on('click', function() {
            // Si chargement en cours, on annule
            if (isLoading) cancelLoading();
            goToPrev();
        });

        $next.on('click', function() {
            if (isLoading) cancelLoading();
            goToNext();
        });

        // Replay - relire le slide courant
        $replay.on('click', function() {
            if (isLoading) cancelLoading();
            stopSpeaking();
            setTimeout(() => {
                speakSlide(currentIndex);
            }, 100);
        });

        // Support du clavier (espace pour play/pause)
        $(document).on('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });

        // Nettoyage
        $(window).on('beforeunload', function() {
            try {
                if (synth.speaking) synth.cancel();
            } catch(e) {}
            hideLoading();
        });

        // Gérer les cas où la synthèse se termine de manière inattendue
        setInterval(() => {
            if (isPlaying && !synth.speaking && !synth.pending && !isPaused && !isLoading) {
                isPlaying = false;
                updatePlayButton();
                setStatus("⏸ Lecture arrêtée", 'paused');
            }
        }, 1000);
    }

    init();
});



    // ================================================================
    // GESTION DU THÈME JOUR/NUIT
    // ================================================================
    let isDarkMode = false;

    function toggleTheme() {
        isDarkMode = !isDarkMode;
        const body = document.body;
        const appContainer = document.querySelector('.app-container');
        const header = document.querySelector('.slide-header');
        const footer = document.querySelector('.slide-footer');
        const contentCards = document.querySelectorAll('.content-card');
        const noteBoxes = document.querySelectorAll('.note-box');
        const mathBlocks = document.querySelectorAll('.math-block');
        const buttons = document.querySelectorAll('.btn');
        const statusBadge = document.querySelector('.status-badge');
        const slideCounter = document.querySelector('.slide-counter');
        const autoIndicator = document.querySelector('.auto-indicator');
        const themeBtn = document.getElementById('themeToggle');

        if (isDarkMode) {
            // Mode nuit
            body.style.background = '#0b1120';
            body.style.color = '#f1f5f9';
            appContainer.style.background = 'linear-gradient(145deg, #0f172a 0%, #1e293b 100%)';
            header.style.background = 'rgba(15, 23, 42, 0.85)';
            footer.style.background = 'rgba(15, 23, 42, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.05)';
                card.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.08)';
                note.style.color = '#cbd5e1';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.25)';
                block.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#e2e8f0';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.12)';
                statusBadge.style.color = '#93bbfc';
            }
            if (slideCounter) {
                slideCounter.style.color = '#94a3b8';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#64748b';
            }
            if (themeBtn) {
                themeBtn.textContent = '☀️';
                themeBtn.title = 'Passer en mode jour';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#e2e8f0';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#e2e8f0';
                }
            });
        } else {
            // Mode jour (par défaut)
            body.style.background = '#f0f4f8';
            body.style.color = '#1a202c';
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
            header.style.background = 'rgba(255, 255, 255, 0.85)';
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.8)';
                card.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.12)';
                note.style.color = '#2c3e50';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.05)';
                block.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#2d3748';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
                statusBadge.style.color = '#2b6cb0';
            }
            if (slideCounter) {
                slideCounter.style.color = '#4a5568';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#718096';
            }
            if (themeBtn) {
                themeBtn.textContent = '🌓';
                themeBtn.title = 'Passer en mode nuit';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#2c3e50';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#2d3748';
                }
            });
        }
    }

    // Initialiser en mode jour
    document.addEventListener('DOMContentLoaded', function() {
        // Appliquer le mode jour par défaut
        const body = document.body;
        body.style.background = '#f0f4f8';
        body.style.color = '#1a202c';
        
        const appContainer = document.querySelector('.app-container');
        if (appContainer) {
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
        }
        
        const header = document.querySelector('.slide-header');
        if (header) {
            header.style.background = 'rgba(255, 255, 255, 0.85)';
        }
        
        const footer = document.querySelector('.slide-footer');
        if (footer) {
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
        }
        
        document.querySelectorAll('.content-card').forEach(card => {
            card.style.background = 'rgba(255,255,255,0.8)';
            card.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.note-box').forEach(note => {
            note.style.background = 'rgba(96, 165, 250, 0.12)';
            note.style.color = '#2c3e50';
        });
        
        document.querySelectorAll('.math-block').forEach(block => {
            block.style.background = 'rgba(0,0,0,0.05)';
            block.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.btn').forEach(btn => {
            btn.style.color = '#2d3748';
        });
        
        const statusBadge = document.querySelector('.status-badge');
        if (statusBadge) {
            statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
            statusBadge.style.color = '#2b6cb0';
        }
        
        const slideCounter = document.querySelector('.slide-counter');
        if (slideCounter) {
            slideCounter.style.color = '#4a5568';
        }
        
        const autoIndicator = document.querySelector('.auto-indicator');
        if (autoIndicator) {
            autoIndicator.style.color = '#718096';
        }
        
        document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
            if (!el.closest('.note-box')) {
                el.style.color = '#2c3e50';
            }
        });
        
        document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
            if (!el.closest('.note-box') && !el.closest('.math-block')) {
                el.style.color = '#2d3748';
            }
        });
        
        const themeBtn = document.getElementById('themeToggle');
        if (themeBtn) {
            themeBtn.textContent = '🌓';
            themeBtn.title = 'Passer en mode nuit';
        }
    });
</script>
