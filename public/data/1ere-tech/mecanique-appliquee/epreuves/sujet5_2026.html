<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Mécanique Appliquée",
  "classe": "1ère Technique",
  "sequence": "Séquence 5",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Généralités sur la cinématique (QCM)",
      "points": "4 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; padding: 10px;'><p>Cet exercice vise à évaluer vos connaissances sur les notions fondamentales de la cinématique.</p><p><strong>Consigne :</strong> Pour chaque question, choisissez la ou les bonnes réponses.</p></div>",
      "questions": [
        {
          "question": "<p><strong>Question 1 (1 pt) :</strong> Un référentiel est :</p><ul style='list-style-type: none; padding-left: 0;'><li>A. Un système de coordonnées mathématique</li><li>B. Un corps par rapport auquel on étudie le mouvement d'un autre corps</li><li>C. Un outil de mesure de la vitesse</li><li>D. Une unité de mesure du temps</li></ul>",
          "reponse": "<p><strong>Réponse : B</strong></p><p>Un référentiel est un solide de référence par rapport auquel on étudie le mouvement d'un corps. Le repère est l'outil mathématique (axes et origine) associé à ce référentiel.</p>"
        },
        {
          "question": "<p><strong>Question 2 (1 pt) :</strong> L'équation horaire d'un mouvement donne :</p><ul style='list-style-type: none; padding-left: 0;'><li>A. La vitesse du mobile en fonction du temps</li><li>B. La position du mobile en fonction du temps</li><li>C. L'accélération du mobile en fonction du temps</li><li>D. La trajectoire du mobile</li></ul>",
          "reponse": "<p><strong>Réponse : B</strong></p><p>L'équation horaire d'un mouvement donne la position du point matériel en fonction du temps : \\( \\vec{OM}(t) = x(t)\\vec{i} + y(t)\\vec{j} + z(t)\\vec{k} \\).</p>"
        },
        {
          "question": "<p><strong>Question 3 (1 pt) :</strong> Dans un mouvement de translation, tous les points du solide ont :</p><ul style='list-style-type: none; padding-left: 0;'><li>A. La même vitesse et la même accélération à chaque instant</li><li>B. Des vitesses différentes selon leur position</li><li>C. Une trajectoire circulaire</li><li>D. Une vitesse angulaire constante</li></ul>",
          "reponse": "<p><strong>Réponse : A</strong></p><p>Dans un mouvement de translation, tous les points du solide indéformable ont le même vecteur vitesse et le même vecteur accélération à chaque instant. La trajectoire peut être rectiligne, circulaire ou curviligne.</p>"
        },
        {
          "question": "<p><strong>Question 4 (1 pt) :</strong> La vitesse angulaire \\( \\omega \\) dans un mouvement de rotation est définie par :</p><ul style='list-style-type: none; padding-left: 0;'><li>A. \\( \\omega = \\frac{d\\theta}{dt} \\)</li><li>B. \\( \\omega = \\frac{d^2\\theta}{dt^2} \\)</li><li>C. \\( \\omega = \\frac{v}{R} \\)</li><li>D. \\( \\omega = \\frac{1}{T} \\)</li></ul>",
          "reponse": "<p><strong>Réponses : A et C</strong></p><p>La vitesse angulaire est la dérivée de l'angle par rapport au temps : \\( \\omega = \\frac{d\\theta}{dt} \\). On a également la relation \\( v = R\\omega \\), donc \\( \\omega = \\frac{v}{R} \\).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Mouvement rectiligne uniforme et uniformément varié",
      "points": "6 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; padding: 10px;'><p>Un véhicule se déplace sur une route rectiligne. Sa position est donnée par l'équation horaire : \\( x(t) = 2t^2 + 4t + 1 \\) (en mètres), où \\( t \\) est en secondes.</p></div>",
      "questions": [
        {
          "question": "<p><strong>1. (1,5 pts)</strong> Déterminer la position du véhicule aux instants \\( t = 0 \\) s, \\( t = 2 \\) s et \\( t = 4 \\) s.</p>",
          "reponse": "<p>À \\( t = 0 \\) s : \\( x(0) = 2 \\times 0^2 + 4 \\times 0 + 1 = 1 \\) m</p><p>À \\( t = 2 \\) s : \\( x(2) = 2 \\times 4 + 4 \\times 2 + 1 = 8 + 8 + 1 = 17 \\) m</p><p>À \\( t = 4 \\) s : \\( x(4) = 2 \\times 16 + 4 \\times 4 + 1 = 32 + 16 + 1 = 49 \\) m</p>"
        },
        {
          "question": "<p><strong>2. (2 pts)</strong> Déterminer le vecteur vitesse \\( \\vec{v}(t) = \\frac{d\\vec{OM}}{dt} \\) du véhicule.</p>",
          "reponse": "<p>\\( \\vec{OM}(t) = x(t)\\vec{i} = (2t^2 + 4t + 1)\\vec{i} \\)</p><p>\\( \\vec{v}(t) = \\frac{d\\vec{OM}}{dt} = (4t + 4)\\vec{i} \\) (en m/s)</p>"
        },
        {
          "question": "<p><strong>3. (1,5 pts)</strong> Déterminer le vecteur accélération \\( \\vec{a}(t) = \\frac{d\\vec{v}}{dt} \\) du véhicule.</p>",
          "reponse": "<p>\\( \\vec{a}(t) = \\frac{d\\vec{v}}{dt} = 4\\vec{i} \\) (en m/s²)</p><p>L'accélération est constante et vaut 4 m/s². Le mouvement est donc uniformément varié (accéléré).</p>"
        },
        {
          "question": "<p><strong>4. (1 pt)</strong> Calculer la distance parcourue par le véhicule entre \\( t = 0 \\) s et \\( t = 4 \\) s.</p>",
          "reponse": "<p>La distance parcourue est : \\( d = x(4) - x(0) = 49 - 1 = 48 \\) m</p><p>Le véhicule a parcouru 48 mètres en 4 secondes.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Mouvement de rotation autour d'un axe fixe",
      "points": "5 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; padding: 10px;'><p>Un disque de rayon \\( R = 0,5 \\) m tourne autour de son axe. Sa position angulaire est donnée par \\( \\theta(t) = 2t^2 + 3t \\) (en radians), où \\( t \\) est en secondes.</p><div style='background-color: #f0f4f8; padding: 12px; border-radius: 8px; margin: 10px 0;'><p>Schéma : Un disque en rotation autour de son centre O, avec un point M sur la circonférence.</p></div></div>",
      "questions": [
        {
          "question": "<p><strong>1. (1,5 pts)</strong> Déterminer la vitesse angulaire \\( \\omega(t) = \\frac{d\\theta}{dt} \\) du disque.</p>",
          "reponse": "<p>\\( \\omega(t) = \\frac{d\\theta}{dt} = 4t + 3 \\) (en rad/s)</p>"
        },
        {
          "question": "<p><strong>2. (1,5 pts)</strong> Déterminer l'accélération angulaire \\( \\alpha(t) = \\frac{d\\omega}{dt} \\) du disque.</p>",
          "reponse": "<p>\\( \\alpha(t) = \\frac{d\\omega}{dt} = 4 \\) (en rad/s²)</p><p>L'accélération angulaire est constante et vaut 4 rad/s².</p>"
        },
        {
          "question": "<p><strong>3. (2 pts)</strong> Calculer la vitesse linéaire \\( v \\) d'un point situé à la périphérie du disque à \\( t = 2 \\) s. (Rappel : \\( v = R\\omega \\))</p>",
          "reponse": "<p>À \\( t = 2 \\) s : \\( \\omega(2) = 4 \\times 2 + 3 = 8 + 3 = 11 \\) rad/s</p><p>\\( v = R \\times \\omega = 0,5 \\times 11 = 5,5 \\) m/s</p><p>La vitesse linéaire du point à la périphérie est de 5,5 m/s.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Mouvement plan sur plan et Centre Instantané de Rotation",
      "points": "5 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; padding: 10px;'><p>Une roue de rayon \\( R = 0,4 \\) m roule sans glisser sur un sol horizontal. La vitesse du centre \\( G \\) de la roue est \\( v_G = 2 \\) m/s.</p><div style='background-color: #f0f4f8; padding: 12px; border-radius: 8px; margin: 10px 0;'><p>Schéma : Une roue en mouvement sur un sol horizontal, avec le centre G, le point de contact I avec le sol, et la vitesse v_G indiquée.</p></div></div>",
      "questions": [
        {
          "question": "<p><strong>1. (1,5 pts)</strong> Définir ce qu'est le Centre Instantané de Rotation (CIR).</p>",
          "reponse": "<p>Le Centre Instantané de Rotation (CIR) est le point d'un solide en mouvement plan sur plan dont la vitesse est nulle à un instant donné. Pour une roue qui roule sans glisser, le CIR est le point de contact avec le sol (point I).</p>"
        },
        {
          "question": "<p><strong>2. (1,5 pts)</strong> Déterminer la vitesse angulaire \\( \\omega \\) de la roue sachant que \\( v_G = R\\omega \\).</p>",
          "reponse": "<p>\\( v_G = R\\omega \\Rightarrow \\omega = \\frac{v_G}{R} = \\frac{2}{0,4} = 5 \\) rad/s</p>"
        },
        {
          "question": "<p><strong>3. (2 pts)</strong> Déterminer la vitesse du point A situé à l'extrémité supérieure de la roue (opposée au point de contact).</p>",
          "reponse": "<p>La vitesse du point A est la somme de la vitesse de translation du centre et de la vitesse de rotation :</p><p>\\( v_A = v_G + R\\omega = 2 + 0,4 \\times 5 = 2 + 2 = 4 \\) m/s</p><p>Le point A a une vitesse de 4 m/s, soit le double de la vitesse du centre.</p>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
