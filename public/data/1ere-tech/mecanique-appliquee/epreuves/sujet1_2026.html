<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Mécanique Appliquée",
  "classe": "1ère Technique",
  "sequence": "Séquence 1",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Généralités sur les vecteurs et les forces (QCM)",
      "points": "4 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; padding: 10px;'><p>Cet exercice vise à évaluer vos connaissances sur les notions de vecteurs et de forces vues en début d'année.</p><p><strong>Consigne :</strong> Pour chaque question, choisissez la ou les bonnes réponses.</p></div>",
      "questions": [
        {
          "question": "<p><strong>Question 1 (1 pt) :</strong> Quelles sont les caractéristiques d'un vecteur force ?</p><ul style='list-style-type: none; padding-left: 0;'><li>A. Sa norme, sa direction, son sens et son point d'application</li><li>B. Sa norme, sa vitesse, son sens et son point d'application</li><li>C. Sa norme, sa direction et son point d'application uniquement</li><li>D. Sa norme, sa direction, son sens et sa masse</li></ul>",
          "reponse": "<p><strong>Réponse : A</strong></p><p>Un vecteur force est caractérisé par quatre éléments : sa norme (ou intensité), sa direction, son sens et son point d'application. La vitesse et la masse ne sont pas des caractéristiques d'un vecteur force.</p>"
        },
        {
          "question": "<p><strong>Question 2 (1 pt) :</strong> Deux forces sont dites opposées si :</p><ul style='list-style-type: none; padding-left: 0;'><li>A. Elles ont la même norme, la même direction et le même sens</li><li>B. Elles ont la même norme, la même direction mais des sens opposés</li><li>C. Elles ont des normes différentes et des directions perpendiculaires</li><li>D. Elles ont la même norme et des directions perpendiculaires</li></ul>",
          "reponse": "<p><strong>Réponse : B</strong></p><p>Deux forces sont opposées si elles ont la même norme, la même direction (même droite support) mais des sens contraires. Leur somme vectorielle est alors nulle.</p>"
        },
        {
          "question": "<p><strong>Question 3 (1 pt) :</strong> L'opération qui consiste à remplacer un système de forces par une seule force équivalente est appelée :</p><ul style='list-style-type: none; padding-left: 0;'><li>A. La composition des forces</li><li>B. La décomposition des forces</li><li>C. La résultante des forces</li><li>D. Le moment d'une force</li></ul>",
          "reponse": "<p><strong>Réponse : C</strong></p><p>La résultante d'un système de forces est une force unique qui produit le même effet mécanique que l'ensemble des forces du système. La composition est l'opération qui permet de déterminer cette résultante.</p>"
        },
        {
          "question": "<p><strong>Question 4 (1 pt) :</strong> Un couple de forces est caractérisé par :</p><ul style='list-style-type: none; padding-left: 0;'><li>A. Deux forces opposées ayant la même droite d'action</li><li>B. Deux forces opposées ayant des droites d'action différentes</li><li>C. Deux forces de même sens ayant des droites d'action différentes</li><li>D. Deux forces perpendiculaires ayant le même point d'application</li></ul>",
          "reponse": "<p><strong>Réponse : B</strong></p><p>Un couple est un système de deux forces opposées (même norme, direction parallèle, sens contraires) dont les droites d'action sont distinctes. Le moment d'un couple est indépendant du point choisi pour le calcul.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Opérations vectorielles",
      "points": "6 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; padding: 10px;'><p>Soient deux vecteurs forces <span class='math'>\\(\\vec{F}_1 = 4\\vec{i} + 3\\vec{j}\\)</span> N et <span class='math'>\\(\\vec{F}_2 = -2\\vec{i} + 5\\vec{j}\\)</span> N appliqués en un même point.</p></div>",
      "questions": [
        {
          "question": "<p><strong>1. (1,5 pts)</strong> Calculer la résultante <span class='math'>\\(\\vec{R} = \\vec{F}_1 + \\vec{F}_2\\)</span>.</p>",
          "reponse": "<p><span class='math'>\\(\\vec{R} = \\vec{F}_1 + \\vec{F}_2 = (4\\vec{i} + 3\\vec{j}) + (-2\\vec{i} + 5\\vec{j}) = (4-2)\\vec{i} + (3+5)\\vec{j} = 2\\vec{i} + 8\\vec{j}\\)</span> N</p>"
        },
        {
          "question": "<p><strong>2. (1,5 pts)</strong> Calculer la norme de la résultante <span class='math'>\\(\\vec{R}\\)</span>.</p>",
          "reponse": "<p><span class='math'>\\(||\\vec{R}|| = \\sqrt{2^2 + 8^2} = \\sqrt{4 + 64} = \\sqrt{68} = 2\\sqrt{17} \\approx 8,25\\)</span> N</p>"
        },
        {
          "question": "<p><strong>3. (1,5 pts)</strong> Déterminer le produit scalaire <span class='math'>\\(\\vec{F}_1 \\cdot \\vec{F}_2\\)</span>.</p>",
          "reponse": "<p><span class='math'>\\(\\vec{F}_1 \\cdot \\vec{F}_2 = (4\\vec{i} + 3\\vec{j}) \\cdot (-2\\vec{i} + 5\\vec{j}) = 4 \\times (-2) + 3 \\times 5 = -8 + 15 = 7\\)</span> N²</p><p>Le produit scalaire est positif, ce qui signifie que l'angle entre les deux forces est aigu.</p>"
        },
        {
          "question": "<p><strong>4. (1,5 pts)</strong> Calculer le produit vectoriel <span class='math'>\\(\\vec{F}_1 \\wedge \\vec{F}_2\\)</span>.</p>",
          "reponse": "<p><span class='math'>\\(\\vec{F}_1 \\wedge \\vec{F}_2 = \\begin{vmatrix} \\vec{i} & \\vec{j} & \\vec{k} \\\\ 4 & 3 & 0 \\\\ -2 & 5 & 0 \\end{vmatrix} = (4 \\times 5 - 3 \\times (-2))\\vec{k} = (20 + 6)\\vec{k} = 26\\vec{k}\\)</span> N²</p><p>Le produit vectoriel donne un vecteur perpendiculaire au plan des deux forces, d'intensité 26 N².</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Moment d'une force et couple",
      "points": "5 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; padding: 10px;'><p>Une barre rigide de longueur <span class='math'>\\(L = 2\\)</span> m est fixée en son extrémité O. Une force <span class='math'>\\(\\vec{F} = 50\\vec{j}\\)</span> N est appliquée à l'extrémité A de la barre.</p><div style='background-color: #f0f4f8; padding: 12px; border-radius: 8px; margin: 10px 0;'><p>Schéma : Barre horizontale OA de 2 m, avec O à gauche, A à droite, force <span class='math'>\\(\\vec{F}\\)</span> verticale vers le bas en A.</p></div></div>",
      "questions": [
        {
          "question": "<p><strong>1. (1,5 pts)</strong> Déterminer le vecteur <span class='math'>\\(\\vec{OA}\\)</span>.</p>",
          "reponse": "<p>Le point O est à l'origine du repère et A est à l'extrémité de la barre selon l'axe x.<br><span class='math'>\\(\\vec{OA} = 2\\vec{i}\\)</span> m</p>"
        },
        {
          "question": "<p><strong>2. (2 pts)</strong> Calculer le moment de la force <span class='math'>\\(\\vec{F}\\)</span> par rapport au point O : <span class='math'>\\(\\vec{M}_O(\\vec{F}) = \\vec{OA} \\wedge \\vec{F}\\)</span>.</p>",
          "reponse": "<p><span class='math'>\\(\\vec{M}_O(\\vec{F}) = \\vec{OA} \\wedge \\vec{F} = (2\\vec{i}) \\wedge (50\\vec{j}) = 2 \\times 50 (\\vec{i} \\wedge \\vec{j}) = 100\\vec{k}\\)</span> N·m</p><p>Le moment est de 100 N·m selon l'axe z (perpendiculaire au plan).</p>"
        },
        {
          "question": "<p><strong>3. (1,5 pts)</strong> Si on applique une force <span class='math'>\\(\\vec{F}' = -50\\vec{j}\\)</span> N au point B situé à 1 m de O (sur la barre), que vaut le moment <span class='math'>\\(\\vec{M}_O(\\vec{F}')\\)</span> ?</p>",
          "reponse": "<p><span class='math'>\\(\\vec{OB} = 1\\vec{i}\\)</span> m<br><span class='math'>\\(\\vec{M}_O(\\vec{F}') = \\vec{OB} \\wedge \\vec{F}' = (1\\vec{i}) \\wedge (-50\\vec{j}) = -50\\vec{k}\\)</span> N·m</p><p>Le moment est de -50 N·m selon z (sens horaire).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Application pratique - Équilibre d'une poutre",
      "points": "5 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; padding: 10px;'><p>Une poutre homogène de masse <span class='math'>\\(m = 100\\)</span> kg et de longueur <span class='math'>\\(L = 4\\)</span> m est posée horizontalement sur deux appuis A (à gauche) et B (à droite). On prend <span class='math'>\\(g = 10\\)</span> m/s².</p><div style='background-color: #f0f4f8; padding: 12px; border-radius: 8px; margin: 10px 0;'><p>Schéma : Poutre horizontale AB de 4 m, appuis triangulaires aux extrémités A et B, centre de gravité G au milieu.</p></div></div>",
      "questions": [
        {
          "question": "<p><strong>1. (1 pt)</strong> Calculer le poids <span class='math'>\\(\\vec{P}\\)</span> de la poutre.</p>",
          "reponse": "<p><span class='math'>\\(P = m \\times g = 100 \\times 10 = 1000\\)</span> N</p><p>Le poids est dirigé verticalement vers le bas.</p>"
        },
        {
          "question": "<p><strong>2. (2 pts)</strong> En utilisant le Principe Fondamental de la Statique (PFS), écrire les équations d'équilibre de la poutre (forces et moments).</p>",
          "reponse": "<p><strong>Équilibre des forces :</strong><br><span class='math'>\\(\\vec{R}_A + \\vec{R}_B + \\vec{P} = \\vec{0}\\)</span><br>En projection sur l'axe vertical : <span class='math'>\\(R_A + R_B - P = 0\\)</span> soit <span class='math'>\\(R_A + R_B = 1000\\)</span> N</p><p><strong>Équilibre des moments en A :</strong><br><span class='math'>\\(\\vec{M}_A(\\vec{R}_B) + \\vec{M}_A(\\vec{P}) = \\vec{0}\\)</span><br><span class='math'>\\(L \\times R_B - \\frac{L}{2} \\times P = 0\\)</span><br><span class='math'>\\(4R_B - 2 \\times 1000 = 0\\)</span><br><span class='math'>\\(4R_B = 2000\\)</span><br><span class='math'>\\(R_B = 500\\)</span> N</p>"
        },
        {
          "question": "<p><strong>3. (2 pts)</strong> Déterminer les réactions <span class='math'>\\(R_A\\)</span> et <span class='math'>\\(R_B\\)</span> aux appuis.</p>",
          "reponse": "<p>De <span class='math'>\\(R_A + R_B = 1000\\)</span> et <span class='math'>\\(R_B = 500\\)</span> N, on déduit :<br><span class='math'>\\(R_A = 1000 - 500 = 500\\)</span> N</p><p>Les réactions aux appuis sont donc :<br><span class='math'>\\(R_A = 500\\)</span> N et <span class='math'>\\(R_B = 500\\)</span> N</p><p>La poutre étant symétrique, les réactions sont égales.</p>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
