<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Mécanique Appliquée",
  "classe": "1ère Technique",
  "sequence": "Séquence 4",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Généralités sur les vecteurs et forces",
      "points": "5 pts",
      "enonce": "<div style='font-size:1em; line-height:1.6;'><p>Cet exercice porte sur les notions fondamentales de vecteurs, de forces et de couples.</p></div>",
      "questions": [
        {
          "question": "<div><p><strong>1. (1,5 pts)</strong> Définis un vecteur en précisant ses quatre caractéristiques. Représente graphiquement le vecteur \\( \\vec{F} \\) d'intensité 50 N, dirigé vers le nord-est, faisant un angle de 30° avec l'horizontale.</p></div>",
          "reponse": "<div><p>Un vecteur est défini par :</p><ul><li><strong>Point d'application</strong> : le point de départ du vecteur.</li><li><strong>Direction</strong> : la droite qui porte le vecteur.</li><li><strong>Sens</strong> : l'orientation du vecteur.</li><li><strong>Norme</strong> : la longueur du vecteur (intensité).</li></ul><p>La représentation graphique doit montrer une flèche de 5 cm (si échelle 1 cm = 10 N) partant d'un point, orientée à 30° au-dessus de l'horizontale vers la droite.</p></div>"
        },
        {
          "question": "<div><p><strong>2. (1,5 pts)</strong> Soient deux forces \\( \\vec{F}_1 = 30 \\, N \\) et \\( \\vec{F}_2 = 40 \\, N \\) perpendiculaires. Calcule la résultante de ces deux forces. En déduire la direction de la résultante par rapport à \\( \\vec{F}_1 \\).</p></div>",
          "reponse": "<div><p>La résultante est donnée par :</p><div class='math-block'><div class='math'>$$ R = \\sqrt{F_1^2 + F_2^2} = \\sqrt{30^2 + 40^2} = \\sqrt{900 + 1600} = \\sqrt{2500} = 50 \\, N $$</div></div><p>La direction de la résultante par rapport à \\( \\vec{F}_1 \\) est :</p><div class='math-block'><div class='math'>$$ \\tan(\\theta) = \\frac{F_2}{F_1} = \\frac{40}{30} = 1,333 \\Rightarrow \\theta = \\arctan(1,333) = 53,13° $$</div></div></div>"
        },
        {
          "question": "<div><p><strong>3. (1 pt)</strong> Définis un couple de forces. Quelle est la caractéristique principale d'un couple ? Quel est son effet sur un solide ?</p></div>",
          "reponse": "<div><p>Un <strong>couple</strong> est un ensemble de deux forces parallèles, de même intensité, de sens opposés et dont les droites d'action sont distinctes.</p><p>Sa caractéristique principale est son <strong>moment</strong> : \\( M = F \\times d \\) où d est la distance entre les deux droites d'action (bras du couple).</p><p>L'effet d'un couple sur un solide est de le <strong>mettre en rotation</strong> sans provoquer de translation.</p></div>"
        },
        {
          "question": "<div><p><strong>4. (1 pt)</strong> Calcule le moment d'un couple formé par deux forces de 20 N dont les droites d'action sont distantes de 15 cm.</p></div>",
          "reponse": "<div><p>Le moment du couple est :</p><div class='math-block'><div class='math'>$$ M = F \\times d = 20 \\times 0,15 = 3 \\, N.m $$</div></div></div>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Statique - Système matériel et BAME",
      "points": "5 pts",
      "enonce": "<div style='font-size:1em; line-height:1.6;'><p>Cet exercice évalue la capacité à délimiter un système matériel et à établir le bilan des actions mécaniques.</p></div>",
      "questions": [
        {
          "question": "<div><p><strong>1. (1 pt)</strong> Définis un <strong>système matériel</strong>. Quelle est la différence entre les actions mécaniques extérieures (BAME) et intérieures (BAMI) ?</p></div>",
          "reponse": "<div><p>Un <strong>système matériel</strong> est un ensemble de corps ou de parties de corps que l'on isole pour l'étude. Il peut être un solide, un ensemble de solides ou une partie d'un solide.</p><ul><li><strong>BAME</strong> : actions mécaniques exercées par l'extérieur sur le système.</li><li><strong>BAMI</strong> : actions mécaniques entre les différentes parties du système.</li></ul><p>Les actions intérieures s'annulent deux à deux et ne sont pas prises en compte pour l'équilibre global du système.</p></div>"
        },
        {
          "question": "<div><p><strong>2. (2 pts)</strong> Un <strong>panneau publicitaire</strong> de masse 150 kg est fixé à un mur par une articulation en O et maintenu par un câble AB.</p><ul><li>a) Délimite le système matériel à étudier.</li><li>b) Établis le bilan des actions mécaniques extérieures (BAME) qui s'exercent sur ce système.</li></ul></div>",
          "reponse": "<div><p><strong>a) Système :</strong> Le panneau publicitaire.</p><p><strong>b) BAME :</strong></p><ul><li><strong>Poids du panneau :</strong> \\( \\vec{P} \\), vertical vers le bas, \\( P = 150 \\times 9,81 = 1471,5 \\, N \\), appliqué au centre de gravité du panneau.</li><li><strong>Tension du câble :</strong> \\( \\vec{T} \\), appliquée au point d'accroche du câble, direction du câble.</li><li><strong>Réaction de l'articulation en O :</strong> \\( \\vec{R}_O \\), décomposable en \\( R_{Ox} \\) et \\( R_{Oy} \\).</li></ul></div>"
        },
        {
          "question": "<div><p><strong>3. (2 pts)</strong> Applique la <strong>méthode d'isolement</strong> pour étudier l'équilibre de ce panneau. Quelles sont les conditions d'équilibre d'un solide soumis à trois forces non parallèles ?</p></div>",
          "reponse": "<div><p>La <strong>méthode d'isolement</strong> consiste à :</p><ol><li>Définir clairement le système.</li><li>Faire le bilan des actions extérieures (BAME).</li><li>Appliquer les conditions d'équilibre.</li></ol><p>Pour un solide soumis à trois forces non parallèles, les conditions d'équilibre sont :</p><ul><li>Les trois forces doivent être <strong>concourantes</strong> (leurs droites d'action se coupent en un même point).</li><li>La somme vectorielle des trois forces est nulle (polygone des forces fermé).</li></ul></div>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Cinématique - Translation et rotation",
      "points": "5 pts",
      "enonce": "<div style='font-size:1em; line-height:1.6;'><p>Cet exercice porte sur l'étude des mouvements de translation et de rotation.</p></div>",
      "questions": [
        {
          "question": "<div><p><strong>1. (1,5 pts)</strong> Un véhicule (considéré comme un solide en translation) démarre du repos et accélère uniformément sur une route rectiligne. Il atteint la vitesse de 90 km/h en 15 secondes.</p><ul><li>a) Calcule l'accélération du véhicule en m/s².</li><li>b) Détermine la distance parcourue pendant cette phase d'accélération.</li></ul></div>",
          "reponse": "<div><p><strong>a) Accélération :</strong></p><div class='math-block'><div class='math'>$$ v = 90 \\, km/h = 90 \\times \\frac{1000}{3600} = 25 \\, m/s $$</div></div><div class='math-block'><div class='math'>$$ a = \\frac{v - v_0}{t} = \\frac{25 - 0}{15} = \\frac{25}{15} = 1,667 \\, m/s^2 $$</div></div><p><strong>b) Distance parcourue :</strong></p><div class='math-block'><div class='math'>$$ d = v_0 t + \\frac{1}{2} a t^2 = 0 \\times 15 + \\frac{1}{2} \\times 1,667 \\times 15^2 = 0,8335 \\times 225 = 187,5 \\, m $$</div></div></div>"
        },
        {
          "question": "<div><p><strong>2. (2 pts)</strong> Une roue de rayon R = 0,4 m tourne autour de son axe à la vitesse angulaire \\( \\omega = 20 \\, rad/s \\).</p><ul><li>a) Calcule la vitesse linéaire d'un point situé à la périphérie de la roue.</li><li>b) Calcule l'accélération centripète de ce point.</li><li>c) Si la roue effectue 120 tours par minute, quelle est sa vitesse angulaire en rad/s ?</li></ul></div>",
          "reponse": "<div><p><strong>a) Vitesse linéaire :</strong></p><div class='math-block'><div class='math'>$$ v = R \\times \\omega = 0,4 \\times 20 = 8 \\, m/s $$</div></div><p><strong>b) Accélération centripète :</strong></p><div class='math-block'><div class='math'>$$ a_c = \\frac{v^2}{R} = \\frac{8^2}{0,4} = \\frac{64}{0,4} = 160 \\, m/s^2 $$</div></div><p><strong>c) Conversion :</strong></p><div class='math-block'><div class='math'>$$ \\omega = 120 \\, tr/min = 120 \\times \\frac{2\\pi}{60} = 4\\pi \\approx 12,57 \\, rad/s $$</div></div></div>"
        },
        {
          "question": "<div><p><strong>3. (1,5 pts)</strong> Explique la différence entre un mouvement de translation et un mouvement de rotation. Donne un exemple pour chaque type de mouvement dans la vie courante.</p></div>",
          "reponse": "<div><p><strong>Translation :</strong> Tous les points du solide ont le même vecteur vitesse à chaque instant. La trajectoire de tous les points est la même (parallèle).</p><p>Exemple : Une voiture qui roule sur une route rectiligne, un tiroir que l'on ouvre.</p><p><strong>Rotation :</strong> Les points du solide décrivent des trajectoires circulaires autour d'un axe fixe. La vitesse angulaire est la même pour tous les points.</p><p>Exemple : Une porte qui tourne sur ses gonds, une roue de bicyclette.</p></div>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Mouvement plan et composition de mouvements",
      "points": "5 pts",
      "enonce": "<div style='font-size:1em; line-height:1.6;'><p>Cet exercice porte sur le mouvement plan sur plan, le CIR et la composition des mouvements.</p></div>",
      "questions": [
        {
          "question": "<div><p><strong>1. (2 pts)</strong> Une roue de rayon R = 0,3 m roule sans glisser sur un plan horizontal. Le centre O de la roue a une vitesse \\( v_O = 6 \\, m/s \\).</p><ul><li>a) Détermine le Centre Instantané de Rotation (CIR) de la roue. Justifie.</li><li>b) Calcule la vitesse angulaire \\( \\omega \\) de la roue.</li><li>c) Détermine la vitesse du point A situé en haut de la roue.</li></ul></div>",
          "reponse": "<div><p><strong>a) CIR :</strong> Pour une roue qui roule sans glisser, le point de contact avec le sol a une vitesse nulle. Le CIR est donc le point de contact I de la roue avec le sol.</p><p><strong>b) Vitesse angulaire :</strong></p><div class='math-block'><div class='math'>$$ v_O = \\omega \\times R \\Rightarrow \\omega = \\frac{v_O}{R} = \\frac{6}{0,3} = 20 \\, rad/s $$</div></div><p><strong>c) Vitesse du point A :</strong> Le point A est à une distance 2R du CIR.</p><div class='math-block'><div class='math'>$$ v_A = \\omega \\times 2R = 20 \\times 0,6 = 12 \\, m/s $$</div></div></div>"
        },
        {
          "question": "<div><p><strong>2. (1,5 pts)</strong> Énonce la <strong>loi de composition des vitesses</strong>. Un passager marche à 4 km/h dans un train qui se déplace à 80 km/h. Quelle est sa vitesse absolue s'il marche :</p><ul><li>a) Dans le sens du train ?</li><li>b) En sens inverse du train ?</li></ul></div>",
          "reponse": "<div><p>La loi de composition des vitesses s'écrit :</p><div class='math-block'><div class='math'>$$ \\vec{V}_a = \\vec{V}_r + \\vec{V}_e $$</div></div><p>où \\( \\vec{V}_a \\) est la vitesse absolue, \\( \\vec{V}_r \\) la vitesse relative et \\( \\vec{V}_e \\) la vitesse d'entraînement.</p><p><strong>a) Dans le sens du train :</strong></p><div class='math-block'><div class='math'>$$ V_a = V_r + V_e = 4 + 80 = 84 \\, km/h $$</div></div><p><strong>b) En sens inverse :</strong></p><div class='math-block'><div class='math'>$$ V_a = V_e - V_r = 80 - 4 = 76 \\, km/h $$</div></div></div>"
        },
        {
          "question": "<div><p><strong>3. (1,5 pts)</strong> Un bateau traverse une rivière de 150 m de large. Sa vitesse propre (par rapport à l'eau) est de 8 km/h perpendiculairement à la rive. Le courant a une vitesse de 3 km/h parallèle à la rive.</p><ul><li>a) Calcule la vitesse du bateau par rapport à la rive.</li><li>b) Détermine la direction de la trajectoire du bateau par rapport à la perpendiculaire à la rive.</li><li>c) Calcule le temps nécessaire pour traverser la rivière.</li></ul></div>",
          "reponse": "<div><p><strong>a) Vitesse par rapport à la rive :</strong></p><div class='math-block'><div class='math'>$$ v = \\sqrt{v_b^2 + v_c^2} = \\sqrt{8^2 + 3^2} = \\sqrt{64 + 9} = \\sqrt{73} \\approx 8,54 \\, km/h $$</div></div><p><strong>b) Direction :</strong></p><div class='math-block'><div class='math'>$$ \\tan(\\alpha) = \\frac{v_c}{v_b} = \\frac{3}{8} = 0,375 \\Rightarrow \\alpha = \\arctan(0,375) = 20,56° $$</div></div><p>La trajectoire fait un angle de 20,56° avec la perpendiculaire à la rive (dans le sens du courant).</p><p><strong>c) Temps de traversée :</strong></p><div class='math-block'><div class='math'>$$ t = \\frac{d}{v_b} = \\frac{0,15}{8 \\times \\frac{1000}{3600}} = \\frac{0,15}{2,222} = 0,0675 \\, h = 243 \\, s = 4 \\, min \\, 3 \\, s $$</div></div></div>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
