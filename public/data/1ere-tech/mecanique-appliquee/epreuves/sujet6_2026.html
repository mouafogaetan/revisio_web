<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Mécanique Appliquée",
  "classe": "1ère Technique",
  "sequence": "Séquence 6",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : QCM - Généralités sur la Cinématique",
      "points": "4 pts",
      "enonce": "<div style='font-size:1.1em; line-height:1.6;'>Pour chaque question, choisis la ou les bonnes réponses.</div>",
      "questions": [
        {
          "question": "<div style='margin-bottom:15px;'><strong>1)</strong> L’équation horaire d’un mouvement décrit :<br><span style='display:block; margin-top:5px;'>A - La trajectoire du mobile.<br>B - La position du mobile en fonction du temps.<br>C - La vitesse du mobile en fonction du temps.<br>D - L’accélération du mobile en fonction du temps.</span></div>",
          "reponse": "<div style='background-color:#e8f5e9; padding:12px; border-radius:8px;'><strong>Réponse : B</strong><br>L'équation horaire donne la position (coordonnées) d'un point en fonction du temps, par exemple \\(x(t)\\). La trajectoire est le lieu géométrique des positions occupées par le mobile, obtenu en éliminant le temps \\(t\\) entre les équations horaires [citation:1].</div>"
        },
        {
          "question": "<div style='margin-bottom:15px;'><strong>2)</strong> La vitesse instantanée est la dérivée par rapport au temps :<br><span style='display:block; margin-top:5px;'>A - De la position.<br>B - De l’accélération.<br>C - De la trajectoire.<br>D - Du vecteur déplacement.</span></div>",
          "reponse": "<div style='background-color:#e8f5e9; padding:12px; border-radius:8px;'><strong>Réponse : A</strong><br>La vitesse instantanée est la dérivée du vecteur position par rapport au temps : \\(\\vec{v} = \\frac{d\\vec{OM}}{dt}\\).</div>"
        },
        {
          "question": "<div style='margin-bottom:15px;'><strong>3)</strong> Un solide est indéformable si :<br><span style='display:block; margin-top:5px;'>A - Sa forme peut changer sous l’effet des forces.<br>B - La distance entre deux points quelconques du solide reste constante.<br>C - Tous ses points ont la même vitesse.<br>D - Il est en équilibre.</span></div>",
          "reponse": "<div style='background-color:#e8f5e9; padding:12px; border-radius:8px;'><strong>Réponse : B</strong><br>Un solide est dit indéformable lorsque la distance entre deux points quelconques du solide ne varie pas au cours du temps. C'est une propriété fondamentale en cinématique du solide.</div>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Mouvement de Translation",
      "points": "6 pts",
      "enonce": "<div style='font-size:1.1em; line-height:1.6;'>Un automobiliste roule sur une route rectiligne. L’équation horaire de son mouvement est : <div class='math-block' style='background-color:#f5f5f5; padding:10px; border-radius:8px; text-align:center; margin:10px 0;'><div class='math'>$$ x(t) = 20t - 2t^2 $$</div></div> où \\(x\\) est en mètres et \\(t\\) en secondes.</div>",
      "questions": [
        {
          "question": "<div style='margin-bottom:15px;'><strong>1)</strong> Déterminer l’expression de la vitesse \\(v(t)\\) du véhicule.</div>",
          "reponse": "<div style='background-color:#e8f5e9; padding:12px; border-radius:8px;'>La vitesse est la dérivée de la position par rapport au temps : <div class='math-block' style='background-color:#f5f5f5; padding:10px; border-radius:8px; text-align:center; margin:10px 0;'><div class='math'>$$ v(t) = \\frac{dx}{dt} = 20 - 4t $$</div></div></div>"
        },
        {
          "question": "<div style='margin-bottom:15px;'><strong>2)</strong> À quelle date \\(t\\) le véhicule s’arrête-t-il ?</div>",
          "reponse": "<div style='background-color:#e8f5e9; padding:12px; border-radius:8px;'>Le véhicule s’arrête lorsque sa vitesse est nulle : \\(v(t) = 0\\).<br>\\(20 - 4t = 0\\) donc \\(t = 5\\) s.</div>"
        },
        {
          "question": "<div style='margin-bottom:15px;'><strong>3)</strong> Calculer l’accélération du véhicule. Le mouvement est-il uniformément varié ?</div>",
          "reponse": "<div style='background-color:#e8f5e9; padding:12px; border-radius:8px;'>L’accélération est la dérivée de la vitesse : \\(a(t) = \\frac{dv}{dt} = -4\\, m.s^{-2}\\).<br>L’accélération est constante : le mouvement est uniformément varié (ici uniformément décéléré).</div>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Mouvement de Rotation",
      "points": "6 pts",
      "enonce": "<div style='font-size:1.1em; line-height:1.6;'>Un ventilateur tourne à la vitesse constante de \\(\\omega = 120\\, rad/s\\). Son rayon est \\(R = 0,5\\, m\\).</div>",
      "questions": [
        {
          "question": "<div style='margin-bottom:15px;'><strong>1)</strong> Calculer la vitesse linéaire d’un point situé à l’extrémité d’une pale.</div>",
          "reponse": "<div style='background-color:#e8f5e9; padding:12px; border-radius:8px;'>La relation entre vitesse linéaire et vitesse angulaire est : \\(v = \\omega \\cdot R\\).<br>\\(v = 120 \\times 0,5 = 60\\, m/s\\).</div>"
        },
        {
          "question": "<div style='margin-bottom:15px;'><strong>2)</strong> Calculer l’accélération normale (centripète) de ce point.</div>",
          "reponse": "<div style='background-color:#e8f5e9; padding:12px; border-radius:8px;'>L’accélération normale est donnée par : \\(a_n = \\omega^2 \\cdot R\\).<br>\\(a_n = 120^2 \\times 0,5 = 14400 \\times 0,5 = 7200\\, m.s^{-2}\\).</div>"
        },
        {
          "question": "<div style='margin-bottom:15px;'><strong>3)</strong> Le mouvement étant uniforme, que vaut l’accélération tangentielle ?</div>",
          "reponse": "<div style='background-color:#e8f5e9; padding:12px; border-radius:8px;'>Pour un mouvement de rotation uniforme, la vitesse angulaire est constante, donc l’accélération angulaire est nulle (\\(\\alpha = 0\\)).<br>L’accélération tangentielle est donc : \\(a_t = R \\cdot \\alpha = 0\\).</div>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Mouvement plan sur plan",
      "points": "4 pts",
      "enonce": "<div style='font-size:1.1em; line-height:1.6;'>Une échelle de 5 m de long est posée contre un mur. Son pied glisse sur le sol horizontal à la vitesse constante de 1 m/s. On s’intéresse au mouvement de l’échelle dans le plan vertical.</div>",
      "questions": [
        {
          "question": "<div style='margin-bottom:15px;'><strong>1)</strong> Quel est la nature du mouvement de l’échelle ? (Translation, rotation, mouvement plan sur plan)</div>",
          "reponse": "<div style='background-color:#e8f5e9; padding:12px; border-radius:8px;'>L’échelle se déplace dans un plan vertical : c’est un <strong>mouvement plan sur plan</strong>. Ses points (extrémités) se déplacent dans des plans parallèles au plan vertical fixe.</div>"
        },
        {
          "question": "<div style='margin-bottom:15px;'><strong>2)</strong> Où se trouve le Centre Instantané de Rotation (CIR) de l’échelle ? Justifier.</div>",
          "reponse": "<div style='background-color:#e8f5e9; padding:12px; border-radius:8px;'>Le CIR est à l’intersection des perpendiculaires aux vecteurs vitesse de deux points de l’échelle.<br>- La vitesse du pied (point A) est horizontale, la perpendiculaire est verticale.<br>- La vitesse du sommet (point B) est verticale (le long du mur), la perpendiculaire est horizontale.<br>L’intersection de ces deux perpendiculaires donne le coin du mur (point O). Le CIR est donc le coin du mur.</div>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
