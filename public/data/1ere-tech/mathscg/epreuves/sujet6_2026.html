<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Mathématiques CG",
  "classe": "1ère Technique",
  "sequence": "Séquence 6",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Étude d'une fonction homographique",
      "points": "6 pts",
      "enonce": "<p>Soit la fonction $f$ définie par $f(x) = \\dfrac{2x - 3}{x + 1}$.</p>",
      "questions": [
        {
          "question": "1) Déterminer l'ensemble de définition de $f$. (0,5 pt)",
          "reponse": "$f$ est définie pour $x + 1 \\neq 0$, donc $x \\neq -1$.<br>$D_f = \\mathbb{R} \\setminus \\{-1\\} = ]-\\infty; -1[ \\cup ]-1; +\\infty[$."
        },
        {
          "question": "2) Mettre $f$ sous la forme $\\alpha + \\dfrac{k}{x + \\beta}$ où $\\alpha$, $\\beta$ et $k$ sont des réels à déterminer. (1 pt)",
          "reponse": "On effectue la division : $\\dfrac{2x - 3}{x + 1} = 2 + \\dfrac{-5}{x + 1}$<br>Donc $\\alpha = 2$, $\\beta = 1$, $k = -5$."
        },
        {
          "question": "3) En déduire le sens de variation de $f$ sur $]-\\infty; -1[$ et sur $]-1; +\\infty[$. (1,5 pts)",
          "reponse": "La fonction $x \\mapsto \\dfrac{-5}{x+1}$ est strictement croissante sur chacun des intervalles $]-\\infty; -1[$ et $]-1; +\\infty[$ car $k = -5 < 0$.<br>Donc $f$ est strictement croissante sur $]-\\infty; -1[$ et strictement croissante sur $]-1; +\\infty[$."
        },
        {
          "question": "4) Déterminer les limites de $f$ :<br>a) en $-\\infty$ et en $+\\infty$ (0,5 pt)<br>b) à gauche et à droite de $-1$ (0,5 pt)",
          "reponse": "a) $\\lim_{x \\to -\\infty} f(x) = 2$ et $\\lim_{x \\to +\\infty} f(x) = 2$<br>b) $\\lim_{x \\to -1^-} f(x) = +\\infty$ (car $x+1 < 0$ et $k=-5<0$)<br>$\\lim_{x \\to -1^+} f(x) = -\\infty$ (car $x+1 > 0$ et $k=-5<0$)"
        },
        {
          "question": "5) Donner les équations des asymptotes à la courbe de $f$. (0,5 pt)",
          "reponse": "Asymptote verticale : $x = -1$<br>Asymptote horizontale : $y = 2$"
        },
        {
          "question": "6) Représenter graphiquement la fonction $f$ dans un repère orthonormé en précisant les asymptotes. (2 pts)",
          "reponse": "On trace l'asymptote verticale $x=-1$ et l'asymptote horizontale $y=2$.<br>On place quelques points : $f(0) = -3$, $f(1) = -0,5$, $f(2) = \\frac{1}{3}$, $f(-2) = 7$, $f(-3) = \\frac{9}{2}$.<br>La courbe est une hyperbole située dans les deux branches."
        }
      ]
    },
    {
      "titre": "Exercice 2 : Étude d'une fonction polynôme du second degré",
      "points": "5 pts",
      "enonce": "<p>Soit la fonction $f$ définie par $f(x) = -2x^2 + 8x - 5$.</p>",
      "questions": [
        {
          "question": "1) Mettre $f$ sous forme canonique. (1,5 pts)",
          "reponse": "$f(x) = -2(x^2 - 4x) - 5$<br>$f(x) = -2[(x - 2)^2 - 4] - 5$<br>$f(x) = -2(x - 2)^2 + 8 - 5$<br>$f(x) = -2(x - 2)^2 + 3$"
        },
        {
          "question": "2) Dresser le tableau de variation de $f$ sur $\\mathbb{R}$. (1 pt)",
          "reponse": "$a = -2 < 0$, donc la parabole est tournée vers le bas.<br>Le sommet est en $x = 2$ et le maximum est $f(2) = 3$.<br>$f$ est croissante sur $]-\\infty; 2]$ et décroissante sur $[2; +\\infty[$."
        },
        {
          "question": "3) Déterminer les racines éventuelles de $f$. (1,5 pts)",
          "reponse": "$-2x^2 + 8x - 5 = 0$<br>$\\Delta = 8^2 - 4 \\times (-2) \\times (-5) = 64 - 40 = 24 > 0$<br>$x_1 = \\dfrac{-8 - \\sqrt{24}}{-4} = \\dfrac{8 + 2\\sqrt{6}}{4} = 2 + \\dfrac{\\sqrt{6}}{2}$<br>$x_2 = \\dfrac{-8 + \\sqrt{24}}{-4} = \\dfrac{8 - 2\\sqrt{6}}{4} = 2 - \\dfrac{\\sqrt{6}}{2}$"
        },
        {
          "question": "4) En déduire le signe de $f(x)$ sur $\\mathbb{R}$. (1 pt)",
          "reponse": "$a = -2 < 0$, donc $f(x) > 0$ entre les racines et $f(x) < 0$ à l'extérieur.<br>$f(x) > 0$ sur $]2 - \\dfrac{\\sqrt{6}}{2}; 2 + \\dfrac{\\sqrt{6}}{2}[$<br>$f(x) < 0$ sur $]-\\infty; 2 - \\dfrac{\\sqrt{6}}{2}[ \\cup ]2 + \\dfrac{\\sqrt{6}}{2}; +\\infty[$"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Statistiques",
      "points": "5 pts",
      "enonce": "<p>Lors d'une enquête, on a relevé les notes obtenues par 20 élèves à un test de mathématiques :</p><p style='text-align: center;'>8, 10, 12, 14, 9, 11, 13, 15, 10, 12, 14, 8, 11, 13, 16, 10, 12, 9, 14, 11</p>",
      "questions": [
        {
          "question": "1) Classer ces données dans un tableau statistique (valeurs et effectifs). (0,5 pt)",
          "reponse": "<table border='1' cellpadding='5'><tr><th>Note</th><th>8</th><th>9</th><th>10</th><th>11</th><th>12</th><th>13</th><th>14</th><th>15</th><th>16</th></tr><tr><th>Effectif</th><th>2</th><th>2</th><th>3</th><th>3</th><th>3</th><th>2</th><th>3</th><th>1</th><th>1</th></tr></table>"
        },
        {
          "question": "2) Calculer la moyenne de cette série. (1 pt)",
          "reponse": "$\\bar{x} = \\dfrac{8 \\times 2 + 9 \\times 2 + 10 \\times 3 + 11 \\times 3 + 12 \\times 3 + 13 \\times 2 + 14 \\times 3 + 15 \\times 1 + 16 \\times 1}{20}$<br>$\\bar{x} = \\dfrac{16 + 18 + 30 + 33 + 36 + 26 + 42 + 15 + 16}{20} = \\dfrac{232}{20} = 11,6$<br>La moyenne est de $11,6$."
        },
        {
          "question": "3) Déterminer la médiane de cette série. (1 pt)",
          "reponse": "La série est rangée par ordre croissant. Comme $n=20$, la médiane est la moyenne des 10ème et 11ème valeurs.<br>10ème valeur : 12, 11ème valeur : 12<br>$M_e = \\dfrac{12 + 12}{2} = 12$"
        },
        {
          "question": "4) Calculer le premier et le troisième quartile. (1 pt)",
          "reponse": "$Q_1$ est la valeur de rang $\\dfrac{n}{4} = 5$ : $Q_1 = 10$<br>$Q_3$ est la valeur de rang $\\dfrac{3n}{4} = 15$ : $Q_3 = 14$"
        },
        {
          "question": "5) Calculer l'écart interquartile. (0,5 pt)",
          "reponse": "$EIQ = Q_3 - Q_1 = 14 - 10 = 4$"
        },
        {
          "question": "6) Quelle est la note la plus fréquente (mode) ? (0,5 pt)",
          "reponse": "Plusieurs notes ont l'effectif maximum de 3 (10, 11, 12, 14). La série est multimodale."
        },
        {
          "question": "7) Calculer la variance et l'écart-type de cette série. (0,5 pt)",
          "reponse": "$V = \\dfrac{\\sum n_i (x_i - \\bar{x})^2}{n} = \\dfrac{136,8}{20} = 6,84$<br>$\\sigma = \\sqrt{V} = \\sqrt{6,84} \\approx 2,62$"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Dénombrement",
      "points": "4 pts",
      "enonce": "<p>Une classe de 1ère Technique est composée de 15 élèves dont 7 filles et 8 garçons.</p>",
      "questions": [
        {
          "question": "1) Combien de façons a-t-on de choisir 3 délégués parmi les 15 élèves ? (1 pt)",
          "reponse": "Il s'agit d'une combinaison de 3 éléments parmi 15 :<br>$\\binom{15}{3} = \\dfrac{15 \\times 14 \\times 13}{3 \\times 2 \\times 1} = 455$<br>Il y a 455 façons de choisir 3 délégués."
        },
        {
          "question": "2) Combien de façons a-t-on de choisir un président, un vice-président et un secrétaire parmi les 15 élèves ? (1 pt)",
          "reponse": "L'ordre est important (président, vice-président, secrétaire).<br>Il s'agit d'un arrangement de 3 éléments parmi 15 :<br>$A_{15}^3 = 15 \\times 14 \\times 13 = 2730$<br>Il y a 2730 façons de choisir les trois postes."
        },
        {
          "question": "3) Combien de façons a-t-on de choisir une commission de 4 élèves composée de 2 filles et 2 garçons ? (1 pt)",
          "reponse": "Choisir 2 filles parmi 7 : $\\binom{7}{2} = 21$<br>Choisir 2 garçons parmi 8 : $\\binom{8}{2} = 28$<br>Nombre total : $21 \\times 28 = 588$<br>Il y a 588 façons de former cette commission."
        },
        {
          "question": "4) Combien de façons a-t-on de choisir 2 filles et 2 garçons avec un ordre précis (président, vice-président, secrétaire, trésorier) ? (1 pt)",
          "reponse": "Choisir 2 filles parmi 7 : $\\binom{7}{2} = 21$<br>Choisir 2 garçons parmi 8 : $\\binom{8}{2} = 28$<br>Puis arranger les 4 personnes choisies : $4! = 24$<br>Nombre total : $21 \\times 28 \\times 24 = 14112$<br>Il y a 14112 façons de procéder."
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
