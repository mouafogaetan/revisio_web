<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Mathématiques",
  "classe": "1ère Technique",
  "sequence": "Séquence 2",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Dénombrement",
      "points": "4 pts",
      "enonce": "<div style='font-size:1em; line-height:1.8;'><p>Un code d’accès à un coffre-fort est formé de <strong>4 chiffres</strong> pouvant se répéter, choisis parmi les chiffres de 0 à 9.</p></div>",
      "questions": [
        {
          "question": "<div>1) Déterminer le nombre total de codes possibles. <br/><div class='math-block' style='background:#f0f4f8; padding:8px; border-radius:6px; margin:6px 0;'><div class='math'>$$ \\text{Nombre de codes} = 10 \\times 10 \\times 10 \\times 10 $$</div></div></div>",
          "reponse": "<div>Le nombre total de codes possibles est <strong>10 000</strong>. En effet, pour chaque position, on a 10 choix possibles. D'après le principe du produit cartésien, le nombre de 4-listes d'un ensemble à 10 éléments est <span class='math'>\(10^4\)</span>.</div>"
        },
        {
          "question": "<div>2) Combien de codes différents peut-on former si les chiffres doivent être <strong>tous distincts</strong> ?</div>",
          "reponse": "<div>Si les chiffres sont tous distincts, il s'agit d'un arrangement sans répétition de 4 chiffres parmi 10. Le nombre est : <br/><div class='math-block' style='background:#f0f4f8; padding:8px; border-radius:6px; margin:6px 0;'><div class='math'>$$ A_{10}^{4} = 10 \\times 9 \\times 8 \\times 7 = 5040 $$</div></div>Il y a donc <strong>5 040</strong> codes possibles.</div>"
        },
        {
          "question": "<div>3) Un code est dit \"symétrique\" s'il se lit de la même manière dans les deux sens (ex: 1221). Combien de codes symétriques peut-on former ?</div>",
          "reponse": "<div>Un code symétrique de 4 chiffres est de la forme abba. Il est entièrement déterminé par le choix des deux premiers chiffres (a et b). Pour a, on a 10 choix ; pour b, on a aussi 10 choix. Le nombre de codes symétriques est donc : <br/><div class='math-block' style='background:#f0f4f8; padding:8px; border-radius:6px; margin:6px 0;'><div class='math'>$$ 10 \\times 10 = 100 $$</div></div>Il y a <strong>100</strong> codes symétriques.</div>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Statistiques",
      "points": "6 pts",
      "enonce": "<div style='font-size:1em; line-height:1.8;'><p>On a relevé les notes obtenues par 20 élèves de 1ère Technique à un devoir de Mathématiques :</p><div style='background:#f8f9fa; padding:12px; border-radius:8px; margin:12px 0; text-align:center; font-size:0.95em;'><strong>Série :</strong> 8, 12, 15, 6, 18, 9, 14, 12, 16, 7, 11, 13, 15, 8, 10, 12, 14, 9, 11, 13</div></div>",
      "questions": [
        {
          "question": "<div>1) Ranger les notes dans un tableau des effectifs.</div>",
          "reponse": "<div><div style='background:#f8f9fa; padding:10px; border-radius:6px;'><table style='width:100%; border-collapse:collapse; text-align:center;'><tr style='background:#e9ecef;'><th style='padding:6px; border:1px solid #ccc;'>Note</th><td style='padding:6px; border:1px solid #ccc;'>6</td><td style='padding:6px; border:1px solid #ccc;'>7</td><td style='padding:6px; border:1px solid #ccc;'>8</td><td style='padding:6px; border:1px solid #ccc;'>9</td><td style='padding:6px; border:1px solid #ccc;'>10</td><td style='padding:6px; border:1px solid #ccc;'>11</td><td style='padding:6px; border:1px solid #ccc;'>12</td><td style='padding:6px; border:1px solid #ccc;'>13</td><td style='padding:6px; border:1px solid #ccc;'>14</td><td style='padding:6px; border:1px solid #ccc;'>15</td><td style='padding:6px; border:1px solid #ccc;'>16</td><td style='padding:6px; border:1px solid #ccc;'>18</td></tr><tr><th style='padding:6px; border:1px solid #ccc; background:#e9ecef;'>Effectif</th><td style='padding:6px; border:1px solid #ccc;'>1</td><td style='padding:6px; border:1px solid #ccc;'>1</td><td style='padding:6px; border:1px solid #ccc;'>2</td><td style='padding:6px; border:1px solid #ccc;'>2</td><td style='padding:6px; border:1px solid #ccc;'>1</td><td style='padding:6px; border:1px solid #ccc;'>2</td><td style='padding:6px; border:1px solid #ccc;'>3</td><td style='padding:6px; border:1px solid #ccc;'>2</td><td style='padding:6px; border:1px solid #ccc;'>2</td><td style='padding:6px; border:1px solid #ccc;'>2</td><td style='padding:6px; border:1px solid #ccc;'>1</td><td style='padding:6px; border:1px solid #ccc;'>1</td></tr></table></div></div>"
        },
        {
          "question": "<div>2) Calculer la <strong>moyenne</strong> de cette série.</div>",
          "reponse": "<div>La moyenne est la somme des notes divisée par l'effectif total. <br/><div class='math-block' style='background:#f0f4f8; padding:8px; border-radius:6px; margin:6px 0;'><div class='math'>$$ \\bar{x} = \\dfrac{6 + 7 + 2\\times 8 + 2\\times 9 + 10 + 2\\times 11 + 3\\times 12 + 2\\times 13 + 2\\times 14 + 2\\times 15 + 16 + 18}{20} $$</div></div><div class='math-block' style='background:#f0f4f8; padding:8px; border-radius:6px; margin:6px 0;'><div class='math'>$$ \\bar{x} = \\dfrac{230}{20} = 11.5 $$</div></div>La moyenne de cette série est de <strong>11.5/20</strong>.</div>"
        },
        {
          "question": "<div>3) Déterminer la <strong>médiane</strong> et les <strong>quartiles</strong> de cette série.</div>",
          "reponse": "<div>La série compte 20 valeurs. La médiane est la moyenne de la 10ème et de la 11ème valeur de la série ordonnée.<br/>Série ordonnée : 6, 7, 8, 8, 9, 9, 10, 11, 11, 12, 12, 12, 13, 13, 14, 14, 15, 15, 16, 18.<br/><ul><li><strong>Médiane</strong> : (12 + 12) / 2 = <strong>12</strong>.</li><li><strong>Premier quartile Q1</strong> : position = 20/4 = 5 → Q1 = <strong>9</strong>.</li><li><strong>Troisième quartile Q3</strong> : position = 3×20/4 = 15 → Q3 = <strong>14</strong>.</li></ul>L'écart interquartile est Q3 - Q1 = 14 - 9 = <strong>5</strong>.</div>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Dénombrement et Statistiques (Problème)",
      "points": "5 pts",
      "enonce": "<div style='font-size:1em; line-height:1.8;'><p>Un sondage est réalisé auprès de 30 élèves de 1ère Technique sur leur activité préférée (Sport, Musique, Lecture). Les résultats sont les suivants :</p><ul><li>15 élèves préfèrent le Sport</li><li>10 élèves préfèrent la Musique</li><li>5 élèves préfèrent la Lecture</li></ul><p>On choisit au hasard un groupe de 3 élèves parmi ces 30.</p></div>",
      "questions": [
        {
          "question": "<div>1) Combien de groupes de 3 élèves peut-on former au total ?</div>",
          "reponse": "<div>Il s'agit du nombre de combinaisons de 3 élèves parmi 30. <br/><div class='math-block' style='background:#f0f4f8; padding:8px; border-radius:6px; margin:6px 0;'><div class='math'>$$ \\binom{30}{3} = \\dfrac{30 \\times 29 \\times 28}{3 \\times 2 \\times 1} = 4060 $$</div></div>On peut former <strong>4 060</strong> groupes de 3 élèves.</div>"
        },
        {
          "question": "<div>2) Calculer le nombre de groupes composés <strong>uniquement de sportifs</strong>.</div>",
          "reponse": "<div>On choisit 3 élèves parmi les 15 sportifs. <br/><div class='math-block' style='background:#f0f4f8; padding:8px; border-radius:6px; margin:6px 0;'><div class='math'>$$ \\binom{15}{3} = \\dfrac{15 \\times 14 \\times 13}{6} = 455 $$</div></div>Il y a <strong>455</strong> groupes composés uniquement de sportifs.</div>"
        },
        {
          "question": "<div>3) On souhaite constituer un groupe de 3 élèves avec <strong>au moins un sportif</strong>. Combien de groupes peut-on former ?</div>",
          "reponse": "<div>On utilise la méthode du complémentaire : on soustrait du nombre total de groupes, le nombre de groupes <strong>sans aucun sportif</strong> (c'est-à-dire composés uniquement de musiciens et de lecteurs). Il y a 10 + 5 = 15 élèves non sportifs. <br/><div class='math-block' style='background:#f0f4f8; padding:8px; border-radius:6px; margin:6px 0;'><div class='math'>$$ \\text{Nombre de groupes avec au moins un sportif} = \\binom{30}{3} - \\binom{15}{3} = 4060 - 455 = 3605 $$</div></div>Il y a <strong>3 605</strong> groupes contenant au moins un sportif.</div>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Analyse de données (Statistiques)",
      "points": "5 pts",
      "enonce": "<div style='font-size:1em; line-height:1.8;'><p>Le tableau suivant donne la répartition des salaires mensuels (en milliers de FCFA) des employés d'une entreprise :</p><div style='background:#f8f9fa; padding:12px; border-radius:8px; margin:12px 0;'><table style='width:100%; border-collapse:collapse; text-align:center;'><tr style='background:#e9ecef;'><th style='padding:6px; border:1px solid #ccc;'>Salaire (en milliers)</th><td style='padding:6px; border:1px solid #ccc;'>[100-150[</td><td style='padding:6px; border:1px solid #ccc;'>[150-200[</td><td style='padding:6px; border:1px solid #ccc;'>[200-250[</td><td style='padding:6px; border:1px solid #ccc;'>[250-300[</td><td style='padding:6px; border:1px solid #ccc;'>[300-350[</td></tr><tr><th style='padding:6px; border:1px solid #ccc; background:#e9ecef;'>Effectifs</th><td style='padding:6px; border:1px solid #ccc;'>8</td><td style='padding:6px; border:1px solid #ccc;'>12</td><td style='padding:6px; border:1px solid #ccc;'>15</td><td style='padding:6px; border:1px solid #ccc;'>10</td><td style='padding:6px; border:1px solid #ccc;'>5</td></tr></table></div></div>",
      "questions": [
        {
          "question": "<div>1) Calculer le <strong>salaire moyen</strong> des employés (prendre le centre de chaque classe).</div>",
          "reponse": "<div>Les centres des classes sont : 125, 175, 225, 275, 325. <br/>La moyenne est : <br/><div class='math-block' style='background:#f0f4f8; padding:8px; border-radius:6px; margin:6px 0;'><div class='math'>$$ \\bar{x} = \\dfrac{8\\times 125 + 12\\times 175 + 15\\times 225 + 10\\times 275 + 5\\times 325}{8+12+15+10+5} $$</div></div><div class='math-block' style='background:#f0f4f8; padding:8px; border-radius:6px; margin:6px 0;'><div class='math'>$$ \\bar{x} = \\dfrac{1000 + 2100 + 3375 + 2750 + 1625}{50} = \\dfrac{10850}{50} = 217 $$</div></div>Le salaire moyen est de <strong>217 000 FCFA</strong>.</div>"
        },
        {
          "question": "<div>2) Déterminer la <strong>classe modale</strong> et la <strong>médiane</strong> de cette série.</div>",
          "reponse": "<div><ul><li><strong>Classe modale</strong> : C'est la classe ayant le plus grand effectif, donc la classe [200-250[ avec 15 employés.</li><li><strong>Médiane</strong> : L'effectif total est 50. La médiane est la valeur correspondant au 25ème employé.<br/>Effectifs cumulés croissants : 8, 20, 35, 45, 50. La 25ème valeur se trouve dans la classe [200-250[.<br/>La médiane est donc dans l'intervalle <strong>[200-250[</strong>.</li></ul></div>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
