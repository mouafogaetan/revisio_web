<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Mathématiques CG",
  "classe": "1ère Technique (1ère TI)",
  "sequence": "Séquence 4",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Équations et Inéquations du Second Degré",
      "points": "3 pts",
      "enonce": "<p style='font-size: 1rem; color: #2d3436;'>Cet exercice porte sur la résolution d'équations et d'inéquations du second degré.</p>",
      "questions": [
        {
          "question": "<p><strong>1. (1 pt)</strong> Résoudre dans \( \\mathbb{R} \) l'équation \( 2x^2 - 5x + 2 = 0 \\).</p>",
          "reponse": "<p>\( a = 2 \\), \( b = -5 \\), \( c = 2 \\).<br>\( \\Delta = b^2 - 4ac = (-5)^2 - 4(2)(2) = 25 - 16 = 9 \\).<br>\( \\sqrt{\\Delta} = 3 \\).<br>Les racines sont :<br>\( x_1 = \\frac{5 - 3}{4} = \\frac{2}{4} = \\frac{1}{2} \\)<br>\( x_2 = \\frac{5 + 3}{4} = \\frac{8}{4} = 2 \\).<br>\( S = \\left\\{ \\frac{1}{2} ; 2 \\right\\} \\).</p>"
        },
        {
          "question": "<p><strong>2. (1 pt)</strong> Résoudre dans \( \\mathbb{R} \) l'inéquation \( -x^2 + 3x + 4 \\geq 0 \\).</p>",
          "reponse": "<p>On cherche les racines de \( -x^2 + 3x + 4 = 0 \\).<br>\( \\Delta = 9 - 4(-1)(4) = 9 + 16 = 25 \\).<br>\( x_1 = \\frac{-3 - 5}{-2} = 4 \\)<br>\( x_2 = \\frac{-3 + 5}{-2} = -1 \\).<br>Le coefficient \( a = -1 < 0 \\), donc le polynôme est du signe de \( a \\) à l'extérieur des racines, c'est-à-dire positif entre les racines.<br>\( S = [-1, 4] \\).</p>"
        },
        {
          "question": "<p><strong>3. (1 pt)</strong> Trouver deux nombres dont la somme est 8 et le produit est 15.</p>",
          "reponse": "<p>Soit \( x \\) et \( y \\) les deux nombres.<br>\( x + y = 8 \\) et \( xy = 15 \\).<br>\( x \\) et \( y \\) sont les racines de \( t^2 - 8t + 15 = 0 \\).<br>\( \\Delta = 64 - 60 = 4 \\).<br>\( t_1 = \\frac{8 - 2}{2} = 3 \\) et \( t_2 = \\frac{8 + 2}{2} = 5 \\).<br>Les deux nombres sont 3 et 5.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Généralités sur les Fonctions",
      "points": "2.5 pts",
      "enonce": "<p style='font-size: 1rem; color: #2d3436;'>Cet exercice porte sur la définition d'une fonction, son ensemble de définition et son sens de variation.</p>",
      "questions": [
        {
          "question": "<p><strong>1. (0.5 pt)</strong> Définir une fonction numérique.</p>",
          "reponse": "<p>Une fonction numérique est une relation qui à tout nombre réel \( x \\) d'un certain ensemble (appelé ensemble de définition) associe un unique nombre réel \( f(x) \\).</p>"
        },
        {
          "question": "<p><strong>2. (1 pt)</strong> Déterminer l'ensemble de définition de \( f(x) = \\frac{1}{x-4} \\) et de \( g(x) = \\sqrt{3x+6} \\).</p>",
          "reponse": "<p>Pour \( f(x) = \\frac{1}{x-4} \\), le dénominateur ne doit pas être nul. \( x-4 \\neq 0 \\), donc \( x \\neq 4 \\).<br>\( D_f = ]-\\infty, 4[ \\cup ]4, +\\infty[ \\).<br><br>Pour \( g(x) = \\sqrt{3x+6} \\), le radicande doit être positif ou nul. \( 3x+6 \\geq 0 \\), donc \( x \\geq -2 \\).<br>\( D_g = [-2, +\\infty[ \\).</p>"
        },
        {
          "question": "<p><strong>3. (1 pt)</strong> Étudier le sens de variation de \( h(x) = -3x + 2 \) sur \( \\mathbb{R} \\).</p>",
          "reponse": "<p>Soit \( x_1 < x_2 \\).<br>\( -3x_1 > -3x_2 \\) (car on multiplie par un nombre négatif, l'inégalité change de sens).<br>\( -3x_1 + 2 > -3x_2 + 2 \\).<br>Donc \( h(x_1) > h(x_2) \\). La fonction \( h \\) est strictement décroissante sur \( \\mathbb{R} \\).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Limites et Continuité",
      "points": "2.5 pts",
      "enonce": "<p style='font-size: 1rem; color: #2d3436;'>Cet exercice aborde les notions de limite et de continuité de fonctions.</p>",
      "questions": [
        {
          "question": "<p><strong>1. (1 pt)</strong> Aborder intuitivement la limite de \( f(x) = \\frac{1}{x} \\) lorsque \( x \\) tend vers \( +\\infty \\) et lorsque \( x \\) tend vers \( 0^+ \\).</p>",
          "reponse": "<p>Lorsque \( x \\) tend vers \( +\\infty \\), \( \\frac{1}{x} \\) tend vers 0. On note \( \\lim_{x \\to +\\infty} \\frac{1}{x} = 0 \\).<br>Lorsque \( x \\) tend vers \( 0^+ \\) (par valeurs positives), \( \\frac{1}{x} \\) tend vers \( +\\infty \\). On note \( \\lim_{x \\to 0^+} \\frac{1}{x} = +\\infty \\).</p>"
        },
        {
          "question": "<p><strong>2. (0.5 pt)</strong> Donner une interprétation intuitive de la continuité d'une fonction en un point.</p>",
          "reponse": "<p>Intuitivement, une fonction est continue en un point si on peut tracer sa courbe sans lever le crayon au voisinage de ce point. Il n'y a pas de saut ou de trou dans la courbe.</p>"
        },
        {
          "question": "<p><strong>3. (1 pt)</strong> À l'aide d'un tableau de valeurs, déterminer \( \\lim_{x \\to 1} (2x^2 - 3x + 1) \\).</p>",
          "reponse": "<p>On calcule les valeurs de \( f(x) = 2x^2 - 3x + 1 \\) pour \( x \\) proche de 1.<br>\( f(0.9) = 2(0.81) - 3(0.9) + 1 = 1.62 - 2.7 + 1 = -0.08 \\)<br>\( f(0.99) = 2(0.9801) - 3(0.99) + 1 = 1.9602 - 2.97 + 1 = -0.0098 \\)<br>\( f(1.01) = 2(1.0201) - 3(1.01) + 1 = 2.0402 - 3.03 + 1 = 0.0102 \\)<br>\( f(1.1) = 2(1.21) - 3(1.1) + 1 = 2.42 - 3.3 + 1 = 0.12 \\)<br>On voit que \( f(x) \\) tend vers 0 lorsque \( x \\) tend vers 1.<br>\( \\lim_{x \\to 1} (2x^2 - 3x + 1) = 0 \\).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Fonctions Dérivées",
      "points": "3 pts",
      "enonce": "<p style='font-size: 1rem; color: #2d3436;'>Cet exercice porte sur les fonctions dérivées et leurs applications.</p>",
      "questions": [
        {
          "question": "<p><strong>1. (0.5 pt)</strong> Interpréter géométriquement le nombre dérivé \( f'(a) \\).</p>",
          "reponse": "<p>Le nombre dérivé \( f'(a) \\) est le coefficient directeur de la tangente à la courbe de \( f \\) au point d'abscisse \( a \\).</p>"
        },
        {
          "question": "<p><strong>2. (1 pt)</strong> Déterminer la dérivée des fonctions suivantes :<br> a) \( f(x) = 3x^2 - 2x + 5 \\) <br> b) \( g(x) = \\frac{1}{2x-1} \\)</p>",
          "reponse": "<p><strong>a) \( f(x) = 3x^2 - 2x + 5 \\) :</strong> \( f'(x) = 6x - 2 \\).<br><strong>b) \( g(x) = \\frac{1}{2x-1} \\) :</strong> On utilise la formule \( \\left( \\frac{1}{u} \\right)' = -\\frac{u'}{u^2} \\).<br>\( u = 2x-1 \\), \( u' = 2 \\).<br>\( g'(x) = -\\frac{2}{(2x-1)^2} \\).</p>"
        },
        {
          "question": "<p><strong>3. (0.5 pt)</strong> Donner l'équation de la tangente à la courbe de \( f(x) = x^2 \\) en \( a = 2 \\).</p>",
          "reponse": "<p>\( f(2) = 4 \\).<br>\( f'(x) = 2x \\), donc \( f'(2) = 4 \\).<br>L'équation de la tangente est \( y = f'(a)(x-a) + f(a) \\).<br>\( y = 4(x-2) + 4 = 4x - 8 + 4 = 4x - 4 \\).</p>"
        },
        {
          "question": "<p><strong>4. (1 pt)</strong> Étudier les variations de \( h(x) = -x^2 + 6x - 5 \\) sur \( \\mathbb{R} \\) et en déduire son extremum.</p>",
          "reponse": "<p>\( h'(x) = -2x + 6 \\).<br>\( h'(x) = 0 \\iff -2x + 6 = 0 \\iff x = 3 \\).<br>Signe de \( h'(x) \\) : \( h'(x) > 0 \\iff x < 3 \\) et \( h'(x) < 0 \\iff x > 3 \\).<br>Donc \( h \\) est croissante sur \( ]-\\infty, 3] \\) et décroissante sur \( [3, +\\infty[ \\).<br>\( h(3) = -9 + 18 - 5 = 4 \\). La fonction admet un maximum en \( x = 3 \\) de valeur 4.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 5 : Fonctions Usuelles",
      "points": "3 pts",
      "enonce": "<p style='font-size: 1rem; color: #2d3436;'>Cet exercice porte sur l'étude des fonctions usuelles.</p>",
      "questions": [
        {
          "question": "<p><strong>1. (0.5 pt)</strong> Mettre la fonction \( f(x) = 2x^2 - 8x + 7 \\) sous forme canonique.</p>",
          "reponse": "<p>\( f(x) = 2(x^2 - 4x) + 7 = 2[(x-2)^2 - 4] + 7 = 2(x-2)^2 - 8 + 7 = 2(x-2)^2 - 1 \\).</p>"
        },
        {
          "question": "<p><strong>2. (1 pt)</strong> Étudier la fonction \( f(x) = 2(x-2)^2 - 1 \\) : ensemble de définition, sens de variation, extremum.</p>",
          "reponse": "<p>\( D_f = \\mathbb{R} \\).<br>La forme canonique montre que le sommet de la parabole est en \( (2, -1) \\).<br>Comme \( a = 2 > 0 \\), \( f \\) est décroissante sur \( ]-\\infty, 2] \\) et croissante sur \( [2, +\\infty[ \\).<br>Elle admet un minimum en \( x = 2 \\) de valeur \( f(2) = -1 \\).</p>"
        },
        {
          "question": "<p><strong>3. (1 pt)</strong> Étudier la fonction homographique \( g(x) = \\frac{2x+1}{x-3} \\) : ensemble de définition, mise sous la forme \( \\alpha + \\frac{k}{x+\\beta} \\), sens de variation.</p>",
          "reponse": "<p>\( D_g = \\mathbb{R} \\setminus \\{3\\} \\).<br>Mise sous la forme \( \\alpha + \\frac{k}{x+\\beta} \\) :<br>\( g(x) = \\frac{2x+1}{x-3} \\).<br>On effectue la division : \( 2x+1 = 2(x-3) + 7 \\).<br>Donc \( g(x) = 2 + \\frac{7}{x-3} \\).<br>La courbe est une hyperbole de centre \( (3, 2) \\).<br>Dérivée : \( g'(x) = -\\frac{7}{(x-3)^2} < 0 \\) sur chaque intervalle du domaine de définition.<br>\( g \\) est strictement décroissante sur \( ]-\\infty, 3[ \\) et sur \( ]3, +\\infty[ \\).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 6 : Suites Numériques",
      "points": "3 pts",
      "enonce": "<p style='font-size: 1rem; color: #2d3436;'>Cet exercice porte sur les suites numériques.</p>",
      "questions": [

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
