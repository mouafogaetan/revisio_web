<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Présentation mobile</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' },
            options: { skipHtmlTypes: 'script' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 500px;
        margin: 0 auto;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    .slide-header {
        flex-shrink: 0;
        padding: 18px 16px 10px 16px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        z-index: 10;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .slide-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
    }

    .content-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 18px 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        flex-shrink: 0;
    }

    .content-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .content-card li {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        line-height: 1.5;
    }

    .content-card li:last-child {
        border-bottom: none;
    }

    .bullet-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
    }

    .math-block {
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        overflow-x: auto;
        flex-shrink: 0;
        margin: 4px 0;
    }

    .math-block .math {
        font-size: 1.2rem;
        color: #e2e8f0;
    }

    .note-box {
        background: rgba(96, 165, 250, 0.08);
        border-left: 4px solid #60a5fa;
        padding: 12px 16px;
        border-radius: 12px;
        font-style: italic;
        font-size: 0.9rem;
        color: #cbd5e1;
        flex-shrink: 0;
    }

    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        border-radius: 0;
        flex-direction: column;
    }

    .loading-card {
        background: #1e293b;
        padding: 32px 28px;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #334155;
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px auto;
    }

    .loading-text {
        font-weight: 600;
        font-size: 1.1rem;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    .loading-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 16px;
    }
    .loading-progress {
        height: 3px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        animation: loadingProgress 30s ease-out forwards;
    }

    .loading-timeout {
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 12px;
    }

    .btn-cancel-loading {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 40px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #f87171;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }

    .btn-cancel-loading:active {
        transform: scale(0.94);
        background: rgba(239, 68, 68, 0.25);
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
    }

    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .slide-counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255,255,255,0.05);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(255,255,255,0.04);
    }

    .status-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 30px;
        background: rgba(96, 165, 250, 0.12);
        color: #93bbfc;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
    }

    .status-badge .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: pulse-dot 1.2s infinite;
        flex-shrink: 0;
    }

    .status-badge.idle .dot {
        animation: none;
        background: #64748b;
    }
    .status-badge.speaking .dot {
        background: #34d399;
        animation: pulse-dot 0.8s infinite;
    }
    .status-badge.error .dot {
        background: #f87171;
        animation: none;
    }
    .status-badge.paused .dot {
        animation: none;
        background: #fbbf24;
    }
    .status-badge.waiting .dot {
        animation: pulse-dot 1.5s infinite;
        background: #fbbf24;
    }
    .status-badge.loading .dot {
        animation: pulse-dot 0.5s infinite;
        background: #60a5fa;
    }

    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.7); }
    }

    .footer-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(255,255,255,0.1);
    }

    .btn-secondary {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-play {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
        min-width: 80px;
        justify-content: center;
    }
    .btn-play:active {
        background: rgba(52, 211, 153, 0.25);
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
    }

    .auto-indicator {
        font-size: 0.65rem;
        color: #64748b;
        text-align: center;
        letter-spacing: 0.3px;
        padding: 2px 0;
    }

    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.2rem;
        }
        .content-card li {
            font-size: 0.9rem;
            padding: 8px 0;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .btn-play {
            min-width: 60px;
        }
        .footer-buttons {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
        .loading-card {
            padding: 20px 16px;
        }
        .math-block .math {
            font-size: 1rem;
        }
    }

    @media (min-width: 600px) {
        .app-container {
            max-width: 480px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
        .loading-overlay {
            border-radius: 32px;
        }
    }

    /* Mode jour (par défaut) */
    html, body {
        background: #f0f4f8 !important;
        color: #1a202c !important;
    }
    .app-container {
        background: linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%) !important;
    }
    .slide-header {
        background: rgba(255, 255, 255, 0.85) !important;
        border-bottom: 1px solid rgba(0,0,0,0.08) !important;
    }
    .slide-header h1 {
        background: linear-gradient(135deg, #2b6cb0, #6b46c1) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        background-clip: text !important;
    }
    .slide-footer {
        background: rgba(255, 255, 255, 0.9) !important;
        border-top: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card {
        background: rgba(255,255,255,0.8) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card li {
        border-bottom: 1px solid rgba(0,0,0,0.05) !important;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.12) !important;
        border-left: 4px solid #4299e1 !important;
        color: #2c3e50 !important;
    }
    .math-block {
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .math-block .math {
        color: #2d3748 !important;
    }
    .slide-counter {
        color: #4a5568 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .status-badge {
        background: rgba(96, 165, 250, 0.15) !important;
        color: #2b6cb0 !important;
        border: 1px solid rgba(96, 165, 250, 0.15) !important;
    }
    .btn {
        color: #2d3748 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .btn-secondary {
        background: rgba(0,0,0,0.04) !important;
        border-color: rgba(0,0,0,0.08) !important;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15) !important;
        border-color: rgba(52, 211, 153, 0.2) !important;
        color: #38a169 !important;
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15) !important;
        border-color: rgba(251, 191, 36, 0.2) !important;
        color: #d69e2e !important;
    }
    .auto-indicator {
        color: #718096 !important;
    }
    .loading-card {
        background: #ffffff !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .loading-text {
        color: #1a202c !important;
    }
    .loading-sub {
        color: #4a5568 !important;
    }
</style>
</head>
<body>

<div class="app-container">

    <header class="slide-header">
        <h1 id="slideTitle">Chargement...</h1>
    </header>

    <main class="slide-body" id="slideBody"></main>

    <!-- LOADING OVERLAY AVEC BOUTON ANNULER -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Préparation vocale...</div>
            <div class="loading-sub" id="loadingSub">Synthèse en cours</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loadingProgressBar"></div>
            </div>
            <div class="loading-timeout" id="loadingTimeout">⏱️ 30 secondes maximum</div>
            <button class="btn-cancel-loading" id="cancelLoadingBtn">
                <span>✕</span> Annuler
            </button>
        </div>
    </div>

    <footer class="slide-footer">
        <div class="footer-top">
            <span class="slide-counter" id="slideCounter">1 / 3</span>
            <span class="status-badge idle" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">Prêt</span>
            </span>
        </div>

        <div class="footer-buttons">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-secondary" id="replayBtn">
                <span class="btn-icon">🔁</span> <span class="btn-label">Relire</span>
            </button>
            <button class="btn btn-play" id="playBtn">
                <span class="btn-icon">▶</span> <span class="btn-label">Play</span>
            </button>
        </div>

        <div class="auto-indicator" id="autoIndicator">⏸ Lecture manuelle</div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // SLIDES
    // ================================================================
    const slides = [
  {
    "titre": "Généralités sur les fonctions",
    "contenu": "<div style='display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:20px; background: linear-gradient(135deg, #1a3c5e, #2d6a9f); color:white; border-radius:15px; min-height:200px;'><h2 style='font-size:28px; margin-bottom:20px;'>Généralités sur les fonctions</h2><p style='font-size:20px; font-weight:300; margin-bottom:15px;'>Un outil fondamental pour modéliser le monde</p><div style='background:rgba(255,255,255,0.15); padding:15px; border-radius:10px; width:100%; max-width:500px;'><p style='font-size:16px; margin:0;'>Une fonction est une relation qui associe à chaque élément d'un ensemble un unique élément d'un autre ensemble.</p></div></div>",
    "texteParle": "Bonjour à tous. Aujourd'hui, nous allons aborder un chapitre essentiel en mathématiques : les généralités sur les fonctions. Une fonction est une relation qui associe à chaque élément d'un ensemble, appelé ensemble de départ, un unique élément d'un autre ensemble, appelé ensemble d'arrivée. Les fonctions sont partout autour de nous, que ce soit en physique, en économie ou dans la vie quotidienne.",
    "note": "Introduction aux généralités sur les fonctions."
  },
  {
    "titre": "Définition d'une fonction",
    "contenu": "<div style='display:flex; flex-direction:column; gap:15px; padding:15px; background:#f4f6f9; border-radius:12px;'><h3 style='color:#1a5276; margin:0;'>Définition d'une fonction</h3><div style='background:white; padding:15px; border-radius:8px; box-shadow:0 2px 5px rgba(0,0,0,0.1);'><p style='margin:5px 0; font-size:16px;'><strong>Définition :</strong> Une <strong>fonction</strong> \\( f \\) est un procédé qui à tout nombre \\( x \\) d'un ensemble \\( D \\) associe un unique nombre noté \\( f(x) \\).</p><ul style='margin:10px 0; padding-left:25px; font-size:16px;'><li>\\( x \\) est appelé <strong>antécédent</strong> ou <strong>variable</strong></li><li>\\( f(x) \\) est appelé <strong>image</strong> de \\( x \\) par \\( f \\)</li><li>\\( D \\) est l'<strong>ensemble de définition</strong> de \\( f \\)</li></ul></div><div style='background:#eaf2f8; padding:15px; border-radius:8px; border-left:5px solid #2980b9;'><p style='margin:0; font-size:15px;'><strong>Notation :</strong> On écrit \\( f : \\begin{cases} D \\rightarrow \\mathbb{R} \\\\ x \\mapsto f(x) \\end{cases} \\)</p></div><div style='background:#fdf2e9; padding:15px; border-radius:8px; border-left:5px solid #e67e22;'><p style='margin:0; font-size:14px;'><strong>📝 Exemple :</strong> \\( f(x) = x^2 \\) est une fonction qui, à tout nombre réel \\( x \\), associe son carré.</p></div></div>",
    "texteParle": "Commençons par la définition d'une fonction. Une fonction f est un procédé qui à tout nombre x d'un ensemble D associe un unique nombre noté f de x. Le nombre x est appelé l'antécédent ou la variable, et f de x est appelé l'image de x par f. L'ensemble D est l'ensemble de définition de la fonction. On note une fonction de la manière suivante : f qui va de D dans R, et qui à x associe f de x. Par exemple, la fonction f de x égale x au carré est une fonction qui, à tout nombre réel x, associe son carré.",
    "note": "Définition formelle d'une fonction."
  },
  {
    "titre": "Ensemble de définition",
    "contenu": "<div style='display:flex; flex-direction:column; gap:15px; padding:15px; background:#f4f6f9; border-radius:12px;'><h3 style='color:#1a5276; margin:0;'>Ensemble de définition</h3><div style='background:white; padding:15px; border-radius:8px; box-shadow:0 2px 5px rgba(0,0,0,0.1);'><p style='margin:5px 0; font-size:16px;'>L'<strong>ensemble de définition</strong> d'une fonction \\( f \\) est l'ensemble des valeurs de \\( x \\) pour lesquelles \\( f(x) \\) existe.</p><p style='margin:10px 0; font-weight:bold;'>Règles importantes :</p><ul style='margin:5px 0; padding-left:25px; font-size:16px;'><li><strong>Pas de division par zéro</strong> : \\( \\frac{1}{x} \\) n'existe pas pour \\( x = 0 \\)</li><li><strong>Pas de racine carrée d'un nombre négatif</strong> : \\( \\sqrt{x} \\) n'existe pas pour \\( x < 0 \\)</li></ul></div><div style='background:#eaf2f8; padding:15px; border-radius:8px;'><p style='font-weight:bold; margin:0 0 10px 0;'>Exemples :</p><ul style='margin:5px 0;'><li>\\( f(x) = \\frac{1}{x-2} \\) : ensemble de définition \\( D_f = \\mathbb{R} \\setminus \\{2\\} \\)</li><li>\\( f(x) = \\sqrt{x+1} \\) : ensemble de définition \\( D_f = [-1; +\\infty[ \\)</li><li>\\( f(x) = x^2 - 3x + 2 \\) : ensemble de définition \\( D_f = \\mathbb{R} \\)</li></ul></div></div>",
    "texteParle": "L'ensemble de définition d'une fonction est l'ensemble des valeurs de x pour lesquelles f de x existe. Il faut faire attention à certaines règles importantes. On ne peut pas diviser par zéro, donc une fonction comme 1 sur x n'existe pas pour x égale zéro. On ne peut pas non plus prendre la racine carrée d'un nombre négatif. Par exemple, pour la fonction f de x égale 1 sur x moins 2, l'ensemble de définition est tous les nombres réels sauf 2. Pour la fonction racine carrée de x plus 1, l'ensemble de définition est l'intervalle de moins 1 à plus l'infini.",
    "note": "Détermination de l'ensemble de définition."
  },
  {
    "titre": "Image et antécédent",
    "contenu": "<div style='display:flex; flex-direction:column; gap:15px; padding:15px; background:#f4f6f9; border-radius:12px;'><h3 style='color:#1a5276; margin:0;'>Image et antécédent</h3><div style='background:white; padding:15px; border-radius:8px; box-shadow:0 2px 5px rgba(0,0,0,0.1);'><p style='margin:5px 0; font-size:16px;'><strong>Image :</strong> Si \\( y = f(x) \\), alors \\( y \\) est l'image de \\( x \\) par \\( f \\).</p><p style='margin:10px 0; font-size:16px;'><strong>Antécédent :</strong> Si \\( y = f(x) \\), alors \\( x \\) est un antécédent de \\( y \\) par \\( f \\).</p></div><div style='background:#eaf2f8; padding:15px; border-radius:8px;'><p style='font-weight:bold; margin:0 0 10px 0;'>Exemple avec \\( f(x) = x^2 \\) :</p><ul style='margin:5px 0;'><li>L'image de 3 est \\( f(3) = 3^2 = 9 \\)</li><li>L'antécédent de 16 est \\( x \\) tel que \\( x^2 = 16 \\), donc \\( x = -4 \\) ou \\( x = 4 \\)</li><li>Attention : une image peut avoir plusieurs antécédents</li></ul></div><div style='background:#fdf2e9; padding:15px; border-radius:8px; border-left:5px solid #e67e22;'><p style='margin:0; font-size:14px;'><strong>💡 Important :</strong> Une fonction associe à chaque \\( x \\) une unique image, mais une image peut avoir plusieurs antécédents.</p></div></div>",
    "texteParle": "Distinguons maintenant les notions d'image et d'antécédent. Si y égale f de x, alors y est l'image de x par f. Et x est un antécédent de y par f. Prenons l'exemple de la fonction f de x égale x au carré. L'image de 3 est f de 3 égale 9. L'antécédent de 16 est x tel que x au carré égale 16, donc x égale moins 4 ou x égale 4. Il est important de retenir qu'une image peut avoir plusieurs antécédents, mais une fonction associe à chaque x une unique image.",
    "note": "Différence entre image et antécédent."
  },
  {
    "titre": "Sens de variation",
    "contenu": "<div style='display:flex; flex-direction:column; gap:15px; padding:15px; background:#f4f6f9; border-radius:12px;'><h3 style='color:#1a5276; margin:0;'>Sens de variation d'une fonction</h3><div style='background:white; padding:15px; border-radius:8px; box-shadow:0 2px 5px rgba(0,0,0,0.1);'><p style='margin:5px 0; font-size:16px;'>Le sens de variation d'une fonction indique comment évoluent les images lorsque les antécédents augmentent.</p><div style='background:#e8f4f8; padding:15px; border-radius:8px; margin:10px 0;'><p style='font-weight:bold; margin:0 0 5px 0;'>Fonction croissante</p><p style='margin:0;'>Pour tous \\( a \\) et \\( b \\) de l'intervalle : si \\( a < b \\) alors \\( f(a) < f(b) \\)</p></div><div style='background:#fde8e8; padding:15px; border-radius:8px; margin:10px 0;'><p style='font-weight:bold; margin:0 0 5px 0;'>Fonction décroissante</p><p style='margin:0;'>Pour tous \\( a \\) et \\( b \\) de l'intervalle : si \\( a < b \\) alors \\( f(a) > f(b) \\)</p></div></div><div style='background:#fdf2e9; padding:15px; border-radius:8px; border-left:5px solid #e67e22;'><p style='margin:0; font-size:14px;'><strong>📝 Exemple :</strong> \\( f(x) = x^2 \\) est décroissante sur \\( ]-\\infty; 0] \\) et croissante sur \\( [0; +\\infty[ \\).</p></div></div>",
    "texteParle": "Le sens de variation d'une fonction nous indique comment évoluent les images lorsque les antécédents augmentent. Une fonction est croissante sur un intervalle si, pour tous a et b dans cet intervalle, lorsque a est plus petit que b, alors f de a est plus petit que f de b. Une fonction est décroissante si, lorsque a est plus petit que b, alors f de a est plus grand que f de b. Par exemple, la fonction f de x égale x au carré est décroissante sur l'intervalle de moins l'infini à zéro, et croissante sur l'intervalle de zéro à plus l'infini.",
    "note": "Définition des fonctions croissantes et décroissantes."
  },
  {
    "titre": "Représentation graphique",
    "contenu": "<div style='display:flex; flex-direction:column; gap:15px; padding:15px; background:#f4f6f9; border-radius:12px;'><h3 style='color:#1a5276; margin:0;'>Représentation graphique d'une fonction</h3><div style='background:white; padding:15px; border-radius:8px; box-shadow:0 2px 5px rgba(0,0,0,0.1);'><p style='margin:5px 0; font-size:16px;'>Dans un repère, la <strong>courbe représentative</strong> d'une fonction \\( f \\) est l'ensemble des points \\( M(x; f(x)) \\) où \\( x \\) parcourt l'ensemble de définition.</p></div><div style='background:#eaf2f8; padding:15px; border-radius:8px;'><p style='font-weight:bold; margin:0 0 10px 0;'>Pour tracer une courbe :</p><ol style='margin:5px 0; padding-left:25px; font-size:16px;'><li>On choisit des valeurs de \\( x \\) dans l'ensemble de définition</li><li>On calcule leurs images \\( f(x) \\)</li><li>On place les points \\( (x; f(x)) \\) dans un repère</li><li>On relie les points pour obtenir la courbe</li></ol></div><div style='background:#fdf2e9; padding:15px; border-radius:8px; border-left:5px solid #e67e22;'><p style='margin:0; font-size:14px;'><strong>📊 Exemple :</strong> La représentation de \\( f(x) = x^2 \\) est une parabole.</p></div></div>",
    "texteParle": "La représentation graphique d'une fonction est très utile pour visualiser son comportement. Dans un repère, la courbe représentative d'une fonction f est l'ensemble des points M de coordonnées x et f de x, où x parcourt l'ensemble de définition. Pour tracer une courbe, on choisit des valeurs de x, on calcule leurs images, on place les points correspondants dans un repère, puis on relie ces points. Par exemple, la représentation de f de x égale x au carré est une parabole.",
    "note": "Méthode pour tracer une courbe représentative."
  },
  {
    "titre": "Tableau de valeurs",
    "contenu": "<div style='display:flex; flex-direction:column; gap:15px; padding:15px; background:#f4f6f9; border-radius:12px;'><h3 style='color:#1a5276; margin:0;'>Tableau de valeurs</h3><div style='background:white; padding:15px; border-radius:8px; box-shadow:0 2px 5px rgba(0,0,0,0.1);'><p style='margin:5px 0; font-size:16px;'>Un tableau de valeurs permet de présenter de manière ordonnée les images de certaines valeurs choisies.</p><div style='background:#f0f8ff; padding:15px; border-radius:8px; margin:10px 0;'><p style='font-weight:bold; margin:0 0 10px 0;'>Exemple pour \\( f(x) = x^2 - 2x + 1 \\) :</p><table style='width:100%; border-collapse:collapse; text-align:center; font-size:14px;'><tr style='background:#1a5276; color:white;'><th style='padding:8px; border:1px solid #ddd;'>x</th><td style='padding:8px; border:1px solid #ddd;'>-1</td><td style='padding:8px; border:1px solid #ddd;'>0</td><td style='padding:8px; border:1px solid #ddd;'>1</td><td style='padding:8px; border:1px solid #ddd;'>2</td><td style='padding:8px; border:1px solid #ddd;'>3</td></tr><tr><th style='padding:8px; border:1px solid #ddd;background:#1a5276; color:white;'>f(x)</th><td style='padding:8px; border:1px solid #ddd;'>4</td><td style='padding:8px; border:1px solid #ddd;'>1</td><td style='padding:8px; border:1px solid #ddd;'>0</td><td style='padding:8px; border:1px solid #ddd;'>1</td><td style='padding:8px; border:1px solid #ddd;'>4</td></tr></table></div></div><div style='background:#fdf2e9; padding:15px; border-radius:8px; border-left:5px solid #e67e22;'><p style='margin:0; font-size:14px;'><strong>💡 Astuce :</strong> Le tableau de valeurs aide à construire la courbe en donnant des points de passage.</p></div></div>",
    "texteParle": "Un tableau de valeurs est un outil pratique pour présenter de manière ordonnée les images de certaines valeurs choisies. Par exemple, pour la fonction f de x égale x au carré moins 2x plus 1, on peut calculer les images pour x égale moins 1, 0, 1, 2 et 3. On obtient respectivement 4, 1, 0, 1 et 4. Ce tableau nous aide à tracer la courbe en nous donnant des points de passage précis.",
    "note": "Utilité du tableau de valeurs pour tracer une courbe."

  {
    "titre": "Fonction paire et impaire",
    "contenu": "<div style='display:flex; flex-direction:column; gap:15px; padding:15px; background:#f4f6f9; border-radius:12px;'><h3 style='color:#1a5276; margin:0;'>Fonctions paires et impaires</h3><div style='background:white; padding:15px; border-radius:8px; box-shadow:0 2px 5px rgba(0,0,0,0.1);'><div style='background:#e8f4f8; padding:15px; border-radius:8px; margin:0 0 15px 0;'><p style='font-weight:bold; margin:0 0 5px 0;'>Fonction paire</p><p style='margin:0;'>\\( f(-x) = f(x) \\) pour tout \\( x \\) de \\( D_f \\)</p><p style='margin:5px 0 0 0; font-size:14px;'>La courbe est symétrique par rapport à l'axe des ordonnées.</p></div><div style='background:#fde8e8; padding:15px; border-radius:8px; margin:0 0 15px 0;'><p style='font-weight:bold; margin:0 0 5px 0;'>Fonction impaire</p><p style='margin:0;'>\\( f(-x) = -f(x) \\) pour tout \\( x \\) de \\( D_f \\)</p><p style='margin:5px 0 0 0; font-size:14px;'>La courbe est symétrique par rapport à l'origine du repère.</p></div></div><div style='background:#fdf2e9; padding:15px; border-radius:8px; border-left:5px solid #e67e22;'><p style='margin:0; font-size:14px;'><strong>📝 Exemples :</strong> \\( f(x) = x^2 \\) est paire, \\( f(x) = x^3 \\) est impaire.</p></div></div>",
    "texteParle": "Certaines fonctions ont des propriétés de symétrie intéressantes. Une fonction est paire si f de moins x est égal à f de x pour tout x de l'ensemble de définition. Sa courbe est alors symétrique par rapport à l'axe des ordonnées. Une fonction est impaire si f de moins x est égal à moins f de x. Sa courbe est alors symétrique par rapport à l'origine du repère. Par exemple, f de x égale x au carré est paire, et f de x égale x au cube est impaire.",
    "note": "Définition des fonctions paires et impaires."

  {
    "titre": "Fonctions de référence",
    "contenu": "<div style='display:flex; flex-direction:column; gap:15px; padding:15px; background:#f4f6f9; border-radius:12px;'><h3 style='color:#1a5276; margin:0;'>Fonctions de référence</h3><div style='background:white; padding:15px; border-radius:8px; box-shadow:0 2px 5px rgba(0,0,0,0.1);'><p style='margin:5px 0; font-size:16px;'>Voici quelques fonctions que vous devez connaître :</p><div style='display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:15px 0;'><div style='background:#e8f4f8; padding:12px; border-radius:8px; text-align:center;'><p style='font-weight:bold; margin:0;'>Fonction carré</p><div class='math-block'><div class='math'>$$ f(x) = x^2 $$</div></div></div><div style='background:#e8f4f8; padding:12px; border-radius:8px; text-align:center;'><p style='font-weight:bold; margin:0;'>Fonction cube</p><div class='math-block'><div class='math'>$$ f(x) = x^3 $$</div></div></div><div style='background:#e8f4f8; padding:12px; border-radius:8px; text-align:center;'><p style='font-weight:bold; margin:0;'>Fonction inverse</p><div class='math-block'><div class='math'>$$ f(x) = \\frac{1}{x} $$</div></div></div><div style='background:#e8f4f8; padding:12px; border-radius:8px; text-align:center;'><p style='font-weight:bold; margin:0;'>Fonction racine carrée</p><div class='math-block'><div class='math'>$$ f(x) = \\sqrt{x} $$</div></div></div></div></div></div>",
    "texteParle": "Il existe des fonctions de référence que vous devez absolument connaître. La fonction carré, f de x égale x au carré. La fonction cube, f de x égale x au cube. La fonction inverse, f de x égale 1 sur x. Et la fonction racine carrée, f de x égale racine carrée de x. Ces fonctions sont les briques de base qui nous serviront à construire des fonctions plus complexes.",
    "note": "Présentation des fonctions de référence."

  {
    "titre": "Opérations sur les fonctions",
    "contenu": "<div style='display:flex; flex-direction:column; gap:15px; padding:15px; background:#f4f6f9; border-radius:12px;'><h3 style='color:#1a5276; margin:0;'>Opérations sur les fonctions</h3><div style='background:white; padding:15px; border-radius:8px; box-shadow:0 2px 5px rgba(0,0,0,0.1);'><p style='margin:5px 0; font-size:16px;'>À partir de fonctions connues, on peut construire de nouvelles fonctions par :</p><ul style='margin:10px 0; padding-left:25px; font-size:16px;'><li><strong>Addition :</strong> \\( (f+g)(x) = f(x) + g(x) \\)</li><li><strong>Soustraction :</strong> \\( (f-g)(x) = f(x) - g(x) \\)</li><li><strong>Multiplication :</strong> \\( (f \\times g)(x) = f(x) \\times g(x) \\)</li><li><strong>Composition :</strong> \\( (f \\circ g)(x) = f(g(x)) \\)</li></ul></div><div style='background:#eaf2f8; padding:15px; border-radius:8px;'><p style='font-weight:bold; margin:0 0 10px 0;'>Exemple :</p><p style='margin:5px 0;'>Soit \\( f(x) = x^2 \\) et \\( g(x) = 2x + 1 \\)</p><ul style='margin:5px 0;'><li>\\( (f+g)(x) = x^2 + 2x + 1 \\)</li><li>\\( (f \\circ g)(x) = (2x+1)^2 = 4x^2 + 4x + 1 \\)</li></ul></div></div>",
    "texteParle": "À partir de fonctions connues, on peut construire de nouvelles fonctions en effectuant des opérations. On peut additionner deux fonctions : f plus g de x égale f de x plus g de x. On peut les soustraire, les multiplier, ou encore les composer. La composition, notée f rond g de x, signifie qu'on applique d'abord g à x, puis on applique f au résultat. Par exemple, avec f de x égale x au carré et g de x égale 2x plus 1, la somme est x au carré plus 2x plus 1, et la composition est 2x plus 1 au carré.",
    "note": "Opérations sur les fonctions."

  {
    "titre": "En résumé",
    "contenu": "<div style='display:flex; flex-direction:column; gap:15px; padding:20px; background: linear-gradient(135deg, #1a3c5e, #2d6a9f); color:white; border-radius:15px; text-align:center;'><h2 style='margin:0;'>Récapitulatif</h2><div style='display:grid; grid-template-columns:1fr 1fr 1fr; gap:15px;'><div style='background:rgba(255,255,255,0.15); padding:15px; border-radius:10px;'><p style='font-weight:bold; margin:0; font-size:18px;'>📐</p><p style='margin:5px 0; font-size:15px;'>Définition</p><p style='margin:0; font-size:13px;'>Une fonction associe à chaque x une unique image f(x)</p></div><div style='background:rgba(255,255,255,0.15); padding:15px; border-radius:10px;'><p style='font-weight:bold; margin:0; font-size:18px;'>📊</p><p style='margin:5px 0; font-size:15px;'>Variations</p><p style='margin:0; font-size:13px;'>Croissante ou décroissante</p></div><div style='background:rgba(255,255,255,0.15); padding:15px; border-radius:10px;'><p style='font-weight:bold; margin:0; font-size:18px;'>🔢</p><p style='margin:5px 0; font-size:15px;'>Fonctions de référence</p><p style='margin:0; font-size:13px;'>x², x³, 1/x, √x</p></div></div><div style='background:rgba(255,255,255,0.2); padding:15px; border-radius:10px; margin-top:10px;'><p style='margin:0; font-size:16px;'>Image, antécédent, fonction paire, impaire, opérations sur les fonctions</p></div><p style='margin:10px 0 0 0; font-style:italic; font-size:14px;'>« Les fonctions sont le langage universel pour décrire le monde qui nous entoure. »</p></div>",
    "texteParle": "Pour résumer, nous avons vu aujourd'hui les généralités sur les fonctions. Une fonction associe à chaque x une unique image f de x. Nous avons appris à déterminer l'ensemble de définition, à distinguer l'image et l'antécédent. Nous avons également vu les notions de fonction croissante et décroissante, de fonction paire et impaire. Enfin, nous avons présenté les fonctions de référence et les opérations que l'on peut effectuer sur les fonctions. Les fonctions sont un outil puissant pour décrire et comprendre le monde qui nous entoure.",
    "note": "Récapitulatif des notions clés."

];

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentIndex = 0;
    let isSpeaking = false;
    let isPaused = false;
    let currentUtterance = null;
    let isLoading = false;
    let loadingTimeout = null;
    let isTransitioning = false;
    let speechSupported = true;
    let userInteracted = false;
    let isPlaying = false;
    let loadingCancelled = false;

    const total = slides.length;
    const synth = window.speechSynthesis;

    // Références jQuery
    const $title = $('#slideTitle');
    const $body = $('#slideBody');
    const $counter = $('#slideCounter');
    const $statusText = $('#statusText');
    const $statusBadge = $('#statusBadge');
    const $loading = $('#loadingOverlay');
    const $loadingText = $('#loadingText');
    const $loadingSub = $('#loadingSub');
    const $loadingTimeout = $('#loadingTimeout');
    const $loadingProgressBar = $('#loadingProgressBar');
    const $autoIndicator = $('#autoIndicator');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $replay = $('#replayBtn');
    const $play = $('#playBtn');
    const $cancelLoading = $('#cancelLoadingBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function setStatus(text, type) {
        $statusText.text(text);
        $statusBadge.removeClass('idle speaking error paused waiting loading');
        if (type === 'speaking') $statusBadge.addClass('speaking');
        else if (type === 'error') $statusBadge.addClass('error');
        else if (type === 'paused') $statusBadge.addClass('paused');
        else if (type === 'waiting') $statusBadge.addClass('waiting');
        else if (type === 'loading') $statusBadge.addClass('loading');
        else $statusBadge.addClass('idle');
    }

    function updatePlayButton() {
        if (isPlaying) {
            $play.addClass('playing');
            $play.find('.btn-icon').text('⏸');
            $play.find('.btn-label').text('Pause');
        } else {
            $play.removeClass('playing');
            $play.find('.btn-icon').text('▶');
            $play.find('.btn-label').text('Play');
        }
    }

    function showLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        
        loadingCancelled = false;
        isLoading = true;
        
        // Réinitialiser la barre de progression
        $loadingProgressBar.css('animation', 'none');
        $loadingProgressBar.css('width', '0%');
        // Forcer un reflow
        $loadingProgressBar[0].offsetHeight;
        $loadingProgressBar.css('animation', 'loadingProgress 30s ease-out forwards');
        
        $loadingText.text('Préparation vocale...');
        $loadingSub.text('Synthèse en cours');
        $loadingTimeout.text('⏱️ 30 secondes maximum');
        $loading.fadeIn(300);
        setStatus("⏳ Chargement...", 'loading');
        
        // 🔥 TIMEOUT DE 30 SECONDES
        loadingTimeout = setTimeout(() => {
            if (isLoading && !loadingCancelled) {
                hideLoading();
                setStatus("⚠️ Délai dépassé (30s)", 'error');
                isPlaying = false;
                updatePlayButton();
                $loadingSub.text('La synthèse vocale a pris trop de temps');
                $loadingTimeout.text('❌ Délai dépassé');
            }
        }, 30000);
    }

    function hideLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        isLoading = false;
        loadingCancelled = false;
        $loading.fadeOut(300);
        // Ne pas changer le statut si on est en train de parler
        if (!isSpeaking && !isPlaying) {
            setStatus("⏸ Lecture arrêtée", 'paused');
        }
    }

    function cancelLoading() {
        loadingCancelled = true;
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        hideLoading();
        stopSpeaking();
        setStatus("⏸ Annulé", 'paused');
        isPlaying = false;
        updatePlayButton();
        $loadingText.text('Annulé par l\'utilisateur');
        $loadingSub.text('Vous pouvez réessayer');
        $loadingTimeout.text('✕ Annulation');
    }

    // Arrêter la parole proprement
    function stopSpeaking() {
        try {
            if (synth && (synth.speaking || synth.pending)) {
                synth.cancel();
            }
        } catch(e) {
            console.warn('Erreur stopSpeaking:', e);
        }
        if (currentUtterance) {
            try {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance.onstart = null;
            } catch(e) {}
            currentUtterance = null;
        }
        isSpeaking = false;
        isPlaying = false;
        updatePlayButton();
    }

    // Mettre en pause la parole
    function pauseSpeaking() {
        try {
            if (synth && synth.speaking) {
                synth.pause();
                isPaused = true;
                isPlaying = false;
                setStatus("⏸ Lecture en pause", 'paused');
                updatePlayButton();
            }
        } catch(e) {
            console.warn('Erreur pauseSpeaking:', e);
            stopSpeaking();
        }
    }

    // Reprendre la parole
    function resumeSpeaking() {
        try {
            if (synth && synth.paused) {
                synth.resume();
                isPaused = false;
                isPlaying = true;
                setStatus("🔊 Lecture en cours", 'speaking');
                updatePlayButton();
            } else if (!isSpeaking && !synth.speaking && !synth.pending) {
                speakSlide(currentIndex);
            }
        } catch(e) {
            console.warn('Erreur resumeSpeaking:', e);
            speakSlide(currentIndex);
        }
    }

    function renderSlide(index) {
        const slide = slides[index];
        $title.text(slide.titre);

        let html = '';
        html += `<div class="content-card">${slide.contenu}</div>`;
        if (slide.note) {
            html += `<div class="note-box">${slide.note}</div>`;
        }
        $body.html(html);
        $counter.text(`${index+1} / ${total}`);

        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
        }
    }

    // ================================================================
    // LECTURE VOCALE
    // ================================================================
    function speakSlide(index) {
        return new Promise((resolve) => {
            const slide = slides[index];
            const text = slide.texteParle;
            
            if (!text || text.trim() === '' || !speechSupported) {
                resolve();
                return;
            }

            if (!window.speechSynthesis) {
                setStatus("❌ Synthèse vocale non supportée", 'error');
                speechSupported = false;
                resolve();
                return;
            }

            // Arrêter toute lecture en cours
            stopSpeaking();
            
            // Réinitialiser l'état de pause
            isPaused = false;
            
            showLoading();
            setStatus("Initialisation...", 'loading');

            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.92;
                utterance.pitch = 1.05;
                utterance.volume = 1;

                let isFinished = false;
                let errorHandled = false;

                utterance.onstart = function() {
                    if (loadingCancelled) {
                        stopSpeaking();
                        resolve();
                        return;
                    }
                    hideLoading();
                    isSpeaking = true;
                    isPlaying = true;
                    isPaused = false;
                    setStatus("🔊 Lecture en cours", 'speaking');
                    updatePlayButton();
                };

                utterance.onend = function() {
                    if (isFinished) return;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    setStatus("✅ Terminé", 'idle');
                    hideLoading();
                    updatePlayButton();
                    resolve();
                };

                utterance.onerror = function(e) {
                    if (isFinished || errorHandled) return;
                    errorHandled = true;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    hideLoading();
                    updatePlayButton();
                    
                    if (e.error === 'not-allowed') {
                        setStatus("⚠️ Permission refusée", 'error');
                    } else if (e.error === 'synthesis-unavailable') {
                        setStatus("⚠️ Synthèse indisponible", 'error');
                    } else if (e.error === 'canceled') {
                        setStatus("⏸ Annulé", 'paused');
                    } else {
                        setStatus("❌ Erreur audio: " + (e.error || 'inconnue'), 'error');
                    }
                    
                    resolve();
                };

                // Gestion du chargement des voix
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = function() {
                        if (!loadingCancelled) {
                            try {
                                synth.speak(utterance);
                            } catch(err) {
                                // Silencieux
                            }
                        }
                        synth.onvoiceschanged = null;
                    };
                }

                currentUtterance = utterance;
                
                if (!loadingCancelled) {
                    try {
                        synth.speak(utterance);
                    } catch(err) {
                        setTimeout(() => {
                            if (!loadingCancelled) {
                                try {
                                    synth.speak(utterance);
                                } catch(e) {
                                    setStatus("❌ Erreur de lecture", 'error');
                                    isPlaying = false;
                                    updatePlayButton();
                                    hideLoading();
                                    resolve();
                                }
                            } else {
                                resolve();
                            }
                        }, 100);
                    }
                } else {
                    resolve();
                }

            } catch(err) {
                hideLoading();
                setStatus("❌ Erreur générale", 'error');
                isPlaying = false;
                updatePlayButton();
                console.error('Erreur speakSlide:', err);
                resolve();
            }
        });
    }

    // ================================================================
    // NAVIGATION
    // ================================================================
    async function goToSlide(index) {
        if (isTransitioning) return;
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        
        // Si on est en train de lire, on met en pause avant de naviguer
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        // Arrêter complètement la lecture
        stopSpeaking();
        
        await new Promise(r => setTimeout(r, 50));
        
        if (index === currentIndex) {
            setStatus("📄 Slide actuel", 'idle');
            return;
        }

        isTransitioning = true;
        currentIndex = index;
        renderSlide(index);
        
        // Réinitialiser l'état de lecture
        isPlaying = false;
        updatePlayButton();
        setStatus("⏸ Lecture arrêtée", 'paused');

        await new Promise(r => setTimeout(r, 150));
        isTransitioning = false;
    }

    async function goToNext() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex + 1 < total) {
            await goToSlide(currentIndex + 1);
        } else {
            setStatus("🏁 Dernier slide", 'idle');
        }
    }

    async function goToPrev() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex - 1 >= 0) {
            await goToSlide(currentIndex - 1);
        } else {
            setStatus("🔁 Premier slide", 'idle');
        }
    }

    // ================================================================
    // GESTION PLAY/PAUSE
    // ================================================================
    function togglePlay() {
        if (!userInteracted) {
            userInteracted = true;
        }

        // Si le chargement est en cours, on l'annule
        if (isLoading) {
            cancelLoading();
            return;
        }

        // Si le synthétiseur est en pause, on reprend
        if (synth && synth.paused) {
            resumeSpeaking();
            return;
        }

        // Si la lecture est en cours, on met en pause
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
            return;
        }

        // Sinon, on démarre la lecture du slide courant
        if (!isSpeaking && !isPlaying) {
            stopSpeaking();
            speakSlide(currentIndex);
        }
    }

    // ================================================================
    // INIT
    // ================================================================
    async function init() {
        // Vérifier la compatibilité
        if (!window.speechSynthesis) {
            setStatus("❌ Synthèse vocale non supportée", 'error');
            speechSupported = false;
        }

        // Précharger les voix
        try {
            if (synth.getVoices) {
                synth.getVoices();
                setTimeout(() => {
                    try {
                        synth.getVoices();
                    } catch(e) {}
                }, 200);
            }
        } catch(e) {
            console.warn('Erreur chargement voix:', e);
        }

        // Afficher le premier slide
        renderSlide(0);
        $counter.text(`1 / ${total}`);
        
        // État initial
        setStatus("⏸ Appuie sur Play", 'paused');
        updatePlayButton();
        $autoIndicator.text('⏸ Lecture manuelle');

        // ================================================================
        // ÉVÉNEMENTS
        // ================================================================
        
        // Bouton Play/Pause
        $play.on('click', function() {
            togglePlay();
        });

        // Bouton Annuler le chargement
        $cancelLoading.on('click', function() {
            cancelLoading();
        });

        // Navigation
        $prev.on('click', function() {
            // Si chargement en cours, on annule
            if (isLoading) cancelLoading();
            goToPrev();
        });

        $next.on('click', function() {
            if (isLoading) cancelLoading();
            goToNext();
        });

        // Replay - relire le slide courant
        $replay.on('click', function() {
            if (isLoading) cancelLoading();
            stopSpeaking();
            setTimeout(() => {
                speakSlide(currentIndex);
            }, 100);
        });

        // Support du clavier (espace pour play/pause)
        $(document).on('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });

        // Nettoyage
        $(window).on('beforeunload', function() {
            try {
                if (synth.speaking) synth.cancel();
            } catch(e) {}
            hideLoading();
        });

        // Gérer les cas où la synthèse se termine de manière inattendue
        setInterval(() => {
            if (isPlaying && !synth.speaking && !synth.pending && !isPaused && !isLoading) {
                isPlaying = false;
                updatePlayButton();
                setStatus("⏸ Lecture arrêtée", 'paused');
            }
        }, 1000);
    }

    init();
});



    // ================================================================
    // GESTION DU THÈME JOUR/NUIT
    // ================================================================
    let isDarkMode = false;

    function toggleTheme() {
        isDarkMode = !isDarkMode;
        const body = document.body;
        const appContainer = document.querySelector('.app-container');
        const header = document.querySelector('.slide-header');
        const footer = document.querySelector('.slide-footer');
        const contentCards = document.querySelectorAll('.content-card');
        const noteBoxes = document.querySelectorAll('.note-box');
        const mathBlocks = document.querySelectorAll('.math-block');
        const buttons = document.querySelectorAll('.btn');
        const statusBadge = document.querySelector('.status-badge');
        const slideCounter = document.querySelector('.slide-counter');
        const autoIndicator = document.querySelector('.auto-indicator');
        const themeBtn = document.getElementById('themeToggle');

        if (isDarkMode) {
            // Mode nuit
            body.style.background = '#0b1120';
            body.style.color = '#f1f5f9';
            appContainer.style.background = 'linear-gradient(145deg, #0f172a 0%, #1e293b 100%)';
            header.style.background = 'rgba(15, 23, 42, 0.85)';
            footer.style.background = 'rgba(15, 23, 42, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.05)';
                card.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.08)';
                note.style.color = '#cbd5e1';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.25)';
                block.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#e2e8f0';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.12)';
                statusBadge.style.color = '#93bbfc';
            }
            if (slideCounter) {
                slideCounter.style.color = '#94a3b8';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#64748b';
            }
            if (themeBtn) {
                themeBtn.textContent = '☀️';
                themeBtn.title = 'Passer en mode jour';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#e2e8f0';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#e2e8f0';
                }
            });
        } else {
            // Mode jour (par défaut)
            body.style.background = '#f0f4f8';
            body.style.color = '#1a202c';
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
            header.style.background = 'rgba(255, 255, 255, 0.85)';
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.8)';
                card.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.12)';
                note.style.color = '#2c3e50';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.05)';
                block.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#2d3748';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
                statusBadge.style.color = '#2b6cb0';
            }
            if (slideCounter) {
                slideCounter.style.color = '#4a5568';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#718096';
            }
            if (themeBtn) {
                themeBtn.textContent = '🌓';
                themeBtn.title = 'Passer en mode nuit';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#2c3e50';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#2d3748';
                }
            });
        }
    }

    // Initialiser en mode jour
    document.addEventListener('DOMContentLoaded', function() {
        // Appliquer le mode jour par défaut
        const body = document.body;
        body.style.background = '#f0f4f8';
        body.style.color = '#1a202c';
        
        const appContainer = document.querySelector('.app-container');

            note.style.color = '#2c3e50';

        const autoIndicator = document.querySelector('.auto-indicator');

        }
        
        document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
            if (!el.closest('.note-box')) {

        });
        
        document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
