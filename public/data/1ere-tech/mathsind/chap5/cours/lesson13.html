<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Présentation mobile</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' },
            options: { skipHtmlTypes: 'script' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 500px;
        margin: 0 auto;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    .slide-header {
        flex-shrink: 0;
        padding: 18px 16px 10px 16px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        z-index: 10;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .slide-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
    }

    .content-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 18px 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        flex-shrink: 0;
    }

    .content-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .content-card li {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        line-height: 1.5;
    }

    .content-card li:last-child {
        border-bottom: none;
    }

    .bullet-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
    }

    .math-block {
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        overflow-x: auto;
        flex-shrink: 0;
        margin: 4px 0;
    }

    .math-block .math {
        font-size: 1.2rem;
        color: #e2e8f0;
    }

    .note-box {
        background: rgba(96, 165, 250, 0.08);
        border-left: 4px solid #60a5fa;
        padding: 12px 16px;
        border-radius: 12px;
        font-style: italic;
        font-size: 0.9rem;
        color: #cbd5e1;
        flex-shrink: 0;
    }

    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        border-radius: 0;
        flex-direction: column;
    }

    .loading-card {
        background: #1e293b;
        padding: 32px 28px;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #334155;
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px auto;
    }

    .loading-text {
        font-weight: 600;
        font-size: 1.1rem;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    .loading-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 16px;
    }
    .loading-progress {
        height: 3px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        animation: loadingProgress 30s ease-out forwards;
    }

    .loading-timeout {
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 12px;
    }

    .btn-cancel-loading {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 40px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #f87171;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }

    .btn-cancel-loading:active {
        transform: scale(0.94);
        background: rgba(239, 68, 68, 0.25);
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
    }

    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .slide-counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255,255,255,0.05);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(255,255,255,0.04);
    }

    .status-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 30px;
        background: rgba(96, 165, 250, 0.12);
        color: #93bbfc;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
    }

    .status-badge .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: pulse-dot 1.2s infinite;
        flex-shrink: 0;
    }

    .status-badge.idle .dot {
        animation: none;
        background: #64748b;
    }
    .status-badge.speaking .dot {
        background: #34d399;
        animation: pulse-dot 0.8s infinite;
    }
    .status-badge.error .dot {
        background: #f87171;
        animation: none;
    }
    .status-badge.paused .dot {
        animation: none;
        background: #fbbf24;
    }
    .status-badge.waiting .dot {
        animation: pulse-dot 1.5s infinite;
        background: #fbbf24;
    }
    .status-badge.loading .dot {
        animation: pulse-dot 0.5s infinite;
        background: #60a5fa;
    }

    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.7); }
    }

    .footer-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(255,255,255,0.1);
    }

    .btn-secondary {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-play {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
        min-width: 80px;
        justify-content: center;
    }
    .btn-play:active {
        background: rgba(52, 211, 153, 0.25);
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
    }

    .auto-indicator {
        font-size: 0.65rem;
        color: #64748b;
        text-align: center;
        letter-spacing: 0.3px;
        padding: 2px 0;
    }

    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.2rem;
        }
        .content-card li {
            font-size: 0.9rem;
            padding: 8px 0;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .btn-play {
            min-width: 60px;
        }
        .footer-buttons {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
        .loading-card {
            padding: 20px 16px;
        }
        .math-block .math {
            font-size: 1rem;
        }
    }

    @media (min-width: 600px) {
        .app-container {
            max-width: 480px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
        .loading-overlay {
            border-radius: 32px;
        }
    }

    /* Mode jour (par défaut) */
    html, body {
        background: #f0f4f8 !important;
        color: #1a202c !important;
    }
    .app-container {
        background: linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%) !important;
    }
    .slide-header {
        background: rgba(255, 255, 255, 0.85) !important;
        border-bottom: 1px solid rgba(0,0,0,0.08) !important;
    }
    .slide-header h1 {
        background: linear-gradient(135deg, #2b6cb0, #6b46c1) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        background-clip: text !important;
    }
    .slide-footer {
        background: rgba(255, 255, 255, 0.9) !important;
        border-top: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card {
        background: rgba(255,255,255,0.8) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card li {
        border-bottom: 1px solid rgba(0,0,0,0.05) !important;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.12) !important;
        border-left: 4px solid #4299e1 !important;
        color: #2c3e50 !important;
    }
    .math-block {
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .math-block .math {
        color: #2d3748 !important;
    }
    .slide-counter {
        color: #4a5568 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .status-badge {
        background: rgba(96, 165, 250, 0.15) !important;
        color: #2b6cb0 !important;
        border: 1px solid rgba(96, 165, 250, 0.15) !important;
    }
    .btn {
        color: #2d3748 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .btn-secondary {
        background: rgba(0,0,0,0.04) !important;
        border-color: rgba(0,0,0,0.08) !important;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15) !important;
        border-color: rgba(52, 211, 153, 0.2) !important;
        color: #38a169 !important;
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15) !important;
        border-color: rgba(251, 191, 36, 0.2) !important;
        color: #d69e2e !important;
    }
    .auto-indicator {
        color: #718096 !important;
    }
    .loading-card {
        background: #ffffff !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .loading-text {
        color: #1a202c !important;
    }
    .loading-sub {
        color: #4a5568 !important;
    }
</style>
</head>
<body>

<div class="app-container">

    <header class="slide-header">
        <h1 id="slideTitle">Chargement...</h1>
    </header>

    <main class="slide-body" id="slideBody"></main>

    <!-- LOADING OVERLAY AVEC BOUTON ANNULER -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Préparation vocale...</div>
            <div class="loading-sub" id="loadingSub">Synthèse en cours</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loadingProgressBar"></div>
            </div>
            <div class="loading-timeout" id="loadingTimeout">⏱️ 30 secondes maximum</div>
            <button class="btn-cancel-loading" id="cancelLoadingBtn">
                <span>✕</span> Annuler
            </button>
        </div>
    </div>

    <footer class="slide-footer">
        <div class="footer-top">
            <span class="slide-counter" id="slideCounter">1 / 3</span>
            <span class="status-badge idle" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">Prêt</span>
            </span>
        </div>

        <div class="footer-buttons">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-secondary" id="replayBtn">
                <span class="btn-icon">🔁</span> <span class="btn-label">Relire</span>
            </button>
            <button class="btn btn-play" id="playBtn">
                <span class="btn-icon">▶</span> <span class="btn-label">Play</span>
            </button>
        </div>

        <div class="auto-indicator" id="autoIndicator">⏸ Lecture manuelle</div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // SLIDES
    // ================================================================
    const slides = [
  {
    "titre": "Introduction à l'étude de fonctions",
    "contenu": "<div style='padding: 15px; background: linear-gradient(135deg, #e8f0fe, #f3e8ff); border-radius: 12px;'><h3 style='margin-top: 0; color: #1a237e;'>Objectifs de la leçon</h3><p style='color: #1a1a2e;'>Dans cette leçon, nous allons apprendre à :</p><ul style='color: #1a1a2e; padding-left: 20px;'><li><strong>Étudier</strong> et <strong>représenter graphiquement</strong> des fonctions polynômes de degré ≤ 3.</li><li><strong>Étudier</strong> et <strong>représenter graphiquement</strong> des fonctions rationnelles de la forme \\( x \\mapsto \\frac{ax^2+bx+c}{a'x^2+b'x+c'} \\).</li><li><strong>Utiliser</strong> la représentation graphique pour résoudre des équations du type \\( f(x)=g(x) \\) et \\( f(x) \\leq g(x) \\).</li><li><strong>Effectuer</strong> le calcul approché des zéros d'une fonction.</li></ul><div style='margin-top: 12px; padding: 10px; background-color: #fff3cd; border-radius: 8px; color: #856404;'><p><strong>🎯 Pourquoi c'est important ?</strong> L'étude des fonctions est au cœur de l'ingénierie : elle permet de modéliser et d'optimiser des phénomènes industriels.</p></div></div>",
    "texteParle": "Bonjour à tous. Dans cette leçon, nous allons aborder l'étude et la représentation graphique des fonctions. Nous allons apprendre à étudier des fonctions polynômes de degré inférieur ou égal à trois, ainsi que des fonctions rationnelles. Nous verrons aussi comment utiliser les courbes pour résoudre des équations et des inéquations. Enfin, nous apprendrons à calculer approximativement les zéros d'une fonction. Ces compétences sont essentielles dans de nombreux domaines industriels pour modéliser et optimiser des systèmes.",
    "note": "L'étude de fonctions est un outil fondamental en modélisation industrielle."
  },
  {
    "titre": "Étude d'une fonction polynôme",
    "contenu": "<div style='padding: 15px; background-color: #e3f2fd; border-radius: 12px; border-left: 5px solid #1565c0;'><h4 style='margin-top: 0; color: #0d47a1;'>Démarche pour étudier \\( f(x) = ax^3 + bx^2 + cx + d \\)</h4><ol style='color: #1a1a2e; padding-left: 20px;'><li><strong>Domaine de définition :</strong> \\( D_f = \\mathbb{R} \\) (toujours pour un polynôme).</li><li><strong>Parité / symétrie :</strong> Vérifier si \\( f \\) est paire ou impaire.</li><li><strong>Limites :</strong> Étudier \\( \\lim_{x \\to +\\infty} f(x) \\) et \\( \\lim_{x \\to -\\infty} f(x) \\).</li><li><strong>Dérivée :</strong> Calculer \\( f'(x) = 3ax^2 + 2bx + c \\) et étudier son signe.</li><li><strong>Tableau de variations :</strong> Déduire les extremums et les intervalles de croissance/décroissance.</li><li><strong>Tableau de valeurs :</strong> Calculer les coordonnées des points clés.</li><li><strong>Représentation graphique :</strong> Tracer la courbe \\( \\mathcal{C}_f \\).</li></ol><div style='background-color: #fff3e0; padding: 10px; border-radius: 8px; margin-top: 10px; color: #bf360c;'><p style='margin: 0;'><strong>📌 Exemple :</strong> \\( f(x) = x^3 - 3x \\)</p><p style='margin: 5px 0 0 0; color: #4e342e;'>\\( f'(x) = 3x^2 - 3 = 3(x-1)(x+1) \\) → Extremums en \\( x = -1 \\) et \\( x = 1 \\).</p></div></div>",
    "texteParle": "Commençons par l'étude d'une fonction polynôme de degré trois. La démarche est systématique. D'abord, le domaine de définition est toujours l'ensemble des réels pour un polynôme. Ensuite, on vérifie la parité pour simplifier l'étude. Puis on calcule les limites aux infinis pour connaître le comportement de la courbe. La dérivée nous permet d'étudier les variations et de trouver les extremums. Enfin, on construit un tableau de valeurs et on trace la courbe. Prenons l'exemple de f de x égal x au cube moins trois x. Sa dérivée est trois x au carré moins trois, qui s'annule en moins un et en un, donnant deux extremums.",
    "note": "La dérivée d'une fonction polynôme de degré 3 est un polynôme du second degré."
  },
  {
    "titre": "Étude d'une fonction rationnelle",
    "contenu": "<div style='padding: 15px; background-color: #fce4ec; border-radius: 12px; border-left: 5px solid #c62828;'><h4 style='margin-top: 0; color: #b71c1c;'>Démarche pour étudier \\( f(x) = \\frac{ax^2+bx+c}{a'x^2+b'x+c'} \\)</h4><ol style='color: #1a1a2e; padding-left: 20px;'><li><strong>Domaine :</strong> \\( D_f = \\mathbb{R} \\backslash \\{ \\text{racines du dénominateur} \\} \\).</li><li><strong>Parité :</strong> Vérifier si \\( f \\) est paire ou impaire.</li><li><strong>Limites :</strong> <ul><li>Aux infinis : limite du rapport des termes de plus haut degré.</li><li>Près des valeurs interdites : limites à gauche et à droite (asymptotes verticales).</li></ul></li><li><strong>Dérivée :</strong> Utiliser \\( \\left(\\frac{u}{v}\\right)' = \\frac{u'v - uv'}{v^2} \\).</li><li><strong>Tableau de variations :</strong> Déduire les extremums.</li><li><strong>Asymptotes :</strong> Déterminer les asymptotes verticales et horizontales (ou obliques).</li><li><strong>Représentation graphique :</strong> Tracer la courbe en incluant les asymptotes.</li></ol></div>",
    "texteParle": "Passons maintenant aux fonctions rationnelles, c'est-à-dire les quotients de deux polynômes. La première étape est de déterminer le domaine de définition en excluant les valeurs qui annulent le dénominateur. Ensuite, on étudie les limites aux infinis mais aussi au voisinage des valeurs interdites, car il peut y avoir des asymptotes verticales. La dérivée se calcule avec la formule du quotient. On en déduit le tableau de variations. Il faut aussi déterminer les asymptotes : verticales pour les valeurs interdites, et horizontales ou obliques à l'infini. Enfin, on trace la courbe en incluant ses asymptotes.",
    "note": "Les asymptotes sont des droites que la courbe approche sans jamais toucher."
  },
  {
    "titre": "Limites d'une fonction rationnelle",
    "contenu": "<div style='padding: 15px; background-color: #e8eaf6; border-radius: 12px;'><h4 style='margin-top: 0; color: #1a237e;'>Calcul des limites pour \\( f(x) = \\frac{P(x)}{Q(x)} \\)</h4><div style='background-color: #ffffff; padding: 12px; border-radius: 8px; margin: 10px 0;'><p style='color: #1a1a2e;'><strong>1. Limite en \\( +\\infty \\) et \\( -\\infty \\) :</strong></p><div class='math-block' style='background-color: #f5f5f5; padding: 10px; border-radius: 5px;'><div class='math'>$$ \\lim_{x \\to \\pm\\infty} \\frac{ax^2 + bx + c}{a'x^2 + b'x + c'} = \\frac{a}{a'} $$</div></div><p style='color: #1a1a2e;'>Si degré(P) = degré(Q), la limite est le rapport des coefficients dominants.</p></div><div style='background-color: #ffffff; padding: 12px; border-radius: 8px; margin: 10px 0;'><p style='color: #1a1a2e;'><strong>2. Limite en \\( x_0 \\) (valeur interdite) :</strong></p><p style='color: #1a1a2e;'>Si \\( Q(x_0) = 0 \\) et \\( P(x_0) \\neq 0 \\), alors \\( \\lim_{x \\to x_0} f(x) = \\pm\\infty \\).</p><p style='color: #1a1a2e;'>On étudie le signe du quotient pour déterminer \\( +\\infty \\) ou \\( -\\infty \\).</p></div><div style='background-color: #fff3e0; padding: 10px; border-radius: 8px; margin-top: 10px; color: #bf360c;'><p style='margin: 0;'><strong>📌 Exemple :</strong> \\( f(x) = \\frac{2x+1}{x-3} \\)</p><p style='margin: 5px 0 0 0; color: #4e342e;'>\\( \\lim_{x \\to +\\infty} f(x) = 2 \\) et \\( \\lim_{x \\to 3^+} f(x) = +\\infty \\) (asymptote verticale en \\( x=3 \\)).</p></div></div>",
    "texteParle": "Le calcul des limites est une étape cruciale pour les fonctions rationnelles. À l'infini, si le numérateur et le dénominateur ont le même degré, la limite est le rapport des coefficients dominants. Au voisinage d'une valeur interdite, c'est-à-dire une valeur qui annule le dénominateur, la fonction tend vers l'infini. Il faut alors déterminer le signe pour savoir si c'est plus l'infini ou moins l'infini. Par exemple, pour la fonction f de x égal deux x plus un sur x moins trois, la limite à l'infini est deux, et il y a une asymptote verticale en x égal trois.",
    "note": "Les limites à l'infini d'une fonction rationnelle donnent les asymptotes horizontales."
  },
  {
    "titre": "Dérivation des fonctions rationnelles",
    "contenu": "<div style='padding: 15px; background-color: #e3f2fd; border-radius: 12px;'><h4 style='margin-top: 0; color: #0d47a1;'>Formule de dérivation d'un quotient</h4><div class='math-block' style='background-color: #ffffff; padding: 12px; border-radius: 8px; margin: 10px 0;'><div class='math' style='font-size: 1.2em;'>$$ \\left(\\frac{u}{v}\\right)' = \\frac{u'v - uv'}{v^2} $$</div></div><div style='background-color: #ffffff; padding: 12px; border-radius: 8px; margin: 10px 0;'><p style='color: #1a1a2e;'><strong>Méthode :</strong></p><ol style='color: #1a1a2e; padding-left: 20px;'><li>Identifier \\( u \\) et \\( v \\).</li><li>Calculer \\( u' \\) et \\( v' \\).</li><li>Appliquer la formule.</li><li>Étudier le signe de la dérivée.</li></ol></div><div style='background-color: #fff3e0; padding: 10px; border-radius: 8px; margin-top: 10px; color: #bf360c;'><p style='margin: 0;'><strong>📌 Exemple :</strong> \\( f(x) = \\frac{2x+1}{x-3} \\)</p><p style='margin: 5px 0 0 0; color: #4e342e;'>\\( u=2x+1, u'=2 \\), \\( v=x-3, v'=1 \\)</p><p style='margin: 5px 0 0 0; color: #4e342e;'>\\( f'(x) = \\frac{2(x-3) - (2x+1)(1)}{(x-3)^2} = \\frac{2x-6-2x-1}{(x-3)^2} = \\frac{-7}{(x-3)^2} \\)</p><p style='margin: 5px 0 0 0; color: #4e342e;'>La dérivée est toujours négative → la fonction est décroissante sur chaque intervalle de son domaine.</p></div></div>",
    "texteParle": "Pour étudier les variations d'une fonction rationnelle, nous avons besoin de sa dérivée. La formule de dérivation d'un quotient est essentielle : dérivée de u sur v égale u prime v moins u v prime sur v au carré. Pour l'appliquer, on identifie u et v, on calcule leurs dérivées, puis on applique la formule. Ensuite, on étudie le signe de la dérivée pour connaître les variations. Par exemple, pour la fonction f de x égal deux x plus un sur x moins trois, sa dérivée est moins sept sur x moins trois au carré, qui est toujours négative. La fonction est donc décroissante partout où elle est définie.",
    "note": "Une dérivée toujours négative signifie que la fonction est strictement décroissante."

  {
    "titre": "Résolution graphique d'équations",
    "contenu": "<div style='padding: 15px; background-color: #e8f5e9; border-radius: 12px; border-left: 5px solid #2e7d32;'><h4 style='margin-top: 0; color: #1b5e20;'>Résoudre \\( f(x) = g(x) \\) et \\( f(x) \\leq g(x) \\)</h4><div style='background-color: #ffffff; padding: 12px; border-radius: 8px; margin: 10px 0;'><p style='color: #1a1a2e;'><strong>Pour \\( f(x) = g(x) \\) :</strong></p><p style='color: #1a1a2e;'>Les solutions sont les <strong>abscisses des points d'intersection</strong> des courbes \\( \\mathcal{C}_f \\) et \\( \\mathcal{C}_g \\).</p></div><div style='background-color: #ffffff; padding: 12px; border-radius: 8px; margin: 10px 0;'><p style='color: #1a1a2e;'><strong>Pour \\( f(x) \\leq g(x) \\) :</strong></p><p style='color: #1a1a2e;'>Les solutions sont les intervalles où la courbe de \\( f \\) est <strong>en dessous</strong> de celle de \\( g \\).</p></div><div style='background-color: #fff3e0; padding: 10px; border-radius: 8px; margin-top: 10px; color: #bf360c;'><p style='margin: 0;'><strong>📌 Exemple :</strong> Résoudre \\( x^2 = 2x + 3 \\)</p><p style='margin: 5px 0 0 0; color: #4e342e;'>Les solutions sont les abscisses des intersections entre la parabole \\( y=x^2 \\) et la droite \\( y=2x+3 \\).</p><p style='margin: 5px 0 0 0; color: #4e342e;'>On trouve \\( x = -1 \\) et \\( x = 3 \\).</p></div></div>",
    "texteParle": "La représentation graphique est un outil puissant pour résoudre des équations et des inéquations. Pour résoudre l'équation f de x égal g de x, il suffit de chercher les abscisses des points d'intersection des deux courbes. Pour résoudre l'inéquation f de x inférieur ou égal à g de x, on cherche les intervalles où la courbe de f est en dessous de celle de g. Par exemple, pour résoudre x au carré égal deux x plus trois, on trace la parabole y égal x au carré et la droite y égal deux x plus trois. Leurs intersections donnent les solutions : moins un et trois.",
    "note": "La méthode graphique est intuitive mais donne des valeurs approximatives."

  {
    "titre": "Calcul approché des zéros",
    "contenu": "<div style='padding: 15px; background-color: #f3e5f5; border-radius: 12px; border-left: 5px solid #6a1b9a;'><h4 style='margin-top: 0; color: #4a148c;'>Méthodes pour trouver les zéros d'une fonction</h4><div style='background-color: #ffffff; padding: 12px; border-radius: 8px; margin: 10px 0;'><p style='color: #1a1a2e;'><strong>1. Méthode graphique :</strong></p><ul style='color: #1a1a2e; padding-left: 20px;'><li>Tracer la courbe et lire les intersections avec l'axe des abscisses.</li><li>Affiner la lecture en zoomant sur la zone d'intérêt.</li></ul></div><div style='background-color: #ffffff; padding: 12px; border-radius: 8px; margin: 10px 0;'><p style='color: #1a1a2e;'><strong>2. Méthode de dichotomie (encadrement) :</strong></p><ul style='color: #1a1a2e; padding-left: 20px;'><li>Localiser un intervalle \\( [a,b] \\) où \\( f(a) \\) et \\( f(b) \\) sont de signes contraires.</li><li>Couper l'intervalle en deux à chaque itération.</li><li>S'arrêter quand l'intervalle est assez petit.</li></ul></div><div style='background-color: #fff3e0; padding: 10px; border-radius: 8px; margin-top: 10px; color: #bf360c;'><p style='margin: 0;'><strong>📌 Application :</strong> En industrie, on cherche souvent le zéro d'une fonction pour déterminer un point d'équilibre ou un seuil critique.</p></div></div>",
    "texteParle": "Parfois, on ne peut pas calculer exactement les zéros d'une fonction. Il faut alors utiliser des méthodes approchées. La méthode graphique consiste à tracer la courbe et à lire approximativement les intersections avec l'axe des abscisses. On peut affiner en zoomant. La méthode de dichotomie est plus précise : on localise un intervalle où la fonction change de signe, puis on le coupe en deux à chaque étape jusqu'à obtenir une précision suffisante. Dans l'industrie, on utilise souvent ces méthodes pour trouver des points d'équilibre ou des seuils critiques.",
    "note": "La dichotomie est une méthode simple mais efficace pour approcher un zéro."

  {
    "titre": "Exemple complet : \\( f(x) = x^3 - 3x + 1 \\)",
    "contenu": "<div style='padding: 15px; background-color: #e3f2fd; border-radius: 12px;'><h4 style='margin-top: 0; color: #0d47a1;'>Étude complète de \\( f(x) = x^3 - 3x + 1 \\)</h4><div style='background-color: #ffffff; padding: 12px; border-radius: 8px; margin: 10px 0;'><p style='color: #1a1a2e;'><strong>1. Domaine :</strong> \\( D_f = \\mathbb{R} \\)</p><p style='color: #1a1a2e;'><strong>2. Limites :</strong> \\( \\lim_{x \\to +\\infty} f(x) = +\\infty \\) et \\( \\lim_{x \\to -\\infty} f(x) = -\\infty \\)</p><p style='color: #1a1a2e;'><strong>3. Dérivée :</strong> \\( f'(x) = 3x^2 - 3 = 3(x-1)(x+1) \\)</p><p style='color: #1a1a2e;'><strong>4. Signe de \\( f' \\) :</strong></p><ul style='color: #1a1a2e; padding-left: 20px;'><li>\\( f'(x) > 0 \\) sur \\( ]-\\infty, -1[ \\) et \\( ]1, +\\infty[ \\)</li><li>\\( f'(x) < 0 \\) sur \\( ]-1, 1[ \\)</li></ul><p style='color: #1a1a2e;'><strong>5. Variations :</strong></p><ul style='color: #1a1a2e; padding-left: 20px;'><li>Maximum local en \\( x = -1 \\) avec \\( f(-1) = 3 \\)</li><li>Minimum local en \\( x = 1 \\) avec \\( f(1) = -1 \\)</li></ul></div></div>",
    "texteParle": "Prenons un exemple complet pour bien comprendre la méthode. Étudions la fonction f de x égal x au cube moins trois x plus un. Son domaine est l'ensemble des réels. Ses limites à l'infini sont plus l'infini et moins l'infini. Sa dérivée est trois x au carré moins trois, qui s'annule en moins un et en un. Le signe de la dérivée nous donne les variations : la fonction est croissante jusqu'à moins un, décroissante entre moins un et un, puis croissante à nouveau. Elle admet donc un maximum local en moins un avec f de moins un égal trois, et un minimum local en un avec f de un égal moins un.",

  {
    "titre": "Exemple : Fonction rationnelle",
    "contenu": "<div style='padding: 15px; background-color: #fce4ec; border-radius: 12px;'><h4 style='margin-top: 0; color: #b71c1c;'>Étude de \\( f(x) = \\frac{2x^2 - 4x + 1}{x - 1} \\)</h4><div style='background-color: #ffffff; padding: 12px; border-radius: 8px; margin: 10px 0;'><p style='color: #1a1a2e;'><strong>1. Domaine :</strong> \\( D_f = \\mathbb{R} \\backslash \\{1\\} \\)</p><p style='color: #1a1a2e;'><strong>2. Forme simplifiée :</strong> Division euclidienne</p><div class='math-block'><div class='math'>$$ \\frac{2x^2 - 4x + 1}{x - 1} = 2x - 2 + \\frac{-1}{x - 1} $$</div></div><p style='color: #1a1a2e;'><strong>3. Limites :</strong></p><ul style='color: #1a1a2e; padding-left: 20px;'><li>\\( \\lim_{x \\to \\pm\\infty} f(x) = \\pm\\infty \\) (pas d'asymptote horizontale)</li><li>\\( \\lim_{x \\to 1^+} f(x) = -\\infty \\) et \\( \\lim_{x \\to 1^-} f(x) = +\\infty \\)</li></ul><p style='color: #1a1a2e;'><strong>4. Asymptote oblique :</strong> \\( y = 2x - 2 \\)</p></div></div>",
    "texteParle": "Étudions maintenant une fonction rationnelle : f de x égal deux x au carré moins quatre x plus un sur x moins un. Son domaine exclut la valeur un. On peut la simplifier par division euclidienne pour obtenir deux x moins deux moins un sur x moins un. Les limites à l'infini sont infinies, donc il n'y a pas d'asymptote horizontale. En revanche, il y a une asymptote verticale en x égal un, avec des limites qui tendent vers plus ou moins l'infini selon le côté. Il y a aussi une asymptote oblique d'équation y égal deux x moins deux. La courbe se rapproche de cette droite à l'infini.",

  {
    "titre": "Résumé et applications industrielles",
    "contenu": "<div style='padding: 15px; background: linear-gradient(135deg, #e8f0fe, #f3e8ff); border-radius: 12px;'><h4 style='margin-top: 0; color: #1a237e;'>📊 Récapitulatif</h4><div style='display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 0;'><div style='background-color: #e3f2fd; padding: 10px; border-radius: 8px;'><p style='margin: 0; color: #0d47a1;'><strong>Polynômes</strong></p><p style='margin: 0; font-size: 0.9em; color: #1a1a2e;'>Domaine = ℝ</p><p style='margin: 0; font-size: 0.9em; color: #1a1a2e;'>Dérivée = degré - 1</p><p style='margin: 0; font-size: 0.9em; color: #1a1a2e;'>Pas d'asymptote</p></div><div style='background-color: #fce4ec; padding: 10px; border-radius: 8px;'><p style='margin: 0; color: #b71c1c;'><strong>Rationnelles</strong></p><p style='margin: 0; font-size: 0.9em; color: #1a1a2e;'>Domaine = ℝ \ exclusions</p><p style='margin: 0; font-size: 0.9em; color: #1a1a2e;'>Dérivée = quotient</p><p style='margin: 0; font-size: 0.9em; color: #1a1a2e;'>Asymptotes possibles</p></div></div><div style='background-color: #fff3e0; padding: 12px; border-radius: 8px;'><p style='margin: 0; color: #bf360c;'><strong>🏭 Applications industrielles :</strong></p><ul style='color: #4e342e; margin: 5px 0 0 0; padding-left: 20px;'><li><strong>Optimisation :</strong> Trouver le maximum ou minimum d'une fonction coût ou bénéfice.</li><li><strong>Modélisation :</strong> Représenter des phénomènes physiques (température, pression, vitesse).</li><li><strong>Analyse de systèmes :</strong> Étudier le comportement d'un système mécanique ou électrique.</li></ul></div></div>",
    "texteParle": "Pour conclure cette leçon, faisons un résumé. Les fonctions polynômes ont pour domaine l'ensemble des réels et leur dérivée est un polynôme de degré inférieur. Elles n'ont pas d'asymptote. Les fonctions rationnelles, en revanche, ont des valeurs interdites et peuvent avoir des asymptotes verticales, horizontales ou obliques. Ces outils sont largement utilisés dans l'industrie. Par exemple, pour optimiser un coût de production, on cherche le minimum d'une fonction. Pour modéliser un phénomène physique, on utilise des fonctions qui décrivent l'évolution d'une grandeur. Enfin, l'analyse des systèmes mécaniques ou électriques repose souvent sur l'étude de fonctions.",

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentIndex = 0;
    let isSpeaking = false;
    let isPaused = false;
    let currentUtterance = null;
    let isLoading = false;
    let loadingTimeout = null;
    let isTransitioning = false;
    let speechSupported = true;
    let userInteracted = false;
    let isPlaying = false;
    let loadingCancelled = false;

    const total = slides.length;
    const synth = window.speechSynthesis;

    // Références jQuery
    const $title = $('#slideTitle');
    const $body = $('#slideBody');
    const $counter = $('#slideCounter');
    const $statusText = $('#statusText');
    const $statusBadge = $('#statusBadge');
    const $loading = $('#loadingOverlay');
    const $loadingText = $('#loadingText');
    const $loadingSub = $('#loadingSub');
    const $loadingTimeout = $('#loadingTimeout');
    const $loadingProgressBar = $('#loadingProgressBar');
    const $autoIndicator = $('#autoIndicator');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $replay = $('#replayBtn');
    const $play = $('#playBtn');
    const $cancelLoading = $('#cancelLoadingBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function setStatus(text, type) {
        $statusText.text(text);
        $statusBadge.removeClass('idle speaking error paused waiting loading');
        if (type === 'speaking') $statusBadge.addClass('speaking');
        else if (type === 'error') $statusBadge.addClass('error');
        else if (type === 'paused') $statusBadge.addClass('paused');
        else if (type === 'waiting') $statusBadge.addClass('waiting');
        else if (type === 'loading') $statusBadge.addClass('loading');
        else $statusBadge.addClass('idle');
    }

    function updatePlayButton() {
        if (isPlaying) {
            $play.addClass('playing');
            $play.find('.btn-icon').text('⏸');
            $play.find('.btn-label').text('Pause');
        } else {
            $play.removeClass('playing');
            $play.find('.btn-icon').text('▶');
            $play.find('.btn-label').text('Play');
        }
    }

    function showLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        
        loadingCancelled = false;
        isLoading = true;
        
        // Réinitialiser la barre de progression
        $loadingProgressBar.css('animation', 'none');
        $loadingProgressBar.css('width', '0%');
        // Forcer un reflow
        $loadingProgressBar[0].offsetHeight;
        $loadingProgressBar.css('animation', 'loadingProgress 30s ease-out forwards');
        
        $loadingText.text('Préparation vocale...');
        $loadingSub.text('Synthèse en cours');
        $loadingTimeout.text('⏱️ 30 secondes maximum');
        $loading.fadeIn(300);
        setStatus("⏳ Chargement...", 'loading');
        
        // 🔥 TIMEOUT DE 30 SECONDES
        loadingTimeout = setTimeout(() => {
            if (isLoading && !loadingCancelled) {
                hideLoading();
                setStatus("⚠️ Délai dépassé (30s)", 'error');
                isPlaying = false;
                updatePlayButton();
                $loadingSub.text('La synthèse vocale a pris trop de temps');
                $loadingTimeout.text('❌ Délai dépassé');
            }
        }, 30000);
    }

    function hideLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        isLoading = false;
        loadingCancelled = false;
        $loading.fadeOut(300);
        // Ne pas changer le statut si on est en train de parler
        if (!isSpeaking && !isPlaying) {
            setStatus("⏸ Lecture arrêtée", 'paused');
        }
    }

    function cancelLoading() {
        loadingCancelled = true;
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        hideLoading();
        stopSpeaking();
        setStatus("⏸ Annulé", 'paused');
        isPlaying = false;
        updatePlayButton();
        $loadingText.text('Annulé par l\'utilisateur');
        $loadingSub.text('Vous pouvez réessayer');
        $loadingTimeout.text('✕ Annulation');
    }

    // Arrêter la parole proprement
    function stopSpeaking() {
        try {
            if (synth && (synth.speaking || synth.pending)) {
                synth.cancel();
            }
        } catch(e) {
            console.warn('Erreur stopSpeaking:', e);
        }
        if (currentUtterance) {
            try {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance.onstart = null;
            } catch(e) {}
            currentUtterance = null;
        }
        isSpeaking = false;
        isPlaying = false;
        updatePlayButton();
    }

    // Mettre en pause la parole
    function pauseSpeaking() {
        try {
            if (synth && synth.speaking) {
                synth.pause();
                isPaused = true;
                isPlaying = false;
                setStatus("⏸ Lecture en pause", 'paused');
                updatePlayButton();
            }
        } catch(e) {
            console.warn('Erreur pauseSpeaking:', e);
            stopSpeaking();
        }
    }

    // Reprendre la parole
    function resumeSpeaking() {
        try {
            if (synth && synth.paused) {
                synth.resume();
                isPaused = false;
                isPlaying = true;
                setStatus("🔊 Lecture en cours", 'speaking');
                updatePlayButton();
            } else if (!isSpeaking && !synth.speaking && !synth.pending) {
                speakSlide(currentIndex);
            }
        } catch(e) {
            console.warn('Erreur resumeSpeaking:', e);
            speakSlide(currentIndex);
        }
    }

    function renderSlide(index) {
        const slide = slides[index];
        $title.text(slide.titre);

        let html = '';
        html += `<div class="content-card">${slide.contenu}</div>`;
        if (slide.note) {
            html += `<div class="note-box">${slide.note}</div>`;
        }
        $body.html(html);
        $counter.text(`${index+1} / ${total}`);

        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
        }
    }

    // ================================================================
    // LECTURE VOCALE
    // ================================================================
    function speakSlide(index) {
        return new Promise((resolve) => {
            const slide = slides[index];
            const text = slide.texteParle;
            
            if (!text || text.trim() === '' || !speechSupported) {
                resolve();
                return;
            }

            if (!window.speechSynthesis) {
                setStatus("❌ Synthèse vocale non supportée", 'error');
                speechSupported = false;
                resolve();
                return;
            }

            // Arrêter toute lecture en cours
            stopSpeaking();
            
            // Réinitialiser l'état de pause
            isPaused = false;
            
            showLoading();
            setStatus("Initialisation...", 'loading');

            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.92;
                utterance.pitch = 1.05;
                utterance.volume = 1;

                let isFinished = false;
                let errorHandled = false;

                utterance.onstart = function() {
                    if (loadingCancelled) {
                        stopSpeaking();
                        resolve();
                        return;
                    }
                    hideLoading();
                    isSpeaking = true;
                    isPlaying = true;
                    isPaused = false;
                    setStatus("🔊 Lecture en cours", 'speaking');
                    updatePlayButton();
                };

                utterance.onend = function() {
                    if (isFinished) return;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    setStatus("✅ Terminé", 'idle');
                    hideLoading();
                    updatePlayButton();
                    resolve();
                };

                utterance.onerror = function(e) {
                    if (isFinished || errorHandled) return;
                    errorHandled = true;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    hideLoading();
                    updatePlayButton();
                    
                    if (e.error === 'not-allowed') {
                        setStatus("⚠️ Permission refusée", 'error');
                    } else if (e.error === 'synthesis-unavailable') {
                        setStatus("⚠️ Synthèse indisponible", 'error');
                    } else if (e.error === 'canceled') {
                        setStatus("⏸ Annulé", 'paused');
                    } else {
                        setStatus("❌ Erreur audio: " + (e.error || 'inconnue'), 'error');
                    }
                    
                    resolve();
                };

                // Gestion du chargement des voix
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = function() {
                        if (!loadingCancelled) {
                            try {
                                synth.speak(utterance);
                            } catch(err) {
                                // Silencieux
                            }
                        }
                        synth.onvoiceschanged = null;
                    };
                }

                currentUtterance = utterance;
                
                if (!loadingCancelled) {
                    try {
                        synth.speak(utterance);
                    } catch(err) {
                        setTimeout(() => {
                            if (!loadingCancelled) {
                                try {
                                    synth.speak(utterance);
                                } catch(e) {
                                    setStatus("❌ Erreur de lecture", 'error');
                                    isPlaying = false;
                                    updatePlayButton();
                                    hideLoading();
                                    resolve();
                                }
                            } else {
                                resolve();
                            }
                        }, 100);
                    }
                } else {
                    resolve();
                }

            } catch(err) {
                hideLoading();
                setStatus("❌ Erreur générale", 'error');
                isPlaying = false;
                updatePlayButton();
                console.error('Erreur speakSlide:', err);
                resolve();
            }
        });
    }

    // ================================================================
    // NAVIGATION
    // ================================================================
    async function goToSlide(index) {
        if (isTransitioning) return;
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        
        // Si on est en train de lire, on met en pause avant de naviguer
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        // Arrêter complètement la lecture
        stopSpeaking();
        
        await new Promise(r => setTimeout(r, 50));
        
        if (index === currentIndex) {
            setStatus("📄 Slide actuel", 'idle');
            return;
        }

        isTransitioning = true;
        currentIndex = index;
        renderSlide(index);
        
        // Réinitialiser l'état de lecture
        isPlaying = false;
        updatePlayButton();
        setStatus("⏸ Lecture arrêtée", 'paused');

        await new Promise(r => setTimeout(r, 150));
        isTransitioning = false;
    }

    async function goToNext() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex + 1 < total) {
            await goToSlide(currentIndex + 1);
        } else {
            setStatus("🏁 Dernier slide", 'idle');
        }
    }

    async function goToPrev() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex - 1 >= 0) {
            await goToSlide(currentIndex - 1);
        } else {
            setStatus("🔁 Premier slide", 'idle');
        }
    }

    // ================================================================
    // GESTION PLAY/PAUSE
    // ================================================================
    function togglePlay() {
        if (!userInteracted) {
            userInteracted = true;
        }

        // Si le chargement est en cours, on l'annule
        if (isLoading) {
            cancelLoading();
            return;
        }

        // Si le synthétiseur est en pause, on reprend
        if (synth && synth.paused) {
            resumeSpeaking();
            return;
        }

        // Si la lecture est en cours, on met en pause
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
            return;
        }

        // Sinon, on démarre la lecture du slide courant
        if (!isSpeaking && !isPlaying) {
            stopSpeaking();
            speakSlide(currentIndex);
        }
    }

    // ================================================================
    // INIT
    // ================================================================
    async function init() {
        // Vérifier la compatibilité
        if (!window.speechSynthesis) {
            setStatus("❌ Synthèse vocale non supportée", 'error');
            speechSupported = false;
        }

        // Précharger les voix
        try {
            if (synth.getVoices) {
                synth.getVoices();
                setTimeout(() => {
                    try {
                        synth.getVoices();
                    } catch(e) {}
                }, 200);
            }
        } catch(e) {
            console.warn('Erreur chargement voix:', e);
        }

        // Afficher le premier slide
        renderSlide(0);
        $counter.text(`1 / ${total}`);
        
        // État initial
        setStatus("⏸ Appuie sur Play", 'paused');
        updatePlayButton();
        $autoIndicator.text('⏸ Lecture manuelle');

        // ================================================================
        // ÉVÉNEMENTS
        // ================================================================
        
        // Bouton Play/Pause
        $play.on('click', function() {
            togglePlay();
        });

        // Bouton Annuler le chargement
        $cancelLoading.on('click', function() {
            cancelLoading();
        });

        // Navigation
        $prev.on('click', function() {
            // Si chargement en cours, on annule
            if (isLoading) cancelLoading();
            goToPrev();
        });

        $next.on('click', function() {
            if (isLoading) cancelLoading();
            goToNext();
        });

        // Replay - relire le slide courant
        $replay.on('click', function() {
            if (isLoading) cancelLoading();
            stopSpeaking();
            setTimeout(() => {
                speakSlide(currentIndex);
            }, 100);
        });

        // Support du clavier (espace pour play/pause)
        $(document).on('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });

        // Nettoyage
        $(window).on('beforeunload', function() {
            try {
                if (synth.speaking) synth.cancel();
            } catch(e) {}
            hideLoading();
        });

        // Gérer les cas où la synthèse se termine de manière inattendue
        setInterval(() => {
            if (isPlaying && !synth.speaking && !synth.pending && !isPaused && !isLoading) {
                isPlaying = false;
                updatePlayButton();
                setStatus("⏸ Lecture arrêtée", 'paused');
            }
        }, 1000);
    }

    init();
});



    // ================================================================
    // GESTION DU THÈME JOUR/NUIT
    // ================================================================
    let isDarkMode = false;

    function toggleTheme() {
        isDarkMode = !isDarkMode;
        const body = document.body;
        const appContainer = document.querySelector('.app-container');
        const header = document.querySelector('.slide-header');
        const footer = document.querySelector('.slide-footer');
        const contentCards = document.querySelectorAll('.content-card');
        const noteBoxes = document.querySelectorAll('.note-box');
        const mathBlocks = document.querySelectorAll('.math-block');
        const buttons = document.querySelectorAll('.btn');
        const statusBadge = document.querySelector('.status-badge');
        const slideCounter = document.querySelector('.slide-counter');
        const autoIndicator = document.querySelector('.auto-indicator');
        const themeBtn = document.getElementById('themeToggle');

        if (isDarkMode) {
            // Mode nuit
            body.style.background = '#0b1120';
            body.style.color = '#f1f5f9';
            appContainer.style.background = 'linear-gradient(145deg, #0f172a 0%, #1e293b 100%)';
            header.style.background = 'rgba(15, 23, 42, 0.85)';
            footer.style.background = 'rgba(15, 23, 42, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.05)';
                card.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.08)';
                note.style.color = '#cbd5e1';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.25)';
                block.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#e2e8f0';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.12)';
                statusBadge.style.color = '#93bbfc';
            }
            if (slideCounter) {
                slideCounter.style.color = '#94a3b8';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#64748b';
            }
            if (themeBtn) {
                themeBtn.textContent = '☀️';
                themeBtn.title = 'Passer en mode jour';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#e2e8f0';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#e2e8f0';
                }
            });
        } else {
            // Mode jour (par défaut)
            body.style.background = '#f0f4f8';
            body.style.color = '#1a202c';
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
            header.style.background = 'rgba(255, 255, 255, 0.85)';
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.8)';
                card.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.12)';
                note.style.color = '#2c3e50';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.05)';
                block.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#2d3748';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
                statusBadge.style.color = '#2b6cb0';
            }
            if (slideCounter) {
                slideCounter.style.color = '#4a5568';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#718096';
            }
            if (themeBtn) {
                themeBtn.textContent = '🌓';
                themeBtn.title = 'Passer en mode nuit';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#2c3e50';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#2d3748';
                }
            });
        }
    }

    // Initialiser en mode jour
    document.addEventListener('DOMContentLoaded', function() {
        // Appliquer le mode jour par défaut
        const body = document.body;
        body.style.background = '#f0f4f8';
        body.style.color = '#1a202c';
        
        const appContainer = document.querySelector('.app-container');
        if (appContainer) {
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
        }
        
        const header = document.querySelector('.slide-header');
        if (header) {
            header.style.background = 'rgba(255, 255, 255, 0.85)';
        }
        
        const footer = document.querySelector('.slide-footer');
        if (footer) {
            footer.style.background = 'rgba(255, 255, 255, 0.9)';

            note.style.background = 'rgba(96, 165, 250, 0.12)';
            note.style.color = '#2c3e50';

            block.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.btn').forEach(btn => {

        });
        
        const statusBadge = document.querySelector('.status-badge');
        if (statusBadge) {
            statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
            statusBadge.style.color = '#2b6cb0';
        }
        
        const slideCounter = document.querySelector('.slide-counter');
        if (slideCounter) {
            slideCounter.style.color = '#4a5568';
        }
        
        const autoIndicator = document.querySelector('.auto-indicator');
        if (autoIndicator) {
            autoIndicator.style.color = '#718096';
        }
        
        document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
            if (!el.closest('.note-box')) {
                el.style.color = '#2c3e50';
            }
        });
        
        document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {

        const themeBtn = document.getElementById('themeToggle');
        if (themeBtn) {

            themeBtn.title = 'Passer en mode nuit';
        }
    });
</script>
