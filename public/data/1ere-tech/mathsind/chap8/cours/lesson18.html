<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Présentation mobile</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' },
            options: { skipHtmlTypes: 'script' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 500px;
        margin: 0 auto;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    .slide-header {
        flex-shrink: 0;
        padding: 18px 16px 10px 16px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        z-index: 10;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .slide-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
    }

    .content-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 18px 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        flex-shrink: 0;
    }

    .content-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .content-card li {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        line-height: 1.5;
    }

    .content-card li:last-child {
        border-bottom: none;
    }

    .bullet-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
    }

    .math-block {
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        overflow-x: auto;
        flex-shrink: 0;
        margin: 4px 0;
    }

    .math-block .math {
        font-size: 1.2rem;
        color: #e2e8f0;
    }

    .note-box {
        background: rgba(96, 165, 250, 0.08);
        border-left: 4px solid #60a5fa;
        padding: 12px 16px;
        border-radius: 12px;
        font-style: italic;
        font-size: 0.9rem;
        color: #cbd5e1;
        flex-shrink: 0;
    }

    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        border-radius: 0;
        flex-direction: column;
    }

    .loading-card {
        background: #1e293b;
        padding: 32px 28px;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #334155;
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px auto;
    }

    .loading-text {
        font-weight: 600;
        font-size: 1.1rem;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    .loading-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 16px;
    }
    .loading-progress {
        height: 3px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        animation: loadingProgress 30s ease-out forwards;
    }

    .loading-timeout {
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 12px;
    }

    .btn-cancel-loading {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 40px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #f87171;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }

    .btn-cancel-loading:active {
        transform: scale(0.94);
        background: rgba(239, 68, 68, 0.25);
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
    }

    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .slide-counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255,255,255,0.05);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(255,255,255,0.04);
    }

    .status-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 30px;
        background: rgba(96, 165, 250, 0.12);
        color: #93bbfc;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
    }

    .status-badge .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: pulse-dot 1.2s infinite;
        flex-shrink: 0;
    }

    .status-badge.idle .dot {
        animation: none;
        background: #64748b;
    }
    .status-badge.speaking .dot {
        background: #34d399;
        animation: pulse-dot 0.8s infinite;
    }
    .status-badge.error .dot {
        background: #f87171;
        animation: none;
    }
    .status-badge.paused .dot {
        animation: none;
        background: #fbbf24;
    }
    .status-badge.waiting .dot {
        animation: pulse-dot 1.5s infinite;
        background: #fbbf24;
    }
    .status-badge.loading .dot {
        animation: pulse-dot 0.5s infinite;
        background: #60a5fa;
    }

    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.7); }
    }

    .footer-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(255,255,255,0.1);
    }

    .btn-secondary {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-play {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
        min-width: 80px;
        justify-content: center;
    }
    .btn-play:active {
        background: rgba(52, 211, 153, 0.25);
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
    }

    .auto-indicator {
        font-size: 0.65rem;
        color: #64748b;
        text-align: center;
        letter-spacing: 0.3px;
        padding: 2px 0;
    }

    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.2rem;
        }
        .content-card li {
            font-size: 0.9rem;
            padding: 8px 0;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .btn-play {
            min-width: 60px;
        }
        .footer-buttons {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
        .loading-card {
            padding: 20px 16px;
        }
        .math-block .math {
            font-size: 1rem;
        }
    }

    @media (min-width: 600px) {
        .app-container {
            max-width: 480px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
        .loading-overlay {
            border-radius: 32px;
        }
    }

    /* Mode jour (par défaut) */
    html, body {
        background: #f0f4f8 !important;
        color: #1a202c !important;
    }
    .app-container {
        background: linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%) !important;
    }
    .slide-header {
        background: rgba(255, 255, 255, 0.85) !important;
        border-bottom: 1px solid rgba(0,0,0,0.08) !important;
    }
    .slide-header h1 {
        background: linear-gradient(135deg, #2b6cb0, #6b46c1) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        background-clip: text !important;
    }
    .slide-footer {
        background: rgba(255, 255, 255, 0.9) !important;
        border-top: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card {
        background: rgba(255,255,255,0.8) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card li {
        border-bottom: 1px solid rgba(0,0,0,0.05) !important;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.12) !important;
        border-left: 4px solid #4299e1 !important;
        color: #2c3e50 !important;
    }
    .math-block {
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .math-block .math {
        color: #2d3748 !important;
    }
    .slide-counter {
        color: #4a5568 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .status-badge {
        background: rgba(96, 165, 250, 0.15) !important;
        color: #2b6cb0 !important;
        border: 1px solid rgba(96, 165, 250, 0.15) !important;
    }
    .btn {
        color: #2d3748 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .btn-secondary {
        background: rgba(0,0,0,0.04) !important;
        border-color: rgba(0,0,0,0.08) !important;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15) !important;
        border-color: rgba(52, 211, 153, 0.2) !important;
        color: #38a169 !important;
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15) !important;
        border-color: rgba(251, 191, 36, 0.2) !important;
        color: #d69e2e !important;
    }
    .auto-indicator {
        color: #718096 !important;
    }
    .loading-card {
        background: #ffffff !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .loading-text {
        color: #1a202c !important;
    }
    .loading-sub {
        color: #4a5568 !important;
    }
</style>
</head>
<body>

<div class="app-container">

    <header class="slide-header">
        <h1 id="slideTitle">Chargement...</h1>
    </header>

    <main class="slide-body" id="slideBody"></main>

    <!-- LOADING OVERLAY AVEC BOUTON ANNULER -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Préparation vocale...</div>
            <div class="loading-sub" id="loadingSub">Synthèse en cours</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loadingProgressBar"></div>
            </div>
            <div class="loading-timeout" id="loadingTimeout">⏱️ 30 secondes maximum</div>
            <button class="btn-cancel-loading" id="cancelLoadingBtn">
                <span>✕</span> Annuler
            </button>
        </div>
    </div>

    <footer class="slide-footer">
        <div class="footer-top">
            <span class="slide-counter" id="slideCounter">1 / 3</span>
            <span class="status-badge idle" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">Prêt</span>
            </span>
        </div>

        <div class="footer-buttons">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-secondary" id="replayBtn">
                <span class="btn-icon">🔁</span> <span class="btn-label">Relire</span>
            </button>
            <button class="btn btn-play" id="playBtn">
                <span class="btn-icon">▶</span> <span class="btn-label">Play</span>
            </button>
        </div>

        <div class="auto-indicator" id="autoIndicator">⏸ Lecture manuelle</div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // SLIDES
    // ================================================================
    const slides = [
  {
    "titre": "Bienvenue en cours",
    "contenu": "<div style='text-align: center; padding: 20px;'><h2 style='color: #1a5276;'>🧮 Mathématiques Industrielles</h2><h3 style='color: #2e86c1;'>Classe : 1<sup>ère</sup> Technique</h3><div style='background: linear-gradient(135deg, #1a5276, #2e86c1); color: white; padding: 20px; border-radius: 10px; margin: 20px 0;'><h4 style='color: white;'>Chapitre 8 : Géométrie plane</h4><h3 style='color: white;'>Leçon 18 : Applications du barycentre et du produit scalaire</h3></div><p style='font-size: 1.1em; color: #2c3e50;'><strong>Objectifs de la leçon :</strong></p><ul style='text-align: left; list-style-type: none; padding: 0;'><li style='background: #eaf2f8; margin: 5px 0; padding: 10px; border-radius: 5px;'>📍 Rechercher des lieux géométriques (lignes de niveau)</li><li style='background: #d4e6f1; margin: 5px 0; padding: 10px; border-radius: 5px;'>📍 Démontrer que les médianes d'un triangle sont concourantes</li></ul></div>",
    "texteParle": "Bonjour à tous et bienvenue en cours de mathématiques industrielles. Aujourd'hui, nous allons découvrir la leçon 18 sur les applications du barycentre et du produit scalaire. Nous allons apprendre à rechercher des lieux géométriques appelés lignes de niveau, et nous démontrerons que les médianes d'un triangle sont concourantes au centre de gravité. Préparez-vous à une leçon passionnante !",
    "note": "Leçon 18 : Applications du barycentre et du produit scalaire"
  },
  {
    "titre": "Rappel : Définition du barycentre",
    "contenu": "<div style='padding: 10px;'><h3 style='color: #1a5276;'>Barycentre de points pondérés</h3><div style='background: #eaf2f8; padding: 15px; border-radius: 8px; margin: 10px 0;'><p><strong>Définition :</strong></p><p>Soient <span style='color: #c0392b;'>A, B, C</span> des points du plan et <span style='color: #c0392b;'>α, β, γ</span> des réels tels que <span style='color: #c0392b;'>α + β + γ ≠ 0</span>.</p><p>Le <strong>barycentre</strong> G des points pondérés (A, α), (B, β), (C, γ) est l'unique point vérifiant :</p><div class='math-block' style='text-align: center; background: white; padding: 10px; border-radius: 5px; margin: 10px 0;'><div class='math'>$$\\alpha \\overrightarrow{GA} + \\beta \\overrightarrow{GB} + \\gamma \\overrightarrow{GC} = \\vec{0}$$</div></div></div><div style='background: #d4e6f1; padding: 15px; border-radius: 8px; margin: 10px 0;'><p><strong>Coordonnées du barycentre :</strong></p><div class='math-block' style='text-align: center; background: white; padding: 10px; border-radius: 5px;'><div class='math'>$$G\\left(\\dfrac{\\alpha x_A + \\beta x_B + \\gamma x_C}{\\alpha + \\beta + \\gamma}; \\dfrac{\\alpha y_A + \\beta y_B + \\gamma y_C}{\\alpha + \\beta + \\gamma}\\right)$$</div></div></div></div>",
    "texteParle": "Commençons par un petit rappel sur la notion de barycentre. Le barycentre est un point bien particulier défini à partir de points pondérés. Si nous avons des points A, B et C avec des coefficients alpha, bêta et gamma, le barycentre G est l'unique point qui vérifie cette relation vectorielle. On peut aussi calculer ses coordonnées à l'aide de ces formules que nous avons vues dans la leçon précédente.",
    "note": "Rappel : Barycentre = moyenne pondérée des points"
  },
  {
    "titre": "Rappel : Produit scalaire",
    "contenu": "<div style='padding: 10px;'><h3 style='color: #1a5276;'>Produit scalaire dans le plan</h3><div style='background: #eaf2f8; padding: 15px; border-radius: 8px; margin: 10px 0;'><p><strong>Définition :</strong></p><p>Le produit scalaire de deux vecteurs <span style='color: #c0392b;'>\\\\(\\\\vec{u}\\\\)</span> et <span style='color: #c0392b;'>\\\\(\\\\vec{v}\\\\)</span> est :</p><div class='math-block' style='text-align: center; background: white; padding: 10px; border-radius: 5px; margin: 10px 0;'><div class='math'>$$\\vec{u} \\cdot \\vec{v} = \\|\\vec{u}\\| \\times \\|\\vec{v}\\| \\times \\cos(\\vec{u}, \\vec{v})$$</div></div></div><div style='background: #d4e6f1; padding: 15px; border-radius: 8px; margin: 10px 0;'><p><strong>Propriétés importantes :</strong></p><ul style='text-align: left;'><li><span style='color: #c0392b;'>\\\\(\\\\vec{u} \\\\cdot \\\\vec{v} = 0 \\\\iff \\\\vec{u} \\\\perp \\\\vec{v}\\\\)</span></li><li><span style='color: #c0392b;'>\\\\(\\\\vec{u} \\\\cdot \\\\vec{u} = \\\\|\\\\vec{u}\\\\|^2\\\\)</span></li><li><span style='color: #c0392b;'>\\\\(\\\\vec{u} \\\\cdot (\\\\vec{v} + \\\\vec{w}) = \\\\vec{u} \\\\cdot \\\\vec{v} + \\\\vec{u} \\\\cdot \\\\vec{w}\\\\)</span> (distributivité)</li></ul></div></div>",
    "texteParle": "Rappelons également le produit scalaire de deux vecteurs. Le produit scalaire est un nombre réel qui s'obtient en multipliant les normes des vecteurs par le cosinus de l'angle qu'ils forment. Il y a trois propriétés importantes à retenir. D'abord, le produit scalaire est nul si et seulement si les vecteurs sont perpendiculaires. Ensuite, le produit scalaire d'un vecteur par lui-même est égal au carré de sa norme. Enfin, le produit scalaire est distributif par rapport à l'addition des vecteurs.",
    "note": "Le produit scalaire mesure l'angle entre deux vecteurs"
  },
  {
    "titre": "Lignes de niveau : Introduction",
    "contenu": "<div style='padding: 10px;'><h3 style='color: #1a5276;'>Qu'est-ce qu'une ligne de niveau ?</h3><div style='background: #eaf2f8; padding: 15px; border-radius: 8px; margin: 10px 0;'><p><strong>Définition :</strong></p><p>Soit <span style='color: #c0392b;'>f(M)</span> une expression dépendant d'un point M du plan.</p><p>L'<strong>ensemble des points M</strong> vérifiant <span style='color: #c0392b;'>f(M) = k</span> (où k est une constante) s'appelle la <strong>ligne de niveau k</strong>.</p></div><div style='background: #d4e6f1; padding: 15px; border-radius: 8px; margin: 10px 0;'><p><strong>Exemples de lignes de niveau :</strong></p><ul style='text-align: left;'><li>Si <span style='color: #c0392b;'>f(M) = AM</span> (distance), la ligne de niveau est un <strong>cercle</strong></li><li>Si <span style='color: #c0392b;'>f(M) = AM²</span>, la ligne de niveau est aussi un <strong>cercle</strong></li><li>Si <span style='color: #c0392b;'>f(M) = \\\\(\\\\vec{MA} \\\\cdot \\\\vec{MB}\\\\)</span>, la ligne de niveau est une <strong>droite</strong></li></ul></div><div style='background: #fdf2e9; padding: 15px; border-radius: 8px; margin: 10px 0; border-left: 4px solid #e67e22;'><p style='margin: 0;'><strong>💡 À retenir :</strong> Les lignes de niveau permettent de visualiser des ensembles de points ayant la même propriété.</p></div></div>",
    "texteParle": "Une ligne de niveau est l'ensemble des points M qui vérifient une condition de la forme f de M égale à une constante k. Selon la fonction f choisie, la ligne de niveau peut prendre différentes formes. Par exemple, si f de M est la distance AM, la ligne de niveau est un cercle centré en A. Si f de M est le produit scalaire de MA par MB, la ligne de niveau est une droite. Ces lignes de niveau sont très utiles en géométrie pour visualiser des ensembles de points ayant la même propriété.",
    "note": "Ligne de niveau = ensemble des points vérifiant f(M)=k"
  },
  {
    "titre": "Ligne de niveau : MA² - MB² = k",
    "contenu": "<div style='padding: 10px;'><h3 style='color: #1a5276;'>Étude de la ligne de niveau MA² - MB² = k</h3><div style='background: #eaf2f8; padding: 15px; border-radius: 8px; margin: 10px 0;'><p><strong>Propriété :</strong></p><p>Soient A et B deux points fixes et k un réel.</p><p>L'ensemble des points M du plan vérifiant :</p><div class='math-block' style='text-align: center; background: white; padding: 10px; border-radius: 5px; margin: 10px 0;'><div class='math'>$$MA^2 - MB^2 = k$$</div></div><p>est une <strong>droite</strong> perpendiculaire à (AB).</p></div><div style='background: #d4e6f1; padding: 15px; border-radius: 8px; margin: 10px 0;'><p><strong>Démonstration :</strong></p><p>En utilisant la relation de Chasles :</p><div class='math-block' style='text-align: center; background: white; padding: 10px; border-radius: 5px;'><div class='math'>$$MA^2 - MB^2 = (\\overrightarrow{MA})^2 - (\\overrightarrow{MB})^2$$</div></div><div class='math-block' style='text-align: center; background: white; padding: 10px; border-radius: 5px;'><div class='math'>$$= (\\overrightarrow{MI} + \\overrightarrow{IA})^2 - (\\overrightarrow{MI} + \\overrightarrow{IB})^2$$</div></div><p>où I est le milieu de [AB].</p></div></div>",
    "texteParle": "Étudions maintenant un cas particulier de ligne de niveau : l'ensemble des points M tels que MA au carré moins MB au carré est égal à une constante k. Cette propriété est très importante. Elle nous dit que cet ensemble est une droite perpendiculaire à la droite AB. Pour le démontrer, on utilise la relation de Chasles en introduisant I, le milieu du segment AB. Cette démonstration nous permet de mieux comprendre comment le produit scalaire s'applique dans l'étude des lignes de niveau.",
    "note": "MA² - MB² = k définit une droite perpendiculaire à (AB)"
  },
  {
    "titre": "Ligne de niveau : MA² + MB² = k",
    "contenu": "<div style='padding: 10px;'><h3 style='color: #1a5276;'>Étude de la ligne de niveau MA² + MB² = k</h3><div style='background: #eaf2f8; padding: 15px; border-radius: 8px; margin: 10px 0;'><p><strong>Propriété :</strong></p><p>Soient A et B deux points fixes et k un réel.</p><p>L'ensemble des points M du plan vérifiant :</p><div class='math-block' style='text-align: center; background: white; padding: 10px; border-radius: 5px; margin: 10px 0;'><div class='math'>$$MA^2 + MB^2 = k$$</div></div><p>est un <strong>cercle</strong> de centre I (milieu de [AB]).</p></div><div style='background: #d4e6f1; padding: 15px; border-radius: 8px; margin: 10px 0;'><p><strong>Démonstration :</strong></p><p>En utilisant le théorème de la médiane :</p><div class='math-block' style='text-align: center; background: white; padding: 10px; border-radius: 5px;'><div class='math'>$$MA^2 + MB^2 = 2MI^2 + \\dfrac{AB^2}{2}$$</div></div><p>Donc l'équation devient :</p><div class='math-block' style='text-align: center; background: white; padding: 10px; border-radius: 5px;'><div class='math'>$$2MI^2 + \\dfrac{AB^2}{2} = k \\iff MI^2 = \\dfrac{2k - AB^2}{4}$$</div></div><p>Si <span style='color: #c0392b;'>2k - AB² > 0</span>, c'est un cercle.</p></div></div>",
    "texteParle": "Autre cas important : la ligne de niveau MA au carré plus MB au carré est égale à une constante k. Cette fois-ci, l'ensemble des points M est un cercle dont le centre est le point I, milieu du segment AB. Pour démontrer cette propriété, on utilise le théorème de la médiane qui exprime MA au carré plus MB au carré en fonction de MI et de AB. L'équation se transforme alors en une équation de cercle. Attention, pour que le cercle existe, il faut que la constante k soit suffisamment grande.",
    "note": "MA² + MB² = k définit un cercle de centre I(milieu de AB)"
  },
  {
    "titre": "Ligne de niveau : MA · MB = k",
    "contenu": "<div style='padding: 10px;'><h3 style='color: #1a5276;'>Étude de la ligne de niveau \\\\(\\\\vec{MA} \\\\cdot \\\\vec{MB} = k\\\\)</h3><div style='background: #eaf2f8; padding: 15px; border-radius: 8px; margin: 10px 0;'><p><strong>Propriété :</strong></p><p>Soient A et B deux points fixes et k un réel.</p><p>L'ensemble des points M du plan vérifiant :</p><div class='math-block' style='text-align: center; background: white; padding: 10px; border-radius: 5px; margin: 10px 0;'><div class='math'>$$\\overrightarrow{MA} \\cdot \\overrightarrow{MB} = k$$</div></div><p>est un <strong>cercle</strong> (ou un point ou l'ensemble vide).</p></div><div style='background: #d4e6f1; padding: 15px; border-radius: 8px; margin: 10px 0;'><p><strong>Expression avec le milieu I :</strong></p><div class='math-block' style='text-align: center; background: white; padding: 10px; border-radius: 5px;'><div class='math'>$$\\overrightarrow{MA} \\cdot \\overrightarrow{MB} = MI^2 - \\dfrac{AB^2}{4}$$</div></div></div><div style='background: #fdf2e9; padding: 15px; border-radius: 8px; margin: 10px 0; border-left: 4px solid #e67e22;'><p style='margin: 0;'><strong>💡 Remarque :</strong> Si <span style='color: #c0392b;'>k > -AB²/4</span>, c'est un cercle. Si <span style='color: #c0392b;'>k = -AB²/4</span>, c'est le point I. Si <span style='color: #c0392b;'>k < -AB²/4</span>, l'ensemble est vide.</p></div></div>",
    "texteParle": "Nous abordons maintenant la ligne de niveau définie par le produit scalaire de MA par MB est égal à une constante k. Cette ligne de niveau est également un cercle, dont le centre est le milieu I du segment AB. L'expression du produit scalaire en fonction de MI et AB permet de déterminer la nature de l'ensemble. Selon la valeur de k, on peut obtenir un cercle, un point singulier, ou même un ensemble vide. C'est un bel exemple de l'utilisation du produit scalaire en géométrie.",
    "note": "MA·MB = k définit un cercle centré en I(milieu de AB)"
  },
  {
    "titre": "Application : Concours des médianes",
    "contenu": "<div style='padding: 10px;'><h3 style='color: #1a5276;'>Les médianes d'un triangle sont concourantes</h3><div style='background: #eaf2f8; padding: 15px; border-radius: 8px; margin: 10px 0;'><p><strong>Théorème :</strong></p><p>Dans un triangle ABC, les trois médianes sont concourantes en un point G appelé <strong>centre de gravité</strong>.</p><p>Ce point G est l'<strong>isobarycentre</strong> des sommets du triangle.</p></div><div style='background: #d4e6f1; padding: 15px; border-radius: 8px; margin: 10px 0;'><p><strong>Définition de l'isobarycentre :</strong></p><p>G est le barycentre des points pondérés (A, 1), (B, 1), (C, 1).</p><div class='math-block' style='text-align: center; background: white; padding: 10px; border-radius: 5px;'><div class='math'>$$\\overrightarrow{GA} + \\overrightarrow{GB} + \\overrightarrow{GC} = \\vec{0}$$</div></div></div><div style='background: #fdf2e9; padding: 15px; border-radius: 8px; margin: 10px 0; border-left: 4px solid #e67e22;'><p style='margin: 0;'><strong>🏗️ Application industrielle :</strong> Le centre de gravité est utilisé en mécanique pour trouver le point d'équilibre d'une plaque triangulaire.</p></div></div>",
    "texteParle": "Nous arrivons maintenant à une application majeure du barycentre : la démonstration que les médianes d'un triangle sont concourantes. Une médiane est une droite qui relie un sommet au milieu du côté opposé. Le théorème nous dit que les trois médianes se coupent en un même point, appelé le centre de gravité du triangle. Ce point est en fait l'isobarycentre des sommets, c'est-à-dire le barycentre avec des coefficients tous égaux à 1. En industrie, cette propriété est utilisée, par exemple, pour trouver le point d'équilibre d'une plaque triangulaire.",
    "note": "Les 3 médianes d'un triangle se coupent au centre de gravité G"
  },
  {
    "titre": "Démonstration : Concours des médianes",
    "contenu": "<div style='padding: 10px;'><h3 style='color: #1a5276;'>Démonstration étape par étape</h3><div style='background: #eaf2f8; padding: 15px; border-radius: 8px; margin: 10px 0;'><p><strong>Étape 1 :</strong> Soit A' le milieu de [BC].</p><p>La médiane issue de A est la droite (AA').</p><p>On considère G le barycentre de (A, 1), (B, 1), (C, 1).</p></div><div style='background: #d4e6f1; padding: 15px; border-radius: 8px; margin: 10px 0;'><p><strong>Étape 2 :</strong> On montre que G est sur (AA').</p><p>G barycentre de (A, 1) et du barycentre de (B, 1), (C, 1).</p><p>Le barycentre de (B, 1), (C, 1) est A' (milieu de [BC]).</p><p>Donc G est barycentre de (A, 1) et (A', 2).</p><p>Ce qui signifie que G est sur la droite (AA').</p></div><div style='background: #fdf2e9; padding: 15px; border-radius: 8px; margin: 10px 0; border-left: 4px solid #2ecc71;'><p style='margin: 0;'><strong>✅ Conclusion :</strong> Par le même raisonnement, G appartient aux trois médianes. Donc les médianes sont concourantes en G.</p></div></div>",
    "texteParle": "Voyons maintenant la démonstration de ce théorème de manière détaillée. Nous allons procéder en deux étapes. D'abord, nous considérons le milieu A' du côté BC. La médiane issue de A est donc la droite AA'. Ensuite, nous prenons G, l'isobarycentre des trois sommets. Nous allons montrer que G se trouve sur cette médiane. Pour cela, nous utilisons le théorème du barycentre partiel : le barycentre de B et C avec des coefficients égaux est le milieu A'. Donc G est le barycentre de A avec le coefficient 1 et de A' avec le coefficient 2. Cela signifie que G se trouve sur la droite AA'. En répétant le même raisonnement pour les autres côtés, on prouve que G appartient aux trois médianes. Les médianes sont donc concourantes au centre de gravité G.",
    "note": "Démonstration par barycentre partiel"

  {
    "titre": "Propriétés du centre de gravité",
    "contenu": "<div style='padding: 10px;'><h3 style='color: #1a5276;'>Propriétés du centre de gravité</h3><div style='background: #eaf2f8; padding: 15px; border-radius: 8px; margin: 10px 0;'><p><strong>Propriété 1 :</strong></p><p>G est situé aux <span style='color: #c0392b;'>2/3</span> de chaque médiane à partir du sommet.</p><div class='math-block' style='text-align: center; background: white; padding: 10px; border-radius: 5px; margin: 10px 0;'><div class='math'>$$\\overrightarrow{AG} = \\dfrac{2}{3}\\overrightarrow{AA'}$$</div></div><p>où A' est le milieu de [BC].</p></div><div style='background: #d4e6f1; padding: 15px; border-radius: 8px; margin: 10px 0;'><p><strong>Propriété 2 :</strong></p><p>Les coordonnées du centre de gravité sont la moyenne des coordonnées des sommets.</p><div class='math-block' style='text-align: center; background: white; padding: 10px; border-radius: 5px;'><div class='math'>$$G\\left(\\dfrac{x_A + x_B + x_C}{3}; \\dfrac{y_A + y_B + y_C}{3}\\right)$$</div></div></div><div style='background: #fdf2e9; padding: 15px; border-radius: 8px; margin: 10px 0; border-left: 4px solid #e67e22;'><p style='margin: 0;'><strong>⚙️ Application :</strong> En mécanique, le centre de gravité est le point d'application du poids d'un objet.</p></div></div>",
    "texteParle": "Le centre de gravité possède des propriétés importantes que nous devons retenir. Premièrement, le centre de gravité se trouve aux deux tiers de chaque médiane en partant du sommet. Cela signifie que sur la médiane AA', le point G est situé de telle sorte que AG est égal aux deux tiers de AA'. Deuxièmement, les coordonnées du centre de gravité sont simplement la moyenne des coordonnées des trois sommets du triangle. Cette propriété est très pratique pour les calculs. En mécanique industrielle, le centre de gravité est le point où s'applique le poids d'un objet, ce qui en fait un concept essentiel pour l'équilibre des structures.",
    "note": "G est aux 2/3 de chaque médiane à partir du sommet"
  },
  {
    "titre": "Lignes de niveau : Cas général",
    "contenu": "<div style='padding: 10px;'><h3 style='color: #1a5276;'>Synthèse des lignes de niveau</h3><div style='background: #eaf2f8; padding: 15px; border-radius: 8px; margin: 10px 0;'><p><strong>Cas 1 :</strong> <span style='color: #c0392b;'>MA² - MB² = k</span></p><p>→ <strong>Droite</strong> perpendiculaire à (AB)</p></div><div style='background: #d4e6f1; padding: 15px; border-radius: 8px; margin: 10px 0;'><p><strong>Cas 2 :</strong> <span style='color: #c0392b;'>MA² + MB² = k</span></p><p>→ <strong>Cercle</strong> de centre I (milieu de [AB])</p></div><div style='background: #eaf2f8; padding: 15px; border-radius: 8px; margin: 10px 0;'><p><strong>Cas 3 :</strong> <span style='color: #c0392b;'>\\\\(\\\\vec{MA} \\\\cdot \\\\vec{MB} = k\\\\)</span></p><p>→ <strong>Cercle</strong> de centre I (milieu de [AB])</p></div><div style='background: #fdf2e9; padding: 15px; border-radius: 8px; margin: 10px 0; border-left: 4px solid #2ecc71;'><p style='margin: 0;'><strong>📝 À retenir :</strong> La nature de la ligne de niveau dépend de l'expression choisie. L'utilisation du produit scalaire permet de caractériser ces lignes.</p></div></div>",
    "texteParle": "Faisons maintenant une synthèse des différentes lignes de niveau que nous avons étudiées. Dans le premier cas, MA au carré moins MB au carré égale k donne une droite perpendiculaire à AB. Dans le deuxième cas, MA au carré plus MB au carré égale k donne un cercle centré au milieu de AB. Et dans le troisième cas, le produit scalaire de MA par MB égale k donne également un cercle centré au milieu de AB. La nature de la ligne de niveau dépend donc de l'expression choisie. L'utilisation du produit scalaire est un outil puissant pour caractériser ces lignes géométriques.",
    "note": "Synthèse des 3 cas de lignes de niveau vus en cours"
  },
  {
    "titre": "Exemple industriel : Positionnement",
    "contenu": "<div style='padding: 10px;'><h3 style='color: #1a5276;'>Application en milieu industriel</h3><div style='background: #eaf2f8; padding: 15px; border-radius: 8px; margin: 10px 0;'><p><strong>Problème :</strong></p><p>Dans un atelier, on veut placer un robot M de telle sorte que :</p><div class='math-block' style='text-align: center; background: white; padding: 10px; border-radius: 5px; margin: 10px 0;'><div class='math'>$$MA^2 + MB^2 = 100$$</div></div><p>où A(2; 1) et B(6; 5) sont deux machines fixes.</p></div><div style='background: #d4e6f1; padding: 15px; border-radius: 8px; margin: 10px 0;'><p><strong>Solution :</strong></p><p>I milieu de [AB] : I(4; 3)</p><p>On a : <span style='color: #c0392b;'>MA² + MB² = 2MI² + AB²/2</span></p><p>AB = √((6-2)² + (5-1)²) = √(16+16) = 4√2</p><p>AB²/2 = 32/2 = 16</p><p>Donc : 2MI² + 16 = 100 → MI² = 42</p><p>Le robot doit être sur le cercle de centre I(4;3) et de rayon √42.</p></div></div>",
    "texteParle": "Prenons un exemple concret d'application industrielle des lignes de niveau. Dans un atelier, nous avons deux machines fixes aux points A et B. Nous voulons placer un robot M tel que la somme des distances au carré de M à A et de M à B soit égale à 100. En utilisant la propriété MA au carré plus MB au carré est égal à 2 MI au carré plus AB au carré sur 2, on trouve que le robot doit se trouver sur un cercle de centre I, le milieu de AB, avec un rayon de racine carrée de 42. Cela permet à l'ingénieur de déterminer toutes les positions possibles du robot pour répondre à ce critère.",

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentIndex = 0;
    let isSpeaking = false;
    let isPaused = false;
    let currentUtterance = null;
    let isLoading = false;
    let loadingTimeout = null;
    let isTransitioning = false;
    let speechSupported = true;
    let userInteracted = false;
    let isPlaying = false;
    let loadingCancelled = false;

    const total = slides.length;
    const synth = window.speechSynthesis;

    // Références jQuery
    const $title = $('#slideTitle');
    const $body = $('#slideBody');
    const $counter = $('#slideCounter');
    const $statusText = $('#statusText');
    const $statusBadge = $('#statusBadge');
    const $loading = $('#loadingOverlay');
    const $loadingText = $('#loadingText');
    const $loadingSub = $('#loadingSub');
    const $loadingTimeout = $('#loadingTimeout');
    const $loadingProgressBar = $('#loadingProgressBar');
    const $autoIndicator = $('#autoIndicator');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $replay = $('#replayBtn');
    const $play = $('#playBtn');
    const $cancelLoading = $('#cancelLoadingBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function setStatus(text, type) {
        $statusText.text(text);
        $statusBadge.removeClass('idle speaking error paused waiting loading');
        if (type === 'speaking') $statusBadge.addClass('speaking');
        else if (type === 'error') $statusBadge.addClass('error');
        else if (type === 'paused') $statusBadge.addClass('paused');
        else if (type === 'waiting') $statusBadge.addClass('waiting');
        else if (type === 'loading') $statusBadge.addClass('loading');
        else $statusBadge.addClass('idle');
    }

    function updatePlayButton() {
        if (isPlaying) {
            $play.addClass('playing');
            $play.find('.btn-icon').text('⏸');
            $play.find('.btn-label').text('Pause');
        } else {
            $play.removeClass('playing');
            $play.find('.btn-icon').text('▶');
            $play.find('.btn-label').text('Play');
        }
    }

    function showLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        
        loadingCancelled = false;
        isLoading = true;
        
        // Réinitialiser la barre de progression
        $loadingProgressBar.css('animation', 'none');
        $loadingProgressBar.css('width', '0%');
        // Forcer un reflow
        $loadingProgressBar[0].offsetHeight;
        $loadingProgressBar.css('animation', 'loadingProgress 30s ease-out forwards');
        
        $loadingText.text('Préparation vocale...');
        $loadingSub.text('Synthèse en cours');
        $loadingTimeout.text('⏱️ 30 secondes maximum');
        $loading.fadeIn(300);
        setStatus("⏳ Chargement...", 'loading');
        
        // 🔥 TIMEOUT DE 30 SECONDES
        loadingTimeout = setTimeout(() => {
            if (isLoading && !loadingCancelled) {
                hideLoading();
                setStatus("⚠️ Délai dépassé (30s)", 'error');
                isPlaying = false;
                updatePlayButton();
                $loadingSub.text('La synthèse vocale a pris trop de temps');
                $loadingTimeout.text('❌ Délai dépassé');
            }
        }, 30000);
    }

    function hideLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        isLoading = false;
        loadingCancelled = false;
        $loading.fadeOut(300);
        // Ne pas changer le statut si on est en train de parler
        if (!isSpeaking && !isPlaying) {
            setStatus("⏸ Lecture arrêtée", 'paused');
        }
    }

    function cancelLoading() {
        loadingCancelled = true;
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        hideLoading();
        stopSpeaking();
        setStatus("⏸ Annulé", 'paused');
        isPlaying = false;
        updatePlayButton();
        $loadingText.text('Annulé par l\'utilisateur');
        $loadingSub.text('Vous pouvez réessayer');
        $loadingTimeout.text('✕ Annulation');
    }

    // Arrêter la parole proprement
    function stopSpeaking() {
        try {
            if (synth && (synth.speaking || synth.pending)) {
                synth.cancel();
            }
        } catch(e) {
            console.warn('Erreur stopSpeaking:', e);
        }
        if (currentUtterance) {
            try {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance.onstart = null;
            } catch(e) {}
            currentUtterance = null;
        }
        isSpeaking = false;
        isPlaying = false;
        updatePlayButton();
    }

    // Mettre en pause la parole
    function pauseSpeaking() {
        try {
            if (synth && synth.speaking) {
                synth.pause();
                isPaused = true;
                isPlaying = false;
                setStatus("⏸ Lecture en pause", 'paused');
                updatePlayButton();
            }
        } catch(e) {
            console.warn('Erreur pauseSpeaking:', e);
            stopSpeaking();
        }
    }

    // Reprendre la parole
    function resumeSpeaking() {
        try {
            if (synth && synth.paused) {
                synth.resume();
                isPaused = false;
                isPlaying = true;
                setStatus("🔊 Lecture en cours", 'speaking');
                updatePlayButton();
            } else if (!isSpeaking && !synth.speaking && !synth.pending) {
                speakSlide(currentIndex);
            }
        } catch(e) {
            console.warn('Erreur resumeSpeaking:', e);
            speakSlide(currentIndex);
        }
    }

    function renderSlide(index) {
        const slide = slides[index];
        $title.text(slide.titre);

        let html = '';
        html += `<div class="content-card">${slide.contenu}</div>`;
        if (slide.note) {
            html += `<div class="note-box">${slide.note}</div>`;
        }
        $body.html(html);
        $counter.text(`${index+1} / ${total}`);

        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
        }
    }

    // ================================================================
    // LECTURE VOCALE
    // ================================================================
    function speakSlide(index) {
        return new Promise((resolve) => {
            const slide = slides[index];
            const text = slide.texteParle;
            
            if (!text || text.trim() === '' || !speechSupported) {
                resolve();
                return;
            }

            if (!window.speechSynthesis) {
                setStatus("❌ Synthèse vocale non supportée", 'error');
                speechSupported = false;
                resolve();
                return;
            }

            // Arrêter toute lecture en cours
            stopSpeaking();
            
            // Réinitialiser l'état de pause
            isPaused = false;
            
            showLoading();
            setStatus("Initialisation...", 'loading');

            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.92;
                utterance.pitch = 1.05;
                utterance.volume = 1;

                let isFinished = false;
                let errorHandled = false;

                utterance.onstart = function() {
                    if (loadingCancelled) {
                        stopSpeaking();
                        resolve();
                        return;
                    }
                    hideLoading();
                    isSpeaking = true;
                    isPlaying = true;
                    isPaused = false;
                    setStatus("🔊 Lecture en cours", 'speaking');
                    updatePlayButton();
                };

                utterance.onend = function() {
                    if (isFinished) return;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    setStatus("✅ Terminé", 'idle');
                    hideLoading();
                    updatePlayButton();
                    resolve();
                };

                utterance.onerror = function(e) {
                    if (isFinished || errorHandled) return;
                    errorHandled = true;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    hideLoading();
                    updatePlayButton();
                    
                    if (e.error === 'not-allowed') {
                        setStatus("⚠️ Permission refusée", 'error');
                    } else if (e.error === 'synthesis-unavailable') {
                        setStatus("⚠️ Synthèse indisponible", 'error');
                    } else if (e.error === 'canceled') {
                        setStatus("⏸ Annulé", 'paused');
                    } else {
                        setStatus("❌ Erreur audio: " + (e.error || 'inconnue'), 'error');
                    }
                    
                    resolve();
                };

                // Gestion du chargement des voix
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = function() {
                        if (!loadingCancelled) {
                            try {
                                synth.speak(utterance);
                            } catch(err) {
                                // Silencieux
                            }
                        }
                        synth.onvoiceschanged = null;
                    };
                }

                currentUtterance = utterance;
                
                if (!loadingCancelled) {
                    try {
                        synth.speak(utterance);
                    } catch(err) {
                        setTimeout(() => {
                            if (!loadingCancelled) {
                                try {
                                    synth.speak(utterance);
                                } catch(e) {
                                    setStatus("❌ Erreur de lecture", 'error');
                                    isPlaying = false;
                                    updatePlayButton();
                                    hideLoading();
                                    resolve();
                                }
                            } else {
                                resolve();
                            }
                        }, 100);
                    }
                } else {
                    resolve();
                }

            } catch(err) {
                hideLoading();
                setStatus("❌ Erreur générale", 'error');
                isPlaying = false;
                updatePlayButton();
                console.error('Erreur speakSlide:', err);
                resolve();
            }
        });
    }

    // ================================================================
    // NAVIGATION
    // ================================================================
    async function goToSlide(index) {
        if (isTransitioning) return;
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        
        // Si on est en train de lire, on met en pause avant de naviguer
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        // Arrêter complètement la lecture
        stopSpeaking();
        
        await new Promise(r => setTimeout(r, 50));
        
        if (index === currentIndex) {
            setStatus("📄 Slide actuel", 'idle');
            return;
        }

        isTransitioning = true;
        currentIndex = index;
        renderSlide(index);
        
        // Réinitialiser l'état de lecture
        isPlaying = false;
        updatePlayButton();
        setStatus("⏸ Lecture arrêtée", 'paused');

        await new Promise(r => setTimeout(r, 150));
        isTransitioning = false;
    }

    async function goToNext() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex + 1 < total) {
            await goToSlide(currentIndex + 1);
        } else {
            setStatus("🏁 Dernier slide", 'idle');
        }
    }

    async function goToPrev() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex - 1 >= 0) {
            await goToSlide(currentIndex - 1);
        } else {
            setStatus("🔁 Premier slide", 'idle');
        }
    }

    // ================================================================
    // GESTION PLAY/PAUSE
    // ================================================================
    function togglePlay() {
        if (!userInteracted) {
            userInteracted = true;
        }

        // Si le chargement est en cours, on l'annule
        if (isLoading) {
            cancelLoading();
            return;
        }

        // Si le synthétiseur est en pause, on reprend
        if (synth && synth.paused) {
            resumeSpeaking();
            return;
        }

        // Si la lecture est en cours, on met en pause
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
            return;
        }

        // Sinon, on démarre la lecture du slide courant
        if (!isSpeaking && !isPlaying) {
            stopSpeaking();
            speakSlide(currentIndex);
        }
    }

    // ================================================================
    // INIT
    // ================================================================
    async function init() {
        // Vérifier la compatibilité
        if (!window.speechSynthesis) {
            setStatus("❌ Synthèse vocale non supportée", 'error');
            speechSupported = false;
        }

        // Précharger les voix
        try {
            if (synth.getVoices) {
                synth.getVoices();
                setTimeout(() => {
                    try {
                        synth.getVoices();
                    } catch(e) {}
                }, 200);
            }
        } catch(e) {
            console.warn('Erreur chargement voix:', e);
        }

        // Afficher le premier slide
        renderSlide(0);
        $counter.text(`1 / ${total}`);
        
        // État initial
        setStatus("⏸ Appuie sur Play", 'paused');
        updatePlayButton();
        $autoIndicator.text('⏸ Lecture manuelle');

        // ================================================================
        // ÉVÉNEMENTS
        // ================================================================
        
        // Bouton Play/Pause
        $play.on('click', function() {
            togglePlay();
        });

        // Bouton Annuler le chargement
        $cancelLoading.on('click', function() {
            cancelLoading();
        });

        // Navigation
        $prev.on('click', function() {
            // Si chargement en cours, on annule
            if (isLoading) cancelLoading();
            goToPrev();
        });

        $next.on('click', function() {
            if (isLoading) cancelLoading();
            goToNext();
        });

        // Replay - relire le slide courant
        $replay.on('click', function() {
            if (isLoading) cancelLoading();
            stopSpeaking();
            setTimeout(() => {
                speakSlide(currentIndex);
            }, 100);
        });

        // Support du clavier (espace pour play/pause)
        $(document).on('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });

        // Nettoyage
        $(window).on('beforeunload', function() {
            try {
                if (synth.speaking) synth.cancel();
            } catch(e) {}
            hideLoading();
        });

        // Gérer les cas où la synthèse se termine de manière inattendue
        setInterval(() => {
            if (isPlaying && !synth.speaking && !synth.pending && !isPaused && !isLoading) {
                isPlaying = false;
                updatePlayButton();
                setStatus("⏸ Lecture arrêtée", 'paused');
            }
        }, 1000);
    }

    init();
});



    // ================================================================
    // GESTION DU THÈME JOUR/NUIT
    // ================================================================
    let isDarkMode = false;

    function toggleTheme() {
        isDarkMode = !isDarkMode;
        const body = document.body;
        const appContainer = document.querySelector('.app-container');
        const header = document.querySelector('.slide-header');
        const footer = document.querySelector('.slide-footer');
        const contentCards = document.querySelectorAll('.content-card');
        const noteBoxes = document.querySelectorAll('.note-box');
        const mathBlocks = document.querySelectorAll('.math-block');
        const buttons = document.querySelectorAll('.btn');
        const statusBadge = document.querySelector('.status-badge');
        const slideCounter = document.querySelector('.slide-counter');
        const autoIndicator = document.querySelector('.auto-indicator');
        const themeBtn = document.getElementById('themeToggle');

        if (isDarkMode) {
            // Mode nuit
            body.style.background = '#0b1120';
            body.style.color = '#f1f5f9';
            appContainer.style.background = 'linear-gradient(145deg, #0f172a 0%, #1e293b 100%)';
            header.style.background = 'rgba(15, 23, 42, 0.85)';
            footer.style.background = 'rgba(15, 23, 42, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.05)';
                card.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.08)';
                note.style.color = '#cbd5e1';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.25)';
                block.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#e2e8f0';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.12)';
                statusBadge.style.color = '#93bbfc';
            }
            if (slideCounter) {
                slideCounter.style.color = '#94a3b8';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#64748b';
            }
            if (themeBtn) {
                themeBtn.textContent = '☀️';
                themeBtn.title = 'Passer en mode jour';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#e2e8f0';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#e2e8f0';
                }
            });
        } else {
            // Mode jour (par défaut)
            body.style.background = '#f0f4f8';
            body.style.color = '#1a202c';
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
            header.style.background = 'rgba(255, 255, 255, 0.85)';
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.8)';
                card.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.12)';
                note.style.color = '#2c3e50';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.05)';
                block.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#2d3748';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
                statusBadge.style.color = '#2b6cb0';
            }
            if (slideCounter) {
                slideCounter.style.color = '#4a5568';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#718096';
            }
            if (themeBtn) {
                themeBtn.textContent = '🌓';
                themeBtn.title = 'Passer en mode nuit';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#2c3e50';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#2d3748';
                }
            });
        }
    }

    // Initialiser en mode jour
    document.addEventListener('DOMContentLoaded', function() {

        const body = document.body;
        body.style.background = '#f0f4f8';
        body.style.color = '#1a202c';

        const autoIndicator = document.querySelector('.auto-indicator');

        const themeBtn = document.getElementById('themeToggle');
