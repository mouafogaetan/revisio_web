<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Mathématiques Industrielles",
  "classe": "1ère Technique",
  "sequence": "Séquence 3",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Fonctions Polynômes du Second Degré et Systèmes Linéaires",
      "points": "6 pts",
      "enonce": "<p>Une entreprise de production industrielle fabrique des pièces mécaniques. Le coût total de production (en milliers de FCFA) pour <span style='color: #c0392b;'>x</span> centaines de pièces est modélisé par la fonction :</p><div class='math-block' style='background: #eaf2f8; padding: 15px; border-radius: 8px; margin: 15px 0; text-align: center;'><div class='math'>$$C(x) = 2x^2 - 12x + 50$$</div></div><p>avec <span style='color: #c0392b;'>x \\in [0; 10]</span>.</p><p>Le prix de vente unitaire est fixé à 8 000 FCFA par centaine de pièces, ce qui donne une recette <span style='color: #c0392b;'>R(x) = 8x</span> (en milliers de FCFA).</p>",
      "questions": [
        {
          "question": "1) Déterminer la forme canonique de la fonction coût <span style='color: #c0392b;'>C(x)</span>.",
          "reponse": "<p><span style='color: #c0392b;'>C(x) = 2(x - 3)² + 32</span></p><p><strong>Justification :</strong></p><p><span style='color: #c0392b;'>C(x) = 2(x² - 6x) + 50 = 2[(x - 3)² - 9] + 50 = 2(x - 3)² - 18 + 50 = 2(x - 3)² + 32</span></p>"
        },
        {
          "question": "2) Résoudre l'équation <span style='color: #c0392b;'>C(x) = R(x)</span> pour déterminer le point mort (seuil de rentabilité).",
          "reponse": "<p>On résout : <span style='color: #c0392b;'>2x² - 12x + 50 = 8x</span></p><p><span style='color: #c0392b;'>2x² - 20x + 50 = 0</span></p><p>On divise par 2 : <span style='color: #c0392b;'>x² - 10x + 25 = 0</span></p><p><span style='color: #c0392b;'>(x - 5)² = 0</span></p><p>Donc <span style='color: #c0392b;'>x = 5</span></p><p>Le seuil de rentabilité est atteint pour 500 pièces produites.</p>"
        },
        {
          "question": "3) Déterminer le signe du bénéfice <span style='color: #c0392b;'>B(x) = R(x) - C(x)</span>.",
          "reponse": "<p><span style='color: #c0392b;'>B(x) = 8x - (2x² - 12x + 50) = -2x² + 20x - 50 = -2(x - 5)²</span></p><p>Comme <span style='color: #c0392b;'>-2(x - 5)² \\le 0</span> pour tout <span style='color: #c0392b;'>x</span>, le bénéfice est toujours négatif ou nul.</p><p>Le bénéfice est maximal et égal à 0 pour <span style='color: #c0392b;'>x = 5</span>.</p><p>L'entreprise ne réalise donc pas de bénéfice, elle est au mieux à l'équilibre pour 500 pièces.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Nombres Complexes en Électricité",
      "points": "5 pts",
      "enonce": "<p>En électricité industrielle, l'impédance d'un circuit RLC série est modélisée par un nombre complexe :</p><div class='math-block' style='background: #eaf2f8; padding: 15px; border-radius: 8px; margin: 15px 0; text-align: center;'><div class='math'>$$Z = R + j(L\\omega - \\dfrac{1}{C\\omega})$$</div></div><p>avec <span style='color: #c0392b;'>j² = -1</span>.</p><p>Pour un circuit donné, on a : <span style='color: #c0392b;'>R = 10 Ω</span>, <span style='color: #c0392b;'>Lω = 8 Ω</span> et <span style='color: #c0392b;'>1/(Cω) = 2 Ω</span>.</p>",
      "questions": [
        {
          "question": "1) Déterminer l'impédance <span style='color: #c0392b;'>Z</span> sous forme algébrique.",
          "reponse": "<p><span style='color: #c0392b;'>Z = 10 + j(8 - 2) = 10 + 6j</span></p>"
        },
        {
          "question": "2) Calculer le module <span style='color: #c0392b;'>|Z|</span> de l'impédance.",
          "reponse": "<p><span style='color: #c0392b;'>|Z| = \\sqrt{10² + 6²} = \\sqrt{100 + 36} = \\sqrt{136} = 2\\sqrt{34} \\approx 11,66 \\, \\Omega</span></p>"
        },
        {
          "question": "3) Déterminer le conjugué <span style='color: #c0392b;'>\\overline{Z}</span> de l'impédance.",
          "reponse": "<p><span style='color: #c0392b;'>\\overline{Z} = 10 - 6j</span></p>"
        },
        {
          "question": "4) Déterminer l'argument <span style='color: #c0392b;'>\\theta</span> de l'impédance (en radians).",
          "reponse": "<p><span style='color: #c0392b;'>\\theta = \\arctan\\left(\\dfrac{6}{10}\\right) = \\arctan(0,6) \\approx 0,540 \\, \\text{rad}</span></p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Suites Numériques en Production",
      "points": "4 pts",
      "enonce": "<p>Une entreprise de production industrielle a produit 500 pièces la première semaine. La production augmente de 20 pièces chaque semaine.</p>",
      "questions": [
        {
          "question": "1) Reconnaître la nature de la suite représentant la production hebdomadaire.",
          "reponse": "<p>La production hebdomadaire augmente de 20 pièces chaque semaine, donc c'est une <strong>suite arithmétique</strong> de raison <span style='color: #c0392b;'>r = 20</span> et de premier terme <span style='color: #c0392b;'>u₁ = 500</span>.</p>"
        },
        {
          "question": "2) Déterminer l'expression du terme général <span style='color: #c0392b;'>u_n</span> de cette suite.",
          "reponse": "<p>Pour une suite arithmétique : <span style='color: #c0392b;'>u_n = u₁ + (n-1)r</span></p><p>Donc <span style='color: #c0392b;'>u_n = 500 + (n-1) × 20 = 480 + 20n</span></p>"
        },
        {
          "question": "3) Calculer la production de la 10ème semaine.",
          "reponse": "<p><span style='color: #c0392b;'>u₁₀ = 480 + 20 × 10 = 480 + 200 = 680</span> pièces</p><p>La production de la 10ème semaine sera de 680 pièces.</p>"
        },
        {
          "question": "4) Calculer la production totale des 10 premières semaines.",
          "reponse": "<p>Pour une suite arithmétique : <span style='color: #c0392b;'>S_n = \\dfrac{n(u₁ + u_n)}{2}</span></p><p><span style='color: #c0392b;'>S₁₀ = \\dfrac{10(500 + 680)}{2} = 5 × 1180 = 5900</span> pièces</p><p>La production totale des 10 premières semaines est de 5900 pièces.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Géométrie Métrique pour l'Implantation d'Équipements",
      "points": "5 pts",
      "enonce": "<p>Dans un atelier industriel, on souhaite implanter deux machines aux points <span style='color: #c0392b;'>A(1; 2)</span> et <span style='color: #c0392b;'>B(5; 6)</span> dans un repère orthonormé (unité : 1 mètre).</p><p>Un opérateur doit se déplacer le long de la droite <span style='color: #c0392b;'>(D): 3x - 4y + 1 = 0</span> qui représente un couloir de circulation.</p>",
      "questions": [
        {
          "question": "1) Calculer la distance AB entre les deux machines.",
          "reponse": "<p><span style='color: #c0392b;'>AB = \\sqrt{(5-1)² + (6-2)²} = \\sqrt{4² + 4²} = \\sqrt{16 + 16} = \\sqrt{32} = 4\\sqrt{2} \\approx 5,66</span> m</p>"
        },
        {
          "question": "2) Déterminer l'équation du cercle de centre A et passant par B.",
          "reponse": "<p>Le rayon du cercle est AB = <span style='color: #c0392b;'>4\\sqrt{2}</span>.</p><p>L'équation du cercle est : <span style='color: #c0392b;'>(x - 1)² + (y - 2)² = 32</span></p>"
        },
        {
          "question": "3) Calculer la distance du point A à la droite (D).",
          "reponse": "<p><span style='color: #c0392b;'>d(A, D) = \\dfrac{|3(1) - 4(2) + 1|}{\\sqrt{3² + (-4)²}} = \\dfrac{|3 - 8 + 1|}{\\sqrt{9 + 16}} = \\dfrac{|-4|}{5} = \\dfrac{4}{5} = 0,8</span> m</p>"
        },
        {
          "question": "4) Déterminer la position relative de la droite (D) par rapport au cercle de centre A et de rayon 2.",
          "reponse": "<p>La distance du centre A à la droite (D) est 0,8 m.</p><p>Le rayon du cercle est 2 m.</p><p>Comme 0,8 < 2, la distance du centre à la droite est inférieure au rayon, donc la droite (D) <strong>coupe</strong> le cercle en deux points.</p>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
