<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Maths Industriel",
  "classe": "1ère technique",
  "sequence": "Séquence 6",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Fonctions polynômes du second degré",
      "points": "4 pts",
      "enonce": "<div style='background-color: #f0f8ff; padding: 15px; border-radius: 8px; color: #0d47a1;'><p>Dans une entreprise, le bénéfice réalisé (en millions de FCFA) pour la fabrication et la vente de <span class='math'>\\( x \\)</span> centaines de pièces est donné par :</p><div class='math-block'><div class='math'>$$ B(x) = -2x^2 + 12x - 10 $$</div></div></div>",
      "questions": [
        {
          "question": "<p>1) Déterminer la forme canonique de <span class='math'>\\( B(x) \\)</span>.</p>",
          "reponse": "<p><span class='math'>\\( B(x) = -2(x^2 - 6x) - 10 = -2[(x-3)^2 - 9] - 10 \\)</span><br><span class='math'>\\( B(x) = -2(x-3)^2 + 18 - 10 = -2(x-3)^2 + 8 \\)</span></p>"
        },
        {
          "question": "<p>2) En déduire la quantité de pièces à vendre pour réaliser un bénéfice maximal et donner ce bénéfice maximal.</p>",
          "reponse": "<p>Le bénéfice maximal est atteint pour <span class='math'>\\( x = 3 \\)</span> (300 pièces).<br>Le bénéfice maximal est <span class='math'>\\( B_{\\max} = 8 \\)</span> millions de FCFA.</p>"
        },
        {
          "question": "<p>3) Résoudre l'inéquation <span class='math'>\\( B(x) \\ge 0 \\)</span> et interpréter le résultat.</p>",
          "reponse": "<p><span class='math'>\\( -2x^2 + 12x - 10 \\ge 0 \\)</span><br><span class='math'>\\( -2(x-1)(x-5) \\ge 0 \\)</span><br><span class='math'>\\( S = [1, 5] \\)</span><br>L'entreprise réalise un bénéfice (ou au moins un bénéfice nul) pour une production comprise entre 100 et 500 pièces.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Systèmes linéaires et programmation linéaire",
      "points": "4 pts",
      "enonce": "<div style='background-color: #f5f5dc; padding: 15px; border-radius: 8px; color: #4e342e;'><p>Une entreprise fabrique deux produits P et Q. Pour chaque produit, elle dispose de deux machines M1 et M2. Les temps d'utilisation (en heures par unité) sont donnés dans le tableau ci-dessous :</p><table style='width:100%; border-collapse: collapse; margin:10px 0;'><tr style='background-color: #d7ccc8;'><th style='padding:8px; border:1px solid #ddd;'></th><th style='padding:8px; border:1px solid #ddd;'>Machine M1</th><th style='padding:8px; border:1px solid #ddd;'>Machine M2</th></tr><tr><td style='padding:8px; border:1px solid #ddd;'>Produit P</td><td style='padding:8px; border:1px solid #ddd;'>2</td><td style='padding:8px; border:1px solid #ddd;'>1</td></tr><tr><td style='padding:8px; border:1px solid #ddd;'>Produit Q</td><td style='padding:8px; border:1px solid #ddd;'>1</td><td style='padding:8px; border:1px solid #ddd;'>3</td></tr></table><p>Les disponibilités hebdomadaires sont de 80 heures pour M1 et 120 heures pour M2. Le bénéfice unitaire est de 3000 FCFA pour P et 2000 FCFA pour Q.</p></div>",
      "questions": [
        {
          "question": "<p>1) En notant <span class='math'>\\( x \\)</span> et <span class='math'>\\( y \\)</span> les quantités hebdomadaires de P et Q, écrire les contraintes du problème.</p>",
          "reponse": "<div class='math-block'><div class='math'>$$ \\begin{cases} 2x + y \\le 80 \\\\ x + 3y \\le 120 \\\\ x \\ge 0, y \\ge 0 \\end{cases} $$</div></div>"
        },
        {
          "question": "<p>2) Exprimer le bénéfice B en fonction de <span class='math'>\\( x \\)</span> et <span class='math'>\\( y \\)</span>.</p>",
          "reponse": "<p><span class='math'>\\( B = 3000x + 2000y \\)</span> (en FCFA).</p>"
        },
        {
          "question": "<p>3) Déterminer la production qui maximise le bénéfice.</p>",
          "reponse": "<p>Les sommets du polygone des contraintes sont : (0,0), (40,0), (0,40), et l'intersection des droites <span class='math'>\\( 2x+y=80 \\)</span> et <span class='math'>\\( x+3y=120 \\)</span>.<br>Résolution : <span class='math'>\\( x=24, y=32 \\)</span>.<br>Bénéfices :<br>(40,0) : 120 000 FCFA<br>(0,40) : 80 000 FCFA<br>(24,32) : 3000×24 + 2000×32 = 72 000 + 64 000 = 136 000 FCFA.<br>Le bénéfice maximal est de 136 000 FCFA pour 24 unités de P et 32 unités de Q.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Équation et inéquation irrationnelle",
      "points": "3 pts",
      "enonce": "<div style='background-color: #f0fff0; padding: 15px; border-radius: 8px; color: #1b5e20;'><p>Résoudre dans <span class='math'>\\( \\mathbb{R} \\)</span> l'inéquation suivante :</p><div class='math-block'><div class='math'>$$ \\sqrt{2x + 3} \\le x + 1 $$</div></div></div>",
      "questions": [
        {
          "question": "<p>1) Déterminer l'ensemble de définition de l'inéquation.</p>",
          "reponse": "<p>Il faut <span class='math'>\\( 2x + 3 \\ge 0 \\)</span> donc <span class='math'>\\( x \\ge -\\frac{3}{2} \\)</span>.<br>Et <span class='math'>\\( x + 1 \\ge 0 \\)</span> donc <span class='math'>\\( x \\ge -1 \\)</span>.<br>L'ensemble de définition est <span class='math'>\\( D = [-1, +\\infty[ \\)</span>.</p>"
        },
        {
          "question": "<p>2) Résoudre l'inéquation.</p>",
          "reponse": "<p>Sur <span class='math'>\\( [-1, +\\infty[ \\)</span>, les deux membres sont positifs. On peut élever au carré :<br><span class='math'>\\( 2x + 3 \\le (x+1)^2 \\)</span><br><span class='math'>\\( 2x + 3 \\le x^2 + 2x + 1 \\)</span><br><span class='math'>\\( 0 \\le x^2 - 2 \\)</span><br><span class='math'>\\( x^2 \\ge 2 \\)</span><br><span class='math'>\\( x \\le -\\sqrt{2} \\)</span> ou <span class='math'>\\( x \\ge \\sqrt{2} \\)</span>.<br>En intersection avec <span class='math'>\\( D = [-1, +\\infty[ \\)</span>, on obtient : <span class='math'>\\( S = [\\sqrt{2}, +\\infty[ \\)</span>.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Nombres complexes",
      "points": "4 pts",
      "enonce": "<div style='background-color: #fff5f5; padding: 15px; border-radius: 8px; color: #880e4f;'><p>On considère le nombre complexe <span class='math'>\\( z = \\sqrt{3} + i \\)</span>.</p></div>",
      "questions": [
        {
          "question": "<p>1) Calculer le module et un argument de <span class='math'>\\( z \\)</span>.</p>",
          "reponse": "<p><span class='math'>\\( |z| = \\sqrt{(\\sqrt{3})^2 + 1^2} = \\sqrt{3+1} = 2 \\)</span><br><span class='math'>\\( \\cos\\theta = \\frac{\\sqrt{3}}{2} \\)</span>, <span class='math'>\\( \\sin\\theta = \\frac{1}{2} \\)</span> donc <span class='math'>\\( \\theta = \\frac{\\pi}{6} \\)</span>.</p>"
        },
        {
          "question": "<p>2) Donner la forme trigonométrique de <span class='math'>\\( z \\)</span>.</p>",
          "reponse": "<div class='math-block'><div class='math'>$$ z = 2\\left(\\cos\\frac{\\pi}{6} + i\\sin\\frac{\\pi}{6}\\right) $$</div></div>"
        },
        {
          "question": "<p>3) Calculer <span class='math'>\\( z^6 \\)</span> en utilisant la forme trigonométrique.</p>",
          "reponse": "<p>D'après la formule de Moivre :</p><div class='math-block'><div class='math'>$$ z^6 = 2^6\\left(\\cos\\pi + i\\sin\\pi\\right) = 64(-1 + 0i) = -64 $$</div></div>"
        }
      ]
    },
    {
      "titre": "Exercice 5 : Géométrie métrique et produit scalaire",
      "points": "5 pts",
      "enonce": "<div style='background-color: #fef9e7; padding: 15px; border-radius: 8px; color: #7d6608;'><p>Dans un repère orthonormé, on donne les points A(2, -1), B(4, 3) et C(0, 1).</p></div>",
      "questions": [
        {
          "question": "<p>1) Calculer les coordonnées des vecteurs <span class='math'>\\( \\overrightarrow{AB} \\)</span> et <span class='math'>\\( \\overrightarrow{AC} \\)</span>.</p>",
          "reponse": "<p><span class='math'>\\( \\overrightarrow{AB} = (4-2, 3-(-1)) = (2, 4) \\)</span><br><span class='math'>\\( \\overrightarrow{AC} = (0-2, 1-(-1)) = (-2, 2) \\)</span></p>"
        },
        {
          "question": "<p>2) Montrer que les vecteurs <span class='math'>\\( \\overrightarrow{AB} \\)</span> et <span class='math'>\\( \\overrightarrow{AC} \\)</span> sont orthogonaux.</p>",
          "reponse": "<p><span class='math'>\\( \\overrightarrow{AB} \\cdot \\overrightarrow{AC} = 2 \\times (-2) + 4 \\times 2 = -4 + 8 = 4 \\)</span><br>Ces vecteurs ne sont pas orthogonaux.</p>",
          "note": "Les vecteurs ne sont pas orthogonaux car leur produit scalaire est 4."
        },
        {
          "question": "<p>3) Déterminer une équation de la droite passant par A et perpendiculaire à (BC).</p>",
          "reponse": "<p><span class='math'>\\( \\overrightarrow{BC} = (0-4, 1-3) = (-4, -2) \\)</span><br>Un vecteur normal à la droite recherchée est <span class='math'>\\( \\overrightarrow{BC} \\)</span>.<br>L'équation de la droite est de la forme : <span class='math'>\\( -4(x-2) - 2(y+1) = 0 \\)</span><br><span class='math'>\\( -4x + 8 - 2y - 2 = 0 \\)</span><br><span class='math'>\\( -4x - 2y + 6 = 0 \\)</span><br><span class='math'>\\( 2x + y - 3 = 0 \\)</span></p>"
        },
        {
          "question": "<p>4) Déterminer l'équation du cercle de centre A et passant par B.</p>",
          "reponse": "<p>Le rayon est <span class='math'>\\( R = AB = \\sqrt{(4-2)^2 + (3+1)^2} = \\sqrt{4+16} = \\sqrt{20} = 2\\sqrt{5} \\)</span>.<br>L'équation du cercle est : <span class='math'>\\( (x-2)^2 + (y+1)^2 = 20 \\)</span>.</p>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
