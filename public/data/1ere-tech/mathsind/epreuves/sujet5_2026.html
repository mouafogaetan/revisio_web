<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Mathématiques Industrielles",
  "classe": "1ère Technique",
  "sequence": "Séquence 5",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Étude de Fonction (Gestion de Production)",
      "points": "6 pts",
      "enonce": "<p>Le coût total de production (en milliers de FCFA) d'une entreprise est modélisé par la fonction <span style='color: #c0392b;'>C(x) = 2x^3 - 21x^2 + 60x + 50</span>, où <span style='color: #c0392b;'>x</span> est la quantité produite (en centaines de pièces) sur l'intervalle <span style='color: #c0392b;'>[0; 10]</span>.</p><p>La recette (en milliers de FCFA) est donnée par <span style='color: #c0392b;'>R(x) = 63x</span>.</p>",
      "questions": [
        {
          "question": "1) Calculer la fonction coût marginal <span style='color: #c0392b;'>C'(x)</span>.",
          "reponse": "<p><span style='color: #c0392b;'>C'(x) = 6x^2 - 42x + 60</span></p><p><strong>Méthode :</strong> On utilise la règle de dérivation des polynômes.</p>"
        },
        {
          "question": "2) Résoudre l'équation <span style='color: #c0392b;'>C'(x) = 0</span> et en déduire les extremums locaux de la fonction coût.",
          "reponse": "<p><span style='color: #c0392b;'>C'(x) = 6(x² - 7x + 10) = 6(x - 2)(x - 5)</span></p><p>Les solutions sont <span style='color: #c0392b;'>x = 2</span> et <span style='color: #c0392b;'>x = 5</span>.</p><p><span style='color: #c0392b;'>C(2) = 16 - 84 + 120 + 50 = 102</span> milliers de FCFA (maximum local).</p><p><span style='color: #c0392b;'>C(5) = 250 - 525 + 300 + 50 = 75</span> milliers de FCFA (minimum local).</p>"
        },
        {
          "question": "3) Déterminer le bénéfice <span style='color: #c0392b;'>B(x) = R(x) - C(x)</span> et en déduire la quantité à produire pour maximiser le bénéfice.",
          "reponse": "<p><span style='color: #c0392b;'>B(x) = 63x - (2x³ - 21x² + 60x + 50) = -2x³ + 21x² + 3x - 50</span></p><p>On calcule <span style='color: #c0392b;'>B'(x) = -6x² + 42x + 3</span>.</p><p>En résolvant <span style='color: #c0392b;'>B'(x) = 0</span>, on trouve <span style='color: #c0392b;'>x \\approx 7,07</span> (l'autre racine est négative).</p><p>La quantité à produire pour maximiser le bénéfice est d'environ <strong>707 pièces</strong>.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Nombres Complexes en Électronique",
      "points": "5 pts",
      "enonce": "<p>Dans un circuit électrique, l'impédance <span style='color: #c0392b;'>Z</span> est donnée par <span style='color: #c0392b;'>Z = 6 + 8j</span> et la tension <span style='color: #c0392b;'>U = 10 + 5j</span>.</p><p>L'intensité du courant est donnée par <span style='color: #c0392b;'>I = \\dfrac{U}{Z}</span>.</p>",
      "questions": [
        {
          "question": "1) Calculer le module et l'argument de l'impédance <span style='color: #c0392b;'>Z</span>.",
          "reponse": "<p><span style='color: #c0392b;'>|Z| = \\sqrt{6² + 8²} = \\sqrt{36 + 64} = 10</span></p><p><span style='color: #c0392b;'>\\arg(Z) = \\arctan\\left(\\dfrac{8}{6}\\right) \\approx 53,13°</span></p>"
        },
        {
          "question": "2) Déterminer l'intensité <span style='color: #c0392b;'>I</span> sous forme algébrique.",
          "reponse": "<p><span style='color: #c0392b;'>I = \\dfrac{10 + 5j}{6 + 8j} = \\dfrac{(10 + 5j)(6 - 8j)}{6² + 8²} = \\dfrac{60 - 80j + 30j - 40j²}{100} = \\dfrac{60 - 50j + 40}{100} = \\dfrac{100 - 50j}{100} = 1 - 0,5j</span></p>"
        },
        {
          "question": "3) Déterminer le module de l'intensité.",
          "reponse": "<p><span style='color: #c0392b;'>|I| = \\sqrt{1² + (-0,5)²} = \\sqrt{1 + 0,25} = \\sqrt{1,25} \\approx 1,12</span> A</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Barycentre et Produit Scalaire (Géométrie Plane)",
      "points": "4 pts",
      "enonce": "<p>Dans un repère orthonormé <span style='color: #c0392b;'>(O; \\vec{i}, \\vec{j})</span>, on considère les points <span style='color: #c0392b;'>A(2; 3)</span>, <span style='color: #c0392b;'>B(4; -1)</span> et <span style='color: #c0392b;'>C(-2; 5)</span>.</p>",
      "questions": [
        {
          "question": "1) Déterminer les coordonnées du barycentre <span style='color: #c0392b;'>G</span> des points pondérés (A, 2), (B, 1), (C, 1).",
          "reponse": "<p><span style='color: #c0392b;'>G\\left(\\dfrac{2(2) + 1(4) + 1(-2)}{2+1+1}; \\dfrac{2(3) + 1(-1) + 1(5)}{4}\\right) = G\\left(\\dfrac{4+4-2}{4}; \\dfrac{6-1+5}{4}\\right) = G\\left(\\dfrac{6}{4}; \\dfrac{10}{4}\\right) = G\\left(\\dfrac{3}{2}; \\dfrac{5}{2}\\right)</span></p>"
        },
        {
          "question": "2) Calculer le produit scalaire <span style='color: #c0392b;'>\\vec{AB} \\cdot \\vec{AC}</span>.",
          "reponse": "<p><span style='color: #c0392b;'>\\vec{AB} = B - A = (4-2; -1-3) = (2; -4)</span></p><p><span style='color: #c0392b;'>\\vec{AC} = C - A = (-2-2; 5-3) = (-4; 2)</span></p><p><span style='color: #c0392b;'>\\vec{AB} \\cdot \\vec{AC} = 2(-4) + (-4)(2) = -8 - 8 = -16</span></p>"
        },
        {
          "question": "3) En déduire la mesure de l'angle <span style='color: #c0392b;'>\\widehat{BAC}</span> (en degrés).",
          "reponse": "<p><span style='color: #c0392b;'>\\vec{AB} \\cdot \\vec{AC} = ||\\vec{AB}|| \\times ||\\vec{AC}|| \\times \\cos(\\widehat{BAC})</span></p><p><span style='color: #c0392b;'>||\\vec{AB}|| = \\sqrt{2² + (-4)²} = \\sqrt{20} = 2\\sqrt{5}</span></p><p><span style='color: #c0392b;'>||\\vec{AC}|| = \\sqrt{(-4)² + 2²} = \\sqrt{20} = 2\\sqrt{5}</span></p><p><span style='color: #c0392b;'>\\cos(\\widehat{BAC}) = \\dfrac{-16}{20} = -0,8</span></p><p><span style='color: #c0392b;'>\\widehat{BAC} = \\arccos(-0,8) \\approx 143,13°</span></p>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Statistiques (Contrôle de Qualité)",
      "points": "5 pts",
      "enonce": "<p>Les mesures (en millimètres) de 20 pièces produites par une machine sont les suivantes :</p><div style='background: #f8f9fa; padding: 15px; border-radius: 8px; margin: 15px 0; text-align: center;'><p style='font-family: monospace; font-size: 1.1em;'>12,1 - 12,3 - 11,9 - 12,4 - 12,2 - 12,0 - 12,3 - 12,1 - 12,5 - 12,2</p><p style='font-family: monospace; font-size: 1.1em;'>12,0 - 12,3 - 12,1 - 12,4 - 12,2 - 12,1 - 12,3 - 12,0 - 12,4 - 12,2</p></div>",
      "questions": [
        {
          "question": "1) Calculer la moyenne de cette série statistique.",
          "reponse": "<p>La moyenne est la somme des valeurs divisée par l'effectif.</p><p><span style='color: #c0392b;'>\\bar{x} = \\dfrac{12,1 + 12,3 + ... + 12,2}{20}</span></p><p>En additionnant toutes les valeurs : <span style='color: #c0392b;'>\\bar{x} = \\dfrac{244,0}{20} = 12,2</span> mm.</p>"
        },
        {
          "question": "2) Déterminer la médiane de la série.",
          "reponse": "<p>On ordonne la série par ordre croissant :</p><p>11,9 - 12,0 - 12,0 - 12,0 - 12,1 - 12,1 - 12,1 - 12,1 - 12,2 - 12,2</p><p>12,2 - 12,2 - 12,2 - 12,3 - 12,3 - 12,3 - 12,3 - 12,4 - 12,4 - 12,5</p><p>La médiane est la moyenne de la 10ème et 11ème valeur : <span style='color: #c0392b;'>Me = \\dfrac{12,2 + 12,2}{2} = 12,2</span> mm.</p>"
        },
        {
          "question": "3) Calculer l'écart-type de cette série (arrondir à 10⁻³).",
          "reponse": "<p><span style='color: #c0392b;'>\\sigma = \\sqrt{\\dfrac{1}{20}\\sum_{i=1}^{20}(x_i - 12,2)^2}</span></p><p>Les écarts à la moyenne : -0,3 ; -0,2 ; -0,2 ; -0,2 ; -0,1 ; -0,1 ; -0,1 ; -0,1 ; 0 ; 0 ; 0 ; 0 ; 0 ; 0,1 ; 0,1 ; 0,1 ; 0,1 ; 0,2 ; 0,2 ; 0,3</p><p>La variance est : <span style='color: #c0392b;'>V = \\dfrac{0,09 + 3(0,04) + 4(0,01) + 4(0,01) + 2(0,04) + 0,09}{20} = \\dfrac{0,09 + 0,12 + 0,04 + 0,04 + 0,08 + 0,09}{20} = \\dfrac{0,46}{20} = 0,023</span></p><p><span style='color: #c0392b;'>\\sigma = \\sqrt{0,023} \\approx 0,152</span> mm.</p>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
