<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Maths Industriel",
  "classe": "1ère technique",
  "sequence": "Séquence 4",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Géométrie métrique et produit scalaire",
      "points": "4 pts",
      "enonce": "<div style='background-color: #f0f8ff; padding: 15px; border-radius: 8px; color: #0d47a1;'><p>Dans un repère orthonormé du plan, on considère les points A(1, 2), B(3, 0) et C(4, 3).</p></div>",
      "questions": [
        {
          "question": "<p>1) Calculer les distances AB, AC et BC.</p>",
          "reponse": "<p><span class='math'>\\( AB = \\sqrt{(3-1)^2 + (0-2)^2} = \\sqrt{4+4} = 2\\sqrt{2} \\)</span><br><span class='math'>\\( AC = \\sqrt{(4-1)^2 + (3-2)^2} = \\sqrt{9+1} = \\sqrt{10} \\)</span><br><span class='math'>\\( BC = \\sqrt{(4-3)^2 + (3-0)^2} = \\sqrt{1+9} = \\sqrt{10} \\)</span></p>"
        },
        {
          "question": "<p>2) Démontrer que le triangle ABC est isocèle rectangle en C.</p>",
          "reponse": "<p>On a <span class='math'>\\( AC = BC = \\sqrt{10} \\)</span>, donc le triangle est isocèle en C.<br>De plus, <span class='math'>\\( AC^2 + BC^2 = 10 + 10 = 20 = AB^2 \\)</span>.<br>D'après la réciproque du théorème de Pythagore, le triangle est rectangle en C.</p>"
        },
        {
          "question": "<p>3) Déterminer l'équation du cercle circonscrit au triangle ABC.</p>",
          "reponse": "<p>Le centre du cercle circonscrit est le milieu de l'hypoténuse [AB].<br><span class='math'>\\( \\Omega \\left( \\frac{1+3}{2}, \\frac{2+0}{2} \\right) = \\Omega(2, 1) \\)</span>.<br>Le rayon est <span class='math'>\\( R = \\frac{AB}{2} = \\sqrt{2} \\)</span>.<br>L'équation du cercle est : <span class='math'>\\( (x-2)^2 + (y-1)^2 = 2 \\)</span>.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Barycentre et applications",
      "points": "4 pts",
      "enonce": "<div style='background-color: #f5f5dc; padding: 15px; border-radius: 8px; color: #4e342e;'><p>On considère un triangle ABC. Soit G le barycentre du système de points pondérés (A, 2), (B, 3) et (C, 1).</p></div>",
      "questions": [
        {
          "question": "<p>1) Exprimer le vecteur <span class='math'>\\( \\overrightarrow{AG} \\)</span> en fonction des vecteurs <span class='math'>\\( \\overrightarrow{AB} \\)</span> et <span class='math'>\\( \\overrightarrow{AC} \\)</span>.</p>",
          "reponse": "<p>D'après la définition du barycentre :</p><div class='math-block'><div class='math'>$$ 2\\overrightarrow{GA} + 3\\overrightarrow{GB} + \\overrightarrow{GC} = \\vec{0} $$</div></div><p>En utilisant la relation de Chasles :</p><div class='math-block'><div class='math'>$$ 2\\overrightarrow{GA} + 3(\\overrightarrow{GA} + \\overrightarrow{AB}) + (\\overrightarrow{GA} + \\overrightarrow{AC}) = \\vec{0} $$</div></div><div class='math-block'><div class='math'>$$ 6\\overrightarrow{GA} + 3\\overrightarrow{AB} + \\overrightarrow{AC} = \\vec{0} $$</div></div><div class='math-block'><div class='math'>$$ \\overrightarrow{AG} = \\frac{3\\overrightarrow{AB} + \\overrightarrow{AC}}{6} $$</div></div>"
        },
        {
          "question": "<p>2) On donne A(0, 0), B(3, 0) et C(0, 4). Calculer les coordonnées de G.</p>",
          "reponse": "<div class='math-block'><div class='math'>$$ x_G = \\frac{2 \\times 0 + 3 \\times 3 + 1 \\times 0}{2+3+1} = \\frac{9}{6} = \\frac{3}{2} $$</div></div><div class='math-block'><div class='math'>$$ y_G = \\frac{2 \\times 0 + 3 \\times 0 + 1 \\times 4}{6} = \\frac{4}{6} = \\frac{2}{3} $$</div></div><p>Donc <span class='math'>\\( G\\left(\\frac{3}{2}, \\frac{2}{3}\\right) \\)</span>.</p>"
        },
        {
          "question": "<p>3) Montrer que G, le milieu de [BC] et A sont alignés.</p>",
          "reponse": "<p>Soit I le milieu de [BC]. <span class='math'>\\( I\\left(\\frac{3}{2}, 2\\right) \\)</span>.<br>On a <span class='math'>\\( \\overrightarrow{AG} = \\left(\\frac{3}{2}, \\frac{2}{3}\\right) \\)</span> et <span class='math'>\\( \\overrightarrow{AI} = \\left(\\frac{3}{2}, 2\\right) \\)</span>.<br><span class='math'>\\( \\overrightarrow{AG} = \\frac{1}{3}\\overrightarrow{AI} \\)</span>.<br>Les vecteurs sont colinéaires, donc A, G et I sont alignés.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Transformations du plan",
      "points": "4 pts",
      "enonce": "<div style='background-color: #f0fff0; padding: 15px; border-radius: 8px; color: #1b5e20;'><p>Dans le plan, on considère une homothétie H de centre O et de rapport <span class='math'>\\( k = 2 \\)</span>.</p></div>",
      "questions": [
        {
          "question": "<p>1) Déterminer l'image du point A(3, 1) par H.</p>",
          "reponse": "<p>Dans une homothétie de rapport <span class='math'>\\( k \\)</span>, les coordonnées sont multipliées par <span class='math'>\\( k \\)</span>.<br>Donc <span class='math'>\\( A'(6, 2) \\)</span>.</p>"
        },
        {
          "question": "<p>2) Déterminer l'image de la droite d'équation <span class='math'>\\( y = 2x + 1 \\)</span> par H.</p>",
          "reponse": "<p>L'image d'une droite par une homothétie de centre O est une droite qui lui est parallèle.<br>L'image de la droite <span class='math'>\\( y = 2x + 1 \\)</span> est la droite d'équation <span class='math'>\\( y = 2x + k \\times 1 \\)</span>.<br>Donc <span class='math'>\\( y = 2x + 2 \\)</span>.</p>"
        },
        {
          "question": "<p>3) Déterminer l'homothétie réciproque de H.</p>",
          "reponse": "<p>L'homothétie réciproque est l'homothétie de centre O et de rapport <span class='math'>\\( \\frac{1}{k} = \\frac{1}{2} \\)</span>.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Géométrie dans l'espace",
      "points": "4 pts",
      "enonce": "<div style='background-color: #fff5f5; padding: 15px; border-radius: 8px; color: #880e4f;'><p>On considère un cube ABCDEFGH. Soit I le milieu de [AB] et J le milieu de [CG].</p></div>",
      "questions": [
        {
          "question": "<p>1) Montrer que le plan (EIJ) est orthogonal à la droite (AB).</p>",
          "reponse": "<p>Dans le cube, les arêtes sont perpendiculaires.<br><span class='math'>\\( AB \\perp AE \\)</span> et <span class='math'>\\( AB \\perp AD \\)</span>.<br>Comme <span class='math'>\\( E \\in (EIJ) \\)</span> et <span class='math'>\\( I \\in (EIJ) \\)</span>, la droite (EI) est contenue dans le plan (EIJ).<br><span class='math'>\\( AB \\perp (EIJ) \\)</span>.</p>"
        },
        {
          "question": "<p>2) Déterminer la projection orthogonale du point D sur le plan (ABC).</p>",
          "reponse": "<p>Le plan (ABC) est la base du cube. La projection orthogonale de D sur ce plan est le point D lui-même, car D est dans le plan (ABC).</p>"
        },
        {
          "question": "<p>3) Démontrer que les plans (ABC) et (EFG) sont parallèles.</p>",
          "reponse": "<p>Les faces opposées d'un cube sont parallèles.<br>Le plan (ABC) est la face inférieure du cube et le plan (EFG) est la face supérieure.<br>Donc (ABC) // (EFG).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 5 : Statistiques",
      "points": "4 pts",
      "enonce": "<div style='background-color: #fef9e7; padding: 15px; border-radius: 8px; color: #7d6608;'><p>Une entreprise a relevé les salaires mensuels (en milliers de FCFA) de ses employés :</p><p>50, 60, 70, 70, 80, 80, 80, 90, 90, 100, 100, 110, 120, 130, 150.</p></div>",
      "questions": [
        {
          "question": "<p>1) Calculer le salaire moyen.</p>",
          "reponse": "<p><span class='math'>\\( \\bar{x} = \\frac{50+60+70+70+80+80+80+90+90+100+100+110+120+130+150}{15} \\)</span><br><span class='math'>\\( \\bar{x} = \\frac{1380}{15} = 92 \\)</span> milliers de FCFA.</p>"
        },
        {
          "question": "<p>2) Déterminer la médiane des salaires.</p>",
          "reponse": "<p>La série est ordonnée. L'effectif total est 15 (impair).<br>La médiane est la 8<sup>ème</sup> valeur : 90 milliers de FCFA.</p>"
        },
        {
          "question": "<p>3) Calculer l'écart-type de cette série (arrondi à 10<sup>-2</sup>).</p>",
          "reponse": "<p>La variance est :</p><div class='math-block'><div class='math'>$$ V = \\frac{\\sum (x_i - \\bar{x})^2}{15} $$</div></div><p><span class='math'>\\( V = \\frac{(-42)^2+(-32)^2+(-22)^2 \\times 2 + (-12)^2 \\times 3 + (-2)^2 \\times 2 + 8^2 \\times 2 + 18^2 + 28^2 + 38^2 + 58^2}{15} \\)</span></p><p><span class='math'>\\( V = \\frac{1764+1024+968+432+8+128+324+784+1444+3364}{15} = \\frac{10240}{15} \\approx 682.67 \\)</span></p><p>L'écart-type est <span class='math'>\\( \\sigma = \\sqrt{682.67} \\approx 26.13 \\)</span> milliers de FCFA.</p>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
