<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Mathématiques Industrielles",
  "classe": "1ère technique",
  "sequence": "Séquence 2",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Fonctions polynômes du second degré",
      "points": "4 pts",
      "enonce": "<p>On considère la fonction polynôme du second degré définie par :</p><div class='math-block'><div class='math'>$$ f(x) = 2x^2 - 8x + 5 $$</div></div><p>1. Déterminer la forme canonique de \\( f(x) \\).</p><p>2. Résoudre l'équation \\( f(x) = 0 \\).</p><p>3. Déterminer le signe de \\( f(x) \\) sur \\( \\mathbb{R} \\).</p><p>4. En déduire l'ensemble des solutions de l'inéquation \\( 2x^2 - 8x + 5 \\leq 0 \\).</p>",
      "questions": [
        {
          "question": "1) Déterminer la forme canonique de \\( f(x) = 2x^2 - 8x + 5 \\).",
          "reponse": "<p>On met \\( 2 \\) en facteur :</p><div class='math-block'><div class='math'>$$ f(x) = 2\\left(x^2 - 4x\\right) + 5 $$</div></div><p>On complète le carré :</p><div class='math-block'><div class='math'>$$ f(x) = 2\\left[(x - 2)^2 - 4\\right] + 5 = 2(x - 2)^2 - 8 + 5 = 2(x - 2)^2 - 3 $$</div></div><p>La forme canonique est : \\( f(x) = 2(x - 2)^2 - 3 \\).</p>"
        },
        {
          "question": "2) Résoudre l'équation \\( f(x) = 0 \\).",
          "reponse": "<p>On utilise la forme canonique : \\( 2(x - 2)^2 - 3 = 0 \\)</p><div class='math-block'><div class='math'>$$ 2(x - 2)^2 = 3 \\Rightarrow (x - 2)^2 = \\frac{3}{2} $$</div></div><div class='math-block'><div class='math'>$$ x - 2 = \\pm \\sqrt{\\frac{3}{2}} = \\pm \\frac{\\sqrt{6}}{2} $$</div></div><p>Donc les solutions sont :</p><div class='math-block'><div class='math'>$$ x_1 = 2 - \\frac{\\sqrt{6}}{2} \\quad \\text{et} \\quad x_2 = 2 + \\frac{\\sqrt{6}}{2} $$</div></div>"
        },
        {
          "question": "3) Déterminer le signe de \\( f(x) \\) sur \\( \\mathbb{R} \\).",
          "reponse": "<p>Le coefficient de \\( x^2 \\) est \\( a = 2 > 0 \\), donc la parabole est tournée vers le haut.</p><p>Le discriminant : \\( \\Delta = (-8)^2 - 4(2)(5) = 64 - 40 = 24 > 0 \\).</p><p>Les racines sont \\( x_1 = 2 - \\frac{\\sqrt{6}}{2} \\) et \\( x_2 = 2 + \\frac{\\sqrt{6}}{2} \\).</p><p>Le tableau de signe est donc :</p><ul><li>\\( f(x) > 0 \\) sur \\( ]-\\infty, x_1[ \\cup ]x_2, +\\infty[ \\)</li><li>\\( f(x) < 0 \\) sur \\( ]x_1, x_2[ \\)</li><li>\\( f(x) = 0 \\) en \\( x_1 \\) et \\( x_2 \\)</li></ul>"
        },
        {
          "question": "4) En déduire l'ensemble des solutions de l'inéquation \\( f(x) \\leq 0 \\).",
          "reponse": "<p>D'après le signe de \\( f \\), l'inéquation \\( f(x) \\leq 0 \\) est vérifiée lorsque \\( f(x) \\) est négatif ou nul.</p><p>Donc l'ensemble des solutions est :</p><div class='math-block'><div class='math'>$$ S = \\left[2 - \\frac{\\sqrt{6}}{2}, 2 + \\frac{\\sqrt{6}}{2}\\right] $$</div></div>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Systèmes linéaires",
      "points": "4 pts",
      "enonce": "<p>Résoudre les systèmes linéaires suivants :</p><p>1. Dans \\( \\mathbb{R}^2 \\) :</p><div class='math-block'><div class='math'>$$ \\begin{cases} 3x - 2y = 7 \\\\ 5x + y = 16 \\end{cases} $$</div></div><p>2. Dans \\( \\mathbb{R}^3 \\) :</p><div class='math-block'><div class='math'>$$ \\begin{cases} x + y + z = 6 \\\\ 2x - y + 3z = 14 \\\\ x - 2y + z = 0 \\end{cases} $$</div></div>",
      "questions": [
        {
          "question": "1) Résoudre le système \\( \\begin{cases} 3x - 2y = 7 \\\\ 5x + y = 16 \\end{cases} \\).",
          "reponse": "<p>De la deuxième équation : \\( y = 16 - 5x \\).</p><p>En substituant dans la première :</p><div class='math-block'><div class='math'>$$ 3x - 2(16 - 5x) = 7 \\Rightarrow 3x - 32 + 10x = 7 \\Rightarrow 13x = 39 \\Rightarrow x = 3 $$</div></div><p>On en déduit : \\( y = 16 - 5(3) = 1 \\).</p><p>La solution est \\( (3, 1) \\).</p>"
        },
        {
          "question": "2) Résoudre le système \\( \\begin{cases} x + y + z = 6 \\\\ 2x - y + 3z = 14 \\\\ x - 2y + z = 0 \\end{cases} \\).",
          "reponse": "<p>De la première équation : \\( x = 6 - y - z \\).</p><p>Dans la deuxième :</p><div class='math-block'><div class='math'>$$ 2(6 - y - z) - y + 3z = 14 \\Rightarrow 12 - 2y - 2z - y + 3z = 14 \\Rightarrow -3y + z = 2 $$</div></div><p>Dans la troisième :</p><div class='math-block'><div class='math'>$$ (6 - y - z) - 2y + z = 0 \\Rightarrow 6 - 3y = 0 \\Rightarrow y = 2 $$</div></div><p>Avec \\( y = 2 \\), on a : \\( -3(2) + z = 2 \\Rightarrow -6 + z = 2 \\Rightarrow z = 8 \\).</p><p>Puis \\( x = 6 - 2 - 8 = -4 \\).</p><p>La solution est \\( (-4, 2, 8) \\).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Équations irrationnelles",
      "points": "3 pts",
      "enonce": "<p>Résoudre dans \\( \\mathbb{R} \\) les équations irrationnelles suivantes :</p><p>1. \\( \\sqrt{2x + 3} = 5 \\)</p><p>2. \\( \\sqrt{x - 1} = x - 3 \\)</p>",
      "questions": [
        {
          "question": "1) Résoudre \\( \\sqrt{2x + 3} = 5 \\).",
          "reponse": "<p>Domaine de définition : \\( 2x + 3 \\geq 0 \\Rightarrow x \\geq -\\frac{3}{2} \\).</p><p>L'équation est équivalente à \\( 2x + 3 = 25 \\) (car les deux membres sont positifs).</p><div class='math-block'><div class='math'>$$ 2x = 22 \\Rightarrow x = 11 $$</div></div><p>Vérification : \\( \\sqrt{2(11) + 3} = \\sqrt{25} = 5 \\) ✓</p><p>La solution est \\( x = 11 \\).</p>"
        },
        {
          "question": "2) Résoudre \\( \\sqrt{x - 1} = x - 3 \\).",
          "reponse": "<p>Domaine : \\( x - 1 \\geq 0 \\Rightarrow x \\geq 1 \\).</p><p>Pour que l'équation ait une solution, il faut aussi \\( x - 3 \\geq 0 \\Rightarrow x \\geq 3 \\).</p><p>L'équation est équivalente à :</p><div class='math-block'><div class='math'>$$ x - 1 = (x - 3)^2 \\Rightarrow x - 1 = x^2 - 6x + 9 \\Rightarrow x^2 - 7x + 10 = 0 $$</div></div><p>Le discriminant : \\( \\Delta = 49 - 40 = 9 \\).</p><div class='math-block'><div class='math'>$$ x = \\frac{7 \\pm 3}{2} = 2 \\; \\text{ou} \\; 5 $$</div></div><p>On vérifie les conditions : \\( x \\geq 3 \\), donc seule \\( x = 5 \\) est valable.</p><p>Vérification : \\( \\sqrt{5 - 1} = \\sqrt{4} = 2 = 5 - 3 \\) ✓</p><p>La solution est \\( x = 5 \\).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Nombres complexes",
      "points": "4 pts",
      "enonce": "<p>On considère le nombre complexe \\( z = 2 + 3i \\).</p><p>1. Calculer \\( z + \\bar{z} \\) et \\( z - \\bar{z} \\).</p><p>2. Calculer le module de \\( z \\).</p><p>3. Déterminer la forme trigonométrique de \\( z \\).</p><p>4. Donner l'argument principal de \\( z \\).</p>",
      "questions": [
        {
          "question": "1) Calculer \\( z + \\bar{z} \\) et \\( z - \\bar{z} \\).",
          "reponse": "<p>Le conjugué de \\( z = 2 + 3i \\) est \\( \\bar{z} = 2 - 3i \\).</p><div class='math-block'><div class='math'>$$ z + \\bar{z} = (2 + 3i) + (2 - 3i) = 4 $$</div></div><div class='math-block'><div class='math'>$$ z - \\bar{z} = (2 + 3i) - (2 - 3i) = 6i $$</div></div>"
        },
        {
          "question": "2) Calculer le module de \\( z = 2 + 3i \\).",
          "reponse": "<p>Le module de \\( z \\) est :</p><div class='math-block'><div class='math'>$$ |z| = \\sqrt{2^2 + 3^2} = \\sqrt{4 + 9} = \\sqrt{13} $$</div></div>"
        },
        {
          "question": "3) Déterminer la forme trigonométrique de \\( z = 2 + 3i \\).",
          "reponse": "<p>On a \\( |z| = \\sqrt{13} \\).</p><p>La forme trigonométrique est :</p><div class='math-block'><div class='math'>$$ z = \\sqrt{13} \\left( \\cos \\theta + i \\sin \\theta \\right) $$</div></div><p>avec \\( \\cos \\theta = \\frac{2}{\\sqrt{13}} \\) et \\( \\sin \\theta = \\frac{3}{\\sqrt{13}} \\).</p><p>Donc : \\( z = \\sqrt{13} e^{i\\theta} \\) où \\( \\theta = \\arctan\\left(\\frac{3}{2}\\right) \\).</p>"
        },
        {
          "question": "4) Donner l'argument principal de \\( z \\).",
          "reponse": "<p>L'argument principal \\( \\theta \\) de \\( z = 2 + 3i \\) vérifie :</p><div class='math-block'><div class='math'>$$ \\cos \\theta = \\frac{2}{\\sqrt{13}} > 0 \\quad \\text{et} \\quad \\sin \\theta = \\frac{3}{\\sqrt{13}} > 0 $$</div></div><p>Donc \\( \\theta \\in ]0, \\frac{\\pi}{2}[ \\).</p><p>On a : \\( \\tan \\theta = \\frac{3}{2} \\), donc \\( \\theta = \\arctan\\left(\\frac{3}{2}\\right) \\).</p><p>L'argument principal est \\( \\arg(z) = \\arctan\\left(\\frac{3}{2}\\right) \\approx 0,983 \\, rad \\).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 5 : Problème de programmation linéaire",
      "points": "5 pts",
      "enonce": "<p>Une entreprise fabrique deux produits \\( P_1 \\) et \\( P_2 \\). La fabrication d'une unité de \\( P_1 \\) nécessite 2 heures de travail et 1 heure de machine, tandis que la fabrication d'une unité de \\( P_2 \\) nécessite 1 heure de travail et 2 heures de machine.</p><p>L'entreprise dispose de 100 heures de travail et de 80 heures de machine par semaine. Le bénéfice est de 4000 FCFA par unité de \\( P_1 \\) et de 3000 FCFA par unité de \\( P_2 \\).</p><p>1. Définir les variables \\( x \\) et \\( y \\).</p><p>2. Écrire le système de contraintes.</p><p>3. Déterminer la fonction objectif à maximiser.</p><p>4. Résoudre graphiquement le problème.</p><p>5. Donner la production optimale et le bénéfice maximal.</p>",
      "questions": [
        {
          "question": "1) Définir les variables \\( x \\) et \\( y \\) du problème.",
          "reponse": "<p>Soit \\( x \\) le nombre d'unités du produit \\( P_1 \\) fabriquées par semaine.</p><p>Soit \\( y \\) le nombre d'unités du produit \\( P_2 \\) fabriquées par semaine.</p><p>Les variables sont donc \\( x \\geq 0 \\) et \\( y \\geq 0 \\).</p>"
        },
        {
          "question": "2) Écrire le système de contraintes.",
          "reponse": "<p>Contrainte de travail : \\( 2x + y \\leq 100 \\) (heures de travail)</p><p>Contrainte machine : \\( x + 2y \\leq 80 \\) (heures machine)</p><p>Contraintes de positivité : \\( x \\geq 0 \\), \\( y \\geq 0 \\)</p><p>Le système de contraintes est donc :</p><div class='math-block'><div class='math'>$$ \\begin{cases} 2x + y \\leq 100 \\\\ x + 2y \\leq 80 \\\\ x \\geq 0 \\\\ y \\geq 0 \\end{cases} $$</div></div>"
        },
        {
          "question": "3) Déterminer la fonction objectif à maximiser.",
          "reponse": "<p>Le bénéfice total est :</p><div class='math-block'><div class='math'>$$ Z = 4000x + 3000y \\; \\text{(FCFA)} $$</div></div><p>La fonction objectif à maximiser est donc \\( Z = 4000x + 3000y \\).</p>"
        },
        {
          "question": "4) Résoudre graphiquement le problème.",
          "reponse": "<p>Les droites frontières sont :</p><ul><li>\\( 2x + y = 100 \\Rightarrow y = 100 - 2x \\)</li><li>\\( x + 2y = 80 \\Rightarrow y = 40 - \\frac{x}{2} \\)</li></ul><p>Points d'intersection avec les axes :</p><ul><li>Pour \\( 2x + y = 100 \\) : (0, 100) et (50, 0)</li><li>Pour \\( x + 2y = 80 \\) : (0, 40) et (80, 0)</li></ul><p>Le point d'intersection des deux droites :</p><div class='math-block'><div class='math'>$$ \\begin{cases} 2x + y = 100 \\\\ x + 2y = 80 \\end{cases} $$</div></div><p>De la première : \\( y = 100 - 2x \\).</p><p>Dans la seconde : \\( x + 2(100 - 2x) = 80 \\Rightarrow x + 200 - 4x = 80 \\Rightarrow -3x = -120 \\Rightarrow x = 40 \\)</p><p>Alors \\( y = 100 - 80 = 20 \\).</p><p>Le point d'intersection est \\( (40, 20) \\).</p><p>Les sommets du polygone réalisable sont donc : \\( (0, 0) \\), \\( (50, 0) \\), \\( (40, 20) \\) et \\( (0, 40) \\).</p>"
        },
        {
          "question": "5) Donner la production optimale et le bénéfice maximal.",
          "reponse": "<p>On évalue \\( Z \\) en chaque sommet :</p><ul><li>\\( Z(0, 0) = 0 \\)</li><li>\\( Z(50, 0) = 4000 \\times 50 = 200000 \\)</li><li>\\( Z(40, 20) = 4000 \\times 40 + 3000 \\times 20 = 160000 + 60000 = 220000 \\)</li><li>\\( Z(0, 40) = 3000 \\times 40 = 120000 \\)</li></ul><p>Le bénéfice maximal est \\( 220000 \\) FCFA, atteint pour \\( x = 40 \\) unités de \\( P_1 \\) et \\( y = 20 \\) unités de \\( P_2 \\).</p><p><strong>Production optimale :</strong> 40 unités de \\( P_1 \\) et 20 unités de \\( P_2 \\).</p><p><strong>Bénéfice maximal :</strong> \\( 220000 \\) FCFA.</p>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
