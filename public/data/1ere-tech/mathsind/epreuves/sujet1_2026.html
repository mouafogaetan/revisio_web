<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Maths Industriel",
  "classe": "1ère technique",
  "sequence": "Séquence 1",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Second degré et applications",
      "points": "6 pts",
      "enonce": "<div style='background-color: #f0f8ff; padding: 15px; border-radius: 8px; color: #0d47a1;'><p>Dans une entreprise de production, le coût total de fabrication de <span class='math'>\\( x \\)</span> centaines de pièces est donné par :</p><div class='math-block'><div class='math'>$$ C(x) = 2x^2 - 8x + 10 $$</div></div><p>où <span class='math'>\\( C(x) \\)</span> est en millions de FCFA.</p></div>",
      "questions": [
        {
          "question": "<p>1) Déterminer la forme canonique de <span class='math'>\\( C(x) \\)</span>.</p>",
          "reponse": "<p>La forme canonique est :</p><div class='math-block'><div class='math'>$$ C(x) = 2(x-2)^2 + 2 $$</div></div>"
        },
        {
          "question": "<p>2) Calculer le coût minimum de production.</p>",
          "reponse": "<p>Le coût minimum est atteint pour <span class='math'>\\( x = 2 \\)</span> et vaut :</p><div class='math-block'><div class='math'>$$ C_{\\min} = 2 \\text{ millions de FCFA} $$</div></div>"
        },
        {
          "question": "<p>3) Résoudre l'équation <span class='math'>\\( C(x) = 16 \\)</span> et interpréter le résultat.</p>",
          "reponse": "<p><span class='math'>\\( 2x^2 - 8x + 10 = 16 \\)</span><br><span class='math'>\\( 2x^2 - 8x - 6 = 0 \\)</span><br><span class='math'>\\( x^2 - 4x - 3 = 0 \\)</span><br>Les solutions sont : <span class='math'>\\( x = 2 - \\sqrt{7} \\)</span> (à rejeter car négative) et <span class='math'>\\( x = 2 + \\sqrt{7} \\approx 4.65 \\)</span>.<br>Il faut produire environ 465 pièces pour un coût de 16 millions de FCFA.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Systèmes linéaires",
      "points": "4 pts",
      "enonce": "<div style='background-color: #f5f5dc; padding: 15px; border-radius: 8px; color: #4e342e;'><p>Une entreprise fabrique deux types de produits A et B. Pour une semaine, elle produit un total de 120 unités. Le produit A nécessite 2 heures de main-d'œuvre par unité et le produit B nécessite 3 heures. Le total des heures de travail est de 300 heures.</p></div>",
      "questions": [
        {
          "question": "<p>1) Écrire le système d'équations modélisant cette situation.</p>",
          "reponse": "<p>Soient <span class='math'>\\( x \\)</span> le nombre d'unités de A et <span class='math'>\\( y \\)</span> le nombre d'unités de B.</p><div class='math-block'><div class='math'>$$ \\begin{cases} x + y = 120 \\\\ 2x + 3y = 300 \\end{cases} $$</div></div>"
        },
        {
          "question": "<p>2) Résoudre ce système par la méthode de substitution ou des combinaisons.</p>",
          "reponse": "<p>Par substitution : <span class='math'>\\( y = 120 - x \\)</span>.<br><span class='math'>\\( 2x + 3(120 - x) = 300 \\)</span><br><span class='math'>\\( 2x + 360 - 3x = 300 \\)</span><br><span class='math'>\\( -x = -60 \\)</span><br><span class='math'>\\( x = 60 \\)</span> et <span class='math'>\\( y = 60 \\)</span>.<br>L'entreprise produit 60 unités de A et 60 unités de B.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Équation irrationnelle",
      "points": "3 pts",
      "enonce": "<div style='background-color: #f0fff0; padding: 15px; border-radius: 8px; color: #1b5e20;'><p>Résoudre dans <span class='math'>\\( \\mathbb{R} \\)</span> l'équation suivante :</p><div class='math-block'><div class='math'>$$ \\sqrt{3x + 4} = x + 2 $$</div></div></div>",
      "questions": [
        {
          "question": "<p>1) Déterminer l'ensemble de définition de l'équation.</p>",
          "reponse": "<p>Il faut <span class='math'>\\( 3x + 4 \\ge 0 \\)</span> donc <span class='math'>\\( x \\ge -\\frac{4}{3} \\)</span>.<br>Et <span class='math'>\\( x + 2 \\ge 0 \\)</span> donc <span class='math'>\\( x \\ge -2 \\)</span>.<br>L'ensemble de définition est <span class='math'>\\( D = [-\\frac{4}{3}, +\\infty[ \\)</span>.</p>"
        },
        {
          "question": "<p>2) Résoudre l'équation.</p>",
          "reponse": "<p><span class='math'>\\( 3x + 4 = (x + 2)^2 \\)</span><br><span class='math'>\\( 3x + 4 = x^2 + 4x + 4 \\)</span><br><span class='math'>\\( x^2 + x = 0 \\)</span><br><span class='math'>\\( x(x + 1) = 0 \\)</span><br>Les solutions sont <span class='math'>\\( x = 0 \\)</span> et <span class='math'>\\( x = -1 \\)</span>.<br>Ces deux valeurs sont dans l'ensemble de définition.<br>Donc <span class='math'>\\( S = \\{-1, 0\\} \\)</span>.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Nombres complexes",
      "points": "4 pts",
      "enonce": "<div style='background-color: #fff5f5; padding: 15px; border-radius: 8px; color: #880e4f;'><p>On considère le nombre complexe <span class='math'>\\( z = 1 + i\\sqrt{3} \\)</span>.</p></div>",
      "questions": [
        {
          "question": "<p>1) Calculer le module et un argument de <span class='math'>\\( z \\)</span>.</p>",
          "reponse": "<p>Le module est :</p><div class='math-block'><div class='math'>$$ |z| = \\sqrt{1^2 + (\\sqrt{3})^2} = \\sqrt{1 + 3} = 2 $$</div></div><p>Un argument est <span class='math'>\\( \\theta = \\frac{\\pi}{3} \\)</span> car <span class='math'>\\( \\cos(\\theta) = \\frac{1}{2} \\)</span> et <span class='math'>\\( \\sin(\\theta) = \\frac{\\sqrt{3}}{2} \\)</span>.</p>"
        },
        {
          "question": "<p>2) Donner la forme trigonométrique de <span class='math'>\\( z \\)</span>.</p>",
          "reponse": "<div class='math-block'><div class='math'>$$ z = 2 \\left( \\cos\\left(\\frac{\\pi}{3}\\right) + i \\sin\\left(\\frac{\\pi}{3}\\right) \\right) $$</div></div>"
        },
        {
          "question": "<p>3) Calculer <span class='math'>\\( z^3 \\)</span> en utilisant la forme trigonométrique.</p>",
          "reponse": "<p>D'après la formule de Moivre :</p><div class='math-block'><div class='math'>$$ z^3 = 2^3 \\left( \\cos\\left(\\pi\\right) + i \\sin\\left(\\pi\\right) \\right) = 8(-1 + 0i) = -8 $$</div></div>"
        }
      ]
    },
    {
      "titre": "Exercice 5 : Statistiques",
      "points": "3 pts",
      "enonce": "<div style='background-color: #fef9e7; padding: 15px; border-radius: 8px; color: #7d6608;'><p>Les notes d'une classe de 1ère technique en Maths Industriel sont regroupées dans le tableau ci-dessous :</p><table style='width:100%; border-collapse: collapse; margin:10px 0;'><tr style='background-color: #f1c40f;'><th style='padding:8px; border:1px solid #ddd;'>Notes</th><th style='padding:8px; border:1px solid #ddd;'>[0, 4[</th><th style='padding:8px; border:1px solid #ddd;'>[4, 8[</th><th style='padding:8px; border:1px solid #ddd;'>[8, 12[</th><th style='padding:8px; border:1px solid #ddd;'>[12, 16[</th><th style='padding:8px; border:1px solid #ddd;'>[16, 20]</th></tr><tr><td style='padding:8px; border:1px solid #ddd;'>Effectifs</td><td style='padding:8px; border:1px solid #ddd;'>2</td><td style='padding:8px; border:1px solid #ddd;'>5</td><td style='padding:8px; border:1px solid #ddd;'>8</td><td style='padding:8px; border:1px solid #ddd;'>4</td><td style='padding:8px; border:1px solid #ddd;'>1</td></tr></table></div>",
      "questions": [
        {
          "question": "<p>1) Calculer la moyenne de cette série.</p>",
          "reponse": "<p>On utilise les centres des classes : 2, 6, 10, 14, 18.</p><div class='math-block'><div class='math'>$$ \\bar{x} = \\frac{2 \\times 2 + 5 \\times 6 + 8 \\times 10 + 4 \\times 14 + 1 \\times 18}{2+5+8+4+1} $$</div></div><div class='math-block'><div class='math'>$$ \\bar{x} = \\frac{4 + 30 + 80 + 56 + 18}{20} = \\frac{188}{20} = 9.4 $$</div></div>"
        },
        {
          "question": "<p>2) Déterminer la classe médiane.</p>",
          "reponse": "<p>L'effectif total est 20. La médiane est la moyenne entre la 10<sup>ème</sup> et la 11<sup>ème</sup> valeur.<br>Les effectifs cumulés sont : 2, 7, 15, 19, 20.<br>La 10<sup>ème</sup> et la 11<sup>ème</sup> valeur se trouvent dans la classe [8, 12[.<br>Donc la classe médiane est [8, 12[.</p>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
