<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Mathématiques IH/ESF",
  "classe": "1ère technique",
  "sequence": "Séquence 5",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Transformations du plan (Translation et Symétrie)",
      "points": "4 pts",
      "enonce": "<p>Dans le plan muni d'un repère orthonormé \\( (O, \\vec{i}, \\vec{j}) \\), on considère les points \\( A(1, 2) \\), \\( B(4, 3) \\) et \\( C(2, 5) \\).</p><p>1. Déterminer les coordonnées de l'image de \\( A \\) par la translation de vecteur \\( \\vec{u} = \\overrightarrow{BC} \\).</p><p>2. Déterminer les coordonnées de l'image de \\( C \\) par la symétrie orthogonale d'axe \\( (AB) \\).</p><p>3. Soit la rotation de centre \\( O \\) et d'angle \\( +90° \\). Déterminer les coordonnées de l'image de \\( B \\) par cette rotation.</p><p>4. Déterminer l'image du point \\( A \\) par l'homothétie de centre \\( O \\) et de rapport \\( k = -2 \\).</p>",
      "questions": [
        {
          "question": "1) Déterminer les coordonnées du vecteur \\( \\overrightarrow{BC} \\), puis celles de l'image de \\( A \\) par la translation de vecteur \\( \\vec{u} = \\overrightarrow{BC} \\).",
          "reponse": "<p>Le vecteur \\( \\overrightarrow{BC} \\) a pour coordonnées :</p><div class='math-block'><div class='math'>$$ \\overrightarrow{BC} = (x_C - x_B, y_C - y_B) = (2 - 4, 5 - 3) = (-2, 2) $$</div></div><p>L'image de \\( A \\) par la translation de vecteur \\( \\vec{u} = (-2, 2) \\) est \\( A' \\) telle que :</p><div class='math-block'><div class='math'>$$ A'(x_A + u_x, y_A + u_y) = (1 - 2, 2 + 2) = (-1, 4) $$</div></div><p>Donc \\( A'(-1, 4) \\).</p>"
        },
        {
          "question": "2) Déterminer les coordonnées de l'image de \\( C \\) par la symétrie orthogonale d'axe \\( (AB) \\).",
          "reponse": "<p>L'axe \\( (AB) \\) a pour équation. Le vecteur \\( \\overrightarrow{AB} = (3, 1) \\). Un vecteur normal est \\( \\vec{n} = (1, -3) \\).</p><p>L'équation de \\( (AB) \\) passant par \\( A(1,2) \\) est :</p><div class='math-block'><div class='math'>$$ 1(x - 1) - 3(y - 2) = 0 \\Rightarrow x - 1 - 3y + 6 = 0 \\Rightarrow x - 3y + 5 = 0 $$</div></div><p>Le symétrique de \\( C(2,5) \\) par rapport à \\( (AB) \\) est \\( C' \\) vérifiant :</p><div class='math-block'><div class='math'>$$ \\frac{x + 2}{2} - 3\\frac{y + 5}{2} + 5 = 0 \\Rightarrow x + 2 - 3y - 15 + 10 = 0 \\Rightarrow x - 3y - 3 = 0 $$</div></div><p>Et \\( \\overrightarrow{CC'} \\) est colinéaire à \\( \\vec{n} = (1, -3) \\).</p><p>On résout le système :</p><div class='math-block'><div class='math'>$$ \\begin{cases} x - 3y = 3 \\\\ (x - 2, y - 5) = k(1, -3) \\end{cases} $$</div></div><p>On obtient \\( x = 2 + k \\) et \\( y = 5 - 3k \\). En remplaçant dans la première équation :</p><div class='math-block'><div class='math'>$$ (2 + k) - 3(5 - 3k) = 3 \\Rightarrow 2 + k - 15 + 9k = 3 \\Rightarrow -13 + 10k = 3 \\Rightarrow 10k = 16 \\Rightarrow k = 1.6 $$</div></div><p>Donc \\( x = 2 + 1.6 = 3.6 = \\frac{18}{5} \\) et \\( y = 5 - 4.8 = 0.2 = \\frac{1}{5} \\).</p><p>Le symétrique de \\( C \\) est \\( C'\\left(\\frac{18}{5}, \\frac{1}{5}\\right) \\).</p>"
        },
        {
          "question": "3) Soit la rotation de centre \\( O \\) et d'angle \\( +90° \\). Déterminer les coordonnées de l'image de \\( B \\) par cette rotation.",
          "reponse": "<p>La rotation de centre \\( O \\) et d'angle \\( +90° \\) transforme un point \\( (x, y) \\) en \\( (-y, x) \\).</p><p>Pour \\( B(4, 3) \\) :</p><div class='math-block'><div class='math'>$$ B'(-3, 4) $$</div></div>"
        },
        {
          "question": "4) Déterminer l'image du point \\( A \\) par l'homothétie de centre \\( O \\) et de rapport \\( k = -2 \\).",
          "reponse": "<p>L'homothétie de centre \\( O \\) et de rapport \\( k \\) transforme un point \\( (x, y) \\) en \\( (kx, ky) \\).</p><p>Pour \\( A(1, 2) \\) et \\( k = -2 \\) :</p><div class='math-block'><div class='math'>$$ A''(-2, -4) $$</div></div>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Géométrie métrique - Distance et équation de cercle",
      "points": "4 pts",
      "enonce": "<p>Dans un repère orthonormé \\( (O, \\vec{i}, \\vec{j}) \\), on donne les points \\( A(-1, 2) \\), \\( B(3, -1) \\) et la droite \\( \\Delta : 2x - y + 3 = 0 \\).</p><p>1. Calculer la distance \\( AB \\).</p><p>2. Calculer la distance du point \\( A \\) à la droite \\( \\Delta \\).</p><p>3. Déterminer l'équation du cercle de centre \\( A \\) et passant par \\( B \\).</p><p>4. Le point \\( C(1, 4) \\) appartient-il à ce cercle ? Justifier.</p>",
      "questions": [
        {
          "question": "1) Calculer la distance \\( AB \\).",
          "reponse": "<p>La distance \\( AB \\) se calcule avec la formule :</p><div class='math-block'><div class='math'>$$ AB = \\sqrt{(x_B - x_A)^2 + (y_B - y_A)^2} $$</div></div><div class='math-block'><div class='math'>$$ AB = \\sqrt{(3 - (-1))^2 + (-1 - 2)^2} = \\sqrt{4^2 + (-3)^2} = \\sqrt{16 + 9} = \\sqrt{25} = 5 $$</div></div><p>Donc \\( AB = 5 \\) unités de longueur.</p>"
        },
        {
          "question": "2) Calculer la distance du point \\( A \\) à la droite \\( \\Delta : 2x - y + 3 = 0 \\).",
          "reponse": "<p>La distance d'un point \\( (x_0, y_0) \\) à une droite \\( ax + by + c = 0 \\) est :</p><div class='math-block'><div class='math'>$$ d = \\frac{|ax_0 + by_0 + c|}{\\sqrt{a^2 + b^2}} $$</div></div><p>Pour \\( A(-1, 2) \\) et \\( \\Delta : 2x - y + 3 = 0 \\) :</p><div class='math-block'><div class='math'>$$ d = \\frac{|2(-1) - 2 + 3|}{\\sqrt{2^2 + (-1)^2}} = \\frac{|-2 - 2 + 3|}{\\sqrt{4 + 1}} = \\frac{|-1|}{\\sqrt{5}} = \\frac{1}{\\sqrt{5}} = \\frac{\\sqrt{5}}{5} $$</div></div><p>Donc la distance de \\( A \\) à \\( \\Delta \\) est \\( \\frac{\\sqrt{5}}{5} \\) unités de longueur.</p>"
        },
        {
          "question": "3) Déterminer l'équation du cercle de centre \\( A \\) et passant par \\( B \\).",
          "reponse": "<p>Le cercle de centre \\( A(-1, 2) \\) et passant par \\( B(3, -1) \\) a pour rayon \\( R = AB = 5 \\).</p><p>L'équation du cercle est :</p><div class='math-block'><div class='math'>$$ (x - x_A)^2 + (y - y_A)^2 = R^2 $$</div></div><div class='math-block'><div class='math'>$$ (x + 1)^2 + (y - 2)^2 = 25 $$</div></div><p>Ou en forme développée :</p><div class='math-block'><div class='math'>$$ x^2 + y^2 + 2x - 4y - 20 = 0 $$</div></div>"
        },
        {
          "question": "4) Le point \\( C(1, 4) \\) appartient-il à ce cercle ? Justifier.",
          "reponse": "<p>On vérifie si \\( C(1, 4) \\) satisfait l'équation du cercle :</p><div class='math-block'><div class='math'>$$ (1 + 1)^2 + (4 - 2)^2 = 2^2 + 2^2 = 4 + 4 = 8 \\neq 25 $$</div></div><p>Comme \\( 8 \\neq 25 \\), le point \\( C \\) n'appartient pas au cercle. Il est à l'intérieur car \\( 8 < 25 \\).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Tangente à un cercle",
      "points": "4 pts",
      "enonce": "<p>Dans un repère orthonormé \\( (O, \\vec{i}, \\vec{j}) \\), on considère le cercle \\( \\mathcal{C} \\) d'équation :</p><div class='math-block'><div class='math'>$$ x^2 + y^2 - 6x - 4y + 9 = 0 $$</div></div><p>1. Déterminer le centre et le rayon du cercle \\( \\mathcal{C} \\).</p><p>2. Le point \\( A(3, 2) \\) appartient-il à ce cercle ? Justifier.</p><p>3. Donner l'équation de la tangente au cercle au point \\( A(3, 2) \\).</p><p>4. Déterminer les équations des tangentes au cercle passant par le point \\( B(6, 3) \\).</p>",
      "questions": [
        {
          "question": "1) Déterminer le centre et le rayon du cercle \\( \\mathcal{C} : x^2 + y^2 - 6x - 4y + 9 = 0 \\).",
          "reponse": "<p>On complète les carrés :</p><div class='math-block'><div class='math'>$$ (x^2 - 6x) + (y^2 - 4y) + 9 = 0 $$</div></div><div class='math-block'><div class='math'>$$ (x - 3)^2 - 9 + (y - 2)^2 - 4 + 9 = 0 $$</div></div><div class='math-block'><div class='math'>$$ (x - 3)^2 + (y - 2)^2 = 4 $$</div></div><p>Donc le centre est \\( \\Omega(3, 2) \\) et le rayon est \\( R = \\sqrt{4} = 2 \\).</p>"
        },
        {
          "question": "2) Le point \\( A(3, 2) \\) appartient-il à ce cercle ? Justifier.",
          "reponse": "<p>On vérifie si \\( A(3, 2) \\) satisfait l'équation du cercle :</p><div class='math-block'><div class='math'>$$ (3 - 3)^2 + (2 - 2)^2 = 0^2 + 0^2 = 0 $$</div></div><p>Or \\( R^2 = 4 \\), donc \\( 0 \\neq 4 \\). Le point \\( A \\) n'appartient pas au cercle, il est à l'intérieur car \\( 0 < 4 \\).</p><p><strong>Erreur dans l'énoncé ?</strong> Vérifions : l'équation du cercle nous donne \\( \\Omega(3, 2) \\) et \\( R = 2 \\). Le point \\( A \\) est en fait le centre du cercle. Donc \\( A = \\Omega \\), le point \\( A \\) est le centre, il n'appartient pas au cercle.</p>"
        },
        {
          "question": "3) Donner l'équation de la tangente au cercle au point \\( A(3, 2) \\).",
          "reponse": "<p>La tangente en un point du cercle n'existe que si le point est sur le cercle. Or \\( A \\) est le centre, donc il n'y a pas de tangente en \\( A \\).</p><p>L'énoncé devrait préciser un point sur le cercle. Par exemple, le point \\( P(5, 2) \\) est sur le cercle car \\( (5-3)^2 + (2-2)^2 = 4 \\).</p><p>Si on prend \\( P(5, 2) \\), l'équation de la tangente en \\( P \\) est :</p><div class='math-block'><div class='math'>$$ (x_P - x_\\Omega)(x - x_P) + (y_P - y_\\Omega)(y - y_P) = 0 $$</div></div><div class='math-block'><div class='math'>$$ (5 - 3)(x - 5) + (2 - 2)(y - 2) = 0 \\Rightarrow 2(x - 5) = 0 \\Rightarrow x = 5 $$</div></div>"
        },
        {

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
