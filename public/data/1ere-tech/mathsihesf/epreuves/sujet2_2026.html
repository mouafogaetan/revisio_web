<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Mathématiques IH/ESF",
  "classe": "1ère Technique",
  "sequence": "Séquence 2",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Équations et inéquations du second degré",
      "points": "3 pts",
      "enonce": "<p style='font-size: 1rem; color: #2d3436;'>Cet exercice porte sur la résolution d'équations et d'inéquations du second degré.</p>",
      "questions": [
        {
          "question": "<p><strong>1. (1 pt)</strong> Résoudre dans \\( \\mathbb{R} \\) l'équation \\( 3x^2 - 5x + 2 = 0 \\).</p>",
          "reponse": "<p>\\( a = 3 \\), \\( b = -5 \\), \\( c = 2 \\).<br>\\( \\Delta = b^2 - 4ac = (-5)^2 - 4(3)(2) = 25 - 24 = 1 \\).<br>\\( \\sqrt{\\Delta} = 1 \\).<br>Les racines sont :<br>\\( x_1 = \\frac{5 - 1}{6} = \\frac{4}{6} = \\frac{2}{3} \\)<br>\\( x_2 = \\frac{5 + 1}{6} = 1 \\).<br>\\( S = \\left\\{ \\frac{2}{3} ; 1 \\right\\} \\).</p>"
        },
        {
          "question": "<p><strong>2. (1 pt)</strong> Résoudre dans \\( \\mathbb{R} \\) l'inéquation \\( -2x^2 + 5x + 3 \\geq 0 \\).</p>",
          "reponse": "<p>Les racines de \\( -2x^2 + 5x + 3 = 0 \\) :<br>\\( \\Delta = 25 - 4(-2)(3) = 25 + 24 = 49 \\).<br>\\( x_1 = \\frac{-5 - 7}{-4} = 3 \\)<br>\\( x_2 = \\frac{-5 + 7}{-4} = -\\frac{1}{2} \\).<br>Comme \\( a = -2 < 0 \\), le polynôme est positif entre les racines.<br>\\( S = \\left[ -\\frac{1}{2} ; 3 \\right] \\).</p>"
        },
        {
          "question": "<p><strong>3. (1 pt)</strong> Trouver deux nombres dont la somme est 10 et le produit est 21.</p>",
          "reponse": "<p>Soit \\( x \\) et \\( y \\) les deux nombres.<br>\\( x + y = 10 \\) et \\( xy = 21 \\).<br>\\( x \\) et \\( y \\) sont les racines de \\( t^2 - 10t + 21 = 0 \\).<br>\\( \\Delta = 100 - 84 = 16 \\).<br>\\( t_1 = \\frac{10 - 4}{2} = 3 \\) et \\( t_2 = \\frac{10 + 4}{2} = 7 \\).<br>Les deux nombres sont 3 et 7.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Systèmes linéaires et programmation linéaire",
      "points": "3 pts",
      "enonce": "<p style='font-size: 1rem; color: #2d3436;'>Cet exercice porte sur la résolution de systèmes linéaires et la programmation linéaire.</p>",
      "questions": [
        {
          "question": "<p><strong>1. (1 pt)</strong> Résoudre le système linéaire suivant dans \\( \\mathbb{R}^2 \\) :<br>\\( \\begin{cases} 2x + y = 5 \\\\ 3x - 2y = 4 \\end{cases} \\)</p>",
          "reponse": "<p>Méthode par substitution ou combinaison.<br>De la première équation, \\( y = 5 - 2x \\).<br>On remplace dans la seconde : \\( 3x - 2(5 - 2x) = 4 \\)<br>\\( 3x - 10 + 4x = 4 \\)<br>\\( 7x = 14 \\)<br>\\( x = 2 \\)<br>\\( y = 5 - 2(2) = 1 \\).<br>\\( S = \\{(2, 1)\\} \\).</p>"
        },
        {
          "question": "<p><strong>2. (1 pt)</strong> Résoudre le système linéaire suivant dans \\( \\mathbb{R}^3 \\) :<br>\\( \\begin{cases} x + y + z = 6 \\\\ 2x - y + z = 3 \\\\ x + 2y - z = 2 \\end{cases} \\)</p>",
          "reponse": "<p>Par combinaison :<br>L1 + L2 : \\( 3x + 2z = 9 \\) (E4)<br>L2 + L3 : \\( 3x + y = 5 \\) (E5)<br>De E5, \\( y = 5 - 3x \\).<br>De E4, \\( 2z = 9 - 3x \\), donc \\( z = \\frac{9 - 3x}{2} \\).<br>Dans L1 : \\( x + (5 - 3x) + \\frac{9 - 3x}{2} = 6 \\)<br>\\( 5 - 2x + \\frac{9 - 3x}{2} = 6 \\)<br>\\( 10 - 4x + 9 - 3x = 12 \\)<br>\\( -7x + 19 = 12 \\)<br>\\( -7x = -7 \\)<br>\\( x = 1 \\)<br>\\( y = 5 - 3 = 2 \\)<br>\\( z = \\frac{9 - 3}{2} = 3 \\).<br>\\( S = \\{(1, 2, 3)\\} \\).</p>"
        },
        {
          "question": "<p><strong>3. (1 pt)</strong> Une entreprise fabrique deux produits A et B. Elle dispose de 40 heures de travail et de 30 unités de matière première. Pour chaque produit A, il faut 2 heures de travail et 3 unités de matière première. Pour chaque produit B, il faut 4 heures de travail et 2 unités de matière première. Le bénéfice est de 500 FCFA pour A et 800 FCFA pour B. Écrire le système de contraintes et la fonction objectif du problème de programmation linéaire.</p>",
          "reponse": "<p>Soit \\( x \\) le nombre de produits A et \\( y \\) le nombre de produits B.<br><strong>Contraintes :</strong><br>\\( \\begin{cases} 2x + 4y \\leq 40 &\\text{(heures de travail)} \\\\ 3x + 2y \\leq 30 &\\text{(matière première)} \\\\ x \\geq 0, y \\geq 0 &\\text{(quantités non négatives)} \\end{cases} \\)<br><strong>Fonction objectif (bénéfice à maximiser) :</strong><br>\\( B(x, y) = 500x + 800y \\).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Généralités sur les fonctions",
      "points": "2 pts",
      "enonce": "<p style='font-size: 1rem; color: #2d3436;'>Cet exercice porte sur la définition d'une fonction, son ensemble de définition et son sens de variation.</p>",
      "questions": [
        {
          "question": "<p><strong>1. (0.5 pt)</strong> Définir une fonction numérique.</p>",
          "reponse": "<p>Une fonction numérique est une relation qui à tout nombre réel \\( x \\) d'un certain ensemble (appelé ensemble de définition) associe un unique nombre réel \\( f(x) \\).</p>"
        },
        {
          "question": "<p><strong>2. (1 pt)</strong> Déterminer l'ensemble de définition de \\( f(x) = \\frac{1}{x^2 - 1} \\) et de \\( g(x) = \\sqrt{2x + 8} \\).</p>",
          "reponse": "<p>Pour \\( f(x) = \\frac{1}{x^2 - 1} \\), le dénominateur ne doit pas être nul.<br>\\( x^2 - 1 \\neq 0 \\iff x \\neq -1 \\) et \\( x \\neq 1 \\).<br>\\( D_f = ]-\\infty, -1[ \\cup ]-1, 1[ \\cup ]1, +\\infty[ \\).<br><br>Pour \\( g(x) = \\sqrt{2x + 8} \\), le radicande doit être positif ou nul.<br>\\( 2x + 8 \\geq 0 \\iff x \\geq -4 \\).<br>\\( D_g = [-4, +\\infty[ \\).</p>"
        },
        {
          "question": "<p><strong>3. (0.5 pt)</strong> Étudier le sens de variation de \\( h(x) = 5x - 2 \\) sur \\( \\mathbb{R} \\).</p>",
          "reponse": "<p>Soit \\( x_1 < x_2 \\).<br>\\( 5x_1 < 5x_2 \\)<br>\\( 5x_1 - 2 < 5x_2 - 2 \\)<br>Donc \\( h(x_1) < h(x_2) \\). La fonction \\( h \\) est strictement croissante sur \\( \\mathbb{R} \\).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Limites, continuité et fonctions dérivées",
      "points": "3 pts",
      "enonce": "<p style='font-size: 1rem; color: #2d3436;'>Cet exercice aborde les notions de limite, de continuité et de dérivation des fonctions.</p>",
      "questions": [
        {
          "question": "<p><strong>1. (0.5 pt)</strong> Déterminer \\( \\lim_{x \\to +\\infty} \\frac{1}{x} \\) et \\( \\lim_{x \\to 0^+} \\frac{1}{x} \\).</p>",
          "reponse": "<p>\\( \\lim_{x \\to +\\infty} \\frac{1}{x} = 0 \\)<br>\\( \\lim_{x \\to 0^+} \\frac{1}{x} = +\\infty \\)</p>"
        },
        {
          "question": "<p><strong>2. (0.5 pt)</strong> Donner une interprétation intuitive de la continuité d'une fonction en un point.</p>",
          "reponse": "<p>Intuitivement, une fonction est continue en un point si on peut tracer sa courbe sans lever le crayon au voisinage de ce point.</p>"
        },
        {
          "question": "<p><strong>3. (1 pt)</strong> Déterminer la dérivée des fonctions suivantes :<br>a) \\( f(x) = 4x^3 - 2x^2 + 7x - 3 \\) <br>b) \\( g(x) = \\frac{1}{3x+2} \\)</p>",
          "reponse": "<p><strong>a) \\( f'(x) = 12x^2 - 4x + 7 \\)</strong><br><strong>b) \\( g(x) = \\frac{1}{3x+2} \\)</strong> : \\( u = 3x+2 \\), \\( u' = 3 \\).<br>\\( g'(x) = -\\frac{3}{(3x+2)^2} \\).</p>"
        },
        {
          "question": "<p><strong>4. (1 pt)</strong> Déterminer l'équation de la tangente à la courbe de \\( f(x) = x^3 \\) en \\( a = 1 \\).</p>",
          "reponse": "<p>\\( f(1) = 1 \\)<br>\\( f'(x) = 3x^2 \\), donc \\( f'(1) = 3 \\).<br>\\( y = f'(1)(x-1) + f(1) = 3(x-1) + 1 = 3x - 2 \\).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 5 : Fonctions usuelles",
      "points": "3 pts",
      "enonce": "<p style='font-size: 1rem; color: #2d3436;'>Cet exercice porte sur l'étude des fonctions usuelles.</p>",
      "questions": [
        {
          "question": "<p><strong>1. (1.5 pts)</strong> Étudier la fonction polynôme du second degré \\( f(x) = 2x^2 - 8x + 6 \\) (mettre sous forme canonique, sens de variation, extremum).</p>",
          "reponse": "<p><strong>Forme canonique :</strong><br>\\( f(x) = 2(x^2 - 4x) + 6 = 2[(x-2)^2 - 4] + 6 = 2(x-2)^2 - 8 + 6 = 2(x-2)^2 - 2 \\).<br><strong>Sommet :</strong> \\( (2, -2) \\).<br><strong>Sens de variation :</strong><br>Comme \\( a = 2 > 0 \\), \\( f \\) est décroissante sur \\( ]-\\infty, 2] \\) et croissante sur \\( [2, +\\infty[ \\).<br><strong>Extremum :</strong> Minimum en \\( x = 2 \\) de valeur \\( -2 \\).</p>"
        },
        {
          "question": "<p><strong>2. (1.5 pts)</strong> Étudier la fonction homographique \\( g(x) = \\frac{3x+1}{x-2} \\) : ensemble de définition, mise sous forme \\( \\alpha + \\frac{k}{x+\\beta} \\), sens de variation.</p>",
          "reponse": "<p><strong>Ensemble de définition :</strong> \\( D_g = \\mathbb{R} \\setminus \\{2\\} \\).<br><strong>Mise sous forme simplifiée :</strong><br>\\( 3x+1 = 3(x-2) + 7 \\), donc \\( g(x) = 3 + \\frac{7}{x-2} \\).<br>La courbe est une hyperbole de centre \\( (2, 3) \\).<br><strong>Dérivée :</strong> \\( g'(x) = -\\frac{7}{(x-2)^2} < 0 \\) sur \\( D_g \\).<br>\\( g \\) est strictement décroissante sur \\( ]-\\infty, 2[ \\) et sur \\( ]2, +\\infty[ \\).</p>"
        }
      ]
    },
    {

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
