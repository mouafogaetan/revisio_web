<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
 "matiere": "Mathématiques (IH/ESF)",
 "classe": "1ère technique",
 "sequence": "Séquence 3",
 "anneeScolaire": "2025-2026",
 "exercices": [
   {
     "titre": "EXERCICE 1 : ÉQUATIONS, INÉQUATIONS ET SYSTÈMES (5 pts)",
     "points": "5 pts",
     "enonce": "<div style='background-color: #f0f8ff; padding: 15px; border-radius: 8px; border-left: 6px solid #1a3c5e; color: #333; margin-bottom: 15px;'><p style='margin: 0; font-weight: bold;'>Contexte :</p><p style='margin: 5px 0 0 0;'>Dans le cadre d'un projet agricole, un groupement d'élèves souhaite planter des arbres fruitiers. Ils disposent d'un budget de 150 000 FCFA. Deux types d'arbres sont proposés : des manguiers à 2 500 FCFA l'unité et des avocatiers à 3 000 FCFA l'unité. Ils veulent planter au moins 40 arbres et au plus 60 arbres, avec un nombre d'avocatiers supérieur ou égal au nombre de manguiers.</p></div>",
     "questions": [
       {
         "question": "<p style='color: #333;'><strong>1.</strong> Résoudre dans \\( \\mathbb{R} \\) l'équation : \\( 2x^2 - 5x - 3 = 0 \\). <span style='color: #888; font-size: 0.9em;'>(0.75 pt)</span></p>",
         "reponse": "<p style='color: #333;'>\\( \\Delta = (-5)^2 - 4 \\times 2 \\times (-3) = 25 + 24 = 49 \\)</p><p style='color: #333;'>\\( x_1 = \\frac{5 - 7}{4} = -\\frac{1}{2} \\) et \\( x_2 = \\frac{5 + 7}{4} = 3 \\)</p><p style='color: #333;'>\\( S = \\{-\\frac{1}{2}; 3\\} \\)</p>"
       },
       {
         "question": "<p style='color: #333;'><strong>2.</strong> Résoudre dans \\( \\mathbb{R} \\) l'inéquation : \\( -x^2 + 4x - 3 \\geq 0 \\). <span style='color: #888; font-size: 0.9em;'>(0.75 pt)</span></p>",
         "reponse": "<p style='color: #333;'>Les racines de \\( -x^2 + 4x - 3 = 0 \\) sont \\( x_1 = 1 \\) et \\( x_2 = 3 \\).</p><p style='color: #333;'>Comme \\( a = -1 < 0 \\), le polynôme est positif entre les racines.</p><p style='color: #333;'>Donc \\( S = [1; 3] \\).</p>"
       },
       {
         "question": "<p style='color: #333;'><strong>3.</strong> Résoudre le système suivant dans \\( \\mathbb{R}^2 \\) : \\( \\begin{cases} 3x + 2y = 8 \\\\ x - y = 1 \\end{cases} \\). <span style='color: #888; font-size: 0.9em;'>(1 pt)</span></p>",
         "reponse": "<p style='color: #333;'>De la deuxième équation : \\( x = y + 1 \\).</p><p style='color: #333;'>On remplace dans la première : \\( 3(y+1) + 2y = 8 \\)</p><p style='color: #333;'>\\( 3y + 3 + 2y = 8 \\)</p><p style='color: #333;'>\\( 5y = 5 \\) donc \\( y = 1 \\) et \\( x = 2 \\).</p><p style='color: #333;'>La solution est \\( (2; 1) \\).</p>"
       },
       {
         "question": "<p style='color: #333;'><strong>4.</strong> Soit \\( x \\) le nombre de manguiers et \\( y \\) le nombre d'avocatiers. Traduire les contraintes du projet sous forme d'un système d'inéquations. <span style='color: #888; font-size: 0.9em;'>(1.5 pts)</span></p>",
         "reponse": "<p style='color: #333;'>Les contraintes sont :</p><ul style='color: #333;'><li>Budget : \\( 2500x + 3000y \\leq 150000 \\) soit \\( 5x + 6y \\leq 300 \\) (en divisant par 500)</li><li>Nombre d'arbres : \\( 40 \\leq x + y \\leq 60 \\)</li><li>Condition sur les avocatiers : \\( y \\geq x \\)</li><li>Non-négativité : \\( x \\geq 0 \\), \\( y \\geq 0 \\)</li></ul>"
       },
       {
         "question": "<p style='color: #333;'><strong>5.</strong> Déterminer graphiquement la zone des solutions réalisables puis donner deux combinaisons possibles de manguiers et d'avocatiers. <span style='color: #888; font-size: 0.9em;'>(1 pt)</span></p>",
         "reponse": "<p style='color: #333;'>Les combinaisons possibles doivent vérifier les 5 inéquations.</p><p style='color: #333;'>Exemple 1 : \\( x = 20 \\) manguiers et \\( y = 20 \\) avocatiers.</p><p style='color: #333;'>Vérification : 40 arbres, budget = 50 000 + 60 000 = 110 000 FCFA, \\( y = x \\).</p><p style='color: #333;'>Exemple 2 : \\( x = 15 \\) manguiers et \\( y = 30 \\) avocatiers.</p><p style='color: #333;'>Vérification : 45 arbres, budget = 37 500 + 90 000 = 127 500 FCFA, \\( y > x \\).</p>"
       }
     ]
   },
   {
     "titre": "EXERCICE 2 : STATISTIQUES ET DÉNOMBREMENT (5 pts)",
     "points": "5 pts",
     "enonce": "<div style='background-color: #f0f8ff; padding: 15px; border-radius: 8px; border-left: 6px solid #1a3c5e; color: #333; margin-bottom: 15px;'><p style='margin: 0; font-weight: bold;'>Contexte :</p><p style='margin: 5px 0 0 0;'>Une classe de 1ère technique compte 25 élèves. Le tableau ci-dessous donne les notes obtenues en Mathématiques IH/ESF lors d'une évaluation.</p></div><table style='border-collapse: collapse; width: 100%; font-size: 14px; color: #333;'><tr style='background-color: #1a3c5e; color: white;'><th style='padding: 8px; border: 1px solid #ddd;'>Notes</th><td style='padding: 8px; border: 1px solid #ddd;'>6</td><td style='padding: 8px; border: 1px solid #ddd;'>8</td><td style='padding: 8px; border: 1px solid #ddd;'>10</td><td style='padding: 8px; border: 1px solid #ddd;'>12</td><td style='padding: 8px; border: 1px solid #ddd;'>14</td><td style='padding: 8px; border: 1px solid #ddd;'>16</td><td style='padding: 8px; border: 1px solid #ddd;'>18</td></tr><tr><th style='padding: 8px; border: 1px solid #ddd; background-color: #1a3c5e; color: white;'>Effectifs</th><td style='padding: 8px; border: 1px solid #ddd;'>2</td><td style='padding: 8px; border: 1px solid #ddd;'>3</td><td style='padding: 8px; border: 1px solid #ddd;'>5</td><td style='padding: 8px; border: 1px solid #ddd;'>6</td><td style='padding: 8px; border: 1px solid #ddd;'>4</td><td style='padding: 8px; border: 1px solid #ddd;'>3</td><td style='padding: 8px; border: 1px solid #ddd;'>2</td></tr></table>",
     "questions": [
       {
         "question": "<p style='color: #333;'><strong>1.</strong> Déterminer la moyenne de cette série statistique. <span style='color: #888; font-size: 0.9em;'>(1 pt)</span></p>",
         "reponse": "<p style='color: #333;'>\\( \\bar{x} = \\frac{6 \\times 2 + 8 \\times 3 + 10 \\times 5 + 12 \\times 6 + 14 \\times 4 + 16 \\times 3 + 18 \\times 2}{25} \\)</p><p style='color: #333;'>\\( = \\frac{12 + 24 + 50 + 72 + 56 + 48 + 36}{25} = \\frac{298}{25} = 11.92 \\).</p>"
       },
       {
         "question": "<p style='color: #333;'><strong>2.</strong> Déterminer la médiane et le mode de cette série. <span style='color: #888; font-size: 0.9em;'>(1.5 pts)</span></p>",
         "reponse": "<p style='color: #333;'>L'effectif total est 25, la médiane est la 13ème valeur.</p><p style='color: #333;'>Effectifs cumulés : 2, 5, 10, 16, 20, 23, 25.</p><p style='color: #333;'>La 13ème valeur est 12. Donc \\( M_e = 12 \\).</p><p style='color: #333;'>Le mode est la note la plus fréquente : <strong>12</strong> (effectif 6).</p>"
       },
       {
         "question": "<p style='color: #333;'><strong>3.</strong> Calculer les quartiles \\( Q_1 \\) et \\( Q_3 \\) puis l'écart interquartile. <span style='color: #888; font-size: 0.9em;'>(1.5 pts)</span></p>",
         "reponse": "<p style='color: #333;'>\\( Q_1 \\) est au rang \\( \\frac{25}{4} = 6.25 \\) donc 7ème valeur : \\( Q_1 = 10 \\).</p><p style='color: #333;'>\\( Q_3 \\) est au rang \\( \\frac{3 \\times 25}{4} = 18.75 \\) donc 19ème valeur : \\( Q_3 = 14 \\).</p><p style='color: #333;'>Écart interquartile : \\( Q_3 - Q_1 = 14 - 10 = 4 \\).</p>"
       },
       {
         "question": "<p style='color: #333;'><strong>4.</strong> On choisit au hasard 3 élèves de cette classe. Calculer le nombre de façons de choisir ces 3 élèves. <span style='color: #888; font-size: 0.9em;'>(1 pt)</span></p>",
         "reponse": "<p style='color: #333;'>Il s'agit d'une combinaison de 3 élèves parmi 25 (l'ordre n'a pas d'importance).</p><p style='color: #333;'>\\( C_{25}^3 = \\frac{25 \\times 24 \\times 23}{3 \\times 2 \\times 1} = 25 \\times 4 \\times 23 = 2300 \\).</p>"
       }
     ]
   },
   {
     "titre": "EXERCICE 3 : FONCTIONS DÉRIVÉES ET TRANSFORMATIONS (6 pts)",
     "points": "6 pts",
     "enonce": "<div style='background-color: #f0f8ff; padding: 15px; border-radius: 8px; border-left: 6px solid #1a3c5e; color: #333; margin-bottom: 15px;'><p style='margin: 0; font-weight: bold;'>Contexte :</p><p style='margin: 5px 0 0 0;'>Soit la fonction \\( f \\) définie sur \\( \\mathbb{R} \\setminus \\{1\\} \\) par \\( f(x) = \\frac{x^2 - 2x + 3}{x - 1} \\).</p></div>",
     "questions": [
       {
         "question": "<p style='color: #333;'><strong>1.</strong> Démontrer que \\( f(x) = x - 1 + \\frac{2}{x - 1} \\). <span style='color: #888; font-size: 0.9em;'>(0.75 pt)</span></p>",
         "reponse": "<p style='color: #333;'>On effectue la division euclidienne de \\( x^2 - 2x + 3 \\) par \\( x - 1 \\) :</p><p style='color: #333;'>\\( (x-1)(x-1) + 2 = x^2 - 2x + 1 + 2 = x^2 - 2x + 3 \\).</p><p style='color: #333;'>Donc \\( f(x) = x - 1 + \\frac{2}{x - 1} \\).</p>"
       },
       {
         "question": "<p style='color: #333;'><strong>2.</strong> Déterminer les asymptotes de la courbe \\( C_f \\). <span style='color: #888; font-size: 0.9em;'>(1 pt)</span></p>",
         "reponse": "<p style='color: #333;'>De l'expression \\( f(x) = x - 1 + \\frac{2}{x - 1} \\) :</p><ul style='color: #333;'><li><strong>Asymptote verticale</strong> : \\( x = 1 \\) (valeur interdite)</li><li><strong>Asymptote oblique</strong> : \\( y = x - 1 \\) (car \\( \\frac{2}{x-1} \\to 0 \\) en \\( \\pm\\infty \\))</li></ul>"
       },
       {
         "question": "<p style='color: #333;'><strong>3.</strong> Calculer \\( f'(x) \\) et déterminer le sens de variation de \\( f \\) sur chaque intervalle de son domaine de définition. <span style='color: #888; font-size: 0.9em;'>(1.5 pts)</span></p>",
         "reponse": "<p style='color: #333;'>\\( f'(x) = 1 - \\frac{2}{(x-1)^2} = \\frac{(x-1)^2 - 2}{(x-1)^2} \\)</p><p style='color: #333;'>Le signe de \\( f'(x) \\) est celui de \\( (x-1)^2 - 2 = (x - 1 - \\sqrt{2})(x - 1 + \\sqrt{2}) \\).</p><p style='color: #333;'>\\( f'(x) > 0 \\) sur \\( ]-\\infty; 1-\\sqrt{2}[ \\cup ]1+\\sqrt{2}; +\\infty[ \\)</p><p style='color: #333;'>\\( f'(x) < 0 \\) sur \\( ]1-\\sqrt{2}; 1[ \\cup ]1; 1+\\sqrt{2}[ \\)</p><p style='color: #333;'>\\( f \\) est croissante sur les intervalles où \\( f'(x) > 0 \\) et décroissante sur ceux où \\( f'(x) < 0 \\).</p>"
       },
       {
         "question": "<p style='color: #333;'><strong>4.</strong> Déterminer l'équation de la tangente à \\( C_f \\) au point d'abscisse \\( x = 2 \\). <span style='color: #888; font-size: 0.9em;'>(1.25 pts)</span></p>",
         "reponse": "<p style='color: #333;'>\\( f(2) = \\frac{4 - 4 + 3}{1} = 3 \\)</p><p style='color: #333;'>\\( f'(2) = 1 - \\frac{2}{1} = -1 \\)</p><p style='color: #333;'>L'équation de la tangente est : \\( y = f'(2)(x - 2) + f(2) \\)</p><p style='color: #333;'>\\( y = -1(x - 2) + 3 = -x + 2 + 3 = -x + 5 \\)</p>"

       {

         "reponse": "<p style='color: #333;'>La translation de vecteur \\( \\vec{u}(1; 1) \\) transforme \\( (x; y) \\) en \\( (x+1; y+1) \\).</p><p style='color: #333;'>L'image de \\( C_f \\) d'équation \\( y = x - 1 + \\frac{2}{x-1} \\) est la courbe d'équation :</p><p style='color: #333;'>\\( y - 1 = (x-1) - 1 + \\frac{2}{(x-1) - 1} = x - 2 + \\frac{2}{x-2} \\)</p><p style='color: #333;'>Donc \\( y = x - 1 + \\frac{2}{x-2} \\).</p>"

   {

     "points": "4 pts",
     "enonce": "<div style='background-color: #f0f8ff; padding: 15px; border-radius: 8px; border-left: 6px solid #1a3c5e; color: #333; margin-bottom: 15px;'><p style='margin: 0; font-weight: bold;'>Contexte :</p><p style='margin: 5px 0 0 0;'>Le plan est muni d'un repère orthonormé \\( (O; \\vec{i}; \\vec{j}) \\). On considère les points \\( A(-1; 2) \\), \\( B(3; -2) \\) et \\( C(5; 4) \\).</p></div>",
     "questions": [
       {
         "question": "<p style='color: #333;'><strong>1.</strong> Calculer la distance \\( AB \\). <span style='color: #888; font-size: 0.9em;'>(0.75 pt)</span></p>",
         "reponse": "<p style='color: #333;'>\\( AB = \\sqrt{(3 - (-1))^2 + (-2 - 2)^2} = \\sqrt{4^2 + (-4)^2} = \\sqrt{16 + 16} = \\sqrt{32} = 4\\sqrt{2} \\).</p>"

         "reponse": "<p style='color: #333;'>Soit \\( M(x; y) \\) un point de \\( (AC) \\).</p><p style='color: #333;'>Vecteur directeur \\( \\overrightarrow{AC} = (5 - (-1); 4 - 2) = (6; 2) \\).</p><p style='color: #333;'>Un vecteur normal est \\( \\vec{n}(2; -6) \\) ou \\( \\vec{n}(1; -3) \\).</p><p style='color: #333;'>L'équation est \\( 1(x + 1) - 3(y - 2) = 0 \\)</p><p style='color: #333;'>\\( x + 1 - 3y + 6 = 0 \\) soit \\( x - 3y + 7 = 0 \\).</p>"

       {

         "reponse": "<p style='color: #333;'>La distance de \\( B(3; -2) \\) à la droite \\( x - 3y + 7 = 0 \\) est :</p><p style='color: #333;'>\\( d = \\frac{|3 - 3(-2) + 7|}{\\sqrt{1^2 + (-3)^2}} = \\frac{|3 + 6 + 7|}{\\sqrt{10}} = \\frac{16}{\\sqrt{10}} \\)</p><p style='color: #333;'>\\( d = \\frac{16\\sqrt{10}}{10} = \\frac{8\\sqrt{10}}{5} \\).</p>"

         "reponse": "<p style='color: #333;'>Le centre du cercle est le milieu de \\( [AB] \\) : \\( I\\left(\\frac{-1+3}{2}; \\frac{2+(-2)}{2}\\right) = (1; 0) \\).</p><p style='color: #333;'>Le rayon est \\( \\frac{AB}{2} = \\frac{4\\sqrt{2}}{2} = 2\\sqrt{2} \\).</p><p style='color: #333;'>L'équation du cercle est : \\( (x - 1)^2 + y^2 = (2\\sqrt{2})^2 = 8 \\).</p>"

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
