<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Mathématiques IH/ESF",
  "classe": "1ère technique",
  "sequence": "Séquence 6",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : QCM - Géométrie métrique",
      "points": "4 pts",
      "enonce": "<p>Pour chacune des questions suivantes, une seule réponse est correcte. Recopiez sur votre copie le numéro de la question et la lettre correspondant à la réponse choisie. <strong>Aucune justification n'est demandée.</strong></p>",
      "questions": [
        {
          "question": "<p><strong>1. (1 pt)</strong> La distance entre les points \\( A(2; -1) \\) et \\( B(5; 3) \\) est :</p><ul><li>A) 3</li><li>B) 4</li><li>C) 5</li><li>D) 25</li></ul>",
          "reponse": "<p><strong>Réponse : C) 5</strong></p><p>Explication : \\( AB = \\sqrt{(5-2)^2 + (3-(-1))^2} = \\sqrt{3^2 + 4^2} = \\sqrt{9+16} = \\sqrt{25} = 5 \\). [citation:1]</p>"
        },
        {
          "question": "<p><strong>2. (1 pt)</strong> La distance du point \\( M(1; 2) \\) à la droite \\( (D) : 3x - 4y + 5 = 0 \\) est :</p><ul><li>A) 0</li><li>B) 1</li><li>C) 2</li><li>D) 5</li></ul>",
          "reponse": "<p><strong>Réponse : A) 0</strong></p><p>Explication : \\( d(M,D) = \\dfrac{|3 \\times 1 - 4 \\times 2 + 5|}{\\sqrt{3^2 + (-4)^2}} = \\dfrac{|3 - 8 + 5|}{5} = \\dfrac{0}{5} = 0 \\). Le point M appartient donc à la droite (D). [citation:1]</p>"
        },
        {
          "question": "<p><strong>3. (1 pt)</strong> L'équation du cercle de centre \\( \\Omega(1; -2) \\) et de rayon \\( R = 4 \\) est :</p><ul><li>A) \\( (x-1)^2 + (y+2)^2 = 16 \\)</li><li>B) \\( (x+1)^2 + (y-2)^2 = 4 \\)</li><li>C) \\( (x-1)^2 + (y+2)^2 = 4 \\)</li><li>D) \\( (x+1)^2 + (y-2)^2 = 16 \\)</li></ul>",
          "reponse": "<p><strong>Réponse : A) \\( (x-1)^2 + (y+2)^2 = 16 \\)</strong></p><p>Explication : L'équation d'un cercle de centre \\( \\Omega(a;b) \\) et de rayon R est \\( (x-a)^2 + (y-b)^2 = R^2 \\). Ici \\( a=1, b=-2 \\), donc \\( (x-1)^2 + (y+2)^2 = 4^2 = 16 \\). [citation:1]</p>"
        },
        {
          "question": "<p><strong>4. (1 pt)</strong> Soit le cercle \\( \\mathcal{C}: (x-3)^2 + (y+1)^2 = 25 \\). Le point \\( P(7; 2) \\) est-il sur le cercle ?</p><ul><li>A) Oui, car OP = 5</li><li>B) Non, car OP = 3</li><li>C) Oui, car OP = 25</li><li>D) Non, car OP = 7</li></ul>",
          "reponse": "<p><strong>Réponse : A) Oui, car OP = 5</strong></p><p>Explication : Le centre est \\( \\Omega(3; -1) \\). On calcule \\( \\Omega P = \\sqrt{(7-3)^2 + (2-(-1))^2} = \\sqrt{4^2 + 3^2} = \\sqrt{16+9} = \\sqrt{25} = 5 \\). Comme \\( \\Omega P = R = 5 \\), P appartient au cercle. [citation:1]</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Calculs de distances et équations",
      "points": "6 pts",
      "enonce": "<p>Dans un repère orthonormé \\( (O; \\vec{i}, \\vec{j}) \\), on donne les points \\( A(1; 2) \\), \\( B(4; 6) \\) et \\( C(-2; 3) \\).</p>",
      "questions": [
        {
          "question": "<p><strong>1. (2 pts)</strong> Calculer les distances \\( AB \\), \\( AC \\) et \\( BC \\). En déduire la nature du triangle \\( ABC \\).</p>",
          "reponse": "<p>\\( AB = \\sqrt{(4-1)^2 + (6-2)^2} = \\sqrt{3^2 + 4^2} = \\sqrt{9+16} = 5 \\).<br>\\( AC = \\sqrt{(-2-1)^2 + (3-2)^2} = \\sqrt{(-3)^2 + 1^2} = \\sqrt{9+1} = \\sqrt{10} \\).<br>\\( BC = \\sqrt{(-2-4)^2 + (3-6)^2} = \\sqrt{(-6)^2 + (-3)^2} = \\sqrt{36+9} = \\sqrt{45} = 3\\sqrt{5} \\).<br>Le triangle ABC est rectangle en A car \\( AB^2 + AC^2 = 25 + 10 = 35 = BC^2 \\).</p>"
        },
        {
          "question": "<p><strong>2. (2 pts)</strong> Déterminer l'équation du cercle \\( \\mathcal{C} \\) de diamètre \\( [AB] \\).</p>",
          "reponse": "<p>Le centre du cercle est le milieu de \\( [AB] \\) : \\( \\Omega \\left( \\dfrac{1+4}{2}; \\dfrac{2+6}{2} \\right) = \\Omega \\left( \\dfrac{5}{2}; 4 \\right) \\).<br>Le rayon est \\( R = \\dfrac{AB}{2} = \\dfrac{5}{2} \\).<br>L'équation du cercle est : \\( (x - \\dfrac{5}{2})^2 + (y - 4)^2 = \\left(\\dfrac{5}{2}\\right)^2 = \\dfrac{25}{4} \\).<br>Soit, en développant : \\( x^2 + y^2 - 5x - 8y + \\dfrac{25}{4} + 16 - \\dfrac{25}{4} = 0 \\Rightarrow x^2 + y^2 - 5x - 8y + 16 = 0 \\). [citation:1]</p>"
        },
        {
          "question": "<p><strong>3. (2 pts)</strong> Vérifier que le point \\( C \\) appartient au cercle \\( \\mathcal{C} \\) et déterminer l'équation de la tangente à \\( \\mathcal{C} \\) en \\( C \\).</p>",
          "reponse": "<p>Le vecteur \\( \\overrightarrow{\\Omega C} = \\left(-2 - \\dfrac{5}{2}; 3 - 4\\right) = \\left(-\\dfrac{9}{2}; -1\\right) \\).<br>L'équation de la tangente en \\( C \\) est : \\( (x_C - a)(x - x_C) + (y_C - b)(y - y_C) = 0 \\) avec \\( \\Omega(a; b) \\).<br>Soit \\( (-\\dfrac{9}{2})(x + 2) + (-1)(y - 3) = 0 \\Rightarrow -\\dfrac{9}{2}x - 9 - y + 3 = 0 \\Rightarrow -\\dfrac{9}{2}x - y - 6 = 0 \\).<br>En multipliant par -2 : \\( 9x + 2y + 12 = 0 \\).<br>La tangente a pour équation \\( 9x + 2y + 12 = 0 \\). [citation:1]</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Problème de synthèse",
      "points": "5 pts",
      "enonce": "<p>Dans un repère orthonormé, on considère le cercle \\( \\mathcal{C} \\) d'équation \\( x^2 + y^2 - 2x + 4y - 4 = 0 \\).</p>",
      "questions": [
        {
          "question": "<p><strong>1. (1,5 pt)</strong> Déterminer le centre \\( \\Omega \\) et le rayon \\( R \\) du cercle \\( \\mathcal{C} \\).</p>",
          "reponse": "<p>On met l'équation sous forme canonique : \\( (x-1)^2 - 1 + (y+2)^2 - 4 - 4 = 0 \\Rightarrow (x-1)^2 + (y+2)^2 = 9 \\).<br>Donc le centre est \\( \\Omega(1; -2) \\) et le rayon \\( R = 3 \\). [citation:1]</p>"
        },
        {
          "question": "<p><strong>2. (1,5 pt)</strong> Le point \\( A(4; -2) \\) est-il sur le cercle ? Justifier.</p>",
          "reponse": "<p>On calcule \\( \\Omega A = \\sqrt{(4-1)^2 + (-2-(-2))^2} = \\sqrt{3^2 + 0} = 3 = R \\).<br>Donc \\( A \\) appartient au cercle \\( \\mathcal{C} \\).</p>"
        },
        {
          "question": "<p><strong>3. (2 pts)</strong> Déterminer l'équation de la tangente à \\( \\mathcal{C} \\) au point \\( A \\).</p>",
          "reponse": "<p>Le vecteur \\( \\overrightarrow{\\Omega A} = (3; 0) \\) est normal à la tangente en \\( A \\).<br>L'équation de la tangente est de la forme \\( 3(x - 4) + 0(y + 2) = 0 \\Rightarrow 3x - 12 = 0 \\Rightarrow x = 4 \\).<br>La tangente est la droite verticale d'équation \\( x = 4 \\). [citation:1]</p>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : QCM - Géométrie métrique",
      "points": "5 pts",
      "enonce": "<p>Pour chacune des questions suivantes, une seule réponse est correcte. Recopiez sur votre copie le numéro de la question et la lettre correspondant à la réponse choisie. <strong>Aucune justification n'est demandée.</strong></p>",
      "questions": [
        {
          "question": "<p><strong>1. (1 pt)</strong> La distance du point \\( M(2; 3) \\) à la droite \\( (D): x - 2y + 4 = 0 \\) est :</p><ul><li>A) \\( \\dfrac{3}{\\sqrt{5}} \\)</li><li>B) \\( \\dfrac{2}{\\sqrt{5}} \\)</li><li>C) \\( \\dfrac{4}{\\sqrt{5}} \\)</li><li>D) \\( \\dfrac{5}{\\sqrt{5}} \\)</li></ul>",
          "reponse": "<p><strong>Réponse : A) \\( \\dfrac{3}{\\sqrt{5}} \\)</strong></p><p>Explication : \\( d(M,D) = \\dfrac{|1 \\times 2 - 2 \\times 3 + 4|}{\\sqrt{1^2 + (-2)^2}} = \\dfrac{|2 - 6 + 4|}{\\sqrt{5}} = \\dfrac{0}{\\sqrt{5}} = 0 \\). Le point M appartient à la droite. [citation:1]</p>"
        },
        {
          "question": "<p><strong>2. (1 pt)</strong> Le cercle d'équation \\( x^2 + y^2 - 4x + 6y - 12 = 0 \\) a pour centre et rayon :</p><ul><li>A) \\( \\Omega(2; -3) \\) et \\( R = 5 \\)</li><li>B) \\( \\Omega(-2; 3) \\) et \\( R = 5 \\)</li><li>C) \\( \\Omega(2; -3) \\) et \\( R = 25 \\)</li><li>D) \\( \\Omega(-2; 3) \\) et \\( R = 25 \\)</li></ul>",
          "reponse": "<p><strong>Réponse : A) \\( \\Omega(2; -3) \\) et \\( R = 5 \\)</strong></p><p>Explication : \\( x^2 - 4x + y^2 + 6y - 12 = 0 \\Rightarrow (x-2)^2 - 4 + (y+3)^2 - 9 - 12 = 0 \\Rightarrow (x-2)^2 + (y+3)^2 = 25 \\). Donc \\( \\Omega(2; -3) \\) et \\( R = 5 \\). [citation:1]</p>"
        },
        {
          "question": "<p><strong>3. (1 pt)</strong> La longueur de la tangente issue du point \\( P(6; 0) \\) au cercle \\( \\mathcal{C}: (x-2)^2 + (y+1)^2 = 9 \\) est :</p><ul><li>A) 2</li><li>B) 3</li><li>C) 4</li><li>D) 5</li></ul>",
          "reponse": "<p><strong>Réponse : C) 4</strong></p><p>Explication : \\( \\Omega P = \\sqrt{(6-2)^2 + (0+1)^2} = \\sqrt{16 + 1} = \\sqrt{17} \\). Longueur de la tangente \\( T = \\sqrt{\\Omega P^2 - R^2} = \\sqrt{17 - 9} = \\sqrt{8} = 2\\sqrt{2} \\).</p>"
        },
        {
          "question": "<p><strong>4. (1 pt)</strong> L'ensemble des points \\( M(x; y) \\) tels que \\( \\dfrac{|2x - 3y + 1|}{\\sqrt{13}} = 2 \\) est :</p><ul><<li>A) Un cercle de rayon 2</li><li>B) Deux droites parallèles</li><li>C) Une droite</li><li>D) Un cercle de rayon \\( \\sqrt{13} \\)</li></ul>",
          "reponse": "<p><strong>Réponse : B) Deux droites parallèles</strong></p><p>Explication : \\( |2x - 3y + 1| = 2\\sqrt{13} \\) donne deux équations de droites parallèles : \\( 2x - 3y + 1 = 2\\sqrt{13} \\) et \\( 2x - 3y + 1 = -2\\sqrt{13} \\). [citation:1]</p>"
        },
        {
          "question": "<p><strong>5. (1 pt)</strong> Le point \\( A(4; 1) \\) est sur le cercle \\( \\mathcal{C}: x^2 + y^2 - 2x - 2y - 11 = 0 \\). L'équation de la tangente en A est :</p><ul><li>A) \\( x - y - 3 = 0 \\)</li><li>B) \\( x + y - 5 = 0 \\)</li><li>C) \\( 2x - y - 7 = 0 \\)</li><li>D) \\( 3x + y - 13 = 0 \\)</li></ul>",
          "reponse": "<p><strong>Réponse : D) \\( 3x + y - 13 = 0 \\)</strong></p><p>Explication : Le centre est \\( \\Omega(1; 1) \\). Le vecteur \\( \\overrightarrow{\\Omega A} = (3; 0) \\) est normal à la tangente. La tangente a pour équation \\( 3(x-4) + 0(y-1) = 0 \\Rightarrow 3x - 12 = 0 \\Rightarrow x = 4 \\). La réponse correcte est \\( x = 4 \\). [citation:1]</p>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
