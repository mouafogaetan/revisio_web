<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Informatique",
  "classe": "1ère technique",
  "sequence": "Séquence 5",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Structure de contrôle et algorithme",
      "points": "5 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; line-height: 1.6; color: #333; background-color: #f9f9f9; padding: 15px; border-radius: 8px;'><p><strong>Contexte :</strong></p><p>Un établissement scolaire souhaite automatiser le calcul des mentions des élèves. Le système doit fonctionner selon les règles suivantes :</p><div class='math-block' style='background-color: #eef2f7; padding: 12px; border-radius: 6px; margin: 10px 0;'><ul><li>Si la moyenne est supérieure ou égale à 16 : Mention <strong>Très Bien</strong></li><li>Si la moyenne est comprise entre 14 et 16 (exclu) : Mention <strong>Bien</strong></li><li>Si la moyenne est comprise entre 12 et 14 (exclu) : Mention <strong>Assez Bien</strong></li><li>Si la moyenne est comprise entre 10 et 12 (exclu) : Mention <strong>Passable</strong></li><li>Si la moyenne est inférieure à 10 : Mention <strong>Insuffisant</strong></li></ul></div></div>",
      "questions": [
        {
          "question": "<p><strong>1.1</strong> Écrire un algorithme (en langage naturel ou pseudo-code) qui permet de saisir la moyenne d'un élève, de déterminer sa mention et d'afficher le résultat.</p>",
          "reponse": "<p>Algorithme <strong>CalculMention</strong></p><pre style='background-color: #eef2f7; padding: 10px; border-radius: 6px;'><code>Variables : moyenne : réel<br>Début<br>   Écrire 'Entrez la moyenne de l'élève : '<br>   Lire moyenne<br>   Si moyenne >= 16 Alors<br>      Écrire 'Mention : Très Bien'<br>   Sinon Si moyenne >= 14 Alors<br>      Écrire 'Mention : Bien'<br>   Sinon Si moyenne >= 12 Alors<br>      Écrire 'Mention : Assez Bien'<br>   Sinon Si moyenne >= 10 Alors<br>      Écrire 'Mention : Passable'<br>   Sinon<br>      Écrire 'Mention : Insuffisant'<br>   Fin Si<br>Fin</code></pre>"
        },
        {
          "question": "<p><strong>1.2</strong> Dans quel type de structure de contrôle se classe cet algorithme ? Justifiez votre réponse.</p>",
          "reponse": "<p>Il s'agit d'une <strong>structure alternative</strong> (ou structure conditionnelle) car elle permet d'exécuter différents blocs d'instructions en fonction de la valeur de la moyenne. Plus précisément, c'est une structure <strong>SI...ALORS...SINON SI...SINON</strong> (alternative multiple).</p>"
        },
        {
          "question": "<p><strong>1.3</strong> Proposez un algorigramme (organigramme) correspondant à cet algorithme. Décrivez les symboles que vous utiliseriez.</p>",
          "reponse": "<p><strong>Symboles utilisés :</strong></p><ul><li><strong>Début/Fin</strong> : Ovales</li><li><strong>Entrée/Sortie (Lire/Écrire)</strong> : Parallélogrammes</li><li><strong>Test (Si)</strong> : Losanges</li><li><strong>Instructions</strong> : Rectangles</li></ul><p><strong>Structure de l'algorigramme :</strong> Début → Lire moyenne → Test 'moyenne >= 16' (losange) → Oui : Afficher Très Bien → Fin ; Non : Test 'moyenne >= 14' → etc.</p>"
        }
      ]
    },
    {
      "titre": "Boucles en langage C",
      "points": "5 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; line-height: 1.6; color: #333; background-color: #f9f9f9; padding: 15px; border-radius: 8px;'><p><strong>Contexte :</strong></p><p>Dans le cadre de l'apprentissage du langage C, un programme doit afficher la table de multiplication d'un nombre saisi par l'utilisateur.</p></div>",
      "questions": [
        {
          "question": "<p><strong>2.1</strong> Écrire un programme en langage C qui demande un nombre entier à l'utilisateur et affiche sa table de multiplication de 1 à 10 en utilisant une boucle <strong>for</strong>.</p>",
          "reponse": "<pre style='background-color: #eef2f7; padding: 10px; border-radius: 6px;'><code>#include &lt;stdio.h&gt;<br>int main() {<br>    int n, i;<br>    printf(\"Entrez un nombre : \");<br>    scanf(\"%d\", &amp;n);<br>    for(i=1; i<=10; i++) {<br>        printf(\"%d x %d = %d\\n\", n, i, n*i);<br>    }<br>    return 0;<br>}</code></pre>"
        },
        {
          "question": "<p><strong>2.2</strong> Reprendre le même programme en utilisant une boucle <strong>while</strong>.</p>",
          "reponse": "<pre style='background-color: #eef2f7; padding: 10px; border-radius: 6px;'><code>#include &lt;stdio.h&gt;<br>int main() {<br>    int n, i=1;<br>    printf(\"Entrez un nombre : \");<br>    scanf(\"%d\", &amp;n);<br>    while(i <= 10) {<br>        printf(\"%d x %d = %d\\n\", n, i, n*i);<br>        i++;<br>    }<br>    return 0;<br>}</code></pre>"
        },
        {
          "question": "<p><strong>2.3</strong> Quelle est la différence entre une boucle <strong>for</strong> et une boucle <strong>while</strong> en C ?</p>",
          "reponse": "<ul><li><strong>for</strong> : Utilisée lorsque le nombre d'itérations est connu à l'avance. L'initialisation, la condition et l'incrémentation sont regroupées en une ligne.</li><li><strong>while</strong> : Utilisée lorsque le nombre d'itérations est inconnu à l'avance et dépend d'une condition.</li></ul>"
        }
      ]
    },
    {
      "titre": "Utilisation du logiciel GANTT PROJECT",
      "points": "6 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; line-height: 1.6; color: #333; background-color: #f9f9f9; padding: 15px; border-radius: 8px;'><p><strong>Contexte :</strong></p><p>Un chef de projet doit planifier le déploiement d'un réseau informatique dans une entreprise. Le projet comporte les tâches suivantes :</p><div class='math-block' style='background-color: #eef2f7; padding: 12px; border-radius: 6px; margin: 10px 0;'><ul><li><strong>A</strong> : Étude des besoins (2 jours)</li><li><strong>B</strong> : Choix du matériel (1 jour, dépend de A)</li><li><strong>C</strong> : Achat du matériel (2 jours, dépend de B)</li><li><strong>D</strong> : Installation physique (3 jours, dépend de C)</li><li><strong>E</strong> : Configuration (2 jours, dépend de D)</li><li><strong>F</strong> : Tests (1 jour, dépend de E)</li><li><strong>G</strong> : Réception (0,5 jour, dépend de F)</li></ul></div></div>",
      "questions": [
        {
          "question": "<p><strong>3.1</strong> Dans GanttProject, comment crée-t-on une tâche ? Décrivez la procédure.</p>",
          "reponse": "<ol><li>Ouvrir GanttProject et créer un nouveau projet.</li><li>Dans l'arbre des tâches (partie gauche), cliquer sur une ligne vide.</li><li>Saisir le nom de la tâche (ex: 'Étude des besoins').</li><li>Définir la durée (en jours) dans la colonne 'Durée'.</li><li>Définir la date de début si nécessaire.</li></ol>"
        },
        {
          "question": "<p><strong>3.2</strong> Comment définit-on une dépendance (prédécesseur) dans GanttProject ? Expliquez avec l'exemple de la tâche <strong>B</strong> qui dépend de <strong>A</strong>.</p>",
          "reponse": "<p>Pour définir une dépendance :</p><ol><li>Sélectionner la tâche B dans l'arbre des tâches.</li><li>Dans la colonne 'Prédécesseur', saisir l'identifiant de la tâche A (généralement le numéro de ligne).</li><li>Par défaut, le lien est de type <strong>Fin-Début (FD)</strong> : B ne peut commencer que lorsque A est terminée.</li></ol>"
        },
        {
          "question": "<p><strong>3.3</strong> Identifiez le chemin critique de ce projet et calculez sa durée totale.</p>",
          "reponse": "<ul><li>Le chemin critique est la séquence de tâches qui détermine la durée minimale du projet.</li><li>Ici, toutes les tâches sont en série : A → B → C → D → E → F → G.</li><li>Durée totale = 2 + 1 + 2 + 3 + 2 + 1 + 0,5 = <strong>11,5 jours</strong>.</li></ul>"
        }
      ]
    },
    {
      "titre": "Réalisation de devis sous MS Excel",
      "points": "4 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; line-height: 1.6; color: #333; background-color: #f9f9f9; padding: 15px; border-radius: 8px;'><p><strong>Contexte :</strong></p><p>Un client souhaite acquérir du matériel informatique pour son entreprise. Vous devez réaliser un devis quantitatif sous MS Excel. Les éléments sont les suivants :</p><ul><li>10 ordinateurs portables à 750 € l'unité</li><li>10 licences Microsoft Office à 120 € l'unité</li><li>1 serveur à 2500 €</li><li>Frais de livraison : 150 €</li><li>TVA : 18 %</li></ul><p>Le client bénéficie d'une remise de 5 % sur le montant total HT.</p></div>",
      "questions": [
        {
          "question": "<p><strong>4.1</strong> Calculez le montant hors taxe (HT) avant remise, puis après remise.</p>",
          "reponse": "<ul><li>Montant HT avant remise = (10 × 750) + (10 × 120) + 2500 + 150 = 7500 + 1200 + 2500 + 150 = <strong>11 350 €</strong></li><li>Montant HT après remise = 11350 - (11350 × 5/100) = 11350 - 567,5 = <strong>10 782,50 €</strong></li></ul>"
        },
        {
          "question": "<p><strong>4.2</strong> Calculez le montant TTC du devis.</p>",
          "reponse": "<p>Montant TTC = Montant HT après remise + TVA = 10782,50 + (10782,50 × 18/100) = 10782,50 + 1940,85 = <strong>12 723,35 €</strong></p>"
        },
        {
          "question": "<p><strong>4.3</strong> Quels sont les éléments obligatoires qui doivent apparaître sur un devis sous Excel (hors calculs) ?</p>",
          "reponse": "<ul><li>Nom et coordonnées du fournisseur et du client</li><li>Numéro de devis et date d'émission</li><li>Durée de validité du devis</li><li>Désignation des produits/services</li><li>Quantité, prix unitaire et montant par ligne</li><li>Montant HT, TVA et montant TTC</li><li>Conditions de paiement et de livraison</li></ul>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
