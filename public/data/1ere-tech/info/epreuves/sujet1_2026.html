<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Informatique",
  "classe": "1ère technique",
  "sequence": "Séquence 1",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Détermination des besoins en matériels et logiciels",
      "points": "5 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; line-height: 1.6; color: #333; background-color: #f9f9f9; padding: 15px; border-radius: 8px;'><p><strong>Contexte :</strong></p><p>Vous êtes chef de projet dans une entreprise de services informatiques. Un client vous sollicite pour la mise en place d'un nouveau système de gestion de stock pour sa PME. Pour mener à bien ce projet, vous devez déterminer les ressources matérielles et logicielles nécessaires.</p><div class='math-block' style='background-color: #eef2f7; padding: 12px; border-radius: 6px; margin: 10px 0;'><div class='math'><strong>Éléments à considérer :</strong></div><ul><li>Le client souhaite un serveur central et 5 postes de travail pour ses employés.</li><li>Un système d'exploitation adapté aux serveurs.</li><li>Une solution de gestion de base de données pour stocker les informations des stocks.</li><li>Un logiciel de gestion de stock avec interface utilisateur.</li><li>Des périphériques pour la saisie et l'impression des documents.</li></ul></div><p style='margin-top: 15px; font-style: italic;'>Rédigez une réponse structurée, en identifiant clairement les ressources matérielles (ordinateurs, périphériques) et logicielles (système, applications).</p></div>",
      "questions": [
        {
          "question": "<p><strong>1.1</strong> En vous basant sur le contexte, proposez une liste du matériel nécessaire en précisant le rôle de chaque élément.</p>",
          "reponse": "<p>Le matériel nécessaire comprend :</p><ul><li><strong>1 serveur central :</strong> pour héberger la base de données et l'application de gestion de stock.</li><li><strong>5 postes de travail :</strong> pour que les employés puissent accéder au système et gérer les stocks.</li><li><strong>1 imprimante :</strong> pour imprimer les documents (bons de commande, étiquettes).</li><li><strong>1 scanner de code-barres :</strong> pour faciliter la saisie des produits et la gestion des entrées/sorties.</li></ul><p>À ces éléments, on peut ajouter un commutateur réseau (switch) pour relier les postes entre eux et au serveur.</p>"
        },
        {
          "question": "<p><strong>1.2</strong> Proposez une liste des logiciels nécessaires en les classant par type (système d'exploitation, logiciel de gestion de base de données, logiciel applicatif).</p>",
          "reponse": "<ul><li><strong>Système d'exploitation (serveur) :</strong> Windows Server ou Linux (Ubuntu Server).</li><li><strong>Système d'exploitation (postes de travail) :</strong> Windows 10/11 Professionnel ou Linux (Ubuntu).</li><li><strong>Système de gestion de base de données (SGBD) :</strong> MySQL, PostgreSQL, ou Microsoft SQL Server.</li><li><strong>Logiciel de gestion de stock :</strong> Application web développée sur mesure ou solution open-source comme Odoo ou ERPNext.</li></ul>"
        }
      ]
    },
    {
      "titre": "Sécurité informatique : principes et bonnes pratiques",
      "points": "4 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; line-height: 1.6; color: #333; background-color: #f9f9f9; padding: 15px; border-radius: 8px;'><p><strong>Contexte :</strong></p><p>Une entreprise de 50 personnes a récemment subi une cyberattaque. Les données de plusieurs clients ont été compromises. Le responsable informatique décide de renforcer la sécurité en appliquant les principes fondamentaux de la sécurité informatique.</p><div class='math-block' style='background-color: #eef2f7; padding: 12px; border-radius: 6px; margin: 10px 0;'><div class='math'><strong>Questions :</strong></div></div></div>",
      "questions": [
        {
          "question": "<p><strong>2.1</strong> Citez et expliquez les 5 principes fondamentaux de la sécurité informatique.</p>",
          "reponse": "<ul><li><strong>Disponibilité :</strong> Les données et services doivent être accessibles aux utilisateurs autorisés quand ils en ont besoin.</li><li><strong>Intégrité :</strong> Les données ne doivent pas être modifiées ou altérées de manière non autorisée.</li><li><strong>Confidentialité :</strong> Les données ne doivent être accessibles qu'aux personnes autorisées.</li><li><strong>Authentification :</strong> Vérifier l'identité des utilisateurs avant de leur donner accès.</li><li><strong>Non-répudiation :</strong> Garantir qu'une action effectuée par un utilisateur ne peut pas être niée par celui-ci.</li></ul>"
        },
        {
          "question": "<p><strong>2.2</strong> Citez trois techniques de protection des données et expliquez leur utilité.</p>",
          "reponse": "<ul><li><strong>Cryptage :</strong> Rendre les données illisibles sans la clé de déchiffrement, ce qui protège la confidentialité.</li><li><strong>Compression :</strong> Réduire la taille des fichiers pour économiser de l'espace de stockage, tout en pouvant être associée à un mot de passe.</li><li><strong>Antivirus :</strong> Détecter et supprimer les logiciels malveillants (virus, chevaux de Troie, etc.) pour protéger l'intégrité des données.</li></ul>"
        },
        {
          "question": "<p><strong>2.3</strong> Expliquez l'importance de la mise à jour régulière d'un antivirus.</p>",
          "reponse": "<p>La mise à jour régulière d'un antivirus est cruciale car :</p><ul><li>De nouveaux virus et logiciels malveillants apparaissent constamment.</li><li>Les mises à jour contiennent des signatures et des définitions pour détecter ces nouvelles menaces.</li><li>Sans mise à jour, l'antivirus devient inefficace contre les menaces récentes.</li></ul>"
        }
      ]
    },
    {
      "titre": "Utilisation du logiciel GanttProject",
      "points": "6 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; line-height: 1.6; color: #333; background-color: #f9f9f9; padding: 15px; border-radius: 8px;'><p><strong>Contexte :</strong></p><p>Un chef de projet souhaite planifier un projet de développement d'une application mobile. Il utilise GanttProject pour la planification. Le projet comporte les étapes suivantes :</p><ul><li><strong>Étape A</strong> : Analyse des besoins (2 jours)</li><li><strong>Étape B</strong> : Conception de l'interface (3 jours, dépend de l'Étape A)</li><li><strong>Étape C</strong> : Développement (5 jours, dépend de l'Étape B)</li><li><strong>Étape D</strong> : Tests (2 jours, dépend de l'Étape C)</li><li><strong>Étape E</strong> : Déploiement (1 jour, dépend de l'Étape D)</li></ul><div class='math-block' style='background-color: #eef2f7; padding: 12px; border-radius: 6px; margin: 10px 0;'><div class='math'><strong>Ressources disponibles :</strong></div><ul><li>Chef de projet (disponible 100%)</li><li>1 Développeur (disponible 100%)</li><li>1 Testeur (disponible 100%)</li></ul></div></div>",
      "questions": [
        {
          "question": "<p><strong>3.1</strong> Identifiez le chemin critique de ce projet et calculez sa durée totale.</p>",
          "reponse": "<p>Le chemin critique est la séquence de tâches qui détermine la durée minimale du projet.</p><p>Ici, toutes les tâches sont en série : A → B → C → D → E. Le chemin critique est donc A → B → C → D → E.</p><p>Durée totale = 2 + 3 + 5 + 2 + 1 = <strong>13 jours</strong>.</p>"
        },
        {
          "question": "<p><strong>3.2</strong> À l'aide de GanttProject, décrivez les étapes pour saisir les tâches, définir les dépendances (prédécesseurs) et affecter les ressources.</p>",
          "reponse": "<ol><li><strong>Créer un projet :</strong> Ouvrir GanttProject, créer un nouveau projet.</li><li><strong>Ajouter les tâches :</strong> Dans l'arbre des tâches, ajouter les tâches A, B, C, D, E avec leurs durées.</li><li><strong>Définir les dépendances :</strong> Pour chaque tâche (sauf A), définir un prédécesseur : B dépend de A, C dépend de B, etc. (lien Fin-Début par défaut).</li><li><strong>Créer les ressources :</strong> Aller dans l'onglet 'Ressources' et ajouter : Chef de projet, Développeur, Testeur.</li><li><strong>Affecter les ressources :</strong> Dans l'arbre des tâches, affecter des ressources à chaque tâche (par ex. Chef de projet sur A, Développeur sur C, etc.).</li></ol>"
        },
        {
          "question": "<p><strong>3.3</strong> GanttProject permet de générer deux diagrammes. Citez-les et expliquez brièvement leur utilité.</p>",
          "reponse": "<ul><li><strong>Diagramme de Gantt :</strong> Visualisation des tâches sous forme de barres horizontales sur un calendrier. Permet de visualiser la durée, le chevauchement et les dépendances des tâches.</li><li><strong>Diagramme de PERT (réseau) :</strong> Visualisation des dépendances entre les tâches sous forme de nœuds et de flèches. Permet d'identifier le chemin critique et les marges.</li></ul>"
        }
      ]
    },
    {
      "titre": "Réalisation d'un devis quantitatif sous Excel",
      "points": "5 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; line-height: 1.6; color: #333; background-color: #f9f9f9; padding: 15px; border-radius: 8px;'><p><strong>Contexte :</strong></p><p>Un client vous demande un devis quantitatif pour l'achat de 5 ordinateurs portables, 5 licences Microsoft Office, et l'installation d'un serveur.</p><div class='math-block' style='background-color: #eef2f7; padding: 12px; border-radius: 6px; margin: 10px 0;'><div class='math'><strong>Informations :</strong></div><ul><li>Ordinateur portable : 800 € l'unité</li><li>Licence Office : 120 € l'unité</li><li>Serveur (installation comprise) : 1500 €</li><li>TVA à 18 %</li></ul></div></div>",
      "questions": [
        {
          "question": "<p><strong>4.1</strong> Calculez le montant hors taxe (HT) de ce devis.</p>",
          "reponse": "<p>Montant HT = (5 × 800) + (5 × 120) + 1500 = 4000 + 600 + 1500 = <strong>6100 €</strong></p>"
        },
        {
          "question": "<p><strong>4.2</strong> Calculez le montant toutes taxes comprises (TTC).</p>",
          "reponse": "<p>Montant TTC = Montant HT + TVA = 6100 + (6100 × 18/100) = 6100 + 1098 = <strong>7198 €</strong></p>"
        },
        {
          "question": "<p><strong>4.3</strong> Expliquez la différence entre un devis quantitatif et un devis estimatif.</p>",
          "reponse": "<ul><li><strong>Devis quantitatif :</strong> Basé sur des quantités précises et des prix connus (ex : nombre d'unités).</li><li><strong>Devis estimatif :</strong> Approximatif, utilisé en phase d'avant-projet, lorsque les spécifications ne sont pas encore figées.</li></ul>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
