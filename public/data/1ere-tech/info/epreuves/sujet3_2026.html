<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Informatique",
  "classe": "1ère technique",
  "sequence": "Séquence 3",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Questions de cours (6 pts)",
      "points": "6 pts",
      "enonce": "<div style='font-size: 1em; line-height: 1.6; background-color: #f8f9fa; padding: 15px; border-radius: 8px; color: #212529;'><p>Répondez de manière claire et précise aux questions suivantes.</p></div>",
      "questions": [
        {
          "question": "1. (2 pts) Définissez les termes suivants en les illustrant par un exemple tiré de vos projets en spécialité :<br><br>a) (1 pt) Ressources matérielles :<br><br>b) (1 pt) Logiciel propriétaire :",
          "reponse": "a) Les ressources matérielles sont l'ensemble des composants physiques d'un système informatique, comme l'unité centrale, les périphériques, les câbles, etc. Exemple : Pour un projet de création de contenu, une ressource matérielle indispensable serait une carte graphique performante.<br><br>b) Un logiciel propriétaire est un logiciel dont l'utilisation, la modification ou la redistribution est restreinte par une licence. Exemple : Microsoft Windows."
        },
        {
          "question": "2. (2 pts) a) (1 pt) Citez et décrivez brièvement deux types d'imprimantes.<br><br>b) (1 pt) Expliquez l'intérêt de la mise à jour d'un antivirus.",
          "reponse": "a) <strong>Imprimante laser</strong> : Utilise un toner (poudre) et un faisceau laser pour imprimer. Elle est rapide et offre une bonne qualité pour les documents textes. <strong>Imprimante jet d'encre</strong> : Projette de minuscules gouttes d'encre sur le papier. Elle est polyvalente (texte, photo) mais plus lente.<br><br>b) La mise à jour d'un antivirus est cruciale car elle permet de mettre à jour sa base de données de signatures virales. Ainsi, le logiciel peut détecter et neutraliser les nouveaux virus et menaces qui apparaissent constamment."
        },
        {
          "question": "3. (2 pts) a) (1 pt) Citez un logiciel indispensable pour la réalisation d'un projet de dessin technique et précisez son rôle.<br><br>b) (1 pt) Qu'est-ce qu'une adresse IP ? Distinguez adressage statique et adressage dynamique.",
          "reponse": "a) <strong>Edraw</strong> : C'est un logiciel de dessin assisté par ordinateur (DAO) utilisé pour créer des diagrammes, des plans, des organigrammes, etc.<br><br>b) Une adresse IP est un numéro unique attribué à chaque appareil connecté à un réseau informatique. <strong>Adressage statique</strong> : L'adresse est configurée manuellement et ne change pas. <strong>Adressage dynamique</strong> : L'adresse est attribuée automatiquement par un serveur (DHCP) et peut changer."
        }
      ]
    },
    {
      "titre": "Exercice 2 : Sécurité et protection des données (4 pts)",
      "points": "4 pts",
      "enonce": "<div style='font-size: 1em; line-height: 1.6; background-color: #e7f3ff; padding: 15px; border-radius: 8px; color: #004085;'><p>Le contexte actuel exige une maîtrise des bonnes pratiques de sécurité informatique. Analysez la situation suivante.</p><p><i>Un employé d'une PME reçoit un email d'un inconnu contenant un lien vers un site web. Le site lui demande de saisir son mot de passe pour consulter un document important.</i></p></div>",
      "questions": [
        {
          "question": "1. (1,5 pts) a) (1 pt) D'après les principes fondamentaux de la sécurité informatique, quel est le risque principal encouru par l'employé s'il saisit ses informations ?<br><br>b) (0,5 pt) Proposez une bonne pratique pour éviter ce type de menace.",
          "reponse": "a) Le risque principal est une atteinte à la <strong>confidentialité</strong> de ses données. En communiquant son mot de passe, il pourrait donner accès à un pirate à ses comptes et à des informations sensibles.<br><br>b) Ne jamais cliquer sur des liens ou ouvrir des pièces jointes provenant d'expéditeurs inconnus, et toujours vérifier l'authenticité de la demande en contactant l'expéditeur par un autre moyen."
        },
        {
          "question": "2. (1 pt) Décrivez comment mettre en place une protection des données en utilisant un logiciel de cryptage comme AxCrypt.",
          "reponse": "Pour protéger des données avec AxCrypt, il faut d'abord installer le logiciel. Ensuite, on peut créer un mot de passe maître et sélectionner le dossier ou les fichiers à crypter. AxCrypt va alors chiffrer les fichiers, les rendant inaccessibles sans le mot de passe."
        },
        {
          "question": "3. (1,5 pts) a) (0,5 pt) Quels sont les deux types de comptes utilisateurs que l'on peut créer sur un système d'exploitation ?<br><br>b) (1 pt) Expliquez la différence entre ces deux types en termes de droits.",
          "reponse": "a) Les deux types sont : le compte <strong>administrateur</strong> et le compte <strong>standard</strong> (ou utilisateur).<br><br>b) Le compte <strong>administrateur</strong> dispose de tous les droits sur le système. Il peut installer des logiciels, modifier les paramètres système, créer et gérer d'autres comptes. Le compte <strong>standard</strong> a des droits limités. Il peut utiliser les applications installées et modifier ses propres paramètres, mais ne peut pas effectuer de modifications majeures sur le système."
        }
      ]
    },
    {
      "titre": "Exercice 3 : Réseaux et algorithmique (4 pts)",
      "points": "4 pts",
      "enonce": "<div style='font-size: 1em; line-height: 1.6; background-color: #d4edda; padding: 15px; border-radius: 8px; color: #155724;'><p>La maîtrise des réseaux et de l'algorithmique est un pilier de l'informatique technique. Répondez aux questions suivantes.</p></div>",
      "questions": [
        {
          "question": "1. (1,5 pts) Soit un réseau local (LAN) composé de 10 ordinateurs.<br><br>a) (0,75 pt) Citez et décrivez une topologie physique adaptée à ce réseau.<br><br>b) (0,75 pt) Quel équipement d'interconnexion est indispensable pour faire communiquer tous les ordinateurs ? Quel est son rôle ?",
          "reponse": "a) La topologie en <strong>étoile</strong> est adaptée. Dans cette topologie, chaque ordinateur est connecté à un équipement central (un commutateur ou un concentrateur). Toutes les communications passent par cet équipement central.<br><br>b) Un <strong>commutateur (switch)</strong> est indispensable. Son rôle est de recevoir les données d'un ordinateur et de les transmettre uniquement à l'ordinateur destinataire, ce qui optimise le trafic sur le réseau."
        },
        {
          "question": "2. (1 pt) En vous basant sur vos connaissances de l'algorigramme, écrivez un algorithme en pseudo-code qui calcule la somme des 10 premiers nombres entiers (de 1 à 10).",
          "reponse": "<pre style='background-color: #eee; padding: 10px; border-radius: 5px;'><code>Algorithme SommeDixNombres<br>Variables : i, somme en Entier<br>Début<br>    somme ← 0<br>    POUR i ALLANT DE 1 A 10<br>        somme ← somme + i<br>    FIN POUR<br>    Afficher somme<br>Fin</code></pre>"
        },
        {
          "question": "3. (1,5 pts) En vous aidant du cours sur les réseaux et les données.<br><br>a) (0,5 pt) Que signifie l'acronyme FTP ?<br><br>b) (1 pt) Dans un réseau, quelle est l'utilité d'un protocole ? Citez deux autres protocoles.",
          "reponse": "a) FTP signifie <strong>File Transfer Protocol</strong> (Protocole de transfert de fichiers).<br><br>b) Un protocole est un ensemble de règles qui définissent la manière dont les données sont transmises et échangées sur un réseau. Ils permettent à des équipements différents de communiquer. Deux autres protocoles : <strong>TCP/IP</strong> (qui régit la communication sur Internet) et <strong>SMTP</strong> (pour l'envoi d'emails)."
        }
      ]
    },
    {
      "titre": "Exercice 4 : Gestion de projet et Devis (6 pts)",
      "points": "6 pts",
      "enonce": "<div style='font-size: 1em; line-height: 1.6; background-color: #fff3cd; padding: 15px; border-radius: 8px; color: #856404;'><p>Vous devez, en tant que technicien, réaliser un devis quantitatif pour la mise en place d'un nouveau système informatique pour une PME.</p><p><b>Contexte :</b> L'entreprise souhaite acheter 5 postes de travail, 1 serveur, 2 imprimantes réseau et les logiciels de base.</p><table style='width:100%; border-collapse: collapse; background-color: #fff; color: #212529;'><tr style='background-color: #e9ecef;'><th style='border: 1px solid #dee2e6; padding: 8px; text-align: center;'>Désignation</th><th style='border: 1px solid #dee2e6; padding: 8px; text-align: center;'>Quantité</th><th style='border: 1px solid #dee2e6; padding: 8px; text-align: center;'>Prix Unitaire (FCFA)</th></tr><tr><td style='border: 1px solid #dee2e6; padding: 8px;'>Poste de travail</td><td style='border: 1px solid #dee2e6; padding: 8px; text-align: center;'>5</td><td style='border: 1px solid #dee2e6; padding: 8px; text-align: right;'>350 000</td></tr><tr><td style='border: 1px solid #dee2e6; padding: 8px;'>Serveur</td><td style='border: 1px solid #dee2e6; padding: 8px; text-align: center;'>1</td><td style='border: 1px solid #dee2e6; padding: 8px; text-align: right;'>750 000</td></tr><tr><td style='border: 1px solid #dee2e6; padding: 8px;'>Imprimante réseau</td><td style='border: 1px solid #dee2e6; padding: 8px; text-align: center;'>2</td><td style='border: 1px solid #dee2e6; padding: 8px; text-align: right;'>150 000</td></tr><tr><td style='border: 1px solid #dee2e6; padding: 8px;'>Suite bureautique (licence)</td><td style='border: 1px solid #dee2e6; padding: 8px; text-align: center;'>5</td><td style='border: 1px solid #dee2e6; padding: 8px; text-align: right;'>100 000</td></tr></table></div>",
      "questions": [
        {
          "question": "1. (2 pts) Complétez le tableau du devis en calculant les montants pour chaque ligne (quantité × prix unitaire) puis le montant total.",
          "reponse": "<table style='width:100%; border-collapse: collapse; background-color: #fff; color: #212529;'><tr style='background-color: #e9ecef;'><th style='border: 1px solid #dee2e6; padding: 8px; text-align: center;'>Désignation</th><th style='border: 1px solid #dee2e6; padding: 8px; text-align: center;'>Montant (FCFA)</th></tr><tr><td style='border: 1px solid #dee2e6; padding: 8px;'>Poste de travail (5 × 350 000)</td><td style='border: 1px solid #dee2e6; padding: 8px; text-align: right;'>1 750 000</td></tr><tr><td style='border: 1px solid #dee2e6; padding: 8px;'>Serveur (1 × 750 000)</td><td style='border: 1px solid #dee2e6; padding: 8px; text-align: right;'>750 000</td></tr><tr><td style='border: 1px solid #dee2e6; padding: 8px;'>Imprimante (2 × 150 000)</td><td style='border: 1px solid #dee2e6; padding: 8px; text-align: right;'>300 000</td></tr><tr><td style='border: 1px solid #dee2e6; padding: 8px;'>Suite bureautique (5 × 100 000)</td><td style='border: 1px solid #dee2e6; padding: 8px; text-align: right;'>500 000</td></tr><tr style='background-color: #f8f9fa; font-weight: bold;'><td style='border: 1px solid #dee2e6; padding: 8px;'>TOTAL</td><td style='border: 1px solid #dee2e6; padding: 8px; text-align: right;'>3 300 000</td></tr></table>"
        },
        {
          "question": "2. (1 pt) Dans le contexte d'un projet, qu'est-ce qu'une tâche ? Qu'est-ce qu'un chemin critique ?",

          "reponse": "a) Sous GanttProject, après avoir créé les tâches et les ressources, les diagrammes sont généralement <strong>générés automatiquement</strong> dans des onglets ou des vues dédiées du logiciel.<br><br>b) Le <strong>diagramme de Gantt</strong> permet une visualisation temporelle des tâches. Il est idéal pour le suivi de l'avancement. Le <strong>diagramme PERT</strong> se concentre sur les dépendances logiques entre les tâches. Il est utile pour identifier le chemin critique."

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
