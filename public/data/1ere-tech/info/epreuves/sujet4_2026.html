<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Informatique",
  "classe": "1ère technique",
  "sequence": "Séquence 4",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Ressources matérielles et logicielles",
      "points": "6 pts",
      "enonce": "<p>Pour mener à bien un projet informatique, il est essentiel de bien identifier les ressources matérielles et logicielles nécessaires. Ces ressources doivent être adaptées aux besoins spécifiques du projet.</p>",
      "questions": [
        {
          "question": "<p><strong>1) (1 pt)</strong> Définissez les termes suivants : ressources matérielles, ordinateur, périphérique.</p>",
          "reponse": "<p><strong>Ressources matérielles :</strong> Ensemble des composants physiques (matériels) nécessaires au fonctionnement d'un système informatique, incluant l'ordinateur et ses périphériques.<br><br><strong>Ordinateur :</strong> Machine électronique programmable capable de traiter des données et d'exécuter des programmes.<br><br><strong>Périphérique :</strong> Dispositif externe ou interne connecté à l'unité centrale, permettant d'ajouter des fonctions (entrée, sortie, stockage, communication) à l'ordinateur.</p>"
        },
        {
          "question": "<p><strong>2) (1,5 pt)</strong> Citez et décrivez trois types d'ordinateurs.</p>",
          "reponse": "<p>1. <strong>Ordinateur de bureau (Desktop)</strong> : ordinateur fixe conçu pour un usage sur un bureau, composé d'une unité centrale, d'un écran, d'un clavier et d'une souris. Puissant et facile à mettre à niveau.<br><br>2. <strong>Ordinateur portable (Laptop)</strong> : ordinateur compact et léger, intégrant tous les composants (écran, clavier, batterie) dans un seul bloc. Mobile et pratique pour les déplacements.<br><br>3. <strong>Tablette (Tablet PC)</strong> : appareil tactile avec un écran généralement entre 7 et 12 pouces, sans clavier physique intégré. Mobile et intuitive pour la consultation et les applications légères.</p>"
        },
        {
          "question": "<p><strong>3) (1,5 pt)</strong> Citez les périphériques par types (entrée, sortie, mixte, stockage, communication) en donnant un exemple pour chaque type.</p>",
          "reponse": "<p><strong>Entrée :</strong> Clavier, souris, scanner, microphone.<br><br><strong>Sortie :</strong> Écran (moniteur), imprimante, haut-parleurs.<br><br><strong>Mixte (entrée/sortie) :</strong> Écran tactile, casque audio avec microphone.<br><br><strong>Stockage :</strong> Disque dur externe, clé USB, carte mémoire.<br><br><strong>Communication :</strong> Modem, routeur, carte réseau (Wi-Fi/Ethernet).</p>"
        },
        {
          "question": "<p><strong>4) (2 pts)</strong> Expliquez la différence entre un logiciel système et un logiciel d'application, en donnant deux exemples pour chaque catégorie.</p>",
          "reponse": "<p><strong>Logiciel système :</strong> Il gère le fonctionnement de l'ordinateur et sert d'interface entre le matériel, les applications et l'utilisateur. <br>Exemples : Windows, macOS, Linux, Android.<br><br><strong>Logiciel d'application :</strong> Il permet à l'utilisateur d'effectuer des tâches spécifiques (bureautique, création, jeux). <br>Exemples : Microsoft Word (traitement de texte), Google Chrome (navigation web), Adobe Photoshop (graphisme), Gantt Project (gestion de projet).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Sécurité informatique et protection des données",
      "points": "7 pts",
      "enonce": "<p>La sécurité informatique est un enjeu majeur dans les organisations modernes. Elle vise à protéger les données, les systèmes et les réseaux contre les menaces.</p>",
      "questions": [
        {
          "question": "<p><strong>1) (2,5 pts)</strong> Énoncez les cinq principes fondamentaux de la sécurité informatique et expliquez brièvement chacun d'eux.</p>",
          "reponse": "<p><strong>1. Confidentialité :</strong> Garantir que les données ne sont accessibles qu'aux personnes autorisées (ex: cryptage, mots de passe).<br><br><strong>2. Intégrité :</strong> Assurer que les données ne sont pas altérées ou modifiées de manière non autorisée (ex: signatures numériques, sommes de contrôle).<br><br><strong>3. Disponibilité :</strong> Garantir que les données et les services sont accessibles en temps voulu par les utilisateurs autorisés (ex: redondance, sauvegardes).<br><br><strong>4. Non-répudiation :</strong> Empêcher une personne de nier avoir effectué une action (ex: logs, signatures électroniques).<br><br><strong>5. Authentification :</strong> Vérifier l'identité d'un utilisateur avant de lui donner accès (ex: mot de passe, biométrie, carte à puce).</p>"
        },
        {
          "question": "<p><strong>2) (1,5 pt)</strong> Décrivez deux techniques de protection des données et expliquez l'intérêt de la mise à jour régulière des antivirus.</p>",
          "reponse": "<p><strong>Cryptage :</strong> Technique qui consiste à transformer des données lisibles (texte clair) en données illisibles (texte chiffré) en utilisant une clé. Seules les personnes possédant la clé appropriée peuvent les lire.<br><br><strong>Compression avec chiffrement :</strong> Réduction de la taille des fichiers combinée à un cryptage pour les protéger lors du stockage ou du transfert.<br><br><strong>Mise à jour des antivirus :</strong> Permet de reconnaître et de neutraliser les nouvelles menaces (virus, malwares, ransomwares) qui apparaissent quotidiennement. Sans mise à jour, l'antivirus est inefficace contre les menaces récentes.</p>"
        },
        {
          "question": "<p><strong>3) (2 pts)</strong> Distinguez les types de comptes utilisateurs (administrateur, standard) et décrivez les principales étapes de gestion des comptes.</p>",
          "reponse": "<p><strong>Compte administrateur :</strong> Possède tous les droits sur le système (installation/logiciels, modification des paramètres système, création/suppression de comptes, accès à tous les fichiers). Il est réservé aux techniciens ou à l'utilisateur principal pour la maintenance.<br><br><strong>Compte standard :</strong> A des droits limités. L'utilisateur peut utiliser les applications et modifier ses propres fichiers, mais ne peut pas installer de logiciels ni modifier les paramètres système critiques.<br><br><strong>Étapes de gestion :</strong> Création (définir un nom et un mot de passe), modification (changer le mot de passe ou les droits d'accès), authentification (vérification de l'identité lors de la connexion).</p>"
        },
        {
          "question": "<p><strong>4) (1 pt)</strong> Citez deux mesures de protection de l'espace de travail numérique.</p>",
          "reponse": "<p>1. Utilisation de mots de passe forts et uniques pour chaque compte.<br>2. Sensibilisation des utilisateurs aux risques de phishing (hameçonnage).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Gestion de projet avec Gantt Project",
      "points": "7 pts",
      "enonce": "<p>Un projet est une succession d'étapes (tâches) pour atteindre un objectif spécifique. Les outils comme Gantt Project permettent de planifier et de suivre ces projets efficacement.</p>",
      "questions": [
        {
          "question": "<p><strong>1) (2 pts)</strong> Définissez les notions suivantes : Projet, Tâche, Ressource et Chemin critique.</p>",
          "reponse": "<p><strong>Projet :</strong> Un ensemble coordonné d'actions et d'activités, temporaires, visant à atteindre un objectif spécifique dans un délai et un budget définis.<br><br><strong>Tâche :</strong> Une activité élémentaire ou un travail à réaliser dans le cadre du projet. Chaque tâche a une durée et peut avoir des dépendances.<br><br><strong>Ressource :</strong> Les moyens humains, matériels, financiers et informationnels nécessaires à l'exécution des tâches du projet.<br><br><strong>Chemin critique :</strong> La séquence de tâches dépendantes qui détermine la durée minimale totale du projet. Tout retard sur une tâche critique retarde le projet entier.</p>"
        },
        {
          "question": "<p><strong>2) (1,5 pt)</strong> Expliquez la différence entre un diagramme de Gantt et un diagramme de PERT.</p>",
          "reponse": "<p><strong>Diagramme de Gantt :</strong> Représentation visuelle des tâches sur une échelle de temps (barres horizontales). Idéal pour le suivi de l'avancement et la visualisation du planning dans le temps.<br><br><strong>Diagramme de PERT (Program Evaluation and Review Technique) :</strong> Représentation sous forme de réseau (nœuds et flèches) des dépendances logiques entre les tâches. Permet d'identifier le chemin critique.</p>"
        },
        {
          "question": "<p><strong>3) (1,5 pt)</strong> Dans Gantt Project, décrivez brièvement comment on crée une tâche et comment on établit une relation de dépendance entre deux tâches.</p>",
          "reponse": "<p><strong>Création d'une tâche :</strong> On clique sur la ligne vide en bas de la liste des tâches ou sur le bouton \"Ajouter une tâche\" dans la barre d'outils. On saisit ensuite le nom, la durée, les dates de début et de fin.<br><br><strong>Établissement d'une dépendance :</strong> On sélectionne les deux tâches concernées (maintenir Ctrl puis cliquer). On utilise ensuite le bouton \"Lier les tâches\" ou le raccourci clavier. Le type de relation par défaut (fin-début) peut être modifié (début-début, fin-fin).</p>"
        },
        {
          "question": "<p><strong>4) (2 pts)</strong> Projet \"Installation d'un réseau\" : Les tâches A (2 jours), B (3 jours, dépend de A), C (4 jours, dépend de B), D (2 jours, dépend de C). Calculez la durée totale du projet et identifiez le chemin critique.</p>",
          "reponse": "<p><strong>Chemin critique :</strong> A → B → C → D<br><br><strong>Durée totale :</strong> 2 + 3 + 4 + 2 = <strong>11 jours</strong><br><br>Toutes les tâches sont sur le chemin critique car elles sont toutes dépendantes les unes des autres.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Création d'un devis sous MS Excel",
      "points": "5 pts",
      "enonce": "<p>Un devis quantitatif est un document qui présente de manière détaillée les quantités et les prix des éléments nécessaires à la réalisation d'un projet. MS Excel est un outil adapté pour en créer un.</p>",
      "questions": [
        {
          "question": "<p><strong>1) (1,5 pt)</strong> Définissez les trois notions suivantes : Devis, Devis estimatif, Devis quantitatif.</p>",
          "reponse": "<p><strong>Devis :</strong> Document écrit par un prestataire proposant une estimation détaillée du coût d'une prestation.<br><br><strong>Devis estimatif :</strong> Approximatif, basé sur des hypothèses en phase d'avant-projet.<br><br><strong>Devis quantitatif :</strong> Précis et détaillé avec les quantités et les prix unitaires pour chaque élément.</p>"
        },
        {
          "question": "<p><strong>2) (1 pt)</strong> Citez les quatre colonnes principales d'un devis quantitatif dans MS Excel.</p>",
          "reponse": "<p>Les colonnes principales sont : <strong>Désignation</strong> (description de l'élément), <strong>Quantité</strong>, <strong>Prix unitaire</strong> (coût par unité) et <strong>Montant</strong> (calculé automatiquement = Quantité × Prix unitaire).</p>"
        },
        {
          "question": "<p><strong>3) (1 pt)</strong> Comment la TVA est-elle calculée dans un devis ? Donnez la formule.</p>",
          "reponse": "<p>La TVA est un pourcentage appliqué sur le total Hors Taxe (HT). La formule de calcul est : <strong>Montant TVA = Total HT × Taux de TVA</strong>. Le total TTC = Total HT + Montant TVA.</p>"
        },
        {
          "question": "<p><strong>4) (1,5 pt)</strong> Décrivez les étapes pour délimiter une zone d'impression et lancer l'impression d'un tableau dans MS Excel.</p>",
          "reponse": "<p>Les étapes principales sont :<br>1. Sélectionner la plage de cellules à imprimer.<br>2. Aller dans le menu <strong>Mise en page</strong> ou <strong>Disposition de page</strong>.<br>3. Cliquer sur <strong>Zone d'impression</strong> puis <strong>Définir</strong>.<br>4. Pour imprimer, aller dans <strong>Fichier</strong> → <strong>Imprimer</strong> ou utiliser le raccourci <strong>Ctrl + P</strong> pour ouvrir l'aperçu et lancer l'impression.</p>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
