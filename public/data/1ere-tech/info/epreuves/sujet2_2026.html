<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Informatique",
  "classe": "1ère technique",
  "sequence": "Séquence 2",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Sécurité informatique et protection des données (5 points)",
      "points": "5 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; font-size: 1em; line-height: 1.6;'><p style='text-align: justify;'>La sécurité informatique est un enjeu majeur pour les entreprises et les particuliers. Elle repose sur des principes fondamentaux et des techniques de protection des données.</p><div style='background-color: #f8f9fa; padding: 12px; border-radius: 8px; margin: 15px 0; border-left: 4px solid #2980b9;'><p style='margin: 0; color: #1a5276;'><strong>Document :</strong> Dans une entreprise camerounaise, le service informatique a constaté plusieurs tentatives d'intrusion et des cas de perte de données sensibles. Le responsable souhaite renforcer la sécurité du système.</p></div></div>",
      "questions": [
        {
          "question": "<p><strong>1.</strong> Cite les cinq principes fondamentaux de la sécurité informatique.</p>",
          "reponse": "<p>Les cinq principes fondamentaux de la sécurité informatique sont :</p><ul style='list-style-type:disc; padding-left:20px;'><li><strong>Disponibilité</strong> : les données et les services doivent être accessibles quand on en a besoin.</li><li><strong>Intégrité</strong> : les données ne doivent pas être modifiées de manière non autorisée.</li><li><strong>Confidentialité</strong> : les données ne doivent être accessibles qu'aux personnes autorisées.</li><li><strong>Non-répudiation</strong> : une action effectuée ne peut pas être niée par son auteur.</li><li><strong>Authentification</strong> : vérification de l'identité de l'utilisateur avant de lui donner accès.</li></ul>"
        },
        {
          "question": "<p><strong>2.</strong> Décris deux techniques de protection des données que l'entreprise pourrait mettre en place.</p>",
          "reponse": "<p>Deux techniques de protection des données :</p><ul style='list-style-type:disc; padding-left:20px;'><li><strong>Le cryptage (chiffrement)</strong> : consiste à transformer les données en un format illisible sans la clé de déchiffrement. Même si les données sont interceptées, elles ne peuvent pas être comprises.</li><li><strong>La compression</strong> : permet de réduire la taille des fichiers pour faciliter leur stockage et leur transfert. Certains formats de compression (comme ZIP) peuvent aussi protéger les fichiers par mot de passe.</li></ul>"
        },
        {
          "question": "<p><strong>3.</strong> Explique l'intérêt de la mise à jour régulière d'un antivirus.</p>",
          "reponse": "<p>La mise à jour régulière d'un antivirus est essentielle car de nouveaux virus et programmes malveillants apparaissent chaque jour. Les mises à jour permettent d'ajouter les signatures des nouveaux virus dans la base de données de l'antivirus, de corriger les failles de sécurité et d'apporter de nouvelles fonctionnalités de protection. Sans mise à jour, l'antivirus ne peut pas détecter les menaces récentes.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Gestion des comptes utilisateurs (4 points)",
      "points": "4 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; font-size: 1em; line-height: 1.6;'><p style='text-align: justify;'>Dans un lycée technique de Yaoundé, plusieurs élèves partagent les ordinateurs de la salle informatique. L'administrateur du réseau souhaite mettre en place une gestion rigoureuse des comptes utilisateurs pour assurer la sécurité et la confidentialité des données.</p></div>",
      "questions": [
        {
          "question": "<p><strong>1.</strong> Distingue un compte Administrateur d'un compte Standard en précisant les droits de chacun.</p>",
          "reponse": "<p><strong>Compte Administrateur :</strong> dispose de tous les droits sur l'ordinateur. Il peut installer et désinstaller des logiciels, créer, modifier et supprimer des comptes, modifier les paramètres système et accéder à tous les fichiers.</p><p><strong>Compte Standard :</strong> a des droits limités. Il peut utiliser les logiciels installés, gérer ses propres fichiers et changer son mot de passe, mais ne peut pas installer de logiciels, modifier les paramètres système ni accéder aux fichiers des autres utilisateurs.</p>"
        },
        {
          "question": "<p><strong>2.</strong> Décris les étapes pour créer un compte utilisateur dans un environnement Windows.</p>",
          "reponse": "<p>Les étapes pour créer un compte utilisateur sous Windows sont :</p><ol style='padding-left:20px;'><li>Ouvrir le <strong>Panneau de configuration</strong></li><li>Aller dans <strong>Comptes d'utilisateurs</strong></li><li>Choisir <strong>Gérer un autre compte</strong></li><li>Cliquer sur <strong>Ajouter un nouvel utilisateur</strong></li><li>Saisir le <strong>nom d'utilisateur</strong></li><li>Choisir le <strong>type de compte</strong> (Administrateur ou Standard)</li><li>Définir un <strong>mot de passe</strong> sécurisé</li></ol>"
        },
        {
          "question": "<p><strong>3.</strong> Propose des règles pour créer un mot de passe fort.</p>",
          "reponse": "<p>Pour créer un mot de passe fort :</p><ul style='list-style-type:disc; padding-left:20px;'><li>Utiliser au moins <strong>12 caractères</strong></li><li>Inclure des <strong>majuscules</strong> et des <strong>minuscules</strong></li><li>Ajouter des <strong>chiffres</strong></li><li>Ajouter des <strong>symboles</strong> (!@#$%^&*)</li><li>Éviter les mots du dictionnaire, les dates de naissance et les noms de famille</li></ul>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Algorithmique et structures de contrôle (6 points)",
      "points": "6 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; font-size: 1em; line-height: 1.6;'><p style='text-align: justify;'>Un élève de 1ère technique doit concevoir un algorithme pour gérer les notes d'une classe. L'algorithme doit permettre de saisir les notes, de calculer la moyenne et d'afficher si l'élève est admis ou non (admis si la moyenne est supérieure ou égale à 10/20).</p></div>",
      "questions": [
        {
          "question": "<p><strong>1.</strong> Écris un algorithme en langage naturel qui permet de saisir 5 notes, de calculer leur moyenne et d'afficher le résultat 'Admis' ou 'Non admis'.</p>",
          "reponse": "<div style='background-color:#2c3e50; color:#ecf0f1; padding:12px; border-radius:6px; font-family:monospace; font-size:0.9em;'><pre style='margin:0;'>Début<br>  somme = 0<br>  POUR i DE 1 À 5<br>    Lire note<br>    somme = somme + note<br>  FIN POUR<br>  moyenne = somme / 5<br>  SI moyenne >= 10 ALORS<br>    Afficher 'Admis'<br>  SINON<br>    Afficher 'Non admis'<br>  FIN SI<br>Fin</pre></div>"
        },
        {
          "question": "<p><strong>2.</strong> Identifie les structures de contrôle utilisées dans ton algorithme et précise leur rôle.</p>",
          "reponse": "<p>Les structures de contrôle utilisées sont :</p><ul style='list-style-type:disc; padding-left:20px;'><li><strong>Structure itérative (POUR)</strong> : permet de répéter 5 fois la saisie des notes et l'addition à la somme.</li><li><strong>Structure alternative (SI...ALORS...SINON)</strong> : permet de prendre une décision en fonction de la moyenne (Admis ou Non admis).</li><li><strong>Structure séquentielle</strong> : les instructions sont exécutées dans l'ordre (initialisation, boucle, calcul, test, affichage).</li></ul>"
        },
        {
          "question": "<p><strong>3.</strong> Trace l'exécution de cet algorithme pour les notes suivantes : 12, 8, 15, 10, 14.</p>",
          "reponse": "<p>Exécution pas à pas :</p><ul style='list-style-type:disc; padding-left:20px;'><li>somme = 0</li><li>i=1 : note=12, somme=0+12=12</li><li>i=2 : note=8, somme=12+8=20</li><li>i=3 : note=15, somme=20+15=35</li><li>i=4 : note=10, somme=35+10=45</li><li>i=5 : note=14, somme=45+14=59</li><li>moyenne = 59/5 = 11.8</li><li>moyenne >= 10 → Vrai</li><li>Résultat affiché : 'Admis'</li></ul>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Architecture et topologies des réseaux (5 points)",
      "points": "5 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; font-size: 1em; line-height: 1.6;'><p style='text-align: justify;'>Une entreprise souhaite mettre en place un réseau informatique pour relier ses différents services. Elle dispose de 3 bâtiments : un bâtiment principal (administration) et deux bâtiments secondaires (ateliers).</p></div>",
      "questions": [
        {
          "question": "<p><strong>1.</strong> Cite les différents types de réseaux en fonction de leur étendue géographique et indique lequel est le plus adapté pour relier les 3 bâtiments de l'entreprise.</p>",
          "reponse": "<p>Types de réseaux :</p><ul style='list-style-type:disc; padding-left:20px;'><li><strong>LAN (Local Area Network)</strong> : réseau local, couvre une zone limitée (bâtiment, école)</li><li><strong>MAN (Metropolitan Area Network)</strong> : réseau métropolitain, couvre une ville ou plusieurs bâtiments dans une ville</li><li><strong>WAN (Wide Area Network)</strong> : réseau étendu, couvre plusieurs pays ou continents</li></ul><p>Pour relier les 3 bâtiments dans la même ville, le <strong>MAN</strong> est le plus adapté.</p>"
        },
        {
          "question": "<p><strong>2.</strong> Décris l'architecture client/serveur et donne ses avantages.</p>",
          "reponse": "<p>L'architecture <strong>client/serveur</strong> est une architecture réseau où :</p><ul style='list-style-type:disc; padding-left:20px;'><li>Un <strong>serveur</strong> centralise les ressources et les données</li><li>Les <strong>clients</strong> (ordinateurs des utilisateurs) se connectent au serveur pour accéder aux ressources</li></ul><p><strong>Avantages :</strong></p><ul style='list-style-type:disc; padding-left:20px;'><li>Sécurité renforcée (données centralisées)</li><li>Sauvegarde simplifiée</li><li>Gestion centralisée des comptes et des droits</li><li>Meilleure performance</li></ul>"
        },
        {
          "question": "<p><strong>3.</strong> Cite les équipements nécessaires pour interconnecter les ordinateurs de l'entreprise.</p>",
          "reponse": "<p>Les équipements nécessaires sont :</p><ul style='list-style-type:disc; padding-left:20px;'><li><strong>Hôtes</strong> : ordinateurs, serveurs, imprimantes réseau</li><li><strong>Équipements d'interconnexion</strong> : switch (pour connecter les ordinateurs au sein du même réseau), routeur (pour connecter plusieurs réseaux), câbles réseau, point d'accès Wi-Fi</li></ul>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
