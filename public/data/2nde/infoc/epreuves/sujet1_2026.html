<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>
    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }
    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }
    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }
    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }
    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }
    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }
    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }
    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }
    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }
    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }
    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }
    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }
    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }
    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }
    .exercise-statement .math {
        color: #1e40af;
    }
    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }
    .question-block.revealed {
        border-left-color: #059669;
    }
    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }
    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }
    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }
    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }
    .question-answer .math {
        color: #065f46;
    }
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }
    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }
    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }
    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }
    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }
    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }
    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }
    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }
    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }
    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }
    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }
    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }
    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }
    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }
    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }
    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>
<div class="app-container">
    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>
    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>
    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>
        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>
<script>
$(function() {
    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Informatique",
  "classe": "Seconde C",
  "sequence": "Séquence 1",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Intelligence Artificielle (7 pts)",
      "points": "7 pts",
      "enonce": "<div class='exercise-block'><p><strong>Situation problème :</strong></p><p>Ton groupe de travail doit préparer un exposé sur <strong>la ville de Douala</strong> pour le cours de géographie. Vous devez rédiger un texte de présentation, créer une affiche illustrée et traduire un résumé en anglais pour le professeur de langues. Pour vous aider, vous décidez d'utiliser des outils d'intelligence artificielle. Cependant, votre professeur d'informatique vous rappelle que l'IA peut se tromper et qu'il faut l'utiliser de manière responsable.</p><p><em>À l'aide de cette situation et de tes connaissances, réponds aux questions suivantes :</em></p></div>",
      "questions": [
        {
          "question": "<p><strong>1. Principes d'apprentissage (2,5 pts)</strong></p><p>a) (0,5 pt) Définis l'expression : <strong>Données d'entraînement</strong>.</p><p>b) (0,5 pt) Qu'est-ce qu'un <strong>modèle</strong> en intelligence artificielle ?</p><p>c) (1 pt) Cite dans l'ordre les cinq (05) étapes de l'apprentissage automatique d'une IA.</p><p>d) (0,5 pt) Donne une différence entre un <strong>programme à règles fixes</strong> et un <strong>programme qui apprend</strong>.</p>",
          "reponse": "<p><strong>a) (0,5 pt)</strong> Les <strong>données d'entraînement</strong> sont l'ensemble des informations (exemples, images, textes, sons, chiffres) que l'on donne à une IA pour qu'elle apprenne à accomplir une tâche.</p><p><strong>b) (0,5 pt)</strong> Le <strong>modèle</strong> est le résultat de l'apprentissage. C'est le « cerveau » de l'IA, une structure informatique construite à partir des données d'entraînement qui permet de faire des prédictions.</p><p><strong>c) (1 pt)</strong> Les cinq étapes de l'apprentissage automatique sont :</p><ol><li>Collecte des données</li><li>Préparation des données</li><li>Entraînement du modèle</li><li>Évaluation du modèle</li><li>Utilisation (déploiement)</li></ol><p><strong>d) (0,5 pt)</strong> Dans un <strong>programme à règles fixes</strong>, le programmeur écrit toutes les règles à l'avance et la machine ne les modifie jamais. Dans un <strong>programme qui apprend</strong>, le programmeur donne des exemples et la machine découvre les règles elle-même à partir des données.</p>"
        },
        {
          "question": "<p><strong>2. Choix d'un outil IA (1,5 pt)</strong></p><p>Ton groupe doit rédiger un texte, créer une affiche et traduire un résumé en anglais.</p><p>a) (0,5 pt) Identifie les trois (03) familles d'outils IA adaptées à ces tâches.</p><p>b) (1 pt) Cite un (01) outil IA pour chacune des trois familles identifiées.</p>",
          "reponse": "<p><strong>a) (0,5 pt)</strong> Les trois familles d'outils IA adaptées sont :</p><ul><li>La famille <strong>« écrire »</strong> (pour rédiger le texte de l'exposé).</li><li>La famille <strong>« dessiner »</strong> (pour créer l'affiche).</li><li>La famille <strong>« traduire »</strong> (pour traduire le résumé en anglais).</li></ul><p><strong>b) (1 pt)</strong> Exemples d'outils IA :</p><ul><li>Pour écrire : <strong>ChatGPT</strong>, Gemini, Claude, Copilot.</li><li>Pour dessiner : <strong>DALL·E</strong>, Midjourney, Canva IA.</li><li>Pour traduire : <strong>DeepL</strong>, Google Translate.</li></ul>"
        },
        {
          "question": "<p><strong>3. Vérification d'une production IA (1,5 pt)</strong></p><p>En utilisant l'IA, ton groupe obtient un texte qui affirme que « la ville de Douala a été fondée en 1472 par les Portugais ». Tu as un doute sur cette information.</p><p>a) (0,5 pt) Définis l'expression : <strong>Hallucination d'une IA</strong>.</p><p>b) (1 pt) Cite deux (02) types d'erreurs que peut produire une IA et donne un exemple pour chacun.</p>",
          "reponse": "<p><strong>a) (0,5 pt)</strong> Une <strong>hallucination d'IA</strong> est une information inventée par une intelligence artificielle qui semble crédible mais qui est en réalité fausse ou non vérifiable. L'IA ne sait pas qu'elle ne sait pas.</p><p><strong>b) (1 pt)</strong> Deux types d'erreurs :</p><ul><li><strong>Erreurs factuelles :</strong> dates, noms ou événements inventés ou déformés. <em>Exemple : une IA affirme que la ville de Douala a été fondée en 1472 par les Portugais, alors que cette information est fausse.</em></li><li><strong>Erreurs de calcul :</strong> résultats faux, étapes incohérentes. <em>Exemple : l'IA affirme que la valeur absolue de -5 est -5, alors que |-5| = 5.</em></li></ul><p>On peut aussi citer les erreurs logiques et les erreurs de source.</p>"
        },
        {
          "question": "<p><strong>4. Charte d'usage responsable (1,5 pt)</strong></p><p>Avant d'utiliser l'IA pour votre exposé, votre professeur vous demande de respecter la charte d'usage de la classe.</p><p>a) (0,5 pt) Définis l'expression : <strong>Charte d'usage</strong>.</p><p>b) (0,5 pt) Cite deux (02) cas où l'utilisation de l'IA est autorisée à l'école.</p><p>c) (0,5 pt) Cite deux (02) cas où l'utilisation de l'IA est interdite à l'école.</p>",
          "reponse": "<p><strong>a) (0,5 pt)</strong> Une <strong>charte d'usage</strong> est un document écrit qui fixe les règles à respecter par tous les membres d'un groupe concernant l'utilisation d'un outil ou d'un service. Elle précise ce qui est autorisé, ce qui est interdit, et comment citer l'outil.</p><p><strong>b) (0,5 pt)</strong> L'IA est autorisée à l'école pour :</p><ul><li><strong>S'aider à comprendre</strong> une leçon difficile.</li><li><strong>Chercher des idées</strong> pour un exposé ou un projet.</li></ul><p><strong>c) (0,5 pt)</strong> L'IA est interdite à l'école pour :</p><ul><li><strong>Copier-coller</strong> une réponse de l'IA et la présenter comme son propre travail.</li><li><strong>Tricher</strong> pendant une évaluation ou un examen.</li></ul>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Architecture d'un micro-ordinateur (7 pts)",
      "points": "7 pts",
      "enonce": "<div class='exercise-block'><p><strong>Situation problème :</strong></p><p>Le club informatique de ton établissement a reçu un don de cinq ordinateurs de bureau. Avant de les installer dans la salle informatique, le proviseur te demande, en tant que membre du club, de vérifier les ports disponibles à l'arrière de chaque unité centrale et d'identifier les composants internes de ces machines. Tu dois ensuite expliquer aux autres élèves comment connecter correctement les périphériques.</p><p><em>À l'aide de cette situation et de tes connaissances, réponds aux questions suivantes :</em></p></div>",
      "questions": [
        {
          "question": "<p><strong>1. Les ports d'un ordinateur (3,5 pts)</strong></p><p>a) (0,5 pt) Définis le terme : <strong>Port</strong>.</p><p>b) (0,5 pt) Donne une différence entre un <strong>port externe</strong> et un <strong>port interne</strong>.</p><p>c) (2 pts) Associe chaque port à sa fonction :</p><p>• <strong>USB</strong> • <strong>HDMI</strong> • <strong>RJ45</strong> • <strong>Jack</strong></p><p>d) (0,5 pt) Cite deux (02) exemples de ports internes.</p>",
          "reponse": "<p><strong>a) (0,5 pt)</strong> Un <strong>port</strong> est une interface qui permet de connecter des périphériques (clavier, souris, écran, imprimante, etc.) à un ordinateur.</p><p><strong>b) (0,5 pt)</strong> Un <strong>port externe</strong> se trouve à l'arrière ou sur le côté de l'unité centrale et permet de connecter des périphériques externes. Un <strong>port interne</strong> se trouve sur la carte mère, à l'intérieur de l'unité centrale, et sert à connecter les composants internes.</p><p><strong>c) (2 pts)</strong></p><ul><li><strong>USB (Universal Serial Bus) :</strong> Port le plus polyvalent. Connecte clavier, souris, imprimante, clé USB.</li><li><strong>HDMI (High-Definition Multimedia Interface) :</strong> Transmet l'image et le son en haute définition.</li><li><strong>RJ45 (Ethernet) :</strong> Connecte l'ordinateur au réseau Internet via un câble réseau.</li><li><strong>Jack (prise audio 3,5 mm) :</strong> Connecte un casque, des haut-parleurs ou un microphone.</li></ul><p><strong>d) (0,5 pt)</strong> Deux exemples de ports internes : <strong>PCI</strong> et <strong>SATA</strong> (on peut aussi citer AGP et IDE).</p>"
        },
        {
          "question": "<p><strong>2. Les composants internes (2 pts)</strong></p><p>Pour expliquer le fonctionnement des ordinateurs aux autres élèves, tu dois décrire le rôle de chaque composant interne.</p><p>Donne le rôle de chacun des composants suivants :</p><p>a) (0,5 pt) Le <strong>disque dur</strong> ;</p><p>b) (0,5 pt) Le <strong>processeur (CPU)</strong> ;</p><p>c) (0,5 pt) La <strong>mémoire RAM</strong> ;</p><p>d) (0,5 pt) Les <strong>cartes d'extension</strong>.</p>",
          "reponse": "<p><strong>a) (0,5 pt) Disque dur :</strong> Stocke les données de manière permanente, même lorsque l'ordinateur est éteint.</p><p><strong>b) (0,5 pt) Processeur (CPU) :</strong> C'est le cerveau de l'ordinateur. Il exécute les instructions des programmes et effectue les calculs.</p><p><strong>c) (0,5 pt) Mémoire RAM :</strong> Mémoire de travail qui stocke temporairement les données pour un accès rapide par le processeur. Elle est volatile.</p><p><strong>d) (0,5 pt) Cartes d'extension :</strong> Ajoutent des fonctionnalités à l'ordinateur (son, réseau, graphismes).</p>"
        },
        {
          "question": "<p><strong>3. Caractéristiques (1,5 pt)</strong></p><p>Le proviseur souhaite connaître les caractéristiques techniques des ordinateurs pour savoir s'ils sont performants.</p><p>a) (0,5 pt) Cite deux (02) caractéristiques du <strong>disque dur</strong>.</p><p>b) (0,5 pt) Cite deux (02) caractéristiques du <strong>processeur</strong>.</p><p>c) (0,5 pt) Cite deux (02) caractéristiques de la <strong>RAM</strong>.</p>",
          "reponse": "<p><strong>a) (0,5 pt) Caractéristiques du disque dur :</strong></p><ul><li><strong>Capacité :</strong> quantité de données stockables, exprimée en Go ou To.</li><li><strong>Vitesse de rotation :</strong> vitesse en tours par minute (tr/min).</li></ul><p><strong>b) (0,5 pt) Caractéristiques du processeur :</strong></p><ul><li><strong>Fréquence :</strong> mesurée en Gigahertz (GHz).</li><li><strong>Marque :</strong> Intel ou AMD.</li></ul><p><strong>c) (0,5 pt) Caractéristiques de la RAM :</strong></p><ul><li><strong>Capacité :</strong> exprimée en Go.</li><li><strong>Débit :</strong> quantité de données transférées par seconde.</li></ul>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Les logiciels (6 pts)",
      "points": "6 pts",
      "enonce": "<div class='exercise-block'><p><strong>Situation problème :</strong></p><p>Pour la rentrée, tes parents t'offrent un nouvel ordinateur portable. Cependant, il ne contient que le système d'exploitation Windows. Pour tes cours, tu as besoin d'un texteur pour rédiger tes devoirs, d'un navigateur pour faire des recherches et d'un antivirus pour protéger tes données. Ton oncle, informaticien, te propose de t'aider à installer ces logiciels, mais il te demande d'abord de lui expliquer ce que tu sais sur les logiciels.</p><p><em>À l'aide de cette situation et de tes connaissances, réponds aux questions suivantes :</em></p></div>",

          "reponse": "<p><strong>a) (1 pt)</strong> Un <strong>logiciel</strong> est un ensemble de programmes, de procédures et de règles qui permettent à un ordinateur d'exécuter des tâches spécifiques.</p><p><strong>b) (1 pt)</strong> Un <strong>logiciel système</strong> gère le fonctionnement de l'ordinateur (ex : Windows, Linux). Un <strong>logiciel d'application</strong> permet d'effectuer des tâches spécifiques (ex : Microsoft Word, Google Chrome).</p><p><strong>c) (0,5 pt)</strong> Deux exemples de logiciels d'application : <strong>Microsoft Word</strong> (texteur) et <strong>Google Chrome</strong> (navigateur).</p>"
        },
        {
          "question": "<p><strong>2. Modes d'obtention (1,5 pt)</strong></p><p>Ton oncle te demande quel type de logiciel tu préfères installer : un logiciel payant ou un logiciel gratuit ?</p><p>Cite trois (03) modes d'obtention d'un logiciel et donne une caractéristique pour chacun.</p>",
          "reponse": "<p>Trois modes d'obtention :</p><ul><li><strong>Propriétaire :</strong> payant, code source non accessible. <em>Exemple : Microsoft Office.</em></li><li><strong>Freeware (gratuiciel) :</strong> gratuit mais code source non accessible. <em>Exemple : Skype.</em></li><li><strong>Open Source (logiciel libre) :</strong> gratuit et code source accessible. <em>Exemple : Linux, LibreOffice.</em></li></ul><p>On peut aussi citer le <strong>Shareware (partagiciel)</strong> : gratuit pour un essai limité (ex : WinRAR).</p>"

        {
          "question": "<p><strong>3. Installation et désinstallation (2 pts)</strong></p><p>Ton oncle te montre comment installer un logiciel. Plus tard, tu souhaites désinstaller un logiciel que tu n'utilises plus.</p><p>a) (1 pt) Cite les trois (03) étapes pour installer un logiciel à partir d'Internet.</p><p>b) (1 pt) Cite les trois (03) premières étapes pour désinstaller un logiciel sous Windows.</p>",
          "reponse": "<p><strong>a) (1 pt)</strong> Les trois étapes pour installer un logiciel à partir d'Internet :</p><ol><li>Télécharger le fichier d'installation depuis un site officiel.</li><li>Exécuter le fichier téléchargé.</li><li>Suivre les instructions de l'assistant d'installation.</li></ol><p><strong>b) (1 pt)</strong> Les trois premières étapes pour désinstaller un logiciel sous Windows :</p><ol><li>Ouvrir le <strong>Panneau de configuration</strong>.</li><li>Cliquer sur <strong>Programmes et fonctionnalités</strong> (ou Ajouter/Supprimer des programmes).</li><li>Sélectionner le logiciel à désinstaller et cliquer sur <strong>Désinstaller</strong>.</li></ol>"

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};
    const totalExercises = examData.exercices.length;
    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');
    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;
        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);
        // Construire le contenu
        let html = '';
        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;
        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;
            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });
        html += `</div>`;
        $body.html(html);
        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);
        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }
        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }
    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }
        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;
        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);
        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }
    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }
    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }
    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }
    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }
    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }
    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });
        // Afficher le premier exercice
        renderExercise(0);
        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);
        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }
    init();
});
</script>
