<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>
    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }
    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }
    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }
    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }
    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }
    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }
    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }
    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }
    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }
    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }
    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }
    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }
    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }
    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }
    .exercise-statement .math {
        color: #1e40af;
    }
    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }
    .question-block.revealed {
        border-left-color: #059669;
    }
    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }
    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }
    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }
    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }
    .question-answer .math {
        color: #065f46;
    }
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }
    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }
    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }
    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }
    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }
    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }
    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }
    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }
    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }
    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }
    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }
    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }
    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }
    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }
    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }
    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>
<div class="app-container">
    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>
    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>
    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>
        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>
<script>
$(function() {
    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Informatique",
  "classe": "Troisième",
  "sequence": "Séquence 1",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Architecture d'un micro-ordinateur (4 pts)",
      "points": "4 pts",
      "enonce": "<div class='exercise-block'><p>Cet exercice porte sur l'architecture et les composants d'un micro-ordinateur.</p></div>",
      "questions": [
        {
          "question": "<p><strong>1. Définition et rôle des composants (2 pts)</strong></p><p>a) (1 pt) Définis le terme <strong>Bus</strong>.</p><p>b) (1 pt) Donne le rôle du <strong>processeur (CPU)</strong> et de la <strong>mémoire RAM</strong> dans un micro-ordinateur.</p>",
          "reponse": "<p><strong>a) (1 pt)</strong> Le <strong>Bus</strong> est une voie de communication qui permet aux différents composants de l'ordinateur d'échanger des données entre eux. Il en existe trois types : le bus de données, le bus d'adresses et le bus de contrôle.</p><p><strong>b) (1 pt)</strong></p><ul><li><strong>Processeur (CPU) :</strong> C'est le cerveau de l'ordinateur. Il exécute les instructions des programmes et effectue tous les calculs.</li><li><strong>Mémoire RAM :</strong> C'est la mémoire vive de l'ordinateur. Elle stocke temporairement les données et les programmes en cours d'utilisation. Elle est volatile (son contenu est effacé quand on éteint l'ordinateur).</li></ul>"
        },
        {
          "question": "<p><strong>2. Architectures RISC et CISC (1 pt)</strong></p><p>Donne une différence entre l'architecture <strong>RISC</strong> et l'architecture <strong>CISC</strong>.</p>",
          "reponse": "<p>L'architecture <strong>RISC</strong> (Reduced Instruction Set Computer) utilise un jeu d'instructions réduit et simplifié, ce qui la rend plus rapide et moins énergivore. L'architecture <strong>CISC</strong> (Complex Instruction Set Computer) utilise un jeu d'instructions complexe et étendu, ce qui la rend plus puissante mais plus lente et plus consommatrice d'énergie. Exemples : ARM pour RISC, Intel x86 et AMD pour CISC.</p>"
        },
        {
          "question": "<p><strong>3. Maintenance informatique (1 pt)</strong></p><p>Détermine le type de maintenance informatique correspondant à chacune des actions suivantes :</p><p>a) (0,5 pt) Installer une mise à jour de sécurité pour le système d'exploitation.</p><p>b) (0,5 pt) Remplacer un disque dur qui a cessé de fonctionner.</p>",
          "reponse": "<p><strong>a) (0,5 pt)</strong> Il s'agit de la <strong>maintenance préventive</strong>, car on agit avant que la panne ne survienne pour éviter les problèmes de sécurité.</p><p><strong>b) (0,5 pt)</strong> Il s'agit de la <strong>maintenance corrective</strong>, car on intervient après une panne pour rétablir le fonctionnement de l'ordinateur.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Les composants du micro-ordinateur (4 pts)",
      "points": "4 pts",
      "enonce": "<div class='exercise-block'><p>Cet exercice permet de vérifier vos connaissances sur les composants internes d'un ordinateur.</p></div>",
      "questions": [
        {
          "question": "<p><strong>1. Composants principaux (2 pts)</strong></p><p>Cite quatre (04) composants principaux d'un micro-ordinateur.</p>",
          "reponse": "<p>Les quatre composants principaux d'un micro-ordinateur sont :</p><ol><li>Le processeur (CPU)</li><li>La mémoire RAM</li><li>La carte mère</li><li>Le disque dur (HDD ou SSD)</li></ol><p>On peut également citer : le boîtier d'alimentation, les bus et la ROM.</p>"
        },
        {
          "question": "<p><strong>2. Rôle de la carte mère (1 pt)</strong></p><p>Donne le rôle de la <strong>carte mère</strong> dans un ordinateur.</p>",
          "reponse": "<p>La <strong>carte mère</strong> est le squelette de l'ordinateur. C'est la grande carte électronique sur laquelle sont connectés tous les autres composants (processeur, RAM, disques durs, cartes d'extension). Elle permet de relier tous les composants entre eux, de permettre leur communication et de distribuer l'énergie électrique.</p>"
        },
        {
          "question": "<p><strong>3. Disque dur HDD et SSD (1 pt)</strong></p><p>Donne une différence entre un disque dur <strong>HDD</strong> et un disque dur <strong>SSD</strong>.</p>",
          "reponse": "<p>Le disque dur <strong>HDD</strong> (Hard Disk Drive) stocke les données sur des plateaux magnétiques en rotation. Il est moins cher et offre une grande capacité de stockage, mais il est plus lent. Le disque dur <strong>SSD</strong> (Solid State Drive) stocke les données sur des puces électroniques. Il est beaucoup plus rapide, plus résistant aux chocs, mais plus cher à capacité égale.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Identification des composants (5 pts)",
      "points": "5 pts",
      "enonce": "<div class='exercise-block'><p>Observe attentivement chaque image ci-dessous et identifie le composant d'ordinateur représenté. Explique ensuite brièvement son rôle.</p></div>",
      "questions": [
        {
          "question": "<p><strong>1. Identification n°1 (1,5 pt)</strong></p><p>Observe l'image ci-dessous et réponds aux questions :</p><p style='text-align:center; margin: 10px 0;'><img src='' alt='Processeur (CPU)' style='max-width:180px; border-radius:8px;'></p><p>a) (0,5 pt) Quel est le nom de ce composant ?</p><p>b) (1 pt) Quel est son rôle dans l'ordinateur ?</p>",
          "reponse": "<p><strong>a) (0,5 pt)</strong> Ce composant est le <strong>processeur</strong>, aussi appelé <strong>CPU</strong> (Central Processing Unit).</p><p><strong>b) (1 pt)</strong> Le processeur est le <strong>cerveau de l'ordinateur</strong>. Il exécute toutes les instructions des programmes, effectue les calculs arithmétiques et logiques, et contrôle les autres composants de l'ordinateur. Plus le processeur est puissant (fréquence en GHz et nombre de cœurs élevés), plus l'ordinateur est rapide.</p>"
        },
        {
          "question": "<p><strong>2. Identification n°2 (1,5 pt)</strong></p><p>Observe l'image ci-dessous et réponds aux questions :</p><p style='text-align:center; margin: 10px 0;'><img src='' alt='Barrette de mémoire RAM' style='max-width:180px; border-radius:8px;'></p><p>a) (0,5 pt) Quel est le nom de ce composant ?</p><p>b) (1 pt) Quel est son rôle ? Que se passe-t-il quand on éteint l'ordinateur ?</p>",
          "reponse": "<p><strong>a) (0,5 pt)</strong> Ce composant est une <strong>barrette de mémoire RAM</strong> (Random Access Memory), ou mémoire vive.</p><p><strong>b) (1 pt)</strong> La RAM est la <strong>mémoire de travail</strong> de l'ordinateur. Elle stocke temporairement les données et les programmes en cours d'utilisation pour que le processeur puisse y accéder très rapidement. La RAM est <strong>volatile</strong> : quand on éteint l'ordinateur, toutes les données qu'elle contient sont <strong>effacées</strong>. Plus il y a de RAM, plus on peut ouvrir d'applications en même temps.</p>"
        },
        {
          "question": "<p><strong>3. Identification n°3 (1 pt)</strong></p><p>Observe l'image ci-dessous et réponds à la question :</p><p style='text-align:center; margin: 10px 0;'><img src='' alt='Carte mère' style='max-width:180px; border-radius:8px;'></p><p>Quel est le nom de ce composant ? Quel est son rôle principal ?</p>",
          "reponse": "<p>Ce composant est la <strong>carte mère</strong> (ou motherboard). C'est la grande carte électronique sur laquelle sont connectés tous les autres composants (processeur, RAM, disques durs, cartes d'extension). Son rôle principal est de <strong>relier tous les composants entre eux</strong>, de permettre leur communication et de distribuer l'énergie électrique. Elle détermine aussi quels types de composants peuvent être installés.</p>"
        },
        {
          "question": "<p><strong>4. Identification n°4 (1 pt)</strong></p><p>Observe les deux images ci-dessous et réponds à la question :</p><div style='display:flex; justify-content:center; gap:15px; margin: 10px 0; flex-wrap:wrap;'><div style='text-align:center;'><img src='' alt='Disque dur HDD' style='max-width:140px; border-radius:8px;'><p style='font-size:0.8rem;'>Image A</p></div><div style='text-align:center;'><img src='' alt='Disque SSD' style='max-width:140px; border-radius:8px;'><p style='font-size:0.8rem;'>Image B</p></div></div><p>Quels sont les noms de ces deux composants ? Donne une différence entre eux.</p>",
          "reponse": "<p><strong>Image A :</strong> C'est un <strong>disque dur HDD</strong> (Hard Disk Drive). <strong>Image B :</strong> C'est un <strong>disque SSD</strong> (Solid State Drive).</p><p><strong>Différence :</strong> Le HDD stocke les données sur des plateaux magnétiques en rotation. Il est moins cher et offre une grande capacité, mais il est plus lent et plus fragile. Le SSD stocke les données sur des puces électroniques. Il est beaucoup plus rapide, plus résistant aux chocs et silencieux, mais plus cher à capacité égale.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Intelligence Artificielle (4 pts)",
      "points": "4 pts",
      "enonce": "<div class='exercise-block'><p>Un influenceur numérique publie sur son compte Facebook une fausse information sur la modification de la date de la rentrée scolaire. Plusieurs internautes abonnés à cette page sont troublés et l'un se rapproche de toi pour distinguer l'information vraie de la fausse.</p><p><em>À l'aide du texte ci-dessus et de tes connaissances sur l'IA, réponds aux questions suivantes :</em></p></div>",
      "questions": [
        {
          "question": "<p><strong>1. Définition de l'IA (1 pt)</strong></p><p>Définis l'expression : <strong>Intelligence Artificielle (IA)</strong>.</p>",
          "reponse": "<p>L'<strong>Intelligence Artificielle</strong> (IA) est l'ensemble des techniques et des programmes informatiques qui permettent à une machine de simuler des capacités humaines comme apprendre, raisonner, comprendre, percevoir ou prendre des décisions.</p>"
        },
        {
          "question": "<p><strong>2. Les dangers de l'IA (1 pt)</strong></p><p>Donne le nom générique attribué aux fausses informations publiées dans les réseaux sociaux, puis cite deux (02) dangers liés à l'utilisation de l'IA.</p>",
          "reponse": "<p>Les fausses informations publiées dans les réseaux sociaux sont appelées <strong>fake news</strong> (ou infox).</p><p>Deux dangers liés à l'utilisation de l'IA :</p><ul><li><strong>La désinformation :</strong> l'IA peut créer et diffuser de fausses informations (deepfakes, fake news).</li><li><strong>La dépendance :</strong> l'utilisation excessive de l'IA peut rendre paresseux et empêcher de réfléchir par soi-même.</li></ul><p>On peut aussi citer : la perte d'emplois, l'atteinte à la vie privée, la tricherie à l'école.</p>"
        },

	// ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};
    const totalExercises = examData.exercices.length;
    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');
    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;
        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);
        // Construire le contenu
        let html = '';
        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;
        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;
            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });
        html += `</div>`;
        $body.html(html);
        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);
        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }
        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }
    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }
        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;
        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);
        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }
    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }
    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }
    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }
    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }
    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }
    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });
        // Afficher le premier exercice
        renderExercise(0);
        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);
        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }
    init();
});
</script>
