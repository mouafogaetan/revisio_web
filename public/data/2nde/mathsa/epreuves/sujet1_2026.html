<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>
    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }
    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }
    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }
    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }
    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }
    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }
    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }
    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }
    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }
    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }
    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }
    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }
    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }
    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }
    .exercise-statement .math {
        color: #1e40af;
    }
    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }
    .question-block.revealed {
        border-left-color: #059669;
    }
    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }
    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }
    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }
    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }
    .question-answer .math {
        color: #065f46;
    }
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }
    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }
    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }
    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }
    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }
    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }
    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }
    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }
    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }
    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }
    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }
    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }
    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }
    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }
    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }
    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>
<div class="app-container">
    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>
    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>
    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>
        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>
<script>
$(function() {
    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Mathématiques",
  "classe": "Seconde A",
  "sequence": "Séquence 1",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "PARTIE A : ÉVALUATION DES RESSOURCES (14 points)",
      "points": "",
      "enonce": "<div style='font-size: 1em; line-height: 1.8; text-align: center;'><strong>EXERCICE 1 : (5 points)</strong></div><div style='font-size: 1em; line-height: 1.8;'>On considère les nombres suivants :<br> \\(A = -7\\) ; \\(B = \\frac{22}{7}\\) ; \\(C = \\sqrt{16}\\) ; \\(D = 0,125\\) ; \\(E = \\pi\\) ; \\(F = \\sqrt{3}\\) ; \\(G = 0\\) ; \\(H = -\\frac{5}{2}\\).</div>",
      "questions": [
        {
          "question": "1) Pour chacun des nombres \\(A\\), \\(B\\), \\(C\\), \\(D\\), \\(E\\), \\(F\\), \\(G\\) et \\(H\\), indique le plus petit ensemble de nombres (\\(\\mathbb{N}\\), \\(\\mathbb{Z}\\), \\(\\mathbb{D}\\), \\(\\mathbb{Q}\\) ou \\(\\mathbb{R}\\)) auquel il appartient. Présente ta réponse sous forme de tableau. <strong>(2 pts)</strong>",
          "reponse": "<div style='background: #eaf2f8; padding: 10px; border-radius: 5px; border-left: 4px solid #2980b9;'><strong>Correction :</strong><br> • \\(A = -7 \\in \\mathbb{Z}\\) (et donc aussi \\(\\mathbb{D}\\), \\(\\mathbb{Q}\\), \\(\\mathbb{R}\\))<br> • \\(B = \\frac{22}{7} \\in \\mathbb{Q}\\) (et donc aussi \\(\\mathbb{R}\\))<br> • \\(C = \\sqrt{16} = 4 \\in \\mathbb{N}\\) (et donc aussi \\(\\mathbb{Z}\\), \\(\\mathbb{D}\\), \\(\\mathbb{Q}\\), \\(\\mathbb{R}\\))<br> • \\(D = 0,125 \\in \\mathbb{D}\\) (et donc aussi \\(\\mathbb{Q}\\), \\(\\mathbb{R}\\))<br> • \\(E = \\pi \\in \\mathbb{R}\\) (irrationnel)<br> • \\(F = \\sqrt{3} \\in \\mathbb{R}\\) (irrationnel)<br> • \\(G = 0 \\in \\mathbb{N}\\) (et donc aussi \\(\\mathbb{Z}\\), \\(\\mathbb{D}\\), \\(\\mathbb{Q}\\), \\(\\mathbb{R}\\))<br> • \\(H = -\\frac{5}{2} = -2,5 \\in \\mathbb{D}\\) (et donc aussi \\(\\mathbb{Q}\\), \\(\\mathbb{R}\\))</div>"
        },
        {
          "question": "2) Calcule la valeur absolue des nombres \\(A\\), \\(B\\), \\(H\\) et \\(G\\). <strong>(1 pt)</strong>",
          "reponse": "<div style='background: #eaf2f8; padding: 10px; border-radius: 5px; border-left: 4px solid #2980b9;'><strong>Correction :</strong><br> • \\(|A| = |-7| = 7\\)<br> • \\(|B| = \\left|\\frac{22}{7}\\right| = \\frac{22}{7}\\)<br> • \\(|H| = \\left|-\\frac{5}{2}\\right| = \\frac{5}{2} = 2,5\\)<br> • \\(|G| = |0| = 0\\)</div>"
        },
        {
          "question": "3) On pose l'expression \\(|x - 4|\\). Étudie le signe de \\((x - 4)\\) selon les valeurs de \\(x\\), puis simplifie l'expression \\(|x - 4|\\) dans chaque cas. <strong>(1 pt)</strong>",
          "reponse": "<div style='background: #eaf2f8; padding: 10px; border-radius: 5px; border-left: 4px solid #2980b9;'><strong>Correction :</strong><br> • Si \\(x \\ge 4\\) : \\(x - 4 \\ge 0\\), donc \\(|x - 4| = x - 4\\)<br> • Si \\(x < 4\\) : \\(x - 4 < 0\\), donc \\(|x - 4| = -(x - 4) = 4 - x\\)</div>"
        },
        {
          "question": "4) En utilisant le résultat de la question 3, résous l'équation \\(|x - 4| = 3\\). <strong>(1 pt)</strong>",
          "reponse": "<div style='background: #eaf2f8; padding: 10px; border-radius: 5px; border-left: 4px solid #2980b9;'><strong>Correction :</strong><br> \\(|x - 4| = 3 \\iff x - 4 = 3\\) ou \\(x - 4 = -3\\)<br> \\(\\iff x = 7\\) ou \\(x = 1\\)<br> <strong>Solution : \\(S = \\{1 ; 7\\}\\)</strong></div>"
        }
      ]
    },
    {
      "titre": "EXERCICE 2 : (5 points)",
      "points": "",
      "enonce": "<div style='font-size: 1em; line-height: 1.8;'>On considère les expressions et nombres suivants :<br> • \\(P = 3^5 \\times 3^{-2}\\)<br> • \\(Q = \\frac{(2^3)^2}{2^4}\\)<br> • \\(R = 0,00036\\)<br> • \\(S = 4,5 \\times 10^2\\)<br> • \\(T = \\sqrt{2} \\approx 1,414213...\\)</div>",
      "questions": [
        {
          "question": "1) Simplifie l'expression \\(P\\) en utilisant les propriétés des puissances, puis calcule sa valeur exacte. <strong>(1 pt)</strong>",
          "reponse": "<div style='background: #eaf2f8; padding: 10px; border-radius: 5px; border-left: 4px solid #2980b9;'><strong>Correction :</strong><br> \\(P = 3^5 \\times 3^{-2} = 3^{5-2} = 3^3 = 27\\)</div>"
        },
        {
          "question": "2) Simplifie l'expression \\(Q\\) en utilisant les propriétés des puissances, puis calcule sa valeur exacte. <strong>(1 pt)</strong>",
          "reponse": "<div style='background: #eaf2f8; padding: 10px; border-radius: 5px; border-left: 4px solid #2980b9;'><strong>Correction :</strong><br> \\(Q = \\frac{(2^3)^2}{2^4} = \\frac{2^{3 \\times 2}}{2^4} = \\frac{2^6}{2^4} = 2^{6-4} = 2^2 = 4\\)</div>"
        },
        {
          "question": "3) Écris le nombre \\(R = 0,00036\\) en notation scientifique, puis donne son ordre de grandeur. <strong>(1 pt)</strong>",
          "reponse": "<div style='background: #eaf2f8; padding: 10px; border-radius: 5px; border-left: 4px solid #2980b9;'><strong>Correction :</strong><br> \\(R = 0,00036 = 3,6 \\times 10^{-4}\\)<br> Ordre de grandeur : \\(10^{-4}\\) (car \\(3,6 < 5\\))</div>"
        },
        {
          "question": "4) Donne l'arrondi à 3 décimales de \\(T = \\sqrt{2} \\approx 1,414213...\\), puis sa troncature à 3 décimales. Explique la différence. <strong>(1 pt)</strong>",
          "reponse": "<div style='background: #eaf2f8; padding: 10px; border-radius: 5px; border-left: 4px solid #2980b9;'><strong>Correction :</strong><br> • Arrondi à 3 décimales : \\(1,414\\) (car le chiffre suivant est 2, inférieur à 5)<br> • Troncature à 3 décimales : \\(1,414\\) (on coupe sans arrondir)<br> <em>Dans ce cas, l'arrondi et la troncature donnent le même résultat car le chiffre suivant (2) est inférieur à 5.</em></div>"
        },
        {
          "question": "5) Calcule le produit \\(R \\times S\\) en notation scientifique, puis donne l'ordre de grandeur du résultat. <strong>(1 pt)</strong>",
          "reponse": "<div style='background: #eaf2f8; padding: 10px; border-radius: 5px; border-left: 4px solid #2980b9;'><strong>Correction :</strong><br> \\(R \\times S = (3,6 \\times 10^{-4}) \\times (4,5 \\times 10^2)\\)<br> \\(= (3,6 \\times 4,5) \\times 10^{-4+2}\\)<br> \\(= 16,2 \\times 10^{-2}\\)<br> \\(= 1,62 \\times 10^{-1}\\)<br> \\(= 0,162\\)<br> Ordre de grandeur : \\(10^{-1}\\) (car \\(1,62 < 5\\))</div>"
        }
      ]
    },
    {
      "titre": "EXERCICE 3 : (4 points)",
      "points": "",
      "enonce": "<div style='font-size: 1em; line-height: 1.8;'>On considère les expressions suivantes :<br> • \\(A = \\sqrt{50} + \\sqrt{18} - \\sqrt{8}\\)<br> • \\(B = \\frac{6}{\\sqrt{3}}\\)<br> • \\(C = (\\sqrt{5} + 2)(\\sqrt{5} - 2)\\)<br> • \\(D = (\\sqrt{7} - 1)^2\\)</div>",
      "questions": [
        {
          "question": "1) Simplifie l'expression \\(A = \\sqrt{50} + \\sqrt{18} - \\sqrt{8}\\) en écrivant chaque radical sous la forme \\(a\\sqrt{b}\\) avec \\(b\\) le plus petit possible. <strong>(1 pt)</strong>",
          "reponse": "<div style='background: #eaf2f8; padding: 10px; border-radius: 5px; border-left: 4px solid #2980b9;'><strong>Correction :</strong><br> \\(\\sqrt{50} = \\sqrt{25 \\times 2} = 5\\sqrt{2}\\)<br> \\(\\sqrt{18} = \\sqrt{9 \\times 2} = 3\\sqrt{2}\\)<br> \\(\\sqrt{8} = \\sqrt{4 \\times 2} = 2\\sqrt{2}\\)<br> Donc \\(A = 5\\sqrt{2} + 3\\sqrt{2} - 2\\sqrt{2} = 6\\sqrt{2}\\)</div>"
        },
        {
          "question": "2) Rationalise le dénominateur de \\(B = \\frac{6}{\\sqrt{3}}\\). <strong>(1 pt)</strong>",
          "reponse": "<div style='background: #eaf2f8; padding: 10px; border-radius: 5px; border-left: 4px solid #2980b9;'><strong>Correction :</strong><br> \\(B = \\frac{6}{\\sqrt{3}} = \\frac{6 \\times \\sqrt{3}}{\\sqrt{3} \\times \\sqrt{3}} = \\frac{6\\sqrt{3}}{3} = 2\\sqrt{3}\\)</div>"
        },
        {
          "question": "3) Calcule \\(C = (\\sqrt{5} + 2)(\\sqrt{5} - 2)\\). <strong>(1 pt)</strong>",
          "reponse": "<div style='background: #eaf2f8; padding: 10px; border-radius: 5px; border-left: 4px solid #2980b9;'><strong>Correction :</strong><br> \\(C = (\\sqrt{5} + 2)(\\sqrt{5} - 2) = (\\sqrt{5})^2 - 2^2 = 5 - 4 = 1\\)</div>"
        },
        {
          "question": "4) Développe et simplifie \\(D = (\\sqrt{7} - 1)^2\\). <strong>(1 pt)</strong>",
          "reponse": "<div style='background: #eaf2f8; padding: 10px; border-radius: 5px; border-left: 4px solid #2980b9;'><strong>Correction :</strong><br> \\(D = (\\sqrt{7} - 1)^2 = (\\sqrt{7})^2 - 2 \\times \\sqrt{7} \\times 1 + 1^2\\)<br> \\(= 7 - 2\\sqrt{7} + 1 = 8 - 2\\sqrt{7}\\)</div>"
        }
      ]
    },
    {
      "titre": "PARTIE B : ÉVALUATION DES COMPÉTENCES (5 points)",
      "points": "",
      "enonce": "<div style='font-size: 1em; line-height: 1.8;'><strong>PROBLÈME : (5 points)</strong><br><br><strong>Situation :</strong><br>Un ingénieur en construction doit concevoir un réservoir cylindrique pour stocker de l'eau. Le réservoir a une hauteur de 3 mètres et un rayon \\(r\\) (en mètres) qui peut varier. Le volume du réservoir est donné par la formule \\(V = \\pi r^2 h\\), où \\(h = 3\\) m.<br><br>L'ingénieur doit respecter deux contraintes indépendantes :<br> • <strong>Contrainte 1 :</strong> Le volume du réservoir doit être supérieur à 15 m³.<br> • <strong>Contrainte 2 :</strong> Le volume du réservoir doit être inférieur ou égal à 40 m³.</div>",
      "questions": [
        {
          "question": "1) Détermine l'ensemble des valeurs de \\(r\\) pour lesquelles le volume du réservoir est supérieur à 15 m³. (On prendra \\(\\pi \\approx 3,14\\)) <strong>(2,5 pts)</strong>",
          "reponse": "<div style='background: #eaf2f8; padding: 10px; border-radius: 5px; border-left: 4px solid #2980b9;'><strong>Correction :</strong><br> <strong>Étape 1 :</strong> \\(V = \\pi r^2 h = 3,14 \\times r^2 \\times 3 = 9,42r^2\\)<br> <strong>Étape 2 :</strong> On veut \\(V > 15\\), donc \\(9,42r^2 > 15\\)<br> \\(r^2 > \\frac{15}{9,42} \\approx 1,59\\)<br> \\(r > \\sqrt{1,59} \\approx 1,26\\) (on rejette la valeur négative car \\(r > 0\\))<br> <strong>Réponse :</strong> \\(r > 1,26\\) m (environ).<br> <em>L'ensemble des solutions est \\(]1,26 ; +\\infty[\\).</em></div>"
        },
        {
          "question": "2) L'ingénieur veut que le réservoir ait une capacité maximale de 40 m³. Détermine l'ensemble des valeurs de \\(r\\) pour lesquelles \\(V \\le 40\\) m³. (Indépendante de la question 1) <strong>(2,5 pts)</strong>",
          "reponse": "<div style='background: #eaf2f8; padding: 10px; border-radius: 5px; border-left: 4px solid #2980b9;'><strong>Correction :</strong><br> <strong>Étape 1 :</strong> \\(V = 9,42r^2\\)<br> <strong>Étape 2 :</strong> On veut \\(V \\le 40\\), donc \\(9,42r^2 \\le 40\\)<br> \\(r^2 \\le \\frac{40}{9,42} \\approx 4,25\\)<br> \\(r \\le \\sqrt{4,25} \\approx 2,06\\) (on rejette la valeur négative car \\(r > 0\\))<br> <strong>Réponse :</strong> \\(r \\le 2,06\\) m (environ).<br> <em>L'ensemble des solutions est \\(]0 ; 2,06]\\).</em></div>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};
    const totalExercises = examData.exercices.length;
    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');
    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;
        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);
        // Construire le contenu
        let html = '';
        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;
        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;
            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });
        html += `</div>`;
        $body.html(html);
        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);
        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }
        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }
    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }
        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;
        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);
        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }
    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }
    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }
    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }
    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }
    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }
    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });
        // Afficher le premier exercice
        renderExercise(0);
        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);
        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }
    init();
});
</script>
</body>
</html>
