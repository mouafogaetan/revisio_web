<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>
    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }
    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }
    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }
    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }
    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }
    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }
    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }
    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }
    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }
    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }
    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }
    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }
    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }
    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }
    .exercise-statement .math {
        color: #1e40af;
    }
    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }
    .question-block.revealed {
        border-left-color: #059669;
    }
    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }
    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }
    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }
    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }
    .question-answer .math {
        color: #065f46;
    }
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }
    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }
    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }
    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }
    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }
    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }
    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }
    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }
    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }
    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }
    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }
    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }
    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }
    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }
    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }
    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>
<div class="app-container">
    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>
    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>
    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>
        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>
<script>
$(function() {
    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Informatique",
  "classe": "Première C et D",
  "sequence": "Séquence 1",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Intelligence Artificielle et Cadre Juridique (10 pts)",
      "points": "10 pts",
      "enonce": "<div class='exercise-block'><p><strong>Situation problème :</strong></p><p>Le club scientifique de ton lycée organise une journée portes ouvertes sur le thème « L'Intelligence Artificielle dans nos métiers de demain ». En tant que membre du club, tu es chargé de préparer un exposé sur l'impact de l'IA dans les filières scientifiques (séries C et D). Pour cela, tu dois d'abord comprendre ce qu'est l'automatisation par IA, ses applications dans différents secteurs, et son impact sur les compétences recherchées. Ton professeur d'informatique te demande également de réfléchir aux enjeux éthiques et juridiques liés à l'utilisation de l'IA, notamment la protection des données personnelles. En effet, certaines applications mobiles collectent trop d'informations sur leurs utilisateurs.</p><p><em>À l'aide de cette situation et de tes connaissances, réponds aux questions suivantes :</em></p></div>",
      "questions": [
        {
          "question": "<p><strong>1. Automatisation et IA (2,5 pts)</strong></p><p>a) (1 pt) Définis l'expression : <strong>Automatisation</strong>.</p><p>b) (1 pt) Donne une différence entre l'<strong>automatisation classique</strong> et l'<strong>automatisation par IA</strong>.</p><p>c) (0,5 pt) Cite deux (02) exemples d'automatisation par IA dans le secteur de la santé.</p>",
          "reponse": "<p><strong>a) (1 pt)</strong> L'<strong>automatisation</strong> est le processus qui consiste à confier à une machine ou à un programme informatique l'exécution de tâches qui étaient auparavant réalisées par l'homme. Elle vise à réduire l'intervention humaine, à gagner du temps, à diminuer les erreurs et à augmenter la productivité.</p><p><strong>b) (1 pt)</strong> L'<strong>automatisation classique</strong> repose sur des règles fixes programmées à l'avance et ne s'adapte pas. L'<strong>automatisation par IA</strong> apprend à partir de données et s'améliore avec l'expérience. <em>Exemple : une machine à laver (classique) vs la reconnaissance faciale (IA).</em></p><p><strong>c) (0,5 pt)</strong> Deux exemples d'automatisation par IA dans la santé :</p><ul><li>La détection de maladies par analyse d'images médicales (radiographies, IRM).</li><li>Le suivi des patients via des applications qui surveillent la tension et le diabète.</li></ul><p>On peut aussi citer : la recherche de médicaments, la téléconsultation.</p>"
        },
        {
          "question": "<p><strong>2. Impact de l'IA sur les compétences (2 pts)</strong></p><p>a) (1 pt) Cite deux (02) compétences qui sont en <strong>déclin</strong> à cause de l'IA.</p><p>b) (1 pt) Cite deux (02) compétences qui sont de plus en plus <strong>recherchées</strong> sur le marché du travail.</p>",
          "reponse": "<p><strong>a) (1 pt)</strong> Deux compétences en déclin :</p><ul><li>Les tâches répétitives et manuelles.</li><li>La saisie de données basique.</li></ul><p>On peut aussi citer : les calculs simples et routiniers, l'assemblage en chaîne.</p><p><strong>b) (1 pt)</strong> Deux compétences recherchées :</p><ul><li>Les compétences numériques et la programmation.</li><li>La pensée critique et la résolution de problèmes.</li></ul><p>On peut aussi citer : la créativité, la collaboration, l'adaptabilité, l'éthique.</p>"
        },
        {
          "question": "<p><strong>3. Biais algorithmiques (2,5 pts)</strong></p><p>a) (1 pt) Définis l'expression : <strong>Biais algorithmique</strong>.</p><p>b) (1 pt) Cite deux (02) sources de biais dans les données d'entraînement.</p><p>c) (0,5 pt) Cite une (01) piste pour rendre l'IA plus équitable.</p>",
          "reponse": "<p><strong>a) (1 pt)</strong> Un <strong>biais algorithmique</strong> est une erreur systématique dans le fonctionnement d'un système d'intelligence artificielle qui produit des résultats injustes ou discriminatoires envers certains groupes de personnes.</p><p><strong>b) (1 pt)</strong> Deux sources de biais :</p><ul><li>Les <strong>données historiques biaisées</strong> : les données du passé contiennent des discriminations.</li><li>Les <strong>données non représentatives</strong> : certains groupes sont sous-représentés ou absents.</li></ul><p>On peut aussi citer : les choix de conception des développeurs.</p><p><strong>c) (0,5 pt)</strong> Une piste pour rendre l'IA plus équitable : <strong>diversifier les données</strong> d'entraînement (ou auditer les algorithmes, la transparence, la supervision humaine, la formation).</p>"
        },
        {
          "question": "<p><strong>4. Protection des données personnelles (3 pts)</strong></p><p>a) (1 pt) Définis l'expression : <strong>Donnée personnelle</strong>.</p><p>b) (1 pt) Définis le principe de <strong>consentement</strong> et cite ses trois (03) conditions.</p><p>c) (0,5 pt) Définis le principe de <strong>minimisation</strong>.</p><p>d) (0,5 pt) Au Cameroun, quelle loi encadre la protection des données personnelles ?</p>",
          "reponse": "<p><strong>a) (1 pt)</strong> Une <strong>donnée personnelle</strong> est toute information qui permet d'identifier une personne physique, directement ou indirectement. <em>Exemples : nom, prénom, adresse e-mail, numéro de téléphone, photo du visage, date de naissance, adresse IP.</em></p><p><strong>b) (1 pt)</strong> Le <strong>consentement</strong> est l'accord libre, éclairé et spécifique de la personne pour l'utilisation de ses données personnelles. Ses trois conditions sont :</p><ul><li><strong>Libre :</strong> sans pression ni contrainte.</li><li><strong>Éclairé :</strong> la personne sait à quoi elle consent.</li><li><strong>Spécifique :</strong> pour une utilisation précise et déterminée.</li></ul><p><strong>c) (0,5 pt)</strong> La <strong>minimisation</strong> est le principe selon lequel seules les données strictement nécessaires à la finalité poursuivie doivent être collectées.</p><p><strong>d) (0,5 pt)</strong> Au Cameroun, la protection des données personnelles est encadrée par la <strong>loi n° 2010/012 du 21 décembre 2010</strong> relative à la cybersécurité et à la cybercriminalité.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Algorithmique — Questions de cours (5 pts)",
      "points": "5 pts",
      "enonce": "<div class='exercise-block'><p><strong>Situation problème :</strong></p><p>Ton professeur de mathématiques te demande de l'aider à préparer un cours sur l'algorithmique pour les élèves de Seconde. Il te demande d'abord de répondre à quelques questions de cours pour vérifier que tu maîtrises les notions de base : la définition d'un algorithme, le LDA, les variables et les constantes, ainsi que les structures de contrôle.</p><p><em>À l'aide de tes connaissances, réponds aux questions suivantes :</em></p></div>",
      "questions": [
        {
          "question": "<p><strong>1. Définitions (2 pts)</strong></p><p>a) (1 pt) Définis l'expression : <strong>Algorithme</strong>.</p><p>b) (1 pt) Qu'est-ce que le <strong>LDA</strong> ? Donne un (01) avantage de son utilisation.</p>",
          "reponse": "<p><strong>a) (1 pt)</strong> Un <strong>algorithme</strong> est une suite d'instructions précises, organisées et logiques, qui permet de résoudre un problème ou d'effectuer une tâche.</p><p><strong>b) (1 pt)</strong> Le <strong>LDA</strong> (Langage de Définition des Algorithmes) est un langage pseudo-naturel qui permet de décrire un algorithme sans utiliser la syntaxe stricte d'un langage de programmation. <em>Avantage : il est facile à lire et à comprendre pour les humains, et il est indépendant de tout langage de programmation.</em></p>"
        },
        {
          "question": "<p><strong>2. Variables et constantes (1,5 pt)</strong></p><p>a) (0,5 pt) Donne la différence entre une <strong>variable</strong> et une <strong>constante</strong>.</p><p>b) (1 pt) Écris la syntaxe de déclaration d'une variable et d'une constante en LDA. Donne un exemple pour chacune.</p>",
          "reponse": "<p><strong>a) (0,5 pt)</strong> Une <strong>variable</strong> est une zone mémoire dont la valeur peut changer pendant l'exécution de l'algorithme. Une <strong>constante</strong> est une zone mémoire dont la valeur est fixe et ne peut pas être modifiée.</p><p><strong>b) (1 pt)</strong> Syntaxe en LDA :</p><ul><li><strong>Variable :</strong> <code>Variable nom1, nom2 : type</code> — <em>Exemple : <code>Variable note1, note2 : réels</code></em></li><li><strong>Constante :</strong> <code>Constante nom : type = valeur</code> — <em>Exemple : <code>Constante TVA : réel = 0.18</code></em></li></ul>"
        },
        {
          "question": "<p><strong>3. Structures de contrôle (1,5 pt)</strong></p><p>a) (1 pt) Cite les trois (03) types de structures alternatives.</p><p>b) (0,5 pt) Cite les trois (03) types de structures itératives.</p>",
          "reponse": "<p><strong>a) (1 pt)</strong> Les trois types de structures alternatives sont :</p><ul><li>La structure <strong>réduite</strong> (SI...ALORS...FINSI).</li><li>La structure <strong>complète</strong> (SI...ALORS...SINON...FINSI).</li><li>La structure <strong>imbriquée</strong> (SI...ALORS...SINON SI...ALORS...FINSI).</li></ul><p><strong>b) (0,5 pt)</strong> Les trois types de structures itératives sont :</p><ul><li>La boucle <strong>POUR</strong> (nombre d'itérations connu).</li><li>La boucle <strong>TANT QUE</strong> (nombre d'itérations inconnu, pré-test).</li><li>La boucle <strong>REPETER JUSQU'A</strong> (nombre d'itérations inconnu, post-test).</li></ul>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Algorithmique — Écriture et exécution (5 pts)",
      "points": "5 pts",
      "enonce": "<div class='exercise-block'><p><strong>Situation problème :</strong></p><p>Ton professeur de mathématiques te demande d'écrire un algorithme qui permet de déterminer si un élève est <strong>admis</strong> ou <strong>recalé</strong> à un examen. La moyenne d'admission est de 10/20. Si l'élève a une moyenne supérieure ou égale à 10, il est admis. Sinon, il est recalé. De plus, le professeur souhaite que tu exécutes un algorithme avec une structure itérative pour vérifier que la boucle fonctionne correctement.</p><p><em>À l'aide de cette situation et de tes connaissances, réponds aux questions suivantes :</em></p></div>",
      "questions": [
        {
          "question": "<p><strong>1. Écriture d'un algorithme avec structure alternative (2,5 pts)</strong></p><p>Écris un algorithme en LDA qui demande la moyenne d'un élève, puis affiche « Admis » si la moyenne est supérieure ou égale à 10, et « Recalé » sinon.</p>",
          "reponse": "<p>Algorithme en LDA :</p><pre><code>Algorithme Admission\n\nVariable moyenne : réel\n\nDébut\n    Écrire(\"Entrer la moyenne de l'élève : \")\n    Lire(moyenne)\n    Si (moyenne >= 10) alors\n        Écrire(\"Admis\")\n    Sinon\n        Écrire(\"Recalé\")\n    FinSi\nFin\n</code></pre><p><em>Analyse : L'algorithme utilise une structure alternative complète (Si...Alors...Sinon...FinSi). Il lit la moyenne, puis compare la valeur à 10. Si la condition est vraie, il affiche « Admis », sinon il affiche « Recalé ».</em></p>"
        },
        {
          "question": "<p><strong>2. Exécution d'un algorithme avec structure itérative (2,5 pts)</strong></p><p>Soit l'algorithme suivant :</p><pre><code>Algorithme Compteur\n\nVariable i : entier\n\nDébut\n    Pour i allant de 1 à 5 pas=1 faire\n        Écrire(i)\n    FinPour\nFin\n</code></pre><p>a) (1 pt) Quelle est la valeur initiale de i ? Quelle est la valeur finale de i ?</p><p>b) (1,5 pt) Fais la trace de cet algorithme et donne le résultat affiché.</p>",
          "reponse": "<p><strong>a) (1 pt)</strong> La valeur initiale de i est <strong>1</strong>. La valeur finale de i est <strong>5</strong> (la boucle s'arrête quand i dépasse 5, soit i = 6).</p><p><strong>b) (1,5 pt)</strong> Trace de l'algorithme :</p><table style='width:100%; border-collapse:collapse; font-size:0.9em; margin-top:10px;'><thead><tr style='background:#1a237e; color:white;'><th style='padding:6px; border:1px solid #ddd;'>Itération</th><th style='padding:6px; border:1px solid #ddd;'>i</th><th style='padding:6px; border:1px solid #ddd;'>i ≤ 5 ?</th><th style='padding:6px; border:1px solid #ddd;'>Affichage</th></tr></thead><tbody><tr><td style='padding:6px; border:1px solid #ddd; text-align:center;'>1</td><td style='padding:6px; border:1px solid #ddd; text-align:center;'>1</td><td style='padding:6px; border:1px solid #ddd; text-align:center;'>Vrai</td><td style='padding:6px; border:1px solid #ddd; text-align:center;'>1</td></tr><tr style='background:#f5f5f5;'><td style='padding:6px; border:1px solid #ddd; text-align:center;'>2</td><td style='padding:6px; border:1px solid #ddd; text-align:center;'>2</td><td style='padding:6px; border:1px solid #ddd; text-align:center;'>Vrai</td><td style='padding:6px; border:1px solid #ddd; text-align:center;'>2</td></tr><tr><td style='padding:6px; border:1px solid #ddd; text-align:center;'>3</td><td style='padding:6px; border:1px solid #ddd; text-align:center;'>3</td><td style='padding:6px; border:1px solid #ddd; text-align:center;'>Vrai</td><td style='padding:6px; border:1px solid #ddd; text-align:center;'>3</td></tr><tr style='background:#f5f5f5;'><td style='padding:6px; border:1px solid #ddd; text-align:center;'>4</td><td style='padding:6px; border:1px solid #ddd; text-align:center;'>4</td><td style='padding:6px; border:1px solid #ddd; text-align:center;'>Vrai</td><td style='padding:6px; border:1px solid #ddd; text-align:center;'>4</td></tr><tr><td style='padding:6px; border:1px solid #ddd; text-align:center;'>5</td><td style='padding:6px; border:1px solid #ddd; text-align:center;'>5</td><td style='padding:6px; border:1px solid #ddd; text-align:center;'>Vrai</td><td style='padding:6px; border:1px solid #ddd; text-align:center;'>5</td></tr><tr style='background:#e8f5e9;'><td style='padding:6px; border:1px solid #ddd; text-align:center;'>6</td><td style='padding:6px; border:1px solid #ddd; text-align:center;'>6</td><td style='padding:6px; border:1px solid #ddd; text-align:center;'><strong>Faux</strong></td><td style='padding:6px; border:1px solid #ddd; text-align:center;'>—</td></tr></tbody></table><p style='margin-top:10px;'><strong>Résultat affiché :</strong> 1 2 3 4 5</p>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};
    const totalExercises = examData.exercices.length;
    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');
    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;
        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);
        // Construire le contenu
        let html = '';
        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;
        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;
            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });
        html += `</div>`;
        $body.html(html);
        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);
        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }
        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }
    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }
        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;
        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);
        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }
    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }
    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }
    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }
    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }
    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }
    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });
        // Afficher le premier exercice
        renderExercise(0);
        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);
        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }
    init();
});
</script>
</body>
</html>
