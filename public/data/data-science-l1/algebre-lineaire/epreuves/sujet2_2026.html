<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Algèbre Linéaire - L1",
  "classe": "Licence 1 Data Science",
  "sequence": "Séquence 2",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Matrices et Calcul Matriciel",
      "points": "5 pts",
      "enonce": "<p><strong>Partie A : Opérations sur les matrices</strong></p><p>Soient les matrices suivantes :</p><div class='math-block'><div class='math'>A = \\begin{pmatrix} 2 & -1 \\\\ 0 & 3 \\end{pmatrix}, \\quad B = \\begin{pmatrix} 1 & 4 \\\\ -2 & 1 \\end{pmatrix}, \\quad C = \\begin{pmatrix} 3 & 0 \\\\ 1 & -2 \\end{pmatrix}</div></div><p>1. Calculer, si possible, les expressions suivantes :</p><ul><li>2A - B</li><li>A × B</li><li>B × C</li></ul><p>2. Vérifier que A × (B × C) = (A × B) × C (associativité du produit matriciel).</p><p><strong>Partie B : Matrice inverse</strong></p><p>3. Justifier que la matrice A est inversible.</p><p>4. En utilisant la formule appropriée, déterminer A<sup>-1</sup>.</p><p>5. Vérifier que A × A<sup>-1</sup> = I<sub>2</sub>.</p>",
      "questions": [
        {
          "question": "<p><strong>Partie A : Opérations sur les matrices</strong></p><p>1) Calculer 2A - B :</p>",
          "reponse": "<p>2A - B = 2 × \\begin{pmatrix} 2 & -1 \\\\ 0 & 3 \\end{pmatrix} - \\begin{pmatrix} 1 & 4 \\\\ -2 & 1 \\end{pmatrix} = \\begin{pmatrix} 4 & -2 \\\\ 0 & 6 \\end{pmatrix} - \\begin{pmatrix} 1 & 4 \\\\ -2 & 1 \\end{pmatrix} = \\begin{pmatrix} 3 & -6 \\\\ 2 & 5 \\end{pmatrix}</p>"
        },
        {
          "question": "<p>2) Calculer A × B :</p>",
          "reponse": "<p>A × B = \\begin{pmatrix} 2 & -1 \\\\ 0 & 3 \\end{pmatrix} × \\begin{pmatrix} 1 & 4 \\\\ -2 & 1 \\end{pmatrix} = \\begin{pmatrix} 2×1 + (-1)×(-2) & 2×4 + (-1)×1 \\\\ 0×1 + 3×(-2) & 0×4 + 3×1 \\end{pmatrix} = \\begin{pmatrix} 4 & 7 \\\\ -6 & 3 \\end{pmatrix}</p>"
        },
        {
          "question": "<p>3) Calculer B × C :</p>",
          "reponse": "<p>B × C = \\begin{pmatrix} 1 & 4 \\\\ -2 & 1 \\end{pmatrix} × \\begin{pmatrix} 3 & 0 \\\\ 1 & -2 \\end{pmatrix} = \\begin{pmatrix} 1×3 + 4×1 & 1×0 + 4×(-2) \\\\ -2×3 + 1×1 & -2×0 + 1×(-2) \\end{pmatrix} = \\begin{pmatrix} 7 & -8 \\\\ -5 & -2 \\end{pmatrix}</p>"
        },
        {
          "question": "<p>4) Vérifier l'associativité A × (B × C) = (A × B) × C :</p>",
          "reponse": "<p>A × (B × C) = \\begin{pmatrix} 2 & -1 \\\\ 0 & 3 \\end{pmatrix} × \\begin{pmatrix} 7 & -8 \\\\ -5 & -2 \\end{pmatrix} = \\begin{pmatrix} 2×7 + (-1)×(-5) & 2×(-8) + (-1)×(-2) \\\\ 0×7 + 3×(-5) & 0×(-8) + 3×(-2) \\end{pmatrix} = \\begin{pmatrix} 19 & -14 \\\\ -15 & -6 \\end{pmatrix}</p><p>(A × B) × C = \\begin{pmatrix} 4 & 7 \\\\ -6 & 3 \\end{pmatrix} × \\begin{pmatrix} 3 & 0 \\\\ 1 & -2 \\end{pmatrix} = \\begin{pmatrix} 12+7 & 0-14 \\\\ -18+3 & 0-6 \\end{pmatrix} = \\begin{pmatrix} 19 & -14 \\\\ -15 & -6 \\end{pmatrix}</p><p>On a bien A × (B × C) = (A × B) × C.</p>"
        },
        {
          "question": "<p><strong>Partie B : Matrice inverse</strong></p><p>5) Justifier que A est inversible :</p>",
          "reponse": "<p>det(A) = 2×3 - (-1)×0 = 6 ≠ 0. Une matrice carrée est inversible si et seulement si son déterminant est non nul. Donc A est inversible.</p>"
        },
        {
          "question": "<p>6) Déterminer A<sup>-1</sup> à l'aide de la formule :</p>",
          "reponse": "<p>A<sup>-1</sup> = \\dfrac{1}{det(A)} \\begin{pmatrix} d & -b \\\\ -c & a \\end{pmatrix} = \\dfrac{1}{6} \\begin{pmatrix} 3 & 1 \\\\ 0 & 2 \\end{pmatrix} = \\begin{pmatrix} \\dfrac{1}{2} & \\dfrac{1}{6} \\\\ 0 & \\dfrac{1}{3} \\end{pmatrix}</p>"
        },
        {
          "question": "<p>7) Vérifier que A × A<sup>-1</sup> = I<sub>2</sub> :</p>",
          "reponse": "<p>A × A<sup>-1</sup> = \\begin{pmatrix} 2 & -1 \\\\ 0 & 3 \\end{pmatrix} × \\begin{pmatrix} \\dfrac{1}{2} & \\dfrac{1}{6} \\\\ 0 & \\dfrac{1}{3} \\end{pmatrix} = \\begin{pmatrix} 1 & \\dfrac{1}{3} - \\dfrac{1}{3} \\\\ 0 & 1 \\end{pmatrix} = \\begin{pmatrix} 1 & 0 \\\\ 0 & 1 \\end{pmatrix} = I_2</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Espaces Vectoriels",
      "points": "5 pts",
      "enonce": "<p>Soit E = ℝ³ muni des opérations usuelles.</p><p>On considère les sous-ensembles suivants de E :</p><ul><li>F = {(x, y, z) ∈ ℝ³ | x + y - z = 0}</li><li>G = {(x, y, z) ∈ ℝ³ | 2x - y + z = 0}</li></ul><p>1. Montrer que F est un sous-espace vectoriel de E.</p><p>2. Donner une base de F et déterminer sa dimension.</p><p>3. Montrer que G est un sous-espace vectoriel de E.</p><p>4. Déterminer F ∩ G et donner sa dimension.</p><p>5. En utilisant la formule de Grassmann, déterminer la dimension de F + G.</p>",
      "questions": [
        {
          "question": "<p>1) Montrer que F est un sous-espace vectoriel de E :</p>",
          "reponse": "<p>F est défini par une équation linéaire homogène. On peut montrer que :</p><ul><li>Le vecteur nul (0,0,0) appartient à F car 0+0-0 = 0.</li><li>F est stable par addition : si u=(x₁,y₁,z₁) et v=(x₂,y₂,z₂) sont dans F, alors (x₁+x₂)+(y₁+y₂)-(z₁+z₂) = (x₁+y₁-z₁)+(x₂+y₂-z₂) = 0+0 = 0.</li><li>F est stable par multiplication par un scalaire : si u=(x,y,z) ∈ F et λ ∈ ℝ, alors λx + λy - λz = λ(x+y-z) = λ×0 = 0.</li></ul><p>Donc F est un sous-espace vectoriel de ℝ³.</p>"
        },
        {
          "question": "<p>2) Donner une base de F et déterminer sa dimension :</p>",
          "reponse": "<p>F = {(x, y, z) | z = x + y}. Les vecteurs de F s'écrivent (x, y, x+y) = x(1,0,1) + y(0,1,1).</p><p>La famille {(1,0,1), (0,1,1)} est libre et génératrice de F. C'est donc une base de F.</p><p>dim(F) = 2.</p>"
        },
        {
          "question": "<p>3) Montrer que G est un sous-espace vectoriel de E :</p>",
          "reponse": "<p>G est également défini par une équation linéaire homogène. Par le même raisonnement que pour F, G est un sous-espace vectoriel de ℝ³.</p>"
        },
        {
          "question": "<p>4) Déterminer F ∩ G et donner sa dimension :</p>",
          "reponse": "<p>F ∩ G = {(x,y,z) | x+y-z = 0 et 2x-y+z = 0}.</p><p>Résolvons ce système : z = x+y et 2x-y+(x+y) = 0 => 3x = 0 => x = 0.</p><p>Alors z = y. Donc (x,y,z) = (0,y,y) = y(0,1,1).</p><p>F ∩ G = Vect{(0,1,1)} et dim(F ∩ G) = 1.</p>"
        },
        {
          "question": "<p>5) Déterminer la dimension de F + G par la formule de Grassmann :</p>",
          "reponse": "<p>Formule de Grassmann : dim(F + G) = dim(F) + dim(G) - dim(F ∩ G).</p><p>dim(F) = 2 et dim(G) = 2 (car G est un plan vectoriel).</p><p>dim(F ∩ G) = 1.</p><p>Donc dim(F + G) = 2 + 2 - 1 = 3.</p><p>Comme F + G est un sous-espace vectoriel de ℝ³ et que sa dimension est 3, on a F + G = ℝ³.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Applications Linéaires",
      "points": "5 pts",
      "enonce": "<p>Soit f : ℝ³ → ℝ² définie par f(x,y,z) = (2x + y - z, x - 3y + 2z).</p><p>1. Montrer que f est une application linéaire.</p><p>2. Déterminer la matrice de f dans les bases canoniques de ℝ³ et ℝ².</p><p>3. Déterminer le noyau Ker(f) et en donner une base.</p><p>4. Déterminer l'image Im(f) et en donner une base.</p><p>5. Vérifier le théorème du rang.</p>",
      "questions": [
        {
          "question": "<p>1) Montrer que f est une application linéaire :</p>",
          "reponse": "<p>Pour tout u=(x₁,y₁,z₁) et v=(x₂,y₂,z₂) dans ℝ³, et pour tout λ ∈ ℝ :</p><p>f(u+v) = f(x₁+x₂, y₁+y₂, z₁+z₂) = (2(x₁+x₂)+(y₁+y₂)-(z₁+z₂), (x₁+x₂)-3(y₁+y₂)+2(z₁+z₂))</p><p>= (2x₁+y₁-z₁ + 2x₂+y₂-z₂, x₁-3y₁+2z₁ + x₂-3y₂+2z₂) = f(u) + f(v).</p><p>f(λu) = f(λx₁, λy₁, λz₁) = (2λx₁+λy₁-λz₁, λx₁-3λy₁+2λz₁) = λ(2x₁+y₁-z₁, x₁-3y₁+2z₁) = λf(u).</p><p>Donc f est linéaire.</p>"
        },
        {
          "question": "<p>2) Déterminer la matrice de f dans les bases canoniques :</p>",
          "reponse": "<p>La matrice de f est de taille 2×3. Ses colonnes sont les images des vecteurs de la base canonique de ℝ³.</p><p>f(1,0,0) = (2,1) ; f(0,1,0) = (1,-3) ; f(0,0,1) = (-1,2).</p><p>Donc A = \\begin{pmatrix} 2 & 1 & -1 \\\\ 1 & -3 & 2 \\end{pmatrix}.</p>"
        },
        {
          "question": "<p>3) Déterminer le noyau Ker(f) et en donner une base :</p>",
          "reponse": "<p>Ker(f) = {(x,y,z) ∈ ℝ³ | f(x,y,z) = (0,0)}.</p><p>Il faut résoudre : 2x+y-z = 0 et x-3y+2z = 0.</p><p>De la première équation : z = 2x+y. En substituant dans la seconde : x-3y+2(2x+y) = x-3y+4x+2y = 5x-y = 0 => y = 5x.</p><p>Alors z = 2x+5x = 7x. Donc (x,y,z) = (x,5x,7x) = x(1,5,7).</p><p>Ker(f) = Vect{(1,5,7)} et dim(Ker(f)) = 1.</p>"
        },
        {
          "question": "<p>4) Déterminer l'image Im(f) et en donner une base :</p>",
          "reponse": "<p>Im(f) est engendré par les colonnes de A : f(e₁)=(2,1), f(e₂)=(1,-3), f(e₃)=(-1,2).</p><p>Ces vecteurs sont dans ℝ². Comme dim(Im(f)) = dim(ℝ²) = 2 (d'après le théorème du rang), Im(f) = ℝ².</p><p>Une base de Im(f) est la base canonique de ℝ² : {(1,0), (0,1)}.</p>"
        },
        {
          "question": "<p>5) Vérifier le théorème du rang :</p>",
          "reponse": "<p>Théorème du rang : dim(ℝ³) = dim(Ker(f)) + dim(Im(f)).</p><p>dim(ℝ³) = 3, dim(Ker(f)) = 1, dim(Im(f)) = 2.</p><p>On a bien 3 = 1 + 2. Le théorème est vérifié.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Déterminants et Applications",
      "points": "5 pts",
      "enonce": "<p>Soit A = \\begin{pmatrix} 2 & 1 & 0 \\\\ -1 & 3 & 2 \\\\ 1 & 0 & 1 \\end{pmatrix}.</p><p>1. Calculer le déterminant de A par la règle de Sarrus.</p><p>2. La matrice A est-elle inversible ? Justifier.</p><p>3. Calculer l'inverse de A à l'aide de la comatrice.</p><p>4. Résoudre le système linéaire suivant à l'aide de la règle de Cramer :</p><div class='math-block'><div class='math'>\\begin{cases} 2x + y = 4 \\\\ -x + 3y + 2z = 5 \\\\ x + z = 3 \\end{cases}</div></div>",
      "questions": [
        {
          "question": "<p>1) Calculer det(A) par la règle de Sarrus :</p>",
          "reponse": "<p>det(A) = 2×3×1 + 1×2×1 + 0×(-1)×0 - 0×3×1 - 1×2×2 - 2×(-1)×1</p><p>= 6 + 2 + 0 - 0 - 4 + 2 = 6.</p>"
        },
        {
          "question": "<p>2) A est-elle inversible ?</p>",
          "reponse": "<p>Oui, car det(A) = 6 ≠ 0. Une matrice carrée est inversible si et seulement si son déterminant est non nul.</p>"
        },
        {

          "reponse": "<p>A<sup>-1</sup> = \\dfrac{1}{det(A)} × com(A)<sup>T</sup>.</p><p>Com(A) = \\begin{pmatrix} 3 & 1 & -2 \\\\ -1 & 2 & 1 \\\\ 2 & -4 & 7 \\end{pmatrix}.</p><p>A<sup>-1</sup> = \\dfrac{1}{6} \\begin{pmatrix} 3 & -1 & 2 \\\\ 1 & 2 & -4 \\\\ -2 & 1 & 7 \\end{pmatrix} = \\begin{pmatrix} \\dfrac{1}{2} & -\\dfrac{1}{6} & \\dfrac{1}{3} \\\\ \\dfrac{1}{6} & \\dfrac{1}{3} & -\\dfrac{2}{3} \\\\ -\\dfrac{1}{3} & \\dfrac{1}{6} & \\dfrac{7}{6} \\end{pmatrix}.</p>"
        },
        {
          "question": "<p>4) Résoudre le système par la règle de Cramer :</p>",
          "reponse": "<p>La matrice du système est A. Le système s'écrit A × X = B avec B = (4,5,3)<sup>T</sup>.</p><p>Par la règle de Cramer : x = det(A₁)/det(A), y = det(A₂)/det(A), z = det(A₃)/det(A).</p><p>A₁ = \\begin{pmatrix} 4 & 1 & 0 \\\\ 5 & 3 & 2 \\\\ 3 & 0 & 1 \\end{pmatrix}, det(A₁) = 4×3×1 + 1×2×3 + 0×5×0 - 0×3×3 - 1×2×4 - 4×5×0 = 12+6-8 = 10.</p><p>A₂ = \\begin{pmatrix} 2 & 4 & 0 \\\\ -1 & 5 & 2 \\\\ 1 & 3 & 1 \\end{pmatrix}, det(A₂) = 2×5×1 + 4×2×1 + 0×(-1)×3 - 0×5×1 - 4×2×2 - 2×(-1)×3 = 10+8-16+6 = 8.</p><p>A₃ = \\begin{pmatrix} 2 & 1 & 4 \\\\ -1 & 3 & 5 \\\\ 1 & 0 & 3 \\end{pmatrix}, det(A₃) = 2×3×3 + 1×5×1 + 4×(-1)×0 - 4×3×1 - 1×5×2 - 2×(-1)×0 = 18+5-12-10 = 1.</p><p>Donc x = 10/6 = 5/3, y = 8/6 = 4/3, z = 1/6.</p>"

};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
