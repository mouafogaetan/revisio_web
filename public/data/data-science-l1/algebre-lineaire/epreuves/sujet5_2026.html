<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Algèbre Linéaire - L1",
  "classe": "Licence 1 Data Science",
  "sequence": "Épreuve Sequentielle N°5",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Calculs de Déterminants",
      "points": "6 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; background-color: #f4f7fc; padding: 20px; border-radius: 8px; color: #333;'><p>Le <strong>déterminant</strong> d'une matrice carrée est un outil fondamental en algèbre linéaire. Il permet de savoir si une matrice est inversible, de calculer des volumes et de résoudre des systèmes d'équations. Dans cet exercice, nous allons calculer des déterminants en utilisant différentes méthodes.</p><div class='math-block' style='background-color: #e9ecef; padding: 15px; border-radius: 6px; margin: 15px 0;'><div class='math'>$$ \\det(A) = \\begin{vmatrix} a & b \\\\ c & d \\end{vmatrix} = ad - bc $$</div></div><p>Donnez vos réponses en détaillant les étapes de calcul.</p></div>",
      "questions": [
        {
          "question": "<p style='color: #0056b3; font-weight: bold;'>1) (2 pts) Calculer le déterminant de la matrice \\( A = \\begin{pmatrix} 4 & 7 \\\\ 2 & 3 \\end{pmatrix} \\).</p>",
          "reponse": "<div style='background-color: #d4edda; padding: 15px; border-radius: 6px; color: #155724;'><p><strong>Réponse :</strong></p><p>Pour une matrice 2x2, on applique la formule <span class='math'>\\( \\det(A) = ad - bc \\)</span>.</p><p>Ici, <span class='math'>\\( a = 4, b = 7, c = 2, d = 3 \\)</span>.</p><p>Donc, <span class='math'>\\( \\det(A) = (4 \\times 3) - (7 \\times 2) = 12 - 14 = -2 \\)</span>.</p></div>"
        },
        {
          "question": "<p style='color: #0056b3; font-weight: bold;'>2) (2 pts) Utiliser la <strong>règle de Sarrus</strong> pour calculer le déterminant de \\( B = \\begin{pmatrix} 1 & 2 & 3 \\\\ 4 & 5 & 6 \\\\ 7 & 8 & 9 \\end{pmatrix} \\).</p>",
          "reponse": "<div style='background-color: #d4edda; padding: 15px; border-radius: 6px; color: #155724;'><p><strong>Réponse :</strong></p><p>La règle de Sarrus s'applique aux matrices 3x3. On recopie les deux premières colonnes à droite.</p><div class='math-block' style='background-color: #e9ecef; padding: 15px; border-radius: 6px; margin: 10px 0;'><div class='math'>$$ \\det(B) = (1 \\times 5 \\times 9) + (2 \\times 6 \\times 7) + (3 \\times 4 \\times 8) - (3 \\times 5 \\times 7) - (1 \\times 6 \\times 8) - (2 \\times 4 \\times 9) $$</div></div><p>Calcul des produits :</p><ul style='list-style-type: none; padding-left: 0;'><li>Positifs : <span class='math'>\\( 45 + 84 + 96 = 225 \\)</span></li><li>Négatifs : <span class='math'>\\( 105 + 48 + 72 = 225 \\)</span></li></ul><p>Donc, <span class='math'>\\( \\det(B) = 225 - 225 = 0 \\)</span>.</p></div>"
        },
        {
          "question": "<p style='color: #0056b3; font-weight: bold;'>3) (2 pts) On donne la matrice \\( C = \\begin{pmatrix} 2 & 0 & 1 \\\\ -1 & 3 & 2 \\\\ 4 & 1 & 0 \\end{pmatrix} \\). Effectuer un développement selon la première ligne pour calculer son déterminant.</p>",
          "reponse": "<div style='background-color: #d4edda; padding: 15px; border-radius: 6px; color: #155724;'><p><strong>Réponse :</strong></p><p>On développe selon la première ligne <span class='math'>\\( (2, 0, 1) \\)</span> :</p><div class='math-block' style='background-color: #e9ecef; padding: 15px; border-radius: 6px; margin: 10px 0;'><div class='math'>$$ \\det(C) = 2 \\times \\det\\begin{pmatrix} 3 & 2 \\\\ 1 & 0 \\end{pmatrix} - 0 \\times \\det\\begin{pmatrix} -1 & 2 \\\\ 4 & 0 \\end{pmatrix} + 1 \\times \\det\\begin{pmatrix} -1 & 3 \\\\ 4 & 1 \\end{pmatrix} $$</div></div><p>On calcule les déterminants 2x2 :</p><ul><li><span class='math'>\\( \\det\\begin{pmatrix} 3 & 2 \\\\ 1 & 0 \\end{pmatrix} = (3 \\times 0) - (2 \\times 1) = -2 \\)</span></li><li><span class='math'>\\( \\det\\begin{pmatrix} -1 & 3 \\\\ 4 & 1 \\end{pmatrix} = (-1 \\times 1) - (3 \\times 4) = -1 - 12 = -13 \\)</span></li></ul><p>Donc, <span class='math'>\\( \\det(C) = 2 \\times (-2) + 1 \\times (-13) = -4 - 13 = -17 \\)</span>.</p></div>"
        }
      ]
    },
    {
      "titre": "Applications du Déterminant",
      "points": "7 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; background-color: #f4f7fc; padding: 20px; border-radius: 8px; color: #333;'><p>Le déterminant n'est pas seulement un objet théorique. Il est utilisé dans de nombreux domaines comme la géométrie pour calculer des aires, ou en analyse de données pour comprendre la structure des matrices.</p></div>",
      "questions": [
        {
          "question": "<p style='color: #0056b3; font-weight: bold;'>1) (3 pts) Une application linéaire \\( f \\) de \\( \\mathbb{R}^2 \\) dans lui-même a pour matrice \\( M = \\begin{pmatrix} 3 & 1 \\\\ 2 & 2 \\end{pmatrix} \\) dans la base canonique. Cette application transforme un carré unité en un parallélogramme.</p><ul style='list-style-type: none; padding-left: 10px;'><li><strong>a)</strong> (1 pt) Justifier que le facteur d'agrandissement de l'aire est |det(M)|.</li><li><strong>b)</strong> (2 pts) Calculer det(M) et en déduire l'aire du parallélogramme image du carré unité.</li></ul>",
          "reponse": "<div style='background-color: #d4edda; padding: 15px; border-radius: 6px; color: #155724;'><p><strong>Réponse :</strong></p><p><strong>a)</strong> Une application linéaire transforme le carré unité (d'aire 1) en un parallélogramme. La valeur absolue de son déterminant donne le rapport par lequel les aires sont multipliées.</p><p><strong>b)</strong> Calcul du déterminant :</p><div class='math-block' style='background-color: #e9ecef; padding: 15px; border-radius: 6px; margin: 10px 0;'><div class='math'>$$ \\det(M) = \\begin{vmatrix} 3 & 1 \\\\ 2 & 2 \\end{vmatrix} = (3 \\times 2) - (1 \\times 2) = 6 - 2 = 4 $$</div></div><p>L'aire du parallélogramme est <span class='math'>\\( |\\det(M)| \\times \\text{aire(carré)} = 4 \\times 1 = 4 \\)</span> unités d'aire.</p></div>"
        },
        {
          "question": "<p style='color: #0056b3; font-weight: bold;'>2) (4 pts) En <strong>Data Science</strong>, la matrice de covariance suivante est issue d'une analyse de données :</p><div class='math-block' style='background-color: #e9ecef; padding: 15px; border-radius: 6px; margin: 10px 0;'><div class='math'>$$ S = \\begin{pmatrix} 2 & 1 \\\\ 1 & 2 \\end{pmatrix} $$</div></div><ul style='list-style-type: none; padding-left: 10px;'><li><strong>a)</strong> (2 pts) Calculer le déterminant de S. Comment qualifie-t-on une matrice dont le déterminant est strictement positif ?</li><li><strong>b)</strong> (2 pts) Rappeler les étapes de la méthode de Cramer pour résoudre \\( SX = B \\). L'utiliser pour \\( B = \\begin{pmatrix} 3 \\\\ 4 \\end{pmatrix} \\).</li></ul>",
          "reponse": "<div style='background-color: #d4edda; padding: 15px; border-radius: 6px; color: #155724;'><p><strong>Réponse :</strong></p><p><strong>a)</strong> <span class='math'>\\( \\det(S) = (2 \\times 2) - (1 \\times 1) = 4 - 1 = 3 \\)</span>.</p><p>Un déterminant strictement positif indique que la matrice est <strong>inversible</strong>. En data science, une matrice de covariance définie positive (det > 0) signifie qu'il n'y a pas de corrélation parfaite.</p><p><strong>b)</strong> Les formules de Cramer pour un système 2x2 :</p><div class='math-block' style='background-color: #e9ecef; padding: 15px; border-radius: 6px; margin: 10px 0;'><div class='math'>$$ x_1 = \\frac{\\det(S_1)}{\\det(S)} \\quad \\text{et} \\quad x_2 = \\frac{\\det(S_2)}{\\det(S)} $$</div></div><p>avec <span class='math'>\\( S_1 = \\begin{pmatrix} 3 & 1 \\\\ 4 & 2 \\end{pmatrix} \\)</span> et <span class='math'>\\( S_2 = \\begin{pmatrix} 2 & 3 \\\\ 1 & 4 \\end{pmatrix} \\)</span>.</p><p>On calcule : <span class='math'>\\( \\det(S_1) = (3 \\times 2) - (1 \\times 4) = 6 - 4 = 2 \\)</span> ; <span class='math'>\\( \\det(S_2) = (2 \\times 4) - (3 \\times 1) = 8 - 3 = 5 \\)</span>.</p><p>Donc, <span class='math'>\\( x_1 = \\frac{2}{3} \\)</span> et <span class='math'>\\( x_2 = \\frac{5}{3} \\)</span>.</p></div>"
        }
      ]
    },
    {
      "titre": "Interprétation et Applications Avancées",
      "points": "7 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; background-color: #f4f7fc; padding: 20px; border-radius: 8px; color: #333;'><p>Dans cet exercice, nous allons explorer des situations concrètes où le déterminant joue un rôle clé : le calcul de volumes et la diagonalisation.</p></div>",
      "questions": [
        {
          "question": "<p style='color: #0056b3; font-weight: bold;'>1) (3 pts) En infographie, on utilise des transformations linéaires pour manipuler des objets 3D. Soit la matrice de transformation :</p><div class='math-block' style='background-color: #e9ecef; padding: 15px; border-radius: 6px; margin: 10px 0;'><div class='math'>$$ T = \\begin{pmatrix} 1 & 0 & 0 \\\\ 0 & 1 & 0 \\\\ 0 & 0 & 2 \\end{pmatrix} $$</div></div><ul><li><strong>a)</strong> (1 pt) Identifier la transformation représentée par T.</li><li><strong>b)</strong> (2 pts) Calculer det(T). Interpréter ce résultat pour le volume d'un cube unité.</li></ul>",
          "reponse": "<div style='background-color: #d4edda; padding: 15px; border-radius: 6px; color: #155724;'><p><strong>Réponse :</strong></p><p><strong>a)</strong> C'est un <strong>agrandissement</strong> d'un facteur 2 selon l'axe z.</p><p><strong>b)</strong> Le déterminant d'une matrice diagonale est le produit des éléments diagonaux :</p><div class='math-block' style='background-color: #e9ecef; padding: 15px; border-radius: 6px; margin: 10px 0;'><div class='math'>$$ \\det(T) = 1 \\times 1 \\times 2 = 2 $$</div></div><p>Un cube unité (volume 1) sera transformé en un parallélépipède de volume 2 unités de volume. L'interprétation est que la transformation a doublé le volume.</p></div>"
        },
        {
          "question": "<p style='color: #0056b3; font-weight: bold;'>2) (4 pts) La matrice \\( A = \\begin{pmatrix} 3 & 1 \\\\ 0 & 2 \\end{pmatrix} \\) est donnée.</p><ul><li><strong>a)</strong> (1 pt) Vérifier que A est diagonalisable.</li><li><strong>b)</strong> (1 pt) Calculer les valeurs propres \\( \\lambda_1 \\) et \\( \\lambda_2 \\).</li><li><strong>c)</strong> (2 pts) On rappelle que le déterminant est égal au produit des valeurs propres. Vérifier que cette propriété est vraie pour A.</li></ul>",
          "reponse": "<div style='background-color: #d4edda; padding: 15px; border-radius: 6px; color: #155724;'><p><strong>Réponse :</strong></p><p><strong>a)</strong> La matrice \\( A \\) est triangulaire supérieure. Ses valeurs propres sont sur la diagonale. Comme elles sont distinctes, \\( A \\) est diagonalisable.</p><p><strong>b)</strong> Les valeurs propres sont <span class='math'>\\( \\lambda_1 = 3 \\)</span> et <span class='math'>\\( \\lambda_2 = 2 \\)</span>.</p><p><strong>c)</strong> On calcule le déterminant :</p><div class='math-block' style='background-color: #e9ecef; padding: 15px; border-radius: 6px; margin: 10px 0;'><div class='math'>$$ \\det(A) = \\begin{vmatrix} 3 & 1 \\\\ 0 & 2 \\end{vmatrix} = (3 \\times 2) - (1 \\times 0) = 6 $$</div></div><p>Le produit des valeurs propres est : <span class='math'>\\( 3 \\times 2 = 6 \\)</span>. On a bien l'égalité <span class='math'>\\( \\det(A) = \\lambda_1 \\cdot \\lambda_2 \\)</span>.</p></div>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
