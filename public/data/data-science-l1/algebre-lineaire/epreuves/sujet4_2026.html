<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Algèbre Linéaire - L1",
  "classe": "Licence 1 Data Science",
  "sequence": "Séquence 4",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Matrices et systèmes linéaires",
      "points": "4 pts",
      "enonce": "<div style='padding: 15px; color: #1a1a1a;'><p>Soit le système linéaire suivant :</p><div class='math-block'><div class='math'>$$ \\begin{cases} x + 2y - z = 1 \\\\ 2x - y + z = 2 \\\\ -x + y + 2z = 3 \\end{cases} $$</div></div></div>",
      "questions": [
        {
          "question": "<div style='margin-bottom: 10px;'><strong>1.</strong> Écrire ce système sous forme matricielle \( AX = B \).</div>",
          "reponse": "<div>\( A = \\begin{pmatrix} 1 & 2 & -1 \\\\ 2 & -1 & 1 \\\\ -1 & 1 & 2 \\end{pmatrix} \\), \( X = \\begin{pmatrix} x \\\\ y \\\\ z \\end{pmatrix} \\), \( B = \\begin{pmatrix} 1 \\\\ 2 \\\\ 3 \\end{pmatrix} \\)</div>"
        },
        {
          "question": "<div style='margin-bottom: 10px;'><strong>2.</strong> Résoudre le système par la méthode du pivot de Gauss.</div>",
          "reponse": "<div>On écrit la matrice augmentée et on échelonne :<br>\( \\begin{pmatrix} 1 & 2 & -1 & | & 1 \\\\ 2 & -1 & 1 & | & 2 \\\\ -1 & 1 & 2 & | & 3 \\end{pmatrix} \)<br>\( L_2 \\leftarrow L_2 - 2L_1 \\), \( L_3 \\leftarrow L_3 + L_1 \\) :<br>\( \\begin{pmatrix} 1 & 2 & -1 & | & 1 \\\\ 0 & -5 & 3 & | & 0 \\\\ 0 & 3 & 1 & | & 4 \\end{pmatrix} \)<br>\( L_3 \\leftarrow 5L_3 + 3L_2 \\) :<br>\( \\begin{pmatrix} 1 & 2 & -1 & | & 1 \\\\ 0 & -5 & 3 & | & 0 \\\\ 0 & 0 & 14 & | & 20 \\end{pmatrix} \)<br>On remonte : \( 14z = 20 \\Rightarrow z = \\frac{10}{7} \\)<br>\( -5y + 3\\left(\\frac{10}{7}\\right) = 0 \\Rightarrow -5y = -\\frac{30}{7} \\Rightarrow y = \\frac{6}{7} \\)<br>\( x + 2\\left(\\frac{6}{7}\\right) - \\frac{10}{7} = 1 \\Rightarrow x + \\frac{12}{7} - \\frac{10}{7} = 1 \\Rightarrow x + \\frac{2}{7} = 1 \\Rightarrow x = \\frac{5}{7} \\)<br>Donc \( S = \\left\\{ \\left(\\frac{5}{7}, \\frac{6}{7}, \\frac{10}{7}\\right) \\right\\} \\)</div>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Espaces vectoriels et sous-espaces",
      "points": "6 pts",
      "enonce": "<div style='padding: 15px; color: #1a1a1a;'><p>On considère \( E = \\mathbb{R}^3 \) et les sous-ensembles suivants :</p><ul><li>\( F = \\{ (x, y, z) \\in \\mathbb{R}^3 \\mid x - y + z = 0 \\} \)</li><li>\( G = \\text{Vect}\\{(1, 1, 0), (0, 1, 1)\\} \)</li></ul></div>",
      "questions": [
        {
          "question": "<div style='margin-bottom: 10px;'><strong>1.</strong> Montrer que \( F \\) est un sous-espace vectoriel de \( \\mathbb{R}^3 \\).</div>",
          "reponse": "<div>\( F \\) n'est pas vide car \( (0,0,0) \\in F \\).<br>Soient \( u = (x_1, y_1, z_1) \\) et \( v = (x_2, y_2, z_2) \\) dans \( F \\). Alors \( x_1 - y_1 + z_1 = 0 \\) et \( x_2 - y_2 + z_2 = 0 \\).<br>\( u+v = (x_1+x_2, y_1+y_2, z_1+z_2) \\) : \( (x_1+x_2) - (y_1+y_2) + (z_1+z_2) = 0 \\), donc \( u+v \\in F \\).<br>Soit \( \\lambda \\in \\mathbb{R} \\), \( \\lambda u = (\\lambda x_1, \\lambda y_1, \\lambda z_1) \\) : \( \\lambda x_1 - \\lambda y_1 + \\lambda z_1 = \\lambda(x_1 - y_1 + z_1) = 0 \\), donc \( \\lambda u \\in F \\).<br>Ainsi \( F \\) est un sous-espace vectoriel de \( \\mathbb{R}^3 \\).</div>"
        },
        {
          "question": "<div style='margin-bottom: 10px;'><strong>2.</strong> Donner une base de \( F \\) et en déduire sa dimension.</div>",
          "reponse": "<div>\( F = \\{ (x, y, z) \\in \\mathbb{R}^3 \\mid z = -x + y \\} \\).<br>Donc \( (x, y, z) = (x, y, -x + y) = x(1, 0, -1) + y(0, 1, 1) \\).<br>Une base de \( F \\) est \( \\{(1, 0, -1), (0, 1, 1)\\} \\).<br>Ces deux vecteurs sont linéairement indépendants, donc \( \\dim(F) = 2 \\).</div>"
        },
        {
          "question": "<div style='margin-bottom: 10px;'><strong>3.</strong> Déterminer \( G \\) et une base de \( G \\).</div>",
          "reponse": "<div>\( G = \\text{Vect}\\{(1, 1, 0), (0, 1, 1)\\} = \\{ a(1, 1, 0) + b(0, 1, 1) \\mid a, b \\in \\mathbb{R} \\} = \\{ (a, a+b, b) \\mid a, b \\in \\mathbb{R} \\} \\).<br>Les deux vecteurs \( (1, 1, 0) \\) et \( (0, 1, 1) \\) sont linéairement indépendants, donc ils forment une base de \( G \\).<br>\( \\dim(G) = 2 \\).</div>"
        },
        {
          "question": "<div style='margin-bottom: 10px;'><strong>4.</strong> Déterminer \( F \\cap G \\) et \( F + G \\).</div>",
          "reponse": "<div>On cherche \( (x, y, z) \\in G \\) tel que \( x - y + z = 0 \\).<br>\( (x, y, z) = (a, a+b, b) \\).<br>\( a - (a+b) + b = a - a - b + b = 0 \\).<br>Donc tout vecteur de \( G \\) est dans \( F \\). Ainsi \( G \\subset F \\).<br>Donc \( F \\cap G = G \\) et \( F + G = F \\) car \( G \\subset F \\).</div>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Applications linéaires",
      "points": "5 pts",
      "enonce": "<div style='padding: 15px; color: #1a1a1a;'><p>Soit \( f: \\mathbb{R}^3 \\to \\mathbb{R}^2 \\) définie par \( f(x, y, z) = (x + y + z, x - y) \\).</p></div>",
      "questions": [
        {
          "question": "<div style='margin-bottom: 10px;'><strong>1.</strong> Montrer que \( f \\) est linéaire.</div>",
          "reponse": "<div>Soient \( u = (x_1, y_1, z_1) \\) et \( v = (x_2, y_2, z_2) \\).<br>\( f(u+v) = f(x_1+x_2, y_1+y_2, z_1+z_2) = ((x_1+x_2)+(y_1+y_2)+(z_1+z_2), (x_1+x_2)-(y_1+y_2)) \\)<br>\( = (x_1+y_1+z_1 + x_2+y_2+z_2, x_1-y_1 + x_2-y_2) = f(u) + f(v) \\).<br>Soit \( \\lambda \\in \\mathbb{R} \\), \( f(\\lambda u) = f(\\lambda x_1, \\lambda y_1, \\lambda z_1) = (\\lambda x_1 + \\lambda y_1 + \\lambda z_1, \\lambda x_1 - \\lambda y_1) = \\lambda f(u) \\).<br>Donc \( f \\) est linéaire.</div>"
        },
        {
          "question": "<div style='margin-bottom: 10px;'><strong>2.</strong> Déterminer le noyau de \( f \\) et donner une base.</div>",
          "reponse": "<div>\( \\ker(f) = \\{ (x, y, z) \\in \\mathbb{R}^3 \\mid f(x, y, z) = (0, 0) \\} \\).<br>On a : \( x + y + z = 0 \\) et \( x - y = 0 \\Rightarrow x = y \\).<br>Donc \( x + x + z = 0 \\Rightarrow z = -2x \\).<br>\( \\ker(f) = \\{ (x, x, -2x) \\mid x \\in \\mathbb{R} \\} = \\text{Vect}\\{(1, 1, -2)\\} \\).<br>Une base de \( \\ker(f) \\) est \( \\{(1, 1, -2)\\} \\).</div>"
        },
        {
          "question": "<div style='margin-bottom: 10px;'><strong>3.</strong> Déterminer l'image de \( f \\) et donner une base.</div>",
          "reponse": "<div>\( \\text{Im}(f) = \\{ f(x, y, z) \\mid (x, y, z) \\in \\mathbb{R}^3 \\} \\).<br>\( f(x, y, z) = (x+y+z, x-y) \\).<br>Soit \( (a, b) \\in \\mathbb{R}^2 \\). On cherche \( (x, y, z) \\) tel que \( a = x+y+z \\) et \( b = x-y \\).<br>On a \( x = b + y \\) et \( a = b + y + y + z = b + 2y + z \\Rightarrow z = a - b - 2y \\).<br>On peut choisir \( y = 0 \\), alors \( x = b \\), \( z = a - b \\).<br>Donc \( f(b, 0, a-b) = (b + 0 + a-b, b - 0) = (a, b) \\).<br>Ainsi \( \\text{Im}(f) = \\mathbb{R}^2 \\).<br>Une base de \( \\text{Im}(f) \\) est \( \\{(1, 0), (0, 1)\\} \\).</div>"
        },
        {
          "question": "<div style='margin-bottom: 10px;'><strong>4.</strong> Vérifier le théorème du rang.</div>",
          "reponse": "<div>\( \\dim(\\mathbb{R}^3) = 3 \\), \( \\dim(\\ker(f)) = 1 \\), \( \\dim(\\text{Im}(f)) = 2 \\).<br>On a bien \( 3 = 1 + 2 \\), donc le théorème du rang est vérifié.</div>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Diagonalisation",
      "points": "5 pts",
      "enonce": "<div style='padding: 15px; color: #1a1a1a;'><p>Soit \( A = \\begin{pmatrix} 2 & 0 & 0 \\\\ 0 & 3 & 1 \\\\ 0 & 1 & 3 \\end{pmatrix} \\).</p></div>",
      "questions": [
        {
          "question": "<div style='margin-bottom: 10px;'><strong>1.</strong> Déterminer le polynôme caractéristique de \( A \\).</div>",
          "reponse": "<div>\( P_A(\\lambda) = \\det(A - \\lambda I) = \\begin{vmatrix} 2-\\lambda & 0 & 0 \\\\ 0 & 3-\\lambda & 1 \\\\ 0 & 1 & 3-\\lambda \\end{vmatrix} = (2-\\lambda) \\begin{vmatrix} 3-\\lambda & 1 \\\\ 1 & 3-\\lambda \\end{vmatrix} \\)<br>\( = (2-\\lambda)((3-\\lambda)^2 - 1) = (2-\\lambda)(\\lambda^2 - 6\\lambda + 8) = (2-\\lambda)(\\lambda - 2)(\\lambda - 4) = -(\\lambda - 2)^2(\\lambda - 4) \\).<br>Les valeurs propres sont \( \\lambda_1 = 2 \\) (multiplicité 2) et \( \\lambda_2 = 4 \\) (multiplicité 1).</div>"
        },
        {
          "question": "<div style='margin-bottom: 10px;'><strong>2.</strong> Déterminer les espaces propres de \( A \\).</div>",
          "reponse": "<div>Pour \( \\lambda = 2 \\) : \( A - 2I = \\begin{pmatrix} 0 & 0 & 0 \\\\ 0 & 1 & 1 \\\\ 0 & 1 & 1 \\end{pmatrix} \\). On a \( y + z = 0 \\Rightarrow z = -y \\).<br>\( E_2 = \\{ (x, y, -y) \\mid x, y \\in \\mathbb{R} \\} = \\text{Vect}\\{(1, 0, 0), (0, 1, -1)\\} \\), \( \\dim(E_2) = 2 \\).<br>Pour \( \\lambda = 4 \\) : \( A - 4I = \\begin{pmatrix} -2 & 0 & 0 \\\\ 0 & -1 & 1 \\\\ 0 & 1 & -1 \\end{pmatrix} \\). On a \( -2x = 0 \\Rightarrow x = 0 \\), et \( -y + z = 0 \\Rightarrow z = y \\).<br>\( E_4 = \\{ (0, y, y) \\mid y \\in \\mathbb{R} \\} = \\text{Vect}\\{(0, 1, 1)\\} \\), \( \\dim(E_4) = 1 \\).</div>"
        },
        {
          "question": "<div style='margin-bottom: 10px;'><strong>3.</strong> La matrice \( A \\) est-elle diagonalisable ? Justifier.</div>",
          "reponse": "<div>Les multiplicités algébriques et géométriques sont :<br>Pour \( \\lambda = 2 \\) : multiplicité algébrique = 2, multiplicité géométrique = 2.<br>Pour \( \\lambda = 4 \\) : multiplicité algébrique = 1, multiplicité géométrique = 1.<br>Les multiplicités sont égales pour toutes les valeurs propres, donc \( A \\) est diagonalisable.</div>"
        },
        {
          "question": "<div style='margin-bottom: 10px;'><strong>4.</strong> Donner une matrice de passage \( P \\) et la matrice diagonale \( D \\) telles que \( A = P D P^{-1} \\).</div>",
          "reponse": "<div>On choisit une base de chaque espace propre :<br>Pour \( E_2 \\) : \( u_1 = (1, 0, 0) \\), \( u_2 = (0, 1, -1) \\).<br>Pour \( E_4 \\) : \( u_3 = (0, 1, 1) \\).<br>Alors \( P = \\begin{pmatrix} 1 & 0 & 0 \\\\ 0 & 1 & 1 \\\\ 0 & -1 & 1 \\end{pmatrix} \\) et \( D = \\text{diag}(2, 2, 4) = \\begin{pmatrix} 2 & 0 & 0 \\\\ 0 & 2 & 0 \\\\ 0 & 0 & 4 \\end{pmatrix} \\).<br>On a bien \( A = P D P^{-1} \\).</div>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
