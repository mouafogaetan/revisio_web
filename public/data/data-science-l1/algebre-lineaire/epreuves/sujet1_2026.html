<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Algèbre Linéaire - L1",
  "classe": "Licence 1 Data Science",
  "sequence": "Séquence 1",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Résolution de Systèmes par la Méthode du Pivot de Gauss",
      "points": "4 pts",
      "enonce": "<p>Résoudre les systèmes linéaires suivants en utilisant la méthode du pivot de Gauss. Pour chaque système, indiquer l'ensemble des solutions et la nature géométrique de l'ensemble solution (point, droite, plan, vide).</p>",
      "questions": [
        {
          "question": "<p><strong>1.a</strong> <div class='math-block'> <div class='math'>$$\\begin{cases} x + y + 2z = 3 \\\\ x + 2y + z = 1 \\\\ 2x + y + z = 0 \\end{cases}$$</div></div></p>",
          "reponse": "<p><strong>Solution :</strong> Le système admet une solution unique <span class='math'>(x, y, z) = (-1, 1, 2)</span>.</p><p><strong>Interprétation géométrique :</strong> Trois plans sécants en un point unique.</p>"
        },
        {
          "question": "<p><strong>1.b</strong> <div class='math-block'> <div class='math'>$$\\begin{cases} x - y + z = 1 \\\\ 2x + y - z = 3 \\\\ 3x + 0y + 0z = 4 \\end{cases}$$</div></div></p>",
          "reponse": "<p><strong>Solution :</strong> Le système est incompatible (aucune solution).</p><p><strong>Interprétation géométrique :</strong> Trois plans n'ayant pas de point d'intersection commun.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Systèmes avec Paramètres et Discussion",
      "points": "4 pts",
      "enonce": "<p>On considère le système linéaire suivant dépendant du paramètre réel <span class='math'>m</span> :</p><div class='math-block' style='background:#f0f4f8; padding:15px; border-radius:8px; text-align:center;'><div class='math'>$$\\begin{cases} x + my + m^2z = 0 \\\\ mx + y + mz = 0 \\\\ m^2x + my + z = 0 \\end{cases}$$</div></div>",
      "questions": [
        {
          "question": "<p><strong>2.a</strong> En utilisant la méthode du pivot de Gauss, discuter suivant les valeurs de <span class='math'>m</span> l'existence et la nature des solutions de ce système.</p>",
          "reponse": "<p>Le système est homogène (second membre nul). Il admet toujours la solution nulle.</p><p><strong>Cas 1 :</strong> <span class='math'>m = 1</span></p><p>Les trois équations sont identiques : <span class='math'>x + y + z = 0</span>. Le système admet une infinité de solutions (plan).</p><p><strong>Cas 2 :</strong> <span class='math'>m = -1</span></p><p>Les équations 2 et 3 sont proportionnelles. Le système se réduit à deux équations indépendantes. La solution est une droite vectorielle.</p><p><strong>Cas 3 :</strong> <span class='math'>m \\notin \\{-1, 1\\}</span></p><p>Le système admet une unique solution : la solution nulle <span class='math'>(0, 0, 0)</span>.</p>"
        },
        {
          "question": "<p><strong>2.b</strong> Pour chaque cas, donner l'interprétation géométrique de l'ensemble des solutions.</p>",
          "reponse": "<p><span class='math'>m = 1</span> : plan passant par l'origine.</p><p><span class='math'>m = -1</span> : droite vectorielle passant par l'origine.</p><p>Autres valeurs : le seul point <span class='math'>(0, 0, 0)</span>.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Interprétation Géométrique et Rang d'un Système",
      "points": "4 pts",
      "enonce": "<p>L'espace est muni d'un repère orthonormé. On considère les trois plans <span class='math'>\\mathcal P_1, \\mathcal P_2, \\mathcal P_3</span> d'équations respectives :</p><div class='math-block' style='background:#f0f4f8; padding:15px; border-radius:8px; text-align:center;'><div class='math'>$$\\begin{array}{rcl} \\mathcal P_1 &:& 2x - y + z = 1 \\\\ \\mathcal P_2 &:& x + y - z = 2 \\\\ \\mathcal P_3 &:& 3x + 0y + 0z = 3 \\end{array}$$</div></div>",
      "questions": [
        {
          "question": "<p><strong>3.a</strong> Déterminer l'intersection des trois plans.</p>",
          "reponse": "<p>En résolvant le système, on trouve : <span class='math'>x = 1</span>, <span class='math'>y = 1</span>, <span class='math'>z = 0</span>. L'intersection est le point <span class='math'>(1, 1, 0)</span>.</p>"
        },
        {
          "question": "<p><strong>3.b</strong> Calculer le rang de la matrice du système et le rang de la matrice augmentée. En déduire la compatibilité du système.</p>",
          "reponse": "<p>La matrice du système est <span class='math'>A = \\begin{pmatrix} 2 & -1 & 1 \\\\ 1 & 1 & -1 \\\\ 3 & 0 & 0 \\end{pmatrix}</span>.</p><p>Le rang de A est 3 (les trois lignes sont linéairement indépendantes). La matrice augmentée est de rang 3 également. Le système est compatible et admet une solution unique.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Calcul Matriciel et Applications",
      "points": "4 pts",
      "enonce": "<p>Soient les matrices <span class='math'>A = \\begin{pmatrix} 1 & 2 \\\\ 3 & 4 \\end{pmatrix}</span> et <span class='math'>B = \\begin{pmatrix} 0 & -1 \\\\ 1 & 2 \\end{pmatrix}</span>.</p>",
      "questions": [
        {
          "question": "<p><strong>4.a</strong> Calculer <span class='math'>A + B</span>, <span class='math'>2A - 3B</span>, <span class='math'>AB</span> et <span class='math'>BA</span>. Que constate-t-on ?</p>",
          "reponse": "<p><span class='math'>A + B = \\begin{pmatrix} 1 & 1 \\\\ 4 & 6 \\end{pmatrix}</span></p><p><span class='math'>2A - 3B = \\begin{pmatrix} 2 & 4 \\\\ 6 & 8 \\end{pmatrix} - \\begin{pmatrix} 0 & -3 \\\\ 3 & 6 \\end{pmatrix} = \\begin{pmatrix} 2 & 7 \\\\ 3 & 2 \\end{pmatrix}</span></p><p><span class='math'>AB = \\begin{pmatrix} 1 \\times 0 + 2 \\times 1 & 1 \\times (-1) + 2 \\times 2 \\\\ 3 \\times 0 + 4 \\times 1 & 3 \\times (-1) + 4 \\times 2 \\end{pmatrix} = \\begin{pmatrix} 2 & 3 \\\\ 4 & 5 \\end{pmatrix}</span></p><p><span class='math'>BA = \\begin{pmatrix} 0 \\times 1 + (-1) \\times 3 & 0 \\times 2 + (-1) \\times 4 \\\\ 1 \\times 1 + 2 \\times 3 & 1 \\times 2 + 2 \\times 4 \\end{pmatrix} = \\begin{pmatrix} -3 & -4 \\\\ 7 & 10 \\end{pmatrix}</span></p><p>On constate que <span class='math'>AB \\neq BA</span>. Le produit matriciel n'est pas commutatif.</p>"
        },
        {
          "question": "<p><strong>4.b</strong> Calculer le déterminant de <span class='math'>A</span> et de <span class='math'>B</span>. Les matrices sont-elles inversibles ?</p>",
          "reponse": "<p><span class='math'>\\det(A) = 1 \\times 4 - 2 \\times 3 = 4 - 6 = -2 \\neq 0</span>. A est inversible.</p><p><span class='math'>\\det(B) = 0 \\times 2 - (-1) \\times 1 = 0 + 1 = 1 \\neq 0</span>. B est inversible.</p>"
        },
        {
          "question": "<p><strong>4.c</strong> Donner l'inverse de <span class='math'>A</span> en utilisant la formule <span class='math'>A^{-1} = \\frac{1}{\\det(A)} \\begin{pmatrix} d & -b \\\\ -c & a \\end{pmatrix}</span>.</p>",
          "reponse": "<p><span class='math'>A^{-1} = \\frac{1}{-2} \\begin{pmatrix} 4 & -2 \\\\ -3 & 1 \\end{pmatrix} = \\begin{pmatrix} -2 & 1 \\\\ \\frac{3}{2} & -\\frac{1}{2} \\end{pmatrix}</span></p>"
        }
      ]
    },
    {
      "titre": "Exercice 5 : Formules de Cramer",
      "points": "4 pts",
      "enonce": "<p>Résoudre le système linéaire suivant en utilisant les formules de Cramer :</p><div class='math-block' style='background:#f0f4f8; padding:15px; border-radius:8px; text-align:center;'><div class='math'>$$\\begin{cases} 2x - y = 3 \\\\ x + 3y = 5 \\end{cases}$$</div></div>",
      "questions": [
        {
          "question": "<p><strong>5.a</strong> Écrire la matrice <span class='math'>A</span> du système et le vecteur <span class='math'>B</span> des seconds membres.</p>",
          "reponse": "<p><span class='math'>A = \\begin{pmatrix} 2 & -1 \\\\ 1 & 3 \\end{pmatrix}</span> et <span class='math'>B = \\begin{pmatrix} 3 \\\\ 5 \\end{pmatrix}</span>.</p>"
        },
        {
          "question": "<p><strong>5.b</strong> Calculer <span class='math'>\\det(A)</span>.</p>",
          "reponse": "<p><span class='math'>\\det(A) = 2 \\times 3 - (-1) \\times 1 = 6 + 1 = 7</span>.</p>"
        },
        {
          "question": "<p><strong>5.c</strong> Déterminer les matrices <span class='math'>A_x</span> et <span class='math'>A_y</span>, puis calculer leurs déterminants.</p>",
          "reponse": "<p><span class='math'>A_x = \\begin{pmatrix} 3 & -1 \\\\ 5 & 3 \\end{pmatrix}</span>, <span class='math'>\\det(A_x) = 3 \\times 3 - (-1) \\times 5 = 9 + 5 = 14</span></p><p><span class='math'>A_y = \\begin{pmatrix} 2 & 3 \\\\ 1 & 5 \\end{pmatrix}</span>, <span class='math'>\\det(A_y) = 2 \\times 5 - 3 \\times 1 = 10 - 3 = 7</span></p>"
        },
        {
          "question": "<p><strong>5.d</strong> En déduire les valeurs de <span class='math'>x</span> et <span class='math'>y</span>.</p>",
          "reponse": "<p><span class='math'>x = \\frac{\\det(A_x)}{\\det(A)} = \\frac{14}{7} = 2</span></p><p><span class='math'>y = \\frac{\\det(A_y)}{\\det(A)} = \\frac{7}{7} = 1</span></p>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
