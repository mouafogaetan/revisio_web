<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
 "matiere": "Premiers Pas en Machine Learning - L1",
 "classe": "Licence 1 Data Science",
 "sequence": "Évaluation Séquentielle n°6",
 "anneeScolaire": "2025-2026",
 "exercices": [
   {
     "titre": "Classification avec k-NN et Régression Logistique",
     "points": "6 pts",
     "enonce": "<p>Un data scientist souhaite construire un modèle pour prédire si un client d'une banque camerounaise va souscrire à un prêt (<span style='font-weight: bold;'>y = 1</span>) ou non (<span style='font-weight: bold;'>y = 0</span>) en fonction de son revenu annuel (<span style='font-weight: bold;'>Revenu</span>) et de son âge (<span style='font-weight: bold;'>Âge</span>). Il dispose des données d'entraînement suivantes :</p><table style='width: 100%; border-collapse: collapse; margin: 15px 0; font-size: 0.9rem;'><thead><tr style='background-color: #f2f2f2;'><th style='padding: 8px; border: 1px solid #ddd;'>Client</th><th style='padding: 8px; border: 1px solid #ddd;'>Revenu (en millions FCFA)</th><th style='padding: 8px; border: 1px solid #ddd;'>Âge (ans)</th><th style='padding: 8px; border: 1px solid #ddd;'>Prêt (y)</th></tr></thead><tbody><tr><td style='padding: 8px; border: 1px solid #ddd;'>A</td><td style='padding: 8px; border: 1px solid #ddd;'>5</td><td style='padding: 8px; border: 1px solid #ddd;'>25</td><td style='padding: 8px; border: 1px solid #ddd;'>0</td></tr><tr><td style='padding: 8px; border: 1px solid #ddd;'>B</td><td style='padding: 8px; border: 1px solid #ddd;'>12</td><td style='padding: 8px; border: 1px solid #ddd;'>40</td><td style='padding: 8px; border: 1px solid #ddd;'>1</td></tr><tr><td style='padding: 8px; border: 1px solid #ddd;'>C</td><td style='padding: 8px; border: 1px solid #ddd;'>8</td><td style='padding: 8px; border: 1px solid #ddd;'>30</td><td style='padding: 8px; border: 1px solid #ddd;'>0</td></tr><tr><td style='padding: 8px; border: 1px solid #ddd;'>D</td><td style='padding: 8px; border: 1px solid #ddd;'>15</td><td style='padding: 8px; border: 1px solid #ddd;'>50</td><td style='padding: 8px; border: 1px solid #ddd;'>1</td></tr></tbody></table>",
     "questions": [
       {
         "question": "<p>1) <span style='font-weight: bold;'>Identifier le type d'apprentissage.</span> Ce problème est-il un problème d'apprentissage supervisé ou non supervisé ? Justifiez votre réponse. [1 pt]</p>",
         "reponse": "<p>Il s'agit d'un problème d'apprentissage <span style='font-weight: bold;'>supervisé</span>. En effet, les données d'entraînement contiennent à la fois les variables explicatives (Revenu et Âge) et la variable cible (Prêt) qui est l'étiquette à prédire.</p>"
       },
       {
         "question": "<p>2) <span style='font-weight: bold;'>Appliquer le k-NN.</span> On choisit <span style='font-weight: bold;'>k = 3</span> et la distance euclidienne. Un nouveau client a un revenu de <span style='font-weight: bold;'>10 millions FCFA</span> et <span style='font-weight: bold;'>35 ans</span>. Déterminez la classe prédite par l'algorithme des k-plus proches voisins. <em>Vous détaillerez les calculs des distances.</em> [3 pts]</p>",
         "reponse": "<p><span style='font-weight: bold;'>Calcul des distances euclidiennes :</span></p><ul><li>Client A : \\( \\sqrt{(10-5)^2 + (35-25)^2} = \\sqrt{25 + 100} = \\sqrt{125} \\approx 11.18 \\)</li><li>Client B : \\( \\sqrt{(10-12)^2 + (35-40)^2} = \\sqrt{4 + 25} = \\sqrt{29} \\approx 5.39 \\)</li><li>Client C : \\( \\sqrt{(10-8)^2 + (35-30)^2} = \\sqrt{4 + 25} = \\sqrt{29} \\approx 5.39 \\)</li><li>Client D : \\( \\sqrt{(10-15)^2 + (35-50)^2} = \\sqrt{25 + 225} = \\sqrt{250} \\approx 15.81 \\)</li></ul><p>Les 3 plus proches voisins sont les clients B, C et D (les deux premiers à 5.39, le suivant à 11.18). Leurs classes sont respectivement 1, 0 et 1. La classe majoritaire est 1. La prédiction pour le nouveau client est donc <span style='font-weight: bold;'>1</span> (souscription au prêt).</p>"
       },
       {
         "question": "<p>3) <span style='font-weight: bold;'>Comprendre la régression logistique.</span> Expliquez en quelques lignes pourquoi la fonction sigmoïde est utilisée en sortie d'un modèle de régression logistique et ce que représente sa valeur. [2 pts]</p>",
         "reponse": "<p>La fonction sigmoïde transforme la sortie linéaire du modèle en une valeur comprise entre 0 et 1, qui peut être interprétée comme une <span style='font-weight: bold;'>probabilité</span> d'appartenance à la classe positive (y=1). Une valeur proche de 1 indique une forte probabilité que l'exemple appartienne à la classe 1, et une valeur proche de 0 indique une forte probabilité qu'il appartienne à la classe 0 [citation:1].</p>"
       }
     ]
   },
   {
     "titre": "Clustering avec k-Means",
     "points": "4 pts",
     "enonce": "<p>Une entreprise de télécommunications souhaite segmenter ses clients en fonction de leur utilisation. Elle dispose pour cela des données de deux variables : le nombre de minutes d'appel par mois (<span style='font-weight: bold;'>Minutes</span>) et le nombre de SMS envoyés par mois (<span style='font-weight: bold;'>SMS</span>). Un échantillon de 6 clients est représenté par les points suivants :</p><table style='width: 100%; border-collapse: collapse; margin: 15px 0; font-size: 0.9rem;'><thead><tr style='background-color: #f2f2f2;'><th style='padding: 8px; border: 1px solid #ddd;'>Client</th><th style='padding: 8px; border: 1px solid #ddd;'>Minutes</th><th style='padding: 8px; border: 1px solid #ddd;'>SMS</th></tr></thead><tbody><tr><td style='padding: 8px; border: 1px solid #ddd;'>1</td><td style='padding: 8px; border: 1px solid #ddd;'>100</td><td style='padding: 8px; border: 1px solid #ddd;'>50</td></tr><tr><td style='padding: 8px; border: 1px solid #ddd;'>2</td><td style='padding: 8px; border: 1px solid #ddd;'>150</td><td style='padding: 8px; border: 1px solid #ddd;'>30</td></tr><tr><td style='padding: 8px; border: 1px solid #ddd;'>3</td><td style='padding: 8px; border: 1px solid #ddd;'>200</td><td style='padding: 8px; border: 1px solid #ddd;'>20</td></tr><tr><td style='padding: 8px; border: 1px solid #ddd;'>4</td><td style='padding: 8px; border: 1px solid #ddd;'>80</td><td style='padding: 8px; border: 1px solid #ddd;'>120</td></tr><tr><td style='padding: 8px; border: 1px solid #ddd;'>5</td><td style='padding: 8px; border: 1px solid #ddd;'>120</td><td style='padding: 8px; border: 1px solid #ddd;'>100</td></tr><tr><td style='padding: 8px; border: 1px solid #ddd;'>6</td><td style='padding: 8px; border: 1px solid #ddd;'>60</td><td style='padding: 8px; border: 1px solid #ddd;'>130</td></tr></tbody></table>",
     "questions": [
       {
         "question": "<p>1) <span style='font-weight: bold;'>Expliquer le principe.</span> Expliquez en une phrase l'objectif de l'algorithme k-means pour ce problème de segmentation. [1 pt]</p>",
         "reponse": "<p>L'objectif de l'algorithme k-means est de regrouper les clients en k groupes (clusters) homogènes, de sorte que les clients d'un même groupe aient des profils d'utilisation similaires, et que les groupes soient distincts les uns des autres.</p>"
       },
       {
         "question": "<p>2) <span style='font-weight: bold;'>Appliquer une itération de k-Means.</span> On souhaite segmenter les clients en <span style='font-weight: bold;'>k = 2</span> clusters. Les centroïdes initiaux sont choisis aléatoirement : <span style='font-weight: bold;'>C1 = (100, 50)</span> (client 1) et <span style='font-weight: bold;'>C2 = (200, 20)</span> (client 3).<br> a) Calculez la distance de chaque point à chaque centroïde (vous utiliserez la distance euclidienne). [2 pts]<br> b) Assignez chaque point au centroïde le plus proche et déterminez les nouveaux centroïdes (en prenant la moyenne des points de chaque cluster). [1 pt]</p>",
         "reponse": "<p><span style='font-weight: bold;'>a) Distances :</span></p><ul><li>Client 1 (100,50) : d(C1)=0 ; d(C2)= \\( \\sqrt{(100-200)^2+(50-20)^2} = \\sqrt{10000+900} \\approx 104.4 \\)</li><li>Client 2 (150,30) : d(C1)= \\( \\sqrt{(150-100)^2+(30-50)^2} = \\sqrt{2500+400} \\approx 53.85 \\) ; d(C2)= \\( \\sqrt{(150-200)^2+(30-20)^2} = \\sqrt{2500+100} \\approx 50.99 \\)</li><li>Client 3 (200,20) : d(C1)= \\( \\sqrt{(200-100)^2+(20-50)^2} = \\sqrt{10000+900} \\approx 104.4 \\) ; d(C2)=0</li><li>Client 4 (80,120) : d(C1)= \\( \\sqrt{(80-100)^2+(120-50)^2} = \\sqrt{400+4900} \\approx 72.8 \\) ; d(C2)= \\( \\sqrt{(80-200)^2+(120-20)^2} = \\sqrt{14400+10000} \\approx 156.2 \\)</li><li>Client 5 (120,100) : d(C1)= \\( \\sqrt{(120-100)^2+(100-50)^2} = \\sqrt{400+2500} \\approx 53.85 \\) ; d(C2)= \\( \\sqrt{(120-200)^2+(100-20)^2} = \\sqrt{6400+6400} \\approx 113.14 \\)</li><li>Client 6 (60,130) : d(C1)= \\( \\sqrt{(60-100)^2+(130-50)^2} = \\sqrt{1600+6400} \\approx 89.44 \\) ; d(C2)= \\( \\sqrt{(60-200)^2+(130-20)^2} = \\sqrt{19600+12100} \\approx 178.04 \\)</li></ul><p><span style='font-weight: bold;'>b) Assignation :</span></p><ul><li><span style='font-weight: bold;'>Cluster 1 (C1)</span> : Clients 1, 4, 5, 6 (plus proches de C1).</li><li><span style='font-weight: bold;'>Cluster 2 (C2)</span> : Clients 2, 3 (plus proches de C2).</li></ul><p><span style='font-weight: bold;'>Nouveaux centroïdes :</span></p><ul><li>Nouveau C1 : moyenne des points du cluster 1 = ((100+80+120+60)/4, (50+120+100+130)/4) = (90, 100)</li><li>Nouveau C2 : moyenne des points du cluster 2 = ((150+200)/2, (30+20)/2) = (175, 25)</li></ul>"
       }
     ]
   },
   {

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
