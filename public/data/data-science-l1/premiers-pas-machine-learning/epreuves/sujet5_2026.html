<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Premiers Pas en Machine Learning - L1",
  "classe": "Licence 1 Data Science",
  "sequence": "Évaluation Séquentielle n°5",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Classification - Régression Logistique (4 pts)",
      "points": "4 pts",
      "enonce": "<p>Cet exercice porte sur la classification binaire avec la régression logistique.</p><p>On souhaite prédire si un client va acheter un produit en fonction de son âge et de son revenu. Un jeu de données de 200 clients est disponible.</p>",
      "questions": [
        {
          "question": "<p><strong>1.1 (2 pts)</strong> Expliquez pourquoi la régression linéaire n'est pas adaptée à ce problème de classification. En quoi la régression logistique est-elle plus appropriée ?</p>",
          "reponse": "<p><strong>Réponse :</strong></p><p>La régression linéaire est conçue pour prédire des valeurs continues. Dans un problème de classification, la variable cible est catégorielle (0 ou 1). Utiliser la régression linéaire produirait des prédictions qui peuvent être en dehors de l'intervalle [0,1], ce qui n'a pas de sens pour une probabilité.</p><p>La régression logistique est plus appropriée car elle utilise la fonction sigmoïde qui transforme n'importe quelle valeur réelle en une probabilité comprise entre 0 et 1. De plus, elle est basée sur la fonction de coût cross-entropy, adaptée à la classification.</p>"
        },
        {
          "question": "<p><strong>1.2 (2 pts)</strong> Après entraînement, le modèle donne les probabilités suivantes pour 3 clients :</p><ul style='padding-left: 20px;'><li>Client A : probabilité = 0.15</li><li>Client B : probabilité = 0.72</li><li>Client C : probabilité = 0.51</li></ul><p>En utilisant un seuil de 0.5, quelles sont les classes prédites pour ces 3 clients ? Justifiez votre réponse.</p>",
          "reponse": "<p><strong>Réponse :</strong></p><p>Seuil = 0.5 → Si probabilité ≥ 0.5, la classe prédite est 1 (achat). Sinon, classe 0 (pas d'achat).</p><ul style='padding-left: 20px;'><li>Client A : 0.15 < 0.5 → Classe 0</li><li>Client B : 0.72 ≥ 0.5 → Classe 1</li><li>Client C : 0.51 ≥ 0.5 → Classe 1</li></ul><p>Le client A est classé comme non-acheteur. Les clients B et C sont classés comme acheteurs (avec des probabilités différentes).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : K-NN (4 pts)",
      "points": "4 pts",
      "enonce": "<p>Cet exercice porte sur l'algorithme des k-plus proches voisins (k-NN).</p>",
      "questions": [
        {
          "question": "<p><strong>2.1 (2 pts)</strong> On considère les 5 points d'entraînement suivants :</p><div style='overflow-x: auto;'><table style='width: 100%; border-collapse: collapse; font-size: 0.9rem; margin: 10px 0;'><thead><tr style='background: #1a237e; color: white;'><th style='padding: 6px; border: 1px solid #ddd;'>x₁</th><th style='padding: 6px; border: 1px solid #ddd;'>x₂</th><th style='padding: 6px; border: 1px solid #ddd;'>Classe</th></tr></thead><tbody><tr><td style='padding: 6px; border: 1px solid #ddd;'>1</td><td style='padding: 6px; border: 1px solid #ddd;'>2</td><td style='padding: 6px; border: 1px solid #ddd;'>A</td></tr><tr style='background: #f0f4ff;'><td style='padding: 6px; border: 1px solid #ddd;'>2</td><td style='padding: 6px; border: 1px solid #ddd;'>1</td><td style='padding: 6px; border: 1px solid #ddd;'>B</td></tr><tr><td style='padding: 6px; border: 1px solid #ddd;'>3</td><td style='padding: 6px; border: 1px solid #ddd;'>3</td><td style='padding: 6px; border: 1px solid #ddd;'>A</td></tr><tr style='background: #f0f4ff;'><td style='padding: 6px; border: 1px solid #ddd;'>4</td><td style='padding: 6px; border: 1px solid #ddd;'>2</td><td style='padding: 6px; border: 1px solid #ddd;'>B</td></tr><tr><td style='padding: 6px; border: 1px solid #ddd;'>5</td><td style='padding: 6px; border: 1px solid #ddd;'>4</td><td style='padding: 6px; border: 1px solid #ddd;'>A</td></tr></tbody></table></div><p>Un nouveau point a pour coordonnées (3, 2).</p><p>En utilisant la distance euclidienne avec k = 3, déterminez la classe de ce nouveau point. Montrez vos calculs.</p>",
          "reponse": "<p><strong>Réponse :</strong></p><p><strong>Calcul des distances :</strong></p><ul style='padding-left: 20px;'><li>Point (1,2) : d = √((3-1)² + (2-2)²) = √(4 + 0) = 2</li><li>Point (2,1) : d = √((3-2)² + (2-1)²) = √(1 + 1) = √2 ≈ 1.41</li><li>Point (3,3) : d = √((3-3)² + (2-3)²) = √(0 + 1) = 1</li><li>Point (4,2) : d = √((3-4)² + (2-2)²) = √(1 + 0) = 1</li><li>Point (5,4) : d = √((3-5)² + (2-4)²) = √(4 + 4) = √8 ≈ 2.83</li></ul><p><strong>Les 3 plus proches voisins sont :</strong></p><ul style='padding-left: 20px;'><li>Point (3,3) - Classe A - distance 1</li><li>Point (4,2) - Classe B - distance 1</li><li>Point (2,1) - Classe B - distance 1.41</li></ul><p>Classes : A : 1 vote, B : 2 votes → La classe prédite est B.</p>"
        },
        {
          "question": "<p><strong>2.2 (2 pts)</strong> Expliquez ce qu'est le paramètre k dans l'algorithme k-NN. Comment le choix de k influence-t-il le modèle ? Citez un avantage et un inconvénient de cet algorithme.</p>",
          "reponse": "<p><strong>Réponse :</strong></p><p>Le paramètre k est le nombre de plus proches voisins pris en compte pour la décision. Il influence la complexité du modèle :</p><ul style='padding-left: 20px;'><li><strong>k petit</strong> : modèle flexible, plus sensible au bruit (risque de sur-apprentissage)</li><li><strong>k grand</strong> : modèle plus stable, mais peut lisser les frontières de décision (risque de sous-apprentissage)</li></ul><p><strong>Avantage :</strong> Algorithme simple, intuitif, non paramétrique (pas d'hypothèse sur la distribution des données).</p><p><strong>Inconvénient :</strong> Coût de calcul élevé (distance à calculer avec tous les points), sensible à la dimensionnalité (fléau de la dimension).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Clustering avec k-means (4 pts)",
      "points": "4 pts",
      "enonce": "<p>Cet exercice porte sur l'algorithme de clustering k-means.</p>",
      "questions": [
        {
          "question": "<p><strong>3.1 (2 pts)</strong> Expliquez en quelques lignes le principe de l'algorithme k-means. Décrivez les étapes principales de l'algorithme.</p>",
          "reponse": "<p><strong>Réponse :</strong></p><p>L'algorithme k-means est un algorithme de clustering (regroupement non supervisé) qui partitionne les données en k groupes (clusters). Les étapes sont :</p><ol style='padding-left: 20px;'><li><strong>Initialisation :</strong> Choisir aléatoirement k centroïdes (centres des clusters).</li><li><strong>Assignation :</strong> Assigner chaque point au centroïde le plus proche (en utilisant la distance euclidienne).</li><li><strong>Mise à jour :</strong> Recalculer les centroïdes comme la moyenne des points de chaque cluster.</li><li><strong>Itération :</strong> Répéter les étapes 2 et 3 jusqu'à convergence (les centroïdes ne bougent plus).</li></ol>"
        },
        {
          "question": "<p><strong>3.2 (2 pts)</strong> Pour déterminer le nombre optimal de clusters k, on utilise la méthode du coude (Elbow Method) avec l'inertie. Expliquez le principe de cette méthode.</p>",
          "reponse": "<p><strong>Réponse :</strong></p><p>La méthode du coude consiste à calculer l'inertie (somme des distances au carré entre les points et leur centroïde) pour différentes valeurs de k. L'inertie diminue quand k augmente.</p><p>On trace l'inertie en fonction de k. Le point où la courbe s'infléchit brutalement (un coude) indique le nombre optimal de clusters. Avant ce point, l'ajout d'un cluster réduit significativement l'inertie. Après, la réduction est moindre.</p><p>Cette méthode est empirique mais efficace en pratique.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Évaluation de Modèles (4 pts)",
      "points": "4 pts",
      "enonce": "<p>Cet exercice porte sur l'évaluation des modèles de Machine Learning.</p>",
      "questions": [
        {
          "question": "<p><strong>4.1 (2 pts)</strong> On a entraîné un modèle de classification sur un dataset de 1000 patients pour prédire si un patient a une maladie (positif) ou non (négatif). La matrice de confusion suivante est obtenue :</p><div style='overflow-x: auto;'><table style='width: 100%; border-collapse: collapse; font-size: 0.9rem; margin: 10px 0;'><thead><tr style='background: #1a237e; color: white;'><th style='padding: 6px; border: 1px solid #ddd;'></th><th style='padding: 6px; border: 1px solid #ddd;'>Prédit Positif</th><th style='padding: 6px; border: 1px solid #ddd;'>Prédit Négatif</th></tr></thead><tbody><tr><td style='padding: 6px; border: 1px solid #ddd;'><strong>Réel Positif</strong></td><td style='padding: 6px; border: 1px solid #ddd;'>80</td><td style='padding: 6px; border: 1px solid #ddd;'>20</td></tr><tr style='background: #f0f4ff;'><td style='padding: 6px; border: 1px solid #ddd;'><strong>Réel Négatif</strong></td><td style='padding: 6px; border: 1px solid #ddd;'>30</td><td style='padding: 6px; border: 1px solid #ddd;'>870</td></tr></tbody></table></div><p>Calculez l'exactitude (accuracy), la précision (precision) et le rappel (recall) de ce modèle.</p>",
          "reponse": "<p><strong>Réponse :</strong></p><p>Vrais Positifs (VP) = 80, Faux Négatifs (FN) = 20, Faux Positifs (FP) = 30, Vrais Négatifs (VN) = 870.</p><p><strong>Accuracy :</strong> (VP + VN) / Total = (80 + 870) / 1000 = 950/1000 = 0.95 (95%)</p><p><strong>Precision :</strong> VP / (VP + FP) = 80 / (80 + 30) = 80/110 ≈ 0.727 (72.7%)</p><p><strong>Recall :</strong> VP / (VP + FN) = 80 / (80 + 20) = 80/100 = 0.8 (80%)</p><p>Le modèle a une bonne exactitude, mais la précision est plus faible (il y a 30 faux positifs). Le rappel indique que 80% des malades sont correctement détectés.</p>"
        },
        {
          "question": "<p><strong>4.2 (2 pts)</strong> Expliquez brièvement ce qu'est la validation croisée (k-fold cross-validation) et pourquoi elle est préférable à une simple division train/test.</p>",
          "reponse": "<p><strong>Réponse :</strong></p><p>La validation croisée k-fold consiste à diviser les données en k sous-ensembles (folds) de taille égale. On entraîne le modèle k fois : à chaque itération, un fold différent est utilisé comme ensemble de test, les k-1 autres comme entraînement. La performance finale est la moyenne des k scores.</p><p><strong>Avantages :</strong></p><ul style='padding-left: 20px;'><li>Utilise toutes les données pour l'entraînement et le test (pas de gaspillage)</li><li>Évaluation plus robuste et moins sensible à la partition choisie</li><li>Permet de détecter le sur-apprentissage</li></ul>"
        }
      ]
    },
    {
      "titre": "Exercice 5 : Projet de Régression (4 pts)",
      "points": "4 pts",
      "enonce": "<p>Cet exercice porte sur la régression linéaire appliquée au projet Boston Housing.</p>",
      "questions": [
        {
          "question": "<p><strong>5.1 (2 pts)</strong> Dans le projet Boston Housing, quelles étapes de préparation des données avez-vous réalisées avant d'entraîner le modèle ? Justifiez chaque étape.</p>",
          "reponse": "<p><strong>Réponse :</strong></p><ul style='padding-left: 20px;'><li><strong>Exploration :</strong> Vérification des dimensions, des valeurs manquantes, statistiques descriptives.</li><li><strong>Séparation des features et de la target :</strong> Isoler X (variables explicatives) de y (prix médian).</li><li><strong>Division train/test :</strong> Séparer en 80% entraînement et 20% test pour évaluer sur des données non vues.</li><li><strong>Standardisation :</strong> Appliquer StandardScaler pour mettre toutes les variables à la même échelle. La régression linéaire n'en a pas besoin pour les coefficients, mais cela permet de comparer leur importance.</li></ul>"
        },
        {
          "question": "<p><strong>5.2 (2 pts)</strong> Après entraînement, le modèle donne un coefficient de -0.45 pour la variable LSTAT (pourcentage de population à faible statut social) et un coefficient de 0.38 pour la variable RM (nombre moyen de pièces). Interprétez ces deux coefficients.</p>",
          "reponse": "<p><strong>Réponse :</strong></p><ul style='padding-left: 20px;'><li><strong>RM (0.38) :</strong> Coefficient positif. Une augmentation du nombre moyen de pièces est associée à une augmentation du prix. Plus une maison a de pièces, plus son prix est élevé.</li><li><strong>LSTAT (-0.45) :</strong> Coefficient négatif. Une augmentation du pourcentage de population défavorisée est associée à une diminution du prix. Plus la proportion de population à faible statut social est élevée, plus le prix est bas.</li></ul>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
