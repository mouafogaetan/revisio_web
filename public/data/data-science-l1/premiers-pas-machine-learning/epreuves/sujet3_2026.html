<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Premiers Pas en Machine Learning - L1",
  "classe": "Licence 1 Data Science",
  "sequence": "Séquence 3",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Questions de Cours (K-NN et K-Means)",
      "points": "6 pts",
      "enonce": "<p>Répondez aux questions suivantes de manière claire et concise.</p>",
      "questions": [
        {
          "question": "<p><strong>1.1 (2 pts)</strong> Expliquez le principe de l'algorithme des <strong>k-plus proches voisins (k-NN)</strong> pour la classification. Quel est le rôle du paramètre k et comment le choisit-on en pratique ?</p>",
          "reponse": "<p>Le k-NN est un algorithme de classification non paramétrique. Pour classer un nouveau point, on identifie ses k plus proches voisins dans l'espace des caractéristiques (en utilisant une métrique de distance comme la distance euclidienne), puis on assigne la classe majoritaire parmi ces k voisins.</p><p>Le paramètre k détermine le nombre de voisins pris en compte. Un petit k (ex: k=1) rend le modèle très flexible mais peut causer du surapprentissage (overfitting). Un grand k rend le modèle plus stable mais peut causer du sous-apprentissage (underfitting) si k est trop grand.</p><p>En pratique, on choisit k par validation croisée : on teste plusieurs valeurs de k sur un ensemble de validation (ou en utilisant la validation croisée) et on retient celle qui donne la meilleure performance.</p>"
        },
        {
          "question": "<p><strong>1.2 (2 pts)</strong> Décrivez le principe de l'algorithme <strong>K-Means</strong> pour le clustering. Quelles sont les étapes de l'algorithme et que représente l'inertie ?</p>",
          "reponse": "<p>K-Means est un algorithme de clustering non supervisé qui partitionne les données en k groupes (clusters).</p><p>Les étapes de l'algorithme sont :</p><ul><li><strong>Initialisation</strong> : Choisir aléatoirement k points comme centroïdes initiaux.</li><li><strong>Assignation</strong> : Assigner chaque point au centroïde le plus proche (en utilisant la distance euclidienne).</li><li><strong>Mise à jour</strong> : Recalculer les centroïdes comme la moyenne des points assignés à chaque cluster.</li><li><strong>Itération</strong> : Répéter les étapes d'assignation et de mise à jour jusqu'à convergence (les centroïdes ne bougent plus ou les assignations ne changent plus).</li></ul><p>L'inertie est la somme des distances au carré des points par rapport à leur centroïde. Elle mesure la compacité des clusters : plus elle est faible, plus les clusters sont denses et compacts.</p>"
        },
        {
          "question": "<p><strong>1.3 (2 pts)</strong> Pourquoi est-il <strong>obligatoire</strong> de normaliser (ou standardiser) les données avant d'utiliser l'algorithme k-NN ou K-Means ? Expliquez avec un exemple concret.</p>",
          "reponse": "<p>La normalisation est obligatoire car ces algorithmes utilisent des distances (comme la distance euclidienne) pour calculer la proximité entre les points. Si les variables sont à des échelles différentes, les variables avec de grandes valeurs dominent le calcul de la distance, ce qui fausse les résultats.</p><p><strong>Exemple :</strong> Imaginons un dataset avec deux variables : l'âge (20-60 ans) et le salaire (1 000 000 - 10 000 000 FCFA). La distance euclidienne sera dominée par le salaire, et l'âge n'aura presque pas d'influence sur le résultat. En normalisant (mettant les deux variables sur la même échelle, par exemple entre 0 et 1), les deux variables contribuent équitablement à la distance.</p><p>On utilise généralement <code>StandardScaler</code> (moyenne 0, variance 1) ou <code>MinMaxScaler</code> (valeurs entre 0 et 1).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : K-NN en Pratique",
      "points": "7 pts",
      "enonce": "<p>On considère un petit dataset de classification binaire avec les observations suivantes :</p><table border='1' style='border-collapse: collapse; width: 100%;'><tr style='background: #3498DB; color: white;'><th style='padding: 8px;'>Point</th><th style='padding: 8px;'>x₁</th><th style='padding: 8px;'>x₂</th><th style='padding: 8px;'>Classe</th></tr><tr><td style='padding: 8px;'>A</td><td style='padding: 8px;'>1</td><td style='padding: 8px;'>2</td><td style='padding: 8px;'>0</td></tr><tr><td style='padding: 8px;'>B</td><td style='padding: 8px;'>2</td><td style='padding: 8px;'>3</td><td style='padding: 8px;'>1</td></tr><tr><td style='padding: 8px;'>C</td><td style='padding: 8px;'>3</td><td style='padding: 8px;'>1</td><td style='padding: 8px;'>0</td></tr><tr><td style='padding: 8px;'>D</td><td style='padding: 8px;'>4</td><td style='padding: 8px;'>3</td><td style='padding: 8px;'>1</td></tr><tr><td style='padding: 8px;'>E</td><td style='padding: 8px;'>5</td><td style='padding: 8px;'>2</td><td style='padding: 8px;'>0</td></tr></table><p>On souhaite classer un nouveau point P = (3, 3) en utilisant l'algorithme des k-plus proches voisins avec la <strong>distance euclidienne</strong>.</p>",
      "questions": [
        {
          "question": "<p><strong>2.1 (2 pts)</strong> Calculez les distances euclidiennes entre le point P et chaque point du dataset. Écrivez les formules et les résultats.</p>",
          "reponse": "<p>La distance euclidienne entre P(3,3) et un point (x₁, x₂) est : <span class='math'>d = √((x₁-3)² + (x₂-3)²)</span></p><ul><li>d(P,A) = √((1-3)² + (2-3)²) = √(4 + 1) = √5 ≈ 2.236</li><li>d(P,B) = √((2-3)² + (3-3)²) = √(1 + 0) = 1</li><li>d(P,C) = √((3-3)² + (1-3)²) = √(0 + 4) = 2</li><li>d(P,D) = √((4-3)² + (3-3)²) = √(1 + 0) = 1</li><li>d(P,E) = √((5-3)² + (2-3)²) = √(4 + 1) = √5 ≈ 2.236</li></ul>"
        },
        {
          "question": "<p><strong>2.2 (2 pts)</strong> Avec <strong>k=1</strong>, quelle serait la classe prédite pour P ? Justifiez votre réponse.</p>",
          "reponse": "<p>Avec k=1, on ne considère que le plus proche voisin.</p><p>Les distances minimales sont : B (distance=1) et D (distance=1). Il y a égalité.</p><p>Dans ce cas, on peut :</p><ul><li>Soit tirer au sort entre B et D</li><li>Soit utiliser la règle du plus proche voisin avec une méthode pour départager (ex: choisir le premier trouvé)</li></ul><p>Si on choisit B (classe 1), la classe prédite est 1. Si on choisit D (classe 1), la classe prédite est également 1.</p><p>La classe prédite pour P serait donc <strong>1</strong>.</p>"
        },
        {
          "question": "<p><strong>2.3 (2 pts)</strong> Avec <strong>k=3</strong>, quelle serait la classe prédite pour P ? Justifiez votre réponse.</p>",
          "reponse": "<p>Avec k=3, on considère les 3 plus proches voisins.</p><p>Les 3 plus proches voisins sont :</p><ul><li>B (distance=1, classe 1)</li><li>D (distance=1, classe 1)</li><li>C (distance=2, classe 0)</li></ul><p>Parmi ces 3 voisins, on a :</p><ul><li>Classe 1 : 2 votes (B et D)</li><li>Classe 0 : 1 vote (C)</li></ul><p>La classe majoritaire est la classe 1. La classe prédite pour P est donc <strong>1</strong>.</p>"
        },
        {
          "question": "<p><strong>2.4 (1 pt)</strong> Comparez les résultats obtenus avec k=1 et k=3. Qu'est-ce que cela vous suggère sur le choix de k dans cet exemple ?</p>",
          "reponse": "<p>Dans cet exemple, les deux valeurs de k donnent la même prédiction (classe 1), ce qui suggère que le point P est clairement dans la région de la classe 1.</p><p>Cependant, on remarque qu'avec k=1 il y avait une égalité entre B et D, ce qui montre que k=1 peut être instable. k=3 donne un résultat plus robuste car il prend en compte plus de voisins et lisse les éventuelles anomalies.</p><p>Le choix de k dépend du contexte : un petit k est plus sensible au bruit, un grand k est plus stable mais peut lisser les frontières de décision.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Clustering avec K-Means",
      "points": "7 pts",
      "enonce": "<p>On considère les 6 points suivants dans un espace à 2 dimensions :</p><p>A(1, 1), B(1, 2), C(2, 1), D(4, 4), E(5, 4), F(4, 5)</p><p>On souhaite appliquer l'algorithme K-Means avec <strong>k=2</strong> clusters. Les centroïdes initiaux sont choisis comme :</p><p><strong>Centroïde 1 (C1) = A(1, 1)</strong></p><p><strong>Centroïde 2 (C2) = D(4, 4)</strong></p><p>Utilisez la <strong>distance euclidienne</strong>.</p>",
      "questions": [
        {
          "question": "<p><strong>3.1 (2 pts)</strong> Assignez chaque point au centroïde le plus proche. Quels sont les clusters formés après cette première itération ?</p>",
          "reponse": "<p>Calcul des distances au centroïde C1 = A(1, 1) et C2 = D(4, 4) :</p><ul><li>A(1, 1) : d(C1)=0, d(C2)=√(9+9)=√18≈4.24 → <strong>Cluster 1</strong></li><li>B(1, 2) : d(C1)=1, d(C2)=√(9+4)=√13≈3.61 → <strong>Cluster 1</strong></li><li>C(2, 1) : d(C1)=1, d(C2)=√(4+9)=√13≈3.61 → <strong>Cluster 1</strong></li><li>D(4, 4) : d(C1)=√18≈4.24, d(C2)=0 → <strong>Cluster 2</strong></li><li>E(5, 4) : d(C1)=√(16+9)=5, d(C2)=1 → <strong>Cluster 2</strong></li><li>F(4, 5) : d(C1)=√(9+16)=5, d(C2)=1 → <strong>Cluster 2</strong></li></ul><p><strong>Cluster 1 :</strong> A, B, C</p><p><strong>Cluster 2 :</strong> D, E, F</p>"
        },
        {
          "question": "<p><strong>3.2 (2 pts)</strong> Recalculez les nouveaux centroïdes (moyenne des points de chaque cluster). Écrivez les coordonnées des nouveaux centroïdes C1' et C2'.</p>",
          "reponse": "<p>Pour le Cluster 1 (A, B, C) :</p><ul><li>C1'_x = (1+1+2)/3 = 4/3 ≈ 1.33</li><li>C1'_y = (1+2+1)/3 = 4/3 ≈ 1.33</li></ul><p>C1' = (1.33, 1.33)</p><p>Pour le Cluster 2 (D, E, F) :</p><ul><li>C2'_x = (4+5+4)/3 = 13/3 ≈ 4.33</li><li>C2'_y = (4+4+5)/3 = 13/3 ≈ 4.33</li></ul><p>C2' = (4.33, 4.33)</p>"
        },
        {

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
