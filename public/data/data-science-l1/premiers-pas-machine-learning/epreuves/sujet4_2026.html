<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Premiers Pas en Machine Learning - L1",
  "classe": "Licence 1 Data Science",
  "sequence": "Séquence 4",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Évaluation des Modèles de Classification",
      "points": "6 pts",
      "enonce": "<div style='font-size:1em; line-height:1.6;'><p>Un modèle de régression logistique a été entraîné pour détecter une maladie rare. Les résultats sur l'ensemble de test sont les suivants :</p><ul><li>Vrais Positifs (VP) : 85</li><li>Faux Positifs (FP) : 30</li><li>Vrais Négatifs (VN) : 920</li><li>Faux Négatifs (FN) : 15</li></ul><p>Le dataset contient 1000 patients.</p></div>",
      "questions": [
        {
          "question": "1) Construire la matrice de confusion à partir des données fournies.",
          "reponse": "<div style='background:#f5f5f5; padding:10px; border-radius:5px;'><table style='width:100%; border-collapse:collapse; text-align:center;'><tr><th style='padding:5px; border:1px solid #ccc;'></th><th style='padding:5px; border:1px solid #ccc;'>Prédit Positif</th><th style='padding:5px; border:1px solid #ccc;'>Prédit Négatif</th></tr><tr><td style='padding:5px; border:1px solid #ccc;'>Réel Positif</td><td style='padding:5px; border:1px solid #ccc;'>85 (VP)</td><td style='padding:5px; border:1px solid #ccc;'>15 (FN)</td></tr><tr><td style='padding:5px; border:1px solid #ccc;'>Réel Négatif</td><td style='padding:5px; border:1px solid #ccc;'>30 (FP)</td><td style='padding:5px; border:1px solid #ccc;'>920 (VN)</td></tr></table></div>"
        },
        {
          "question": "2) Calculer l'exactitude (accuracy) du modèle. Interpréter ce résultat.",
          "reponse": "<p>Accuracy = (VP + VN) / (VP + VN + FP + FN) = (85 + 920) / 1000 = 0.905 soit 90.5%.</p><p>Le modèle fait 90.5% de prédictions correctes, ce qui semble bon. Cependant, pour une maladie rare, cette métrique peut être trompeuse car prédire toujours 'négatif' donnerait 95% d'accuracy.</p>"
        },
        {
          "question": "3) Calculer la précision (precision) du modèle. Interpréter ce résultat.",
          "reponse": "<p>Precision = VP / (VP + FP) = 85 / (85 + 30) = 85/115 ≈ 0.739 soit 73.9%.</p><p>Lorsque le modèle prédit la maladie, il a raison dans environ 74% des cas. Cela signifie qu'il y a 26% de fausses alertes (FP).</p>"
        },
        {
          "question": "4) Calculer le rappel (recall) du modèle. Interpréter ce résultat.",
          "reponse": "<p>Recall = VP / (VP + FN) = 85 / (85 + 15) = 85/100 = 0.85 soit 85%.</p><p>Le modèle détecte 85% des patients réellement malades. Il manque 15% des cas positifs (FN).</p>"
        },
        {
          "question": "5) Calculer le F1-score. Justifier l'utilité de cette métrique dans ce contexte.",
          "reponse": "<p>F1 = 2 × (Precision × Recall) / (Precision + Recall) = 2 × (0.739 × 0.85) / (0.739 + 0.85) = 2 × 0.628 / 1.589 ≈ 0.790 soit 79%.</p><p>Le F1-score est utile car il trouve un équilibre entre la précision et le rappel. Dans le cas d'une maladie rare, il est important à la fois de ne pas rater de malades (rappel élevé) et de ne pas créer trop de fausses alertes (précision élevée).</p>"
        }
      ]
    },
    {
      "titre": "Validation Croisée et Surapprentissage",
      "points": "4 pts",
      "enonce": "<div style='font-size:1em; line-height:1.6;'><p>Un data scientist entraîne un modèle de forêt aléatoire sur un dataset de 1000 échantillons. Il obtient :</p><ul><li><strong>Accuracy sur l'ensemble d'entraînement</strong> : 99.8%</li><li><strong>Accuracy sur l'ensemble de test</strong> : 82.3%</li></ul><p>Il décide d'utiliser la <strong>validation croisée</strong> pour améliorer son évaluation.</p></div>",
      "questions": [
        {
          "question": "1) Que signifie l'écart entre l'accuracy sur l'entraînement (99.8%) et sur le test (82.3%) ? Quel est le nom de ce phénomène ?",
          "reponse": "<p>Cet écart indique que le modèle est <strong>en surapprentissage (overfitting)</strong>. Il a mémorisé les données d'entraînement, mais ne généralise pas bien sur de nouvelles données. Le modèle est trop complexe pour la quantité de données disponibles.</p>"
        },
        {
          "question": "2) Expliquer le principe de la validation croisée k-fold. Comment pourrait-elle aider ce data scientist ?",
          "reponse": "<p>La validation croisée k-fold consiste à diviser les données en k sous-ensembles (folds). On entraîne le modèle sur k-1 folds et on le valide sur le fold restant, en répétant k fois. La performance finale est la moyenne des k scores.</p><p>Elle aide à :</p><ul><li>Obtenir une <strong>estimation plus robuste</strong> de la performance du modèle</li><li>Réduire le risque de surapprentissage en évaluant le modèle sur différentes partitions</li><li>Mieux utiliser les données disponibles (toutes les données servent à l'entraînement et à la validation)</li></ul>"
        },
        {
          "question": "3) Citer deux stratégies pour lutter contre le surapprentissage observé.",
          "reponse": "<p><strong>Stratégie 1 : Réduire la complexité du modèle</strong> - Diminuer le nombre d'arbres ou la profondeur maximale dans une forêt aléatoire.</p><p><strong>Stratégie 2 : Utiliser la régularisation</strong> - Appliquer une pénalité (L1 ou L2) sur les poids du modèle pour limiter l'ajustement excessif aux données d'entraînement.</p><p>D'autres stratégies incluent : augmenter la taille du dataset, utiliser le dropout (pour les réseaux de neurones), ou simplifier les features.</p>"
        }
      ]
    },
    {
      "titre": "Métriques de Régression",
      "points": "4 pts",
      "enonce": "<div style='font-size:1em; line-height:1.6;'><p>On considère un modèle de régression linéaire qui prédit le prix des maisons. Les valeurs réelles et prédites pour 5 maisons sont :</p><table style='width:100%; border-collapse:collapse; text-align:center;'><tr><th style='padding:5px; border:1px solid #ccc;'>Maison</th><th style='padding:5px; border:1px solid #ccc;'>Valeur réelle (y)</th><th style='padding:5px; border:1px solid #ccc;'>Prédiction (ŷ)</th></tr><tr><td style='padding:5px; border:1px solid #ccc;'>1</td><td style='padding:5px; border:1px solid #ccc;'>200</td><td style='padding:5px; border:1px solid #ccc;'>210</td></tr><tr><td style='padding:5px; border:1px solid #ccc;'>2</td><td style='padding:5px; border:1px solid #ccc;'>150</td><td style='padding:5px; border:1px solid #ccc;'>140</td></tr><tr><td style='padding:5px; border:1px solid #ccc;'>3</td><td style='padding:5px; border:1px solid #ccc;'>300</td><td style='padding:5px; border:1px solid #ccc;'>310</td></tr><tr><td style='padding:5px; border:1px solid #ccc;'>4</td><td style='padding:5px; border:1px solid #ccc;'>400</td><td style='padding:5px; border:1px solid #ccc;'>380</td></tr><tr><td style='padding:5px; border:1px solid #ccc;'>5</td><td style='padding:5px; border:1px solid #ccc;'>250</td><td style='padding:5px; border:1px solid #ccc;'>260</td></tr></table>",
      "questions": [
        {
          "question": "1) Calculer le Mean Squared Error (MSE).",
          "reponse": "<p>MSE = (1/n) × Σ(yi - ŷi)²</p><p>Erreurs : (200-210)²=100, (150-140)²=100, (300-310)²=100, (400-380)²=400, (250-260)²=100</p><p>MSE = (100+100+100+400+100)/5 = 800/5 = <strong>160</strong></p>"
        },
        {
          "question": "2) Calculer le Root Mean Squared Error (RMSE).",
          "reponse": "<p>RMSE = √(MSE) = √160 ≈ <strong>12.65</strong></p><p>Le RMSE est interprétable car il est dans la même unité que la variable cible (ici les prix des maisons). Une erreur moyenne d'environ 12.65 unités.</p>"
        },
        {
          "question": "3) Calculer le Mean Absolute Error (MAE).",
          "reponse": "<p>MAE = (1/n) × Σ|yi - ŷi|</p><p>MAE = (|200-210| + |150-140| + |300-310| + |400-380| + |250-260|)/5</p><p>MAE = (10+10+10+20+10)/5 = 60/5 = <strong>12</strong></p>"
        }
      ]
    },
    {
      "titre": "Comparaison de Modèles de Classification",
      "points": "6 pts",
      "enonce": "<div style='font-size:1em; line-height:1.6;'><p>Un analyste compare deux modèles de classification pour la détection de fraude bancaire sur un dataset où 5% des transactions sont frauduleuses.</p><p>Les résultats sur l'ensemble de test (1000 transactions) sont :</p><ul><li><strong>Modèle A</strong> : Accuracy = 98%, Precision = 80%, Recall = 72%</li><li><strong>Modèle B</strong> : Accuracy = 97%, Precision = 65%, Recall = 90%</li></ul><p>Le coût moyen d'une transaction frauduleuse non détectée (FN) est très élevé (perte de 5000 FCFA), tandis que le coût d'une fausse alerte (FP) est de 100 FCFA.</p></div>",
      "questions": [
        {
          "question": "1) Quel modèle a la meilleure accuracy ? Commenter ce résultat au vu du contexte.",
          "reponse": "<p>Le modèle A a la meilleure accuracy avec 98% contre 97% pour le modèle B.</p><p>Cependant, dans un contexte de classes déséquilibrées (5% de fraudes), l'accuracy peut être trompeuse. Un modèle qui prédirait toujours 'non-fraude' aurait 95% d'accuracy mais serait inutile. Il faut donc regarder d'autres métriques.</p>"
        },
        {
          "question": "2) Expliquer ce que signifie la précision de 65% pour le modèle B.",
          "reponse": "<p>Une précision de 65% signifie que lorsque le modèle B prédit qu'une transaction est frauduleuse, il a raison dans 65% des cas. Les 35% restants sont des fausses alertes (FP).</p>"
        },
        {
          "question": "3) Expliquer ce que signifie le rappel de 90% pour le modèle B.",
          "reponse": "<p>Un rappel de 90% signifie que le modèle B détecte 90% des transactions réellement frauduleuses. Seulement 10% des fraudes ne sont pas détectées (FN).</p>"
        },
        {
          "question": "4) En tenant compte des coûts, quel modèle serait le plus avantageux pour l'entreprise ? Justifier par un calcul simple.",
          "reponse": "<p>Sur 1000 transactions, il y a 5% de fraudes soit 50 transactions frauduleuses.</p><p><strong>Modèle B (Recall=90%)</strong> : détecte 90% des fraudes = 45 fraudes détectées, 5 non détectées (FN). Coût FN = 5 × 5000 = 25 000 FCFA. Coût des FP = 100 × (1-Precision) × Nombre prédits positifs. Avec Precision=65%, FP = 35% des prédictions positives. Si 45 VP pour 65% de précision, alors total prédits positifs ≈ 69, FP ≈ 24. Coût FP = 24 × 100 = 2 400 FCFA. Coût total ≈ 27 400 FCFA.</p><p><strong>Modèle A (Recall=72%)</strong> : détecte 72% des fraudes = 36 fraudes détectées, 14 non détectées (FN). Coût FN = 14 × 5000 = 70 000 FCFA. Avec Precision=80%, FP ≈ 9. Coût FP = 9 × 100 = 900 FCFA. Coût total ≈ 70 900 FCFA.</p><p>Le <strong>modèle B est beaucoup plus avantageux</strong> car il réduit considérablement les pertes liées aux fraudes non détectées, malgré plus de fausses alertes.</p>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
