<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Premiers Pas en Machine Learning - L1",
  "classe": "Licence 1 Data Science",
  "sequence": "Séquence 1",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Compréhension des Concepts Fondamentaux (4 pts)",
      "points": "4 pts",
      "enonce": "<p>Cet exercice porte sur les fondamentaux du Machine Learning. Répondez aux questions suivantes en vous appuyant sur les notions vues en cours.</p>",
      "questions": [
        {
          "question": "<p><strong>1. (1 pt)</strong> Définissez le Machine Learning et distinguez-le de l'Intelligence Artificielle et du Deep Learning. Expliquez brièvement comment ces trois domaines s'articulent.</p>",
          "reponse": "<p><strong>Réponse :</strong> Le Machine Learning (apprentissage automatique) est une sous-discipline de l'Intelligence Artificielle (IA) qui donne aux machines la capacité d'apprendre à partir de données sans être explicitement programmées. Le Deep Learning (apprentissage profond) est une sous-catégorie du Machine Learning qui utilise des réseaux de neurones à plusieurs couches (réseaux profonds). On peut les hiérarchiser comme suit : IA ⊃ Machine Learning ⊃ Deep Learning.</p>"
        },
        {
          "question": "<p><strong>2. (1 pt)</strong> Dans un jeu de données structuré, expliquez la différence entre une <em>feature</em> (variable explicative) et la <em>target</em> (variable cible). Donnez un exemple pour un problème de prédiction des prix de l'immobilier.</p>",
          "reponse": "<p><strong>Réponse :</strong> Les <em>features</em> sont les variables d'entrée utilisées pour faire une prédiction. La <em>target</em> est la variable que l'on souhaite prédire. Par exemple, pour prédire le prix d'une maison, les <em>features</em> pourraient être la surface, le nombre de pièces, l'âge du bien ; la <em>target</em> serait le prix.</p>"
        },
        {
          "question": "<p><strong>3. (1 pt)</strong> Citez les trois grandes familles de problèmes en Machine Learning, en les illustrant par un exemple concret pour chacune. Soyez précis sur le type de données et l'objectif de l'algorithme.</p>",
          "reponse": "<p><strong>Réponse :</strong> Les trois familles sont : <ul><li><strong>Apprentissage supervisé</strong> (classification/régression) : Exemple : classifier des emails en 'spam' ou 'non-spam' à partir d'un dataset étiqueté.</li><li><strong>Apprentissage non supervisé</strong> (clustering) : Exemple : segmenter des clients d'une banque en groupes homogènes pour cibler des offres.</li><li><strong>Apprentissage par renforcement</strong> : Exemple : un agent qui apprend à jouer aux échecs en recevant des récompenses (gain/pertes) pour ses actions.</li></ul></p>"
        },
        {
          "question": "<p><strong>4. (1 pt)</strong> Quel est le rôle central de la bibliothèque <code>scikit-learn</code> dans l'écosystème Python du Machine Learning ? Citez deux autres bibliothèques de cet écosystème en précisant leur utilité.</p>",
          "reponse": "<p><strong>Réponse :</strong> <code>scikit-learn</code> est la bibliothèque de référence pour implémenter des algorithmes de Machine Learning en Python. Elle fournit une API uniforme pour entraîner, évaluer et utiliser des modèles. Deux autres bibliothèques clés : <ul><li><strong>NumPy</strong> : pour le calcul scientifique, les opérations sur les tableaux multidimensionnels.</li><li><strong>Pandas</strong> : pour la manipulation et l'analyse de données structurées (DataFrames).</li></ul></p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Préparation des Données - Mise en Pratique (7 pts)",
      "points": "7 pts",
      "enonce": "<p>Vous disposez d'un petit jeu de données (ci-dessous) sur les caractéristiques de voitures. Le but est de prédire si une voiture est 'Economique' (0) ou 'Luxueuse' (1).</p><table style='width:100%; border-collapse: collapse;'><tr style='background-color:#2c3e50; color:white;'><th style='padding:8px; border:1px solid #ddd;'>Puissance (CV)</th><th style='padding:8px; border:1px solid #ddd;'>Poids (kg)</th><th style='padding:8px; border:1px solid #ddd;'>Carburant</th><th style='padding:8px; border:1px solid #ddd;'>Cible</th></tr><tr><td style='padding:8px; border:1px solid #ddd;'>90</td><td style='padding:8px; border:1px solid #ddd;'>1050</td><td style='padding:8px; border:1px solid #ddd;'>Essence</td><td style='padding:8px; border:1px solid #ddd;'>0</td></tr><tr><td style='padding:8px; border:1px solid #ddd;'>150</td><td style='padding:8px; border:1px solid #ddd;'>1350</td><td style='padding:8px; border:1px solid #ddd;'>Diesel</td><td style='padding:8px; border:1px solid #ddd;'>0</td></tr><tr><td style='padding:8px; border:1px solid #ddd;'>250</td><td style='padding:8px; border:1px solid #ddd;'>1700</td><td style='padding:8px; border:1px solid #ddd;'>Essence</td><td style='padding:8px; border:1px solid #ddd;'>1</td></tr><tr><td style='padding:8px; border:1px solid #ddd;'>180</td><td style='padding:8px; border:1px solid #ddd;'>1450</td><td style='padding:8px; border:1px solid #ddd;'>Diesel</td><td style='padding:8px; border:1px solid #ddd;'>1</td></tr></table><p>On souhaite préparer ces données pour un algorithme de Machine Learning.</p>",
      "questions": [
        {
          "question": "<p><strong>1. (1 pt)</strong> Séparez les données en un ensemble d'entraînement (3/4 des données) et de test (1/4). Aidez-vous de la fonction <code>train_test_split</code> de scikit-learn. Expliquez brièvement pourquoi cette séparation est cruciale.</p>",
          "reponse": "<p><strong>Réponse :</strong> La séparation est cruciale pour évaluer la capacité de généralisation du modèle sur des données qu'il n'a pas vues lors de l'apprentissage. Avec 4 lignes, on prend souvent 3 lignes pour l'entraînement et 1 pour le test. Exemple de code : <pre>from sklearn.model_selection import train_test_split\nX_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=42)</pre></p>"
        },
        {
          "question": "<p><strong>2. (1.5 pts)</strong> Proposez et justifiez une méthode pour encoder la variable catégorielle 'Carburant'. Définissez les concepts de <strong>LabelEncoder</strong> et <strong>OneHotEncoder</strong>.</p>",
          "reponse": "<p><strong>Réponse :</strong> 'Carburant' est une variable nominale sans relation d'ordre, donc le <strong>OneHotEncoder</strong> est plus adapté pour éviter de créer une ordinalité artificielle. <ul><li><strong>LabelEncoder</strong> : assigne un entier unique à chaque catégorie (Essence=0, Diesel=1). Simple mais peut induire des relations d'ordre.</li><li><strong>OneHotEncoder</strong> : crée une colonne binaire par catégorie (Ex: colonne Essence, colonne Diesel).</li></ul></p>"
        },
        {
          "question": "<p><strong>3. (1.5 pts)</strong> Pourquoi est-il nécessaire de normaliser (ou standardiser) les variables numériques comme 'Puissance' et 'Poids' ? Quelle est la différence entre la normalisation (MinMaxScaler) et la standardisation (StandardScaler) ?</p>",
          "reponse": "<p><strong>Réponse :</strong> La normalisation/standardisation est nécessaire car les algorithmes comme la régression logistique ou k-NN sont sensibles aux échelles des variables. Sans mise à l'échelle, une variable avec des valeurs plus grandes dominerait les calculs de distance ou de gradient. <ul><li><strong>Standardisation (StandardScaler)</strong> : transforme les données pour avoir une moyenne de 0 et un écart-type de 1. Robuste aux outliers.</li><li><strong>Normalisation (MinMaxScaler)</strong> : met les données dans un intervalle fixe, souvent [0, 1]. Sensible aux outliers.</li></ul></p>"
        },
        {
          "question": "<p><strong>4. (2 pts)</strong> Appliquez ces transformations sur les données d'entraînement et de test. Expliquez pourquoi il est fondamental de n'ajuster (fit) le scaler ou l'encodeur que sur l'ensemble d'entraînement avant de le transformer (transform) sur le test.</p>",
          "reponse": "<p><strong>Réponse :</strong> Il faut ajuster le scaler/encodeur uniquement sur l'ensemble d'entraînement pour éviter un <strong>data leakage</strong> (fuite de données). Les informations sur la distribution globale (moyenne, variance, catégories) ne doivent pas être utilisées pour construire le modèle. Elles doivent être calculées sur l'entraînement pour simuler les conditions réelles où le modèle reçoit de nouvelles données. Code : <pre>scaler.fit(X_train)\nX_train_scaled = scaler.transform(X_train)\nX_test_scaled = scaler.transform(X_test)</pre></p>"
        },
        {
          "question": "<p><strong>5. (1 pt)</strong> Identifiez les <strong>données manquantes</strong> (valeurs nulles ou absentes) dans ce dataset. Proposez deux stratégies d'<strong>imputation</strong> pour les gérer, en justifiant votre choix.</p>",
          "reponse": "<p><strong>Réponse :</strong> Dans cet exemple, il n'y a pas de données manquantes. Mais en général, on peut utiliser <code>SimpleImputer</code> de scikit-learn. Stratégies courantes : <ul><li><strong>Imputation par la moyenne</strong> : pour les données numériques sans outliers.</li><li><strong>Imputation par la médiane</strong> : pour les données numériques avec outliers.</li><li><strong>Imputation par le mode</strong> : pour les données catégorielles.</li></ul></p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Régression Linéaire - Modélisation et Interprétation (5 pts)",
      "points": "5 pts",
      "enonce": "<p>Un data scientist souhaite modéliser la relation entre le nombre de publicités diffusées et le chiffre d'affaires d'une entreprise. Il collecte les données suivantes :</p><table style='width:100%; border-collapse: collapse;'><tr style='background-color:#2c3e50; color:white;'><th style='padding:8px; border:1px solid #ddd;'>Nombre de publicités (x)</th><th style='padding:8px; border:1px solid #ddd;'>Chiffre d'affaires (y) en milliers de FCFA</th></tr><tr><td style='padding:8px; border:1px solid #ddd;'>10</td><td style='padding:8px; border:1px solid #ddd;'>100</td></tr><tr><td style='padding:8px; border:1px solid #ddd;'>20</td><td style='padding:8px; border:1px solid #ddd;'>180</td></tr><tr><td style='padding:8px; border:1px solid #ddd;'>30</td><td style='padding:8px; border:1px solid #ddd;'>260</td></tr><tr><td style='padding:8px; border:1px solid #ddd;'>40</td><td style='padding:8px; border:1px solid #ddd;'>340</td></tr><tr><td style='padding:8px; border:1px solid #ddd;'>50</td><td style='padding:8px; border:1px solid #ddd;'>420</td></tr></table>",
      "questions": [
        {
          "question": "<p><strong>1. (1 pt)</strong> Formulez l'équation de la régression linéaire simple pour ce problème (y = ax + b). Identifiez la variable explicative et la variable cible. Expliquez ce que représentent les coefficients <em>a</em> (pente) et <em>b</em> (ordonnée à l'origine).</p>",
          "reponse": "<p><strong>Réponse :</strong> L'équation est : <div class='math-block'><div class='math'>$$ y = a \\cdot x + b $$</div></div> où <ul><li><strong>y</strong> est le chiffre d'affaires (variable cible).</li><li><strong>x</strong> est le nombre de publicités (variable explicative).</li><li><strong>a</strong> est la pente : l'augmentation du chiffre d'affaires pour une publicité supplémentaire.</li><li><strong>b</strong> est l'ordonnée à l'origine : le chiffre d'affaires estimé sans publicité.</li></ul></p>"
        },
        {
          "question": "<p><strong>2. (1 pt)</strong> À partir des données, déterminez graphiquement ou par calcul la pente <em>a</em> de la droite de régression. (Utilisez la formule de la méthode des moindres carrés).</p>",

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
