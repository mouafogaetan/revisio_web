<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Introduction à l'Algorithmique et à la Gestion de Projet",
  "classe": "Licence 1 Data Science",
  "sequence": "Sequence 2",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Complexité et Optimisation (4 pts)",
      "points": "4 pts",
      "enonce": "<div><p>Une entreprise de e-commerce à Douala souhaite analyser les données de ses clients pour améliorer ses recommandations. Elle dispose d'un tableau de <span class='math'>$n$</span> clients, chacun ayant <span class='math'>$m$</span> attributs (âge, revenu, historique d'achat, etc.).</p><p>Deux algorithmes sont proposés pour calculer la similarité entre tous les clients :</p><ul><li><strong>Algorithme A :</strong> Compare chaque client avec tous les autres clients. La complexité est de <span class='math'>$O(n^2 \\times m)$</span>.</li><li><strong>Algorithme B :</strong> Réduit d'abord la dimensionnalité des données (de <span class='math'>$m$</span> à <span class='math'>$k$</span> dimensions avec <span class='math'>$k < m$</span>), puis compare les clients. La complexité est de <span class='math'>$O(n^2 \\times k)$</span>.</li></ul></div>",
      "questions": [
        {
          "question": "1) Expliquez clairement ce que représente la complexité spatiale d'un algorithme et donnez un exemple concret pour cet algorithme.",
          "reponse": "La complexité spatiale mesure la quantité de mémoire (espace) qu'un algorithme utilise en fonction de la taille des données d'entrée. Elle s'exprime en fonction de n (taille de l'entrée). Dans le cas de l'algorithme A, si l'on doit stocker une matrice de similarité de taille n×n, la complexité spatiale serait O(n²). Si l'on ne stocke que les résultats au fur et à mesure, la complexité spatiale pourrait être O(1) pour le calcul, mais cela dépend de l'implémentation."
        },
        {
          "question": "2) Si <span class='math'>$n = 1000$</span> clients et <span class='math'>$m = 50$</span> attributs, estimez le nombre d'opérations pour l'algorithme A.",
          "reponse": "Pour l'algorithme A : n² × m = 1000² × 50 = 1 000 000 × 50 = 50 000 000 opérations. C'est 50 millions d'opérations."
        },
        {
          "question": "3) Si on réduit la dimensionnalité à <span class='math'>$k = 10$</span> attributs, combien d'opérations l'algorithme B effectue-t-il ?",
          "reponse": "Pour l'algorithme B : n² × k = 1000² × 10 = 1 000 000 × 10 = 10 000 000 opérations. C'est 10 millions d'opérations."
        },
        {
          "question": "4) En vous basant sur les notions de complexité, quel algorithme est le plus efficace et pourquoi ? Justifiez votre réponse.",
          "reponse": "L'algorithme B est plus efficace car il divise le nombre d'opérations par 5 (50M/10M = 5). La réduction de dimensionnalité (de m à k) diminue la complexité temporelle de O(n²×m) à O(n²×k), ce qui est significatif pour de grands volumes de données. L'algorithme B est donc préférable."
        },
        {
          "question": "5) Classez les complexités suivantes du plus efficace au moins efficace : <span class='math'>$O(1)$</span>, <span class='math'>$O(n)$</span>, <span class='math'>$O(n^2)$</span>, <span class='math'>$O(2^n)$</span>, <span class='math'>$O(\\log n)$</span>.",
          "reponse": "Du plus efficace au moins efficace : <span class='math'>$O(1)$</span> (constant) < <span class='math'>$O(\\log n)$</span> (logarithmique) < <span class='math'>$O(n)$</span> (linéaire) < <span class='math'>$O(n^2)$</span> (quadratique) < <span class='math'>$O(2^n)$</span> (exponentiel)."
        }
      ]
    },
    {
      "titre": "Exercice 2 : Algorithmes de Recherche (4 pts)",
      "points": "4 pts",
      "enonce": "<div><p>Une bibliothèque universitaire au Cameroun possède un catalogue de 50 000 livres. Les livres sont classés par ordre alphabétique selon leur titre. Le bibliothécaire souhaite optimiser la recherche d'un livre en fonction de son titre.</p><p>Deux méthodes sont envisagées :</p><ul><li><strong>Méthode 1 :</strong> Parcourir la liste des livres depuis le début jusqu'à trouver le titre recherché (recherche séquentielle).</li><li><strong>Méthode 2 :</strong> Utiliser la recherche dichotomique (binaire).</li></ul></div>",
      "questions": [
        {
          "question": "1) En comparant la recherche séquentielle et la recherche dichotomique, expliquez les conditions nécessaires pour que la recherche dichotomique soit applicable.",
          "reponse": "La recherche dichotomique nécessite que les données soient triées (ici, les livres doivent être classés par ordre alphabétique). Elle repose sur le principe de diviser la recherche en deux parties à chaque étape. Sans tri, cette méthode ne fonctionne pas car on ne peut pas savoir dans quelle moitié continuer la recherche."
        },
        {
          "question": "2) Calculez le nombre maximal de comparaisons pour la recherche séquentielle (dans le pire des cas).",
          "reponse": "Dans le pire des cas, la recherche séquentielle parcourt toute la liste. Pour 50 000 livres, le nombre maximal de comparaisons est de 50 000."
        },
        {
          "question": "3) Calculez le nombre maximal de comparaisons pour la recherche dichotomique. (Indice : <span class='math'>$2^{15} = 32768$</span> et <span class='math'>$2^{16} = 65536$</span>).",
          "reponse": "La recherche dichotomique divise la recherche par 2 à chaque étape. Le nombre maximal d'étapes est <span class='math'>$\\lceil \\log_2(50000) \\rceil$</span> = 16 comparaisons (car <span class='math'>$2^{15} = 32768 < 50000 \\leq 65536 = 2^{16}$</span>)."
        },
        {
          "question": "4) La recherche dichotomique est-elle toujours plus rapide que la recherche séquentielle ? Justifiez.",
          "reponse": "La recherche dichotomique est généralement beaucoup plus rapide (16 comparaisons contre 50 000 pour la séquentielle). Cependant, elle nécessite que les données soient triées et que l'accès à un élément par son index soit direct (O(1)), ce qui est le cas dans un tableau. Si les données ne sont pas triées ou si l'accès n'est pas direct (ex: liste chaînée), la recherche dichotomique n'est pas applicable."
        }
      ]
    },
    {
      "titre": "Exercice 3 : Arbres Binaires de Recherche (5 pts)",
      "points": "5 pts",
      "enonce": "<div><p>Une startup camerounaise de gestion de stocks souhaite organiser ses produits par référence. Elle utilise un arbre binaire de recherche (ABR) pour stocker les références de ses 1000 produits.</p><p>Les clés sont les identifiants des produits (des nombres entiers).</p></div>",
      "questions": [
        {
          "question": "1) Définissez ce qu'est un arbre binaire de recherche (ABR) et expliquez sa propriété fondamentale.",
          "reponse": "Un arbre binaire de recherche est un arbre binaire dans lequel, pour chaque nœud, toutes les clés du sous-arbre gauche sont inférieures à la clé du nœud, et toutes les clés du sous-arbre droit sont supérieures à la clé du nœud. Cette propriété permet une recherche, une insertion et une suppression efficaces."
        },
        {
          "question": "2) Si on insère les produits dans l'ordre suivant : 500, 250, 750, 125, 375, 625, 875, dessinez l'arbre binaire de recherche résultant. (Décrivez-le en termes de structure).",
          "reponse": "L'arbre aurait :<br>Racine : 500<br>Gauche de 500 : 250 (gauche 125, droite 375)<br>Droit de 500 : 750 (gauche 625, droite 875)"
        },
        {
          "question": "3) Quelle est la complexité de la recherche d'un produit dans ce cas (pire cas) ? Expliquez.",
          "reponse": "L'arbre est équilibré (hauteur 3). La complexité de la recherche est donc O(log n) = O(log 7) ≈ O(3), soit O(log n) dans le cas équilibré."
        },
        {
          "question": "4) Décrivez l'impact de l'ordre d'insertion sur la performance de l'arbre. Que se passe-t-il si on insère les produits dans l'ordre croissant (1, 2, 3, 4, ...) ?",
          "reponse": "Si on insère les produits dans l'ordre croissant (1, 2, 3, 4, ...), l'arbre dégénère en une liste chaînée : chaque nœud a un seul enfant droit. L'arbre devient alors un arbre filiforme. La hauteur devient n (1000) et la complexité de la recherche devient O(n) au lieu de O(log n), ce qui est très inefficace."
        },
        {
          "question": "5) Proposez une stratégie pour éviter ce problème de déséquilibre dans un ABR.",
          "reponse": "Pour éviter le déséquilibre, on peut utiliser des arbres binaires de recherche auto-équilibrés comme les arbres AVL ou les arbres rouge-noir. Ces structures garantissent que l'arbre reste équilibré après chaque insertion ou suppression, maintenant ainsi une complexité O(log n) pour les opérations."
        }
      ]
    },
    {
      "titre": "Exercice 4 : Gestion de Projet (4 pts)",
      "points": "4 pts",
      "enonce": "<div><p>Vous êtes chef de projet dans une entreprise de services à Yaoundé. Vous devez gérer le projet de développement d'une nouvelle application mobile. Le projet est divisé en plusieurs tâches avec les dépendances suivantes :</p><ul><li><strong>Tâche A :</strong> Conception (3 jours) - Pas de prérequis</li><li><strong>Tâche B :</strong> Développement front-end (5 jours) - Dépend de A</li><li><strong>Tâche C :</strong> Développement back-end (4 jours) - Dépend de A</li><li><strong>Tâche D :</strong> Intégration (2 jours) - Dépend de B et C</li><li><strong>Tâche E :</strong> Tests (3 jours) - Dépend de D</li><li><strong>Tâche F :</strong> Déploiement (1 jour) - Dépend de E</li></ul></div>",
      "questions": [
        {
          "question": "1) Construisez la WBS (Work Breakdown Structure) de ce projet en listant les tâches et leurs dépendances.",
          "reponse": "WBS : Niveau 1 : Projet<br>Niveau 2 : A (Conception) → B (Front-end), C (Back-end) → D (Intégration) → E (Tests) → F (Déploiement)"
        },
        {
          "question": "2) Calculez la durée totale minimale du projet. Quelle est la tâche critique ?",
          "reponse": "Chemin A-B-D-E-F : 3+5+2+3+1 = 14 jours<br>Chemin A-C-D-E-F : 3+4+2+3+1 = 13 jours<br>La durée minimale est de 14 jours (chemin critique). Les tâches critiques sont A, B, D, E, F."
        },
        {
          "question": "3) Si la tâche C est retardée de 3 jours, quel sera l'impact sur la durée totale du projet ? Justifiez.",
          "reponse": "Le chemin A-C-D-E-F dure initialement 13 jours. Avec un retard de 3 jours, il devient 16 jours. La durée totale du projet passe alors à 16 jours, car le chemin A-C-D-E-F devient le nouveau chemin critique (16 jours > 14 jours)."
        },
        {
          "question": "4) Qu'est-ce qu'un diagramme de Gantt et comment pourrait-il aider à visualiser ce projet ?",
          "reponse": "Un diagramme de Gantt est un outil de planification visuel qui représente les tâches sur un axe temporel. Chaque tâche est représentée par une barre horizontale dont la longueur correspond à sa durée. Pour ce projet, il permettrait de visualiser les chevauchements (B et C peuvent être faites en parallèle), les dépendances, les dates de début et de fin, et d'identifier facilement le chemin critique."
        }
      ]
    },
    {
      "titre": "Exercice 5 : Gestion des Risques (3 pts)",
      "points": "3 pts",
      "enonce": "<div><p>Un projet Data Science vise à développer un système de prédiction de la demande pour une entreprise de transport de marchandises à Douala. L'équipe identifie plusieurs risques potentiels.</p></div>",
      "questions": [
        {

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
