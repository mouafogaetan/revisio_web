<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
 "matiere": "Introduction à l'Algorithmique et à la Gestion de Projet",
 "classe": "Licence 1 Data Science",
 "sequence": "Séquence 5",
 "anneeScolaire": "2025-2026",
 "exercices": [
   {
     "titre": "Algorithmes de Tri Élémentaires",
     "points": "4 pts",
     "enonce": "<p>Le tri est une opération fondamentale en algorithmique. Répondez aux questions suivantes concernant les tris élémentaires.</p>",
     "questions":[
       {
         "question": "1) Le tri à bulles (Bubble Sort) est un algorithme de tri simple. Expliquez son principe et donnez sa complexité dans le pire des cas. (1 pt)",
         "reponse": "Le principe du tri à bulles est de parcourir le tableau en comparant les éléments adjacents et en les échangeant s'ils sont dans le mauvais ordre. Ce processus est répété jusqu'à ce que le tableau soit trié. Dans le pire des cas (tableau trié en sens inverse), la complexité est \(O(n^2)\)."
       },
       {
         "question": "2) Considérez le tableau suivant : <code>[7, 2, 9, 3, 6]</code>. Appliquez l'algorithme du tri par sélection (Selection Sort) pour trier ce tableau. Détaillez les étapes. (2 pts)",
         "reponse": "Étapes du tri par sélection : <br> Étape 1 : Trouver le plus petit élément (2) et l'échanger avec le premier (7) → [2, 7, 9, 3, 6] <br> Étape 2 : Trouver le plus petit dans la partie restante (3) et l'échanger avec le second (7) → [2, 3, 9, 7, 6] <br> Étape 3 : Trouver le plus petit dans la partie restante (6) et l'échanger avec le troisième (9) → [2, 3, 6, 7, 9] <br> Étape 4 : Trouver le plus petit dans la partie restante (7) et l'échanger avec le quatrième (7) → [2, 3, 6, 7, 9] <br> Le tableau est maintenant trié."
       },
       {
         "question": "3) Comparez les complexités du tri à bulles, du tri par sélection et du tri par insertion dans le meilleur des cas. Lequel est le plus efficace pour un tableau déjà trié ? (1 pt)",
         "reponse": "Dans le meilleur des cas (tableau déjà trié) : <br> - Tri à bulles : \(O(n)\) avec optimisation (si on arrête quand il n'y a plus d'échanges). <br> - Tri par sélection : \(O(n^2)\) (toujours le même nombre de comparaisons). <br> - Tri par insertion : \(O(n)\). <br> Le tri par insertion est donc le plus efficace pour un tableau déjà trié, avec une complexité linéaire."
       }
     ]
   },
   {
     "titre": "Structures de Données : Piles et Files",
     "points": "4 pts",
     "enonce": "<p>Les piles et les files sont des structures de données fondamentales. Répondez aux questions suivantes.</p>",
     "questions":[
       {
         "question": "1) Définissez une pile (stack) et une file (queue). Quels sont leurs principes de fonctionnement respectifs (LIFO/FIFO) ? (1 pt)",
         "reponse": "Une pile (stack) est une structure de données qui fonctionne selon le principe LIFO (Last In, First Out) : le dernier élément ajouté est le premier retiré. Une file (queue) fonctionne selon le principe FIFO (First In, First Out) : le premier élément ajouté est le premier retiré."
       },
       {
         "question": "2) On considère la séquence d'opérations suivante sur une pile initialement vide : <br> <code>push(5), push(3), push(7), pop(), push(2), pop(), pop()</code> <br> Quel est le contenu final de la pile ? (1.5 pts)",
         "reponse": "Exécution pas à pas : <br> - push(5) : pile = [5] <br> - push(3) : pile = [5, 3] <br> - push(7) : pile = [5, 3, 7] <br> - pop() : retire 7 → pile = [5, 3] <br> - push(2) : pile = [5, 3, 2] <br> - pop() : retire 2 → pile = [5, 3] <br> - pop() : retire 3 → pile = [5] <br> Le contenu final de la pile est [5]."
       },
       {
         "question": "3) Donnez deux exemples d'utilisation concrète d'une file (queue) en informatique ou en Data Science. (1.5 pts)",
         "reponse": "Deux exemples d'utilisation d'une file : <br> 1) Gestion des tâches (scheduling) dans un système d'exploitation : les processus sont traités dans l'ordre d'arrivée (FIFO). <br> 2) Parcours en largeur (BFS) dans un graphe : on utilise une file pour explorer les nœuds dans l'ordre de leur découverte."
       }
     ]
   },
   {
     "titre": "Gestion de Projet : Méthodologies et Acteurs",
     "points": "4 pts",
     "enonce": "<p>La gestion de projet est essentielle en Data Science. Répondez aux questions suivantes.</p>",
     "questions":[
       {
         "question": "1) Décrivez brièvement les six phases du modèle CRISP-DM. (2 pts)",
         "reponse": "Les six phases du modèle CRISP-DM sont : <br> <strong>1. Business Understanding</strong> : Comprendre les objectifs et les besoins du projet du point de vue de l'entreprise. <br> <strong>2. Data Understanding</strong> : Collecter et explorer les données pour en comprendre la structure. <br> <strong>3. Data Preparation</strong> : Nettoyer, transformer et préparer les données pour la modélisation. <br> <strong>4. Modeling</strong> : Sélectionner et appliquer des techniques de modélisation. <br> <strong>5. Evaluation</strong> : Évaluer le modèle pour s'assurer qu'il atteint les objectifs métier. <br> <strong>6. Deployment</strong> : Déployer le modèle en production et planifier sa maintenance. <br> Le processus est itératif : on peut revenir à des phases précédentes si nécessaire."
       },
       {
         "question": "2) Dans un projet Data Science, quels sont les rôles principaux et leurs responsabilités ? Citez au moins trois rôles. (2 pts)",
         "reponse": "Trois rôles principaux dans un projet Data Science : <br> 1) <strong>Data Scientist</strong> : Construit les modèles, analyse les données, et interprète les résultats. <br> 2) <strong>Data Engineer</strong> : Préparent, nettoient et gèrent les données (pipeline de données). <br> 3) <strong>Business Analyst</strong> : Fait le lien entre le métier et la technique, traduit les besoins métier en spécifications techniques. <br> 4) <strong>DevOps</strong> : Gère le déploiement et l'infrastructure en production. <br> 5) <strong>Product Owner</strong> : Définit les priorités et les fonctionnalités (en méthode agile)."
       }
     ]
   },
   {
     "titre": "Assurance Qualité et Tests en Data Science",
     "points": "4 pts",
     "enonce": "<p>La qualité est un enjeu majeur en Data Science. Répondez aux questions suivantes.</p>",
     "questions":[
       {
         "question": "1) Expliquez pourquoi l'assurance qualité est importante dans un projet Data Science. Citez deux bénéfices concrets. (2 pts)",
         "reponse": "L'assurance qualité est importante car elle garantit la fiabilité des résultats et des décisions prises à partir des modèles. Deux bénéfices concrets : <br> 1) <strong>Fiabilité des résultats</strong> : Les décisions prises à partir des modèles sont plus sûres, ce qui réduit les risques pour l'entreprise. <br> 2) <strong>Reproductibilité</strong> : Les analyses peuvent être reproduites par d'autres personnes ou à d'autres moments, ce qui permet de valider les résultats et de faciliter la collaboration."
       },
       {
         "question": "2) Quels types de tests peut-on mettre en place pour assurer la qualité d'un modèle de Machine Learning ? Donnez deux exemples. (2 pts)",
         "reponse": "Deux types de tests pour assurer la qualité d'un modèle de Machine Learning : <br> 1) <strong>Tests de performance</strong> : Vérifier que le modèle atteint les métriques de performance définies (exactitude, précision, rappel, etc.) sur des données de test. <br> 2) <strong>Tests de robustesse</strong> : Vérifier que le modèle gère correctement des cas extrêmes ou des données dégradées (valeurs manquantes, valeurs aberrantes, etc.) sans planter ni produire des résultats aberrants."
       }
     ]
   },
   {
     "titre": "Gestion de Version avec Git",
     "points": "4 pts",
     "enonce": "<p>Git est un outil essentiel pour la collaboration en Data Science. Répondez aux questions suivantes.</p>",
     "questions":[
       {
         "question": "1) Qu'est-ce que Git et pourquoi est-il important en Data Science ? (2 pts)",
         "reponse": "Git est un système de gestion de version décentralisé qui permet de suivre l'historique des modifications d'un ensemble de fichiers. En Data Science, il est important pour : <br> 1) Assurer la reproductibilité : en gardant une trace de l'évolution du code et des notebooks. <br> 2) Faciliter la collaboration : en permettant à plusieurs personnes de travailler simultanément sur le même projet. <br> 3) Gérer les expérimentations : en utilisant des branches pour tester différentes approches sans affecter la version stable."
       },
       {
         "question": "2) Quelles sont les commandes Git à utiliser pour : <br> a) Créer une nouvelle branche <br> b) Basculer sur une branche <br> c) Fusionner une branche dans la branche principale <br> d) Envoyer les modifications vers le dépôt distant (1 pt)",
         "reponse": "Les commandes correspondantes sont : <br> a) <code>git branch nom_branche</code> ou <code>git checkout -b nom_branche</code> (crée et bascule). <br> b) <code>git checkout nom_branche</code>. <br> c) <code>git merge nom_branche</code> (depuis la branche cible). <br> d) <code>git push origin nom_branche</code>."
       },
       {
         "question": "3) Pourquoi est-il déconseillé de versionner des fichiers de données volumineux avec Git ? Proposez une alternative. (1 pt)",
         "reponse": "Il est déconseillé de versionner des fichiers de données volumineux car Git stocke l'intégralité de chaque version, ce qui fait grossir le dépôt et ralentit les opérations. Une alternative est d'utiliser Git LFS (Large File Storage) ou de stocker les données sur un service cloud (S3, etc.) et de ne versionner que les scripts qui permettent de les télécharger."
       }
     ]
   }
 ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
