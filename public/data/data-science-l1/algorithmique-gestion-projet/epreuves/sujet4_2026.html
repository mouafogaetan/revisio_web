<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Introduction à l'Algorithmique et à la Gestion de Projet - L1",
  "classe": "Licence 1 Data Science",
  "sequence": "Évaluation Séquentielle n°4",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Questions de Cours sur la Complexité",
      "points": "4 pts",
      "enonce": "<div style='font-size: 1em; line-height: 1.6; color: #333;'>Cet exercice porte sur les notions fondamentales de la complexité des algorithmes, vues au chapitre 2.</div>",
      "questions": [
        {
          "question": "<div style='margin-bottom: 1em;'>1) <strong>Définissez</strong>, en vos propres termes, ce qu'est la complexité temporelle d'un algorithme et en quoi elle diffère de sa complexité spatiale.</div>",
          "reponse": "<div style='color: #2c3e50;'>La <strong>complexité temporelle</strong> mesure le temps d'exécution d'un algorithme en fonction de la taille des données d'entrée. La <strong>complexité spatiale</strong> mesure, quant à elle, la quantité de mémoire utilisée. La première se concentre sur la vitesse, la seconde sur l'utilisation de la mémoire.</div>"
        },
        {
          "question": "<div style='margin-bottom: 1em;'>2) <strong>Citez</strong> et <strong>classez</strong> par ordre croissant de performance (du plus efficace au moins efficace) cinq complexités usuelles représentées par la notation Grand O.</div>",
          "reponse": "<div style='color: #2c3e50;'>Ordre croissant de performance : <br>1. O(1) (constant)<br>2. O(log n) (logarithmique)<br>3. O(n) (linéaire)<br>4. O(n log n) (quasi-linéaire)<br>5. O(n²) (quadratique)</div>"
        },
        {
          "question": "<div style='margin-bottom: 1em;'>3) La recherche dichotomique est un algorithme très efficace. <strong>Quelle est sa complexité temporelle</strong> et <strong>pourquoi</strong> est-elle plus performante que la recherche séquentielle ?</div>",
          "reponse": "<div style='color: #2c3e50;'>La complexité de la recherche dichotomique est en <strong>O(log n)</strong>. Elle est plus performante que la recherche séquentielle (O(n)) car elle divise l'espace de recherche par deux à chaque étape, ce qui réduit drastiquement le nombre d'itérations, en particulier pour de grandes quantités de données.</div>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Analyse de Complexité d'Algorithmes de Tri",
      "points": "5 pts",
      "enonce": "<div style='font-size: 1em; line-height: 1.6; color: #333;'>On considère les algorithmes de tri vus en cours. Pour chacun d'eux, on vous demande de rappeler leur complexité dans différents cas. Remplissez le tableau suivant.</div>",
      "questions": [
        {
          "question": "<div style='margin-bottom: 1em;'><strong>1) Algorithme : Tri à bulles (Bubble Sort)</strong><br>- Complexité dans le cas le pire (pire cas) : <br>- Complexité dans le cas moyen : <br>- Complexité dans le meilleur des cas (meilleur cas) : </div>",
          "reponse": "<div style='color: #2c3e50;'><strong>Tri à bulles (Bubble Sort)</strong><br>- Pire cas : <strong>O(n²)</strong><br>- Cas moyen : <strong>O(n²)</strong><br>- Meilleur cas : <strong>O(n)</strong> (si le tableau est déjà trié et qu'on utilise une version optimisée)</div>"
        },
        {
          "question": "<div style='margin-bottom: 1em;'><strong>2) Algorithme : Tri par insertion (Insertion Sort)</strong><br>- Complexité dans le cas le pire (pire cas) : <br>- Complexité dans le cas moyen : <br>- Complexité dans le meilleur des cas (meilleur cas) : </div>",
          "reponse": "<div style='color: #2c3e50;'><strong>Tri par insertion (Insertion Sort)</strong><br>- Pire cas : <strong>O(n²)</strong><br>- Cas moyen : <strong>O(n²)</strong><br>- Meilleur cas : <strong>O(n)</strong> (si le tableau est déjà trié)</div>"
        },
        {
          "question": "<div style='margin-bottom: 1em;'><strong>3) Algorithme : Tri fusion (Merge Sort)</strong><br>- Complexité dans le cas le pire (pire cas) : <br>- Complexité dans le cas moyen : <br>- Complexité dans le meilleur des cas (meilleur cas) : </div>",
          "reponse": "<div style='color: #2c3e50;'><strong>Tri fusion (Merge Sort)</strong><br>- Pire cas : <strong>O(n log n)</strong><br>- Cas moyen : <strong>O(n log n)</strong><br>- Meilleur cas : <strong>O(n log n)</strong></div>"
        },
        {
          "question": "<div style='margin-bottom: 1em;'>4) Expliquez brièvement, en une phrase, la notion de <strong>\"tri en place\"</strong> et dites si le Tri Fusion en est un.</div>",
          "reponse": "<div style='color: #2c3e50;'>Un <strong>tri en place</strong> est un algorithme qui effectue le tri en modifiant directement la structure de données d'origine, sans utiliser une quantité significative de mémoire supplémentaire. Le Tri Fusion n'est <strong>pas un tri en place</strong> car il nécessite un tableau temporaire pour fusionner les sous-tableaux.</div>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Implémentation et Complexité (Les Fondamentaux)",
      "points": "5 pts",
      "enonce": "<div style='font-size: 1em; line-height: 1.6; color: #333;'>L'objectif de cet exercice est de vous confronter à l'écriture d'algorithmes et à l'analyse de leur performance. Vous rédigerez vos solutions en pseudo-code.</div>",
      "questions": [
        {
          "question": "<div style='margin-bottom: 1em;'>1) <strong>Écrivez</strong> un algorithme en pseudo-code qui recherche un élément dans un tableau non trié. <strong>Déterminez</strong> sa complexité temporelle dans le pire des cas.</div>",
          "reponse": "<div style='color: #2c3e50;'><pre style='background-color: #f4f4f4; padding: 1em; border-radius: 5px;'><strong>Algorithme</strong> recherche_sequentielle(tableau T, element x)<br>  <strong>Pour</strong> i <strong>de</strong> 0 <strong>à</strong> longueur(T)-1 <strong>faire</strong><br>    <strong>Si</strong> T[i] == x <strong>alors</strong><br>      <strong>Retourner</strong> i  <span style='color: #777;'>// Élément trouvé</span><br>    <strong>Fin Si</strong><br>  <strong>Fin Pour</strong><br>  <strong>Retourner</strong> -1 <span style='color: #777;'>// Élément non trouvé</span></pre><p><strong>Complexité temporelle :</strong> Dans le pire des cas, on parcourt tout le tableau. La complexité est en <strong>O(n)</strong>.</p></div>"
        },
        {
          "question": "<div style='margin-bottom: 1em;'>2) <strong>Écrivez</strong> l'algorithme de la recherche dichotomique. <strong>Quelle est la condition préalable essentielle</strong> pour qu'il fonctionne correctement ?</div>",
          "reponse": "<div style='color: #2c3e50;'><pre style='background-color: #f4f4f4; padding: 1em; border-radius: 5px;'><strong>Algorithme</strong> recherche_dichotomique(tableau T trié, element x)<br>  debut <- 0<br>  fin <- longueur(T)-1<br>  <strong>Tant que</strong> debut <= fin <strong>faire</strong><br>    milieu <- (debut + fin) / 2<br>    <strong>Si</strong> T[milieu] == x <strong>alors</strong><br>      <strong>Retourner</strong> milieu<br>    <strong>Sinon Si</strong> T[milieu] < x <strong>alors</strong><br>      debut <- milieu + 1<br>    <strong>Sinon</strong><br>      fin <- milieu - 1<br>    <strong>Fin Si</strong><br>  <strong>Fin Tant que</strong><br>  <strong>Retourner</strong> -1</pre><p><strong>Condition préalable :</strong> Le tableau doit être <strong>trié</strong>.</p></div>"
        },
        {
          "question": "<div style='margin-bottom: 1em;'>3) En comparant les deux algorithmes de recherche, expliquez pourquoi, malgré sa rapidité, la recherche dichotomique n'est pas toujours utilisée.</div>",
          "reponse": "<div style='color: #2c3e50;'>Malgré sa rapidité (O(log n) contre O(n) pour la recherche séquentielle), la recherche dichotomique nécessite que le tableau soit <strong>trié</strong>. L'opération de tri est elle-même coûteuse. Si les données sont dynamiques (sujettes à de fréquentes insertions/suppressions), maintenir le tableau trié peut annuler les gains de performance de la recherche.</div>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Optimisation et Gestion de Projet",
      "points": "3 pts",
      "enonce": "<div style='font-size: 1em; line-height: 1.6; color: #333;'>Dans un projet de Data Science, l'efficacité algorithmique et la gestion du temps sont cruciales.</div>",
      "questions": [
        {
          "question": "<div style='margin-bottom: 1em;'>1) <strong>Citez</strong> deux techniques d'optimisation qui permettent d'améliorer les performances d'un algorithme et <strong>expliquez</strong> brièvement le principe de l'une d'elles.</div>",
          "reponse": "<div style='color: #2c3e50;'>Deux techniques d'optimisation sont la <strong>mémoïsation</strong> et la <strong>programmation dynamique</strong>. La <strong>mémoïsation</strong> consiste à stocker les résultats des sous-problèmes déjà résolus pour les réutiliser, évitant ainsi des calculs redondants et améliorant considérablement le temps d'exécution.</div>"
        },
        {
          "question": "<div style='margin-bottom: 1em;'>2) En gestion de projet, quel est l'intérêt de créer un <strong>diagramme de Gantt</strong> ? Quelle est la différence entre un <strong>diagramme de Gantt</strong> et un <strong>WBS</strong> (<em>Work Breakdown Structure</em>) ?</div>",
          "reponse": "<div style='color: #2c3e50;'>Le <strong>diagramme de Gantt</strong> sert à <strong>visualiser le planning</strong> du projet et les dépendances entre les tâches. Le WBS est une <strong>décomposition hiérarchique du travail</strong> en tâches plus petites et gérables. Le WBS définit \"quoi faire\" alors que le diagramme de Gantt définit \"quand\" et \"dans quel ordre\" les faire.</div>"
        }
      ]
    },
    {
      "titre": "Exercice 5 : Application Pratique et Gestion de Projet",
      "points": "3 pts",
      "enonce": "<div style='font-size: 1em; line-height: 1.6; color: #333;'>Cet exercice combine les concepts d'algorithmique et de gestion de projet.</div>",
      "questions": [
        {
          "question": "<div style='margin-bottom: 1em;'>1) Vous devez développer un module de recherche avancée. La version initiale utilise une recherche séquentielle. Le chef de projet vous demande d'évaluer l'impact d'une migration vers la recherche dichotomique. <strong>Quels sont les avantages et les inconvénients</strong> de cette migration à prendre en compte avant de prendre une décision ?</div>",
          "reponse": "<div style='color: #2c3e50;'><ul><li><strong>Avantage :</strong> Gain de performance considérable (O(log n) vs O(n)), surtout avec de grands volumes de données.</li><li><strong>Inconvénients :</strong> L'algorithme nécessite un tableau trié. Si les données ne le sont pas, il faudra prévoir une étape de tri (qui a un coût), ou garantir que les données restent triées (ce qui peut complexifier la maintenance et les performances en écriture).</li></ul></div>"
        },
        {
          "question": "<div style='margin-bottom: 1em;'>2) Dans un projet informatique, un risque important est lié à la <strong>dérive du modèle</strong> (<em>model drift</em>). <strong>Définissez</strong> ce risque et <strong>proposez</strong> une stratégie pour l'atténuer.</div>",
          "reponse": "<div style='color: #2c3e50;'>La <strong>dérive du modèle</strong> est la dégradation des performances d'un modèle de Machine Learning en production, car les données qu'il traite évoluent dans le temps. Une stratégie d'atténuation consiste à <strong>mettre en place un monitoring continu</strong> pour surveiller les performances du modèle et à le <strong>ré-entraîner périodiquement</strong> avec de nouvelles données.</div>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
