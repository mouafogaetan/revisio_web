<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Présentation mobile</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' },
            options: { skipHtmlTypes: 'script' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 500px;
        margin: 0 auto;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    .slide-header {
        flex-shrink: 0;
        padding: 18px 16px 10px 16px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        z-index: 10;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .slide-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
    }

    .content-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 18px 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        flex-shrink: 0;
    }

    .content-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .content-card li {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        line-height: 1.5;
    }

    .content-card li:last-child {
        border-bottom: none;
    }

    .bullet-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
    }

    .math-block {
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        overflow-x: auto;
        flex-shrink: 0;
        margin: 4px 0;
    }

    .math-block .math {
        font-size: 1.2rem;
        color: #e2e8f0;
    }

    .note-box {
        background: rgba(96, 165, 250, 0.08);
        border-left: 4px solid #60a5fa;
        padding: 12px 16px;
        border-radius: 12px;
        font-style: italic;
        font-size: 0.9rem;
        color: #cbd5e1;
        flex-shrink: 0;
    }

    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        border-radius: 0;
        flex-direction: column;
    }

    .loading-card {
        background: #1e293b;
        padding: 32px 28px;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #334155;
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px auto;
    }

    .loading-text {
        font-weight: 600;
        font-size: 1.1rem;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    .loading-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 16px;
    }
    .loading-progress {
        height: 3px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        animation: loadingProgress 30s ease-out forwards;
    }

    .loading-timeout {
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 12px;
    }

    .btn-cancel-loading {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 40px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #f87171;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }

    .btn-cancel-loading:active {
        transform: scale(0.94);
        background: rgba(239, 68, 68, 0.25);
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
    }

    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .slide-counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255,255,255,0.05);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(255,255,255,0.04);
    }

    .status-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 30px;
        background: rgba(96, 165, 250, 0.12);
        color: #93bbfc;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
    }

    .status-badge .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: pulse-dot 1.2s infinite;
        flex-shrink: 0;
    }

    .status-badge.idle .dot {
        animation: none;
        background: #64748b;
    }
    .status-badge.speaking .dot {
        background: #34d399;
        animation: pulse-dot 0.8s infinite;
    }
    .status-badge.error .dot {
        background: #f87171;
        animation: none;
    }
    .status-badge.paused .dot {
        animation: none;
        background: #fbbf24;
    }
    .status-badge.waiting .dot {
        animation: pulse-dot 1.5s infinite;
        background: #fbbf24;
    }
    .status-badge.loading .dot {
        animation: pulse-dot 0.5s infinite;
        background: #60a5fa;
    }

    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.7); }
    }

    .footer-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(255,255,255,0.1);
    }

    .btn-secondary {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-play {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
        min-width: 80px;
        justify-content: center;
    }
    .btn-play:active {
        background: rgba(52, 211, 153, 0.25);
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
    }

    .auto-indicator {
        font-size: 0.65rem;
        color: #64748b;
        text-align: center;
        letter-spacing: 0.3px;
        padding: 2px 0;
    }

    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.2rem;
        }
        .content-card li {
            font-size: 0.9rem;
            padding: 8px 0;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .btn-play {
            min-width: 60px;
        }
        .footer-buttons {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
        .loading-card {
            padding: 20px 16px;
        }
        .math-block .math {
            font-size: 1rem;
        }
    }

    @media (min-width: 600px) {
        .app-container {
            max-width: 480px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
        .loading-overlay {
            border-radius: 32px;
        }
    }

    /* Mode jour (par défaut) */
    html, body {
        background: #f0f4f8 !important;
        color: #1a202c !important;
    }
    .app-container {
        background: linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%) !important;
    }
    .slide-header {
        background: rgba(255, 255, 255, 0.85) !important;
        border-bottom: 1px solid rgba(0,0,0,0.08) !important;
    }
    .slide-header h1 {
        background: linear-gradient(135deg, #2b6cb0, #6b46c1) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        background-clip: text !important;
    }
    .slide-footer {
        background: rgba(255, 255, 255, 0.9) !important;
        border-top: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card {
        background: rgba(255,255,255,0.8) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card li {
        border-bottom: 1px solid rgba(0,0,0,0.05) !important;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.12) !important;
        border-left: 4px solid #4299e1 !important;
        color: #2c3e50 !important;
    }
    .math-block {
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .math-block .math {
        color: #2d3748 !important;
    }
    .slide-counter {
        color: #4a5568 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .status-badge {
        background: rgba(96, 165, 250, 0.15) !important;
        color: #2b6cb0 !important;
        border: 1px solid rgba(96, 165, 250, 0.15) !important;
    }
    .btn {
        color: #2d3748 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .btn-secondary {
        background: rgba(0,0,0,0.04) !important;
        border-color: rgba(0,0,0,0.08) !important;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15) !important;
        border-color: rgba(52, 211, 153, 0.2) !important;
        color: #38a169 !important;
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15) !important;
        border-color: rgba(251, 191, 36, 0.2) !important;
        color: #d69e2e !important;
    }
    .auto-indicator {
        color: #718096 !important;
    }
    .loading-card {
        background: #ffffff !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .loading-text {
        color: #1a202c !important;
    }
    .loading-sub {
        color: #4a5568 !important;
    }
</style>
</head>
<body>

<div class="app-container">

    <header class="slide-header">
        <h1 id="slideTitle">Chargement...</h1>
    </header>

    <main class="slide-body" id="slideBody"></main>

    <!-- LOADING OVERLAY AVEC BOUTON ANNULER -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Préparation vocale...</div>
            <div class="loading-sub" id="loadingSub">Synthèse en cours</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loadingProgressBar"></div>
            </div>
            <div class="loading-timeout" id="loadingTimeout">⏱️ 30 secondes maximum</div>
            <button class="btn-cancel-loading" id="cancelLoadingBtn">
                <span>✕</span> Annuler
            </button>
        </div>
    </div>

    <footer class="slide-footer">
        <div class="footer-top">
            <span class="slide-counter" id="slideCounter">1 / 3</span>
            <span class="status-badge idle" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">Prêt</span>
            </span>
        </div>

        <div class="footer-buttons">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-secondary" id="replayBtn">
                <span class="btn-icon">🔁</span> <span class="btn-label">Relire</span>
            </button>
            <button class="btn btn-play" id="playBtn">
                <span class="btn-icon">▶</span> <span class="btn-label">Play</span>
            </button>
        </div>

        <div class="auto-indicator" id="autoIndicator">⏸ Lecture manuelle</div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // SLIDES
    // ================================================================
    const slides = [
  {
    "titre": "Objectifs de la Leçon",
    "contenu": "<div style='font-family: Arial, sans-serif; padding: 10px;'><h3 style='color: #2c3e50;'>Ce que nous allons apprendre</h3><ul style='list-style-type: disc; padding-left: 20px; font-size: 1em; line-height: 1.8;'><li>✅ Définir un graphe (orienté, non orienté, pondéré)</li><li>✅ Représenter un graphe (matrice d'adjacence, listes d'adjacence)</li><li>✅ Parcourir un graphe (BFS et DFS)</li><li>✅ Déterminer le plus court chemin (Dijkstra)</li><li>✅ Déterminer un arbre couvrant de poids minimum (Kruskal, Prim)</li></ul><div style='background-color: #e8f4fd; padding: 15px; border-radius: 10px; margin-top: 15px;'><p style='color: #1a5276; font-weight: bold;'>🎯 Objectif final : Savoir modéliser et résoudre des problèmes complexes avec des graphes</p></div></div>",
    "texteParle": "Bonjour à tous ! Dans cette leçon, nous allons découvrir une structure de données très puissante : les graphes. Nous verrons comment définir un graphe, comment le représenter en mémoire, et comment effectuer des opérations essentielles comme le parcours, la recherche du plus court chemin et la construction d'arbres couvrants. Les graphes sont utilisés dans de nombreux domaines : réseaux sociaux, GPS, réseaux informatiques, et bien d'autres.",
    "note": "Les graphes sont omniprésents dans les applications modernes."
  },
  {
    "titre": "Qu'est-ce qu'un Graphe ?",
    "contenu": "<div style='font-family: Arial, sans-serif; padding: 10px;'><div style='background-color: #ebf5fb; padding: 15px; border-radius: 10px; border-left: 5px solid #3498db;'><h4 style='color: #1a5276; margin: 0 0 10px 0;'>📌 Définition</h4><p style='font-size: 1em; margin: 0;'>Un graphe est une structure de données composée de <strong>sommets</strong> (ou nœuds) reliés par des <strong>arêtes</strong> (ou liens).</p></div><div style='display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin: 10px 0;'><div style='background-color: #eaf2f8; padding: 12px; border-radius: 8px; text-align: center;'><h4 style='color: #1a5276; margin: 0;'>🔵 Sommet</h4><p style='font-size: 0.9em; margin: 5px 0;'>Un point/entité<br>Ex: Ville, Personne</p></div><div style='background-color: #e8f8f5; padding: 12px; border-radius: 8px; text-align: center;'><h4 style='color: #1a7a3a; margin: 0;'>🔗 Arête</h4><p style='font-size: 0.9em; margin: 5px 0;'>Lien entre sommets<br>Ex: Route, Amitié</p></div><div style='background-color: #fef9e7; padding: 12px; border-radius: 8px; text-align: center;'><h4 style='color: #7d6608; margin: 0;'>📊 Poids</h4><p style='font-size: 0.9em; margin: 5px 0;'>Valeur associée à une arête<br>Ex: Distance, Coût</p></div></div><div style='background-color: #d5f5e3; padding: 12px; border-radius: 10px; text-align: center;'><p style='color: #1a7a3a; margin: 0;'><strong>💡 Exemple :</strong> Un réseau social où les sommets sont des personnes et les arêtes sont des relations d'amitié.</p></div></div>",
    "texteParle": "Un graphe est une structure de données composée de sommets, aussi appelés nœuds, reliés par des arêtes, ou liens. Les sommets représentent des entités comme des villes, des personnes ou des objets. Les arêtes représentent les relations entre ces entités, comme une route entre deux villes ou une amitié entre deux personnes. On peut aussi associer un poids à une arête, par exemple une distance ou un coût. Les graphes sont partout autour de nous : dans les réseaux sociaux, les systèmes GPS, les réseaux informatiques, etc.",
    "note": "Un graphe est un modèle mathématique pour représenter des relations."
  },
  {
    "titre": "Types de Graphes",
    "contenu": "<div style='font-family: Arial, sans-serif; padding: 10px;'><div style='display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;'><div style='background-color: #eaf2f8; padding: 15px; border-radius: 10px;'><h4 style='color: #1a5276; margin: 0 0 5px 0;'>🚫 Non Orienté</h4><p style='font-size: 0.95em; margin: 0;'>Les arêtes n'ont pas de direction. La relation est symétrique.</p><p style='font-size: 0.85em; color: #555; margin-top: 5px;'><strong>Ex:</strong> Amitié (A ami avec B = B ami avec A)</p></div><div style='background-color: #fef9e7; padding: 15px; border-radius: 10px;'><h4 style='color: #7d6608; margin: 0 0 5px 0;'>➡️ Orienté</h4><p style='font-size: 0.95em; margin: 0;'>Les arêtes ont une direction. La relation n'est pas symétrique.</p><p style='font-size: 0.85em; color: #555; margin-top: 5px;'><strong>Ex:</strong> Suivre sur Twitter (A suit B ≠ B suit A)</p></div><div style='background-color: #e8f8f5; padding: 15px; border-radius: 10px;'><h4 style='color: #1a7a3a; margin: 0 0 5px 0;'>⚖️ Pondéré</h4><p style='font-size: 0.95em; margin: 0;'>Chaque arête a une valeur (poids, coût, distance).</p><p style='font-size: 0.85em; color: #555; margin-top: 5px;'><strong>Ex:</strong> Distance entre villes, coût d'un trajet</p></div></div><div style='background-color: #d5f5e3; padding: 12px; border-radius: 10px; margin-top: 10px; text-align: center;'><p style='color: #1a7a3a; margin: 0;'><strong>📊 Un graphe peut être :</strong> Non orienté / Orienté / Pondéré / Non pondéré</p></div></div>",
    "texteParle": "Il existe différents types de graphes. Les graphes non orientés ont des arêtes sans direction : la relation est symétrique. Par exemple, dans une relation d'amitié, si A est ami avec B, alors B est aussi ami avec A. Les graphes orientés ont des arêtes avec une direction : la relation n'est pas symétrique. Par exemple, sur Twitter, A peut suivre B sans que B suive A. Les graphes pondérés associent un poids à chaque arête, comme une distance ou un coût. Un graphe peut combiner ces propriétés : par exemple, un graphe orienté et pondéré.",
    "note": "Le type de graphe dépend de la nature des relations à modéliser."
  },
  {
    "titre": "Représentation des Graphes",
    "contenu": "<div style='font-family: Arial, sans-serif; padding: 10px;'><div style='display: grid; grid-template-columns: 1fr 1fr; gap: 10px;'><div style='background-color: #eaf2f8; padding: 15px; border-radius: 10px;'><h4 style='color: #1a5276; margin: 0 0 10px 0;'>📊 Matrice d'Adjacence</h4><p style='font-size: 0.9em; margin: 0;'>Tableau n×n où <strong>M[i][j] = 1</strong> si arête entre i et j, <strong>0</strong> sinon.</p><div style='background-color: #2c3e50; padding: 8px; border-radius: 5px; margin-top: 8px;'><pre style='color: #ecf0f1; font-size: 0.8em; margin: 0; text-align: center;'>[0,1,0,0]<br>[1,0,1,1]<br>[0,1,0,1]<br>[0,1,1,0]</pre></div><p style='font-size: 0.85em; color: #555; margin-top: 5px;'><strong>Avantage :</strong> Accès en O(1)<br><strong>Inconvénient :</strong> Mémoire O(n²)</p></div><div style='background-color: #e8f8f5; padding: 15px; border-radius: 10px;'><h4 style='color: #1a7a3a; margin: 0 0 10px 0;'>📋 Listes d'Adjacence</h4><p style='font-size: 0.9em; margin: 0;'>Liste pour chaque sommet contenant ses voisins.</p><div style='background-color: #2c3e50; padding: 8px; border-radius: 5px; margin-top: 8px;'><pre style='color: #ecf0f1; font-size: 0.8em; margin: 0; text-align: center;'>0 → [1]<br>1 → [0,2,3]<br>2 → [1,3]<br>3 → [1,2]</pre></div><p style='font-size: 0.85em; color: #555; margin-top: 5px;'><strong>Avantage :</strong> Mémoire O(n+m)<br><strong>Inconvénient :</strong> Accès en O(deg)</p></div></div></div>",
    "texteParle": "Il existe deux principales façons de représenter un graphe en mémoire. La matrice d'adjacence est un tableau n×n où la valeur en position [i][j] vaut 1 s'il y a une arête entre i et j, et 0 sinon. Cette représentation permet un accès rapide en O(1) mais utilise beaucoup de mémoire O(n²). Les listes d'adjacence sont plus économes en mémoire O(n+m) : pour chaque sommet, on stocke la liste de ses voisins. L'accès est en O(deg), où deg est le degré du sommet. Le choix de la représentation dépend du contexte et des opérations que vous allez effectuer.",
    "note": "La matrice d'adjacence est plus rapide, les listes d'adjacence sont plus économes en mémoire."
  },
  {
    "titre": "Parcours en Largeur (BFS)",
    "contenu": "<div style='font-family: Arial, sans-serif; padding: 10px;'><div style='background-color: #ebf5fb; padding: 15px; border-radius: 10px; border-left: 5px solid #3498db;'><h4 style='color: #1a5276; margin: 0 0 10px 0;'>📌 Principe du BFS</h4><p style='font-size: 1em; margin: 0;'>Explorer tous les sommets voisins avant de passer aux sommets suivants. Utilise une <strong>file</strong> (FIFO).</p></div><div style='display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 0;'><div style='background-color: #d5f5e3; padding: 12px; border-radius: 8px;'><h4 style='color: #1a7a3a; margin: 0 0 5px 0;'>✅ Applications</h4><ul style='font-size: 0.9em; padding-left: 15px; margin: 5px 0;'><li>Plus court chemin (non pondéré)</li><li>Réseaux sociaux (degrés de séparation)</li><li>Web crawling</li></ul></div><div style='background-color: #fef9e7; padding: 12px; border-radius: 8px;'><h4 style='color: #7d6608; margin: 0 0 5px 0;'>📊 Étapes</h4><ul style='font-size: 0.9em; padding-left: 15px; margin: 5px 0;'><li>Partir d'un sommet source</li><li>Explorer niveau par niveau</li><li>Utiliser une file d'attente</li></ul></div></div><div style='background-color: #2c3e50; padding: 10px; border-radius: 8px;'><pre style='color: #ecf0f1; font-size: 0.85em; margin: 0; text-align: center;'>Exemple: BFS(0) → visite 0,1,2,3 dans l'ordre des niveaux</pre></div></div>",
    "texteParle": "Le parcours en largeur, ou BFS pour Breadth-First Search, explore un graphe en visitant tous les voisins d'un sommet avant de passer aux sommets plus éloignés. Il utilise une file d'attente pour gérer l'ordre de visite. Le BFS est particulièrement utile pour trouver le plus court chemin dans un graphe non pondéré, comme dans les réseaux sociaux pour trouver les degrés de séparation entre deux personnes. Il est aussi utilisé dans le web crawling pour explorer les pages internet.",
    "note": "Le BFS donne le plus court chemin en nombre d'arêtes dans un graphe non pondéré."
  },
  {
    "titre": "Parcours en Profondeur (DFS)",
    "contenu": "<div style='font-family: Arial, sans-serif; padding: 10px;'><div style='background-color: #ebf5fb; padding: 15px; border-radius: 10px; border-left: 5px solid #3498db;'><h4 style='color: #1a5276; margin: 0 0 10px 0;'>📌 Principe du DFS</h4><p style='font-size: 1em; margin: 0;'>Explorer aussi profondément que possible avant de revenir en arrière. Utilise une <strong>pile</strong> (LIFO) ou la récursivité.</p></div><div style='display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 0;'><div style='background-color: #d5f5e3; padding: 12px; border-radius: 8px;'><h4 style='color: #1a7a3a; margin: 0 0 5px 0;'>✅ Applications</h4><ul style='font-size: 0.9em; padding-left: 15px; margin: 5px 0;'><li>Détection de cycles</li><li>Tri topologique</li><li>Résolution de labyrinthes</li></ul></div><div style='background-color: #fef9e7; padding: 12px; border-radius: 8px;'><h4 style='color: #7d6608; margin: 0 0 5px 0;'>📊 Étapes</h4><ul style='font-size: 0.9em; padding-left: 15px; margin: 5px 0;'><li>Partir d'un sommet source</li><li>Explorer en profondeur</li><li>Revenir en arrière si blocage</li></ul></div></div><div style='background-color: #2c3e50; padding: 10px; border-radius: 8px;'><pre style='color: #ecf0f1; font-size: 0.85em; margin: 0; text-align: center;'>Exemple: DFS(0) → visite 0,1,2,3 (ou 0,1,3,2 selon l'ordre)</pre></div></div>",
    "texteParle": "Le parcours en profondeur, ou DFS pour Depth-First Search, explore un graphe en allant aussi profondément que possible avant de revenir en arrière. Il utilise une pile ou la récursivité. Le DFS est utile pour détecter des cycles dans un graphe, pour le tri topologique, ou pour résoudre des labyrinthes. Contrairement au BFS, le DFS ne donne pas nécessairement le plus court chemin, mais il est souvent plus simple à implémenter récursivement.",
    "note": "Le DFS est naturellement récursif et parcourt en profondeur avant largeur."
  },
  {
    "titre": "Plus Court Chemin : Algorithme de Dijkstra",
    "contenu": "<div style='font-family: Arial, sans-serif; padding: 10px;'><div style='background-color: #ebf5fb; padding: 15px; border-radius: 10px; border-left: 5px solid #3498db;'><h4 style='color: #1a5276; margin: 0 0 10px 0;'>📌 Principe de Dijkstra</h4><p style='font-size: 1em; margin: 0;'>Trouve le plus court chemin entre un sommet source et tous les autres sommets dans un graphe <strong>pondéré</strong> à poids <strong>positifs</strong>.</p></div><div style='display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 0;'><div style='background-color: #eaf2f8; padding: 12px; border-radius: 8px;'><h4 style='color: #1a5276; margin: 0 0 5px 0;'>⚙️ Étapes</h4><ul style='font-size: 0.9em; padding-left: 15px; margin: 5px 0;'><li>Initialiser distances (source=0, autres=∞)</li><li>Choisir le sommet non visité avec distance min</li><li>Mettre à jour les distances des voisins</li><li>Répéter jusqu'à visiter tous les sommets</li></ul></div><div style='background-color: #fef9e7; padding: 12px; border-radius: 8px;'><h4 style='color: #7d6608; margin: 0 0 5px 0;'>💡 Applications</h4><ul style='font-size: 0.9em; padding-left: 15px; margin: 5px 0;'><li>GPS (itinéraire le plus court)</li><li>Routage internet</li><li>Planification de trajets</li></ul></div></div><div style='background-color: #fdedec; padding: 12px; border-radius: 8px;'><p style='color: #922b21; margin: 0;'><strong>⚠️ Important :</strong> Dijkstra ne fonctionne pas avec des poids négatifs !</p></div></div>",
    "texteParle": "L'algorithme de Dijkstra permet de trouver le plus court chemin entre un sommet source et tous les autres sommets dans un graphe pondéré avec des poids positifs. Il fonctionne en attribuant une distance provisoire à chaque sommet, puis en mettant à jour ces distances à mesure qu'on explore le graphe. Cet algorithme est très utilisé dans les GPS pour trouver l'itinéraire le plus court, dans le routage internet, ou dans la planification de trajets. Attention : Dijkstra ne fonctionne pas avec des poids négatifs sur les arêtes.",
    "note": "Dijkstra est l'algorithme de référence pour les plus courts chemins à poids positifs."
  },
  {
    "titre": "Arbre Couvrant Minimum : Kruskal",
    "contenu": "<div style='font-family: Arial, sans-serif; padding: 10px;'><div style='background-color: #ebf5fb; padding: 15px; border-radius: 10px; border-left: 5px solid #3498db;'><h4 style='color: #1a5276; margin: 0 0 10px 0;'>📌 Principe de Kruskal</h4><p style='font-size: 1em; margin: 0;'>Construire un arbre couvrant de poids minimum en sélectionnant les arêtes par <strong>ordre croissant de poids</strong>.</p></div><div style='display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 0;'><div style='background-color: #eaf2f8; padding: 12px; border-radius: 8px;'><h4 style='color: #1a5276; margin: 0 0 5px 0;'>⚙️ Étapes</h4><ul style='font-size: 0.9em; padding-left: 15px; margin: 5px 0;'><li>Trier les arêtes par poids croissant</li><li>Sélectionner chaque arête si elle ne forme pas de cycle</li><li>Utiliser une structure Union-Find pour détecter les cycles</li><li>Répéter jusqu'à obtenir n-1 arêtes</li></ul></div><div style='background-color: #fef9e7; padding: 12px; border-radius: 8px;'><h4 style='color: #7d6608; margin: 0 0 5px 0;'>💡 Applications</h4><ul style='font-size: 0.9em; padding-left: 15px; margin: 5px 0;'><li>Réseau électrique</li><li>Réseau de télécommunications</li><li>Réseau routier</li></ul></div></div><div style='background-color: #d5f5e3; padding: 12px; border-radius: 8px;'><p style='color: #1a7a3a; margin: 0;'><strong>💡 Complexité :</strong> O(m log m) avec le tri des arêtes</p></div></div>",
    "texteParle": "L'algorithme de Kruskal permet de construire un arbre couvrant de poids minimum dans un graphe pondéré. L'idée est de sélectionner les arêtes par ordre croissant de poids, en s'assurant de ne pas créer de cycle. On utilise une structure Union-Find pour détecter les cycles efficacement. On s'arrête quand on a sélectionné n-1 arêtes, où n est le nombre de sommets. Kruskal est utilisé pour concevoir des réseaux électriques, des réseaux de télécommunications ou des réseaux routiers à moindre coût.",
    "note": "Kruskal construit un arbre couvrant minimum en sélectionnant les arêtes les moins chères."
  },
  {
    "titre": "Arbre Couvrant Minimum : Prim",
    "contenu": "<div style='font-family: Arial, sans-serif; padding: 10px;'><div style='background-color: #ebf5fb; padding: 15px; border-radius: 10px; border-left: 5px solid #3498db;'><h4 style='color: #1a5276; margin: 0 0 10px 0;'>📌 Principe de Prim</h4><p style='font-size: 1em; margin: 0;'>Construire un arbre couvrant de poids minimum en <strong>agrandissant progressivement</strong> un arbre à partir d'un sommet initial.</p></div><div style='display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 0;'><div style='background-color: #eaf2f8; padding: 12px; border-radius: 8px;'><h4 style='color: #1a5276; margin: 0 0 5px 0;'>⚙️ Étapes</h4><ul style='font-size: 0.9em; padding-left: 15px; margin: 5px 0;'><li>Choisir un sommet de départ</li><li>Ajouter l'arête de poids minimum qui relie un sommet visité à un sommet non visité</li><li>Répéter jusqu'à avoir n-1 arêtes</li></ul></div><div style='background-color: #fef9e7; padding: 12px; border-radius: 8px;'><h4 style='color: #7d6608; margin: 0 0 5px 0;'>💡 Applications</h4><ul style='font-size: 0.9em; padding-left: 15px; margin: 5px 0;'><li>Réseau électrique</li><li>Réseau de télécommunications</li><li>Réseau de transport</li></ul></div></div><div style='display: grid; grid-template-columns: 1fr 1fr; gap: 10px;'><div style='background-color: #d5f5e3; padding: 8px; border-radius: 5px; text-align: center;'><p style='color: #1a7a3a; margin: 0;'><strong>✅ Avantage :</strong> Plus rapide pour les graphes denses</p></div><div style='background-color: #fdedec; padding: 8px; border-radius: 5px; text-align: center;'><p style='color: #922b21; margin: 0;'><strong>⚠️ Inconvénient :</strong> Nécessite une structure de données pour les priorités</p></div></div></div>",
    "texteParle": "L'algorithme de Prim est une autre méthode pour construire un arbre couvrant de poids minimum. Contrairement à Kruskal qui trie toutes les arêtes, Prim construit l'arbre progressivement : on part d'un sommet initial, puis on ajoute à chaque étape l'arête de poids minimum qui relie un sommet déjà dans l'arbre à un sommet extérieur. Prim est généralement plus rapide que Kruskal pour les graphes denses, mais il nécessite une structure de données pour gérer les priorités.",
    "note": "Prim et Kruskal donnent le même arbre couvrant minimum (ou un autre de même poids)."
  },
  {
    "titre": "Comparaison BFS / DFS / Dijkstra / Kruskal / Prim",
    "contenu": "<div style='font-family: Arial, sans-serif; padding: 10px;'><table style='width: 100%; border-collapse: collapse; font-size: 0.8em;'><tr style='background-color: #2c3e50; color: white;'><th style='padding: 8px; border: 1px solid #ddd; text-align: center;'>Algorithme</th><th style='padding: 8px; border: 1px solid #ddd; text-align: center;'>Objectif</th><th style='padding: 8px; border: 1px solid #ddd; text-align: center;'>Structure</th><th style='padding: 8px; border: 1px solid #ddd; text-align: center;'>Complexité</th></tr><tr style='background-color: #eaf2f8;'><td style='padding: 6px; border: 1px solid #ddd;'><strong>BFS</strong></td><td style='padding: 6px; border: 1px solid #ddd;'>Parcours / Plus court chemin</td><td style='padding: 6px; border: 1px solid #ddd;'>File</td><td style='padding: 6px; border: 1px solid #ddd;'>O(n+m)</td></tr><tr><td style='padding: 6px; border: 1px solid #ddd;'><strong>DFS</strong></td><td style='padding: 6px; border: 1px solid #ddd;'>Parcours / Cycles / Tri topologique</td><td style='padding: 6px; border: 1px solid #ddd;'>Pile / Récursif</td><td style='padding: 6px; border: 1px solid #ddd;'>O(n+m)</td></tr><tr style='background-color: #eaf2f8;'><td style='padding: 6px; border: 1px solid #ddd;'><strong>Dijkstra</strong></td><td style='padding: 6px; border: 1px solid #ddd;'>Plus court chemin (poids positifs)</td><td style='padding: 6px; border: 1px solid #ddd;'>File de priorité</td><td style='padding: 6px; border: 1px solid #ddd;'>O((n+m) log n)</td></tr><tr><td style='padding: 6px; border: 1px solid #ddd;'><strong>Kruskal</strong></td><td style='padding: 6px; border: 1px solid #ddd;'>Arbre couvrant minimum</td><td style='padding: 6px; border: 1px solid #ddd;'>Tri + Union-Find</td><td style='padding: 6px; border: 1px solid #ddd;'>O(m log m)</td></tr><tr style='background-color: #eaf2f8;'><td style='padding: 6px; border: 1px solid #ddd;'><strong>Prim</strong></td><td style='padding: 6px; border: 1px solid #ddd;'>Arbre couvrant minimum</td><td style='padding: 6px; border: 1px solid #ddd;'>File de priorité</td><td style='padding: 6px; border: 1px solid #ddd;'>O(m log n)</td></tr></table></div>",
    "texteParle": "Voici un tableau comparatif des algorithmes que nous avons vus dans cette leçon. Le BFS et le DFS sont des algorithmes de parcours : le BFS utilise une file, le DFS utilise une pile ou la récursivité. Dijkstra trouve le plus court chemin dans un graphe pondéré à poids positifs. Kruskal et Prim construisent un arbre couvrant de poids minimum, mais avec des approches différentes : Kruskal trie les arêtes, Prim construit progressivement l'arbre. Chaque algorithme a ses forces et ses faiblesses selon le contexte.",
    "note": "Le choix de l'algorithme dépend du problème à résoudre et des propriétés du graphe."
  },
  {
    "titre": "Synthèse : Les Clés de la Réussite",
    "contenu": "<div style='font-family: Arial, sans-serif; padding: 10px;'><div style='background: linear-gradient(135deg, #2c3e50, #3498db); padding: 15px; border-radius: 10px; color: white;'><h4 style='color: white; margin: 0 0 10px 0; text-align: center;'>✨ Les 5 Points Clés à Retenir</h4><ul style='color: white; font-size: 1em; line-height: 2; padding-left: 20px;'><li>1️⃣ Un graphe = <strong>sommets</strong> + <strong>arêtes</strong> (orienté/non orienté, pondéré/non pondéré)</li><li>2️⃣ Représentation : <strong>matrice d'adjacence</strong> (rapide) ou <strong>listes d'adjacence</strong> (économe)</li><li>3️⃣ Parcours : <strong>BFS</strong> (file, niveaux) et <strong>DFS</strong> (pile, profondeur)</li><li>4️⃣ Plus court chemin : <strong>Dijkstra</strong> (poids positifs)</li><li>5️⃣ Arbre couvrant minimum : <strong>Kruskal</strong> (tri) et <strong>Prim</strong> (progression)</li></ul></div><div style='background-color: #d5f5e3; padding: 12px; border-radius: 10px; margin-top: 15px; text-align: center;'><p style='color: #1a7a3a; font-weight: bold; margin: 0;'>🎯 Maîtriser les graphes, c'est maîtriser les relations complexes</p></div></div>",
    "texteParle": "Pour conclure cette leçon sur les graphes, retenez ces cinq points clés. Les graphes sont des structures de données puissantes pour modéliser des relations. Ils peuvent être orientés ou non orientés, pondérés ou non pondérés. On les représente avec une matrice ou des listes d'adjacence. Le BFS et le DFS sont les deux algorithmes de parcours fondamentaux. Dijkstra permet de trouver le plus court chemin dans des graphes à poids positifs. Enfin, Kruskal et Prim permettent de construire un arbre couvrant de poids minimum. La maîtrise des graphes est essentielle pour résoudre des problèmes complexes dans de nombreux domaines.",
    "note;

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentIndex = 0;
    let isSpeaking = false;
    let isPaused = false;
    let currentUtterance = null;
    let isLoading = false;
    let loadingTimeout = null;
    let isTransitioning = false;
    let speechSupported = true;
    let userInteracted = false;
    let isPlaying = false;
    let loadingCancelled = false;

    const total = slides.length;
    const synth = window.speechSynthesis;

    // Références jQuery
    const $title = $('#slideTitle');
    const $body = $('#slideBody');
    const $counter = $('#slideCounter');
    const $statusText = $('#statusText');
    const $statusBadge = $('#statusBadge');
    const $loading = $('#loadingOverlay');
    const $loadingText = $('#loadingText');
    const $loadingSub = $('#loadingSub');
    const $loadingTimeout = $('#loadingTimeout');
    const $loadingProgressBar = $('#loadingProgressBar');
    const $autoIndicator = $('#autoIndicator');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $replay = $('#replayBtn');
    const $play = $('#playBtn');
    const $cancelLoading = $('#cancelLoadingBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function setStatus(text, type) {
        $statusText.text(text);
        $statusBadge.removeClass('idle speaking error paused waiting loading');
        if (type === 'speaking') $statusBadge.addClass('speaking');
        else if (type === 'error') $statusBadge.addClass('error');
        else if (type === 'paused') $statusBadge.addClass('paused');
        else if (type === 'waiting') $statusBadge.addClass('waiting');
        else if (type === 'loading') $statusBadge.addClass('loading');
        else $statusBadge.addClass('idle');
    }

    function updatePlayButton() {
        if (isPlaying) {
            $play.addClass('playing');
            $play.find('.btn-icon').text('⏸');
            $play.find('.btn-label').text('Pause');
        } else {
            $play.removeClass('playing');
            $play.find('.btn-icon').text('▶');
            $play.find('.btn-label').text('Play');
        }
    }

    function showLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        
        loadingCancelled = false;
        isLoading = true;
        
        // Réinitialiser la barre de progression
        $loadingProgressBar.css('animation', 'none');
        $loadingProgressBar.css('width', '0%');
        // Forcer un reflow
        $loadingProgressBar[0].offsetHeight;
        $loadingProgressBar.css('animation', 'loadingProgress 30s ease-out forwards');
        
        $loadingText.text('Préparation vocale...');
        $loadingSub.text('Synthèse en cours');
        $loadingTimeout.text('⏱️ 30 secondes maximum');
        $loading.fadeIn(300);
        setStatus("⏳ Chargement...", 'loading');
        
        // 🔥 TIMEOUT DE 30 SECONDES
        loadingTimeout = setTimeout(() => {
            if (isLoading && !loadingCancelled) {
                hideLoading();
                setStatus("⚠️ Délai dépassé (30s)", 'error');
                isPlaying = false;
                updatePlayButton();
                $loadingSub.text('La synthèse vocale a pris trop de temps');
                $loadingTimeout.text('❌ Délai dépassé');
            }
        }, 30000);
    }

    function hideLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        isLoading = false;
        loadingCancelled = false;
        $loading.fadeOut(300);
        // Ne pas changer le statut si on est en train de parler
        if (!isSpeaking && !isPlaying) {
            setStatus("⏸ Lecture arrêtée", 'paused');
        }
    }

    function cancelLoading() {
        loadingCancelled = true;
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        hideLoading();
        stopSpeaking();
        setStatus("⏸ Annulé", 'paused');
        isPlaying = false;
        updatePlayButton();
        $loadingText.text('Annulé par l\'utilisateur');
        $loadingSub.text('Vous pouvez réessayer');
        $loadingTimeout.text('✕ Annulation');
    }

    // Arrêter la parole proprement
    function stopSpeaking() {
        try {
            if (synth && (synth.speaking || synth.pending)) {
                synth.cancel();
            }
        } catch(e) {
            console.warn('Erreur stopSpeaking:', e);
        }
        if (currentUtterance) {
            try {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance.onstart = null;
            } catch(e) {}
            currentUtterance = null;
        }
        isSpeaking = false;
        isPlaying = false;
        updatePlayButton();
    }

    // Mettre en pause la parole
    function pauseSpeaking() {
        try {
            if (synth && synth.speaking) {
                synth.pause();
                isPaused = true;
                isPlaying = false;
                setStatus("⏸ Lecture en pause", 'paused');
                updatePlayButton();
            }
        } catch(e) {
            console.warn('Erreur pauseSpeaking:', e);
            stopSpeaking();
        }
    }

    // Reprendre la parole
    function resumeSpeaking() {
        try {
            if (synth && synth.paused) {
                synth.resume();
                isPaused = false;
                isPlaying = true;
                setStatus("🔊 Lecture en cours", 'speaking');
                updatePlayButton();
            } else if (!isSpeaking && !synth.speaking && !synth.pending) {
                speakSlide(currentIndex);
            }
        } catch(e) {
            console.warn('Erreur resumeSpeaking:', e);
            speakSlide(currentIndex);
        }
    }

    function renderSlide(index) {
        const slide = slides[index];
        $title.text(slide.titre);

        let html = '';
        html += `<div class="content-card">${slide.contenu}</div>`;
        if (slide.note) {
            html += `<div class="note-box">${slide.note}</div>`;
        }
        $body.html(html);
        $counter.text(`${index+1} / ${total}`);

        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
        }
    }

    // ================================================================
    // LECTURE VOCALE
    // ================================================================
    function speakSlide(index) {
        return new Promise((resolve) => {
            const slide = slides[index];
            const text = slide.texteParle;
            
            if (!text || text.trim() === '' || !speechSupported) {
                resolve();
                return;
            }

            if (!window.speechSynthesis) {
                setStatus("❌ Synthèse vocale non supportée", 'error');
                speechSupported = false;
                resolve();
                return;
            }

            // Arrêter toute lecture en cours
            stopSpeaking();
            
            // Réinitialiser l'état de pause
            isPaused = false;
            
            showLoading();
            setStatus("Initialisation...", 'loading');

            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.92;
                utterance.pitch = 1.05;
                utterance.volume = 1;

                let isFinished = false;
                let errorHandled = false;

                utterance.onstart = function() {
                    if (loadingCancelled) {
                        stopSpeaking();
                        resolve();
                        return;
                    }
                    hideLoading();
                    isSpeaking = true;
                    isPlaying = true;
                    isPaused = false;
                    setStatus("🔊 Lecture en cours", 'speaking');
                    updatePlayButton();
                };

                utterance.onend = function() {
                    if (isFinished) return;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    setStatus("✅ Terminé", 'idle');
                    hideLoading();
                    updatePlayButton();
                    resolve();
                };

                utterance.onerror = function(e) {
                    if (isFinished || errorHandled) return;
                    errorHandled = true;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    hideLoading();
                    updatePlayButton();
                    
                    if (e.error === 'not-allowed') {
                        setStatus("⚠️ Permission refusée", 'error');
                    } else if (e.error === 'synthesis-unavailable') {
                        setStatus("⚠️ Synthèse indisponible", 'error');
                    } else if (e.error === 'canceled') {
                        setStatus("⏸ Annulé", 'paused');
                    } else {
                        setStatus("❌ Erreur audio: " + (e.error || 'inconnue'), 'error');
                    }
                    
                    resolve();
                };

                // Gestion du chargement des voix
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = function() {
                        if (!loadingCancelled) {
                            try {
                                synth.speak(utterance);
                            } catch(err) {
                                // Silencieux
                            }
                        }
                        synth.onvoiceschanged = null;
                    };
                }

                currentUtterance = utterance;
                
                if (!loadingCancelled) {
                    try {
                        synth.speak(utterance);
                    } catch(err) {
                        setTimeout(() => {
                            if (!loadingCancelled) {
                                try {
                                    synth.speak(utterance);
                                } catch(e) {
                                    setStatus("❌ Erreur de lecture", 'error');
                                    isPlaying = false;
                                    updatePlayButton();
                                    hideLoading();
                                    resolve();
                                }
                            } else {
                                resolve();
                            }
                        }, 100);
                    }
                } else {
                    resolve();
                }

            } catch(err) {
                hideLoading();
                setStatus("❌ Erreur générale", 'error');
                isPlaying = false;
                updatePlayButton();
                console.error('Erreur speakSlide:', err);
                resolve();
            }
        });
    }

    // ================================================================
    // NAVIGATION
    // ================================================================
    async function goToSlide(index) {
        if (isTransitioning) return;
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        
        // Si on est en train de lire, on met en pause avant de naviguer
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        // Arrêter complètement la lecture
        stopSpeaking();
        
        await new Promise(r => setTimeout(r, 50));
        
        if (index === currentIndex) {
            setStatus("📄 Slide actuel", 'idle');
            return;
        }

        isTransitioning = true;
        currentIndex = index;
        renderSlide(index);
        
        // Réinitialiser l'état de lecture
        isPlaying = false;
        updatePlayButton();
        setStatus("⏸ Lecture arrêtée", 'paused');

        await new Promise(r => setTimeout(r, 150));
        isTransitioning = false;
    }

    async function goToNext() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex + 1 < total) {
            await goToSlide(currentIndex + 1);
        } else {
            setStatus("🏁 Dernier slide", 'idle');
        }
    }

    async function goToPrev() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex - 1 >= 0) {
            await goToSlide(currentIndex - 1);
        } else {
            setStatus("🔁 Premier slide", 'idle');
        }
    }

    // ================================================================
    // GESTION PLAY/PAUSE
    // ================================================================
    function togglePlay() {
        if (!userInteracted) {
            userInteracted = true;
        }

        // Si le chargement est en cours, on l'annule
        if (isLoading) {
            cancelLoading();
            return;
        }

        // Si le synthétiseur est en pause, on reprend
        if (synth && synth.paused) {
            resumeSpeaking();
            return;
        }

        // Si la lecture est en cours, on met en pause
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
            return;
        }

        // Sinon, on démarre la lecture du slide courant
        if (!isSpeaking && !isPlaying) {
            stopSpeaking();
            speakSlide(currentIndex);
        }
    }

    // ================================================================
    // INIT
    // ================================================================
    async function init() {
        // Vérifier la compatibilité
        if (!window.speechSynthesis) {
            setStatus("❌ Synthèse vocale non supportée", 'error');
            speechSupported = false;
        }

        // Précharger les voix
        try {
            if (synth.getVoices) {
                synth.getVoices();
                setTimeout(() => {
                    try {
                        synth.getVoices();
                    } catch(e) {}
                }, 200);
            }
        } catch(e) {
            console.warn('Erreur chargement voix:', e);
        }

        // Afficher le premier slide
        renderSlide(0);
        $counter.text(`1 / ${total}`);
        
        // État initial
        setStatus("⏸ Appuie sur Play", 'paused');
        updatePlayButton();
        $autoIndicator.text('⏸ Lecture manuelle');

        // ================================================================
        // ÉVÉNEMENTS
        // ================================================================
        
        // Bouton Play/Pause
        $play.on('click', function() {
            togglePlay();
        });

        // Bouton Annuler le chargement
        $cancelLoading.on('click', function() {
            cancelLoading();
        });

        // Navigation
        $prev.on('click', function() {
            // Si chargement en cours, on annule
            if (isLoading) cancelLoading();
            goToPrev();
        });

        $next.on('click', function() {
            if (isLoading) cancelLoading();
            goToNext();
        });

        // Replay - relire le slide courant
        $replay.on('click', function() {
            if (isLoading) cancelLoading();
            stopSpeaking();
            setTimeout(() => {
                speakSlide(currentIndex);
            }, 100);
        });

        // Support du clavier (espace pour play/pause)
        $(document).on('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });

        // Nettoyage
        $(window).on('beforeunload', function() {
            try {
                if (synth.speaking) synth.cancel();
            } catch(e) {}
            hideLoading();
        });

        // Gérer les cas où la synthèse se termine de manière inattendue
        setInterval(() => {
            if (isPlaying && !synth.speaking && !synth.pending && !isPaused && !isLoading) {
                isPlaying = false;
                updatePlayButton();
                setStatus("⏸ Lecture arrêtée", 'paused');
            }
        }, 1000);
    }

    init();
});



    // ================================================================
    // GESTION DU THÈME JOUR/NUIT
    // ================================================================
    let isDarkMode = false;

    function toggleTheme() {
        isDarkMode = !isDarkMode;
        const body = document.body;
        const appContainer = document.querySelector('.app-container');
        const header = document.querySelector('.slide-header');
        const footer = document.querySelector('.slide-footer');
        const contentCards = document.querySelectorAll('.content-card');
        const noteBoxes = document.querySelectorAll('.note-box');
        const mathBlocks = document.querySelectorAll('.math-block');
        const buttons = document.querySelectorAll('.btn');
        const statusBadge = document.querySelector('.status-badge');
        const slideCounter = document.querySelector('.slide-counter');
        const autoIndicator = document.querySelector('.auto-indicator');
        const themeBtn = document.getElementById('themeToggle');

        if (isDarkMode) {
            // Mode nuit
            body.style.background = '#0b1120';
            body.style.color = '#f1f5f9';
            appContainer.style.background = 'linear-gradient(145deg, #0f172a 0%, #1e293b 100%)';
            header.style.background = 'rgba(15, 23, 42, 0.85)';
            footer.style.background = 'rgba(15, 23, 42, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.05)';
                card.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.08)';
                note.style.color = '#cbd5e1';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.25)';
                block.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#e2e8f0';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.12)';
                statusBadge.style.color = '#93bbfc';
            }
            if (slideCounter) {
                slideCounter.style.color = '#94a3b8';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#64748b';
            }
            if (themeBtn) {
                themeBtn.textContent = '☀️';
                themeBtn.title = 'Passer en mode jour';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#e2e8f0';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#e2e8f0';
                }
            });
        } else {
            // Mode jour (par défaut)
            body.style.background = '#f0f4f8';
            body.style.color = '#1a202c';
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
            header.style.background = 'rgba(255, 255, 255, 0.85)';
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.8)';
                card.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.12)';
                note.style.color = '#2c3e50';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.05)';
                block.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#2d3748';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
                statusBadge.style.color = '#2b6cb0';
            }
            if (slideCounter) {
                slideCounter.style.color = '#4a5568';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#718096';
            }
            if (themeBtn) {
                themeBtn.textContent = '🌓';
                themeBtn.title = 'Passer en mode nuit';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#2c3e50';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#2d3748';
                }
            });
        }
    }

    // Initialiser en mode jour
    document.addEventListener('DOMContentLoaded', function() {
        // Appliquer le mode jour par défaut
        const body = document.body;
        body.style.background = '#f0f4f8';
        body.style.color = '#1a202c';
        
        const appContainer = document.querySelector('.app-container');
        if (appContainer) {
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
        }
        
        const header = document.querySelector('.slide-header');
        if (header) {
            header.style.background = 'rgba(255, 255, 255, 0.85)';
        }
        
        const footer = document.querySelector('.slide-footer');
        if (footer) {
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
        }
        
        document.querySelectorAll('.content-card').forEach(card => {
            card.style.background = 'rgba(255,255,255,0.8)';
            card.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.note-box').forEach(note => {
            note.style.background = 'rgba(96, 165, 250, 0.12)';
            note.style.color = '#2c3e50';
        });
        
        document.querySelectorAll('.math-block').forEach(block => {
            block.style.background = 'rgba(0,0,0,0.05)';
            block.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.btn').forEach(btn => {
            btn.style.color = '#2d3748';
        });
        
        const statusBadge = document.querySelector('.status-badge');
        if (statusBadge) {
            statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
            statusBadge.style.color = '#2b6cb0';
        }
        
        const slideCounter = document.querySelector('.slide-counter');
        if (slideCounter) {
            slideCounter.style.color = '#4a5568';
        }
        
        const autoIndicator = document.querySelector('.auto-indicator');
        if (autoIndicator) {
            autoIndicator.style.color = '#718096';
        }
        
        document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
            if (!el.closest('.note-box')) {
                el.style.color = '#2c3e50';
            }
        });
        
        document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
            if (!el.closest('.note-box') && !el.closest('.math-block')) {
                el.style.color = '#2d3748';
            }
        });
        
        const themeBtn = document.getElementById('themeToggle');
        if (themeBtn) {
            themeBtn.textContent = '🌓';
            themeBtn.title = 'Passer en mode nuit';
        }
    });
</script>
