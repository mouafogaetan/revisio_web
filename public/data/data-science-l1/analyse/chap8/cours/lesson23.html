<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Présentation mobile</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },

        };
    </script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 500px;
        margin: 0 auto;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    .slide-header {
        flex-shrink: 0;
        padding: 18px 16px 10px 16px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        z-index: 10;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .slide-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
    }

    .content-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 18px 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        flex-shrink: 0;
    }

    .content-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .content-card li {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        line-height: 1.5;
    }

    .content-card li:last-child {
        border-bottom: none;
    }

    .bullet-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
    }

    .math-block {
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        overflow-x: auto;
        flex-shrink: 0;
        margin: 4px 0;
    }

    .math-block .math {
        font-size: 1.2rem;
        color: #e2e8f0;
    }

    .note-box {
        background: rgba(96, 165, 250, 0.08);
        border-left: 4px solid #60a5fa;
        padding: 12px 16px;
        border-radius: 12px;
        font-style: italic;
        font-size: 0.9rem;
        color: #cbd5e1;
        flex-shrink: 0;
    }

    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        border-radius: 0;
        flex-direction: column;
    }

    .loading-card {
        background: #1e293b;
        padding: 32px 28px;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #334155;
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px auto;
    }

    .loading-text {
        font-weight: 600;
        font-size: 1.1rem;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    .loading-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 16px;
    }
    .loading-progress {
        height: 3px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        animation: loadingProgress 30s ease-out forwards;
    }

    .loading-timeout {
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 12px;
    }

    .btn-cancel-loading {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 40px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #f87171;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }

    .btn-cancel-loading:active {
        transform: scale(0.94);
        background: rgba(239, 68, 68, 0.25);
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
    }

    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .slide-counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255,255,255,0.05);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(255,255,255,0.04);
    }

    .status-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 30px;
        background: rgba(96, 165, 250, 0.12);
        color: #93bbfc;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
    }

    .status-badge .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: pulse-dot 1.2s infinite;
        flex-shrink: 0;
    }

    .status-badge.idle .dot {
        animation: none;
        background: #64748b;
    }
    .status-badge.speaking .dot {
        background: #34d399;
        animation: pulse-dot 0.8s infinite;
    }
    .status-badge.error .dot {
        background: #f87171;
        animation: none;
    }
    .status-badge.paused .dot {
        animation: none;
        background: #fbbf24;
    }
    .status-badge.waiting .dot {
        animation: pulse-dot 1.5s infinite;
        background: #fbbf24;
    }
    .status-badge.loading .dot {
        animation: pulse-dot 0.5s infinite;
        background: #60a5fa;
    }

    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.7); }
    }

    .footer-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(255,255,255,0.1);
    }

    .btn-secondary {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-play {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
        min-width: 80px;
        justify-content: center;
    }
    .btn-play:active {
        background: rgba(52, 211, 153, 0.25);
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
    }

    .auto-indicator {
        font-size: 0.65rem;
        color: #64748b;
        text-align: center;
        letter-spacing: 0.3px;
        padding: 2px 0;
    }

    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.2rem;
        }
        .content-card li {
            font-size: 0.9rem;
            padding: 8px 0;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .btn-play {
            min-width: 60px;
        }
        .footer-buttons {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
        .loading-card {
            padding: 20px 16px;
        }
        .math-block .math {
            font-size: 1rem;
        }
    }

    @media (min-width: 600px) {
        .app-container {
            max-width: 480px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
        .loading-overlay {
            border-radius: 32px;
        }
    }

    /* Mode jour (par défaut) */
    html, body {
        background: #f0f4f8 !important;
        color: #1a202c !important;
    }
    .app-container {
        background: linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%) !important;
    }
    .slide-header {
        background: rgba(255, 255, 255, 0.85) !important;
        border-bottom: 1px solid rgba(0,0,0,0.08) !important;
    }
    .slide-header h1 {
        background: linear-gradient(135deg, #2b6cb0, #6b46c1) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        background-clip: text !important;
    }
    .slide-footer {
        background: rgba(255, 255, 255, 0.9) !important;
        border-top: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card {
        background: rgba(255,255,255,0.8) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card li {
        border-bottom: 1px solid rgba(0,0,0,0.05) !important;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.12) !important;
        border-left: 4px solid #4299e1 !important;
        color: #2c3e50 !important;
    }
    .math-block {
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .math-block .math {
        color: #2d3748 !important;
    }
    .slide-counter {
        color: #4a5568 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .status-badge {
        background: rgba(96, 165, 250, 0.15) !important;
        color: #2b6cb0 !important;
        border: 1px solid rgba(96, 165, 250, 0.15) !important;
    }
    .btn {
        color: #2d3748 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .btn-secondary {
        background: rgba(0,0,0,0.04) !important;
        border-color: rgba(0,0,0,0.08) !important;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15) !important;
        border-color: rgba(52, 211, 153, 0.2) !important;
        color: #38a169 !important;
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15) !important;
        border-color: rgba(251, 191, 36, 0.2) !important;
        color: #d69e2e !important;
    }
    .auto-indicator {
        color: #718096 !important;
    }
    .loading-card {
        background: #ffffff !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .loading-text {
        color: #1a202c !important;
    }
    .loading-sub {
        color: #4a5568 !important;
    }
</style>
</head>
<body>

<div class="app-container">

    <header class="slide-header">
        <h1 id="slideTitle">Chargement...</h1>
    </header>

    <main class="slide-body" id="slideBody"></main>

    <!-- LOADING OVERLAY AVEC BOUTON ANNULER -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Préparation vocale...</div>
            <div class="loading-sub" id="loadingSub">Synthèse en cours</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loadingProgressBar"></div>
            </div>
            <div class="loading-timeout" id="loadingTimeout">⏱️ 30 secondes maximum</div>
            <button class="btn-cancel-loading" id="cancelLoadingBtn">
                <span>✕</span> Annuler
            </button>
        </div>
    </div>

    <footer class="slide-footer">
        <div class="footer-top">
            <span class="slide-counter" id="slideCounter">1 / 3</span>

                <span class="dot"></span>
                <span id="statusText">Prêt</span>
            </span>
        </div>

        <div class="footer-buttons">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-secondary" id="replayBtn">
                <span class="btn-icon">🔁</span> <span class="btn-label">Relire</span>
            </button>
            <button class="btn btn-play" id="playBtn">
                <span class="btn-icon">▶</span> <span class="btn-label">Play</span>
            </button>
        </div>

        <div class="auto-indicator" id="autoIndicator">⏸ Lecture manuelle</div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // SLIDES
    // ================================================================
    const slides = [
    {
        "titre": "Introduction aux Dérivées Directionnelles",
        "contenu": "<div style='display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center; background: linear-gradient(135deg, #1a237e, #0d47a1); color: white; border-radius: 15px; padding: 20px;'><h1 style='font-size: 2rem; margin-bottom: 10px;'>📊 Chapitre 8 : Calcul Différentiel à Plusieurs Variables</h1><h2 style='font-size: 1.6rem; margin-bottom: 15px;'>Leçon 23 : Dérivées Directionnelles et Gradient</h2><p style='font-size: 1.1rem; max-width: 90%;'>Bienvenue en Licence 1 Data Science ! Aujourd'hui, nous allons généraliser la notion de dérivée aux <strong>fonctions de plusieurs variables</strong>.</p><p style='font-size: 1rem; margin-top: 15px;'>Nous verrons comment une fonction évolue dans une direction donnée, et comment le gradient indique la direction de la plus forte pente.</p></div>",
        "texteParle": "Bonjour à toutes et à tous. Bienvenue dans ce cours d'analyse pour la Licence 1 Data Science. Nous abordons aujourd'hui une leçon très importante pour la Data Science : les dérivées directionnelles et le gradient. Jusqu'ici, nous avons étudié des fonctions d'une seule variable. Maintenant, nous allons voir comment dériver des fonctions qui dépendent de plusieurs variables. C'est essentiel pour l'optimisation et le machine learning.",
        "note": "Introduction aux dérivées directionnelles et au gradient pour les fonctions de plusieurs variables."
    },
    {
        "titre": "Rappel : Fonctions de Plusieurs Variables",
        "contenu": "<div style='display: flex; flex-direction: column; height: 100%; padding: 10px; background: #f8f9fa; border-radius: 10px;'><h3 style='color: #1a237e;'>📌 Généralisation</h3><p style='font-size: 1.05rem; text-align: justify;'>Une fonction de plusieurs variables associe à un point de \\(\\mathbb{R}^n\\) une valeur réelle :</p><div style='background: #e9ecef; padding: 12px; border-radius: 8px; margin: 10px 0; text-align: center;'><div class='math-block'><div class='math'>$$f : \\mathbb{R}^n \\rightarrow \\mathbb{R}$$</div></div><div class='math-block'><div class='math'>$$(x_1, x_2, ..., x_n) \\mapsto f(x_1, x_2, ..., x_n)$$</div></div></div><ul style='font-size: 1rem; list-style-type: none; padding-left: 0;'><li style='margin-bottom: 8px;'>📌 <strong>Exemple :</strong> \\(f(x,y) = x^2 + y^2\\) (paraboloïde)</li><li style='margin-bottom: 8px;'>📌 <strong>Exemple :</strong> \\(f(x,y) = e^{-(x^2+y^2)}\\) (cloche gaussienne)</li></ul><div style='background: #e3f2fd; padding: 12px; border-radius: 8px; margin-top: 5px;'><p style='font-size: 0.95rem;'>💡 En Data Science, ces fonctions représentent souvent des <strong>fonctions de coût</strong> que l'on cherche à minimiser.</p></div></div>",
        "texteParle": "Avant de parler de dérivées directionnelles, rappelons ce qu'est une fonction de plusieurs variables. C'est une fonction qui prend plusieurs nombres en entrée et donne un seul nombre en sortie. Par exemple, la fonction f de x et y égale x au carré plus y au carré donne la distance au carré par rapport à l'origine. En Data Science, ces fonctions sont très utilisées, notamment pour les fonctions de coût que l'on cherche à minimiser dans les algorithmes de machine learning.",
        "note": "Les fonctions de plusieurs variables sont essentielles en Data Science."
    },
    {
        "titre": "Dérivées Partielles",
        "contenu": "<div style='display: flex; flex-direction: column; height: 100%; padding: 10px; background: #f8f9fa; border-radius: 10px;'><h3 style='color: #1a237e;'>📊 Dérivée selon une variable</h3><p style='font-size: 1.05rem; text-align: justify;'>La <strong>dérivée partielle</strong> mesure la variation de \\(f\\) lorsque <strong>une seule</strong> variable varie, les autres étant fixées.</p><div style='background: #e9ecef; padding: 12px; border-radius: 8px; margin: 10px 0; text-align: center;'><div class='math-block'><div class='math'>$$\\dfrac{\\partial f}{\\partial x}(x_0, y_0) = \\lim_{h \\to 0} \\dfrac{f(x_0+h, y_0) - f(x_0, y_0)}{h}$$</div></div></div><ul style='font-size: 1rem; list-style-type: none; padding-left: 0;'><li style='margin-bottom: 8px;'>📌 <strong>Exemple :</strong> \\(f(x,y) = x^2y + y^3\\)</li><li style='margin-bottom: 8px;'>🔹 \\(\\dfrac{\\partial f}{\\partial x} = 2xy\\) (on dérive en x, y constant)</li><li style='margin-bottom: 8px;'>🔹 \\(\\dfrac{\\partial f}{\\partial y} = x^2 + 3y^2\\) (on dérive en y, x constant)</li></ul></div>",
        "texteParle": "Les dérivées partielles sont le point de départ. Une dérivée partielle, c'est la dérivée de la fonction par rapport à une variable, en considérant toutes les autres variables comme des constantes. Par exemple, pour la fonction f de x et y égale x au carré y plus y au cube, la dérivée partielle par rapport à x est 2xy, et la dérivée partielle par rapport à y est x au carré plus 3y au carré. C'est comme si on dérivait une fonction d'une seule variable à la fois.",
        "note": "Les dérivées partielles généralisent la notion de dérivée aux fonctions de plusieurs variables."
    },
    {
        "titre": "Définition du Gradient",
        "contenu": "<div style='display: flex; flex-direction: column; height: 100%; padding: 10px; background: #f8f9fa; border-radius: 10px;'><h3 style='color: #1a237e;'>📌 Vecteur Gradient</h3><p style='font-size: 1.05rem; text-align: justify;'>Le <strong>gradient</strong> de \\(f\\) en un point est le vecteur des dérivées partielles :</p><div style='background: #e9ecef; padding: 12px; border-radius: 8px; margin: 10px 0; text-align: center;'><div class='math-block'><div class='math'>$$\\nabla f(x_0, y_0) = \\left( \\dfrac{\\partial f}{\\partial x}(x_0, y_0), \\dfrac{\\partial f}{\\partial y}(x_0, y_0) \\right)$$</div></div></div><div style='background: #e8f5e9; padding: 12px; border-radius: 8px; margin: 10px 0;'><p style='font-weight: bold;'>📌 Pour une fonction de \\(n\\) variables :</p><div class='math-block'><div class='math'>$$\\nabla f = \\left( \\dfrac{\\partial f}{\\partial x_1}, \\dfrac{\\partial f}{\\partial x_2}, ..., \\dfrac{\\partial f}{\\partial x_n} \\right)$$</div></div></div><div style='background: #e3f2fd; padding: 12px; border-radius: 8px; margin-top: 5px;'><p style='font-weight: bold;'>📌 Exemple :</p><p>Pour \\(f(x,y) = x^2y + y^3\\), \\(\\nabla f(x,y) = (2xy, x^2 + 3y^2)\\)</p></div></div>",
        "texteParle": "Le gradient est le vecteur qui regroupe toutes les dérivées partielles de la fonction. Pour une fonction de deux variables, le gradient est un vecteur à deux composantes : la dérivée partielle par rapport à x et la dérivée partielle par rapport à y. Pour une fonction de n variables, le gradient est un vecteur à n composantes. Par exemple, pour la fonction f de x et y égale x au carré y plus y au cube, le gradient en un point est le vecteur (2xy, x au carré plus 3y au carré).",
        "note": "Le gradient est un vecteur qui contient toutes les dérivées partielles."
    },
    {
        "titre": "Interprétation Géométrique du Gradient",
        "contenu": "<div style='display: flex; flex-direction: column; height: 100%; padding: 10px; background: #f8f9fa; border-radius: 10px;'><h3 style='color: #1a237e;'>📈 Direction de la Plus Forte Pente</h3><p style='font-size: 1.05rem; text-align: justify;'>Le gradient possède une interprétation géométrique fondamentale :</p><div style='background: #e8f5e9; padding: 15px; border-radius: 8px; margin: 10px 0; border: 2px solid #4caf50;'><p style='font-weight: bold;'>✅ Le gradient \\(\\nabla f\\) pointe dans la <strong>direction de la plus forte augmentation</strong> de la fonction.</p></div><div style='background: #fce4ec; padding: 15px; border-radius: 8px; margin: 10px 0; border: 2px solid #f44336;'><p style='font-weight: bold;'>❌ Le gradient \\(-\\nabla f\\) pointe dans la <strong>direction de la plus forte diminution</strong>.</p></div><ul style='font-size: 1rem; list-style-type: none; padding-left: 0;'><li style='margin-bottom: 8px;'>📌 La norme du gradient donne la <strong>vitesse de variation maximale</strong>.</li><li style='margin-bottom: 8px;'>📌 Le gradient est toujours <strong>perpendiculaire</strong> aux courbes de niveau.</li></ul></div>",
        "texteParle": "Le gradient a une interprétation très importante. Il pointe dans la direction où la fonction augmente le plus rapidement. C'est la direction de la plus forte pente. Inversement, l'opposé du gradient est la direction de la plus forte diminution. C'est cette propriété qui est utilisée en machine learning pour minimiser les fonctions de coût. De plus, le gradient est toujours perpendiculaire aux courbes de niveau de la fonction.",
        "note": "Le gradient indique la direction de la plus forte augmentation de la fonction."
    },
    {
        "titre": "Dérivée Directionnelle",
        "contenu": "<div style='display: flex; flex-direction: column; height: 100%; padding: 10px; background: #f8f9fa; border-radius: 10px;'><h3 style='color: #1a237e;'>🧭 Variation selon une direction</h3><p style='font-size: 1.05rem; text-align: justify;'>La <strong>dérivée directionnelle</strong> mesure la variation de \\(f\\) le long d'un vecteur unitaire \\(\\vec{u}\\).</p><div style='background: #e9ecef; padding: 12px; border-radius: 8px; margin: 10px 0; text-align: center;'><div class='math-block'><div class='math'>$$D_{\\vec{u}} f(x_0, y_0) = \\lim_{h \\to 0} \\dfrac{f(x_0 + hu_x, y_0 + hu_y) - f(x_0, y_0)}{h}$$</div></div></div><div style='background: #e8f5e9; padding: 12px; border-radius: 8px; margin: 10px 0;'><p style='font-weight: bold;'>✅ Formule fondamentale :</p><div class='math-block'><div class='math'>$$D_{\\vec{u}} f = \\nabla f \\cdot \\vec{u}$$</div></div><p style='font-size: 0.95rem;'>La dérivée directionnelle est le <strong>produit scalaire</strong> du gradient et du vecteur direction.</p></div></div>",
        "texteParle": "La dérivée directionnelle généralise la notion de dérivée partielle. Au lieu de regarder la variation selon l'axe des x ou l'axe des y, on regarde la variation dans n'importe quelle direction, représentée par un vecteur unitaire. La formule est très simple : la dérivée directionnelle est le produit scalaire du gradient par le vecteur direction. C'est un résultat fondamental qui relie la dérivée directionnelle au gradient.",
        "note": "La dérivée directionnelle est le produit scalaire du gradient avec le vecteur direction."
    },
    {
        "titre": "Interprétation de la Dérivée Directionnelle",
        "contenu": "<div style='display: flex; flex-direction: column; height: 100%; padding: 10px; background: #f8f9fa; border-radius: 10px;'><h3 style='color: #1a237e;'>📊 Maximisation de la Variation</h3><p style='font-size: 1.05rem; text-align: justify;'>La dérivée directionnelle \\(D_{\\vec{u}} f = \\nabla f \\cdot \\vec{u}\\) nous donne des informations importantes :</p><div style='background: #e8f5e9; padding: 15px; border-radius: 8px; margin: 10px 0; border: 2px solid #4caf50;'><p style='font-weight: bold;'>✅ La variation est <strong>maximale</strong> lorsque \\(\\vec{u}\\) est dans la direction du gradient.</p><p>Valeur maximale : \\(|\\nabla f|\\)</p></div><div style='background: #fce4ec; padding: 15px; border-radius: 8px; margin: 10px 0; border: 2px solid #f44336;'><p style='font-weight: bold;'>❌ La variation est <strong>minimale</strong> (négative) lorsque \\(\\vec{u}\\) est dans la direction opposée au gradient.</p><p>Valeur minimale : \\(-|\\nabla f|\\)</p></div><div style='background: #fff3e0; padding: 12px; border-radius: 8px; margin-top: 5px;'><p style='font-weight: bold;'>📌 Variation nulle :</p><p>Lorsque \\(\\vec{u}\\) est perpendiculaire au gradient, la dérivée directionnelle est nulle.</p></div></div>",
        "texteParle": "La formule de la dérivée directionnelle nous permet de comprendre comment la fonction varie selon la direction choisie. La variation maximale est obtenue quand on se déplace dans la direction du gradient. La variation minimale, qui est une diminution, est obtenue dans la direction opposée au gradient. Quand on se déplace perpendiculairement au gradient, la fonction ne varie pas, c'est-à-dire qu'on reste sur une courbe de niveau.",
        "note": "La dérivée directionnelle est maximale dans la direction du gradient."
    },
    {
        "titre": "Exemple de Dérivée Directionnelle",
        "contenu": "<div style='display: flex; flex-direction: column; height: 100%; padding: 10px; background: #f8f9fa; border-radius: 10px;'><h3 style='color: #1a237e;'>📝 Application : \\(f(x,y) = x^2 + y^2\\)</h3><p style='font-size: 1.05rem; text-align: justify;'>Calculons la dérivée directionnelle au point \\((1,1)\\) dans la direction \\(\\vec{u} = \\left(\\dfrac{1}{\\sqrt{2}}, \\dfrac{1}{\\sqrt{2}}\\right)\\).</p><div style='background: #e9ecef; padding: 12px; border-radius: 8px; margin: 10px 0;'><p style='font-weight: bold;'>Étape 1 : Calcul du gradient</p><div class='math-block'><div class='math'>$$\\nabla f(x,y) = (2x, 2y) \\Rightarrow \\nabla f(1,1) = (2,2)$$</div></div></div><div style='background: #e9ecef; padding: 12px; border-radius: 8px; margin: 10px 0;'><p style='font-weight: bold;'>Étape 2 : Dérivée directionnelle</p><div class='math-block'><div class='math'>$$D_{\\vec{u}} f(1,1) = (2,2) \\cdot \\left(\\dfrac{1}{\\sqrt{2}}, \\dfrac{1}{\\sqrt{2}}\\right) = \\dfrac{4}{\\sqrt{2}} = 2\\sqrt{2}$$</div></div></div><div style='background: #e8f5e9; padding: 12px; border-radius: 8px; margin-top: 5px;'><p style='font-weight: bold; color: #4caf50;'>✅ La fonction augmente à un taux de \\(2\\sqrt{2}\\) dans cette direction.</p></div></div>",
        "texteParle": "Prenons un exemple concret. Soit la fonction f de x et y égale x au carré plus y au carré. On veut calculer la dérivée directionnelle au point (1,1) dans la direction qui fait 45 degrés avec l'axe des x. D'abord, on calcule le gradient en (1,1), qui est (2,2). Ensuite, on fait le produit scalaire du gradient avec le vecteur direction. Le résultat est 2 racine de 2. Cela signifie que la fonction augmente à ce taux dans cette direction.",
        "note": "La dérivée directionnelle mesure le taux de variation dans une direction donnée."
    },
    {
        "titre": "Gradient et Descente de Gradient",
        "contenu": "<div style='display: flex; flex-direction: column; height: 100%; padding: 10px; background: #f8f9fa; border-radius: 10px;'><h3 style='color: #1a237e;'>📉 Algorithme d'Optimisation</h3><p style='font-size: 1.05rem; text-align: justify;'>La <strong>descente de gradient</strong> est un algorithme itératif pour trouver le minimum d'une fonction.</p><div style='background: #e9ecef; padding: 12px; border-radius: 8px; margin: 10px 0;'><p style='font-weight: bold;'>Principe :</p><p>On part d'un point \\(x_0\\), puis on se déplace dans la direction opposée au gradient :</p><div class='math-block'><div class='math'>$$x_{n+1} = x_n - \\alpha \\nabla f(x_n)$$</div></div><p style='font-size: 0.95rem;'>où \\(\\alpha > 0\\) est le <strong>pas d'apprentissage</strong> (learning rate).</p></div><ul style='font-size: 1rem; list-style-type: none; padding-left: 0;'><li style='margin-bottom: 8px;'>📌 On répète jusqu'à convergence (quand le gradient est nul).</li><li style='margin-bottom: 8px;'>📌 Utilisé en <strong>régression linéaire</strong>, <strong>réseaux de neurones</strong>, etc.</li></ul></div>",
        "texteParle": "Le gradient est au cœur de l'algorithme de descente de gradient, probablement l'algorithme le plus important en Data Science. Le principe est simple : pour minimiser une fonction, on part d'un point, et on se déplace dans la direction opposée au gradient, parce que c'est la direction de la plus forte diminution. On répète cette opération jusqu'à ce que le gradient devienne nul, ce qui signifie qu'on a atteint un minimum. Le pas d'apprentissage contrôle la taille des pas.",
        "note": "La descente de gradient est l'algorithme fondamental du machine learning."
    },
    {
        "titre": "Pas d'Apprentissage",
        "contenu": "<div style='display: flex; flex-direction: column; height: 100%; padding: 10px; background: #f8f9fa; border-radius: 10px;'><h3 style='color: #1a237e;'>⚙️ Choix du Learning Rate</h3><p style='font-size: 1.05rem; text-align: justify;'>Le choix du pas d'apprentissage \\(\\alpha\\) est crucial pour la convergence de l'algorithme.</p><div style='background: #e8f5e9; padding: 12px; border-radius: 8px; margin: 10px 0; border-left: 4px solid #4caf50;'><p style='font-weight: bold;'>✅ \\(\\alpha\\) trop petit :</p><p>Convergence lente, nombre d'itérations élevé.</p></div><div style='background: #fce4ec; padding: 12px; border-radius: 8px; margin: 10px 0; border-left: 4px solid #f44336;'><p style='font-weight: bold;'>❌ \\(\\alpha\\) trop grand :</p><p>Risque de diverger, de sauter par-dessus le minimum.</p></div><div style='background: #fff3e0; padding: 12px; border-radius: 8px; margin-top: 5px;'><p style='font-weight: bold;'>📌 En pratique :</p><p>On essaye plusieurs valeurs (0.1, 0.01, 0.001, ...) ou on utilise un pas adaptatif.</p></div></div>",
        "texteParle": "Le choix du pas d'apprentissage, ou learning rate, est très important. Si le pas est trop petit, l'algorithme converge lentement et prend beaucoup de temps. Si le pas est trop grand, l'algorithme peut diverger et ne jamais trouver le minimum. En pratique, on essaie plusieurs valeurs, comme 0.1, 0.01, 0.001, et on regarde laquelle donne la meilleure convergence. Il existe aussi des méthodes pour adapter le pas automatiquement.",
        "note": "Le choix du pas d'apprentissage est crucial pour la convergence."
    },
    {
        "titre": "Exemple : Descente de Gradient",
        "contenu": "<div style='display: flex; flex-direction: column; height: 100%; padding: 10px; background: #f8f9fa; border-radius: 10px;'><h3 style='color: #1a237e;'>📝 Minimisation de \\(f(x) = x^2\\)</h3><p style='font-size: 1.05rem; text-align: justify;'>Appliquons la descente de gradient à une fonction simple.</p><div style='background: #e9ecef; padding: 12px; border-radius: 8px; margin: 10px 0;'><p style='font-weight: bold;'>Algorithme :</p><div class='math-block'><div class='math'>$$x_{n+1} = x_n - \\alpha f'(x_n) = x_n - 2\\alpha x_n = x_n(1 - 2\\alpha)$$</div></div></div><div style='background: #e9ecef; padding: 12px; border-radius: 8px; margin: 10px 0;'><p style='font-weight: bold;'>Avec \\(x_0 = 10\\), \\(\\alpha = 0.1\\) :</p><ul style='list-style-type: none; padding-left: 0;'><li>\\(x_0 = 10\\)</li><li>\\(x_1 = 10(1 - 0.2) = 8\\)</li><li>\\(x_2 = 8(1 - 0.2) = 6.4\\)</li><li>\\(x_3 = 6.4(1 - 0.2) = 5.12\\)</li><li>... converge vers 0 (le minimum)</li></ul></div></div>",
        "texteParle": "Prenons un exemple simple pour illustrer la descente de gradient. On veut minimiser la fonction f de x égale x au carré. Le gradient est 2x. L'algorithme donne x_{n+1} égale x_n moins alpha fois 2x_n. Avec un point de départ à 10 et un pas de 0.1, on obtient 8, puis 6.4, puis 5.12, et ainsi de suite. On voit que les valeurs diminuent et tendent vers 0, qui est le minimum de la fonction. C'est le principe de l'optimisation.",
        "note": "La descente de gradient permet de trouver le minimum d'une fonction."
    },
    {
        "titre": "Gradient et Courbes de Niveau",
        "contenu": "<div style='display: flex; flex-direction: column; height: 100%; padding: 10px; background: #f8f9fa; border-radius: 10px;'><h3 style='color: #1a237e;'>🗺️ Visualisation</h3><p style='font-size: 1.05rem; text-align: justify;'>Les courbes de niveau sont des lignes où la fonction est constante.</p><div style='background: #e9ecef; padding: 12px; border-radius: 8px; margin: 10px 0;'><p style='font-weight: bold;'>Propriétés :</p><ul style='list-style-type: none; padding-left: 0;'><li style='margin-bottom: 8px;'>🔹 Le gradient est <strong>perpendiculaire</strong> aux courbes de niveau.</li><li style='margin-bottom: 8px;'>🔹 La norme du gradient est plus grande là où les courbes sont plus serrées.</li><li style='margin-bottom: 8px;'>🔹 La descente de gradient suit une trajectoire perpendiculaire aux courbes.</li></ul></div><div style='background: #e3f2fd; padding: 12px; border-radius: 8px; margin-top: 5px;'><p style='font-weight: bold;'>📌 Application :</p><p>En Data Science, les courbes de niveau représentent les régions où la fonction de coût est égale à une valeur donnée.</p></div></div>",
        "texteParle": "Les courbes de niveau sont un outil de visualisation très utile pour les fonctions de deux variables. Ce sont les lignes où la fonction est constante. Le gradient a une propriété géométrique importante : il est toujours perpendiculaire aux courbes de niveau. De plus, quand les courbes sont serrées, la norme du gradient est grande, ce qui signifie que la fonction varie rapidement. La descente de gradient suit une trajectoire qui est perpendiculaire aux courbes de niveau.",

    {

        "contenu": "<div style='display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center; background: linear-gradient(135deg, #1a237e, #0d47a1); color: white; border-radius: 15px; padding: 20px;'><h2 style='font-size: 1.8rem; margin-bottom: 15px;'>📌 Points Clés à Retenir</h2><ul style='list-style-type: none; padding-left: 0; font-size: 1.1rem;'><li style='margin-bottom: 10px;'>✅ <strong>Dérivées partielles :</strong> Dérivée selon une variable, les autres fixes</li><li style='margin-bottom: 10px;'>✅ <strong>Gradient :</strong> Vecteur des dérivées partielles</li><li style='margin-bottom: 10px;'>✅ <strong>Dérivée directionnelle :</strong> \\(D_{\\vec{u}} f = \\nabla f \\cdot \\vec{u}\\)</li><li style='margin-bottom: 10px;'>✅ <strong>Interprétation :</strong> Le gradient pointe vers la plus forte augmentation</li><li style='margin-bottom: 10px;'>✅ <strong>Descente de gradient :</strong> \\(x_{n+1} = x_n - \\alpha \\nabla f(x_n)\\)</li></ul><p style='font-size: 1.1rem; margin-top: 15px;'>💪 Ces notions sont fondamentales pour l'optimisation en Data Science !</p></div>",
        "texteParle": "Pour conclure cette leçon, retenons les points essentiels. Les dérivées partielles sont les dérivées selon chaque variable individuellement. Le gradient est le vecteur qui regroupe toutes ces dérivées partielles. La dérivée directionnelle, qui mesure la variation dans une direction donnée, est le produit scalaire du gradient avec le vecteur direction. Le gradient pointe dans la direction de la plus forte augmentation. Enfin, la descente de gradient est l'algorithme fondamental pour minimiser les fonctions, très utilisé en Data Science et en machine learning.",

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentIndex = 0;
    let isSpeaking = false;
    let isPaused = false;
    let currentUtterance = null;
    let isLoading = false;
    let loadingTimeout = null;
    let isTransitioning = false;
    let speechSupported = true;
    let userInteracted = false;
    let isPlaying = false;
    let loadingCancelled = false;

    const total = slides.length;
    const synth = window.speechSynthesis;

    // Références jQuery
    const $title = $('#slideTitle');
    const $body = $('#slideBody');
    const $counter = $('#slideCounter');
    const $statusText = $('#statusText');
    const $statusBadge = $('#statusBadge');
    const $loading = $('#loadingOverlay');
    const $loadingText = $('#loadingText');
    const $loadingSub = $('#loadingSub');
    const $loadingTimeout = $('#loadingTimeout');
    const $loadingProgressBar = $('#loadingProgressBar');
    const $autoIndicator = $('#autoIndicator');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $replay = $('#replayBtn');
    const $play = $('#playBtn');
    const $cancelLoading = $('#cancelLoadingBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function setStatus(text, type) {
        $statusText.text(text);
        $statusBadge.removeClass('idle speaking error paused waiting loading');
        if (type === 'speaking') $statusBadge.addClass('speaking');
        else if (type === 'error') $statusBadge.addClass('error');
        else if (type === 'paused') $statusBadge.addClass('paused');
        else if (type === 'waiting') $statusBadge.addClass('waiting');
        else if (type === 'loading') $statusBadge.addClass('loading');
        else $statusBadge.addClass('idle');
    }

    function updatePlayButton() {
        if (isPlaying) {
            $play.addClass('playing');
            $play.find('.btn-icon').text('⏸');
            $play.find('.btn-label').text('Pause');
        } else {
            $play.removeClass('playing');
            $play.find('.btn-icon').text('▶');
            $play.find('.btn-label').text('Play');
        }
    }

    function showLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        
        loadingCancelled = false;
        isLoading = true;
        
        // Réinitialiser la barre de progression
        $loadingProgressBar.css('animation', 'none');
        $loadingProgressBar.css('width', '0%');
        // Forcer un reflow
        $loadingProgressBar[0].offsetHeight;
        $loadingProgressBar.css('animation', 'loadingProgress 30s ease-out forwards');
        
        $loadingText.text('Préparation vocale...');
        $loadingSub.text('Synthèse en cours');
        $loadingTimeout.text('⏱️ 30 secondes maximum');
        $loading.fadeIn(300);
        setStatus("⏳ Chargement...", 'loading');
        
        // 🔥 TIMEOUT DE 30 SECONDES
        loadingTimeout = setTimeout(() => {
            if (isLoading && !loadingCancelled) {
                hideLoading();
                setStatus("⚠️ Délai dépassé (30s)", 'error');
                isPlaying = false;
                updatePlayButton();
                $loadingSub.text('La synthèse vocale a pris trop de temps');
                $loadingTimeout.text('❌ Délai dépassé');
            }
        }, 30000);
    }

    function hideLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        isLoading = false;
        loadingCancelled = false;
        $loading.fadeOut(300);
        // Ne pas changer le statut si on est en train de parler
        if (!isSpeaking && !isPlaying) {
            setStatus("⏸ Lecture arrêtée", 'paused');
        }
    }

    function cancelLoading() {
        loadingCancelled = true;
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        hideLoading();
        stopSpeaking();
        setStatus("⏸ Annulé", 'paused');
        isPlaying = false;
        updatePlayButton();
        $loadingText.text('Annulé par l\'utilisateur');
        $loadingSub.text('Vous pouvez réessayer');
        $loadingTimeout.text('✕ Annulation');
    }

    // Arrêter la parole proprement
    function stopSpeaking() {
        try {
            if (synth && (synth.speaking || synth.pending)) {
                synth.cancel();
            }
        } catch(e) {
            console.warn('Erreur stopSpeaking:', e);
        }
        if (currentUtterance) {
            try {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance.onstart = null;
            } catch(e) {}
            currentUtterance = null;
        }
        isSpeaking = false;
        isPlaying = false;
        updatePlayButton();
    }

    // Mettre en pause la parole
    function pauseSpeaking() {
        try {
            if (synth && synth.speaking) {
                synth.pause();
                isPaused = true;
                isPlaying = false;
                setStatus("⏸ Lecture en pause", 'paused');
                updatePlayButton();
            }
        } catch(e) {
            console.warn('Erreur pauseSpeaking:', e);
            stopSpeaking();
        }
    }

    // Reprendre la parole
    function resumeSpeaking() {
        try {
            if (synth && synth.paused) {
                synth.resume();
                isPaused = false;
                isPlaying = true;
                setStatus("🔊 Lecture en cours", 'speaking');
                updatePlayButton();
            } else if (!isSpeaking && !synth.speaking && !synth.pending) {
                speakSlide(currentIndex);
            }
        } catch(e) {
            console.warn('Erreur resumeSpeaking:', e);
            speakSlide(currentIndex);
        }
    }

    function renderSlide(index) {
        const slide = slides[index];
        $title.text(slide.titre);

        let html = '';
        html += `<div class="content-card">${slide.contenu}</div>`;
        if (slide.note) {
            html += `<div class="note-box">${slide.note}</div>`;
        }
        $body.html(html);
        $counter.text(`${index+1} / ${total}`);

        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
        }
    }

    // ================================================================
    // LECTURE VOCALE
    // ================================================================
    function speakSlide(index) {
        return new Promise((resolve) => {
            const slide = slides[index];
            const text = slide.texteParle;
            
            if (!text || text.trim() === '' || !speechSupported) {
                resolve();
                return;
            }

            if (!window.speechSynthesis) {
                setStatus("❌ Synthèse vocale non supportée", 'error');
                speechSupported = false;
                resolve();
                return;
            }

            // Arrêter toute lecture en cours
            stopSpeaking();
            
            // Réinitialiser l'état de pause
            isPaused = false;
            
            showLoading();
            setStatus("Initialisation...", 'loading');

            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.92;
                utterance.pitch = 1.05;
                utterance.volume = 1;

                let isFinished = false;
                let errorHandled = false;

                utterance.onstart = function() {
                    if (loadingCancelled) {
                        stopSpeaking();
                        resolve();
                        return;
                    }
                    hideLoading();
                    isSpeaking = true;
                    isPlaying = true;
                    isPaused = false;
                    setStatus("🔊 Lecture en cours", 'speaking');
                    updatePlayButton();
                };

                utterance.onend = function() {
                    if (isFinished) return;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    setStatus("✅ Terminé", 'idle');
                    hideLoading();
                    updatePlayButton();
                    resolve();
                };

                utterance.onerror = function(e) {
                    if (isFinished || errorHandled) return;
                    errorHandled = true;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    hideLoading();
                    updatePlayButton();
                    
                    if (e.error === 'not-allowed') {
                        setStatus("⚠️ Permission refusée", 'error');
                    } else if (e.error === 'synthesis-unavailable') {
                        setStatus("⚠️ Synthèse indisponible", 'error');
                    } else if (e.error === 'canceled') {
                        setStatus("⏸ Annulé", 'paused');
                    } else {
                        setStatus("❌ Erreur audio: " + (e.error || 'inconnue'), 'error');
                    }
                    
                    resolve();
                };

                // Gestion du chargement des voix
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = function() {
                        if (!loadingCancelled) {
                            try {
                                synth.speak(utterance);
                            } catch(err) {
                                // Silencieux
                            }
                        }
                        synth.onvoiceschanged = null;
                    };
                }

                currentUtterance = utterance;
                
                if (!loadingCancelled) {
                    try {
                        synth.speak(utterance);
                    } catch(err) {
                        setTimeout(() => {
                            if (!loadingCancelled) {
                                try {
                                    synth.speak(utterance);
                                } catch(e) {
                                    setStatus("❌ Erreur de lecture", 'error');
                                    isPlaying = false;
                                    updatePlayButton();
                                    hideLoading();
                                    resolve();
                                }
                            } else {
                                resolve();
                            }
                        }, 100);
                    }
                } else {
                    resolve();
                }

            } catch(err) {
                hideLoading();
                setStatus("❌ Erreur générale", 'error');
                isPlaying = false;
                updatePlayButton();
                console.error('Erreur speakSlide:', err);
                resolve();
            }
        });
    }

    // ================================================================
    // NAVIGATION
    // ================================================================
    async function goToSlide(index) {
        if (isTransitioning) return;
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        
        // Si on est en train de lire, on met en pause avant de naviguer
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        // Arrêter complètement la lecture
        stopSpeaking();
        
        await new Promise(r => setTimeout(r, 50));
        
        if (index === currentIndex) {
            setStatus("📄 Slide actuel", 'idle');
            return;
        }

        isTransitioning = true;
        currentIndex = index;
        renderSlide(index);
        
        // Réinitialiser l'état de lecture
        isPlaying = false;
        updatePlayButton();
        setStatus("⏸ Lecture arrêtée", 'paused');

        await new Promise(r => setTimeout(r, 150));
        isTransitioning = false;
    }

    async function goToNext() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex + 1 < total) {
            await goToSlide(currentIndex + 1);
        } else {
            setStatus("🏁 Dernier slide", 'idle');
        }
    }

    async function goToPrev() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex - 1 >= 0) {
            await goToSlide(currentIndex - 1);
        } else {
            setStatus("🔁 Premier slide", 'idle');
        }
    }

    // ================================================================
    // GESTION PLAY/PAUSE
    // ================================================================
    function togglePlay() {
        if (!userInteracted) {
            userInteracted = true;
        }

        // Si le chargement est en cours, on l'annule
        if (isLoading) {
            cancelLoading();
            return;
        }

        // Si le synthétiseur est en pause, on reprend
        if (synth && synth.paused) {
            resumeSpeaking();
            return;
        }

        // Si la lecture est en cours, on met en pause
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
            return;
        }

        // Sinon, on démarre la lecture du slide courant
        if (!isSpeaking && !isPlaying) {
            stopSpeaking();
            speakSlide(currentIndex);
        }
    }

    // ================================================================
    // INIT
    // ================================================================
    async function init() {
        // Vérifier la compatibilité
        if (!window.speechSynthesis) {
            setStatus("❌ Synthèse vocale non supportée", 'error');
            speechSupported = false;
        }

        // Précharger les voix
        try {
            if (synth.getVoices) {
                synth.getVoices();
                setTimeout(() => {
                    try {
                        synth.getVoices();
                    } catch(e) {}
                }, 200);
            }
        } catch(e) {
            console.warn('Erreur chargement voix:', e);
        }

        // Afficher le premier slide
        renderSlide(0);
        $counter.text(`1 / ${total}`);
        
        // État initial
        setStatus("⏸ Appuie sur Play", 'paused');
        updatePlayButton();
        $autoIndicator.text('⏸ Lecture manuelle');

        // ================================================================
        // ÉVÉNEMENTS
        // ================================================================
        
        // Bouton Play/Pause
        $play.on('click', function() {
            togglePlay();
        });

        // Bouton Annuler le chargement
        $cancelLoading.on('click', function() {
            cancelLoading();
        });

        // Navigation
        $prev.on('click', function() {
            // Si chargement en cours, on annule
            if (isLoading) cancelLoading();
            goToPrev();
        });

        $next.on('click', function() {
            if (isLoading) cancelLoading();
            goToNext();
        });

        // Replay - relire le slide courant
        $replay.on('click', function() {
            if (isLoading) cancelLoading();
            stopSpeaking();
            setTimeout(() => {
                speakSlide(currentIndex);
            }, 100);
        });

        // Support du clavier (espace pour play/pause)
        $(document).on('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });

        // Nettoyage
        $(window).on('beforeunload', function() {
            try {
                if (synth.speaking) synth.cancel();
            } catch(e) {}
            hideLoading();
        });

        // Gérer les cas où la synthèse se termine de manière inattendue
        setInterval(() => {
            if (isPlaying && !synth.speaking && !synth.pending && !isPaused && !isLoading) {
                isPlaying = false;
                updatePlayButton();
                setStatus("⏸ Lecture arrêtée", 'paused');
            }
        }, 1000);
    }

    init();
});



    // ================================================================
    // GESTION DU THÈME JOUR/NUIT
    // ================================================================
    let isDarkMode = false;

    function toggleTheme() {
        isDarkMode = !isDarkMode;
        const body = document.body;
        const appContainer = document.querySelector('.app-container');
        const header = document.querySelector('.slide-header');
        const footer = document.querySelector('.slide-footer');
        const contentCards = document.querySelectorAll('.content-card');
        const noteBoxes = document.querySelectorAll('.note-box');
        const mathBlocks = document.querySelectorAll('.math-block');
        const buttons = document.querySelectorAll('.btn');
        const statusBadge = document.querySelector('.status-badge');
        const slideCounter = document.querySelector('.slide-counter');
        const autoIndicator = document.querySelector('.auto-indicator');
        const themeBtn = document.getElementById('themeToggle');

        if (isDarkMode) {
            // Mode nuit
            body.style.background = '#0b1120';
            body.style.color = '#f1f5f9';
            appContainer.style.background = 'linear-gradient(145deg, #0f172a 0%, #1e293b 100%)';
            header.style.background = 'rgba(15, 23, 42, 0.85)';
            footer.style.background = 'rgba(15, 23, 42, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.05)';
                card.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.08)';
                note.style.color = '#cbd5e1';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.25)';
                block.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#e2e8f0';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.12)';
                statusBadge.style.color = '#93bbfc';
            }
            if (slideCounter) {
                slideCounter.style.color = '#94a3b8';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#64748b';
            }
            if (themeBtn) {
                themeBtn.textContent = '☀️';
                themeBtn.title = 'Passer en mode jour';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#e2e8f0';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#e2e8f0';
                }
            });
        } else {
            // Mode jour (par défaut)
            body.style.background = '#f0f4f8';
            body.style.color = '#1a202c';
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
            header.style.background = 'rgba(255, 255, 255, 0.85)';
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.8)';
                card.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.12)';
                note.style.color = '#2c3e50';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.05)';
                block.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#2d3748';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
                statusBadge.style.color = '#2b6cb0';
            }
            if (slideCounter) {
                slideCounter.style.color = '#4a5568';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#718096';
            }
            if (themeBtn) {
                themeBtn.textContent = '🌓';
                themeBtn.title = 'Passer en mode nuit';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#2c3e50';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#2d3748';
                }
            });
        }
    }

    // Initialiser en mode jour
    document.addEventListener('DOMContentLoaded', function() {
        // Appliquer le mode jour par défaut
        const body = document.body;
        body.style.background = '#f0f4f8';
        body.style.color = '#1a202c';
        
        const appContainer = document.querySelector('.app-container');
        if (appContainer) {

            block.style.borderColor = 'rgba(0,0,0,0.08)';

        if (statusBadge) {

        const autoIndicator = document.querySelector('.auto-indicator');

        document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
            if (!el.closest('.note-box')) {

        document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
