<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Présentation mobile</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' },
            options: { skipHtmlTypes: 'script' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 500px;
        margin: 0 auto;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    .slide-header {
        flex-shrink: 0;
        padding: 18px 16px 10px 16px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        z-index: 10;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .slide-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
    }

    .content-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 18px 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        flex-shrink: 0;
    }

    .content-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .content-card li {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        line-height: 1.5;
    }

    .content-card li:last-child {
        border-bottom: none;
    }

    .bullet-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
    }

    .math-block {
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        overflow-x: auto;
        flex-shrink: 0;
        margin: 4px 0;
    }

    .math-block .math {
        font-size: 1.2rem;
        color: #e2e8f0;
    }

    .note-box {
        background: rgba(96, 165, 250, 0.08);
        border-left: 4px solid #60a5fa;
        padding: 12px 16px;
        border-radius: 12px;
        font-style: italic;
        font-size: 0.9rem;
        color: #cbd5e1;
        flex-shrink: 0;
    }

    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        border-radius: 0;
        flex-direction: column;
    }

    .loading-card {
        background: #1e293b;
        padding: 32px 28px;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #334155;
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px auto;
    }

    .loading-text {
        font-weight: 600;
        font-size: 1.1rem;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    .loading-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 16px;
    }
    .loading-progress {
        height: 3px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        animation: loadingProgress 30s ease-out forwards;
    }

    .loading-timeout {
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 12px;
    }

    .btn-cancel-loading {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 40px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #f87171;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }

    .btn-cancel-loading:active {
        transform: scale(0.94);
        background: rgba(239, 68, 68, 0.25);
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
    }

    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .slide-counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255,255,255,0.05);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(255,255,255,0.04);
    }

    .status-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 30px;
        background: rgba(96, 165, 250, 0.12);
        color: #93bbfc;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
    }

    .status-badge .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: pulse-dot 1.2s infinite;
        flex-shrink: 0;
    }

    .status-badge.idle .dot {
        animation: none;
        background: #64748b;
    }
    .status-badge.speaking .dot {
        background: #34d399;
        animation: pulse-dot 0.8s infinite;
    }
    .status-badge.error .dot {
        background: #f87171;
        animation: none;
    }
    .status-badge.paused .dot {
        animation: none;
        background: #fbbf24;
    }
    .status-badge.waiting .dot {
        animation: pulse-dot 1.5s infinite;
        background: #fbbf24;
    }
    .status-badge.loading .dot {
        animation: pulse-dot 0.5s infinite;
        background: #60a5fa;
    }

    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.7); }
    }

    .footer-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(255,255,255,0.1);
    }

    .btn-secondary {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-play {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
        min-width: 80px;
        justify-content: center;
    }
    .btn-play:active {
        background: rgba(52, 211, 153, 0.25);
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
    }

    .auto-indicator {
        font-size: 0.65rem;
        color: #64748b;
        text-align: center;
        letter-spacing: 0.3px;
        padding: 2px 0;
    }

    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.2rem;
        }
        .content-card li {
            font-size: 0.9rem;
            padding: 8px 0;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .btn-play {
            min-width: 60px;
        }
        .footer-buttons {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
        .loading-card {
            padding: 20px 16px;
        }
        .math-block .math {
            font-size: 1rem;
        }
    }

    @media (min-width: 600px) {
        .app-container {
            max-width: 480px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
        .loading-overlay {
            border-radius: 32px;
        }
    }

    /* Mode jour (par défaut) */
    html, body {
        background: #f0f4f8 !important;
        color: #1a202c !important;
    }
    .app-container {
        background: linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%) !important;
    }
    .slide-header {
        background: rgba(255, 255, 255, 0.85) !important;
        border-bottom: 1px solid rgba(0,0,0,0.08) !important;
    }
    .slide-header h1 {
        background: linear-gradient(135deg, #2b6cb0, #6b46c1) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        background-clip: text !important;
    }
    .slide-footer {
        background: rgba(255, 255, 255, 0.9) !important;
        border-top: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card {
        background: rgba(255,255,255,0.8) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card li {
        border-bottom: 1px solid rgba(0,0,0,0.05) !important;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.12) !important;
        border-left: 4px solid #4299e1 !important;
        color: #2c3e50 !important;
    }
    .math-block {
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .math-block .math {
        color: #2d3748 !important;
    }
    .slide-counter {
        color: #4a5568 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .status-badge {
        background: rgba(96, 165, 250, 0.15) !important;
        color: #2b6cb0 !important;
        border: 1px solid rgba(96, 165, 250, 0.15) !important;
    }
    .btn {
        color: #2d3748 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .btn-secondary {
        background: rgba(0,0,0,0.04) !important;
        border-color: rgba(0,0,0,0.08) !important;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15) !important;
        border-color: rgba(52, 211, 153, 0.2) !important;
        color: #38a169 !important;
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15) !important;
        border-color: rgba(251, 191, 36, 0.2) !important;
        color: #d69e2e !important;
    }
    .auto-indicator {
        color: #718096 !important;
    }
    .loading-card {
        background: #ffffff !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .loading-text {
        color: #1a202c !important;
    }
    .loading-sub {
        color: #4a5568 !important;
    }
</style>
</head>
<body>

<div class="app-container">

    <header class="slide-header">
        <h1 id="slideTitle">Chargement...</h1>
    </header>

    <main class="slide-body" id="slideBody"></main>

    <!-- LOADING OVERLAY AVEC BOUTON ANNULER -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Préparation vocale...</div>
            <div class="loading-sub" id="loadingSub">Synthèse en cours</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loadingProgressBar"></div>
            </div>
            <div class="loading-timeout" id="loadingTimeout">⏱️ 30 secondes maximum</div>
            <button class="btn-cancel-loading" id="cancelLoadingBtn">
                <span>✕</span> Annuler
            </button>
        </div>
    </div>

    <footer class="slide-footer">
        <div class="footer-top">
            <span class="slide-counter" id="slideCounter">1 / 3</span>
            <span class="status-badge idle" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">Prêt</span>
            </span>
        </div>

        <div class="footer-buttons">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-secondary" id="replayBtn">
                <span class="btn-icon">🔁</span> <span class="btn-label">Relire</span>
            </button>
            <button class="btn btn-play" id="playBtn">
                <span class="btn-icon">▶</span> <span class="btn-label">Play</span>
            </button>
        </div>

        <div class="auto-indicator" id="autoIndicator">⏸ Lecture manuelle</div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // SLIDES
    // ================================================================
    const slides = [
  {
    "titre": "Introduction",
    "contenu": "<div style='background: #e3f2fd; padding: 15px; border-radius: 10px; color: #0d47a1;'>\n<p style='font-size:1.2rem; margin-top:0;'>Bienvenue dans le cours <strong>d'Analyse</strong> !</p>\n<p>Nous commençons par les <strong>fonctions réelles d'une variable réelle</strong>.</p>\n<p>Cette leçon pose les bases : domaine de définition, image, graphe, parité, périodicité, monotonie, et les notions d'injectivité, surjectivité, bijectivité.</p>\n<p style='margin-bottom:0;'>Ces concepts sont <strong>essentiels</strong> pour la suite du cursus en Data Science.</p>\n</div>",
    "texteParle": "Bonjour à tous. Bienvenue dans ce cours d'analyse. Nous allons commencer par une leçon fondamentale sur les fonctions réelles d'une variable réelle. Dans cette première séance, nous allons poser les bases essentielles : le domaine de définition, l'image, le graphe d'une fonction, mais aussi les notions de parité, de périodicité, et de monotonie. Nous verrons également les concepts d'injectivité, de surjectivité et de bijectivité. Ces notions sont cruciales pour la suite de votre formation en Data Science.",
    "note": "Ce chapitre est la porte d'entrée de l'analyse mathématique."
  },
  {
    "titre": "Domaine de Définition",
    "contenu": "<div style='background: #f5f5f5; padding: 15px; border-radius: 10px; color: #212121;'>\n<h3 style='margin-top:0;'>Définition</h3>\n<p>Le <strong>domaine de définition</strong> \\( D_f \\) d'une fonction \\( f \\) est l'ensemble des valeurs \\( x \\) pour lesquelles \\( f(x) \\) existe (est définie).</p>\n\n<div class='math-block' style='background: #e0e0e0; padding: 10px; border-radius: 8px;'>\n  <div class='math'>$$D_f = \\{ x \\in \\mathbb{R} \\mid f(x) \\text{ existe} \\}$$</div>\n</div>\n\n<h4>Exemples</h4>\n<ul style='list-style-type: disc; padding-left: 20px;'>\n  <li>\\( f(x) = \\sqrt{x} \\Rightarrow D_f = [0, +\\infty[ \\)</li>\n  <li>\\( g(x) = \\dfrac{1}{x} \\Rightarrow D_g = \\mathbb{R}^* = ]-\\infty, 0[ \\cup ]0, +\\infty[ \\)</li>\n  <li>\\( h(x) = \\ln(x) \\Rightarrow D_h = ]0, +\\infty[ \\)</li>\n</ul>\n</div>",
    "texteParle": "Commençons par le domaine de définition. Le domaine de définition d'une fonction, noté D indice f, est l'ensemble de toutes les valeurs de x pour lesquelles la fonction est définie. Autrement dit, c'est l'ensemble des x pour lesquels on peut calculer f de x. Par exemple, la fonction racine carrée de x est définie uniquement pour x positif ou nul. La fonction un sur x est définie pour tout x sauf zéro. Enfin, la fonction logarithme népérien est définie uniquement pour x strictement positif.",
    "note": "Le domaine de définition est souvent restreint par des contraintes mathématiques."
  },
  {
    "titre": "Image et Graphe",
    "contenu": "<div style='background: #e8f5e9; padding: 15px; border-radius: 10px; color: #1b5e20;'>\n<h3 style='margin-top:0;'>Image et Graphe</h3>\n\n<h4>Image d'une fonction</h4>\n<p>L'<strong>image</strong> de \\( f \\) est l'ensemble des valeurs prises par \\( f \\) :</p>\n<div class='math-block' style='background: #c8e6c9; padding: 10px; border-radius: 8px;'>\n  <div class='math'>$$\\text{Im}(f) = \\{ f(x) \\mid x \\in D_f \\}$$</div>\n</div>\n\n<h4>Graphe d'une fonction</h4>\n<p>Le <strong>graphe</strong> (ou courbe représentative) est l'ensemble des points \\( (x, f(x)) \\) :</p>\n<div class='math-block' style='background: #c8e6c9; padding: 10px; border-radius: 8px;'>\n  <div class='math'>$$\\mathcal{C}_f = \\{ (x, f(x)) \\mid x \\in D_f \\} \\subset \\mathbb{R}^2$$</div>\n</div>\n\n<p style='background: #a5d6a7; padding: 10px; border-radius: 5px;'>\n  <strong>Exemple :</strong> Pour \\( f(x) = x^2 \\), \\( D_f = \\mathbb{R} \\), \\( \\text{Im}(f) = [0, +\\infty[ \\). Son graphe est une parabole.\n</p>\n</div>",
    "texteParle": "Ensuite, nous avons l'image d'une fonction. L'image, notée Im de f, est l'ensemble de toutes les valeurs que la fonction peut prendre. Concrètement, c'est l'ensemble des f de x pour tous les x du domaine de définition. Enfin, le graphe d'une fonction, noté C indice f, est l'ensemble des points de coordonnées x, f de x dans le plan. C'est la courbe que l'on trace habituellement. Par exemple, pour la fonction carré, le domaine de définition est l'ensemble des réels, l'image est l'ensemble des nombres positifs ou nuls, et son graphe est une parabole.",
    "note": "Le graphe donne une représentation visuelle des propriétés de la fonction."
  },
  {
    "titre": "Parité d'une Fonction",
    "contenu": "<div style='background: #fff3e0; padding: 15px; border-radius: 10px; color: #e65100;'>\n<h3 style='margin-top:0;'>Fonction paire et impaire</h3>\n\n<h4>Fonction paire</h4>\n<ul style='list-style-type: disc; padding-left: 20px;'>\n  <li><strong>Définition :</strong> \\( f(-x) = f(x) \\) pour tout \\( x \\in D_f \\)</li>\n  <li><strong>Graphe :</strong> symétrique par rapport à l'axe des ordonnées (Oy).</li>\n</ul>\n\n<h4>Fonction impaire</h4>\n<ul style='list-style-type: disc; padding-left: 20px;'>\n  <li><strong>Définition :</strong> \\( f(-x) = -f(x) \\) pour tout \\( x \\in D_f \\)</li>\n  <li><strong>Graphe :</strong> symétrique par rapport à l'origine du repère.</li>\n</ul>\n\n<div style='background: #ffe0b2; padding: 10px; border-radius: 8px;'>\n  <p style='margin:0;'><strong>Exemples :</strong></p>\n  <ul style='list-style-type: disc; padding-left: 20px;'>\n    <li>\\( f(x) = x^2 \\) est paire.</li>\n    <li>\\( g(x) = x^3 \\) est impaire.</li>\n    <li>\\( h(x) = e^x \\) n'est ni paire ni impaire.</li>\n  </ul>\n</div>\n</div>",
    "texteParle": "Les fonctions peuvent avoir des symétries. Une fonction est paire si f de moins x est égal à f de x pour tout x. Son graphe est alors symétrique par rapport à l'axe des ordonnées. Par exemple, la fonction carré est paire. Une fonction est impaire si f de moins x est égal à moins f de x. Son graphe est alors symétrique par rapport à l'origine du repère. Par exemple, la fonction cube est impaire. La fonction exponentielle n'est ni paire ni impaire. Ces propriétés permettent de simplifier l'étude des fonctions.",
    "note": "La parité d'une fonction réduit le domaine d'étude à la moitié de l'axe des abscisses."
  },
  {
    "titre": "Périodicité",
    "contenu": "<div style='background: #e0f7fa; padding: 15px; border-radius: 10px; color: #006064;'>\n<h3 style='margin-top:0;'>Fonction périodique</h3>\n\n<p>Une fonction \\( f \\) est <strong>périodique</strong> de période \\( T > 0 \\) si :</p>\n<div class='math-block' style='background: #b2ebf2; padding: 10px; border-radius: 8px;'>\n  <div class='math'>$$f(x + T) = f(x) \\quad \\forall x \\in D_f$$</div>\n</div>\n\n<ul style='list-style-type: disc; padding-left: 20px;'>\n  <li>La plus petite période positive est appelée <strong>période fondamentale</strong>.</li>\n  <li>Le graphe se répète identiquement sur chaque intervalle de longueur \\( T \\).</li>\n</ul>\n\n<div style='background: #4dd0e1; padding: 10px; border-radius: 8px; color: #004d40;'>\n  <p style='margin:0;'><strong>Exemple :</strong> Les fonctions \\( \\sin \\) et \\( \\cos \\) sont périodiques de période \\( 2\\pi \\). La fonction \\( \\tan \\) est périodique de période \\( \\pi \\).</p>\n</div>\n</div>",
    "texteParle": "Certaines fonctions se répètent à intervalles réguliers. On dit qu'elles sont périodiques. Une fonction est périodique de période T si f de x plus T est égal à f de x pour tout x. La plus petite période positive est appelée la période fondamentale. Le graphe d'une telle fonction se répète donc identiquement sur chaque intervalle de longueur T. Les fonctions sinus et cosinus sont des exemples classiques, avec une période de deux pi. La fonction tangente a une période de pi.",
    "note": "La périodicité est une propriété clé des fonctions trigonométriques."
  },
  {
    "titre": "Monotonie d'une Fonction",
    "contenu": "<div style='background: #f3e5f5; padding: 15px; border-radius: 10px; color: #4a148c;'>\n<h3 style='margin-top:0;'>Croissance et décroissance</h3>\n\n<p>Une fonction \\( f \\) est :</p>\n<ul style='list-style-type: disc; padding-left: 20px;'>\n  <li><strong>Croissante</strong> sur un intervalle \\( I \\) si pour tous \\( x_1 < x_2 \\), on a \\( f(x_1) \\leq f(x_2) \\).</li>\n  <li><strong>Strictement croissante</strong> si \\( f(x_1) < f(x_2) \\).</li>\n  <li><strong>Décroissante</strong> sur \\( I \\) si \\( f(x_1) \\geq f(x_2) \\).</li>\n  <li><strong>Strictement décroissante</strong> si \\( f(x_1) > f(x_2) \\).</li>\n  <li><strong>Monotone</strong> si elle est soit croissante, soit décroissante.</li>\n</ul>\n\n<div style='background: #ce93d8; padding: 10px; border-radius: 5px; color: white;'>\n  <p style='margin:0;'><strong>Exemple :</strong> La fonction \\( f(x) = x^2 \\) est décroissante sur \\( ]-\\infty, 0] \\) et croissante sur \\( [0, +\\infty[ \\).</p>\n</div>\n</div>",
    "texteParle": "La monotonie d'une fonction décrit son comportement sur un intervalle. Une fonction est croissante si, lorsque x augmente, f de x augmente également. Elle est strictement croissante si l'inégalité est stricte. À l'inverse, elle est décroissante si f de x diminue quand x augmente. Une fonction est dite monotone si elle est soit croissante, soit décroissante sur tout l'intervalle considéré. Par exemple, la fonction carré est décroissante sur l'intervalle moins l'infini zéro et croissante sur l'intervalle zéro plus l'infini.",
    "note": "La monotonie est fondamentale pour l'étude des variations d'une fonction."
  },
  {
    "titre": "Injectivité, Surjectivité, Bijectivité",
    "contenu": "<div style='background: #e8eaf6; padding: 15px; border-radius: 10px; color: #1a237e;'>\n<h3 style='margin-top:0;'>Définitions</h3>\n\n<ul style='list-style-type: disc; padding-left: 20px;'>\n  <li><strong>Injective :</strong> Tout élément de l'ensemble d'arrivée a <strong>au plus</strong> un antécédent.</li>\n  <div class='math-block' style='background: #c5cae9; padding: 5px; border-radius: 5px; margin: 5px 0;'>\n    <div class='math'>$$f(x_1) = f(x_2) \\Rightarrow x_1 = x_2$$</div>\n  </div>\n  \n  <li><strong>Surjective :</strong> Tout élément de l'ensemble d'arrivée a <strong>au moins</strong> un antécédent.</li>\n  <div class='math-block' style='background: #c5cae9; padding: 5px; border-radius: 5px; margin: 5px 0;'>\n    <div class='math'>$$\\forall y \\in \\mathbb{R}, \\exists x \\in D_f \\text{ tel que } f(x) = y$$</div>\n  </div>\n  \n  <li><strong>Bijective :</strong> Injective ET surjective → chaque élément de l'ensemble d'arrivée a <strong>un unique</strong> antécédent.</li>\n</ul>\n\n<div style='background: #3f51b5; color: white; padding: 10px; border-radius: 5px;'>\n  <p style='margin:0;'><strong>Exemple :</strong> La fonction \\( f(x) = 2x+1 \\) est bijective de \\(\\mathbb{R}\\) vers \\(\\mathbb{R}\\).</p>\n</div>\n</div>",
    "texteParle": "Nous arrivons maintenant aux notions d'injectivité, de surjectivité et de bijectivité. Une fonction est injective si deux éléments distincts du domaine ont des images distinctes. Autrement dit, tout élément de l'ensemble d'arrivée a au plus un antécédent. Une fonction est surjective si tout élément de l'ensemble d'arrivée a au moins un antécédent. Enfin, une fonction est bijective si elle est à la fois injective et surjective. Cela signifie que chaque élément de l'ensemble d'arrivée a un unique antécédent. Par exemple, la fonction affine deux x plus un est bijective de l'ensemble des réels vers lui-même.",
    "note": "La bijectivité est la condition nécessaire pour définir une fonction réciproque."
  },
  {
    "titre": "Fonction Réciproque",
    "contenu": "<div style='background: #fce4ec; padding: 15px; border-radius: 10px; color: #880e4f;'>\n<h3 style='margin-top:0;'>Définition</h3>\n<p>Si \\( f : I \\rightarrow J \\) est une fonction <strong>bijective</strong>, alors il existe une unique fonction \\( f^{-1} : J \\rightarrow I \\) telle que :</p>\n\n<div class='math-block' style='background: #f8bbd0; padding: 10px; border-radius: 8px;'>\n  <div class='math'>$$f^{-1}(y) = x \\iff y = f(x)$$</div>\n</div>\n\n<ul style='list-style-type: disc; padding-left: 20px;'>\n  <li><strong>Domaine de \\( f^{-1} \\)</strong> = Image de \\( f \\)</li>\n  <li><strong>Image de \\( f^{-1} \\)</strong> = Domaine de \\( f \\)</li>\n  <li>Les graphes de \\( f \\) et \\( f^{-1} \\) sont symétriques par rapport à la droite \\( y = x \\).</li>\n</ul>\n\n<div style='background: #c2185b; color: white; padding: 10px; border-radius: 5px;'>\n  <p style='margin:0;'><strong>Exemple :</strong> La réciproque de \\( f(x) = 2x+1 \\) est \\( f^{-1}(y) = \\dfrac{y-1}{2} \\).</p>\n</div>\n</div>",
    "texteParle": "Lorsqu'une fonction est bijective, on peut définir sa fonction réciproque, notée f puissance moins un. Cette fonction associe à chaque élément y de l'ensemble d'arrivée l'unique antécédent x. Le domaine de la fonction réciproque est l'image de la fonction originale, et son image est le domaine de la fonction originale. De plus, les graphes d'une fonction et de sa réciproque sont symétriques par rapport à la droite y égale x. Par exemple, la réciproque de deux x plus un est y moins un sur deux.",
    "note": "La fonction réciproque 'inverse' la relation entre x et y."
  },
  {
    "titre": "Résumé",
    "contenu": "<div style='background: #e0f2f1; padding: 15px; border-radius: 10px; color: #004d40;'>\n<h3 style='margin-top:0;'>Les notions clés de la leçon</h3>\n<ul style='list-style-type: disc; padding-left: 20px;'>\n  <li><strong>Domaine de définition :</strong> Ensemble des \\( x \\) où la fonction est définie.</li>\n  <li><strong>Image :</strong> Ensemble des valeurs \\( f(x) \\).</li>\n  <li><strong>Graphe :</strong> Courbe représentative de la fonction.</li>\n  <li><strong>Parité :</strong> Fonction paire (symétrie axiale) ou impaire (symétrie centrale).</li>\n  <li><strong>Périodicité :</strong> Fonction qui se répète à intervalle régulier.</li>\n  <li><strong>Monotonie :</strong> Fonction croissante ou décroissante.</li>\n  <li><strong>Injectivité, Surjectivité, Bijectivité :</strong> Propriétés liées aux antécédents.</li>\n  <li><strong>Fonction réciproque :</strong> Existe uniquement pour les fonctions bijectives.</li>\n</ul>\n\n<div style='background: #00695c; color: white; padding: 10px; border-radius: 5px; margin-top: 10px; text-align: center;'>\n  <p style='margin:0;'><strong>Ces concepts sont fondamentaux pour toute l'analyse mathématique et la Data Science.</strong></p>\n</div>\n</div>",
    "texteParle": "Pour résumer cette première leçon, nous avons vu les notions fondamentales sur les fonctions réelles d'une variable réelle. Nous avons appris à déterminer le domaine de définition, l'image et le graphe d'une fonction. Nous avons étudié la parité, la périodicité et la monotonie d'une fonction. Enfin, nous avons abordé les notions d'injectivité, de surjectivité, de bijectivité et de fonction réciproque. Ces concepts sont les briques élémentaires de l'analyse mathématique et seront utilisés tout au long de votre cursus en Data Science.",

];

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentIndex = 0;
    let isSpeaking = false;
    let isPaused = false;
    let currentUtterance = null;
    let isLoading = false;
    let loadingTimeout = null;
    let isTransitioning = false;
    let speechSupported = true;
    let userInteracted = false;
    let isPlaying = false;
    let loadingCancelled = false;

    const total = slides.length;
    const synth = window.speechSynthesis;

    // Références jQuery
    const $title = $('#slideTitle');
    const $body = $('#slideBody');
    const $counter = $('#slideCounter');
    const $statusText = $('#statusText');
    const $statusBadge = $('#statusBadge');
    const $loading = $('#loadingOverlay');
    const $loadingText = $('#loadingText');
    const $loadingSub = $('#loadingSub');
    const $loadingTimeout = $('#loadingTimeout');
    const $loadingProgressBar = $('#loadingProgressBar');
    const $autoIndicator = $('#autoIndicator');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $replay = $('#replayBtn');
    const $play = $('#playBtn');
    const $cancelLoading = $('#cancelLoadingBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function setStatus(text, type) {
        $statusText.text(text);
        $statusBadge.removeClass('idle speaking error paused waiting loading');
        if (type === 'speaking') $statusBadge.addClass('speaking');
        else if (type === 'error') $statusBadge.addClass('error');
        else if (type === 'paused') $statusBadge.addClass('paused');
        else if (type === 'waiting') $statusBadge.addClass('waiting');
        else if (type === 'loading') $statusBadge.addClass('loading');
        else $statusBadge.addClass('idle');
    }

    function updatePlayButton() {
        if (isPlaying) {
            $play.addClass('playing');
            $play.find('.btn-icon').text('⏸');
            $play.find('.btn-label').text('Pause');
        } else {
            $play.removeClass('playing');
            $play.find('.btn-icon').text('▶');
            $play.find('.btn-label').text('Play');
        }
    }

    function showLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        
        loadingCancelled = false;
        isLoading = true;
        
        // Réinitialiser la barre de progression
        $loadingProgressBar.css('animation', 'none');
        $loadingProgressBar.css('width', '0%');
        // Forcer un reflow
        $loadingProgressBar[0].offsetHeight;
        $loadingProgressBar.css('animation', 'loadingProgress 30s ease-out forwards');
        
        $loadingText.text('Préparation vocale...');
        $loadingSub.text('Synthèse en cours');
        $loadingTimeout.text('⏱️ 30 secondes maximum');
        $loading.fadeIn(300);
        setStatus("⏳ Chargement...", 'loading');
        
        // 🔥 TIMEOUT DE 30 SECONDES
        loadingTimeout = setTimeout(() => {
            if (isLoading && !loadingCancelled) {
                hideLoading();
                setStatus("⚠️ Délai dépassé (30s)", 'error');
                isPlaying = false;
                updatePlayButton();
                $loadingSub.text('La synthèse vocale a pris trop de temps');
                $loadingTimeout.text('❌ Délai dépassé');
            }
        }, 30000);
    }

    function hideLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        isLoading = false;
        loadingCancelled = false;
        $loading.fadeOut(300);
        // Ne pas changer le statut si on est en train de parler
        if (!isSpeaking && !isPlaying) {
            setStatus("⏸ Lecture arrêtée", 'paused');
        }
    }

    function cancelLoading() {
        loadingCancelled = true;
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        hideLoading();
        stopSpeaking();
        setStatus("⏸ Annulé", 'paused');
        isPlaying = false;
        updatePlayButton();
        $loadingText.text('Annulé par l\'utilisateur');
        $loadingSub.text('Vous pouvez réessayer');
        $loadingTimeout.text('✕ Annulation');
    }

    // Arrêter la parole proprement
    function stopSpeaking() {
        try {
            if (synth && (synth.speaking || synth.pending)) {
                synth.cancel();
            }
        } catch(e) {
            console.warn('Erreur stopSpeaking:', e);
        }
        if (currentUtterance) {
            try {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance.onstart = null;
            } catch(e) {}
            currentUtterance = null;
        }
        isSpeaking = false;
        isPlaying = false;
        updatePlayButton();
    }

    // Mettre en pause la parole
    function pauseSpeaking() {
        try {
            if (synth && synth.speaking) {
                synth.pause();
                isPaused = true;
                isPlaying = false;
                setStatus("⏸ Lecture en pause", 'paused');
                updatePlayButton();
            }
        } catch(e) {
            console.warn('Erreur pauseSpeaking:', e);
            stopSpeaking();
        }
    }

    // Reprendre la parole
    function resumeSpeaking() {
        try {
            if (synth && synth.paused) {
                synth.resume();
                isPaused = false;
                isPlaying = true;
                setStatus("🔊 Lecture en cours", 'speaking');
                updatePlayButton();
            } else if (!isSpeaking && !synth.speaking && !synth.pending) {
                speakSlide(currentIndex);
            }
        } catch(e) {
            console.warn('Erreur resumeSpeaking:', e);
            speakSlide(currentIndex);
        }
    }

    function renderSlide(index) {
        const slide = slides[index];
        $title.text(slide.titre);

        let html = '';
        html += `<div class="content-card">${slide.contenu}</div>`;
        if (slide.note) {
            html += `<div class="note-box">${slide.note}</div>`;
        }
        $body.html(html);
        $counter.text(`${index+1} / ${total}`);

        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
        }
    }

    // ================================================================
    // LECTURE VOCALE
    // ================================================================
    function speakSlide(index) {
        return new Promise((resolve) => {
            const slide = slides[index];
            const text = slide.texteParle;
            
            if (!text || text.trim() === '' || !speechSupported) {
                resolve();
                return;
            }

            if (!window.speechSynthesis) {
                setStatus("❌ Synthèse vocale non supportée", 'error');
                speechSupported = false;
                resolve();
                return;
            }

            // Arrêter toute lecture en cours
            stopSpeaking();
            
            // Réinitialiser l'état de pause
            isPaused = false;
            
            showLoading();
            setStatus("Initialisation...", 'loading');

            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.92;
                utterance.pitch = 1.05;
                utterance.volume = 1;

                let isFinished = false;
                let errorHandled = false;

                utterance.onstart = function() {
                    if (loadingCancelled) {
                        stopSpeaking();
                        resolve();
                        return;
                    }
                    hideLoading();
                    isSpeaking = true;
                    isPlaying = true;
                    isPaused = false;
                    setStatus("🔊 Lecture en cours", 'speaking');
                    updatePlayButton();
                };

                utterance.onend = function() {
                    if (isFinished) return;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    setStatus("✅ Terminé", 'idle');
                    hideLoading();
                    updatePlayButton();
                    resolve();
                };

                utterance.onerror = function(e) {
                    if (isFinished || errorHandled) return;
                    errorHandled = true;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    hideLoading();
                    updatePlayButton();
                    
                    if (e.error === 'not-allowed') {
                        setStatus("⚠️ Permission refusée", 'error');
                    } else if (e.error === 'synthesis-unavailable') {
                        setStatus("⚠️ Synthèse indisponible", 'error');
                    } else if (e.error === 'canceled') {
                        setStatus("⏸ Annulé", 'paused');
                    } else {
                        setStatus("❌ Erreur audio: " + (e.error || 'inconnue'), 'error');
                    }
                    
                    resolve();
                };

                // Gestion du chargement des voix
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = function() {
                        if (!loadingCancelled) {
                            try {
                                synth.speak(utterance);
                            } catch(err) {
                                // Silencieux
                            }
                        }
                        synth.onvoiceschanged = null;
                    };
                }

                currentUtterance = utterance;
                
                if (!loadingCancelled) {
                    try {
                        synth.speak(utterance);
                    } catch(err) {
                        setTimeout(() => {
                            if (!loadingCancelled) {
                                try {
                                    synth.speak(utterance);
                                } catch(e) {
                                    setStatus("❌ Erreur de lecture", 'error');
                                    isPlaying = false;
                                    updatePlayButton();
                                    hideLoading();
                                    resolve();
                                }
                            } else {
                                resolve();
                            }
                        }, 100);
                    }
                } else {
                    resolve();
                }

            } catch(err) {
                hideLoading();
                setStatus("❌ Erreur générale", 'error');
                isPlaying = false;
                updatePlayButton();
                console.error('Erreur speakSlide:', err);
                resolve();
            }
        });
    }

    // ================================================================
    // NAVIGATION
    // ================================================================
    async function goToSlide(index) {
        if (isTransitioning) return;
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        
        // Si on est en train de lire, on met en pause avant de naviguer
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        // Arrêter complètement la lecture
        stopSpeaking();
        
        await new Promise(r => setTimeout(r, 50));
        
        if (index === currentIndex) {
            setStatus("📄 Slide actuel", 'idle');
            return;
        }

        isTransitioning = true;
        currentIndex = index;
        renderSlide(index);
        
        // Réinitialiser l'état de lecture
        isPlaying = false;
        updatePlayButton();
        setStatus("⏸ Lecture arrêtée", 'paused');

        await new Promise(r => setTimeout(r, 150));
        isTransitioning = false;
    }

    async function goToNext() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex + 1 < total) {
            await goToSlide(currentIndex + 1);
        } else {
            setStatus("🏁 Dernier slide", 'idle');
        }
    }

    async function goToPrev() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex - 1 >= 0) {
            await goToSlide(currentIndex - 1);
        } else {
            setStatus("🔁 Premier slide", 'idle');
        }
    }

    // ================================================================
    // GESTION PLAY/PAUSE
    // ================================================================
    function togglePlay() {
        if (!userInteracted) {
            userInteracted = true;
        }

        // Si le chargement est en cours, on l'annule
        if (isLoading) {
            cancelLoading();
            return;
        }

        // Si le synthétiseur est en pause, on reprend
        if (synth && synth.paused) {
            resumeSpeaking();
            return;
        }

        // Si la lecture est en cours, on met en pause
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
            return;
        }

        // Sinon, on démarre la lecture du slide courant
        if (!isSpeaking && !isPlaying) {
            stopSpeaking();
            speakSlide(currentIndex);
        }
    }

    // ================================================================
    // INIT
    // ================================================================
    async function init() {
        // Vérifier la compatibilité
        if (!window.speechSynthesis) {
            setStatus("❌ Synthèse vocale non supportée", 'error');
            speechSupported = false;
        }

        // Précharger les voix
        try {
            if (synth.getVoices) {
                synth.getVoices();
                setTimeout(() => {
                    try {
                        synth.getVoices();
                    } catch(e) {}
                }, 200);
            }
        } catch(e) {
            console.warn('Erreur chargement voix:', e);
        }

        // Afficher le premier slide
        renderSlide(0);
        $counter.text(`1 / ${total}`);
        
        // État initial
        setStatus("⏸ Appuie sur Play", 'paused');
        updatePlayButton();
        $autoIndicator.text('⏸ Lecture manuelle');

        // ================================================================
        // ÉVÉNEMENTS
        // ================================================================
        
        // Bouton Play/Pause
        $play.on('click', function() {
            togglePlay();
        });

        // Bouton Annuler le chargement
        $cancelLoading.on('click', function() {
            cancelLoading();
        });

        // Navigation
        $prev.on('click', function() {
            // Si chargement en cours, on annule
            if (isLoading) cancelLoading();
            goToPrev();
        });

        $next.on('click', function() {
            if (isLoading) cancelLoading();
            goToNext();
        });

        // Replay - relire le slide courant
        $replay.on('click', function() {
            if (isLoading) cancelLoading();
            stopSpeaking();
            setTimeout(() => {
                speakSlide(currentIndex);
            }, 100);
        });

        // Support du clavier (espace pour play/pause)
        $(document).on('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });

        // Nettoyage
        $(window).on('beforeunload', function() {
            try {
                if (synth.speaking) synth.cancel();
            } catch(e) {}
            hideLoading();
        });

        // Gérer les cas où la synthèse se termine de manière inattendue
        setInterval(() => {
            if (isPlaying && !synth.speaking && !synth.pending && !isPaused && !isLoading) {
                isPlaying = false;
                updatePlayButton();
                setStatus("⏸ Lecture arrêtée", 'paused');
            }
        }, 1000);
    }

    init();
});



    // ================================================================
    // GESTION DU THÈME JOUR/NUIT
    // ================================================================
    let isDarkMode = false;

    function toggleTheme() {
        isDarkMode = !isDarkMode;
        const body = document.body;
        const appContainer = document.querySelector('.app-container');
        const header = document.querySelector('.slide-header');
        const footer = document.querySelector('.slide-footer');
        const contentCards = document.querySelectorAll('.content-card');
        const noteBoxes = document.querySelectorAll('.note-box');
        const mathBlocks = document.querySelectorAll('.math-block');
        const buttons = document.querySelectorAll('.btn');
        const statusBadge = document.querySelector('.status-badge');
        const slideCounter = document.querySelector('.slide-counter');
        const autoIndicator = document.querySelector('.auto-indicator');
        const themeBtn = document.getElementById('themeToggle');

        if (isDarkMode) {
            // Mode nuit
            body.style.background = '#0b1120';
            body.style.color = '#f1f5f9';
            appContainer.style.background = 'linear-gradient(145deg, #0f172a 0%, #1e293b 100%)';
            header.style.background = 'rgba(15, 23, 42, 0.85)';
            footer.style.background = 'rgba(15, 23, 42, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.05)';
                card.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.08)';
                note.style.color = '#cbd5e1';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.25)';
                block.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#e2e8f0';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.12)';
                statusBadge.style.color = '#93bbfc';
            }
            if (slideCounter) {
                slideCounter.style.color = '#94a3b8';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#64748b';
            }
            if (themeBtn) {
                themeBtn.textContent = '☀️';
                themeBtn.title = 'Passer en mode jour';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#e2e8f0';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#e2e8f0';
                }
            });
        } else {
            // Mode jour (par défaut)
            body.style.background = '#f0f4f8';
            body.style.color = '#1a202c';
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
            header.style.background = 'rgba(255, 255, 255, 0.85)';
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.8)';
                card.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.12)';
                note.style.color = '#2c3e50';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.05)';
                block.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#2d3748';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
                statusBadge.style.color = '#2b6cb0';
            }
            if (slideCounter) {
                slideCounter.style.color = '#4a5568';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#718096';
            }
            if (themeBtn) {
                themeBtn.textContent = '🌓';
                themeBtn.title = 'Passer en mode nuit';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#2c3e50';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#2d3748';
                }
            });
        }
    }

    // Initialiser en mode jour
    document.addEventListener('DOMContentLoaded', function() {
        // Appliquer le mode jour par défaut
        const body = document.body;

        }
        
        const autoIndicator = document.querySelector('.auto-indicator');
        if (autoIndicator) {
            autoIndicator.style.color = '#718096';
        }
        
        document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
            if (!el.closest('.note-box')) {
                el.style.color = '#2c3e50';
            }
        });
        
        document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
            if (!el.closest('.note-box') && !el.closest('.math-block')) {
                el.style.color = '#2d3748';
            }
        });
        
        const themeBtn = document.getElementById('themeToggle');
        if (themeBtn) {
            themeBtn.textContent = '🌓';
            themeBtn.title = 'Passer en mode nuit';
        }
    });
</script>
