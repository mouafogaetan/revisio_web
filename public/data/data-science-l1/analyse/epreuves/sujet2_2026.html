<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Analyse - L1",
  "classe": "Licence 1 Data Science",
  "sequence": "Séquence 2",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Étude complète d'une fonction (Application des chapitres 1 et 3)",
      "points": "6 pts",
      "enonce": "<p style='color: #333; font-size: 1.05em;'>Soit la fonction <strong>f</strong> définie par :</p><div class='math-block' style='background-color: #f0f4f8; padding: 12px; border-radius: 8px; text-align: center; margin: 10px 0;'><div class='math' style='font-size: 1.2em;'>$$ f(x) = \\frac{x^2 - 3x + 1}{x - 2} $$</div></div>",
      "questions": [
        {
          "question": "<p><strong>1. a)</strong> Déterminer le domaine de définition de <strong>f</strong>. (Bloom : Comprendre - 0.75 pt)</p>",
          "reponse": "<p>La fonction n'est pas définie lorsque le dénominateur s'annule : \\( x - 2 = 0 \\Rightarrow x = 2 \\).</p><p>Donc \\( D_f = \\mathbb{R} \\setminus \\{2\\} = ]-\\infty, 2[ \\cup ]2, +\\infty[ \\).</p>"
        },
        {
          "question": "<p><strong>1. b)</strong> Calculer les limites de f aux bornes de son domaine de définition. En déduire les asymptotes éventuelles. (Bloom : Analyser - 1.5 pts)</p>",
          "reponse": "<p><strong>Limites aux bornes de l'intervalle :</strong></p><ul><li>En \\( -\\infty \\) et \\( +\\infty \\) : \\( \\lim_{x \\to \\pm \\infty} \\frac{x^2 - 3x + 1}{x - 2} = \\lim_{x \\to \\pm \\infty} \\frac{x^2}{x} = \\pm \\infty \\). Il n'y a pas d'asymptote horizontale.</li><li>En 2 : \\( \\lim_{x \\to 2^-} f(x) = -\\infty \\) et \\( \\lim_{x \\to 2^+} f(x) = +\\infty \\).</li></ul><p><strong>Asymptotes :</strong></p><ul><li>Asymptote verticale : \\( x = 2 \\).</li><li>Asymptote oblique : On effectue la division euclidienne : \\( f(x) = x - 1 + \\frac{-1}{x-2} \\). Donc la droite \\( y = x - 1 \\) est une asymptote oblique.</li></ul>"
        },
        {
          "question": "<p><strong>1. c)</strong> Calculer la dérivée \\( f'(x) \\) et étudier son signe. En déduire le tableau de variations de <strong>f</strong>. (Bloom : Appliquer - 2 pts)</p>",
          "reponse": "<p>La dérivée de \\( f \\) est :</p><div class='math-block' style='background-color: #f0f4f8; padding: 10px; border-radius: 8px; text-align: center; margin: 10px 0;'><div class='math' style='font-size: 1.1em;'>$$ f'(x) = \\frac{(2x - 3)(x - 2) - (x^2 - 3x + 1)}{(x - 2)^2} = \\frac{x^2 - 4x + 5}{(x - 2)^2} $$</div></div><p>Le numérateur \\( x^2 - 4x + 5 \\) a pour discriminant \\( \\Delta = 16 - 20 = -4 < 0 \\). Il est donc toujours positif.</p><p>Comme \\( (x-2)^2 > 0 \\) sur \\( D_f \\), on a \\( f'(x) > 0 \\) pour tout \\( x \\neq 2 \\).</p><p><strong>Tableau de variations :</strong></p><div style='background-color: #f8f9fa; padding: 8px; border-radius: 5px; text-align: center; max-width: 100%; overflow-x: auto;'><p>f est strictement croissante sur \\( ]-\\infty, 2[ \\) et sur \\( ]2, +\\infty[ \\).</p></div>"
        },
        {
          "question": "<p><strong>1. d)</strong> Étudier la convexité de f (calcul de la dérivée seconde) et déterminer l'éventuel point d'inflexion. (Bloom : Analyser - 0.75 pt)</p>",
          "reponse": "<p>On calcule la dérivée seconde :</p><div class='math-block' style='background-color: #f0f4f8; padding: 10px; border-radius: 8px; text-align: center; margin: 10px 0;'><div class='math' style='font-size: 1.1em;'>$$ f''(x) = \\frac{2}{(x-2)^3} $$</div></div><p>Le signe de \\( f''(x) \\) dépend de \\( x-2 \\) :</p><ul><li>Sur \\( ]-\\infty, 2[ \\), \\( f''(x) < 0 \\) : f est concave.</li><li>Sur \\( ]2, +\\infty[ \\), \\( f''(x) > 0 \\) : f est convexe.</li></ul><p>Il n'y a pas de point d'inflexion car la fonction n'est pas définie en 2.</p>"
        },
        {
          "question": "<p><strong>1. e)</strong> Tracer l'allure de la courbe représentative de f en faisant apparaître les asymptotes et les éléments remarquables. (Bloom : Créer - 1 pt)</p>",
          "reponse": "<p>La courbe est une hyperbole dont les asymptotes sont \\( x = 2 \\) et \\( y = x - 1 \\).</p><p>La courbe est strictement croissante sur chaque intervalle. Elle est concave sur \\( ]-\\infty, 2[ \\) et convexe sur \\( ]2, +\\infty[ \\).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Application du Théorème des Valeurs Intermédiaires (Chapitre 2)",
      "points": "2 pts",
      "enonce": "<p style='color: #333; font-size: 1.05em;'>On considère l'équation suivante :</p><div class='math-block' style='background-color: #f0f4f8; padding: 12px; border-radius: 8px; text-align: center; margin: 10px 0;'><div class='math' style='font-size: 1.2em;'>$$ x^3 - 4x + 1 = 0 $$</div></div>",
      "questions": [
        {
          "question": "<p><strong>2. a)</strong> Montrer que l'équation admet une solution dans l'intervalle \\( [0, 1] \\). (Bloom : Analyser - 1 pt)</p>",
          "reponse": "<p>Soit \\( h(x) = x^3 - 4x + 1 \\). La fonction \\( h \\) est continue sur \\( \\mathbb{R} \\) (fonction polynomiale).</p><p>On a : \\( h(0) = 1 > 0 \\) et \\( h(1) = 1 - 4 + 1 = -2 < 0 \\).</p><p>Comme \\( h(0) \\) et \\( h(1) \\) sont de signes contraires, d'après le théorème des valeurs intermédiaires, il existe un réel \\( c \\in ]0, 1[ \\) tel que \\( h(c) = 0 \\).</p>"
        },
        {
          "question": "<p><strong>2. b)</strong> Cette solution est-elle unique dans \\( [0, 1] \\) ? Justifier. (Bloom : Évaluer - 1 pt)</p>",
          "reponse": "<p>La dérivée de \\( h \\) est \\( h'(x) = 3x^2 - 4 \\).</p><p>Sur \\( [0, 1] \\), \\( 3x^2 - 4 \\le 3 - 4 = -1 < 0 \\). Donc \\( h \\) est strictement décroissante sur \\( [0, 1] \\).</p><p>Une fonction strictement monotone ne peut s'annuler qu'une seule fois. La solution est donc unique dans \\( [0, 1] \\).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Dérivation et Optimisation (Chapitre 3)",
      "points": "2 pts",
      "enonce": "<p style='color: #333; font-size: 1.05em;'>Un industriel souhaite fabriquer des boîtes de conserve cylindriques (sans couvercle) d'un volume fixe de \\( 1 \\, \\text{L} = 1000 \\, \\text{cm}^3 \\).</p><p>On note \\( r \\) le rayon de la base (en cm) et \\( h \\) la hauteur (en cm).</p>",
      "questions": [
        {
          "question": "<p><strong>3. a)</strong> Exprimer \\( h \\) en fonction de \\( r \\) en utilisant la formule du volume d'un cylindre \\( V = \\pi r^2 h \\). (Bloom : Appliquer - 0.5 pt)</p>",
          "reponse": "<p>Le volume est \\( V = \\pi r^2 h = 1000 \\).</p><p>On en déduit : \\( h = \\frac{1000}{\\pi r^2} \\).</p>"
        },
        {
          "question": "<p><strong>3. b)</strong> Montrer que la surface de métal nécessaire (l'aire latérale + l'aire de la base) est donnée par :</p><div class='math-block' style='background-color: #f0f4f8; padding: 8px; border-radius: 8px; text-align: center; margin: 10px 0;'><div class='math' style='font-size: 1.1em;'>$$ S(r) = \\pi r^2 + \\frac{2000}{r} $$</div></div><p>(Bloom : Comprendre - 0.5 pt)</p>",
          "reponse": "<p>La surface est la somme de l'aire de la base \\( (\\pi r^2) \\) et de l'aire latérale \\( (2\\pi r h) \\).</p><p>En remplaçant \\( h \\) par son expression :</p><p>\\( S(r) = \\pi r^2 + 2\\pi r \\times \\frac{1000}{\\pi r^2} = \\pi r^2 + \\frac{2000}{r} \\).</p>"
        },
        {
          "question": "<p><strong>3. c)</strong> Déterminer les variations de \\( S \\) sur \\( ]0, +\\infty[ \\). En déduire le rayon \\( r \\) qui minimise la surface de métal. (Bloom : Appliquer - 1 pt)</p>",
          "reponse": "<p>On calcule la dérivée : \\( S'(r) = 2\\pi r - \\frac{2000}{r^2} = \\frac{2\\pi r^3 - 2000}{r^2} \\).</p><p>Le signe de \\( S'(r) \\) est celui de \\( 2\\pi r^3 - 2000 \\).</p><p>\\( S'(r) = 0 \\Rightarrow r^3 = \\frac{1000}{\\pi} \\Rightarrow r = \\sqrt[3]{\\frac{1000}{\\pi}} \\).</p><p>La dérivée est négative avant cette valeur et positive après. \\( S \\) admet donc un minimum en \\( r = \\sqrt[3]{\\frac{1000}{\\pi}} \\).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Calcul Intégral (Chapitre 4)",
      "points": "2 pts",
      "enonce": "<p style='color: #333; font-size: 1.05em;'>Calculer les intégrales suivantes :</p>",
      "questions": [
        {
          "question": "<p><strong>4. a)</strong> \\( I = \\displaystyle\\int_0^1 (3x^2 - 2x + 1) \\, dx \\). (Bloom : Appliquer - 1 pt)</p>",
          "reponse": "<p>Une primitive de \\( 3x^2 - 2x + 1 \\) est \\( x^3 - x^2 + x \\).</p><p>Donc \\( I = [x^3 - x^2 + x]_0^1 = (1 - 1 + 1) - 0 = 1 \\).</p>"
        },
        {
          "question": "<p><strong>4. b)</strong> \\( J = \\displaystyle\\int_0^{\\pi} \\sin(x) \\, dx \\). (Bloom : Appliquer - 1 pt)</p>",
          "reponse": "<p>Une primitive de \\( \\sin(x) \\) est \\( -\\cos(x) \\).</p><p>Donc \\( J = [-\\cos(x)]_0^{\\pi} = (-\\cos(\\pi)) - (-\\cos(0)) = 1 - (-1) = 2 \\).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 5 : Suites (Chapitre 5)",
      "points": "2 pts",
      "enonce": "<p style='color: #333; font-size: 1.05em;'>On considère la suite \\( (u_n) \\) définie par : \\( u_0 = 1 \\) et pour tout \\( n \\in \\mathbb{N} \\), \\( u_{n+1} = \\frac{u_n}{2} + 1 \\).</p>",
      "questions": [
        {
          "question": "<p><strong>5. a)</strong> Calculer \\( u_1, u_2 \\) et \\( u_3 \\). (Bloom : Appliquer - 0.5 pt)</p>",
          "reponse": "<p>\\( u_1 = \\frac{1}{2} + 1 = \\frac{3}{2} = 1.5 \\)</p><p>\\( u_2 = \\frac{1.5}{2} + 1 = 0.75 + 1 = 1.75 = \\frac{7}{4} \\)</p><p>\\( u_3 = \\frac{1.75}{2} + 1 = 0.875 + 1 = 1.875 = \\frac{15}{8} \\)</p>"
        },
        {
          "question": "<p><strong>5. b)</strong> Montrer par récurrence que pour tout \\( n \\in \\mathbb{N} \\), on a \\( u_n \\le 2 \\). La suite est-elle croissante ? (Bloom : Analyser - 1 pt)</p>",
          "reponse": "<p><strong>Démonstration par récurrence :</strong></p><ul><li>Initialisation : \\( u_0 = 1 \\le 2 \\), vrai.</li><li>Hérédité : Supposons \\( u_n \\le 2 \\). Alors \\( u_{n+1} = \\frac{u_n}{2} + 1 \\le \\frac{2}{2} + 1 = 2 \\). Donc la propriété est vraie.</li></ul><p>On a \\( u_{n+1} - u_n = \\frac{u_n}{2} + 1 - u_n = 1 - \\frac{u_n}{2} \\).</p><p>Comme \\( u_n \\le 2 \\), on a \\( 1 - \\frac{u_n}{2} \\ge 0 \\). Donc la suite est croissante.</p>"
        },
        {
          "question": "<p><strong>5. c)</strong> En déduire que \\( (u_n) \\) converge et déterminer sa limite. (Bloom : Évaluer - 0.5 pt)</p>",
          "reponse": "<p>La suite est croissante et majorée par 2, donc elle converge d'après le théorème de la limite monotone.</p><p>Soit \\( l \\) sa limite. Comme la suite est définie par \\( u_{n+1} = \\frac{u_n}{2} + 1 \\), en passant à la limite, on a :</p><p>\\( l = \\frac{l}{2} + 1 \\Rightarrow l - \\frac{l}{2} = 1 \\Rightarrow \\frac{l}{2} = 1 \\Rightarrow l = 2 \\).</p><p>La limite de \\( (u_n) \\) est 2.</p>"

      ]
    },
    {
      "titre": "Exercice 6 : Séries (Chapitre 6)",
      "points": "3 pts",
      "enonce": "<p style='color: #333; font-size: 1.05em;'>Étudier la nature (convergente ou divergente) des séries suivantes :</p>",
      "questions": [
        {
          "question": "<p><strong>6. a)</strong> \\( \\displaystyle\\sum_{n=1}^{+\\infty} \\frac{1}{n^2} \\). (Bloom : Analyser - 0.75 pt)</p>",
          "reponse": "<p>La série \\( \\sum \\frac{1}{n^2} \\) est une série de Riemann avec \\( \\alpha = 2 > 1 \\). Elle est donc <strong>convergente</strong>.</p>"
        },
        {
          "question": "<p><strong>6. b)</strong> \\( \\displaystyle\\sum_{n=1}^{+\\infty} \\frac{n}{2^n} \\). (Bloom : Analyser - 0.75 pt)</p>",
          "reponse": "<p>Utilisons la règle de d'Alembert. On pose \\( u_n = \\frac{n}{2^n} \\).</p><p>\\( \\frac{u_{n+1}}{u_n} = \\frac{(n+1)/2^{n+1}}{n/2^n} = \\frac{1}{2} \\frac{n+1}{n} \\to \\frac{1}{2} < 1 \\).</p><p>La série est donc <strong>convergente</strong> (absolument convergente).</p>"
        },
        {
          "question": "<p><strong>6. c)</strong> \\( \\displaystyle\\sum_{n=1}^{+\\infty} \\frac{(-1)^{n+1}}{\\sqrt{n}} \\). (Bloom : Analyser - 1.5 pts)</p>",
          "reponse": "<p>La série est alternée. On pose \\( a_n = \\frac{1}{\\sqrt{n}} \\).</p><ul><li>\\( a_n \\to 0 \\) lorsque \\( n \\to +\\infty \\).</li><li>\\( a_n \\) est décroissante.</li></ul><p>D'après le critère de Leibniz, la série <strong>converge</strong>.</p><p>La série des valeurs absolues est \\( \\sum \\frac{1}{\\sqrt{n}} = \\sum n^{-1/2} \\), une série de Riemann avec \\( \\alpha = 1/2 \\le 1 \\). Elle est divergente.</p><p>La série est donc <strong>semi-convergente</strong> (conditionnellement convergente).</p>"

};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
