<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Analyse - L1",
  "classe": "Licence 1 Data Science",
  "sequence": "Séquence 3",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Théorème des valeurs intermédiaires et équations",
      "points": "4 pts",
      "enonce": "<p>On considère la fonction <span class='math'>f(x) = x^3 - 3x + 1</span> définie sur <span class='math'>\\mathbb{R}</span>.</p>",
      "questions": [
        {
          "question": "<p><strong>1.a</strong> Énoncer le théorème des valeurs intermédiaires.</p>",
          "reponse": "<p>Soit <span class='math'>f</span> une fonction continue sur un intervalle <span class='math'>I</span> et <span class='math'>a, b \\in I</span>. Pour tout réel <span class='math'>k</span> compris entre <span class='math'>f(a)</span> et <span class='math'>f(b)</span>, il existe <span class='math'>c \\in [a, b]</span> tel que <span class='math'>f(c) = k</span>.</p>"
        },
        {
          "question": "<p><strong>1.b</strong> Montrer que l'équation <span class='math'>f(x) = 0</span> admet au moins une solution dans <span class='math'>[0, 1]</span>.</p>",
          "reponse": "<p><span class='math'>f(0) = 1 > 0</span> et <span class='math'>f(1) = 1 - 3 + 1 = -1 < 0</span>. Comme <span class='math'>f</span> est continue sur <span class='math'>[0, 1]</span> (fonction polynomiale), par le TVI, il existe <span class='math'>c \\in [0, 1]</span> tel que <span class='math'>f(c) = 0</span>.</p>"
        },
        {
          "question": "<p><strong>1.c</strong> L'équation admet-elle une unique solution dans <span class='math'>[0, 1]</span> ? Justifier.</p>",
          "reponse": "<p><span class='math'>f'(x) = 3x^2 - 3 = 3(x-1)(x+1)</span>. Sur <span class='math'>[0, 1]</span>, <span class='math'>f'(x) \\leq 0</span>, donc <span class='math'>f</span> est strictement décroissante. La solution est donc unique.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Calcul de limites et croissances comparées",
      "points": "4 pts",
      "enonce": "<p>Calculer les limites suivantes en justifiant :</p>",
      "questions": [
        {
          "question": "<p><strong>2.a</strong> <span class='math'>\\lim_{x \\to +\\infty} \\frac{e^x}{x^2}</span></p>",
          "reponse": "<p>Par croissance comparée, l'exponentielle l'emporte sur toute puissance de <span class='math'>x</span>. Donc <span class='math'>\\lim_{x \\to +\\infty} \\frac{e^x}{x^2} = +\\infty</span>.</p>"
        },
        {
          "question": "<p><strong>2.b</strong> <span class='math'>\\lim_{x \\to 0^+} x \\ln(x)</span></p>",
          "reponse": "<p>On pose <span class='math'>t = \\ln(x)</span>. Quand <span class='math'>x \\to 0^+</span>, <span class='math'>t \\to -\\infty</span> et <span class='math'>x = e^t</span>. Donc <span class='math'>x \\ln(x) = t e^t</span>. Par croissance comparée, <span class='math'>\\lim_{t \\to -\\infty} t e^t = 0</span>.</p>"
        },
        {
          "question": "<p><strong>2.c</strong> <span class='math'>\\lim_{x \\to 0} \\frac{\\sin(x)}{x}</span></p>",
          "reponse": "<p>Limite fondamentale : <span class='math'>\\lim_{x \\to 0} \\frac{\\sin(x)}{x} = 1</span>.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Dérivées et approximations",
      "points": "4 pts",
      "enonce": "<p>Soit la fonction <span class='math'>f(x) = \\ln(1+x)</span> définie pour <span class='math'>x > -1</span>.</p>",
      "questions": [
        {
          "question": "<p><strong>3.a</strong> Rappeler le développement limité à l'ordre 3 de <span class='math'>\\ln(1+x)</span> au voisinage de 0.</p>",
          "reponse": "<p><span class='math'>\\ln(1+x) = x - \\frac{x^2}{2} + \\frac{x^3}{3} + o(x^3)</span>.</p>"
        },
        {
          "question": "<p><strong>3.b</strong> En déduire une valeur approchée de <span class='math'>\\ln(1,1)</span> avec les trois premiers termes.</p>",
          "reponse": "<p>Pour <span class='math'>x = 0,1</span> : <span class='math'>\\ln(1,1) \\approx 0,1 - \\frac{0,01}{2} + \\frac{0,001}{3} = 0,1 - 0,005 + 0,000333 = 0,095333</span>.</p>"
        },
        {
          "question": "<p><strong>3.c</strong> Donner l'équation de la tangente à la courbe de <span class='math'>f</span> au point d'abscisse 0.</p>",
          "reponse": "<p><span class='math'>f'(x) = \\frac{1}{1+x}</span>, donc <span class='math'>f'(0) = 1</span>. L'équation de la tangente est : <span class='math'>y = f'(0)(x-0) + f(0) = x</span>.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Étude de fonction et optimisation",
      "points": "4 pts",
      "enonce": "<p>Soit la fonction <span class='math'>f(x) = x^3 - 3x^2 - 9x + 5</span> définie sur <span class='math'>\\mathbb{R}</span>.</p>",
      "questions": [
        {
          "question": "<p><strong>4.a</strong> Déterminer le sens de variation de <span class='math'>f</span>.</p>",
          "reponse": "<p><span class='math'>f'(x) = 3x^2 - 6x - 9 = 3(x-3)(x+1)</span>. <span class='math'>f</span> est croissante sur <span class='math'>]-\\infty, -1]</span> et <span class='math'>[3, +\\infty[</span>, décroissante sur <span class='math'>[-1, 3]</span>.</p>"
        },
        {
          "question": "<p><strong>4.b</strong> Déterminer les extremums locaux de <span class='math'>f</span>.</p>",
          "reponse": "<p><span class='math'>f(-1) = 10</span> (maximum local), <span class='math'>f(3) = -22</span> (minimum local).</p>"
        },
        {
          "question": "<p><strong>4.c</strong> On cherche à minimiser <span class='math'>f</span> sur l'intervalle <span class='math'>[0, 4]</span>. Quel est le minimum ?</p>",
          "reponse": "<p>Sur <span class='math'>[0, 4]</span>, <span class='math'>f</span> est décroissante sur <span class='math'>[0, 3]</span> puis croissante sur <span class='math'>[3, 4]</span>. Le minimum est atteint en <span class='math'>x = 3</span> avec <span class='math'>f(3) = -22</span>.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 5 : Analyse de fonction - Problème de seuil",
      "points": "4 pts",
      "enonce": "<p>Une entreprise produit <span class='math'>x</span> unités d'un produit. Le coût total est <span class='math'>C(x) = x^3 - 12x^2 + 60x + 100</span> pour <span class='math'>x \\in [0, 10]</span>. Le coût marginal est la dérivée <span class='math'>C'(x)</span>.</p>",
      "questions": [
        {
          "question": "<p><strong>5.a</strong> Calculer le coût marginal <span class='math'>C'(x)</span>.</p>",
          "reponse": "<p><span class='math'>C'(x) = 3x^2 - 24x + 60</span>.</p>"
        },
        {
          "question": "<p><strong>5.b</strong> Étudier le signe de <span class='math'>C'(x)</span> et en déduire les variations du coût total.</p>",
          "reponse": "<p><span class='math'>C'(x) = 3(x^2 - 8x + 20)</span>. Le discriminant est <span class='math'>64 - 80 = -16 < 0</span>, donc <span class='math'>C'(x) > 0</span> pour tout <span class='math'>x</span>. Le coût total est strictement croissant sur <span class='math'>[0, 10]</span>.</p>"
        },
        {
          "question": "<p><strong>5.c</strong> Pour quelle production le coût marginal est-il minimal ?</p>",
          "reponse": "<p><span class='math'>C''(x) = 6x - 24</span>. Le coût marginal est minimal quand <span class='math'>C''(x) = 0</span>, soit <span class='math'>x = 4</span>. Le coût marginal minimal est <span class='math'>C'(4) = 48 - 96 + 60 = 12</span>.</p>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
