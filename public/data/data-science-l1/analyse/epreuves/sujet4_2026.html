<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Analyse - L1",
  "classe": "Licence 1 Data Science",
  "sequence": "Évaluation Séquentielle n°4",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Primitives et Intégration par parties",
      "points": "4 pts",
      "enonce": "<div style='font-family: system-ui, -apple-system, sans-serif; line-height: 1.6;'><p>Cet exercice porte sur le calcul de primitives et l'utilisation de la méthode d'intégration par parties.</p></div>",
      "questions": [
        {
          "question": "<p><strong>1.1</strong> Déterminez les primitives de la fonction \(f(x) = 2x e^{x^2}\).</p>",
          "reponse": "<p>On pose \(u = x^2\), alors \(du = 2x dx\).</p><div class='math-block' style='background-color: #f8f9fa; padding: 10px; border-radius: 6px; margin: 10px 0; text-align: center;'><div class='math'>$$ \\int 2x e^{x^2} dx = \\int e^u du = e^u + C = e^{x^2} + C $$</div></div><p>Les primitives de \(f\) sont donc \(F(x) = e^{x^2} + C\), où \(C \\in \\mathbb{R}\).</p>"
        },
        {
          "question": "<p><strong>1.2</strong> Calculez \(I = \\int x \\ln x \\, dx\) à l'aide d'une intégration par parties.</p>",
          "reponse": "<p>On pose :</p><ul><li>\(u(x) = \\ln x \\Rightarrow u'(x) = \\frac{1}{x}\)</li><li>\(v'(x) = x \\Rightarrow v(x) = \\frac{x^2}{2}\)</li></ul><p>La formule d'intégration par parties donne :</p><div class='math-block' style='background-color: #f8f9fa; padding: 10px; border-radius: 6px; margin: 10px 0; text-align: center;'><div class='math'>$$ I = \\frac{x^2}{2} \\ln x - \\int \\frac{x^2}{2} \\cdot \\frac{1}{x} dx = \\frac{x^2}{2} \\ln x - \\frac{1}{2} \\int x dx $$</div></div><div class='math-block' style='background-color: #e8f4f8; padding: 10px; border-radius: 6px; margin: 10px 0; text-align: center;'><div class='math'>$$ I = \\frac{x^2}{2} \\ln x - \\frac{x^2}{4} + C $$</div></div>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Changement de variable et fractions rationnelles",
      "points": "4 pts",
      "enonce": "<div style='font-family: system-ui, -apple-system, sans-serif; line-height: 1.6;'><p>Cet exercice porte sur les méthodes de changement de variable et de décomposition en éléments simples.</p></div>",
      "questions": [
        {
          "question": "<p><strong>2.1</strong> Calculez \(J = \\int \\frac{\\cos x}{\\sin^2 x} dx\) en utilisant un changement de variable.</p>",
          "reponse": "<p>On pose \(u = \\sin x\), alors \(du = \\cos x dx\).</p><div class='math-block' style='background-color: #f8f9fa; padding: 10px; border-radius: 6px; margin: 10px 0; text-align: center;'><div class='math'>$$ J = \\int \\frac{du}{u^2} = \\int u^{-2} du = -\\frac{1}{u} + C = -\\frac{1}{\\sin x} + C $$</div></div>"
        },
        {
          "question": "<p><strong>2.2</strong> Calculez \(K = \\int \\frac{1}{x^2 - 1} dx\) en utilisant la décomposition en éléments simples.</p>",
          "reponse": "<p>On décompose : \(\\frac{1}{x^2 - 1} = \\frac{1}{(x-1)(x+1)} = \\frac{A}{x-1} + \\frac{B}{x+1}\).</p><p>On trouve \(A = \\frac{1}{2}\) et \(B = -\\frac{1}{2}\).</p><div class='math-block' style='background-color: #e8f4f8; padding: 10px; border-radius: 6px; margin: 10px 0; text-align: center;'><div class='math'>$$ K = \\frac{1}{2} \\ln|x-1| - \\frac{1}{2} \\ln|x+1| + C = \\frac{1}{2} \\ln\\left|\\frac{x-1}{x+1}\\right| + C $$</div></div>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Suites arithmético-géométriques",
      "points": "4 pts",
      "enonce": "<div style='font-family: system-ui, -apple-system, sans-serif; line-height: 1.6;'><p>Un Data Scientist étudie l'évolution du nombre d'utilisateurs d'une application. La suite \((u_n)\) définie par \(u_0 = 1000\) et \(u_{n+1} = 0.8 u_n + 200\) modélise le nombre d'utilisateurs après \(n\) mois.</p></div>",
      "questions": [
        {
          "question": "<p><strong>3.1</strong> Déterminez le point fixe de la suite.</p>",
          "reponse": "<p>On résout \(L = 0.8L + 200 \\Rightarrow 0.2L = 200 \\Rightarrow L = 1000\).</p><p>Le point fixe est \(L = 1000\).</p>"
        },
        {
          "question": "<p><strong>3.2</strong> Exprimez \(u_n\) en fonction de \(n\).</p>",
          "reponse": "<p>On pose \(v_n = u_n - 1000\). Alors :</p><div class='math-block' style='background-color: #f8f9fa; padding: 10px; border-radius: 6px; margin: 10px 0; text-align: center;'><div class='math'>$$ v_{n+1} = u_{n+1} - 1000 = 0.8u_n + 200 - 1000 = 0.8(u_n - 1000) = 0.8 v_n $$</div></div><p>Donc \(v_n = v_0 \\times 0.8^n = (1000 - 1000) \\times 0.8^n = 0\).</p><p>Ainsi, \(u_n = 1000\) pour tout \(n\). La suite est constante.</p>"
        },
        {
          "question": "<p><strong>3.3</strong> Interprétez ce résultat.</p>",
          "reponse": "<p>Le nombre d'utilisateurs reste constant à 1000. Le modèle prédit une stabilisation de la base d'utilisateurs, ni croissance ni décroissance.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Applications du calcul intégral",
      "points": "4 pts",
      "enonce": "<div style='font-family: system-ui, -apple-system, sans-serif; line-height: 1.6;'><p>Un champ de données est délimité par la courbe \(y = x^2 - 2x + 3\) et l'axe des abscisses entre \(x = 0\) et \(x = 2\).</p></div>",
      "questions": [
        {
          "question": "<p><strong>4.1</strong> Vérifiez que la fonction est positive sur \([0, 2]\).</p>",
          "reponse": "<p>\(f(x) = x^2 - 2x + 3 = (x-1)^2 + 2 \\geq 2 > 0\) sur \([0, 2]\).</p><p>La fonction est donc positive sur tout l'intervalle.</p>"
        },
        {
          "question": "<p><strong>4.2</strong> Calculez l'aire du domaine sous la courbe.</p>",
          "reponse": "<p>L'aire est donnée par :</p><div class='math-block' style='background-color: #f8f9fa; padding: 10px; border-radius: 6px; margin: 10px 0; text-align: center;'><div class='math'>$$ A = \\int_0^2 (x^2 - 2x + 3) dx = \\left[\\frac{x^3}{3} - x^2 + 3x\\right]_0^2 $$</div></div><div class='math-block' style='background-color: #e8f4f8; padding: 10px; border-radius: 6px; margin: 10px 0; text-align: center;'><div class='math'>$$ A = \\frac{8}{3} - 4 + 6 = \\frac{8}{3} + 2 = \\frac{14}{3} \\text{ unités d'aire} $$</div></div>"
        }
      ]
    },
    {
      "titre": "Exercice 5 : Optimisation à plusieurs variables",
      "points": "4 pts",
      "enonce": "<div style='font-family: system-ui, -apple-system, sans-serif; line-height: 1.6;'><p>En Data Science, on cherche souvent à minimiser une fonction de coût. Considérons \(f(x, y) = x^2 + y^2 - 2x - 2y + 2\).</p></div>",
      "questions": [
        {
          "question": "<p><strong>5.1</strong> Calculez les dérivées partielles de \(f\).</p>",
          "reponse": "<div class='math-block' style='background-color: #f8f9fa; padding: 10px; border-radius: 6px; margin: 10px 0; text-align: center;'><div class='math'>$$ \\frac{\\partial f}{\\partial x} = 2x - 2 \\quad \\text{et} \\quad \\frac{\\partial f}{\\partial y} = 2y - 2 $$</div></div>"
        },
        {
          "question": "<p><strong>5.2</strong> Déterminez le point critique de \(f\).</p>",
          "reponse": "<p>On résout :</p><div class='math-block' style='background-color: #f8f9fa; padding: 10px; border-radius: 6px; margin: 10px 0; text-align: center;'><div class='math'>$$ 2x - 2 = 0 \\Rightarrow x = 1 \\quad \\text{et} \\quad 2y - 2 = 0 \\Rightarrow y = 1 $$</div></div><p>Le point critique est \((1, 1)\).</p>"
        },
        {
          "question": "<p><strong>5.3</strong> Calculez la matrice hessienne et déterminez la nature du point critique.</p>",
          "reponse": "<p>Les dérivées secondes sont :</p><div class='math-block' style='background-color: #f8f9fa; padding: 10px; border-radius: 6px; margin: 10px 0; text-align: center;'><div class='math'>$$ \\frac{\\partial^2 f}{\\partial x^2} = 2, \\quad \\frac{\\partial^2 f}{\\partial y^2} = 2, \\quad \\frac{\\partial^2 f}{\\partial x \\partial y} = 0 $$</div></div><p>La matrice hessienne est :</p><div class='math-block' style='background-color: #e8f4f8; padding: 10px; border-radius: 6px; margin: 10px 0; text-align: center;'><div class='math'>$$ H = \\begin{pmatrix} 2 & 0 \\\\ 0 & 2 \\end{pmatrix} $$</div></div><p>Son déterminant est \(\\det(H) = 4 > 0\) et \(\\frac{\\partial^2 f}{\\partial x^2} = 2 > 0\).</p><p>Le point \((1, 1)\) est donc un <strong>minimum local</strong>.</p>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
