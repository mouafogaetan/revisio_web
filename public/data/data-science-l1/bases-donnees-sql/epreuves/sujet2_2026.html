<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Bases de Données et SQL - L1",
  "classe": "Licence 1 Data Science",
  "sequence": "Séquence 2",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Modèle Relationnel et Contraintes d'Intégrité (4 pts)",
      "points": "4 pts",
      "enonce": "<p>Le schéma relationnel ci-dessous permet de gérer les inscriptions des étudiants à des cours.</p><div style='background-color: #f8f9fa; padding: 15px; border-radius: 8px;'><strong>ETUDIANT</strong> : <code>id_etudiant (INT, PK)</code>, <code>nom (VARCHAR)</code>, <code>prenom (VARCHAR)</code>, <code>email (VARCHAR, UNIQUE)</code>, <code>date_naissance (DATE)</code><br><strong>COURS</strong> : <code>code_cours (VARCHAR, PK)</code>, <code>titre (VARCHAR)</code>, <code>credits (INT)</code>, <code>id_professeur (INT, FK)</code><br><strong>PROFESSEUR</strong> : <code>id_professeur (INT, PK)</code>, <code>nom (VARCHAR)</code>, <code>prenom (VARCHAR)</code>, <code>specialite (VARCHAR)</code><br><strong>INSCRIPTION</strong> : <code>id_etudiant (INT, FK)</code>, <code>code_cours (VARCHAR, FK)</code>, <code>date_inscription (DATE)</code>, <code>note (DECIMAL)</code></div>",
      "questions": [
        {
          "question": "1) Identifiez la clé primaire de la table INSCRIPTION. Justifiez votre choix.",
          "reponse": "La clé primaire de la table INSCRIPTION est le couple <code>(id_etudiant, code_cours)</code>. En effet, un étudiant ne peut s'inscrire qu'une seule fois à un même cours, cette combinaison est donc unique et identifie de manière non ambiguë chaque enregistrement d'inscription."
        },
        {
          "question": "2) Quelles sont les contraintes d'intégrité référentielle présentes dans ce schéma ? Précisez les tables et colonnes concernées.",
          "reponse": "Les contraintes d'intégrité référentielle sont :<br>- La colonne <code>id_professeur</code> de la table <code>COURS</code> fait référence à <code>id_professeur</code> de la table <code>PROFESSEUR</code>.<br>- La colonne <code>id_etudiant</code> de la table <code>INSCRIPTION</code> fait référence à <code>id_etudiant</code> de la table <code>ETUDIANT</code>.<br>- La colonne <code>code_cours</code> de la table <code>INSCRIPTION</code> fait référence à <code>code_cours</code> de la table <code>COURS</code>."
        },
        {
          "question": "3) Que se passerait-il si l'on tentait de supprimer un professeur qui est référencé dans la table COURS ? Comment pourrait-on éviter ce problème ?",
          "reponse": "La suppression échouerait car elle violerait la contrainte d'intégrité référentielle : on ne peut pas supprimer un professeur qui est encore associé à des cours. Pour éviter ce problème, on peut soit supprimer ou réaffecter les cours du professeur avant la suppression, soit utiliser l'option <code>ON DELETE CASCADE</code> lors de la création de la clé étrangère pour supprimer automatiquement les cours associés."
        },
        {
          "question": "4) Proposez une commande SQL pour ajouter une contrainte CHECK sur la table INSCRIPTION afin de garantir que la note est comprise entre 0 et 20.",
          "reponse": "<pre style='background-color: #2c3e50; color: #ecf0f1; padding: 15px; border-radius: 8px; font-family: monospace;'>ALTER TABLE INSCRIPTION ADD CONSTRAINT check_note CHECK (note >= 0 AND note <= 20);</pre>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Requêtes d'interrogation avec GROUP BY et HAVING (4 pts)",
      "points": "4 pts",
      "enonce": "<p>On considère les tables suivantes :</p><ul><li><strong>PRODUIT</strong> : <code>id_produit (INT, PK)</code>, <code>nom (VARCHAR)</code>, <code>prix (DECIMAL)</code>, <code>categorie (VARCHAR)</code></li><li><strong>VENTE</strong> : <code>id_vente (INT, PK)</code>, <code>id_produit (INT, FK)</code>, <code>quantite (INT)</code>, <code>date_vente (DATE)</code></li></ul>",
      "questions": [
        {
          "question": "1) Écrire une requête SQL qui affiche pour chaque catégorie de produit, le nombre total de produits et le prix moyen des produits.",
          "reponse": "<pre style='background-color: #2c3e50; color: #ecf0f1; padding: 15px; border-radius: 8px; font-family: monospace;'>SELECT \n    categorie,\n    COUNT(*) AS nombre_produits,\n    AVG(prix) AS prix_moyen\nFROM PRODUIT\nGROUP BY categorie;</pre>"
        },
        {
          "question": "2) Écrire une requête SQL qui affiche, pour chaque produit, le nombre total d'unités vendues (somme des quantités).",
          "reponse": "<pre style='background-color: #2c3e50; color: #ecf0f1; padding: 15px; border-radius: 8px; font-family: monospace;'>SELECT \n    p.nom,\n    SUM(v.quantite) AS total_vendu\nFROM PRODUIT p\nJOIN VENTE v ON p.id_produit = v.id_produit\nGROUP BY p.id_produit, p.nom;</pre>"
        },
        {
          "question": "3) Écrire une requête SQL qui trouve les catégories dont le prix moyen des produits est supérieur à 5000 FCFA.",
          "reponse": "<pre style='background-color: #2c3e50; color: #ecf0f1; padding: 15px; border-radius: 8px; font-family: monospace;'>SELECT \n    categorie,\n    AVG(prix) AS prix_moyen\nFROM PRODUIT\nGROUP BY categorie\nHAVING AVG(prix) > 5000;</pre>"
        },
        {
          "question": "4) Expliquez la différence entre les clauses WHERE et HAVING dans une requête SQL.",
          "reponse": "La clause <code>WHERE</code> filtre les lignes <strong>avant</strong> le regroupement (<code>GROUP BY</code>). La clause <code>HAVING</code> filtre les groupes <strong>après</strong> le regroupement et l'application des fonctions d'agrégation. <code>HAVING</code> s'applique donc sur les résultats des agrégations (ex: <code>SUM, AVG, COUNT</code>)."
        }
      ]
    },
    {
      "titre": "Exercice 3 : Jointures et Sous-requêtes (6 pts)",
      "points": "6 pts",
      "enonce": "<p>Une entreprise souhaite gérer ses employés et leurs projets. Le schéma est le suivant :</p><div style='background-color: #f8f9fa; padding: 15px; border-radius: 8px;'><strong>EMPLOYE</strong> : <code>id_employe (INT, PK)</code>, <code>nom (VARCHAR)</code>, <code>prenom (VARCHAR)</code>, <code>date_embauche (DATE)</code>, <code>salaire (DECIMAL)</code>, <code>id_departement (INT, FK)</code><br><strong>DEPARTEMENT</strong> : <code>id_departement (INT, PK)</code>, <code>nom_departement (VARCHAR)</code><br><strong>PROJET</strong> : <code>id_projet (INT, PK)</code>, <code>nom_projet (VARCHAR)</code>, <code>budget (DECIMAL)</code><br><strong>AFFECTATION</strong> : <code>id_employe (INT, FK)</code>, <code>id_projet (INT, FK)</code>, <code>role (VARCHAR)</code>, <code>date_debut (DATE)</code></div>",
      "questions": [
        {
          "question": "1) Écrire une requête SQL qui affiche la liste des employés (nom, prenom) avec le nom de leur département.",
          "reponse": "<pre style='background-color: #2c3e50; color: #ecf0f1; padding: 15px; border-radius: 8px; font-family: monospace;'>SELECT \n    e.nom,\n    e.prenom,\n    d.nom_departement\nFROM EMPLOYE e\nJOIN DEPARTEMENT d ON e.id_departement = d.id_departement;</pre>"
        },
        {
          "question": "2) Écrire une requête SQL qui affiche les employés (nom, prenom) qui ne sont affectés à aucun projet.",
          "reponse": "<pre style='background-color: #2c3e50; color: #ecf0f1; padding: 15px; border-radius: 8px; font-family: monospace;'>SELECT \n    nom,\n    prenom\nFROM EMPLOYE\nWHERE id_employe NOT IN (\n    SELECT DISTINCT id_employe\n    FROM AFFECTATION\n);</pre>"
        },
        {
          "question": "3) Écrire une requête SQL qui affiche pour chaque projet, le nombre d'employés qui y sont affectés.",
          "reponse": "<pre style='background-color: #2c3e50; color: #ecf0f1; padding: 15px; border-radius: 8px; font-family: monospace;'>SELECT \n    p.nom_projet,\n    COUNT(a.id_employe) AS nombre_employes\nFROM PROJET p\nLEFT JOIN AFFECTATION a ON p.id_projet = a.id_projet\nGROUP BY p.id_projet, p.nom_projet;</pre>"
        },
        {
          "question": "4) Écrire une requête SQL utilisant une sous-requête pour trouver les employés qui gagnent plus que le salaire moyen de leur département.",
          "reponse": "<pre style='background-color: #2c3e50; color: #ecf0f1; padding: 15px; border-radius: 8px; font-family: monospace;'>SELECT \n    e.nom,\n    e.prenom,\n    e.salaire,\n    e.id_departement\nFROM EMPLOYE e\nWHERE e.salaire > (\n    SELECT AVG(salaire)\n    FROM EMPLOYE\n    WHERE id_departement = e.id_departement\n);</pre>"
        },
        {
          "question": "5) Expliquez la différence entre une jointure (JOIN) et une sous-requête dans une clause FROM.",
          "reponse": "Une <strong>jointure</strong> combine deux tables ou plus sur une condition de correspondance (généralement des clés) pour former un seul résultat. Une <strong>sous-requête dans la clause FROM</strong> (ou table dérivée) crée une table temporaire issue d'une requête, qui est ensuite utilisée comme n'importe quelle autre table dans la clause FROM. La jointure est souvent plus performante pour des tables reliées par des clés, tandis qu'une sous-requête peut être utile pour des calculs complexes avant la jointure."
        },
        {
          "question": "6) Proposez une requête SQL pour afficher les employés (nom, prenom) affectés à plus de 2 projets.",
          "reponse": "<pre style='background-color: #2c3e50; color: #ecf0f1; padding: 15px; border-radius: 8px; font-family: monospace;'>SELECT \n    e.nom,\n    e.prenom,\n    COUNT(a.id_projet) AS nb_projets\nFROM EMPLOYE e\nJOIN AFFECTATION a ON e.id_employe = a.id_employe\nGROUP BY e.id_employe, e.nom, e.prenom\nHAVING COUNT(a.id_projet) > 2;</pre>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Fonctions Avancées et Fenêtrage (3 pts)",
      "points": "3 pts",
      "enonce": "<p>La table <code>VENTES</code> contient : <code>id_vente</code>, <code>id_produit</code>, <code>montant</code>, <code>date_vente</code>.</p>",
      "questions": [
        {
          "question": "1) Écrire une requête SQL qui extrait le mois et l'année de chaque date de vente, puis calcule le total des ventes par mois.",
          "reponse": "<pre style='background-color: #2c3e50; color: #ecf0f1; padding: 15px; border-radius: 8px; font-family: monospace;'>SELECT \n    YEAR(date_vente) AS annee,\n    MONTH(date_vente) AS mois,\n    SUM(montant) AS total_ventes\nFROM VENTES\nGROUP BY YEAR(date_vente), MONTH(date_vente)\nORDER BY annee, mois;</pre>"
        },
        {
          "question": "2) Utiliser la fonction RANK() pour classer les produits par chiffre d'affaires total (montant total des ventes).",

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
