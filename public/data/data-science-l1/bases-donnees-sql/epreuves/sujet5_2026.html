<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Bases de Données et SQL - L1",
  "classe": "Licence 1 Data Science",
  "sequence": "Séquence 5",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Requêtes de Sélection et Filtrage (5 pts)",
      "points": "5 pts",
      "enonce": "<div style='font-size: 1rem; line-height: 1.6; color: #333;'><p>On considère la table <code>Employes</code> suivante :</p><div style='background-color: #f4f4f4; padding: 10px; border-radius: 6px; overflow-x: auto;'><table style='width: 100%; border-collapse: collapse; font-size: 0.9rem;'><thead><tr style='background-color: #2d2d2d; color: white;'><th style='padding: 8px; border: 1px solid #ddd;'>id</th><th style='padding: 8px; border: 1px solid #ddd;'>nom</th><th style='padding: 8px; border: 1px solid #ddd;'>prenom</th><th style='padding: 8px; border: 1px solid #ddd;'>ville</th><th style='padding: 8px; border: 1px solid #ddd;'>salaire</th><th style='padding: 8px; border: 1px solid #ddd;'>date_embauche</th></tr></thead><tbody><tr><td style='padding: 8px; border: 1px solid #ddd;'>1</td><td style='padding: 8px; border: 1px solid #ddd;'>Moukam</td><td style='padding: 8px; border: 1px solid #ddd;'>Jean</td><td style='padding: 8px; border: 1px solid #ddd;'>Douala</td><td style='padding: 8px; border: 1px solid #ddd;'>450000</td><td style='padding: 8px; border: 1px solid #ddd;'>2020-01-15</td></tr><tr><td style='padding: 8px; border: 1px solid #ddd;'>2</td><td style='padding: 8px; border: 1px solid #ddd;'>Ngo</td><td style='padding: 8px; border: 1px solid #ddd;'>Marie</td><td style='padding: 8px; border: 1px solid #ddd;'>Yaoundé</td><td style='padding: 8px; border: 1px solid #ddd;'>520000</td><td style='padding: 8px; border: 1px solid #ddd;'>2019-03-01</td></tr><tr><td style='padding: 8px; border: 1px solid #ddd;'>3</td><td style='padding: 8px; border: 1px solid #ddd;'>Tchoffo</td><td style='padding: 8px; border: 1px solid #ddd;'>Paul</td><td style='padding: 8px; border: 1px solid #ddd;'>Douala</td><td style='padding: 8px; border: 1px solid #ddd;'>380000</td><td style='padding: 8px; border: 1px solid #ddd;'>2021-07-20</td></tr><tr><td style='padding: 8px; border: 1px solid #ddd;'>4</td><td style='padding: 8px; border: 1px solid #ddd;'>Mballa</td><td style='padding: 8px; border: 1px solid #ddd;'>Alice</td><td style='padding: 8px; border: 1px solid #ddd;'>Bafoussam</td><td style='padding: 8px; border: 1px solid #ddd;'>420000</td><td style='padding: 8px; border: 1px solid #ddd;'>2022-02-10</td></tr><tr><td style='padding: 8px; border: 1px solid #ddd;'>5</td><td style='padding: 8px; border: 1px solid #ddd;'>Kouam</td><td style='padding: 8px; border: 1px solid #ddd;'>David</td><td style='padding: 8px; border: 1px solid #ddd;'>Yaoundé</td><td style='padding: 8px; border: 1px solid #ddd;'>490000</td><td style='padding: 8px; border: 1px solid #ddd;'>2020-11-05</td></tr></tbody></table></div></div>",
      "questions": [
        {
          "question": "<p><strong>1.1</strong> Écrivez une requête SQL pour sélectionner tous les employés de la ville de <strong>Douala</strong>.</p>",
          "reponse": "<p><code>SELECT * FROM Employes WHERE ville = 'Douala';</code></p>"
        },
        {
          "question": "<p><strong>1.2</strong> Écrivez une requête SQL pour sélectionner le nom, le prénom et le salaire des employés dont le salaire est <strong>supérieur à 400 000 FCFA</strong>, triés par salaire décroissant.</p>",
          "reponse": "<p><code>SELECT nom, prenom, salaire FROM Employes WHERE salaire > 400000 ORDER BY salaire DESC;</code></p>"
        },
        {
          "question": "<p><strong>1.3</strong> Écrivez une requête SQL pour sélectionner les employés dont le nom <strong>commence par la lettre 'M'</strong>.</p>",
          "reponse": "<p><code>SELECT * FROM Employes WHERE nom LIKE 'M%';</code></p>"
        },
        {
          "question": "<p><strong>1.4</strong> Écrivez une requête SQL pour sélectionner les employés <strong>embauchés entre le 1er janvier 2020 et le 31 décembre 2021</strong>.</p>",
          "reponse": "<p><code>SELECT * FROM Employes WHERE date_embauche BETWEEN '2020-01-01' AND '2021-12-31';</code></p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Agrégation et Regroupement (4 pts)",
      "points": "4 pts",
      "enonce": "<div style='font-size: 1rem; line-height: 1.6; color: #333;'><p>On considère les tables suivantes :</p><ul><li><strong>Ventes</strong> (id_vente, id_produit, quantite, prix_unitaire, date_vente)</li><li><strong>Produits</strong> (id_produit, nom_produit, categorie)</li></ul></div>",
      "questions": [
        {
          "question": "<p><strong>2.1</strong> Écrivez une requête SQL pour calculer le <strong>chiffre d'affaires total</strong> (quantite * prix_unitaire) par catégorie de produit.</p>",
          "reponse": "<p><code>SELECT p.categorie, SUM(v.quantite * v.prix_unitaire) AS ca_total FROM Ventes v JOIN Produits p ON v.id_produit = p.id_produit GROUP BY p.categorie;</code></p>"
        },
        {
          "question": "<p><strong>2.2</strong> Écrivez une requête SQL pour afficher le <strong>nombre total de ventes</strong> et la <strong>quantité totale vendue</strong> pour chaque produit.</p>",
          "reponse": "<p><code>SELECT p.nom_produit, COUNT(v.id_vente) AS nb_ventes, SUM(v.quantite) AS quantite_totale FROM Produits p LEFT JOIN Ventes v ON p.id_produit = v.id_produit GROUP BY p.id_produit, p.nom_produit;</code></p>"
        },
        {
          "question": "<p><strong>2.3</strong> Écrivez une requête SQL pour sélectionner les catégories dont le <strong>chiffre d'affaires total est supérieur à 1 000 000 FCFA</strong>.</p>",
          "reponse": "<p><code>SELECT p.categorie, SUM(v.quantite * v.prix_unitaire) AS ca_total FROM Ventes v JOIN Produits p ON v.id_produit = p.id_produit GROUP BY p.categorie HAVING ca_total > 1000000;</code></p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Jointures et Sous-Requêtes (6 pts)",
      "points": "6 pts",
      "enonce": "<div style='font-size: 1rem; line-height: 1.6; color: #333;'><p>Une école souhaite analyser les performances de ses étudiants. Voici les tables :</p><ul><li><strong>Etudiants</strong> (id_etudiant, nom, prenom, ville)</li><li><strong>Inscriptions</strong> (id_inscription, id_etudiant, id_cours, annee)</li><li><strong>Cours</strong> (id_cours, nom_cours, credits)</li><li><strong>Notes</strong> (id_note, id_inscription, note)</li></ul></div>",
      "questions": [
        {
          "question": "<p><strong>3.1</strong> Écrivez une requête SQL pour lister le <strong>nom, le prénom</strong> des étudiants ainsi que le <strong>nombre de cours</strong> auxquels ils sont inscrits.</p>",
          "reponse": "<p><code>SELECT e.nom, e.prenom, COUNT(i.id_cours) AS nb_cours FROM Etudiants e LEFT JOIN Inscriptions i ON e.id_etudiant = i.id_etudiant GROUP BY e.id_etudiant, e.nom, e.prenom;</code></p>"
        },
        {
          "question": "<p><strong>3.2</strong> Écrivez une requête SQL pour afficher le <strong>nom de l'étudiant</strong>, le <strong>nom du cours</strong> et la <strong>moyenne des notes</strong> de chaque étudiant pour chaque cours.</p>",
          "reponse": "<p><code>SELECT e.nom, e.prenom, c.nom_cours, ROUND(AVG(n.note), 2) AS moyenne FROM Etudiants e JOIN Inscriptions i ON e.id_etudiant = i.id_etudiant JOIN Cours c ON i.id_cours = c.id_cours LEFT JOIN Notes n ON i.id_inscription = n.id_inscription GROUP BY e.id_etudiant, i.id_inscription, c.id_cours, e.nom, e.prenom, c.nom_cours;</code></p>"
        },
        {
          "question": "<p><strong>3.3</strong> Utilisez une <strong>sous-requête</strong> pour sélectionner les étudiants dont la moyenne générale est <strong>supérieure à 15/20</strong>.</p>",
          "reponse": "<p><code>SELECT e.nom, e.prenom FROM Etudiants e WHERE e.id_etudiant IN (SELECT i.id_etudiant FROM Inscriptions i JOIN Notes n ON i.id_inscription = n.id_inscription GROUP BY i.id_etudiant HAVING AVG(n.note) > 15);</code></p>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Conception et DDL (5 pts)",
      "points": "5 pts",
      "enonce": "<div style='font-size: 1rem; line-height: 1.6; color: #333;'><p>Vous devez concevoir une base de données pour une <strong>bibliothèque universitaire</strong>.</p><p>Les besoins sont les suivants :</p><ul><li>Gérer les <strong>livres</strong> (titre, auteur, ISBN, année_publication, nombre_exemplaires).</li><li>Gérer les <strong>étudiants</strong> (nom, prénom, email, numéro_étudiant).</li><li>Gérer les <strong>emprunts</strong> (date_emprunt, date_retour_prévue, date_retour_réelle).</li><li>Un étudiant peut emprunter <strong>plusieurs livres</strong>.</li><li>Un livre peut être emprunté <strong>plusieurs fois</strong>.</li></ul></div>",
      "questions": [
        {
          "question": "<p><strong>4.1</strong> Proposez un <strong>diagramme Entité-Association</strong> (identifiez les entités, les attributs et les associations avec leurs cardinalités).</p>",
          "reponse": "<p><strong>Entités :</strong></p><ul><li><strong>Livre</strong> : id_livre (PK), titre, auteur, ISBN, année_publication, nombre_exemplaires</li><li><strong>Etudiant</strong> : id_etudiant (PK), nom, prénom, email, numéro_étudiant</li><li><strong>Emprunt</strong> : id_emprunt (PK), date_emprunt, date_retour_prévue, date_retour_réelle</li></ul><p><strong>Associations :</strong></p><ul><li>Un <strong>Etudiant</strong> effectue <strong>0..n</strong> <strong>Emprunts</strong> (l'étudiant peut ne pas avoir d'emprunt ou en avoir plusieurs).</li><li>Un <strong>Emprunt</strong> concerne <strong>1..n</strong> <strong>Livres</strong> (un emprunt peut porter sur plusieurs livres).</li><li>Un <strong>Livre</strong> peut être dans <strong>0..n</strong> <strong>Emprunts</strong>.</li></ul>"
        },
        {
          "question": "<p><strong>4.2</strong> Écrivez le <strong>script SQL (DDL)</strong> pour créer les tables correspondantes (définissez les clés primaires, les clés étrangères et les types de données appropriés).</p>",
          "reponse": "<p><pre style='background-color: #2d2d2d; color: #f8f8f2; padding: 12px; border-radius: 6px; overflow-x: auto; font-size: 0.85rem;'>CREATE TABLE Livres (\n    id_livre INT PRIMARY KEY AUTO_INCREMENT,\n    titre VARCHAR(255) NOT NULL,\n    auteur VARCHAR(255) NOT NULL,\n    ISBN VARCHAR(20) UNIQUE,\n    annee_publication INT,\n    nombre_exemplaires INT DEFAULT 1\n);\n\nCREATE TABLE Etudiants (\n    id_etudiant INT PRIMARY KEY AUTO_INCREMENT,\n    nom VARCHAR(100) NOT NULL,\n    prenom VARCHAR(100) NOT NULL,\n    email VARCHAR(150) UNIQUE NOT NULL,\n    numero_etudiant VARCHAR(20) UNIQUE NOT NULL\n);\n\nCREATE TABLE Emprunts (\n    id_emprunt INT PRIMARY KEY AUTO_INCREMENT,\n    id_etudiant INT NOT NULL,\n    date_emprunt DATE NOT NULL,\n    date_retour_prevue DATE NOT NULL,\n    date_retour_reelle DATE,\n    FOREIGN KEY (id_etudiant) REFERENCES Etudiants(id_etudiant)\n);\n\nCREATE TABLE Emprunt_Livre (\n    id_emprunt INT,\n    id_livre INT,\n    PRIMARY KEY (id_emprunt, id_livre),\n    FOREIGN KEY (id_emprunt) REFERENCES Emprunts(id_emprunt),\n    FOREIGN KEY (id_livre) REFERENCES Livres(id_livre)\n);</pre></p>"

};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
