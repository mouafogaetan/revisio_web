<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Bases de Données et SQL",
  "classe": "Licence 1 Data Science",
  "sequence": "Sequence 4",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Conception d'une Base de Données pour une École (4 pts)",
      "points": "4 pts",
      "enonce": "<div style='padding: 10px; font-family: Arial, sans-serif;'><p>Vous êtes chargé de concevoir une base de données pour une école. L'école souhaite gérer les informations suivantes :</p><ul><li><strong>Élèves</strong> : identifiant (ID), nom, prénom, date de naissance, classe (ex: 'Terminale A', 'Première B'), adresse</li><li><strong>Enseignants</strong> : identifiant (ID), nom, prénom, matière enseignée (ex: 'Mathématiques', 'Français'), date d'embauche</li><li><strong>Cours</strong> : identifiant (ID), nom du cours (ex: 'Algèbre', 'Littérature'), coefficient, ID_Enseignant</li><li><strong>Notes</strong> : ID_Élève, ID_Cours, Note (sur 20), Date_Note</li></ul><p>Chaque élève suit plusieurs cours, et chaque cours est enseigné par un seul enseignant. Les élèves peuvent avoir plusieurs notes par cours.</p><p><strong>NB :</strong> Les noms de tables et de colonnes doivent être cohérents.</p></div>",
      "questions": [
        {
          "question": "1) Proposez un diagramme Entité-Association (EA) pour ce système d'information en identifiant les entités, leurs attributs, les associations et les cardinalités.",
          "reponse": "<div><p><strong>Entités et attributs :</strong></p><ul><li><strong>Élève</strong> : ID_Élève (PK), Nom, Prénom, Date_Naissance, Classe, Adresse</li><li><strong>Enseignant</strong> : ID_Enseignant (PK), Nom, Prénom, Matière, Date_Embauche</li><li><strong>Cours</strong> : ID_Cours (PK), Nom_Cours, Coefficient, ID_Enseignant (FK)</li><li><strong>Note</strong> : ID_Élève (FK), ID_Cours (FK), Note, Date_Note</li></ul><p><strong>Associations et cardinalités :</strong></p><ul><li><strong>Enseignant ↔ Cours :</strong> Un enseignant enseigne plusieurs cours (1,N) ; un cours est enseigné par un seul enseignant (1,1). Relation : <em>Enseigne</em></li><li><strong>Élève ↔ Cours :</strong> Un élève suit plusieurs cours (0,N) ; un cours est suivi par plusieurs élèves (0,N). Relation : <em>Suit</em> (N,N) → Table de liaison <strong>Inscriptions</strong></li><li><strong>Élève ↔ Cours ↔ Note :</strong> Une note est associée à un élève et à un cours. La table <strong>Note</strong> est une table de liaison avec attributs (Note, Date_Note).</li></ul></div>",
          "sousQuestions": []
        },
        {
          "question": "2) Transformez ce diagramme EA en modèle relationnel (schéma relationnel). Identifiez les clés primaires et les clés étrangères.",
          "reponse": "<div><p><strong>Schéma relationnel :</strong></p><ul><li><strong>Élève</strong> (ID_Élève, Nom, Prénom, Date_Naissance, Classe, Adresse) - PK : ID_Élève</li><li><strong>Enseignant</strong> (ID_Enseignant, Nom, Prénom, Matière, Date_Embauche) - PK : ID_Enseignant</li><li><strong>Cours</strong> (ID_Cours, Nom_Cours, Coefficient, ID_Enseignant) - PK : ID_Cours - FK : ID_Enseignant référence Enseignant(ID_Enseignant)</li><li><strong>Note</strong> (ID_Élève, ID_Cours, Note, Date_Note) - PK : (ID_Élève, ID_Cours, Date_Note) - FK1 : ID_Élève référence Élève(ID_Élève) - FK2 : ID_Cours référence Cours(ID_Cours)</li></ul></div>",
          "sousQuestions": []
        },
        {
          "question": "3) Écrivez les instructions SQL (DDL) pour créer ces tables avec les contraintes appropriées (clés primaires, clés étrangères, NOT NULL).",
          "reponse": "<div><pre style='background: #2d2d2d; color: #f8f8f2; padding: 10px; border-radius: 5px; overflow-x: auto;'>CREATE DATABASE Ecole;\nUSE Ecole;\n\nCREATE TABLE Eleve (\n    ID_Eleve INT PRIMARY KEY,\n    Nom VARCHAR(50) NOT NULL,\n    Prenom VARCHAR(50) NOT NULL,\n    Date_Naissance DATE,\n    Classe VARCHAR(20),\n    Adresse VARCHAR(100)\n);\n\nCREATE TABLE Enseignant (\n    ID_Enseignant INT PRIMARY KEY,\n    Nom VARCHAR(50) NOT NULL,\n    Prenom VARCHAR(50) NOT NULL,\n    Matiere VARCHAR(50),\n    Date_Embauche DATE\n);\n\nCREATE TABLE Cours (\n    ID_Cours INT PRIMARY KEY,\n    Nom_Cours VARCHAR(50) NOT NULL,\n    Coefficient DECIMAL(3,1) CHECK (Coefficient > 0),\n    ID_Enseignant INT,\n    FOREIGN KEY (ID_Enseignant) REFERENCES Enseignant(ID_Enseignant) ON DELETE SET NULL\n);\n\nCREATE TABLE Note (\n    ID_Eleve INT,\n    ID_Cours INT,\n    Note DECIMAL(4,2) CHECK (Note >= 0 AND Note <= 20),\n    Date_Note DATE,\n    PRIMARY KEY (ID_Eleve, ID_Cours, Date_Note),\n    FOREIGN KEY (ID_Eleve) REFERENCES Eleve(ID_Eleve) ON DELETE CASCADE,\n    FOREIGN KEY (ID_Cours) REFERENCES Cours(ID_Cours) ON DELETE CASCADE\n);</pre></div>",
          "sousQuestions": []
        }
      ]
    },
    {
      "titre": "Exercice 2 : Requêtes d'Extraction de Données pour un Dataset ML (6 pts)",
      "points": "6 pts",
      "enonce": "<div style='padding: 10px; font-family: Arial, sans-serif;'><p>Une entreprise de télécommunications souhaite prédire le désabonnement de ses clients. La base de données contient les tables suivantes :</p><ul><li><strong>Clients</strong> : <code>ID</code>, <code>Nom</code>, <code>Prenom</code>, <code>Ville</code>, <code>Age</code>, <code>Date_Inscription</code>, <code>Type_Abonnement</code> (ex: 'Premium', 'Standard'), <code>Actif</code> (booléen)</li><li><strong>Appels</strong> : <code>ID</code>, <code>ID_Client</code>, <code>Date_Appel</code>, <code>Duree</code> (en minutes), <code>Type_Appel</code> (ex: 'Local', 'National')</li><li><strong>Factures</strong> : <code>ID</code>, <code>ID_Client</code>, <code>Mois</code>, <code>Montant</code>, <code>Statut</code> (ex: 'Payée', 'Impayée')</li><li><strong>Reclamations</strong> : <code>ID</code>, <code>ID_Client</code>, <code>Date_Reclamation</code>, <code>Sujet</code>, <code>Resolue</code> (booléen)</li></ul></div>",
      "questions": [
        {
          "question": "1) Écrivez une requête SQL pour extraire un dataset avec les features suivantes pour chaque client : ID, Ville, Age, Type_Abonnement, nombre total d'appels, durée totale des appels, montant total des factures, nombre de réclamations, nombre de réclamations non résolues, et le statut actif.",
          "reponse": "<div><pre style='background: #2d2d2d; color: #f8f8f2; padding: 10px; border-radius: 5px; overflow-x: auto;'>SELECT\n    c.ID,\n    c.Ville,\n    c.Age,\n    c.Type_Abonnement,\n    COUNT(DISTINCT a.ID) AS Nb_Appels,\n    COALESCE(SUM(a.Duree), 0) AS Duree_Total_Appels,\n    COALESCE(SUM(f.Montant), 0) AS Montant_Total_Factures,\n    COUNT(DISTINCT r.ID) AS Nb_Reclamations,\n    SUM(CASE WHEN r.Resolue = FALSE THEN 1 ELSE 0 END) AS Reclamations_Non_Resolues,\n    c.Actif\nFROM Clients c\nLEFT JOIN Appels a ON c.ID = a.ID_Client\nLEFT JOIN Factures f ON c.ID = f.ID_Client\nLEFT JOIN Reclamations r ON c.ID = r.ID_Client\nGROUP BY c.ID, c.Ville, c.Age, c.Type_Abonnement, c.Actif;</pre></div>",
          "sousQuestions": []
        },
        {
          "question": "2) Ajoutez une colonne calculée représentant l'ancienneté du client en années (à partir de la date d'inscription). Utilisez la date du jour comme '2025-08-08'.",
          "reponse": "<div><pre style='background: #2d2d2d; color: #f8f8f2; padding: 10px; border-radius: 5px; overflow-x: auto;'>SELECT\n    c.ID,\n    c.Ville,\n    c.Age,\n    c.Type_Abonnement,\n    COUNT(DISTINCT a.ID) AS Nb_Appels,\n    COALESCE(SUM(a.Duree), 0) AS Duree_Total_Appels,\n    COALESCE(SUM(f.Montant), 0) AS Montant_Total_Factures,\n    COUNT(DISTINCT r.ID) AS Nb_Reclamations,\n    SUM(CASE WHEN r.Resolue = FALSE THEN 1 ELSE 0 END) AS Reclamations_Non_Resolues,\n    c.Actif,\n    DATEDIFF('2025-08-08', c.Date_Inscription) / 365 AS Anciennete_Annees\nFROM Clients c\nLEFT JOIN Appels a ON c.ID = a.ID_Client\nLEFT JOIN Factures f ON c.ID = f.ID_Client\nLEFT JOIN Reclamations r ON c.ID = r.ID_Client\nGROUP BY c.ID, c.Ville, c.Age, c.Type_Abonnement, c.Actif, c.Date_Inscription;</pre></div>",
          "sousQuestions": []
        },
        {
          "question": "3) Expliquez pourquoi l'utilisation de LEFT JOIN est préférable à INNER JOIN dans ce type d'extraction.",
          "reponse": "<div><p>L'utilisation de <strong>LEFT JOIN</strong> est préférable car elle permet de conserver <strong>tous les clients</strong> dans le dataset, même ceux qui n'ont pas d'appels, de factures ou de réclamations. Avec un INNER JOIN, les clients sans enregistrement dans une des tables jointes seraient exclus du résultat, ce qui réduirait la taille du dataset et pourrait introduire un biais dans le modèle prédictif.</p><p>Pour les clients sans appels, les valeurs seront NULL (ou 0 après COALESCE). C'est important car le modèle doit pouvoir prédire pour tous les types de clients.</p></div>",
          "sousQuestions": []
        }
      ]
    },
    {
      "titre": "Exercice 3 : Vues et Index pour l'Optimisation (4 pts)",
      "points": "4 pts",
      "enonce": "<div style='padding: 10px; font-family: Arial, sans-serif;'><p>Une entreprise de e-commerce souhaite optimiser ses requêtes d'analyse de ventes. La table <strong>Commandes</strong> contient des millions d'enregistrements avec les colonnes : <code>ID</code>, <code>ID_Client</code>, <code>Date_Commande</code>, <code>Montant</code>, <code>Ville</code>.</p></div>",
      "questions": [
        {
          "question": "1) Expliquez ce qu'est une vue (VIEW) en SQL et quel serait son avantage pour créer un rapport mensuel des ventes par ville.",
          "reponse": "<div><p>Une <strong>vue</strong> est une table virtuelle définie par une requête SELECT. Elle ne stocke pas de données physiquement mais permet de simplifier l'accès aux données en encapsulant des requêtes complexes.</p><p>Pour créer un rapport mensuel des ventes par ville, une vue permettrait de :</p><ul><li><strong>Simplifier</strong> les requêtes futures : les analystes n'auraient qu'à interroger la vue au lieu d'écrire des requêtes complexes avec GROUP BY et fonctions d'agrégation.</li><li><strong>Masquer</strong> la complexité de la structure des tables sous-jacentes.</li><li><strong>Centraliser</strong> la logique de calcul, ce qui facilite la maintenance.</li></ul></div>",
          "sousQuestions": []
        },
        {
          "question": "2) Écrivez la requête SQL pour créer une vue nommée <code>V_Stats_Ventes</code> qui affiche pour chaque mois et chaque ville : le nombre de commandes, le montant total, et le montant moyen.",

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
