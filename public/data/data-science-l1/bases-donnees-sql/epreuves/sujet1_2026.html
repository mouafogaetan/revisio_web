<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Bases de Données et SQL - L1",
  "classe": "Licence 1 Data Science",
  "sequence": "Sequence 1",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Exploration de la structure d'une base de données",
      "points": "4 pts",
      "enonce": "<div style='background-color: #f8fafc; color: #0f172a; padding: 15px; border-radius: 10px; font-family: sans-serif;'><p>On vous donne accès à une base de données d'une <strong>bibliothèque municipale</strong>. Vous devez explorer sa structure pour comprendre comment les données sont organisées.</p><p>La base contient plusieurs tables, mais vous ne connaissez ni leurs noms ni leurs colonnes.</p><div style='background-color: #1e293b; color: #f8fafc; padding: 10px; border-radius: 6px; margin: 10px 0;'><p style='margin: 0;'><strong>Consigne :</strong> Rédigez les commandes SQL (adaptées à MySQL) qui vous permettront de :</p><ol style='margin: 5px 0; padding-left: 20px;'><li>Lister toutes les tables de la base de données.</li><li>Obtenir la description complète (structure) de la table <code style='background-color: #0f172a; padding: 2px 5px; border-radius: 4px;'>LIVRES</code>.</li></ol></div><p>Expliquez brièvement <strong>pourquoi</strong> ces étapes sont importantes avant de commencer à écrire des requêtes d'analyse.</p></div>",
      "questions": [
        {
          "question": "<div style='font-weight: bold; color: #1e293b;'>1) Commande SQL pour lister les tables :</div>",
          "reponse": "<code style='background-color: #1e293b; color: #f8fafc; padding: 2px 5px; border-radius: 4px;'>SHOW TABLES;</code> ou <code style='background-color: #1e293b; color: #f8fafc; padding: 2px 5px; border-radius: 4px;'>SELECT table_name FROM information_schema.tables WHERE table_schema = 'nom_de_la_base';</code>"
        },
        {
          "question": "<div style='font-weight: bold; color: #1e293b;'>2) Commande SQL pour décrire la table LIVRES :</div>",
          "reponse": "<code style='background-color: #1e293b; color: #f8fafc; padding: 2px 5px; border-radius: 4px;'>DESCRIBE LIVRES;</code> ou <code style='background-color: #1e293b; color: #f8fafc; padding: 2px 5px; border-radius: 4px;'>SHOW COLUMNS FROM LIVRES;</code>"
        },
        {
          "question": "<div style='font-weight: bold; color: #1e293b;'>3) Explication de l'importance de ces étapes :</div>",
          "reponse": "<p>Ces étapes sont cruciales car elles permettent de :</p><ul><li><strong>Comprendre le schéma</strong> : connaître les tables disponibles et leurs colonnes pour savoir quelles données interroger.</li><li><strong>Identifier les types de données</strong> : savoir si une colonne contient des nombres, des dates ou du texte pour écrire des requêtes correctes.</li><li><strong>Vérifier les contraintes</strong> : repérer les clés primaires et étrangères pour comprendre les relations entre les tables.</li></ul>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Analyse de la distribution des données",
      "points": "6 pts",
      "enonce": "<div style='background-color: #f8fafc; color: #0f172a; padding: 15px; border-radius: 10px; font-family: sans-serif;'><p>Vous avez identifié la table <code style='background-color: #e2e8f0; padding: 2px 5px; border-radius: 4px;'>EMPRUNTS</code> qui contient l'historique des emprunts de la bibliothèque. Sa structure est la suivante :</p><ul style='background-color: #f1f5f9; padding: 10px; border-radius: 6px; list-style: none;'><li><strong>id_emprunt</strong> (INT, clé primaire)</li><li><strong>id_livre</strong> (INT, clé étrangère vers LIVRES)</li><li><strong>id_abonne</strong> (INT, clé étrangère vers ABONNES)</li><li><strong>date_emprunt</strong> (DATE)</li><li><strong>date_retour</strong> (DATE, peut être NULL)</li></ul><div style='background-color: #1e293b; color: #f8fafc; padding: 10px; border-radius: 6px; margin: 10px 0;'><p style='margin: 0;'><strong>Consigne :</strong> En utilisant les requêtes SQL appropriées :</p><ol style='margin: 5px 0; padding-left: 20px;'><li>Calculez le nombre total d'emprunts effectués.</li><li>Pour chaque année (en utilisant la date d'emprunt), comptez le nombre d'emprunts. Vous utiliserez la fonction <code style='background-color: #0f172a; padding: 2px 5px; border-radius: 4px;'>YEAR(date_emprunt)</code>.</li><li>Identifiez le livre (son id) qui a été le plus emprunté. Pour cela, vous devez grouper par id_livre et compter.</li></ol></div></div>",
      "questions": [
        {
          "question": "<div style='font-weight: bold; color: #1e293b;'>1) Requête SQL pour compter le nombre total d'emprunts :</div>",
          "reponse": "<code style='background-color: #1e293b; color: #f8fafc; padding: 2px 5px; border-radius: 4px;'>SELECT COUNT(*) AS total_emprunts FROM EMPRUNTS;</code>"
        },
        {
          "question": "<div style='font-weight: bold; color: #1e293b;'>2) Requête SQL pour compter les emprunts par année :</div>",
          "reponse": "<pre style='background-color: #1e293b; color: #e2e8f0; padding: 10px; border-radius: 6px; overflow-x: auto; white-space: pre-wrap; word-break: break-word;'><code>SELECT YEAR(date_emprunt) AS annee, COUNT(*) AS nombre_emprunts\nFROM EMPRUNTS\nGROUP BY YEAR(date_emprunt)\nORDER BY annee;</code></pre>"
        },
        {
          "question": "<div style='font-weight: bold; color: #1e293b;'>3) Requête SQL pour identifier le livre le plus emprunté (avec son id) :</div>",
          "reponse": "<pre style='background-color: #1e293b; color: #e2e8f0; padding: 10px; border-radius: 6px; overflow-x: auto; white-space: pre-wrap; word-break: break-word;'><code>SELECT id_livre, COUNT(*) AS nb_emprunts\nFROM EMPRUNTS\nGROUP BY id_livre\nORDER BY nb_emprunts DESC\nLIMIT 1;</code></pre>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Statistiques descriptives et détection d'aberrations",
      "points": "6 pts",
      "enonce": "<div style='background-color: #f8fafc; color: #0f172a; padding: 15px; border-radius: 10px; font-family: sans-serif;'><p>La table <code style='background-color: #e2e8f0; padding: 2px 5px; border-radius: 4px;'>ABONNES</code> contient les informations suivantes : <strong>id_abonne</strong>, <strong>nom</strong>, <strong>prenom</strong>, <strong>age</strong> (INT), et <strong>ville</strong>.</p><div style='background-color: #1e293b; color: #f8fafc; padding: 10px; border-radius: 6px; margin: 10px 0;'><p style='margin: 0;'><strong>Consigne :</strong></p><ol style='margin: 5px 0; padding-left: 20px;'><li>Calculez l'âge moyen, l'âge minimum et l'âge maximum des abonnés.</li><li>Identifiez les abonnés dont l'âge est supérieur à la moyenne de plus de 15 ans. On pourra utiliser une sous-requête pour calculer la moyenne.</li><li>Comptez le nombre d'abonnés par ville. Affichez le résultat dans l'ordre décroissant du nombre d'abonnés.</li></ol></div></div>",
      "questions": [
        {
          "question": "<div style='font-weight: bold; color: #1e293b;'>1) Requête pour les statistiques d'âge (moyenne, min, max) :</div>",
          "reponse": "<code style='background-color: #1e293b; color: #f8fafc; padding: 2px 5px; border-radius: 4px;'>SELECT AVG(age) AS age_moyen, MIN(age) AS age_min, MAX(age) AS age_max FROM ABONNES;</code>"
        },
        {
          "question": "<div style='font-weight: bold; color: #1e293b;'>2) Requête pour identifier les abonnés avec un âge > moyenne + 15 ans (valeur aberrante) :</div>",
          "reponse": "<pre style='background-color: #1e293b; color: #e2e8f0; padding: 10px; border-radius: 6px; overflow-x: auto; white-space: pre-wrap; word-break: break-word;'><code>SELECT *\nFROM ABONNES\nWHERE age > (SELECT AVG(age) + 15 FROM ABONNES);</code></pre>"
        },
        {
          "question": "<div style='font-weight: bold; color: #1e293b;'>3) Requête pour compter les abonnés par ville (ordre décroissant) :</div>",
          "reponse": "<pre style='background-color: #1e293b; color: #e2e8f0; padding: 10px; border-radius: 6px; overflow-x: auto; white-space: pre-wrap; word-break: break-word;'><code>SELECT ville, COUNT(*) AS nombre_abonnes\nFROM ABONNES\nGROUP BY ville\nORDER BY nombre_abonnes DESC;</code></pre>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Synthèse et cas pratique",
      "points": "4 pts",
      "enonce": "<div style='background-color: #f8fafc; color: #0f172a; padding: 15px; border-radius: 10px; font-family: sans-serif;'><p>Le responsable de la bibliothèque souhaite comprendre le comportement des emprunteurs. Il vous demande d'explorer les données pour répondre à la question suivante :</p><div style='background-color: #1e293b; color: #f8fafc; padding: 10px; border-radius: 6px; margin: 10px 0;'><p style='margin: 0;'><strong>Question métier :</strong> \"Quels sont les 5 abonnés les plus âgés qui habitent à Douala ?\"</p></div><p><strong>Consigne :</strong> Écrivez la requête SQL permettant de répondre à cette question. Expliquez chaque clause utilisée.</p></div>",
      "questions": [
        {
          "question": "<div style='font-weight: bold; color: #1e293b;'>Requête SQL pour les 5 abonnés les plus âgés de Douala :</div>",
          "reponse": "<pre style='background-color: #1e293b; color: #e2e8f0; padding: 10px; border-radius: 6px; overflow-x: auto; white-space: pre-wrap; word-break: break-word;'><code>SELECT nom, prenom, age\nFROM ABONNES\nWHERE ville = 'Douala'\nORDER BY age DESC\nLIMIT 5;</code></pre><p><strong>Explication des clauses :</strong></p><ul><li><code>SELECT nom, prenom, age</code> : on sélectionne les colonnes qui nous intéressent.</li><li><code>FROM ABONNES</code> : on interroge la table des abonnés.</li><li><code>WHERE ville = 'Douala'</code> : on filtre pour ne garder que les abonnés de Douala.</li><li><code>ORDER BY age DESC</code> : on trie les résultats par âge du plus grand au plus petit.</li><li><code>LIMIT 5</code> : on ne garde que les 5 premiers résultats (les plus âgés).</li></ul>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
