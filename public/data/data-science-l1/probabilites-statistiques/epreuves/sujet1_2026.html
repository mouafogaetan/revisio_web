<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Probabilités et Statistiques - L1",
  "classe": "Licence 1 Data Science",
  "sequence": "Évaluation Séquentielle n°1",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Analyse d'une série statistique univariée",
      "points": "5 pts",
      "enonce": "<div style='font-family: system-ui, -apple-system, sans-serif; line-height: 1.6;'> <p>Dans le cadre d'une étude sur les performances académiques des étudiants en Licence 1 Data Science, on a relevé les notes obtenues à un examen de mathématiques pour un échantillon de 30 étudiants. Les notes sont les suivantes :</p> <div style='background-color: #f8f9fa; padding: 15px; border-radius: 8px; margin: 10px 0; text-align: center; font-family: monospace;'> 12, 15, 10, 8, 14, 16, 11, 9, 13, 17, <br> 10, 12, 14, 15, 8, 11, 13, 16, 9, 12, <br> 14, 10, 15, 11, 13, 8, 12, 16, 14, 11 </div> <p><strong>Consignes :</strong> Analysez cette série statistique en répondant aux questions suivantes.</p> </div>",
      "questions": [
        {
          "question": "<p><strong>1.1</strong> Organisez ces données dans un tableau d'effectifs et de fréquences (en pourcentage). Vous présenterez les notes sous forme de classes d'amplitude 2, en commençant par la classe [8, 10[.</p>",
          "reponse": "<p>Voici le tableau d'effectifs et de fréquences demandé :</p><div style='background-color: #f8f9fa; padding: 15px; border-radius: 8px; margin: 10px 0; overflow-x: auto;'><table style='width: 100%; border-collapse: collapse;'><thead><tr style='background-color: #e9ecef;'><th style='padding: 10px; border: 1px solid #dee2e6; text-align: center;'>Classe</th><th style='padding: 10px; border: 1px solid #dee2e6; text-align: center;'>Effectif (nᵢ)</th><th style='padding: 10px; border: 1px solid #dee2e6; text-align: center;'>Fréquence (fᵢ) en %</th></tr></thead><tbody><tr><td style='padding: 10px; border: 1px solid #dee2e6; text-align: center;'>[8, 10[</td><td style='padding: 10px; border: 1px solid #dee2e6; text-align: center;'>3 (8, 9, 8)</td><td style='padding: 10px; border: 1px solid #dee2e6; text-align: center;'>10%</td></tr><tr style='background-color: #f8f9fa;'><td style='padding: 10px; border: 1px solid #dee2e6; text-align: center;'>[10, 12[</td><td style='padding: 10px; border: 1px solid #dee2e6; text-align: center;'>9</td><td style='padding: 10px; border: 1px solid #dee2e6; text-align: center;'>30%</td></tr><tr><td style='padding: 10px; border: 1px solid #dee2e6; text-align: center;'>[12, 14[</td><td style='padding: 10px; border: 1px solid #dee2e6; text-align: center;'>7</td><td style='padding: 10px; border: 1px solid #dee2e6; text-align: center;'>23,3%</td></tr><tr style='background-color: #f8f9fa;'><td style='padding: 10px; border: 1px solid #dee2e6; text-align: center;'>[14, 16[</td><td style='padding: 10px; border: 1px solid #dee2e6; text-align: center;'>8</td><td style='padding: 10px; border: 1px solid #dee2e6; text-align: center;'>26,7%</td></tr><tr><td style='padding: 10px; border: 1px solid #dee2e6; text-align: center;'>[16, 18[</td><td style='padding: 10px; border: 1px solid #dee2e6; text-align: center;'>3 (16, 17, 16)</td><td style='padding: 10px; border: 1px solid #dee2e6; text-align: center;'>10%</td></tr><tr style='background-color: #e9ecef; font-weight: bold;'><td style='padding: 10px; border: 1px solid #dee2e6; text-align: center;'>Total</td><td style='padding: 10px; border: 1px solid #dee2e6; text-align: center;'>30</td><td style='padding: 10px; border: 1px solid #dee2e6; text-align: center;'>100%</td></tr></tbody></table></div>"
        },
        {
          "question": "<p><strong>1.2</strong> Calculez les indicateurs de position suivants : la moyenne, la médiane et le mode de cette série.</p>",
          "reponse": "<ul style='list-style-type: none; padding-left: 0;'><li><strong>Moyenne (x̄) :</strong> <div class='math-block' style='background-color: #f8f9fa; padding: 10px; border-radius: 6px; margin: 10px 0;'><div class='math'>$$ \\bar{x} = \\frac{12+15+10+8+14+16+11+9+13+17+10+12+14+15+8+11+13+16+9+12+14+10+15+11+13+8+12+16+14+11}{30} = \\frac{371}{30} \\approx 12,37 $$</div></div></li><li><strong>Médiane (Me) :</strong> <p>Les données étant déjà organisées, la médiane est la moyenne des 15e et 16e valeurs. La série ordonnée donne 12 et 12, donc <strong>Me = 12</strong>.</p></li><li><strong>Mode :</strong> <p>La note qui apparaît le plus souvent est 12 (présente 4 fois). Le mode est donc <strong>12</strong>.</p></li></ul>"
        },
        {
          "question": "<p><strong>1.3</strong> Calculez les indicateurs de dispersion : la variance, l'écart-type et l'étendue.</p>",
          "reponse": "<ul style='list-style-type: none; padding-left: 0;'><li><strong>Variance (V) :</strong> <div class='math-block' style='background-color: #f8f9fa; padding: 10px; border-radius: 6px; margin: 10px 0;'><div class='math'>$$ V = \\frac{1}{30} \\sum_{i=1}^{30} (x_i - \\bar{x})^2 \\approx \\frac{1}{30} \\times 194,17 \\approx 6,47 $$</div></div></li><li><strong>Écart-type (σ) :</strong> <div class='math-block' style='background-color: #f8f9fa; padding: 10px; border-radius: 6px; margin: 10px 0;'><div class='math'>$$ \\sigma = \\sqrt{V} \\approx \\sqrt{6,47} \\approx 2,54 $$</div></div></li><li><strong>Étendue :</strong> <p>La différence entre la note maximale et la note minimale : <strong>17 - 8 = 9</strong>.</p></li></ul>"
        },
        {
          "question": "<p><strong>1.4</strong> Quels sont les quartiles Q1 et Q3 ? Que représentent-ils dans ce contexte ?</p>",
          "reponse": "<p>Pour la série ordonnée :</p><ul style='list-style-type: none; padding-left: 0;'><li><strong>Q1 :</strong> 25% des notes sont inférieures ou égales à 10.</li><li><strong>Q3 :</strong> 75% des notes sont inférieures ou égales à 14.</li></ul><p>Ces quartiles indiquent que la moitié centrale des étudiants (de Q1 à Q3) a obtenu une note comprise entre 10 et 14.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Statistiques descriptives bivariées et régression linéaire",
      "points": "6 pts",
      "enonce": "<div style='font-family: system-ui, -apple-system, sans-serif; line-height: 1.6;'> <p>Un statisticien souhaite étudier la relation entre le nombre d'heures de révision (X) et la note obtenue à un examen (Y) pour un échantillon de 8 étudiants. Les données sont les suivantes :</p> <div style='background-color: #f8f9fa; padding: 15px; border-radius: 8px; margin: 10px 0; overflow-x: auto;'><table style='width: 100%; border-collapse: collapse;'><thead><tr style='background-color: #e9ecef;'><th style='padding: 10px; border: 1px solid #dee2e6; text-align: center;'>Étudiant</th><th style='padding: 10px; border: 1px solid #dee2e6; text-align: center;'>Heures (X)</th><th style='padding: 10px; border: 1px solid #dee2e6; text-align: center;'>Note (Y)</th></tr></thead><tbody><tr><td style='padding: 10px; border: 1px solid #dee2e6; text-align: center;'>1</td><td style='padding: 10px; border: 1px solid #dee2e6; text-align: center;'>2</td><td style='padding: 10px; border: 1px solid #dee2e6; text-align: center;'>8</td></tr><tr style='background-color: #f8f9fa;'><td style='padding: 10px; border: 1px solid #dee2e6; text-align: center;'>2</td><td style='padding: 10px; border: 1px solid #dee2e6; text-align: center;'>3</td><td style='padding: 10px; border: 1px solid #dee2e6; text-align: center;'>9</td></tr><tr><td style='padding: 10px; border: 1px solid #dee2e6; text-align: center;'>3</td><td style='padding: 10px; border: 1px solid #dee2e6; text-align: center;'>4</td><td style='padding: 10px; border: 1px solid #dee2e6; text-align: center;'>10</td></tr><tr style='background-color: #f8f9fa;'><td style='padding: 10px; border: 1px solid #dee2e6; text-align: center;'>4</td><td style='padding: 10px; border: 1px solid #dee2e6; text-align: center;'>5</td><td style='padding: 10px; border: 1px solid #dee2e6; text-align: center;'>12</td></tr><tr><td style='padding: 10px; border: 1px solid #dee2e6; text-align: center;'>5</td><td style='padding: 10px; border: 1px solid #dee2e6; text-align: center;'>6</td><td style='padding: 10px; border: 1px solid #dee2e6; text-align: center;'>13</td></tr><tr style='background-color: #f8f9fa;'><td style='padding: 10px; border: 1px solid #dee2e6; text-align: center;'>6</td><td style='padding: 10px; border: 1px solid #dee2e6; text-align: center;'>7</td><td style='padding: 10px; border: 1px solid #dee2e6; text-align: center;'>14</td></tr><tr><td style='padding: 10px; border: 1px solid #dee2e6; text-align: center;'>7</td><td style='padding: 10px; border: 1px solid #dee2e6; text-align: center;'>8</td><td style='padding: 10px; border: 1px solid #dee2e6; text-align: center;'>15</td></tr><tr style='background-color: #f8f9fa;'><td style='padding: 10px; border: 1px solid #dee2e6; text-align: center;'>8</td><td style='padding: 10px; border: 1px solid #dee2e6; text-align: center;'>9</td><td style='padding: 10px; border: 1px solid #dee2e6; text-align: center;'>16</td></tr></tbody></table></div> </div>",
      "questions": [
        {
          "question": "<p><strong>2.1</strong> Représentez le nuage de points de cette série double.</p>",
          "reponse": "<p>Le nuage de points est une représentation graphique où chaque point (X, Y) correspond à un étudiant. Ici, on observe une tendance linéaire croissante : plus les heures de révision augmentent, plus la note a tendance à être élevée.</p><div style='background-color: #e9ecef; padding: 10px; border-radius: 6px; text-align: center;'>[Placeholder pour la représentation graphique du nuage de points]</div>"
        },
        {
          "question": "<p><strong>2.2</strong> Calculez la covariance et le coefficient de corrélation linéaire entre X et Y. Interprétez ce coefficient.</p>",
          "reponse": "<p>Les calculs intermédiaires donnent :</p><ul style='list-style-type: none; padding-left: 0;'><li><strong>Covariance (Cov(X, Y)) :</strong> <div class='math-block' style='background-color: #f8f9fa; padding: 10px; border-radius: 6px; margin: 10px 0;'><div class='math'>$$ \\text{Cov}(X, Y) = \\frac{1}{n} \\sum_{i=1}^{n} (x_i - \\bar{x})(y_i - \\bar{y}) = \\frac{42}{8} = 5,25 $$</div></div></li><li><strong>Coefficient de corrélation (r) :</strong> <div class='math-block' style='background-color: #f8f9fa; padding: 10px; border-radius: 6px; margin: 10px 0;'><div class='math'>$$ r = \\frac{\\text{Cov}(X, Y)}{\\sigma_x \\sigma_y} = \\frac{5,25}{2,29 \\times 2,69} \\approx 0,85 $$</div></div></li></ul><p>Le coefficient <strong>r ≈ 0,85</strong> indique une forte corrélation positive entre les heures de révision et la note obtenue.</p>"
        },
        {

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
