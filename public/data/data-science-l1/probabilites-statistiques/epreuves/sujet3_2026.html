<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Probabilités et Statistiques - L1",
  "classe": "Licence 1 Data Science",
  "sequence": "Séquence 3",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Statistiques Descriptives et Analyse Bivariée (5 pts)",
      "points": "5 pts",
      "enonce": "<div style='font-size: 1.1em; line-height: 1.6; color: #333; background: #f9f9f9; padding: 15px; border-radius: 8px;'> Le tableau suivant présente les notes en Mathématiques (X) et en Statistiques (Y) de 8 étudiants de la Licence 1 Data Science : </div> <table style='border-collapse: collapse; width: 100%; max-width: 400px; margin: 10px auto; font-size: 0.9em;'><tr style='background: #e0e0e0;'><th style='border: 1px solid #999; padding: 6px;'>Étudiant</th><th style='border: 1px solid #999; padding: 6px;'>X (Maths)</th><th style='border: 1px solid #999; padding: 6px;'>Y (Stats)</th></tr><tr><td style='border: 1px solid #999; padding: 6px;'>1</td><td style='border: 1px solid #999; padding: 6px;'>8</td><td style='border: 1px solid #999; padding: 6px;'>10</td></tr><tr><td style='border: 1px solid #999; padding: 6px;'>2</td><td style='border: 1px solid #999; padding: 6px;'>10</td><td style='border: 1px solid #999; padding: 6px;'>12</td></tr><tr><td style='border: 1px solid #999; padding: 6px;'>3</td><td style='border: 1px solid #999; padding: 6px;'>12</td><td style='border: 1px solid #999; padding: 6px;'>14</td></tr><tr><td style='border: 1px solid #999; padding: 6px;'>4</td><td style='border: 1px solid #999; padding: 6px;'>14</td><td style='border: 1px solid #999; padding: 6px;'>16</td></tr><tr><td style='border: 1px solid #999; padding: 6px;'>5</td><td style='border: 1px solid #999; padding: 6px;'>16</td><td style='border: 1px solid #999; padding: 6px;'>18</td></tr><tr><td style='border: 1px solid #999; padding: 6px;'>6</td><td style='border: 1px solid #999; padding: 6px;'>18</td><td style='border: 1px solid #999; padding: 6px;'>17</td></tr><tr><td style='border: 1px solid #999; padding: 6px;'>7</td><td style='border: 1px solid #999; padding: 6px;'>20</td><td style='border: 1px solid #999; padding: 6px;'>20</td></tr><tr><td style='border: 1px solid #999; padding: 6px;'>8</td><td style='border: 1px solid #999; padding: 6px;'>22</td><td style='border: 1px solid #999; padding: 6px;'>19</td></tr></table>",
      "questions": [
        {
          "question": "<div style='margin: 10px 0;'><strong>1.1 (1 pt)</strong> Calculer la moyenne et l'écart-type des notes en Mathématiques.</div>",
          "reponse": "<div style='background: #e8f5e9; padding: 10px; border-radius: 5px; color: #2e7d32;'> Moyenne de X : <span class='math'>\\( \\bar{x} = \\frac{8+10+12+14+16+18+20+22}{8} = \\frac{120}{8} = 15 \\)</span><br> Écart-type de X : <span class='math'>\\( \\sigma_x = \\sqrt{\\frac{\\sum (x_i - \\bar{x})^2}{n}} = \\sqrt{\\frac{(-7)^2+(-5)^2+(-3)^2+(-1)^2+1^2+3^2+5^2+7^2}{8}} = \\sqrt{\\frac{168}{8}} = \\sqrt{21} \\approx 4.58 \\)</span> </div>"
        },
        {
          "question": "<div style='margin: 10px 0;'><strong>1.2 (1.5 pts)</strong> Calculer le coefficient de corrélation linéaire entre X et Y. Interpréter le résultat.</div>",
          "reponse": "<div style='background: #e8f5e9; padding: 10px; border-radius: 5px; color: #2e7d32;'> On a <span class='math'>\\( \\sum x = 120 \\)</span>, <span class='math'>\\( \\sum y = 126 \\)</span>, <span class='math'>\\( \\sum x^2 = 2048 \\)</span>, <span class='math'>\\( \\sum y^2 = 2154 \\)</span>, <span class='math'>\\( \\sum xy = 2060 \\)</span> <br> Covariance : <span class='math'>\\( \\operatorname{Cov}(X,Y) = \\frac{2060}{8} - 15 \\times 15.75 = 257.5 - 236.25 = 21.25 \\)</span> <br> Variance de X : <span class='math'>\\( V(X) = 21 \\)</span><br> Variance de Y : <span class='math'>\\( V(Y) = \\frac{2154}{8} - 15.75^2 = 269.25 - 248.0625 = 21.1875 \\)</span><br> Coefficient de corrélation : <span class='math'>\\( r = \\frac{21.25}{\\sqrt{21 \\times 21.1875}} = \\frac{21.25}{\\sqrt{444.9375}} \\approx \\frac{21.25}{21.09} \\approx 1.008 \\)</span> (approximativement 1)<br> <strong>Interprétation :</strong> Il existe une très forte corrélation positive presque parfaite entre les notes de Mathématiques et de Statistiques. </div>"
        },
        {
          "question": "<div style='margin: 10px 0;'><strong>1.3 (1.5 pts)</strong> Déterminer l'équation de la droite de régression de Y en X par la méthode des moindres carrés.</div>",
          "reponse": "<div style='background: #e8f5e9; padding: 10px; border-radius: 5px; color: #2e7d32;'> Droite de régression : <span class='math'>\\( y = ax + b \\)</span> <br> <span class='math'>\\( a = \\frac{\\operatorname{Cov}(X,Y)}{V(X)} = \\frac{21.25}{21} \\approx 1.012 \\)</span> <br> <span class='math'>\\( b = \\bar{y} - a\\bar{x} = 15.75 - 1.012 \\times 15 = 15.75 - 15.18 = 0.57 \\)</span> <br> Équation : <span class='math'>\\( y = 1.012x + 0.57 \\)</span> </div>"
        },
        {
          "question": "<div style='margin: 10px 0;'><strong>1.4 (1 pt)</strong> Un étudiant a obtenu 15 en Mathématiques. Estimer sa note en Statistiques à l'aide de la droite de régression.</div>",
          "reponse": "<div style='background: #e8f5e9; padding: 10px; border-radius: 5px; color: #2e7d32;'> <span class='math'>\\( y = 1.012 \\times 15 + 0.57 = 15.18 + 0.57 = 15.75 \\)</span> <br> La note estimée en Statistiques est d'environ 15.75 sur 20. </div>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Probabilités et Lois de Probabilité (6 pts)",
      "points": "6 pts",
      "enonce": "<div style='font-size: 1.1em; line-height: 1.6; color: #333; background: #f9f9f9; padding: 15px; border-radius: 8px;'> Dans une usine de Yaoundé, la probabilité qu'une pièce produite soit défectueuse est de 5%. On prélève un échantillon de 20 pièces. On note X le nombre de pièces défectueuses dans l'échantillon. </div>",
      "questions": [
        {
          "question": "<div style='margin: 10px 0;'><strong>2.1 (1 pt)</strong> Quelle est la loi de probabilité de X ? Justifier votre réponse.</div>",
          "reponse": "<div style='background: #e8f5e9; padding: 10px; border-radius: 5px; color: #2e7d32;'> X suit une loi binomiale de paramètres n = 20 et p = 0.05, notée <span class='math'>\\( X \\sim B(20 ; 0.05) \\)</span>. <br> <strong>Justification :</strong> On répète 20 fois de manière indépendante une épreuve de Bernoulli (une pièce est défectueuse ou non) avec une probabilité de succès constante p = 0.05. </div>"
        },
        {
          "question": "<div style='margin: 10px 0;'><strong>2.2 (1 pt)</strong> Calculer l'espérance et la variance de X.</div>",
          "reponse": "<div style='background: #e8f5e9; padding: 10px; border-radius: 5px; color: #2e7d32;'> Espérance : <span class='math'>\\( E(X) = n \\times p = 20 \\times 0.05 = 1 \\)</span> <br> Variance : <span class='math'>\\( V(X) = n \\times p \\times (1-p) = 20 \\times 0.05 \\times 0.95 = 0.95 \\)</span> <br> Écart-type : <span class='math'>\\( \\sigma(X) = \\sqrt{0.95} \\approx 0.975 \\)</span> </div>"
        },
        {
          "question": "<div style='margin: 10px 0;'><strong>2.3 (1.5 pts)</strong> Calculer la probabilité qu'il y ait exactement 2 pièces défectueuses dans l'échantillon.</div>",
          "reponse": "<div style='background: #e8f5e9; padding: 10px; border-radius: 5px; color: #2e7d32;'> <span class='math'>\\( P(X = 2) = \\binom{20}{2} (0.05)^2 (0.95)^{18} \\)</span> <br> <span class='math'>\\( = 190 \\times 0.0025 \\times 0.3972 \\approx 0.1887 \\)</span> <br> La probabilité qu'il y ait exactement 2 pièces défectueuses est d'environ 18.9%. </div>"
        },
        {
          "question": "<div style='margin: 10px 0;'><strong>2.4 (1.5 pts)</strong> Calculer la probabilité qu'il y ait au moins une pièce défectueuse.</div>",
          "reponse": "<div style='background: #e8f5e9; padding: 10px; border-radius: 5px; color: #2e7d32;'> <span class='math'>\\( P(X \\geq 1) = 1 - P(X = 0) = 1 - \\binom{20}{0} (0.05)^0 (0.95)^{20} \\)</span> <br> <span class='math'>\\( = 1 - 0.95^{20} \\approx 1 - 0.3585 = 0.6415 \\)</span> <br> La probabilité d'avoir au moins une pièce défectueuse est d'environ 64.2%. </div>"
        },
        {
          "question": "<div style='margin: 10px 0;'><strong>2.5 (1 pt)</strong> Donner une approximation de la probabilité <span class='math'>\\( P(X = 2) \\)</span> par la loi de Poisson. Commenter la qualité de l'approximation.</div>",
          "reponse": "<div style='background: #e8f5e9; padding: 10px; border-radius: 5px; color: #2e7d32;'> On approche par une loi de Poisson de paramètre <span class='math'>\\( \\lambda = n \\times p = 1 \\)</span>. <br> <span class='math'>\\( P(X = 2) \\approx \\frac{e^{-1} \\times 1^2}{2!} = \\frac{e^{-1}}{2} \\approx 0.1839 \\)</span> <br> L'approximation est bonne (0.1839 contre 0.1887) car n est grand (20) et p est petit (0.05). </div>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Estimation et Intervalle de Confiance (5 pts)",
      "points": "5 pts",
      "enonce": "<div style='font-size: 1.1em; line-height: 1.6; color: #333; background: #f9f9f9; padding: 15px; border-radius: 8px;'> Un institut de sondage souhaite estimer la proportion d'électeurs favorables à un candidat lors d'une élection à Douala. Il interroge un échantillon aléatoire de 400 personnes. Parmi elles, 220 déclarent voter pour ce candidat. </div>",
      "questions": [
        {
          "question": "<div style='margin: 10px 0;'><strong>3.1 (1 pt)</strong> Calculer la proportion observée <span class='math'>\\( \\hat{p} \\)</span> dans l'échantillon.</div>",
          "reponse": "<div style='background: #e8f5e9; padding: 10px; border-radius: 5px; color: #2e7d32;'> <span class='math'>\\( \\hat{p} = \\frac{220}{400} = 0.55 \\)</span> <br> 55% des personnes interrogées sont favorables au candidat. </div>"
        },
        {
          "question": "<div style='margin: 10px 0;'><strong>3.2 (2 pts)</strong> Construire un intervalle de confiance à 95% pour la proportion réelle p d'électeurs favorables au candidat. On rappelle que <span class='math'>\\( z_{0.025} = 1.96 \\)</span>.</div>",
          "reponse": "<div style='background: #e8f5e9; padding: 10px; border-radius: 5px; color: #2e7d32;'> Formule : <span class='math'>\\( \\hat{p} \\pm z_{\\alpha/2} \\sqrt{\\frac{\\hat{p}(1-\\hat{p})}{n}} \\)</span> <br> <span class='math'>\\( \\hat{p} = 0.55 \\)</span>, <span class='math'>\\( n = 400 \\)</span> <br> <span class='math'>\\( \\sqrt{\\frac{0.55 \\times 0.45}{400}} = \\sqrt{\\frac{0.2475}{400}} = \\sqrt{0.00061875} \\approx 0.0249 \\)</span> <br> Marge d'erreur : <span class='math'>\\( 1.96 \\times 0.0249 \\approx 0.0488 \\)</span> <br> Intervalle de confiance : <span class='math'>\\( [0.55 - 0.0488 \\, ; \\, 0.55 + 0.0488] = [0.5012 \\, ; \\, 0.5988] \\)</span> <br> Au niveau de confiance de 95%, la proportion réelle d'électeurs favorables est comprise entre 50.1% et 59.9%. </div>"
        },
        {
          "question": "<div style='margin: 10px 0;'><strong>3.3 (1.5 pts)</strong> Interpréter l'intervalle de confiance obtenu dans le contexte de l'exercice.</div>",
          "reponse": "<div style='background: #e8f5e9; padding: 10px; border-radius: 5px; color: #2e7d32;'> On peut dire avec un niveau de confiance de 95% que la proportion réelle d'électeurs favorables au candidat dans la population se situe entre 50.1% et 59.9%. <br> Cela signifie que si l'on répétait cette enquête un grand nombre de fois, environ 95% des intervalles de confiance construits contiendraient la vraie proportion. </div>"
        },
        {
          "question": "<div style='margin: 10px 0;'><strong>3.4 (0.5 pt)</strong> Que faudrait-il faire pour obtenir un intervalle de confiance plus précis (plus étroit) ?</div>",
          "reponse": "<div style='background: #e8f5e9; padding: 10px; border-radius: 5px; color: #2e7d32;'> Pour obtenir un intervalle de confiance plus précis (plus étroit), il faudrait augmenter la taille de l'échantillon. <br> On peut également diminuer le niveau de confiance (par exemple 90% au lieu de 95%), mais cela se fait au détriment de la fiabilité de l'estimation. </div>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Test d'Hypothèses (4 pts)",
      "points": "4 pts",
      "enonce": "<div style='font-size: 1.1em; line-height: 1.6; color: #333; background: #f9f9f9; padding: 15px; border-radius: 8px;'> Une entreprise affirme que la durée de vie moyenne de ses ampoules est de 1000 heures. Un contrôleur qualité prélève un échantillon de 50 ampoules et obtient une durée de vie moyenne de 980 heures avec un écart-type de 80 heures. Au seuil de signification <span class='math'>\\( \\alpha = 5\\% \\)</span>, peut-on remettre en cause l'affirmation de l'entreprise ? </div>",
      "questions": [
        {
          "question": "<div style='margin: 10px 0;'><strong>4.1 (1 pt)</strong> Formuler les hypothèses <span class='math'>\\( H_0 \\)</span> et <span class='math'>\\( H_1 \\)</span> du test.</div>",
          "reponse": "<div style='background: #e8f5e9; padding: 10px; border-radius: 5px; color: #2e7d32;'> <span class='math'>\\( H_0 : \\mu = 1000 \\)</span> (la durée de vie moyenne est de 1000 heures) <br> <span class='math'>\\( H_1 : \\mu \\neq 1000 \\)</span> (la durée de vie moyenne est différente de 1000 heures) <br> Le test est bilatéral car on veut vérifier si la durée de vie est différente de 1000 heures (supérieure ou inférieure). </div>"
        },
        {
          "question": "<div style='margin: 10px 0;'><strong>4.2 (1.5 pts)</strong> Calculer la statistique de test. On rappelle que la variance est inconnue.</div>",
          "reponse": "<div style='background: #e8f5e9; padding: 10px; border-radius: 5px; color: #2e7d32;'> La variance est inconnue, on utilise donc la loi de Student. <br> <span class='math'>\\( t = \\frac{\\bar{x} - \\mu_0}{s / \\sqrt{n}} = \\frac{980 - 1000}{80 / \\sqrt{50}} = \\frac{-20}{80 / 7.071} = \\frac{-20}{11.31} \\approx -1.77 \\)</span> <br> La statistique de test est <span class='math'>\\( t \\approx -1.77 \\)</span> avec <span class='math'>\\( n-1 = 49 \\)</span> degrés de liberté. </div>"
        },
        {
          "question": "<div style='margin: 10px 0;'><strong>4.3 (1 pt)</strong> Déterminer la région critique du test au seuil <span class='math'>\\( \\alpha = 5\\% \\)</span>. On donne <span class='math'>\\( t_{0.025 ; 49} \\approx 2.01 \\)</span>.</div>",
          "reponse": "<div style='background: #e8f5e9; padding: 10px; border-radius: 5px; color: #2e7d32;'> Pour un test bilatéral au seuil <span class='math'>\\( \\alpha = 5\\% \\)</span>, la région critique est : <br> <span class='math'>\\( |t| > t_{\\alpha/2 ; n-1} = t_{0.025 ; 49} \\approx 2.01 \\)</span> <br> On rejette <span class='math'>\\( H_0 \\)</span> si <span class='math'>\\( t < -2.01 \\)</span> ou <span class='math'>\\( t > 2.01 \\)</span>. </div>"
        },
        {
          "question": "<div style='margin: 10px 0;'><strong>4.4 (0.5 pt)</strong> Conclure le test.</div>",
          "reponse": "<div style='background: #e8f5e9; padding: 10px; border-radius: 5px; color: #2e7d32;'> La statistique de test <span class='math'>\\( t \\approx -1.77 \\)</span> n'est pas dans la région critique (elle est comprise entre -2.01 et 2.01). <br> <strong>Conclusion :</strong> On ne rejette pas <span class='math'>\\( H_0 \\)</span> au seuil de 5%. Les données ne permettent pas de remettre en cause l'affirmation de l'entreprise. </div>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
