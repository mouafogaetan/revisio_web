<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Probabilités et Statistiques - L1",
  "classe": "Licence 1 Data Science",
  "sequence": "Séquence 4",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Processus de Poisson - Gestion de la clientèle",
      "points": "5 pts",
      "enonce": "<div style='padding: 15px; color: #1a1a1a;'><p>Un centre d'appels reçoit des appels selon un processus de Poisson d'intensité \( \lambda = 4 \) appels par heure. Pour une étude de la charge de travail, on s'intéresse au nombre d'appels reçus sur différentes périodes.</p></div>",
      "questions": [
        {
          "question": "<div style='margin-bottom: 10px;'><strong>1.</strong> Calculer la probabilité de recevoir exactement 3 appels en une heure.</div>",
          "reponse": "<div>La variable aléatoire \(N(1)\), représentant le nombre d'appels en 1 heure, suit une loi de Poisson de paramètre \(\lambda = 4\). <br>\( \mathbb{P}(N(1) = 3) = \frac{e^{-4} \cdot 4^3}{3!} = \frac{e^{-4} \cdot 64}{6} \approx 0.1954 \).<br>La probabilité est d'environ 19.5%.</div>"
        },
        {
          "question": "<div style='margin-bottom: 10px;'><strong>2.</strong> Calculer la probabilité de recevoir moins de 2 appels en une demi-heure.</div>",
          "reponse": "<div>Pour une demi-heure, \(t = 0.5\) heures, le paramètre est \(\lambda t = 4 \times 0.5 = 2\).<br>\( \mathbb{P}(N(0.5) < 2) = \mathbb{P}(N(0.5) = 0) + \mathbb{P}(N(0.5) = 1) \).<br>\( = \frac{e^{-2} \cdot 2^0}{0!} + \frac{e^{-2} \cdot 2^1}{1!} = e^{-2} + 2e^{-2} = 3e^{-2} \approx 0.406 \).<br>La probabilité est d'environ 40.6%.</div>"
        },
        {
          "question": "<div style='margin-bottom: 10px;'><strong>3.</strong> Quel est le temps moyen entre deux appels successifs ?</div>",
          "reponse": "<div>Le temps d'attente entre deux appels \(T\) suit une loi exponentielle de paramètre \(\lambda = 4\).<br>L'espérance de \(T\) est \( \mathbb{E}(T) = \frac{1}{\lambda} = \frac{1}{4} \) heure = 15 minutes.<br>Le temps moyen entre deux appels est de 15 minutes.</div>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Application du Processus de Poisson à la fiabilité",
      "points": "6 pts",
      "enonce": "<div style='padding: 15px; color: #1a1a1a;'><p>Une machine dans une usine tombe en panne selon un processus de Poisson d'intensité \( \lambda = 0.5 \) pannes par jour. La maintenance intervient pour réparer les pannes.</p></div>",
      "questions": [
        {
          "question": "<div style='margin-bottom: 10px;'><strong>1.</strong> Quelle est la probabilité qu'il n'y ait aucune panne pendant une semaine (7 jours) ?</div>",
          "reponse": "<div>Le paramètre pour 7 jours est \(\lambda t = 0.5 \times 7 = 3.5\).<br>\( \mathbb{P}(N(7) = 0) = \frac{e^{-3.5} \cdot 3.5^0}{0!} = e^{-3.5} \approx 0.0302 \).<br>La probabilité est d'environ 3.0%.</div>"
        },
        {
          "question": "<div style='margin-bottom: 10px;'><strong>2.</strong> Déterminer la probabilité d'observer au moins 3 pannes en une semaine.</div>",
          "reponse": "<div>\( \mathbb{P}(N(7) \ge 3) = 1 - \mathbb{P}(N(7) \le 2) \).<br>\( \mathbb{P}(N(7) \le 2) = e^{-3.5} \left(1 + 3.5 + \frac{3.5^2}{2}\right) = e^{-3.5} \left(1 + 3.5 + 6.125\right) = 10.625 e^{-3.5} \approx 0.3208 \).<br>Donc \( \mathbb{P}(N(7) \ge 3) \approx 1 - 0.3208 = 0.6792 \).<br>La probabilité est d'environ 67.9%.</div>"
        },
        {
          "question": "<div style='margin-bottom: 10px;'><strong>3.</strong> Calculer le temps \( t \) (en jours) pour que la probabilité d'observer au moins une panne soit égale à 0.95.</div>",
          "reponse": "<div>On cherche \(t\) tel que \( \mathbb{P}(N(t) \ge 1) = 1 - \mathbb{P}(N(t) = 0) = 0.95 \).<br>\( \mathbb{P}(N(t) = 0) = e^{-0.5t} = 0.05 \).<br>En prenant le logarithme : \( -0.5t = \ln(0.05) \).<br>\( t = \frac{\ln(0.05)}{-0.5} \approx \frac{-2.9957}{-0.5} \approx 5.99 \) jours.<br>Il faut environ 6 jours pour avoir 95% de chance d'observer au moins une panne.</div>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Étude comparative",
      "points": "9 pts",
      "enonce": "<div style='padding: 15px; color: #1a1a1a;'><p>Deux compagnies de transport, A et B, gèrent chacune une flotte de bus. Le nombre de retards par jour à une gare routière suit un processus de Poisson. Pour la compagnie A, l'intensité est de \( \lambda_A = 2 \) retards par jour, et pour la compagnie B, elle est de \( \lambda_B = 3 \) retards par jour.</p></div>",
      "questions": [
        {
          "question": "<div style='margin-bottom: 10px;'><strong>1.</strong> On considère la compagnie A. Calculer la probabilité qu'il y ait exactement 2 retards en une journée.</div>",
          "reponse": "<div>Pour la compagnie A, \( \lambda_A = 2 \).<br>\( \mathbb{P}(N_A(1) = 2) = \frac{e^{-2} \cdot 2^2}{2!} = \frac{4e^{-2}}{2} = 2e^{-2} \approx 0.2707 \).<br>La probabilité est d'environ 27.1%.</div>"
        },
        {
          "question": "<div style='margin-bottom: 10px;'><strong>2.</strong> La compagnie B affirme que la probabilité d'avoir plus de 5 retards en une journée est inférieure à 10%. Vérifiez cette affirmation.</div>",
          "reponse": "<div>Pour la compagnie B, \( \lambda_B = 3 \).<br>\( \mathbb{P}(N_B(1) > 5) = 1 - \mathbb{P}(N_B(1) \le 5) \).<br>\( \mathbb{P}(N_B(1) \le 5) = e^{-3} \sum_{k=0}^{5} \frac{3^k}{k!} = e^{-3} \left(1 + 3 + \frac{9}{2} + \frac{27}{6} + \frac{81}{24} + \frac{243}{120}\right) \).<br>\( = e^{-3} \left(1 + 3 + 4.5 + 4.5 + 3.375 + 2.025\right) = 18.4 e^{-3} \approx 0.9161 \).<br>Donc \( \mathbb{P}(N_B(1) > 5) \approx 1 - 0.9161 = 0.0839 \).<br>L'affirmation est vraie : la probabilité est d'environ 8.4%, inférieure à 10%.</div>"
        },
        {
          "question": "<div style='margin-bottom: 10px;'><strong>3.</strong> On s'intéresse au nombre total de retards des deux compagnies (processus de Poisson superposé). a) Quelle est l'intensité de ce nouveau processus ? b) Calculer la probabilité d'observer plus de 4 retards en une journée.</div>",
          "reponse": "<div>a) La superposition de deux processus de Poisson indépendants d'intensités \(\lambda_A\) et \(\lambda_B\) est un processus de Poisson d'intensité \(\lambda = \lambda_A + \lambda_B = 2 + 3 = 5\).<br><br>b) Pour \(\lambda = 5\) :<br>\( \mathbb{P}(N(1) > 4) = 1 - \mathbb{P}(N(1) \le 4) \).<br>\( \mathbb{P}(N(1) \le 4) = e^{-5} \sum_{k=0}^{4} \frac{5^k}{k!} = e^{-5} \left(1 + 5 + \frac{25}{2} + \frac{125}{6} + \frac{625}{24}\right) \).<br>\( = e^{-5} \left(1 + 5 + 12.5 + 20.833 + 26.042\right) = 65.375 e^{-5} \approx 0.4405 \).<br>Donc \( \mathbb{P}(N(1) > 4) \approx 1 - 0.4405 = 0.5595 \).<br>La probabilité est d'environ 55.95%.</div>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
