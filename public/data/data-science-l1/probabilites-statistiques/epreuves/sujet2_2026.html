<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Probabilités et Statistiques - L1",
  "classe": "Licence 1 Data Science",
  "sequence": "Séquence 2",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Test de comparaison de moyennes (Z-test)",
      "points": "4 pts",
      "enonce": "<p style='color: #333; font-size: 1.1em;'>Une entreprise de production d'huile de palme affirme que le volume moyen de ses bidons de 5L est de 5000 ml. Pour vérifier cette affirmation, un contrôleur qualité prélève un échantillon de 40 bidons. Il obtient une moyenne de 4990 ml avec un écart-type de 15 ml. On suppose que la production suit une loi normale et on connaît l'écart-type de la population qui est de 15 ml.</p>",
      "questions": [
        {
          "question": "<p><strong>1. a)</strong> Formuler les hypothèses <strong>H₀</strong> et <strong>H₁</strong> pour tester si le volume moyen est différent de 5000 ml. (Bloom : Comprendre - 1 pt)</p>",
          "reponse": "<p><strong>H₀ :</strong> μ = 5000 ml (le volume moyen est égal à 5000 ml).</p><p><strong>H₁ :</strong> μ ≠ 5000 ml (le volume moyen est différent de 5000 ml).</p>"
        },
        {
          "question": "<p><strong>1. b)</strong> Calculer la valeur de la statistique de test Z. (Bloom : Appliquer - 1.5 pts)</p>",
          "reponse": "<p>La statistique de test pour un test Z est :</p><div class='math-block' style='background-color: #f0f4f8; padding: 10px; border-radius: 8px; text-align: center; margin: 10px 0;'><div class='math' style='font-size: 1.1em;'>$$ Z = \\frac{\\bar{x} - \\mu_0}{\\sigma / \\sqrt{n}} $$</div></div><p>Application numérique :</p><p>$Z = \\frac{4990 - 5000}{15 / \\sqrt{40}} = \\frac{-10}{15 / 6.3249} = \\frac{-10}{2.3717} \\approx -4.22$</p>"
        },
        {
          "question": "<p><strong>1. c)</strong> Déterminer la p-value associée à ce test bilatéral. En déduire si l'on rejette <strong>H₀</strong> au seuil de signification α = 5%. (Bloom : Analyser - 1.5 pts)</p>",
          "reponse": "<p>Pour un test bilatéral, la p-value est : $2 \\times P(Z \\leq -4.22)$.</p><p>D'après la table de la loi normale centrée réduite, $P(Z \\leq -4.22) \\approx 0.000012$.</p><p>La p-value est donc : $2 \\times 0.000012 = 0.000024$.</p><p>La p-value (0.000024) étant très inférieure à α = 0.05, on rejette <strong>H₀</strong>.</p><p>On conclut qu'il y a une différence significative entre le volume moyen observé sur l'échantillon et la valeur de 5000 ml annoncée par l'entreprise.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Test de comparaison de proportions",
      "points": "3 pts",
      "enonce": "<p style='color: #333; font-size: 1.1em;'>Dans une grande ville camerounaise, on souhaite savoir si la proportion de personnes favorables à un nouveau projet d'urbanisme a augmenté depuis l'organisation d'une grande campagne de sensibilisation. Avant la campagne, un sondage réalisé sur 600 personnes avait donné 45% de favorables. Après la campagne, un nouveau sondage effectué sur 800 personnes montre que 416 d'entre elles sont favorables.</p>",
      "questions": [
        {
          "question": "<p><strong>2. a)</strong> Définir les hypothèses nulle et alternative pour ce test. (Bloom : Comprendre - 0.5 pt)</p>",
          "reponse": "<p>Soient p₁ la proportion avant la campagne et p₂ la proportion après la campagne.</p><p><strong>H₀ :</strong> p₁ = p₂ (la proportion n'a pas changé).</p><p><strong>H₁ :</strong> p₁ < p₂ (la proportion a augmenté après la campagne).</p>"
        },
        {
          "question": "<p><strong>2. b)</strong> Calculer la proportion observée après la campagne $\\hat{p}_2$ et la proportion commune $\\hat{p}$ sous l'hypothèse nulle. (Bloom : Appliquer - 1 pt)</p>",
          "reponse": "<p>$\\hat{p}_2 = \\frac{416}{800} = 0.52$.</p><p>La proportion avant la campagne est $p_1 = 0.45$.</p><p>La proportion commune est :</p><p>$\\hat{p} = \\frac{600 \\times 0.45 + 800 \\times 0.52}{600 + 800} = \\frac{270 + 416}{1400} = \\frac{686}{1400} = 0.49$.</p>"
        },
        {
          "question": "<p><strong>2. c)</strong> Calculer la statistique de test et la p-value. Conclure au seuil de 5%. (Bloom : Évaluer - 1.5 pts)</p>",
          "reponse": "<p>La statistique de test est :</p><div class='math-block' style='background-color: #f0f4f8; padding: 10px; border-radius: 8px; text-align: center; margin: 10px 0;'><div class='math' style='font-size: 1.1em;'>$$ Z = \\frac{\\hat{p}_2 - \\hat{p}_1}{\\sqrt{\\hat{p}(1-\\hat{p})(\\frac{1}{n_1} + \\frac{1}{n_2})}} $$</div></div><p>Application numérique :</p><p>$Z = \\frac{0.52 - 0.45}{\\sqrt{0.49 \\times 0.51 \\times (\\frac{1}{600} + \\frac{1}{800})}} = \\frac{0.07}{\\sqrt{0.2499 \\times 0.002917}} = \\frac{0.07}{\\sqrt{0.000729}} = \\frac{0.07}{0.0270} \\approx 2.59$.</p><p>La p-value pour un test unilatéral à droite est $P(Z > 2.59)$.</p><p>D'après la table de la loi normale, $P(Z > 2.59) \\approx 0.0048$.</p><p>La p-value (0.0048) est inférieure à 0.05, donc on rejette <strong>H₀</strong>.</p><p>On conclut que la campagne de sensibilisation a été efficace et a permis d'augmenter la proportion de personnes favorables au projet.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Test t de Student pour échantillons appariés",
      "points": "3 pts",
      "enonce": "<p style='color: #333; font-size: 1.1em;'>Un institut de formation souhaite évaluer l'efficacité d'une nouvelle méthode pédagogique pour l'apprentissage de la statistique. Il sélectionne aléatoirement 8 étudiants. Ils passent un test de statistique avant de suivre la formation avec la nouvelle méthode (pré-test), puis passent un test similaire après la formation (post-test). Les notes obtenues (sur 20) sont les suivantes :</p><div style='background-color: #f8f9fa; padding: 8px; border-radius: 5px; text-align: center; max-width: 100%; overflow-x: auto;'><p><strong>Étudiant :</strong> 1, 2, 3, 4, 5, 6, 7, 8</p><p><strong>Pré-test :</strong> 10, 12, 8, 14, 9, 13, 11, 15</p><p><strong>Post-test :</strong> 13, 14, 10, 15, 11, 15, 13, 16</p></div>",
      "questions": [
        {
          "question": "<p><strong>3. a)</strong> Justifier l'utilisation d'un test t pour échantillons appariés (test de Student apparié) plutôt qu'un test pour échantillons indépendants. (Bloom : Analyser - 0.5 pt)</p>",
          "reponse": "<p>On utilise un test apparié car les données sont dépendantes : chaque étudiant est évalué avant et après la formation. L'effet de la méthode est évalué en comparant le score de chaque étudiant à lui-même. Cela permet de contrôler la variabilité inter-individuelle (les différences de niveau initial entre étudiants) et de se concentrer sur l'évolution individuelle.</p>"
        },
        {
          "question": "<p><strong>3. b)</strong> Formuler les hypothèses du test. (Bloom : Comprendre - 0.5 pt)</p>",
          "reponse": "<p>Soit D = Score_Post - Score_Pré. D représente le progrès (ou la régression) de chaque étudiant.</p><p><strong>H₀ :</strong> μ_D = 0 (la nouvelle méthode n'a pas d'effet, la moyenne des progrès est nulle).</p><p><strong>H₁ :</strong> μ_D > 0 (la nouvelle méthode est efficace, la moyenne des progrès est positive).</p>"
        },
        {
          "question": "<p><strong>3. c)</strong> Calculer les différences D pour chaque étudiant, puis la moyenne $\\bar{D}$ et l'écart-type $s_D$ des différences. (Bloom : Appliquer - 1 pt)</p>",
          "reponse": "<p><strong>Différences D = Post - Pré :</strong> 3, 2, 2, 1, 2, 2, 2, 1</p><p>Moyenne : $\\bar{D} = \\frac{3+2+2+1+2+2+2+1}{8} = \\frac{15}{8} = 1.875$.</p><p>Calcul de l'écart-type :</p><p>$\\sum (D_i - \\bar{D})^2 = (3-1.875)^2 + (2-1.875)^2 + \\dots$</p><p>$= 1.2656 + 0.0156 + 0.0156 + 0.7656 + 0.0156 + 0.0156 + 0.0156 + 0.7656 = 2.875$.</p><p>$s_D = \\sqrt{\\frac{1}{n-1}\\sum (D_i - \\bar{D})^2} = \\sqrt{\\frac{2.875}{7}} = \\sqrt{0.4107} \\approx 0.641$.</p>"
        },
        {
          "question": "<p><strong>3. d)</strong> Calculer la statistique de test T. Au seuil de signification α = 5%, que peut-on conclure ? (Bloom : Évaluer - 1 pt)</p>",
          "reponse": "<p>La statistique de test est :</p><div class='math-block' style='background-color: #f0f4f8; padding: 10px; border-radius: 8px; text-align: center; margin: 10px 0;'><div class='math' style='font-size: 1.1em;'>$$ T = \\frac{\\bar{D} - \\mu_{D0}}{s_D / \\sqrt{n}} = \\frac{1.875 - 0}{0.641 / \\sqrt{8}} = \\frac{1.875}{0.2267} \\approx 8.27 $$</div></div><p>La valeur critique pour un test unilatéral à 5% avec 7 degrés de liberté est $t_{0.05, 7} = 1.895$.</p><p>Puisque la statistique T (8.27) est très supérieure à la valeur critique, on rejette H₀.</p><p>On conclut que la nouvelle méthode pédagogique a un effet statistiquement significatif et permet d'améliorer les notes des étudiants.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Interprétation de la p-value",
      "points": "2 pts",
      "enonce": "<p style='color: #333; font-size: 1.1em;'>Un chercheur étudie l'effet d'un nouveau médicament sur la pression artérielle. Il obtient une p-value de 0.03 pour un test bilatéral au seuil α = 5%. Il conclut que le médicament est efficace car la p-value est inférieure à 5%.</p>",
      "questions": [
        {
          "question": "<p><strong>4. a)</strong> Expliquer en vos propres termes ce que signifie la p-value de 0.03 dans le contexte de cette étude. (Bloom : Comprendre - 1 pt)</p>",
          "reponse": "<p>La p-value de 0.03 signifie que, si l'hypothèse nulle était vraie (c'est-à-dire que le médicament n'a aucun effet), la probabilité d'observer un résultat aussi extrême (ou plus extrême) que celui observé dans l'échantillon est de 3%.</p><p>Autrement dit, il y a 3 chances sur 100 d'observer une différence de pression artérielle aussi grande que celle observée si le médicament n'agissait pas réellement.</p>"
        },
        {
          "question": "<p><strong>4. b)</strong> La conclusion du chercheur est-elle correcte ? Justifier votre réponse. (Bloom : Évaluer - 1 pt)</p>",
          "reponse": "<p>Sa conclusion est partiellement correcte mais incomplète. Il est correct de dire que le résultat est statistiquement significatif au seuil de 5% (car 0.03 < 0.05).</p><p>On rejette donc l'hypothèse nulle, ce qui suggère que le médicament a un effet.</p><p> Cependant, sa conclusion devrait être nuancée : il faut préciser qu'il s'agit d'un effet statistiquement significatif, mais qu'il faut aussi considérer l'ampleur de l'effet (sa pertinence clinique) et que l'étude devrait être répliquée pour confirmer les résultats.</p>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
