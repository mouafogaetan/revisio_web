<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Probabilités et Statistiques - L1",
  "classe": "Licence 1 Data Science",
  "sequence": "Évaluation Séquentielle n°6",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Estimateur ou Estimation ?",
      "points": "3 pts",
      "enonce": "<div style='font-size:1rem; line-height:1.8; font-family:Arial, sans-serif;'><p style='font-weight:bold;'>Pour chacune des situations suivantes, dites s'il s'agit d'un <span style='color:#2c3e50; background:#ecf0f1; padding:2px 6px; border-radius:4px;'>estimateur</span> ou d'une <span style='color:#2c3e50; background:#ecf0f1; padding:2px 6px; border-radius:4px;'>estimation</span>. Justifiez brièvement votre réponse.</p></div>",
      "questions": [
        {
          "question": "<div style='margin-bottom:15px;'><span style='font-weight:bold;'>1.1</span> La formule <div class='math-block' style='background:#f8f9fa; padding:10px; border-radius:8px; text-align:center; margin:8px 0;'><div class='math'>$$ \\bar{X} = \\frac{1}{n} \\sum_{i=1}^{n} X_i $$</div></div></div>",
          "reponse": "<div style='background:#e8f4f8; padding:12px; border-radius:8px;'><p style='margin:0;'><strong>C'est un estimateur.</strong> Il s'agit d'une formule mathématique définie avant d'observer les données. Elle dépend de l'échantillon aléatoire <span style='font-style:italic;'>X₁, X₂, ..., Xₙ</span> et permet d'estimer la moyenne <span style='font-style:italic;'>μ</span> de la population.</p></div>"
        },
        {
          "question": "<div style='margin-bottom:15px;'><span style='font-weight:bold;'>1.2</span> Après avoir interrogé 50 étudiants de la Licence 1 Data Science, on calcule leur âge moyen et on obtient <span style='font-weight:bold;'>22,4 ans</span>.</div>",
          "reponse": "<div style='background:#e8f4f8; padding:12px; border-radius:8px;'><p style='margin:0;'><strong>C'est une estimation.</strong> C'est la valeur numérique concrète obtenue en appliquant la formule de la moyenne à un échantillon spécifique de 50 étudiants.</p></div>"
        },
        {
          "question": "<div style='margin-bottom:15px;'><span style='font-weight:bold;'>1.3</span> La formule <div class='math-block' style='background:#f8f9fa; padding:10px; border-radius:8px; text-align:center; margin:8px 0;'><div class='math'>$$ \\hat{p} = \\frac{1}{n} \\sum_{i=1}^{n} \\mathbf{1}_{\\{X_i = 1\\}} $$</div></div> qui permet d'estimer la proportion <span style='font-style:italic;'>p</span> de succès dans une population.</div>",
          "reponse": "<div style='background:#e8f4f8; padding:12px; border-radius:8px;'><p style='margin:0;'><strong>C'est un estimateur.</strong> C'est une fonction des données de l'échantillon qui permet d'estimer le paramètre <span style='font-style:italic;'>p</span>. La formule est définie avant d'avoir les données.</p></div>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Biais, Convergence et Efficacité",
      "points": "4 pts",
      "enonce": "<div style='font-size:1rem; line-height:1.8; font-family:Arial, sans-serif;'><p>On considère une population dont la moyenne est <span style='font-style:italic;'>μ</span> et la variance <span style='font-style:italic;'>σ²</span>. On prélève un échantillon aléatoire <span style='font-style:italic;'>X₁, X₂, ..., Xₙ</span>.</p></div>",
      "questions": [
        {
          "question": "<div style='margin-bottom:12px;'><span style='font-weight:bold;'>2.1</span> Rappeler la formule de la moyenne empirique <span style='font-style:italic;'>\\( \\bar{X} \\)</span> et donner son espérance <span style='font-style:italic;'>E(\\bar{X})</span>. Que peut-on en conclure sur le biais de cet estimateur ?</div>",
          "reponse": "<div style='background:#e8f4f8; padding:12px; border-radius:8px;'><p style='margin:0;'><span style='font-style:italic;'>\\( \\bar{X} = \\frac{1}{n} \\sum_{i=1}^{n} X_i \\)</span></p><p style='margin-top:8px;'><span style='font-style:italic;'>\\( E(\\bar{X}) = \\frac{1}{n} \\sum_{i=1}^{n} E(X_i) = \\frac{1}{n} \\times n \\times \\mu = \\mu \\)</span></p><p style='margin-top:8px;'>Comme <span style='font-style:italic;'>E(\\bar{X}) = μ</span>, l'estimateur <span style='font-style:italic;'>\\( \\bar{X} \\)</span> est <strong>sans biais</strong>. Il ne surestime ni ne sous-estime systématiquement la vraie moyenne de la population.</p></div>"
        },
        {
          "question": "<div style='margin-bottom:12px;'><span style='font-weight:bold;'>2.2</span> Que devient la variance de <span style='font-style:italic;'>\\( \\bar{X} \\)</span> lorsque la taille de l'échantillon <span style='font-style:italic;'>n</span> augmente ? Quelle propriété de l'estimateur cela illustre-t-il ?</div>",
          "reponse": "<div style='background:#e8f4f8; padding:12px; border-radius:8px;'><p style='margin:0;'><span style='font-style:italic;'>\\( V(\\bar{X}) = \\frac{\\sigma^2}{n} \\)</span></p><p style='margin-top:8px;'>Lorsque <span style='font-style:italic;'>n</span> augmente, <span style='font-style:italic;'>V(\\bar{X})</span> diminue et tend vers 0. Cela illustre la propriété de <strong>convergence</strong> (ou consistance) de l'estimateur : plus l'échantillon est grand, plus l'estimation se rapproche de la vraie valeur <span style='font-style:italic;'>μ</span>.</p></div>"
        },
        {
          "question": "<div style='margin-bottom:12px;'><span style='font-weight:bold;'>2.3</span> On considère deux estimateurs sans biais de <span style='font-style:italic;'>μ</span> : <span style='font-style:italic;'>\\hat{\\theta}_1</span> de variance 4 et <span style='font-style:italic;'>\\hat{\\theta}_2</span> de variance 9. Lequel est le plus efficace ? Justifier.</div>",
          "reponse": "<div style='background:#e8f4f8; padding:12px; border-radius:8px;'><p style='margin:0;'><span style='font-style:italic;'>\\hat{\\theta}_1</span> est le plus efficace car sa variance (4) est plus petite que celle de <span style='font-style:italic;'>\\hat{\\theta}_2</span> (9).</p><p style='margin-top:8px;'>Un estimateur efficace a une <strong>variance minimale</strong> parmi tous les estimateurs sans biais. Une variance plus petite signifie que les estimations sont moins dispersées autour de la vraie valeur, donc plus précises.</p></div>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Maximum de Vraisemblance",
      "points": "5 pts",
      "enonce": "<div style='font-size:1rem; line-height:1.8; font-family:Arial, sans-serif;'><p>Un fabricant de smartphones souhaite estimer la proportion <span style='font-style:italic;'>p</span> de téléphones défectueux à la sortie d'une chaîne de production. Pour cela, il prélève un échantillon de <span style='font-style:italic;'>n = 100</span> téléphones et constate que <span style='font-style:italic;'>k = 8</span> sont défectueux.</p></div>",
      "questions": [
        {
          "question": "<div style='margin-bottom:12px;'><span style='font-weight:bold;'>3.1</span> Justifier que la variable aléatoire <span style='font-style:italic;'>X</span> représentant le nombre de téléphones défectueux dans l'échantillon suit une loi binomiale <span style='font-style:italic;'>\\mathcal{B}(100, p)</span>.</div>",
          "reponse": "<div style='background:#e8f4f8; padding:12px; border-radius:8px;'><p style='margin:0;'>Chaque téléphone prélevé est une épreuve de Bernoulli : il est soit défectueux (succès) avec probabilité <span style='font-style:italic;'>p</span>, soit fonctionnel (échec) avec probabilité <span style='font-style:italic;'>1-p</span>.</p><p style='margin-top:8px;'>Les 100 prélèvements sont indépendants et la probabilité <span style='font-style:italic;'>p</span> est constante. Le nombre total de défectueux <span style='font-style:italic;'>X</span> suit donc une loi binomiale <span style='font-style:italic;'>\\mathcal{B}(100, p)</span>.</p></div>"
        },
        {
          "question": "<div style='margin-bottom:12px;'><span style='font-weight:bold;'>3.2</span> Écrire la fonction de vraisemblance <span style='font-style:italic;'>L(p)</span> associée à cette observation.</div>",
          "reponse": "<div style='background:#e8f4f8; padding:12px; border-radius:8px;'><p style='margin:0;'>La vraisemblance est la probabilité d'observer <span style='font-style:italic;'>k = 8</span> défectueux pour un paramètre <span style='font-style:italic;'>p</span> donné :</p><div class='math-block' style='background:#f8f9fa; padding:12px; border-radius:8px; text-align:center; margin:8px 0;'><div class='math'>$$ L(p) = P(X = 8) = \\binom{100}{8} p^8 (1-p)^{92} $$</div></div><p style='margin-top:8px;'>Le coefficient <span style='font-style:italic;'>\\binom{100}{8}</span> est une constante qui ne dépend pas de <span style='font-style:italic;'>p</span>.</p></div>"
        },
        {
          "question": "<div style='margin-bottom:12px;'><span style='font-weight:bold;'>3.3</span> Déterminer l'estimateur du maximum de vraisemblance <span style='font-style:italic;'>\\hat{p}_{MLE}</span> de <span style='font-style:italic;'>p</span>.</div>",
          "reponse": "<div style='background:#e8f4f8; padding:12px; border-radius:8px;'><p style='margin:0;'>Pour une loi binomiale <span style='font-style:italic;'>\\mathcal{B}(n, p)</span>, l'estimateur du maximum de vraisemblance est :</p><div class='math-block' style='background:#f8f9fa; padding:12px; border-radius:8px; text-align:center; margin:8px 0;'><div class='math'>$$ \\hat{p}_{MLE} = \\frac{X}{n} $$</div></div><p style='margin-top:8px;'>Avec <span style='font-style:italic;'>X = 8</span> et <span style='font-style:italic;'>n = 100</span>, on obtient :</p><div class='math-block' style='background:#f8f9fa; padding:12px; border-radius:8px; text-align:center; margin:8px 0;'><div class='math'>$$ \\hat{p}_{MLE} = \\frac{8}{100} = 0,08 $$</div></div><p style='margin-top:8px;'>La proportion estimée de téléphones défectueux est de <strong>8%</strong>.</p></div>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Erreur Standard et Intervalle de Confiance",
      "points": "4 pts",
      "enonce": "<div style='font-size:1rem; line-height:1.8; font-family:Arial, sans-serif;'><p>Une enquête réalisée auprès de 100 consommateurs à Douala montre que 60% d'entre eux préfèrent une marque locale de boisson gazeuse à une marque internationale.</p></div>",
      "questions": [
        {
          "question": "<div style='margin-bottom:12px;'><span style='font-weight:bold;'>4.1</span> Donner l'estimation ponctuelle de la proportion <span style='font-style:italic;'>p</span> de consommateurs qui préfèrent la marque locale.</div>",
          "reponse": "<div style='background:#e8f4f8; padding:12px; border-radius:8px;'><p style='margin:0;'>L'estimation ponctuelle est la proportion observée dans l'échantillon :</p><div class='math-block' style='background:#f8f9fa; padding:12px; border-radius:8px; text-align:center; margin:8px 0;'><div class='math'>$$ \\hat{p} = 0,60 $$</div></div><p style='margin-top:8px;'>C'est-à-dire que 60% des consommateurs interrogés préfèrent la marque locale.</p></div>"
        },
        {
          "question": "<div style='margin-bottom:12px;'><span style='font-weight:bold;'>4.2</span> Calculer l'erreur standard de l'estimateur <span style='font-style:italic;'>\\hat{p}</span> sachant que <span style='font-style:italic;'>\\text{ES}(\\hat{p}) = \\sqrt{\\frac{\\hat{p}(1-\\hat{p})}{n}}</span>.</div>",
          "reponse": "<div style='background:#e8f4f8; padding:12px; border-radius:8px;'><p style='margin:0;'>Application numérique :</p><div class='math-block' style='background:#f8f9fa; padding:12px; border-radius:8px; text-align:center; margin:8px 0;'><div class='math'>$$ \\text{ES}(\\hat{p}) = \\sqrt{\\frac{0,60 \\times 0,40}{100}} = \\sqrt{\\frac{0,24}{100}} = \\sqrt{0,0024} \\approx 0,049 $$</div></div><p style='margin-top:8px;'>L'erreur standard est d'environ <strong>0,049</strong> ou <strong>4,9%</strong>. Cela mesure la variabilité de l'estimation d'un échantillon à l'autre.</p></div>"
        },
        {
          "question": "<div style='margin-bottom:12px;'><span style='font-weight:bold;'>4.3</span> Interpréter concrètement la valeur de l'erreur standard calculée.</div>",
          "reponse": "<div style='background:#e8f4f8; padding:12px; border-radius:8px;'><p style='margin:0;'>L'erreur standard de 0,049 (4,9%) signifie que si l'on répétait l'enquête plusieurs fois avec des échantillons de 100 consommateurs, l'estimation de la proportion varierait en moyenne d'environ 4,9 points de pourcentage autour de la vraie proportion de la population.</p><p style='margin-top:8px;'>Une erreur standard faible indique que l'estimation est précise.</p></div>"
        }
      ]
    },
    {
      "titre": "Exercice 5 : Application à une Situation Réelle",
      "points": "4 pts",
      "enonce": "<div style='font-size:1rem; line-height:1.8; font-family:Arial, sans-serif;'><p>Une entreprise de transport à Yaoundé souhaite estimer le temps moyen de trajet sur une ligne de bus. Elle effectue 30 mesures et obtient les résultats suivants (en minutes) :</p><div style='background:#f8f9fa; padding:15px; border-radius:8px; margin:10px 0; text-align:center;'><span style='font-family: monospace; font-size:1.1rem;'>28, 32, 25, 30, 29, 33, 27, 31, 26, 29, 30, 28, 32, 31, 27, 30, 29, 28, 33, 30, 31, 29, 32, 30, 28, 31, 29, 30, 27, 32</span></div></div>",
      "questions": [
        {
          "question": "<div style='margin-bottom:12px;'><span style='font-weight:bold;'>5.1</span> Calculer la moyenne empirique <span style='font-style:italic;'>\\bar{x}</span> de cet échantillon.</div>",
          "reponse": "<div style='background:#e8f4f8; padding:12px; border-radius:8px;'><p style='margin:0;'>Somme des valeurs : 28+32+25+30+29+33+27+31+26+29+30+28+32+31+27+30+29+28+33+30+31+29+32+30+28+31+29+30+27+32 = 894</p><div class='math-block' style='background:#f8f9fa; padding:12px; border-radius:8px; text-align:center; margin:8px 0;'><div class='math'>$$ \\bar{x} = \\frac{894}{30} = 29,8 \\text{ minutes} $$</div></div><p style='margin-top:8px;'>Le temps moyen estimé du trajet est de <strong>29,8 minutes</strong>.</p></div>"
        },
        {
          "question": "<div style='margin-bottom:12px;'><span style='font-weight:bold;'>5.2</span> La moyenne empirique est-elle un estimateur sans biais du temps moyen de trajet de la population ? Justifier.</div>",
          "reponse": "<div style='background:#e8f4f8; padding:12px; border-radius:8px;'><p style='margin:0;'>Oui, la moyenne empirique est un estimateur <strong>sans biais</strong> de la moyenne de la population.</p><p style='margin-top:8px;'>En effet, <span style='font-style:italic;'>E(\\bar{X}) = μ</span>, où <span style='font-style:italic;'>μ</span> est le vrai temps moyen de trajet pour l'ensemble des bus. Cela signifie qu'en prenant de nombreux échantillons, la moyenne des moyennes calculées serait égale au vrai temps moyen.</p></div>"
        },
        {
          "question": "<div style='margin-bottom:12px;'><span style='font-weight:bold;'>5.3</span> Que peut-on dire de la précision de cette estimation si la variance de l'échantillon est <span style='font-style:italic;'>s² = 4,5</span> ? (On rappelle que <span style='font-style:italic;'>\\text{ES}(\\bar{X}) = \\sqrt{\\frac{s^2}{n}}</span>)</div>",
          "reponse": "<div style='background:#e8f4f8; padding:12px; border-radius:8px;'><p style='margin:0;'>L'erreur standard est :</p><div class='math-block' style='background:#f8f9fa; padding:12px; border-radius:8px; text-align:center; margin:8px 0;'><div class='math'>$$ \\text{ES}(\\bar{X}) = \\sqrt{\\frac{4,5}{30}} = \\sqrt{0,15} \\approx 0,387 \\text{ minutes} $$</div></div><p style='margin-top:8px;'>L'erreur standard d'environ 0,39 minute (23 secondes) est relativement faible comparée à la moyenne de 29,8 minutes. Cela indique que l'estimation est <strong>précise</strong>. Avec un échantillon de 30 mesures, on a une bonne confiance dans le fait que le vrai temps moyen est proche de 29,8 minutes.</p></div>"

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
