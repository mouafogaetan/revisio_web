<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Probabilités et Statistiques - L1",
  "classe": "Licence 1 Data Science",
  "sequence": "Sequence 5",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Processus de Poisson (5 pts)",
      "points": "5 pts",
      "enonce": "<p style='font-size: 1.05em;'>Un centre de santé à Douala reçoit en moyenne 18 patients par heure entre 8h et 12h. On suppose que le nombre de patients suit un processus de Poisson.</p>",
      "questions": [
        {
          "question": "1) Déterminer l'intensité \( \\lambda \) du processus de Poisson par minute. (1 pt)",
          "reponse": "<p>\( \\lambda = 18 \) patients par heure, soit \( \\lambda = \\frac{18}{60} = 0.3 \) patient par minute.</p>"
        },
        {
          "question": "2) Calculer la probabilité qu'il n'y ait aucun patient en une minute. (1 pt)",
          "reponse": "<p>\( P(X = 0) = \\frac{e^{-0.3}0.3^0}{0!} = e^{-0.3} \\approx 0.7408 \\).</p><p>Il y a environ <strong>74.08%</strong> de chance qu'il n'y ait aucun patient en une minute.</p>"
        },
        {
          "question": "3) Calculer la probabilité qu'il y ait exactement 3 patients en 5 minutes. (1.5 pts)",
          "reponse": "<p>Pour \( t = 5 \) minutes, \( \\lambda t = 0.3 \\times 5 = 1.5 \\).</p><p>\( P(X = 3) = \\frac{e^{-1.5}1.5^3}{3!} = \\frac{e^{-1.5} \\times 3.375}{6} = 0.5625 \\times e^{-1.5} \\approx 0.5625 \\times 0.2231 \\approx 0.1255 \\).</p><p>Il y a environ <strong>12.55%</strong> de chance d'avoir exactement 3 patients en 5 minutes.</p>"
        },
        {
          "question": "4) Déterminer la loi du temps d'attente entre deux patients successifs et calculer le temps moyen d'attente. (1.5 pts)",
          "reponse": "<p>Le temps d'attente \( T \) suit une loi exponentielle de paramètre \( \\lambda = 0.3 \) patient par minute.</p><p>Densité : \( f_T(t) = 0.3e^{-0.3t} \) pour \( t \\geq 0 \\).</p><p>Temps moyen d'attente : \( E(T) = \\frac{1}{\\lambda} = \\frac{1}{0.3} \\approx 3.33 \) minutes.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Régression linéaire multiple (6 pts)",
      "points": "6 pts",
      "enonce": "<p style='font-size: 1.05em;'>Un économiste souhaite expliquer le prix d'une maison (en millions de FCFA) dans la région de l'Ouest Cameroun en fonction de :</p><ul><li>\( X_1 \) : surface en m²</li><li>\( X_2 \) : nombre de chambres</li><li>\( X_3 \) : âge du bien (en années)</li></ul><p>Le modèle estimé à partir d'un échantillon est : \( \\hat{Y} = 15 + 0.25X_1 + 3.5X_2 - 0.6X_3 \) avec \( R^2 = 0.82 \).</p>",
      "questions": [
        {
          "question": "1) Interpréter les coefficients du modèle dans le contexte de l'étude. (2 pts)",
          "reponse": "<ul><li><strong>Constante (15)</strong> : prix de base lorsque toutes les variables sont nulles.</li><li><strong>\( \\beta_1 = 0.25 \)</strong> : chaque m² supplémentaire augmente le prix de 0.25 million de FCFA, toutes choses égales par ailleurs.</li><li><strong>\( \\beta_2 = 3.5 \)</strong> : chaque chambre supplémentaire augmente le prix de 3.5 millions de FCFA, toutes choses égales par ailleurs.</li><li><strong>\( \\beta_3 = -0.6 \)</strong> : chaque année d'âge supplémentaire diminue le prix de 0.6 million de FCFA, toutes choses égales par ailleurs.</li></ul>"
        },
        {
          "question": "2) Prédire le prix d'une maison de 120 m² avec 4 chambres et âgée de 15 ans. (1 pt)",
          "reponse": "<p>\( \\hat{Y} = 15 + 0.25(120) + 3.5(4) - 0.6(15) = 15 + 30 + 14 - 9 = 50 \) millions de FCFA.</p>"
        },
        {
          "question": "3) Que signifie \( R^2 = 0.82 \) ? Quelle est la qualité de l'ajustement ? (1 pt)",
          "reponse": "<p>Le coefficient de détermination \( R^2 = 0.82 \) signifie que 82% de la variabilité du prix des maisons est expliquée par le modèle (surface, nombre de chambres, âge). C'est un <strong>bon ajustement</strong>, le modèle explique bien la majorité de la variance.</p>"
        },
        {
          "question": "4) Le coefficient de \( X_3 \) (âge) a une p-value de 0.32. Que peut-on en conclure sur la significativité de cette variable au seuil \( \\alpha = 5\\% \) ? (2 pts)",
          "reponse": "<p>La p-value de 0.32 est supérieure à \( \\alpha = 0.05 \\). On ne rejette pas l'hypothèse nulle \( H_0 : \\beta_3 = 0 \\).</p><p>La variable \( X_3 \) (âge) n'est pas significative au seuil de 5%. Elle n'apporte pas d'information utile pour expliquer le prix, toutes choses égales par ailleurs.</p><p>Il pourrait être judicieux de supprimer cette variable du modèle ou d'envisager une transformation (par exemple, l'âge au carré).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Analyse de la variance (ANOVA) (4 pts)",
      "points": "4 pts",
      "enonce": "<p style='font-size: 1.05em;'>Une entreprise agroalimentaire souhaite comparer la productivité de trois méthodes de culture (A, B, C) sur le rendement du maïs (en tonnes/ha). Les résultats pour 5 parcelles par méthode sont les suivants :</p><div style='overflow-x: auto; margin: 15px 0;'><table style='width: 100%; border-collapse: collapse;'><tr style='background-color: #2c3e50; color: white;'><th style='padding: 8px; border: 1px solid #ddd;'>Méthode A</th><th style='padding: 8px; border: 1px solid #ddd;'>Méthode B</th><th style='padding: 8px; border: 1px solid #ddd;'>Méthode C</th></tr><tr><td style='padding: 8px; border: 1px solid #ddd;'>4.2</td><td style='padding: 8px; border: 1px solid #ddd;'>5.1</td><td style='padding: 8px; border: 1px solid #ddd;'>3.8</td></tr><tr><td style='padding: 8px; border: 1px solid #ddd;'>4.5</td><td style='padding: 8px; border: 1px solid #ddd;'>5.3</td><td style='padding: 8px; border: 1px solid #ddd;'>4.0</td></tr><tr><td style='padding: 8px; border: 1px solid #ddd;'>4.0</td><td style='padding: 8px; border: 1px solid #ddd;'>4.9</td><td style='padding: 8px; border: 1px solid #ddd;'>3.5</td></tr><tr><td style='padding: 8px; border: 1px solid #ddd;'>4.8</td><td style='padding: 8px; border: 1px solid #ddd;'>5.5</td><td style='padding: 8px; border: 1px solid #ddd;'>4.1</td></tr><tr><td style='padding: 8px; border: 1px solid #ddd;'>4.3</td><td style='padding: 8px; border: 1px solid #ddd;'>5.2</td><td style='padding: 8px; border: 1px solid #ddd;'>3.9</td></tr></table></div>",
      "questions": [
        {
          "question": "1) Calculer les moyennes de chaque groupe et la moyenne générale. (1 pt)",
          "reponse": "<ul><li>Moyenne A : \( \\bar{x}_A = \\frac{4.2+4.5+4.0+4.8+4.3}{5} = \\frac{21.8}{5} = 4.36 \)</li><li>Moyenne B : \( \\bar{x}_B = \\frac{5.1+5.3+4.9+5.5+5.2}{5} = \\frac{26.0}{5} = 5.20 \)</li><li>Moyenne C : \( \\bar{x}_C = \\frac{3.8+4.0+3.5+4.1+3.9}{5} = \\frac{19.3}{5} = 3.86 \)</li><li>Moyenne générale : \( \\bar{x} = \\frac{21.8+26.0+19.3}{15} = \\frac{67.1}{15} \\approx 4.473 \)</li></ul>"
        },
        {
          "question": "2) Calculer la somme des carrés expliquée (SCE) et la somme des carrés résiduelle (SCR). (2 pts)",
          "reponse": "<p>\( SCE = \\sum_{i=1}^3 n_i (\\bar{x}_i - \\bar{x})^2 = 5[(4.36-4.473)^2 + (5.20-4.473)^2 + (3.86-4.473)^2] \)</p><p>\( = 5[(-0.113)^2 + (0.727)^2 + (-0.613)^2] = 5[0.0128 + 0.5285 + 0.3758] = 5 \\times 0.9171 = 4.5855 \\).</p><p>\( SCR = \\sum_{i=1}^3 \\sum_{j=1}^{n_i} (x_{ij} - \\bar{x}_i)^2 \\)</p><p>Méthode A : \( (4.2-4.36)^2 + (4.5-4.36)^2 + (4.0-4.36)^2 + (4.8-4.36)^2 + (4.3-4.36)^2 = 0.0256 + 0.0196 + 0.1296 + 0.1936 + 0.0036 = 0.3720 \)</p><p>Méthode B : \( (5.1-5.20)^2 + (5.3-5.20)^2 + (4.9-5.20)^2 + (5.5-5.20)^2 + (5.2-5.20)^2 = 0.01 + 0.01 + 0.09 + 0.09 + 0 = 0.20 \)</p><p>Méthode C : \( (3.8-3.86)^2 + (4.0-3.86)^2 + (3.5-3.86)^2 + (4.1-3.86)^2 + (3.9-3.86)^2 = 0.0036 + 0.0196 + 0.1296 + 0.0576 + 0.0016 = 0.2120 \)</p><p>\( SCR = 0.3720 + 0.20 + 0.2120 = 0.7840 \).</p>"
        },
        {
          "question": "3) Construire le tableau d'ANOVA et réaliser le test F au seuil \( \\alpha = 5\\% \). Conclure. (1 pt)",
          "reponse": "<div style='overflow-x: auto;'><table style='width: 100%; border-collapse: collapse;'><tr style='background-color: #2c3e50; color: white;'><th style='padding: 6px; border: 1px solid #ddd;'>Source</th><th style='padding: 6px; border: 1px solid #ddd;'>ddl</th><th style='padding: 6px; border: 1px solid #ddd;'>SC</th><th style='padding: 6px; border: 1px solid #ddd;'>CM</th><th style='padding: 6px; border: 1px solid #ddd;'>F</th></tr><tr><td style='padding: 6px; border: 1px solid #ddd;'>Inter-groupes</td><td style='padding: 6px; border: 1px solid #ddd;'>2</td><td style='padding: 6px; border: 1px solid #ddd;'>4.5855</td><td style='padding: 6px; border: 1px solid #ddd;'>2.2928</td><td style='padding: 6px; border: 1px solid #ddd;'>35.08</td></tr><tr><td style='padding: 6px; border: 1px solid #ddd;'>Intra-groupes</td><td style='padding: 6px; border: 1px solid #ddd;'>12</td><td style='padding: 6px; border: 1px solid #ddd;'>0.7840</td><td style='padding: 6px; border: 1px solid #ddd;'>0.0653</td><td style='padding: 6px; border: 1px solid #ddd;'></td></tr><tr><td style='padding: 6px; border: 1px solid #ddd;'>Total</td><td style='padding: 6px; border: 1px solid #ddd;'>14</td><td style='padding: 6px; border: 1px solid #ddd;'>5.3695</td><td style='padding: 6px; border: 1px solid #ddd;'></td><td style='padding: 6px; border: 1px solid #ddd;'></td></tr></table></div><p>\( F_{2,12,0.05} \\approx 3.89 \\). \( F = 35.08 > 3.89 \\), donc on rejette \( H_0 \).</p><p>Il existe une différence significative de rendement entre les trois méthodes de culture.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Chaînes de Markov (5 pts)",
      "points": "5 pts",
      "enonce": "<p style='font-size: 1.05em;'>Le temps dans la ville de Yaoundé peut être modélisé comme une chaîne de Markov à deux états : Soleil (S) ou Pluie (P). La matrice de transition est :</p><div style='overflow-x: auto; margin: 15px 0;'><table style='width: 100%; border-collapse: collapse;'><tr style='background-color: #2c3e50; color: white;'><th style='padding: 8px; border: 1px solid #ddd;'></th><th style='padding: 8px; border: 1px solid #ddd;'>S</th><th style='padding: 8px; border: 1px solid #ddd;'>P</th></tr><tr><td style='padding: 8px; border: 1px solid #ddd;'>S</td><td style='padding: 8px; border: 1px solid #ddd;'>0.7</td><td style='padding: 8px; border: 1px solid #ddd;'>0.3</td></tr><tr><td style='padding: 8px; border: 1px solid #ddd;'>P</td><td style='padding: 8px; border: 1px solid #ddd;'>0.4</td><td style='padding: 8px; border: 1px solid #ddd;'>0.6</td></tr></table></div>",
      "questions": [
        {
          "question": "1) Interpréter les probabilités de la matrice de transition. (1 pt)",
          "reponse": "<ul><li>\( P(S \\to S) = 0.7 \) : s'il fait soleil aujourd'hui, il y a 70% de chance qu'il fasse soleil demain.</li><li>\( P(S \\to P) = 0.3 \) : s'il fait soleil aujourd'hui, il y a 30% de chance qu'il pleuve demain.</li><li>\( P(P \\to S) = 0.4 \) : s'il pleut aujourd'hui, il y a 40% de chance qu'il fasse soleil demain.</li><li>\( P(P \\to P) = 0.6 \) : s'il pleut aujourd'hui, il y a 60% de chance qu'il pleuve demain.</li></ul>"
        },
        {
          "question": "2) S'il fait soleil aujourd'hui, quelle est la probabilité qu'il fasse soleil après-demain ? (2 pts)",
          "reponse": "<p>On calcule \( P^2 = P \\times P \\) :</p><p>\( P^2 = \\begin{bmatrix} 0.7 & 0.3 \\\\ 0.4 & 0.6 \\end{bmatrix} \\times \\begin{bmatrix} 0.7 & 0.3 \\\\ 0.4 & 0.6 \\end{bmatrix} = \\begin{bmatrix} 0.7 \\times 0.7 + 0.3 \\times 0.4 & 0.7 \\times 0.3 + 0.3 \\times 0.6 \\\\ 0.4 \\times 0.7 + 0.6 \\times 0.4 & 0.4 \\times 0.3 + 0.6 \\times 0.6 \\end{bmatrix} \\)</p><p>\( = \\begin{bmatrix} 0.49 + 0.12 & 0.21 + 0.18 \\\\ 0.28 + 0.24 & 0.12 + 0.36 \\end{bmatrix} = \\begin{bmatrix} 0.61 & 0.39 \\\\ 0.52 & 0.48 \\end{bmatrix} \\)</p><p>S'il fait soleil aujourd'hui, la probabilité qu'il fasse soleil après-demain est de <strong>0.61</strong> (61%).</p>"
        },
        {
          "question": "3) Déterminer la distribution stationnaire de cette chaîne de Markov. (2 pts)",
          "reponse": "<p>On cherche \( \\pi = (\\pi_S, \\pi_P) \) tel que \( \\pi = \\pi P \) et \( \\pi_S + \\pi_P = 1 \\).</p><p>\( \\pi_S = 0.7\\pi_S + 0.4\\pi_P \\)</p><p>\( \\pi_P = 0.3\\pi_S + 0.6\\pi_P \\)</p><p>De la première équation : \( \\pi_S - 0.7\\pi_S = 0.4\\pi_P \\Rightarrow 0.3\\pi_S = 0.4\\pi_P \\Rightarrow \\pi_S = \\frac{4}{3}\\pi_P \\)</p><p>Avec \( \\pi_S + \\pi_P = 1 \\), on a : \( \\frac{4}{3}\\pi_P + \\pi_P = 1 \\Rightarrow \\frac{7}{3}\\pi_P = 1 \\Rightarrow \\pi_P = \\frac{3}{7} \\) et \( \\pi_S = \\frac{4}{7} \\).</p><p>La distribution stationnaire est \( \\pi = \\left(\\frac{4}{7}, \\frac{3}{7}\\right) \\).</p><p>À long terme, il fera soleil 57.14% du temps et pluie 42.86% du temps.</p>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
