<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 500px;
        margin: 0 auto;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    .slide-header {
        flex-shrink: 0;
        padding: 18px 16px 10px 16px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        z-index: 10;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .slide-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
    }

    .content-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 18px 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        flex-shrink: 0;
    }

    .content-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .content-card li {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        line-height: 1.5;
    }

    .content-card li:last-child {
        border-bottom: none;
    }

    .bullet-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
    }

    .math-block {
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        overflow-x: auto;
        flex-shrink: 0;
        margin: 4px 0;
    }

    .math-block .math {
        font-size: 1.2rem;
        color: #e2e8f0;
    }

    .note-box {
        background: rgba(96, 165, 250, 0.08);
        border-left: 4px solid #60a5fa;
        padding: 12px 16px;
        border-radius: 12px;
        font-style: italic;
        font-size: 0.9rem;
        color: #cbd5e1;
        flex-shrink: 0;
    }

    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        border-radius: 0;
        flex-direction: column;
    }

    .loading-card {
        background: #1e293b;
        padding: 32px 28px;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #334155;
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px auto;
    }

    .loading-text {
        font-weight: 600;
        font-size: 1.1rem;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    .loading-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 16px;
    }
    .loading-progress {
        height: 3px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        animation: loadingProgress 30s ease-out forwards;
    }

    .loading-timeout {
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 12px;
    }

    .btn-cancel-loading {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 40px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #f87171;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }

    .btn-cancel-loading:active {
        transform: scale(0.94);
        background: rgba(239, 68, 68, 0.25);
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
    }

    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .slide-counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255,255,255,0.05);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(255,255,255,0.04);
    }

    .status-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 30px;
        background: rgba(96, 165, 250, 0.12);
        color: #93bbfc;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
    }

    .status-badge .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: pulse-dot 1.2s infinite;
        flex-shrink: 0;
    }

    .status-badge.idle .dot {
        animation: none;
        background: #64748b;
    }
    .status-badge.speaking .dot {
        background: #34d399;
        animation: pulse-dot 0.8s infinite;
    }
    .status-badge.error .dot {
        background: #f87171;
        animation: none;
    }
    .status-badge.paused .dot {
        animation: none;
        background: #fbbf24;
    }
    .status-badge.waiting .dot {
        animation: pulse-dot 1.5s infinite;
        background: #fbbf24;
    }
    .status-badge.loading .dot {
        animation: pulse-dot 0.5s infinite;
        background: #60a5fa;
    }

    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.7); }
    }

    .footer-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(255,255,255,0.1);
    }

    .btn-secondary {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-play {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
        min-width: 80px;
        justify-content: center;
    }
    .btn-play:active {

    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
    }

    .auto-indicator {
        font-size: 0.65rem;
        color: #64748b;
        text-align: center;
        letter-spacing: 0.3px;
        padding: 2px 0;
    }

    @media (max-width: 400px) {
        .slide-header h1 {

        }

    @media (min-width: 600px) {

    /* Mode jour (par défaut) */
    html, body {

    }

    }
    .slide-header h1 {
        background: linear-gradient(135deg, #2b6cb0, #6b46c1) !important;
        -webkit-background-clip: text !important;

        background-clip: text !important;
    }
    .slide-footer {
        background: rgba(255, 255, 255, 0.9) !important;

    }
    .content-card {
        background: rgba(255,255,255,0.8) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card li {

    .note-box {
        background: rgba(96, 165, 250, 0.12) !important;

        color: #2c3e50 !important;
    }
    .math-block {
        background: rgba(0,0,0,0.05) !important;

    }
    .math-block .math {

    .slide-counter {

    .status-badge {

    }
    .btn {

    }

</style>

<body>

<div class="app-container">

    <header class="slide-header">
        <h1 id="slideTitle">Chargement...</h1>
    </header>

    <main class="slide-body" id="slideBody"></main>

    <!-- LOADING OVERLAY AVEC BOUTON ANNULER -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Préparation vocale...</div>
            <div class="loading-sub" id="loadingSub">Synthèse en cours</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loadingProgressBar"></div>
            </div>
            <div class="loading-timeout" id="loadingTimeout">⏱️ 30 secondes maximum</div>
            <button class="btn-cancel-loading" id="cancelLoadingBtn">
                <span>✕</span> Annuler
            </button>
        </div>
    </div>

    <footer class="slide-footer">
        <div class="footer-top">
            <span class="slide-counter" id="slideCounter">1 / 3</span>
            <span class="status-badge idle" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">Prêt</span>
            </span>
        </div>

        <div class="footer-buttons">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-secondary" id="replayBtn">
                <span class="btn-icon">🔁</span> <span class="btn-label">Relire</span>
            </button>
            <button class="btn btn-play" id="playBtn">
                <span class="btn-icon">▶</span> <span class="btn-label">Play</span>
            </button>
        </div>

        <div class="auto-indicator" id="autoIndicator">⏸ Lecture manuelle</div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // SLIDES
    // ================================================================
    const slides = [
    {
        "titre": "Introduction",
        "contenu": "<div><h2 style='color:#2c3e50;'>Estimation par Intervalle de Confiance</h2><p style='font-size:1.2em; line-height:1.6;'>Objectifs de la leçon :</p><ul style='font-size:1.1em; list-style-type:disc; padding-left:20px;'><li>Comprendre la différence entre une estimation ponctuelle et une estimation par intervalle.</li><li>Définir un intervalle de confiance et son niveau de confiance.</li><li>Construire des intervalles de confiance pour la moyenne et la proportion.</li><li>Savoir interpréter un intervalle de confiance dans un contexte concret.</li></ul></div>",
        "texteParle": "Bonjour à tous. Dans cette leçon, nous allons aborder un concept fondamental de la statistique inférentielle : l'estimation par intervalle de confiance. Alors qu'une estimation ponctuelle nous donne une valeur unique, comme la moyenne d'un échantillon, l'intervalle de confiance nous permet de quantifier l'incertitude de cette estimation. Nous verrons comment construire ces intervalles pour une moyenne ou une proportion, et surtout, comment les interpréter correctement.",
        "note": "L'estimation par intervalle est la base de la quantification de l'incertitude en statistique."
    },
    {
        "titre": "Du Point au Segment",
        "contenu": "<div><p><strong>Estimation ponctuelle</strong> : Une estimation ponctuelle est une <strong>valeur unique</strong> calculée à partir d'un échantillon pour estimer un paramètre inconnu de la population (comme \\( \\mu \\) ou \\( p \\)).</p><p><span style='display:block; background-color: #f8f9fa; padding: 10px; border-radius:8px; margin: 15px 0;'><strong>Exemple :</strong> La moyenne de l'échantillon \\( \\bar{x} = 165 \\) cm est une estimation de la taille moyenne de tous les étudiants.</span></p><p><strong>Limite :</strong> Une estimation ponctuelle ne dit rien sur sa <strong>précision</strong>. Quelle est la fiabilité de cette valeur ?</p><p style='margin-top: 15px;'><strong>Estimation par intervalle</strong> : Elle fournit un <strong>intervalle de valeurs</strong> dans lequel on a une certaine confiance que le paramètre se trouve.</p><p><span style='display:block; background-color: #e9ecef; padding: 10px; border-radius:8px;'><strong>Exemple :</strong> On est confiant à 95% que la taille moyenne des étudiants est comprise entre 162 cm et 168 cm.</span></p></div>",
        "texteParle": "Avant de construire des intervalles, rappelons ce qu'est une estimation ponctuelle. C'est une valeur unique que l'on calcule à partir de notre échantillon, comme la moyenne ou la proportion. Mais cette valeur unique est rarement exactement égale au vrai paramètre de la population. C'est là qu'intervient l'estimation par intervalle. Au lieu d'une seule valeur, on propose un intervalle, un segment, de valeurs possibles. Cela nous donne une idée de la précision de notre estimation.",
        "note": "Un intervalle de confiance est toujours associé à une probabilité, appelée niveau de confiance."
    },
    {
        "titre": "Définitions Clés",
        "contenu": "<div><p><strong>Paramètre</strong> : Valeur numérique décrivant une caractéristique de la <strong>population</strong> (ex: moyenne \\( \\mu \\), proportion \\( p \\), écart-type \\( \\sigma \\)). C'est la valeur que l'on cherche à estimer.</p><p><strong>Estimateur</strong> : C'est une <strong>formule</strong> utilisée pour estimer un paramètre. C'est une variable aléatoire. (ex: \\( \\bar{X} \\) pour estimer \\( \\mu \\)).</p><p><strong>Estimation</strong> : C'est la <strong>valeur numérique</strong> prise par l'estimateur sur un échantillon spécifique. (ex: \\( \\bar{x} = 165 \\) cm).</p><p><strong>Niveau de confiance (1-α)</strong> : C'est la <strong>probabilité</strong> que l'intervalle de confiance construit contienne le vrai paramètre de la population.</p><p><span style='display:block; background-color: #e9ecef; padding: 10px; border-radius:8px; margin: 10px 0;'><strong>Exemple :</strong> Un niveau de confiance de 95% signifie que si l'on répète l'étude un grand nombre de fois, environ 95% des intervalles construits contiendront le paramètre.</span></p></div>",
        "texteParle": "Parlons maintenant du vocabulaire. Le paramètre est la valeur que l'on cherche à connaître dans la population. L'estimateur est la formule que l'on applique à l'échantillon. Et l'estimation est le résultat concret de cette formule. Le niveau de confiance est la clé de l'intervalle de confiance. Un niveau de confiance de 95% signifie que la méthode que nous allons utiliser produit un intervalle qui contient la vraie valeur dans 95% des échantillons. Attention, cela ne signifie pas qu'il y a 95% de chance que la valeur soit dans notre intervalle, la valeur est fixe, c'est l'intervalle qui est aléatoire.",
        "note": "Définition fréquentiste du niveau de confiance : sur un grand nombre d'échantillons, la proportion d'intervalles contenant le paramètre tend vers (1-α)."
    },
    {
        "titre": "IC pour la Moyenne (σ connu)",
        "contenu": "<div><p>Si la variable aléatoire suit une loi normale \\( N(\\mu, \\sigma^2) \\) et que l'écart-type \\( \\sigma \\) est <strong>connu</strong>, alors l'intervalle de confiance au niveau \\( (1-\\alpha) \\) est :</p><div class='math-block'><div class='math'>$$ IC_{1-\\alpha}(\\mu) = \\left[ \\bar{x} - z_{\\alpha/2} \\frac{\\sigma}{\\sqrt{n}} ; \\bar{x} + z_{\\alpha/2} \\frac{\\sigma}{\\sqrt{n}} \\right] $$</div></div><ul style='font-size:0.95em;'><li><strong>\\( \\bar{x} \\)</strong> : Moyenne de l'échantillon.</li><li><strong>\\( z_{\\alpha/2} \\)</strong> : Quantile de la loi normale centrée réduite.</li><li><strong>\\( \\sigma \\)</strong> : Écart-type de la population (connu).</li><li><strong>\\( n \\)</strong> : Taille de l'échantillon.</li></ul><div style='background-color: #e9ecef; padding: 10px; border-radius:8px; margin-top:10px;'><p><strong>Interprétation :</strong> \\( \\bar{x} \\) est le centre de l'intervalle. La marge d'erreur est \\( z_{\\alpha/2} \\frac{\\sigma}{\\sqrt{n}} \\).</p></div></div>",
        "texteParle": "Commençons par le cas le plus simple, mais aussi le plus théorique : l'intervalle de confiance pour une moyenne lorsque l'écart-type de la population est connu. Cette situation est rare en pratique, mais elle est utile pour comprendre le mécanisme. La formule est celle-ci : la moyenne de l'échantillon plus ou moins la marge d'erreur. Cette marge d'erreur dépend du niveau de confiance via le quantile z, de l'écart-type et de la racine carrée de la taille de l'échantillon. Plus la taille de l'échantillon est grande, plus l'intervalle est étroit.",
        "note": "Cette formule repose sur le théorème central-limite qui assure la normalité de la moyenne \\( \\bar{X} \\)."
    },
    {
        "titre": "IC pour la Moyenne (σ inconnu)",
        "contenu": "<div><p>En pratique, l'écart-type de la population \\( \\sigma \\) est généralement <strong>inconnu</strong>. On l'estime par l'écart-type de l'échantillon \\( s \\).</p><p>L'intervalle de confiance au niveau \\( (1-\\alpha) \\) est alors :</p><div class='math-block'><div class='math'>$$ IC_{1-\\alpha}(\\mu) = \\left[ \\bar{x} - t_{\\alpha/2, n-1} \\frac{s}{\\sqrt{n}} ; \\bar{x} + t_{\\alpha/2, n-1} \\frac{s}{\\sqrt{n}} \\right] $$</div></div><ul style='font-size:0.95em;'><li><strong>\\( t_{\\alpha/2, n-1} \\)</strong> : Quantile de la loi de Student à \\( n-1 \\) degrés de liberté.</li><li><strong>\\( s \\)</strong> : Écart-type de l'échantillon.</li><li><strong>Degrés de liberté (ddl)</strong> : \\( n-1 \\).</li></ul><div style='background-color: #f8f9fa; padding: 10px; border-radius:8px; margin-top:10px;'><p><strong>Remarque :</strong> Lorsque \\( n \\) est grand (> 30), la loi de Student est très proche de la loi normale. On peut approximer \\( t_{\\alpha/2, n-1} \\) par \\( z_{\\alpha/2} \\).</p></div></div>",
        "texteParle": "Dans la vraie vie, nous ne connaissons que rarement l'écart-type de la population. Nous devons donc l'estimer à partir de l'échantillon. En remplaçant sigma par s, la marge d'erreur est plus grande car nous introduisons une source d'incertitude supplémentaire. La loi normale n'est alors plus adaptée, car le rapport entre la moyenne et l'écart-type estimé suit une loi de Student. Cette loi a des queues plus épaisses que la normale, ce qui donne des intervalles un peu plus larges pour un même niveau de confiance.",
        "note": "La loi de Student est fondamentale pour l'inférence lorsque la variance est inconnue."

    {
        "titre": "IC pour une Proportion",
        "contenu": "<div><p>Pour estimer une proportion \\( p \\) dans la population, on utilise la proportion de l'échantillon \\( \\hat{p} \\). L'intervalle de confiance au niveau \\( (1-\\alpha) \\) est :</p><div class='math-block'><div class='math'>$$ IC_{1-\\alpha}(p) = \\left[ \\hat{p} - z_{\\alpha/2} \\sqrt{\\frac{\\hat{p}(1-\\hat{p})}{n}} ; \\hat{p} + z_{\\alpha/2} \\sqrt{\\frac{\\hat{p}(1-\\hat{p})}{n}} \\right] $$</div></div><ul style='font-size:0.95em;'><li><strong>\\( \\hat{p} \\)</strong> : Proportion dans l'échantillon ( \\( \\hat{p} = \\frac{\\text{nombre de succès}}{n} \\) ).</li><li><strong>\\( z_{\\alpha/2} \\)</strong> : Quantile de la loi normale centrée réduite.</li><li><strong>\\( n \\)</strong> : Taille de l'échantillon.</li></ul><div style='background-color: #e9ecef; padding: 10px; border-radius:8px; margin-top:10px;'><p><strong>Conditions d'application :</strong> \\( n \\hat{p} \\geq 5 \\) et \\( n (1 - \\hat{p}) \\geq 5 \\) (ou 10).</p></div></div>",
        "texteParle": "Pour estimer une proportion, comme la proportion d'étudiants qui préfèrent le café, la logique est la même. On utilise la proportion de l'échantillon, notée p chapeau. L'écart-type de la distribution d'échantillonnage est la racine carrée de p chapeau fois un moins p chapeau, divisé par n. On utilise la loi normale pour approcher cette distribution. Il faut faire attention aux conditions d'application, notamment que les effectifs soient suffisamment grands pour que l'approximation normale soit valide.",

        "texteParle": "Pour construire un intervalle de confiance, il est crucial de connaître les valeurs du quantile z. Les plus utilisées sont pour les niveaux de confiance de 90%, 95% et 99%. Retenez bien ces trois valeurs : 1.645, 1.96 et 2.576. Vous remarquerez que plus on veut être confiant, plus la valeur z est grande. Pour un niveau de confiance de 95%, l'intervalle est plus large que pour 90%, mais on a plus de chances qu'il contienne la vraie valeur.",

    {

        "texteParle": "L'interprétation d'un intervalle de confiance est un piège classique. Il ne faut surtout pas dire qu'il y a 95% de chance que la vraie valeur soit dans l'intervalle. La vraie valeur est fixe, elle est soit dedans, soit dehors. La bonne interprétation est que si on répétait l'expérience un très grand nombre de fois, environ 95% des intervalles construits contiendraient la vraie valeur. C'est la procédure qui est fiable à 95%, pas l'intervalle en particulier.",
        "note": "L'interprétation fréquentiste est une source fréquente de confusion."
    },
    {
        "titre": "Cas Pratique 1 : Moyenne",
        "contenu": "<div><p><strong>Problème :</strong> Un chercheur veut estimer le temps moyen passé par les étudiants sur les réseaux sociaux. Il interroge un échantillon de <strong>36 étudiants</strong>. La moyenne de l'échantillon est de \\( \\bar{x} = 2.5 \\) heures par jour, avec un écart-type de \\( s = 1.2 \\) heures.</p><p><strong>Question :</strong> Construire un intervalle de confiance à <strong>95%</strong> pour la moyenne de la population.</p><hr><p><strong>Solution :</strong></p><ul style='font-size:0.95em;'><li>n = 36, \\( \\bar{x} = 2.5 \\), \\( s = 1.2 \\).</li><li>ddl = 35. \\( t_{0.025, 35} \\approx 2.03 \\) (ou \\( z=1.96 \\) si on approxime).</li><li>Marge d'erreur : \\( 2.03 \\times \\frac{1.2}{\\sqrt{36}} = 2.03 \\times 0.2 = 0.406 \\).</li><li><strong>IC à 95% :</strong> [2.5 - 0.406 ; 2.5 + 0.406] = <strong>[2.094 ; 2.906]</strong>.</li></ul><div style='background-color: #e9ecef; padding: 10px; border-radius:8px; margin-top:10px;'><p><strong>Conclusion :</strong> On est confiant à 95% que le temps moyen passé par tous les étudiants sur les réseaux sociaux est compris entre 2.09 et 2.91 heures par jour.</p></div></div>",
        "texteParle": "Prenons un exemple concret. Un chercheur veut estimer le temps moyen passé sur les réseaux sociaux par les étudiants. Il prend un échantillon de 36 étudiants et calcule une moyenne de 2.5 heures avec un écart-type de 1.2 heures. Nous allons construire l'intervalle de confiance à 95%. Comme la variance est inconnue, nous utilisons la loi de Student. L'intervalle va de 2.09 à 2.91 heures. Nous pouvons donc conclure, avec un niveau de confiance de 95%, que le temps moyen de tous les étudiants se situe dans cet intervalle.",
        "note": "Exemple d'utilisation de la loi de Student pour un échantillon de taille modérée."

    {

        "contenu": "<div><p><strong>Problème :</strong> Un journal souhaite estimer la proportion d'électeurs favorables à un candidat. Sur un échantillon de <strong>400 électeurs</strong>, <strong>160</strong> déclarent être favorables.</p><p><strong>Question :</strong> Estimer la proportion de l'ensemble des électeurs avec un intervalle de confiance à <strong>95%</strong>.</p><hr><p><strong>Solution :</strong></p><ul style='font-size:0.95em;'><li>n = 400, nombre de succès = 160.</li><li>\\( \\hat{p} = 160 / 400 = 0.4 \\).</li><li>\\( z_{0.025} = 1.96 \\).</li><li>Marge d'erreur : \\( 1.96 \\times \\sqrt{\\frac{0.4 \\times 0.6}{400}} = 1.96 \\times \\sqrt{0.0006} \\approx 1.96 \\times 0.0245 \\approx 0.048 \\).</li><li><strong>IC à 95% :</strong> [0.4 - 0.048 ; 0.4 + 0.048] = <strong>[0.352 ; 0.448]</strong>.</li></ul><div style='background-color: #e9ecef; padding: 10px; border-radius:8px; margin-top:10px;'><p><strong>Conclusion :</strong> On est confiant à 95% que la proportion d'électeurs favorables dans l'ensemble de la population est comprise entre <strong>35.2%</strong> et <strong>44.8%</strong>.</p></div></div>",
        "texteParle": "Pour un deuxième exemple, intéressons-nous à une proportion. Un journal interroge 400 électeurs, 160 se déclarent favorables à un candidat. Nous voulons estimer la proportion réelle dans la population avec un intervalle de confiance de 95%. On calcule la proportion de l'échantillon, 0.4, c'est à dire 40%. La marge d'erreur est d'environ 4.8%. L'intervalle va donc de 35.2% à 44.8%. Le candidat peut donc estimer, avec une confiance de 95%, que son score se situe dans cette fourchette.",

        "note": "Il s'agit d'un compromis fondamental en statistique : précision versus confiance."

    {
        "titre": "Résumé",
        "contenu": "<div><p>L'estimation par intervalle de confiance est un outil puissant pour quantifier l'incertitude.</p><ul style='font-size:1em;'><li>Elle fournit une <strong>fourchette de valeurs</strong> pour un paramètre inconnu.</li><li>Elle est associée à un <strong>niveau de confiance</strong> (ex: 95%, 99%).</li><li>La construction de l'intervalle dépend de la <strong>connaissance de σ</strong> (loi normale ou Student).</li><li>Pour une <strong>proportion</strong>, on utilise la loi normale (approximation).</li><li>La <strong>largeur</strong> dépend du niveau de confiance, de la taille de l'échantillon et de la variabilité.</li><li>L'<strong>interprétation</strong> doit se faire sur la méthode, et non sur l'intervalle calculé.</li></ul><div style='background-color: #e9ecef; padding: 10px; border-radius:8px; margin-top:10px;'><p style='text-align:center;'><strong>La statistique est l'art de ne jamais être certain, mais de l'être tout de même.</strong></p></div></div>",
        "texteParle": "Pour résumer, l'intervalle de confiance est un outil qui permet de donner une mesure de l'incertitude de nos estimations. Il ne donne pas une valeur unique, mais un intervalle de valeurs probables pour le paramètre de la population. La construction de l'intervalle dépend de la nature du paramètre à estimer et des informations dont on dispose. Retenez surtout que la largeur de l'intervalle vous donne une idée de la précision de votre estimation, et que son interprétation est cruciale.",

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentIndex = 0;
    let isSpeaking = false;
    let isPaused = false;
    let currentUtterance = null;
    let isLoading = false;
    let loadingTimeout = null;
    let isTransitioning = false;
    let speechSupported = true;
    let userInteracted = false;
    let isPlaying = false;
    let loadingCancelled = false;

    const total = slides.length;
    const synth = window.speechSynthesis;

    // Références jQuery
    const $title = $('#slideTitle');
    const $body = $('#slideBody');
    const $counter = $('#slideCounter');
    const $statusText = $('#statusText');
    const $statusBadge = $('#statusBadge');
    const $loading = $('#loadingOverlay');
    const $loadingText = $('#loadingText');
    const $loadingSub = $('#loadingSub');
    const $loadingTimeout = $('#loadingTimeout');
    const $loadingProgressBar = $('#loadingProgressBar');
    const $autoIndicator = $('#autoIndicator');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $replay = $('#replayBtn');
    const $play = $('#playBtn');
    const $cancelLoading = $('#cancelLoadingBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function setStatus(text, type) {
        $statusText.text(text);
        $statusBadge.removeClass('idle speaking error paused waiting loading');
        if (type === 'speaking') $statusBadge.addClass('speaking');
        else if (type === 'error') $statusBadge.addClass('error');
        else if (type === 'paused') $statusBadge.addClass('paused');
        else if (type === 'waiting') $statusBadge.addClass('waiting');
        else if (type === 'loading') $statusBadge.addClass('loading');
        else $statusBadge.addClass('idle');
    }

    function updatePlayButton() {
        if (isPlaying) {
            $play.addClass('playing');
            $play.find('.btn-icon').text('⏸');
            $play.find('.btn-label').text('Pause');
        } else {
            $play.removeClass('playing');
            $play.find('.btn-icon').text('▶');
            $play.find('.btn-label').text('Play');
        }
    }

    function showLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        
        loadingCancelled = false;
        isLoading = true;
        
        // Réinitialiser la barre de progression
        $loadingProgressBar.css('animation', 'none');
        $loadingProgressBar.css('width', '0%');
        // Forcer un reflow
        $loadingProgressBar[0].offsetHeight;
        $loadingProgressBar.css('animation', 'loadingProgress 30s ease-out forwards');
        
        $loadingText.text('Préparation vocale...');
        $loadingSub.text('Synthèse en cours');
        $loadingTimeout.text('⏱️ 30 secondes maximum');
        $loading.fadeIn(300);
        setStatus("⏳ Chargement...", 'loading');
        
        // 🔥 TIMEOUT DE 30 SECONDES
        loadingTimeout = setTimeout(() => {
            if (isLoading && !loadingCancelled) {
                hideLoading();
                setStatus("⚠️ Délai dépassé (30s)", 'error');
                isPlaying = false;
                updatePlayButton();
                $loadingSub.text('La synthèse vocale a pris trop de temps');
                $loadingTimeout.text('❌ Délai dépassé');
            }
        }, 30000);
    }

    function hideLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        isLoading = false;
        loadingCancelled = false;
        $loading.fadeOut(300);
        // Ne pas changer le statut si on est en train de parler
        if (!isSpeaking && !isPlaying) {
            setStatus("⏸ Lecture arrêtée", 'paused');
        }
    }

    function cancelLoading() {
        loadingCancelled = true;
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        hideLoading();
        stopSpeaking();
        setStatus("⏸ Annulé", 'paused');
        isPlaying = false;
        updatePlayButton();
        $loadingText.text('Annulé par l\'utilisateur');
        $loadingSub.text('Vous pouvez réessayer');
        $loadingTimeout.text('✕ Annulation');
    }

    // Arrêter la parole proprement
    function stopSpeaking() {
        try {
            if (synth && (synth.speaking || synth.pending)) {
                synth.cancel();
            }
        } catch(e) {
            console.warn('Erreur stopSpeaking:', e);
        }
        if (currentUtterance) {
            try {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance.onstart = null;
            } catch(e) {}
            currentUtterance = null;
        }
        isSpeaking = false;
        isPlaying = false;
        updatePlayButton();
    }

    // Mettre en pause la parole
    function pauseSpeaking() {
        try {
            if (synth && synth.speaking) {
                synth.pause();
                isPaused = true;
                isPlaying = false;
                setStatus("⏸ Lecture en pause", 'paused');
                updatePlayButton();
            }
        } catch(e) {
            console.warn('Erreur pauseSpeaking:', e);
            stopSpeaking();
        }
    }

    // Reprendre la parole
    function resumeSpeaking() {
        try {
            if (synth && synth.paused) {
                synth.resume();
                isPaused = false;
                isPlaying = true;
                setStatus("🔊 Lecture en cours", 'speaking');
                updatePlayButton();
            } else if (!isSpeaking && !synth.speaking && !synth.pending) {
                speakSlide(currentIndex);
            }
        } catch(e) {
            console.warn('Erreur resumeSpeaking:', e);
            speakSlide(currentIndex);
        }
    }

    function renderSlide(index) {
        const slide = slides[index];
        $title.text(slide.titre);

        let html = '';
        html += `<div class="content-card">${slide.contenu}</div>`;
        if (slide.note) {
            html += `<div class="note-box">${slide.note}</div>`;
        }
        $body.html(html);
        $counter.text(`${index+1} / ${total}`);

        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
        }
    }

    // ================================================================
    // LECTURE VOCALE
    // ================================================================
    function speakSlide(index) {
        return new Promise((resolve) => {
            const slide = slides[index];
            const text = slide.texteParle;
            
            if (!text || text.trim() === '' || !speechSupported) {
                resolve();
                return;
            }

            if (!window.speechSynthesis) {
                setStatus("❌ Synthèse vocale non supportée", 'error');
                speechSupported = false;
                resolve();
                return;
            }

            // Arrêter toute lecture en cours
            stopSpeaking();
            
            // Réinitialiser l'état de pause
            isPaused = false;
            
            showLoading();
            setStatus("Initialisation...", 'loading');

            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.92;
                utterance.pitch = 1.05;
                utterance.volume = 1;

                let isFinished = false;
                let errorHandled = false;

                utterance.onstart = function() {
                    if (loadingCancelled) {
                        stopSpeaking();
                        resolve();
                        return;
                    }
                    hideLoading();
                    isSpeaking = true;
                    isPlaying = true;
                    isPaused = false;
                    setStatus("🔊 Lecture en cours", 'speaking');
                    updatePlayButton();
                };

                utterance.onend = function() {
                    if (isFinished) return;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    setStatus("✅ Terminé", 'idle');
                    hideLoading();
                    updatePlayButton();
                    resolve();
                };

                utterance.onerror = function(e) {
                    if (isFinished || errorHandled) return;
                    errorHandled = true;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    hideLoading();
                    updatePlayButton();
                    
                    if (e.error === 'not-allowed') {
                        setStatus("⚠️ Permission refusée", 'error');
                    } else if (e.error === 'synthesis-unavailable') {
                        setStatus("⚠️ Synthèse indisponible", 'error');
                    } else if (e.error === 'canceled') {
                        setStatus("⏸ Annulé", 'paused');
                    } else {
                        setStatus("❌ Erreur audio: " + (e.error || 'inconnue'), 'error');
                    }
                    
                    resolve();
                };

                // Gestion du chargement des voix
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = function() {
                        if (!loadingCancelled) {
                            try {
                                synth.speak(utterance);
                            } catch(err) {
                                // Silencieux
                            }
                        }
                        synth.onvoiceschanged = null;
                    };
                }

                currentUtterance = utterance;
                
                if (!loadingCancelled) {
                    try {
                        synth.speak(utterance);
                    } catch(err) {
                        setTimeout(() => {
                            if (!loadingCancelled) {
                                try {
                                    synth.speak(utterance);
                                } catch(e) {
                                    setStatus("❌ Erreur de lecture", 'error');
                                    isPlaying = false;
                                    updatePlayButton();
                                    hideLoading();
                                    resolve();
                                }
                            } else {
                                resolve();
                            }
                        }, 100);
                    }
                } else {
                    resolve();
                }

            } catch(err) {
                hideLoading();
                setStatus("❌ Erreur générale", 'error');
                isPlaying = false;
                updatePlayButton();
                console.error('Erreur speakSlide:', err);
                resolve();
            }
        });
    }

    // ================================================================
    // NAVIGATION
    // ================================================================
    async function goToSlide(index) {
        if (isTransitioning) return;
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        
        // Si on est en train de lire, on met en pause avant de naviguer
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        // Arrêter complètement la lecture
        stopSpeaking();
        
        await new Promise(r => setTimeout(r, 50));
        
        if (index === currentIndex) {
            setStatus("📄 Slide actuel", 'idle');
            return;
        }

        isTransitioning = true;
        currentIndex = index;
        renderSlide(index);
        
        // Réinitialiser l'état de lecture
        isPlaying = false;
        updatePlayButton();
        setStatus("⏸ Lecture arrêtée", 'paused');

        await new Promise(r => setTimeout(r, 150));
        isTransitioning = false;
    }

    async function goToNext() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex + 1 < total) {
            await goToSlide(currentIndex + 1);
        } else {
            setStatus("🏁 Dernier slide", 'idle');
        }
    }

    async function goToPrev() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex - 1 >= 0) {
            await goToSlide(currentIndex - 1);
        } else {
            setStatus("🔁 Premier slide", 'idle');
        }
    }

    // ================================================================
    // GESTION PLAY/PAUSE
    // ================================================================
    function togglePlay() {
        if (!userInteracted) {
            userInteracted = true;
        }

        // Si le chargement est en cours, on l'annule
        if (isLoading) {
            cancelLoading();
            return;
        }

        // Si le synthétiseur est en pause, on reprend
        if (synth && synth.paused) {
            resumeSpeaking();
            return;
        }

        // Si la lecture est en cours, on met en pause
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
            return;
        }

        // Sinon, on démarre la lecture du slide courant
        if (!isSpeaking && !isPlaying) {
            stopSpeaking();
            speakSlide(currentIndex);
        }
    }

    // ================================================================
    // INIT
    // ================================================================
    async function init() {
        // Vérifier la compatibilité
        if (!window.speechSynthesis) {
            setStatus("❌ Synthèse vocale non supportée", 'error');
            speechSupported = false;
        }

        // Précharger les voix
        try {
            if (synth.getVoices) {
                synth.getVoices();
                setTimeout(() => {
                    try {
                        synth.getVoices();
                    } catch(e) {}
                }, 200);
            }
        } catch(e) {
            console.warn('Erreur chargement voix:', e);
        }

        // Afficher le premier slide
        renderSlide(0);
        $counter.text(`1 / ${total}`);
        
        // État initial
        setStatus("⏸ Appuie sur Play", 'paused');
        updatePlayButton();
        $autoIndicator.text('⏸ Lecture manuelle');

        // ================================================================
        // ÉVÉNEMENTS
        // ================================================================
        
        // Bouton Play/Pause
        $play.on('click', function() {
            togglePlay();
        });

        // Bouton Annuler le chargement
        $cancelLoading.on('click', function() {
            cancelLoading();
        });

        // Navigation
        $prev.on('click', function() {
            // Si chargement en cours, on annule
            if (isLoading) cancelLoading();
            goToPrev();
        });

        $next.on('click', function() {
            if (isLoading) cancelLoading();
            goToNext();
        });

        // Replay - relire le slide courant
        $replay.on('click', function() {
            if (isLoading) cancelLoading();
            stopSpeaking();
            setTimeout(() => {
                speakSlide(currentIndex);
            }, 100);
        });

        // Support du clavier (espace pour play/pause)
        $(document).on('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });

        // Nettoyage
        $(window).on('beforeunload', function() {
            try {
                if (synth.speaking) synth.cancel();
            } catch(e) {}
            hideLoading();
        });

        // Gérer les cas où la synthèse se termine de manière inattendue
        setInterval(() => {
            if (isPlaying && !synth.speaking && !synth.pending && !isPaused && !isLoading) {
                isPlaying = false;
                updatePlayButton();
                setStatus("⏸ Lecture arrêtée", 'paused');
            }
        }, 1000);
    }

    init();
});



    // ================================================================
    // GESTION DU THÈME JOUR/NUIT
    // ================================================================
    let isDarkMode = false;

    function toggleTheme() {
        isDarkMode = !isDarkMode;
        const body = document.body;
        const appContainer = document.querySelector('.app-container');
        const header = document.querySelector('.slide-header');
        const footer = document.querySelector('.slide-footer');
        const contentCards = document.querySelectorAll('.content-card');
        const noteBoxes = document.querySelectorAll('.note-box');
        const mathBlocks = document.querySelectorAll('.math-block');
        const buttons = document.querySelectorAll('.btn');
        const statusBadge = document.querySelector('.status-badge');
        const slideCounter = document.querySelector('.slide-counter');
        const autoIndicator = document.querySelector('.auto-indicator');
        const themeBtn = document.getElementById('themeToggle');

        if (isDarkMode) {
            // Mode nuit
            body.style.background = '#0b1120';
            body.style.color = '#f1f5f9';
            appContainer.style.background = 'linear-gradient(145deg, #0f172a 0%, #1e293b 100%)';
            header.style.background = 'rgba(15, 23, 42, 0.85)';
            footer.style.background = 'rgba(15, 23, 42, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.05)';
                card.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.08)';
                note.style.color = '#cbd5e1';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.25)';
                block.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#e2e8f0';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.12)';
                statusBadge.style.color = '#93bbfc';
            }
            if (slideCounter) {
                slideCounter.style.color = '#94a3b8';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#64748b';
            }
            if (themeBtn) {
                themeBtn.textContent = '☀️';
                themeBtn.title = 'Passer en mode jour';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#e2e8f0';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#e2e8f0';
                }
            });
        } else {
            // Mode jour (par défaut)
            body.style.background = '#f0f4f8';
            body.style.color = '#1a202c';
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
            header.style.background = 'rgba(255, 255, 255, 0.85)';
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.8)';
                card.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.12)';
                note.style.color = '#2c3e50';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.05)';
                block.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#2d3748';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
                statusBadge.style.color = '#2b6cb0';
            }
            if (slideCounter) {
                slideCounter.style.color = '#4a5568';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#718096';
            }
            if (themeBtn) {
                themeBtn.textContent = '🌓';
                themeBtn.title = 'Passer en mode nuit';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#2c3e50';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#2d3748';
                }
            });
        }
    }

    // Initialiser en mode jour
    document.addEventListener('DOMContentLoaded', function() {
        // Appliquer le mode jour par défaut
        const body = document.body;
        body.style.background = '#f0f4f8';
        body.style.color = '#1a202c';
        
        const appContainer = document.querySelector('.app-container');
        if (appContainer) {

        }

            note.style.color = '#2c3e50';

            block.style.borderColor = 'rgba(0,0,0,0.08)';
        });

        });

        if (statusBadge) {

            statusBadge.style.color = '#2b6cb0';
        }
        
        const slideCounter = document.querySelector('.slide-counter');
        if (slideCounter) {

        }
        
        const autoIndicator = document.querySelector('.auto-indicator');
        if (autoIndicator) {
            autoIndicator.style.color = '#718096';
        }
        
        document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
            if (!el.closest('.note-box')) {
                el.style.color = '#2c3e50';
            }
        });
        
        document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {

        const themeBtn = document.getElementById('themeToggle');
        if (themeBtn) {

            themeBtn.title = 'Passer en mode nuit';

    });
