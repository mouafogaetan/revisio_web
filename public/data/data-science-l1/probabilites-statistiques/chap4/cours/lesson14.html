<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Présentation mobile</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' },
            options: { skipHtmlTypes: 'script' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 500px;
        margin: 0 auto;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    .slide-header {
        flex-shrink: 0;
        padding: 18px 16px 10px 16px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        z-index: 10;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .slide-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
    }

    .content-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 18px 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        flex-shrink: 0;
    }

    .content-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .content-card li {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        line-height: 1.5;
    }

    .content-card li:last-child {
        border-bottom: none;
    }

    .bullet-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
    }

    .math-block {
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        overflow-x: auto;
        flex-shrink: 0;
        margin: 4px 0;
    }

    .math-block .math {
        font-size: 1.2rem;
        color: #e2e8f0;
    }

    .note-box {
        background: rgba(96, 165, 250, 0.08);
        border-left: 4px solid #60a5fa;
        padding: 12px 16px;
        border-radius: 12px;
        font-style: italic;
        font-size: 0.9rem;
        color: #cbd5e1;
        flex-shrink: 0;
    }

    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        border-radius: 0;
        flex-direction: column;
    }

    .loading-card {
        background: #1e293b;
        padding: 32px 28px;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #334155;
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px auto;
    }

    .loading-text {
        font-weight: 600;
        font-size: 1.1rem;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    .loading-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 16px;
    }
    .loading-progress {
        height: 3px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        animation: loadingProgress 30s ease-out forwards;
    }

    .loading-timeout {
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 12px;
    }

    .btn-cancel-loading {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 40px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #f87171;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }

    .btn-cancel-loading:active {
        transform: scale(0.94);
        background: rgba(239, 68, 68, 0.25);
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
    }

    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .slide-counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255,255,255,0.05);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(255,255,255,0.04);
    }

    .status-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 30px;
        background: rgba(96, 165, 250, 0.12);
        color: #93bbfc;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
    }

    .status-badge .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: pulse-dot 1.2s infinite;
        flex-shrink: 0;
    }

    .status-badge.idle .dot {
        animation: none;
        background: #64748b;
    }
    .status-badge.speaking .dot {
        background: #34d399;
        animation: pulse-dot 0.8s infinite;
    }
    .status-badge.error .dot {
        background: #f87171;
        animation: none;
    }
    .status-badge.paused .dot {
        animation: none;
        background: #fbbf24;
    }
    .status-badge.waiting .dot {
        animation: pulse-dot 1.5s infinite;
        background: #fbbf24;
    }
    .status-badge.loading .dot {
        animation: pulse-dot 0.5s infinite;
        background: #60a5fa;
    }

    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.7); }
    }

    .footer-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(255,255,255,0.1);
    }

    .btn-secondary {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-play {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
        min-width: 80px;
        justify-content: center;
    }
    .btn-play:active {
        background: rgba(52, 211, 153, 0.25);
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
    }

    .auto-indicator {
        font-size: 0.65rem;
        color: #64748b;
        text-align: center;
        letter-spacing: 0.3px;
        padding: 2px 0;
    }

    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.2rem;
        }
        .content-card li {
            font-size: 0.9rem;
            padding: 8px 0;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .btn-play {
            min-width: 60px;
        }
        .footer-buttons {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
        .loading-card {
            padding: 20px 16px;
        }
        .math-block .math {
            font-size: 1rem;
        }
    }

    @media (min-width: 600px) {
        .app-container {
            max-width: 480px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
        .loading-overlay {
            border-radius: 32px;
        }
    }

    /* Mode jour (par défaut) */
    html, body {
        background: #f0f4f8 !important;
        color: #1a202c !important;
    }
    .app-container {
        background: linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%) !important;
    }
    .slide-header {
        background: rgba(255, 255, 255, 0.85) !important;
        border-bottom: 1px solid rgba(0,0,0,0.08) !important;
    }
    .slide-header h1 {
        background: linear-gradient(135deg, #2b6cb0, #6b46c1) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        background-clip: text !important;
    }
    .slide-footer {
        background: rgba(255, 255, 255, 0.9) !important;
        border-top: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card {
        background: rgba(255,255,255,0.8) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card li {
        border-bottom: 1px solid rgba(0,0,0,0.05) !important;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.12) !important;
        border-left: 4px solid #4299e1 !important;
        color: #2c3e50 !important;
    }
    .math-block {
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .math-block .math {
        color: #2d3748 !important;
    }
    .slide-counter {
        color: #4a5568 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .status-badge {
        background: rgba(96, 165, 250, 0.15) !important;
        color: #2b6cb0 !important;
        border: 1px solid rgba(96, 165, 250, 0.15) !important;
    }
    .btn {
        color: #2d3748 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .btn-secondary {
        background: rgba(0,0,0,0.04) !important;
        border-color: rgba(0,0,0,0.08) !important;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15) !important;
        border-color: rgba(52, 211, 153, 0.2) !important;
        color: #38a169 !important;
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15) !important;
        border-color: rgba(251, 191, 36, 0.2) !important;
        color: #d69e2e !important;
    }
    .auto-indicator {
        color: #718096 !important;
    }
    .loading-card {
        background: #ffffff !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .loading-text {
        color: #1a202c !important;
    }
    .loading-sub {
        color: #4a5568 !important;
    }
</style>
</head>
<body>

<div class="app-container">

    <header class="slide-header">
        <h1 id="slideTitle">Chargement...</h1>
    </header>

    <main class="slide-body" id="slideBody"></main>

    <!-- LOADING OVERLAY AVEC BOUTON ANNULER -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Préparation vocale...</div>
            <div class="loading-sub" id="loadingSub">Synthèse en cours</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loadingProgressBar"></div>
            </div>
            <div class="loading-timeout" id="loadingTimeout">⏱️ 30 secondes maximum</div>
            <button class="btn-cancel-loading" id="cancelLoadingBtn">
                <span>✕</span> Annuler
            </button>
        </div>
    </div>

    <footer class="slide-footer">
        <div class="footer-top">
            <span class="slide-counter" id="slideCounter">1 / 3</span>
            <span class="status-badge idle" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">Prêt</span>
            </span>
        </div>

        <div class="footer-buttons">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-secondary" id="replayBtn">
                <span class="btn-icon">🔁</span> <span class="btn-label">Relire</span>
            </button>
            <button class="btn btn-play" id="playBtn">
                <span class="btn-icon">▶</span> <span class="btn-label">Play</span>
            </button>
        </div>

        <div class="auto-indicator" id="autoIndicator">⏸ Lecture manuelle</div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // SLIDES
    // ================================================================
    const slides = [
    {
        "titre": "Introduction aux Tests",
        "contenu": "<div style='background: #e3f2fd; padding: 20px; border-radius: 10px; color: #0d47a1;'>\n<p style='font-size:1.2rem; margin-top:0;'>Nous entrons dans une phase cruciale de la statistique inférentielle : <strong>les tests d'hypothèses</strong>.</p>\n<p>Objectif : Prendre une décision sur une population à partir d'un échantillon.</p>\n<div style='background: #bbdefb; padding: 15px; border-radius: 8px; margin-top: 15px;'>\n  <p style='margin:0;'><strong>Exemple concret :</strong> Un laboratoire pharmaceutique affirme que son nouveau médicament guérit 80% des patients. À partir d'un essai sur 100 patients, peut-on croire cette affirmation ?</p>\n</div>\n</div>",
        "texteParle": "Bonjour à tous. Nous abordons aujourd'hui un sujet très important en statistique : les tests d'hypothèses. L'objectif est de prendre une décision sur une population entière à partir d'un échantillon. Par exemple, un laboratoire pharmaceutique affirme que son médicament guérit 80 pour cent des patients. À partir d'un essai clinique sur 100 patients, peut-on croire cette affirmation ou doit-on la rejeter ? C'est ce type de question que nous allons apprendre à résoudre.",
        "note": "Le test d'hypothèse est une procédure de décision statistique."
    },
    {
        "titre": "Définitions",
        "contenu": "<div style='background: #f5f5f5; padding: 15px; border-radius: 10px; color: #212121;'>\n<h3 style='margin-top:0;'>Hypothèses</h3>\n<ul style='list-style-type: disc; padding-left: 20px;'>\n  <li><strong>Hypothèse nulle (H0) :</strong> C'est l'hypothèse que l'on cherche à rejeter. Elle représente le statu quo ou une affirmation à tester.</li>\n  <li><strong>Hypothèse alternative (H1 ou Ha) :</strong> C'est l'hypothèse que l'on souhaite mettre en évidence. Elle est retenue si H0 est rejetée.</li>\n</ul>\n\n<div class='math-block' style='background: #e0e0e0; padding: 10px; border-radius: 8px; margin-top: 10px;'>\n  <div class='math'>$$H_0 : \\mu = \\mu_0 \\quad \\text{contre} \\quad H_1 : \\mu \\neq \\mu_0$$</div>\n</div>\n\n<div style='background: #ffecb3; padding: 10px; border-radius: 5px; margin-top: 10px;'>\n  <p style='margin:0;'><strong>Exemple :</strong> \\( H_0: p = 0.8 \\) (le médicament guérit 80% des patients) contre \\( H_1: p \\neq 0.8 \\) (le taux de guérison est différent de 80%).</p>\n</div>\n</div>",
        "texteParle": "Commençons par les définitions de base. Dans un test d'hypothèse, nous formulons deux hypothèses. L'hypothèse nulle, notée H zéro, est l'hypothèse que l'on cherche à rejeter. Elle représente souvent le statu quo ou une affirmation que l'on veut tester. L'hypothèse alternative, notée H un ou Ha, est l'hypothèse que l'on souhaite mettre en évidence. Si l'on rejette H zéro, on retient l'hypothèse alternative. Par exemple, on pourrait tester H zéro : la proportion de guérison est égale à 80 pour cent contre H un : la proportion est différente de 80 pour cent.",
        "note": "H0 est l'hypothèse par défaut que l'on teste."
    },
    {
        "titre": "Risques d'Erreur",
        "contenu": "<div style='background: #ffebee; padding: 15px; border-radius: 10px; color: #b71c1c;'>\n<h3 style='margin-top:0;'>Deux types d'erreurs</h3>\n<table style='width:100%; border-collapse: collapse; background: #ffcdd2; border-radius: 8px; overflow: hidden;'>\n  <thead>\n    <tr style='background: #c62828; color: white;'>\n      <th style='padding: 8px; text-align: center;'></th>\n      <th style='padding: 8px; text-align: center;'>H0 vraie</th>\n      <th style='padding: 8px; text-align: center;'>H0 fausse</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr style='background: #ffcdd2;'>\n      <td style='padding: 8px;'><strong>Rejeter H0</strong></td>\n      <td style='padding: 8px; background: #ef9a9a;'>Erreur de type I (risque α)</td>\n      <td style='padding: 8px; background: #a5d6a7;'>Bonne décision</td>\n    </tr>\n    <tr style='background: #ffcdd2;'>\n      <td style='padding: 8px;'><strong>Ne pas rejeter H0</strong></td>\n      <td style='padding: 8px; background: #a5d6a7;'>Bonne décision</td>\n      <td style='padding: 8px; background: #ef9a9a;'>Erreur de type II (risque β)</td>\n    </tr>\n  </tbody>\n</table>\n\n<div style='margin-top: 10px;'>\n  <p><strong>Erreur de type I (α) :</strong> Rejeter H0 alors qu'elle est vraie. (Faux positif)</p>\n  <p><strong>Erreur de type II (β) :</strong> Ne pas rejeter H0 alors qu'elle est fausse. (Faux négatif)</p>\n</div>\n<div style='background: #e53935; color: white; padding: 8px; border-radius: 5px; margin-top: 10px; text-align: center;'>\n  <strong>Puissance du test :</strong> 1 - β = Probabilité de rejeter H0 à bon escient.\n</div>\n</div>",
        "texteParle": "Lorsque l'on prend une décision, on peut commettre des erreurs. Il y a deux types d'erreurs. L'erreur de type un, notée alpha, consiste à rejeter l'hypothèse nulle alors qu'elle est vraie. C'est ce qu'on appelle un faux positif. L'erreur de type deux, notée bêta, consiste à ne pas rejeter l'hypothèse nulle alors qu'elle est fausse. C'est un faux négatif. La puissance du test est la probabilité de rejeter correctement une hypothèse nulle fausse. Elle est égale à un moins bêta.",
        "note": "Le risque α est fixé par le statisticien (souvent 5%)."
    },
    {
        "titre": "Principe du Test",
        "contenu": "<div style='background: #e8f5e9; padding: 15px; border-radius: 10px; color: #1b5e20;'>\n<h3 style='margin-top:0;'>Les étapes d'un test</h3>\n<ol style='list-style-type: decimal; padding-left: 20px;'>\n  <li><strong>Formuler H0 et H1</strong></li>\n  <li><strong>Choisir le risque α</strong> (généralement 5%)</li>\n  <li><strong>Calculer la statistique de test</strong> à partir des données</li>\n  <li><strong>Déterminer la région de rejet</strong> (ou la p-value)</li>\n  <li><strong>Conclusion :</strong> On rejette H0 si la statistique est dans la région de rejet (ou si p-value < α).</li>\n</ol>\n\n<div class='math-block' style='background: #c8e6c9; padding: 10px; border-radius: 8px; margin-top: 10px;'>\n  <div class='math'>$$\\text{Statistique de test} = \\frac{\\text{Estimation} - \\text{Valeur sous H0}}{\\text{Erreur standard}}$$</div>\n</div>\n</div>",
        "texteParle": "Le principe d'un test d'hypothèse suit toujours les mêmes étapes. D'abord, on formule les hypothèses nulle et alternative. Ensuite, on choisit un risque alpha, souvent 5 pour cent. Puis on calcule une statistique de test à partir des données de l'échantillon. Cette statistique est généralement une estimation moins la valeur supposée sous H zéro, le tout divisé par l'erreur standard. Ensuite, on détermine une région de rejet, c'est-à-dire les valeurs de la statistique qui nous amèneront à rejeter H zéro. Enfin, on prend une décision : on rejette H zéro si la statistique se trouve dans la région de rejet.",
        "note": "La p-value est la probabilité d'observer une statistique aussi extrême que celle calculée si H0 est vraie."
    },
    {
        "titre": "Test Z pour une Moyenne",
        "contenu": "<div style='background: #e3f2fd; padding: 15px; border-radius: 10px; color: #0d47a1;'>\n<h3 style='margin-top:0;'>Test de comparaison à une moyenne théorique (σ connu)</h3>\n<p>On veut tester \\( H_0: \\mu = \\mu_0 \\) contre \\( H_1: \\mu \\neq \\mu_0 \\).</p>\n\n<div class='math-block' style='background: #bbdefb; padding: 10px; border-radius: 8px;'>\n  <div class='math'>$$Z = \\frac{\\bar{X} - \\mu_0}{\\sigma / \\sqrt{n}} \\sim \\mathcal{N}(0, 1) \\text{ sous } H_0$$</div>\n</div>\n\n<p><strong>Règle de décision (seuil α) :</strong></p>\n<ul style='list-style-type: disc; padding-left: 20px;'>\n  <li>Rejeter H0 si \\( |Z| > z_{1-\\alpha/2} \\)</li>\n  <li>Ne pas rejeter H0 si \\( |Z| \\leq z_{1-\\alpha/2} \\)</li>\n</ul>\n<div style='background: #1565c0; color: white; padding: 10px; border-radius: 5px; margin-top: 10px;'>\n  <p style='margin:0;'><strong>Application :</strong> Contrôle de qualité, production industrielle, tests de performance.</p>\n</div>\n</div>",
        "texteParle": "Le premier test que nous allons voir est le test Z pour une moyenne. Il est utilisé lorsque l'on connaît l'écart-type de la population. On veut tester si la moyenne de la population est égale à une valeur donnée mu zéro. La statistique de test est Z. C'est la moyenne de l'échantillon moins mu zéro, divisé par sigma sur racine de n. Sous l'hypothèse nulle, cette statistique suit une loi normale centrée réduite. Pour un risque alpha fixé, on rejette H zéro si la valeur absolue de Z est supérieure au quantile d'ordre un moins alpha sur deux de la loi normale. Ce test est très utilisé dans le contrôle de qualité et les tests de performance.",
        "note": "Le test Z suppose que l'écart-type σ de la population est connu."

    {
        "titre": "Test t de Student",
        "contenu": "<div style='background: #fff3e0; padding: 15px; border-radius: 10px; color: #e65100;'>\n<h3 style='margin-top:0;'>Test de comparaison à une moyenne théorique (σ inconnu)</h3>\n<p>Lorsque l'écart-type \\( \\sigma \\) est inconnu, on l'estime par l'écart-type empirique \\( s \\).</p>\n\n<div class='math-block' style='background: #ffe0b2; padding: 10px; border-radius: 8px;'>\n  <div class='math'>$$T = \\frac{\\bar{X} - \\mu_0}{s / \\sqrt{n}} \\sim t_{n-1} \\text{ sous } H_0$$</div>\n</div>\n\n<p>La statistique T suit une <strong>loi de Student</strong> à \\( n-1 \\) degrés de liberté.</p>\n\n<div style='background: #bf360c; color: white; padding: 10px; border-radius: 5px; margin-top: 10px;'>\n  <p style='margin:0;'><strong>Particularité :</strong> La loi de Student a des queues plus épaisses que la loi normale, ce qui rend le test plus conservateur.</p>\n</div>\n</div>",
        "texteParle": "Dans la réalité, il est rare de connaître l'écart-type de la population. C'est pourquoi on utilise souvent le test t de Student. Dans ce cas, on estime l'écart-type par l'écart-type empirique de l'échantillon. La statistique de test est alors T, qui est la moyenne de l'échantillon moins mu zéro, divisé par s sur racine de n. Sous l'hypothèse nulle, cette statistique suit une loi de Student à n moins un degrés de liberté. La loi de Student a des queues plus épaisses que la loi normale, ce qui rend le test plus conservateur.",

        "texteParle": "Un autre test très courant est le test sur une proportion. On veut tester si la proportion dans la population est égale à une valeur donnée p zéro. La statistique de test est Z. C'est la proportion observée dans l'échantillon moins p zéro, divisé par la racine carrée de p zéro fois un moins p zéro sur n. Sous l'hypothèse nulle, cette statistique suit une loi normale centrée réduite. Ce test s'applique sous certaines conditions : la taille de l'échantillon doit être d'au moins 30, et n fois p zéro et n fois un moins p zéro doivent être supérieurs à 5. Ce test est très utilisé dans les sondages électoraux ou les études de marché.",

        "contenu": "<div style='background: #f3e5f5; padding: 15px; border-radius: 10px; color: #4a148c;'>\n<h3 style='margin-top:0;'>Test bilatéral vs unilatéral</h3>\n\n<div style='background: #e1bee7; padding: 10px; border-radius: 8px; margin-bottom: 10px;'>\n  <p style='margin:0;'><strong>Test bilatéral :</strong> \\( H_1: \\mu \\neq \\mu_0 \\)</p>\n  <p style='margin:0;'>Région de rejet : \\( |Z| > z_{1-\\alpha/2} \\)</p>\n</div>\n\n<div style='background: #e1bee7; padding: 10px; border-radius: 8px;'>\n  <p style='margin:0;'><strong>Test unilatéral à droite :</strong> \\( H_1: \\mu > \\mu_0 \\)</p>\n  <p style='margin:0;'>Région de rejet : \\( Z > z_{1-\\alpha} \\)</p>\n</div>\n\n<div style='background: #e1bee7; padding: 10px; border-radius: 8px; margin-top: 10px;'>\n  <p style='margin:0;'><strong>Test unilatéral à gauche :</strong> \\( H_1: \\mu < \\mu_0 \\)</p>\n  <p style='margin:0;'>Région de rejet : \\( Z < -z_{1-\\alpha} \\)</p>\n</div>\n\n<div style='background: #6a1b9a; color: white; padding: 8px; border-radius: 5px; margin-top: 10px;'>\n  <p style='margin:0;'><strong>Choix :</strong> Le caractère bilatéral ou unilatéral dépend du sens de l'alternative.</p>\n</div>\n</div>",
        "texteParle": "La région de rejet dépend du type d'alternative. Si l'alternative est bilatérale, c'est-à-dire que la moyenne est différente de mu zéro, on rejette H zéro si la valeur absolue de Z est supérieure au quantile d'ordre un moins alpha sur deux. Si l'alternative est unilatérale à droite, on rejette H zéro si Z est supérieur au quantile d'ordre un moins alpha. Pour une alternative unilatérale à gauche, on rejette H zéro si Z est inférieur à l'opposé de ce quantile. Le choix dépend du sens de l'hypothèse alternative que l'on souhaite mettre en évidence.",

        "texteParle": "La p-value est un concept clé dans les tests d'hypothèses. C'est la probabilité, sous l'hypothèse nulle, d'observer une statistique de test aussi extrême que celle que l'on a calculée. Pour prendre une décision, on compare la p-value au risque alpha que l'on a fixé. Si la p-value est inférieure à alpha, on rejette H zéro : le résultat est statistiquement significatif. Si la p-value est supérieure à alpha, on ne rejette pas H zéro. Une petite p-value, par exemple inférieure à 5 pour cent, est une preuve forte contre l'hypothèse nulle.",

        "texteParle": "Pour résumer ce que nous avons appris aujourd'hui. Le test Z pour une moyenne est utilisé quand l'écart-type de la population est connu. La statistique suit une loi normale centrée réduite. Le test t de Student est utilisé quand l'écart-type est inconnu, et la statistique suit une loi de Student. Enfin, le test sur une proportion utilise la loi normale, à condition que l'échantillon soit suffisamment grand. Le choix du test dépend donc de la nature du paramètre que l'on teste, de ce que l'on connaît sur la population, et de la taille de l'échantillon.",

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentIndex = 0;
    let isSpeaking = false;
    let isPaused = false;
    let currentUtterance = null;
    let isLoading = false;
    let loadingTimeout = null;
    let isTransitioning = false;
    let speechSupported = true;
    let userInteracted = false;
    let isPlaying = false;
    let loadingCancelled = false;

    const total = slides.length;
    const synth = window.speechSynthesis;

    // Références jQuery
    const $title = $('#slideTitle');
    const $body = $('#slideBody');
    const $counter = $('#slideCounter');
    const $statusText = $('#statusText');
    const $statusBadge = $('#statusBadge');
    const $loading = $('#loadingOverlay');
    const $loadingText = $('#loadingText');
    const $loadingSub = $('#loadingSub');
    const $loadingTimeout = $('#loadingTimeout');
    const $loadingProgressBar = $('#loadingProgressBar');
    const $autoIndicator = $('#autoIndicator');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $replay = $('#replayBtn');
    const $play = $('#playBtn');
    const $cancelLoading = $('#cancelLoadingBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function setStatus(text, type) {
        $statusText.text(text);
        $statusBadge.removeClass('idle speaking error paused waiting loading');
        if (type === 'speaking') $statusBadge.addClass('speaking');
        else if (type === 'error') $statusBadge.addClass('error');
        else if (type === 'paused') $statusBadge.addClass('paused');
        else if (type === 'waiting') $statusBadge.addClass('waiting');
        else if (type === 'loading') $statusBadge.addClass('loading');
        else $statusBadge.addClass('idle');
    }

    function updatePlayButton() {
        if (isPlaying) {
            $play.addClass('playing');
            $play.find('.btn-icon').text('⏸');
            $play.find('.btn-label').text('Pause');
        } else {
            $play.removeClass('playing');
            $play.find('.btn-icon').text('▶');
            $play.find('.btn-label').text('Play');
        }
    }

    function showLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        
        loadingCancelled = false;
        isLoading = true;
        
        // Réinitialiser la barre de progression
        $loadingProgressBar.css('animation', 'none');
        $loadingProgressBar.css('width', '0%');
        // Forcer un reflow
        $loadingProgressBar[0].offsetHeight;
        $loadingProgressBar.css('animation', 'loadingProgress 30s ease-out forwards');
        
        $loadingText.text('Préparation vocale...');
        $loadingSub.text('Synthèse en cours');
        $loadingTimeout.text('⏱️ 30 secondes maximum');
        $loading.fadeIn(300);
        setStatus("⏳ Chargement...", 'loading');
        
        // 🔥 TIMEOUT DE 30 SECONDES
        loadingTimeout = setTimeout(() => {
            if (isLoading && !loadingCancelled) {
                hideLoading();
                setStatus("⚠️ Délai dépassé (30s)", 'error');
                isPlaying = false;
                updatePlayButton();
                $loadingSub.text('La synthèse vocale a pris trop de temps');
                $loadingTimeout.text('❌ Délai dépassé');
            }
        }, 30000);
    }

    function hideLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        isLoading = false;
        loadingCancelled = false;
        $loading.fadeOut(300);
        // Ne pas changer le statut si on est en train de parler
        if (!isSpeaking && !isPlaying) {
            setStatus("⏸ Lecture arrêtée", 'paused');
        }
    }

    function cancelLoading() {
        loadingCancelled = true;
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        hideLoading();
        stopSpeaking();
        setStatus("⏸ Annulé", 'paused');
        isPlaying = false;
        updatePlayButton();
        $loadingText.text('Annulé par l\'utilisateur');
        $loadingSub.text('Vous pouvez réessayer');
        $loadingTimeout.text('✕ Annulation');
    }

    // Arrêter la parole proprement
    function stopSpeaking() {
        try {
            if (synth && (synth.speaking || synth.pending)) {
                synth.cancel();
            }
        } catch(e) {
            console.warn('Erreur stopSpeaking:', e);
        }
        if (currentUtterance) {
            try {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance.onstart = null;
            } catch(e) {}
            currentUtterance = null;
        }
        isSpeaking = false;
        isPlaying = false;
        updatePlayButton();
    }

    // Mettre en pause la parole
    function pauseSpeaking() {
        try {
            if (synth && synth.speaking) {
                synth.pause();
                isPaused = true;
                isPlaying = false;
                setStatus("⏸ Lecture en pause", 'paused');
                updatePlayButton();
            }
        } catch(e) {
            console.warn('Erreur pauseSpeaking:', e);
            stopSpeaking();
        }
    }

    // Reprendre la parole
    function resumeSpeaking() {
        try {
            if (synth && synth.paused) {
                synth.resume();
                isPaused = false;
                isPlaying = true;
                setStatus("🔊 Lecture en cours", 'speaking');
                updatePlayButton();
            } else if (!isSpeaking && !synth.speaking && !synth.pending) {
                speakSlide(currentIndex);
            }
        } catch(e) {
            console.warn('Erreur resumeSpeaking:', e);
            speakSlide(currentIndex);
        }
    }

    function renderSlide(index) {
        const slide = slides[index];
        $title.text(slide.titre);

        let html = '';
        html += `<div class="content-card">${slide.contenu}</div>`;
        if (slide.note) {
            html += `<div class="note-box">${slide.note}</div>`;
        }
        $body.html(html);
        $counter.text(`${index+1} / ${total}`);

        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
        }
    }

    // ================================================================
    // LECTURE VOCALE
    // ================================================================
    function speakSlide(index) {
        return new Promise((resolve) => {
            const slide = slides[index];
            const text = slide.texteParle;
            
            if (!text || text.trim() === '' || !speechSupported) {
                resolve();
                return;
            }

            if (!window.speechSynthesis) {
                setStatus("❌ Synthèse vocale non supportée", 'error');
                speechSupported = false;
                resolve();
                return;
            }

            // Arrêter toute lecture en cours
            stopSpeaking();
            
            // Réinitialiser l'état de pause
            isPaused = false;
            
            showLoading();
            setStatus("Initialisation...", 'loading');

            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.92;
                utterance.pitch = 1.05;
                utterance.volume = 1;

                let isFinished = false;
                let errorHandled = false;

                utterance.onstart = function() {
                    if (loadingCancelled) {
                        stopSpeaking();
                        resolve();
                        return;
                    }
                    hideLoading();
                    isSpeaking = true;
                    isPlaying = true;
                    isPaused = false;
                    setStatus("🔊 Lecture en cours", 'speaking');
                    updatePlayButton();
                };

                utterance.onend = function() {
                    if (isFinished) return;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    setStatus("✅ Terminé", 'idle');
                    hideLoading();
                    updatePlayButton();
                    resolve();
                };

                utterance.onerror = function(e) {
                    if (isFinished || errorHandled) return;
                    errorHandled = true;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    hideLoading();
                    updatePlayButton();
                    
                    if (e.error === 'not-allowed') {
                        setStatus("⚠️ Permission refusée", 'error');
                    } else if (e.error === 'synthesis-unavailable') {
                        setStatus("⚠️ Synthèse indisponible", 'error');
                    } else if (e.error === 'canceled') {
                        setStatus("⏸ Annulé", 'paused');
                    } else {
                        setStatus("❌ Erreur audio: " + (e.error || 'inconnue'), 'error');
                    }
                    
                    resolve();
                };

                // Gestion du chargement des voix
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = function() {
                        if (!loadingCancelled) {
                            try {
                                synth.speak(utterance);
                            } catch(err) {
                                // Silencieux
                            }
                        }
                        synth.onvoiceschanged = null;
                    };
                }

                currentUtterance = utterance;
                
                if (!loadingCancelled) {
                    try {
                        synth.speak(utterance);
                    } catch(err) {
                        setTimeout(() => {
                            if (!loadingCancelled) {
                                try {
                                    synth.speak(utterance);
                                } catch(e) {
                                    setStatus("❌ Erreur de lecture", 'error');
                                    isPlaying = false;
                                    updatePlayButton();
                                    hideLoading();
                                    resolve();
                                }
                            } else {
                                resolve();
                            }
                        }, 100);
                    }
                } else {
                    resolve();
                }

            } catch(err) {
                hideLoading();
                setStatus("❌ Erreur générale", 'error');
                isPlaying = false;
                updatePlayButton();
                console.error('Erreur speakSlide:', err);
                resolve();
            }
        });
    }

    // ================================================================
    // NAVIGATION
    // ================================================================
    async function goToSlide(index) {
        if (isTransitioning) return;
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        
        // Si on est en train de lire, on met en pause avant de naviguer
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        // Arrêter complètement la lecture
        stopSpeaking();
        
        await new Promise(r => setTimeout(r, 50));
        
        if (index === currentIndex) {
            setStatus("📄 Slide actuel", 'idle');
            return;
        }

        isTransitioning = true;
        currentIndex = index;
        renderSlide(index);
        
        // Réinitialiser l'état de lecture
        isPlaying = false;
        updatePlayButton();
        setStatus("⏸ Lecture arrêtée", 'paused');

        await new Promise(r => setTimeout(r, 150));
        isTransitioning = false;
    }

    async function goToNext() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex + 1 < total) {
            await goToSlide(currentIndex + 1);
        } else {
            setStatus("🏁 Dernier slide", 'idle');
        }
    }

    async function goToPrev() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex - 1 >= 0) {
            await goToSlide(currentIndex - 1);
        } else {
            setStatus("🔁 Premier slide", 'idle');
        }
    }

    // ================================================================
    // GESTION PLAY/PAUSE
    // ================================================================
    function togglePlay() {
        if (!userInteracted) {
            userInteracted = true;
        }

        // Si le chargement est en cours, on l'annule
        if (isLoading) {
            cancelLoading();
            return;
        }

        // Si le synthétiseur est en pause, on reprend
        if (synth && synth.paused) {
            resumeSpeaking();
            return;
        }

        // Si la lecture est en cours, on met en pause
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
            return;
        }

        // Sinon, on démarre la lecture du slide courant
        if (!isSpeaking && !isPlaying) {
            stopSpeaking();
            speakSlide(currentIndex);
        }
    }

    // ================================================================
    // INIT
    // ================================================================
    async function init() {
        // Vérifier la compatibilité
        if (!window.speechSynthesis) {
            setStatus("❌ Synthèse vocale non supportée", 'error');
            speechSupported = false;
        }

        // Précharger les voix
        try {
            if (synth.getVoices) {
                synth.getVoices();
                setTimeout(() => {
                    try {
                        synth.getVoices();
                    } catch(e) {}
                }, 200);
            }
        } catch(e) {
            console.warn('Erreur chargement voix:', e);
        }

        // Afficher le premier slide
        renderSlide(0);
        $counter.text(`1 / ${total}`);
        
        // État initial
        setStatus("⏸ Appuie sur Play", 'paused');
        updatePlayButton();
        $autoIndicator.text('⏸ Lecture manuelle');

        // ================================================================
        // ÉVÉNEMENTS
        // ================================================================
        
        // Bouton Play/Pause
        $play.on('click', function() {
            togglePlay();
        });

        // Bouton Annuler le chargement
        $cancelLoading.on('click', function() {
            cancelLoading();
        });

        // Navigation
        $prev.on('click', function() {
            // Si chargement en cours, on annule
            if (isLoading) cancelLoading();
            goToPrev();
        });

        $next.on('click', function() {
            if (isLoading) cancelLoading();
            goToNext();
        });

        // Replay - relire le slide courant
        $replay.on('click', function() {
            if (isLoading) cancelLoading();
            stopSpeaking();
            setTimeout(() => {
                speakSlide(currentIndex);
            }, 100);
        });

        // Support du clavier (espace pour play/pause)
        $(document).on('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });

        // Nettoyage
        $(window).on('beforeunload', function() {
            try {
                if (synth.speaking) synth.cancel();
            } catch(e) {}
            hideLoading();
        });

        // Gérer les cas où la synthèse se termine de manière inattendue
        setInterval(() => {
            if (isPlaying && !synth.speaking && !synth.pending && !isPaused && !isLoading) {
                isPlaying = false;
                updatePlayButton();
                setStatus("⏸ Lecture arrêtée", 'paused');
            }
        }, 1000);
    }

    init();
});



    // ================================================================
    // GESTION DU THÈME JOUR/NUIT
    // ================================================================
    let isDarkMode = false;

    function toggleTheme() {
        isDarkMode = !isDarkMode;
        const body = document.body;
        const appContainer = document.querySelector('.app-container');
        const header = document.querySelector('.slide-header');
        const footer = document.querySelector('.slide-footer');
        const contentCards = document.querySelectorAll('.content-card');
        const noteBoxes = document.querySelectorAll('.note-box');
        const mathBlocks = document.querySelectorAll('.math-block');
        const buttons = document.querySelectorAll('.btn');
        const statusBadge = document.querySelector('.status-badge');
        const slideCounter = document.querySelector('.slide-counter');
        const autoIndicator = document.querySelector('.auto-indicator');
        const themeBtn = document.getElementById('themeToggle');

        if (isDarkMode) {
            // Mode nuit
            body.style.background = '#0b1120';
            body.style.color = '#f1f5f9';
            appContainer.style.background = 'linear-gradient(145deg, #0f172a 0%, #1e293b 100%)';
            header.style.background = 'rgba(15, 23, 42, 0.85)';
            footer.style.background = 'rgba(15, 23, 42, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.05)';
                card.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.08)';
                note.style.color = '#cbd5e1';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.25)';
                block.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#e2e8f0';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.12)';
                statusBadge.style.color = '#93bbfc';
            }
            if (slideCounter) {
                slideCounter.style.color = '#94a3b8';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#64748b';
            }
            if (themeBtn) {
                themeBtn.textContent = '☀️';
                themeBtn.title = 'Passer en mode jour';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#e2e8f0';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#e2e8f0';
                }
            });
        } else {
            // Mode jour (par défaut)
            body.style.background = '#f0f4f8';
            body.style.color = '#1a202c';
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
            header.style.background = 'rgba(255, 255, 255, 0.85)';
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.8)';
                card.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.12)';
                note.style.color = '#2c3e50';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.05)';
                block.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#2d3748';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
                statusBadge.style.color = '#2b6cb0';
            }
            if (slideCounter) {
                slideCounter.style.color = '#4a5568';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#718096';
            }
            if (themeBtn) {
                themeBtn.textContent = '🌓';
                themeBtn.title = 'Passer en mode nuit';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#2c3e50';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#2d3748';
                }
            });
        }
    }

    document.addEventListener('DOMContentLoaded', function() {

        document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {

        const themeBtn = document.getElementById('themeToggle');
