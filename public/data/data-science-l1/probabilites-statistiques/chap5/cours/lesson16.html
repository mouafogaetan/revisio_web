<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Présentation mobile</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' },
            options: { skipHtmlTypes: 'script' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 500px;
        margin: 0 auto;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    .slide-header {
        flex-shrink: 0;
        padding: 18px 16px 10px 16px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        z-index: 10;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .slide-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
    }

    .content-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 18px 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        flex-shrink: 0;
    }

    .content-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .content-card li {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        line-height: 1.5;
    }

    .content-card li:last-child {
        border-bottom: none;
    }

    .bullet-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
    }

    .math-block {
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        overflow-x: auto;
        flex-shrink: 0;
        margin: 4px 0;
    }

    .math-block .math {
        font-size: 1.2rem;
        color: #e2e8f0;
    }

    .note-box {
        background: rgba(96, 165, 250, 0.08);
        border-left: 4px solid #60a5fa;
        padding: 12px 16px;
        border-radius: 12px;
        font-style: italic;
        font-size: 0.9rem;
        color: #cbd5e1;
        flex-shrink: 0;
    }

    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        border-radius: 0;
        flex-direction: column;
    }

    .loading-card {
        background: #1e293b;
        padding: 32px 28px;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #334155;
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px auto;
    }

    .loading-text {
        font-weight: 600;
        font-size: 1.1rem;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    .loading-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 16px;
    }
    .loading-progress {
        height: 3px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        animation: loadingProgress 30s ease-out forwards;
    }

    .loading-timeout {
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 12px;
    }

    .btn-cancel-loading {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 40px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #f87171;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }

    .btn-cancel-loading:active {
        transform: scale(0.94);
        background: rgba(239, 68, 68, 0.25);
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
    }

    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .slide-counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255,255,255,0.05);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(255,255,255,0.04);
    }

    .status-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 30px;
        background: rgba(96, 165, 250, 0.12);
        color: #93bbfc;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
    }

    .status-badge .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: pulse-dot 1.2s infinite;
        flex-shrink: 0;
    }

    .status-badge.idle .dot {
        animation: none;
        background: #64748b;
    }
    .status-badge.speaking .dot {
        background: #34d399;
        animation: pulse-dot 0.8s infinite;
    }
    .status-badge.error .dot {
        background: #f87171;
        animation: none;
    }
    .status-badge.paused .dot {
        animation: none;
        background: #fbbf24;
    }
    .status-badge.waiting .dot {
        animation: pulse-dot 1.5s infinite;
        background: #fbbf24;
    }
    .status-badge.loading .dot {
        animation: pulse-dot 0.5s infinite;
        background: #60a5fa;
    }

    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.7); }
    }

    .footer-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(255,255,255,0.1);
    }

    .btn-secondary {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-play {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
        min-width: 80px;
        justify-content: center;
    }
    .btn-play:active {
        background: rgba(52, 211, 153, 0.25);
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
    }

    .auto-indicator {
        font-size: 0.65rem;
        color: #64748b;
        text-align: center;
        letter-spacing: 0.3px;
        padding: 2px 0;
    }

    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.2rem;
        }
        .content-card li {
            font-size: 0.9rem;
            padding: 8px 0;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .btn-play {
            min-width: 60px;
        }
        .footer-buttons {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
        .loading-card {
            padding: 20px 16px;
        }
        .math-block .math {
            font-size: 1rem;
        }
    }

    @media (min-width: 600px) {
        .app-container {
            max-width: 480px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
        .loading-overlay {
            border-radius: 32px;
        }
    }

    /* Mode jour (par défaut) */
    html, body {
        background: #f0f4f8 !important;
        color: #1a202c !important;
    }
    .app-container {
        background: linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%) !important;
    }
    .slide-header {
        background: rgba(255, 255, 255, 0.85) !important;
        border-bottom: 1px solid rgba(0,0,0,0.08) !important;
    }
    .slide-header h1 {
        background: linear-gradient(135deg, #2b6cb0, #6b46c1) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        background-clip: text !important;
    }
    .slide-footer {
        background: rgba(255, 255, 255, 0.9) !important;
        border-top: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card {
        background: rgba(255,255,255,0.8) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card li {
        border-bottom: 1px solid rgba(0,0,0,0.05) !important;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.12) !important;
        border-left: 4px solid #4299e1 !important;
        color: #2c3e50 !important;
    }
    .math-block {
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .math-block .math {
        color: #2d3748 !important;
    }
    .slide-counter {
        color: #4a5568 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .status-badge {
        background: rgba(96, 165, 250, 0.15) !important;
        color: #2b6cb0 !important;
        border: 1px solid rgba(96, 165, 250, 0.15) !important;
    }
    .btn {
        color: #2d3748 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .btn-secondary {
        background: rgba(0,0,0,0.04) !important;
        border-color: rgba(0,0,0,0.08) !important;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15) !important;
        border-color: rgba(52, 211, 153, 0.2) !important;
        color: #38a169 !important;
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15) !important;
        border-color: rgba(251, 191, 36, 0.2) !important;
        color: #d69e2e !important;
    }
    .auto-indicator {
        color: #718096 !important;
    }
    .loading-card {
        background: #ffffff !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .loading-text {
        color: #1a202c !important;
    }
    .loading-sub {
        color: #4a5568 !important;
    }
</style>
</head>
<body>

<div class="app-container">

    <header class="slide-header">
        <h1 id="slideTitle">Chargement...</h1>
    </header>

    <main class="slide-body" id="slideBody"></main>

    <!-- LOADING OVERLAY AVEC BOUTON ANNULER -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Préparation vocale...</div>
            <div class="loading-sub" id="loadingSub">Synthèse en cours</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loadingProgressBar"></div>
            </div>
            <div class="loading-timeout" id="loadingTimeout">⏱️ 30 secondes maximum</div>
            <button class="btn-cancel-loading" id="cancelLoadingBtn">
                <span>✕</span> Annuler
            </button>
        </div>
    </div>

    <footer class="slide-footer">
        <div class="footer-top">
            <span class="slide-counter" id="slideCounter">1 / 3</span>
            <span class="status-badge idle" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">Prêt</span>
            </span>
        </div>

        <div class="footer-buttons">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-secondary" id="replayBtn">
                <span class="btn-icon">🔁</span> <span class="btn-label">Relire</span>
            </button>
            <button class="btn btn-play" id="playBtn">
                <span class="btn-icon">▶</span> <span class="btn-label">Play</span>
            </button>
        </div>

        <div class="auto-indicator" id="autoIndicator">⏸ Lecture manuelle</div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // SLIDES
    // ================================================================
    const slides = [
  {
    "titre": "Introduction à l'ANOVA",
    "contenu": "<div style='font-size:1.1rem; line-height:1.6; color:#333;'><p><strong>Objectif de la leçon :</strong></p><p>Comparer les <strong>moyennes</strong> de <strong>plusieurs groupes</strong> (plus de 2) pour voir s'il existe une différence significative.</p><div style='background:#e8f0fe; padding:12px; border-radius:10px; color:#1a1a1a; margin:10px 0;'><strong>Exemple :</strong> On veut savoir si le type de fertilisant (A, B, C) influence le rendement moyen d'une culture.</div><p><strong>ANOVA = ANalysis Of VAriance</strong></p><p>Contrairement au test de Student qui compare 2 moyennes, l'ANOVA permet de comparer \\( k \\ge 2 \\) groupes simultanément.</p></div>",
    "texteParle": "Bonjour à tous. Dans cette leçon, nous allons découvrir l'analyse de la variance, ou ANOVA. Son objectif est de comparer les moyennes de plusieurs groupes, plus de deux, pour déterminer s'il existe une différence significative entre elles. Par exemple, un agriculteur pourrait vouloir savoir si trois types de fertilisants différents produisent des rendements moyens différents. Contrairement au test de Student qui ne compare que deux moyennes, l'ANOVA nous permet de comparer plusieurs groupes en une seule analyse. Le nom ANOVA signifie Analysis Of Variance.",
    "note": "L'ANOVA est une généralisation du test de Student pour plus de deux groupes."
  },
  {
    "titre": "Le Modèle ANOVA",
    "contenu": "<div style='font-size:1.1rem; line-height:1.6; color:#333;'><p><strong>Formulation :</strong> On a \\( k \\) groupes (ou niveaux d'un facteur). Pour chaque groupe \\( i \\), on observe \\( n_i \\) individus.</p><div class='math-block' style='background:#f4f4f4; padding:12px; border-radius:8px; margin:10px 0;'><div class='math'>$$ Y_{ij} = \\mu_i + \\epsilon_{ij} $$</div></div><p>où :</p><ul style='padding-left:20px; margin:10px 0;'><li style='margin-bottom:6px;'>\\( Y_{ij} \\) : valeur observée pour l'individu \\( j \\) du groupe \\( i \\).</li><li style='margin-bottom:6px;'>\\( \\mu_i \\) : moyenne vraie du groupe \\( i \\).</li><li style='margin-bottom:6px;'>\\( \\epsilon_{ij} \\) : erreur aléatoire (bruit).</li></ul><p><strong>Hypothèses :</strong> Les erreurs sont indépendantes, suivent une loi normale \\( N(0, \\sigma^2) \\) et ont la même variance.</p></div>",
    "texteParle": "Pour comprendre l'ANOVA, on commence par poser un modèle mathématique. On suppose qu'il y a k groupes, et pour chaque groupe, on a plusieurs observations. Chaque observation est la somme de la moyenne vraie du groupe, que l'on cherche à estimer, et d'une erreur aléatoire. Cette erreur représente la variabilité naturelle. On fait l'hypothèse que ces erreurs sont indépendantes, qu'elles suivent une loi normale de moyenne zéro, et qu'elles ont toutes la même variance. C'est ce qu'on appelle l'homoscédasticité.",
    "note": "L'hypothèse d'homoscédasticité est cruciale pour la validité de l'ANOVA."
  },
  {
    "titre": "Questions de l'ANOVA",
    "contenu": "<div style='font-size:1.1rem; line-height:1.6; color:#333;'><p><strong>Hypothèses à tester :</strong></p><div style='background:#f4f4f4; padding:12px; border-radius:8px; margin:10px 0;'><p><strong>Hypothèse nulle \\( H_0 \\) :</strong></p><div class='math-block'><div class='math'>$$ \\mu_1 = \\mu_2 = \\cdots = \\mu_k $$</div></div><p>Toutes les moyennes sont égales.</p></div><div style='background:#e8f0fe; padding:12px; border-radius:8px; margin:10px 0;'><p><strong>Hypothèse alternative \\( H_1 \\) :</strong></p><div class='math-block'><div class='math'>$$ \\text{Au moins une moyenne est différente des autres.} $$</div></div></div><p><strong>Idée clé :</strong> Comparer la <strong>variabilité entre les groupes</strong> (due au facteur) à la <strong>variabilité à l'intérieur des groupes</strong> (due au hasard).</p></div>",
    "texteParle": "Le but de l'ANOVA est de tester une hypothèse. L'hypothèse nulle, c'est que toutes les moyennes des groupes sont égales. L'hypothèse alternative, c'est qu'au moins une moyenne est différente des autres. Pour décider, on va comparer deux sources de variabilité. D'abord, la variabilité entre les groupes, qui est due à l'effet du facteur, par exemple le type de fertilisant. Ensuite, la variabilité à l'intérieur des groupes, qui est due au hasard, à la variabilité naturelle. Si la variabilité entre les groupes est grande par rapport à la variabilité interne, c'est un signe que le facteur a un effet.",
    "note": "L'ANOVA compare la variance inter-groupes à la variance intra-groupes."
  },
  {
    "titre": "Décomposition de la Variance",
    "contenu": "<div style='font-size:1.1rem; line-height:1.6; color:#333;'><p><strong>Principe :</strong> La variance totale des données peut se décomposer en deux parties.</p><div style='background:#f4f4f4; padding:12px; border-radius:8px; margin:10px 0;'><p><strong>Somme des carrés totale (SCT) :</strong></p><div class='math-block'><div class='math'>$$ \\text{SCT} = \\sum_{i=1}^k \\sum_{j=1}^{n_i} (Y_{ij} - \\bar{Y})^2 $$</div></div></div><div style='background:#e8f0fe; padding:12px; border-radius:8px; margin:10px 0;'><p><strong>Somme des carrés inter-groupes (SCE) :</strong></p><div class='math-block'><div class='math'>$$ \\text{SCE} = \\sum_{i=1}^k n_i (\\bar{Y}_i - \\bar{Y})^2 $$</div></div></div><div style='background:#f4f4f4; padding:12px; border-radius:8px; margin:10px 0;'><p><strong>Somme des carrés intra-groupes (SCR) :</strong></p><div class='math-block'><div class='math'>$$ \\text{SCR} = \\sum_{i=1}^k \\sum_{j=1}^{n_i} (Y_{ij} - \\bar{Y}_i)^2 $$</div></div></div><p><strong>Relation :</strong> \\( \\text{SCT} = \\text{SCE} + \\text{SCR} \\)</p></div>",
    "texteParle": "Pour quantifier ces variabilités, on utilise les sommes des carrés. La somme des carrés totale, notée SCT, mesure la variabilité globale de toutes les données autour de la moyenne générale. Cette variabilité totale peut être décomposée en deux parties. La première, la somme des carrés expliquée, ou SCE, mesure la variabilité des moyennes des groupes autour de la moyenne générale. C'est la part de variabilité due au facteur. La seconde, la somme des carrés résiduelle, ou SCR, mesure la variabilité à l'intérieur de chaque groupe autour de sa propre moyenne. C'est la part due au hasard. Et la somme des deux est égale à la variabilité totale.",
    "note": "La décomposition de la variance est le fondement mathématique de l'ANOVA."
  },
  {
    "titre": "Les Carrés Moyens",
    "contenu": "<div style='font-size:1.1rem; line-height:1.6; color:#333;'><p>Pour comparer les sommes de carrés, on les divise par leurs <strong>degrés de liberté</strong> respectifs.</p><div style='background:#f4f4f4; padding:12px; border-radius:8px; margin:10px 0;'><p><strong>Carré moyen inter-groupes (CME) :</strong></p><div class='math-block'><div class='math'>$$ \\text{CME} = \\frac{\\text{SCE}}{k-1} $$</div></div></div><div style='background:#e8f0fe; padding:12px; border-radius:8px; margin:10px 0;'><p><strong>Carré moyen intra-groupes (CMR) :</strong></p><div class='math-block'><div class='math'>$$ \\text{CMR} = \\frac{\\text{SCR}}{n-k} $$</div></div><p>où \\( n = \\sum n_i \\) est le nombre total d'observations.</p></div><p>CME estime la variance due au facteur, CMR estime la variance résiduelle \\( \\sigma^2 \\).</p></div>",
    "texteParle": "Pour pouvoir comparer les sommes de carrés entre elles, on les divise par leurs degrés de liberté. On obtient alors les carrés moyens. Le carré moyen expliqué, ou CME, est la somme des carrés expliquée divisée par k moins un, où k est le nombre de groupes. Le carré moyen résiduel, ou CMR, est la somme des carrés résiduelle divisée par n moins k, où n est le nombre total d'observations. Le CME est une estimation de la variance due au facteur, tandis que le CMR est une estimation de la variance résiduelle, c'est-à-dire du bruit.",
    "note": "Les carrés moyens sont des variances moyennes par degré de liberté."
  },
  {
    "titre": "Le Test F",
    "contenu": "<div style='font-size:1.1rem; line-height:1.6; color:#333;'><p><strong>Statistique du test :</strong></p><div class='math-block' style='background:#f4f4f4; padding:12px; border-radius:8px; margin:10px 0;'><div class='math'>$$ F = \\frac{\\text{CME}}{\\text{CMR}} $$</div></div><p>Sous \\( H_0 \\), \\( F \\) suit une loi de Fisher avec \\( (k-1, n-k) \\) degrés de liberté.</p><div style='background:#e8f0fe; padding:12px; border-radius:10px; color:#1a1a1a; margin:10px 0;'><p><strong>Règle de décision :</strong></p><ul style='padding-left:20px; margin:5px 0;'><li style='margin-bottom:6px;'>Si \\( F \\) est <strong>grand</strong> → la variabilité inter-groupes domine → on rejette \\( H_0 \\).</li><li style='margin-bottom:6px;'>Si \\( F \\) est <strong>petit</strong> → la variabilité intra-groupes domine → on ne rejette pas \\( H_0 \\).</li></ul></div><p>On compare \\( F \\) à la valeur seuil lue dans la table de Fisher, ou on utilise la p-value.</p></div>",
    "texteParle": "La statistique du test ANOVA est le rapport F. C'est le quotient du carré moyen expliqué par le carré moyen résiduel. Si l'hypothèse nulle est vraie, c'est-à-dire si toutes les moyennes sont égales, alors ce rapport suit une loi de Fisher. La règle est simple : si F est grand, cela signifie que la variabilité entre les groupes est grande par rapport à la variabilité interne, ce qui est un indice que les moyennes sont différentes. On rejette alors l'hypothèse nulle. Si F est petit, on ne la rejette pas. La valeur de F est comparée à une valeur critique lue dans une table de Fisher, ou bien on utilise la p-value calculée par le logiciel.",
    "note": "Le test F est un test unilatéral à droite."

    "texteParle": "Les résultats d'une ANOVA se présentent dans un tableau synthétique. En première ligne, on a la variabilité inter-groupes avec ses degrés de liberté, sa somme des carrés, son carré moyen, et la statistique F. En deuxième ligne, la variabilité intra-groupes. Enfin, la ligne du total. Ce tableau est très utile pour communiquer les résultats d'une analyse. On y trouve toutes les informations nécessaires pour interpréter le test et décider de rejeter ou non l'hypothèse nulle.",

    "texteParle": "Prenons un exemple. On veut comparer trois régimes alimentaires pour la perte de poids. On a les données pour chaque régime. On calcule l'ANOVA et on obtient un F de 8,23 et une p-value de 0,008. La p-value est très inférieure au seuil classique de 0,05. On rejette donc l'hypothèse nulle. On conclut que les trois régimes n'ont pas le même effet sur la perte de poids : il y a au moins un régime qui est significativement différent des autres.",
    "note": "Une p-value inférieure à 0,05 indique une différence significative entre les groupes."

  {

    "contenu": "<div style='font-size:1.1rem; line-height:1.6; color:#333;'><p><strong>Problème :</strong> L'ANOVA nous dit qu'il y a une différence, mais <strong>pas laquelle</strong>.</p><div style='background:#fff3cd; padding:12px; border-radius:10px; color:#856404; margin:10px 0;'><p><strong>Risque d'erreur :</strong> Faire des tests de Student deux à deux augmente le risque d'erreur de première espèce.</p></div><p><strong>Solution :</strong> Utiliser des tests <strong>post-hoc</strong> (comparaisons multiples).</p><ul style='padding-left:20px; margin:10px 0;'><li style='margin-bottom:6px;'>Test de <strong>Tukey</strong> (le plus courant).</li><li style='margin-bottom:6px;'>Correction de <strong>Bonferroni</strong>.</li><li style='margin-bottom:6px;'>Test de <strong>Dunnett</strong> (comparaison à un groupe témoin).</li></ul><p>Ces tests ajustent les p-values pour contrôler le risque global d'erreur.</p></div>",
    "texteParle": "Une fois que l'ANOVA a rejeté l'hypothèse nulle, on sait qu'il y a une différence, mais on ne sait pas où elle se trouve. Si on fait des tests de Student deux à deux pour comparer chaque paire de groupes, on risque d'augmenter le risque d'erreur. C'est ce qu'on appelle le problème des comparaisons multiples. Pour y remédier, on utilise des tests post-hoc. Le plus connu est le test de Tukey. Ces tests ajustent les p-values pour que le risque global de se tromper reste maîtrisé.",

    "contenu": "<div style='font-size:1.1rem; line-height:1.6; color:#333;'><p>Pour que l'ANOVA soit valide, <strong>trois conditions</strong> doivent être vérifiées.</p><div style='background:#f4f4f4; padding:12px; border-radius:8px; margin:10px 0;'><p><strong>1. Indépendance :</strong> Les échantillons doivent être indépendants.</p></div><div style='background:#e8f0fe; padding:12px; border-radius:8px; margin:10px 0;'><p><strong>2. Normalité :</strong> Les résidus doivent suivre une loi normale (approximativement).</p><p style='font-size:0.95rem; margin-top:5px;'>On peut vérifier avec un test de Shapiro-Wilk ou un Q-Q plot.</p></div><div style='background:#f4f4f4; padding:12px; border-radius:8px; margin:10px 0;'><p><strong>3. Homoscédasticité :</strong> Les variances des groupes doivent être égales.</p><p style='font-size:0.95rem; margin-top:5px;'>On peut vérifier avec un test de Bartlett ou de Levene.</p></div><div style='background:#fff3cd; padding:12px; border-radius:10px; color:#856404; margin-top:10px;'><strong>Règle :</strong> Si les conditions ne sont pas remplies, on peut utiliser des tests non paramétriques comme le test de Kruskal-Wallis.</div></div>",
    "texteParle": "Pour que les résultats de l'ANOVA soient fiables, trois conditions doivent être respectées. D'abord, l'indépendance des observations : chaque individu ne doit appartenir qu'à un seul groupe. Ensuite, la normalité des résidus : les erreurs doivent suivre approximativement une loi normale. On peut le vérifier avec des graphiques ou des tests. Enfin, l'homoscédasticité : les variances des groupes doivent être égales. Il existe des tests pour le vérifier. Si ces conditions ne sont pas remplies, il faut utiliser des alternatives non paramétriques, comme le test de Kruskal-Wallis.",

    "texteParle": "Il est important de situer l'ANOVA par rapport au test de Student que vous connaissez déjà. Le test de Student est fait pour comparer deux groupes. L'ANOVA est une généralisation qui permet de comparer deux groupes ou plus. Pour deux groupes, le F de l'ANOVA est le carré du t de Student. L'avantage de l'ANOVA est qu'elle contrôle le risque d'erreur global lorsqu'on compare plusieurs groupes, ce que ne permet pas une succession de tests de Student.",

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentIndex = 0;
    let isSpeaking = false;
    let isPaused = false;
    let currentUtterance = null;
    let isLoading = false;
    let loadingTimeout = null;
    let isTransitioning = false;
    let speechSupported = true;
    let userInteracted = false;
    let isPlaying = false;
    let loadingCancelled = false;

    const total = slides.length;
    const synth = window.speechSynthesis;

    // Références jQuery
    const $title = $('#slideTitle');
    const $body = $('#slideBody');
    const $counter = $('#slideCounter');
    const $statusText = $('#statusText');
    const $statusBadge = $('#statusBadge');
    const $loading = $('#loadingOverlay');
    const $loadingText = $('#loadingText');
    const $loadingSub = $('#loadingSub');
    const $loadingTimeout = $('#loadingTimeout');
    const $loadingProgressBar = $('#loadingProgressBar');
    const $autoIndicator = $('#autoIndicator');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $replay = $('#replayBtn');
    const $play = $('#playBtn');
    const $cancelLoading = $('#cancelLoadingBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function setStatus(text, type) {
        $statusText.text(text);
        $statusBadge.removeClass('idle speaking error paused waiting loading');
        if (type === 'speaking') $statusBadge.addClass('speaking');
        else if (type === 'error') $statusBadge.addClass('error');
        else if (type === 'paused') $statusBadge.addClass('paused');
        else if (type === 'waiting') $statusBadge.addClass('waiting');
        else if (type === 'loading') $statusBadge.addClass('loading');
        else $statusBadge.addClass('idle');
    }

    function updatePlayButton() {
        if (isPlaying) {
            $play.addClass('playing');
            $play.find('.btn-icon').text('⏸');
            $play.find('.btn-label').text('Pause');
        } else {
            $play.removeClass('playing');
            $play.find('.btn-icon').text('▶');
            $play.find('.btn-label').text('Play');
        }
    }

    function showLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        
        loadingCancelled = false;
        isLoading = true;
        
        // Réinitialiser la barre de progression
        $loadingProgressBar.css('animation', 'none');
        $loadingProgressBar.css('width', '0%');
        // Forcer un reflow
        $loadingProgressBar[0].offsetHeight;
        $loadingProgressBar.css('animation', 'loadingProgress 30s ease-out forwards');
        
        $loadingText.text('Préparation vocale...');
        $loadingSub.text('Synthèse en cours');
        $loadingTimeout.text('⏱️ 30 secondes maximum');
        $loading.fadeIn(300);
        setStatus("⏳ Chargement...", 'loading');
        
        // 🔥 TIMEOUT DE 30 SECONDES
        loadingTimeout = setTimeout(() => {
            if (isLoading && !loadingCancelled) {
                hideLoading();
                setStatus("⚠️ Délai dépassé (30s)", 'error');
                isPlaying = false;
                updatePlayButton();
                $loadingSub.text('La synthèse vocale a pris trop de temps');
                $loadingTimeout.text('❌ Délai dépassé');
            }
        }, 30000);
    }

    function hideLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        isLoading = false;
        loadingCancelled = false;
        $loading.fadeOut(300);
        // Ne pas changer le statut si on est en train de parler
        if (!isSpeaking && !isPlaying) {
            setStatus("⏸ Lecture arrêtée", 'paused');
        }
    }

    function cancelLoading() {
        loadingCancelled = true;
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        hideLoading();
        stopSpeaking();
        setStatus("⏸ Annulé", 'paused');
        isPlaying = false;
        updatePlayButton();
        $loadingText.text('Annulé par l\'utilisateur');
        $loadingSub.text('Vous pouvez réessayer');
        $loadingTimeout.text('✕ Annulation');
    }

    // Arrêter la parole proprement
    function stopSpeaking() {
        try {
            if (synth && (synth.speaking || synth.pending)) {
                synth.cancel();
            }
        } catch(e) {
            console.warn('Erreur stopSpeaking:', e);
        }
        if (currentUtterance) {
            try {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance.onstart = null;
            } catch(e) {}
            currentUtterance = null;
        }
        isSpeaking = false;
        isPlaying = false;
        updatePlayButton();
    }

    // Mettre en pause la parole
    function pauseSpeaking() {
        try {
            if (synth && synth.speaking) {
                synth.pause();
                isPaused = true;
                isPlaying = false;
                setStatus("⏸ Lecture en pause", 'paused');
                updatePlayButton();
            }
        } catch(e) {
            console.warn('Erreur pauseSpeaking:', e);
            stopSpeaking();
        }
    }

    // Reprendre la parole
    function resumeSpeaking() {
        try {
            if (synth && synth.paused) {
                synth.resume();
                isPaused = false;
                isPlaying = true;
                setStatus("🔊 Lecture en cours", 'speaking');
                updatePlayButton();
            } else if (!isSpeaking && !synth.speaking && !synth.pending) {
                speakSlide(currentIndex);
            }
        } catch(e) {
            console.warn('Erreur resumeSpeaking:', e);
            speakSlide(currentIndex);
        }
    }

    function renderSlide(index) {
        const slide = slides[index];
        $title.text(slide.titre);

        let html = '';
        html += `<div class="content-card">${slide.contenu}</div>`;
        if (slide.note) {
            html += `<div class="note-box">${slide.note}</div>`;
        }
        $body.html(html);
        $counter.text(`${index+1} / ${total}`);

        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
        }
    }

    // ================================================================
    // LECTURE VOCALE
    // ================================================================
    function speakSlide(index) {
        return new Promise((resolve) => {
            const slide = slides[index];
            const text = slide.texteParle;
            
            if (!text || text.trim() === '' || !speechSupported) {
                resolve();
                return;
            }

            if (!window.speechSynthesis) {
                setStatus("❌ Synthèse vocale non supportée", 'error');
                speechSupported = false;
                resolve();
                return;
            }

            // Arrêter toute lecture en cours
            stopSpeaking();
            
            // Réinitialiser l'état de pause
            isPaused = false;
            
            showLoading();
            setStatus("Initialisation...", 'loading');

            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.92;
                utterance.pitch = 1.05;
                utterance.volume = 1;

                let isFinished = false;
                let errorHandled = false;

                utterance.onstart = function() {
                    if (loadingCancelled) {
                        stopSpeaking();
                        resolve();
                        return;
                    }
                    hideLoading();
                    isSpeaking = true;
                    isPlaying = true;
                    isPaused = false;
                    setStatus("🔊 Lecture en cours", 'speaking');
                    updatePlayButton();
                };

                utterance.onend = function() {
                    if (isFinished) return;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    setStatus("✅ Terminé", 'idle');
                    hideLoading();
                    updatePlayButton();
                    resolve();
                };

                utterance.onerror = function(e) {
                    if (isFinished || errorHandled) return;
                    errorHandled = true;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    hideLoading();
                    updatePlayButton();
                    
                    if (e.error === 'not-allowed') {
                        setStatus("⚠️ Permission refusée", 'error');
                    } else if (e.error === 'synthesis-unavailable') {
                        setStatus("⚠️ Synthèse indisponible", 'error');
                    } else if (e.error === 'canceled') {
                        setStatus("⏸ Annulé", 'paused');
                    } else {
                        setStatus("❌ Erreur audio: " + (e.error || 'inconnue'), 'error');
                    }
                    
                    resolve();
                };

                // Gestion du chargement des voix
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = function() {
                        if (!loadingCancelled) {
                            try {
                                synth.speak(utterance);
                            } catch(err) {
                                // Silencieux
                            }
                        }
                        synth.onvoiceschanged = null;
                    };
                }

                currentUtterance = utterance;
                
                if (!loadingCancelled) {
                    try {
                        synth.speak(utterance);
                    } catch(err) {
                        setTimeout(() => {
                            if (!loadingCancelled) {
                                try {
                                    synth.speak(utterance);
                                } catch(e) {
                                    setStatus("❌ Erreur de lecture", 'error');
                                    isPlaying = false;
                                    updatePlayButton();
                                    hideLoading();
                                    resolve();
                                }
                            } else {
                                resolve();
                            }
                        }, 100);
                    }
                } else {
                    resolve();
                }

            } catch(err) {
                hideLoading();
                setStatus("❌ Erreur générale", 'error');
                isPlaying = false;
                updatePlayButton();
                console.error('Erreur speakSlide:', err);
                resolve();
            }
        });
    }

    // ================================================================
    // NAVIGATION
    // ================================================================
    async function goToSlide(index) {
        if (isTransitioning) return;
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        
        // Si on est en train de lire, on met en pause avant de naviguer
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        // Arrêter complètement la lecture
        stopSpeaking();
        
        await new Promise(r => setTimeout(r, 50));
        
        if (index === currentIndex) {
            setStatus("📄 Slide actuel", 'idle');
            return;
        }

        isTransitioning = true;
        currentIndex = index;
        renderSlide(index);
        
        // Réinitialiser l'état de lecture
        isPlaying = false;
        updatePlayButton();
        setStatus("⏸ Lecture arrêtée", 'paused');

        await new Promise(r => setTimeout(r, 150));
        isTransitioning = false;
    }

    async function goToNext() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex + 1 < total) {
            await goToSlide(currentIndex + 1);
        } else {
            setStatus("🏁 Dernier slide", 'idle');
        }
    }

    async function goToPrev() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex - 1 >= 0) {
            await goToSlide(currentIndex - 1);
        } else {
            setStatus("🔁 Premier slide", 'idle');
        }
    }

    // ================================================================
    // GESTION PLAY/PAUSE
    // ================================================================
    function togglePlay() {
        if (!userInteracted) {
            userInteracted = true;
        }

        // Si le chargement est en cours, on l'annule
        if (isLoading) {
            cancelLoading();
            return;
        }

        // Si le synthétiseur est en pause, on reprend
        if (synth && synth.paused) {
            resumeSpeaking();
            return;
        }

        // Si la lecture est en cours, on met en pause
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
            return;
        }

        // Sinon, on démarre la lecture du slide courant
        if (!isSpeaking && !isPlaying) {
            stopSpeaking();
            speakSlide(currentIndex);
        }
    }

    // ================================================================
    // INIT
    // ================================================================
    async function init() {
        // Vérifier la compatibilité
        if (!window.speechSynthesis) {
            setStatus("❌ Synthèse vocale non supportée", 'error');
            speechSupported = false;
        }

        // Précharger les voix
        try {
            if (synth.getVoices) {
                synth.getVoices();
                setTimeout(() => {
                    try {
                        synth.getVoices();
                    } catch(e) {}
                }, 200);
            }
        } catch(e) {
            console.warn('Erreur chargement voix:', e);
        }

        // Afficher le premier slide
        renderSlide(0);
        $counter.text(`1 / ${total}`);
        
        // État initial
        setStatus("⏸ Appuie sur Play", 'paused');
        updatePlayButton();
        $autoIndicator.text('⏸ Lecture manuelle');

        // ================================================================
        // ÉVÉNEMENTS
        // ================================================================
        
        // Bouton Play/Pause
        $play.on('click', function() {
            togglePlay();
        });

        // Bouton Annuler le chargement
        $cancelLoading.on('click', function() {
            cancelLoading();
        });

        // Navigation
        $prev.on('click', function() {
            // Si chargement en cours, on annule
            if (isLoading) cancelLoading();
            goToPrev();
        });

        $next.on('click', function() {
            if (isLoading) cancelLoading();
            goToNext();
        });

        // Replay - relire le slide courant
        $replay.on('click', function() {
            if (isLoading) cancelLoading();
            stopSpeaking();
            setTimeout(() => {
                speakSlide(currentIndex);
            }, 100);
        });

        // Support du clavier (espace pour play/pause)
        $(document).on('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });

        // Nettoyage
        $(window).on('beforeunload', function() {
            try {
                if (synth.speaking) synth.cancel();
            } catch(e) {}
            hideLoading();
        });

        // Gérer les cas où la synthèse se termine de manière inattendue
        setInterval(() => {
            if (isPlaying && !synth.speaking && !synth.pending && !isPaused && !isLoading) {
                isPlaying = false;
                updatePlayButton();
                setStatus("⏸ Lecture arrêtée", 'paused');
            }
        }, 1000);
    }

    init();
});



    // ================================================================
    // GESTION DU THÈME JOUR/NUIT
    // ================================================================
    let isDarkMode = false;

    function toggleTheme() {
        isDarkMode = !isDarkMode;
        const body = document.body;
        const appContainer = document.querySelector('.app-container');
        const header = document.querySelector('.slide-header');
        const footer = document.querySelector('.slide-footer');
        const contentCards = document.querySelectorAll('.content-card');
        const noteBoxes = document.querySelectorAll('.note-box');
        const mathBlocks = document.querySelectorAll('.math-block');
        const buttons = document.querySelectorAll('.btn');
        const statusBadge = document.querySelector('.status-badge');
        const slideCounter = document.querySelector('.slide-counter');
        const autoIndicator = document.querySelector('.auto-indicator');
        const themeBtn = document.getElementById('themeToggle');

        if (isDarkMode) {
            // Mode nuit
            body.style.background = '#0b1120';
            body.style.color = '#f1f5f9';
            appContainer.style.background = 'linear-gradient(145deg, #0f172a 0%, #1e293b 100%)';
            header.style.background = 'rgba(15, 23, 42, 0.85)';
            footer.style.background = 'rgba(15, 23, 42, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.05)';
                card.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.08)';
                note.style.color = '#cbd5e1';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.25)';
                block.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#e2e8f0';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.12)';
                statusBadge.style.color = '#93bbfc';
            }
            if (slideCounter) {
                slideCounter.style.color = '#94a3b8';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#64748b';
            }
            if (themeBtn) {
                themeBtn.textContent = '☀️';
                themeBtn.title = 'Passer en mode jour';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#e2e8f0';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#e2e8f0';
                }
            });
        } else {
            // Mode jour (par défaut)
            body.style.background = '#f0f4f8';
            body.style.color = '#1a202c';
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
            header.style.background = 'rgba(255, 255, 255, 0.85)';
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.8)';
                card.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.12)';
                note.style.color = '#2c3e50';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.05)';
                block.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#2d3748';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
                statusBadge.style.color = '#2b6cb0';
            }
            if (slideCounter) {
                slideCounter.style.color = '#4a5568';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#718096';
            }
            if (themeBtn) {
                themeBtn.textContent = '🌓';
                themeBtn.title = 'Passer en mode nuit';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#2c3e50';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#2d3748';
                }
            });
        }
    }

    // Initialiser en mode jour
    document.addEventListener('DOMContentLoaded', function() {
        // Appliquer le mode jour par défaut
        const body = document.body;
        body.style.background = '#f0f4f8';
        body.style.color = '#1a202c';

            note.style.color = '#2c3e50';

            block.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.btn').forEach(btn => {

        if (statusBadge) {

        }
        
        const autoIndicator = document.querySelector('.auto-indicator');
        if (autoIndicator) {
            autoIndicator.style.color = '#718096';
        }
        
        document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
            if (!el.closest('.note-box')) {

            }
        });
        
        document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {

        const themeBtn = document.getElementById('themeToggle');
