<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Programmation Python - L1",
  "classe": "Licence 1 Data Science",
  "sequence": "Séquence 2",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Fondamentaux et Structures de Contrôle (6 pts)",
      "points": "6 pts",
      "enonce": "<div style='font-size: 1.1em; line-height: 1.6; color: #333; background: #f9f9f9; padding: 15px; border-radius: 8px;'> Cet exercice porte sur les fondamentaux de Python vus en début d'année : variables, types, conditions et boucles. Il s'agit de la base sur laquelle reposent toutes les manipulations de données en Data Science [citation:2][citation:5].</div>",
      "questions": [
        {
          "question": "<div style='margin: 10px 0;'><strong>1.1 (1 pt)</strong> Quel sera l'affichage du code suivant ? Justifiez votre réponse en une phrase.</div> <pre style='background: #2d2d2d; color: #ccc; padding: 10px; border-radius: 5px; font-size: 0.9em;'><code>a = 5\nb = '10'\nprint(a + int(b))\nprint(str(a) + b)</code></pre>",
          "reponse": "<div style='background: #e8f5e9; padding: 10px; border-radius: 5px; color: #2e7d32;'>L'affichage sera : <code>15</code> puis <code>'510'</code>. Le premier <code>print</code> convertit la chaîne '10' en entier pour faire une addition. Le second convertit l'entier 5 en chaîne pour faire une concaténation.</div>"
        },
        {
          "question": "<div style='margin: 10px 0;'><strong>1.2 (1.5 pts)</strong> Écrire un bloc de code qui, à partir d'une variable <code>note</code> (un entier entre 0 et 20), affiche :</div> <ul style='color: #444;'><li>'Excellent' si la note est supérieure ou égale à 16.</li><li>'Bien' si la note est entre 14 et 15.</li><li>'Passable' si la note est entre 10 et 13.</li><li>'Insuffisant' si la note est inférieure à 10.</li></ul> <div style='margin-top: 10px;'>Utilisez la structure <code>if/elif/else</code>.</div>",
          "reponse": "<div style='background: #e8f5e9; padding: 10px; border-radius: 5px; color: #2e7d32;'><pre style='background: #2d2d2d; color: #ccc; padding: 10px; border-radius: 5px;'><code>if note >= 16:\n    print('Excellent')\nelif note >= 14:\n    print('Bien')\nelif note >= 10:\n    print('Passable')\nelse:\n    print('Insuffisant')</code></pre></div>"
        },
        {
          "question": "<div style='margin: 10px 0;'><strong>1.3 (1.5 pts)</strong> Écrire une boucle <code>for</code> qui parcourt une liste de notes et affiche pour chaque note son appréciation (en utilisant la logique de la question 1.2).</div> <div style='margin-top: 10px;'>La liste est : <code>notes = [12, 18, 8, 15, 10]</code></div>",
          "reponse": "<div style='background: #e8f5e9; padding: 10px; border-radius: 5px; color: #2e7d32;'><pre style='background: #2d2d2d; color: #ccc; padding: 10px; border-radius: 5px;'><code>notes = [12, 18, 8, 15, 10]\nfor note in notes:\n    if note >= 16:\n        print(f'{note} : Excellent')\n    elif note >= 14:\n        print(f'{note} : Bien')\n    elif note >= 10:\n        print(f'{note} : Passable')\n    else:\n        print(f'{note} : Insuffisant')</code></pre></div>"
        },
        {
          "question": "<div style='margin: 10px 0;'><strong>1.4 (2 pts)</strong> Écrire une fonction <code>calcul_moyenne</code> qui prend une liste de nombres en paramètre et retourne leur moyenne arithmétique. La fonction doit gérer le cas d'une liste vide en retournant 0.</div>",
          "reponse": "<div style='background: #e8f5e9; padding: 10px; border-radius: 5px; color: #2e7d32;'><pre style='background: #2d2d2d; color: #ccc; padding: 10px; border-radius: 5px;'><code>def calcul_moyenne(liste_nombres):\n    if not liste_nombres:\n        return 0\n    somme = sum(liste_nombres)\n    return somme / len(liste_nombres)</code></pre></div>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Structures de Données et Gestion des Erreurs (7 pts)",
      "points": "7 pts",
      "enonce": "<div style='font-size: 1.1em; line-height: 1.6; color: #333; background: #f9f9f9; padding: 15px; border-radius: 8px;'> La manipulation des structures de données (listes, dictionnaires) et la gestion des erreurs sont des compétences clés en Data Science pour le nettoyage et la préparation des données [citation:3][citation:5].</div>",
      "questions": [
        {
          "question": "<div style='margin: 10px 0;'><strong>2.1 (1.5 pts)</strong> Soit le dictionnaire suivant représentant les notes d'étudiants :</div> <pre style='background: #2d2d2d; color: #ccc; padding: 10px; border-radius: 5px;'><code>notes_etudiants = {\n    'Alice': [15, 12, 18],\n    'Bob': [8, 10, 9],\n    'Charlie': [14, 16, 13]\n}</code></pre> <div style='margin-top: 10px;'>Écrire un bloc de code qui calcule et affiche la moyenne de chaque étudiant.</div>",
          "reponse": "<div style='background: #e8f5e9; padding: 10px; border-radius: 5px; color: #2e7d32;'><pre style='background: #2d2d2d; color: #ccc; padding: 10px; border-radius: 5px;'><code>for nom, notes in notes_etudiants.items():\n    moyenne = sum(notes) / len(notes)\n    print(f\"{nom} a une moyenne de {moyenne:.2f}\")</code></pre></div>"
        },
        {
          "question": "<div style='margin: 10px 0;'><strong>2.2 (2 pts)</strong> Écrire une fonction <code>ajouter_note</code> qui prend en paramètres le dictionnaire des notes, le nom d'un étudiant et une note. La fonction doit ajouter la note à la liste de l'étudiant si celui-ci existe. Si l'étudiant n'existe pas, la fonction doit créer une nouvelle entrée avec une liste contenant cette note.</div>",
          "reponse": "<div style='background: #e8f5e9; padding: 10px; border-radius: 5px; color: #2e7d32;'><pre style='background: #2d2d2d; color: #ccc; padding: 10px; border-radius: 5px;'><code>def ajouter_note(notes_etudiants, nom, note):\n    if nom in notes_etudiants:\n        notes_etudiants[nom].append(note)\n    else:\n        notes_etudiants[nom] = [note]\n    return notes_etudiants</code></pre></div>"
        },
        {
          "question": "<div style='margin: 10px 0;'><strong>2.3 (2 pts)</strong> Écrire une fonction <code>recherche_etudiant</code> qui prend le dictionnaire des notes et le nom d'un étudiant en paramètres. La fonction doit retourner la liste des notes de l'étudiant s'il existe, ou lever une exception <code>ValueError</code> avec un message explicite si l'étudiant n'est pas trouvé.</div>",
          "reponse": "<div style='background: #e8f5e9; padding: 10px; border-radius: 5px; color: #2e7d32;'><pre style='background: #2d2d2d; color: #ccc; padding: 10px; border-radius: 5px;'><code>def recherche_etudiant(notes_etudiants, nom):\n    if nom in notes_etudiants:\n        return notes_etudiants[nom]\n    else:\n        raise ValueError(f\"L'étudiant {nom} n'est pas dans le dictionnaire.\")</code></pre></div>"
        },
        {
          "question": "<div style='margin: 10px 0;'><strong>2.4 (1.5 pts)</strong> En utilisant la fonction <code>recherche_etudiant</code> de la question précédente, écrire un bloc de code qui tente de récupérer les notes d'un étudiant. Si l'étudiant n'existe pas, le programme doit afficher un message d'erreur élégant à l'utilisateur (sans faire planter le programme).</div>",
          "reponse": "<div style='background: #e8f5e9; padding: 10px; border-radius: 5px; color: #2e7d32;'><pre style='background: #2d2d2d; color: #ccc; padding: 10px; border-radius: 5px;'><code>nom = 'David'\ntry:\n    notes = recherche_etudiant(notes_etudiants, nom)\n    print(f\"Notes de {nom} : {notes}\")\nexcept ValueError as e:\n    print(f\"Erreur : {e}\")</code></pre></div>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Introduction à NumPy et Pandas (7 pts)",
      "points": "7 pts",
      "enonce": "<div style='font-size: 1.1em; line-height: 1.6; color: #333; background: #f9f9f9; padding: 15px; border-radius: 8px;'> Le coeur du travail d'un data scientist avec Python repose sur l'utilisation de bibliothèques spécialisées comme NumPy et Pandas pour l'analyse de données [citation:4][citation:5].</div>",
      "questions": [
        {
          "question": "<div style='margin: 10px 0;'><strong>3.1 (1.5 pts)</strong> Expliquer en 2 ou 3 phrases la différence principale entre une liste Python et un tableau NumPy (<code>ndarray</code>), en insistant sur l'importance de la vectorisation pour la performance.</div>",
          "reponse": "<div style='background: #e8f5e9; padding: 10px; border-radius: 5px; color: #2e7d32;'>Un tableau NumPy est homogène (tous les éléments sont du même type) et permet des opérations vectorisées, c'est-à-dire des opérations appliquées à l'ensemble du tableau sans boucle explicite, ce qui le rend beaucoup plus rapide et efficace que les listes Python pour des calculs numériques sur de grands volumes de données [citation:2].</div>"
        },
        {
          "question": "<div style='margin: 10px 0;'><strong>3.2 (2 pts)</strong> Soit le tableau NumPy suivant :</div> <pre style='background: #2d2d2d; color: #ccc; padding: 10px; border-radius: 5px;'><code>import numpy as np\narr = np.array([10, 20, 30, 40, 50])</code></pre> <div style='margin-top: 10px;'>Écrire le code permettant de :</div> <ul style='color: #444;'><li>Multiplier tous les éléments par 2.</li><li>Calculer la somme de tous les éléments.</li><li>Extraire les éléments supérieurs à 25.</li></ul>",
          "reponse": "<div style='background: #e8f5e9; padding: 10px; border-radius: 5px; color: #2e7d32;'><pre style='background: #2d2d2d; color: #ccc; padding: 10px; border-radius: 5px;'><code># Multiplier par 2\narr_x2 = arr * 2\nprint(arr_x2)\n\n# Calculer la somme\nsomme = np.sum(arr)\nprint(somme)\n\n# Extraire les éléments > 25\nfiltre = arr[arr > 25]\nprint(filtre)</code></pre></div>"
        },
        {
          "question": "<div style='margin: 10px 0;'><strong>3.3 (3 pts)</strong> On souhaite analyser des données de ventes contenues dans un fichier CSV. En utilisant Pandas, écrire un script qui :</div> <ol style='color: #444;'><li>Importe la bibliothèque Pandas.</li><li>Lit le fichier <code>ventes.csv</code> dans un DataFrame.</li><li>Affiche les 5 premières lignes du DataFrame.</li><li>Affiche un résumé statistique des colonnes numériques.</li><li>Filtre le DataFrame pour ne garder que les ventes supérieures à 1000.</li></ol> <div style='margin-top: 10px;'>On suppose que le fichier <code>ventes.csv</code> existe et contient une colonne 'montant'.</div>",
          "reponse": "<div style='background: #e8f5e9; padding: 10px; border-radius: 5px; color: #2e7d32;'><pre style='background: #2d2d2d; color: #ccc; padding: 10px; border-radius: 5px;'><code>import pandas as pd\n\n# 1. Lire le fichier\ndf = pd.read_csv('ventes.csv')\n\n# 2. Afficher les 5 premières lignes\nprint(df.head())\n\n# 3. Afficher le résumé statistique\nprint(df.describe())\n\n# 4. Filtrer les ventes > 1000\nventes_elevees = df[df['montant'] > 1000]\nprint(ventes_elevees)</code></pre></div>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
