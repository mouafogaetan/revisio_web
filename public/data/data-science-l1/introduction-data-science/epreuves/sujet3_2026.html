<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
 "matiere": "Introduction à la Data Science",
 "classe": "Licence 1 Data Science",
 "sequence": "Séquence 3",
 "anneeScolaire": "2025-2026",
 "exercices": [
   {
     "titre": "Définition et Émergence de la Data Science",
     "points": "2 pts",
     "enonce": "<p>Répondez aux questions suivantes en vous basant sur les concepts fondamentaux de la Data Science.</p>",
     "questions":[
       {
         "question": "1) Donnez une définition complète de la Data Science en précisant ses principaux objectifs. (1 pt)",
         "reponse": "La Data Science est un domaine interdisciplinaire qui combine des méthodes statistiques, des algorithmes de Machine Learning et des compétences en programmation pour extraire des connaissances et des insights à partir de données structurées et non structurées [citation:4]. Ses objectifs principaux sont : (1) l'analyse exploratoire pour comprendre les données, (2) la construction de modèles prédictifs, et (3) la communication des résultats pour faciliter la prise de décision."
       },
       {
         "question": "2) Quelles sont les trois grandes étapes de l'évolution historique de la Data Science ? Citez un événement ou une innovation clé pour chacune. (1 pt)",
         "reponse": "Les trois grandes étapes sont : (1) L'ère des statistiques, avec le développement des méthodes d'analyse et d'inférence statistique au début du 20e siècle. (2) L'ère de l'informatique, avec l'avènement des bases de données relationnelles, du stockage numérique et des premiers algorithmes d'apprentissage automatique (ex: réseaux de neurones). (3) L'ère du Big Data, marquée par l'explosion des données (volume, vélocité, variété) avec l'essor d'Internet, des réseaux sociaux et des capteurs, nécessitant des outils comme Hadoop et Spark."
       }
     ]
   },
   {
     "titre": "Le Cycle de Vie d'un Projet Data Science",
     "points": "4 pts",
     "enonce": "<p>Le cycle de vie d'un projet Data Science est souvent structuré par des méthodologies comme CRISP-DM ou OSEMN. Répondez aux questions ci-dessous.</p>",
     "questions":[
       {
         "question": "1) Décrivez les six phases du modèle CRISP-DM, en expliquant brièvement l'objectif de chaque phase. (2 pts)",
         "reponse": "Les six phases du modèle CRISP-DM sont : <br> <strong>1. Business Understanding</strong> : Comprendre les objectifs et les besoins du projet du point de vue de l'entreprise, et les traduire en un problème de Data Science. <br> <strong>2. Data Understanding</strong> : Collecter les données initiales, les explorer pour en comprendre la structure et identifier des problèmes de qualité [citation:4]. <br> <strong>3. Data Preparation</strong> : Nettoyer, transformer et formater les données pour les rendre utilisables par les modèles. C'est l'étape du data wrangling [citation:4]. <br> <strong>4. Modeling</strong> : Sélectionner et appliquer des techniques de modélisation (régression, classification, clustering) sur les données préparées [citation:4]. <br> <strong>5. Evaluation</strong> : Évaluer le modèle construit pour s'assurer qu'il atteint les objectifs business définis initialement. <br> <strong>6. Deployment</strong> : Déployer le modèle en production, planifier son utilisation et sa maintenance [citation:4]."
       },
       {
         "question": "2) La méthodologie OSEMN est une autre approche. Que signifient les lettres O, S, E, M et N ? (1 pt)",
         "reponse": "OSEMN est un acronyme pour : <strong>O</strong>btain (Obtenir), <strong>S</strong>crub (Nettoyer), <strong>E</strong>xplore (Explorer), <strong>M</strong>odel (Modéliser), <strong>N</strong>terpret (Interpréter). C'est une approche itérative souvent associée aux projets Data Science avec Python [citation:5][citation:9]."
       },
       {
         "question": "3) Pourquoi ces processus sont-ils décrits comme 'itératifs' ? (1 pt)",
         "reponse": "Ils sont décrits comme itératifs car le cycle n'est pas strictement linéaire. Les phases sont reliées entre elles et les data scientists reviennent souvent en arrière pour affiner leurs travaux. Par exemple, les résultats de l'évaluation d'un modèle peuvent conduire à une nouvelle préparation des données ou à la sélection d'un autre modèle pour améliorer les performances. C'est un processus d'essais et d'améliorations continues."
       }
     ]
   },
   {
     "titre": "Éthique, Biais et Transparence en Data Science",
     "points": "6 pts",
     "enonce": "<p>La Data Science, comme toute technologie puissante, soulève des questions éthiques importantes. Les biais algorithmiques, la protection des données et l'explicabilité des modèles sont des enjeux majeurs.</p>",
     "questions":[
       {
         "question": "1) Définissez ce qu'est un 'biais algorithmique' et identifiez trois sources potentielles de biais dans un projet Data Science. (2 pts)",
         "reponse": "Un biais algorithmique est une erreur systématique et injuste qui se produit lorsqu'un modèle produit des résultats discriminatoires envers certains groupes, souvent parce qu'il reflète des préjugés présents dans les données d'entraînement ou dans la conception du système [citation:14]. <br> Trois sources potentielles : <br> <strong>Les données :</strong> Utiliser des données historiques qui contiennent des inégalités (ex: recrutement favorisant un genre). <br> <strong>La conception du modèle :</strong> Choisir des variables (proxys) qui sont corrélées à des attributs sensibles comme la race ou le genre (ex: code postal). <br> <strong>La société :</strong> Les préjugés sociétaux peuvent influencer la manière dont le problème est défini et les métriques de performance choisies."
       },
       {
         "question": "2) Expliquez l'importance de la transparence et de l'explicabilité (XAI) pour un modèle de Data Science, en donnant un exemple où cela est crucial. (2 pts)",
         "reponse": "La transparence et l'explicabilité sont cruciales pour comprendre pourquoi un modèle prend une décision, ce qui renforce la confiance des utilisateurs et permet d'identifier des biais [citation:14]. Un modèle 'boîte noire' est difficile à auditer. <br> <strong>Exemple crucial :</strong> Dans le domaine de la santé, un modèle qui prédit le risque de maladie. Si le modèle recommande un traitement, il est essentiel de savoir quels facteurs (symptômes, antécédents) ont conduit à cette prédiction pour que le médecin puisse valider ou contester la décision et éviter une erreur de diagnostic potentiellement mortelle."
       },
       {
         "question": "3) Nommez deux techniques ou bonnes pratiques pour atténuer les biais dans les modèles de Machine Learning. (1 pt)",
         "reponse": "Deux techniques pour atténuer les biais : <br> <strong>1. Audit et ré-équilibrage des données :</strong> S'assurer que les données d'entraînement sont représentatives de la diversité de la population et corriger les déséquilibres [citation:6]. <br> <strong>2. Utilisation de contraintes d'équité :</strong> Pendant l'entraînement, pénaliser les décisions discriminatoires pour forcer le modèle à être plus équitable [citation:6]."
       },
       {
         "question": "4) Le Règlement Général sur la Protection des Données (RGPD) est un texte législatif majeur. Quel est son objectif principal et pourquoi est-il important en Data Science ? (1 pt)",
         "reponse": "L'objectif principal du RGPD est de protéger les données personnelles des citoyens de l'Union Européenne et de leur donner un droit de regard sur l'utilisation de leurs données. Il est important en Data Science car il impose des contraintes sur la collecte, le stockage et l'utilisation des données (nécessité d'un consentement, droit à l'oubli, obligation d'informer les utilisateurs), ce qui influence directement la manière dont les projets sont menés."
       }
     ]
   },
   {
     "titre": "Du Prototype à la Production",
     "points": "4 pts",
     "enonce": "<p>Passer d'un prototype de Data Science à un modèle en production est un défi technique majeur. Ces questions explorent cet enjeu.</p>",
     "questions":[
       {
         "question": "1) Expliquez ce qu'est le 'fossé' entre le notebook de recherche et la production (notebook-to-production gap) et donnez une raison de son existence. (2 pts)",
         "reponse": "Le 'fossé' est la difficulté à faire fonctionner un modèle qui a été développé dans un environnement de recherche (ex: un notebook Jupyter) dans un environnement de production réel [citation:3]. <br> Une raison de son existence est que l'environnement de recherche est souvent isolé et idéalisé, tandis que la production impose des contraintes de scalabilité, de latence et de robustesse [citation:3]. Un modèle peut avoir 99% de précision en laboratoire mais échouer face à des données réelles, bruitées ou à un trafic important [citation:3]."
       },
       {
         "question": "2) Citez et décrivez deux contraintes clés d'un environnement de production que l'on ne retrouve pas forcément dans un prototype. (2 pts)",
         "reponse": "Deux contraintes clés : <br> <strong>La latence :</strong> Le temps de réponse du modèle doit être très faible pour des applications en temps réel [citation:3]. Un modèle peut être trop lent pour fournir une prédiction dans le délai imparti. <br> <strong>La scalabilité :</strong> Le système doit pouvoir gérer un grand volume de requêtes simultanées sans dégrader ses performances. Le prototype, lui, est souvent testé sur un seul jeu de données statique [citation:3]."
       }
     ]
   },
   {
     "titre": "Application et Monitoring",
     "points": "4 pts",
     "enonce": "<p>Une fois le modèle en production, son cycle de vie continue.</p>",
     "questions":[
       {
         "question": "1) Qu'est-ce que la 'dérive des données' (data drift) ? Pourquoi est-il important de la surveiller ? (2 pts)",
         "reponse": "La dérive des données (data drift) est la modification de la distribution statistique des données en entrée du modèle au fil du temps. Les données utilisées pour faire les prédictions deviennent différentes de celles utilisées pour l'entraîner. <br> La surveiller est crucial, car si les données changent, la performance du modèle peut se dégrader, le rendant obsolète et moins précis dans ses prédictions [citation:3][citation:7]."
       },
       {
         "question": "2) Comment l'utilisation d'APIs permet-elle d'intégrer un modèle de Data Science dans une application web ou mobile ? (2 pts)",
         "reponse": "Une API (Interface de Programmation) sert de pont pour exposer le modèle à d'autres services. Le modèle est déployé sur un serveur avec une API qui écoute les requêtes. L'application web ou mobile envoie les données d'un utilisateur (en JSON, par exemple) à cette API. L'API transmet les données au modèle, qui calcule la prédiction, et l'API renvoie le résultat à l'application qui l'affiche à l'utilisateur. Cela permet de séparer la logique du modèle de l'interface utilisateur [citation:3][citation:11]."
       }
     ]
   }
 ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
