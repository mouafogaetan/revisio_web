<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
 "matiere": "Introduction à la Data Science - L1",
 "classe": "Licence 1 Data Science",
 "sequence": "Séquence 2",
 "anneeScolaire": "2025-2026",
 "exercices": [
   {
     "titre": "Définition et concepts fondamentaux",
     "points": "4 pts",
     "enonce": "<p>Répondez aux questions suivantes en vous appuyant sur vos connaissances des chapitres 3 à 5 du programme (Les Données : Sources, Types et Collecte / Analyse Exploratoire de Données).</p>",
     "questions": [
       {
         "question": "<p><strong>1. (1 pt)</strong> Distinguez les trois types de données suivants en précisant s'il s'agit de données structurées, semi-structurées ou non structurées :</p><ul><li>a) Une table SQL contenant des informations clients</li><li>b) Un fichier JSON avec des données de capteurs</li><li>c) Une collection d'images satellites</li></ul>",
         "reponse": "<p>a) <strong>Données structurées</strong> : organisation en lignes et colonnes avec un schéma fixe.<br>b) <strong>Données semi-structurées</strong> : format flexible avec balises mais structure hiérarchique.<br>c) <strong>Données non structurées</strong> : format binaire sans structure tabulaire prédéfinie.</p>"
       },
       {
         "question": "<p><strong>2. (1.5 pts)</strong> Un Data Scientist analyse les ventes d'une entreprise camerounaise. Pour chaque variable suivante, identifiez sa nature (quantitative/qualitative), son type (continue/discrète/nominale/ordinale) et son échelle de mesure :</p><ul><li>a) Le chiffre d'affaires mensuel en FCFA</li><li>b) La région de provenance du client (Littoral, Centre, Ouest, etc.)</li><li>c) Le niveau de satisfaction client (Très satisfait, Satisfait, Insatisfait)</li></ul>",
         "reponse": "<p>a) <strong>Quantitative continue</strong> - Échelle de rapport (vrai zéro, écarts significatifs)<br>b) <strong>Qualitative nominale</strong> - Échelle nominale (catégories sans ordre)<br>c) <strong>Qualitative ordinale</strong> - Échelle ordinale (catégories avec ordre)</p>"
       },
       {
         "question": "<p><strong>3. (1.5 pts)</strong> Expliquez brièvement pourquoi les statistiques descriptives (moyenne, médiane, écart-type) sont des outils indispensables lors de l'Analyse Exploratoire de Données (EDA). Donnez un exemple concret où la médiane est préférable à la moyenne.</p>",
         "reponse": "<p>Les statistiques descriptives permettent de résumer et de comprendre la structure des données avant toute modélisation. Elles aident à détecter des anomalies, des tendances et à orienter les étapes suivantes.<br><strong>Exemple :</strong> Dans une analyse des salaires d'une entreprise où quelques dirigeants ont des salaires très élevés, la moyenne serait tirée vers le haut par ces valeurs extrêmes. La médiane, plus robuste, donne une meilleure indication du salaire 'typique' des employés.</p>"
       }
     ]
   },
   {
     "titre": "Types de données et échelles de mesure",
     "points": "3 pts",
     "enonce": "<p>Une enquête de satisfaction a été menée auprès de clients d'une compagnie de transport au Cameroun. Les données collectées sont les suivantes :</p><ul><li>ID du client (ex: 001, 002, ...)</li><li>Âge du client (en années)</li><li>Ville de résidence (Douala, Yaoundé, Garoua, ...)</li><li>Note de satisfaction sur une échelle de 1 à 5 étoiles</li><li>Commentaire libre sur le service</li><li>Temps d'attente en minutes</li></ul>",
     "questions": [
       {
         "question": "<p><strong>1. (0.5 pt)</strong> Quelle est la nature de la variable 'Commentaire libre' ? Justifiez.</p>",
         "reponse": "<p>C'est une donnée <strong>non structurée</strong> car c'est un texte libre sans format fixe, ce qui nécessite des techniques de NLP pour être analysé.</p>"
       },
       {
         "question": "<p><strong>2. (0.5 pt)</strong> La variable 'Note de satisfaction' est-elle quantitative ou qualitative ? Précisez son échelle de mesure.</p>",
         "reponse": "<p>C'est une variable <strong>qualitative ordinale</strong> (échelle ordinale) car les notes ont un ordre (1 < 2 < 3 < 4 < 5) mais les écarts entre les notes ne sont pas nécessairement égaux subjectivement.</p>"
       },
       {
         "question": "<p><strong>3. (1 pt)</strong> Quelles sont les trois composantes du Big Data (3V) ? Donnez un exemple pour chaque composante dans le contexte de cette entreprise de transport.</p>",
         "reponse": "<p><strong>Volume</strong> : Quantité massive de données (ex: millions de trajets enregistrés chaque année).<br><strong>Vélocité</strong> : Vitesse de génération des données (ex: données GPS en temps réel des bus).<br><strong>Variété</strong> : Diversité des types de données (ex: données structurées comme les horaires, semi-structurées comme les JSON des capteurs, non structurées comme les commentaires clients).</p>"
       },
       {
         "question": "<p><strong>4. (1 pt)</strong> Proposez un graphique approprié pour visualiser :</p><ul><li>a) La distribution des âges des clients</li><li>b) La répartition des clients par ville</li></ul>",
         "reponse": "<p>a) Un <strong>histogramme</strong> ou une <strong>boîte à moustaches (boxplot)</strong> pour visualiser la distribution des âges.<br>b) Un <strong>diagramme à barres</strong> pour comparer les effectifs de clients par ville.</p>"
       }
     ]
   },
   {
     "titre": "Détection et traitement des valeurs aberrantes",
     "points": "5 pts",
     "enonce": "<p>Un dataset contient les temps de réponse (en secondes) d'un site web pour 15 requêtes : 1.2, 1.5, 1.3, 1.4, 1.6, 1.3, 1.5, 1.7, 1.4, 1.6, 1.8, 1.3, 1.5, 12.0, 1.4.</p>",
     "questions": [
       {
         "question": "<p><strong>1. (1 pt)</strong> Calculez le premier quartile (Q1), le troisième quartile (Q3) et l'écart interquartile (IQR) de ces données.</p>",
         "reponse": "<p>Données triées : 1.2, 1.3, 1.3, 1.3, 1.4, 1.4, 1.4, 1.5, 1.5, 1.5, 1.6, 1.6, 1.7, 1.8, 12.0<br>n = 15<br>Q1 (position 4) = 1.3<br>Q3 (position 12) = 1.6<br>IQR = Q3 - Q1 = 1.6 - 1.3 = 0.3</p>"
       },
       {
         "question": "<p><strong>2. (1 pt)</strong> Utilisez la méthode IQR (seuil de 1.5×IQR) pour identifier les valeurs aberrantes.</p>",
         "reponse": "<p>Borne inférieure = Q1 - 1.5 × IQR = 1.3 - 1.5 × 0.3 = 1.3 - 0.45 = 0.85<br>Borne supérieure = Q3 + 1.5 × IQR = 1.6 + 1.5 × 0.3 = 1.6 + 0.45 = 2.05<br>La valeur 12.0 est > 2.05, c'est donc une <strong>valeur aberrante</strong>.</p>"
       },
       {
         "question": "<p><strong>3. (1 pt)</strong> Calculez le Z-score de la valeur 12.0 sachant que la moyenne des données (sans la valeur aberrante) est d'environ 1.48 et l'écart-type d'environ 0.17. Est-ce une valeur aberrante selon la méthode du Z-score (seuil |Z| > 2) ?</p>",
         "reponse": "<p>Z-score = (12.0 - 1.48) / 0.17 = 10.52 / 0.17 ≈ 61.9<br>|Z| = 61.9 > 2, donc c'est une <strong>valeur aberrante</strong> selon la méthode du Z-score.</p>"
       },
       {
         "question": "<p><strong>4. (1 pt)</strong> Proposez deux stratégies de traitement pour cette valeur aberrante et discutez des avantages et inconvénients de chacune.</p>",
         "reponse": "<p><strong>Stratégie 1 - Suppression</strong> : Retirer la valeur 12.0 du dataset.<br>Avantage : Simple, élimine l'influence de la valeur extrême sur les calculs.<br>Inconvénient : Perte potentielle d'informations si la valeur est réelle et non une erreur.<br><strong>Stratégie 2 - Transformation</strong> : Appliquer une transformation logarithmique ou remplacer la valeur par la médiane.<br>Avantage : Conserve la donnée tout en réduisant son impact.<br>Inconvénient : Modifie la distribution des données.</p>"
       },
       {
         "question": "<p><strong>5. (1 pt)</strong> Quel graphique utiliseriez-vous pour visualiser cette valeur aberrante ? Justifiez.</p>",
         "reponse": "<p>Une <strong>boîte à moustaches (boxplot)</strong> est le graphique le plus approprié pour visualiser les valeurs aberrantes. Elle permet de visualiser la médiane, les quartiles et d'identifier clairement les points isolés au-delà des moustaches (comme 12.0 dans cet exemple).</p>"
       }
     ]
   },
   {
     "titre": "Les données : sources et collecte",
     "points": "4 pts",
     "enonce": "<p>Vous êtes Data Scientist dans une entreprise camerounaise de e-commerce. L'entreprise souhaite analyser le comportement d'achat de ses clients pour proposer des recommandations personnalisées.</p>",
     "questions": [
       {
         "question": "<p><strong>1. (1 pt)</strong> Identifiez trois sources potentielles de données (internes ou externes) que vous pourriez utiliser pour ce projet.</p>",
         "reponse": "<p><strong>Sources internes :</strong><br>1) Base de données des transactions clients (historique des achats).<br>2) Données de navigation sur le site web (pages visitées, temps passé).<br>3) Données de fidélité et programmes de récompense.<br><strong>Sources externes :</strong><br>4) Données démographiques des régions (INSTAT Cameroun).<br>5) Données des réseaux sociaux (sentiment client).</p>"
       },
       {
         "question": "<p><strong>2. (1 pt)</strong> Décrivez brièvement une méthode de collecte de données externes que vous pourriez utiliser.</p>",
         "reponse": "<p>Le <strong>web scraping</strong> est une méthode efficace pour collecter des données externes. Par exemple, scraper des sites de comparaison de prix ou des forums pour analyser les tendances du marché. Il faut respecter les conditions d'utilisation des sites et les lois sur la protection des données.</p>"
       },
       {
         "question": "<p><strong>3. (1 pt)</strong> Expliquez les enjeux liés au volume, à la vélocité et à la variété des données dans ce contexte.</p>",
         "reponse": "<p><strong>Volume</strong> : L'entreprise peut générer des millions de transactions, nécessitant des solutions de stockage adaptées.<br><strong>Vélocité</strong> : Les données de navigation en temps réel doivent être traitées rapidement pour des recommandations immédiates.<br><strong>Variété</strong> : Les données proviennent de sources diverses : transactions structurées, logs de navigation semi-structurés, avis clients non structurés.</p>"
       },
       {
         "question": "<p><strong>4. (1 pt)</strong> Quelle est la différence entre ETL et ELT ? Lequel serait le plus adapté pour ce projet si l'entreprise utilise un data lake ?</p>",
         "reponse": "<p><strong>ETL (Extract, Transform, Load)</strong> : Les données sont transformées avant d'être chargées dans l'entrepôt.<br><strong>ELT (Extract, Load, Transform)</strong> : Les données sont d'abord chargées brutes puis transformées.<br>Avec un <strong>data lake</strong>, l'approche <strong>ELT</strong> est plus adaptée car elle permet de stocker les données brutes et de les transformer à la demande, offrant une plus grande flexibilité pour l'exploration.</p>"
       }
     ]
   },
   {
     "titre": "Question bonus - Éthique et données",
     "points": "2 pts (bonus)",
     "enonce": "<p>L'entreprise de e-commerce souhaite utiliser les données personnelles de ses clients (adresse, historique d'achat, données de navigation) pour améliorer ses recommandations.</p>",
     "questions": [
       {
         "question": "<p><strong>1. (0.5 pt)</strong> Quels sont les principaux risques éthiques liés à l'utilisation de ces données ?</p>",
         "reponse": "<p>Risques : atteinte à la vie privée, utilisation non consentie des données, profilage discriminatoire, sécurité des données (fuites potentielles).</p>"
       },
       {
         "question": "<p><strong>2. (0.5 pt)</strong> Que signifie le RGPD et quel est son objectif principal ?</p>",
         "reponse": "<p><strong>RGPD</strong> : Règlement Général sur la Protection des Données. Son objectif est de protéger les données personnelles des citoyens européens en imposant des règles strictes sur leur collecte, leur traitement et leur stockage.</p>"
       },
       {
         "question": "<p><strong>3. (1 pt)</strong> Proposez trois bonnes pratiques pour garantir une utilisation éthique et responsable des données clients dans ce projet.</p>",
         "reponse": "<p>1) <strong>Consentement explicite</strong> : Demander l'accord des clients avant de collecter et d'utiliser leurs données.<br>2) <strong>Anonymisation</strong> : Rendre les données non identifiables pour protéger la vie privée.<br>3) <strong>Transparence</strong> : Expliquer clairement comment les données sont utilisées et permettre aux clients de contrôler leurs préférences.</p>"
       }
     ]
   }
 ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
