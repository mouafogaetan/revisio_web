<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Introduction à la Data Science - L1",
  "classe": "Licence 1 Data Science",
  "sequence": "Séquence 5",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Cycle de vie d'un projet Data Science (6 pts)",
      "points": "6 pts",
      "enonce": "<p>Le modèle CRISP-DM (Cross-Industry Standard Process for Data Mining) est une méthodologie de référence en Data Science. Il décrit le cycle de vie d'un projet en six phases.</p><div style='background-color:#f0f8ff; padding:15px; border-radius:8px;'><p><strong>Rappel des phases :</strong></p><ul><li><strong>Business Understanding</strong></li><li><strong>Data Understanding</strong></li><li><strong>Data Preparation</strong></li><li><strong>Modeling</strong></li><li><strong>Evaluation</strong></li><li><strong>Deployment</strong></li></ul></div>",
      "questions": [
        {
          "question": "<p><strong>1. (2 pts)</strong> Décrivez brièvement les 6 phases du cycle CRISP-DM. Pour chaque phase, précisez son objectif principal.</p>",
          "reponse": "<ul><li><strong>Business Understanding</strong> : Définir les objectifs du projet et formuler le problème en question Data Science [citation:1][citation:5].</li><li><strong>Data Understanding</strong> : Collecter, explorer et qualifier les données disponibles [citation:1][citation:5].</li><li><strong>Data Preparation</strong> : Nettoyer, transformer et préparer les données pour la modélisation [citation:1][citation:5].</li><li><strong>Modeling</strong> : Choisir, entraîner et ajuster les modèles prédictifs [citation:1][citation:5].</li><li><strong>Evaluation</strong> : Évaluer la performance du modèle et vérifier qu'il répond aux objectifs métier [citation:1][citation:6].</li><li><strong>Deployment</strong> : Déployer le modèle en production et assurer son suivi [citation:1][citation:13].</li></ul>"
        },
        {
          "question": "<p><strong>2. (1 pt)</strong> Expliquez pourquoi le cycle CRISP-DM est qualifié d'<strong>itératif</strong>.</p>",
          "reponse": "Le cycle est itératif car les phases ne s'enchaînent pas de manière linéaire. On revient souvent en arrière : par exemple, après l'évaluation, on peut décider de préparer différemment les données (Data Preparation) ou de reformuler le problème (Business Understanding). L'itération permet d'ajuster le projet en fonction des résultats intermédiaires [citation:1][citation:5][citation:13]."
        },
        {
          "question": "<p><strong>3. (1 pt)</strong> À quelle phase du cycle CRISP-DM appartient l'action suivante : <em>\"On utilise <code>train_test_split</code> pour diviser les données en ensemble d'entraînement et de test\"</em> ? Justifiez.</p>",
          "reponse": "Cette action appartient à la phase de <strong>Data Preparation</strong>. La séparation des données en ensembles d'entraînement et de test est une étape de préparation des données (Data Preparation) qui prépare le jeu de données pour la phase de modélisation (Modeling)."
        },
        {
          "question": "<p><strong>4. (1 pt)</strong> À quelle phase appartient l'action suivante : <em>\"Le Data Scientist présente les résultats du modèle à l'équipe métier et obtient leur validation\"</em> ? Justifiez.</p>",
          "reponse": "Cette action appartient à la phase d'<strong>Evaluation</strong>. La présentation et la validation des résultats par les parties prenantes est une activité typique de l'évaluation, qui permet de s'assurer que le modèle répond aux objectifs métier définis au départ [citation:1]."
        },
        {
          "question": "<p><strong>5. (1 pt)</strong> Un Data Scientist a entraîné un modèle et constate qu'il est en sous-apprentissage. À quelle(s) phase(s) du cycle doit-il revenir ? Justifiez.</p>",
          "reponse": "Il doit revenir à la phase de <strong>Data Preparation</strong> et/ou <strong>Modeling</strong>. Le sous-apprentissage peut être dû à une préparation insuffisante des données (ex: manque de features, données non transformées) ou à un modèle trop simple. Il peut donc revenir à Data Preparation pour améliorer les données ou à Modeling pour tester des modèles plus complexes [citation:13]."
        }
      ]
    },
    {
      "titre": "Exercice 2 : Évaluation des modèles - Cas pratique (7 pts)",
      "points": "7 pts",
      "enonce": "<p>Vous avez développé un modèle de classification pour prédire si un client d'une banque camerounaise va accepter une offre de prêt (Oui/Non). Après avoir entraîné le modèle, vous évaluez sa performance sur un ensemble de test de 100 clients. Les résultats sont résumés dans la matrice de confusion suivante :</p><table style='width:100%; border-collapse: collapse;'><tr style='background-color:#2c3e50; color:white;'><th style='padding:8px; border:1px solid #ddd;'></th><th style='padding:8px; border:1px solid #ddd;'>Prédit Oui</th><th style='padding:8px; border:1px solid #ddd;'>Prédit Non</th></tr><tr><td style='padding:8px; border:1px solid #ddd;'>Réel Oui</td><td style='padding:8px; border:1px solid #ddd;'>40</td><td style='padding:8px; border:1px solid #ddd;'>10</td></tr><tr><td style='padding:8px; border:1px solid #ddd;'>Réel Non</td><td style='padding:8px; border:1px solid #ddd;'>5</td><td style='padding:8px; border:1px solid #ddd;'>45</td></tr></table>",
      "questions": [
        {
          "question": "<p><strong>1. (1 pt)</strong> Identifiez les valeurs des <strong>Vrais Positifs (VP)</strong>, <strong>Faux Positifs (FP)</strong>, <strong>Vrais Négatifs (VN)</strong> et <strong>Faux Négatifs (FN)</strong>.</p>",
          "reponse": "<ul><li><strong>Vrais Positifs (VP) :</strong> 40</li><li><strong>Faux Positifs (FP) :</strong> 5</li><li><strong>Vrais Négatifs (VN) :</strong> 45</li><li><strong>Faux Négatifs (FN) :</strong> 10</li></ul>"
        },
        {
          "question": "<p><strong>2. (1.5 pts)</strong> Calculez l'<strong>exactitude (accuracy)</strong> du modèle.</p>",
          "reponse": "<p>Exactitude = (VP + VN) / (VP + VN + FP + FN) = (40 + 45) / 100 = 85 / 100 = <strong>0.85</strong> (85%).</p>"
        },
        {
          "question": "<p><strong>3. (1.5 pts)</strong> Calculez la <strong>précision (precision)</strong> du modèle pour la classe 'Oui'.</p>",
          "reponse": "<p>Précision = VP / (VP + FP) = 40 / (40 + 5) = 40 / 45 ≈ <strong>0.89</strong> (89%).</p>"
        },
        {
          "question": "<p><strong>4. (1.5 pts)</strong> Calculez le <strong>rappel (recall)</strong> du modèle pour la classe 'Oui'.</p>",
          "reponse": "<p>Rappel = VP / (VP + FN) = 40 / (40 + 10) = 40 / 50 = <strong>0.80</strong> (80%).</p>"
        },
        {
          "question": "<p><strong>5. (1.5 pts)</strong> En quelques phrases, interprétez ces résultats pour la banque. Que signifient la précision et le rappel dans ce contexte métier ?</p>",
          "reponse": "La <strong>précision de 89%</strong> signifie que parmi les clients que le modèle prédit comme acceptant l'offre, 89% l'acceptent réellement. C'est bon pour éviter de démarcher des clients qui ne sont pas intéressés. Le <strong>rappel de 80%</strong> signifie que le modèle identifie correctement 80% des clients qui acceptent réellement l'offre. Il manque 20% des clients potentiels (10 clients). La banque peut choisir d'améliorer le rappel pour ne pas rater de bonnes opportunités, ou améliorer la précision pour réduire les coûts de démarchage."
        }
      ]
    },
    {
      "titre": "Exercice 3 : Éthique et déontologie en Data Science (3 pts)",
      "points": "3 pts",
      "enonce": "<p>L'éthique est un enjeu majeur en Data Science. Un Data Scientist doit être conscient des biais et des impacts de ses modèles sur les individus et la société.</p>",
      "questions": [
        {
          "question": "<p><strong>1. (1 pt)</strong> Qu'est-ce qu'un <strong>biais algorithmique</strong> ? Donnez un exemple concret.</p>",
          "reponse": "Un biais algorithmique est une erreur systématique dans un modèle qui produit des résultats injustes ou discriminatoires. Cela peut provenir de données d'entraînement biaisées. Par exemple, un modèle de recrutement entraîné sur des données historiques où les hommes étaient majoritaires pourrait favoriser les candidats masculins [citation:7][citation:11]."
        },
        {
          "question": "<p><strong>2. (1 pt)</strong> Citez deux bonnes pratiques pour garantir la <strong>transparence</strong> et l'<strong>équité</strong> d'un modèle de Data Science.</p>",
          "reponse": "<ul><li><strong>Documentation et partage :</strong> Documenter clairement les données, le code et les décisions de conception du modèle pour permettre l'audit et la reproductibilité [citation:7].</li><li><strong>Audit de biais :</strong> Évaluer le modèle sur différents sous-groupes de la population pour détecter et corriger les disparités [citation:7][citation:10].</li></ul>"
        },
        {
          "question": "<p><strong>3. (1 pt)</strong> Expliquez l'importance de la <strong>vie privée</strong> et de la <strong>protection des données</strong> dans un projet Data Science.</p>",
          "reponse": "La protection des données personnelles est essentielle pour respecter la vie privée des individus et se conformer aux réglementations comme le RGPD. Les Data Scientists doivent anonymiser les données, obtenir un consentement éclairé et limiter l'utilisation des données à l'objectif défini [citation:7][citation:15]."
        }
      ]
    },
    {
      "titre": "Exercice 4 : Déploiement en production (4 pts)",
      "points": "4 pts",
      "enonce": "<p>Votre modèle de prédiction d'acceptation de prêt a été validé. Il doit maintenant être déployé en production pour être utilisé par les conseillers bancaires.</p>",
      "questions": [
        {
          "question": "<p><strong>1. (1 pt)</strong> Quelles sont les principales <strong>contraintes de production</strong> que vous devez prendre en compte ?</p>",
          "reponse": "Les principales contraintes de production sont : <ul><li><strong>Latence :</strong> Le modèle doit répondre rapidement (quelques millisecondes).</li><li><strong>Scalabilité :</strong> Le modèle doit gérer un grand nombre de requêtes simultanées.</li><li><strong>Disponibilité :</strong> Le service doit être disponible en continu (ex: 99.9%).</li><li><strong>Robustesse :</strong> Le modèle doit fonctionner avec des données imparfaites.</li><li><strong>Sécurité :</strong> Les données et l'API doivent être protégées.</li></ul>"
        },
        {
          "question": "<p><strong>2. (1 pt)</strong> Décrivez brièvement le rôle des <strong>API (Application Programming Interface)</strong> dans le déploiement d'un modèle.</p>",
          "reponse": "Les API exposent le modèle comme un service web. Les applications (ex: le logiciel du conseiller bancaire) envoient des requêtes à l'API avec les données du client, et l'API renvoie la prédiction (ex: probabilité d'acceptation). L'API sert d'interface entre le modèle et le système d'information."
        },
        {
          "question": "<p><strong>3. (1 pt)</strong> Qu'est-ce que le <strong>monitoring</strong> d'un modèle en production ? Pourquoi est-ce important ?</p>",
          "reponse": "Le monitoring est le suivi continu de la performance du modèle en production. On surveille : <ul><li>L'erreur du modèle (ex: baisse de précision).</li><li>La <strong>dérive des données</strong> (data drift) : la distribution des données d'entrée change.</li><li>La <strong>dérive du concept</strong> (concept drift) : la relation entre les données et la cible évolue.</li></ul><p>C'est important pour détecter les dégradations et ré-entraîner le modèle si nécessaire [citation:13].</p>"
        },
        {
          "question": "<p><strong>4. (1 pt)</strong> Proposez deux stratégies de <strong>ré-entraînement</strong> d'un modèle en production.</p>",
          "reponse": "<ul><li><strong>Ré-entraînement périodique :</strong> Entraîner un nouveau modèle à intervalles réguliers (ex: chaque semaine) sur l'ensemble des données disponibles.</li><li><strong>Ré-entraînement déclenché :</strong> Entraîner un nouveau modèle lorsque le monitoring détecte une baisse de performance ou une dérive (data drift).</li></ul>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
