<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Introduction à la Data Science - L1",
  "classe": "Licence 1 Data Science",
  "sequence": "Séquence 6",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Questions de Cours (6 pts)",
      "points": "6 pts",
      "enonce": "<p>Répondez aux questions suivantes en vous basant sur les notions vues en cours.</p>",
      "questions": [
        {
          "question": "<p><strong>1.1 (2 pts)</strong> Définissez ce qu'est une question Data Science. Proposez un exemple de question Data Science dans le contexte du secteur de la santé au Cameroun.</p>",
          "reponse": "<p>Une <strong>question Data Science</strong> est une question à laquelle on peut répondre en analysant des données. Elle doit être précise, mesurable et actionnable.</p><p><strong>Exemple :</strong> 'Quels sont les facteurs (âge, zone géographique, antécédents médicaux) qui influencent le plus le temps d'attente aux urgences de l'Hôpital Général de Douala ?' [citation:1]</p>"
        },
        {
          "question": "<p><strong>1.2 (2 pts)</strong> Expliquez l'importance de la <strong>synthèse exécutive</strong> dans la présentation des résultats d'un projet Data Science. Que doit-elle contenir ?</p>",
          "reponse": "<p>La <strong>synthèse exécutive</strong> est un résumé concis des résultats clés et des recommandations, destiné aux décideurs non techniques. Elle est essentielle car elle permet de capter rapidement l'attention des parties prenantes et de les convaincre de la valeur du projet.</p><p>Elle doit contenir : le contexte, la question Data Science, les principales conclusions, les recommandations et les prochaines étapes. 'La règle d'or est de donner la conclusion en premier, puis les preuves.'</p>"
        },
        {
          "question": "<p><strong>1.3 (2 pts)</strong> Identifiez et décrivez brièvement les quatre grandes phases d'un projet Data Science selon la méthodologie CRISP-DM.</p>",
          "reponse": "<p>Les quatre grandes phases de la méthodologie <strong>CRISP-DM</strong> sont :</p><ul><li><strong>Business Understanding :</strong> Comprendre les objectifs du projet et les besoins du client.</li><li><strong>Data Understanding :</strong> Collecter et explorer les données disponibles.</li><li><strong>Data Preparation :</strong> Nettoyer, transformer et préparer les données pour la modélisation.</li><li><strong>Modeling :</strong> Construire et entraîner les modèles prédictifs.</li></ul><p>Ces phases sont itératives, ce qui signifie qu'on peut revenir en arrière pour améliorer les étapes précédentes. [citation:1]</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Étude de Cas - Application Mobile (8 pts)",
      "points": "8 pts",
      "enonce": "<p>Vous êtes Data Scientist pour la start-up camerounaise <strong>\"AgriTech Cameroon\"</strong>. L'entreprise développe une application mobile pour aider les agriculteurs à <strong>prédire le rendement de leurs récoltes</strong> de maïs en fonction des conditions météorologiques et des pratiques culturales.</p>",
      "questions": [
        {
          "question": "<p><strong>2.1 (2 pts)</strong> Formulez une question Data Science claire et précise pour guider le développement de cette application.</p>",
          "reponse": "<p>Une question Data Science appropriée serait : <strong>'À partir des données historiques de rendement, des données météo (pluviométrie, température) et des données d'utilisation d'engrais, peut-on prédire le rendement en maïs (en tonnes/hectare) pour une saison à venir dans les régions du Centre et de l'Ouest Cameroun ?'</strong></p>"
        },
        {
          "question": "<p><strong>2.2 (3 pts)</strong> Identifiez les sources de données que vous utiliserez pour ce projet. Distinguez les sources internes et externes.</p>",
          "reponse": "<p><strong>Sources internes :</strong> Données collectées par l'application auprès des agriculteurs (rendement passé, quantité d'engrais utilisée, type de semence, date de semis, zone de culture).</p><p><strong>Sources externes :</strong> Données météorologiques (pluviométrie, température, humidité) provenant de l'<strong>ASECNA</strong> ou d'API comme OpenWeatherMap. [citation:1]</p>"
        },
        {
          "question": "<p><strong>2.3 (3 pts)</strong> Décrivez comment vous présenteriez les résultats de votre modèle aux agriculteurs et aux investisseurs. Quels seraient les éléments clés de votre présentation ?</p>",
          "reponse": "<p>La présentation doit être adaptée à deux publics différents :</p><p><strong>Pour les agriculteurs :</strong> Présentation simple avec des visuels clairs (graphiques, cartes). Mettre l'accent sur l'impact pratique : 'Grâce à cette application, vous pouvez anticiper une baisse de rendement de 20% en cas de sécheresse et adapter vos pratiques.' Utiliser un langage non technique.</p><p><strong>Pour les investisseurs :</strong> Mettre l'accent sur l'impact business : 'Notre modèle permet de réduire les pertes post-récolte de 15%, ce qui se traduit par une augmentation de revenus de X millions de FCFA.' Inclure une synthèse exécutive avec les recommandations. [citation:1]</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Mise en Pratique - Analyse et Visualisation (6 pts)",
      "points": "6 pts",
      "enonce": "<p>Vous travaillez sur un projet d'analyse des performances académiques des étudiants de l'Université de Yaoundé 1. Vous disposez d'un échantillon de données contenant les informations suivantes :</p><ul><li><strong>Moyenne_Générale</strong> (sur 20)</li><li><strong>Heures_Étude</strong> (par semaine)</li><li><strong>Présence_Cours</strong> (en %)</li><li><strong>Filière</strong> (Maths, Informatique, Lettres, Droit)</li><li><strong>Bourse</strong> (Oui/Non)</li><li><strong>Genre</strong> (M/F)</li></ul><p>Vous souhaitez déterminer les facteurs qui influencent le plus la <strong>Moyenne_Générale</strong>.</p>",
      "questions": [
        {
          "question": "<p><strong>3.1 (2 pts)</strong> Proposez une méthode pour analyser la relation entre la variable <strong>Moyenne_Générale</strong> et la variable <strong>Heures_Étude</strong>. Quelle visualisation utiliseriez-vous et pourquoi ?</p>",
          "reponse": "<p>Pour analyser la relation entre deux variables quantitatives (Moyenne_Générale et Heures_Étude), la méthode la plus appropriée est de créer un <strong>nuage de points (scatter plot)</strong>.</p><p>Cette visualisation permet d'observer la direction, la force et la forme de la relation (linéaire ou non). On peut également calculer le <strong>coefficient de corrélation</strong> pour quantifier la force de la relation. [citation:1]</p>"
        },
        {
          "question": "<p><strong>3.2 (2 pts)</strong> Vous soupçonnez que la variable <strong>Filière</strong> influence la <strong>Moyenne_Générale</strong>. Quelle visualisation utiliseriez-vous pour comparer les distributions de la moyenne selon la filière ?</p>",
          "reponse": "<p>Pour comparer la distribution d'une variable quantitative (Moyenne_Générale) selon plusieurs catégories (Filière), la visualisation la plus adaptée est la <strong>boîte à moustaches (boxplot)</strong>.</p><p>Le boxplot permet de visualiser la médiane, les quartiles et les valeurs aberrantes de chaque groupe, ce qui facilite la comparaison des tendances centrales et de la dispersion entre les filières. [citation:1]</p>"
        },
        {
          "question": "<p><strong>3.3 (2 pts)</strong> Imaginez que votre modèle de régression linéaire donne un <strong>R² de 0.65</strong>. Interprétez ce résultat pour un responsable académique.</p>",
          "reponse": "<p>Un <strong>R² de 0.65</strong> signifie que le modèle explique <strong>65% de la variabilité</strong> des notes des étudiants.</p><p>Pour un responsable académique, cela signifie que les variables choisies (heures d'étude, présence, filière, etc.) capturent une grande partie des différences de performance entre les étudiants. Cependant, 35% de la variabilité reste inexpliquée, ce qui suggère que d'autres facteurs (qualité de l'enseignement, conditions de vie, motivation personnelle) jouent également un rôle important.</p>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
