<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Introduction à la Data Science - L1",
  "classe": "Licence 1 Data Science",
  "sequence": "Séquence 1",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Définition et émergence de la Data Science",
      "points": "4 pts",
      "enonce": "<div style='font-size:1em; line-height:1.6;'><p>La Data Science est un domaine en pleine expansion qui se situe à l'intersection de plusieurs disciplines.</p><p><strong>Question 1 :</strong> Donnez une définition complète de la Data Science en précisant ses principaux objectifs.</p><p><strong>Question 2 :</strong> Citez et expliquez brièvement les trois grandes étapes historiques qui ont conduit à l'émergence de la Data Science.</p></div>",
      "questions": [
        {
          "question": "1) Définir la Data Science en citant ses trois piliers fondamentaux.",
          "reponse": "La Data Science est un domaine interdisciplinaire qui combine les <strong>statistiques</strong>, l'<strong>informatique</strong> et les <strong>connaissances métier</strong> pour extraire des connaissances et des insights à partir de données. Ses objectifs sont : (1) comprendre les phénomènes, (2) prédire des événements futurs, et (3) aider à la prise de décision."
        },
        {
          "question": "2) Expliquer le rôle du <strong>Big Data</strong> dans l'émergence de la Data Science.",
          "reponse": "Le Big Data a été un catalyseur majeur de l'émergence de la Data Science. L'explosion des volumes de données (volume), la diversité des formats (variété) et la vitesse de génération (vélocité) ont rendu les outils statistiques et informatiques traditionnels insuffisants. La Data Science est née de la nécessité de développer de nouvelles méthodes pour traiter, analyser et extraire de la valeur de ces données massives."
        }
      ]
    },
    {
      "titre": "Profil et compétences du Data Scientist",
      "points": "4 pts",
      "enonce": "<div style='font-size:1em; line-height:1.6;'><p>Le Data Scientist est un professionnel aux compétences multiples.</p><p><strong>Question :</strong> Décrivez le profil type d'un Data Scientist. Quelles sont ses principales compétences techniques et transversales ? Distinguez-le des rôles de Data Analyst et de Data Engineer.</p></div>",
      "questions": [
        {
          "question": "1) Citer et expliquer les <strong>trois types de compétences</strong> clés d'un Data Scientist.",
          "reponse": "Un Data Scientist doit maîtriser :<br><ul><li><strong>Les mathématiques et statistiques</strong> : probabilités, algèbre linéaire, optimisation, tests statistiques.</li><li><strong>La programmation et l'ingénierie</strong> : Python/R, SQL, manipulation de données, visualisation.</li><li><strong>Le domaine métier</strong> : compréhension du secteur d'activité, capacité à poser les bonnes questions et à traduire les résultats en actions.</li></ul>"
        },
        {
          "question": "2) Distinguer les rôles de <strong>Data Scientist</strong>, <strong>Data Analyst</strong> et <strong>Data Engineer</strong>.",
          "reponse": "<ul><li><strong>Data Analyst</strong> : analyse des données existantes pour générer des rapports et des tableaux de bord. Il répond à des questions spécifiques et communique les résultats.</li><li><strong>Data Engineer</strong> : conçoit et maintient l'infrastructure de données (pipeline de données, bases de données). Il prépare les données pour l'analyse.</li><li><strong>Data Scientist</strong> : va plus loin en utilisant des modèles prédictifs et des algorithmes avancés pour résoudre des problèmes complexes et anticiper le futur.</li></ul>"
        }
      ]
    },
    {
      "titre": "Domaines d'application de la Data Science",
      "points": "3 pts",
      "enonce": "<div style='font-size:1em; line-height:1.6;'><p>La Data Science est utilisée dans de nombreux secteurs d'activité.</p><p><strong>Question :</strong> Pour chacun des quatre secteurs suivants (Santé, Finance, E-commerce/Marketing, Transports), proposez un cas d'usage concret de la Data Science. Expliquez brièvement l'apport de la Data Science dans chaque cas.</p></div>",
      "questions": [
        {
          "question": "1) Donner un exemple d'application de la Data Science dans le secteur de la <strong>santé</strong>.",
          "reponse": "En santé, la Data Science est utilisée pour le <strong>diagnostic médical assisté par IA</strong>. Par exemple, des algorithmes de Deep Learning analysent des images médicales (radiographies, IRM) pour détecter des tumeurs ou des anomalies avec une précision parfois supérieure à celle des médecins. La Data Science permet aussi la <strong>médecine personnalisée</strong> en analysant les données génomiques pour adapter les traitements."
        },
        {
          "question": "2) Donner un exemple d'application de la Data Science dans le secteur de la <strong>finance</strong>.",
          "reponse": "En finance, la Data Science est utilisée pour la <strong>détection de fraudes</strong> et l'<strong>évaluation du risque de crédit</strong>. Les algorithmes analysent en temps réel les transactions pour repérer des comportements suspects, et les modèles de scoring crédit évaluent la solvabilité des emprunteurs en analysant de multiples variables."
        },
        {
          "question": "3) Donner un exemple d'application de la Data Science dans le secteur du <strong>marketing/e-commerce</strong>.",
          "reponse": "En marketing, la Data Science permet les <strong>systèmes de recommandation</strong> (comme ceux d'Amazon ou Netflix). Les algorithmes analysent l'historique des achats et des interactions pour proposer des produits ou contenus personnalisés. Elle est aussi utilisée pour la <strong>segmentation des clients</strong> et les campagnes marketing ciblées."
        },
        {
          "question": "4) Donner un exemple d'application de la Data Science dans le secteur des <strong>transports</strong>.",
          "reponse": "Dans les transports, la Data Science est au cœur de l'<strong>optimisation des itinéraires</strong> et des <strong>véhicules autonomes</strong>. Les données de trafic, GPS et météo sont analysées pour proposer des itinéraires optimaux. Pour les voitures autonomes, les algorithmes traitent en temps réel les données des capteurs pour prendre des décisions de conduite."
        }
      ]
    },
    {
      "titre": "Applications concrètes",
      "points": "4 pts",
      "enonce": "<div style='font-size:1em; line-height:1.6;'><p>La Data Science est aujourd'hui omniprésente dans notre quotidien, bien souvent sans que nous en ayons conscience.</p><p><strong>Question :</strong> Pour chacun des trois exemples de la vie courante suivants, identifiez le rôle de la Data Science, le type d'apprentissage mis en œuvre (supervisé, non supervisé ou renforcement) et les données potentiellement utilisées.</p></div>",
      "questions": [
        {
          "question": "1) <strong>Assistant vocal</strong> (ex: Siri, Google Assistant).",
          "reponse": "<strong>Rôle de la DS</strong> : Reconnaissance vocale et traitement du langage naturel pour comprendre et répondre aux requêtes.<br><strong>Type d'apprentissage</strong> : Supervisé (entraîné sur d'énormes corpus de textes et de discours étiquetés) et par renforcement (pour améliorer les réponses).<br><strong>Données</strong> : Enregistrements vocaux, transcriptions associées, historique des interactions."
        },
        {
          "question": "2) <strong>Réseau social</strong> (ex: Facebook, TikTok).",
          "reponse": "<strong>Rôle de la DS</strong> : Personnalisation du fil d'actualité (algorithme de recommandation), modération de contenu, ciblage publicitaire.<br><strong>Type d'apprentissage</strong> : Supervisé (classification des contenus) et non supervisé (clustering des utilisateurs pour le ciblage, analyse des communautés).<br><strong>Données</strong> : Interactions des utilisateurs (like, partage, temps de visionnage), données de profil, contenu publié."
        },
        {
          "question": "3) <strong>Moteur de recherche</strong> (ex: Google Search).",
          "reponse": "<strong>Rôle de la DS</strong> : Classer les pages web par pertinence pour répondre à une requête.<br><strong>Type d'apprentissage</strong> : Supervisé (entraîné sur des millions de requêtes et de pages pertinentes évaluées par des humains).<br><strong>Données</strong> : Historique des recherches, pages web indexées, liens entre pages (PageRank), clics des utilisateurs sur les résultats."
        }
      ]
    },
    {
      "titre": "Le Cycle de Vie d'un Projet Data Science",
      "points": "5 pts",
      "enonce": "<div style='font-size:1em; line-height:1.6;'><p>Un projet Data Science suit généralement une méthodologie structurée comme le modèle <strong>CRISP-DM</strong> (Cross-Industry Standard Process for Data Mining).</p><p><strong>Question :</strong> Décrivez les 6 phases du modèle CRISP-DM. Pour chaque phase, précisez son objectif et une ou deux activités clés réalisées.</p></div>",
      "questions": [
        {
          "question": "1) Présenter les 6 phases de la méthodologie <strong>CRISP-DM</strong>.",
          "reponse": "<strong>1. Business Understanding :</strong> Comprendre le problème métier, définir les objectifs du projet et les critères de succès. Activités : identifier les parties prenantes, définir la question Data Science.<br><strong>2. Data Understanding :</strong> Collecter et explorer les données disponibles pour en comprendre la structure et la qualité. Activités : collecte de données, statistiques descriptives, visualisations.<br><strong>3. Data Preparation :</strong> Nettoyer, transformer et préparer les données pour la modélisation. Activités : gestion des valeurs manquantes, encodage, standardisation.<br><strong>4. Modeling :</strong> Sélectionner, entraîner et paramétrer des modèles. Activités : choix de l'algorithme, entraînement sur les données préparées, optimisation.<br><strong>5. Evaluation :</strong> Évaluer les performances du modèle et vérifier qu'il répond aux objectifs métier. Activités : calcul des métriques, analyse des erreurs.<br><strong>6. Deployment :</strong> Déployer le modèle en production, l'intégrer dans les processus métier. Activités : déploiement technique, rédaction d'un rapport final, suivi des performances."
        },
        {
          "question": "2) Pourquoi le cycle CRISP-DM est-il qualifié d'<strong>itératif</strong> ?",
          "reponse": "Le cycle CRISP-DM est itératif car les phases ne sont pas exécutées de manière purement séquentielle. On peut revenir en arrière à tout moment. Par exemple : les résultats du modèle (Modeling) peuvent révéler la nécessité de retourner à la préparation des données (Data Preparation) pour améliorer la qualité. De même, une évaluation (Evaluation) peut amener à reformuler la question de départ (Business Understanding). Cette itérativité permet d'affiner progressivement la solution."
        }
      ]
    },
    {
      "titre": "Les Acteurs d'un Projet Data Science",
      "points": "4 pts",
      "enonce": "<div style='font-size:1em; line-height:1.6;'><p>Un projet Data Science réussi repose sur une collaboration efficace entre différents acteurs aux compétences complémentaires.</p><p><strong>Question :</strong> Pour les rôles suivants (Sponsor, Product Owner, Data Scientist, Data Engineer), décrivez leurs principales responsabilités dans un projet Data Science.</p></div>",
      "questions": [
        {
          "question": "1) Décrire le rôle du <strong>Sponsor</strong> dans un projet Data Science.",
          "reponse": "Le Sponsor est le <strong>commanditaire</strong> du projet. Il est généralement un membre de la direction qui a une vision stratégique. Son rôle est de :<br><ul><li>Définir les objectifs métier et le périmètre du projet</li><li>Allouer les ressources (budget, personnes, données) nécessaires</li><li>Prendre les décisions clés et arbitrer les conflits</li><li>Être le garant du retour sur investissement du projet</li></ul>"
        },
        {
          "question": "2) Décrire le rôle du <strong>Product Owner</strong> dans un projet Data Science.",
          "reponse": "Le Product Owner est le <strong>représentant des utilisateurs</strong> et le garant de la valeur délivrée. Il est le chef d'orchestre du projet côté métier. Son rôle est de :<br><ul><li>Définir et prioriser les fonctionnalités et les livrables</li><li>Traduire les besoins métier en spécifications techniques pour l'équipe Data</li><li>Valider les livraisons (modèles, analyses) par rapport aux attentes métier</li><li>Être l'interface entre l'équipe Data et les parties prenantes métier</li></ul>"
        },
        {
          "question": "3) Décrire le rôle du <strong>Data Scientist</strong> dans un projet Data Science.",
          "reponse": "Le Data Scientist est le <strong>spécialiste de l'analyse et de la modélisation</strong> des données. Son rôle est de :<br><ul><li>Explorer et analyser les données pour en extraire des insights</li><li>Construire, entraîner et optimiser les modèles prédictifs</li><li>Interpréter les résultats des modèles et les présenter de manière compréhensible</li><li>Travailler en étroite collaboration avec le Data Engineer pour accéder aux données et avec le Product Owner pour répondre aux besoins métier</li></ul>"
        },
        {
          "question": "4) Décrire le rôle du <strong>Data Engineer</strong> dans un projet Data Science.",
          "reponse": "Le Data Engineer est le <strong>spécialiste de l'infrastructure de données</strong>. Il construit et maintient les pipelines de données. Son rôle est de :<br><ul><li>Collecter, nettoyer et transformer les données pour les rendre exploitables par les Data Scientists</li><li>Mettre en place et administrer les bases de données (data warehouses, data lakes)</li><li>Assurer la qualité, la fiabilité et la sécurité des données</li><li>Optimiser les performances des systèmes de traitement des données</li></ul>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
