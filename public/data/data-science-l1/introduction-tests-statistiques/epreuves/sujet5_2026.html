<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
 "matiere": "Introduction aux Tests Statistiques - L1",
 "classe": "Licence 1 Data Science",
 "sequence": "Séquence 5",
 "anneeScolaire": "2025-2026",
 "exercices": [
   {
     "titre": "Exercice 1 : Test d'ajustement du Chi-deux (4 pts)",
     "points": "4 pts",
     "enonce": "<div style='font-family: sans-serif; padding: 10px;'><p>Un fabricant de dés affirme que ses dés sont équilibrés. Pour vérifier cette affirmation, on lance un dé 120 fois. Les résultats sont les suivants :</p><div style='background: #f4f4f4; padding: 10px; border-radius: 5px; overflow-x: auto;'><table style='border-collapse: collapse; width: 100%;'><tr><th style='border: 1px solid #ddd; padding: 8px;'>Face</th><td style='border: 1px solid #ddd; padding: 8px;'>1</td><td style='border: 1px solid #ddd; padding: 8px;'>2</td><td style='border: 1px solid #ddd; padding: 8px;'>3</td><td style='border: 1px solid #ddd; padding: 8px;'>4</td><td style='border: 1px solid #ddd; padding: 8px;'>5</td><td style='border: 1px solid #ddd; padding: 8px;'>6</td></tr><tr><th style='border: 1px solid #ddd; padding: 8px;'>Effectif observé</th><td style='border: 1px solid #ddd; padding: 8px;'>25</td><td style='border: 1px solid #ddd; padding: 8px;'>18</td><td style='border: 1px solid #ddd; padding: 8px;'>22</td><td style='border: 1px solid #ddd; padding: 8px;'>20</td><td style='border: 1px solid #ddd; padding: 8px;'>19</td><td style='border: 1px solid #ddd; padding: 8px;'>16</td></tr></table></div><p>On souhaite tester si le dé est équilibré.</p></div>",
     "questions": [
       {
         "question": "1) Formuler l'hypothèse nulle \\(H_0\\) et l'hypothèse alternative \\(H_1\\).",
         "reponse": "H₀ : Le dé est équilibré (les probabilités d'obtenir chaque face sont égales à 1/6).\nH₁ : Le dé n'est pas équilibré (au moins une probabilité est différente de 1/6)."
       },
       {
         "question": "2) Calculer les effectifs théoriques pour chaque face sous H₀.",
         "reponse": "Si le dé est équilibré, chaque face a une probabilité de 1/6. Pour 120 lancers, l'effectif théorique est 120 × (1/6) = 20 pour chaque face."
       },
       {
         "question": "3) Calculer la statistique du \\(\\chi^2\\) en utilisant la formule \\(\\chi^2 = \\sum \\frac{(O - E)^2}{E}\\).",
         "reponse": "Les contributions sont :\n- Face 1 : (25-20)²/20 = 25/20 = 1.25\n- Face 2 : (18-20)²/20 = 4/20 = 0.2\n- Face 3 : (22-20)²/20 = 4/20 = 0.2\n- Face 4 : (20-20)²/20 = 0\n- Face 5 : (19-20)²/20 = 1/20 = 0.05\n- Face 6 : (16-20)²/20 = 16/20 = 0.8\n\n\\(\\chi^2 = 1.25 + 0.2 + 0.2 + 0 + 0.05 + 0.8 = 2.5\\)"
       },
       {
         "question": "4) Déterminer les degrés de liberté et conclure au seuil \\(\\alpha = 5\\%\\) sachant que la valeur critique pour \\(\\chi^2\\) à 5 ddl est 11.07.",
         "reponse": "ddl = 6 - 1 = 5.\nLa statistique calculée (2.5) est inférieure à la valeur critique (11.07), donc on ne rejette pas H₀. On ne peut pas conclure que le dé est déséquilibré."
       }
     ]
   },
   {
     "titre": "Exercice 2 : Test d'indépendance du Chi-deux (6 pts)",
     "points": "6 pts",
     "enonce": "<div style='font-family: sans-serif; padding: 10px;'><p>Une enquête est menée pour déterminer s'il existe un lien entre le <strong>sexe</strong> (Homme/Femme) et la <strong>préférence pour un sport</strong> (Football/Basketball/Tennis). Les résultats sont :</p><div style='background: #f4f4f4; padding: 10px; border-radius: 5px; overflow-x: auto;'><table style='border-collapse: collapse; width: 100%;'><tr><th style='border: 1px solid #ddd; padding: 8px;'></th><th style='border: 1px solid #ddd; padding: 8px;'>Football</th><th style='border: 1px solid #ddd; padding: 8px;'>Basketball</th><th style='border: 1px solid #ddd; padding: 8px;'>Tennis</th><th style='border: 1px solid #ddd; padding: 8px;'>Total</th></tr><tr><td style='border: 1px solid #ddd; padding: 8px;'>Homme</td><td style='border: 1px solid #ddd; padding: 8px;'>50</td><td style='border: 1px solid #ddd; padding: 8px;'>30</td><td style='border: 1px solid #ddd; padding: 8px;'>20</td><td style='border: 1px solid #ddd; padding: 8px;'>100</td></tr><tr><td style='border: 1px solid #ddd; padding: 8px;'>Femme</td><td style='border: 1px solid #ddd; padding: 8px;'>30</td><td style='border: 1px solid #ddd; padding: 8px;'>40</td><td style='border: 1px solid #ddd; padding: 8px;'>30</td><td style='border: 1px solid #ddd; padding: 8px;'>100</td></tr><tr><td style='border: 1px solid #ddd; padding: 8px;'>Total</td><td style='border: 1px solid #ddd; padding: 8px;'>80</td><td style='border: 1px solid #ddd; padding: 8px;'>70</td><td style='border: 1px solid #ddd; padding: 8px;'>50</td><td style='border: 1px solid #ddd; padding: 8px;'>200</td></tr></table></div></div>",
     "questions": [
       {
         "question": "1) Formuler les hypothèses du test d'indépendance.",
         "reponse": "H₀ : Le sexe et la préférence sportive sont indépendants.\nH₁ : Le sexe et la préférence sportive ne sont pas indépendants."
       },
       {
         "question": "2) Calculer les effectifs théoriques pour les cases (Homme, Football) et (Femme, Tennis).",
         "reponse": "E(Homme, Football) = (Total ligne × Total colonne) / Total général = (100 × 80) / 200 = 40.\nE(Femme, Tennis) = (100 × 50) / 200 = 25."
       },
       {
         "question": "3) Calculer la statistique du \\(\\chi^2\\) sachant que les contributions sont : 2.5, 0.714, 1.0, 2.5, 0.714, 1.0.",
         "reponse": "\\(\\chi^2 = 2.5 + 0.714 + 1.0 + 2.5 + 0.714 + 1.0 = 8.428\\)."
       },
       {
         "question": "4) Déterminer les degrés de liberté et conclure au seuil \\(\\alpha = 5\\%\\) sachant que la valeur critique pour 2 ddl est 5.99.",
         "reponse": "ddl = (2 - 1) × (3 - 1) = 2.\nLa statistique calculée (8.43) est supérieure à la valeur critique (5.99), donc on rejette H₀. Il existe une association significative entre le sexe et la préférence sportive."
       }
     ]
   },
   {
     "titre": "Exercice 3 : Mesures d'association (5 pts)",
     "points": "5 pts",
     "enonce": "<div style='font-family: sans-serif; padding: 10px;'><p>Dans le cadre d'une étude sur la relation entre la <strong>catégorie socio-professionnelle</strong> (Ouvrier, Employé, Cadre) et la <strong>préférence pour un parti politique</strong> (Parti A, Parti B, Parti C), on a réalisé un test du \\(\\chi^2\\) d'indépendance.</p><p>Les résultats du test sont : \\(\\chi^2 = 18.5\\), ddl = 4, p-value = 0.001, n = 500.</p></div>",
     "questions": [
       {
         "question": "1) Que peut-on conclure sur la relation entre les deux variables ?",
         "reponse": "La p-value (0.001) est inférieure au seuil de 5%. On rejette donc l'hypothèse d'indépendance. Il existe une relation significative entre la catégorie socio-professionnelle et la préférence politique."
       },
       {
         "question": "2) Calculer le V de Cramer pour mesurer la force de l'association.",
         "reponse": "Le V de Cramer est donné par \\( V = \\sqrt{\\chi^2 / (n \\times \\min(r-1, c-1))} \\). Ici, min(r-1, c-1) = min(2, 2) = 2.\n\\( V = \\sqrt{18.5 / (500 \\times 2)} = \\sqrt{18.5 / 1000} = \\sqrt{0.0185} \\approx 0.136 \\).\nLa valeur est faible, l'association est significative mais pas très forte."
       },
       {
         "question": "3) Interpréter cette valeur de V de Cramer.",
         "reponse": "Un V de Cramer de 0.136 indique une association faible entre les deux variables. Bien que la relation soit statistiquement significative (p-value faible), la force de cette association est limitée."
       }
     ]
   }
 ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
