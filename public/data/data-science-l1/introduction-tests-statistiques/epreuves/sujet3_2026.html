<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Introduction aux Tests Statistiques - L1",
  "classe": "Licence 1 Data Science",
  "sequence": "Sequence 3",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Tests non paramétriques et validation de modèles (6 pts)",
      "points": "6 pts",
      "enonce": "<p style='font-size: 1.05em;'>Une start-up camerounaise spécialisée dans l'analyse des données agricoles souhaite évaluer l'impact d'une nouvelle méthode de fertilisation sur le rendement du maïs dans la région de l'Ouest. Elle dispose des données de rendement (en tonnes/hectare) de 30 parcelles avant et après l'application de la méthode. Les données avant la méthode ne suivent pas une distribution normale (test de Shapiro-Wilk, p-value = 0.02).</p>",
      "questions": [
        {
          "question": "1) Justifier l'utilisation du test de Wilcoxon pour échantillons appariés plutôt que le test t de Student apparié. (1 pt)",
          "reponse": "<p>Le test de Wilcoxon pour échantillons appariés est préféré car il s'agit d'un test non paramétrique qui ne suppose pas la normalité des données. La condition d'application du test t de Student apparié (normalité des différences) n'est pas vérifiée (p-value du test de Shapiro-Wilk = 0.02 < 0.05). Le test de Wilcoxon est donc plus robuste et approprié pour ces données.</p>"
        },
        {
          "question": "2) Formuler les hypothèses H0 et H1 du test de Wilcoxon pour cette étude. (1 pt)",
          "reponse": "<p>H0 : La médiane des différences de rendement (après - avant) est nulle (le traitement n'a pas d'effet).</p><p>H1 : La médiane des différences de rendement (après - avant) est différente de 0 (le traitement a un effet, test bilatéral).</p>"
        },
        {
          "question": "3) Les différences de rendement (après - avant) pour les 5 premières parcelles sont : +1.2, -0.5, +2.1, +0.8, +1.5. Calculer la statistique de Wilcoxon W (somme des rangs des différences positives) pour ces 5 observations. (2 pts)",
          "reponse": "<p>Étape 1 : Calcul des différences absolues : 1.2, 0.5, 2.1, 0.8, 1.5</p><p>Étape 2 : Attribution des rangs (ordre croissant) : 0.5 (rang 1), 0.8 (rang 2), 1.2 (rang 3), 1.5 (rang 4), 2.1 (rang 5)</p><p>Étape 3 : Somme des rangs pour les différences positives : +1.2 (rang 3), +2.1 (rang 5), +0.8 (rang 2), +1.5 (rang 4) → W₊ = 3 + 5 + 2 + 4 = 14</p><p>La statistique de test W = min(W₊, W₋) = min(14, 1) = <strong>1</strong> (la différence négative -0.5 a le rang 1).</p>"
        },
        {
          "question": "4) La start-up souhaite également construire un modèle de régression linéaire pour prédire le rendement en fonction de plusieurs variables. Citer deux tests statistiques qu'elle pourrait utiliser pour valider son modèle et expliquer brièvement ce que chacun vérifie. (2 pts)",
          "reponse": "<p><strong>1. Test de Shapiro-Wilk :</strong> Il vérifie la normalité des résidus. L'hypothèse nulle est que les résidus sont normalement distribués. Une p-value > 0.05 indique que la normalité est acceptable.</p><p><strong>2. Test de Breusch-Pagan :</strong> Il vérifie l'homoscédasticité des résidus (variance constante). L'hypothèse nulle est que les résidus sont homoscédastiques. Une p-value > 0.05 indique une variance acceptable.</p><p><strong>3. Test de Durbin-Watson :</strong> Il vérifie l'absence d'autocorrélation des résidus. Une statistique proche de 2 indique une absence d'autocorrélation.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Tests du Chi-deux et mesures d'association (7 pts)",
      "points": "7 pts",
      "enonce": "<p style='font-size: 1.05em;'>Dans le cadre d'une étude sur les habitudes alimentaires à Douala, un chercheur a collecté des données sur la préférence pour deux types de boissons (Thé ou Café) en fonction du sexe des participants (Homme ou Femme). Les résultats sont présentés dans le tableau de contingence suivant :</p><div style='overflow-x: auto; margin: 15px 0;'><table style='width: 100%; border-collapse: collapse; font-size: 1em;'><tr style='background-color: #2c3e50; color: white;'><th style='padding: 8px; border: 1px solid #ddd;'></th><th style='padding: 8px; border: 1px solid #ddd;'>Thé</th><th style='padding: 8px; border: 1px solid #ddd;'>Café</th><th style='padding: 8px; border: 1px solid #ddd;'>Total</th></tr><tr><td style='padding: 8px; border: 1px solid #ddd;'>Homme</td><td style='padding: 8px; border: 1px solid #ddd;'>25</td><td style='padding: 8px; border: 1px solid #ddd;'>45</td><td style='padding: 8px; border: 1px solid #ddd;'>70</td></tr><tr><td style='padding: 8px; border: 1px solid #ddd;'>Femme</td><td style='padding: 8px; border: 1px solid #ddd;'>35</td><td style='padding: 8px; border: 1px solid #ddd;'>25</td><td style='padding: 8px; border: 1px solid #ddd;'>60</td></tr><tr><td style='padding: 8px; border: 1px solid #ddd;'>Total</td><td style='padding: 8px; border: 1px solid #ddd;'>60</td><td style='padding: 8px; border: 1px solid #ddd;'>70</td><td style='padding: 8px; border: 1px solid #ddd;'>130</td></tr></table></div>",
      "questions": [
        {
          "question": "1) Formuler les hypothèses H0 et H1 pour le test du χ² d'indépendance. (1 pt)",
          "reponse": "<p>H0 : Le sexe et la préférence pour la boisson sont indépendants.</p><p>H1 : Le sexe et la préférence pour la boisson ne sont pas indépendants (il existe une association).</p>"
        },
        {
          "question": "2) Calculer les effectifs théoriques sous H0 pour chaque cellule du tableau. (1.5 pts)",
          "reponse": "<p>Pour chaque cellule, l'effectif théorique est : (Total ligne × Total colonne) / Total général.</p><p>• Homme × Thé : (70 × 60) / 130 = 4200 / 130 ≈ <strong>32.31</strong></p><p>• Homme × Café : (70 × 70) / 130 = 4900 / 130 ≈ <strong>37.69</strong></p><p>• Femme × Thé : (60 × 60) / 130 = 3600 / 130 ≈ <strong>27.69</strong></p><p>• Femme × Café : (60 × 70) / 130 = 4200 / 130 ≈ <strong>32.31</strong></p>"
        },
        {
          "question": "3) La statistique du χ² calculée est χ² = 6.78. Déterminer les degrés de liberté et conclure au seuil α = 5% (valeur critique pour ddl = 1 : 3.84). (1.5 pts)",
          "reponse": "<p>Degrés de liberté : ddl = (lignes - 1) × (colonnes - 1) = (2 - 1) × (2 - 1) = <strong>1</strong>.</p><p>χ² = 6.78 > 3.84, la statistique de test tombe dans la région de rejet.</p><p>On rejette H0 au seuil de 5%. Il existe une association significative entre le sexe et la préférence pour la boisson.</p>"
        },
        {
          "question": "4) Calculer le V de Cramer et interpréter la force de l'association. (2 pts)",
          "reponse": "<p>V = √(χ² / (n × min(k-1, r-1))) = √(6.78 / (130 × 1)) = √(6.78 / 130) = √0.05215 ≈ <strong>0.228</strong>.</p><p>Le V de Cramer est de 0.228, ce qui indique une association <strong>faible</strong> entre le sexe et la préférence pour la boisson. Bien que l'association soit statistiquement significative (χ² significatif), sa force est modeste.</p>"
        },
        {
          "question": "5) Le chercheur souhaite maintenant comparer la proportion d'hommes préférant le café à celle des femmes. Proposer un test approprié et énoncer les conditions d'application. (1 pt)",
          "reponse": "<p>Le test approprié est le <strong>test de comparaison de deux proportions</strong> (test Z).</p><p>Conditions d'application :</p><ul><li>Les échantillons sont indépendants.</li><li>Les effectifs sont suffisants : n₁ × p̂₁ ≥ 5, n₁ × (1-p̂₁) ≥ 5, n₂ × p̂₂ ≥ 5, n₂ × (1-p̂₂) ≥ 5.</li></ul><p>Ici, p̂₁ = 45/70 = 0.643, p̂₂ = 25/60 = 0.417. Les conditions sont vérifiées.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Tests paramétriques usuels (7 pts)",
      "points": "7 pts",
      "enonce": "<p style='font-size: 1.05em;'>Une entreprise de transport à Yaoundé souhaite comparer l'efficacité de deux types de carburants (A et B) sur la consommation moyenne de ses véhicules. Un échantillon aléatoire de 15 véhicules utilisant le carburant A a une consommation moyenne de 8.2 L/100 km avec un écart-type de 1.4 L/100 km. Un échantillon de 12 véhicules utilisant le carburant B a une consommation moyenne de 7.5 L/100 km avec un écart-type de 1.1 L/100 km. On suppose que les deux échantillons sont indépendants et que les variances sont égales.</p>",
      "questions": [
        {
          "question": "1) Formuler les hypothèses H0 et H1 pour comparer les deux moyennes. (1 pt)",
          "reponse": "<p>H0 : μA = μB (les consommations moyennes sont égales).</p><p>H1 : μA ≠ μB (les consommations moyennes sont différentes) — test bilatéral.</p>"
        },
        {
          "question": "2) Calculer l'écart-type poolé sp. (2 pts)",
          "reponse": "<p>s_p = √(((n₁-1)s₁² + (n₂-1)s₂²) / (n₁ + n₂ - 2))</p><p>s_p = √(((15-1)×1.4² + (12-1)×1.1²) / (15 + 12 - 2))</p><p>s_p = √((14×1.96 + 11×1.21) / 25) = √((27.44 + 13.31) / 25) = √(40.75 / 25) = √1.63 ≈ <strong>1.277</strong></p>"
        },
        {
          "question": "3) Calculer la statistique de test t. (2 pts)",
          "reponse": "<p>t = (x̄₁ - x̄₂) / (s_p × √(1/n₁ + 1/n₂))</p><p>t = (8.2 - 7.5) / (1.277 × √(1/15 + 1/12))</p><p>t = 0.7 / (1.277 × √(0.0667 + 0.0833)) = 0.7 / (1.277 × √0.15) = 0.7 / (1.277 × 0.3873) = 0.7 / 0.4946 ≈ <strong>1.415</strong></p>"
        },
        {
          "question": "4) Avec 25 degrés de liberté, la valeur critique bilatérale au seuil α = 5% est t_critique = 2.060. Conclure. (1 pt)",
          "reponse": "<p>|t| = 1.415 < t_critique = 2.060, donc la statistique de test n'est pas dans la région de rejet.</p><p>On ne rejette pas H0 au seuil de 5%. Il n'y a pas de différence significative entre les consommations moyennes des deux carburants.</p>"
        },
        {
          "question": "5) L'entreprise souhaite maintenant tester si la consommation moyenne du carburant A est supérieure à 7.0 L/100 km. Quelle serait l'hypothèse alternative H1 pour ce test unilatéral ? (1 pt)",
          "reponse": "<p>Pour un test unilatéral à droite, l'hypothèse alternative serait :</p><p>H1 : μA > 7.0 (la consommation moyenne du carburant A est supérieure à 7.0 L/100 km).</p>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
