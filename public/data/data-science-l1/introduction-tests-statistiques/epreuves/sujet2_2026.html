<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Introduction aux Tests Statistiques - L1",
  "classe": "Licence 1 Data Science",
  "sequence": "Séquence 2",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Questions de Cours sur les Tests Paramétriques et Non Paramétriques",
      "points": "6 pts",
      "enonce": "<div style='font-size: 1em; line-height: 1.6; color: #333;'>Cet exercice porte sur les notions fondamentales des tests paramétriques (comparaisons de moyennes et proportions) et non paramétriques abordées dans les chapitres 3 et 4.</div>",
      "questions": [
        {
          "question": "<div style='margin-bottom: 1em;'>1) <strong>Expliquez</strong> la différence fondamentale entre un test paramétrique et un test non paramétrique. <strong>Citez</strong> un exemple pour chaque catégorie.</div>",
          "reponse": "<div style='color: #2c3e50;'>Les <strong>tests paramétriques</strong> reposent sur des hypothèses fortes concernant la distribution des données (ex: normalité, homoscédasticité). Ils estiment les paramètres de la population. Exemple : le test t de Student pour comparer deux moyennes.<br>Les <strong>tests non paramétriques</strong> ne font pas d'hypothèses sur la distribution des données. Ils sont basés sur les rangs ou les signes. Exemple : le test de Mann-Whitney pour comparer deux échantillons indépendants.</div>"
        },
        {
          "question": "<div style='margin-bottom: 1em;'>2) <strong>Décrivez</strong> les conditions d'application du test t de Student pour deux échantillons indépendants. Que faire si ces conditions ne sont pas respectées ?</div>",
          "reponse": "<div style='color: #2c3e50;'>Les conditions sont : <br>- Indépendance des échantillons <br>- Normalité des distributions dans chaque groupe (ou échantillons de taille suffisante pour invoquer le TCL) <br>- Homoscédasticité (variances égales) pour le test t classique. <br>Si ces conditions ne sont pas respectées, on peut utiliser le <strong>test de Welch</strong> (pour variances inégales) ou des <strong>tests non paramétriques</strong> comme le test de Mann-Whitney.</div>"
        },
        {
          "question": "<div style='margin-bottom: 1em;'>3) <strong>Distinguez</strong> un test sur une proportion d'un test de comparaison de deux proportions. <strong>Donnez</strong> un exemple concret pour chaque situation.</div>",
          "reponse": "<div style='color: #2c3e50;'>Le <strong>test sur une proportion</strong> compare une proportion observée à une valeur théorique. Exemple : Tester si la proportion de femmes dans une entreprise est de 50%. <br>Le <strong>test de comparaison de deux proportions</strong> compare les proportions de deux populations. Exemple : Tester si le taux de conversion diffère entre deux versions d'un site web (A/B testing).</div>"
        }
      ]
    },
    {
      "titre": "Application : Test sur une Proportion",
      "points": "4 pts",
      "enonce": "<div style='font-size: 1em; line-height: 1.6; color: #333;'>Un laboratoire pharmaceutique affirme que son nouveau médicament est efficace dans 80% des cas. Un échantillon aléatoire de 150 patients traités avec ce médicament montre une amélioration chez 108 d'entre eux. On souhaite tester l'affirmation du laboratoire au seuil \\(\\alpha = 0.05\\).</div>",
      "questions": [
        {
          "question": "<div style='margin-bottom: 1em;'>1) <strong>Formulez</strong> les hypothèses nulle et alternative pour ce test.</div>",
          "reponse": "<div style='color: #2c3e50;'><strong>H₀ :</strong> p = 0.80 (le médicament est efficace dans 80% des cas)<br><strong>H₁ :</strong> p ≠ 0.80 (l'efficacité est différente de 80%)<br><em>Il s'agit d'un test bilatéral.</em></div>"
        },
        {
          "question": "<div style='margin-bottom: 1em;'>2) <strong>Calculez</strong> la proportion observée et la statistique de test.</div>",
          "reponse": "<div style='color: #2c3e50;'>Proportion observée : \\( \\hat{p} = \\frac{108}{150} = 0.72 \\) <br>Statistique de test Z : <br>\\( Z = \\frac{\\hat{p} - p_0}{\\sqrt{\\frac{p_0(1-p_0)}{n}}} = \\frac{0.72 - 0.80}{\\sqrt{\\frac{0.80 \\times 0.20}{150}}} = \\frac{-0.08}{\\sqrt{0.0010667}} = \\frac{-0.08}{0.03266} \\approx -2.45 \\)</div>"
        },
        {
          "question": "<div style='margin-bottom: 1em;'>3) <strong>Déterminez</strong> la p-value. <strong>Concluez</strong> en interprétant le résultat.</div>",
          "reponse": "<div style='color: #2c3e50;'>Pour un test bilatéral, p-value = \\( 2 \\times P(Z < -2.45) = 2 \\times 0.0071 = 0.0142 \\). <br>La p-value (0.0142) est inférieure au seuil \\(\\alpha = 0.05\\), on <strong>rejette H₀</strong>. <br><strong>Conclusion :</strong> Il y a des preuves statistiques significatives que l'efficacité du médicament est différente de 80%.</div>"
        }
      ]
    },
    {
      "titre": "Comparaison de Deux Proportions",
      "points": "5 pts",
      "enonce": "<div style='font-size: 1em; line-height: 1.6; color: #333;'>Un site e-commerce souhaite tester l'efficacité d'une nouvelle présentation de page produit (version B) par rapport à la version actuelle (version A). <br><br>Sur 800 visiteurs de la version A, 64 ont effectué un achat. Sur 750 visiteurs de la version B, 82 ont effectué un achat. On souhaite tester si la version B est plus efficace au seuil \\(\\alpha = 0.05\\).</div>",
      "questions": [
        {
          "question": "<div style='margin-bottom: 1em;'>1) <strong>Formulez</strong> les hypothèses du test.</div>",
          "reponse": "<div style='color: #2c3e50;'><strong>H₀ :</strong> p_A = p_B (les deux versions ont le même taux de conversion)<br><strong>H₁ :</strong> p_B > p_A (la version B a un taux de conversion supérieur)<br><em>Il s'agit d'un test unilatéral à droite.</em></div>"
        },
        {
          "question": "<div style='margin-bottom: 1em;'>2) <strong>Calculez</strong> la statistique de test et la p-value.</div>",
          "reponse": "<div style='color: #2c3e50;'>Proportions observées : \\( \\hat{p}_A = \\frac{64}{800} = 0.08 \\) ; \\( \\hat{p}_B = \\frac{82}{750} \\approx 0.1093 \\) <br>Proportion combinée : \\( \\hat{p} = \\frac{64+82}{800+750} = \\frac{146}{1550} \\approx 0.0942 \\) <br>Statistique de test : <br>\\( Z = \\frac{0.1093 - 0.08}{\\sqrt{0.0942 \\times 0.9058 \\times (\\frac{1}{800} + \\frac{1}{750})}} = \\frac{0.0293}{\\sqrt{0.0853 \\times 0.002583}} = \\frac{0.0293}{\\sqrt{0.0002203}} = \\frac{0.0293}{0.01484} \\approx 1.98 \\) <br>p-value = \\( P(Z > 1.98) = 1 - 0.9761 = 0.0239 \\)</div>"
        },
        {
          "question": "<div style='margin-bottom: 1em;'>3) <strong>Concluez</strong> sur l'efficacité de la nouvelle version.</div>",
          "reponse": "<div style='color: #2c3e50;'>La p-value (0.0239) est inférieure à \\(\\alpha = 0.05\\), on <strong>rejette H₀</strong>. <br><strong>Conclusion :</strong> Il y a des preuves statistiques significatives que la version B a un taux de conversion supérieur à la version A. L'entreprise peut adopter la nouvelle version.</div>"
        }
      ]
    },
    {
      "titre": "Approfondissement : Test t de Student (Échantillons Appariés)",
      "points": "5 pts",
      "enonce": "<div style='font-size: 1em; line-height: 1.6; color: #333;'>Un chercheur souhaite évaluer l'efficacité d'un programme d'entraînement sur la performance sportive. Il mesure le temps de course (en secondes) de 12 athlètes avant et après le programme. Les données sont les suivantes : <br><br>Avant : 12.5, 13.1, 11.8, 12.9, 13.4, 12.0, 11.5, 12.7, 13.2, 12.3, 11.9, 13.0 <br>Après : 11.8, 12.5, 11.1, 12.2, 12.8, 11.5, 10.9, 12.0, 12.6, 11.7, 11.2, 12.4</div>",
      "questions": [
        {
          "question": "<div style='margin-bottom: 1em;'>1) <strong>Justifiez</strong> l'utilisation d'un test t apparié plutôt qu'un test pour échantillons indépendants.</div>",
          "reponse": "<div style='color: #2c3e50;'>Les mesures sont <strong>appariées</strong> car chaque athlète est mesuré deux fois (avant et après). Les observations ne sont pas indépendantes. Le test t apparié tient compte de cette dépendance en analysant les différences individuelles, ce qui réduit la variabilité et augmente la puissance du test.</div>"
        },
        {
          "question": "<div style='margin-bottom: 1em;'>2) <strong>Calculez</strong> les différences \\( d_i \\) et la moyenne des différences \\( \\bar{d} \\).</div>",
          "reponse": "<div style='color: #2c3e50;'>Différences (Avant - Après) : 0.7, 0.6, 0.7, 0.7, 0.6, 0.5, 0.6, 0.7, 0.6, 0.6, 0.7, 0.6 <br>Moyenne des différences : \\( \\bar{d} = \\frac{0.7+0.6+...+0.6}{12} = \\frac{7.6}{12} \\approx 0.633 \\)</div>"
        },
        {
          "question": "<div style='margin-bottom: 1em;'>3) <strong>Écart-type</strong> des différences : <span class='math inline'>\\( s_d = 0.073 \\)</span>. <strong>Calculez</strong> la statistique de test t et <strong>déterminez</strong> si la différence est significative au seuil \\(\\alpha = 0.05\\) (ddl = 11).</div>",
          "reponse": "<div style='color: #2c3e50;'>Statistique de test : \\( t = \\frac{\\bar{d}}{s_d / \\sqrt{n}} = \\frac{0.633}{0.073 / \\sqrt{12}} = \\frac{0.633}{0.0211} \\approx 30.0 \\) <br>Pour 11 degrés de liberté, la valeur critique bilatérale au seuil 0.05 est \\( t_{0.025,11} = 2.201 \\). <br>La valeur calculée (30.0) est bien supérieure à 2.201, on <strong>rejette H₀</strong>. <br><strong>Conclusion :</strong> Le programme d'entraînement a un effet significatif sur la performance (réduction du temps de course).</div>"
        }
      ]
    },
    {
      "titre": "Synthèse : Tests du Chi-deux et Non Paramétriques",
      "points": "4 pts",
      "enonce": "<div style='font-size: 1em; line-height: 1.6; color: #333;'>Cet exercice porte sur les tests du chi-deux (\\(\\chi^2\\)) et les tests non paramétriques.</div>",
      "questions": [
        {
          "question": "<div style='margin-bottom: 1em;'>1) <strong>Expliquez</strong> la différence entre le test du \\(\\chi^2\\) d'adéquation et le test du \\(\\chi^2\\) d'indépendance. Dans quel contexte utilise-t-on chacun ?</div>",
          "reponse": "<div style='color: #2c3e50;'>Le <strong>test d'adéquation</strong> compare une distribution observée à une distribution théorique (ex: vérifier si les données suivent une loi de probabilité). <br>Le <strong>test d'indépendance</strong> teste s'il existe une association entre deux variables catégorielles à partir d'un tableau de contingence.</div>"
        },
        {
          "question": "<div style='margin-bottom: 1em;'>2) <strong>Justifiez</strong> le recours à un test non paramétrique (ex: Mann-Whitney) plutôt qu'un test paramétrique (ex: t-test) dans certaines situations.</div>",
          "reponse": "<div style='color: #2c3e50;'>On utilise un test non paramétrique lorsque : <br>- La condition de normalité n'est pas respectée (données asymétriques). <br>- L'échantillon est petit. <br>- Les données sont ordinales ou les valeurs aberrantes sont présentes. <br>Les tests non paramétriques sont plus <strong>robustes</strong> mais généralement moins <strong>puissants</strong> que leurs équivalents paramétriques.</div>"
        },
        {
          "question": "<div style='margin-bottom: 1em;'>3) <strong>Interprétez</strong> le rôle du V de Cramer dans le cadre d'un test du \\(\\chi^2\\) d'indépendance.</div>",
          "reponse": "<div style='color: #2c3e50;'>Le <strong>V de Cramer</strong> mesure l'intensité de l'association entre les deux variables. Il est compris entre 0 (pas d'association) et 1 (association parfaite). Il permet d'évaluer l'importance pratique de l'association, en complément de la significativité statistique apportée par la p-value.</div>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
