<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],

                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Introduction aux Tests Statistiques - L1",
  "classe": "Licence 1 Data Science",
  "sequence": "Évaluation Séquentielle N°4",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : A/B Testing pour une Campagne Marketing (8 pts)",
      "points": "8 pts",
      "enonce": "<p>Une entreprise de télécommunications au Cameroun souhaite tester deux versions d'une offre promotionnelle envoyée par SMS. La version A est l'offre standard, la version B est une offre améliorée avec un rabais supplémentaire.</p><p>Les résultats de la campagne sont les suivants :</p><ul><li>Version A : <span style='font-weight:bold;'>n\u2081 = 400</span> clients contactés, <span style='font-weight:bold;'>x\u2081 = 48</span> souscriptions (taux = 12%)</li><li>Version B : <span style='font-weight:bold;'>n\u2082 = 400</span> clients contactés, <span style='font-weight:bold;'>x\u2082 = 68</span> souscriptions (taux = 17%)</li></ul><p>L'entreprise souhaite savoir si la version B est significativement plus performante que la version A.</p>",
      "questions": [
        {
          "question": "1) Formulez les hypothèses \\(H_0\\) et \\(H_1\\) pour ce test, en précisant s'il s'agit d'un test unilatéral ou bilatéral.",
          "reponse": "H\u2080 : \\(p_B \\le p_A\\) (la version B n'est pas meilleure que la version A)\nH\u2081 : \\(p_B > p_A\\) (la version B est meilleure que la version A)\n\nIl s'agit d'un test unilatéral à droite car l'entreprise cherche à prouver que la version B est meilleure."
        },
        {
          "question": "2) Calculez la proportion poolée \\(\\hat{p}\\) et l'écart-type de la statistique de test.",
          "reponse": "\\[\\hat{p} = \\frac{x_A + x_B}{n_A + n_B} = \\frac{48 + 68}{400 + 400} = \\frac{116}{800} = 0,145\\]\n\n\\[SE = \\sqrt{\\hat{p}(1-\\hat{p})\\left(\\frac{1}{n_A} + \\frac{1}{n_B}\\right)}\\]\n\\[SE = \\sqrt{0,145 \\times 0,855 \\times \\left(\\frac{1}{400} + \\frac{1}{400}\\right)}\\]\n\\[SE = \\sqrt{0,123975 \\times 0,005} = \\sqrt{0,000619875} \\approx 0,0249\\]"
        },
        {
          "question": "3) Calculez la statistique de test \\(Z\\) et la p-value. Utilisez \\(\\Phi(2,01) = 0,9778\\).",
          "reponse": "\\[Z = \\frac{\\hat{p}_B - \\hat{p}_A}{SE} = \\frac{0,17 - 0,12}{0,0249} = \\frac{0,05}{0,0249} \\approx 2,01\\]\n\nPour un test unilatéral à droite :\np-value = P(Z > 2,01) = 1 - \\(\\Phi(2,01)\\) = 1 - 0,9778 = 0,0222"
        },
        {
          "question": "4) Au seuil de significativité \\(\\alpha = 5\\%\\), que peut-on conclure ? Interprétez le résultat.",
          "reponse": "p-value = 0,0222 < 0,05, donc on rejette \\(H_0\\).\n\n<strong>Conclusion :</strong> Au seuil de 5%, il y a une preuve statistique que la version B est meilleure que la version A. L'entreprise devrait donc adopter la version B pour améliorer son taux de souscription."
        }
      ]
    },
    {
      "titre": "Exercice 2 : Comparaison de Modèles en Machine Learning (6 pts)",
      "points": "6 pts",
      "enonce": "<p>Un data scientist souhaite comparer les performances de deux algorithmes de classification (Algorithme 1 et Algorithme 2) sur un même jeu de données.</p><p>Les deux algorithmes sont testés sur un ensemble de validation de <span style='font-weight:bold;'>100 échantillons</span>. Les résultats sont présentés dans le tableau de contingence suivant :</p><table style='width:100%; border-collapse:collapse; margin:15px 0;'><tr style='background:#e3f2fd;'><th style='border:1px solid #ddd; padding:8px;'></th><th style='border:1px solid #ddd; padding:8px;'>Algo 2 correct</th><th style='border:1px solid #ddd; padding:8px;'>Algo 2 incorrect</th><th style='border:1px solid #ddd; padding:8px;'>Total</th></tr><tr><td style='border:1px solid #ddd; padding:8px;'><strong>Algo 1 correct</strong></td><td style='border:1px solid #ddd; padding:8px;'>70</td><td style='border:1px solid #ddd; padding:8px;'>5</td><td style='border:1px solid #ddd; padding:8px;'>75</td></tr><tr><td style='border:1px solid #ddd; padding:8px;'><strong>Algo 1 incorrect</strong></td><td style='border:1px solid #ddd; padding:8px;'>15</td><td style='border:1px solid #ddd; padding:8px;'>10</td><td style='border:1px solid #ddd; padding:8px;'>25</td></tr><tr style='background:#f5f5f5;'><td style='border:1px solid #ddd; padding:8px;'><strong>Total</strong></td><td style='border:1px solid #ddd; padding:8px;'>85</td><td style='border:1px solid #ddd; padding:8px;'>15</td><td style='border:1px solid #ddd; padding:8px;'>100</td></tr></table><p>On rappelle que le test de McNemar est utilisé pour comparer deux algorithmes sur les mêmes données.</p>",
      "questions": [
        {
          "question": "1) Calculez l'accuracy de chaque algorithme.",
          "reponse": "<strong>Algorithme 1 :</strong>\nAccuracy\u2081 = 75/100 = 0,75 (75%)\n\n<strong>Algorithme 2 :</strong>\nAccuracy\u2082 = 85/100 = 0,85 (85%)"
        },
        {
          "question": "2) Calculez la statistique du test de McNemar. La formule est : \\(\\chi^2 = \\frac{(b - c)^2}{b + c}\\), où <span style='font-weight:bold;'>b</span> est le nombre de cas où Algo 1 correct mais Algo 2 incorrect (b = 5), et <span style='font-weight:bold;'>c</span> est le nombre de cas où Algo 1 incorrect mais Algo 2 correct (c = 15).",
          "reponse": "\\[\\chi^2 = \\frac{(b - c)^2}{b + c} = \\frac{(5 - 15)^2}{5 + 15} = \\frac{(-10)^2}{20} = \\frac{100}{20} = 5\\]"
        },
        {
          "question": "3) Avec 1 degré de liberté, la valeur critique du \\(\\chi^2\\) au seuil de 5% est 3,84. Que pouvez-vous conclure sur la comparaison des deux algorithmes ?",
          "reponse": "La statistique \\(\\chi^2 = 5\\) est supérieure à la valeur critique 3,84. On rejette donc l'hypothèse nulle d'égalité des performances.\n\n<strong>Conclusion :</strong> Il existe une différence significative entre les deux algorithmes au seuil de 5%. L'Algorithme 2 (85% d'accuracy) est significativement meilleur que l'Algorithme 1 (75% d'accuracy)."
        }
      ]
    },
    {
      "titre": "Exercice 3 : Validation d'un Modèle de Régression (8 pts)",
      "points": "8 pts",
      "enonce": "<p>Vous avez ajusté un modèle de régression linéaire pour prédire les ventes d'une entreprise en fonction des dépenses publicitaires. Les diagnostics du modèle sont les suivants :</p><ul><li>Coefficient des dépenses publicitaires : \\(\\hat{\\beta} = 2,5\\) avec une erreur standard de 0,8</li><li>Test de Shapiro-Wilk sur les résidus : p-value = 0,04</li><li>Test de Breusch-Pagan : p-value = 0,12</li><li>Test de Durbin-Watson : statistique = 1,2</li></ul><p>Les données ont été collectées sur 12 mois (série temporelle).</p>",
      "questions": [
        {
          "question": "1) Testez la significativité du coefficient des dépenses publicitaires au seuil de 5%. Calculez la statistique de test \\(t\\) et la p-value approximative.",
          "reponse": "\\[t = \\frac{\\hat{\\beta}}{SE(\\hat{\\beta})} = \\frac{2,5}{0,8} = 3,125\\]\n\nAvec 12 observations, ddl = 12 - 2 = 10.\n\nPour un test bilatéral, la p-value ≈ 2 × P(T > 3,125).\nAvec ddl = 10, P(T > 3,125) ≈ 0,005.\np-value ≈ 0,01\n\nComme p-value = 0,01 < 0,05, le coefficient est significatif au seuil de 5%. Les dépenses publicitaires ont un effet significatif sur les ventes."
        },
        {
          "question": "2) Que nous dit le test de Shapiro-Wilk (p-value = 0,04) sur la validité du modèle ?",
          "reponse": "Le test de Shapiro-Wilk teste la normalité des résidus. Avec p-value = 0,04 < 0,05, on rejette l'hypothèse de normalité des résidus. Cela signifie que les résidus ne suivent pas une distribution normale, ce qui peut affecter la validité des tests t et des intervalles de confiance. Des transformations des données ou l'utilisation de méthodes robustes pourraient être nécessaires."
        },
        {
          "question": "3) Que nous dit le test de Breusch-Pagan (p-value = 0,12) ?",
          "reponse": "Le test de Breusch-Pagan teste l'homoscédasticité des résidus (variance constante). Avec p-value = 0,12 > 0,05, on ne rejette pas l'hypothèse d'homoscédasticité. Il n'y a pas de preuve significative d'hétéroscédasticité. La variance des résidus semble constante."
        },
        {
          "question": "4) Le test de Durbin-Watson donne une statistique de 1,2. Sachant que la valeur idéale est 2, interprétez ce résultat.",
          "reponse": "Le test de Durbin-Watson détecte l'autocorrélation des résidus. La valeur 1,2 est inférieure à 2, ce qui indique une autocorrélation positive (les résidus successifs sont corrélés positivement). Comme les données sont des séries temporelles sur 12 mois, cette autocorrélation est préoccupante. Elle peut entraîner une sous-estimation des erreurs standard et des tests trop optimistes. Le modèle pourrait être amélioré en tenant compte de la structure temporelle des données (variables retardées, modèles ARIMA, etc.)."
        }
      ]
    },
    {
      "titre": "Exercice 4 : Synthèse et Interprétation (3 pts)",
      "points": "3 pts",
      "enonce": "<p>Vous avez réalisé une analyse de régression pour prédire les ventes d'un produit en fonction de son prix et du budget publicitaire. Voici la synthèse des diagnostics :</p><ul><li>Les coefficients de prix et de publicité sont significatifs au seuil de 5%</li><li>Test de Shapiro-Wilk sur les résidus : p-value = 0,06</li><li>Test de Breusch-Pagan : p-value = 0,03</li><li>Test de Durbin-Watson : statistique = 1,9</li></ul>",
      "questions": [
        {
          "question": "1) Identifiez la condition d'application du modèle de régression qui n'est pas satisfaite. Justifiez votre réponse.",
          "reponse": "La condition d'homoscédasticité n'est pas satisfaite. En effet, le test de Breusch-Pagan donne une p-value = 0,03 < 0,05, ce qui conduit à rejeter l'hypothèse d'homoscédasticité. Cela signifie que la variance des résidus n'est pas constante en fonction des variables explicatives."
        },
        {
          "question": "2) Quelles conséquences cette violation peut-elle avoir sur les conclusions du modèle ? Que proposez-vous comme solution ?",
          "reponse": "La violation de l'homoscédasticité peut entraîner des estimations inefficaces des coefficients et des erreurs standard incorrectes, ce qui peut rendre les tests de significativité invalides.\n\n<strong>Solutions proposées :</strong>\n<ol><li>Utiliser des erreurs standard robustes (avec la méthode de Huber-White) pour corriger l'hétéroscédasticité</li><li>Transformer la variable dépendante (par exemple, utiliser le logarithme des ventes)</li><li>Utiliser des moindres carrés pondérés (WLS)</li></ol>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
