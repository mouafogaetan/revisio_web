<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Présentation mobile</title>
    <!-- MathJax -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' },
            options: { skipHtmlTypes: 'script' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }
    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
    }
    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 500px;
        margin: 0 auto;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }
    .slide-header {
        flex-shrink: 0;
        padding: 18px 16px 10px 16px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        z-index: 10;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }
    .slide-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }
    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
    }
    .content-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 18px 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        flex-shrink: 0;
    }
    .content-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }
    .content-card li {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        line-height: 1.5;
    }
    .content-card li:last-child {
        border-bottom: none;
    }
    .bullet-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
    }
    .math-block {
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        overflow-x: auto;
        flex-shrink: 0;
        margin: 4px 0;
    }
    .math-block .math {
        font-size: 1.2rem;
        color: #e2e8f0;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.08);
        border-left: 4px solid #60a5fa;
        padding: 12px 16px;
        border-radius: 12px;
        font-style: italic;
        font-size: 0.9rem;
        color: #cbd5e1;
        flex-shrink: 0;
    }
    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        border-radius: 0;
        flex-direction: column;
    }
    .loading-card {
        background: #1e293b;
        padding: 32px 28px;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #334155;
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px auto;
    }
    .loading-text {
        font-weight: 600;
        font-size: 1.1rem;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    .loading-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 16px;
    }
    .loading-progress {
        height: 3px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        animation: loadingProgress 30s ease-out forwards;
    }
    .loading-timeout {
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 12px;
    }
    .btn-cancel-loading {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 40px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #f87171;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }
    .btn-cancel-loading:active {
        transform: scale(0.94);
        background: rgba(239, 68, 68, 0.25);
    }
    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
    }
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }
    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }
    .slide-counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255,255,255,0.05);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(255,255,255,0.04);
    }
    .status-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 30px;
        background: rgba(96, 165, 250, 0.12);
        color: #93bbfc;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
    }
    .status-badge .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: pulse-dot 1.2s infinite;
        flex-shrink: 0;
    }
    .status-badge.idle .dot {
        animation: none;
        background: #64748b;
    }
    .status-badge.speaking .dot {
        background: #34d399;
        animation: pulse-dot 0.8s infinite;
    }
    .status-badge.error .dot {
        background: #f87171;
        animation: none;
    }
    .status-badge.paused .dot {
        animation: none;
        background: #fbbf24;
    }
    .status-badge.waiting .dot {
        animation: pulse-dot 1.5s infinite;
        background: #fbbf24;
    }
    .status-badge.loading .dot {
        animation: pulse-dot 0.5s infinite;
        background: #60a5fa;
    }
    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.7); }
    }
    .footer-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }
    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }
    .btn:active {
        transform: scale(0.94);
        background: rgba(255,255,255,0.1);
    }
    .btn-secondary {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.06);
    }
    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
        min-width: 80px;
        justify-content: center;
    }
    .btn-play:active {
        background: rgba(52, 211, 153, 0.25);
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
    }
    .auto-indicator {
        font-size: 0.65rem;
        color: #64748b;
        text-align: center;
        letter-spacing: 0.3px;
        padding: 2px 0;
    }
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.2rem;
        }
        .content-card li {
            font-size: 0.9rem;
            padding: 8px 0;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .btn-play {
            min-width: 60px;
        }
        .footer-buttons {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
        .loading-card {
            padding: 20px 16px;
        }
        .math-block .math {
            font-size: 1rem;
        }
    }
    @media (min-width: 600px) {
        .app-container {
            max-width: 480px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
        .loading-overlay {
            border-radius: 32px;
        }
    }
    /* Mode jour (par défaut) - ajouté par le script de thème */
    html, body {
        background: #f0f4f8 !important;
        color: #1a202c !important;
    }
    .app-container {
        background: linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%) !important;
    }
    .slide-header {
        background: rgba(255, 255, 255, 0.85) !important;
        border-bottom: 1px solid rgba(0,0,0,0.08) !important;
    }
    .slide-header h1 {
        background: linear-gradient(135deg, #2b6cb0, #6b46c1) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        background-clip: text !important;
    }
    .slide-footer {
        background: rgba(255, 255, 255, 0.9) !important;
        border-top: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card {
        background: rgba(255,255,255,0.8) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card li {
        border-bottom: 1px solid rgba(0,0,0,0.05) !important;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.12) !important;
        border-left: 4px solid #4299e1 !important;
        color: #2c3e50 !important;
    }
    .math-block {
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .math-block .math {
        color: #2d3748 !important;
    }
    .slide-counter {
        color: #4a5568 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .status-badge {
        background: rgba(96, 165, 250, 0.15) !important;
        color: #2b6cb0 !important;
        border: 1px solid rgba(96, 165, 250, 0.15) !important;
    }
    .btn {
        color: #2d3748 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .btn-secondary {
        background: rgba(0,0,0,0.04) !important;
        border-color: rgba(0,0,0,0.08) !important;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15) !important;
        border-color: rgba(52, 211, 153, 0.2) !important;
        color: #38a169 !important;
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15) !important;
        border-color: rgba(251, 191, 36, 0.2) !important;
        color: #d69e2e !important;
    }
    .auto-indicator {
        color: #718096 !important;
    }
    .loading-card {
        background: #ffffff !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .loading-text {
        color: #1a202c !important;
    }
    .loading-sub {
        color: #4a5568 !important;
    }
</style>
</head>
<body>
<div class="app-container">
    <header class="slide-header">
        <h1 id="slideTitle">Chargement...</h1>
    </header>
    <main class="slide-body" id="slideBody"></main>
    <!-- LOADING OVERLAY AVEC BOUTON ANNULER -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Préparation vocale...</div>
            <div class="loading-sub" id="loadingSub">Synthèse en cours</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loadingProgressBar"></div>
            </div>
            <div class="loading-timeout" id="loadingTimeout">⏱️ 30 secondes maximum</div>
            <button class="btn-cancel-loading" id="cancelLoadingBtn">
                <span>✕</span> Annuler
            </button>
        </div>
    </div>
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="slide-counter" id="slideCounter">1 / 3</span>
            <span class="status-badge idle" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">Prêt</span>
            </span>
        </div>
        <div class="footer-buttons">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-secondary" id="replayBtn">
                <span class="btn-icon">🔁</span> <span class="btn-label">Relire</span>
            </button>
            <button class="btn btn-play" id="playBtn">
                <span class="btn-icon">▶</span> <span class="btn-label">Play</span>
            </button>
        </div>
    </footer>
</div>
<script>
$(function() {
    // ================================================================
    // SLIDES
    // ================================================================
    const slides = [
  {
    "titre": "Bienvenue en classe !",
    "contenu": "<div style='display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; min-height: 50vh; padding: 10px;'> <h2 style='color: #2c3e50;'>Leçon 2 : Jemanden vorstellen</h2> <h3 style='color: #34495e;'>Présenter quelqu'un</h3> <p style='font-size: 1.1rem; margin-top: 20px;'>Aujourd'hui, nous allons apprendre à <strong>présenter une autre personne</strong> en allemand.</p> <p style='font-size: 1.1rem;'>Vous saurez poser des questions sur quelqu'un et y répondre.</p> <div style='background-color: #e8f4f8; padding: 15px; border-radius: 8px; margin-top: 20px;'> <p><strong>Objectif :</strong> Présenter une autre personne en utilisant le vocabulaire de l'identité et de la famille.</p> </div> </div>",
    "texteParle": "Bonjour à tous et bienvenue dans ce nouveau cours d'allemand. Aujourd'hui, nous allons aborder la leçon 2 qui s'intitule 'Jemanden vorstellen', c'est-à-dire 'Présenter quelqu'un'. Après avoir appris à nous présenter nous-mêmes, nous allons maintenant apprendre à présenter une autre personne. Nous verrons comment poser des questions sur une personne et comment y répondre. Nous utiliserons aussi le vocabulaire de l'identité et de la famille. Alors, concentrez-vous et commençons !",
    "note": "Introduction de la leçon sur la présentation d'autrui"
  },
  {
    "titre": "Les pronoms personnels (rappel)",
    "contenu": "<div style='display: flex; flex-direction: column; gap: 15px; padding: 10px;'> <p>Pour présenter quelqu'un, on utilise les <strong>pronoms personnels</strong> :</p> <div style='overflow-x: auto;'> <table style='width: 100%; border-collapse: collapse; font-size: 1rem;'> <thead style='background-color: #343a40; color: white;'> <tr> <th style='padding: 10px; border: 1px solid #ddd;'>Français</th> <th style='padding: 10px; border: 1px solid #ddd;'>Allemand</th> </tr> </thead> <tbody> <tr style='background-color: #f8f9fa;'> <td style='padding: 10px; border: 1px solid #ddd;'>je</td> <td style='padding: 10px; border: 1px solid #ddd;'><strong>ich</strong></td> </tr> <tr style='background-color: #e9ecef;'> <td style='padding: 10px; border: 1px solid #ddd;'>tu</td> <td style='padding: 10px; border: 1px solid #ddd;'><strong>du</strong></td> </tr> <tr style='background-color: #f8f9fa;'> <td style='padding: 10px; border: 1px solid #ddd;'>il</td> <td style='padding: 10px; border: 1px solid #ddd;'><strong>er</strong></td> </tr> <tr style='background-color: #e9ecef;'> <td style='padding: 10px; border: 1px solid #ddd;'>elle</td> <td style='padding: 10px; border: 1px solid #ddd;'><strong>sie</strong></td> </tr> <tr style='background-color: #f8f9fa;'> <td style='padding: 10px; border: 1px solid #ddd;'>il/elle (neutre)</td> <td style='padding: 10px; border: 1px solid #ddd;'><strong>es</strong></td> </tr> <tr style='background-color: #e9ecef;'> <td style='padding: 10px; border: 1px solid #ddd;'>nous</td> <td style='padding: 10px; border: 1px solid #ddd;'><strong>wir</strong></td> </tr> <tr style='background-color: #f8f9fa;'> <td style='padding: 10px; border: 1px solid #ddd;'>vous</td> <td style='padding: 10px; border: 1px solid #ddd;'><strong>ihr</strong></td> </tr> <tr style='background-color: #e9ecef;'> <td style='padding: 10px; border: 1px solid #ddd;'>ils/elles</td> <td style='padding: 10px; border: 1px solid #ddd;'><strong>sie</strong></td> </tr> <tr style='background-color: #f8f9fa;'> <td style='padding: 10px; border: 1px solid #ddd;'>Vous (politesse)</td> <td style='padding: 10px; border: 1px solid #ddd;'><strong>Sie</strong></td> </tr> </tbody> </table> </div> <div style='background-color: #d1ecf1; padding: 15px; border-radius: 8px; margin-top: 10px;'> <p><strong>Important :</strong> Pour présenter quelqu'un, on utilise souvent <strong>er</strong> (il) ou <strong>sie</strong> (elle).</p> </div> </div>",
    "texteParle": "Avant de commencer à présenter quelqu'un, rappelons les pronoms personnels. Ce sont les mots comme 'ich' pour je, 'du' pour tu, 'er' pour il, 'sie' pour elle, et 'es' pour le neutre. Pour présenter une personne, nous utiliserons principalement 'er' si c'est un homme et 'sie' si c'est une femme. Par exemple, 'er ist' signifie 'il est' et 'sie ist' signifie 'elle est'. C'est très important de bien connaître ces pronoms.",
    "note": "Rappel des pronoms personnels"
  },
  {
    "titre": "Le verbe sein (rappel)",
    "contenu": "<div style='display: flex; flex-direction: column; gap: 15px; padding: 10px;'> <p>Pour présenter quelqu'un, on utilise souvent le verbe <strong>sein</strong> (être).</p> <div style='overflow-x: auto;'> <table style='width: 100%; border-collapse: collapse; font-size: 1rem;'> <thead style='background-color: #28a745; color: white;'> <tr> <th style='padding: 10px; border: 1px solid #ddd;'>Pronom</th> <th style='padding: 10px; border: 1px solid #ddd;'>Conjugaison</th> <th style='padding: 10px; border: 1px solid #ddd;'>Traduction</th> </tr> </thead> <tbody> <tr style='background-color: #f8f9fa;'> <td style='padding: 10px; border: 1px solid #ddd;'>ich</td> <td style='padding: 10px; border: 1px solid #ddd;'><strong>bin</strong></td> <td style='padding: 10px; border: 1px solid #ddd;'>je suis</td> </tr> <tr style='background-color: #e9ecef;'> <td style='padding: 10px; border: 1px solid #ddd;'>du</td> <td style='padding: 10px; border: 1px solid #ddd;'><strong>bist</strong></td> <td style='padding: 10px; border: 1px solid #ddd;'>tu es</td> </tr> <tr style='background-color: #f8f9fa;'> <td style='padding: 10px; border: 1px solid #ddd;'>er/sie/es</td> <td style='padding: 10px; border: 1px solid #ddd;'><strong>ist</strong></td> <td style='padding: 10px; border: 1px solid #ddd;'>il/elle/on est</td> </tr> <tr style='background-color: #e9ecef;'> <td style='padding: 10px; border: 1px solid #ddd;'>wir</td> <td style='padding: 10px; border: 1px solid #ddd;'><strong>sind</strong></td> <td style='padding: 10px; border: 1px solid #ddd;'>nous sommes</td> </tr> <tr style='background-color: #f8f9fa;'> <td style='padding: 10px; border: 1px solid #ddd;'>ihr</td> <td style='padding: 10px; border: 1px solid #ddd;'><strong>seid</strong></td> <td style='padding: 10px; border: 1px solid #ddd;'>vous êtes</td> </tr> <tr style='background-color: #e9ecef;'> <td style='padding: 10px; border: 1px solid #ddd;'>sie/Sie</td> <td style='padding: 10px; border: 1px solid #ddd;'><strong>sind</strong></td> <td style='padding: 10px; border: 1px solid #ddd;'>ils/elles sont / Vous êtes</td> </tr> </tbody> </table> </div> <div style='background-color: #fff3cd; padding: 15px; border-radius: 8px; margin-top: 10px;'> <p><strong>À retenir :</strong> <em>er ist</em> = il est, <em>sie ist</em> = elle est.</p> </div> </div>",
    "texteParle": "Rappelons aussi la conjugaison du verbe 'sein' qui signifie 'être'. C'est un verbe irrégulier. Pour présenter quelqu'un, nous utiliserons surtout 'er ist' pour dire 'il est' et 'sie ist' pour dire 'elle est'. Par exemple, 'er ist mein Freund' signifie 'il est mon ami' et 'sie ist meine Schwester' signifie 'elle est ma sœur'. Ces formes sont très importantes pour la leçon d'aujourd'hui.",
    "note": "Rappel de la conjugaison de sein"
  },
  {
    "titre": "Présenter quelqu'un : les formules",
    "contenu": "<div style='display: flex; flex-direction: column; gap: 15px; padding: 10px;'> <p>Voici les formules pour <strong>présenter quelqu'un</strong> en allemand :</p> <div style='background-color: #d4edda; padding: 15px; border-radius: 8px;'> <ul style='list-style-type: none; padding: 0;'> <li style='background-color: #f0f0f0; margin-bottom: 8px; padding: 10px; border-radius: 8px;'> <span style='font-weight: bold;'>Das ist</span> <span style='color: #007bff;'>mein Freund</span>. → <span style='color: #28a745;'>C'est</span> mon ami. </li> <li style='background-color: #f0f0f0; margin-bottom: 8px; padding: 10px; border-radius: 8px;'> <span style='font-weight: bold;'>Das ist</span> <span style='color: #007bff;'>meine Schwester</span>. → <span style='color: #28a745;'>C'est</span> ma sœur. </li> <li style='background-color: #f0f0f0; margin-bottom: 8px; padding: 10px; border-radius: 8px;'> <span style='font-weight: bold;'>Das ist</span> <span style='color: #007bff;'>mein Bruder</span>. → <span style='color: #28a745;'>C'est</span> mon frère. </li> <li style='background-color: #f0f0f0; margin-bottom: 8px; padding: 10px; border-radius: 8px;'> <span style='font-weight: bold;'>Das ist</span> <span style='color: #007bff;'>meine Mutter</span>. → <span style='color: #28a745;'>C'est</span> ma mère. </li> <li style='background-color: #f0f0f0; margin-bottom: 8px; padding: 10px; border-radius: 8px;'> <span style='font-weight: bold;'>Das ist</span> <span style='color: #007bff;'>mein Vater</span>. → <span style='color: #28a745;'>C'est</span> mon père. </li> </ul> </div> <div style='background-color: #d1ecf1; padding: 15px; border-radius: 8px; margin-top: 10px;'> <p><strong>Structure :</strong> <span style='font-weight: bold;'>Das ist</span> + <span style='color: #007bff;'>possessif</span> + <span style='color: #28a745;'>membre de la famille / ami</span>.</p> </div> </div>",
    "texteParle": "Pour présenter quelqu'un, on utilise l'expression 'Das ist' qui signifie 'C'est'. Par exemple, 'Das ist mein Freund' signifie 'C'est mon ami'. 'Das ist meine Schwester' signifie 'C'est ma sœur'. 'Das ist mein Bruder' signifie 'C'est mon frère'. 'Das ist meine Mutter' signifie 'C'est ma mère'. Et 'Das ist mein Vater' signifie 'C'est mon père'. Cette expression est très simple et très utile.",
    "note": "Formules pour présenter quelqu'un"
  },
  {
    "titre": "Donner plus d'informations",
    "contenu": "<div style='display: flex; flex-direction: column; gap: 15px; padding: 10px;'> <p>Après avoir présenté quelqu'un, on peut donner <strong>plus d'informations</strong> :</p> <div style='background-color: #d4edda; padding: 15px; border-radius: 8px;'> <ul style='list-style-type: none; padding: 0;'> <li style='background-color: #f0f0f0; margin-bottom: 8px; padding: 10px; border-radius: 8px;'> <span style='font-weight: bold;'>Das ist</span> <span style='color: #007bff;'>mein Freund</span>. <span style='font-weight: bold;'>Er heißt</span> <span style='color: #007bff;'>Jean</span>. → C'est mon ami. <span style='color: #28a745;'>Il s'appelle Jean.</span> </li> <li style='background-color: #f0f0f0; margin-bottom: 8px; padding: 10px; border-radius: 8px;'> <span style='font-weight: bold;'>Das ist</span> <span style='color: #007bff;'>meine Schwester</span>. <span style='font-weight: bold;'>Sie heißt</span> <span style='color: #007bff;'>Marie</span>. → C'est ma sœur. <span style='color: #28a745;'>Elle s'appelle Marie.</span> </li> <li style='background-color: #f0f0f0; margin-bottom: 8px; padding: 10px; border-radius: 8px;'> <span style='font-weight: bold;'>Das ist</span> <span style='color: #007bff;'>mein Bruder</span>. <span style='font-weight: bold;'>Er ist</span> <span style='color: #007bff;'>15 Jahre alt</span>. → C'est mon frère. <span style='color: #28a745;'>Il a 15 ans.</span> </li> <li style='background-color: #f0f0f0; margin-bottom: 8px; padding: 10px; border-radius: 8px;'> <span style='font-weight: bold;'>Das ist</span> <span style='color: #007bff;'>meine Mutter</span>. <span style='font-weight: bold;'>Sie ist</span> <span style='color: #007bff;'>Lehrerin</span>. → C'est ma mère. <span style='color: #28a745;'>Elle est professeure.</span> </li> </ul> </div> <div style='background-color: #fff3cd; padding: 15px; border-radius: 8px; margin-top: 10px;'> <p><strong>Vocabulaire utile :</strong></p> <ul style='list-style-type: none; padding: 0;'> <li><strong>heißen</strong> = s'appeler</li> <li><strong>sein</strong> = être</li> <li><strong>wohnen</strong> = habiter</li> <li><strong>kommen aus</strong> = venir de</li> </ul> </div> </div>",
    "texteParle": "Après avoir présenté quelqu'un avec 'Das ist', on peut donner plus d'informations sur cette personne. Par exemple, on peut dire son nom avec 'Er heißt' ou 'Sie heißt' qui signifie 'Il/Elle s'appelle'. On peut aussi donner son âge avec 'Er ist... Jahre alt' ou 'Sie ist... Jahre alt'. On peut aussi dire sa profession ou où il habite. Ces informations rendent votre présentation plus complète.",
    "note": "Informations complémentaires sur une personne"
  },
  {
    "titre": "Poser des questions sur une personne",
    "contenu": "<div style='display: flex; flex-direction: column; gap: 15px; padding: 10px;'> <p>Pour en savoir plus sur quelqu'un, on peut poser des <strong>questions</strong> :</p> <div style='background-color: #d4edda; padding: 15px; border-radius: 8px;'> <ul style='list-style-type: none; padding: 0;'> <li style='background-color: #f0f0f0; margin-bottom: 8px; padding: 10px; border-radius: 8px;'> <span style='font-weight: bold;'>Wie heißt</span> <span style='color: #007bff;'>er</span> ? → <span style='color: #28a745;'>Comment</span> s'appelle-t-<span style='color: #28a745;'>il</span> ? </li> <li style='background-color: #f0f0f0; margin-bottom: 8px; padding: 10px; border-radius: 8px;'> <span style='font-weight: bold;'>Wie heißt</span> <span style='color: #007bff;'>sie</span> ? → <span style='color: #28a745;'>Comment</span> s'appelle-t-<span style='color: #28a745;'>elle</span> ? </li> <li style='background-color: #f0f0f0; margin-bottom: 8px; padding: 10px; border-radius: 8px;'> <span style='font-weight: bold;'>Wo wohnt</span> <span style='color: #007bff;'>er</span> ? → <span style='color: #28a745;'>Où</span> habite-t-<span style='color: #28a745;'>il</span> ? </li> <li style='background-color: #f0f0f0; margin-bottom: 8px; padding: 10px; border-radius: 8px;'> <span style='font-weight: bold;'>Woher kommt</span> <span style='color: #007bff;'>sie</span> ? → <span style='color: #28a745;'>D'où</span> vient-<span style='color: #28a745;'>elle</span> ? </li> <li style='background-color: #f0f0f0; margin-bottom: 8px; padding: 10px; border-radius: 8px;'> <span style='font-weight: bold;'>Wie alt ist</span> <span style='color: #007bff;'>er</span> ? → <span style='color: #28a745;'>Quel âge</span> a-t-<span style='color: #28a745;'>il</span> ? </li> </ul> </div> <div style='background-color: #d1ecf1; padding: 15px; border-radius: 8px; margin-top: 10px;'> <p><strong>Structure :</strong> <span style='font-weight: bold;'>Mot interrogatif</span> + <span style='color: #dc3545;'>verbe</span> + <span style='color: #007bff;'>pronom</span> ?</p> </div> </div>",
    "texteParle": "Pour en savoir plus sur une personne, on peut poser des questions. Par exemple, 'Wie heißt er ?' signifie 'Comment s'appelle-t-il ?'. 'Wie heißt sie ?' signifie 'Comment s'appelle-t-elle ?'. 'Wo wohnt er ?' signifie 'Où habite-t-il ?'. 'Woher kommt sie ?' signifie 'D'où vient-elle ?'. Et 'Wie alt ist er ?' signifie 'Quel âge a-t-il ?'. Ces questions vous permettront d'interagir avec vos camarades en allemand.",
    "note": "Questions pour en savoir plus sur une personne"
  },
  {
    "titre": "Les mots interrogatifs (W-Fragen)",
    "contenu": "<div style='display: flex; flex-direction: column; gap: 15px; padding: 10px;'> <p>Voici les <strong>mots interrogatifs</strong> les plus importants :</p> <div style='overflow-x: auto;'> <table style='width: 100%; border-collapse: collapse; font-size: 1rem;'> <thead style='background-color: #343a40; color: white;'> <tr> <th style='padding: 10px; border: 1px solid #ddd;'>Mot interrogatif</th> <th style='padding: 10px; border: 1px solid #ddd;'>Traduction</th> <th style='padding: 10px; border: 1px solid #ddd;'>Exemple</th> </tr> </thead> <tbody> <tr style='background-color: #f8f9fa;'> <td style='padding: 10px; border: 1px solid #ddd;'><strong>Wer</strong></td> <td style='padding: 10px; border: 1px solid #ddd;'>Qui</td> <td style='padding: 10px; border: 1px solid #ddd;'>Wer ist das ?</td> </tr> <tr style='background-color: #e9ecef;'> <td style='padding: 10px; border: 1px solid #ddd;'><strong>Wie</strong></td> <td style='padding: 10px; border: 1px solid #ddd;'>Comment</td> <td style='padding: 10px; border: 1px solid #ddd;'>Wie heißt du ?</td> </tr> <tr style='background-color: #f8f9fa;'> <td style='padding: 10px; border: 1px solid #ddd;'><strong>Wo</strong></td> <td style='padding: 10px; border: 1px solid #ddd;'>Où</td> <td style='padding: 10px; border: 1px solid #ddd;'>Wo wohnst du ?</td> </tr> <tr style='background-color: #e9ecef;'> <td style='padding: 10px; border: 1px solid #ddd;'><strong>Woher</strong></td> <td style='padding: 10px; border: 1px solid #ddd;'>D'où</td> <td style='padding: 10px; border: 1px solid #ddd;'>Woher kommst du ?</td> </tr> <tr style='background-color: #f8f9fa;'> <td style='padding: 10px; border: 1px solid #ddd;'><strong>Wann</strong></td> <td style='padding: 10px; border: 1px solid #ddd;'>Quand</td> <td style='padding: 10px; border: 1px solid #ddd;'>Wann hast du Geburtstag ?</td> </tr> <tr style='background-color: #e9ecef;'> <td style='padding: 10px; border: 1px solid #ddd;'><strong>Warum</strong></td> <td style='padding: 10px; border: 1px solid #ddd;'>Pourquoi</td> <td style='padding: 10px; border: 1px solid #ddd;'>Warum lernst du Deutsch ?</td> </tr> </tbody> </table> </div> <div style='background-color: #fff3cd; padding: 15px; border-radius: 8px; margin-top: 10px;'> <p><strong>Astuce :</strong> Tous les mots interrogatifs en allemand commencent par <strong>W</strong>. On les appelle les <strong>W-Fragen</strong>.</p> </div> </div>",
    "texteParle": "Pour poser des questions, il faut connaître les mots interrogatifs. En allemand, ils commencent tous par la lettre 'W'. On les appelle les 'W-Fragen' ou questions en W. 'Wer' signifie 'Qui', 'Wie' signifie 'Comment', 'Wo' signifie 'Où', 'Woher' signifie 'D'où', 'Wann' signifie 'Quand', et 'Warum' signifie 'Pourquoi'. Ces mots sont très utiles pour poser des questions sur une personne. Essayez de les mémoriser.",
    "note": "Présentation des mots interrogatifs"
  },
  {
    "titre": "Les pronoms possessifs",
    "contenu": "<div style='display: flex; flex-direction: column; gap: 15px; padding: 10px;'> <p>Pour parler de <strong>qui</strong> est la personne, on utilise les <strong>pronoms possessifs</strong> :</p> <div style='overflow-x: auto;'> <table style='width: 100%; border-collapse: collapse; font-size: 1rem;'> <thead style='background-color: #007bff; color: white;'> <tr> <th style='padding: 10px; border: 1px solid #ddd;'>Français</th> <th style='padding: 10px; border: 1px solid #ddd;'>Masculin / Neutre</th> <th style='padding: 10px; border: 1px solid #ddd;'>Féminin / Pluriel</th> </tr> </thead> <tbody> <tr style='background-color: #f8f9fa;'> <td style='padding: 10px; border: 1px solid #ddd;'>mon / ma</td> <td style='padding: 10px; border: 1px solid #ddd;'><strong>mein</strong></td> <td style='padding: 10px; border: 1px solid #ddd;'><strong>meine</strong></td> </tr> <tr style='background-color: #e9ecef;'> <td style='padding: 10px; border: 1px solid #ddd;'>ton / ta</td> <td style='padding: 10px; border: 1px solid #ddd;'><strong>dein</strong></td> <td style='padding: 10px; border: 1px solid #ddd;'><strong>deine</strong></td> </tr> <tr style='background-color: #f8f9fa;'> <td style='padding: 10px; border: 1px solid #ddd;'>son / sa</td> <td style='padding: 10px; border: 1px solid #ddd;'><strong>sein</strong></td> <td style='padding: 10px; border: 1px solid #ddd;'><strong>seine</strong></td> </tr> <tr style='background-color: #e9ecef;'> <td style='padding: 10px; border: 1px solid #ddd;'>notre</td> <td style='padding: 10px; border: 1px solid #ddd;'><strong>unser</strong></td> <td style='padding: 10px; border: 1px solid #ddd;'><strong>unsere</strong></td> </tr> <tr style='background-color: #f8f9fa;'> <td style='padding: 10px; border: 1px solid #ddd;'>votre</td> <td style='padding: 10px; border: 1px solid #ddd;'><strong>euer</strong></td> <td style='padding: 10px; border: 1px solid #ddd;'><strong>eure</strong></td> </tr> <tr style='background-color: #e9ecef;'> <td style='padding: 10px; border: 1px solid #ddd;'>leur</td> <td style='padding: 10px; border: 1px solid #ddd;'><strong>ihr</strong></td> <td style='padding: 10px; border: 1px solid #ddd;'><strong>ihre</strong></td> </tr> </tbody> </table> </div> <div style='background-color: #d4edda; padding: 15px; border-radius: 8px; margin-top: 10px;'> <p><span style='color: #007bff;'>Exemples :</span></p> <ul style='list-style-type: none; padding: 0;'> <li><span style='font-weight: bold;'>Das ist</span> <strong>mein</strong> Freund. → C'est <strong>mon</strong> ami.</li> <li><span style='font-weight: bold;'>Das ist</span> <strong>meine</strong> Freundin. → C'est <strong>mon</strong> amie.</li> </ul> </div> </div>",
    "texteParle": "Pour dire à qui appartient une personne, on utilise les pronoms possessifs. Par exemple, 'mein' signifie 'mon' pour un nom masculin, et 'meine' signifie 'ma' pour un nom féminin. 'Dein' et 'deine' pour 'ton' et 'ta'. 'Sein' et 'seine' pour 'son' et 'sa'. Il est important de choisir la bonne forme selon le genre du mot qui suit. Par exemple, on dit 'mein Freund' car 'Freund' est masculin, mais 'meine Freundin' car 'Freundin' est féminin.",
    "note": "Pronoms possessifs pour indiquer la relation"
  },
  {
    "titre": "Dialogue : Présenter une personne",
    "contenu": "<div style='display: flex; flex-direction: column; gap: 15px; padding: 10px;'> <p>Voici un <strong>dialogue</strong> pour présenter quelqu'un :</p> <div style='background-color: #e8f4f8; padding: 15px; border-radius: 8px;'> <p><strong>Anna :</strong> Hallo, Lisa! Das ist <span style='color: #007bff;'>mein Freund Paul</span>.<br><strong>Lisa :</strong> Hallo Paul! <span style='color: #28a745;'>Wie heißt du</span> ?<br><strong>Paul :</strong> Ich heiße Paul. <span style='color: #28a745;'>Wie geht es dir</span> ?<br><strong>Lisa :</strong> Danke, gut. <span style='color: #28a745;'>Woher kommst du</span> ?<br><strong>Paul :</strong> Ich komme aus Douala.<br><strong>Anna :</strong> Paul ist 15 Jahre alt und er spielt gern Fußball.</p> </div> <div style='background-color: #d1ecf1; padding: 15px; border-radius: 8px; margin-top: 10px;'> <p><strong>Traduction :</strong></p> <ul style='list-style-type: none; padding: 0;'> <li><strong>Anna :</strong> Bonjour Lisa ! Voici mon ami Paul.</li> <li><strong>Lisa :</strong> Bonjour Paul ! Comment t'appelles-tu ?</li> <li><strong>Paul :</strong> Je m'appelle Paul. Comment vas-tu ?</li> <li><strong>Lisa :</strong> Merci, bien. D'où viens-tu ?</li> <li><strong>Paul :</strong> Je viens de Douala.</li> <li><strong>Anna :</strong> Paul a 15 ans et il aime jouer au football.</li> </ul> </div> </div>",
    "texteParle": "Voici un dialogue pour présenter quelqu'un. Anna présente son ami Paul à Lisa. Anna dit 'Das ist mein Freund Paul' qui signifie 'Voici mon ami Paul'. Lisa pose des questions à Paul : 'Wie heißt du ?' (Comment t'appelles-tu ?), 'Wie geht es dir ?' (Comment vas-tu ?), et 'Woher kommst du ?' (D'où viens-tu ?). Paul répond à chaque question. Enfin, Anna ajoute des informations sur Paul : 'Paul ist 15 Jahre alt und er spielt gern Fußball.' (Paul a 15 ans et il aime jouer au football).",
    "note": "Dialogue pour présenter une personne"
  }];// ================================================================
    // ÉTAT
    // ================================================================
    let currentIndex = 0;
    let isSpeaking = false;
    let isPaused = false;
    let currentUtterance = null;
    let isLoading = false;
    let loadingTimeout = null;
    let isTransitioning = false;
    let speechSupported = true;
    let userInteracted = false;
    let isPlaying = false;
    let loadingCancelled = false;
    const total = slides.length;
    const synth = window.speechSynthesis;
    // Références jQuery
    const $title = $('#slideTitle');
    const $body = $('#slideBody');
    const $counter = $('#slideCounter');
    const $statusText = $('#statusText');
    const $statusBadge = $('#statusBadge');
    const $loading = $('#loadingOverlay');
    const $loadingText = $('#loadingText');
    const $loadingSub = $('#loadingSub');
    const $loadingTimeout = $('#loadingTimeout');
    const $loadingProgressBar = $('#loadingProgressBar');
    const $autoIndicator = $('#autoIndicator');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $replay = $('#replayBtn');
    const $play = $('#playBtn');
    const $cancelLoading = $('#cancelLoadingBtn');
    // ================================================================
    // FONCTIONS
    // ================================================================
    function setStatus(text, type) {
        $statusText.text(text);
        $statusBadge.removeClass('idle speaking error paused waiting loading');
        if (type === 'speaking') $statusBadge.addClass('speaking');
        else if (type === 'error') $statusBadge.addClass('error');
        else if (type === 'paused') $statusBadge.addClass('paused');
        else if (type === 'waiting') $statusBadge.addClass('waiting');
        else if (type === 'loading') $statusBadge.addClass('loading');
        else $statusBadge.addClass('idle');
    }
    function updatePlayButton() {
        if (isPlaying) {
            $play.addClass('playing');
            $play.find('.btn-icon').text('⏸');
            $play.find('.btn-label').text('Pause');
        } else {
            $play.removeClass('playing');
            $play.find('.btn-icon').text('▶');
            $play.find('.btn-label').text('Play');
        }
    }
    function showLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        loadingCancelled = false;
        isLoading = true;
        // Réinitialiser la barre de progression
        $loadingProgressBar.css('animation', 'none');
        $loadingProgressBar.css('width', '0%');
        // Forcer un reflow
        $loadingProgressBar[0].offsetHeight;
        $loadingProgressBar.css('animation', 'loadingProgress 30s ease-out forwards');
        $loadingText.text('Préparation vocale...');
        $loadingSub.text('Synthèse en cours');
        $loadingTimeout.text('⏱️ 30 secondes maximum');
        $loading.fadeIn(300);
        setStatus("⏳ Chargement...", 'loading');
        // 🔥 TIMEOUT DE 30 SECONDES
        loadingTimeout = setTimeout(() => {
            if (isLoading && !loadingCancelled) {
                hideLoading();
                setStatus("⚠️ Délai dépassé (30s)", 'error');
                isPlaying = false;
                updatePlayButton();
                $loadingSub.text('La synthèse vocale a pris trop de temps');
                $loadingTimeout.text('❌ Délai dépassé');
            }
        }, 30000);
    }
    function hideLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        isLoading = false;
        loadingCancelled = false;
        $loading.fadeOut(300);
        // Ne pas changer le statut si on est en train de parler
        if (!isSpeaking && !isPlaying) {
            setStatus("⏸ Lecture arrêtée", 'paused');
        }
    }
    function cancelLoading() {
        loadingCancelled = true;
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        hideLoading();
        stopSpeaking();
        setStatus("⏸ Annulé", 'paused');
        isPlaying = false;
        updatePlayButton();
        $loadingText.text('Annulé par l\'utilisateur');
        $loadingSub.text('Vous pouvez réessayer');
        $loadingTimeout.text('✕ Annulation');
    }
    // Arrêter la parole proprement
    function stopSpeaking() {
        try {
            if (synth && (synth.speaking || synth.pending)) {
                synth.cancel();
            }
        } catch(e) {
            console.warn('Erreur stopSpeaking:', e);
        }
        if (currentUtterance) {
            try {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance.onstart = null;
            } catch(e) {}
            currentUtterance = null;
        }
        isSpeaking = false;
        isPlaying = false;
        updatePlayButton();
    }
    // Mettre en pause la parole
    function pauseSpeaking() {
        try {
            if (synth && synth.speaking) {
                synth.pause();
                isPaused = true;
                isPlaying = false;
                setStatus("⏸ Lecture en pause", 'paused');
                updatePlayButton();
            }
        } catch(e) {
            console.warn('Erreur pauseSpeaking:', e);
            stopSpeaking();
        }
    }
    // Reprendre la parole
    function resumeSpeaking() {
        try {
            if (synth && synth.paused) {
                synth.resume();
                isPaused = false;
                isPlaying = true;
                setStatus("🔊 Lecture en cours", 'speaking');
                updatePlayButton();
            } else if (!isSpeaking && !synth.speaking && !synth.pending) {
                speakSlide(currentIndex);
            }
        } catch(e) {
            console.warn('Erreur resumeSpeaking:', e);
            speakSlide(currentIndex);
        }
    }
    function renderSlide(index) {
        const slide = slides[index];
        $title.text(slide.titre);
        let html = '';
        html += `<div class="content-card">${slide.contenu}</div>`;
        if (slide.note) {
            html += `<div class="note-box">${slide.note}</div>`;
        }
        $body.html(html);
        $counter.text(`${index+1} / ${total}`);
        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
        }
    }
    // ================================================================
    // LECTURE VOCALE
    // ================================================================
    function speakSlide(index) {
        return new Promise((resolve) => {
            const slide = slides[index];
            const text = slide.texteParle;
            if (!text || text.trim() === '' || !speechSupported) {
                resolve();
                return;
            }
            if (!window.speechSynthesis) {
                setStatus("❌ Synthèse vocale non supportée", 'error');
                speechSupported = false;
                resolve();
                return;
            }
            // Arrêter toute lecture en cours
            stopSpeaking();
            // Réinitialiser l'état de pause
            isPaused = false;
            showLoading();
            setStatus("Initialisation...", 'loading');
            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.92;
                utterance.pitch = 1.05;
                utterance.volume = 1;
                let isFinished = false;
                let errorHandled = false;
                utterance.onstart = function() {
                    if (loadingCancelled) {
                        stopSpeaking();
                        resolve();
                        return;
                    }
                    hideLoading();
                    isSpeaking = true;
                    isPlaying = true;
                    isPaused = false;
                    setStatus("🔊 Lecture en cours", 'speaking');
                    updatePlayButton();
                };
                utterance.onend = function() {
                    if (isFinished) return;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    setStatus("✅ Terminé", 'idle');
                    hideLoading();
                    updatePlayButton();
                    resolve();
                };
                utterance.onerror = function(e) {
                    if (isFinished || errorHandled) return;
                    errorHandled = true;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    hideLoading();
                    updatePlayButton();
                    if (e.error === 'not-allowed') {
                        setStatus("⚠️ Permission refusée", 'error');
                    } else if (e.error === 'synthesis-unavailable') {
                        setStatus("⚠️ Synthèse indisponible", 'error');
                    } else if (e.error === 'canceled') {
                        setStatus("⏸ Annulé", 'paused');
                    } else {
                        setStatus("❌ Erreur audio: " + (e.error || 'inconnue'), 'error');
                    }
                    resolve();
                };
                // Gestion du chargement des voix
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = function() {
                        if (!loadingCancelled) {
                            try {
                                synth.speak(utterance);
                            } catch(err) {
                                // Silencieux
                            }
                        }
                        synth.onvoiceschanged = null;
                    };
                }
                currentUtterance = utterance;
                if (!loadingCancelled) {
                    try {
                        synth.speak(utterance);
                    } catch(err) {
                        setTimeout(() => {
                            if (!loadingCancelled) {
                                try {
                                    synth.speak(utterance);
                                } catch(e) {
                                    setStatus("❌ Erreur de lecture", 'error');
                                    isPlaying = false;
                                    updatePlayButton();
                                    hideLoading();
                                    resolve();
                                }
                            } else {
                                resolve();
                            }
                        }, 100);
                    }
                } else {
                    resolve();
                }
            } catch(err) {
                hideLoading();
                setStatus("❌ Erreur générale", 'error');
                isPlaying = false;
                updatePlayButton();
                console.error('Erreur speakSlide:', err);
                resolve();
            }
        });
    }
    // ================================================================
    // NAVIGATION
    // ================================================================
    async function goToSlide(index) {
        if (isTransitioning) return;
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        // Si on est en train de lire, on met en pause avant de naviguer
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        // Arrêter complètement la lecture
        stopSpeaking();
        await new Promise(r => setTimeout(r, 50));
        if (index === currentIndex) {
            setStatus("📄 Slide actuel", 'idle');
            return;
        }
        isTransitioning = true;
        currentIndex = index;
        renderSlide(index);
        // Réinitialiser l'état de lecture
        isPlaying = false;
        updatePlayButton();
        setStatus("⏸ Lecture arrêtée", 'paused');
        await new Promise(r => setTimeout(r, 150));
        isTransitioning = false;
    }
    async function goToNext() {
        if (isTransitioning) return;
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        if (currentIndex + 1 < total) {
            await goToSlide(currentIndex + 1);
        } else {
            setStatus("🏁 Dernier slide", 'idle');
        }
    }
    async function goToPrev() {
        if (isTransitioning) return;
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        if (currentIndex - 1 >= 0) {
            await goToSlide(currentIndex - 1);
        } else {
            setStatus("🔁 Premier slide", 'idle');
        }
    }
    // ================================================================
    // GESTION PLAY/PAUSE
    // ================================================================
    function togglePlay() {
        if (!userInteracted) {
            userInteracted = true;
        }
        // Si le chargement est en cours, on l'annule
        if (isLoading) {
            cancelLoading();
            return;
        }
        // Si le synthétiseur est en pause, on reprend
        if (synth && synth.paused) {
            resumeSpeaking();
            return;
        }
        // Si la lecture est en cours, on met en pause
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
            return;
        }
        // Sinon, on démarre la lecture du slide courant
        if (!isSpeaking && !isPlaying) {
            stopSpeaking();
            speakSlide(currentIndex);
        }
    }
    // ================================================================
    // INIT
    // ================================================================
    async function init() {
        // Vérifier la compatibilité
        if (!window.speechSynthesis) {
            setStatus("❌ Synthèse vocale non supportée", 'error');
            speechSupported = false;
        }
        // Précharger les voix
        try {
            if (synth.getVoices) {
                synth.getVoices();
                setTimeout(() => {
                    try {
                        synth.getVoices();
                    } catch(e) {}
                }, 200);
            }
        } catch(e) {
            console.warn('Erreur chargement voix:', e);
        }
        // Afficher le premier slide
        renderSlide(0);
        $counter.text(`1 / ${total}`);
        // État initial
        setStatus("⏸ Appuie sur Play", 'paused');
        updatePlayButton();
        $autoIndicator.text('⏸ Lecture manuelle');
        // ================================================================
        // ÉVÉNEMENTS
        // ================================================================
        // Bouton Play/Pause
        $play.on('click', function() {
            togglePlay();
        });
        // Bouton Annuler le chargement
        $cancelLoading.on('click', function() {
            cancelLoading();
        });
        // Navigation
        $prev.on('click', function() {
            // Si chargement en cours, on annule
            if (isLoading) cancelLoading();
            goToPrev();
        });
        $next.on('click', function() {
            if (isLoading) cancelLoading();
            goToNext();
        });
        // Replay - relire le slide courant
        $replay.on('click', function() {
            if (isLoading) cancelLoading();
            stopSpeaking();
            setTimeout(() => {
                speakSlide(currentIndex);
            }, 100);
        });
        // Support du clavier (espace pour play/pause)
        $(document).on('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });
        // Nettoyage
        $(window).on('beforeunload', function() {
            try {
                if (synth.speaking) synth.cancel();
            } catch(e) {}
            hideLoading();
        });
        // Gérer les cas où la synthèse se termine de manière inattendue
        setInterval(() => {
            if (isPlaying && !synth.speaking && !synth.pending && !isPaused && !isLoading) {
                isPlaying = false;
                updatePlayButton();
                setStatus("⏸ Lecture arrêtée", 'paused');
            }
        }, 1000);
    }
    init();
});
    // ================================================================
    // GESTION DU THÈME JOUR/NUIT
    // ================================================================
    let isDarkMode = false;
    function toggleTheme() {
        isDarkMode = !isDarkMode;
        const body = document.body;
        const appContainer = document.querySelector('.app-container');
        const header = document.querySelector('.slide-header');
        const footer = document.querySelector('.slide-footer');
        const contentCards = document.querySelectorAll('.content-card');
        const noteBoxes = document.querySelectorAll('.note-box');
        const mathBlocks = document.querySelectorAll('.math-block');
        const buttons = document.querySelectorAll('.btn');
        const statusBadge = document.querySelector('.status-badge');
        const slideCounter = document.querySelector('.slide-counter');
        const autoIndicator = document.querySelector('.auto-indicator');
        const themeBtn = document.getElementById('themeToggle');
        if (isDarkMode) {
            // Mode nuit
            body.style.background = '#0b1120';
            body.style.color = '#f1f5f9';
            if (appContainer) appContainer.style.background = 'linear-gradient(145deg, #0f172a 0%, #1e293b 100%)';
            if (header) header.style.background = 'rgba(15, 23, 42, 0.85)';
            if (footer) footer.style.background = 'rgba(15, 23, 42, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.05)';
                card.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.08)';
                note.style.color = '#cbd5e1';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.25)';
                block.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#e2e8f0';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.12)';
                statusBadge.style.color = '#93bbfc';
            }
            if (slideCounter) {
                slideCounter.style.color = '#94a3b8';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#64748b';
            }
            if (themeBtn) {
                themeBtn.textContent = '☀️';
                themeBtn.title = 'Passer en mode jour';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#e2e8f0';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#e2e8f0';
                }
            });
        } else {
            // Mode jour (par défaut)
            body.style.background = '#f0f4f8';
            body.style.color = '#1a202c';
            if (appContainer) appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
            if (header) header.style.background = 'rgba(255, 255, 255, 0.85)';
            if (footer) footer.style.background = 'rgba(255, 255, 255, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.8)';
                card.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.12)';
                note.style.color = '#2c3e50';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.05)';
                block.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#2d3748';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
                statusBadge.style.color = '#2b6cb0';
            }
            if (slideCounter) {
                slideCounter.style.color = '#4a5568';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#718096';
            }
            if (themeBtn) {
                themeBtn.textContent = '🌓';
                themeBtn.title = 'Passer en mode nuit';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#2c3e50';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#2d3748';
                }
            });
        }
    }
    // Initialiser en mode jour
    document.addEventListener('DOMContentLoaded', function() {
        // Appliquer le mode jour par défaut
        const body = document.body;
        body.style.background = '#f0f4f8';
        body.style.color = '#1a202c';
        const appContainer = document.querySelector('.app-container');
        if (appContainer) {
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
        }
        const header = document.querySelector('.slide-header');
        if (header) {
            header.style.background = 'rgba(255, 255, 255, 0.85)';
        }
        const footer = document.querySelector('.slide-footer');
        if (footer) {
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
        }
        document.querySelectorAll('.content-card').forEach(card => {
            card.style.background = 'rgba(255,255,255,0.8)';
            card.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        document.querySelectorAll('.note-box').forEach(note => {
            note.style.background = 'rgba(96, 165, 250, 0.12)';
            note.style.color = '#2c3e50';
        });
        document.querySelectorAll('.math-block').forEach(block => {
            block.style.background = 'rgba(0,0,0,0.05)';
            block.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        document.querySelectorAll('.btn').forEach(btn => {
            btn.style.color = '#2d3748';
        });
        const statusBadge = document.querySelector('.status-badge');
        if (statusBadge) {
            statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
            statusBadge.style.color = '#2b6cb0';
        }
        const slideCounter = document.querySelector('.slide-counter');
        if (slideCounter) {
            slideCounter.style.color = '#4a5568';
        }
        const autoIndicator = document.querySelector('.auto-indicator');
        if (autoIndicator) {
            autoIndicator.style.color = '#718096';
        }
        document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
            if (!el.closest('.note-box')) {
                el.style.color = '#2c3e50';
            }
        });
        document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
            if (!el.closest('.note-box') && !el.closest('.math-block')) {
                el.style.color = '#2d3748';
            }
        });
        const themeBtn = document.getElementById('themeToggle');
        if (themeBtn) {
            themeBtn.textContent = '🌓';
            themeBtn.title = 'Passer en mode nuit';
            // Ajouter l'écouteur d'événement click
            themeBtn.addEventListener('click', toggleTheme);
        }
    });
</script>
