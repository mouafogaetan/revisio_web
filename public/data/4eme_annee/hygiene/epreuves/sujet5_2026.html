<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Hygiène",
  "classe": "4ème Année",
  "sequence": "Séquence 5",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Partie I : Éducation à la Santé (10 pts)",
      "points": "10 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; padding: 10px; background-color: #e8f5e9; border-radius: 10px; color: #1e3a2f;'><p><strong>Instruction :</strong> Lisez attentivement les consignes et répondez aux questions dans les espaces prévus.</p></div>",
      "questions": [
        {
          "question": "<div style='margin-top: 15px; background-color: #fff; padding: 12px; border-radius: 8px; border-left: 5px solid #2e7d32;'><p><strong>Exercice 1 : Les microorganismes et la contamination (3 pts)</strong></p><p>1. Citez les quatre grands groupes de microorganismes (1 pt)</p><p>2. Décrivez la voie de transmission féco-orale et donnez un exemple de maladie associée (1 pt)</p><p>3. Expliquez la différence entre une contamination directe et indirecte (1 pt)</p></div>",
          "reponse": "<div style='padding: 10px; background-color: #f1f8e9; border-radius: 5px; color: #1e3a2f;'><p><strong>Corrigé :</strong></p><p>1. Les quatre grands groupes de microorganismes sont : les <strong>bactéries</strong>, les <strong>virus</strong>, les <strong>champignons microscopiques</strong> (levures, moisissures) et les <strong>protozoaires</strong> (parasites unicellulaires).</p><p>2. La <strong>voie féco-orale</strong> est la transmission de microorganismes par l'ingestion d'eau ou d'aliments contaminés par des matières fécales. <strong>Exemple</strong> : la fièvre typhoïde, le choléra, l'hépatite A.</p><p>3. La <strong>contamination directe</strong> est la transmission d'un agent pathogène d'une personne à une autre <strong>sans intermédiaire</strong> (contact physique, gouttelettes de salive). La <strong>contamination indirecte</strong> se fait par l'intermédiaire d'un <strong>vecteur</strong> (moustique, eau contaminée, aliments, objets).</p></div>"
        },
        {
          "question": "<div style='margin-top: 15px; background-color: #fff; padding: 12px; border-radius: 8px; border-left: 5px solid #2e7d32;'><p><strong>Exercice 2 : La réponse immunitaire (3 pts)</strong></p><p>1. Définissez l'immunité innée (non spécifique) (1 pt)</p><p>2. Décrivez le rôle des lymphocytes B dans l'immunité acquise (1 pt)</p><p>3. Expliquez pourquoi le VIH est particulièrement dangereux pour le système immunitaire (1 pt)</p></div>",
          "reponse": "<div style='padding: 10px; background-color: #f1f8e9; border-radius: 5px; color: #1e3a2f;'><p><strong>Corrigé :</strong></p><p>1. L'<strong>immunité innée</strong> est la première ligne de défense de l'organisme. Elle est <strong>présente dès la naissance</strong>, agit rapidement et de manière <strong>non spécifique</strong> (elle combat tous les agents pathogènes de la même façon). Elle inclut les barrières physiques (peau, muqueuses), les barrières chimiques (suc gastrique, lysozyme) et les cellules phagocytaires.</p><p>2. Les <strong>lymphocytes B</strong> sont des cellules de l'immunité acquise qui produisent des <strong>anticorps</strong> spécifiques à chaque antigène. Ces anticorps se fixent sur les agents pathogènes pour les neutraliser et les marquer, facilitant leur destruction par les phagocytes.</p><p>3. Le <strong>VIH</strong> est dangereux car il infecte et détruit les <strong>lymphocytes T4 (CD4)</strong>, qui sont les chefs d'orchestre de la réponse immunitaire. Leur destruction affaiblit progressivement le système immunitaire, rendant l'organisme vulnérable à des infections opportunistes (sida).</p></div>"
        },
        {
          "question": "<div style='margin-top: 15px; background-color: #fff; padding: 12px; border-radius: 8px; border-left: 5px solid #2e7d32;'><p><strong>Exercice 3 : Lutte contre les infections et appareil circulatoire (4 pts)</strong></p><p>1. Qu'est-ce que la vaccinothérapie ? (1 pt)</p><p>2. Décrivez les trois types de vaisseaux sanguins (1 pt)</p><p>3. Citez deux facteurs de risque des accidents de l'appareil circulatoire (1 pt)</p><p>4. Expliquez la différence entre une hémorragie artérielle et une hémorragie veineuse (1 pt)</p></div>",
          "reponse": "<div style='padding: 10px; background-color: #f1f8e9; border-radius: 5px; color: #1e3a2f;'><p><strong>Corrigé :</strong></p><p>1. La <strong>vaccinothérapie</strong> est une stratégie <strong>préventive</strong> qui consiste à administrer un <strong>vaccin</strong> (antigène inoffensif) pour <strong>stimuler le système immunitaire</strong> à produire des anticorps et des cellules mémoires, sans provoquer la maladie. Elle confère une immunité active et durable.</p><p>2. Les trois types de vaisseaux sanguins sont : les <strong>artères</strong> (transportent le sang du cœur vers les organes), les <strong>veines</strong> (ramènent le sang des organes vers le cœur) et les <strong>capillaires</strong> (vaisseaux très fins où se font les échanges entre le sang et les cellules).</p><p>3. Facteurs de risque des accidents de l'appareil circulatoire : le <strong>tabagisme</strong>, l'<strong>alimentation riche en graisses saturées</strong>, la <strong>sédentarité</strong>, l'<strong>hypertension artérielle</strong>, le <strong>diabète</strong>, l'<strong>excès de cholestérol</strong>.</p><p>4. L'<strong>hémorragie artérielle</strong> est caractérisée par un <strong>sang rouge vif</strong> qui <strong>jaillit en jet</strong> (pression élevée). Elle est très dangereuse car la perte de sang est rapide et massive. L'<strong>hémorragie veineuse</strong> est caractérisée par un <strong>sang rouge sombre</strong> qui <strong>coule en continu</strong> (pression plus faible). La perte de sang est moins rapide mais peut aussi être grave.</p></div>"
        }
      ]
    },
    {
      "titre": "Partie II : Éducation à l'Environnement et au Développement Durable (10 pts)",
      "points": "10 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; padding: 10px; background-color: #e3f2fd; border-radius: 10px; color: #0d2b3e;'><p><strong>Consigne :</strong> Répondez aux questions suivantes avec des phrases complètes et des arguments précis.</p></div>",
      "questions": [
        {
          "question": "<div style='margin-top: 15px; background-color: #fff; padding: 12px; border-radius: 8px; border-left: 5px solid #1565c0;'><p><strong>Exercice 4 : La pollution des sols (5 pts)</strong></p><p>1. Définissez la pollution des sols (1 pt)</p><p>2. Identifiez trois causes de la pollution des sols (1,5 pt)</p><p>3. Analysez deux conséquences de la pollution des sols sur la santé humaine (1,5 pt)</p><p>4. Proposez deux moyens de lutte contre la pollution des sols (1 pt)</p></div>",
          "reponse": "<div style='padding: 10px; background-color: #e3f2fd; border-radius: 5px; color: #0d2b3e;'><p><strong>Corrigé :</strong></p><p>1. La <strong>pollution des sols</strong> est la <strong>dégradation</strong> de la qualité du sol due à la présence de <strong>substances toxiques</strong> (produits chimiques, déchets, métaux lourds) qui le rendent impropre à ses fonctions naturelles (production de nourriture, filtration de l'eau, habitat pour la biodiversité).</p><p>2. Trois causes de la pollution des sols : <strong>l'utilisation excessive d'engrais et de pesticides</strong> en agriculture, <strong>les rejets industriels</strong> (métaux lourds, produits chimiques), et <strong>les décharges sauvages et les déchets non traités</strong> (plastiques, batteries, produits ménagers).</p><p>3. Conséquences sur la santé : <strong>Contamination de la chaîne alimentaire</strong> (les plantes absorbent les polluants du sol, qui entrent dans notre alimentation et provoquent des maladies, cancers, troubles neurologiques). <strong>Transmission de maladies</strong> (la pollution des sols favorise le développement de maladies comme le choléra, la typhoïde, les infections parasitaires).</p><p>4. Moyens de lutte : <strong>Promouvoir l'agriculture biologique</strong> (réduire l'utilisation de pesticides et d'engrais chimiques), et <strong>améliorer la gestion des déchets</strong> (tri, recyclage, traitement des eaux usées, lutte contre les décharges sauvages).</p></div>"
        },
        {
          "question": "<div style='margin-top: 15px; background-color: #fff; padding: 12px; border-radius: 8px; border-left: 5px solid #1565c0;'><p><strong>Exercice 5 : Étude de cas - Maladies parasitaires (3 pts)</strong></p><p>Un patient se présente à l'hôpital avec de la fièvre, des frissons, des maux de tête et des douleurs musculaires. Il revient d'un voyage en zone rurale où il a été piqué par des moustiques.</p><p>1. De quelle maladie s'agit-il probablement ? Justifiez votre réponse (1 pt)</p><p>2. Identifiez l'agent pathogène responsable et son mode de transmission (1 pt)</p><p>3. Proposez deux mesures de prévention contre cette maladie (1 pt)</p></div>",
          "reponse": "<div style='padding: 10px; background-color: #e3f2fd; border-radius: 5px; color: #0d2b3e;'><p><strong>Corrigé :</strong></p><p>1. Il s'agit probablement du <strong>paludisme</strong> (ou malaria). Les symptômes (fièvre, frissons, maux de tête, douleurs musculaires) et le contexte (voyage en zone rurale, piqûres de moustiques) sont caractéristiques de cette maladie parasitaire.</p><p>2. L'agent pathogène est un <strong>protozoaire</strong> du genre <strong>Plasmodium</strong>. Il est transmis par la <strong>piqûre d'un moustique</strong> femelle du genre <strong>Anopheles</strong>.</p><p>3. Mesures de prévention : <strong>Utilisation de moustiquaires imprégnées d'insecticide</strong> pour se protéger des piqûres de moustiques, <strong>port de vêtements longs</strong> et utilisation de <strong>répulsifs anti-moustiques</strong>, <strong>élimination des eaux stagnantes</strong> (lieux de reproduction des moustiques), et <strong>chimioprophylaxie</strong> (prise de médicaments préventifs en zone à risque).</p></div>"
        },
        {
          "question": "<div style='margin-top: 15px; background-color: #fff; padding: 12px; border-radius: 8px; border-left: 5px solid #1565c0;'><p><strong>Exercice 6 : Synthèse (2 pts)</strong></p><p>En vous appuyant sur les connaissances acquises dans cette séquence, expliquez en quelques lignes le lien entre la dégradation de l'environnement (pollution des sols) et l'augmentation des maladies infectieuses.</p></div>",
          "reponse": "<div style='padding: 10px; background-color: #e3f2fd; border-radius: 5px; color: #0d2b3e;'><p><strong>Corrigé :</strong></p><p>La dégradation de l'environnement, notamment la <strong>pollution des sols</strong>, favorise l'augmentation des maladies infectieuses de plusieurs manières. Les sols pollués <strong>contaminent les eaux souterraines</strong> et les cultures, introduisant des agents pathogènes dans la chaîne alimentaire (fièvre typhoïde, choléra). La <strong>destruction des écosystèmes</strong> modifie les habitats des vecteurs (moustiques, tiques) et augmente leur contact avec les populations humaines, favorisant la transmission de maladies comme le paludisme. Les sols pollués et dégradés sont moins résilients face aux changements climatiques, ce qui aggrave les conditions favorables à la propagation des maladies. Protéger l'environnement est donc essentiel pour préserver la santé humaine.</p></div>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
