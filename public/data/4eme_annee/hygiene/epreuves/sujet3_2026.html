<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Hygiène",
  "classe": "4ème Année",
  "sequence": "Séquence 3",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Les micro-organismes et la contamination (5 points)",
      "points": "5 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; font-size: 1em; line-height: 1.6;'><p style='text-align: justify;'>Les micro-organismes sont des êtres vivants invisibles à l'œil nu qui peuplent notre environnement. Ils peuvent être bénéfiques ou pathogènes pour l'homme. Leur transmission se fait par différentes voies.</p><div style='background-color: #f8f9fa; padding: 12px; border-radius: 8px; margin: 15px 0; border-left: 4px solid #28a745;'><p style='margin: 0; color: #155724;'><strong>Document :</strong> Un élève de 4ème a observé au microscope des échantillons d'eau de rivière, de yaourt et de salive. Il a noté ses observations dans son cahier de laboratoire.</p></div></div>",
      "questions": [
        {
          "question": "<p><strong>1.</strong> Cite les quatre principaux groupes de micro-organismes que l'on peut rencontrer.</p>",
          "reponse": "<p>Les quatre principaux groupes de micro-organismes sont : les bactéries, les virus, les champignons microscopiques (moisissures et levures) et les parasites protozoaires.</p>"
        },
        {
          "question": "<p><strong>2.</strong> Distingue un micro-organisme pathogène d'un micro-organisme bénéfique en donnant un exemple pour chaque catégorie.</p>",
          "reponse": "<p>Un micro-organisme <strong>pathogène</strong> est un microbe qui provoque des maladies chez l'homme. <em>Exemple : Salmonella Typhi</em> qui cause la fièvre typhoïde. Un micro-organisme <strong>bénéfique</strong> est un microbe qui rend service à l'homme ou à l'environnement. <em>Exemple : les bactéries lactiques</em> qui permettent la fabrication du yaourt.</p>"
        },
        {
          "question": "<p><strong>3.</strong> Décris trois voies de transmission des micro-organismes pathogènes en les illustrant par un exemple pour chacune.</p>",
          "reponse": "<p>Les trois voies de transmission sont :</p><ul style='list-style-type:disc; padding-left:20px;'><li><strong>La voie aérienne</strong> : transmission par les gouttelettes de salive (ex : grippe).</li><li><strong>La voie digestive (fécale-orale)</strong> : transmission par ingestion d'aliments ou d'eau contaminés (ex : fièvre typhoïde).</li><li><strong>La voie sanguine</strong> : transmission par contact avec du sang contaminé (ex : VIH).</li></ul>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Prévention de la contamination (4 points)",
      "points": "4 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; font-size: 1em; line-height: 1.6;'><p style='text-align: justify;'>Pour éviter la contamination par les micro-organismes pathogènes, il existe des gestes simples appelés gestes barrières. Ces pratiques sont essentielles dans notre vie quotidienne, surtout en milieu scolaire.</p><div style='background-color: #fff3cd; padding: 12px; border-radius: 8px; margin: 15px 0; border-left: 4px solid #ffc107;'><p style='margin: 0; color: #856404;'><strong>Situation :</strong> Dans un collège de Yaoundé, plusieurs élèves ont contracté une infection digestive. L'enquête sanitaire a révélé que les élèves ne se lavaient pas les mains après être allés aux toilettes et avant de manger.</p></div></div>",
      "questions": [
        {
          "question": "<p><strong>1.</strong> Cite quatre gestes barrières que les élèves auraient dû adopter pour éviter cette contamination.</p>",
          "reponse": "<p>Les gestes barrières à adopter sont :</p><ul style='list-style-type:disc; padding-left:20px;'><li>Se laver les mains à l'eau et au savon après être allé aux toilettes.</li><li>Se laver les mains avant de manger ou de préparer les repas.</li><li>Utiliser des mouchoirs en papier à usage unique pour se moucher ou tousser.</li><li>Éviter de partager ses affaires personnelles (serviettes, gobelets).</li></ul>"
        },
        {
          "question": "<p><strong>2.</strong> Explique pourquoi le lavage des mains à l'eau et au savon est considéré comme l'un des gestes les plus efficaces pour prévenir la contamination.</p>",
          "reponse": "<p>Le lavage des mains à l'eau et au savon est efficace car le savon agit comme un tensioactif qui :</p><ul style='list-style-type:disc; padding-left:20px;'><li>Élimine les saletés qui retiennent les microbes.</li><li>Détruit la couche lipidique de certaines bactéries et virus.</li><li>Permet d'éliminer jusqu'à 99% des germes présents sur la peau. Il réduit donc considérablement le risque de transmission des maladies infectieuses.</li></ul>"
        },
        {
          "question": "<p><strong>3.</strong> Propose une campagne de sensibilisation que l'école pourrait mettre en place pour encourager les bonnes pratiques d'hygiène.</p>",
          "reponse": "<p>Une campagne de sensibilisation pourrait inclure :</p><ul style='list-style-type:disc; padding-left:20px;'><li>L'installation d'affiches dans les toilettes et la cantine rappelant les gestes d'hygiène.</li><li>L'organisation d'ateliers pratiques sur le lavage des mains avec du savon et du gel hydroalcoolique.</li><li>La mise en place de points d'eau avec savon dans la cour de l'école.</li><li>Des séances d'information sur les maladies liées au manque d'hygiène.</li></ul>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : La réponse immunitaire et le VIH/SIDA (7 points)",
      "points": "7 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; font-size: 1em; line-height: 1.6;'><p style='text-align: justify;'>Le système immunitaire est l'armée de notre corps. Il nous protège contre les agressions des micro-organismes pathogènes. Cependant, certains virus comme le VIH sont capables de le détruire.</p><div style='background-color: #d1ecf1; padding: 12px; border-radius: 8px; margin: 15px 0; border-left: 4px solid #17a2b8;'><p style='margin: 0; color: #0c5460;'><strong>Document :</strong> Le VIH (Virus de l'Immunodéficience Humaine) est un rétrovirus qui infecte spécifiquement les lymphocytes T4 (CD4+), des cellules clés du système immunitaire. Le SIDA (Syndrome d'Immunodéficience Acquise) est le stade avancé de l'infection.</p></div></div>",
      "questions": [
        {
          "question": "<p><strong>1.</strong> Décris le fonctionnement de la réponse immunitaire non spécifique (immunité innée) en citant ses principales barrières.</p>",
          "reponse": "<p>La réponse immunitaire non spécifique est la première ligne de défense de l'organisme. Elle est <strong>innée</strong> (présente dès la naissance) et <strong>non spécifique</strong> (elle agit contre tous les microbes, sans distinction). Ses principales barrières sont :</p><ul style='list-style-type:disc; padding-left:20px;'><li><strong>La peau</strong> : barrière physique imperméable.</li><li><strong>Les muqueuses</strong> : barrières physiques et chimiques (larmes, salive, mucus).</li><li><strong>Le pH acide de l'estomac</strong> : qui détruit les microbes ingérés.</li><li><strong>Les cellules phagocytaires</strong> : qui dévorent les microbes (macrophages, polynucléaires).</li></ul>"
        },
        {
          "question": "<p><strong>2.</strong> Décris le fonctionnement de la réponse immunitaire spécifique (immunité acquise) en expliquant son principe de mémoire.</p>",
          "reponse": "<p>La réponse immunitaire spécifique est une défense <strong>acquise</strong> et <strong>spécifique</strong> (elle cible un antigène précis). Elle met en jeu :</p><ul style='list-style-type:disc; padding-left:20px;'><li>Les <strong>lymphocytes B</strong> qui produisent des <strong>anticorps</strong> spécifiques pour neutraliser l'agent pathogène (immunité humorale).</li><li>Les <strong>lymphocytes T cytotoxiques</strong> qui détruisent les cellules infectées (immunité cellulaire).</li><li>Le principe de <strong>mémoire immunitaire</strong> : après une première infection, des lymphocytes mémoires restent dans l'organisme, assurant une protection rapide et efficace en cas de nouvelle rencontre avec le même agent pathogène.</li></ul>"
        },
        {
          "question": "<p><strong>3.</strong> Explique comment le VIH perturbe le système immunitaire de l'organisme.</p>",
          "reponse": "<p>Le VIH perturbe le système immunitaire de la manière suivante :</p><ul style='list-style-type:disc; padding-left:20px;'><li>Il infecte <strong>spécifiquement les lymphocytes T4 (CD4+)</strong>, qui sont les chefs d'orchestre de la réponse immunitaire.</li><li>Il se réplique à l'intérieur de ces cellules et les <strong>détruit</strong> progressivement.</li><li>La <strong>baisse du taux de CD4+</strong> affaiblit l'ensemble du système immunitaire : la production d'anticorps devient moins efficace et les autres cellules de défense sont moins actives.</li><li>L'organisme devient vulnérable aux <strong>infections opportunistes</strong> (tuberculose, pneumonie, candidose) qui ne surviennent pas chez les personnes à système immunitaire intact.</li></ul>"
        },
        {
          "question": "<p><strong>4.</strong> Cite les trois principales voies de transmission du VIH et les moyens de prévention pour chacune.</p>",
          "reponse": "<p>Les trois voies de transmission du VIH et leurs moyens de prévention sont :</p><ul style='list-style-type:disc; padding-left:20px;'><li><strong>Voie sexuelle</strong> (la plus fréquente) : utilisation systématique du préservatif lors des rapports sexuels.</li><li><strong>Voie sanguine</strong> : utilisation de matériel stérile à usage unique (seringues, aiguilles), dépistage des dons de sang.</li><li><strong>Voie verticale</strong> (mère-enfant) : dépistage des femmes enceintes, traitement antirétroviral pour réduire le risque de transmission, allaitement artificiel dans certains cas.</li></ul>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Les maladies parasitaires (Fièvres) (4 points)",
      "points": "4 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; font-size: 1em; line-height: 1.6;'><p style='text-align: justify;'>Au Cameroun, les maladies parasitaires comme le paludisme et la fièvre typhoïde sont des problèmes majeurs de santé publique. Elles touchent particulièrement les enfants et les populations vulnérables.</p><div style='background-color: #f8d7da; padding: 12px; border-radius: 8px; margin: 15px 0; border-left: 4px solid #dc3545;'><p style='margin: 0; color: #721c24;'><strong>Situation :</strong> Dans un village de la région de l'Extrême-Nord, plusieurs enfants présentent de la fièvre, des maux de tête intenses et des douleurs abdominales. Le centre de santé suspecte soit le paludisme, soit la fièvre typhoïde.</p></div></div>",
      "questions": [
        {
          "question": "<p><strong>1.</strong> Décris les agents pathogènes responsables du paludisme et de la fièvre typhoïde ainsi que leurs modes de transmission respectifs.</p>",
          "reponse": "<p><strong>Paludisme :</strong></p><ul style='list-style-type:disc; padding-left:20px;'><li><strong>Agent pathogène</strong> : parasite <em>Plasmodium</em> (principalement <em>Plasmodium falciparum</em>).</li><li><strong>Mode de transmission</strong> : vectoriel par la piqûre d'un moustique <em>Anopheles</em> femelle infecté.</li></ul><p><strong>Fièvre typhoïde :</strong></p><ul style='list-style-type:disc; padding-left:20px;'><li><strong>Agent pathogène</strong> : bactérie <em>Salmonella Typhi</em>.</li><li><strong>Mode de transmission</strong> : fécal-oral par ingestion d'eau ou d'aliments contaminés par des selles humaines.</li></ul>"
        },
        {
          "question": "<p><strong>2.</strong> Identifie les symptômes communs et les symptômes distinctifs de ces deux maladies.</p>",

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
