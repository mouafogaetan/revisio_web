<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Hygiène",
  "classe": "4ème Année",
  "sequence": "Séquence 2 : Éducation à la santé - Lutte contre les infections",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Les acteurs de la défense immunitaire",
      "points": "6 pts",
      "enonce": "<div style='padding: 10px; background-color: #f0f8ff; border-radius: 8px;'><p style='color: #1a237e; font-weight: bold;'>Document : Les cellules de l'immunité</p><p>Le système immunitaire est composé de plusieurs types de cellules qui agissent en coordination pour protéger l'organisme contre les infections.</p><ul style='color: #333;'><li><strong>Les macrophages</strong> : Ce sont des globules blancs qui engloutissent et digèrent les micro-organismes envahisseurs.</li><li><strong>Les lymphocytes T</strong> : Ils détruisent les cellules infectées et coordonnent la réponse immunitaire.</li><li><strong>Les lymphocytes B</strong> : Ils produisent des anticorps spécifiques qui neutralisent les agents pathogènes.</li></ul></div>",
      "questions": [
        {
          "question": "1) D'après le document, quel est le rôle des macrophages dans la réponse immunitaire ? (1 pt)",
          "reponse": "Les macrophages engloutissent et digèrent les micro-organismes envahisseurs."
        },
        {
          "question": "2) Nomme les deux types de lymphocytes mentionnés dans le document et précise le rôle de chacun. (2 pts)",
          "reponse": "Il y a les lymphocytes T qui détruisent les cellules infectées et coordonnent la réponse immunitaire, et les lymphocytes B qui produisent des anticorps spécifiques."
        },
        {
          "question": "3) Explique en quoi le rôle des lymphocytes B est spécifique. (1 pt)",
          "reponse": "Le rôle des lymphocytes B est spécifique car chaque lymphocyte B produit un anticorps adapté à un antigène particulier."
        },
        {
          "question": "4) Réponds par Vrai ou Faux et corrige si c'est faux. (2 pts)<br>a) Les macrophages font partie de l'immunité acquise.<br>b) Les anticorps sont produits par les lymphocytes T.",
          "reponse": "a) Faux. Les macrophages font partie de l'immunité innée (ou non-spécifique).<br>b) Faux. Les anticorps sont produits par les lymphocytes B."
        }
      ]
    },
    {
      "titre": "Exercice 2 : Le VIH, un virus qui affaiblit l'immunité",
      "points": "5 pts",
      "enonce": "<div style='padding: 10px; background-color: #fff5f5; border-radius: 8px; border-left: 4px solid #c62828;'><p style='color: #b71c1c; font-weight: bold;'>Situation : Le cas de Koffi</p><p>Koffi, 17 ans, vit à Douala. Il a eu des rapports sexuels non protégés et a appris qu'il est séropositif. Son médecin lui explique que le VIH (Virus de l'Immunodéficience Humaine) attaque spécifiquement les lymphocytes T.</p></div>",
      "questions": [
        {
          "question": "1) D'après la situation, quel est l'effet principal du VIH sur le système immunitaire de Koffi ? (1 pt)",
          "reponse": "Le VIH attaque et détruit spécifiquement les lymphocytes T."
        },
        {
          "question": "2) En t'aidant de l'exercice 1, explique pourquoi la destruction des lymphocytes T affaiblit gravement tout le système immunitaire. (2 pts)",
          "reponse": "Les lymphocytes T coordonnent la réponse immunitaire. S'ils sont détruits, les autres cellules (comme les lymphocytes B) ne reçoivent plus les signaux pour agir, rendant l'organisme incapable de lutter efficacement contre les infections."
        },
        {
          "question": "3) Sachant que Koffi a été contaminé par voie sexuelle, propose deux moyens de prévention efficaces contre la transmission du VIH. (2 pts)",
          "reponse": "Le port du préservatif lors des rapports sexuels, et le dépistage régulier pour connaître son statut et protéger ses partenaires."
        }
      ]
    },
    {
      "titre": "Exercice 3 : Les outils de la lutte contre les infections",
      "points": "5 pts",
      "enonce": "<div style='padding: 10px; background-color: #f5f5f5; border-radius: 8px;'><p>Réponds aux questions suivantes en exploitant tes connaissances.</p></div>",
      "questions": [
        {
          "question": "1) Définis ce qu'est une antibiothérapie. (1 pt)",
          "reponse": "L'antibiothérapie est l'utilisation d'antibiotiques pour traiter les infections bactériennes."
        },
        {
          "question": "2) Quelle est la différence entre la sérothérapie et la vaccinothérapie ? (2 pts)",
          "reponse": "La sérothérapie consiste à injecter des anticorps déjà formés pour une protection immédiate mais temporaire, tandis que la vaccinothérapie consiste à injecter un antigène pour stimuler la production d'anticorps par le corps, offrant une protection durable (mémoire immunitaire)."
        },
        {
          "question": "3) Explique le principe de la sérovaccinothérapie. Dans quel cas est-elle souvent utilisée ? (2 pts)",
          "reponse": "La sérovaccinothérapie combine l'injection d'anticorps (sérothérapie) et d'un vaccin. Elle est utilisée en cas d'urgence, par exemple après une morsure par un animal suspect de rage, pour apporter une protection immédiate tout en stimulant une immunité durable."
        }
      ]
    },
    {
      "titre": "Exercice 4 : Prévenir les infections parasitaires",
      "points": "4 pts",
      "enonce": "<div style='padding: 10px; background-color: #e8f5e9; border-radius: 8px;'><p style='color: #1b5e20; font-weight: bold;'>Document : Les maladies parasitaires</p><p>Au Cameroun, le paludisme et la fièvre typhoïde sont deux maladies parasitaires très répandues, mais leurs modes de transmission sont différents.</p><ul><li><strong>Paludisme</strong> : Transmis par la piqûre d'un moustique infecté.</li><li><strong>Fièvre typhoïde</strong> : Transmise par l'ingestion d'eau ou d'aliments souillés par des selles humaines.</li></ul></div>",
      "questions": [
        {
          "question": "1) En t'aidant du document, complète le tableau suivant. (2 pts)<br><br><table style='width:100%; border-collapse:collapse;'><tr style='background-color:#4CAF50; color:white;'><th style='padding:8px;border:1px solid #ddd;'>Maladie</th><th style='padding:8px;border:1px solid #ddd;'>Mode de transmission</th><th style='padding:8px;border:1px solid #ddd;'>Un moyen de prévention</th></tr><tr><td style='padding:8px;border:1px solid #ddd;'>Paludisme</td><td style='padding:8px;border:1px solid #ddd;'>Piqûre d'un moustique infecté</td><td style='padding:8px;border:1px solid #ddd;'>Dormir sous une moustiquaire imprégnée</td></tr><tr><td style='padding:8px;border:1px solid #ddd;'>Fièvre typhoïde</td><td style='padding:8px;border:1px solid #ddd;'>...</td><td style='padding:8px;border:1px solid #ddd;'>...</td></tr></table><br><i>NB : Tu dois écrire directement les réponses pour les cases vides.</i>",
          "reponse": "<table style='width:100%; border-collapse:collapse;'><tr style='background-color:#4CAF50; color:white;'><th style='padding:8px;border:1px solid #ddd;'>Maladie</th><th style='padding:8px;border:1px solid #ddd;'>Mode de transmission</th><th style='padding:8px;border:1px solid #ddd;'>Un moyen de prévention</th></tr><tr><td style='padding:8px;border:1px solid #ddd;'>Paludisme</td><td style='padding:8px;border:1px solid #ddd;'>Piqûre d'un moustique infecté</td><td style='padding:8px;border:1px solid #ddd;'>Dormir sous une moustiquaire imprégnée</td></tr><tr><td style='padding:8px;border:1px solid #ddd;'>Fièvre typhoïde</td><td style='padding:8px;border:1px solid #ddd;'>Ingestion d'eau ou d'aliments souillés</td><td style='padding:8px;border:1px solid #ddd;'>Boire de l'eau potable / Se laver les mains</td></tr></table>"
        },
        {
          "question": "2) En lien avec la prévention de la fièvre typhoïde, donne deux conseils d'hygiène à suivre au quotidien. (2 pts)",
          "reponse": "Il faut toujours se laver les mains avec du savon avant de manger et après être allé aux toilettes. Il faut aussi consommer de l'eau potable (bien bouillie ou traitée)."
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
