<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Hygiène",
  "classe": "4ème Année",
  "sequence": "Séquence 1",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Les micro-organismes et la contamination",
      "points": "6 pts",
      "enonce": "<div style='font-size: 1em; line-height: 1.6; color: #2c3e50;'>Cet exercice porte sur les micro-organismes et les voies de contamination. Lisez attentivement le texte ci-dessous et répondez aux questions.</div>",
      "questions": [
        {
          "question": "1) Citez deux types de micro-organismes pathogènes et précisez pour chacun une maladie qu'il peut provoquer.",
          "reponse": "<div style='background-color: #eaf2f8; padding: 10px; border-radius: 8px; color: #1a5276;'><strong>Éléments de correction :</strong><br>Les bactéries (ex : la fièvre typhoïde), les virus (ex : le VIH/SIDA), les parasites (ex : le paludisme), les champignons (ex : la candidose). L'élève doit en citer deux avec un exemple de maladie associée.</div>"
        },
        {
          "question": "2) Décrivez trois voies de transmission des micro-organismes en donnant un exemple pour chacune.",
          "reponse": "<div style='background-color: #eaf2f8; padding: 10px; border-radius: 8px; color: #1a5276;'><strong>Éléments de correction :</strong><br>1) Voie aérienne (ex : grippe) ; 2) Voie digestive (ex : choléra) ; 3) Voie cutanéo-muqueuse (ex : mycoses) ; 4) Voie sanguine (ex : VIH) ; 5) Voie sexuelle (ex : IST). L'élève doit en citer trois avec des exemples corrects.</div>"
        },
        {
          "question": "3) Expliquez pourquoi une mauvaise hygiène des mains favorise la contamination par les microbes.",
          "reponse": "<div style='background-color: #eaf2f8; padding: 10px; border-radius: 8px; color: #1a5276;'><strong>Éléments de correction :</strong><br>Les mains entrent en contact avec de nombreuses surfaces contaminées. Sans lavage, les microbes présents sur les mains sont transférés vers la bouche, les yeux ou les aliments, ce qui permet leur entrée dans l'organisme et provoque des infections. Le lavage des mains avec du savon est donc essentiel pour éliminer ces microbes [citation:2].</div>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : La réponse immunitaire et les moyens de lutte",
      "points": "6 pts",
      "enonce": "<div style='font-size: 1em; line-height: 1.6; color: #2c3e50;'>Cet exercice évalue vos connaissances sur le système immunitaire et les stratégies de lutte contre les infections.</div>",
      "questions": [
        {
          "question": "1) Distinguez l'immunité innée (non spécifique) de l'immunité acquise (spécifique) en citant une caractéristique pour chacune.",
          "reponse": "<div style='background-color: #eaf2f8; padding: 10px; border-radius: 8px; color: #1a5276;'><strong>Éléments de correction :</strong><br>L'immunité innée est présente dès la naissance et agit de manière non spécifique (ex : la peau, les phagocytes). L'immunité acquise se développe après un contact avec un antigène et est spécifique (ex : production d'anticorps par les lymphocytes B).</div>"
        },
        {
          "question": "2) Définissez ce qu'est un vaccin et expliquez son rôle dans la protection contre les maladies.",
          "reponse": "<div style='background-color: #eaf2f8; padding: 10px; border-radius: 8px; color: #1a5276;'><strong>Éléments de correction :</strong><br>Un vaccin est une préparation contenant des antigènes (microbes atténués ou inactivés) qui stimule le système immunitaire. Il permet à l'organisme de produire des anticorps et des cellules mémoires, assurant une protection durable contre une maladie spécifique sans provoquer la maladie.</div>"
        },
        {
          "question": "3) Quelle est la différence entre l'antibiothérapie et la sérothérapie ?",
          "reponse": "<div style='background-color: #eaf2f8; padding: 10px; border-radius: 8px; color: #1a5276;'><strong>Éléments de correction :</strong><br>L'antibiothérapie utilise des antibiotiques pour tuer ou bloquer les bactéries responsables d'une infection. La sérothérapie consiste à injecter des anticorps déjà formés pour neutraliser rapidement une toxine ou un microbe (ex : sérum antitétanique). L'antibiothérapie est curative tandis que la sérothérapie est un traitement d'urgence.</div>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Maladies parasitaires et pollution des sols",
      "points": "6 pts",
      "enonce": "<div style='font-size: 1em; line-height: 1.6; color: #2c3e50;'>Cet exercice traite des maladies parasitaires comme le paludisme et la fièvre typhoïde, ainsi que de la pollution des sols.</div>",
      "questions": [
        {
          "question": "1) Identifiez l'agent pathogène du paludisme et son mode de transmission.",
          "reponse": "<div style='background-color: #eaf2f8; padding: 10px; border-radius: 8px; color: #1a5276;'><strong>Éléments de correction :</strong><br>Le paludisme est causé par un parasite du genre <em>Plasmodium</em>. Il se transmet par la piqûre du moustique <em>Anopheles</em> (femelle).</div>"
        },
        {
          "question": "2) Décrivez les symptômes du paludisme et proposez deux moyens de prévention.",
          "reponse": "<div style='background-color: #eaf2f8; padding: 10px; border-radius: 8px; color: #1a5276;'><strong>Éléments de correction :</strong><br>Symptômes : fièvre élevée, frissons, sueurs abondantes, maux de tête, courbatures. Prévention : utilisation de moustiquaires imprégnées, lutte contre les gîtes larvaires, chimioprophylaxie.</div>"
        },
        {
          "question": "3) La fièvre typhoïde est une maladie bactérienne. Quelles mesures d'hygiène recommandez-vous pour prévenir sa transmission dans une communauté ?",
          "reponse": "<div style='background-color: #eaf2f8; padding: 10px; border-radius: 8px; color: #1a5276;'><strong>Éléments de correction :</strong><br>1) Assurer l'accès à l'eau potable (chloration, ébullition) ; 2) Promouvoir le lavage des mains au savon ; 3) Bien cuire les aliments ; 4) Éviter le rejet des eaux usées dans la nature ; 5) Vaccination contre la fièvre typhoïde.</div>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : L'appareil circulatoire et ses accidents",
      "points": "6 pts",
      "enonce": "<div style='font-size: 1em; line-height: 1.6; color: #2c3e50;'>Cet exercice porte sur l'appareil circulatoire, les hémorragies et les accidents cardiovasculaires.</div>",
      "questions": [
        {
          "question": "1) Citez les trois types de vaisseaux sanguins et décrivez leur fonction.",
          "reponse": "<div style='background-color: #eaf2f8; padding: 10px; border-radius: 8px; color: #1a5276;'><strong>Éléments de correction :</strong><br>Les artères (transportent le sang du cœur vers les organes), les veines (ramènent le sang des organes vers le cœur), les capillaires (permettent les échanges entre le sang et les tissus).</div>"
        },
        {
          "question": "2) Décrivez les gestes de premiers secours face à une hémorragie artérielle.",
          "reponse": "<div style='background-color: #eaf2f8; padding: 10px; border-radius: 8px; color: #1a5276;'><strong>Éléments de correction :</strong><br>1) Allonger la victime ; 2) Comprimer la plaie avec un tampon propre ; 3) Si le saignement persiste, comprimer l'artère contre l'os ; 4) Surélever le membre ; 5) Alerter les secours (15 ou 112).</div>"
        },
        {
          "question": "3) Identifiez trois facteurs de risque des accidents cardiovasculaires et proposez des moyens de prévention.",
          "reponse": "<div style='background-color: #eaf2f8; padding: 10px; border-radius: 8px; color: #1a5276;'><strong>Éléments de correction :</strong><br>Facteurs de risque : hypertension, tabagisme, diabète, cholestérol, obésité, sédentarité, stress. Prévention : alimentation équilibrée, activité physique régulière, arrêt du tabac, contrôle médical régulier.</div>"
        }
      ]
    },
    {
      "titre": "Exercice 5 : La pollution des sols",
      "points": "6 pts",
      "enonce": "<div style='font-size: 1em; line-height: 1.6; color: #2c3e50;'>Cet exercice aborde la pollution des sols, ses causes, ses conséquences et les moyens de lutte.</div>",
      "questions": [
        {
          "question": "1) Énumérez quatre causes de la pollution des sols.",
          "reponse": "<div style='background-color: #eaf2f8; padding: 10px; border-radius: 8px; color: #1a5276;'><strong>Éléments de correction :</strong><br>1) Déchets ménagers et plastiques ; 2) Engrais et pesticides chimiques ; 3) Déchets industriels ; 4) Eaux usées rejetées ; 5) Exploitation minière illégale.</div>"
        },
        {
          "question": "2) Expliquez comment la pollution des sols peut affecter la santé des populations.",
          "reponse": "<div style='background-color: #eaf2f8; padding: 10px; border-radius: 8px; color: #1a5276;'><strong>Éléments de correction :</strong><br>La pollution des sols entraîne la contamination des eaux souterraines, la baisse de la fertilité des sols, et la présence de substances toxiques dans les cultures. Les populations exposées peuvent développer des maladies digestives, des intoxications, des maladies de peau, des troubles neurologiques.</div>"
        },
        {
          "question": "3) Proposez trois solutions pour lutter contre la pollution des sols dans votre communauté.",
          "reponse": "<div style='background-color: #eaf2f8; padding: 10px; border-radius: 8px; color: #1a5276;'><strong>Éléments de correction :</strong><br>1) Mettre en place un système de collecte et de tri des déchets ; 2) Promouvoir l'utilisation d'engrais organiques (compost) ; 3) Construire des fosses septiques pour traiter les eaux usées ; 4) Sensibiliser la population aux risques de la pollution ; 5) Adopter des règles communautaires contre le dépôt sauvage de déchets.</div>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
