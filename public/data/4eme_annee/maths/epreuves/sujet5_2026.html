<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Mathématiques",
  "classe": "4ème Année",
  "sequence": "Séquence 5",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Nombres réels et radicaux",
      "points": "4 pts",
      "enonce": "<div style='background-color: #f8f9fa; padding: 15px; border-radius: 8px;'><p>Cet exercice permet d'évaluer la maîtrise des propriétés des radicaux et de la valeur absolue dans $\\mathbb{R}$.</p></div>",
      "questions": [
        {
          "question": "<p><strong>1. Simplification de radicaux (1.5 pts)</strong></p><div style='background-color: #e9ecef; padding: 10px; border-radius: 5px;'><p>Simplifie les expressions suivantes :</p><p>a) $\\sqrt{200} - \\sqrt{98} + \\sqrt{32}$</p><p>b) $(\\sqrt{3} - 2)^2$</p></div>",
          "reponse": "<div style='background-color: #d4edda; padding: 10px; border-radius: 5px;'><p><strong>Correction :</strong></p><p>a) $\\sqrt{200} = 10\\sqrt{2}$, $\\sqrt{98} = 7\\sqrt{2}$, $\\sqrt{32} = 4\\sqrt{2}$</p><p>$10\\sqrt{2} - 7\\sqrt{2} + 4\\sqrt{2} = 7\\sqrt{2}$</p><p>b) $(\\sqrt{3} - 2)^2 = (\\sqrt{3})^2 - 4\\sqrt{3} + 4 = 3 - 4\\sqrt{3} + 4 = 7 - 4\\sqrt{3}$</p></div>"
        },
        {
          "question": "<p><strong>2. Comparaison de nombres avec radicaux (1 pt)</strong></p><div style='background-color: #e9ecef; padding: 10px; border-radius: 5px;'><p>Compare les nombres suivants en justifiant :</p><p>$3\\sqrt{6}$ et $\\sqrt{54}$</p></div>",
          "reponse": "<div style='background-color: #d4edda; padding: 10px; border-radius: 5px;'><p><strong>Correction :</strong></p><p>$3\\sqrt{6} = \\sqrt{9 \\times 6} = \\sqrt{54}$</p><p>Donc $3\\sqrt{6} = \\sqrt{54}$.</p></div>"
        },
        {
          "question": "<p><strong>3. Valeur absolue (1.5 pts)</strong></p><div style='background-color: #e9ecef; padding: 10px; border-radius: 5px;'><p>a) Calcule $|3 - \\sqrt{2}|$.</p><p>b) Résous l'équation $|x - 2| = 5$.</p></div>",
          "reponse": "<div style='background-color: #d4edda; padding: 10px; border-radius: 5px;'><p><strong>Correction :</strong></p><p>a) $3 - \\sqrt{2} > 0$, donc $|3 - \\sqrt{2}| = 3 - \\sqrt{2}$.</p><p>b) $|x - 2| = 5 \\Rightarrow x - 2 = 5$ ou $x - 2 = -5$</p><p>$x = 7$ ou $x = -3$.</p><p>Les solutions sont $x = 7$ et $x = -3$.</p></div>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Calcul littéral et fractions rationnelles",
      "points": "4 pts",
      "enonce": "<div style='background-color: #f8f9fa; padding: 15px; border-radius: 8px;'><p>Cet exercice porte sur la reconnaissance et la manipulation des expressions algébriques.</p></div>",
      "questions": [
        {
          "question": "<p><strong>1. Reconnaître un monôme (1 pt)</strong></p><div style='background-color: #e9ecef; padding: 10px; border-radius: 5px;'><p>Parmi les expressions suivantes, lesquelles sont des monômes ? Justifie.</p><p>$5x^2$ ; $\\dfrac{3}{x}$ ; $-7xy$ ; $2\\sqrt{x}$</p></div>",
          "reponse": "<div style='background-color: #d4edda; padding: 10px; border-radius: 5px;'><p><strong>Correction :</strong></p><p>Les monômes sont : $5x^2$ et $-7xy$.</p><p>$\\dfrac{3}{x}$ n'est pas un monôme (exposant négatif).</p><p>$2\\sqrt{x}$ n'est pas un monôme (exposant fractionnaire).</p></div>"
        },
        {
          "question": "<p><strong>2. Simplification d'une fraction rationnelle (2 pts)</strong></p><div style='background-color: #e9ecef; padding: 10px; border-radius: 5px;'><p>Détermine la condition d'existence puis simplifie :</p><p>$\\dfrac{x^2 - 16}{x^2 - 6x + 8}$</p></div>",
          "reponse": "<div style='background-color: #d4edda; padding: 10px; border-radius: 5px;'><p><strong>Correction :</strong></p><p>Condition : $x^2 - 6x + 8 \\neq 0$</p><p>$x^2 - 6x + 8 = (x-2)(x-4)$</p><p>Donc $x \\neq 2$ et $x \\neq 4$.</p><p>Numérateur : $x^2 - 16 = (x-4)(x+4)$</p><p>$\\dfrac{x^2 - 16}{x^2 - 6x + 8} = \\dfrac{(x-4)(x+4)}{(x-2)(x-4)} = \\dfrac{x+4}{x-2}$ (pour $x \\neq 4$).</p></div>"
        },
        {
          "question": "<p><strong>3. Degré d'un polynôme (1 pt)</strong></p><div style='background-color: #e9ecef; padding: 10px; border-radius: 5px;'><p>Détermine le degré du polynôme $P(x) = 3x^4 - 2x^2 + 5$.</p></div>",
          "reponse": "<div style='background-color: #d4edda; padding: 10px; border-radius: 5px;'><p><strong>Correction :</strong></p><p>Le degré du polynôme est 4 (le plus grand exposant).</p></div>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Équations, inéquations et systèmes",
      "points": "5 pts",
      "enonce": "<div style='background-color: #f8f9fa; padding: 15px; border-radius: 8px;'><p>Résoudre des équations, des inéquations et des systèmes du premier degré.</p></div>",
      "questions": [
        {
          "question": "<p><strong>1. Résoudre une équation (1 pt)</strong></p><div style='background-color: #e9ecef; padding: 10px; border-radius: 5px;'><p>$5x - 3 = 2x + 9$</p></div>",
          "reponse": "<div style='background-color: #d4edda; padding: 10px; border-radius: 5px;'><p><strong>Correction :</strong></p><p>$5x - 2x = 9 + 3$</p><p>$3x = 12$</p><p>$x = 4$</p></div>"
        },
        {
          "question": "<p><strong>2. Résoudre une inéquation (1.5 pts)</strong></p><div style='background-color: #e9ecef; padding: 10px; border-radius: 5px;'><p>$\\dfrac{2x - 1}{3} \\leq \\dfrac{x + 2}{2}$</p></div>",
          "reponse": "<div style='background-color: #d4edda; padding: 10px; border-radius: 5px;'><p><strong>Correction :</strong></p><p>$\\dfrac{2x - 1}{3} \\leq \\dfrac{x + 2}{2}$</p><p>$2(2x - 1) \\leq 3(x + 2)$</p><p>$4x - 2 \\leq 3x + 6$</p><p>$4x - 3x \\leq 6 + 2$</p><p>$x \\leq 8$</p><p>Donc $S = ]-\\infty; 8]$</p></div>"
        },
        {
          "question": "<p><strong>3. Résoudre un système (1.5 pts)</strong></p><div style='background-color: #e9ecef; padding: 10px; border-radius: 5px;'><p>$\\begin{cases} 2x + 3y = 1 \\\\ x - 2y = 4 \\end{cases}$</p></div>",
          "reponse": "<div style='background-color: #d4edda; padding: 10px; border-radius: 5px;'><p><strong>Correction :</strong></p><p>De la seconde : $x = 2y + 4$.</p><p>On remplace dans la première : $2(2y + 4) + 3y = 1$</p><p>$4y + 8 + 3y = 1$</p><p>$7y = -7$</p><p>$y = -1$</p><p>$x = 2(-1) + 4 = -2 + 4 = 2$</p><p>La solution est $(2; -1)$.</p></div>"
        },
        {
          "question": "<p><strong>4. Problème concret (1 pt)</strong></p><div style='background-color: #e9ecef; padding: 10px; border-radius: 5px;'><p>Un élève a obtenu les notes suivantes : 12, 14, 11, 15. Quelle note doit-il obtenir au prochain devoir pour avoir une moyenne de 13 ?</p></div>",
          "reponse": "<div style='background-color: #d4edda; padding: 10px; border-radius: 5px;'><p><strong>Correction :</strong></p><p>Soit $x$ la note cherchée.</p><p>$\\dfrac{12 + 14 + 11 + 15 + x}{5} = 13$</p><p>$52 + x = 65$</p><p>$x = 13$</p><p>Il doit obtenir 13.</p></div>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Théorème de Thalès et applications",
      "points": "4 pts",
      "enonce": "<div style='background-color: #f8f9fa; padding: 15px; border-radius: 8px;'><p>Le théorème de Thalès permet de calculer des distances et de justifier des parallélismes.</p></div>",
      "questions": [
        {
          "question": "<p><strong>1. Calculer une distance (2 pts)</strong></p><div style='background-color: #e9ecef; padding: 10px; border-radius: 5px;'><p>Dans la figure ci-dessous, on a : $(MN) // (BC)$.</p><p>$AM = 5$ cm, $AB = 15$ cm, $AN = 6$ cm.</p><p>Calcule $AC$.</p></div>",
          "reponse": "<div style='background-color: #d4edda; padding: 10px; border-radius: 5px;'><p><strong>Correction :</strong></p><p>D'après le théorème de Thalès :</p><p>$\\dfrac{AM}{AB} = \\dfrac{AN}{AC}$</p><p>$\\dfrac{5}{15} = \\dfrac{6}{AC}$</p><p>$5 \\times AC = 15 \\times 6$</p><p>$5AC = 90$</p><p>$AC = 18$ cm.</p></div>"
        },
        {
          "question": "<p><strong>2. Justifier un parallélisme (2 pts)</strong></p><div style='background-color: #e9ecef; padding: 10px; border-radius: 5px;'><p>Dans la figure ci-dessous, on donne :</p><p>$AB = 8$ cm, $AC = 10$ cm, $AD = 4$ cm, $AE = 5$ cm.</p><p>Les points $B, A, D$ sont alignés et $C, A, E$ sont alignés.</p><p>Les droites $(BC)$ et $(DE)$ sont-elles parallèles ? Justifie.</p></div>",
          "reponse": "<div style='background-color: #d4edda; padding: 10px; border-radius: 5px;'><p><strong>Correction :</strong></p><p>On a : $\\dfrac{AB}{AD} = \\dfrac{8}{4} = 2$ et $\\dfrac{AC}{AE} = \\dfrac{10}{5} = 2$.</p><p>Donc $\\dfrac{AB}{AD} = \\dfrac{AC}{AE}$.</p><p>D'après la réciproque du théorème de Thalès, les droites $(BC)$ et $(DE)$ sont parallèles.</p></div>"
        }
      ]
    },
    {
      "titre": "Exercice 5 : Statistiques",
      "points": "3 pts",
      "enonce": "<div style='background-color: #f8f9fa; padding: 15px; border-radius: 8px;'><p>Organiser, représenter et interpréter des données statistiques.</p></div>",
      "questions": [
        {
          "question": "<p><strong>1. Tableau des effectifs et fréquences (1.5 pts)</strong></p><div style='background-color: #e9ecef; padding: 10px; border-radius: 5px;'><p>Voici les âges des élèves d'une classe :</p><p>13 - 14 - 13 - 15 - 14 - 13 - 16 - 14 - 15 - 13 - 14 - 16 - 13 - 14 - 15</p><p>a) Construis le tableau des effectifs.</p><p>b) Calcule les fréquences en pourcentage.</p></div>",
          "reponse": "<div style='background-color: #d4edda; padding: 10px; border-radius: 5px;'><p><strong>Correction :</strong></p><p>Effectifs : 13:5, 14:5, 15:3, 16:2.</p><p>Fréquences : 13:33.3%, 14:33.3%, 15:20%, 16:13.3%.</p></div>"
        },
        {
          "question": "<p><strong>2. Moyenne et mode (1.5 pts)</strong></p><div style='background-color: #e9ecef; padding: 10px; border-radius: 5px;'><p>Calcule la moyenne de cette série et détermine le mode.</p></div>",
          "reponse": "<div style='background-color: #d4edda; padding: 10px; border-radius: 5px;'><p><strong>Correction :</strong></p><p>Moyenne : $\\dfrac{13\\times5 + 14\\times5 + 15\\times3 + 16\\times2}{15}$</p><p>$= \\dfrac{65 + 70 + 45 + 32}{15} = \\dfrac{212}{15} \\approx 14,13$</p><p>Le mode est 13 et 14 (valeurs les plus fréquentes, 5 occurrences chacune).</p></div>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
