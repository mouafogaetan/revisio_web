<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Mathématiques",
  "classe": "4ème Année",
  "sequence": "Séquence 3",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Coordonnées de vecteurs",
      "points": "4 pts",
      "enonce": "<div style='background-color: #f8f9fa; padding: 15px; border-radius: 8px;'><p>Dans un repère orthonormé $(O, \\vec{i}, \\vec{j})$, on donne les points $A(2; 1)$, $B(5; 4)$ et $C(1; 3)$.</p><p>Cet exercice permet d'évaluer la maîtrise des coordonnées de vecteurs.</p></div>",
      "questions": [
        {
          "question": "<p><strong>1. Calculer les coordonnées d'un vecteur (1 pt)</strong></p><div style='background-color: #e9ecef; padding: 10px; border-radius: 5px;'><p>Calcule les coordonnées des vecteurs $\\overrightarrow{AB}$ et $\\overrightarrow{AC}$.</p></div>",
          "reponse": "<div style='background-color: #d4edda; padding: 10px; border-radius: 5px;'><p><strong>Correction :</strong></p><p>$\\overrightarrow{AB} = (5-2; 4-1) = (3; 3)$</p><p>$\\overrightarrow{AC} = (1-2; 3-1) = (-1; 2)$</p></div>"
        },
        {
          "question": "<p><strong>2. Somme de vecteurs (1 pt)</strong></p><div style='background-color: #e9ecef; padding: 10px; border-radius: 5px;'><p>Calcule les coordonnées du vecteur $\\vec{u} = \\overrightarrow{AB} + \\overrightarrow{AC}$.</p></div>",
          "reponse": "<div style='background-color: #d4edda; padding: 10px; border-radius: 5px;'><p><strong>Correction :</strong></p><p>$\\vec{u} = (3 + (-1); 3 + 2) = (2; 5)$</p></div>"
        },
        {
          "question": "<p><strong>3. Multiplication d'un vecteur par un réel (1 pt)</strong></p><div style='background-color: #e9ecef; padding: 10px; border-radius: 5px;'><p>Calcule les coordonnées du vecteur $\\vec{v} = 2\\overrightarrow{AB}$.</p></div>",
          "reponse": "<div style='background-color: #d4edda; padding: 10px; border-radius: 5px;'><p><strong>Correction :</strong></p><p>$\\vec{v} = 2 \\times (3; 3) = (6; 6)$</p></div>"
        },
        {
          "question": "<p><strong>4. Colinéarité de vecteurs (1 pt)</strong></p><div style='background-color: #e9ecef; padding: 10px; border-radius: 5px;'><p>Les vecteurs $\\vec{w}(2; 4)$ et $\\overrightarrow{AB}$ sont-ils colinéaires ? Justifie.</p></div>",
          "reponse": "<div style='background-color: #d4edda; padding: 10px; border-radius: 5px;'><p><strong>Correction :</strong></p><p>$\\vec{w}(2; 4)$ et $\\overrightarrow{AB}(3; 3)$.</p><p>On a $\\dfrac{2}{3} \\neq \\dfrac{4}{3}$, donc les vecteurs ne sont pas colinéaires.</p></div>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Orthogonalité et norme de vecteurs",
      "points": "4 pts",
      "enonce": "<div style='background-color: #f8f9fa; padding: 15px; border-radius: 8px;'><p>Soient les vecteurs $\\vec{u}(3; -1)$ et $\\vec{v}(2; 6)$.</p></div>",
      "questions": [
        {
          "question": "<p><strong>1. Orthogonalité (1.5 pts)</strong></p><div style='background-color: #e9ecef; padding: 10px; border-radius: 5px;'><p>Montre que les vecteurs $\\vec{u}$ et $\\vec{v}$ sont orthogonaux.</p></div>",
          "reponse": "<div style='background-color: #d4edda; padding: 10px; border-radius: 5px;'><p><strong>Correction :</strong></p><p>Deux vecteurs $\\vec{u}(x; y)$ et $\\vec{v}(x'; y')$ sont orthogonaux si $xx' + yy' = 0$.</p><p>$3 \\times 2 + (-1) \\times 6 = 6 - 6 = 0$.</p><p>Donc les vecteurs sont orthogonaux.</p></div>"
        },
        {
          "question": "<p><strong>2. Norme d'un vecteur (1.5 pts)</strong></p><div style='background-color: #e9ecef; padding: 10px; border-radius: 5px;'><p>Calcule la norme des vecteurs $\\vec{u}$ et $\\vec{v}$.</p></div>",
          "reponse": "<div style='background-color: #d4edda; padding: 10px; border-radius: 5px;'><p><strong>Correction :</strong></p><p>$||\\vec{u}|| = \\sqrt{3^2 + (-1)^2} = \\sqrt{9 + 1} = \\sqrt{10}$.</p><p>$||\\vec{v}|| = \\sqrt{2^2 + 6^2} = \\sqrt{4 + 36} = \\sqrt{40} = 2\\sqrt{10}$.</p></div>"
        },
        {
          "question": "<p><strong>3. Distance entre deux points (1 pt)</strong></p><div style='background-color: #e9ecef; padding: 10px; border-radius: 5px;'><p>Soit $M(2; 3)$ et $N(6; 0)$. Calcule la distance $MN$.</p></div>",
          "reponse": "<div style='background-color: #d4edda; padding: 10px; border-radius: 5px;'><p><strong>Correction :</strong></p><p>$MN = \\sqrt{(6-2)^2 + (0-3)^2} = \\sqrt{4^2 + (-3)^2} = \\sqrt{16 + 9} = \\sqrt{25} = 5$.</p></div>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Équations de droites",
      "points": "5 pts",
      "enonce": "<div style='background-color: #f8f9fa; padding: 15px; border-radius: 8px;'><p>Dans un repère orthonormé, on donne les points $A(-1; 2)$ et $B(3; 4)$.</p></div>",
      "questions": [
        {
          "question": "<p><strong>1. Équation cartésienne d'une droite définie par deux points (2 pts)</strong></p><div style='background-color: #e9ecef; padding: 10px; border-radius: 5px;'><p>Détermine l'équation cartésienne de la droite $(AB)$.</p></div>",
          "reponse": "<div style='background-color: #d4edda; padding: 10px; border-radius: 5px;'><p><strong>Correction :</strong></p><p>$\\overrightarrow{AB} = (3-(-1); 4-2) = (4; 2)$.</p><p>Un vecteur directeur est $\\vec{u}(4; 2)$ ou $(2; 1)$.</p><p>L'équation est de la forme $x - 2y + c = 0$ (car avec $(2;1)$, on a $-1 \\times x + 2 \\times y + c = 0$).</p><p>En utilisant $A(-1; 2)$ : $-1 - 2 \\times 2 + c = 0 \\Rightarrow -1 - 4 + c = 0 \\Rightarrow c = 5$.</p><p>L'équation est $-x - 2y + 5 = 0$ ou $x + 2y - 5 = 0$.</p></div>"
        },
        {
          "question": "<p><strong>2. Vecteur directeur et coefficient directeur (1.5 pts)</strong></p><div style='background-color: #e9ecef; padding: 10px; border-radius: 5px;'><p>Détermine un vecteur directeur et le coefficient directeur de la droite $(AB)$.</p></div>",
          "reponse": "<div style='background-color: #d4edda; padding: 10px; border-radius: 5px;'><p><strong>Correction :</strong></p><p>Un vecteur directeur est $\\vec{u}(2; 1)$.</p><p>Le coefficient directeur est $m = \\dfrac{y_B - y_A}{x_B - x_A} = \\dfrac{4-2}{3-(-1)} = \\dfrac{2}{4} = \\dfrac{1}{2}$.</p></div>"
        },
        {
          "question": "<p><strong>3. Point d'intersection de deux droites (1.5 pts)</strong></p><div style='background-color: #e9ecef; padding: 10px; border-radius: 5px;'><p>Soit $(D)$ la droite d'équation $y = -2x + 3$.</p><p>Détermine le point d'intersection des droites $(AB)$ et $(D)$.</p></div>",
          "reponse": "<div style='background-color: #d4edda; padding: 10px; border-radius: 5px;'><p><strong>Correction :</strong></p><p>$(AB)$ a pour équation réduite $y = \\dfrac{1}{2}x - \\dfrac{5}{2}$.</p><p>On résout : $\\begin{cases} y = \\dfrac{1}{2}x - \\dfrac{5}{2} \\\\ y = -2x + 3 \\end{cases}$</p><p>$\\dfrac{1}{2}x - \\dfrac{5}{2} = -2x + 3$</p><p>$\\dfrac{1}{2}x + 2x = 3 + \\dfrac{5}{2}$</p><p>$\\dfrac{5}{2}x = \\dfrac{11}{2}$</p><p>$x = \\dfrac{11}{5}$.</p><p>$y = -2 \\times \\dfrac{11}{5} + 3 = -\\dfrac{22}{5} + \\dfrac{15}{5} = -\\dfrac{7}{5}$.</p><p>Le point d'intersection est $I\\left(\\dfrac{11}{5}; -\\dfrac{7}{5}\\right)$.</p></div>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Parallélisme et perpendicularité de droites",
      "points": "3 pts",
      "enonce": "<div style='background-color: #f8f9fa; padding: 15px; border-radius: 8px;'><p>On considère les droites $(D_1)$: $2x - 3y + 4 = 0$ et $(D_2)$: $y = \\dfrac{2}{3}x - 1$.</p></div>",
      "questions": [
        {
          "question": "<p><strong>1. Parallélisme (1.5 pts)</strong></p><div style='background-color: #e9ecef; padding: 10px; border-radius: 5px;'><p>Les droites $(D_1)$ et $(D_2)$ sont-elles parallèles ? Justifie.</p></div>",
          "reponse": "<div style='background-color: #d4edda; padding: 10px; border-radius: 5px;'><p><strong>Correction :</strong></p><p>$(D_1)$: $2x - 3y + 4 = 0 \\Rightarrow -3y = -2x - 4 \\Rightarrow y = \\dfrac{2}{3}x + \\dfrac{4}{3}$.</p><p>Le coefficient directeur de $(D_1)$ est $m_1 = \\dfrac{2}{3}$.</p><p>Le coefficient directeur de $(D_2)$ est $m_2 = \\dfrac{2}{3}$.</p><p>Les coefficients directeurs sont égaux, donc les droites sont parallèles.</p></div>"
        },
        {
          "question": "<p><strong>2. Perpendicularité (1.5 pts)</strong></p><div style='background-color: #e9ecef; padding: 10px; border-radius: 5px;'><p>La droite $(D_3)$ d'équation $y = -\\dfrac{3}{2}x + 5$ est-elle perpendiculaire à $(D_1)$ ? Justifie.</p></div>",
          "reponse": "<div style='background-color: #d4edda; padding: 10px; border-radius: 5px;'><p><strong>Correction :</strong></p><p>Le coefficient directeur de $(D_1)$ est $m_1 = \\dfrac{2}{3}$.</p><p>Le coefficient directeur de $(D_3)$ est $m_3 = -\\dfrac{3}{2}$.</p><p>On a $m_1 \\times m_3 = \\dfrac{2}{3} \\times \\left(-\\dfrac{3}{2}\\right) = -1$.</p><p>Le produit des coefficients directeurs est $-1$, donc les droites sont perpendiculaires.</p></div>"
        }
      ]
    },
    {
      "titre": "Exercice 5 : Relations métriques dans le triangle rectangle",
      "points": "4 pts",
      "enonce": "<div style='background-color: #f8f9fa; padding: 15px; border-radius: 8px;'><p>Dans un triangle $ABC$ rectangle en $A$, on a : $AB = 6$ cm, $AC = 8$ cm.</p><p>On note $H$ le pied de la hauteur issue de $A$ sur l'hypoténuse $BC$.</p></div>",
      "questions": [
        {
          "question": "<p><strong>1. Calcul de l'hypoténuse (1 pt)</strong></p><div style='background-color: #e9ecef; padding: 10px; border-radius: 5px;'><p>Calcule la longueur $BC$.</p></div>",
          "reponse": "<div style='background-color: #d4edda; padding: 10px; border-radius: 5px;'><p><strong>Correction :</strong></p><p>D'après le théorème de Pythagore :</p><p>$BC^2 = AB^2 + AC^2 = 6^2 + 8^2 = 36 + 64 = 100$.</p><p>$BC = 10$ cm.</p></div>"
        },
        {
          "question": "<p><strong>2. Relation métrique (1.5 pts)</strong></p><div style='background-color: #e9ecef; padding: 10px; border-radius: 5px;'><p>Calcule la longueur $AH$ (hauteur issue de $A$).</p></div>",
          "reponse": "<div style='background-color: #d4edda; padding: 10px; border-radius: 5px;'><p><strong>Correction :</strong></p><p>Dans un triangle rectangle, on a la relation : $AB \\times AC = AH \\times BC$.</p><p>$6 \\times 8 = AH \\times 10$</p><p>$48 = 10AH$</p><p>$AH = 4,8$ cm.</p></div>"
        },
        {
          "question": "<p><strong>3. Projections des côtés de l'angle droit (1.5 pts)</strong></p><div style='background-color: #e9ecef; padding: 10px; border-radius: 5px;'><p>Calcule les longueurs $BH$ et $CH$.</p></div>",
          "reponse": "<div style='background-color: #d4edda; padding: 10px; border-radius: 5px;'><p><strong>Correction :</strong></p><p>On utilise la projection : $AB^2 = BH \\times BC$.</p><p>$6^2 = BH \\times 10 \\Rightarrow 36 = 10BH \\Rightarrow BH = 3,6$ cm.</p><p>$AC^2 = CH \\times BC$.</p><p>$8^2 = CH \\times 10 \\Rightarrow 64 = 10CH \\Rightarrow CH = 6,4$ cm.</p></div>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
