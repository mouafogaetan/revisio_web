<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Mathématiques",
  "classe": "4ème Année",
  "sequence": "Séquence 1",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Nombres réels et radicaux",
      "points": "4 pts",
      "enonce": "<div style='background-color: #f8f9fa; padding: 15px; border-radius: 8px;'><p>Cet exercice permet d'évaluer la maîtrise des propriétés des radicaux et la manipulation des nombres réels.</p></div>",
      "questions": [
        {
          "question": "<p><strong>1. Simplification de radicaux (2 pts)</strong></p><p>Simplifie les expressions suivantes en utilisant les propriétés des racines carrées.</p><div style='background-color: #e9ecef; padding: 10px; border-radius: 5px;'><p>a) $\\sqrt{72}$</p><p>b) $\\sqrt{48} + \\sqrt{27}$</p><p>c) $\\sqrt{50} \\times \\sqrt{2}$</p><p>d) $\\dfrac{\\sqrt{128}}{\\sqrt{8}}$</p></div>",
          "reponse": "<div style='background-color: #d4edda; padding: 10px; border-radius: 5px;'><p><strong>Correction :</strong></p><p>a) $\\sqrt{72} = \\sqrt{36 \\times 2} = 6\\sqrt{2}$</p><p>b) $\\sqrt{48} + \\sqrt{27} = \\sqrt{16 \\times 3} + \\sqrt{9 \\times 3} = 4\\sqrt{3} + 3\\sqrt{3} = 7\\sqrt{3}$</p><p>c) $\\sqrt{50} \\times \\sqrt{2} = \\sqrt{100} = 10$</p><p>d) $\\dfrac{\\sqrt{128}}{\\sqrt{8}} = \\sqrt{\\dfrac{128}{8}} = \\sqrt{16} = 4$</p></div>"
        },
        {
          "question": "<p><strong>2. Comparaison de nombres avec radicaux (1 pt)</strong></p><p>Compare les nombres suivants en justifiant ta réponse.</p><div style='background-color: #e9ecef; padding: 10px; border-radius: 5px;'><p>$3\\sqrt{5}$ et $\\sqrt{45}$</p></div>",
          "reponse": "<div style='background-color: #d4edda; padding: 10px; border-radius: 5px;'><p><strong>Correction :</strong></p><p>$3\\sqrt{5} = \\sqrt{9 \\times 5} = \\sqrt{45}$</p><p>Donc $3\\sqrt{5} = \\sqrt{45}$.</p></div>"
        },
        {
          "question": "<p><strong>3. Opérations sur les radicaux (1 pt)</strong></p><p>Effectue les opérations suivantes.</p><div style='background-color: #e9ecef; padding: 10px; border-radius: 5px;'><p>$(\\sqrt{3} + 2)^2$</p></div>",
          "reponse": "<div style='background-color: #d4edda; padding: 10px; border-radius: 5px;'><p><strong>Correction :</strong></p><p>$(\\sqrt{3} + 2)^2 = (\\sqrt{3})^2 + 2 \\times \\sqrt{3} \\times 2 + 2^2 = 3 + 4\\sqrt{3} + 4 = 7 + 4\\sqrt{3}$</p></div>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Calcul littéral",
      "points": "4 pts",
      "enonce": "<div style='background-color: #f8f9fa; padding: 15px; border-radius: 8px;'><p>Cet exercice porte sur la reconnaissance et la manipulation des monômes, polynômes et fractions rationnelles.</p></div>",
      "questions": [
        {
          "question": "<p><strong>1. Reconnaître un monôme (1 pt)</strong></p><p>Parmi les expressions suivantes, lesquelles sont des monômes ? Justifie ta réponse.</p><div style='background-color: #e9ecef; padding: 10px; border-radius: 5px;'><p>$3x^2$ ; $\\dfrac{5}{x}$ ; $-2xy$ ; $\\sqrt{x}$</p></div>",
          "reponse": "<div style='background-color: #d4edda; padding: 10px; border-radius: 5px;'><p><strong>Correction :</strong></p><p>Les monômes sont : $3x^2$ et $-2xy$.</p><p>$\\dfrac{5}{x}$ n'est pas un monôme car l'exposant de la variable est négatif.</p><p>$\\sqrt{x}$ n'est pas un monôme car l'exposant n'est pas un entier naturel.</p></div>"
        },
        {
          "question": "<p><strong>2. Simplifier une fraction rationnelle (2 pts)</strong></p><p>Détermine la condition d'existence puis simplifie la fraction rationnelle suivante.</p><div style='background-color: #e9ecef; padding: 10px; border-radius: 5px;'><p>$\\dfrac{x^2 - 4}{x^2 - 5x + 6}$</p></div>",
          "reponse": "<div style='background-color: #d4edda; padding: 10px; border-radius: 5px;'><p><strong>Correction :</strong></p><p>Condition d'existence : $x^2 - 5x + 6 \\neq 0$</p><p>On factorise : $x^2 - 5x + 6 = (x-2)(x-3)$</p><p>Donc $x \\neq 2$ et $x \\neq 3$.</p><p>Factorisation du numérateur : $x^2 - 4 = (x-2)(x+2)$</p><p>$\\dfrac{x^2 - 4}{x^2 - 5x + 6} = \\dfrac{(x-2)(x+2)}{(x-2)(x-3)} = \\dfrac{x+2}{x-3}$ (pour $x \\neq 2$).</p></div>"
        },
        {
          "question": "<p><strong>3. Déterminer le degré d'un polynôme (1 pt)</strong></p><p>Détermine le degré du polynôme suivant.</p><div style='background-color: #e9ecef; padding: 10px; border-radius: 5px;'><p>$P(x) = 5x^4 - 3x^2 + 2x - 7$</p></div>",
          "reponse": "<div style='background-color: #d4edda; padding: 10px; border-radius: 5px;'><p><strong>Correction :</strong></p><p>Le degré du polynôme $P$ est 4 (le plus grand exposant de $x$).</p></div>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Équations et inéquations du premier degré",
      "points": "5 pts",
      "enonce": "<div style='background-color: #f8f9fa; padding: 15px; border-radius: 8px;'><p>Résoudre des équations, des inéquations et des systèmes du premier degré.</p></div>",
      "questions": [
        {
          "question": "<p><strong>1. Résoudre une équation (1.5 pts)</strong></p><div style='background-color: #e9ecef; padding: 10px; border-radius: 5px;'><p>$3x - 5 = 2x + 7$</p></div>",
          "reponse": "<div style='background-color: #d4edda; padding: 10px; border-radius: 5px;'><p><strong>Correction :</strong></p><p>$3x - 5 = 2x + 7$</p><p>$3x - 2x = 7 + 5$</p><p>$x = 12$</p></div>"
        },
        {
          "question": "<p><strong>2. Résoudre une inéquation (1.5 pts)</strong></p><div style='background-color: #e9ecef; padding: 10px; border-radius: 5px;'><p>$4x - 3 \\leq 2x + 9$</p></div>",
          "reponse": "<div style='background-color: #d4edda; padding: 10px; border-radius: 5px;'><p><strong>Correction :</strong></p><p>$4x - 3 \\leq 2x + 9$</p><p>$4x - 2x \\leq 9 + 3$</p><p>$2x \\leq 12$</p><p>$x \\leq 6$</p><p>Donc $S = ]-\\infty; 6]$</p></div>"
        },
        {
          "question": "<p><strong>3. Résoudre un système (2 pts)</strong></p><div style='background-color: #e9ecef; padding: 10px; border-radius: 5px;'><p>$\\begin{cases} 2x + y = 7 \\\\ x - y = 2 \\end{cases}$</p></div>",
          "reponse": "<div style='background-color: #d4edda; padding: 10px; border-radius: 5px;'><p><strong>Correction :</strong></p><p>Par substitution :</p><p>$x - y = 2 \\Rightarrow x = y + 2$</p><p>On remplace dans la première : $2(y+2) + y = 7$</p><p>$2y + 4 + y = 7$</p><p>$3y + 4 = 7$</p><p>$3y = 3$</p><p>$y = 1$</p><p>$x = 1 + 2 = 3$</p><p>La solution est $(3; 1)$.</p></div>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Théorème de Thalès",
      "points": "4 pts",
      "enonce": "<div style='background-color: #f8f9fa; padding: 15px; border-radius: 8px;'><p>Utiliser le théorème de Thalès pour calculer une distance.</p></div>",
      "questions": [
        {
          "question": "<p><strong>Application directe du théorème de Thalès</strong></p><div style='background-color: #e9ecef; padding: 10px; border-radius: 5px;'><p>Dans la figure ci-dessous, on a : $(MN) // (BC)$.</p><p>$AM = 4$ cm, $AB = 12$ cm, $AN = 6$ cm.</p><p>Calcule $AC$.</p></div>",
          "reponse": "<div style='background-color: #d4edda; padding: 10px; border-radius: 5px;'><p><strong>Correction :</strong></p><p>D'après le théorème de Thalès :</p><p>$\\dfrac{AM}{AB} = \\dfrac{AN}{AC}$</p><p>$\\dfrac{4}{12} = \\dfrac{6}{AC}$</p><p>$4 \\times AC = 12 \\times 6$</p><p>$4AC = 72$</p><p>$AC = 18$ cm.</p></div>"
        }
      ]
    },
    {
      "titre": "Exercice 5 : Statistiques",
      "points": "3 pts",
      "enonce": "<div style='background-color: #f8f9fa; padding: 15px; border-radius: 8px;'><p>Organiser, représenter et interpréter des données statistiques.</p></div>",
      "questions": [
        {
          "question": "<p><strong>Calcul de la moyenne et du mode</strong></p><div style='background-color: #e9ecef; padding: 10px; border-radius: 5px;'><p>Voici les notes d'un élève en mathématiques :</p><p>12 - 14 - 11 - 15 - 12 - 18 - 10 - 14 - 12 - 16</p><p>Calcule la moyenne de cette série et détermine son mode.</p></div>",
          "reponse": "<div style='background-color: #d4edda; padding: 10px; border-radius: 5px;'><p><strong>Correction :</strong></p><p>Moyenne :</p><p>$\\dfrac{12+14+11+15+12+18+10+14+12+16}{10} = \\dfrac{134}{10} = 13,4$</p><p>La note 12 apparaît 3 fois, c'est la valeur la plus fréquente.</p><p>Le mode est 12.</p></div>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
