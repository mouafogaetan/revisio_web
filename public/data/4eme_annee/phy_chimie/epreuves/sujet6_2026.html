<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Physique-Chimie",
  "classe": "4ème année",
  "sequence": "Évaluation Séquentielle n°6",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Les hydrocarbures et la métallurgie",
      "points": "5 pts",
      "enonce": "<div style='font-size: 1em; line-height: 1.6; color: #1a1a2e;'>Cet exercice aborde la structure des alcanes, des alcènes et des alcynes, ainsi que les principes de la métallurgie.</div>",
      "questions": [
        {
          "question": "<div style='margin: 10px 0;'><strong>1.1 (1 pt)</strong> Les alcanes sont des hydrocarbures saturés. Donnez leur formule générale et celle des alcènes et des alcynes.</div>",
          "reponse": "<div style='padding: 12px; background-color: #eef2f7; border-radius: 8px; color: #1a2b4c;'>- Alcanes (saturés) : C<sub>n</sub>H<sub>2n+2</sub><br>- Alcènes (insaturés, une double liaison) : C<sub>n</sub>H<sub>2n</sub><br>- Alcynes (insaturés, une triple liaison) : C<sub>n</sub>H<sub>2n-2</sub></div>"
        },
        {
          "question": "<div style='margin: 10px 0;'><strong>1.2 (1 pt)</strong> Nommez les alcanes suivants selon la nomenclature IUPAC :<br>a) CH<sub>3</sub>-CH<sub>2</sub>-CH<sub>3</sub><br>b) CH<sub>3</sub>-CH<sub>2</sub>-CH<sub>2</sub>-CH<sub>3</sub></div>",
          "reponse": "<div style='padding: 12px; background-color: #eef2f7; border-radius: 8px; color: #1a2b4c;'>a) Propane (3 atomes de carbone)<br>b) Butane (4 atomes de carbone)</div>"
        },
        {
          "question": "<div style='margin: 10px 0;'><strong>1.3 (1 pt)</strong> La métallurgie est la science qui traite de l'extraction des métaux à partir de leurs minerais. Citez les trois principaux procédés métallurgiques et donnez un exemple pour chacun.</div>",
          "reponse": "<div style='padding: 12px; background-color: #eef2f7; border-radius: 8px; color: #1a2b4c;'>1. <strong>Pyrométallurgie</strong> : traitement par la chaleur (ex : extraction du fer dans un haut-fourneau).<br>2. <strong>Hydrométallurgie</strong> : traitement par des solutions aqueuses (ex : extraction du cuivre par l'acide sulfurique).<br>3. <strong>Électrométallurgie</strong> : traitement par électrolyse (ex : extraction de l'aluminium).</div>"
        },
        {
          "question": "<div style='margin: 10px 0;'><strong>1.4 (1 pt)</strong> Écrivez la demi-équation d'oxydoréduction pour le couple Fe<sup>2+</sup>/Fe.</div>",
          "reponse": "<div style='padding: 12px; background-color: #eef2f7; border-radius: 8px; color: #1a2b4c;'>Fe<sup>2+</sup> + 2e<sup>−</sup> ⇌ Fe</div>"
        },
        {
          "question": "<div style='margin: 10px 0;'><strong>1.5 (1 pt)</strong> Expliquez pourquoi les alcènes et les alcynes sont plus réactifs que les alcanes.</div>",
          "reponse": "<div style='padding: 12px; background-color: #eef2f7; border-radius: 8px; color: #1a2b4c;'>Les alcènes et les alcynes possèdent des liaisons multiples (double ou triple liaison C=C ou C≡C) qui sont des zones riches en électrons. Ces liaisons sont plus réactives et peuvent être facilement cassées pour former de nouvelles liaisons (réaction d'addition), contrairement aux alcanes qui n'ont que des liaisons simples C-C.</div>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Dipôle générateur et composants électroniques",
      "points": "4 pts",
      "enonce": "<div style='font-size: 1em; line-height: 1.6; color: #1a1a2e;'>Cet exercice porte sur l'étude d'un générateur et des composants électroniques usuels.</div>",
      "questions": [
        {
          "question": "<div style='margin: 10px 0;'><strong>2.1 (1 pt)</strong> Un générateur de force électromotrice E = 12 V et de résistance interne r = 0,5 Ω débite un courant d'intensité I = 2 A. Calculez la tension U à ses bornes.</div>",
          "reponse": "<div style='padding: 12px; background-color: #eef2f7; border-radius: 8px; color: #1a2b4c;'>U = E − r × I = 12 − 0,5 × 2 = 12 − 1 = 11 V</div>"
        },
        {
          "question": "<div style='margin: 10px 0;'><strong>2.2 (1 pt)</strong> Qu'est-ce qu'une résistance et quel est son rôle dans un circuit électrique ?</div>",
          "reponse": "<div style='padding: 12px; background-color: #eef2f7; border-radius: 8px; color: #1a2b4c;'>Une résistance est un composant électrique qui s'oppose au passage du courant. Elle transforme l'énergie électrique en énergie thermique (effet Joule). Son rôle est de limiter l'intensité du courant dans un circuit et de créer des chutes de tension.</div>"
        },
        {
          "question": "<div style='margin: 10px 0;'><strong>2.3 (1 pt)</strong> Donnez la fonction de la diode dans un circuit électronique.</div>",
          "reponse": "<div style='padding: 12px; background-color: #eef2f7; border-radius: 8px; color: #1a2b4c;'>La diode est un composant qui ne laisse passer le courant que dans un seul sens (sens passant). Elle est utilisée pour le redressement du courant alternatif en courant continu, la protection des circuits et la détection de signaux.</div>"
        },
        {
          "question": "<div style='margin: 10px 0;'><strong>2.4 (1 pt)</strong> Un condensateur a une capacité C = 100 μF. Il est chargé sous une tension U = 5 V. Calculez la charge Q stockée dans le condensateur. (Rappel : Q = C × U).</div>",
          "reponse": "<div style='padding: 12px; background-color: #eef2f7; border-radius: 8px; color: #1a2b4c;'>Q = C × U = 100 × 10<sup>−6</sup> × 5 = 5 × 10<sup>−4</sup> C</div>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Lois des réseaux et courant alternatif",
      "points": "4 pts",
      "enonce": "<div style='font-size: 1em; line-height: 1.6; color: #1a1a2e;'>Cet exercice traite des lois de Kirchhoff et du courant alternatif.</div>",
      "questions": [
        {
          "question": "<div style='margin: 10px 0;'><strong>3.1 (1 pt)</strong> Un nœud électrique est traversé par trois courants : I<sub>1</sub> = 3 A (entrant), I<sub>2</sub> = 2 A (sortant) et I<sub>3</sub> = 4 A (entrant). Appliquez la loi des nœuds pour déterminer le quatrième courant I<sub>4</sub> qui sort du nœud.</div>",
          "reponse": "<div style='padding: 12px; background-color: #eef2f7; border-radius: 8px; color: #1a2b4c;'>D'après la loi des nœuds : I<sub>entrants</sub> = I<sub>sortants</sub><br>I<sub>1</sub> + I<sub>3</sub> = I<sub>2</sub> + I<sub>4</sub><br>3 + 4 = 2 + I<sub>4</sub><br>7 = 2 + I<sub>4</sub><br>I<sub>4</sub> = 5 A</div>"
        },
        {
          "question": "<div style='margin: 10px 0;'><strong>3.2 (1 pt)</strong> Énoncez la loi des mailles.</div>",
          "reponse": "<div style='padding: 12px; background-color: #eef2f7; border-radius: 8px; color: #1a2b4c;'>La loi des mailles stipule que dans une maille d'un circuit électrique, la somme algébrique des tensions (différences de potentiel) est égale à zéro.</div>"
        },
        {
          "question": "<div style='margin: 10px 0;'><strong>3.3 (1 pt)</strong> Une tension alternative sinusoïdale a pour valeur efficace U<sub>eff</sub> = 230 V. Calculez sa valeur maximale U<sub>max</sub>.</div>",
          "reponse": "<div style='padding: 12px; background-color: #eef2f7; border-radius: 8px; color: #1a2b4c;'>U<sub>max</sub> = U<sub>eff</sub> × √2 = 230 × 1,414 ≈ 325 V</div>"
        },
        {
          "question": "<div style='margin: 10px 0;'><strong>3.4 (1 pt)</strong> La fréquence de la tension du secteur est de 50 Hz. Calculez sa période T.</div>",
          "reponse": "<div style='padding: 12px; background-color: #eef2f7; border-radius: 8px; color: #1a2b4c;'>T = 1/f = 1/50 = 0,02 s = 20 ms</div>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Dynamique et énergie mécanique",
      "points": "4 pts",
      "enonce": "<div style='font-size: 1em; line-height: 1.6; color: #1a1a2e;'>Cet exercice porte sur les lois de Newton et les énergies cinétique et potentielle.</div>",
      "questions": [
        {
          "question": "<div style='margin: 10px 0;'><strong>4.1 (1 pt)</strong> Énoncez la deuxième loi de Newton (principe fondamental de la dynamique).</div>",
          "reponse": "<div style='padding: 12px; background-color: #eef2f7; border-radius: 8px; color: #1a2b4c;'>Dans un référentiel galiléen, la somme des forces appliquées à un corps est égale au produit de sa masse par son accélération : \\( \\sum \\vec{F} = m \\times \\vec{a} \\).</div>"
        },
        {
          "question": "<div style='margin: 10px 0;'><strong>4.2 (1 pt)</strong> Un véhicule de masse m = 1000 kg passe de 0 à 72 km/h (soit 20 m/s) en 10 s. Calculez la force moyenne exercée sur le véhicule (supposée constante).</div>",
          "reponse": "<div style='padding: 12px; background-color: #eef2f7; border-radius: 8px; color: #1a2b4c;'>a = Δv/Δt = 20/10 = 2 m/s²<br>F = m × a = 1000 × 2 = 2000 N</div>"
        },
        {
          "question": "<div style='margin: 10px 0;'><strong>4.3 (1 pt)</strong> Un objet de masse m = 0,5 kg est lancé verticalement vers le haut avec une vitesse v = 10 m/s. Calculez son énergie cinétique initiale.</div>",
          "reponse": "<div style='padding: 12px; background-color: #eef2f7; border-radius: 8px; color: #1a2b4c;'>E<sub>c</sub> = ½ × m × v² = ½ × 0,5 × 10² = 25 J</div>"
        },
        {
          "question": "<div style='margin: 10px 0;'><strong>4.4 (1 pt)</strong> Quelle est l'énergie potentielle de l'objet à l'altitude maximale atteinte ?</div>",
          "reponse": "<div style='padding: 12px; background-color: #eef2f7; border-radius: 8px; color: #1a2b4c;'>D'après le principe de conservation de l'énergie mécanique (en négligeant les frottements), l'énergie potentielle à l'altitude maximale est égale à l'énergie cinétique initiale : E<sub>p</sub> = E<sub>c</sub> = 25 J.</div>"
        }
      ]
    },
    {
      "titre": "Exercice 5 : Pétroles et matières plastiques",
      "points": "3 pts",
      "enonce": "<div style='font-size: 1em; line-height: 1.6; color: #1a1a2e;'>Cet exercice traite du pétrole, du raffinage et des matières plastiques.</div>",
      "questions": [
        {
          "question": "<div style='margin: 10px 0;'><strong>5.1 (1 pt)</strong> Définissez le pétrole. Quelle est sa composition principale ?</div>",
          "reponse": "<div style='padding: 12px; background-color: #eef2f7; border-radius: 8px; color: #1a2b4c;'>Le pétrole est une roche liquide fossile (huile minérale) formée par la décomposition de matière organique (plancton) au cours de millions d'années. Il est principalement composé d'un mélange d'hydrocarbures (alcanes, cyclanes, aromatiques).</div>"
        },
        {
          "question": "<div style='margin: 10px 0;'><strong>5.2 (1 pt)</strong> Citez trois produits dérivés du pétrole et leurs utilisations principales.</div>",
          "reponse": "<div style='padding: 12px; background-color: #eef2f7; border-radius: 8px; color: #1a2b4c;'>1. <strong>Essence</strong> : carburant pour les voitures.<br>2. <strong>Kérosène</strong> : carburant pour les avions.<br>3. <strong>Plastiques</strong> (polyéthylène) : fabrication d'emballages, de bouteilles, etc.</div>"
        },
        {
          "question": "<div style='margin: 10px 0;'><strong>5.3 (1 pt)</strong> Quelle est la différence entre un thermoplastique et un thermodurcissable ?</div>",
          "reponse": "<div style='padding: 12px; background-color: #eef2f7; border-radius: 8px; color: #1a2b4c;'>Les thermoplastiques se ramollissent sous l'effet de la chaleur et durcissent en refroidissant (processus réversible). Ils peuvent être fondus et remodelés plusieurs fois. Les thermodurcissables, en revanche, durcissent de manière irréversible sous l'effet de la chaleur ou d'un agent chimique et ne peuvent plus être fondus.</div>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
