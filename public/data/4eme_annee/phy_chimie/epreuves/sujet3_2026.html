<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Physique-Chimie",
  "classe": "4ème année",
  "sequence": "Séquence 3",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Énergie mécanique d'un pendule",
      "points": "4 pts",
      "enonce": "<div style='background-color: #f0f8ff; padding: 15px; border-radius: 8px; color: #000;'><p>Un pendule simple de masse \\( m = 200 \\, \\text{g} \\) est lâché sans vitesse initiale d'une hauteur \\( h = 10 \\, \\text{cm} \\) par rapport à sa position la plus basse. On prend \\( g = 10 \\, \\text{N/kg} \\).</p><ul><li>Définir l'énergie mécanique du pendule et rappeler sa formule.</li><li>Calculer l'énergie potentielle du pendule à son point de départ.</li><li>En déduire l'énergie cinétique du pendule lorsqu'il passe par sa position la plus basse.</li><li>Calculer la vitesse du pendule à cet instant.</li></ul></div>",
      "questions": [
        {
          "question": "Définir l'énergie mécanique du pendule et rappeler sa formule.",
          "reponse": "L'énergie mécanique \\( E_m \\) d'un système est la somme de son énergie cinétique \\( E_c \\) et de son énergie potentielle \\( E_{pp} \\). Sa formule est : <div class='math-block'><div class='math'>$$ E_m = E_c + E_{pp} $$</div></div>"
        },
        {
          "question": "Calculer l'énergie potentielle du pendule à son point de départ.",
          "reponse": "L'énergie potentielle de pesanteur est donnée par \\( E_{pp} = m g h \\).<br>Avec \\( m = 200 \\, \\text{g} = 0,2 \\, \\text{kg} \\), \\( g = 10 \\, \\text{N/kg} \\) et \\( h = 10 \\, \\text{cm} = 0,1 \\, \\text{m} \\) :<br><div class='math-block'><div class='math'>$$ E_{pp} = 0,2 \\times 10 \\times 0,1 = 0,2 \\, \\text{J} $$</div></div>L'énergie potentielle initiale est de 0,2 J."
        },
        {
          "question": "En déduire l'énergie cinétique du pendule lorsqu'il passe par sa position la plus basse.",
          "reponse": "Au point le plus bas, l'énergie potentielle est nulle (altitude de référence). D'après le principe de conservation de l'énergie mécanique (en l'absence de frottements), l'énergie mécanique se conserve. L'énergie cinétique au point le plus bas est donc égale à l'énergie potentielle initiale :<br><div class='math-block'><div class='math'>$$ E_c = E_{pp\\,initiale} = 0,2 \\, \\text{J} $$</div></div>"
        },
        {
          "question": "Calculer la vitesse du pendule à cet instant.",
          "reponse": "L'énergie cinétique est donnée par \\( E_c = \\frac{1}{2} m v^2 \\). On en déduit :<br><div class='math-block'><div class='math'>$$ v = \\sqrt{\\frac{2E_c}{m}} = \\sqrt{\\frac{2 \\times 0,2}{0,2}} = \\sqrt{2} \\approx 1,41 \\, \\text{m/s} $$</div></div>La vitesse du pendule à son point le plus bas est d'environ 1,41 m/s."
        }
      ]
    },
    {
      "titre": "Exercice 2 : Les lois de Newton",
      "points": "3 pts",
      "enonce": "<div style='background-color: #f5f5dc; padding: 15px; border-radius: 8px; color: #000;'><p>Un solide de masse \\( m = 500 \\, \\text{g} \\) est posé sur une table horizontale. Il est soumis à son poids, à la réaction normale de la table et à une force de traction horizontale constante \\( \\vec{F} \\) de valeur \\( 2 \\, \\text{N} \\). Les frottements sont négligés.</p><p><strong>Questions :</strong></p><ul><li>Énoncer la première loi de Newton ou principe d'inertie.</li><li>Que peut-on dire du mouvement du solide si la force de traction est annulée ? Justifier.</li><li>Calculer l'accélération du solide.</li></ul></div>",
      "questions": [
        {
          "question": "Énoncer la première loi de Newton ou principe d'inertie.",
          "reponse": "La première loi de Newton, ou principe d'inertie, stipule que : <em>tout corps persévère dans son état de repos ou de mouvement rectiligne uniforme si les forces qui s'exercent sur lui se compensent (c'est-à-dire si la somme vectorielle des forces est nulle).</em>"
        },
        {
          "question": "Que peut-on dire du mouvement du solide si la force de traction est annulée ? Justifier.",
          "reponse": "Si la force de traction est annulée, les forces qui s'exercent sur le solide sont le poids et la réaction normale. Ces deux forces se compensent (elles sont verticales, de sens opposés et de même valeur). Le solide est alors soumis à des forces qui se compensent. D'après le principe d'inertie, le solide persévère dans son mouvement : il continue son mouvement rectiligne uniforme (sa vitesse reste constante en direction et en valeur)."
        },
        {
          "question": "Calculer l'accélération du solide.",
          "reponse": "La seconde loi de Newton (ou principe fondamental de la dynamique) s'écrit : \\( \\sum \\vec{F} = m \\vec{a} \\). Dans notre cas, la force résultante est la force de traction \\( \\vec{F} \\) (les autres forces se compensent). On a donc \\( F = m a \\), d'où :<br><div class='math-block'><div class='math'>$$ a = \\frac{F}{m} = \\frac{2}{0,5} = 4 \\, \\text{m/s}^2 $$</div></div>L'accélération du solide est de 4 m/s²."
        }
      ]
    },
    {
      "titre": "Exercice 3 : Étude d'un générateur",
      "points": "3 pts",
      "enonce": "<div style='background-color: #e6e6fa; padding: 15px; border-radius: 8px; color: #000;'><p>Un générateur de force électromotrice \\( E = 12 \\, \\text{V} \\) et de résistance interne \\( r = 1 \\, \\Omega \\) alimente un circuit.</p><ul><li>Définir la force électromotrice d'un générateur.</li><li>Rappeler la relation entre la tension \\( U \\) aux bornes du générateur, l'intensité \\( I \\) du courant qui le traverse, \\( E \\) et \\( r \\).</li><li>Calculer la tension aux bornes du générateur lorsqu'il débite un courant d'intensité \\( I = 2 \\, \\text{A} \\).</li></ul></div>",
      "questions": [
        {
          "question": "Définir la force électromotrice d'un générateur.",
          "reponse": "La force électromotrice (f.é.m.) \\( E \\) d'un générateur est la tension mesurée à ses bornes lorsqu'il ne débite aucun courant (circuit ouvert). C'est la tension maximale qu'il peut fournir. Elle s'exprime en volts (V)."
        },
        {
          "question": "Rappeler la relation entre la tension \\( U \\) aux bornes du générateur, l'intensité \\( I \\) du courant qui le traverse, \\( E \\) et \\( r \\).",
          "reponse": "La caractéristique tension-courant d'un générateur est : <div class='math-block'><div class='math'>$$ U = E - r \\cdot I $$</div></div>où \\( U \\) est la tension aux bornes du générateur (en V), \\( E \\) sa force électromotrice (en V), \\( r \\) sa résistance interne (en Ω) et \\( I \\) l'intensité du courant débité (en A)."
        },
        {
          "question": "Calculer la tension aux bornes du générateur lorsqu'il débite un courant d'intensité \\( I = 2 \\, \\text{A} \\).",
          "reponse": "En utilisant la relation \\( U = E - r \\cdot I \\) :<br><div class='math-block'><div class='math'>$$ U = 12 - 1 \\times 2 = 10 \\, \\text{V} $$</div></div>La tension aux bornes du générateur est de 10 V lorsqu'il débite 2 A."
        }
      ]
    },
    {
      "titre": "Exercice 4 : Les hydrocarbures - nomenclature et propriétés",
      "points": "5 pts",
      "enonce": "<div style='background-color: #f0fff0; padding: 15px; border-radius: 8px; color: #000;'><p>On considère les quatre hydrocarbures suivants :</p><ul><li>Composé A : \\( \\text{CH}_4 \\)</li><li>Composé B : \\( \\text{C}_2\\text{H}_4 \\)</li><li>Composé C : \\( \\text{C}_3\\text{H}_8 \\)</li><li>Composé D : \\( \\text{C}_2\\text{H}_2 \\)</li></ul><p><strong>Questions :</strong></p><ul><li>Identifier pour chaque composé, à quelle famille d'hydrocarbures il appartient (alcane, alcène, alcyne).</li><li>Donner le nom IUPAC de chaque composé.</li><li>Écrire l'équation bilan de la combustion complète du composé A dans le dioxygène.</li></ul></div>",
      "questions": [
        {
          "question": "Identifier pour chaque composé, à quelle famille d'hydrocarbures il appartient (alcane, alcène, alcyne).",
          "reponse": "<ul><li><strong>Composé A (CH₄)</strong> : alcane (liaisons simples uniquement, formule \\( C_nH_{2n+2} \\) avec n=1).</li><li><strong>Composé B (C₂H₄)</strong> : alcène (présence d'une double liaison C=C, formule \\( C_nH_{2n} \\) avec n=2).</li><li><strong>Composé C (C₃H₈)</strong> : alcane (liaisons simples, formule \\( C_nH_{2n+2} \\) avec n=3).</li><li><strong>Composé D (C₂H₂)</strong> : alcyne (présence d'une triple liaison C≡C, formule \\( C_nH_{2n-2} \\) avec n=2).</li></ul>"
        },
        {
          "question": "Donner le nom IUPAC de chaque composé.",
          "reponse": "<ul><li><strong>Composé A (CH₄)</strong> : <strong>Méthane</strong></li><li><strong>Composé B (C₂H₄)</strong> : <strong>Éthène</strong> (ou éthylène)</li><li><strong>Composé C (C₃H₈)</strong> : <strong>Propane</strong></li><li><strong>Composé D (C₂H₂)</strong> : <strong>Éthyne</strong> (ou acétylène)</li></ul>"
        },
        {
          "question": "Écrire l'équation bilan de la combustion complète du composé A dans le dioxygène.",
          "reponse": "La combustion complète du méthane (CH₄) dans le dioxygène produit du dioxyde de carbone et de l'eau. L'équation bilan est :<br><div class='math-block'><div class='math'>$$ \\text{CH}_4 + 2\\text{O}_2 \\rightarrow \\text{CO}_2 + 2\\text{H}_2\\text{O} $$</div></div>"
        }
      ]
    },
    {
      "titre": "Exercice 5 : Métallurgie et environnement",
      "points": "5 pts",
      "enonce": "<div style='background-color: #fff0f5; padding: 15px; border-radius: 8px; color: #000;'><p>La métallurgie du fer, effectuée dans les hauts-fourneaux, utilise du minerai de fer (principalement de l'hématite \\( Fe_2O_3 \\)) et du coke (carbone) comme réducteur. Les réactions principales sont :</p><ul><li>Étape 1 : \\( 2C + O_2 \\rightarrow 2CO \\)</li><li>Étape 2 : \\( Fe_2O_3 + 3CO \\rightarrow 2Fe + 3CO_2 \\)</li></ul><p><strong>Questions :</strong></p><ul><li>Définir la métallurgie.</li><li>Identifier le type de procédé métallurgique utilisé pour le fer.</li><li>Expliquer le rôle du coke dans ce procédé.</li><li>Donner un inconvénient environnemental de ce type de métallurgie.</li><li>Proposer une alternative plus respectueuse de l'environnement.</li></ul></div>",
      "questions": [
        {
          "question": "Définir la métallurgie.",
          "reponse": "La métallurgie est l'ensemble des sciences et des techniques qui permettent d'obtenir les métaux à partir de leurs minerais, puis de les transformer en produits finis. Elle englobe les procédés d'extraction, de purification et d'élaboration des alliages."
        },
        {
          "question": "Identifier le type de procédé métallurgique utilisé pour le fer.",
          "reponse": "Le procédé utilisé pour le fer dans un haut-fourneau est la <strong>pyrométallurgie</strong> car il utilise la chaleur à haute température pour réduire le minerai."
        },
        {
          "question": "Expliquer le rôle du coke dans ce procédé.",
          "reponse": "Le coke (carbone) joue deux rôles essentiels :<br><ul><li>Il brûle dans le dioxygène pour produire du monoxyde de carbone (CO), qui est le véritable agent réducteur.</li><li>Il fournit la chaleur nécessaire au fonctionnement du haut-fourneau (par sa combustion).</li></ul>"
        },
        {
          "question": "Donner un inconvénient environnemental de ce type de métallurgie.",
          "reponse": "La pyrométallurgie du fer est une source importante de pollution : elle émet de grandes quantités de dioxyde de carbone (CO₂), un gaz à effet de serre, et de monoxyde de carbone (CO), un gaz toxique."
        },
        {
          "question": "Proposer une alternative plus respectueuse de l'environnement.",
          "reponse": "Une alternative plus respectueuse de l'environnement serait d'utiliser des procédés hydrométallurgiques (avec des solutions aqueuses) ou électrométallurgiques (électrolyse) lorsque c'est possible. Pour le fer, l'utilisation d'hydrogène (H₂) comme réducteur à la place du coke est une piste prometteuse, car elle ne produit que de l'eau comme sous-produit."
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
