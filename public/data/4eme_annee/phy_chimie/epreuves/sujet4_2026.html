<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Physique-Chimie",
  "classe": "4ème année",
  "sequence": "Séquence 4",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Les Hydrocarbures",
      "points": "4 pts",
      "enonce": "<div style='font-size: 1.1em; line-height: 1.6; background-color: #f8f9fa; padding: 15px; border-radius: 8px; color: #212529;'>Cet exercice porte sur la nomenclature et les propriétés des alcanes, alcènes et alcynes.</div>",
      "questions": [
        {
          "question": "<div style='margin-bottom: 15px;'><strong>1)</strong> Donner la formule générale des alcanes, des alcènes et des alcynes.</div>",
          "reponse": "<div style='background-color: #e9ecef; padding: 10px; border-radius: 5px; color: #212529;'>Formules générales : <br>- Alcanes : \\( C_nH_{2n+2} \\) <br>- Alcènes : \\( C_nH_{2n} \\) <br>- Alcynes : \\( C_nH_{2n-2} \\)</div>"
        },
        {
          "question": "<div style='margin-bottom: 15px;'><strong>2)</strong> Nommer les molécules suivantes selon la nomenclature IUPAC : <br>a) \\( CH_3-CH_2-CH_3 \\) <br>b) \\( CH_2=CH-CH_3 \\) <br>c) \\( CH \\equiv C-CH_2-CH_3 \\)</div>",
          "reponse": "<div style='background-color: #e9ecef; padding: 10px; border-radius: 5px; color: #212529;'>a) Propane <br>b) Propène <br>c) But-1-yne</div>"
        },
        {
          "question": "<div style='margin-bottom: 10px;'><strong>3)</strong> Citer deux propriétés physiques des alcanes.</div>",
          "reponse": "<div style='background-color: #e9ecef; padding: 10px; border-radius: 5px; color: #212529;'>Les alcanes sont généralement non polaires, hydrophobes et leurs points d'ébullition augmentent avec la longueur de la chaîne carbonée.</div>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Métallurgie",
      "points": "3 pts",
      "enonce": "<div style='font-size: 1.1em; line-height: 1.6; background-color: #f8f9fa; padding: 15px; border-radius: 8px; color: #212529;'>Cet exercice aborde les étapes d'extraction des métaux.</div>",
      "questions": [
        {
          "question": "<div style='margin-bottom: 15px;'><strong>1)</strong> Définir la métallurgie.</div>",
          "reponse": "<div style='background-color: #e9ecef; padding: 10px; border-radius: 5px; color: #212529;'>La métallurgie est l'ensemble des procédés et techniques permettant d'extraire les métaux à partir de leurs minerais et de les traiter pour obtenir des matériaux utilisables.</div>"
        },
        {
          "question": "<div style='margin-bottom: 15px;'><strong>2)</strong> Décrire brièvement les trois grands procédés métallurgiques : pyrométallurgie, hydrométallurgie et électrométallurgie.</div>",
          "reponse": "<div style='background-color: #e9ecef; padding: 10px; border-radius: 5px; color: #212529;'>- <strong>Pyrométallurgie</strong> : Utilisation de la chaleur (températures élevées) pour fondre le minerai et séparer le métal. Exemple : la réduction du fer dans un haut-fourneau. <br>- <strong>Hydrométallurgie</strong> : Utilisation de solvants aqueux pour dissoudre les métaux, puis les récupérer par précipitation ou électrolyse. <br>- <strong>Électrométallurgie</strong> : Utilisation du courant électrique pour décomposer les composés ioniques et obtenir le métal pur (électrolyse).</div>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Électricité - Dipôles et Lois des Réseaux",
      "points": "5 pts",
      "enonce": "<div style='font-size: 1.1em; line-height: 1.6; background-color: #f8f9fa; padding: 15px; border-radius: 8px; color: #212529;'>Cet exercice porte sur les générateurs et les lois de Kirchhoff.</div>",
      "questions": [
        {
          "question": "<div style='margin-bottom: 15px;'><strong>1)</strong> Un générateur a une force électromotrice (f.é.m.) E = 12 V et une résistance interne r = 2 Ω. <br>Calculer la tension à ses bornes lorsqu'il débite un courant d'intensité I = 2 A.</div>",
          "reponse": "<div style='background-color: #e9ecef; padding: 10px; border-radius: 5px; color: #212529;'>La relation est \\( U = E - r \\cdot I \\). <br>Donc \\( U = 12 - 2 \\times 2 = 12 - 4 = 8 \\, V \\).</div>"
        },
        {
          "question": "<div style='margin-bottom: 15px;'><strong>2)</strong> Énoncer la loi des nœuds et la loi des mailles de Kirchhoff.</div>",
          "reponse": "<div style='background-color: #e9ecef; padding: 10px; border-radius: 5px; color: #212529;'>- <strong>Loi des nœuds</strong> : La somme des intensités des courants arrivant à un nœud est égale à la somme des intensités des courants qui en repartent. <br>- <strong>Loi des mailles</strong> : Dans une maille, la somme algébrique des tensions le long de cette maille est nulle.</div>"
        },
        {
          "question": "<div style='margin-bottom: 10px;'><strong>3)</strong> Identifier le rôle de la résistance et du condensateur dans un circuit électronique simple.</div>",
          "reponse": "<div style='background-color: #e9ecef; padding: 10px; border-radius: 5px; color: #212529;'>- <strong>Résistance</strong> : Limite l'intensité du courant électrique et peut être utilisée pour diviser la tension. <br>- <strong>Condensateur</strong> : Stocke et restitue de l'énergie électrique, filtre les variations de tension.</div>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Énergie Mécanique et Dynamique",
      "points": "4 pts",
      "enonce": "<div style='font-size: 1.1em; line-height: 1.6; background-color: #f8f9fa; padding: 15px; border-radius: 8px; color: #212529;'>Un solide de masse \\( m = 2 \\, kg \\) est lâché sans vitesse initiale d'une hauteur \\( h = 10 \\, m \\) par rapport au sol. On néglige les frottements. (On prendra \\( g = 10 \\, m.s^{-2} \\)).</div>",
      "questions": [
        {
          "question": "<div style='margin-bottom: 15px;'><strong>1)</strong> a) Définir l'énergie cinétique et l'énergie potentielle de pesanteur. <br>b) Calculer l'énergie mécanique totale du système en haut de la chute.</div>",
          "reponse": "<div style='background-color: #e9ecef; padding: 10px; border-radius: 5px; color: #212529;'>a) <br>- <strong>Énergie cinétique</strong> : \\( E_c = \\frac{1}{2} m v^2 \\), elle est liée à la vitesse du corps. <br>- <strong>Énergie potentielle de pesanteur</strong> : \\( E_{pp} = m \\cdot g \\cdot z \\), elle est liée à la position du corps. <br>b) En haut, la vitesse est nulle donc \\( E_c = 0 \\). L'énergie mécanique est \\( E_m = E_{pp} = m \\cdot g \\cdot h = 2 \\times 10 \\times 10 = 200 \\, J \\).</div>"
        },
        {
          "question": "<div style='margin-bottom: 15px;'><strong>2)</strong> En appliquant le principe de conservation de l'énergie mécanique, calculer la vitesse du solide juste avant qu'il ne touche le sol.</div>",
          "reponse": "<div style='background-color: #e9ecef; padding: 10px; border-radius: 5px; color: #212529;'>Au sol, \\( E_{pp} = 0 \\), donc \\( E_m = E_c = \\frac{1}{2} m v^2 \\). <br>D'où \\( \\frac{1}{2} m v^2 = 200 \\Rightarrow v = \\sqrt{\\frac{2 \\times 200}{2}} = \\sqrt{200} \\approx 14,14 \\, m.s^{-1} \\).</div>"
        }
      ]
    },
    {
      "titre": "Exercice 5 : Chimie et Environnement",
      "points": "4 pts",
      "enonce": "<div style='font-size: 1.1em; line-height: 1.6; background-color: #f8f9fa; padding: 15px; border-radius: 8px; color: #212529;'>Les questions suivantes portent sur le pétrole et les matières plastiques.</div>",
      "questions": [
        {
          "question": "<div style='margin-bottom: 15px;'><strong>1)</strong> Définir le pétrole et citer sa composition majoritaire.</div>",
          "reponse": "<div style='background-color: #e9ecef; padding: 10px; border-radius: 5px; color: #212529;'>Le pétrole est un mélange complexe d'hydrocarbures (composés de carbone et d'hydrogène) d'origine naturelle. Il contient également des composés soufrés, azotés et oxygénés.</div>"
        },
        {
          "question": "<div style='margin-bottom: 15px;'><strong>2)</strong> Citer les principales étapes du raffinage du pétrole.</div>",
          "reponse": "<div style='background-color: #e9ecef; padding: 10px; border-radius: 5px; color: #212529;'>Le raffinage du pétrole se déroule en plusieurs étapes : <br>- <strong>Distillation atmosphérique</strong> : Séparation des différentes fractions selon leurs températures d'ébullition. <br>- <strong>Distillation sous vide</strong> : Pour les fractions lourdes. <br>- <strong>Transformations chimiques</strong> (craquage, reformage) pour améliorer la qualité et le rendement des produits. <br>- <strong>Traitements de purification</strong> pour éliminer les impuretés.</div>"
        },
        {
          "question": "<div style='margin-bottom: 10px;'><strong>3)</strong> Classer les matières plastiques en deux catégories et donner un exemple pour chacune.</div>",
          "reponse": "<div style='background-color: #e9ecef; padding: 10px; border-radius: 5px; color: #212529;'>- <strong>Thermoplastiques</strong> : Ils se ramollissent sous l'effet de la chaleur et durcissent en refroidissant. Exemple : le polyéthylène (PE). <br>- <strong>Thermodurcissables</strong> : Ils durcissent de manière irréversible sous l'effet de la chaleur. Exemple : la bakélite.</div>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
