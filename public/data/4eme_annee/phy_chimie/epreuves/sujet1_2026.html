<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Physique-Chimie",
  "classe": "4ème année",
  "sequence": "Séquence 1",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Les alcanes - Définition et nomenclature",
      "points": "4 pts",
      "enonce": "<div style='padding: 10px; font-size: 16px; line-height: 1.6;'>Les alcanes sont des hydrocarbures saturés qui constituent une famille importante en chimie organique. Ils sont utilisés comme combustibles, solvants et matières premières pour l'industrie chimique.</div>",
      "questions": [
        {
          "question": "1) Définir un alcane et donner sa formule générale.",
          "reponse": "Un alcane est un hydrocarbure saturé, c'est-à-dire un composé organique constitué uniquement d'atomes de carbone et d'hydrogène, avec des liaisons simples entre les atomes de carbone. La formule générale des alcanes est : \\( C_nH_{2n+2} \\), où \\( n \\) est le nombre d'atomes de carbone."
        },
        {
          "question": "2) Nommer les alcanes suivants selon la nomenclature IUPAC :<br>a) \\( CH_3 - CH_2 - CH_2 - CH_2 - CH_3 \\)<br>b) \\( CH_3 - CH(CH_3) - CH_2 - CH_3 \\)",
          "reponse": "a) \\( CH_3 - CH_2 - CH_2 - CH_2 - CH_3 \\) : Chaîne de 5 carbones sans ramification → <strong>pentane</strong>.<br>b) \\( CH_3 - CH(CH_3) - CH_2 - CH_3 \\) : Chaîne principale de 4 carbones avec un groupe méthyle sur le carbone 2 → <strong>2-méthylbutane</strong>."
        },
        {
          "question": "3) Écrire la formule développée du 3-méthylhexane.",
          "reponse": "3-méthylhexane : Chaîne de 6 carbones avec un groupe \\( CH_3 \\) sur le carbone 3 :<br>\\( CH_3 - CH_2 - CH(CH_3) - CH_2 - CH_2 - CH_3 \\)"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Propriétés physiques et chimiques des alcanes",
      "points": "3 pts",
      "enonce": "<div style='padding: 10px; font-size: 16px; line-height: 1.6;'>Les alcanes possèdent des propriétés physiques et chimiques caractéristiques qui varient en fonction de leur structure et de leur masse moléculaire.</div>",
      "questions": [
        {
          "question": "1) Décrire l'état physique des alcanes en fonction du nombre d'atomes de carbone.",
          "reponse": "Les alcanes sont gazeux pour les premiers membres (C1 à C4 : méthane, éthane, propane, butane), liquides pour les alcanes moyens (C5 à C16) et solides pour les alcanes lourds (au-delà de C16)."
        },
        {
          "question": "2) Expliquer pourquoi le point d'ébullition des alcanes augmente avec la longueur de la chaîne carbonée.",
          "reponse": "Le point d'ébullition augmente avec la longueur de la chaîne carbonée car les forces intermoléculaires (forces de Van der Waals) augmentent avec la taille de la molécule. Une plus grande molécule a une surface de contact plus importante, ce qui accroît les attractions intermoléculaires, nécessitant plus d'énergie pour passer à l'état gazeux."
        },
        {
          "question": "3) Écrire l'équation bilan de la combustion complète du propane \\( C_3H_8 \\).",
          "reponse": "La combustion complète du propane donne du dioxyde de carbone et de l'eau :<br>\\( C_3H_8 + 5O_2 \\rightarrow 3CO_2 + 4H_2O \\)"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Étude d'un dipôle générateur",
      "points": "4 pts",
      "enonce": "<div style='padding: 10px; font-size: 16px; line-height: 1.6;'>Un générateur de force électromotrice \\( E = 12 \\, \\text{V} \\) et de résistance interne \\( r = 0,5 \\, \\Omega \\) alimente un circuit extérieur.</div>",
      "questions": [
        {
          "question": "1) Définir la force électromotrice (f.é.m.) d'un générateur.",
          "reponse": "La force électromotrice (notée E) est la tension mesurée aux bornes du générateur lorsqu'il ne débite pas de courant, c'est-à-dire à circuit ouvert. Elle représente la tension maximale que peut fournir le générateur. Elle s'exprime en volts (V)."
        },
        {
          "question": "2) Établir la relation entre la tension \\( U \\) aux bornes du générateur, la f.é.m. \\( E \\), la résistance interne \\( r \\) et l'intensité du courant \\( I \\).",
          "reponse": "La tension aux bornes d'un générateur est : \\( U = E - r \\times I \\). C'est la loi d'Ohm pour un générateur. La tension aux bornes est égale à la f.é.m. diminuée de la chute de tension due à la résistance interne."
        },
        {
          "question": "3) Calculer la tension aux bornes du générateur lorsqu'il débite un courant \\( I = 2 \\, \\text{A} \\).",
          "reponse": "\\( U = E - r \\times I = 12 - 0,5 \\times 2 = 12 - 1 = 11 \\, \\text{V} \\).<br>La tension aux bornes du générateur est de 11 V."
        },
        {
          "question": "4) Déterminer l'intensité du courant de court-circuit de ce générateur.",
          "reponse": "En court-circuit, la tension aux bornes est nulle (\\( U = 0 \\)).<br>\\( 0 = E - r \\times I_{cc} \\) → \\( I_{cc} = \\dfrac{E}{r} = \\dfrac{12}{0,5} = 24 \\, \\text{A} \\).<br>L'intensité du courant de court-circuit est de 24 A."
        }
      ]
    },
    {
      "titre": "Exercice 4 : Énergie mécanique - Chute libre",
      "points": "4 pts",
      "enonce": "<div style='padding: 10px; font-size: 16px; line-height: 1.6;'>Un objet de masse \\( m = 2 \\, \\text{kg} \\) est lâché sans vitesse initiale du haut d'un immeuble de hauteur \\( h = 20 \\, \\text{m} \\). On néglige les frottements. On prendra \\( g = 10 \\, \\text{N/kg} \\).</div>",
      "questions": [
        {
          "question": "1) Définir l'énergie cinétique et l'énergie potentielle de pesanteur.",
          "reponse": "L'énergie cinétique est l'énergie que possède un corps du fait de son mouvement : \\( E_c = \\dfrac{1}{2} m v^2 \\).<br>L'énergie potentielle de pesanteur est l'énergie que possède un corps du fait de sa position dans un champ de pesanteur : \\( E_{pp} = m \\times g \\times h \\)."
        },
        {
          "question": "2) Calculer l'énergie mécanique de l'objet au sommet de l'immeuble.",
          "reponse": "Au sommet, l'objet est lâché sans vitesse initiale, donc \\( v_0 = 0 \\) et \\( E_c = 0 \\).<br>\\( E_{pp} = m \\times g \\times h = 2 \\times 10 \\times 20 = 400 \\, \\text{J} \\).<br>L'énergie mécanique est : \\( E_m = E_c + E_{pp} = 0 + 400 = 400 \\, \\text{J} \\)."
        },
        {
          "question": "3) En appliquant le principe de conservation de l'énergie mécanique, déterminer la vitesse de l'objet lorsqu'il arrive au sol.",
          "reponse": "Au sol, \\( h = 0 \\), donc \\( E_{pp} = 0 \\). D'après la conservation de l'énergie : \\( E_m = E_c = 400 \\, \\text{J} \\).<br>\\( \\dfrac{1}{2} m v^2 = 400 \\) → \\( v^2 = \\dfrac{2 \\times 400}{m} = \\dfrac{800}{2} = 400 \\).<br>\\( v = \\sqrt{400} = 20 \\, \\text{m/s} \\).<br>La vitesse de l'objet au sol est de 20 m/s."
        },
        {
          "question": "4) Quelle est la vitesse de l'objet à mi-hauteur (à \\( h = 10 \\, \\text{m} \\)) ?",
          "reponse": "À mi-hauteur, \\( h = 10 \\, \\text{m} \\).<br>\\( E_{pp} = m \\times g \\times h = 2 \\times 10 \\times 10 = 200 \\, \\text{J} \\).<br>\\( E_c = E_m - E_{pp} = 400 - 200 = 200 \\, \\text{J} \\).<br>\\( \\dfrac{1}{2} m v^2 = 200 \\) → \\( v^2 = \\dfrac{2 \\times 200}{m} = \\dfrac{400}{2} = 200 \\).<br>\\( v = \\sqrt{200} \\approx 14,14 \\, \\text{m/s} \\).<br>La vitesse de l'objet à mi-hauteur est d'environ 14,1 m/s."
        }
      ]
    },
    {
      "titre": "Exercice 5 : Application - Énergie et sécurité routière",
      "points": "5 pts",
      "enonce": "<div style='padding: 10px; font-size: 16px; line-height: 1.6;'>Une voiture de masse \\( m = 1000 \\, \\text{kg} \\) roule à \\( 90 \\, \\text{km/h} \\) sur une route horizontale. Le conducteur freine et la voiture s'arrête.</div>",
      "questions": [
        {
          "question": "1) Convertir la vitesse en mètres par seconde (m/s).",
          "reponse": "\\( v = \\dfrac{90}{3,6} = 25 \\, \\text{m/s} \\)"
        },
        {
          "question": "2) Calculer l'énergie cinétique initiale de la voiture.",
          "reponse": "\\( E_c = \\dfrac{1}{2} m v^2 = \\dfrac{1}{2} \\times 1000 \\times 25^2 = 500 \\times 625 = 312 500 \\, \\text{J} = 3,125 \\times 10^5 \\, \\text{J} \\).<br>L'énergie cinétique initiale est de 312 500 J."
        },
        {
          "question": "3) Si la voiture s'arrête après avoir parcouru \\( d = 62,5 \\, \\text{m} \\), calculer l'intensité de la force de freinage (supposée constante).",
          "reponse": "Le travail de la force de freinage est : \\( W = -F \\times d \\).<br>D'après le théorème de l'énergie cinétique : \\( \\Delta E_c = W \\).<br>\\( \\Delta E_c = 0 - 312 500 = -312 500 \\, \\text{J} \\).<br>\\( -F \\times 62,5 = -312 500 \\) → \\( F = \\dfrac{312 500}{62,5} = 5 000 \\, \\text{N} \\).<br>La force de freinage a une intensité de 5 000 N."
        },
        {
          "question": "4) Si la vitesse initiale double (180 km/h), que devient la distance de freinage (en supposant la même force de freinage) ?",
          "reponse": "Si la vitesse double, l'énergie cinétique est multipliée par 4. La distance de freinage est proportionnelle à l'énergie cinétique (car \\( F \\times d = E_c \\)).<br>La nouvelle distance est : \\( d' = 4 \\times d = 4 \\times 62,5 = 250 \\, \\text{m} \\).<br>Conclusion : doubler la vitesse multiplie la distance de freinage par 4. C'est pourquoi la vitesse est un facteur majeur dans la sécurité routière."
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
