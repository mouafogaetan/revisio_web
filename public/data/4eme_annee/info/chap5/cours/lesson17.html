<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Présentation mobile</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' },
            options: { skipHtmlTypes: 'script' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 500px;
        margin: 0 auto;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    .slide-header {
        flex-shrink: 0;
        padding: 18px 16px 10px 16px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        z-index: 10;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .slide-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
    }

    .content-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 18px 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        flex-shrink: 0;
    }

    .content-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .content-card li {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        line-height: 1.5;
    }

    .content-card li:last-child {
        border-bottom: none;
    }

    .bullet-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
    }

    .math-block {
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        overflow-x: auto;
        flex-shrink: 0;
        margin: 4px 0;
    }

    .math-block .math {
        font-size: 1.2rem;
        color: #e2e8f0;
    }

    .note-box {
        background: rgba(96, 165, 250, 0.08);
        border-left: 4px solid #60a5fa;
        padding: 12px 16px;
        border-radius: 12px;
        font-style: italic;
        font-size: 0.9rem;
        color: #cbd5e1;
        flex-shrink: 0;
    }

    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        border-radius: 0;
        flex-direction: column;
    }

    .loading-card {
        background: #1e293b;
        padding: 32px 28px;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #334155;
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px auto;
    }

    .loading-text {
        font-weight: 600;
        font-size: 1.1rem;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    .loading-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 16px;
    }
    .loading-progress {
        height: 3px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        animation: loadingProgress 30s ease-out forwards;
    }

    .loading-timeout {
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 12px;
    }

    .btn-cancel-loading {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 40px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #f87171;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }

    .btn-cancel-loading:active {
        transform: scale(0.94);
        background: rgba(239, 68, 68, 0.25);
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
    }

    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .slide-counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255,255,255,0.05);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(255,255,255,0.04);
    }

    .status-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 30px;
        background: rgba(96, 165, 250, 0.12);
        color: #93bbfc;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
    }

    .status-badge .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: pulse-dot 1.2s infinite;
        flex-shrink: 0;
    }

    .status-badge.idle .dot {
        animation: none;
        background: #64748b;
    }
    .status-badge.speaking .dot {
        background: #34d399;
        animation: pulse-dot 0.8s infinite;
    }
    .status-badge.error .dot {
        background: #f87171;
        animation: none;
    }
    .status-badge.paused .dot {
        animation: none;
        background: #fbbf24;
    }
    .status-badge.waiting .dot {
        animation: pulse-dot 1.5s infinite;
        background: #fbbf24;
    }
    .status-badge.loading .dot {
        animation: pulse-dot 0.5s infinite;
        background: #60a5fa;
    }

    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.7); }
    }

    .footer-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(255,255,255,0.1);
    }

    .btn-secondary {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-play {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
        min-width: 80px;
        justify-content: center;
    }
    .btn-play:active {
        background: rgba(52, 211, 153, 0.25);
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
    }

    .auto-indicator {
        font-size: 0.65rem;
        color: #64748b;
        text-align: center;
        letter-spacing: 0.3px;
        padding: 2px 0;
    }

    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.2rem;
        }
        .content-card li {
            font-size: 0.9rem;
            padding: 8px 0;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .btn-play {
            min-width: 60px;
        }
        .footer-buttons {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
        .loading-card {
            padding: 20px 16px;
        }
        .math-block .math {
            font-size: 1rem;
        }
    }

    @media (min-width: 600px) {
        .app-container {
            max-width: 480px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
        .loading-overlay {
            border-radius: 32px;
        }
    }

    /* Mode jour (par défaut) */
    html, body {
        background: #f0f4f8 !important;
        color: #1a202c !important;
    }
    .app-container {
        background: linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%) !important;
    }
    .slide-header {
        background: rgba(255, 255, 255, 0.85) !important;
        border-bottom: 1px solid rgba(0,0,0,0.08) !important;
    }
    .slide-header h1 {
        background: linear-gradient(135deg, #2b6cb0, #6b46c1) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        background-clip: text !important;
    }
    .slide-footer {
        background: rgba(255, 255, 255, 0.9) !important;
        border-top: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card {
        background: rgba(255,255,255,0.8) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card li {
        border-bottom: 1px solid rgba(0,0,0,0.05) !important;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.12) !important;
        border-left: 4px solid #4299e1 !important;
        color: #2c3e50 !important;
    }
    .math-block {
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .math-block .math {
        color: #2d3748 !important;
    }
    .slide-counter {
        color: #4a5568 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .status-badge {
        background: rgba(96, 165, 250, 0.15) !important;
        color: #2b6cb0 !important;
        border: 1px solid rgba(96, 165, 250, 0.15) !important;
    }
    .btn {
        color: #2d3748 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .btn-secondary {
        background: rgba(0,0,0,0.04) !important;
        border-color: rgba(0,0,0,0.08) !important;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15) !important;
        border-color: rgba(52, 211, 153, 0.2) !important;
        color: #38a169 !important;
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15) !important;
        border-color: rgba(251, 191, 36, 0.2) !important;
        color: #d69e2e !important;
    }
    .auto-indicator {
        color: #718096 !important;
    }
    .loading-card {
        background: #ffffff !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .loading-text {
        color: #1a202c !important;
    }
    .loading-sub {
        color: #4a5568 !important;
    }
</style>
</head>
<body>

<div class="app-container">

    <header class="slide-header">
        <h1 id="slideTitle">Chargement...</h1>
    </header>

    <main class="slide-body" id="slideBody"></main>

    <!-- LOADING OVERLAY AVEC BOUTON ANNULER -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Préparation vocale...</div>
            <div class="loading-sub" id="loadingSub">Synthèse en cours</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loadingProgressBar"></div>
            </div>
            <div class="loading-timeout" id="loadingTimeout">⏱️ 30 secondes maximum</div>
            <button class="btn-cancel-loading" id="cancelLoadingBtn">
                <span>✕</span> Annuler
            </button>
        </div>
    </div>

    <footer class="slide-footer">
        <div class="footer-top">
            <span class="slide-counter" id="slideCounter">1 / 3</span>
            <span class="status-badge idle" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">Prêt</span>
            </span>
        </div>

        <div class="footer-buttons">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-secondary" id="replayBtn">
                <span class="btn-icon">🔁</span> <span class="btn-label">Relire</span>
            </button>
            <button class="btn btn-play" id="playBtn">
                <span class="btn-icon">▶</span> <span class="btn-label">Play</span>
            </button>
        </div>

        <div class="auto-indicator" id="autoIndicator">⏸ Lecture manuelle</div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // SLIDES
    // ================================================================
   const slides = [
  {
    "titre": "Introduction aux opérations arithmétiques en bases",
    "contenu": "<div style='background: linear-gradient(135deg, #1a365d, #2b6cb0); color: white; padding: 20px; border-radius: 16px;'>\n  <h2 style='color: #fbd38d; font-size: 1.3em; margin-top: 0;'>➕ Les opérations en bases 2, 8 et 16</h2>\n  <p style='font-size: 1em; line-height: 1.6;'>Les opérations arithmétiques existent dans toutes les bases :</p>\n  <div style='display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 12px;'>\n    <div style='background: rgba(255,255,255,0.15); padding: 12px; border-radius: 8px; text-align: center;'>\n      <div style='font-size: 2em;'>0️⃣1️⃣</div>\n      <p style='margin: 4px 0 0; font-size: 0.9em;'>Base 2 (binaire)</p>\n      <p style='margin: 0; font-size: 0.75em;'>Addition et soustraction</p>\n    </div>\n    <div style='background: rgba(255,255,255,0.15); padding: 12px; border-radius: 8px; text-align: center;'>\n      <div style='font-size: 2em;'>0️⃣ à 7️⃣</div>\n      <p style='margin: 4px 0 0; font-size: 0.9em;'>Base 8 (octale)</p>\n      <p style='margin: 0; font-size: 0.75em;'>Addition et soustraction</p>\n    </div>\n    <div style='background: rgba(255,255,255,0.15); padding: 12px; border-radius: 8px; text-align: center;'>\n      <div style='font-size: 2em;'>0️⃣ à F</div>\n      <p style='margin: 4px 0 0; font-size: 0.9em;'>Base 16 (hexadécimale)</p>\n      <p style='margin: 0; font-size: 0.75em;'>Addition et soustraction</p>\n    </div>\n  </div>\n  <p style='margin-top: 12px; font-style: italic; text-align: center;'>\"Les règles de l'addition et de la soustraction sont les mêmes, seule la base change !\"</p>\n</div>",
    "texteParle": "Bonjour à tous. Aujourd'hui, nous allons apprendre à effectuer des opérations arithmétiques dans les bases 2, 8 et 16. Les règles de l'addition et de la soustraction sont les mêmes que dans notre base décimale habituelle. La seule différence, c'est que la base change. Il faut donc adapter notre raisonnement pour tenir compte des retenues dans l'addition et des emprunts dans la soustraction. Nous allons voir comment procéder étape par étape.",
    "note": "Les opérations arithmétiques dans les bases usuelles suivent les mêmes principes qu'en base 10, avec des retenues et des emprunts adaptés à la base."
  },
  {
    "titre": "Rappel : les symboles des bases",
    "contenu": "<div style='background: #f0f4f8; color: #1e293b; padding: 18px; border-radius: 12px;'>\n  <h3 style='color: #2b6cb0; margin-top: 0;'>🔢 Récapitulatif des symboles</h3>\n  <div style='background: white; padding: 16px; border-radius: 8px;'>\n    <table style='width: 100%; border-collapse: collapse; font-size: 0.95em;'>\n      <thead style='background: #2b6cb0; color: white;'>\n        <tr>\n          <th style='padding: 10px; border: 1px solid #e2e8f0;'>Base</th>\n          <th style='padding: 10px; border: 1px solid #e2e8f0;'>Nom</th>\n          <th style='padding: 10px; border: 1px solid #e2e8f0;'>Symboles disponibles</th>\n        </tr>\n      </thead>\n      <tbody>\n        <tr style='background: #e6fffa;'>\n          <td style='padding: 10px; border: 1px solid #e2e8f0; text-align: center;'><strong>2</strong></td>\n          <td style='padding: 10px; border: 1px solid #e2e8f0;'>Binaire</td>\n          <td style='padding: 10px; border: 1px solid #e2e8f0;'>0 et 1</td>\n        </tr>\n        <tr style='background: #f0f4f8;'>\n          <td style='padding: 10px; border: 1px solid #e2e8f0; text-align: center;'><strong>8</strong></td>\n          <td style='padding: 10px; border: 1px solid #e2e8f0;'>Octale</td>\n          <td style='padding: 10px; border: 1px solid #e2e8f0;'>0 à 7</td>\n        </tr>\n        <tr style='background: #e6fffa;'>\n          <td style='padding: 10px; border: 1px solid #e2e8f0; text-align: center;'><strong>10</strong></td>\n          <td style='padding: 10px; border: 1px solid #e2e8f0;'>Décimale (référence)</td>\n          <td style='padding: 10px; border: 1px solid #e2e8f0;'>0 à 9</td>\n        </tr>\n        <tr style='background: #f0f4f8;'>\n          <td style='padding: 10px; border: 1px solid #e2e8f0; text-align: center;'><strong>16</strong></td>\n          <td style='padding: 10px; border: 1px solid #e2e8f0;'>Hexadécimale</td>\n          <td style='padding: 10px; border: 1px solid #e2e8f0;'>0 à 9, A, B, C, D, E, F</td>\n        </tr>\n      </tbody>\n    </table>\n  </div>\n  <div style='background: #fefcbf; padding: 10px; border-radius: 8px; margin-top: 12px;'>\n    <p style='margin: 0; font-size: 0.95em;'><strong>💡 Rappel :</strong> A=10, B=11, C=12, D=13, E=14, F=15</p>\n  </div>\n</div>",
    "texteParle": "Avant de commencer les opérations, rappelons les symboles disponibles dans chaque base. En base 2 (binaire), nous n'avons que deux chiffres : 0 et 1. En base 8 (octale), nous avons les chiffres de 0 à 7. En base 10 (décimale), la nôtre, les chiffres de 0 à 9. Et en base 16 (hexadécimale), nous avons les chiffres de 0 à 9, et les lettres A, B, C, D, E, F qui représentent respectivement 10, 11, 12, 13, 14 et 15. Ces symboles sont importants pour bien effectuer les opérations.",
    "note": "Les symboles disponibles dépendent de la base : base 2 → 0,1 ; base 8 → 0 à 7 ; base 16 → 0 à F."
  },
  {
    "titre": "L'addition en base 2",
    "contenu": "<div style='background: #f0f4f8; color: #1e293b; padding: 18px; border-radius: 12px;'>\n  <h3 style='color: #2b6cb0; margin-top: 0;'>➕ Addition en base 2 (binaire)</h3>\n  <div style='background: white; padding: 16px; border-radius: 8px; border-left: 4px solid #2b6cb0;'>\n    <p style='font-size: 1em; line-height: 1.6;'>Les règles de l'addition binaire :</p>\n    <div style='display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 0;'>\n      <div style='background: #e2e8f0; padding: 4px 8px; border-radius: 4px; text-align: center;'>0 + 0 = 0</div>\n      <div style='background: #e2e8f0; padding: 4px 8px; border-radius: 4px; text-align: center;'>0 + 1 = 1</div>\n      <div style='background: #e2e8f0; padding: 4px 8px; border-radius: 4px; text-align: center;'>1 + 0 = 1</div>\n      <div style='background: #fefcbf; padding: 4px 8px; border-radius: 4px; text-align: center;'><strong>1 + 1 = 0</strong> (retenue de 1)</div>\n    </div>\n    <p style='font-weight: 500; color: #2b6cb0;'>Méthode :</p>\n    <ul style='font-size: 0.95em; line-height: 1.8;'>\n      <li>On additionne chiffre par chiffre, de <strong>droite à gauche</strong>.</li>\n      <li>Quand la somme est ≥ 2, on écrit le <strong>reste</strong> (0 ou 1) et on <strong>retient</strong> 1.</li>\n      <li>La retenue s'ajoute à la colonne suivante.</li>\n    </ul>\n  </div>\n  <div style='background: #e6fffa; padding: 14px; border-radius: 8px; margin-top: 12px; border: 1px solid #38b2ac;'>\n    <strong style='color: #2c7a7b;'>📝 Exemple : 1011₂ + 0110₂</strong>\n    <div style='display: flex; justify-content: center; font-family: monospace; font-size: 1.1em; margin: 4px 0;'>\n      <div style='text-align: right; margin-right: 20px;'>\n        <div>1011</div>\n        <div>+ 0110</div>\n        <div style='border-top: 2px solid #4a5568;'>10001</div>\n      </div>\n    </div>\n    <p style='font-size: 0.9em;'>Vérification : 11₁₀ + 6₁₀ = 17₁₀ = 10001₂ ✓</p>\n  </div>\n</div>",
    "texteParle": "Commençons par l'addition en base 2. Les règles sont très simples : 0+0=0, 0+1=1, 1+0=1, et 1+1=0 avec une retenue de 1. C'est comme en base 10, mais au lieu d'avoir une retenue quand la somme dépasse 9, on a une retenue quand elle dépasse 1. On additionne de droite à gauche, comme d'habitude. Par exemple, 1011 en binaire (qui vaut 11 en décimal) plus 0110 (qui vaut 6 en décimal) donne 10001 (qui vaut 17 en décimal). On peut vérifier le résultat.",
    "note": "En addition binaire, 1+1 = 0 avec une retenue de 1 (car 1+1 = 2₁₀ = 10₂)."
  },
  {
    "titre": "Addition en base 8",
    "contenu": "<div style='background: #f0f4f8; color: #1e293b; padding: 18px; border-radius: 12px;'>\n  <h3 style='color: #2b6cb0; margin-top: 0;'>➕ Addition en base 8 (octale)</h3>\n  <div style='background: white; padding: 16px; border-radius: 8px; border-left: 4px solid #2b6cb0;'>\n    <p style='font-size: 1em; line-height: 1.6;'>Les règles de l'addition octale :</p>\n    <ul style='font-size: 0.95em; line-height: 1.8;'>\n      <li>On additionne chiffre par chiffre, de <strong>droite à gauche</strong>.</li>\n      <li>Quand la somme est ≥ 8, on écrit le <strong>reste</strong> (entre 0 et 7) et on <strong>retient</strong> 1.</li>\n      <li>La retenue s'ajoute à la colonne suivante.</li>\n    </ul>\n    <div style='background: #e2e8f0; padding: 8px; border-radius: 4px; margin-top: 8px;'>\n      <p style='margin: 0; font-size: 0.9em;'><strong>Exemple de somme :</strong> 7₈ + 1₈ = 8₁₀ = 10₈ (on écrit 0, on retient 1)</p>\n      <p style='margin: 0; font-size: 0.9em;'><strong>Exemple de somme :</strong> 6₈ + 5₈ = 11₁₀ = 13₈ (on écrit 3, on retient 1)</p>\n    </div>\n  </div>\n  <div style='background: #e6fffa; padding: 14px; border-radius: 8px; margin-top: 12px; border: 1px solid #38b2ac;'>\n    <strong style='color: #2c7a7b;'>📝 Exemple : 647₈ + 365₈</strong>\n    <div style='display: flex; justify-content: center; font-family: monospace; font-size: 1.1em; margin: 4px 0;'>\n      <div style='text-align: right; margin-right: 20px;'>\n        <div>  647</div>\n        <div>+ 365</div>\n        <div style='border-top: 2px solid #4a5568;'>1234</div>\n      </div>\n    </div>\n    <p style='font-size: 0.9em;'>Détail : 7+5=12 → 12-8=4, retenue 1 ; 4+6+1=11 → 11-8=3, retenue 1 ; 6+3+1=10 → 10-8=2, retenue 1</p>\n    <p style='font-size: 0.9em;'>Vérification : 647₈ = 423₁₀, 365₈ = 245₁₀, somme = 668₁₀ = 1234₈ ✓</p>\n  </div>\n</div>",
    "texteParle": "Pour l'addition en base 8, le principe est le même. On additionne chiffre par chiffre de droite à gauche. Mais ici, la retenue se produit quand la somme atteint ou dépasse 8. Par exemple, 7+1 donne 0 avec une retenue de 1. 6+5 donne 3 avec une retenue de 1. Prenons l'exemple 647 en octal plus 365 en octal. 7+5=12, on écrit 4 et on retient 1. 4+6+1=11, on écrit 3 et on retient 1. 6+3+1=10, on écrit 2 et on retient 1. Le résultat est 1234 en octal. Vérifions en décimal : 647 octal = 423 décimal, 365 octal = 245 décimal, la somme est 668 décimal, qui est bien 1234 en octal.",
    "note": "En addition octale, la retenue se produit quand la somme dépasse 7 (≥ 8)."
  },
  {
    "titre": "Addition en base 16",
    "contenu": "<div style='background: #f0f4f8; color: #1e293b; padding: 18px; border-radius: 12px;'>\n  <h3 style='color: #2b6cb0; margin-top: 0;'>➕ Addition en base 16 (hexadécimale)</h3>\n  <div style='background: white; padding: 16px; border-radius: 8px; border-left: 4px solid #2b6cb0;'>\n    <p style='font-size: 1em; line-height: 1.6;'>Les règles de l'addition hexadécimale :</p>\n    <ul style='font-size: 0.95em; line-height: 1.8;'>\n      <li>On additionne chiffre par chiffre, de <strong>droite à gauche</strong>.</li>\n      <li>Quand la somme est ≥ 16, on écrit le <strong>reste</strong> (entre 0 et F) et on <strong>retient</strong> 1.</li>\n      <li>La retenue s'ajoute à la colonne suivante.</li>\n    </ul>\n    <div style='background: #e2e8f0; padding: 8px; border-radius: 4px; margin-top: 8px;'>\n      <p style='margin: 0; font-size: 0.9em;'><strong>Exemple :</strong> F₁₆ + 1₁₆ = 16₁₀ = 10₁₆ (on écrit 0, on retient 1)</p>\n      <p style='margin: 0; font-size: 0.9em;'><strong>Exemple :</strong> A₁₆ + 7₁₆ = 17₁₀ = 11₁₆ (on écrit 1, on retient 1)</p>\n    </div>\n  </div>\n  <div style='background: #e6fffa; padding: 14px; border-radius: 8px; margin-top: 12px; border: 1px solid #38b2ac;'>\n    <strong style='color: #2c7a7b;'>📝 Exemple : 3F5₁₆ + 2A7₁₆</strong>\n    <div style='display: flex; justify-content: center; font-family: monospace; font-size: 1.1em; margin: 4px 0;'>\n      <div style='text-align: right; margin-right: 20px;'>\n        <div>  3F5</div>\n        <div>+ 2A7</div>\n        <div style='border-top: 2px solid #4a5568;'>69C</div>\n      </div>\n    </div>\n    <p style='font-size: 0.9em;'>Détail : 5+7=12 → C ; F+A = 15+10=25 → 25-16=9, retenue 1 ; 3+2+1=6</p>\n    <p style='font-size: 0.9em;'>Vérification : 3F5₁₆ = 1013₁₀, 2A7₁₆ = 679₁₀, somme = 1692₁₀ = 69C₁₆ ✓</p>\n  </div>\n</div>",
    "texteParle": "Pour l'addition en base 16, c'est le même principe avec une retenue quand la somme atteint ou dépasse 16. Il faut bien connaître les valeurs des lettres : A=10, B=11, C=12, D=13, E=14, F=15. Par exemple, F+1 donne 0 avec une retenue de 1. A+7 donne 1 avec une retenue de 1. Prenons l'exemple 3F5 en hexadécimal plus 2A7. 5+7=12, qui s'écrit C. F+A = 15+10=25, on écrit 9 (25-16) et on retient 1. 3+2+1=6. Le résultat est 69C en hexadécimal. Vérification en décimal : 3F5 = 1013, 2A7 = 679, somme = 1692, qui est bien 69C en hexadécimal.",
    "note": "En addition hexadécimale, la retenue se produit quand la somme dépasse 15 (≥ 16)."
  },
  {
    "titre": "La soustraction en base 2",
    "contenu": "<div style='background: #f0f4f8; color: #1e293b; padding: 18px; border-radius: 12px;'>\n  <h3 style='color: #2b6cb0; margin-top: 0;'>➖ Soustraction en base 2 (binaire)</h3>\n  <div style='background: white; padding: 16px; border-radius: 8px; border-left: 4px solid #2b6cb0;'>\n    <p style='font-size: 1em; line-height: 1.6;'>Les règles de la soustraction binaire :</p>\n    <div style='display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 0;'>\n      <div style='background: #e2e8f0; padding: 4px 8px; border-radius: 4px; text-align: center;'>0 - 0 = 0</div>\n      <div style='background: #e2e8f0; padding: 4px 8px; border-radius: 4px; text-align: center;'>1 - 0 = 1</div>\n      <div style='background: #e2e8f0; padding: 4px 8px; border-radius: 4px; text-align: center;'>1 - 1 = 0</div>\n      <div style='background: #fefcbf; padding: 4px 8px; border-radius: 4px; text-align: center;'><strong>0 - 1 = 1</strong> (emprunt de 1)</div>\n    </div>\n    <p style='font-weight: 500; color: #2b6cb0;'>Méthode :</p>\n    <ul style='font-size: 0.95em; line-height: 1.8;'>\n      <li>On soustrait chiffre par chiffre, de <strong>droite à gauche</strong>.</li>\n      <li>Quand 0 - 1, on <strong>emprunte</strong> 1 à la colonne suivante.</li>\n      <li>L'emprunt se fait en <strong>base 2</strong> : 1 emprunté vaut 2.</li>\n    </ul>\n  </div>\n  <div style='background: #e6fffa; padding: 14px; border-radius: 8px; margin-top: 12px; border: 1px solid #38b2ac;'>\n    <strong style='color: #2c7a7b;'>📝 Exemple : 1010₂ - 0110₂</strong>\n    <div style='display: flex; justify-content: center; font-family: monospace; font-size: 1.1em; margin: 4px 0;'>\n      <div style='text-align: right; margin-right: 20px;'>\n        <div>1010</div>\n        <div>- 0110</div>\n        <div style='border-top: 2px solid #4a5568;'>0100</div>\n      </div>\n    </div>\n    <p style='font-size: 0.9em;'>Vérification : 10₁₀ - 6₁₀ = 4₁₀ = 0100₂ ✓</p>\n  </div>\n</div>",
    "texteParle": "Passons maintenant à la soustraction en base 2. Les règles sont similaires à celles de la soustraction décimale. 0-0=0, 1-0=1, 1-1=0. Le cas particulier est 0-1 : on ne peut pas, donc on emprunte 1 à la colonne suivante. L'emprunt en base 2 vaut 2 (car 1 × 2 = 2). On effectue les soustractions de droite à gauche. Par exemple, 1010 (10 en décimal) moins 0110 (6 en décimal) donne 0100 (4 en décimal). Vérification : 10-6=4, c'est correct.",
    "note": "En soustraction binaire, quand on emprunte, l'emprunt vaut 2 (car la base est 2)."
  },
  {
    "titre": "Soustraction en base 8",
    "contenu": "<div style='background: #f0f4f8; color: #1e293b; padding: 18px; border-radius: 12px;'>\n  <h3 style='color: #2b6cb0; margin-top: 0;'>➖ Soustraction en base 8 (octale)</h3>\n  <div style='background: white; padding: 16px; border-radius: 8px; border-left: 4px solid #2b6cb0;'>\n    <p style='font-size: 1em; line-height: 1.6;'>Les règles de la soustraction octale :</p>\n    <ul style='font-size: 0.95em; line-height: 1.8;'>\n      <li>On soustrait chiffre par chiffre, de <strong>droite à gauche</strong>.</li>\n      <li>Quand le chiffre du haut est <strong>plus petit</strong> que celui du bas, on emprunte.</li>\n      <li>L'emprunt se fait en <strong>base 8</strong> : 1 emprunté vaut 8.</li>\n    </ul>\n    <div style='background: #e2e8f0; padding: 8px; border-radius: 4px; margin-top: 8px;'>\n      <p style='margin: 0; font-size: 0.9em;'><strong>Exemple :</strong> 20₈ - 1₈ = 17₈ (on emprunte 8 à la colonne suivante)</p>\n    </div>\n  </div>\n  <div style='background: #e6fffa; padding: 14px; border-radius: 8px; margin-top: 12px; border: 1px solid #38b2ac;'>\n    <strong style='color: #2c7a7b;'>📝 Exemple : 532₈ - 275₈</strong>\n    <div style='display: flex; justify-content: center; font-family: monospace; font-size: 1.1em; margin: 4px 0;'>\n      <div style='text-align: right; margin-right: 20px;'>\n        <div>532</div>\n        <div>- 275</div>\n        <div style='border-top: 2px solid #4a5568;'>235</div>\n      </div>\n    </div>\n    <p style='font-size: 0.9em;'>Détail : 2-5 impossible → emprunt à 3 (3 devient 2, 2 devient 12) → 12-5=7 ; 2-7 impossible → emprunt à 5 (5 devient 4, 2 devient 10) → 10-7=3 ; 4-2=2</p>\n    <p style='font-size: 0.9em;'>Vérification : 532₈ = 346₁₀, 275₈ = 189₁₀, différence = 157₁₀ = 235₈ ✓</p>\n  </div>\n</div>",
    "texteParle": "Pour la soustraction en base 8, le principe est le même. On soustrait de droite à gauche. Quand le chiffre du haut est plus petit que celui du bas, on emprunte 1 à la colonne suivante. Mais attention, en base 8, un emprunt vaut 8. Par exemple, 20 en octal moins 1 en octal donne 17 en octal. Prenons l'exemple 532 en octal moins 275 en octal. 2-5 est impossible, on emprunte à 3, qui devient 2, et 2 devient 12, 12-5=7. Puis 2-7 est impossible, on emprunte à 5, qui devient 4, et 2 devient 10, 10-7=3. Enfin 4-2=2. Le résultat est 235 en octal. Vérification en décimal : 532 octal = 346 décimal, 275 octal = 189 décimal, différence = 157 décimal = 235 octal.",
    "note": "En soustraction octale, un emprunt vaut 8 (car la base est 8)."
  },
  {
    "titre": "Soustraction en base 16",
    "contenu": "<div style='background: #f0f4f8; color: #1e293b; padding: 18px; border-radius: 12px;'>\n  <h3 style='color: #2b6cb0; margin-top: 0;'>➖ Soustraction en base 16 (hexadécimale)</h3>\n  <div style='background: white; padding: 16px; border-radius: 8px; border-left: 4px solid #2b6cb0;'>\n    <p style='font-size: 1em; line-height: 1.6;'>Les règles de la soustraction hexadécimale :</p>\n    <ul style='font-size: 0.95em; line-height: 1.8;'>\n      <li>On soustrait chiffre par chiffre, de <strong>droite à gauche</strong>.</li>\n      <li>Quand le chiffre du haut est <strong>plus petit</strong> que celui du bas, on emprunte.</li>\n      <li>L'emprunt se fait en <strong>base 16</strong> : 1 emprunté vaut 16.</li>\n    </ul>\n    <div style='background: #e2e8f0; padding: 8px; border-radius: 4px; margin-top: 8px;'>\n      <p style='margin: 0; font-size: 0.9em;'><strong>Exemple :</strong> 10₁₆ - 1₁₆ = F₁₆ (on emprunte 16 à la colonne suivante)</p>\n    </div>\n  </div>\n  <div style='background: #e6fffa; padding: 14px; border-radius: 8px; margin-top: 12px; border: 1px solid #38b2ac;'>\n    <strong style='color: #2c7a7b;'>📝 Exemple : 6A3₁₆ - 2F8₁₆</strong>\n    <div style='display: flex; justify-content: center; font-family: monospace; font-size: 1.1em; margin: 4px 0;'>\n      <div style='text-align: right; margin-right: 20px;'>\n        <div> 6A3</div>\n        <div>- 2F8</div>\n        <div style='border-top: 2px solid #4a5568;'>3AB</div>\n      </div>\n    </div>\n    <p style='font-size: 0.9em;'>Détail : 3-8 impossible → emprunt à A (A=10 devient 9, 3 devient 19) → 19-8=11 → B ; 9-F (F=15) impossible → emprunt à 6 (6 devient 5, 9 devient 25) → 25-15=10 → A ; 5-2=3</p>\n    <p style='font-size: 0.9em;'>Vérification : 6A3₁₆ = 1699₁₀, 2F8₁₆ = 760₁₀, différence = 939₁₀ = 3AB₁₆ ✓</p>\n  </div>\n</div>",
    "texteParle": "Enfin, la soustraction en base 16 suit le même principe, mais avec un emprunt qui vaut 16. Par exemple, 10 en hexadécimal moins 1 donne F. Prenons l'exemple 6A3 en hexadécimal moins 2F8. 3-8 est impossible, on emprunte à A (qui vaut 10). A devient 9, 3 devient 19 (3+16), 19-8=11, qui s'écrit B. Puis 9-F est impossible, on emprunte à 6. 6 devient 5, 9 devient 25 (9+16), 25-15=10, qui s'écrit A. Enfin 5-2=3. Le résultat est 3AB en hexadécimal. Vérification en décimal : 6A3 = 1699, 2F8 = 760, différence = 939, qui est bien 3AB en hexadécimal.",
    "note": "En soustraction hexadécimale, un emprunt vaut 16 (car la base est 16)."
  },
  {
    "titre": "Récapitulatif des opérations en bases",
    "contenu": "<div style='background: #f0f4f8; color: #1e293b; padding: 18px; border-radius: 12px;'>\n  <h3 style='color: #2b6cb0; margin-top: 0;'>📋 Synthèse : Addition et soustraction</h3>\n  <div style='background: white; padding: 16px; border-radius: 8px;'>\n    <table style='width: 100%; border-collapse: collapse; font-size: 0.9em;'>\n      <thead style='background: #2b6cb0; color: white;'>\n        <tr>\n          <th style='padding: 10px; border: 1px solid #e2e8f0;'>Opération</th>\n          <th style='padding: 10px; border: 1px solid #e2e8f0;'>Base 2</th>\n          <th style='padding: 10px; border: 1px solid #e2e8f0;'>Base 8</th>\n          <th style='padding: 10px; border: 1px solid #e2e8f0;'>Base 16</th>\n        </tr>\n      </thead>\n      <tbody>\n        <tr style='background: #e6fffa;'>\n          <td style='padding: 10px; border: 1px solid #e2e8f0;'><strong>Addition</strong></td>\n          <td style='padding: 10px; border: 1px solid #e2e8f0;'>Retenue si ≥ 2</td>\n          <td style='padding: 10px; border: 1px solid #e2e8f0;'>Retenue si ≥ 8</td>\n          <td style='padding: 10px; border: 1px solid #e2e8f0;'>Retenue si ≥ 16</td>\n        </tr>\n        <tr style='background: #f0f4f8;'>\n          <td style='padding: 10px; border: 1px solid #e2e8f0;'><strong>Soustraction</strong></td>\n          <td style='padding: 10px; border: 1px solid #e2e8f0;'>Emprunt = 2</td>\n          <td style='padding: 10px; border: 1px solid #e2e8f0;'>Emprunt = 8</td>\n          <td style='padding: 10px; border: 1px solid #e2e8f0;'>Emprunt = 16</td>\n        </tr>\n      </tbody>\n    </table>\n  </div>\n  <div style='display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px;'>\n    <div style='background: #e6fffa; padding: 12px; border-radius: 8px; border: 1px solid #38b2ac;'>\n      <strong style='color: #2c7a7b;'>✅ Règle d'or pour l'addition</strong>\n      <p style='font-size: 0.9em;'>La retenue se produit quand la somme ≥ base.</p>\n    </div>\n    <div style='background: #fefcbf; padding: 12px; border-radius: 8px; border: 1px solid #ecc94b;'>\n      <strong style='color: #975a16;'>✅ Règle d'or pour la soustraction</strong>\n      <p style='font-size: 0.9em;'>L'emprunt vaut la base (2, 8 ou 16).</p>\n    </div>\n  </div>\n  <div style='background: #e2e8f0; padding: 12px; border-radius: 8px; margin-top: 12px; text-align: center;'>\n    <p style='margin: 0; font-size: 1em;'><strong>🔑 La clé :</strong> Les règles sont universelles, seule la valeur de la base change !</p>\n  </div>\n</div>",
    "texteParle": "Pour récapituler, retenez que les opérations en bases 2, 8 et 16 suivent les mêmes principes que l'addition et la soustraction en base 10. Pour l'addition, on a une retenue quand la somme des chiffres atteint ou dépasse la base. Pour la soustraction, on emprunte quand le chiffre du haut est plus petit que celui du bas, et l'emprunt vaut la base. Ainsi, en base 2, l'emprunt vaut 2 ; en base 8, il vaut 8 ; et en base 16, il vaut 16. Les règles sont universelles, seule la valeur de la base change !",
    "note": "Les opérations arithmétiques en bases 2, 8 et 16 suivent les mêmes principes qu'en base 10, avec des retenues et des emprunts adaptés à la base."
  }
];

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentIndex = 0;
    let isSpeaking = false;
    let isPaused = false;
    let currentUtterance = null;
    let isLoading = false;
    let loadingTimeout = null;
    let isTransitioning = false;
    let speechSupported = true;
    let userInteracted = false;
    let isPlaying = false;
    let loadingCancelled = false;

    const total = slides.length;
    const synth = window.speechSynthesis;

    // Références jQuery
    const $title = $('#slideTitle');
    const $body = $('#slideBody');
    const $counter = $('#slideCounter');
    const $statusText = $('#statusText');
    const $statusBadge = $('#statusBadge');
    const $loading = $('#loadingOverlay');
    const $loadingText = $('#loadingText');
    const $loadingSub = $('#loadingSub');
    const $loadingTimeout = $('#loadingTimeout');
    const $loadingProgressBar = $('#loadingProgressBar');
    const $autoIndicator = $('#autoIndicator');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $replay = $('#replayBtn');
    const $play = $('#playBtn');
    const $cancelLoading = $('#cancelLoadingBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function setStatus(text, type) {
        $statusText.text(text);
        $statusBadge.removeClass('idle speaking error paused waiting loading');
        if (type === 'speaking') $statusBadge.addClass('speaking');
        else if (type === 'error') $statusBadge.addClass('error');
        else if (type === 'paused') $statusBadge.addClass('paused');
        else if (type === 'waiting') $statusBadge.addClass('waiting');
        else if (type === 'loading') $statusBadge.addClass('loading');
        else $statusBadge.addClass('idle');
    }

    function updatePlayButton() {
        if (isPlaying) {
            $play.addClass('playing');
            $play.find('.btn-icon').text('⏸');
            $play.find('.btn-label').text('Pause');
        } else {
            $play.removeClass('playing');
            $play.find('.btn-icon').text('▶');
            $play.find('.btn-label').text('Play');
        }
    }

    function showLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        
        loadingCancelled = false;
        isLoading = true;
        
        // Réinitialiser la barre de progression
        $loadingProgressBar.css('animation', 'none');
        $loadingProgressBar.css('width', '0%');
        // Forcer un reflow
        $loadingProgressBar[0].offsetHeight;
        $loadingProgressBar.css('animation', 'loadingProgress 30s ease-out forwards');
        
        $loadingText.text('Préparation vocale...');
        $loadingSub.text('Synthèse en cours');
        $loadingTimeout.text('⏱️ 30 secondes maximum');
        $loading.fadeIn(300);
        setStatus("⏳ Chargement...", 'loading');
        
        // 🔥 TIMEOUT DE 30 SECONDES
        loadingTimeout = setTimeout(() => {
            if (isLoading && !loadingCancelled) {
                hideLoading();
                setStatus("⚠️ Délai dépassé (30s)", 'error');
                isPlaying = false;
                updatePlayButton();
                $loadingSub.text('La synthèse vocale a pris trop de temps');
                $loadingTimeout.text('❌ Délai dépassé');
            }
        }, 30000);
    }

    function hideLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        isLoading = false;
        loadingCancelled = false;
        $loading.fadeOut(300);
        // Ne pas changer le statut si on est en train de parler
        if (!isSpeaking && !isPlaying) {
            setStatus("⏸ Lecture arrêtée", 'paused');
        }
    }

    function cancelLoading() {
        loadingCancelled = true;
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        hideLoading();
        stopSpeaking();
        setStatus("⏸ Annulé", 'paused');
        isPlaying = false;
        updatePlayButton();
        $loadingText.text('Annulé par l\'utilisateur');
        $loadingSub.text('Vous pouvez réessayer');
        $loadingTimeout.text('✕ Annulation');
    }

    // Arrêter la parole proprement
    function stopSpeaking() {
        try {
            if (synth && (synth.speaking || synth.pending)) {
                synth.cancel();
            }
        } catch(e) {
            console.warn('Erreur stopSpeaking:', e);
        }
        if (currentUtterance) {
            try {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance.onstart = null;
            } catch(e) {}
            currentUtterance = null;
        }
        isSpeaking = false;
        isPlaying = false;
        updatePlayButton();
    }

    // Mettre en pause la parole
    function pauseSpeaking() {
        try {
            if (synth && synth.speaking) {
                synth.pause();
                isPaused = true;
                isPlaying = false;
                setStatus("⏸ Lecture en pause", 'paused');
                updatePlayButton();
            }
        } catch(e) {
            console.warn('Erreur pauseSpeaking:', e);
            stopSpeaking();
        }
    }

    // Reprendre la parole
    function resumeSpeaking() {
        try {
            if (synth && synth.paused) {
                synth.resume();
                isPaused = false;
                isPlaying = true;
                setStatus("🔊 Lecture en cours", 'speaking');
                updatePlayButton();
            } else if (!isSpeaking && !synth.speaking && !synth.pending) {
                speakSlide(currentIndex);
            }
        } catch(e) {
            console.warn('Erreur resumeSpeaking:', e);
            speakSlide(currentIndex);
        }
    }

    function renderSlide(index) {
        const slide = slides[index];
        $title.text(slide.titre);

        let html = '';
        html += `<div class="content-card">${slide.contenu}</div>`;
        if (slide.note) {
            html += `<div class="note-box">${slide.note}</div>`;
        }
        $body.html(html);
        $counter.text(`${index+1} / ${total}`);

        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
        }
    }

    // ================================================================
    // LECTURE VOCALE
    // ================================================================
    function speakSlide(index) {
        return new Promise((resolve) => {
            const slide = slides[index];
            const text = slide.texteParle;
            
            if (!text || text.trim() === '' || !speechSupported) {
                resolve();
                return;
            }

            if (!window.speechSynthesis) {
                setStatus("❌ Synthèse vocale non supportée", 'error');
                speechSupported = false;
                resolve();
                return;
            }

            // Arrêter toute lecture en cours
            stopSpeaking();
            
            // Réinitialiser l'état de pause
            isPaused = false;
            
            showLoading();
            setStatus("Initialisation...", 'loading');

            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.92;
                utterance.pitch = 1.05;
                utterance.volume = 1;

                let isFinished = false;
                let errorHandled = false;

                utterance.onstart = function() {
                    if (loadingCancelled) {
                        stopSpeaking();
                        resolve();
                        return;
                    }
                    hideLoading();
                    isSpeaking = true;
                    isPlaying = true;
                    isPaused = false;
                    setStatus("🔊 Lecture en cours", 'speaking');
                    updatePlayButton();
                };

                utterance.onend = function() {
                    if (isFinished) return;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    setStatus("✅ Terminé", 'idle');
                    hideLoading();
                    updatePlayButton();
                    resolve();
                };

                utterance.onerror = function(e) {
                    if (isFinished || errorHandled) return;
                    errorHandled = true;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    hideLoading();
                    updatePlayButton();
                    
                    if (e.error === 'not-allowed') {
                        setStatus("⚠️ Permission refusée", 'error');
                    } else if (e.error === 'synthesis-unavailable') {
                        setStatus("⚠️ Synthèse indisponible", 'error');
                    } else if (e.error === 'canceled') {
                        setStatus("⏸ Annulé", 'paused');
                    } else {
                        setStatus("❌ Erreur audio: " + (e.error || 'inconnue'), 'error');
                    }
                    
                    resolve();
                };

                // Gestion du chargement des voix
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = function() {
                        if (!loadingCancelled) {
                            try {
                                synth.speak(utterance);
                            } catch(err) {
                                // Silencieux
                            }
                        }
                        synth.onvoiceschanged = null;
                    };
                }

                currentUtterance = utterance;
                
                if (!loadingCancelled) {
                    try {
                        synth.speak(utterance);
                    } catch(err) {
                        setTimeout(() => {
                            if (!loadingCancelled) {
                                try {
                                    synth.speak(utterance);
                                } catch(e) {
                                    setStatus("❌ Erreur de lecture", 'error');
                                    isPlaying = false;
                                    updatePlayButton();
                                    hideLoading();
                                    resolve();
                                }
                            } else {
                                resolve();
                            }
                        }, 100);
                    }
                } else {
                    resolve();
                }

            } catch(err) {
                hideLoading();
                setStatus("❌ Erreur générale", 'error');
                isPlaying = false;
                updatePlayButton();
                console.error('Erreur speakSlide:', err);
                resolve();
            }
        });
    }

    // ================================================================
    // NAVIGATION
    // ================================================================
    async function goToSlide(index) {
        if (isTransitioning) return;
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        
        // Si on est en train de lire, on met en pause avant de naviguer
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        // Arrêter complètement la lecture
        stopSpeaking();
        
        await new Promise(r => setTimeout(r, 50));
        
        if (index === currentIndex) {
            setStatus("📄 Slide actuel", 'idle');
            return;
        }

        isTransitioning = true;
        currentIndex = index;
        renderSlide(index);
        
        // Réinitialiser l'état de lecture
        isPlaying = false;
        updatePlayButton();
        setStatus("⏸ Lecture arrêtée", 'paused');

        await new Promise(r => setTimeout(r, 150));
        isTransitioning = false;
    }

    async function goToNext() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex + 1 < total) {
            await goToSlide(currentIndex + 1);
        } else {
            setStatus("🏁 Dernier slide", 'idle');
        }
    }

    async function goToPrev() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex - 1 >= 0) {
            await goToSlide(currentIndex - 1);
        } else {
            setStatus("🔁 Premier slide", 'idle');
        }
    }

    // ================================================================
    // GESTION PLAY/PAUSE
    // ================================================================
    function togglePlay() {
        if (!userInteracted) {
            userInteracted = true;
        }

        // Si le chargement est en cours, on l'annule
        if (isLoading) {
            cancelLoading();
            return;
        }

        // Si le synthétiseur est en pause, on reprend
        if (synth && synth.paused) {
            resumeSpeaking();
            return;
        }

        // Si la lecture est en cours, on met en pause
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
            return;
        }

        // Sinon, on démarre la lecture du slide courant
        if (!isSpeaking && !isPlaying) {
            stopSpeaking();
            speakSlide(currentIndex);
        }
    }

    // ================================================================
    // INIT
    // ================================================================
    async function init() {
        // Vérifier la compatibilité
        if (!window.speechSynthesis) {
            setStatus("❌ Synthèse vocale non supportée", 'error');
            speechSupported = false;
        }

        // Précharger les voix
        try {
            if (synth.getVoices) {
                synth.getVoices();
                setTimeout(() => {
                    try {
                        synth.getVoices();
                    } catch(e) {}
                }, 200);
            }
        } catch(e) {
            console.warn('Erreur chargement voix:', e);
        }

        // Afficher le premier slide
        renderSlide(0);
        $counter.text(`1 / ${total}`);
        
        // État initial
        setStatus("⏸ Appuie sur Play", 'paused');
        updatePlayButton();
        $autoIndicator.text('⏸ Lecture manuelle');

        // ================================================================
        // ÉVÉNEMENTS
        // ================================================================
        
        // Bouton Play/Pause
        $play.on('click', function() {
            togglePlay();
        });

        // Bouton Annuler le chargement
        $cancelLoading.on('click', function() {
            cancelLoading();
        });

        // Navigation
        $prev.on('click', function() {
            // Si chargement en cours, on annule
            if (isLoading) cancelLoading();
            goToPrev();
        });

        $next.on('click', function() {
            if (isLoading) cancelLoading();
            goToNext();
        });

        // Replay - relire le slide courant
        $replay.on('click', function() {
            if (isLoading) cancelLoading();
            stopSpeaking();
            setTimeout(() => {
                speakSlide(currentIndex);
            }, 100);
        });

        // Support du clavier (espace pour play/pause)
        $(document).on('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });

        // Nettoyage
        $(window).on('beforeunload', function() {
            try {
                if (synth.speaking) synth.cancel();
            } catch(e) {}
            hideLoading();
        });

        // Gérer les cas où la synthèse se termine de manière inattendue
        setInterval(() => {
            if (isPlaying && !synth.speaking && !synth.pending && !isPaused && !isLoading) {
                isPlaying = false;
                updatePlayButton();
                setStatus("⏸ Lecture arrêtée", 'paused');
            }
        }, 1000);
    }

    init();
});



    // ================================================================
    // GESTION DU THÈME JOUR/NUIT
    // ================================================================
    let isDarkMode = false;

    function toggleTheme() {
        isDarkMode = !isDarkMode;
        const body = document.body;
        const appContainer = document.querySelector('.app-container');
        const header = document.querySelector('.slide-header');
        const footer = document.querySelector('.slide-footer');
        const contentCards = document.querySelectorAll('.content-card');
        const noteBoxes = document.querySelectorAll('.note-box');
        const mathBlocks = document.querySelectorAll('.math-block');
        const buttons = document.querySelectorAll('.btn');
        const statusBadge = document.querySelector('.status-badge');
        const slideCounter = document.querySelector('.slide-counter');
        const autoIndicator = document.querySelector('.auto-indicator');
        const themeBtn = document.getElementById('themeToggle');

        if (isDarkMode) {
            // Mode nuit
            body.style.background = '#0b1120';
            body.style.color = '#f1f5f9';
            appContainer.style.background = 'linear-gradient(145deg, #0f172a 0%, #1e293b 100%)';
            header.style.background = 'rgba(15, 23, 42, 0.85)';
            footer.style.background = 'rgba(15, 23, 42, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.05)';
                card.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.08)';
                note.style.color = '#cbd5e1';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.25)';
                block.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#e2e8f0';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.12)';
                statusBadge.style.color = '#93bbfc';
            }
            if (slideCounter) {
                slideCounter.style.color = '#94a3b8';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#64748b';
            }
            if (themeBtn) {
                themeBtn.textContent = '☀️';
                themeBtn.title = 'Passer en mode jour';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#e2e8f0';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#e2e8f0';
                }
            });
        } else {
            // Mode jour (par défaut)
            body.style.background = '#f0f4f8';
            body.style.color = '#1a202c';
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
            header.style.background = 'rgba(255, 255, 255, 0.85)';
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.8)';
                card.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.12)';
                note.style.color = '#2c3e50';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.05)';
                block.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#2d3748';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
                statusBadge.style.color = '#2b6cb0';
            }
            if (slideCounter) {
                slideCounter.style.color = '#4a5568';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#718096';
            }
            if (themeBtn) {
                themeBtn.textContent = '🌓';
                themeBtn.title = 'Passer en mode nuit';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#2c3e50';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#2d3748';
                }
            });
        }
    }

    // Initialiser en mode jour
    document.addEventListener('DOMContentLoaded', function() {
        // Appliquer le mode jour par défaut
        const body = document.body;
        body.style.background = '#f0f4f8';
        body.style.color = '#1a202c';
        
        const appContainer = document.querySelector('.app-container');
        if (appContainer) {
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
        }
        
        const header = document.querySelector('.slide-header');
        if (header) {
            header.style.background = 'rgba(255, 255, 255, 0.85)';
        }
        
        const footer = document.querySelector('.slide-footer');
        if (footer) {
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
        }
        
        document.querySelectorAll('.content-card').forEach(card => {

            card.style.borderColor = 'rgba(0,0,0,0.08)';
        });

            note.style.background = 'rgba(96, 165, 250, 0.12)';
            note.style.color = '#2c3e50';

            block.style.background = 'rgba(0,0,0,0.05)';
            block.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.btn').forEach(btn => {
            btn.style.color = '#2d3748';
        });

        if (slideCounter) {

        }
        
        const autoIndicator = document.querySelector('.auto-indicator');

        document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {

        const themeBtn = document.getElementById('themeToggle');
        if (themeBtn) {

        }
    });
