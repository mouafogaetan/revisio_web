<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
 "matiere": "Informatique",
 "classe": "4ème année",
 "sequence": "Séquence 1",
 "anneeScolaire": "2025-2026",
 "exercices": [
   {
     "titre": "Exercice 1 : Architecture matérielle d'un ordinateur",
     "points": "6 pts",
     "enonce": "<div style='font-size: 16px; line-height: 1.6; color: #333; background: #f8f9fa; padding: 15px; border-radius: 8px;'> <p>L'unité centrale est le boîtier principal d'un ordinateur. Elle contient plusieurs composants électroniques essentiels à son fonctionnement. Le schéma ci-dessous représente les différents composants que l'on trouve à l'intérieur de l'unité centrale.</p> <div style='background: #e9ecef; border: 2px dashed #6c757d; border-radius: 8px; padding: 20px; text-align: center; margin: 15px 0;'> <img src='boitier_unite_centrale.png' alt='Schéma de l'unité centrale d'un ordinateur' style='max-width: 100%; height: auto; border-radius: 5px;'> <p style='color: #6c757d; font-style: italic;'>Schéma de l'unité centrale et ses composants</p> </div> <p>Les composants suivants sont à placer correctement dans le schéma : <strong>1</strong> - Processeur, <strong>2</strong> - Mémoire RAM, <strong>3</strong> - Carte mère, <strong>4</strong> - Disque dur, <strong>5</strong> - Alimentation.</p> <p><span style='background: #fff3cd; padding: 2px 8px; border-radius: 4px;'><strong>Rappel des objectifs :</strong> Lister et décrire quelques composants que l'on retrouve dans l'unité centrale. Identifier les éléments connectés par une carte mère.</span></p> </div>",
     "questions": [
       {
         "question": "<p style='font-size: 15px; color: #333;'><strong>1.</strong> Recopier le tableau ci-dessous dans votre copie puis associer chaque numéro du schéma au composant correspondant.</p> <div style='background: #fff; padding: 10px; border-radius: 5px; border: 1px solid #dee2e6;'> <table style='width: 100%; border-collapse: collapse; font-size: 14px;'> <thead> <tr style='background: #e9ecef;'> <th style='padding: 8px; border: 1px solid #dee2e6;'>Numéro du composant</th> <th style='padding: 8px; border: 1px solid #dee2e6;'>Nom du composant</th> <th style='padding: 8px; border: 1px solid #dee2e6;'>Rôle principal</th> </tr> </thead> <tbody> <tr><td style='padding: 8px; border: 1px solid #dee2e6;'>1</td><td style='padding: 8px; border: 1px solid #dee2e6;'></td><td style='padding: 8px; border: 1px solid #dee2e6;'></td></tr> <tr><td style='padding: 8px; border: 1px solid #dee2e6;'>2</td><td style='padding: 8px; border: 1px solid #dee2e6;'></td><td style='padding: 8px; border: 1px solid #dee2e6;'></td></tr> <tr><td style='padding: 8px; border: 1px solid #dee2e6;'>3</td><td style='padding: 8px; border: 1px solid #dee2e6;'></td><td style='padding: 8px; border: 1px solid #dee2e6;'></td></tr> <tr><td style='padding: 8px; border: 1px solid #dee2e6;'>4</td><td style='padding: 8px; border: 1px solid #dee2e6;'></td><td style='padding: 8px; border: 1px solid #dee2e6;'></td></tr> <tr><td style='padding: 8px; border: 1px solid #dee2e6;'>5</td><td style='padding: 8px; border: 1px solid #dee2e6;'></td><td style='padding: 8px; border: 1px solid #dee2e6;'></td></tr> </tbody> </table> </div> <p style='font-size: 14px; color: #495057; margin-top: 8px;'>Pour le rôle, utiliser les verbes de la taxonomie de Bloom : <em>Décrire, Expliquer, Identifier, Lister</em>.</p>",
         "reponse": "<div style='background: #d4edda; padding: 12px; border-radius: 5px; border-left: 4px solid #28a745;'> <p style='font-weight: bold; color: #155724;'>Correction :</p> <table style='width: 100%; border-collapse: collapse; font-size: 14px;'> <thead style='background: #c3e6cb;'><tr><th style='padding: 6px; border: 1px solid #b8daff;'>Numéro</th><th style='padding: 6px; border: 1px solid #b8daff;'>Nom</th><th style='padding: 6px; border: 1px solid #b8daff;'>Rôle</th></tr></thead> <tbody> <tr><td style='padding: 6px; border: 1px solid #b8daff;'>1</td><td style='padding: 6px; border: 1px solid #b8daff;'>Processeur (CPU)</td><td style='padding: 6px; border: 1px solid #b8daff;'>Exécute les instructions et traite les données. C'est le cerveau de l'ordinateur.</td></tr> <tr><td style='padding: 6px; border: 1px solid #b8daff;'>2</td><td style='padding: 6px; border: 1px solid #b8daff;'>Mémoire RAM</td><td style='padding: 6px; border: 1px solid #b8daff;'>Stocke temporairement les données et les programmes en cours d'utilisation.</td></tr> <tr><td style='padding: 6px; border: 1px solid #b8daff;'>3</td><td style='padding: 6px; border: 1px solid #b8daff;'>Carte mère</td><td style='padding: 6px; border: 1px solid #b8daff;'>Relie et permet la communication entre tous les composants.</td></tr> <tr><td style='padding: 6px; border: 1px solid #b8daff;'>4</td><td style='padding: 6px; border: 1px solid #b8daff;'>Disque dur (HDD/SSD)</td><td style='padding: 6px; border: 1px solid #b8daff;'>Stocke les données de manière permanente même lorsque l'ordinateur est éteint.</td></tr> <tr><td style='padding: 6px; border: 1px solid #b8daff;'>5</td><td style='padding: 6px; border: 1px solid #b8daff;'>Alimentation</td><td style='padding: 6px; border: 1px solid #b8daff;'>Fournit l'énergie électrique nécessaire à tous les composants.</td></tr> </tbody> </table> <p style='margin-top: 10px; color: #155724;'><strong>Explication :</strong> La carte mère agit comme une colonne vertébrale. Tous les composants (processeur, RAM, disque dur, etc.) y sont connectés pour échanger des informations. C'est pourquoi on dit qu'elle identifie les éléments connectés par une carte mère.</p> </div>"
       }
     ]
   },
   {
     "titre": "Exercice 2 : Périphériques et unités de mesure",
     "points": "7 pts",
     "enonce": "<div style='font-size: 16px; line-height: 1.6; color: #333; background: #f8f9fa; padding: 15px; border-radius: 8px;'> <p>Pour bien utiliser un ordinateur, il est important de connaître les périphériques qui l'accompagnent et les unités de mesure qui permettent de quantifier leurs capacités. Un magasin d'informatique à Douala propose plusieurs équipements.</p> <div style='background: #e9ecef; border-radius: 8px; padding: 15px; margin: 10px 0;'> <p style='font-weight: bold; color: #495057;'>Document 1 : Liste des périphériques</p> <ul style='list-style-type: square; padding-left: 20px;'> <li>Clavier</li> <li>Écran</li> <li>Souris</li> <li>Imprimante</li> <li>Microphone</li> <li>Scanner</li> <li>Enceintes</li> <li>Webcam</li> </ul> </div> <div style='background: #e9ecef; border-radius: 8px; padding: 15px; margin: 10px 0;'> <p style='font-weight: bold; color: #495057;'>Document 2 : Capacités de stockage</p> <ul style='list-style-type: square; padding-left: 20px;'> <li>1 024 octets = 1 Kilo-octet (Ko)</li> <li>1 024 Ko = 1 Méga-octet (Mo)</li> <li>1 024 Mo = 1 Giga-octet (Go)</li> </ul> </div> <p><span style='background: #fff3cd; padding: 2px 8px; border-radius: 4px;'><strong>Rappel des objectifs :</strong> Identifier les périphériques d'entrée/sortie. Décrire les types de mémoires d'un ordinateur. Convertir les mesures de capacités informatiques.</span></p> </div>",
     "questions": [
       {
         "question": "<p style='font-size: 15px; color: #333;'><strong>2.1 (3 pts)</strong> Classer les périphériques du document 1 en trois catégories : périphériques d'entrée, périphériques de sortie et périphériques d'entrée/sortie.</p> <div style='background: #fff; padding: 10px; border-radius: 5px; border: 1px solid #dee2e6;'> <table style='width: 100%; border-collapse: collapse; font-size: 14px;'> <thead> <tr style='background: #e9ecef;'> <th style='padding: 8px; border: 1px solid #dee2e6;'>Périphériques d'entrée</th> <th style='padding: 8px; border: 1px solid #dee2e6;'>Périphériques de sortie</th> <th style='padding: 8px; border: 1px solid #dee2e6;'>Périphériques d'entrée/sortie</th> </tr> </thead> <tbody> <tr><td style='padding: 8px; border: 1px solid #dee2e6;'></td><td style='padding: 8px; border: 1px solid #dee2e6;'></td><td style='padding: 8px; border: 1px solid #dee2e6;'></td></tr> </tbody> </table> </div> <p style='font-size: 15px; color: #333;'><strong>2.2 (2 pts)</strong> Expliquer la différence entre une mémoire vive (RAM) et une mémoire morte (ROM).</p> <p style='font-size: 15px; color: #333;'><strong>2.3 (2 pts)</strong> Un disque dur a une capacité de 500 Go. Convertir cette capacité en Méga-octets (Mo).</p>",
         "reponse": "<div style='background: #d4edda; padding: 12px; border-radius: 5px; border-left: 4px solid #28a745;'> <p style='font-weight: bold; color: #155724;'>Correction :</p> <p><strong>2.1</strong></p> <table style='width: 100%; border-collapse: collapse; font-size: 14px;'> <thead style='background: #c3e6cb;'><tr><th style='padding: 6px; border: 1px solid #b8daff;'>Entrée</th><th style='padding: 6px; border: 1px solid #b8daff;'>Sortie</th><th style='padding: 6px; border: 1px solid #b8daff;'>Entrée/Sortie</th></tr></thead> <tbody><tr><td style='padding: 6px; border: 1px solid #b8daff;'>Clavier, Souris, Microphone, Scanner, Webcam</td><td style='padding: 6px; border: 1px solid #b8daff;'>Écran, Imprimante, Enceintes</td><td style='padding: 6px; border: 1px solid #b8daff;'>Aucun dans la liste</td></tr></tbody> </table> <p><strong>2.2</strong></p> <ul><li><strong>RAM (Mémoire Vive) :</strong> Stocke temporairement les données. Son contenu est effacé lorsque l'ordinateur est éteint.</li><li><strong>ROM (Mémoire Morte) :</strong> Stocke des données de manière permanente (firmware). Son contenu n'est pas effacé à l'extinction.</li></ul> <p><strong>2.3</strong></p> <p>Rappel : 1 Go = 1 024 Mo donc 500 Go = 500 × 1 024 = 512 000 Mo.</p> </div>"
       }
     ]
   },
   {
     "titre": "Exercice 3 : Logiciels et systèmes d'exploitation",
     "points": "7 pts",
     "enonce": "<div style='font-size: 16px; line-height: 1.6; color: #333; background: #f8f9fa; padding: 15px; border-radius: 8px;'> <p>Les logiciels sont indispensables pour utiliser un ordinateur. Ils se répartissent en plusieurs catégories selon leurs fonctions. Dans une entreprise, le service informatique doit gérer à la fois les logiciels système et les logiciels d'application.</p> <div style='background: #e9ecef; border-radius: 8px; padding: 15px; margin: 10px 0;'> <p style='font-weight: bold; color: #495057;'>Situation :</p> <p>Dans l'entreprise <strong>Tech-Cameroun</strong>, les employés utilisent :</p> <ul style='list-style-type: square; padding-left: 20px;'> <li>Windows 10 comme système d'exploitation</li> <li>Microsoft Word pour rédiger des rapports</li> <li>Microsoft Excel pour faire des calculs</li> <li>Un antivirus pour se protéger</li> <li>Google Chrome pour naviguer sur Internet</li> </ul> </div> <p><span style='background: #fff3cd; padding: 2px 8px; border-radius: 4px;'><strong>Rappel des objectifs :</strong> Lister et décrire les différents types de logiciels système. Identifier les principales fonctions d'un système d'exploitation. Catégoriser les logiciels d'application selon les tâches effectuées.</span></p> </div>",

eu vidéo</td></tr> </tbody> </table> </div>"

     "questions": [

       }

     "enonce": "<div style='font-size: 16px; line-height: 1.6; color: #333; background: #f8f9fa; padding: 15px; border-radius: 8px;'> <p>En algorithmique, les variables et les constantes sont des objets essentiels. Les instructions simples permettent de manipuler ces objets.</p> <p><span style='background: #fff3cd; padding: 2px 8px; border-radius: 4px;'><strong>Rappel des objectifs :</strong> Identifier les variables et leurs caractéristiques. Identifier les constantes. Identifier les instructions simples (Lecture, écriture, affectation). Identifier une incrémentation/décrémentation.</span></p> </div>",

         "reponse": "<div style='background: #d4edda; padding: 12px; border-radius: 5px; border-left: 4px solid #28a745;'> <p style='font-weight: bold; color: #155724;'>Correction :</p> <p><strong>5.1</strong></p> <ul><li>Nom (identifiant)</li><li>Type (entier, réel, caractère, booléen, etc.)</li><li>Valeur (contenu stocké)</li><li>Portée (où la variable est accessible dans l'algorithme)</li></ul> <p><strong>5.2</strong></p> <ul><li><strong>Variables :</strong> n1, n2, n3, moy (de type réel)</li><li><strong>Constantes :</strong> 10 (seuil d'admission), 3 (nombre de notes)</li><li><strong>Instruction d'affectation :</strong> <em>moy ← (n1 + n2 + n3) / 3</em></li></ul> <p><strong>5.3</strong></p> <ul><li><strong>Incrémentation :</strong> <em>i ← i + 1</em> (augmente la valeur de i de 1)</li><li><strong>Décrémentation :</strong> <em>i ← i - 1</em> (diminue la valeur de i de 1)</li><li><strong>Rôle :</strong> Ces instructions sont souvent utilisées dans les boucles pour contrôler le nombre d'itérations.</li></ul> </div>"

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
