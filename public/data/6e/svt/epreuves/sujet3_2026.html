<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Sciences",
  "classe": "Sixième",
  "sequence": "Séquence 3",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Propriétés de la matière",
      "points": "4 pts",
      "enonce": "<p style='font-size: 1.1em;'>Pour construire une maison, on utilise différents matériaux. Certains matériaux laissent passer l'eau (ils sont perméables), d'autres ne laissent pas passer l'eau (ils sont imperméables).</p><p>Voici une liste de matériaux :</p><ul style='list-style-type: none; padding-left: 0;'><li style='background-color: #E3F2FD; padding: 5px; border-radius: 5px; margin-bottom: 5px;'>- Le sable</li><li style='background-color: #E3F2FD; padding: 5px; border-radius: 5px; margin-bottom: 5px;'>- Le plastique</li><li style='background-color: #E3F2FD; padding: 5px; border-radius: 5px; margin-bottom: 5px;'>- Le verre</li><li style='background-color: #E3F2FD; padding: 5px; border-radius: 5px; margin-bottom: 5px;'>- Le carton</li></ul><p>Réponds aux questions suivantes.</p>",
      "questions": [
        {
          "question": "<p><strong>1)</strong> Définis la perméabilité en utilisant tes propres mots.</p>",
          "reponse": "<p>La perméabilité est la capacité d'un matériau à laisser passer un liquide ou un gaz à travers ses pores ou ses interstices.</p>"
        },
        {
          "question": "<p><strong>2)</strong> Parmi les matériaux de la liste, lequel est perméable ? Justifie ta réponse.</p>",
          "reponse": "<p>Le sable est perméable car il est composé de grains qui laissent passer l'eau entre eux.</p>"
        },
        {
          "question": "<p><strong>3)</strong> Explique pourquoi le plastique est utilisé pour fabriquer des bouteilles d'eau.</p>",
          "reponse": "<p>Le plastique est imperméable, il ne laisse pas passer l'eau. Il est donc idéal pour contenir des liquides sans qu'ils ne s'échappent.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Acidité, basicité et pH",
      "points": "4 pts",
      "enonce": "<p style='font-size: 1.1em;'>On a testé différents liquides avec du papier tournesol. Voici les résultats :</p><table style='width: 100%; border-collapse: collapse; background-color: #f9f9f9; color: #333;'><thead><tr style='background-color: #4CAF50; color: white;'><th style='padding: 8px; border: 1px solid #ddd;'>Liquide</th><th style='padding: 8px; border: 1px solid #ddd;'>Couleur du papier tournesol</th></tr></thead><tbody><tr><td style='padding: 8px; border: 1px solid #ddd;'>Jus de citron</td><td style='padding: 8px; border: 1px solid #ddd;'>Rouge</td></tr><tr><td style='padding: 8px; border: 1px solid #ddd;'>Eau savonneuse</td><td style='padding: 8px; border: 1px solid #ddd;'>Bleue</td></tr><tr><td style='padding: 8px; border: 1px solid #ddd;'>Eau du robinet</td><td style='padding: 8px; border: 1px solid #ddd;'>Jaune</td></tr></tbody></table><p>Réponds aux questions suivantes.</p>",
      "questions": [
        {
          "question": "<p><strong>1)</strong> Définis l'acidité d'une solution.</p>",
          "reponse": "<p>L'acidité est la propriété d'une solution qui a un goût acide et qui contient des ions hydrogène (H+). Elle est caractérisée par un pH inférieur à 7.</p>"
        },
        {
          "question": "<p><strong>2)</strong> Définis la basicité d'une solution.</p>",
          "reponse": "<p>La basicité est la propriété d'une solution qui a un goût amer et qui contient des ions hydroxyde (OH-). Elle est caractérisée par un pH supérieur à 7.</p>"
        },
        {
          "question": "<p><strong>3)</strong> Parmi les liquides testés, identifie celui qui est acide, celui qui est basique et celui qui est neutre.</p>",
          "reponse": "<p>Le jus de citron est acide (papier rouge). L'eau savonneuse est basique (papier bleu). L'eau du robinet est neutre (papier jaune).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Température, états de la matière et changements d'état",
      "points": "6 pts",
      "enonce": "<p style='font-size: 1.1em;'>L'eau est une substance qui existe sous trois états : solide (glace), liquide (eau) et gazeux (vapeur d'eau). Ces états dépendent de la température.</p><div style='background-color: #E0F7FA; padding: 10px; border-radius: 8px; margin: 10px 0;'><p style='color: #00695C;'><strong>Rappel :</strong> À 0°C, l'eau passe de l'état liquide à l'état solide (fusion inverse). À 100°C, l'eau passe de l'état liquide à l'état gazeux (ébullition).</p></div><p>Réponds aux questions suivantes.</p>",
      "questions": [
        {
          "question": "<p><strong>1)</strong> Cite les trois états de la matière.</p>",
          "reponse": "<p>Les trois états de la matière sont : l'état solide, l'état liquide et l'état gazeux.</p>"
        },
        {
          "question": "<p><strong>2)</strong> Explique ce qui arrive à l'eau lorsque la température passe de 0°C à 100°C.</p>",
          "reponse": "<p>Quand la température de l'eau augmente de 0°C à 100°C, elle passe de l'état solide (glace) à l'état liquide (fusion), puis de l'état liquide à l'état gazeux (vapeur) à 100°C.</p>"
        },
        {
          "question": "<p><strong>3)</strong> Donne un exemple de la vie quotidienne où l'eau passe de l'état liquide à l'état gazeux.</p>",
          "reponse": "<p>Lorsqu'on fait bouillir de l'eau pour préparer un repas, l'eau passe de l'état liquide à l'état gazeux (vapeur d'eau). C'est un exemple d'ébullition.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : L'énergie, ses formes et sources",
      "points": "6 pts",
      "enonce": "<p style='font-size: 1.1em;'>L'énergie est essentielle dans notre vie quotidienne. Elle se présente sous différentes formes et provient de différentes sources.</p><p>Un élève observe son environnement et note ceci :</p><ul style='list-style-type: none; padding-left: 0;'><li style='background-color: #FFF3E0; padding: 5px; border-radius: 5px; margin-bottom: 5px;'>- Le soleil éclaire la Terre.</li><li style='background-color: #FFF3E0; padding: 5px; border-radius: 5px; margin-bottom: 5px;'>- Un moteur fait tourner une roue.</li><li style='background-color: #FFF3E0; padding: 5px; border-radius: 5px; margin-bottom: 5px;'>- Une lampe produit de la lumière.</li><li style='background-color: #FFF3E0; padding: 5px; border-radius: 5px; margin-bottom: 5px;'>- Une batterie alimente un téléphone.</li></ul><p>Réponds aux questions suivantes.</p>",
      "questions": [
        {
          "question": "<p><strong>1)</strong> Définis l'énergie en utilisant tes propres mots.</p>",
          "reponse": "<p>L'énergie est ce qui permet de faire fonctionner les objets, de produire de la lumière, de la chaleur, du mouvement. Elle est nécessaire pour toute action.</p>"
        },
        {
          "question": "<p><strong>2)</strong> Pour chaque observation, identifie la forme d'énergie présente : énergie lumineuse, énergie mécanique, énergie électrique.</p>",
          "reponse": "<p>Le soleil éclaire la Terre : énergie lumineuse. Un moteur fait tourner une roue : énergie mécanique. Une lampe produit de la lumière : énergie lumineuse (électrique d'abord). Une batterie alimente un téléphone : énergie électrique.</p>"
        },
        {
          "question": "<p><strong>3)</strong> Distingue une source d'énergie renouvelable d'une source d'énergie non renouvelable. Donne un exemple de chacune.</p>",
          "reponse": "<p>Une source d'énergie renouvelable est une source qui se reconstitue naturellement et rapidement, comme le soleil ou le vent. Une source d'énergie non renouvelable est une source qui s'épuise avec le temps, comme le pétrole ou le charbon.</p>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
