<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Présentation mobile</title>
    <!-- MathJax -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' },
            options: { skipHtmlTypes: 'script' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }
    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
    }
    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 500px;
        margin: 0 auto;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }
    .slide-header {
        flex-shrink: 0;
        padding: 18px 16px 10px 16px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        z-index: 10;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }
    .slide-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }
    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
    }
    .content-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 18px 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        flex-shrink: 0;
    }
    .content-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }
    .content-card li {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        line-height: 1.5;
    }
    .content-card li:last-child {
        border-bottom: none;
    }
    .bullet-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
    }
    .math-block {
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        overflow-x: auto;
        flex-shrink: 0;
        margin: 4px 0;
    }
    .math-block .math {
        font-size: 1.2rem;
        color: #e2e8f0;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.08);
        border-left: 4px solid #60a5fa;
        padding: 12px 16px;
        border-radius: 12px;
        font-style: italic;
        font-size: 0.9rem;
        color: #cbd5e1;
        flex-shrink: 0;
    }
    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        border-radius: 0;
        flex-direction: column;
    }
    .loading-card {
        background: #1e293b;
        padding: 32px 28px;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #334155;
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px auto;
    }
    .loading-text {
        font-weight: 600;
        font-size: 1.1rem;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    .loading-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 16px;
    }
    .loading-progress {
        height: 3px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        animation: loadingProgress 30s ease-out forwards;
    }
    .loading-timeout {
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 12px;
    }
    .btn-cancel-loading {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 40px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #f87171;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }
    .btn-cancel-loading:active {
        transform: scale(0.94);
        background: rgba(239, 68, 68, 0.25);
    }
    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
    }
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }
    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }
    .slide-counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255,255,255,0.05);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(255,255,255,0.04);
    }
    .status-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 30px;
        background: rgba(96, 165, 250, 0.12);
        color: #93bbfc;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
    }
    .status-badge .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: pulse-dot 1.2s infinite;
        flex-shrink: 0;
    }
    .status-badge.idle .dot {
        animation: none;
        background: #64748b;
    }
    .status-badge.speaking .dot {
        background: #34d399;
        animation: pulse-dot 0.8s infinite;
    }
    .status-badge.error .dot {
        background: #f87171;
        animation: none;
    }
    .status-badge.paused .dot {
        animation: none;
        background: #fbbf24;
    }
    .status-badge.waiting .dot {
        animation: pulse-dot 1.5s infinite;
        background: #fbbf24;
    }
    .status-badge.loading .dot {
        animation: pulse-dot 0.5s infinite;
        background: #60a5fa;
    }
    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.7); }
    }
    .footer-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }
    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }
    .btn:active {
        transform: scale(0.94);
        background: rgba(255,255,255,0.1);
    }
    .btn-secondary {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.06);
    }
    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
        min-width: 80px;
        justify-content: center;
    }
    .btn-play:active {
        background: rgba(52, 211, 153, 0.25);
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
    }
    .auto-indicator {
        font-size: 0.65rem;
        color: #64748b;
        text-align: center;
        letter-spacing: 0.3px;
        padding: 2px 0;
    }
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.2rem;
        }
        .content-card li {
            font-size: 0.9rem;
            padding: 8px 0;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .btn-play {
            min-width: 60px;
        }
        .footer-buttons {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
        .loading-card {
            padding: 20px 16px;
        }
        .math-block .math {
            font-size: 1rem;
        }
    }
    @media (min-width: 600px) {
        .app-container {
            max-width: 480px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
        .loading-overlay {
            border-radius: 32px;
        }
    }
    /* Mode jour (par défaut) - ajouté par le script de thème */
    html, body {
        background: #f0f4f8 !important;
        color: #1a202c !important;
    }
    .app-container {
        background: linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%) !important;
    }
    .slide-header {
        background: rgba(255, 255, 255, 0.85) !important;
        border-bottom: 1px solid rgba(0,0,0,0.08) !important;
    }
    .slide-header h1 {
        background: linear-gradient(135deg, #2b6cb0, #6b46c1) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        background-clip: text !important;
    }
    .slide-footer {
        background: rgba(255, 255, 255, 0.9) !important;
        border-top: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card {
        background: rgba(255,255,255,0.8) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card li {
        border-bottom: 1px solid rgba(0,0,0,0.05) !important;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.12) !important;
        border-left: 4px solid #4299e1 !important;
        color: #2c3e50 !important;
    }
    .math-block {
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .math-block .math {
        color: #2d3748 !important;
    }
    .slide-counter {
        color: #4a5568 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .status-badge {
        background: rgba(96, 165, 250, 0.15) !important;
        color: #2b6cb0 !important;
        border: 1px solid rgba(96, 165, 250, 0.15) !important;
    }
    .btn {
        color: #2d3748 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .btn-secondary {
        background: rgba(0,0,0,0.04) !important;
        border-color: rgba(0,0,0,0.08) !important;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15) !important;
        border-color: rgba(52, 211, 153, 0.2) !important;
        color: #38a169 !important;
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15) !important;
        border-color: rgba(251, 191, 36, 0.2) !important;
        color: #d69e2e !important;
    }
    .auto-indicator {
        color: #718096 !important;
    }
    .loading-card {
        background: #ffffff !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .loading-text {
        color: #1a202c !important;
    }
    .loading-sub {
        color: #4a5568 !important;
    }
</style>
</head>
<body>
<div class="app-container">
    <header class="slide-header">
        <h1 id="slideTitle">Chargement...</h1>
    </header>
    <main class="slide-body" id="slideBody"></main>
    <!-- LOADING OVERLAY AVEC BOUTON ANNULER -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Préparation vocale...</div>
            <div class="loading-sub" id="loadingSub">Synthèse en cours</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loadingProgressBar"></div>
            </div>
            <div class="loading-timeout" id="loadingTimeout">⏱️ 30 secondes maximum</div>
            <button class="btn-cancel-loading" id="cancelLoadingBtn">
                <span>✕</span> Annuler
            </button>
        </div>
    </div>
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="slide-counter" id="slideCounter">1 / 3</span>
            <span class="status-badge idle" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">Prêt</span>
            </span>
        </div>
        <div class="footer-buttons">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-secondary" id="replayBtn">
                <span class="btn-icon">🔁</span> <span class="btn-label">Relire</span>
            </button>
            <button class="btn btn-play" id="playBtn">
                <span class="btn-icon">▶</span> <span class="btn-label">Play</span>
            </button>
        </div>
    </footer>
</div>
<script>
$(function() {
    // ================================================================
    // SLIDES
    // ================================================================
    const slides = [
  {
    "titre": "Introduction",
    "contenu": "<div style='padding: 15px; background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); border-radius: 12px; color: #000000;'><h2 style='color: #2c3e50; text-align: center; margin-bottom: 20px;'>📏 Les droites dans le plan</h2><p style='color: #2c3e50; font-size: 18px; line-height: 1.6; text-align: justify;'>Avez-vous déjà observé une ligne droite ? Une route, une règle, ou encore un fil tendu ?</p><p style='color: #2c3e50; font-size: 18px; line-height: 1.6; text-align: justify; margin-top: 10px;'>En mathématiques, une <strong>droite</strong> est un objet géométrique fondamental. Elle est <strong>illimitée</strong> et ne présente ni courbure ni épaisseur.</p><ul style='color: #2c3e50; font-size: 17px; line-height: 1.8;'><li>📌 Une droite est définie par deux points distincts</li><li>📌 On peut la tracer avec une règle</li><li>📌 Elle partage le plan en deux demi-plans</li></ul></div>",
    "texteParle": "Bonjour à tous ! Aujourd'hui, nous allons découvrir un élément fondamental de la géométrie : la droite. Imaginez une route parfaitement rectiligne qui s'étend à l'infini. C'est une idée de ce qu'est une droite en mathématiques. Une droite n'a pas d'épaisseur, elle est illimitée et elle ne présente aucune courbure. Nous allons apprendre comment la définir, la tracer et l'utiliser.",
    "note": "Une droite est un objet mathématique idéal, infini et parfaitement rectiligne."
  },
  {
    "titre": "Objectifs",
    "contenu": "<div style='padding: 15px; background: #ffffff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); color: #000000;'><h3 style='color: #2c3e50; text-align: center;'>🎯 Ce que vous allez apprendre</h3><div style='display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px;'><div style='background: #e8f4fd; padding: 12px; border-radius: 8px; color: #000000;'><p style='color: #2c3e50; font-size: 14px; margin: 0; text-align: center;'>📌 Savoir qu'une droite passe par deux points distincts</p></div><div style='background: #e8f4fd; padding: 12px; border-radius: 8px; color: #000000;'><p style='color: #2c3e50; font-size: 14px; margin: 0; text-align: center;'>📌 Construire une droite avec une règle</p></div><div style='background: #e8f4fd; padding: 12px; border-radius: 8px; color: #000000;'><p style='color: #2c3e50; font-size: 14px; margin: 0; text-align: center;'>📌 Utiliser la notation des droites</p></div><div style='background: #e8f4fd; padding: 12px; border-radius: 8px; color: #000000;'><p style='color: #2c3e50; font-size: 14px; margin: 0; text-align: center;'>📌 Reconnaître des points alignés</p></div><div style='background: #e8f4fd; padding: 12px; border-radius: 8px; color: #000000;'><p style='color: #2c3e50; font-size: 14px; margin: 0; text-align: center;'>📌 Comprendre le régionnement du plan par une droite</p></div></div></div>",
    "texteParle": "Dans cette leçon, nous allons atteindre plusieurs objectifs. Nous apprendrons d'abord qu'une droite est définie par deux points distincts, c'est-à-dire deux points différents. Ensuite, nous verrons comment la tracer avec une règle. Nous étudierons également la notation des droites et comment reconnaître des points qui sont alignés sur une même droite. Enfin, nous découvrirons comment une droite partage le plan en deux régions appelées demi-plans.",
    "note": "Une droite divise le plan en deux demi-plans."
  },
  {
    "titre": "1. Qu'est-ce qu'une droite ?",
    "contenu": "<div style='padding: 15px; background: #f8f9fa; border-radius: 12px; color: #000000;'><h3 style='color: #2c3e50; text-align: center;'>📐 Définition d'une droite</h3><div style='background: #e8f4fd; padding: 15px; border-radius: 8px; margin: 10px 0; color: #000000;'><p style='color: #2c3e50; font-size: 16px; line-height: 1.6;'><strong>Définition :</strong> Une <strong>droite</strong> est un ensemble infini de points parfaitement alignés, sans courbure ni épaisseur.</p><p style='color: #2c3e50; font-size: 16px; line-height: 1.6;'><strong>Caractéristiques :</strong></p><ul style='color: #2c3e50; font-size: 16px; line-height: 1.8;'><li>✓ Elle est <strong>illimitée</strong> des deux côtés</li><li>✓ Elle est <strong>continue</strong> : il n'y a pas de trou</li><li>✓ On la représente par une ligne droite</li><li>✓ Elle est définie par <strong>deux points distincts</strong></li></ul></div><div style='background: white; border-radius: 12px; padding: 15px; margin-top: 15px; text-align: center; border: 1px solid #e9ecef;'><svg viewBox='0 0 400 100' style='width: 100%; max-width: 400px; height: auto;' xmlns='http://www.w3.org/2000/svg'><line x1='10' y1='50' x2='390' y2='50' stroke='#1e3c72' stroke-width='2.5'/><polygon points='10,50 20,46 20,54' fill='#1e3c72'/><polygon points='390,50 380,46 380,54' fill='#1e3c72'/><circle cx='150' cy='50' r='5' fill='#d32f2f'/><text x='145' y='40' font-size='14' fill='#d32f2f' font-weight='bold'>A</text><circle cx='280' cy='50' r='5' fill='#1976d2'/><text x='275' y='40' font-size='14' fill='#1976d2' font-weight='bold'>B</text><text x='200' y='75' font-size='13' fill='#2c3e50' font-style='italic'>La droite (AB)</text></svg></div><div style='background: #fff3cd; border-left: 4px solid #ffc107; padding: 10px; margin: 10px 0; border-radius: 4px; color: #000000;'><p style='color: #856404; font-size: 16px; margin: 0;'><strong>Exemple :</strong> Le bord d'une règle bien droite est une représentation d'une droite.</p></div></div>",
    "texteParle": "Commençons par la définition d'une droite. Une droite est un ensemble infini de points qui sont parfaitement alignés. Elle n'a ni courbure ni épaisseur. On dit qu'elle est illimitée, ce qui signifie qu'elle s'étend à l'infini dans les deux sens. Pour définir une droite, il suffit de connaître deux points distincts, c'est-à-dire deux points différents qui se trouvent sur cette droite. Par exemple, le bord d'une règle bien droite peut représenter une partie d'une droite.",
    "note": "Une droite est définie par deux points distincts."
  },
  {
    "titre": "2. Tracer une droite",
    "contenu": "<div style='padding: 15px; background: #f8f9fa; border-radius: 12px; color: #000000;'><h3 style='color: #2c3e50; text-align: center;'>✏️ Construction d'une droite</h3><div style='background: #e8f4fd; padding: 15px; border-radius: 8px; margin: 10px 0; color: #000000;'><p style='color: #2c3e50; font-size: 16px; line-height: 1.6;'><strong>Pour tracer une droite :</strong></p><ul style='color: #2c3e50; font-size: 16px; line-height: 1.8;'><li>1️⃣ Place deux points distincts \\(A\\) et \\(B\\) sur ta feuille</li><li>2️⃣ Pose ta règle de manière à ce qu'elle passe par les deux points</li><li>3️⃣ Trace un trait bien droit le long de la règle, en dépassant légèrement les points</li></ul></div><div style='background: white; border-radius: 12px; padding: 15px; margin-top: 15px; text-align: center; border: 1px solid #e9ecef;'><svg viewBox='0 0 400 140' style='width: 100%; max-width: 400px; height: auto;' xmlns='http://www.w3.org/2000/svg'><rect x='40' y='60' width='320' height='25' fill='#fbbf24' stroke='#d97706' stroke-width='1.5' rx='3'/><line x1='20' y1='72' x2='380' y2='72' stroke='#1e3c72' stroke-width='2' stroke-dasharray='5,3'/><circle cx='120' cy='72' r='5' fill='#d32f2f'/><text x='115' y='62' font-size='14' fill='#d32f2f' font-weight='bold'>A</text><circle cx='280' cy='72' r='5' fill='#1976d2'/><text x='275' y='62' font-size='14' fill='#1976d2' font-weight='bold'>B</text><text x='200' y='105' font-size='13' fill='#2c3e50' font-style='italic'>Règle</text><text x='200' y='30' font-size='13' fill='#1e3c72' font-style='italic'>Trait de la droite (AB)</text></svg></div><div style='background: #d4edda; border-left: 4px solid #28a745; padding: 10px; margin: 10px 0; border-radius: 4px; color: #000000;'><p style='color: #155724; font-size: 16px; margin: 0;'><strong>Rappel :</strong> Une droite est illimitée. On ne doit pas s'arrêter aux points mais prolonger le trait.</p></div></div>",
    "texteParle": "Pour tracer une droite, nous avons besoin de deux points distincts. Placez deux points A et B sur votre feuille. Ensuite, posez votre règle de manière à ce qu'elle passe par ces deux points. Tracez un trait bien droit le long de la règle, en dépassant légèrement les points. N'oubliez pas qu'une droite est illimitée, donc vous devez prolonger votre trait au-delà des points.",
    "note": "On trace une droite avec une règle en passant par deux points distincts."
  },
  {
    "titre": "3. Notation d'une droite",
    "contenu": "<div style='padding: 15px; background: #f8f9fa; border-radius: 12px; color: #000000;'><h3 style='color: #2c3e50; text-align: center;'>📝 Notation des droites</h3><div style='background: #e8f4fd; padding: 15px; border-radius: 8px; margin: 10px 0; color: #000000;'><p style='color: #2c3e50; font-size: 16px; line-height: 1.6;'><strong>Deux notations possibles :</strong></p><ul style='color: #2c3e50; font-size: 16px; line-height: 1.8;'><li>🔵 Soit en utilisant une <strong>lettre minuscule</strong> : \\((d)\\), \\((l)\\), \\((m)\\), ...</li><li>🔵 Soit en utilisant <strong>deux points</strong> de la droite : \\((AB)\\) ou \\((BA)\\)</li></ul></div><div style='display: flex; flex-wrap: wrap; gap: 10px; margin-top: 15px;'><div style='flex: 1; min-width: 180px; background: white; border-radius: 8px; padding: 12px; text-align: center; border: 1px solid #e9ecef;'><svg viewBox='0 0 300 80' style='width: 100%; height: auto;' xmlns='http://www.w3.org/2000/svg'><line x1='20' y1='40' x2='280' y2='40' stroke='#1e3c72' stroke-width='2.5'/><text x='150' y='30' font-size='15' fill='#1e3c72' font-weight='bold' text-anchor='middle'>(d)</text></svg><p style='color: #2c3e50; font-size: 13px; margin: 5px 0 0 0;'>Notation avec une lettre</p></div><div style='flex: 1; min-width: 180px; background: white; border-radius: 8px; padding: 12px; text-align: center; border: 1px solid #e9ecef;'><svg viewBox='0 0 300 80' style='width: 100%; height: auto;' xmlns='http://www.w3.org/2000/svg'><line x1='20' y1='40' x2='280' y2='40' stroke='#1e3c72' stroke-width='2.5'/><circle cx='100' cy='40' r='5' fill='#d32f2f'/><text x='95' y='30' font-size='14' fill='#d32f2f' font-weight='bold'>A</text><circle cx='200' cy='40' r='5' fill='#1976d2'/><text x='195' y='30' font-size='14' fill='#1976d2' font-weight='bold'>B</text><text x='150' y='65' font-size='14' fill='#1e3c72' font-weight='bold' text-anchor='middle'>(AB)</text></svg><p style='color: #2c3e50; font-size: 13px; margin: 5px 0 0 0;'>Notation avec deux points</p></div></div><div style='background: #d4edda; border-left: 4px solid #28a745; padding: 10px; margin: 10px 0; border-radius: 4px; color: #000000;'><p style='color: #155724; font-size: 16px; margin: 0;'><strong>Exemple :</strong> La droite \\((d)\\) est la droite qui passe par les points \\(A\\) et \\(B\\). On peut aussi l'appeler la droite \\((AB)\\).</p></div></div>",
    "texteParle": "En mathématiques, nous avons besoin de nommer les droites pour pouvoir en parler. Il existe deux manières de noter une droite. La première consiste à utiliser une lettre minuscule entre parenthèses, comme (d), (l) ou (m). La deuxième manière est d'utiliser deux points distincts qui appartiennent à la droite, entre parenthèses, par exemple (AB) pour la droite qui passe par A et B.",
    "note": "Une droite peut être notée (d) ou (AB) si A et B sont des points de la droite."
  },
  {
    "titre": "4. Points alignés",
    "contenu": "<div style='padding: 15px; background: #f8f9fa; border-radius: 12px; color: #000000;'><h3 style='color: #2c3e50; text-align: center;'>🔗 Points alignés</h3><div style='background: #e8f4fd; padding: 15px; border-radius: 8px; margin: 10px 0; color: #000000;'><p style='color: #2c3e50; font-size: 16px; line-height: 1.6;'><strong>Définition :</strong> Des points sont <strong>alignés</strong> s'ils appartiennent tous à la même droite.</p></div><div style='background: white; border-radius: 12px; padding: 15px; margin-top: 15px; text-align: center; border: 1px solid #e9ecef;'><svg viewBox='0 0 400 120' style='width: 100%; max-width: 400px; height: auto;' xmlns='http://www.w3.org/2000/svg'><line x1='20' y1='60' x2='380' y2='60' stroke='#1e3c72' stroke-width='2.5'/><circle cx='80' cy='60' r='5' fill='#d32f2f'/><text x='75' y='50' font-size='14' fill='#d32f2f' font-weight='bold'>A</text><circle cx='200' cy='60' r='5' fill='#1976d2'/><text x='195' y='50' font-size='14' fill='#1976d2' font-weight='bold'>B</text><circle cx='320' cy='60' r='5' fill='#2e7d32'/><text x='315' y='50' font-size='14' fill='#2e7d32' font-weight='bold'>C</text><text x='200' y='90' font-size='13' fill='#2c3e50' font-style='italic' text-anchor='middle'>Les points A, B et C sont alignés</text></svg></div><div style='background: white; border-radius: 12px; padding: 15px; margin-top: 10px; text-align: center; border: 1px solid #e9ecef;'><svg viewBox='0 0 400 120' style='width: 100%; max-width: 400px; height: auto;' xmlns='http://www.w3.org/2000/svg'><line x1='20' y1='60' x2='380' y2='60' stroke='#1e3c72' stroke-width='2.5'/><circle cx='80' cy='60' r='5' fill='#d32f2f'/><text x='75' y='50' font-size='14' fill='#d32f2f' font-weight='bold'>A</text><circle cx='200' cy='60' r='5' fill='#1976d2'/><text x='195' y='50' font-size='14' fill='#1976d2' font-weight='bold'>B</text><circle cx='320' cy='30' r='5' fill='#2e7d32'/><text x='315' y='20' font-size='14' fill='#2e7d32' font-weight='bold'>D</text><text x='200' y='100' font-size='13' fill='#c62828' font-style='italic' text-anchor='middle'>D n'est pas aligné avec A et B</text></svg></div><div style='background: #fff3cd; border-left: 4px solid #ffc107; padding: 10px; margin: 10px 0; border-radius: 4px; color: #000000;'><p style='color: #856404; font-size: 16px; margin: 0;'><strong>Exemple :</strong> Si les points \\(A\\), \\(B\\) et \\(C\\) sont alignés, ils se trouvent sur la même droite \\((AB)\\).</p></div></div>",
    "texteParle": "Des points sont alignés lorsqu'ils se trouvent sur la même droite. Par exemple, si les points A, B et C sont alignés, cela signifie qu'ils appartiennent tous à la même droite. Pour vérifier que des points sont alignés, on peut tracer une droite à la règle et voir si elle passe par tous les points. Trois points sont toujours alignés s'ils sont sur une même ligne droite.",
    "note": "Des points alignés appartiennent à une même droite."
  },
  {
    "titre": "5. Appartenance à une droite",
    "contenu": "<div style='padding: 15px; background: #f8f9fa; border-radius: 12px; color: #000000;'><h3 style='color: #2c3e50; text-align: center;'>🔵 Appartenance à une droite</h3><div style='background: #e8f4fd; padding: 15px; border-radius: 8px; margin: 10px 0; color: #000000;'><p style='color: #2c3e50; font-size: 16px; line-height: 1.6;'><strong>Notation :</strong></p><ul style='color: #2c3e50; font-size: 16px; line-height: 1.8;'><li>\\(A \\in (d)\\) signifie : le point \\(A\\) <strong>appartient</strong> à la droite \\((d)\\)</li><li>\\(B \\notin (d)\\) signifie : le point \\(B\\) <strong>n'appartient pas</strong> à la droite \\((d)\\)</li></ul></div><div style='background: white; border-radius: 12px; padding: 15px; margin-top: 15px; text-align: center; border: 1px solid #e9ecef;'><svg viewBox='0 0 400 150' style='width: 100%; max-width: 400px; height: auto;' xmlns='http://www.w3.org/2000/svg'><line x1='20' y1='75' x2='380' y2='75' stroke='#1e3c72' stroke-width='2.5'/><circle cx='120' cy='75' r='6' fill='#2e7d32'/><text x='112' y='62' font-size='14' fill='#2e7d32' font-weight='bold'>A</text><text x='140' y='80' font-size='13' fill='#2e7d32' font-weight='bold'>A ∈ (d)</text><circle cx='280' cy='40' r='6' fill='#c62828'/><text x='272' y='30' font-size='14' fill='#c62828' font-weight='bold'>B</text><text x='300' y='45' font-size='13' fill='#c62828' font-weight='bold'>B ∉ (d)</text><text x='200' y='110' font-size='14' fill='#1e3c72' font-weight='bold' text-anchor='middle'>(d)</text></svg></div><div style='background: #d4edda; border-left: 4px solid #28a745; padding: 10px; margin: 10px 0; border-radius: 4px; color: #000000;'><p style='color: #155724; font-size: 16px; margin: 0;'><strong>Exemple :</strong> Si \\(A \\in (d)\\), alors le point \\(A\\) est sur la droite \\((d)\\). Si \\(B \\notin (d)\\), alors \\(B\\) n'est pas sur la droite.</p></div></div>",
    "texteParle": "Pour exprimer qu'un point se trouve sur une droite, on utilise le symbole ∈ qui signifie 'appartient à'. Par exemple, A ∈ (d) signifie que le point A appartient à la droite (d). Si un point n'est pas sur la droite, on utilise le symbole ∉. Par exemple, B ∉ (d) signifie que le point B n'appartient pas à la droite (d).",
    "note": "Le symbole ∈ signifie 'appartient à' en mathématiques."
  },
  {
    "titre": "6. Demi-droites",
    "contenu": "<div style='padding: 15px; background: #f8f9fa; border-radius: 12px; color: #000000;'><h3 style='color: #2c3e50; text-align: center;'>➡️ Les demi-droites</h3><div style='background: #e8f4fd; padding: 15px; border-radius: 8px; margin: 10px 0; color: #000000;'><p style='color: #2c3e50; font-size: 16px; line-height: 1.6;'><strong>Définition :</strong> Une <strong>demi-droite</strong> est une portion de droite qui commence à un point appelé <strong>origine</strong> et qui s'étend à l'infini dans un seul sens.</p></div><div style='background: white; border-radius: 12px; padding: 15px; margin-top: 15px; text-align: center; border: 1px solid #e9ecef;'><svg viewBox='0 0 400 120' style='width: 100%; max-width: 400px; height: auto;' xmlns='http://www.w3.org/2000/svg'><line x1='150' y1='60' x2='380' y2='60' stroke='#1e3c72' stroke-width='2.5'/><polygon points='380,60 370,56 370,64' fill='#1e3c72'/><circle cx='150' cy='60' r='6' fill='#d32f2f'/><text x='140' y='48' font-size='14' fill='#d32f2f' font-weight='bold'>A</text><circle cx='270' cy='60' r='5' fill='#1976d2'/><text x='265' y='48' font-size='14' fill='#1976d2' font-weight='bold'>B</text><text x='260' y='95' font-size='14' fill='#1e3c72' font-weight='bold' text-anchor='middle'>Demi-droite [AB)</text><text x='155' y='85' font-size='12' fill='#d32f2f' font-style='italic'>Origine</text></svg></div><div style='background: white; border-radius: 12px; padding: 15px; margin-top: 10px; text-align: center; border: 1px solid #e9ecef;'><svg viewBox='0 0 400 120' style='width: 100%; max-width: 400px; height: auto;' xmlns='http://www.w3.org/2000/svg'><line x1='20' y1='60' x2='250' y2='60' stroke='#1e3c72' stroke-width='2.5'/><polygon points='20,60 30,56 30,64' fill='#1e3c72'/><circle cx='250' cy='60' r='6' fill='#d32f2f'/><text x='245' y='48' font-size='14' fill='#d32f2f' font-weight='bold'>A</text><circle cx='130' cy='60' r='5' fill='#1976d2'/><text x='125' y='48' font-size='14' fill='#1976d2' font-weight='bold'>B</text><text x='140' y='95' font-size='14' fill='#1e3c72' font-weight='bold' text-anchor='middle'>Demi-droite [BA)</text><text x='255' y='85' font-size='12' fill='#d32f2f' font-style='italic'>Origine</text></svg></div><div style='background: #fff3cd; border-left: 4px solid #ffc107; padding: 10px; margin: 10px 0; border-radius: 4px; color: #000000;'><p style='color: #856404; font-size: 16px; margin: 0;'><strong>Exemple :</strong> La demi-droite \\([AB)\\) commence en \\(A\\) et passe par \\(B\\) pour aller à l'infini.</p></div></div>",
    "texteParle": "Une droite peut être divisée en deux parties par un point. Chaque partie s'appelle une demi-droite. Une demi-droite a une origine, c'est-à-dire un point de départ, et elle s'étend à l'infini dans un seul sens. Par exemple, la demi-droite qui commence en A et passe par B est notée [AB).",
    "note": "Une demi-droite a une origine et s'étend à l'infini dans un seul sens."
  },
  {
    "titre": "7. Régionnement du plan",
    "contenu": "<div style='padding: 15px; background: #f8f9fa; border-radius: 12px; color: #000000;'><h3 style='color: #2c3e50; text-align: center;'>🔲 Régionnement du plan</h3><div style='background: #e8f4fd; padding: 15px; border-radius: 8px; margin: 10px 0; color: #000000;'><p style='color: #2c3e50; font-size: 16px; line-height: 1.6;'><strong>Propriété :</strong> Une droite partage le plan en <strong>deux demi-plans</strong>.</p><ul style='color: #2c3e50; font-size: 16px; line-height: 1.8;'><li>🔵 Le <strong>demi-plan</strong> d'un côté de la droite</li><li>🔵 L'<strong>autre demi-plan</strong> de l'autre côté</li></ul></div><div style='background: white; border-radius: 12px; padding: 15px; margin-top: 15px; text-align: center; border: 1px solid #e9ecef;'><svg viewBox='0 0 400 200' style='width: 100%; max-width: 400px; height: auto;' xmlns='http://www.w3.org/2000/svg'><rect x='0' y='0' width='400' height='100' fill='#e3f2fd' opacity='0.6'/><rect x='0' y='100' width='400' height='100' fill='#fff3e0' opacity='0.6'/><line x1='20' y1='100' x2='380' y2='100' stroke='#1e3c72' stroke-width='3'/><text x='200' y='50' font-size='15' fill='#0d47a1' font-weight='bold' text-anchor='middle'>Demi-plan 1</text><text x='200' y='160' font-size='15' fill='#e65100' font-weight='bold' text-anchor='middle'>Demi-plan 2</text><text x='355' y='95' font-size='14' fill='#1e3c72' font-weight='bold'>(d)</text><circle cx='100' cy='50' r='5' fill='#1976d2'/><text x='90' y='40' font-size='13' fill='#1976d2' font-weight='bold'>M</text><circle cx='300' cy='150' r='5' fill='#c62828'/><text x='290' y='140' font-size='13' fill='#c62828' font-weight='bold'>N</text><circle cx='200' cy='100' r='5' fill='#2e7d32'/><text x='192' y='92' font-size='13' fill='#2e7d32' font-weight='bold'>P</text></svg></div><div style='background: #d4edda; border-left: 4px solid #28a745; padding: 10px; margin: 10px 0; border-radius: 4px; color: #000000;'><p style='color: #155724; font-size: 16px; margin: 0;'><strong>Exemple :</strong> Une route trace une ligne qui sépare le terrain en deux zones distinctes. Le point M est dans le demi-plan 1, le point N dans le demi-plan 2, et le point P est sur la droite.</p></div></div>",
    "texteParle": "Une droite a une propriété importante : elle partage le plan en deux parties appelées demi-plans. C'est comme une route qui sépare un terrain en deux côtés : le côté gauche et le côté droit. Chaque côté est un demi-plan. Les points situés sur la droite elle-même appartiennent aux deux demi-plans.",
    "note": "Une droite partage le plan en deux demi-plans."
  },
  {
    "titre": "8. Segments et longueurs",
    "contenu": "<div style='padding: 15px; background: #f8f9fa; border-radius: 12px; color: #000000;'><h3 style='color: #2c3e50; text-align: center;'>📏 Segments</h3><div style='background: #e8f4fd; padding: 15px; border-radius: 8px; margin: 10px 0; color: #000000;'><p style='color: #2c3e50; font-size: 16px; line-height: 1.6;'><strong>Définition :</strong> Un <strong>segment</strong> est une portion de droite délimitée par deux points appelés <strong>extrémités</strong>.</p></div><div style='background: white; border-radius: 12px; padding: 15px; margin-top: 15px; text-align: center; border: 1px solid #e9ecef;'><svg viewBox='0 0 400 100' style='width: 100%; max-width: 400px; height: auto;' xmlns='http://www.w3.org/2000/svg'><line x1='100' y1='50' x2='300' y2='50' stroke='#1e3c72' stroke-width='3'/><circle cx='100' cy='50' r='6' fill='#d32f2f'/><text x='90' y='38' font-size='14' fill='#d32f2f' font-weight='bold'>A</text><circle cx='300' cy='50' r='6' fill='#1976d2'/><text x='295' y='38' font-size='14' fill='#1976d2' font-weight='bold'>B</text><text x='200' y='80' font-size='14' fill='#1e3c72' font-weight='bold' text-anchor='middle'>Segment [AB]</text><text x='200' y='30' font-size='13' fill='#2c3e50' font-style='italic' text-anchor='middle'>Longueur AB</text></svg></div><div style='background: #fff3cd; border-left: 4px solid #ffc107; padding: 10px; margin: 10px 0; border-radius: 4px; color: #000000;'><p style='color: #856404; font-size: 16px; margin: 0;'><strong>Remarque :</strong> Un segment a une longueur finie, contrairement à une droite qui est illimitée.</p></div></div>",
    "texteParle": "Un segment est une portion de droite délimitée par deux points appelés extrémités. Par exemple, le segment AB est la partie de la droite comprise entre A et B. Contrairement à une droite qui est illimitée, un segment a une longueur finie. On peut mesurer la longueur d'un segment avec une règle graduée.",
    "note": "Un segment a deux extrémités et une longueur finie."
  },
  {
    "titre": "9. Droites sécantes et parallèles",

    // ================================================================

    let currentIndex = 0;
    let isSpeaking = false;
    let isPaused = false;
    let currentUtterance = null;
    let isLoading = false;
    let loadingTimeout = null;
    let isTransitioning = false;

    // Références jQuery
    const $title = $('#slideTitle');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function setStatus(text, type) {
        $statusText.text(text);
        $statusBadge.removeClass('idle speaking error paused waiting loading');
        if (type === 'speaking') $statusBadge.addClass('speaking');
        else if (type === 'error') $statusBadge.addClass('error');
        else if (type === 'paused') $statusBadge.addClass('paused');
        else if (type === 'waiting') $statusBadge.addClass('waiting');
        else if (type === 'loading') $statusBadge.addClass('loading');
        else $statusBadge.addClass('idle');
    }
    function updatePlayButton() {
        if (isPlaying) {
            $play.addClass('playing');
            $play.find('.btn-icon').text('⏸');
            $play.find('.btn-label').text('Pause');
        } else {
            $play.removeClass('playing');
            $play.find('.btn-icon').text('▶');
            $play.find('.btn-label').text('Play');
        }
    }
    function showLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        loadingCancelled = false;
        isLoading = true;
        // Réinitialiser la barre de progression
        $loadingProgressBar.css('animation', 'none');
        $loadingProgressBar.css('width', '0%');
        // Forcer un reflow
        $loadingProgressBar[0].offsetHeight;
        $loadingProgressBar.css('animation', 'loadingProgress 30s ease-out forwards');
        $loadingText.text('Préparation vocale...');
        $loadingSub.text('Synthèse en cours');
        $loadingTimeout.text('⏱️ 30 secondes maximum');
        $loading.fadeIn(300);
        setStatus("⏳ Chargement...", 'loading');
        // 🔥 TIMEOUT DE 30 SECONDES
        loadingTimeout = setTimeout(() => {
            if (isLoading && !loadingCancelled) {
                hideLoading();
                setStatus("⚠️ Délai dépassé (30s)", 'error');
                isPlaying = false;
                updatePlayButton();
                $loadingSub.text('La synthèse vocale a pris trop de temps');
                $loadingTimeout.text('❌ Délai dépassé');
            }
        }, 30000);
    }
    function hideLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        isLoading = false;
        loadingCancelled = false;
        $loading.fadeOut(300);
        // Ne pas changer le statut si on est en train de parler
        if (!isSpeaking && !isPlaying) {
            setStatus("⏸ Lecture arrêtée", 'paused');
        }
    }
    function cancelLoading() {
        loadingCancelled = true;
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        hideLoading();
        stopSpeaking();
        setStatus("⏸ Annulé", 'paused');
        isPlaying = false;
        updatePlayButton();
        $loadingText.text('Annulé par l\'utilisateur');
        $loadingSub.text('Vous pouvez réessayer');
        $loadingTimeout.text('✕ Annulation');
    }
    // Arrêter la parole proprement
    function stopSpeaking() {
        try {
            if (synth && (synth.speaking || synth.pending)) {
                synth.cancel();
            }
        } catch(e) {
            console.warn('Erreur stopSpeaking:', e);
        }
        if (currentUtterance) {
            try {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance.onstart = null;
            } catch(e) {}
            currentUtterance = null;
        }
        isSpeaking = false;
        isPlaying = false;
        updatePlayButton();
    }
    // Mettre en pause la parole
    function pauseSpeaking() {
        try {
            if (synth && synth.speaking) {
                synth.pause();
                isPaused = true;
                isPlaying = false;
                setStatus("⏸ Lecture en pause", 'paused');
                updatePlayButton();
            }
        } catch(e) {
            console.warn('Erreur pauseSpeaking:', e);
            stopSpeaking();
        }
    }
    // Reprendre la parole
    function resumeSpeaking() {
        try {
            if (synth && synth.paused) {
                synth.resume();
                isPaused = false;
                isPlaying = true;
                setStatus("🔊 Lecture en cours", 'speaking');
                updatePlayButton();
            } else if (!isSpeaking && !synth.speaking && !synth.pending) {
                speakSlide(currentIndex);
            }
        } catch(e) {
            console.warn('Erreur resumeSpeaking:', e);
            speakSlide(currentIndex);
        }
    }
    function renderSlide(index) {
        const slide = slides[index];
        $title.text(slide.titre);
        let html = '';
        html += `<div class="content-card">${slide.contenu}</div>`;
        if (slide.note) {
            html += `<div class="note-box">${slide.note}</div>`;
        }
        $body.html(html);
        $counter.text(`${index+1} / ${total}`);
        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
        }
    }
    // ================================================================
    // LECTURE VOCALE
    // ================================================================
    function speakSlide(index) {
        return new Promise((resolve) => {
            const slide = slides[index];
            const text = slide.texteParle;
            if (!text || text.trim() === '' || !speechSupported) {
                resolve();
                return;
            }
            if (!window.speechSynthesis) {
                setStatus("❌ Synthèse vocale non supportée", 'error');
                speechSupported = false;
                resolve();
                return;
            }
            // Arrêter toute lecture en cours
            stopSpeaking();
            // Réinitialiser l'état de pause
            isPaused = false;
            showLoading();
            setStatus("Initialisation...", 'loading');
            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.92;
                utterance.pitch = 1.05;
                utterance.volume = 1;
                let isFinished = false;
                let errorHandled = false;
                utterance.onstart = function() {
                    if (loadingCancelled) {
                        stopSpeaking();
                        resolve();
                        return;
                    }
                    hideLoading();
                    isSpeaking = true;
                    isPlaying = true;
                    isPaused = false;
                    setStatus("🔊 Lecture en cours", 'speaking');
                    updatePlayButton();
                };
                utterance.onend = function() {
                    if (isFinished) return;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    setStatus("✅ Terminé", 'idle');
                    hideLoading();
                    updatePlayButton();
                    resolve();
                };
                utterance.onerror = function(e) {
                    if (isFinished || errorHandled) return;
                    errorHandled = true;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    hideLoading();
                    updatePlayButton();
                    if (e.error === 'not-allowed') {
                        setStatus("⚠️ Permission refusée", 'error');
                    } else if (e.error === 'synthesis-unavailable') {
                        setStatus("⚠️ Synthèse indisponible", 'error');
                    } else if (e.error === 'canceled') {
                        setStatus("⏸ Annulé", 'paused');
                    } else {
                        setStatus("❌ Erreur audio: " + (e.error || 'inconnue'), 'error');
                    }
                    resolve();
                };
                // Gestion du chargement des voix
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = function() {
                        if (!loadingCancelled) {
                            try {
                                synth.speak(utterance);
                            } catch(err) {
                                // Silencieux
                            }
                        }
                        synth.onvoiceschanged = null;
                    };
                }
                currentUtterance = utterance;
                if (!loadingCancelled) {
                    try {
                        synth.speak(utterance);
                    } catch(err) {
                        setTimeout(() => {
                            if (!loadingCancelled) {
                                try {
                                    synth.speak(utterance);
                                } catch(e) {
                                    setStatus("❌ Erreur de lecture", 'error');
                                    isPlaying = false;
                                    updatePlayButton();
                                    hideLoading();
                                    resolve();
                                }
                            } else {
                                resolve();
                            }
                        }, 100);
                    }
                } else {
                    resolve();
                }
            } catch(err) {
                hideLoading();
                setStatus("❌ Erreur générale", 'error');
                isPlaying = false;
                updatePlayButton();
                console.error('Erreur speakSlide:', err);
                resolve();
            }
        });
    }
    // ================================================================
    // NAVIGATION
    // ================================================================
    async function goToSlide(index) {
        if (isTransitioning) return;
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        // Si on est en train de lire, on met en pause avant de naviguer
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        // Arrêter complètement la lecture
        stopSpeaking();
        await new Promise(r => setTimeout(r, 50));
        if (index === currentIndex) {
            setStatus("📄 Slide actuel", 'idle');
            return;
        }
        isTransitioning = true;
        currentIndex = index;
        renderSlide(index);
        // Réinitialiser l'état de lecture
        isPlaying = false;
        updatePlayButton();
        setStatus("⏸ Lecture arrêtée", 'paused');
        await new Promise(r => setTimeout(r, 150));
        isTransitioning = false;
    }
    async function goToNext() {
        if (isTransitioning) return;
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        if (currentIndex + 1 < total) {
            await goToSlide(currentIndex + 1);
        } else {
            setStatus("🏁 Dernier slide", 'idle');
        }
    }
    async function goToPrev() {
        if (isTransitioning) return;
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        if (currentIndex - 1 >= 0) {
            await goToSlide(currentIndex - 1);
        } else {
            setStatus("🔁 Premier slide", 'idle');
        }
    }
    // ================================================================
    // GESTION PLAY/PAUSE
    // ================================================================
    function togglePlay() {
        if (!userInteracted) {
            userInteracted = true;
        }
        // Si le chargement est en cours, on l'annule
        if (isLoading) {
            cancelLoading();
            return;
        }
        // Si le synthétiseur est en pause, on reprend
        if (synth && synth.paused) {
            resumeSpeaking();
            return;
        }
        // Si la lecture est en cours, on met en pause
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
            return;
        }
        // Sinon, on démarre la lecture du slide courant
        if (!isSpeaking && !isPlaying) {
            stopSpeaking();
            speakSlide(currentIndex);
        }
    }
    // ================================================================
    // INIT
    // ================================================================
    async function init() {
        // Vérifier la compatibilité
        if (!window.speechSynthesis) {
            setStatus("❌ Synthèse vocale non supportée", 'error');
            speechSupported = false;
        }
        // Précharger les voix
        try {
            if (synth.getVoices) {
                synth.getVoices();
                setTimeout(() => {
                    try {
                        synth.getVoices();
                    } catch(e) {}
                }, 200);
            }
        } catch(e) {
            console.warn('Erreur chargement voix:', e);
        }
        // Afficher le premier slide
        renderSlide(0);
        $counter.text(`1 / ${total}`);
        // État initial
        setStatus("⏸ Appuie sur Play", 'paused');
        updatePlayButton();
        $autoIndicator.text('⏸ Lecture manuelle');
        // ================================================================
        // ÉVÉNEMENTS
        // ================================================================
        // Bouton Play/Pause
        $play.on('click', function() {
            togglePlay();
        });
        // Bouton Annuler le chargement
        $cancelLoading.on('click', function() {
            cancelLoading();
        });
        // Navigation
        $prev.on('click', function() {
            // Si chargement en cours, on annule
            if (isLoading) cancelLoading();
            goToPrev();
        });
        $next.on('click', function() {
            if (isLoading) cancelLoading();
            goToNext();
        });
        // Replay - relire le slide courant
        $replay.on('click', function() {
            if (isLoading) cancelLoading();
            stopSpeaking();
            setTimeout(() => {
                speakSlide(currentIndex);
            }, 100);
        });
        // Support du clavier (espace pour play/pause)
        $(document).on('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });
        // Nettoyage
        $(window).on('beforeunload', function() {
            try {
                if (synth.speaking) synth.cancel();
            } catch(e) {}
            hideLoading();
        });
        // Gérer les cas où la synthèse se termine de manière inattendue
        setInterval(() => {
            if (isPlaying && !synth.speaking && !synth.pending && !isPaused && !isLoading) {
                isPlaying = false;
                updatePlayButton();
                setStatus("⏸ Lecture arrêtée", 'paused');
            }
        }, 1000);
    }
    init();

            if (footer) footer.style.background = 'rgba(255, 255, 255, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.8)';
                card.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.12)';
                note.style.color = '#2c3e50';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.05)';
                block.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#2d3748';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
                statusBadge.style.color = '#2b6cb0';
            }
            if (slideCounter) {
                slideCounter.style.color = '#4a5568';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#718096';
            }
            if (themeBtn) {
                themeBtn.textContent = '🌓';
                themeBtn.title = 'Passer en mode nuit';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#2c3e50';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#2d3748';
                }
            });
        }
    }
    // Initialiser en mode jour
    document.addEventListener('DOMContentLoaded', function() {
        // Appliquer le mode jour par défaut
        const body = document.body;
        body.style.background = '#f0f4f8';
        body.style.color = '#1a202c';
        const appContainer = document.querySelector('.app-container');
        if (appContainer) {
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
        }
        const header = document.querySelector('.slide-header');
        if (header) {
            header.style.background = 'rgba(255, 255, 255, 0.85)';
        }
        const footer = document.querySelector('.slide-footer');
        if (footer) {
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
        }
        document.querySelectorAll('.content-card').forEach(card => {
            card.style.background = 'rgba(255,255,255,0.8)';
            card.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        document.querySelectorAll('.note-box').forEach(note => {
            note.style.background = 'rgba(96, 165, 250, 0.12)';
            note.style.color = '#2c3e50';
        });
        document.querySelectorAll('.math-block').forEach(block => {
            block.style.background = 'rgba(0,0,0,0.05)';
            block.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        document.querySelectorAll('.btn').forEach(btn => {
            btn.style.color = '#2d3748';
        });
        const statusBadge = document.querySelector('.status-badge');
        if (statusBadge) {
            statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
            statusBadge.style.color = '#2b6cb0';
        }
        const slideCounter = document.querySelector('.slide-counter');
        if (slideCounter) {
            slideCounter.style.color = '#4a5568';
        }
        const autoIndicator = document.querySelector('.auto-indicator');
        if (autoIndicator) {
            autoIndicator.style.color = '#718096';
        }
        document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
            if (!el.closest('.note-box')) {
                el.style.color = '#2c3e50';
            }
        });
        document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
            if (!el.closest('.note-box') && !el.closest('.math-block')) {
                el.style.color = '#2d3748';
            }
        });
        const themeBtn = document.getElementById('themeToggle');
        if (themeBtn) {
            themeBtn.textContent = '🌓';
            themeBtn.title = 'Passer en mode nuit';
            // Ajouter l'écouteur d'événement click
            themeBtn.addEventListener('click', toggleTheme);
        }
    });
</script>
</body>
</html>
