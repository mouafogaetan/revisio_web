<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
    "matiere": "Hygiène",
    "classe": "3ème Année",
    "sequence": "Séquence 1",
    "anneeScolaire": "2025-2026",
    "exercices": [
        {
            "titre": "Évaluation des savoirs",
            "points": "10 points",
            "enonce": "<div style='padding: 12px; background-color: #f5f5f5; border-radius: 10px; border-left: 6px solid #1565c0;'><p style='margin: 0; color: #0d47a1;'><strong>PARTIE A : ÉVALUATION DES RESSOURCES</strong></p></div>",
            "questions": [
                {
                    "question": "<div style='margin-bottom: 16px;'><p><strong>Exercice 1 : Questionnaire à Choix Multiples (QCM)</strong> <span style='color: #1565c0;'>(4 pts)</span></p><p><em>Chaque série d'affirmations ci-dessous comporte une seule réponse exacte. Recopier le numéro de la question et la lettre correspondant à la réponse choisie.</em></p><p style='margin-top: 12px;'><strong>1-</strong> L'appareil locomoteur est composé de :</p><ul style='list-style-type: lower-alpha;'><li>Os et muscles uniquement.</li><li>Os, muscles et articulations.</li><li>Os, articulations et tendons.</li><li>Muscles et ligaments seulement.</li></ul><p style='margin-top: 12px;'><strong>2-</strong> La couche superficielle de la peau est appelée :</p><ul style='list-style-type: lower-alpha;'><li>Le derme.</li><li>L'hypoderme.</li><li>L'épiderme.</li><li>Le tissu adipeux.</li></ul><p style='margin-top: 12px;'><strong>3-</strong> Une escarre est une lésion cutanée causée par :</p><ul style='list-style-type: lower-alpha;'><li>Une infection bactérienne.</li><li>Une brûlure solaire.</li><li>Une pression prolongée sur une zone de la peau.</li><li>Une réaction allergique.</li></ul><p style='margin-top: 12px;'><strong>4-</strong> Les maladies du péril fécal se transmettent par :</p><ul style='list-style-type: lower-alpha;'><li>Voie respiratoire.</li><li>Voie fécale-orale.</li><li>Voie sanguine.</li><li>Contact cutané.</li></ul></div>",
                    "reponse": "<div style='background-color: #e8f5e9; padding: 12px; border-radius: 8px; border-left: 6px solid #2e7d32;'><p style='margin: 0; color: #1b5e20;'><strong>Corrigé :</strong></p><ol style='color: #1a1a1a;'><li><strong>Réponse b.</strong> L'appareil locomoteur est composé des os (squelette), des muscles (qui permettent le mouvement) et des articulations (qui relient les os entre eux).</li><li><strong>Réponse c.</strong> L'épiderme est la couche superficielle de la peau. Le derme est la couche profonde et l'hypoderme est la couche la plus profonde contenant du tissu adipeux.</li><li><strong>Réponse c.</strong> L'escarre est causée par une pression prolongée sur une zone cutanée, réduisant la vascularisation et entraînant la nécrose des tissus. Elle touche principalement les personnes alitées ou immobilisées.</li><li><strong>Réponse b.</strong> Les maladies du péril fécal se transmettent par voie fécale-orale, c'est-à-dire par l'ingestion d'aliments ou d'eau contaminés par des matières fécales.</li></ol></div>"
                },
                {
                    "question": "<div style='margin-bottom: 16px;'><p><strong>Exercice 2 : Définitions</strong> <span style='color: #1565c0;'>(6 pts)</span></p><p><strong>1-</strong> <em>Définir</em> le système nerveux. <span style='color: #1565c0;'>(1,5 pt)</span></p><p><strong>2-</strong> <em>Définir</em> une escarre. <span style='color: #1565c0;'>(1,5 pt)</span></p><p><strong>3-</strong> <em>Définir</em> une maladie du péril fécal. <span style='color: #1565c0;'>(1,5 pt)</span></p><p><strong>4-</strong> <em>Définir</em> la fatigue nerveuse. <span style='color: #1565c0;'>(1,5 pt)</span></p></div>",
                    "reponse": "<div style='background-color: #e8f5e9; padding: 12px; border-radius: 8px; border-left: 6px solid #2e7d32;'><p style='margin: 0; color: #1b5e20;'><strong>Corrigé :</strong></p><p style='color: #1a1a1a;'><strong>1-</strong> Le système nerveux est l'ensemble des organes qui assurent la réception, le traitement et la transmission des informations dans l'organisme. Il est composé du système nerveux central (cerveau et moelle épinière) et du système nerveux périphérique (nerfs).</p><p style='color: #1a1a1a;'><strong>2-</strong> Une escarre (ou ulcère de décubitus) est une lésion cutanée due à une pression prolongée sur une zone du corps, réduisant la vascularisation et entraînant la nécrose des tissus. Elle touche principalement les personnes alitées ou immobilisées.</p><p style='color: #1a1a1a;'><strong>3-</strong> Une maladie du péril fécal est une infection qui se transmet par voie fécale-orale, c'est-à-dire par l'ingestion d'aliments ou d'eau contaminés par des matières fécales contenant des agents pathogènes.</p><p style='color: #1a1a1a;'><strong>4-</strong> La fatigue nerveuse est un état d'épuisement du système nerveux causé par un stress prolongé, un surmenage intellectuel, un manque de sommeil ou des préoccupations excessives. Elle se manifeste par des troubles de la concentration, des maux de tête, une irritabilité et des troubles du sommeil.</p></div>"
                }
            ]
        },
        {
            "titre": "Évaluation des savoir-faire",
            "points": "10 points",
            "enonce": "<div style='padding: 12px; background-color: #f5f5f5; border-radius: 10px; border-left: 6px solid #2e7d32;'><p style='margin: 0; color: #1b5e20;'><strong>PARTIE B : ÉVALUATION DES SAVOIR-FAIRE</strong></p></div>",
            "questions": [
                {
                    "question": "<div style='margin-bottom: 16px;'><p><strong>Exercice 3 : Étude de cas</strong> <span style='color: #1565c0;'>(4 pts)</span></p><p><em>Dans un village, plusieurs cas de typhoïde ont été signalés après les fortes pluies qui ont provoqué des inondations. L'enquête révèle que les latrines ont débordé et que les sources d'eau potable ont été contaminées. Les habitants ne font pas toujours bouillir leur eau avant de la consommer.</em></p><p><strong>1-</strong> <em>Identifier</em> l'origine de la contamination de l'eau dans cette situation. <span style='color: #1565c0;'>(1 pt)</span></p><p><strong>2-</strong> <em>Expliquer</em> le mode de transmission de la typhoïde dans ce contexte. <span style='color: #1565c0;'>(1,5 pt)</span></p><p><strong>3-</strong> <em>Proposer</em> trois mesures de prévention pour éviter de nouveaux cas de typhoïde dans ce village. <span style='color: #1565c0;'>(1,5 pt)</span></p></div>",
                    "reponse": "<div style='background-color: #e8f5e9; padding: 12px; border-radius: 8px; border-left: 6px solid #2e7d32;'><p style='margin: 0; color: #1b5e20;'><strong>Corrigé :</strong></p><p style='color: #1a1a1a;'><strong>1-</strong> L'origine de la contamination est les latrines qui ont débordé lors des inondations, contaminant les sources d'eau potable avec des matières fécales contenant la bactérie responsable de la typhoïde (Salmonella typhi).</p><p style='color: #1a1a1a;'><strong>2-</strong> La typhoïde se transmet par voie fécale-orale : les matières fécales contaminées par la bactérie Salmonella typhi ont été déversées dans les sources d'eau par les inondations. Les habitants boivent cette eau contaminée sans la faire bouillir, ingérant ainsi la bactérie et contractant la maladie.</p><p style='color: #1a1a1a;'><strong>3-</strong> Mesures de prévention :</p><ul style='color: #1a1a1a;'><li>Faire bouillir l'eau de boisson ou la traiter au chlore avant de la consommer.</li><li>Construire des latrines améliorées et étanches pour éviter la contamination des nappes phréatiques en cas d'inondation.</li><li>Sensibiliser les habitants à l'importance du lavage des mains au savon après être allé aux toilettes et avant de manipuler les aliments.</li></ul></div>"
                },
                {
                    "question": "<div style='margin-bottom: 16px;'><p><strong>Exercice 4 : Situation problème</strong> <span style='color: #1565c0;'>(6 pts)</span></p><p><em>Un élève de 3ème Année se plaint de maux de tête récurrents, de troubles de la concentration, d'irritabilité et de difficultés à s'endormir. Il passe beaucoup de temps sur son téléphone le soir et révise tard dans la nuit pour ses examens. Il consomme aussi beaucoup de boissons énergisantes pour rester éveillé.</em></p><p><strong>1-</strong> <em>Identifier</em> les causes probables de l'état de cet élève. <span style='color: #1565c0;'>(1 pt)</span></p><p><strong>2-</strong> <em>Analyser</em> les effets de ces habitudes sur son système nerveux. <span style='color: #1565c0;'>(2 pts)</span></p><p><strong>3-</strong> <em>Proposer</em> des conseils pour améliorer l'hygiène de vie de cet élève. <span style='color: #1565c0;'>(3 pts)</span></p></div>",
                    "reponse": "<div style='background-color: #e8f5e9; padding: 12px; border-radius: 8px; border-left: 6px solid #2e7d32;'><p style='margin: 0; color: #1b5e20;'><strong>Corrigé :</strong></p><p style='color: #1a1a1a;'><strong>1-</strong> Les causes probables sont :</p><ul style='color: #1a1a1a;'><li>Un surmenage intellectuel dû aux révisions tardives.</li><li>Un manque de sommeil causé par le coucher tardif et l'utilisation du téléphone le soir.</li><li>La consommation de boissons énergisantes qui perturbent le sommeil et augmentent l'excitation nerveuse.</li></ul><p style='color: #1a1a1a;'><strong>2-</strong> Effets sur le système nerveux :</p><ul style='color: #1a1a1a;'><li>Le manque de sommeil entraîne une fatigue nerveuse, des troubles de la concentration et une baisse des performances intellectuelles.</li><li>La lumière du téléphone perturbe la production de mélatonine, l'hormone du sommeil, ce qui aggrave les troubles du sommeil.</li><li>Les boissons énergisantes, riches en caféine, surexcitent le système nerveux, augmentent l'anxiété et perturbent le rythme cardiaque.</li><li>À long terme, ces habitudes peuvent entraîner un épuisement nerveux, une dépression et des troubles anxieux.</li></ul><p style='color: #1a1a1a;'><strong>3-</strong> Conseils pour améliorer son hygiène de vie :</p><ul style='color: #1a1a1a;'><li><strong>Sommeil :</strong> Se coucher à heure fixe, éviter les écrans au moins 1 heure avant de dormir, dormir 7 à 8 heures par nuit.</li><li><strong>Alimentation :</strong> Éviter les boissons énergisantes, privilégier une alimentation équilibrée riche en fruits et légumes.</li><li><strong>Activité physique :</strong> Pratiquer une activité physique régulière (sport, marche) pour évacuer le stress.</li><li><strong>Gestion du stress :</strong> Planifier ses révisions, faire des pauses, pratiquer des techniques de relaxation (respiration, méditation).</li></ul></div>"
                }
            ]
        }
    ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
