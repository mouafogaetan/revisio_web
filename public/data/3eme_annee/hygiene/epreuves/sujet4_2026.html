<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Hygiène",
  "classe": "3ème Année",
  "sequence": "Séquence 4",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Partie I : Éducation à la Santé (10 pts)",
      "points": "10 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; padding: 10px; background-color: #e8f5e9; border-radius: 10px; color: #1e3a2f;'><p><strong>Instruction :</strong> Lisez attentivement les consignes et répondez aux questions dans les espaces prévus.</p></div>",
      "questions": [
        {
          "question": "<div style='margin-top: 15px; background-color: #fff; padding: 12px; border-radius: 8px; border-left: 5px solid #2e7d32;'><p><strong>Exercice 1 : L'appareil locomoteur (3 pts)</strong></p><p>1. Citez les trois principaux organes qui composent l'appareil locomoteur (1 pt)</p><p>2. Décrivez un geste de secourisme à adopter en cas d'une entorse (1 pt)</p><p>3. Expliquez l'importance du sport pour l'appareil moteur (1 pt)</p></div>",
          "reponse": "<div style='padding: 10px; background-color: #f1f8e9; border-radius: 5px; color: #1e3a2f;'><p><strong>Corrigé :</strong></p><p>1. Les organes de l'appareil locomoteur sont : les <strong>os</strong> (qui forment le squelette), les <strong>muscles</strong> (qui permettent le mouvement) et les <strong>articulations</strong> (qui relient les os entre eux).</p><p>2. En cas d'entorse, il faut <strong>immobiliser l'articulation</strong>, appliquer de la <strong>glace</strong> (enveloppée dans un linge) pour réduire le gonflement, et <strong>surélever</strong> le membre pour limiter l'œdème. Il faut ensuite consulter un médecin.</p><p>3. L'exercice physique et le sport <strong>renforcent les muscles</strong>, <strong>améliorent la souplesse</strong> des articulations et <strong>solidifient les os</strong>. Ils contribuent également à une meilleure coordination des mouvements.</p></div>"
        },
        {
          "question": "<div style='margin-top: 15px; background-color: #fff; padding: 12px; border-radius: 8px; border-left: 5px solid #2e7d32;'><p><strong>Exercice 2 : L'œil et la peau (4 pts)</strong></p><p>1. Décrivez le rôle principal de la cornée dans l'œil (1 pt)</p><p>2. Citez deux maladies de l'œil (1 pt)</p><p>3. Quelle est la fonction de l'épiderme ? (1 pt)</p><p>4. Proposez une mesure d'hygiène cutanée à adopter au quotidien (1 pt)</p></div>",
          "reponse": "<div style='padding: 10px; background-color: #f1f8e9; border-radius: 5px; color: #1e3a2f;'><p><strong>Corrigé :</strong></p><p>1. La cornée est la partie transparente à l'avant de l'œil. Son rôle principal est de <strong>laisser entrer la lumière</strong> et de la <strong>dévier</strong> pour la diriger vers la pupille et le cristallin.</p><p>2. Exemples de maladies de l'œil : la <strong>conjonctivite</strong> (infection de la conjonctive) et la <strong>cataracte</strong> (opacification du cristallin).</p><p>3. L'épiderme est la couche superficielle de la peau. Sa fonction principale est la <strong>protection</strong> contre les agressions extérieures (microbes, UV, chocs).</p><p>4. Une mesure d'hygiène cutanée est de <strong>se laver les mains</strong> avec du savon avant chaque repas et après être allé aux toilettes.</p></div>"
        },
        {
          "question": "<div style='margin-top: 15px; background-color: #fff; padding: 12px; border-radius: 8px; border-left: 5px solid #2e7d32;'><p><strong>Exercice 3 : Système nerveux, digestion et IST (3 pts)</strong></p><p>1. Définissez le système nerveux (1 pt)</p><p>2. Citez un exemple de substance toxique consommée par les jeunes (1 pt)</p><p>3. Identifiez un moyen de prévention contre le VIH/sida (1 pt)</p></div>",
          "reponse": "<div style='padding: 10px; background-color: #f1f8e9; border-radius: 5px; color: #1e3a2f;'><p><strong>Corrigé :</strong></p><p>1. Le système nerveux est l'ensemble des organes (cerveau, moelle épinière, nerfs) qui <strong>coordonnent et contrôlent</strong> les fonctions de l'organisme, en recevant et en transmettant des informations.</p><p>2. Exemple de substance toxique : l'<strong>alcool</strong> (ou le tabac, le cannabis).</p><p>3. Un moyen de prévention contre le VIH/sida est l'<strong>utilisation systématique du préservatif</strong> lors des rapports sexuels.</p></div>"
        }
      ]
    },
    {
      "titre": "Partie II : Éducation à l'Environnement et au Développement Durable (10 pts)",
      "points": "10 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; padding: 10px; background-color: #e3f2fd; border-radius: 10px; color: #0d2b3e;'><p><strong>Consigne :</strong> Répondez aux questions suivantes avec des phrases complètes et des arguments précis.</p></div>",
      "questions": [
        {
          "question": "<div style='margin-top: 15px; background-color: #fff; padding: 12px; border-radius: 8px; border-left: 5px solid #1565c0;'><p><strong>Exercice 4 : Réchauffement climatique (4 pts)</strong></p><p>1. Définissez le réchauffement climatique (1 pt)</p><p>2. Identifiez deux causes du réchauffement climatique (1 pt)</p><p>3. Analysez une conséquence du réchauffement climatique sur la santé de l'Homme (1 pt)</p><p>4. Proposez un moyen de lutte contre le réchauffement climatique (1 pt)</p></div>",
          "reponse": "<div style='padding: 10px; background-color: #e3f2fd; border-radius: 5px; color: #0d2b3e;'><p><strong>Corrigé :</strong></p><p>1. Le réchauffement climatique est l'<strong>augmentation de la température moyenne</strong> de l'atmosphère et des océans, observée depuis plusieurs décennies.</p><p>2. Deux causes : les <strong>émissions de gaz à effet de serre</strong> (dioxyde de carbone, méthane) provenant des activités humaines (industrie, transports), et la <strong>déforestation</strong> qui réduit la capacité des forêts à absorber le CO₂.</p><p>3. Conséquence sur la santé : la multiplication des <strong>vagues de chaleur</strong> peut provoquer des coups de chaleur, des déshydratations et aggraver les maladies cardiovasculaires et respiratoires.</p><p>4. Un moyen de lutte : <strong>réduire l'usage des véhicules polluants</strong> en privilégiant les transports en commun, le covoiturage ou les modes de déplacement doux (vélo, marche).</p></div>"
        },
        {
          "question": "<div style='margin-top: 15px; background-color: #fff; padding: 12px; border-radius: 8px; border-left: 5px solid #1565c0;'><p><strong>Exercice 5 : Destruction de la couche d'ozone (4 pts)</strong></p><p>1. Identifiez les causes de la destruction de la couche d'ozone (1 pt)</p><p>2. Analysez les conséquences de cette destruction sur la santé humaine (1 pt)</p><p>3. Proposez des moyens de lutte contre cette destruction (1 pt)</p><p>4. Décrivez un lien entre la gestion des déchets et la protection de la couche d'ozone (1 pt)</p></div>",
          "reponse": "<div style='padding: 10px; background-color: #e3f2fd; border-radius: 5px; color: #0d2b3e;'><p><strong>Corrigé :</strong></p><p>1. La destruction de la couche d'ozone est principalement causée par les <strong>CFC</strong> (Chlorofluorocarbures) utilisés dans les réfrigérateurs, les climatiseurs et les bombes aérosols, ainsi que par les <strong>halons</strong> (extincteurs) et d'autres composés chimiques.</p><p>2. Conséquences sur la santé : une exposition accrue aux <strong>rayons UV</strong> entraîne une augmentation des <strong>cancers de la peau</strong>, des <strong>cataractes</strong>, un <strong>vieillissement prématuré</strong> de la peau et un <strong>affaiblissement du système immunitaire</strong>.</p><p>3. Moyens de lutte : <strong>éliminer progressivement</strong> la production et l'utilisation des substances appauvrissant l'ozone, comme le prévoit le <strong>Protocole de Montréal</strong>, et <strong>recycler</strong> les appareils contenant des gaz nocifs.</p><p>4. Lien avec la gestion des déchets : les réfrigérateurs, climatiseurs et extincteurs en fin de vie contiennent des gaz qui, s'ils sont rejetés, détruisent l'ozone. Une <strong>gestion appropriée</strong> de ces déchets (récupération et recyclage des gaz) est donc essentielle pour protéger la couche d'ozone.</p></div>"
        },
        {
          "question": "<div style='margin-top: 15px; background-color: #fff; padding: 12px; border-radius: 8px; border-left: 5px solid #1565c0;'><p><strong>Exercice 6 : Synthèse (2 pts)</strong></p><p>En vous appuyant sur les connaissances acquises dans cette séquence, expliquez en quelques lignes comment l'Homme peut à la fois protéger sa santé et l'environnement.</p></div>",
          "reponse": "<div style='padding: 10px; background-color: #e3f2fd; border-radius: 5px; color: #0d2b3e;'><p><strong>Corrigé :</strong></p><p>L'Homme peut protéger sa santé et l'environnement en <strong>adoptant des comportements responsables</strong> : une <strong>alimentation équilibrée</strong>, une <strong>activité physique régulière</strong>, une <strong>bonne hygiène</strong> (lavage des mains, protection solaire), la <strong>prévention des IST</strong> (utilisation du préservatif), et en <strong>limitant la pollution</strong> (réduction des émissions de gaz, gestion des déchets, protection de la couche d'ozone). Ces actions individuelles et collectives contribuent à un <strong>développement durable</strong> et à une <strong>meilleure qualité de vie</strong> pour tous.</p></div>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
