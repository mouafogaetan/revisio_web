<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Hygiène",
  "classe": "3ème Année",
  "sequence": "Séquence 5",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Organisation et fonctionnement du système nerveux",
      "points": "6 pts",
      "enonce": "<p>Le système nerveux est l'un des systèmes les plus complexes de l'organisme humain. Il permet de coordonner l'ensemble des fonctions du corps et d'interagir avec l'environnement.</p>",
      "questions": [
        {
          "question": "<p><strong>1) (1,5 pt)</strong> Décrivez l'organisation du système nerveux en identifiant ses deux grandes parties et leurs composants respectifs.</p>",
          "reponse": "<p>Le système nerveux est organisé en deux grandes parties :<br><br><strong>1. Le système nerveux central (SNC) :</strong><br>- L'encéphale (cerveau, cervelet et tronc cérébral)<br>- La moelle épinière<br><br><strong>2. Le système nerveux périphérique (SNP) :</strong><br>- Les nerfs crâniens (12 paires)<br>- Les nerfs spinaux (31 paires)<br>- Les ganglions nerveux</p>"
        },
        {
          "question": "<p><strong>2) (1,5 pt)</strong> Expliquez le rôle du cerveau et de la moelle épinière dans le fonctionnement du système nerveux.</p>",
          "reponse": "<p><strong>Le cerveau :</strong> Centre de commande du corps. Il traite les informations sensorielles, contrôle les fonctions vitales (respiration, rythme cardiaque), coordonne les mouvements volontaires et permet les fonctions cognitives (mémoire, langage, réflexion, émotions).<br><br><strong>La moelle épinière :</strong> Prolongement de l'encéphale. Elle assure la transmission des influx nerveux entre le cerveau et le reste du corps. Elle est le siège de l'arc réflexe, permettant des réponses automatiques et rapides sans intervention du cerveau (ex : retrait de la main face à une brûlure).</p>"
        },
        {
          "question": "<p><strong>3) (2 pts)</strong> Définissez la fatigue nerveuse et proposez quatre mesures pour la prévenir chez les élèves.</p>",
          "reponse": "<p><strong>Définition :</strong> La fatigue nerveuse est un état d'épuisement du système nerveux résultant d'une sollicitation excessive et prolongée (stress, manque de sommeil, surexposition aux écrans, surcharge de travail).<br><br><strong>Mesures de prévention :</strong><br>1. Adopter un rythme de sommeil régulier (7 à 9 heures par nuit).<br>2. Pratiquer une activité physique régulière (30 minutes par jour).<br>3. Limiter l'exposition aux écrans et faire des pauses régulières.<br>4. Adopter une alimentation équilibrée riche en vitamines B, magnésium et oméga-3.</p>"
        },
        {
          "question": "<p><strong>4) (1 pt)</strong> Citez trois substances toxiques consommées par les jeunes et précisez leurs effets sur le système nerveux.</p>",
          "reponse": "<p>1. <strong>Alcool</strong> : dépresseur du système nerveux central, diminution de la coordination, troubles de l'élocution, dépendance.<br><br>2. <strong>Cannabis</strong> : psychotrope, troubles de la mémoire et de l'attention, altération du jugement, démotivation.<br><br>3. <strong>Tabac (nicotine)</strong> : stimulant et addictif, dépendance rapide, altération des fonctions cognitives, augmentation de l'anxiété.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Les IST et le VIH/SIDA",
      "points": "6 pts",
      "enonce": "<p>Les Infections Sexuellement Transmissibles (IST) et le VIH/SIDA constituent un problème majeur de santé publique. Leur prévention repose sur l'information et l'adoption de comportements responsables.</p>",
      "questions": [
        {
          "question": "<p><strong>1) (1,5 pt)</strong> Définissez ce qu'est une IST et identifiez trois IST, dont la candidose.</p>",
          "reponse": "<p>Une Infection Sexuellement Transmissible (IST) est une infection qui se transmet principalement lors de rapports sexuels (vaginaux, anaux ou oraux) non protégés.<br><br>Exemples d'IST :<br>1. <strong>La candidose</strong> : infection fongique causée par <em>Candida albicans</em>.<br>2. <strong>La chlamydia</strong> : infection bactérienne.<br>3. <strong>Le VIH/SIDA</strong> : infection virale qui attaque le système immunitaire.</p>"
        },
        {
          "question": "<p><strong>2) (2 pts)</strong> Décrivez les trois modes de transmission du VIH et les liquides biologiques concernés.</p>",
          "reponse": "<p><strong>1. Transmission sexuelle :</strong> Contact avec le sperme, les sécrétions vaginales lors de rapports non protégés (vaginaux, anaux, oraux).<br><br><strong>2. Transmission sanguine :</strong> Partage de matériel contaminé (aiguilles, seringues, rasoirs), transfusion sanguine.<br><br><strong>3. Transmission mère-enfant :</strong> Pendant la grossesse (via le placenta), au moment de l'accouchement (contact avec le sang), par l'allaitement maternel (lait maternel).</p>"
        },
        {
          "question": "<p><strong>3) (1,5 pt)</strong> Proposez quatre moyens de prévention contre les IST et le VIH.</p>",
          "reponse": "<p>1. Utilisation systématique et correcte du préservatif (masculin ou féminin).<br>2. Dépistage régulier pour connaître son statut sérologique.<br>3. Fidélité à un partenaire dont on connaît le statut sérologique.<br>4. Ne pas partager de matériel contaminé (aiguilles, rasoirs, brosses à dents).</p>"
        },
        {
          "question": "<p><strong>4) (1 pt)</strong> Expliquez pourquoi le dépistage du VIH est important.</p>",
          "reponse": "<p>Le dépistage du VIH est important car :<br>- Il permet de connaître son statut sérologique.<br>- Il permet de bénéficier d'un traitement précoce en cas de séropositivité.<br>- Il permet de prévenir la transmission du virus aux partenaires.<br>- Il permet de prévenir la transmission mère-enfant chez les femmes enceintes.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Le réchauffement climatique et la destruction de la couche d'ozone",
      "points": "8 pts",
      "enonce": "<p>Le réchauffement climatique et la destruction de la couche d'ozone sont deux problématiques environnementales majeures auxquelles l'humanité est confrontée. Leurs causes sont principalement d'origine anthropique.</p>",
      "questions": [
        {
          "question": "<p><strong>1) (1 pt)</strong> Définissez le réchauffement climatique.</p>",
          "reponse": "<p>Le réchauffement climatique est l'augmentation globale de la température moyenne de la surface de la Terre, observée depuis le XXe siècle et principalement attribuée à l'augmentation des émissions de gaz à effet de serre dues aux activités humaines.</p>"
        },
        {
          "question": "<p><strong>2) (2 pts)</strong> Identifiez les causes du réchauffement climatique (effet de serre) et citez les principaux gaz à effet de serre.</p>",
          "reponse": "<p><strong>Causes :</strong><br>- Combustion des énergies fossiles (charbon, pétrole, gaz) pour le transport, l'industrie et la production d'électricité.<br>- Déforestation et changement d'affectation des sols.<br>- Agriculture intensive (élevage, engrais).<br><br><strong>Principaux gaz à effet de serre :</strong><br>- Dioxyde de carbone (CO₂)<br>- Méthane (CH₄)<br>- Protoxyde d'azote (N₂O)<br>- Gaz fluorés</p>"
        },
        {
          "question": "<p><strong>3) (1,5 pt)</strong> Analysez les conséquences du réchauffement climatique sur la santé de l'Homme.</p>",
          "reponse": "<p>Les conséquences du réchauffement climatique sur la santé humaine sont multiples :<br>- Augmentation des vagues de chaleur et des coups de chaleur.<br>- Propagation de maladies vectorielles (paludisme, dengue).<br>- Aggravation des maladies respiratoires (pollution, allergènes).<br>- Inondations et sécheresses entraînant des pénuries alimentaires et des problèmes d'accès à l'eau.<br>- Détérioration de la santé mentale (anxiété, stress post-traumatique lié aux catastrophes).</p>"
        },
        {
          "question": "<p><strong>4) (1,5 pt)</strong> Définissez la couche d'ozone et identifiez les principales causes de sa destruction.</p>",
          "reponse": "<p>La couche d'ozone est une région de la stratosphère (entre 15 et 50 km d'altitude) qui contient une concentration relativement élevée d'ozone (O₃). Elle protège la Terre des rayons ultraviolets (UV) nocifs du soleil.<br><br><strong>Causes de sa destruction :</strong><br>- Les Chlorofluorocarbones (CFC) : utilisés dans les aérosols, les réfrigérateurs et les climatiseurs.<br>- Les Halons : utilisés dans les extincteurs.<br>- Les Hydrochlorofluorocarbones (HCFC) et certains solvants.</p>"
        },
        {
          "question": "<p><strong>5) (2 pts)</strong> Proposez des moyens de lutte contre le réchauffement climatique et la destruction de la couche d'ozone.</p>",
          "reponse": "<p><strong>Lutte contre le réchauffement climatique :</strong><br>- Réduire les émissions de gaz à effet de serre (transports, industrie).<br>- Développer les énergies renouvelables (solaire, éolien, hydraulique).<br>- Préserver les forêts et promouvoir le reboisement.<br>- Adopter une agriculture durable.<br>- Réduire la consommation énergétique et promouvoir l'efficacité énergétique.<br><br><strong>Lutte contre la destruction de la couche d'ozone :</strong><br>- Appliquer le Protocole de Montréal (élimination des CFC et autres substances appauvrissant l'ozone).<br>- Récupérer et recycler les gaz des anciens appareils (réfrigérateurs, climatiseurs).<br>- Privilégier les alternatives sans CFC.<br>- Sensibiliser le public à l'importance de la protection de la couche d'ozone.</p>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
