<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Hygiène",
  "classe": "3ème Année",
  "sequence": "Séquence 2",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "EXERCICE 1 : QUESTIONS À CHOIX MULTIPLES (4 pts)",
      "points": "4 pts",
      "enonce": "<p style='font-size: 1em; line-height: 1.6; color: #333;'>Chaque question comporte une seule bonne réponse. Reproduis le tableau et recopie la lettre correspondant à la bonne réponse pour chaque question.</p>",
      "questions": [
        {
          "question": "<p><strong>1. (0,5 pt)</strong> L'appareil locomoteur est composé de :</p><ul><li>A. Des os, des muscles et des articulations</li><li>B. Des nerfs et des vaisseaux sanguins</li><li>C. Des poumons et du cœur</li><li>D. De l'estomac et des intestins</li></ul>",
          "reponse": "<p><strong>Réponse : A</strong></p><p>L'appareil locomoteur est constitué de trois éléments : les os (squelette), les muscles et les articulations, qui permettent le mouvement du corps.</p>"
        },
        {
          "question": "<p><strong>2. (0,5 pt)</strong> Le cristallin est un élément de l'œil qui permet :</p><ul><li>A. La perception des couleurs</li><li>B. L'accommodation (mise au point des images)</li><li>C. La protection de l'œil</li><li>D. La production de larmes</li></ul>",
          "reponse": "<p><strong>Réponse : B</strong></p><p>Le cristallin est une lentille biconvexe située dans l'œil. Il permet l'accommodation, c'est-à-dire la mise au point des images sur la rétine, en modifiant sa courbure.</p>"
        },
        {
          "question": "<p><strong>3. (0,5 pt)</strong> La peau est composée de trois couches : l'épiderme, le derme et :</p><ul><li>A. Le muscle</li><li>B. L'hypoderme</li><li>C. Le tissu adipeux</li><li>D. La couche cornée</li></ul>",
          "reponse": "<p><strong>Réponse : B</strong></p><p>La peau est composée de trois couches : l'épiderme (couche superficielle), le derme (couche moyenne) et l'hypoderme (couche profonde contenant du tissu adipeux).</p>"
        },
        {
          "question": "<p><strong>4. (0,5 pt)</strong> Le système nerveux est composé de :</p><ul><li>A. L'encéphale et le cœur</li><li>B. Le cerveau et les muscles</li><li>C. L'encéphale et la moelle épinière</li><li>D. Les nerfs et les articulations</li></ul>",
          "reponse": "<p><strong>Réponse : C</strong></p><p>Le système nerveux est organisé en deux grandes parties : le système nerveux central (encéphale et moelle épinière) et le système nerveux périphérique (nerfs).</p>"
        },
        {
          "question": "<p><strong>5. (0,5 pt)</strong> Une maladie du péril fécal est :</p><ul><li>A. La tuberculose</li><li>B. Le paludisme</li><li>C. Le choléra</li><li>D. La rougeole</li></ul>",
          "reponse": "<p><strong>Réponse : C</strong></p><p>Le choléra est une maladie du péril fécal. Elle se transmet par l'eau ou les aliments contaminés par des selles infectées.</p>"
        },
        {
          "question": "<p><strong>6. (0,5 pt)</strong> Le principal gaz à effet de serre responsable du réchauffement climatique est :</p><ul><li>A. L'oxygène (O₂)</li><li>B. Le dioxyde de carbone (CO₂)</li><li>C. L'azote (N₂)</li><li>D. Le gaz noble (argon)</li></ul>",
          "reponse": "<p><strong>Réponse : B</strong></p><p>Le dioxyde de carbone (CO₂) est le principal gaz à effet de serre responsable du réchauffement climatique. Il représente environ 76% des émissions totales de gaz à effet de serre.</p>"
        },
        {
          "question": "<p><strong>7. (0,5 pt)</strong> La couche d'ozone est détruite principalement par :</p><ul><li>A. Le CO₂</li><li>B. Les Chlorofluorocarbones (CFC)</li><li>C. Le méthane</li><li>D. Les oxydes d'azote</li></ul>",
          "reponse": "<p><strong>Réponse : B</strong></p><p>La couche d'ozone est principalement détruite par les Chlorofluorocarbones (CFC), des gaz utilisés dans les réfrigérateurs, les climatiseurs et les aérosols.</p>"
        },
        {
          "question": "<p><strong>8. (0,5 pt)</strong> Le VIH est un virus qui attaque :</p><ul><li>A. Les globules rouges</li><li>B. Les lymphocytes T4</li><li>C. Les plaquettes</li><li>D. Les cellules de la peau</li></ul>",
          "reponse": "<p><strong>Réponse : B</strong></p><p>Le VIH (Virus de l'Immunodéficience Humaine) attaque spécifiquement les lymphocytes T4 (ou CD4), cellules clés du système immunitaire. Leur destruction progressive conduit à l'immunodéficience caractéristique du SIDA.</p>"
        }
      ]
    },
    {
      "titre": "EXERCICE 2 : DÉFINITIONS ET EXPLICATIONS (4 pts)",
      "points": "4 pts",
      "enonce": "<p style='font-size: 1em; line-height: 1.6; color: #333;'>Réponds aux questions suivantes en rédigeant des réponses claires et précises.</p>",
      "questions": [
        {
          "question": "<p><strong>1. (1 pt)</strong> Définis ce qu'est une <strong>escarre</strong> et cite deux mesures de prévention.</p>",
          "reponse": "<p>Une escarre (ou plaie de décubitus) est une lésion cutanée causée par une compression prolongée de la peau contre une surface dure, réduisant la circulation sanguine et privant les tissus d'oxygène.</p><p><strong>Mesures de prévention :</strong></p><ul><li>Changer de position toutes les 2 heures pour les personnes alitées</li><li>Assurer une bonne hygiène de la peau et l'hydrater régulièrement</li></ul>"
        },
        {
          "question": "<p><strong>2. (1 pt)</strong> Explique le mécanisme de l'effet de serre et son lien avec le réchauffement climatique.</p>",

        },
        {
          "question": "<p><strong>3. (1 pt)</strong> Cite <strong>deux</strong> maladies de l'œil et propose pour chacune une mesure de prévention.</p>",
          "reponse": "<p><strong>1. La cataracte :</strong> opacification du cristallin. <strong>Prévention :</strong> porter des lunettes de soleil pour se protéger des rayons UV.</p><p><strong>2. Le trachome :</strong> infection bactérienne de la conjonctive. <strong>Prévention :</strong> se laver régulièrement le visage et les mains avec de l'eau propre.</p>"
        },
        {
          "question": "<p><strong>4. (1 pt)</strong> Propose <strong>trois</strong> moyens de lutte contre la destruction de la couche d'ozone.</p>",
          "reponse": "<p><strong>Moyens de lutte contre la destruction de la couche d'ozone :</strong></p><ul><li>Remplacer les CFC par des substances moins nocives (HFC, hydrocarbures)</li><li>Appliquer les accords internationaux comme le Protocole de Montréal</li><li>Sensibiliser les populations sur les produits à éviter et adopter une gestion responsable des déchets contenant des CFC</li></ul>"
        }
      ]
    },
    {
      "titre": "EXERCICE 3 : EXPLOITATION D'UN TEXTE (4 pts)",
      "points": "4 pts",
      "enonce": "<p style='font-size: 1em; line-height: 1.6; color: #333;'>Lis attentivement le texte ci-dessous et réponds aux questions.</p><div style='background: #eef2f5; padding: 15px; border-radius: 8px; color: #000;'><p>« Le réchauffement climatique est une augmentation de la température moyenne de la Terre, principalement due aux activités humaines. Les gaz à effet de serre, comme le CO₂, le méthane et les gaz fluorés, s'accumulent dans l'atmosphère et piègent la chaleur. Ce phénomène a des conséquences graves sur la santé humaine : augmentation des vagues de chaleur, propagation des maladies infectieuses (paludisme, dengue) et aggravation des maladies respiratoires. La lutte contre le réchauffement climatique passe par la réduction des émissions de gaz à effet de serre, la protection des forêts et le développement des énergies renouvelables. »</p></div>",
      "questions": [
        {

        {
          "question": "<p><strong>2. (1 pt)</strong> Cite deux conséquences du réchauffement climatique sur la santé humaine évoquées dans le texte.</p>",

        },
        {
          "question": "<p><strong>3. (1 pt)</strong> Quels sont les moyens de lutte contre le réchauffement climatique proposés dans le texte ?</p>",

        {
          "question": "<p><strong>4. (1 pt)</strong> Explique pourquoi les forêts sont importantes dans la lutte contre le réchauffement climatique.</p>",

        }
      ]
    },
    {
      "titre": "EXERCICE 4 : SITUATION-PROBLÈME (8 pts)",
      "points": "8 pts",
      "enonce": "<p style='font-size: 1em; line-height: 1.6; color: #333;'>Dans un quartier de Yaoundé, on observe plusieurs problèmes de santé publique : des jeunes consomment des substances toxiques (tabac, alcool, drogues), des cas de fatigue nerveuse sont rapportés chez les élèves, et on constate une augmentation des maladies du péril fécal (choléra, typhoïde). Par ailleurs, une canicule sévit dans la région, causant des malaises chez les populations.</p>",
      "questions": [
        {
          "question": "<p><strong>1. (2 pts)</strong> Identifie les différents problèmes de santé publique présents dans cette situation.</p>",
          "reponse": "<p>Les problèmes de santé publique présents sont :</p><ul><li>La toxicomanie (consommation de substances toxiques)</li><li>La fatigue nerveuse chez les élèves</li><li>Les maladies du péril fécal (choléra, typhoïde)</li><li>Les effets de la chaleur (canicule)</li></ul>"
        },
        {
          "question": "<p><strong>2. (2 pts)</strong> Explique les conséquences de la toxicomanie sur le système nerveux et propose des moyens de prévention.</p>",
          "reponse": "<p><strong>Conséquences de la toxicomanie sur le système nerveux :</strong></p><ul><li>Destruction des neurones</li><li>Altération de la mémoire et de la concentration</li><li>Troubles du comportement et dépendance</li><li>Risque d'overdose et de décès</li></ul><p><strong>Moyens de prévention :</strong></p><ul><li>Éducation et sensibilisation des jeunes sur les dangers des drogues</li><li>Mise en place de clubs de prévention dans les écoles</li><li>Offrir des activités alternatives (sport, culture) pour occuper les jeunes</li></ul>"
        },
        {
          "question": "<p><strong>3. (2 pts)</strong> Propose des mesures pour lutter contre les maladies du péril fécal dans ce quartier.</p>",
          "reponse": "<p><strong>Mesures de lutte contre les maladies du péril fécal :</strong></p><ul><li>Améliorer l'accès à l'eau potable</li><li>Mettre en place un système d'assainissement et de collecte des déchets</li><li>Sensibiliser la population au lavage régulier des mains</li><li>Promouvoir l'hygiène alimentaire (laver les aliments, bien les cuire)</li></ul>"
        },
        {
          "question": "<p><strong>4. (2 pts)</strong> Explique comment les vagues de chaleur (canicule) peuvent affecter la santé des populations et propose des mesures de protection.</p>",
          "reponse": "<p><strong>Effets de la chaleur sur la santé :</strong></p><ul><li>Déshydratation, coups de chaleur</li><li>Aggravation des maladies cardiovasculaires</li><li>Fatigue et troubles du sommeil</li></ul><p><strong>Mesures de protection :</strong></p><ul><li>Boire régulièrement de l'eau</li><li>Rester à l'ombre et éviter les expositions prolongées au soleil</li><li>Adapter les horaires de travail et les activités physiques (matin et soir)</li><li>Ventiler les espaces de vie et humidifier l'air si possible</li></ul>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
