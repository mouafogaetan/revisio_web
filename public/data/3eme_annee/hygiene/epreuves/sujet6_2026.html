<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
    "matiere": "Hygiène",
    "classe": "3ème Année",
    "sequence": "Séquence 6",
    "anneeScolaire": "2025-2026",
    "exercices": [
        {
            "titre": "Évaluation des savoirs",
            "points": "10 points",
            "enonce": "<div style='padding: 12px; background-color: #f5f5f5; border-radius: 10px; border-left: 6px solid #1565c0;'><p style='margin: 0; color: #0d47a1;'><strong>PARTIE A : ÉVALUATION DES RESSOURCES</strong></p></div>",
            "questions": [
                {
                    "question": "<div style='margin-bottom: 16px;'><p><strong>Exercice 1 : Questionnaire à Choix Multiples (QCM)</strong> <span style='color: #1565c0;'>(4 pts)</span></p><p><em>Chaque série d'affirmations ci-dessous comporte une seule réponse exacte. Recopier le numéro de la question et la lettre correspondant à la réponse choisie.</em></p><p style='margin-top: 12px;'><strong>1-</strong> Le réchauffement climatique est causé par :</p><ul style='list-style-type: lower-alpha;'><li>L'augmentation de la couche d'ozone.</li><li>L'accumulation de gaz à effet de serre dans l'atmosphère.</li><li>La diminution de la population humaine.</li><li>L'augmentation des pluies.</li></ul><p style='margin-top: 12px;'><strong>2-</strong> Lequel de ces gaz est un gaz à effet de serre ?</p><ul style='list-style-type: lower-alpha;'><li>L'oxygène (O₂).</li><li>L'azote (N₂).</li><li>Le dioxyde de carbone (CO₂).</li><li>L'argon (Ar).</li></ul><p style='margin-top: 12px;'><strong>3-</strong> La couche d'ozone a pour rôle principal de :</p><ul style='list-style-type: lower-alpha;'><li>Réchauffer la planète.</li><li>Absorber les rayons ultraviolets du soleil.</li><li>Produire de l'oxygène.</li><li>Réguler la pluviométrie.</li></ul><p style='margin-top: 12px;'><strong>4-</strong> Parmi les substances suivantes, laquelle est responsable de la destruction de la couche d'ozone ?</p><ul style='list-style-type: lower-alpha;'><li>Le dioxyde de carbone (CO₂).</li><li>Le méthane (CH₄).</li><li>Les chlorofluorocarbones (CFC).</li><li>La vapeur d'eau.</li></ul></div>",
                    "reponse": "<div style='background-color: #e8f5e9; padding: 12px; border-radius: 8px; border-left: 6px solid #2e7d32;'><p style='margin: 0; color: #1b5e20;'><strong>Corrigé :</strong></p><ol style='color: #1a1a1a;'><li><strong>Réponse b.</strong> Le réchauffement climatique est principalement causé par l'augmentation des gaz à effet de serre (CO₂, méthane, protoxyde d'azote) dans l'atmosphère qui emprisonnent la chaleur [citation:5].</li><li><strong>Réponse c.</strong> Le dioxyde de carbone (CO₂) est le principal gaz à effet de serre produit par les activités humaines (combustion, industrie, transports).</li><li><strong>Réponse b.</strong> La couche d'ozone est un bouclier gazeux qui absorbe les rayons ultraviolets (UV) du soleil, protégeant ainsi la vie sur Terre [citation:5].</li><li><strong>Réponse c.</strong> Les chlorofluorocarbones (CFC), utilisés dans les réfrigérateurs, climatiseurs et bombes aérosols, sont les principales substances appauvrissant la couche d'ozone [citation:5].</li></ol></div>"
                },
                {
                    "question": "<div style='margin-bottom: 16px;'><p><strong>Exercice 2 : Définitions</strong> <span style='color: #1565c0;'>(6 pts)</span></p><p><strong>1-</strong> <em>Définir</em> le réchauffement climatique. <span style='color: #1565c0;'>(1,5 pt)</span></p><p><strong>2-</strong> <em>Définir</em> l'effet de serre. <span style='color: #1565c0;'>(1,5 pt)</span></p><p><strong>3-</strong> <em>Définir</em> la couche d'ozone. <span style='color: #1565c0;'>(1,5 pt)</span></p><p><strong>4-</strong> <em>Définir</em> les substances appauvrissant la couche d'ozone (SAO). <span style='color: #1565c0;'>(1,5 pt)</span></p></div>",
                    "reponse": "<div style='background-color: #e8f5e9; padding: 12px; border-radius: 8px; border-left: 6px solid #2e7d32;'><p style='margin: 0; color: #1b5e20;'><strong>Corrigé :</strong></p><p style='color: #1a1a1a;'><strong>1-</strong> Le réchauffement climatique est l'augmentation de la température moyenne de la Terre sur une longue période, causée principalement par l'accumulation de gaz à effet de serre dans l'atmosphère due aux activités humaines.</p><p style='color: #1a1a1a;'><strong>2-</strong> L'effet de serre est un phénomène naturel par lequel certains gaz (CO₂, méthane, vapeur d'eau) retiennent une partie de la chaleur du soleil dans l'atmosphère. Sans lui, la Terre serait trop froide. Mais l'augmentation de ces gaz provoque un réchauffement excessif.</p><p style='color: #1a1a1a;'><strong>3-</strong> La couche d'ozone est une couche de gaz (O₃) située dans la stratosphère, entre 20 et 30 km d'altitude. Elle absorbe les rayons ultraviolets (UV) nocifs du soleil, protégeant ainsi les êtres vivants [citation:5].</p><p style='color: #1a1a1a;'><strong>4-</strong> Les substances appauvrissant la couche d'ozone (SAO) sont des produits chimiques, comme les chlorofluorocarbones (CFC), qui détruisent les molécules d'ozone dans la stratosphère. On les trouve dans les réfrigérateurs, climatiseurs et bombes aérosols [citation:5].</p></div>"
                }
            ]
        },
        {
            "titre": "Évaluation des savoir-faire",
            "points": "10 points",
            "enonce": "<div style='padding: 12px; background-color: #f5f5f5; border-radius: 10px; border-left: 6px solid #2e7d32;'><p style='margin: 0; color: #1b5e20;'><strong>PARTIE B : ÉVALUATION DES SAVOIR-FAIRE</strong></p></div>",
            "questions": [
                {
                    "question": "<div style='margin-bottom: 16px;'><p><strong>Exercice 3 : Étude de documents</strong> <span style='color: #1565c0;'>(4 pts)</span></p><p><em>Selon un rapport des Nations Unies, le Protocole de Montréal (1987) est considéré comme l'un des accords environnementaux les plus importants. Il a permis d'éliminer progressivement les substances appauvrissant la couche d'ozone. Grâce à cet accord, la couche d'ozone se reconstitue et devrait être rétablie d'ici le milieu du siècle. L'accord a également contribué à la lutte contre le réchauffement climatique en évitant l'émission d'environ 135 milliards de tonnes de CO₂ entre 1990 et 2010 [citation:5].</em></p><p><strong>1-</strong> <em>Identifier</em> l'accord international mentionné dans le texte et son année d'adoption. <span style='color: #1565c0;'>(1 pt)</span></p><p><strong>2-</strong> <em>Expliquer</em> comment le Protocole de Montréal a contribué à la fois à la protection de la couche d'ozone et à la lutte contre le réchauffement climatique. <span style='color: #1565c0;'>(1,5 pt)</span></p><p><strong>3-</strong> <em>Analyser</em> les conséquences de la destruction de la couche d'ozone sur la santé humaine. <span style='color: #1565c0;'>(1,5 pt)</span></p></div>",
                    "reponse": "<div style='background-color: #e8f5e9; padding: 12px; border-radius: 8px; border-left: 6px solid #2e7d32;'><p style='margin: 0; color: #1b5e20;'><strong>Corrigé :</strong></p><p style='color: #1a1a1a;'><strong>1-</strong> L'accord est le <strong>Protocole de Montréal</strong>, adopté en <strong>1987</strong> [citation:5].</p><p style='color: #1a1a1a;'><strong>2-</strong> Le Protocole de Montréal a contribué à la protection de la couche d'ozone en éliminant progressivement les substances appauvrissant la couche d'ozone (SAO) comme les CFC. Dans le même temps, de nombreuses SAO sont aussi de puissants gaz à effet de serre ; leur élimination a donc permis d'éviter d'importantes émissions de gaz à effet de serre, contribuant ainsi à la lutte contre le réchauffement climatique [citation:1][citation:5].</p><p style='color: #1a1a1a;'><strong>3-</strong> La destruction de la couche d'ozone permet aux rayons ultraviolets (UV) du soleil d'atteindre directement la Terre. L'exposition prolongée aux UV provoque :</p><ul style='color: #1a1a1a;'><li>Des <strong>cancers de la peau</strong>.</li><li>Des <strong>maladies oculaires</strong> (cataractes).</li><li>Un affaiblissement du système immunitaire [citation:5].</li></ul></div>"
                },
                {
                    "question": "<div style='margin-bottom: 16px;'><p><strong>Exercice 4 : Situation problème</strong> <span style='color: #1565c0;'>(6 pts)</span></p><p><em>Dans une ville côtière du Cameroun, les habitants constatent une augmentation des températures et des épisodes de sécheresse. Les pêcheurs observent une diminution des prises de poissons. Les agriculteurs se plaignent de la baisse des rendements. La municipalité souhaite mettre en place un plan d'action pour lutter contre le réchauffement climatique et ses conséquences.</em></p><p><strong>1-</strong> <em>Identifier</em> les problèmes liés au réchauffement climatique dans cette ville. <span style='color: #1565c0;'>(1 pt)</span></p><p><strong>2-</strong> <em>Analyser</em> les conséquences du réchauffement climatique sur la santé des populations de cette ville. <span style='color: #1565c0;'>(2 pts)</span></p><p><strong>3-</strong> <em>Proposer</em> un plan d'action pour la municipalité en abordant :</p><ul style='list-style-type: lower-alpha;'><li>La réduction des émissions de gaz à effet de serre <span style='color: #1565c0;'>(1 pt)</span></li><li>L'adaptation aux conséquences du réchauffement <span style='color: #1565c0;'>(1 pt)</span></li><li>La sensibilisation de la population <span style='color: #1565c0;'>(1 pt)</span></li></ul></div>",
                    "reponse": "<div style='background-color: #e8f5e9; padding: 12px; border-radius: 8px; border-left: 6px solid #2e7d32;'><p style='margin: 0; color: #1b5e20;'><strong>Corrigé :</strong></p><p style='color: #1a1a1a;'><strong>1-</strong> Les problèmes sont :</p><ul style='color: #1a1a1a;'><li>Augmentation des températures.</li><li>Épisodes de sécheresse.</li><li>Diminution des prises de poissons.</li><li>Baisse des rendements agricoles.</li></ul><p style='color: #1a1a1a;'><strong>2-</strong> Conséquences sur la santé :</p><ul style='color: #1a1a1a;'><li><strong>Vagues de chaleur :</strong> Coups de chaleur, déshydratation, stress thermique.</li><li><strong>Maladies infectieuses :</strong> Augmentation des maladies vectorielles (paludisme, dengue) avec l'extension des zones de moustiques [citation:5].</li><li><strong>Insécurité alimentaire :</strong> Baisse des récoltes et des ressources halieutiques entraînant malnutrition.</li><li><strong>Maladies hydriques :</strong> Les sécheresses réduisent l'accès à l'eau potable, favorisant les maladies diarrhéiques.</li></ul><p style='color: #1a1a1a;'><strong>3-</strong> Plan d'action :</p><ul style='color: #1a1a1a;'><li><strong>Réduction des émissions :</strong> Promouvoir les transports en commun et les énergies renouvelables (solaire, éolienne), réduire la déforestation, améliorer la gestion des déchets (recyclage, compostage).</li><li><strong>Adaptation :</strong> Construire des réservoirs d'eau de pluie, promouvoir des cultures résistantes à la sécheresse, protéger les écosystèmes côtiers (mangroves) qui protègent des inondations.</li><li><strong>Sensibilisation :</strong> Organiser des campagnes d'information sur les gestes écologiques (économie d'énergie, tri des déchets, plantation d'arbres).</li></ul></div>"
                }
            ]
        }
    ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
