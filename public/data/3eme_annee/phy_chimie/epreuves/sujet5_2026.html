<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Physique-Chimie",
  "classe": "3ème année",
  "sequence": "Séquence 5",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Acides forts et bases fortes (4 pts)",
      "points": "4 pts",
      "enonce": "<p>On considère les solutions aqueuses suivantes :</p><ul><li>Solution A : acide chlorhydrique $HCl$ de concentration $C_A = 0,02\\,mol\\cdot L^{-1}$</li><li>Solution B : soude $NaOH$ de concentration $C_B = 5 \\times 10^{-3}\\,mol\\cdot L^{-1}$</li><li>Solution C : acide sulfurique $H_2SO_4$ de concentration $C_C = 0,01\\,mol\\cdot L^{-1}$</li></ul><p>On donne à 25°C : $K_e = 10^{-14}$.</p>",
      "questions": [
        {
          "question": "<strong>1)</strong> Définir un acide fort et une base forte.",
          "reponse": "Un <strong>acide fort</strong> est un acide qui se dissocie totalement dans l'eau : $AH + H_2O \\rightarrow A^- + H_3O^+$.<br>Une <strong>base forte</strong> est une base qui se dissocie totalement dans l'eau : $B + H_2O \\rightarrow BH^+ + HO^-$."
        },
        {
          "question": "<strong>2)</strong> Écrire les équations de dissociation de chaque composé dans l'eau.",
          "reponse": "Solution A : $HCl_{(aq)} \\rightarrow H_3O^+_{(aq)} + Cl^-_{(aq)}$<br>Solution B : $NaOH_{(aq)} \\rightarrow Na^+_{(aq)} + HO^-_{(aq)}$<br>Solution C : $H_2SO_{4(aq)} \\rightarrow 2H_3O^+_{(aq)} + SO_4^{2-}_{(aq)}$"
        },
        {
          "question": "<strong>3)</strong> Calculer le pH de la solution A.",
          "reponse": "$[H_3O^+] = C_A = 0,02 = 2 \\times 10^{-2}\\,mol\\cdot L^{-1}$<br>$pH = -\\log[H_3O^+] = -\\log(2 \\times 10^{-2}) = 2 - \\log 2 \\approx 2 - 0,301 = 1,70$"
        },
        {
          "question": "<strong>4)</strong> Calculer le pH de la solution B.",
          "reponse": "$[HO^-] = C_B = 5 \\times 10^{-3}\\,mol\\cdot L^{-1}$<br>$[H_3O^+] = \\dfrac{K_e}{[HO^-]} = \\dfrac{10^{-14}}{5 \\times 10^{-3}} = 2 \\times 10^{-12}\\,mol\\cdot L^{-1}$<br>$pH = -\\log(2 \\times 10^{-12}) = 12 - \\log 2 \\approx 12 - 0,301 = 11,70$"
        },
        {
          "question": "<strong>5)</strong> Calculer le pH de la solution C.",
          "reponse": "$[H_3O^+] = 2 \\times C_C = 2 \\times 0,01 = 0,02 = 2 \\times 10^{-2}\\,mol\\cdot L^{-1}$<br>$pH = -\\log(2 \\times 10^{-2}) = 2 - \\log 2 \\approx 1,70$"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Statique des solides - Levier (4 pts)",
      "points": "4 pts",
      "enonce": "<p>Une barre homogène de masse négligeable, de longueur $L = 1,5\\,m$, est articulée en un point $O$. On suspend à l'extrémité A une masse $m_1 = 4\\,kg$. On veut équilibrer la barre en suspendant une masse $m_2$ à l'extrémité B. Les distances sont : $OA = 0,5\\,m$ et $OB = 1,0\\,m$. On donne $g = 9,8\\,N\\cdot kg^{-1}$.</p><div style='text-align:center; padding:10px; background:#f5f5f5; border-radius:8px; margin:15px 0;'><p style='font-family:monospace;'>O --- A (m₁=4kg)<br/>|<br/>B (m₂)</p></div>",
      "questions": [
        {
          "question": "<strong>1)</strong> Faire le bilan des forces qui s'appliquent sur la barre.",
          "reponse": "Forces appliquées sur la barre :<br>- Le poids de la masse m₁ en A : $\\vec{P_1}$ vertical vers le bas, $P_1 = m_1 \\times g = 4 \\times 9,8 = 39,2\\,N$<br>- Le poids de la masse m₂ en B : $\\vec{P_2}$ vertical vers le bas<br>- La réaction de l'articulation en O : $\\vec{R}$"
        },
        {
          "question": "<strong>2)</strong> Appliquer le théorème des moments par rapport au point O pour déterminer la masse $m_2$.",
          "reponse": "La barre est en équilibre : $\\sum \\mathcal{M}_O(\\vec{F}) = 0$<br>$\\mathcal{M}_O(\\vec{P_1}) + \\mathcal{M}_O(\\vec{P_2}) = 0$<br>$P_1 \\times OA - P_2 \\times OB = 0$<br>$m_1 \\times g \\times OA = m_2 \\times g \\times OB$<br>$m_2 = m_1 \\times \\dfrac{OA}{OB} = 4 \\times \\dfrac{0,5}{1,0} = 2\\,kg$"
        },
        {
          "question": "<strong>3)</strong> Calculer l'intensité de la réaction $\\vec{R}$.",
          "reponse": "D'après le principe d'inertie : $\\vec{P_1} + \\vec{P_2} + \\vec{R} = \\vec{0}$<br>$R = P_1 + P_2 = 39,2 + (2 \\times 9,8) = 39,2 + 19,6 = 58,8\\,N$<br>La réaction $\\vec{R}$ est verticale vers le haut."
        }
      ]
    },
    {
      "titre": "Exercice 3 : Statique des liquides - Pression et principe de Pascal (4 pts)",
      "points": "4 pts",
      "enonce": "<p>Un vérin hydraulique est constitué de deux pistons de surfaces $S_1 = 20\\,cm^2$ et $S_2 = 400\\,cm^2$. On exerce une force $F_1 = 100\\,N$ sur le petit piston.</p>",
      "questions": [
        {
          "question": "<strong>1)</strong> Énoncer le principe de Pascal.",
          "reponse": "Le principe de Pascal s'énonce : <em>Toute variation de pression en un point d'un fluide incompressible en équilibre se transmet intégralement et dans toutes les directions à tous les points du fluide.</em>"
        },
        {
          "question": "<strong>2)</strong> Calculer la pression exercée par le petit piston.",
          "reponse": "$p = \\dfrac{F_1}{S_1} = \\dfrac{100}{20 \\times 10^{-4}} = \\dfrac{100}{2 \\times 10^{-3}} = 50\\,000\\,Pa$"
        },
        {
          "question": "<strong>3)</strong> En déduire la force exercée par le grand piston.",
          "reponse": "D'après le principe de Pascal, $p$ est la même pour les deux pistons :<br>$F_2 = p \\times S_2 = 50\\,000 \\times 400 \\times 10^{-4} = 50\\,000 \\times 0,04 = 2\\,000\\,N$<br>Autre méthode : $F_2 = F_1 \\times \\dfrac{S_2}{S_1} = 100 \\times \\dfrac{400}{20} = 100 \\times 20 = 2\\,000\\,N$"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Champ magnétique (4 pts)",
      "points": "4 pts",
      "enonce": "<p>On dispose d'un aimant droit et d'une boussole.</p>",
      "questions": [
        {
          "question": "<strong>1)</strong> Définir un champ magnétique.",
          "reponse": "Un champ magnétique est une région de l'espace où une force magnétique s'exerce sur un aimant, un moment magnétique ou un conducteur parcouru par un courant électrique."
        },
        {
          "question": "<strong>2)</strong> Représenter les lignes de champ magnétique d'un aimant droit.",
          "reponse": "Les lignes de champ d'un aimant droit partent du <strong>pôle nord</strong>, se dirigent vers l'extérieur puis rentrent par le <strong>pôle sud</strong>. À l'intérieur de l'aimant, elles vont du sud vers le nord, formant ainsi des lignes fermées. La densité des lignes est plus grande près des pôles."
        },
        {
          "question": "<strong>3)</strong> Comment une boussole permet-elle de déterminer la direction du champ magnétique en un point ?",
          "reponse": "Une boussole possède une aiguille aimantée qui s'oriente suivant le champ magnétique local. Le <strong>pôle nord</strong> de l'aiguille indique la direction du champ magnétique en ce point."
        },
        {
          "question": "<strong>4)</strong> Quelle est la particularité du champ magnétique terrestre ?",
          "reponse": "Le champ magnétique terrestre est dirigé du pôle sud géographique (pôle nord magnétique) vers le pôle nord géographique (pôle sud magnétique). C'est pourquoi le pôle nord d'une boussole pointe vers le nord géographique. Le champ magnétique terrestre protège la Terre des particules solaires."
        }
      ]
    },
    {
      "titre": "Exercice 5 : Oxydoréduction (4 pts)",
      "points": "4 pts",
      "enonce": "<p>On réalise la pile de Daniell constituée d'une électrode de zinc plongeant dans une solution de $ZnSO_4$ et d'une électrode de cuivre plongeant dans une solution de $CuSO_4$. Les couples mis en jeu sont : $Zn^{2+}/Zn$ et $Cu^{2+}/Cu$.</p>",
      "questions": [
        {
          "question": "<strong>1)</strong> Définir l'oxydation et la réduction.",
          "reponse": "L'<strong>oxydation</strong> est une perte d'électrons. La <strong>réduction</strong> est un gain d'électrons. Une réaction d'oxydoréduction est un transfert d'électrons entre un oxydant et un réducteur."
        },
        {
          "question": "<strong>2)</strong> Identifier l'oxydant et le réducteur dans chaque couple.",
          "reponse": "Dans le couple $Zn^{2+}/Zn$ :<br>- $Zn^{2+}$ est l'<strong>oxydant</strong> (il peut capter des électrons)<br>- $Zn$ est le <strong>réducteur</strong> (il peut céder des électrons)<br><br>Dans le couple $Cu^{2+}/Cu$ :<br>- $Cu^{2+}$ est l'<strong>oxydant</strong><br>- $Cu$ est le <strong>réducteur</strong>"
        },
        {
          "question": "<strong>3)</strong> Écrire les demi-équations d'oxydoréduction correspondantes.",
          "reponse": "$Zn \\rightarrow Zn^{2+} + 2e^-$ (oxydation)<br>$Cu^{2+} + 2e^- \\rightarrow Cu$ (réduction)"
        },
        {
          "question": "<strong>4)</strong> En déduire l'équation bilan de la réaction qui se produit dans la pile.",
          "reponse": "$Zn_{(s)} + Cu^{2+}_{(aq)} \\rightarrow Zn^{2+}_{(aq)} + Cu_{(s)}$"
        }
      ]
    },
    {
      "titre": "Exercice 6 : Test d'identification des ions (3 pts)",
      "points": "3 pts",
      "enonce": "<p>Un élève dispose de deux solutions inconnues X et Y. Il effectue les tests suivants :</p><ul><li>Solution X : test à la flamme → flamme violette ; ajout de nitrate d'argent → précipité blanc</li><li>Solution Y : test à la flamme → flamme jaune ; ajout de chlorure de baryum → précipité blanc insoluble dans les acides</li></ul>",
      "questions": [
        {
          "question": "<strong>1)</strong> Identifier les ions présents dans la solution X.",
          "reponse": "Solution X :<br>- Flamme violette → présence d'ions <strong>potassium ($K^+$)</strong><br>- Précipité blanc avec $AgNO_3$ → présence d'ions <strong>chlorure ($Cl^-$)</strong><br>La solution X contient donc du <strong>chlorure de potassium ($KCl$)</strong>."
        },
        {
          "question": "<strong>2)</strong> Identifier les ions présents dans la solution Y.",
          "reponse": "Solution Y :<br>- Flamme jaune → présence d'ions <strong>sodium ($Na^+$)</strong><br>- Précipité blanc avec $BaCl_2$ insoluble dans les acides → présence d'ions <strong>sulfate ($SO_4^{2-}$)</strong><br>La solution Y contient donc du <strong>sulfate de sodium ($Na_2SO_4$)</strong>."
        },
        {
          "question": "<strong>3)</strong> Écrire les équations bilans des réactions de précipitation observées.",
          "reponse": "Pour X : $Ag^+ + Cl^- \\rightarrow AgCl_{(s)} \\downarrow$ (précipité blanc)<br>Pour Y : $Ba^{2+} + SO_4^{2-} \\rightarrow BaSO_{4(s)} \\downarrow$ (précipité blanc)"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
