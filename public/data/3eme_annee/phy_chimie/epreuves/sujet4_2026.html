<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Physique-Chimie",
  "classe": "3ème année",
  "sequence": "Séquence 4",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Équilibre d'un solide (Cours)",
      "points": "4 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; padding: 10px; background-color: #f8f9fa; border-radius: 8px; color: #212529;'> <p style='font-size: 1em;'>Cet exercice porte sur les conditions d'équilibre d'un solide soumis à l'action de plusieurs forces.</p> </div>",
      "questions": [
        {
          "question": "<div style='font-size: 1em; color: #212529;'>1)  Énoncer les deux conditions nécessaires pour qu'un solide soit en équilibre.</div>",
          "reponse": "<div style='font-size: 1em; color: #212529;'> <p>Pour qu'un solide soit en équilibre, il faut que :</p> <ul style='list-style-type: disc; padding-left: 20px;'> <li>La somme vectorielle des forces extérieures qui s'exercent sur lui soit nulle : <div class='math-block'><div class='math'>$$ \\sum \\vec{F} = \\vec{0} $$</div></div> (principe d'inertie).</li> <li>La somme des moments de ces forces par rapport à un point quelconque soit nulle : <div class='math-block'><div class='math'>$$ \\sum M(\\vec{F}) = 0 $$</div></div> (théorème des moments).</li> </ul> </div>"
        },
        {
          "question": "<div style='font-size: 1em; color: #212529;'>2)  Le principe d'inertie est aussi appelé première loi de Newton. Qu'énonce-t-il ?</div>",
          "reponse": "<div style='font-size: 1em; color: #212529;'> <p>Le principe d'inertie énonce que : « Un corps soumis à un ensemble de forces qui se compensent (somme des forces nulle) est soit au repos, soit en mouvement rectiligne uniforme. »</p> </div>"
        },
        {
          "question": "<div style='font-size: 1em; color: #212529;'>3)  Un livre est posé sur une table. Quelles sont les forces qui s'exercent sur lui ? Ces forces se compensent-elles ? Justifier.</div>",
          "reponse": "<div style='font-size: 1em; color: #212529;'> <p>Le livre est soumis à deux forces :</p> <ul style='list-style-type: disc; padding-left: 20px;'> <li>Son <strong>poids</strong> \\( \\vec{P} \\), vertical vers le bas.</li> <li>La <strong>réaction normale</strong> \\( \\vec{R} \\) de la table, verticale vers le haut.</li> </ul> <p>Ces deux forces ont la même droite d'action (verticale), des sens opposés et une intensité égale (\\( R = P \\)). Elles se compensent donc : \\( \\vec{P} + \\vec{R} = \\vec{0} \\). Le livre est en équilibre.</p> </div>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Application du théorème des moments",
      "points": "6 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; padding: 10px; background-color: #f8f9fa; border-radius: 8px; color: #212529;'> <p style='font-size: 1em;'>Une barre homogène de masse \\( m = 2 \\, \\text{kg} \\) et de longueur \\( L = 1,0 \\, \\text{m} \\) est maintenue en équilibre horizontal par un fil vertical attaché à son extrémité A. Un objet de masse \\( M = 0,5 \\, \\text{kg} \\) est suspendu à l'extrémité B. On prend \\( g = 10 \\, \\text{N.kg}^{-1} \\).</p> <p style='font-size: 1em;'>On suppose que la barre est de masse négligeable devant les autres forces (on néglige son poids).</p> <p style='font-size: 1em;'>Le point de pivot est situé à une distance \\( x = 0,2 \\, \\text{m} \\) de l'extrémité A.</p> <div style='background-color: #e9ecef; padding: 15px; border-radius: 8px; text-align: center;'> <p style='font-size: 1em;'><strong>Schéma :</strong></p> <p style='font-size: 1em;'>A --------(Pivot)----------------- B</p> <p style='font-size: 1em;'>↑ Fil &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; ↓ Poids de l'objet (M)</p> </div> </div>",
      "questions": [
        {
          "question": "<div style='font-size: 1em; color: #212529;'>1)  Faire le bilan des forces qui s'exercent sur la barre. Les représenter sur un schéma.</div>",
          "reponse": "<div style='font-size: 1em; color: #212529;'> <p>Les forces extérieures qui s'exercent sur la barre sont :</p> <ul style='list-style-type: disc; padding-left: 20px;'> <li>La <strong>tension</strong> \\( \\vec{T} \\) du fil vertical en A, vers le haut.</li> <li>Le <strong>poids</strong> \\( \\vec{P}_M \\) de l'objet en B, vertical vers le bas : \\( P_M = M \\times g = 0,5 \\times 10 = 5 \\, \\text{N} \\).</li> <li>La <strong>réaction</strong> \\( \\vec{R} \\) du pivot (on ne la connaît pas, mais elle passe par le pivot).</li> </ul> </div>"
        },
        {
          "question": "<div style='font-size: 1em; color: #212529;'>2)  Appliquer le théorème des moments par rapport au pivot pour déterminer l'intensité de la tension du fil.</div>",
          "reponse": "<div style='font-size: 1em; color: #212529;'> <p>On applique le théorème des moments par rapport au point O (pivot). Les moments de la réaction \\( \\vec{R} \\) et du poids de l'objet \\( \\vec{P}_M \\) s'annulent car leurs droites d'action passent par O.</p> <p>Le moment de la tension \\( \\vec{T} \\) par rapport à O est :</p> <div class='math-block'><div class='math'>$$ M(\\vec{T}) = T \\times d_T = T \\times (\\text{distance A-O}) = T \\times x = T \\times 0,2 $$</div></div> <p>L'équilibre de rotation s'écrit :</p> <div class='math-block'><div class='math'>$$ \\sum M(\\vec{F}) = 0 \\Rightarrow M(\\vec{T}) - M(\\vec{P}_M) = 0 $$</div></div> <p>Avec \\( M(\\vec{P}_M) = P_M \\times (\\text{distance B-O}) = 5 \\times (L - x) = 5 \\times (1,0 - 0,2) = 5 \\times 0,8 = 4 \\, \\text{N.m} \\).</p> <p>On a donc :</p> <div class='math-block'><div class='math'>$$ T \\times 0,2 = 4 \\Rightarrow T = \\frac{4}{0,2} = 20 \\, \\text{N} $$</div></div> <p>La tension du fil est de \\( 20 \\, \\text{N} \\).</p> </div>"
        },
        {
          "question": "<div style='font-size: 1em; color: #212529;'>3)  En déduire l'intensité de la réaction du pivot.</div>",
          "reponse": "<div style='font-size: 1em; color: #212529;'> <p>On applique le principe d'inertie (condition de translation) :</p> <div class='math-block'><div class='math'>$$ \\sum \\vec{F} = \\vec{0} \\Rightarrow \\vec{T} + \\vec{P}_M + \\vec{R} = \\vec{0} $$</div></div> <p>En projection sur l'axe vertical (orienté vers le haut) :</p> <div class='math-block'><div class='math'>$$ T - P_M - R = 0 \\Rightarrow R = T - P_M = 20 - 5 = 15 \\, \\text{N} $$</div></div> <p>La réaction du pivot est de \\( 15 \\, \\text{N} \\), orientée vers le haut.</p> </div>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Problème concret (équilibre d'une poutre)",
      "points": "6 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; padding: 10px; background-color: #f8f9fa; border-radius: 8px; color: #212529;'> <p style='font-size: 1em;'>Un ouvrier utilise une poutre homogène de longueur \\( L = 4,0 \\, \\text{m} \\) et de masse \\( m = 30 \\, \\text{kg} \\) pour soulever une charge. La poutre est posée sur un tréteau (pivot) situé à \\( d = 1,0 \\, \\text{m} \\) de l'extrémité A. Il exerce une force verticale vers le bas à l'extrémité A de la poutre pour maintenir l'équilibre. La charge de masse \\( M = 80 \\, \\text{kg} \\) est suspendue à l'extrémité B.</p> <p style='font-size: 1em;'>On prend \\( g = 10 \\, \\text{N.kg}^{-1} \\).</p> <div style='background-color: #e9ecef; padding: 15px; border-radius: 8px; text-align: center;'> <p style='font-size: 1em;'><strong>Schéma :</strong></p> <p style='font-size: 1em;'>A --------(Tréteau)----------------- B</p> <p style='font-size: 1em;'>↓ Force de l'ouvrier &nbsp;&nbsp;&nbsp;&nbsp;&nbsp; ↓ Poids de la charge</p> <p style='font-size: 1em;'>↕ Poids de la poutre (au centre, à \\( L/2 = 2,0 \\, \\text{m} \\) de A)</p> </div> </div>",
      "questions": [
        {
          "question": "<div style='font-size: 1em; color: #212529;'>1)  Représenter les forces s'exerçant sur la poutre en indiquant leur point d'application.</div>",
          "reponse": "<div style='font-size: 1em; color: #212529;'> <p>Les forces s'exerçant sur la poutre sont :</p> <ul style='list-style-type: disc; padding-left: 20px;'> <li>La <strong>force exercée par l'ouvrier</strong> \\( \\vec{F} \\) en A, verticale vers le bas.</li> <li>Le <strong>poids de la poutre</strong> \\( \\vec{P}_{poutre} \\) au centre de gravité G (milieu de la poutre, à \\( L/2 = 2,0 \\, \\text{m} \\) de A), vertical vers le bas : \\( P_{poutre} = m \\times g = 30 \\times 10 = 300 \\, \\text{N} \\).</li> <li>Le <strong>poids de la charge</strong> \\( \\vec{P}_{charge} \\) en B, vertical vers le bas : \\( P_{charge} = M \\times g = 80 \\times 10 = 800 \\, \\text{N} \\).</li> <li>La <strong>réaction du tréteau</strong> \\( \\vec{R} \\) au point d'appui, verticale vers le haut.</li> </ul> </div>"
        },
        {
          "question": "<div style='font-size: 1em; color: #212529;'>2)  En appliquant le théorème des moments par rapport au tréteau, déterminer l'intensité de la force \\( F \\) exercée par l'ouvrier.</div>",
          "reponse": "<div style='font-size: 1em; color: #212529;'> <p>Choisissons le tréteau O comme point de calcul des moments pour simplifier (le moment de la réaction \\( \\vec{R} \\) est nul).</p> <p><strong>Données géométriques :</strong></p> <ul style='list-style-type: none; padding-left: 0;'> <li>Distance AO = \\( d = 1,0 \\, \\text{m} \\)</li> <li>Distance GO = \\( L/2 - d = 2,0 - 1,0 = 1,0 \\, \\text{m} \\)</li> <li>Distance BO = \\( L - d = 4,0 - 1,0 = 3,0 \\, \\text{m} \\)</li> </ul> <p><strong>Moments (sens positif : sens des aiguilles d'une montre) :</strong></p> <ul style='list-style-type: disc; padding-left: 20px;'> <li>Moment de \\( \\vec{F} \\) en A : \\( M(F) = -F \\times 1,0 \\) (tend à faire tourner dans le sens inverse).</li> <li>Moment du poids de la poutre en G : \\( M(P_{poutre}) = 300 \\times 1,0 = 300 \\, \\text{N.m} \\)</li> <li>Moment du poids de la charge en B : \\( M(P_{charge}) = 800 \\times 3,0 = 2400 \\, \\text{N.m} \\)</li> </ul> <p>Condition d'équilibre :</p> <div class='math-block'><div class='math'>$$ \\sum M = 0 \\Rightarrow -F \\times 1,0 + 300 + 2400 = 0 $$</div></div> <div class='math-block'><div class='math'>$$ -F + 2700 = 0 \\Rightarrow F = 2700 \\, \\text{N} $$</div></div> <p>La force exercée par l'ouvrier est de \\( 2700 \\, \\text{N} \\), soit \\( 270 \\, \\text{kgf} \\). C'est très important.</p> </div>"
        },
        {
          "question": "<div style='font-size: 1em; color: #212529;'>3)  En déduire l'intensité de la réaction du tréteau.</div>",
          "reponse": "<div style='font-size: 1em; color: #212529;'> <p>Condition de translation (principe d'inertie) :</p> <div class='math-block'><div class='math'>$$ \\sum \\vec{F} = \\vec{0} \\Rightarrow \\vec{F} + \\vec{P}_{poutre} + \\vec{P}_{charge} + \\vec{R} = \\vec{0} $$</div></div> <p>En projection verticale (orientée vers le haut) :</p> <div class='math-block'><div class='math'>$$ R - F - P_{poutre} - P_{charge} = 0 $$</div></div> <div class='math-block'><div class='math'>$$ R = F + P_{poutre} + P_{charge} = 2700 + 300 + 800 = 3800 \\, \\text{N} $$</div></div> <p>La réaction du tréteau est de \\( 3800 \\, \\text{N} \\), orientée vers le haut.</p> </div>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Questions ouvertes",
      "points": "4 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; padding: 10px; background-color: #f8f9fa; border-radius: 8px; color: #212529;'> <p style='font-size: 1em;'>Répondre par Vrai ou Faux en justifiant.</p> </div>",
      "questions": [
        {
          "question": "<div style='font-size: 1em; color: #212529;'>a)  Un solide est en équilibre si la somme des forces qui s'exercent sur lui est nulle.</div>",
          "reponse": "<div style='font-size: 1em; color: #212529;'> <p><strong>Faux.</strong> La condition \\( \\sum \\vec{F} = \\vec{0} \\) est nécessaire mais pas suffisante. Il faut aussi que la somme des moments soit nulle \\( \\sum M(\\vec{F}) = 0 \\) pour qu'il n'y ait pas de rotation.</p> </div>"
        },
        {
          "question": "<div style='font-size: 1em; color: #212529;'>b)  Si un solide est immobile, il est nécessairement en équilibre.</div>",
          "reponse": "<div style='font-size: 1em; color: #212529;'> <p><strong>Vrai.</strong> Un solide immobile vérifie les deux conditions d'équilibre : les forces se compensent (sinon il se déplacerait) et les moments se compensent (sinon il tournerait).</p> </div>"
        },
        {
          "question": "<div style='font-size: 1em; color: #212529;'>c)  Le théorème des moments permet de déterminer une force inconnue en écrivant que la somme des moments est nulle.</div>",
          "reponse": "<div style='font-size: 1em; color: #212529;'> <p><strong>Vrai.</strong> En écrivant \\( \\sum M(\\vec{F}) = 0 \\), on obtient une équation qui relie les forces et les distances. Si on connaît les autres grandeurs, on peut déterminer la force inconnue.</p> </div>"
        },
        {
          "question": "<div style='font-size: 1em; color: #212529;'>d)  Le moment d'une force par rapport à un point est nul si la droite d'action de la force passe par ce point.</div>",
          "reponse": "<div style='font-size: 1em; color: #212529;'> <p><strong>Vrai.</strong> Le moment est \\( M = F \\times d \\), où \\( d \\) est la distance entre le point et la droite d'action. Si la droite d'action passe par le point, la distance \\( d = 0 \\), donc le moment est nul.</p> </div>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
