<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Présentation mobile</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' },
            options: { skipHtmlTypes: 'script' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 500px;
        margin: 0 auto;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    .slide-header {
        flex-shrink: 0;
        padding: 18px 16px 10px 16px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        z-index: 10;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .slide-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
    }

    .content-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 18px 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        flex-shrink: 0;
    }

    .content-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .content-card li {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        line-height: 1.5;
    }

    .content-card li:last-child {
        border-bottom: none;
    }

    .bullet-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
    }

    .math-block {
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        overflow-x: auto;
        flex-shrink: 0;
        margin: 4px 0;
    }

    .math-block .math {
        font-size: 1.2rem;
        color: #e2e8f0;
    }

    .note-box {
        background: rgba(96, 165, 250, 0.08);
        border-left: 4px solid #60a5fa;
        padding: 12px 16px;
        border-radius: 12px;
        font-style: italic;
        font-size: 0.9rem;
        color: #cbd5e1;
        flex-shrink: 0;
    }

    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        border-radius: 0;
        flex-direction: column;
    }

    .loading-card {
        background: #1e293b;
        padding: 32px 28px;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #334155;
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px auto;
    }

    .loading-text {
        font-weight: 600;
        font-size: 1.1rem;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    .loading-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 16px;
    }
    .loading-progress {
        height: 3px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        animation: loadingProgress 30s ease-out forwards;
    }

    .loading-timeout {
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 12px;
    }

    .btn-cancel-loading {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 40px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #f87171;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }

    .btn-cancel-loading:active {
        transform: scale(0.94);
        background: rgba(239, 68, 68, 0.25);
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
    }

    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .slide-counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255,255,255,0.05);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(255,255,255,0.04);
    }

    .status-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 30px;
        background: rgba(96, 165, 250, 0.12);
        color: #93bbfc;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
    }

    .status-badge .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: pulse-dot 1.2s infinite;
        flex-shrink: 0;
    }

    .status-badge.idle .dot {
        animation: none;
        background: #64748b;
    }
    .status-badge.speaking .dot {
        background: #34d399;
        animation: pulse-dot 0.8s infinite;
    }
    .status-badge.error .dot {
        background: #f87171;
        animation: none;
    }
    .status-badge.paused .dot {
        animation: none;
        background: #fbbf24;
    }
    .status-badge.waiting .dot {
        animation: pulse-dot 1.5s infinite;
        background: #fbbf24;
    }
    .status-badge.loading .dot {
        animation: pulse-dot 0.5s infinite;
        background: #60a5fa;
    }

    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.7); }
    }

    .footer-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(255,255,255,0.1);
    }

    .btn-secondary {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-play {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
        min-width: 80px;
        justify-content: center;
    }
    .btn-play:active {
        background: rgba(52, 211, 153, 0.25);
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
    }

    .auto-indicator {
        font-size: 0.65rem;
        color: #64748b;
        text-align: center;
        letter-spacing: 0.3px;
        padding: 2px 0;
    }

    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.2rem;
        }
        .content-card li {
            font-size: 0.9rem;
            padding: 8px 0;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .btn-play {
            min-width: 60px;
        }
        .footer-buttons {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
        .loading-card {
            padding: 20px 16px;
        }
        .math-block .math {
            font-size: 1rem;
        }
    }

    @media (min-width: 600px) {
        .app-container {
            max-width: 480px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
        .loading-overlay {
            border-radius: 32px;
        }
    }

    /* Mode jour (par défaut) */
    html, body {
        background: #f0f4f8 !important;
        color: #1a202c !important;
    }
    .app-container {
        background: linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%) !important;
    }
    .slide-header {
        background: rgba(255, 255, 255, 0.85) !important;
        border-bottom: 1px solid rgba(0,0,0,0.08) !important;
    }
    .slide-header h1 {
        background: linear-gradient(135deg, #2b6cb0, #6b46c1) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        background-clip: text !important;
    }
    .slide-footer {
        background: rgba(255, 255, 255, 0.9) !important;
        border-top: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card {
        background: rgba(255,255,255,0.8) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card li {
        border-bottom: 1px solid rgba(0,0,0,0.05) !important;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.12) !important;
        border-left: 4px solid #4299e1 !important;
        color: #2c3e50 !important;
    }
    .math-block {
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .math-block .math {
        color: #2d3748 !important;
    }
    .slide-counter {
        color: #4a5568 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .status-badge {
        background: rgba(96, 165, 250, 0.15) !important;
        color: #2b6cb0 !important;
        border: 1px solid rgba(96, 165, 250, 0.15) !important;
    }
    .btn {
        color: #2d3748 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .btn-secondary {
        background: rgba(0,0,0,0.04) !important;
        border-color: rgba(0,0,0,0.08) !important;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15) !important;
        border-color: rgba(52, 211, 153, 0.2) !important;
        color: #38a169 !important;
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15) !important;
        border-color: rgba(251, 191, 36, 0.2) !important;
        color: #d69e2e !important;
    }
    .auto-indicator {
        color: #718096 !important;
    }
    .loading-card {
        background: #ffffff !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .loading-text {
        color: #1a202c !important;
    }
    .loading-sub {
        color: #4a5568 !important;
    }
</style>
</head>
<body>

<div class="app-container">

    <header class="slide-header">
        <h1 id="slideTitle">Chargement...</h1>
    </header>

    <main class="slide-body" id="slideBody"></main>

    <!-- LOADING OVERLAY AVEC BOUTON ANNULER -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Préparation vocale...</div>
            <div class="loading-sub" id="loadingSub">Synthèse en cours</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loadingProgressBar"></div>
            </div>
            <div class="loading-timeout" id="loadingTimeout">⏱️ 30 secondes maximum</div>
            <button class="btn-cancel-loading" id="cancelLoadingBtn">
                <span>✕</span> Annuler
            </button>
        </div>
    </div>

    <footer class="slide-footer">
        <div class="footer-top">
            <span class="slide-counter" id="slideCounter">1 / 3</span>
            <span class="status-badge idle" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">Prêt</span>
            </span>
        </div>

        <div class="footer-buttons">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-secondary" id="replayBtn">
                <span class="btn-icon">🔁</span> <span class="btn-label">Relire</span>
            </button>
            <button class="btn btn-play" id="playBtn">
                <span class="btn-icon">▶</span> <span class="btn-label">Play</span>
            </button>
        </div>

        <div class="auto-indicator" id="autoIndicator">⏸ Lecture manuelle</div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // SLIDES
    // ================================================================
    const slides = [
  {
    "titre": "Introduction aux équations et inéquations",
    "contenu": "<div style='font-family: Arial, sans-serif; font-size: 1em; line-height: 1.6; color: #222;'>\n  <p>Les <strong>équations</strong> et les <strong>inéquations</strong> sont des outils puissants pour modéliser et résoudre des problèmes de la vie courante.</p>\n  <div style='background-color: #e9f7ef; padding: 15px; border-radius: 8px; border-left: 5px solid #28a745; color: #222;'>\n    <strong>Définitions :</strong><br>\n    - Une <strong>équation</strong> est une égalité contenant une ou plusieurs inconnues.<br>\n    - Une <strong>inéquation</strong> est une inégalité contenant une ou plusieurs inconnues.\n  </div>\n  <p style='margin-top: 15px;'><strong>Objectifs de la leçon :</strong></p>\n  <ul style='padding-left: 20px;'>\n    <li>Résoudre des équations du premier degré à une inconnue.</li>\n    <li>Résoudre des inéquations du premier degré à une inconnue.</li>\n    <li>Résoudre des problèmes concrets.</li>\n  </ul>\n  <div style='background-color: #fff3cd; padding: 15px; border-radius: 8px; border-left: 5px solid #ffc107; color: #856404; margin-top: 15px;'>\n    <strong>Exemple :</strong> \\(2x + 3 = 7\\) est une équation. \\(3x - 5 > 10\\) est une inéquation.\n  </div>\n</div>",
    "texteParle": "Bienvenue dans cette leçon sur les équations et les inéquations. Ces outils sont très importants pour modéliser et résoudre des problèmes de la vie courante. Une équation est une égalité qui contient une inconnue, tandis qu'une inéquation est une inégalité avec une inconnue. Dans cette leçon, nous allons apprendre à résoudre des équations et des inéquations du premier degré, et les utiliser pour résoudre des problèmes concrets.",
    "note": "Résoudre une équation ou une inéquation, c'est trouver toutes les valeurs de l'inconnue qui vérifient l'égalité ou l'inégalité."
  },
  {
    "titre": "1. Équations du premier degré",
    "contenu": "<div style='font-family: Arial, sans-serif; font-size: 1em; line-height: 1.6; color: #222;'>\n  <p>Une équation du premier degré à une inconnue est de la forme \\(ax + b = 0\\) avec \\(a \\neq 0\\).</p>\n  <p style='background-color: #e9f7ef; padding: 15px; border-radius: 8px; border-left: 5px solid #28a745; color: #222;'>\n    <strong>Règle :</strong> Pour résoudre une équation, on isole l'inconnue en appliquant les mêmes opérations des deux côtés de l'égalité.\n  </p>\n  <div style='background-color: #f8f9fa; padding: 15px; border-radius: 8px; margin: 10px 0; border: 1px solid #dee2e6;'>\n    <p><strong>Exemple 1 :</strong> Résoudre \\(2x + 3 = 7\\)</p>\n    <p>\\(2x + 3 - 3 = 7 - 3\\)</p>\n    <p>\\(2x = 4\\)</p>\n    <p>\\(x = 2\\)</p>\n    <p><strong>Vérification :</strong> \\(2 \\times 2 + 3 = 4 + 3 = 7\\) ✓</p>\n  </div>\n  <div style='background-color: #f8f9fa; padding: 15px; border-radius: 8px; border: 1px solid #dee2e6;'>\n    <p><strong>Exemple 2 :</strong> Résoudre \\(-3x + 5 = 11\\)</p>\n    <p>\\(-3x = 6\\)</p>\n    <p>\\(x = -2\\)</p>\n    <p><strong>Vérification :</strong> \\(-3 \\times (-2) + 5 = 6 + 5 = 11\\) ✓</p>\n  </div>\n  <div style='background-color: #fff3cd; padding: 15px; border-radius: 8px; border-left: 5px solid #ffc107; color: #856404; margin-top: 10px;'>\n    <strong>Attention :</strong> Ne pas oublier de vérifier la solution trouvée.\n  </div>\n</div>",
    "texteParle": "Une équation du premier degré à une inconnue est de la forme a x plus b égal 0, avec a différent de 0. Pour résoudre une équation, on isole l'inconnue en appliquant les mêmes opérations des deux côtés de l'égalité. Par exemple, pour résoudre 2x plus 3 égal 7, on soustrait 3 des deux côtés, ce qui donne 2x égal 4, puis on divise par 2, ce qui donne x égal 2. La vérification donne 2 fois 2 plus 3 égal 7. Pour -3x plus 5 égal 11, on soustrait 5, on obtient -3x égal 6, puis on divise par -3, ce qui donne x égal -2.",
    "note": "La vérification est une étape obligatoire pour valider la solution."
  },
  {
    "titre": "2. Cas particuliers d'équations",
    "contenu": "<div style='font-family: Arial, sans-serif; font-size: 1em; line-height: 1.6; color: #222;'>\n  <p>Certaines équations ont des solutions particulières qu'il faut savoir reconnaître.</p>\n  <div style='background-color: #f8f9fa; padding: 15px; border-radius: 8px; margin: 10px 0; border: 1px solid #dee2e6;'>\n    <p><strong>Cas 1 : Équation avec des fractions</strong></p>\n    <p>Résoudre \\(\\frac{x}{3} + 2 = 5\\)</p>\n    <p>\\(\\frac{x}{3} = 3\\)</p>\n    <p>\\(x = 9\\)</p>\n  </div>\n  <div style='background-color: #f8f9fa; padding: 15px; border-radius: 8px; border: 1px solid #dee2e6;'>\n    <p><strong>Cas 2 : Équation avec des parenthèses</strong></p>\n    <p>Résoudre \\(3(x - 2) = 12\\)</p>\n    <p>\\(3x - 6 = 12\\)</p>\n    <p>\\(3x = 18\\)</p>\n    <p>\\(x = 6\\)</p>\n  </div>\n  <div style='background-color: #f8f9fa; padding: 15px; border-radius: 8px; border: 1px solid #dee2e6;'>\n    <p><strong>Cas 3 : Équation sans solution ou infinie de solutions</strong></p>\n    <p>\\(2x + 3 = 2x + 5\\) → pas de solution (impossible).</p>\n    <p>\\(2x + 3 = 2x + 3\\) → une infinité de solutions (toujours vrai).</p>\n  </div>\n  <div style='background-color: #e9f7ef; padding: 15px; border-radius: 8px; border-left: 5px solid #28a745; color: #222; margin-top: 10px;'>\n    <strong>Astuce :</strong> Développer les parenthèses avant d'isoler l'inconnue.\n  </div>\n</div>",
    "texteParle": "Certaines équations ont des cas particuliers qu'il faut savoir reconnaître. D'abord, les équations avec des fractions, comme x sur 3 plus 2 égal 5. On soustrait 2, on obtient x sur 3 égal 3, puis on multiplie par 3, ce qui donne x égal 9. Ensuite, les équations avec des parenthèses, comme 3 fois x moins 2 égal 12. On développe d'abord : 3x moins 6 égal 12, puis on ajoute 6 des deux côtés, ce qui donne 3x égal 18, donc x égal 6. Enfin, certaines équations n'ont pas de solution, comme 2x plus 3 égal 2x plus 5, ou une infinité de solutions.",
    "note": "Une équation peut avoir une solution unique, aucune solution ou une infinité de solutions."
  },
  {
    "titre": "3. Inéquations du premier degré",
    "contenu": "<div style='font-family: Arial, sans-serif; font-size: 1em; line-height: 1.6; color: #222;'>\n  <p>Une inéquation du premier degré à une inconnue est de la forme \\(ax + b > 0\\), \\(ax + b < 0\\), \\(ax + b \\geq 0\\) ou \\(ax + b \\leq 0\\).</p>\n  <p style='background-color: #e9f7ef; padding: 15px; border-radius: 8px; border-left: 5px solid #28a745; color: #222;'>\n    <strong>Règle :</strong> On résout une inéquation comme une équation, mais <strong>si on multiplie ou divise par un nombre négatif, on change le sens de l'inégalité</strong>.\n  </p>\n  <div style='background-color: #f8f9fa; padding: 15px; border-radius: 8px; margin: 10px 0; border: 1px solid #dee2e6;'>\n    <p><strong>Exemple 1 :</strong> Résoudre \\(2x + 3 > 7\\)</p>\n    <p>\\(2x > 4\\)</p>\n    <p>\\(x > 2\\)</p>\n    <p>Solution : \\(x \\in ]2, +\\infty[\\)</p>\n  </div>\n  <div style='background-color: #f8f9fa; padding: 15px; border-radius: 8px; border: 1px solid #dee2e6;'>\n    <p><strong>Exemple 2 :</strong> Résoudre \\(-3x + 5 \\leq 11\\)</p>\n    <p>\\(-3x \\leq 6\\)</p>\n    <p>On divise par -3 (négatif) : on change le sens.</p>\n    <p>\\(x \\geq -2\\)</p>\n    <p>Solution : \\(x \\in [-2, +\\infty[\\)</p>\n  </div>\n  <div style='background-color: #fff3cd; padding: 15px; border-radius: 8px; border-left: 5px solid #ffc107; color: #856404; margin-top: 10px;'>\n    <strong>Attention :</strong> La règle du changement de sens est souvent oubliée.\n  </div>\n</div>",
    "texteParle": "Une inéquation du premier degré est une inégalité avec une inconnue. On la résout comme une équation, mais attention : si on multiplie ou divise par un nombre négatif, on doit changer le sens de l'inégalité. Par exemple, pour 2x plus 3 supérieur à 7, on soustrait 3, on obtient 2x supérieur à 4, puis on divise par 2, ce qui donne x supérieur à 2. La solution est l'intervalle 2 ouvert à l'infini. Pour -3x plus 5 inférieur ou égal à 11, on soustrait 5, on obtient -3x inférieur ou égal à 6. Puis on divise par -3, et comme on divise par un nombre négatif, on change le sens : x supérieur ou égal à -2.",
    "note": "L'intervalle solution d'une inéquation peut être représenté sur une droite graduée."
  },
  {
    "titre": "4. Représentation des solutions",
    "contenu": "<div style='font-family: Arial, sans-serif; font-size: 1em; line-height: 1.6; color: #222;'>\n  <p>Les solutions d'une inéquation s'expriment sous forme d'<strong>intervalles</strong> et se représentent sur une <strong>droite graduée</strong>.</p>\n  <div style='background-color: #e9f7ef; padding: 15px; border-radius: 8px; border-left: 5px solid #28a745; color: #222;'>\n    <strong>Rappel des notations :</strong><br>\n    - \\(x > 2\\) : \\(]2, +\\infty[\\) (cercle vide en 2)<br>\n    - \\(x \\geq 2\\) : \\([2, +\\infty[\\) (cercle plein en 2)<br>\n    - \\(x < 2\\) : \\(]-\\infty, 2[\\)<br>\n    - \\(x \\leq 2\\) : \\(]-\\infty, 2]\\)\n  </div>\n  <div style='background-color: #f8f9fa; padding: 15px; border-radius: 8px; margin: 10px 0; border: 1px solid #dee2e6;'>\n    <p><strong>Exemple :</strong> Représenter \\(x \\geq -3\\)</p>\n    <p style='text-align: center; font-size: 1.2em;'>\n      ←—[●——————→<br>\n      &nbsp;&nbsp;&nbsp;-3\n    </p>\n    <p>Cercle plein en -3, flèche vers la droite.</p>\n  </div>\n  <div style='background-color: #f8f9fa; padding: 15px; border-radius: 8px; border: 1px solid #dee2e6;'>\n    <p><strong>Exemple :</strong> Représenter \\(-2 < x \\leq 4\\)</p>\n    <p style='text-align: center; font-size: 1.2em;'>\n      —-○———●—→<br>\n      &nbsp;-2&nbsp;&nbsp;&nbsp;4\n    </p>\n    <p>Cercle vide en -2, cercle plein en 4.</p>\n  </div>\n  <div style='background-color: #fff3cd; padding: 15px; border-radius: 8px; border-left: 5px solid #ffc107; color: #856404; margin-top: 10px;'>\n    <strong>À retenir :</strong> Cercle plein = inclus, cercle vide = exclus.\n  </div>\n</div>",
    "texteParle": "Les solutions d'une inéquation s'expriment sous forme d'intervalles et se représentent sur une droite graduée. Rappelons les notations : x supérieur à 2 s'écrit 2 ouvert à l'infini, avec un cercle vide en 2. x supérieur ou égal à 2 s'écrit 2 fermé à l'infini, avec un cercle plein en 2. De même pour inférieur et inférieur ou égal. Par exemple, pour représenter x supérieur ou égal à -3, on trace un cercle plein en -3 et une flèche vers la droite. Pour -2 inférieur à x inférieur ou égal à 4, on met un cercle vide en -2 et un cercle plein en 4.",
    "note": "Un cercle plein signifie que la valeur est incluse dans l'ensemble solution."
  },
  {
    "titre": "5. Problèmes concrets",
    "contenu": "<div style='font-family: Arial, sans-serif; font-size: 1em; line-height: 1.6; color: #222;'>\n  <p>Les équations et inéquations permettent de résoudre des problèmes de la vie courante.</p>\n  <p style='background-color: #e9f7ef; padding: 15px; border-radius: 8px; border-left: 5px solid #28a745; color: #222;'>\n    <strong>Méthode :</strong><br>\n    1. Identifier l'inconnue.<br>\n    2. Traduire l'énoncé en équation ou inéquation.<br>\n    3. Résoudre.<br>\n    4. Interpréter et vérifier la solution.\n  </p>\n  <div style='background-color: #f8f9fa; padding: 15px; border-radius: 8px; margin: 10px 0; border: 1px solid #dee2e6;'>\n    <p><strong>Problème 1 :</strong> Un père a 45 ans. Son fils a 15 ans. Dans combien d'années le père aura-t-il le double de l'âge de son fils ?</p>\n    <p>Soit x le nombre d'années.</p>\n    <p>Âge du père dans x ans : 45 + x</p>\n    <p>Âge du fils dans x ans : 15 + x</p>\n    <p>Équation : 45 + x = 2(15 + x)</p>\n    <p>45 + x = 30 + 2x</p>\n    <p>x = 15</p>\n    <p>Réponse : Dans 15 ans.</p>\n  </div>\n  <div style='background-color: #f8f9fa; padding: 15px; border-radius: 8px; border: 1px solid #dee2e6;'>\n    <p><strong>Problème 2 :</strong> Un taxi facture 500 FCFA de prise en charge plus 100 FCFA par kilomètre. Combien de kilomètres peut-on parcourir avec 2500 FCFA ?</p>\n    <p>Inéquation : 500 + 100x ≤ 2500</p>\n    <p>100x ≤ 2000</p>\n    <p>x ≤ 20</p>\n    <p>Réponse : On peut parcourir au maximum 20 km.</p>\n  </div>\n</div>",
    "texteParle": "Les équations et inéquations permettent de résoudre des problèmes de la vie courante. La méthode est simple : identifier l'inconnue, traduire l'énoncé en équation, résoudre, puis interpréter la solution. Par exemple, un père de 45 ans et son fils de 15 ans. Dans combien d'années le père aura-t-il le double de l'âge de son fils ? On pose x le nombre d'années. L'équation est 45 plus x égal 2 fois 15 plus x. On résout et on trouve x égal 15 ans. Un autre exemple : un taxi facture 500 francs de prise en charge et 100 francs par kilomètre. Avec 2500 francs, on peut parcourir au maximum 20 kilomètres.",
    "note": "Bien lire l'énoncé pour identifier correctement l'inconnue et les relations."
  },
  {
    "titre": "6. Exercices résolus",
    "contenu": "<div style='font-family: Arial, sans-serif; font-size: 1em; line-height: 1.6; color: #222;'>\n  <div style='background-color: #f8f9fa; padding: 15px; border-radius: 8px; margin: 10px 0; border: 1px solid #dee2e6;'>\n    <p><strong>Exercice 1 :</strong> Résoudre \\(3x - 7 = 2x + 5\\)</p>\n    <p>\\(3x - 2x = 5 + 7\\)</p>\n    <p>\\(x = 12\\)</p>\n    <p><strong>Vérification :</strong> \\(3 \\times 12 - 7 = 36 - 7 = 29\\) et \\(2 \\times 12 + 5 = 24 + 5 = 29\\) ✓</p>\n  </div>\n  <div style='background-color: #f8f9fa; padding: 15px; border-radius: 8px; margin: 10px 0; border: 1px solid #dee2e6;'>\n    <p><strong>Exercice 2 :</strong> Résoudre \\(4x - 3 > 2x + 9\\)</p>\n    <p>\\(4x - 2x > 9 + 3\\)</p>\n    <p>\\(2x > 12\\)</p>\n    <p>\\(x > 6\\)</p>\n    <p>Solution : \\(x \\in ]6, +\\infty[\\)</p>\n  </div>\n  <div style='background-color: #f8f9fa; padding: 15px; border-radius: 8px; margin: 10px 0; border: 1px solid #dee2e6;'>\n    <p><strong>Exercice 3 :</strong> Résoudre \\(-2x + 4 \\leq 6\\)</p>\n    <p>\\(-2x \\leq 2\\)</p>\n    <p>On divise par -2 : on change le sens.</p>\n    <p>\\(x \\geq -1\\)</p>\n    <p>Solution : \\(x \\in [-1, +\\infty[\\)</p>\n  </div>\n  <div style='background-color: #fff3cd; padding: 15px; border-radius: 8px; border-left: 5px solid #ffc107; color: #856404; margin-top: 10px;'>\n    <strong>À retenir :</strong> Pour les inéquations, le changement de sens est crucial.\n  </div>\n</div>",
    "texteParle": "Pratiquons avec quelques exercices. Exercice 1 : 3x moins 7 égal 2x plus 5. On regroupe les termes en x d'un côté, les constantes de l'autre : 3x moins 2x égal 5 plus 7, donc x égal 12. Vérification : 3 fois 12 moins 7 égal 29, et 2 fois 12 plus 5 égal 29. Exercice 2 : 4x moins 3 supérieur à 2x plus 9. On soustrait 2x des deux côtés : 2x moins 3 supérieur à 9, puis on ajoute 3 : 2x supérieur à 12, donc x supérieur à 6. Exercice 3 : -2x plus 4 inférieur ou égal à 6. On soustrait 4 : -2x inférieur ou égal à 2. On divise par -2 et on change le sens : x supérieur ou égal à -1.",

  {

    "contenu": "<div style='font-family: Arial, sans-serif; font-size: 1em; line-height: 1.6; color: #222;'>\n  <div style='background-color: #f8d7da; padding: 15px; border-radius: 8px; border-left: 5px solid #dc3545; color: #721c24; margin: 10px 0;'>\n    <p><strong>Erreur 1 :</strong> Oublier de changer le sens de l'inégalité</p>\n    <p>Incorrect : \\(-2x < 6\\) → \\(x < -3\\) (faux, on divise par -2, donc on change le sens)</p>\n    <p>Correct : \\(-2x < 6\\) → \\(x > -3\\)</p>\n  </div>\n  <div style='background-color: #f8d7da; padding: 15px; border-radius: 8px; border-left: 5px solid #dc3545; color: #721c24; margin: 10px 0;'>\n    <p><strong>Erreur 2 :</strong> Oublier d'appliquer l'opération des deux côtés</p>\n    <p>Incorrect : \\(x + 5 = 10\\) → \\(x = 5\\) (on oublie de soustraire 5 à gauche)</p>\n    <p>Correct : \\(x + 5 - 5 = 10 - 5\\) → \\(x = 5\\)</p>\n  </div>\n  <div style='background-color: #f8d7da; padding: 15px; border-radius: 8px; border-left: 5px solid #dc3545; color: #721c24; margin: 10px 0;'>\n    <p><strong>Erreur 3 :</strong> Confondre \\(>\\) et \\(\\geq\\) dans l'intervalle solution</p>\n    <p>\\(x > 3\\) → intervalle \\(]3, +\\infty[\\) (cercle vide en 3)</p>\n    <p>\\(x \\geq 3\\) → intervalle \\([3, +\\infty[\\) (cercle plein en 3)</p>\n  </div>\n  <div style='background-color: #e9f7ef; padding: 15px; border-radius: 8px; border-left: 5px solid #28a745; color: #222; margin-top: 10px;'>\n    <strong>Conseil :</strong> La vérification permet de détecter ces erreurs.\n  </div>\n</div>",
    "texteParle": "Voici les erreurs les plus fréquentes à éviter. Première erreur : oublier de changer le sens de l'inégalité quand on divise par un nombre négatif. Par exemple, pour -2x inférieur à 6, si on divise par -2, on doit changer le sens, ce qui donne x supérieur à -3. Deuxième erreur : oublier d'appliquer l'opération des deux côtés de l'égalité. Troisième erreur : confondre strictement supérieur et supérieur ou égal dans l'intervalle solution. Pour x supérieur à 3, le cercle est vide ; pour x supérieur ou égal à 3, le cercle est plein.",
    "note": "La vérification systématique est la meilleure façon d'éviter ces erreurs."

  {
    "titre": "Résumé et applications",
    "contenu": "<div style='font-family: Arial, sans-serif; font-size: 1em; line-height: 1.6; color: #222;'>\n  <div style='background-color: #e9f7ef; padding: 15px; border-radius: 8px; border-left: 5px solid #28a745; color: #222;'>\n    <strong>Résumé des règles :</strong>\n    <ul style='padding-left: 20px;'>\n      <li><strong>Équation :</strong> Isoler l'inconnue en appliquant les mêmes opérations des deux côtés.</li>\n      <li><strong>Inéquation :</strong> On résout comme une équation, mais on change le sens si on multiplie ou divise par un nombre négatif.</li>\n      <li><strong>Intervalles :</strong> \\(>\\) ou \\(<\\) → cercle vide ; \\(\\geq\\) ou \\(\\leq\\) → cercle plein.</li>\n    </ul>\n  </div>\n  <div style='background-color: #f8f9fa; padding: 15px; border-radius: 8px; margin-top: 15px; border: 1px solid #dee2e6;'>\n    <p><strong>Exercices d'application :</strong></p>\n    <ul style='padding-left: 20px;'>\n      <li>Résoudre \\(5x - 3 = 2x + 9\\)</li>\n      <li>Résoudre \\(3x + 2 > 5x - 6\\)</li>\n      <li>Un livre coûte 2000 FCFA de plus qu'un cahier. L'ensemble coûte 6000 FCFA. Quel est le prix de chaque article ?</li>\n    </ul>\n  </div>\n  <div style='background-color: #fff3cd; padding: 15px; border-radius: 8px; border-left: 5px solid #ffc107; color: #856404; margin-top: 15px;'>\n    <strong>Objectif atteint :</strong> Vous savez maintenant résoudre des équations et des inéquations du premier degré.\n  </div>\n</div>",
    "texteParle": "Pour résumer cette leçon, les règles sont les suivantes. Pour une équation, on isole l'inconnue en appliquant les mêmes opérations des deux côtés. Pour une inéquation, on change le sens de l'inégalité si on divise par un nombre négatif. Les intervalles s'écrivent avec des crochets ouverts ou fermés selon que la valeur est incluse ou non. Pour vous entraîner, essayez de résoudre 5x moins 3 égal 2x plus 9, et 3x plus 2 supérieur à 5x moins 6. Et un problème concret : un livre coûte 2000 francs de plus qu'un cahier, le total est de 6000 francs. Trouvez le prix de chaque article.",

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentIndex = 0;
    let isSpeaking = false;
    let isPaused = false;
    let currentUtterance = null;
    let isLoading = false;
    let loadingTimeout = null;
    let isTransitioning = false;
    let speechSupported = true;
    let userInteracted = false;
    let isPlaying = false;
    let loadingCancelled = false;

    const total = slides.length;
    const synth = window.speechSynthesis;

    // Références jQuery
    const $title = $('#slideTitle');
    const $body = $('#slideBody');
    const $counter = $('#slideCounter');
    const $statusText = $('#statusText');
    const $statusBadge = $('#statusBadge');
    const $loading = $('#loadingOverlay');
    const $loadingText = $('#loadingText');
    const $loadingSub = $('#loadingSub');
    const $loadingTimeout = $('#loadingTimeout');
    const $loadingProgressBar = $('#loadingProgressBar');
    const $autoIndicator = $('#autoIndicator');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $replay = $('#replayBtn');
    const $play = $('#playBtn');
    const $cancelLoading = $('#cancelLoadingBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function setStatus(text, type) {
        $statusText.text(text);
        $statusBadge.removeClass('idle speaking error paused waiting loading');
        if (type === 'speaking') $statusBadge.addClass('speaking');
        else if (type === 'error') $statusBadge.addClass('error');
        else if (type === 'paused') $statusBadge.addClass('paused');
        else if (type === 'waiting') $statusBadge.addClass('waiting');
        else if (type === 'loading') $statusBadge.addClass('loading');
        else $statusBadge.addClass('idle');
    }

    function updatePlayButton() {
        if (isPlaying) {
            $play.addClass('playing');
            $play.find('.btn-icon').text('⏸');
            $play.find('.btn-label').text('Pause');
        } else {
            $play.removeClass('playing');
            $play.find('.btn-icon').text('▶');
            $play.find('.btn-label').text('Play');
        }
    }

    function showLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        
        loadingCancelled = false;
        isLoading = true;
        
        // Réinitialiser la barre de progression
        $loadingProgressBar.css('animation', 'none');
        $loadingProgressBar.css('width', '0%');
        // Forcer un reflow
        $loadingProgressBar[0].offsetHeight;
        $loadingProgressBar.css('animation', 'loadingProgress 30s ease-out forwards');
        
        $loadingText.text('Préparation vocale...');
        $loadingSub.text('Synthèse en cours');
        $loadingTimeout.text('⏱️ 30 secondes maximum');
        $loading.fadeIn(300);
        setStatus("⏳ Chargement...", 'loading');
        
        // 🔥 TIMEOUT DE 30 SECONDES
        loadingTimeout = setTimeout(() => {
            if (isLoading && !loadingCancelled) {
                hideLoading();
                setStatus("⚠️ Délai dépassé (30s)", 'error');
                isPlaying = false;
                updatePlayButton();
                $loadingSub.text('La synthèse vocale a pris trop de temps');
                $loadingTimeout.text('❌ Délai dépassé');
            }
        }, 30000);
    }

    function hideLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        isLoading = false;
        loadingCancelled = false;
        $loading.fadeOut(300);
        // Ne pas changer le statut si on est en train de parler
        if (!isSpeaking && !isPlaying) {
            setStatus("⏸ Lecture arrêtée", 'paused');
        }
    }

    function cancelLoading() {
        loadingCancelled = true;
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        hideLoading();
        stopSpeaking();
        setStatus("⏸ Annulé", 'paused');
        isPlaying = false;
        updatePlayButton();
        $loadingText.text('Annulé par l\'utilisateur');
        $loadingSub.text('Vous pouvez réessayer');
        $loadingTimeout.text('✕ Annulation');
    }

    // Arrêter la parole proprement
    function stopSpeaking() {
        try {
            if (synth && (synth.speaking || synth.pending)) {
                synth.cancel();
            }
        } catch(e) {
            console.warn('Erreur stopSpeaking:', e);
        }
        if (currentUtterance) {
            try {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance.onstart = null;
            } catch(e) {}
            currentUtterance = null;
        }
        isSpeaking = false;
        isPlaying = false;
        updatePlayButton();
    }

    // Mettre en pause la parole
    function pauseSpeaking() {
        try {
            if (synth && synth.speaking) {
                synth.pause();
                isPaused = true;
                isPlaying = false;
                setStatus("⏸ Lecture en pause", 'paused');
                updatePlayButton();
            }
        } catch(e) {
            console.warn('Erreur pauseSpeaking:', e);
            stopSpeaking();
        }
    }

    // Reprendre la parole
    function resumeSpeaking() {
        try {
            if (synth && synth.paused) {
                synth.resume();
                isPaused = false;
                isPlaying = true;
                setStatus("🔊 Lecture en cours", 'speaking');
                updatePlayButton();
            } else if (!isSpeaking && !synth.speaking && !synth.pending) {
                speakSlide(currentIndex);
            }
        } catch(e) {
            console.warn('Erreur resumeSpeaking:', e);
            speakSlide(currentIndex);
        }
    }

    function renderSlide(index) {
        const slide = slides[index];
        $title.text(slide.titre);

        let html = '';
        html += `<div class="content-card">${slide.contenu}</div>`;
        if (slide.note) {
            html += `<div class="note-box">${slide.note}</div>`;
        }
        $body.html(html);
        $counter.text(`${index+1} / ${total}`);

        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
        }
    }

    // ================================================================
    // LECTURE VOCALE
    // ================================================================
    function speakSlide(index) {
        return new Promise((resolve) => {
            const slide = slides[index];
            const text = slide.texteParle;
            
            if (!text || text.trim() === '' || !speechSupported) {
                resolve();
                return;
            }

            if (!window.speechSynthesis) {
                setStatus("❌ Synthèse vocale non supportée", 'error');
                speechSupported = false;
                resolve();
                return;
            }

            // Arrêter toute lecture en cours
            stopSpeaking();
            
            // Réinitialiser l'état de pause
            isPaused = false;
            
            showLoading();
            setStatus("Initialisation...", 'loading');

            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.92;
                utterance.pitch = 1.05;
                utterance.volume = 1;

                let isFinished = false;
                let errorHandled = false;

                utterance.onstart = function() {
                    if (loadingCancelled) {
                        stopSpeaking();
                        resolve();
                        return;
                    }
                    hideLoading();
                    isSpeaking = true;
                    isPlaying = true;
                    isPaused = false;
                    setStatus("🔊 Lecture en cours", 'speaking');
                    updatePlayButton();
                };

                utterance.onend = function() {
                    if (isFinished) return;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    setStatus("✅ Terminé", 'idle');
                    hideLoading();
                    updatePlayButton();
                    resolve();
                };

                utterance.onerror = function(e) {
                    if (isFinished || errorHandled) return;
                    errorHandled = true;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    hideLoading();
                    updatePlayButton();
                    
                    if (e.error === 'not-allowed') {
                        setStatus("⚠️ Permission refusée", 'error');
                    } else if (e.error === 'synthesis-unavailable') {
                        setStatus("⚠️ Synthèse indisponible", 'error');
                    } else if (e.error === 'canceled') {
                        setStatus("⏸ Annulé", 'paused');
                    } else {
                        setStatus("❌ Erreur audio: " + (e.error || 'inconnue'), 'error');
                    }
                    
                    resolve();
                };

                // Gestion du chargement des voix
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = function() {
                        if (!loadingCancelled) {
                            try {
                                synth.speak(utterance);
                            } catch(err) {
                                // Silencieux
                            }
                        }
                        synth.onvoiceschanged = null;
                    };
                }

                currentUtterance = utterance;
                
                if (!loadingCancelled) {
                    try {
                        synth.speak(utterance);
                    } catch(err) {
                        setTimeout(() => {
                            if (!loadingCancelled) {
                                try {
                                    synth.speak(utterance);
                                } catch(e) {
                                    setStatus("❌ Erreur de lecture", 'error');
                                    isPlaying = false;
                                    updatePlayButton();
                                    hideLoading();
                                    resolve();
                                }
                            } else {
                                resolve();
                            }
                        }, 100);
                    }
                } else {
                    resolve();
                }

            } catch(err) {
                hideLoading();
                setStatus("❌ Erreur générale", 'error');
                isPlaying = false;
                updatePlayButton();
                console.error('Erreur speakSlide:', err);
                resolve();
            }
        });
    }

    // ================================================================
    // NAVIGATION
    // ================================================================
    async function goToSlide(index) {
        if (isTransitioning) return;
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        
        // Si on est en train de lire, on met en pause avant de naviguer
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        // Arrêter complètement la lecture
        stopSpeaking();
        
        await new Promise(r => setTimeout(r, 50));
        
        if (index === currentIndex) {
            setStatus("📄 Slide actuel", 'idle');
            return;
        }

        isTransitioning = true;
        currentIndex = index;
        renderSlide(index);
        
        // Réinitialiser l'état de lecture
        isPlaying = false;
        updatePlayButton();
        setStatus("⏸ Lecture arrêtée", 'paused');

        await new Promise(r => setTimeout(r, 150));
        isTransitioning = false;
    }

    async function goToNext() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex + 1 < total) {
            await goToSlide(currentIndex + 1);
        } else {
            setStatus("🏁 Dernier slide", 'idle');
        }
    }

    async function goToPrev() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex - 1 >= 0) {
            await goToSlide(currentIndex - 1);
        } else {
            setStatus("🔁 Premier slide", 'idle');
        }
    }

    // ================================================================
    // GESTION PLAY/PAUSE
    // ================================================================
    function togglePlay() {
        if (!userInteracted) {
            userInteracted = true;
        }

        // Si le chargement est en cours, on l'annule
        if (isLoading) {
            cancelLoading();
            return;
        }

        // Si le synthétiseur est en pause, on reprend
        if (synth && synth.paused) {
            resumeSpeaking();
            return;
        }

        // Si la lecture est en cours, on met en pause
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
            return;
        }

        // Sinon, on démarre la lecture du slide courant
        if (!isSpeaking && !isPlaying) {
            stopSpeaking();
            speakSlide(currentIndex);
        }
    }

    // ================================================================
    // INIT
    // ================================================================
    async function init() {
        // Vérifier la compatibilité
        if (!window.speechSynthesis) {
            setStatus("❌ Synthèse vocale non supportée", 'error');
            speechSupported = false;
        }

        // Précharger les voix
        try {
            if (synth.getVoices) {
                synth.getVoices();
                setTimeout(() => {
                    try {
                        synth.getVoices();
                    } catch(e) {}
                }, 200);
            }
        } catch(e) {
            console.warn('Erreur chargement voix:', e);
        }

        // Afficher le premier slide
        renderSlide(0);
        $counter.text(`1 / ${total}`);
        
        // État initial
        setStatus("⏸ Appuie sur Play", 'paused');
        updatePlayButton();
        $autoIndicator.text('⏸ Lecture manuelle');

        // ================================================================
        // ÉVÉNEMENTS
        // ================================================================
        
        // Bouton Play/Pause
        $play.on('click', function() {
            togglePlay();
        });

        // Bouton Annuler le chargement
        $cancelLoading.on('click', function() {
            cancelLoading();
        });

        // Navigation
        $prev.on('click', function() {
            // Si chargement en cours, on annule
            if (isLoading) cancelLoading();
            goToPrev();
        });

        $next.on('click', function() {
            if (isLoading) cancelLoading();
            goToNext();
        });

        // Replay - relire le slide courant
        $replay.on('click', function() {
            if (isLoading) cancelLoading();
            stopSpeaking();
            setTimeout(() => {
                speakSlide(currentIndex);
            }, 100);
        });

        // Support du clavier (espace pour play/pause)
        $(document).on('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });

        // Nettoyage
        $(window).on('beforeunload', function() {
            try {
                if (synth.speaking) synth.cancel();
            } catch(e) {}
            hideLoading();
        });

        // Gérer les cas où la synthèse se termine de manière inattendue
        setInterval(() => {
            if (isPlaying && !synth.speaking && !synth.pending && !isPaused && !isLoading) {
                isPlaying = false;
                updatePlayButton();
                setStatus("⏸ Lecture arrêtée", 'paused');
            }
        }, 1000);
    }

    init();
});



    // ================================================================
    // GESTION DU THÈME JOUR/NUIT
    // ================================================================
    let isDarkMode = false;

    function toggleTheme() {
        isDarkMode = !isDarkMode;
        const body = document.body;
        const appContainer = document.querySelector('.app-container');
        const header = document.querySelector('.slide-header');
        const footer = document.querySelector('.slide-footer');
        const contentCards = document.querySelectorAll('.content-card');
        const noteBoxes = document.querySelectorAll('.note-box');
        const mathBlocks = document.querySelectorAll('.math-block');
        const buttons = document.querySelectorAll('.btn');
        const statusBadge = document.querySelector('.status-badge');
        const slideCounter = document.querySelector('.slide-counter');
        const autoIndicator = document.querySelector('.auto-indicator');
        const themeBtn = document.getElementById('themeToggle');

        if (isDarkMode) {
            // Mode nuit
            body.style.background = '#0b1120';
            body.style.color = '#f1f5f9';
            appContainer.style.background = 'linear-gradient(145deg, #0f172a 0%, #1e293b 100%)';
            header.style.background = 'rgba(15, 23, 42, 0.85)';
            footer.style.background = 'rgba(15, 23, 42, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.05)';
                card.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.08)';
                note.style.color = '#cbd5e1';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.25)';
                block.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#e2e8f0';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.12)';
                statusBadge.style.color = '#93bbfc';
            }
            if (slideCounter) {
                slideCounter.style.color = '#94a3b8';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#64748b';
            }
            if (themeBtn) {
                themeBtn.textContent = '☀️';
                themeBtn.title = 'Passer en mode jour';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#e2e8f0';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#e2e8f0';
                }
            });
        } else {
            // Mode jour (par défaut)
            body.style.background = '#f0f4f8';
            body.style.color = '#1a202c';
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
            header.style.background = 'rgba(255, 255, 255, 0.85)';
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.8)';
                card.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.12)';
                note.style.color = '#2c3e50';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.05)';
                block.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#2d3748';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
                statusBadge.style.color = '#2b6cb0';
            }
            if (slideCounter) {
                slideCounter.style.color = '#4a5568';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#718096';
            }
            if (themeBtn) {
                themeBtn.textContent = '🌓';
                themeBtn.title = 'Passer en mode nuit';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#2c3e50';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#2d3748';
                }
            });
        }
    }

    // Initialiser en mode jour
    document.addEventListener('DOMContentLoaded', function() {
        // Appliquer le mode jour par défaut
        const body = document.body;
        body.style.background = '#f0f4f8';
        body.style.color = '#1a202c';
        
        const appContainer = document.querySelector('.app-container');
        if (appContainer) {

        }

            note.style.color = '#2c3e50';

            block.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.btn').forEach(btn => {

        if (statusBadge) {

            statusBadge.style.color = '#2b6cb0';

        const slideCounter = document.querySelector('.slide-counter');
        if (slideCounter) {

        }
        
        const autoIndicator = document.querySelector('.auto-indicator');
        if (autoIndicator) {
            autoIndicator.style.color = '#718096';
        }
        
        document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
            if (!el.closest('.note-box')) {

            }
        });
        
        document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
