<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Mathématiques",
  "classe": "3ème année",

  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Arithmétique et Nombres rationnels",
      "points": "4 pts",
      "enonce": "Cet exercice porte sur les conversions en base deux, les opérations sur les nombres rationnels et l'écriture scientifique.",
      "questions": [
        {
          "question": "1) Convertir le nombre décimal \( 43_{10} \) en base deux. Détailler les étapes de la division.",
          "reponse": "La conversion de 43 en base 2 s'effectue par divisions euclidiennes successives :<br>43 = 2 × 21 + 1<br>21 = 2 × 10 + 1<br>10 = 2 × 5 + 0<br>5 = 2 × 2 + 1<br>2 = 2 × 1 + 0<br>1 = 2 × 0 + 1<br>En lisant les restes de bas en haut, on obtient \( 43_{10} = 101011_2 \)."
        },
        {
          "question": "2) Effectuer la multiplication suivante en base deux : \( 1101_2 \times 11_2 \). Vérifier le résultat en convertissant en base 10.",
          "reponse": "Effectuons la multiplication :<br>\( \begin{array}{r} 1101 \\ \times 11 \\ \hline 1101 \\ 11010 \\ \hline 100111 \end{array} \)<br>Le résultat est \( 100111_2 \).<br>Vérification : \( 1101_2 = 13_{10} \) et \( 11_2 = 3_{10} \). \( 13 \times 3 = 39_{10} \). Or \( 100111_2 = 1 \times 2^5 + 0 \times 2^4 + 0 \times 2^3 + 1 \times 2^2 + 1 \times 2^1 + 1 \times 2^0 = 32 + 4 + 2 + 1 = 39_{10} \)."
        },
        {
          "question": "3) Calculer et donner le résultat sous la forme d'une fraction irréductible : \( A = \\frac{3}{4} - \\frac{5}{6} \times \\frac{2}{3} \).",
          "reponse": "\( A = \\frac{3}{4} - \\frac{5 \\times 2}{6 \\times 3} = \\frac{3}{4} - \\frac{10}{18} = \\frac{3}{4} - \\frac{5}{9} \).<br>On met au même dénominateur 36 : \( A = \\frac{3 \\times 9}{4 \\times 9} - \\frac{5 \\times 4}{9 \\times 4} = \\frac{27}{36} - \\frac{20}{36} = \\frac{7}{36} \).<br>La fraction est déjà irréductible car 7 et 36 sont premiers entre eux."
        },
        {
          "question": "4) Donner l'écriture scientifique des nombres suivants : \( B = 0,0000451 \) et \( C = 123 \\times 10^{-5} \).",
          "reponse": "L'écriture scientifique est de la forme \( a \\times 10^n \) avec \( 1 \\le a < 10 \).<br>\( B = 0,0000451 = 4,51 \\times 10^{-5} \).<br>\( C = 123 \\times 10^{-5} = 1,23 \\times 10^2 \\times 10^{-5} = 1,23 \\times 10^{-3} \)."
        }
      ]
    },
    {
      "titre": "Exercice 2 : Nombres réels et Calcul algébrique",
      "points": "4 pts",
      "enonce": "Cet exercice vise à maîtriser les calculs sur les radicaux, le développement et la factorisation.",
      "questions": [
        {
          "question": "1) Simplifier les expressions suivantes : \( A = \\sqrt{50} - 3\\sqrt{8} + 2\\sqrt{2} \).",
          "reponse": "\( A = \\sqrt{25 \\times 2} - 3\\sqrt{4 \\times 2} + 2\\sqrt{2} = 5\\sqrt{2} - 3 \\times 2\\sqrt{2} + 2\\sqrt{2} = (5 - 6 + 2)\\sqrt{2} = \\sqrt{2} \)."
        },
        {
          "question": "2) Développer et réduire l'expression : \( B = (3x - 5)^2 - (2x + 1)(2x - 1) \).",
          "reponse": "\( B = (9x^2 - 30x + 25) - (4x^2 - 1) \).<br>\( B = 9x^2 - 30x + 25 - 4x^2 + 1 \).<br>\( B = 5x^2 - 30x + 26 \)."
        },
        {
          "question": "3) Factoriser l'expression \( C = (x - 2)(3x + 1) - (x - 2)(2x + 5) \).",
          "reponse": "Le facteur commun est \( (x - 2) \).<br>\( C = (x - 2)[(3x + 1) - (2x + 5)] = (x - 2)(3x + 1 - 2x - 5) = (x - 2)(x - 4) \)."
        },
        {
          "question": "4) Calculer la valeur de l'expression \( D = 4x^2 - 9 \) pour \( x = -\\frac{3}{2} \).",
          "reponse": "\( D = 4 \\times \\left(-\\frac{3}{2}\\right)^2 - 9 = 4 \\times \\frac{9}{4} - 9 = 9 - 9 = 0 \).<br>\( D = 0 \) pour \( x = -\\frac{3}{2} \)."
        }
      ]
    },
    {
      "titre": "Exercice 3 : Équations, Inéquations et Statistiques",
      "points": "5 pts",
      "enonce": "Dans cet exercice, vous résoudrez des équations et inéquations, puis vous analyserez une série statistique.",
      "questions": [
        {
          "question": "1) Résoudre dans \(\\mathbb{R}\) l'équation : \( 5x - 3 = 2x + 7 \).",
          "reponse": "\( 5x - 2x = 7 + 3 \).<br>\( 3x = 10 \).<br>\( x = \\frac{10}{3} \).<br>La solution est \( S = \\left\\{ \\frac{10}{3} \\right\\} \)."
        },
        {
          "question": "2) Résoudre dans \(\\mathbb{R}\) l'inéquation : \( -2x + 1 \\ge 5 \). Représenter l'ensemble des solutions sur une droite graduée.",
          "reponse": "\( -2x \\ge 5 - 1 \).<br>\( -2x \\ge 4 \).<br>On divise par -2 qui est négatif, donc le sens de l'inégalité change : \( x \\le -2 \).<br>L'ensemble des solutions est \( S = ]-\\infty ; -2] \\)."
        },
        {

        },
        {
          "question": "4) Le tableau ci-dessous donne les notes obtenues par les élèves d'une classe de 3ème lors d'un devoir de mathématiques.<br><br><div style='background-color: #f0f8ff; border-radius: 8px; padding: 10px; color: #333;'><table style='width:100%; border-collapse:collapse;'><tr style='background-color:#add8e6;'><th style='padding:8px; border:1px solid #ccc;'>Note</th><td style='padding:8px; border:1px solid #ccc;'>6</td><td style='padding:8px; border:1px solid #ccc;'>8</td><td style='padding:8px; border:1px solid #ccc;'>10</td><td style='padding:8px; border:1px solid #ccc;'>13</td><td style='padding:8px; border:1px solid #ccc;'>15</td><td style='padding:8px; border:1px solid #ccc;'>18</td></tr><tr style='background-color:#add8e6;'><th style='padding:8px; border:1px solid #ccc;'>Effectif</th><td style='padding:8px; border:1px solid #ccc;'>3</td><td style='padding:8px; border:1px solid #ccc;'>5</td><td style='padding:8px; border:1px solid #ccc;'>8</td><td style='padding:8px; border:1px solid #ccc;'>6</td><td style='padding:8px; border:1px solid #ccc;'>2</td><td style='padding:8px; border:1px solid #ccc;'>1</td></tr></table></div><br>a) Quel est l'effectif total de la classe ?<br>b) Calculer la moyenne arrondie au dixième.<br>c) Déterminer la note médiane de cette série.",

        }
      ]
    },
    {
      "titre": "Exercice 4 : Géométrie - Distances, Triangles et Cercles",

      "questions": [

          "question": "1) Soit un cercle de centre O et un point M extérieur au cercle. Construire les deux tangentes à ce cercle passant par M. Rappeler la propriété des tangentes issues d'un même point.",

        {
          "question": "2) Dans la figure ci-dessous, (d) est la bissectrice de l'angle \( \\widehat{ABC} \). Un point M appartient à la bissectrice. Que peut-on dire des distances de M aux côtés de l'angle ? Justifier.",

        {
          "question": "3) Soit un triangle ABC rectangle en A tel que AB = 6 cm et AC = 8 cm.<br>a) Calculer la longueur BC.<br>b) Calculer la distance du point A à la droite (BC). (On pourra utiliser l'aire du triangle)",

        {

          "reponse": "a) Dans un cercle, la mesure d'un angle au centre est le double de la mesure d'un angle inscrit qui intercepte le même arc.<br>\( \\widehat{AOC} = 2 \\times \\widehat{ABC} = 2 \\times 45° = 90° \).<br>b) Si \( \\widehat{ABC} \) est droit, il intercepte un demi-cercle. Le segment [AC] est donc le diamètre du cercle."
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
