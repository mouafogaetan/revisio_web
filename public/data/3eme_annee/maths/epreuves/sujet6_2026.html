<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "mathématiques",
  "classe": "3ème année",
  "sequence": "Séquence 6",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Nombres réels et radicaux",
      "points": "3 pts",
      "enonce": "<div style='font-size:1.05em; line-height:1.6;'>Les nombres réels et les radicaux sont essentiels pour résoudre des problèmes de mesure et de géométrie.<br><br><strong>1.</strong> Simplifier l'expression suivante : \\(\\sqrt{72} - 2\\sqrt{8} + 3\\sqrt{2}\\).<br><br><strong>2.</strong> Comparer les nombres \\(3\\sqrt{5}\\) et \\(\\sqrt{46}\\).<br><br><strong>3.</strong> Encadrer \\(\\sqrt{11}\\) par deux entiers consécutifs.</div>",
      "questions": [
        {
          "question": "<strong>1)</strong> Simplifier \\(\\sqrt{72} - 2\\sqrt{8} + 3\\sqrt{2}\\).",
          "reponse": "<p>\\(\\sqrt{72} = \\sqrt{36×2} = 6\\sqrt{2}\\)<br>\\(2\\sqrt{8} = 2\\sqrt{4×2} = 2×2\\sqrt{2} = 4\\sqrt{2}\\)</p><p>Donc : \\(6\\sqrt{2} - 4\\sqrt{2} + 3\\sqrt{2} = <span style='font-weight:bold;'>5\\sqrt{2}</span>\\).</p>"
        },
        {
          "question": "<strong>2)</strong> Comparer \\(3\\sqrt{5}\\) et \\(\\sqrt{46}\\).",
          "reponse": "<p>\\((3\\sqrt{5})^2 = 9 × 5 = 45\\)<br>\\((\\sqrt{46})^2 = 46\\)</p><p>Comme 45 < 46, on a <span style='font-weight:bold;'>\\(3\\sqrt{5} < \\sqrt{46}\\)</span>.</p>"
        },
        {
          "question": "<strong>3)</strong> Encadrer \\(\\sqrt{11}\\) par deux entiers consécutifs.",
          "reponse": "<p>3² = 9 < 11 < 16 = 4², donc <span style='font-weight:bold;'>3 < \\(\\sqrt{11}\\) < 4</span>.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Calcul algébrique",
      "points": "3 pts",
      "enonce": "<div style='font-size:1.05em; line-height:1.6;'>Les produits remarquables sont des outils puissants pour transformer des expressions algébriques.<br><br><strong>1.</strong> Développer et réduire : \\((3x - 2)^2 - (x + 1)(x - 3)\\).<br><br><strong>2.</strong> Factoriser l'expression suivante : \\(16x^2 - 24x + 9\\).<br><br><strong>3.</strong> Calculer la valeur numérique de \\(2x^2 - 3x + 5\\) pour \\(x = -1\\).</div>",
      "questions": [
        {
          "question": "<strong>1)</strong> Développer et réduire \\((3x - 2)^2 - (x + 1)(x - 3)\\).",
          "reponse": "<p>\\((3x - 2)^2 = 9x^2 - 12x + 4\\)<br>\\((x + 1)(x - 3) = x^2 - 3x + x - 3 = x^2 - 2x - 3\\)</p><p>Donc : \\(9x^2 - 12x + 4 - (x^2 - 2x - 3) = 9x^2 - 12x + 4 - x^2 + 2x + 3 = <span style='font-weight:bold;'>8x^2 - 10x + 7</span>\\).</p>"
        },
        {
          "question": "<strong>2)</strong> Factoriser \\(16x^2 - 24x + 9\\).",
          "reponse": "<p>On reconnaît un produit remarquable de la forme \\(a^2 - 2ab + b^2\\) avec <span style='font-weight:bold;'>\\(a = 4x\\)</span> et <span style='font-weight:bold;'>\\(b = 3\\)</span>.</p><p><span style='font-weight:bold;'>\\(16x^2 - 24x + 9 = (4x - 3)^2\\)</span>.</p>"
        },
        {
          "question": "<strong>3)</strong> Calculer \\(2x^2 - 3x + 5\\) pour \\(x = -1\\).",
          "reponse": "<p>Pour \\(x = -1\\) : \\(2(-1)^2 - 3(-1) + 5 = 2×1 + 3 + 5 = 2 + 3 + 5 = <span style='font-weight:bold;'>10</span>\\).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Équations et inéquations",
      "points": "3 pts",
      "enonce": "<div style='font-size:1.05em; line-height:1.6;'>La résolution d'équations et d'inéquations permet de modéliser et résoudre des problèmes concrets.<br><br><strong>1.</strong> Résoudre l'équation : \\(5x - 3 = 2x + 9\\).<br><br><strong>2.</strong> Résoudre l'inéquation : \\(3x + 2 \\leq 5x - 4\\). Représenter l'ensemble des solutions sur une droite graduée.<br><br><strong>3.</strong> Un rectangle a une longueur de 12 cm et une largeur de x cm. Son périmètre est de 34 cm. Quelle est la largeur du rectangle ?</div>",
      "questions": [
        {
          "question": "<strong>1)</strong> Résoudre \\(5x - 3 = 2x + 9\\).",
          "reponse": "<p>\\(5x - 3 = 2x + 9\\)<br>\\(5x - 2x = 9 + 3\\)<br>\\(3x = 12\\)<br>\\(x = 4\\)</p><p>La solution est <span style='font-weight:bold;'>\\(x = 4\\)</span>.</p>"
        },
        {
          "question": "<strong>2)</strong> Résoudre \\(3x + 2 \\leq 5x - 4\\).",
          "reponse": "<p>\\(3x + 2 \\leq 5x - 4\\)<br>\\(2 + 4 \\leq 5x - 3x\\)<br>\\(6 \\leq 2x\\)<br>\\(x \\geq 3\\)</p><p>Les solutions sont <span style='font-weight:bold;'>\\([3; +\\infty[\\)</span>.</p>"
        },
        {
          "question": "<strong>3)</strong> Problème du rectangle.",
          "reponse": "<p>Périmètre = 2 × (Longueur + Largeur) = 2 × (12 + x) = 34</p><p>24 + 2x = 34<br>2x = 10<br>x = 5</p><p>La largeur est de <span style='font-weight:bold;'>5 cm</span>.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Géométrie - Angles inscrits et tangentes",
      "points": "4 pts",
      "enonce": "<div style='font-size:1.05em; line-height:1.6;'>Soit un cercle de centre O. On place un point A sur le cercle. La tangente au cercle en A coupe la droite (OB) en T, où B est un point du cercle.<br><br><strong>1.</strong> Construire la tangente au cercle en A.<br><br><strong>2.</strong> Démontrer que \\((OA) \\perp (AT)\\).<br><br><strong>3.</strong> Si \\(\\widehat{AOB} = 60^\\circ\\), déterminer la mesure de l'angle \\(\\widehat{ATB}\\).</div>",
      "questions": [
        {
          "question": "<strong>1)</strong> Construire la tangente au cercle en A.",
          "reponse": "<p>Pour construire la tangente en A :</p><ol><li>Tracer le rayon OA.</li><li>Construire la perpendiculaire à OA passant par A.</li><li>Cette perpendiculaire est la tangente au cercle en A.</li></ol>"
        },
        {
          "question": "<strong>2)</strong> Démontrer que \\((OA) \\perp (AT)\\).",
          "reponse": "<p>Par définition, la tangente à un cercle en un point A est perpendiculaire au rayon OA passant par ce point.</p><p>Donc <span style='font-weight:bold;'>\\((OA) \\perp (AT)\\)</span>.</p>"
        },
        {
          "question": "<strong>3)</strong> Si \\(\\widehat{AOB} = 60^\\circ\\), déterminer \\(\\widehat{ATB}\\).",
          "reponse": "<p>Dans le triangle OAT rectangle en A, on a :</p><p>\\(\\widehat{AOT} = \\widehat{AOB} = 60^\\circ\\) (car T, O, B sont alignés).</p><p>La somme des angles d'un triangle est 180°.</p><p>\\(\\widehat{ATB} = 180 - 90 - 60 = <span style='font-weight:bold;'>30°</span>.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 5 : Statistiques",
      "points": "4 pts",
      "enonce": "<div style='font-size:1.05em; line-height:1.6;'>Les statistiques permettent d'organiser, de représenter et d'interpréter des données.<br><br>Voici les notes obtenues par une classe de 3ème lors d'un contrôle de mathématiques :<br><br><div style='text-align:center;background:#f5f5f5;padding:10px;border-radius:5px;font-size:1.1em;'>6 - 8 - 10 - 12 - 14 - 7 - 9 - 11 - 13 - 15 - 8 - 10 - 12 - 14 - 16 - 9 - 11 - 13 - 15 - 17</div><br><strong>1.</strong> Calculer la moyenne de cette série.<br><br><strong>2.</strong> Déterminer la médiane de cette série.<br><br><strong>3.</strong> Calculer l'étendue de la série.<br><br><strong>4.</strong> Construire un diagramme en bâtons pour représenter cette série.</div>",
      "questions": [
        {
          "question": "<strong>1)</strong> Calculer la moyenne.",
          "reponse": "<p>Somme des notes = 6+8+10+12+14+7+9+11+13+15+8+10+12+14+16+9+11+13+15+17 = 230</p><p>Effectif total = 20</p><p>Moyenne = 230 ÷ 20 = <span style='font-weight:bold;'>11,5</span>.</p>"
        },
        {
          "question": "<strong>2)</strong> Déterminer la médiane.",
          "reponse": "<p>On range les notes dans l'ordre croissant :<br>6 - 7 - 8 - 8 - 9 - 9 - 10 - 10 - 11 - 11 - 12 - 12 - 13 - 13 - 14 - 14 - 15 - 15 - 16 - 17</p><p>L'effectif est 20 (pair). La médiane est la moyenne des 10ème et 11ème valeurs.</p><p>(11 + 12) ÷ 2 = 11,5</p><p>Médiane = <span style='font-weight:bold;'>11,5</span>.</p>"
        },
        {
          "question": "<strong>3)</strong> Calculer l'étendue.",
          "reponse": "<p>Étendue = Valeur maximale - Valeur minimale = 17 - 6 = <span style='font-weight:bold;'>11</span>.</p>"
        },
        {
          "question": "<strong>4)</strong> Construire un diagramme en bâtons.",
          "reponse": "<p>On regroupe les notes par valeur :<br>6:1, 7:1, 8:2, 9:2, 10:2, 11:2, 12:2, 13:2, 14:2, 15:2, 16:1, 17:1</p><p>On trace les bâtons avec les notes en abscisse et les effectifs en ordonnée.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 6 : Solide - Cône de révolution",
      "points": "3 pts",
      "enonce": "<div style='font-size:1.05em; line-height:1.6;'>Un cône de révolution a pour rayon 4 cm et pour hauteur 6 cm.<br><br><strong>1.</strong> Calculer la longueur de la génératrice du cône.<br><br><strong>2.</strong> Calculer l'aire latérale du cône (arrondie au cm² près).<br><br><strong>3.</strong> Calculer le volume du cône (arrondi au cm³ près).</div>",
      "questions": [
        {
          "question": "<strong>1)</strong> Calculer la génératrice \\(g\\).",
          "reponse": "<p>D'après la relation \\(g^2 = R^2 + h^2\\) :<br>\\(g^2 = 4^2 + 6^2 = 16 + 36 = 52\\)<br>\\(g = \\sqrt{52} = 2\\sqrt{13} \\approx <span style='font-weight:bold;'>7,21</span> cm.</p>"
        },
        {
          "question": "<strong>2)</strong> Calculer l'aire latérale.",
          "reponse": "<p>\\(A_L = \\pi \\times R \\times g = \\pi \\times 4 \\times 2\\sqrt{13} = 8\\pi\\sqrt{13} \\approx 3,14 \\times 8 \\times 3,61 \\approx <span style='font-weight:bold;'>91</span> cm².</p>"
        },
        {
          "question": "<strong>3)</strong> Calculer le volume du cône.",
          "reponse": "<p>\\(V = \\dfrac{1}{3} \\times \\pi \\times R^2 \\times h = \\dfrac{1}{3} \\times \\pi \\times 4^2 \\times 6 = \\dfrac{1}{3} \\times \\pi \\times 16 \\times 6 = 32\\pi \\approx <span style='font-weight:bold;'>101</span> cm³.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 7 : Projection et partage de segments",
      "points": "4 pts",
      "enonce": "<div style='font-size:1.05em; line-height:1.6;'>La projection et le partage de segments permettent de réaliser des constructions géométriques précises.<br><br><strong>1.</strong> Expliquer comment projeter orthogonalement un point M sur une droite (d).<br><br><strong>2.</strong> Rédiger un programme de construction pour partager un segment [AB] en 3 parties égales.<br><br><strong>3.</strong> Si I est le milieu de [AB] et on projette A, I et B sur une droite (d), que peut-on dire du projeté de I par rapport aux projetés de A et B ?</div>",
      "questions": [
        {
          "question": "<strong>1)</strong> Projeter orthogonalement un point M sur une droite (d).",
          "reponse": "<p><strong>Méthode :</strong></p><ol><li>Placer l'équerre sur la droite (d).</li><li>Faire glisser l'équerre jusqu'à ce qu'elle passe par le point M.</li><li>Tracer la perpendiculaire à (d) passant par M.</li><li>Le point d'intersection H de cette perpendiculaire avec (d) est le projeté orthogonal de M sur (d).</li></ol>"
        },
        {
          "question": "<strong>2)</strong> Partager un segment [AB] en 3 parties égales.",
          "reponse": "<p><strong>Programme de construction :</strong></p><ol><li>Tracer le segment [AB].</li><li>Tracer une demi-droite [Ax) quelconque.</li><li>Placer 3 points A1, A2, A3 sur [Ax) tels que AA1 = A1A2 = A2A3.</li><li>Tracer la droite (A3B).</li><li>Tracer les droites parallèles à (A3B) passant par A1 et A2.</li><li>Ces parallèles coupent [AB] en B1 et B2.</li><li>Les points B1 et B2 partagent [AB] en 3 parties égales.</li></ol>"
        },
        {
          "question": "<strong>3)</strong> Projeté du milieu d'un segment.",
          "reponse": "<p>La projection conserve le milieu. Si I est le milieu de [AB] et A', I', B' sont les projetés de A, I, B sur (d), alors I' est le milieu de [A'B'].</p><p><span style='font-weight:bold;'>Le projeté du milieu est le milieu des projetés.</span></p>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
