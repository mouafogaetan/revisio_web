<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Mathématiques",
  "classe": "3ème année",
  "sequence": "Évaluation Séquentielle n°5",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Arithmétique et nombres rationnels",
      "points": "4 pts",
      "enonce": "Cet exercice évalue vos compétences en conversion binaire et en calcul sur les nombres rationnels.",
      "questions": [
        {
          "question": "1) Convertir le nombre décimal \( 57_{10} \) en base deux. Justifier en détaillant les divisions successives.",
          "reponse": "57 = 2 × 28 + 1<br>28 = 2 × 14 + 0<br>14 = 2 × 7 + 0<br>7 = 2 × 3 + 1<br>3 = 2 × 1 + 1<br>1 = 2 × 0 + 1<br>La lecture des restes de bas en haut donne : \( 57_{10} = 111001_2 \)."
        },
        {
          "question": "2) Calculer \( A = \\frac{2}{3} + \\frac{5}{4} \\times \\frac{2}{7} \). Donner le résultat sous forme de fraction irréductible.",
          "reponse": "\( A = \\frac{2}{3} + \\frac{5 \\times 2}{4 \\times 7} = \\frac{2}{3} + \\frac{10}{28} = \\frac{2}{3} + \\frac{5}{14} \).<br>Le dénominateur commun est 42 : \( A = \\frac{2 \\times 14}{3 \\times 14} + \\frac{5 \\times 3}{14 \\times 3} = \\frac{28}{42} + \\frac{15}{42} = \\frac{43}{42} \).<br>La fraction \( \\frac{43}{42} \) est irréductible car 43 et 42 sont premiers entre eux."
        },
        {
          "question": "3) Donner l'écriture scientifique des nombres \( B = 0,00032 \) et \( C = 450 \\times 10^{-4} \).",
          "reponse": "L'écriture scientifique est de la forme \( a \\times 10^n \) avec \( 1 \\le a < 10 \).<br>\( B = 3,2 \\times 10^{-4} \).<br>\( C = 4,5 \\times 10^2 \\times 10^{-4} = 4,5 \\times 10^{-2} \)."
        }
      ]
    },
    {
      "titre": "Exercice 2 : Calcul algébrique et nombres réels",
      "points": "4 pts",
      "enonce": "Cet exercice porte sur les identités remarquables, la factorisation et les calculs sur les radicaux.",
      "questions": [
        {
          "question": "1) Développer et réduire l'expression : \( A = (2x + 3)^2 - (x - 1)(x + 1) \).",
          "reponse": "\( A = (4x^2 + 12x + 9) - (x^2 - 1) \).<br>\( A = 4x^2 + 12x + 9 - x^2 + 1 \).<br>\( A = 3x^2 + 12x + 10 \)."
        },
        {
          "question": "2) Factoriser l'expression \( B = 9x^2 - 12x + 4 \).",
          "reponse": "On reconnaît une identité remarquable de la forme \( a^2 - 2ab + b^2 = (a - b)^2 \).<br>\( B = (3x)^2 - 2 \\times 3x \\times 2 + 2^2 = (3x - 2)^2 \)."
        },
        {
          "question": "3) Simplifier les expressions suivantes : <br>a) \( C = \\sqrt{12} + \\sqrt{27} - 3\\sqrt{3} \)<br>b) \( D = (\\sqrt{3} - 2)(\\sqrt{3} + 2) \)",
          "reponse": "a) \( C = \\sqrt{4 \\times 3} + \\sqrt{9 \\times 3} - 3\\sqrt{3} = 2\\sqrt{3} + 3\\sqrt{3} - 3\\sqrt{3} = 2\\sqrt{3} \).<br>b) \( D = (\\sqrt{3})^2 - 2^2 = 3 - 4 = -1 \)."
        }
      ]
    },
    {
      "titre": "Exercice 3 : Équations, inéquations et statistiques",
      "points": "5 pts",
      "enonce": "Cet exercice est une application des compétences en résolution d'équations et en traitement de données statistiques.",
      "questions": [
        {
          "question": "1) Résoudre l'équation \( 3x - 7 = 2x + 5 \) dans \( \\mathbb{R} \).",
          "reponse": "\( 3x - 2x = 5 + 7 \).<br>\( x = 12 \).<br>L'ensemble des solutions est \( S = \\{12\\} \)."
        },
        {
          "question": "2) Résoudre l'inéquation \( -4x + 3 \\le 11 \) et représenter l'ensemble des solutions sur une droite graduée.",
          "reponse": "\( -4x \\le 11 - 3 \).<br>\( -4x \\le 8 \).<br>En divisant par -4 (nombre négatif), le sens de l'inégalité change : \( x \\ge -2 \).<br>\( S = [-2 ; +\\infty[ \)."
        },
        {
          "question": "3) Un problème concret : Un père a 45 ans, son fils 15 ans. Dans combien d'années l'âge du père sera-t-il le double de l'âge du fils ?",
          "reponse": "Soit \( x \) le nombre d'années cherché.<br>\( 45 + x = 2(15 + x) \).<br>\( 45 + x = 30 + 2x \).<br>\( 45 - 30 = 2x - x \).<br>\( 15 = x \).<br>Dans 15 ans, l'âge du père sera le double de celui du fils."
        },
        {
          "question": "4) On a relevé les notes de 20 élèves lors d'un devoir.<br><br><div style='background-color: #f8f9fa; border-radius: 8px; padding: 10px; color: #333;'><table style='width:100%; border-collapse:collapse;'><tr style='background-color:#e9ecef;'><th style='padding:8px; border:1px solid #ccc;'>Note</th><td style='padding:8px; border:1px solid #ccc;'>5</td><td style='padding:8px; border:1px solid #ccc;'>8</td><td style='padding:8px; border:1px solid #ccc;'>10</td><td style='padding:8px; border:1px solid #ccc;'>12</td><td style='padding:8px; border:1px solid #ccc;'>15</td></tr><tr style='background-color:#e9ecef;'><th style='padding:8px; border:1px solid #ccc;'>Effectif</th><td style='padding:8px; border:1px solid #ccc;'>2</td><td style='padding:8px; border:1px solid #ccc;'>4</td><td style='padding:8px; border:1px solid #ccc;'>6</td><td style='padding:8px; border:1px solid #ccc;'>5</td><td style='padding:8px; border:1px solid #ccc;'>3</td></tr></table></div><br>a) Calculer l'effectif total.<br>b) Calculer la moyenne de la série.<br>c) Déterminer la note médiane.",
          "reponse": "a) Effectif total : \( 2+4+6+5+3 = 20 \).<br>b) Moyenne : \( \\bar{x} = \\frac{2\\times5 + 4\\times8 + 6\\times10 + 5\\times12 + 3\\times15}{20} = \\frac{10 + 32 + 60 + 60 + 45}{20} = \\frac{207}{20} = 10,35 \).<br>c) La médiane est la moyenne de la 10e et 11e valeur. Les effectifs cumulés sont : 2; 6; 12; 17; 20. La 10e et 11e note se trouvent dans la classe de note 10. La médiane est donc 10."
        }
      ]
    },
    {
      "titre": "Exercice 4 : Géométrie - Distances, triangles et cercles",
      "points": "7 pts",
      "enonce": "Cet exercice mobilise les propriétés de la bissectrice, le théorème de Pythagore et les configurations circulaires.",
      "questions": [
        {
          "question": "1) Soit un point M appartenant à la bissectrice de l'angle \( \\widehat{ABC} \). Que peut-on dire des distances du point M aux droites (BA) et (BC) ? Justifier en citant la propriété.",
          "reponse": "Les distances du point M aux droites (BA) et (BC) sont égales.<br>Propriété : La bissectrice d'un angle est l'ensemble des points équidistants des côtés de l'angle. [citation:1]"
        },
        {
          "question": "2) Un triangle ABC est rectangle en A, avec AB = 5 cm et AC = 12 cm.<br>a) Calculer BC.<br>b) Calculer la distance du point A à la droite (BC).",
          "reponse": "a) D'après le théorème de Pythagore : \( BC^2 = AB^2 + AC^2 = 25 + 144 = 169 \\). Donc \( BC = 13 \) cm.<br>b) Soit H le pied de la hauteur issue de A. L'aire de ABC est \( \\frac{AB \\times AC}{2} = \\frac{5 \\times 12}{2} = 30 \\, cm^2 \).<br>Cette aire est aussi \( \\frac{BC \\times AH}{2} = \\frac{13 \\times AH}{2} \).<br>\( \\frac{13 \\times AH}{2} = 30 \\Rightarrow 13 \\times AH = 60 \\Rightarrow AH = \\frac{60}{13} \\approx 4,6 \\, cm \)."
        },
        {
          "question": "3) Sur un cercle, l'angle au centre \( \\widehat{AOC} \) mesure 80°. Quelle est la mesure d'un angle inscrit \( \\widehat{ABC} \) qui intercepte le même arc \( \\widehat{AC} \) ?",
          "reponse": "Un angle inscrit mesure la moitié de l'angle au centre qui intercepte le même arc.<br>\( \\widehat{ABC} = \\frac{\\widehat{AOC}}{2} = \\frac{80°}{2} = 40° \). [citation:1]"
        },
        {
          "question": "4) Soit un point M extérieur à un cercle de centre O. Décrire la méthode de construction des tangentes au cercle passant par M.",
          "reponse": "1. Tracer le segment [OM].<br>2. Placer le point I, milieu de [OM].<br>3. Tracer le cercle de centre I et de rayon IO.<br>4. Ce cercle coupe le premier en deux points T1 et T2.<br>5. Les droites (MT1) et (MT2) sont les tangentes cherchées."
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
