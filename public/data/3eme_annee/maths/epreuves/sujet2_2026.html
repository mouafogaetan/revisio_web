<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "mathématiques",
  "classe": "3ème année",
  "sequence": "Séquence 2",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Arithmétique binaire",
      "points": "3 pts",
      "enonce": "<div style='font-size:1.05em; line-height:1.6;'><p>L'arithmétique binaire est fondamentale en informatique. Un ordinateur ne comprend que deux états : 0 et 1, qui correspondent aux chiffres du système binaire.</p><p><strong>1.</strong> Convertir le nombre décimal <span style='font-weight:bold;'>25</span> en base 2.</p><p><strong>2.</strong> Convertir le nombre binaire <span style='font-weight:bold;'>11011</span> en base 10.</p><p><strong>3.</strong> Effectuer l'addition binaire suivante : <span style='font-weight:bold;'>1011 + 110</span>.</p></div>",
      "questions": [
        {
          "question": "<p><strong>1)</strong> Convertir le nombre décimal <span style='font-weight:bold;'>25</span> en base 2.</p>",
          "reponse": "<p>25 en base 2 s'écrit <span style='font-weight:bold;'>11001</span>.</p><p><strong>Explication :</strong></p><p>25 ÷ 2 = 12 reste 1<br>12 ÷ 2 = 6 reste 0<br>6 ÷ 2 = 3 reste 0<br>3 ÷ 2 = 1 reste 1<br>1 ÷ 2 = 0 reste 1<br>En lisant les restes de bas en haut : 11001.</p>"
        },
        {
          "question": "<p><strong>2)</strong> Convertir le nombre binaire <span style='font-weight:bold;'>11011</span> en base 10.</p>",
          "reponse": "<p>11011₂ = 1×2⁴ + 1×2³ + 0×2² + 1×2¹ + 1×2⁰ = 16 + 8 + 0 + 2 + 1 = <span style='font-weight:bold;'>27</span>.</p>"
        },
        {
          "question": "<p><strong>3)</strong> Effectuer l'addition binaire suivante : <span style='font-weight:bold;'>1011 + 110</span>.</p>",
          "reponse": "<p><div style='font-family:monospace;font-size:1.1em;background:#f5f5f5;padding:10px;border-radius:5px;'> 1011<br>+ 0110 (on complète à 4 bits)<br>─────<br>10001</div></p><p>Le résultat est <span style='font-weight:bold;'>10001</span>₂.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Opérations sur les nombres rationnels",
      "points": "3 pts",
      "enonce": "<div style='font-size:1.05em; line-height:1.6;'><p>La maîtrise des opérations sur les nombres rationnels est essentielle pour résoudre des problèmes scientifiques.</p><p><strong>1.</strong> Calculer et donner le résultat sous forme de fraction irréductible : \\(\\dfrac{3}{4} + \\dfrac{5}{6}\\).</p><p><strong>2.</strong> Écrire le nombre décimal 0,00045 en notation scientifique.</p><p><strong>3.</strong> Effectuer le produit suivant et donner le résultat en notation scientifique : \\((2,5 \\times 10^4) \\times (3 \\times 10^{-2})\\).</p></div>",
      "questions": [
        {
          "question": "<p><strong>1)</strong> Calculer \\(\\dfrac{3}{4} + \\dfrac{5}{6}\\).</p>",
          "reponse": "<p>\\dfrac{3}{4} + \\dfrac{5}{6} = \\dfrac{9}{12} + \\dfrac{10}{12} = \\dfrac{19}{12}.</p><p>La fraction est déjà irréductible car 19 est premier et ne divise pas 12.</p>"
        },
        {
          "question": "<p><strong>2)</strong> Écrire 0,00045 en notation scientifique.</p>",
          "reponse": "<p>0,00045 = <span style='font-weight:bold;'>4,5 × 10⁻⁴</span>.</p>"
        },
        {
          "question": "<p><strong>3)</strong> Calculer \\((2,5 \\times 10^4) \\times (3 \\times 10^{-2})\\) en notation scientifique.</p>",
          "reponse": "<p>(2,5 × 10⁴) × (3 × 10⁻²) = (2,5 × 3) × 10⁴⁻² = 7,5 × 10².</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Nombres réels et radicaux",
      "points": "4 pts",
      "enonce": "<div style='font-size:1.05em; line-height:1.6;'><p>Les nombres réels et les radicaux permettent de résoudre des problèmes de mesure et de géométrie.</p><p><strong>1.</strong> Simplifier l'expression suivante : \\(\\sqrt{50} - 3\\sqrt{2} + 2\\sqrt{8}\\).</p><p><strong>2.</strong> Comparer les nombres \\(2\\sqrt{3}\\) et \\(\\sqrt{13}\\).</p><p><strong>3.</strong> Encadrer \\(\\sqrt{7}\\) par deux entiers consécutifs.</p></div>",
      "questions": [
        {
          "question": "<p><strong>1)</strong> Simplifier \\(\\sqrt{50} - 3\\sqrt{2} + 2\\sqrt{8}\\).</p>",
          "reponse": "<p>\\(\\sqrt{50} = \\sqrt{25×2} = 5\\sqrt{2}\\)<br>\\(2\\sqrt{8} = 2\\sqrt{4×2} = 2×2\\sqrt{2} = 4\\sqrt{2}\\)</p><p>Donc : \\(5\\sqrt{2} - 3\\sqrt{2} + 4\\sqrt{2} = <span style='font-weight:bold;'>6\\sqrt{2}</span>\\).</p>"
        },
        {
          "question": "<p><strong>2)</strong> Comparer \\(2\\sqrt{3}\\) et \\(\\sqrt{13}\\).</p>",
          "reponse": "<p>\\((2\\sqrt{3})^2 = 4 × 3 = 12\\)<br>\\((\\sqrt{13})^2 = 13\\)</p><p>Comme 12 < 13 et que la fonction carrée est croissante sur les positifs, on a : <span style='font-weight:bold;'>\\(2\\sqrt{3} < \\sqrt{13}\\)</span>.</p>"
        },
        {
          "question": "<p><strong>3)</strong> Encadrer \\(\\sqrt{7}\\) par deux entiers consécutifs.</p>",
          "reponse": "<p>2² = 4 < 7 < 9 = 3², donc <span style='font-weight:bold;'>2 < \\(\\sqrt{7}\\) < 3</span>.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Calcul algébrique",
      "points": "4 pts",
      "enonce": "<div style='font-size:1.05em; line-height:1.6;'><p>Les produits remarquables sont des outils puissants pour transformer des expressions algébriques.</p><p><strong>1.</strong> Développer et réduire : \\((2x + 3)^2 - (x - 1)(x + 2)\\).</p><p><strong>2.</strong> Factoriser l'expression suivante : \\(9x^2 - 12x + 4\\).</p><p><strong>3.</strong> Calculer la valeur numérique de \\(3x^2 - 2x + 1\\) pour \\(x = -2\\).</p></div>",
      "questions": [
        {
          "question": "<p><strong>1)</strong> Développer et réduire \\((2x + 3)^2 - (x - 1)(x + 2)\\).</p>",
          "reponse": "<p>\\((2x + 3)^2 = 4x^2 + 12x + 9\\)<br>\\((x - 1)(x + 2) = x^2 + 2x - x - 2 = x^2 + x - 2\\)</p><p>Donc : \\(4x^2 + 12x + 9 - (x^2 + x - 2) = 4x^2 + 12x + 9 - x^2 - x + 2 = <span style='font-weight:bold;'>3x^2 + 11x + 11</span>\\).</p>"
        },
        {
          "question": "<p><strong>2)</strong> Factoriser \\(9x^2 - 12x + 4\\).</p>",
          "reponse": "<p>On reconnaît un produit remarquable de la forme \\(a^2 - 2ab + b^2\\) avec <span style='font-weight:bold;'>\\(a = 3x\\)</span> et <span style='font-weight:bold;'>\\(b = 2\\)</span>.</p><p><span style='font-weight:bold;'>\\(9x^2 - 12x + 4 = (3x - 2)^2\\)</span>.</p>"
        },
        {
          "question": "<p><strong>3)</strong> Calculer \\(3x^2 - 2x + 1\\) pour \\(x = -2\\).</p>",
          "reponse": "<p>Pour \\(x = -2\\) : \\(3(-2)^2 - 2(-2) + 1 = 3×4 + 4 + 1 = 12 + 4 + 1 = <span style='font-weight:bold;'>17</span>\\).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 5 : Équations et inéquations",
      "points": "3 pts",
      "enonce": "<div style='font-size:1.05em; line-height:1.6;'><p>La résolution d'équations et d'inéquations permet de modéliser et résoudre des problèmes concrets.</p><p><strong>1.</strong> Résoudre l'équation : \\(3x - 5 = 2x + 7\\).</p><p><strong>2.</strong> Résoudre l'inéquation : \\(2x + 3 \\leq 4x - 1\\). Représenter l'ensemble des solutions sur une droite graduée.</p><p><strong>3.</strong> Un professeur partage 36 livres entre ses élèves. Chaque élève reçoit 2 livres et il reste 4 livres. Combien y a-t-il d'élèves ?</p></div>",
      "questions": [
        {
          "question": "<p><strong>1)</strong> Résoudre \\(3x - 5 = 2x + 7\\).</p>",
          "reponse": "<p>\\(3x - 5 = 2x + 7\\)<br>\\(3x - 2x = 7 + 5\\)<br>\\(x = 12\\)</p><p>La solution est <span style='font-weight:bold;'>\\(x = 12\\)</span>.</p>"
        },
        {
          "question": "<p><strong>2)</strong> Résoudre \\(2x + 3 \\leq 4x - 1\\).</p>",
          "reponse": "<p>\\(2x + 3 \\leq 4x - 1\\)<br>\\(3 + 1 \\leq 4x - 2x\\)<br>\\(4 \\leq 2x\\)<br>\\(x \\geq 2\\)</p><p>Les solutions sont <span style='font-weight:bold;'>\\([2; +\\infty[\\)</span>.</p>"
        },
        {
          "question": "<p><strong>3)</strong> Problème : 36 livres, 2 par élève, reste 4.</p>",
          "reponse": "<p>Soit \\(n\\) le nombre d'élèves.</p><p>On a l'équation : \\(2n + 4 = 36\\)<br>\\(2n = 32\\)<br>\\(n = 16\\)</p><p>Il y a <span style='font-weight:bold;'>16 élèves</span>.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 6 : Géométrie - Pythagore et trigonométrie",
      "points": "3 pts",
      "enonce": "<div style='font-size:1.05em; line-height:1.6;'><p>Dans un triangle rectangle, le théorème de Pythagore et les relations trigonométriques permettent de calculer des longueurs et des angles.</p><p>Soit un triangle <span style='font-weight:bold;'>ABC</span> rectangle en A, avec AB = 5 cm et AC = 12 cm.</p><p><strong>1.</strong> Calculer la longueur BC.</p><p><strong>2.</strong> Calculer la mesure de l'angle \\(\\widehat{ABC}\\) arrondie au degré.</p><p><strong>3.</strong> Calculer la distance du point A à la droite (BC).</p></div>",
      "questions": [
        {
          "question": "<p><strong>1)</strong> Calculer BC.</p>",
          "reponse": "<p>D'après le théorème de Pythagore :<br>\\(BC^2 = AB^2 + AC^2 = 5^2 + 12^2 = 25 + 144 = 169\\)<br>\\(BC = \\sqrt{169} = <span style='font-weight:bold;'>13</span> cm.</p>"
        },
        {
          "question": "<p><strong>2)</strong> Calculer \\(\\widehat{ABC}\\) au degré près.</p>",
          "reponse": "<p>Dans le triangle ABC rectangle en A, on a :<br>\\(\\tan(\\widehat{ABC}) = \\dfrac{AC}{AB} = \\dfrac{12}{5} = 2,4\\)<br>\\(\\widehat{ABC} = \\tan^{-1}(2,4) \\approx <span style='font-weight:bold;'>67°</span>.</p>"
        },
        {
          "question": "<p><strong>3)</strong> Calculer la distance de A à (BC).</p>",

          "reponse": "<p>\\(V = \\dfrac{1}{3} \\times \\pi \\times R^2 \\times h = \\dfrac{1}{3} \\times \\pi \\times 3^2 \\times 8 = \\dfrac{1}{3} \\times \\pi \\times 9 \\times 8 = 24\\pi \\approx <span style='font-weight:bold;'>75</span> cm³.</p>"

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
