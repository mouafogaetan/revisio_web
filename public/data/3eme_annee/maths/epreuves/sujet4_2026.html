<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
 "matiere": "mathématiques",
 "classe": "3ème année",
 "sequence": "Séquence 4",
 "anneeScolaire": "2025-2026",
 "exercices": [
   {
     "titre": "Exercice 1 : Vecteurs et parallélogramme",
     "points": "3 pts",
     "enonce": "<div style='font-size:1.05em; line-height:1.6;'>Soit un quadrilatère ABCD tel que \\(\\overrightarrow{AB} = \\overrightarrow{DC}\\).<br><br><strong>1.</strong> Démontrer que ABCD est un parallélogramme.<br><br><strong>2.</strong> Justifier que les diagonales [AC] et [BD] se coupent en leur milieu.<br><br><strong>3.</strong> Si \\(\\overrightarrow{AB} = \\overrightarrow{DC}\\) et \\(AB = 5\\) cm, quelle est la longueur de DC ?</div>",
     "questions": [
       {
         "question": "<strong>1)</strong> Démontrer que ABCD est un parallélogramme.",
         "reponse": "L'égalité vectorielle \\(\\overrightarrow{AB} = \\overrightarrow{DC}\\) signifie que les côtés [AB] et [DC] sont parallèles, de même direction et de même longueur. Un quadrilatère qui a ses côtés opposés parallèles et égaux est un parallélogramme. Donc ABCD est un parallélogramme."
       },
       {
         "question": "<strong>2)</strong> Justifier que les diagonales [AC] et [BD] se coupent en leur milieu.",
         "reponse": "Dans un parallélogramme, les diagonales se coupent en leur milieu. Cette propriété est une conséquence directe de la définition du parallélogramme. Donc les diagonales [AC] et [BD] se coupent en leur milieu."
       },
       {
         "question": "<strong>3)</strong> Si AB = 5 cm, quelle est la longueur de DC ?",
         "reponse": "Puisque \\(\\overrightarrow{AB} = \\overrightarrow{DC}\\), les vecteurs sont égaux donc ils ont la même norme. Ainsi, AB = DC = 5 cm."
       }
     ]
   },
   {
     "titre": "Exercice 2 : Repérage dans le plan",
     "points": "4 pts",
     "enonce": "<div style='font-size:1.05em; line-height:1.6;'>On considère un repère orthonormé \\((O; I, J)\\).<br><br><strong>1.</strong> Placer les points suivants : A(2; 3), B(-1; 4), C(-2; -3) et D(4; -1).<br><br><strong>2.</strong> Donner les coordonnées du milieu du segment [AB].<br><br><strong>3.</strong> Calculer la distance AB.<br><br><strong>4.</strong> Le triangle ABC est-il rectangle ? Justifier.</div>",
     "questions": [
       {
         "question": "<strong>1)</strong> Placer les points A(2;3), B(-1;4), C(-2;-3) et D(4;-1).",
         "reponse": "Construction dans le repère orthonormé."
       },
       {
         "question": "<strong>2)</strong> Donner les coordonnées du milieu de [AB].",
         "reponse": "Le milieu M de [AB] a pour coordonnées : M\\(\\left(\\dfrac{2 + (-1)}{2}; \\dfrac{3 + 4}{2}\\right) = \\left(\\dfrac{1}{2}; \\dfrac{7}{2}\\right)\\)."
       },
       {
         "question": "<strong>3)</strong> Calculer la distance AB.",
         "reponse": "AB = \\(\\sqrt{(x_B - x_A)^2 + (y_B - y_A)^2} = \\sqrt{(-1 - 2)^2 + (4 - 3)^2} = \\sqrt{(-3)^2 + 1^2} = \\sqrt{9 + 1} = \\sqrt{10}\\)."
       },
       {
         "question": "<strong>4)</strong> Le triangle ABC est-il rectangle ?",
         "reponse": "AB² = 10, AC² = (-2-2)² + (-3-3)² = 16 + 36 = 52, BC² = (-2+1)² + (-3-4)² = 1 + 49 = 50. On n'a pas AB² + BC² = AC² (10+50=60 ≠ 52), donc le triangle n'est pas rectangle en B. AB² + AC² = 10+52=62 ≠ 50, donc pas rectangle en A. AC² + BC² = 52+50=102 ≠ 10, donc pas rectangle en C. Le triangle ABC n'est pas rectangle."
       }
     ]
   },
   {
     "titre": "Exercice 3 : Solides - Pyramide",
     "points": "3 pts",
     "enonce": "<div style='font-size:1.05em; line-height:1.6;'>Une pyramide régulière a pour base un carré de côté 6 cm et pour hauteur 4 cm.<br><br><strong>1.</strong> Calculer le volume de cette pyramide.<br><br><strong>2.</strong> Calculer l'aire latérale de la pyramide (on donnera la valeur arrondie au cm² près).<br><br><strong>3.</strong> Tracer le patron de cette pyramide.</div>",
     "questions": [
       {
         "question": "<strong>1)</strong> Calculer le volume de la pyramide.",
         "reponse": "V = \\(\\dfrac{1}{3} \\times \\text{Aire de la base} \\times \\text{hauteur} = \\dfrac{1}{3} \\times 6^2 \\times 4 = \\dfrac{1}{3} \\times 36 \\times 4 = 48\\) cm³."
       },
       {
         "question": "<strong>2)</strong> Calculer l'aire latérale de la pyramide.",
         "reponse": "La pyramide étant régulière, ses faces latérales sont des triangles isocèles. L'apothème \\(a\\) vérifie : \\(a^2 = h^2 + (\\dfrac{c}{2})^2 = 4^2 + 3^2 = 16+9=25\\), donc \\(a = 5\\) cm. Aire d'une face latérale = \\(\\dfrac{1}{2} \\times 6 \\times 5 = 15\\) cm². Aire latérale totale = \\(4 \\times 15 = 60\\) cm²."
       },
       {
         "question": "<strong>3)</strong> Tracer le patron de cette pyramide.",
         "reponse": "Le patron est composé d'un carré de côté 6 cm (la base) et de quatre triangles isocèles de base 6 cm et de hauteur 5 cm (l'apothème)."
       }
     ]
   },
   {
     "titre": "Exercice 4 : Application des vecteurs",
     "points": "4 pts",
     "enonce": "<div style='font-size:1.05em; line-height:1.6;'>Soit un triangle ABC. On définit les points M, N et P par :<br>\\(\\overrightarrow{AM} = \\overrightarrow{AB} + \\overrightarrow{AC}\\),<br>\\(\\overrightarrow{BN} = \\overrightarrow{BA} + \\overrightarrow{BC}\\),<br>\\(\\overrightarrow{CP} = \\overrightarrow{CA} + \\overrightarrow{CB}\\).<br><br><strong>1.</strong> Placer les points M, N et P sur une figure.<br><br><strong>2.</strong> Montrer que M, N et P sont alignés.<br><br><strong>3.</strong> Que peut-on dire du point A pour le segment [MN] ?</div>",
     "questions": [
       {
         "question": "<strong>1)</strong> Placer les points M, N et P sur une figure.",
         "reponse": "Construction sur la figure."
       },
       {
         "question": "<strong>2)</strong> Montrer que M, N et P sont alignés.",
         "reponse": "On a \\(\\overrightarrow{MN} = \\overrightarrow{MA} + \\overrightarrow{AB} + \\overrightarrow{BN}\\) (relation de Chasles). En simplifiant avec les relations données, on obtient que \\(\\overrightarrow{MN}\\) est colinéaire à \\(\\overrightarrow{MP}\\). Les points M, N et P sont donc alignés."
       },
       {
         "question": "<strong>3)</strong> Que peut-on dire du point A pour le segment [MN] ?",
         "reponse": "A est le milieu de [MN]."
       }
     ]
   },
   {
     "titre": "Exercice 5 : Statistiques - Diagramme circulaire",
     "points": "3 pts",
     "enonce": "<div style='font-size:1.05em; line-height:1.6;'>Une classe de 3ème a été interrogée sur le nombre d'heures passées sur les écrans par jour. Voici les résultats :<br><br>0-1h : 5 élèves<br>1-2h : 8 élèves<br>2-3h : 6 élèves<br>3-4h : 3 élèves<br>4h et plus : 2 élèves<br><br><strong>1.</strong> Calculer l'effectif total.<br><br><strong>2.</strong> Calculer les fréquences en pourcentage pour chaque classe.<br><br><strong>3.</strong> Tracer un diagramme circulaire représentant ces données.</div>",
     "questions": [
       {
         "question": "<strong>1)</strong> Calculer l'effectif total.",
         "reponse": "Effectif total = 5 + 8 + 6 + 3 + 2 = 24 élèves."
       },
       {
         "question": "<strong>2)</strong> Calculer les fréquences en pourcentage.",
         "reponse": "0-1h : 5/24 × 100 ≈ 20,8 %<br>1-2h : 8/24 × 100 ≈ 33,3 %<br>2-3h : 6/24 × 100 = 25 %<br>3-4h : 3/24 × 100 = 12,5 %<br>4h et + : 2/24 × 100 ≈ 8,3 %"
       },
       {
         "question": "<strong>3)</strong> Tracer un diagramme circulaire.",
         "reponse": "Pour chaque classe, l'angle est proportionnel à la fréquence. L'angle total est 360°. On calcule les angles : 0-1h : 75°, 1-2h : 120°, 2-3h : 90°, 3-4h : 45°, 4h+ : 30°."
       }
     ]
   },
   {
     "titre": "Exercice 6 : Translation et vecteurs",
     "points": "3 pts",
     "enonce": "<div style='font-size:1.05em; line-height:1.6;'>On considère les points A(1; 2), B(4; 6) et C(2; 1) dans un repère orthonormé.<br><br><strong>1.</strong> Calculer les coordonnées du vecteur \\(\\overrightarrow{AB}\\).<br><br><strong>2.</strong> Déterminer les coordonnées du point D tel que \\(\\overrightarrow{CD} = \\overrightarrow{AB}\\).<br><br><strong>3.</strong> Quelle est la nature du quadrilatère ABDC ? Justifier.</div>",
     "questions": [
       {
         "question": "<strong>1)</strong> Calculer les coordonnées du vecteur \\(\\overrightarrow{AB}\\).",
         "reponse": "\\(\\overrightarrow{AB} = (4-1; 6-2) = (3; 4)\\)."
       },
       {
         "question": "<strong>2)</strong> Déterminer les coordonnées du point D tel que \\(\\overrightarrow{CD} = \\overrightarrow{AB}\\).",
         "reponse": "Soit D(x; y). \\(\\overrightarrow{CD} = (x-2; y-1)\\). On a (x-2; y-1) = (3; 4), donc x-2=3 → x=5 et y-1=4 → y=5. D(5; 5)."
       },
       {
         "question": "<strong>3)</strong> Quelle est la nature du quadrilatère ABDC ? Justifier.",
         "reponse": "\\(\\overrightarrow{AB} = \\overrightarrow{CD}\\). Un quadrilatère qui a un couple de côtés opposés parallèles et égaux est un parallélogramme. Donc ABDC est un parallélogramme."
       }
     ]
   }
 ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
