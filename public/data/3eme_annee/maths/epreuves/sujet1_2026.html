<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Mathématiques",
  "classe": "3ème année",
  "sequence": "Séquence 1",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Arithmétique binaire",
      "points": "4 pts",
      "enonce": "<div><p>L'informatique utilise le système binaire pour représenter les nombres. Un nombre en base 2 (binaire) n'utilise que les chiffres 0 et 1.</p><p><strong>Consigne :</strong> Réalise les conversions et les opérations suivantes en base deux.</p></div>",
      "questions": [
        {
          "question": "<p><strong>1.1</strong> Convertir le nombre décimal \(25_{10}\) en base 2. (1 pt)</p>",
          "reponse": "<p>\(25_{10} = 11001_2\)<br>Explication : \(25 = 16 + 8 + 1 = 1 \\times 2^4 + 1 \\times 2^3 + 0 \\times 2^2 + 0 \\times 2^1 + 1 \\times 2^0\)</p>"
        },
        {
          "question": "<p><strong>1.2</strong> Convertir le nombre binaire \(1011_2\) en base 10. (1 pt)</p>",
          "reponse": "<p>\(1011_2 = 1 \\times 2^3 + 0 \\times 2^2 + 1 \\times 2^1 + 1 \\times 2^0 = 8 + 0 + 2 + 1 = 11_{10}\)</p>"
        },
        {
          "question": "<p><strong>1.3</strong> Effectuer l'addition binaire suivante : \(1101_2 + 1010_2\). (1 pt)</p>",
          "reponse": "<p>\(1101_2 + 1010_2 = 10111_2\)<br>  $1101$<br>+ $1010$<br>-------<br>$10111$</p>"
        },
        {
          "question": "<p><strong>1.4</strong> Effectuer la multiplication binaire suivante : \(101_2 \\times 11_2\). (1 pt)</p>",
          "reponse": "<p>\(101_2 \\times 11_2 = 1111_2\)<br>  $101$<br>$\\times 11$<br>-------<br>  $101$<br> $101$<br>-------<br>$1111$</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Nombres rationnels et écriture scientifique",
      "points": "5 pts",
      "enonce": "<div><p>La distance moyenne de la Terre au Soleil est d'environ \(150 000 000\) km. La vitesse de la lumière est d'environ \(3 \\times 10^5\) km/s.</p></div>",
      "questions": [
        {
          "question": "<p><strong>2.1</strong> Exprimer la distance Terre-Soleil en écriture scientifique. (1 pt)</p>",
          "reponse": "<p>\(150 000 000 = 1,5 \\times 10^8\) km</p>"
        },
        {
          "question": "<p><strong>2.2</strong> Calculer le temps que met la lumière pour parcourir la distance Terre-Soleil. (1,5 pt)</p>",
          "reponse": "<p>\(t = \\frac{d}{v} = \\frac{1,5 \\times 10^8}{3 \\times 10^5} = 0,5 \\times 10^3 = 500\) secondes</p>"
        },
        {
          "question": "<p><strong>2.3</strong> Convertir ce temps en minutes. (0,5 pt)</p>",
          "reponse": "<p>\(500\) secondes \(= \\frac{500}{60} \\approx 8,33\) minutes</p>"
        },
        {
          "question": "<p><strong>2.4</strong> Calculer la distance parcourue par la lumière en une année (année-lumière) sachant qu'une année compte \(3,15 \\times 10^7\) secondes. (2 pts)</p>",
          "reponse": "<p>\(d = v \\times t = 3 \\times 10^5 \\times 3,15 \\times 10^7 = 9,45 \\times 10^{12}\) km</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Nombres réels et radicaux",
      "points": "4 pts",
      "enonce": "<div><p>Simplifie les expressions suivantes et donne les résultats sous la forme \(a\\sqrt{b}\) où \(a\) et \(b\) sont des entiers, \(b\) étant le plus petit possible.</p></div>",
      "questions": [
        {
          "question": "<p><strong>3.1</strong> \(\\sqrt{72}\) (1 pt)</p>",
          "reponse": "<p>\(\\sqrt{72} = \\sqrt{36 \\times 2} = 6\\sqrt{2}\)</p>"
        },
        {
          "question": "<p><strong>3.2</strong> \(\\sqrt{50} + \\sqrt{18}\) (1,5 pt)</p>",
          "reponse": "<p>\(\\sqrt{50} = 5\\sqrt{2}\) et \(\\sqrt{18} = 3\\sqrt{2}\)<br>Donc \(\\sqrt{50} + \\sqrt{18} = 5\\sqrt{2} + 3\\sqrt{2} = 8\\sqrt{2}\)</p>"
        },
        {
          "question": "<p><strong>3.3</strong> \(\\sqrt{2} \\times \\sqrt{8}\) (0,5 pt)</p>",
          "reponse": "<p>\(\\sqrt{2} \\times \\sqrt{8} = \\sqrt{16} = 4\)</p>"
        },
        {
          "question": "<p><strong>3.4</strong> Encadrer \(\\sqrt{3}\) par deux nombres décimaux au dixième près. (1 pt)</p>",
          "reponse": "<p>\(1,7 < \\sqrt{3} < 1,8\)</p>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Calcul algébrique",
      "points": "4 pts",
      "enonce": "<div><p>On considère l'expression \(E = (2x - 3)^2 - (x + 1)(2x - 3)\).</p></div>",
      "questions": [
        {
          "question": "<p><strong>4.1</strong> Développer et réduire l'expression \(E\). (2 pts)</p>",
          "reponse": "<p>\(E = (2x - 3)^2 - (x + 1)(2x - 3)\)<br>\(E = (4x^2 - 12x + 9) - (2x^2 - 3x + 2x - 3)\)<br>\(E = 4x^2 - 12x + 9 - 2x^2 + x + 3\)<br>\(E = 2x^2 - 11x + 12\)</p>"
        },
        {
          "question": "<p><strong>4.2</strong> Factoriser l'expression \(E\). (1 pt)</p>",
          "reponse": "<p>\(E = (2x - 3)[(2x - 3) - (x + 1)] = (2x - 3)(2x - 3 - x - 1) = (2x - 3)(x - 4)\)</p>"
        },
        {
          "question": "<p><strong>4.3</strong> Calculer la valeur de \(E\) pour \(x = -1\). (1 pt)</p>",
          "reponse": "<p>Pour \(x = -1\) : \(E = (2 \\times (-1) - 3)((-1) - 4) = (-2 - 3)(-5) = (-5)(-5) = 25\)</p>"
        }
      ]
    },
    {
      "titre": "Exercice 5 : Équations et inéquations du premier degré",
      "points": "4 pts",
      "enonce": "<div><p>Résoudre les équations et inéquations suivantes dans \(\\mathbb{R}\).</p></div>",
      "questions": [
        {
          "question": "<p><strong>5.1</strong> \(3x + 7 = 2x - 5\) (1 pt)</p>",
          "reponse": "<p>\(3x - 2x = -5 - 7\)<br>\(x = -12\)</p>"
        },
        {
          "question": "<p><strong>5.2</strong> \(2(x - 3) = 4x + 1\) (1 pt)</p>",
          "reponse": "<p>\(2x - 6 = 4x + 1\)<br>\(2x - 4x = 1 + 6\)<br>\(-2x = 7\)<br>\(x = -\\frac{7}{2}\)</p>"
        },
        {
          "question": "<p><strong>5.3</strong> \(2x - 5 \\leq 3x + 1\) (1 pt)</p>",
          "reponse": "<p>\(2x - 3x \\leq 1 + 5\)<br>\(-x \\leq 6\)<br>\(x \\geq -6\)<br>Solution : \([-6; +\\infty[\)</p>"
        },
        {
          "question": "<p><strong>5.4</strong> Résoudre le problème suivant : Un père a 42 ans et son fils a 12 ans. Dans combien d'années l'âge du père sera-t-il le double de l'âge du fils ? (1 pt)</p>",
          "reponse": "<p>Soit \(x\) le nombre d'années cherché.<br>\(42 + x = 2(12 + x)\)<br>\(42 + x = 24 + 2x\)<br>\(42 - 24 = 2x - x\)<br>\(18 = x\)<br>Dans 18 ans, l'âge du père sera le double de l'âge du fils.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 6 : Statistiques",
      "points": "4 pts",
      "enonce": "<div><p>Une enquête sur les sports préférés des élèves d'une classe de 3ème a donné les résultats suivants :</p><div style='overflow-x: auto;'><table style='width: 100%; border-collapse: collapse; margin: 10px 0;'><tr style='background-color: #34495e; color: white;'><th style='padding: 8px; border: 1px solid #ddd;'>Sport</th><th style='padding: 8px; border: 1px solid #ddd;'>Football</th><th style='padding: 8px; border: 1px solid #ddd;'>Basketball</th><th style='padding: 8px; border: 1px solid #ddd;'>Volleyball</th><th style='padding: 8px; border: 1px solid #ddd;'>Athlétisme</th></tr><tr><td style='padding: 8px; border: 1px solid #ddd;'>Effectif</td><td style='padding: 8px; border: 1px solid #ddd;'>12</td><td style='padding: 8px; border: 1px solid #ddd;'>8</td><td style='padding: 8px; border: 1px solid #ddd;'>6</td><td style='padding: 8px; border: 1px solid #ddd;'>4</td></tr></table></div></div>",
      "questions": [
        {
          "question": "<p><strong>6.1</strong> Quel est l'effectif total de la classe ? (0,5 pt)</p>",
          "reponse": "<p>\(12 + 8 + 6 + 4 = 30\) élèves</p>"
        },
        {
          "question": "<p><strong>6.2</strong> Calculer la fréquence en pourcentage de chaque sport. (1 pt)</p>",
          "reponse": "<p>Football : \(\\frac{12}{30} \\times 100 = 40\\%\)<br>Basketball : \(\\frac{8}{30} \\times 100 \\approx 26,7\\%\)<br>Volleyball : \(\\frac{6}{30} \\times 100 = 20\\%\)<br>Athlétisme : \(\\frac{4}{30} \\times 100 \\approx 13,3\\%\)</p>"
        },
        {
          "question": "<p><strong>6.3</strong> Construire un diagramme circulaire représentant ces données (indiquer les angles). (1,5 pt)</p>",
          "reponse": "<p>Angles du diagramme circulaire :<br>Football : \(40\\% \\times 360° = 144°\)<br>Basketball : \(26,7\\% \\times 360° \\approx 96°\)<br>Volleyball : \(20\\% \\times 360° = 72°\)<br>Athlétisme : \(13,3\\% \\times 360° \\approx 48°\)</p>"
        },
        {
          "question": "<p><strong>6.4</strong> Quel est le sport le plus pratiqué ? (0,5 pt)</p>",
          "reponse": "<p>Le sport le plus pratiqué est le football avec 40% des élèves.</p>"
        },
        {
          "question": "<p><strong>6.5</strong> Quelle fraction des élèves préfère le basketball ou le volleyball ? (0,5 pt)</p>",
          "reponse": "<p>\(\\frac{8 + 6}{30} = \\frac{14}{30} = \\frac{7}{15}\)</p>"
        }
      ]
    },
    {
      "titre": "Exercice 7 : Théorème de Pythagore",
      "points": "4 pts",
      "enonce": "<div><p>Un terrain agricole à Bafoussam a la forme d'un triangle ABC rectangle en A. On sait que \(AB = 12\) m et \(AC = 9\) m.</p></div>",
      "questions": [
        {
          "question": "<p><strong>7.1</strong> Calculer la longueur \(BC\). (1 pt)</p>",
          "reponse": "<p>\(BC^2 = AB^2 + AC^2 = 12^2 + 9^2 = 144 + 81 = 225\)<br>\(BC = \\sqrt{225} = 15\) m</p>"
        },
        {
          "question": "<p><strong>7.2</strong> Calculer le périmètre du triangle ABC. (1 pt)</p>",
          "reponse": "<p>\(P = AB + AC + BC = 12 + 9 + 15 = 36\) m</p>"
        },
        {
          "question": "<p><strong>7.3</strong> Calculer l'aire du triangle ABC. (1 pt)</p>",
          "reponse": "<p>\(A = \\frac{AB \\times AC}{2} = \\frac{12 \\times 9}{2} = 54\) m²</p>"
        },
        {
          "question": "<p><strong>7.4</strong> Si le prix du terrain est de 15 000 FCFA le mètre carré, quel est son prix total ? (1 pt)</p>",
          "reponse": "<p>\(54 \\times 15000 = 810000\) FCFA</p>"
        }
      ]
    },
    {
      "titre": "Exercice 8 : Pyramide",
      "points": "4 pts",
      "enonce": "<div><p>Un monument commémoratif à Yaoundé a la forme d'une pyramide régulière à base carrée. Le côté de la base mesure 8 m et la hauteur de la pyramide est de 6 m.</p></div>",
      "questions": [
        {
          "question": "<p><strong>8.1</strong> Calculer l'aire de la base de la pyramide. (1 pt)</p>",
          "reponse": "<p>\(A_{base} = 8 \\times 8 = 64\) m²</p>"
        },
        {
          "question": "<p><strong>8.2</strong> Calculer le volume de la pyramide. (1,5 pt)</p>",
          "reponse": "<p>\(V = \\frac{1}{3} \\times A_{base} \\times h = \\frac{1}{3} \\times 64 \\times 6 = 128\) m³</p>"
        },
        {
          "question": "<p><strong>8.3</strong> Calculer la longueur de l'arête latérale de la pyramide. (1,5 pt)</p>",
          "reponse": "<p>La moitié de la diagonale de la base : \(\\frac{8\\sqrt{2}}{2} = 4\\sqrt{2}\) m<br>Arête latérale : \(\\sqrt{(4\\sqrt{2})^2 + 6^2} = \\sqrt{32 + 36} = \\sqrt{68} = 2\\sqrt{17} \\approx 8,25\) m</p>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
