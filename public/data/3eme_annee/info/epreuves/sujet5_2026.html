<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Informatique",
  "classe": "3ème année",
  "sequence": "Séquence 5",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Architecture et Configuration des Réseaux",
      "points": "7 pts",
      "enonce": "<p>Dans un cybercafé de Douala, le gérant souhaite moderniser son réseau. Il dispose de 10 ordinateurs, d'une imprimante, d'un switch et d'un routeur.</p>",
      "questions": [
        {
          "question": "1) <strong>Identifier et définir</strong> (2 pts) : <br> a) Nomme le type de réseau qui permet de relier ces ordinateurs entre eux dans le même bâtiment. Justifie ta réponse. <br> b) Donne une définition d'un réseau informatique en général.",
          "reponse": "<p><strong>a) Réseau Local (LAN - Local Area Network)</strong> : C'est un réseau qui couvre une zone géographique restreinte comme un bâtiment, une école ou un cybercafé. Il permet le partage de ressources (fichiers, imprimante, connexion internet) entre les ordinateurs [citation:1].</p><p><strong>b) Définition d'un réseau informatique</strong> : C'est un ensemble d'équipements (ordinateurs, imprimantes, etc.) reliés entre eux par des liaisons (câbles, ondes) pour échanger des informations et partager des ressources, en suivant des règles communes (protocoles).</p>"
        },
        {
          "question": "2) <strong>Expliquer et décrire</strong> (3 pts) : <br> a) Quel est le rôle du routeur dans ce réseau ? <br> b) Explique le rôle du switch. En quoi est-il plus efficace qu'un hub ? <br> c) Cite deux paramètres essentiels à configurer sur un ordinateur pour qu'il puisse communiquer sur ce réseau.",
          "reponse": "<p><strong>a) Rôle du routeur</strong> : Le routeur a pour rôle de connecter le réseau local au réseau Internet (ou à un autre réseau). Il aiguise le trafic (les paquets de données) vers la bonne destination et fait office de passerelle.</p><p><strong>b) Rôle du switch et comparaison avec le hub</strong> : Le switch est un équipement qui relie plusieurs ordinateurs sur le réseau local. Contrairement au hub qui envoie les données à tous les ordinateurs, le switch est plus intelligent : il envoie les données uniquement à l'ordinateur destinataire, ce qui optimise le débit et la sécurité du réseau.</p><p><strong>c) Paramètres de configuration</strong> : L'adresse IP (identifiant unique de l'ordinateur sur le réseau) et le Masque de sous-réseau (qui définit l'étendue du réseau local).</p>"
        },
        {
          "question": "3) <strong>Analyse et mise en situation</strong> (2 pts) : <br> Le gérant veut que les ordinateurs obtiennent automatiquement leur adresse IP. <br> a) Quel service doit-il activer sur son réseau ? Explique son fonctionnement. <br> b) Que se passerait-il si deux ordinateurs avaient la même adresse IP ?",
          "reponse": "<p><strong>a) Service DHCP (Dynamic Host Configuration Protocol)</strong> : Le serveur DHCP attribue automatiquement une adresse IP disponible à chaque ordinateur qui se connecte au réseau. Cela évite de configurer chaque poste manuellement et simplifie la gestion du réseau.</p><p><strong>b) Conflit d'adresses IP</strong> : Si deux ordinateurs ont la même adresse IP, ils ne pourront pas communiquer correctement sur le réseau. Un conflit d'adresses se produit, et la connexion peut être instable, voire bloquée.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Internet et Recherche d'Informations",
      "points": "6 pts",
      "enonce": "<p>Pour préparer un exposé sur la culture camerounaise, un élève utilise un moteur de recherche.</p>",
      "questions": [
        {
          "question": "1) <strong>Connaître et citer</strong> (2 pts) : <br> a) Définis ce qu'est un moteur de recherche. <br> b) Cite deux services d'Internet autres que le World Wide Web (WWW).",
          "reponse": "<p><strong>a) Moteur de recherche</strong> : C'est un outil en ligne qui permet de trouver des pages web correspondant à des mots-clés saisis par l'utilisateur (comme Google, Bing, ou Ecosia). Il indexe des milliards de pages pour fournir des résultats pertinents [citation:1].</p><p><strong>b) Services Internet</strong> : Le courrier électronique (e-mail), le transfert de fichiers (FTP), la téléphonie par Internet (VoIP).</p>"
        },
        {
          "question": "2) <strong>Étapes et méthode</strong> (2 pts) : <br> Décris les étapes clés du processus de recherche d'information sur Internet (de la préparation à la vérification des sources).",
          "reponse": "<p><strong>Étapes de la recherche :</strong><br>1. <strong>Préparer la recherche</strong> : Définir clairement le sujet et les mots-clés pertinents (ex: \"artisanat camerounais traditionnel\").<br>2. <strong>Utiliser un moteur de recherche</strong> : Saisir les mots-clés, utiliser des guillemets pour une expression exacte, utiliser des opérateurs (+ ou -).<br>3. <strong>Analyser les résultats</strong> : Vérifier la fiabilité des sources (URL, auteur, date).<br>4. <strong>Sélectionner et récupérer</strong> : Ouvrir les sites pertinents et sauvegarder les informations utiles (texte, image) ou les enregistrer dans les favoris.</p>"
        },
        {
          "question": "3) <strong>Évaluation et exploitation des résultats</strong> (2 pts) : <br> a) Après une recherche, comment un élève peut-il s'assurer qu'un site web est fiable pour son exposé ? <br> b) Quelles sont les bonnes pratiques de citoyenneté numérique à respecter lorsqu'on utilise des informations trouvées sur Internet ?",
          "reponse": "<p><strong>a) Critères de fiabilité</strong> : Il peut vérifier l'auteur (est-ce un expert ou une institution reconnue ?), la date de publication, les sources citées, et comparer les informations sur plusieurs sites différents pour s'assurer de leur cohérence.</p><p><strong>b) Éthique et citoyenneté numérique</strong> : Il doit toujours citer ses sources (le nom de l'auteur et l'URL du site). Il ne doit pas copier-coller sans autorisation et doit respecter le droit d'auteur.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Introduction à l'Algorithmique",
      "points": "7 pts",
      "enonce": "<p>Pour automatiser le calcul de la moyenne de ses élèves, un enseignant de Bafoussam décide d'écrire un algorithme.</p>",
      "questions": [
        {
          "question": "1) <strong>Identifier et définir</strong> (2 pts) : <br> a) Qu'est-ce qu'une variable en algorithmique ? <br> b) Nomme et définis deux types de variables utilisés pour stocker les notes.",
          "reponse": "<p><strong>a) Définition d'une variable</strong> : C'est un espace de stockage en mémoire, identifié par un nom, qui peut contenir une valeur (qui peut varier au cours de l'exécution de l'algorithme).</p><p><strong>b) Types de variables</strong> : <br> - <strong>Entier (Integer)</strong> : pour stocker des nombres entiers (ex: 15, 8, 20).<br> - <strong>Réel (Real)</strong> : pour stocker des nombres décimaux (ex: 14.5, 9.5, 18.7).</p>"
        },
        {
          "question": "2) <strong>Écrire et structurer</strong> (3 pts) : <br> Écris un algorithme simple en pseudo-code qui : <br> - Lit trois notes <strong>note1</strong>, <strong>note2</strong>, <strong>note3</strong>. <br> - Calcule la somme des trois notes. <br> - Calcule la moyenne. <br> - Affiche le résultat.",
          "reponse": "<pre style='background-color: #2C3E50; color: #ecf0f1; padding: 15px; border-radius: 8px;'><code><strong>Algorithme CalculMoyenne</strong><br><br>    // Déclaration des variables<br>    Réel note1, note2, note3, somme, moyenne<br>    <br>    // Entrée des données (Lecture)<br>    Lire note1<br>    Lire note2<br>    Lire note3<br>    <br>    // Traitement (Calcul)<br>    somme ← note1 + note2 + note3<br>    moyenne ← somme / 3<br>    <br>    // Sortie (Affichage du résultat)<br>    Afficher \"La moyenne est : \", moyenne<br>Fin</code></pre>"
        },
        {
          "question": "3) <strong>Exécuter et analyser</strong> (2 pts) : <br> Exécute ton algorithme avec les notes suivantes : <strong>14.5</strong>, <strong>16.0</strong> et <strong>12.5</strong>. <br> a) Quelle est la valeur de la variable 'somme' ? <br> b) Quelle est la valeur de la variable 'moyenne' ?",
          "reponse": "<p><strong>Exécution de l'algorithme :</strong><br> <strong>somme = 14.5 + 16.0 + 12.5 = 43.0</strong><br> <strong>moyenne = 43.0 / 3 = 14.33</strong> (arrondi)</p>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
