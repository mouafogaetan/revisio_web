<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
 "matiere": "informatique",
 "classe": "3ème année",
 "sequence": "Séquence 3",
 "anneeScolaire": "2025-2026",
 "exercices": [
   {
     "titre": "Exercice 1 : Notions fondamentales sur les réseaux et Internet (6 pts)",
     "points": "6 pts",
     "enonce": "<p>Cet exercice porte sur les généralités des réseaux informatiques et d'Internet.</p>",
     "questions": [
       {
         "question": "<p><strong>1.1</strong> Définissez en une phrase ce qu'est un <strong>réseau informatique</strong>.</p>",
         "reponse": "<p>Un réseau informatique est un ensemble d'ordinateurs et d'équipements interconnectés pour échanger des données et partager des ressources.</p>"
       },
       {
         "question": "<p><strong>1.2</strong> Citez deux types de réseaux en fonction de leur étendue géographique et donnez un exemple pour chacun.</p>",
         "reponse": "<ul><li><strong>Réseau Local (LAN)</strong> : Un réseau dans une salle informatique ou un bâtiment.</li><li><strong>Réseau Étendu (WAN)</strong> : Internet.</li></ul>"
       },
       {
         "question": "<p><strong>1.3</strong> Donnez la définition d'<strong>Internet</strong>.</p>",
         "reponse": "<p>Internet est un réseau mondial composé de millions de réseaux informatiques interconnectés, qui permet la communication et le partage de ressources à l'échelle planétaire.</p>"
       },
       {
         "question": "<p><strong>1.4</strong> Quel est le rôle du <strong>DNS</strong> (Domain Name System) ?</p>",
         "reponse": "<p>Le DNS (Domain Name System) est le service qui traduit les noms de domaine (ex: www.google.com) en adresses IP (ex: 172.217.16.36) compréhensibles par les machines.</p>"
       }
     ]
   },
   {
     "titre": "Exercice 2 : Configuration et utilisation d'un ordinateur en réseau (4 pts)",
     "points": "4 pts",
     "enonce": "<p>Cet exercice aborde la configuration réseau et l'utilisation de ressources partagées.</p>",
     "questions": [
       {
         "question": "<p><strong>2.1</strong> Expliquez brièvement la différence entre une <strong>adresse IP statique</strong> et une <strong>adresse IP dynamique</strong>.</p>",
         "reponse": "<ul><li><strong>Statique</strong> : L'adresse IP est configurée manuellement sur l'ordinateur.</li><li><strong>Dynamique</strong> : L'adresse IP est attribuée automatiquement par un serveur DHCP.</li></ul>"
       },
       {
         "question": "<p><strong>2.2</strong> Lors de la configuration réseau de son ordinateur, un utilisateur doit renseigner plusieurs paramètres. Quels sont les paramètres <strong>obligatoires</strong> pour une connexion en réseau ?</p>",
         "reponse": "<p>Les paramètres obligatoires sont généralement : <strong>l'adresse IP</strong>, le <strong>masque de sous-réseau</strong> et la <strong>passerelle par défaut</strong>.</p>"
       },
       {
         "question": "<p><strong>2.3</strong> Un utilisateur souhaite utiliser une imprimante partagée sur le réseau. Décrivez en une phrase l'opération qu'il doit effectuer sur son ordinateur.</p>",
         "reponse": "<p>Il doit ouvrir l'Explorateur Windows, accéder au <strong>Réseau</strong>, trouver l'ordinateur qui partage l'imprimante, double-cliquer sur l'imprimante et suivre les instructions pour l'installer.</p>"
       }
     ]
   },
   {
     "titre": "Exercice 3 : Maintenance et système d'exploitation (4 pts)",
     "points": "4 pts",
     "enonce": "<p>Cet exercice porte sur les tâches de maintenance et la gestion du système d'exploitation.</p>",
     "questions": [
       {
         "question": "<p><strong>3.1</strong> Pourquoi est-il important de faire des <strong>mises à jour</strong> de son antivirus ?</p>",
         "reponse": "<p>Pour que l'antivirus puisse détecter et éliminer les nouveaux virus et logiciels malveillants (malware) créés chaque jour.</p>"
       },
       {
         "question": "<p><strong>3.2</strong> Quelles sont les deux étapes principales que l'on peut programmer pour l'exécution d'une analyse antivirus ?</p>",
         "reponse": "<p>On peut programmer un <strong>scan rapide</strong> (des zones critiques) ou un <strong>scan complet</strong> (de tout le disque), et souvent planifier un <strong>scan au démarrage</strong> de l'ordinateur.</p>"
       },
       {
         "question": "<p><strong>3.3</strong> Quelle est la principale <strong>différence</strong> entre un système d'exploitation (ex: Windows) et un logiciel d'application (ex: Word) ?</p>",
         "reponse": "<p>Le système d'exploitation est le logiciel de base qui gère le matériel et permet l'exécution des autres logiciels, alors qu'un logiciel d'application est un programme utilisé par l'utilisateur pour effectuer une tâche spécifique (rédiger, calculer, etc.).</p>"
       }
     ]
   },
   {
     "titre": "Exercice 4 : Gestion des données et Traitement de texte (4 pts)",
     "points": "4 pts",
     "enonce": "<p>Cet exercice mélange la gestion des fichiers et les fonctionnalités avancées d'un traitement de texte.</p>",
     "questions": [
       {
         "question": "<p><strong>4.1</strong> Quelle est la différence entre un <strong>fichier</strong> et un <strong>dossier</strong> ?</p>",
         "reponse": "<p>Un <strong>fichier</strong> est un conteneur de données (texte, image, etc.), tandis qu'un <strong>dossier</strong> est un conteneur qui permet d'organiser et de ranger plusieurs fichiers et sous-dossiers.</p>"
       },
       {
         "question": "<p><strong>4.2</strong> Dans un traitement de texte, à quoi servent les <strong>styles</strong> ? Citez un avantage à les utiliser.</p>",
         "reponse": "<p>Les styles permettent d'appliquer une mise en forme homogène et cohérente à un document. Un avantage majeur est de pouvoir <strong>générer automatiquement une table des matières</strong>.</p>"
       },
       {
         "question": "<p><strong>4.3</strong> Décrivez en une phrase ce qu'est la fonction de <strong>publipostage</strong> dans un traitement de texte.</p>",
         "reponse": "<p>Le publipostage est une fonction qui permet de créer un ensemble de documents personnalisés (ex: lettres) à partir d'un document modèle et d'une source de données (ex: une liste de contacts).</p>"
       }
     ]
   },
   {
     "titre": "Exercice 5 : Tableur et Présentation (4 pts)",
     "points": "4 pts",
     "enonce": "<p>Cet exercice porte sur la production de documents avec un tableur et un logiciel de présentation.</p>",
     "questions": [
       {
         "question": "<p><strong>5.1</strong> Dans un tableur, si une cellule est à l'intersection de la colonne C et de la ligne 5, quelle est son <strong>adresse</strong> ?</p>",
         "reponse": "<p>L'adresse de la cellule est <strong>C5</strong>.</p>"
       },
       {
         "question": "<p><strong>5.2</strong> Quelle formule doit-on saisir pour calculer la <strong>somme</strong> des valeurs contenues dans les cellules de A1 à A5 ?</p>",
         "reponse": "<p>La formule est <code>=SOMME(A1:A5)</code>.</p>"
       },
       {
         "question": "<p><strong>5.3</strong> Lors de la création d'un diaporama, quels sont deux types d'effets que l'on peut ajouter entre les diapositives ou sur les objets ?</p>",
         "reponse": "<p>On peut ajouter des <strong>animations</strong> (effets d'entrée sur les objets) et des <strong>transitions</strong> (effets entre deux diapositives).</p>"
       }
     ]
   },
   {
     "titre": "Exercice 6 : Initiation à l'algorithmique (4 pts)",
     "points": "4 pts",
     "enonce": "<p>Cet exercice se concentre sur la compréhension et l'exécution d'algorithmes simples.</p>",
     "questions": [
       {
         "question": "<p><strong>6.1</strong> Dans un algorithme, qu'est-ce qu'une <strong>variable</strong> ?</p>",
         "reponse": "<p>Une variable est un espace de la mémoire de l'ordinateur qui peut contenir une donnée (un nombre, un texte, etc.), et dont la valeur peut changer au cours de l'exécution.</p>"
       },
       {
         "question": "<p><strong>6.2</strong> On considère l'algorithme simple suivant :</p><ul><li>Lire la valeur de <code>A</code>.</li><li>Lire la valeur de <code>B</code>.</li><li><code>Resultat = A + B * 2</code>.</li><li>Afficher <code>Resultat</code>.</li></ul><p>Quel est le résultat affiché si on entre <code>A = 5</code> et <code>B = 3</code> ?</p>",
         "reponse": "<p>Résultat = 5 + 3 * 2 = 5 + 6 = <strong>11</strong>.</p>"
       },
       {
         "question": "<p><strong>6.3</strong> Réécrivez l'algorithme ci-dessus en ordonnant correctement les instructions pour qu'il calcule la <strong>moyenne</strong> de A et B.</p>",
         "reponse": "<p>Algorithme Moyenne :</p><ol><li>Lire la valeur de <code>A</code>.</li><li>Lire la valeur de <code>B</code>.</li><li><code>Moyenne = (A + B) / 2</code>.</li><li>Afficher <code>Moyenne</code>.</li></ol>"
       }
     ]
   }
 ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
