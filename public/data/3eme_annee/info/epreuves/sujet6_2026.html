<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Informatique",
  "classe": "3ème",
  "sequence": "Séquence 6",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : QCM - Généralités sur les réseaux et systèmes d'exploitation",
      "points": "4 pts",
      "enonce": "<p>Pour chacune des affirmations suivantes, choisis la bonne réponse.</p>",
      "questions": [
        {
          "question": "<p><strong>1.</strong> Un réseau informatique est :</p><ul><li>A) Un ensemble d'ordinateurs et de périphériques connectés entre eux pour échanger des données.</li><li>B) Un logiciel de traitement de texte.</li><li>C) Un type de câble.</li></ul>",
          "reponse": "<p>A) Un ensemble d'ordinateurs et de périphériques connectés entre eux pour échanger des données.</p><p>Un réseau est un système de communication qui relie plusieurs équipements informatiques (ordinateurs, imprimantes, serveurs) pour permettre le partage de ressources et de données [citation:1].</p>"
        },
        {
          "question": "<p><strong>2.</strong> Un système d'exploitation est :</p><ul><li>A) Un périphérique.</li><li>B) Un logiciel de base qui gère les ressources matérielles et logicelles.</li><li>C) Un navigateur web.</li></ul>",
          "reponse": "<p>B) Un logiciel de base qui gère les ressources matérielles et logicelles.</p><p>Le système d'exploitation sert d'interface entre l'utilisateur et le matériel, en gérant les fichiers, la mémoire, les processus et les périphériques.</p>"
        },
        {
          "question": "<p><strong>3.</strong> Lequel de ces éléments est un périphérique d'entrée ?</p><ul><li>A) Écran.</li><li>B) Imprimante.</li><li>C) Souris.</li></ul>",
          "reponse": "<p>C) Souris.</p><p>La souris est un périphérique d'entrée qui permet à l'utilisateur d'interagir avec l'ordinateur. L'écran et l'imprimante sont des périphériques de sortie.</p>"
        },
        {
          "question": "<p><strong>4.</strong> Que signifie l'acronyme HTTP ?</p><ul><li>A) HyperText Transfer Protocol.</li><li>B) High Tech Transfer Protocol.</li><li>C) Hyper Text Transport Protocol.</li></ul>",
          "reponse": "<p>A) HyperText Transfer Protocol.</p><p>HTTP est le protocole de communication utilisé pour le transfert de pages web sur Internet, servant de base au World Wide Web.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Connexion et partage de ressources sur un réseau",
      "points": "4 pts",
      "enonce": "<p>Dans un cybercafé à Douala, plusieurs ordinateurs sont connectés à un réseau local (LAN) avec accès à Internet. L'administrateur souhaite partager une imprimante et un dossier de documents.</p>",
      "questions": [
        {
          "question": "<p><strong>1.</strong> Indique les étapes à suivre pour connecter un nouvel ordinateur à ce réseau.</p>",
          "reponse": "<p>1. Brancher le câble réseau RJ45 dans la prise murale ou le switch.<br>2. Configurer les paramètres réseau : soit automatiquement via DHCP, soit manuellement avec une adresse IP, un masque de sous-réseau et une passerelle.<br>3. Tester la connectivité à l'aide de la commande <em>ping</em>.<br>4. S'assurer que l'ordinateur est dans le même groupe de travail pour accéder aux ressources partagées.</p>"
        },
        {
          "question": "<p><strong>2.</strong> Décris la procédure pour partager un dossier sur le réseau Windows.</p>",
          "reponse": "<p>1. Clic droit sur le dossier à partager.<br>2. Sélectionner 'Propriétés'.<br>3. Aller dans l'onglet 'Partage'.<br>4. Cliquer sur 'Partager'.<br>5. Choisir les utilisateurs avec lesquels partager et définir leurs droits (lecture seule ou lecture/écriture).<br>6. Cliquer sur 'Appliquer' puis sur 'OK'.</p>"
        },
        {
          "question": "<p><strong>3.</strong> Comment un utilisateur peut-il accéder à ce dossier partagé depuis un autre ordinateur ?</p>",
          "reponse": "<p>1. Ouvrir l'Explorateur de fichiers.<br>2. Cliquer sur 'Réseau' dans le volet de navigation.<br>3. Chercher le nom de l'ordinateur sur lequel le dossier est partagé.<br>4. Double-cliquer sur le dossier partagé pour y accéder.<br>5. Si un mot de passe est demandé, le saisir.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Algorithmique - Instructions simples",
      "points": "6 pts",
      "enonce": "<p>On considère l'algorithme suivant :</p><div style='background:#2c3e50;color:#ecf0f1;padding:10px;border-radius:5px;font-family:monospace;'>Algorithme CalculPerimetre<br>Variables L, l, P<br>Début<br>  Écrire(\"Entrez la longueur : \")<br>  Lire(L)<br>  Écrire(\"Entrez la largeur : \")<br>  Lire(l)<br>  P ← 2 * (L + l)<br>  Écrire(\"Le périmètre est : \", P)<br>Fin</div>",
      "questions": [
        {
          "question": "<p><strong>1.</strong> Identifier les différentes instructions présentes dans cet algorithme et préciser leur type.</p>",
          "reponse": "<p>L'algorithme contient les trois types d'instructions simples [citation:1] :<br>- <strong>Écrire</strong> : instruction d'écriture (<em>Écrire(\"Entrez la longueur : \")</em>) pour afficher un message à l'utilisateur.<br>- <strong>Lire</strong> : instruction de lecture (<em>Lire(L)</em>) pour saisir une valeur au clavier.<br>- <strong>Affectation</strong> : (<em>P ← 2 * (L + l)</em>) qui calcule et stocke le résultat dans la variable P.</p>"
        },
        {
          "question": "<p><strong>2.</strong> Que fait cet algorithme ? Que représente la variable <em>P</em> ?</p>",
          "reponse": "<p>Cet algorithme calcule le périmètre d'un rectangle dont les côtés sont L (longueur) et l (largeur). La variable P représente le périmètre calculé par la formule P = 2 × (L + l).</p>"
        },
        {
          "question": "<p><strong>3.</strong> Exécuter l'algorithme avec L = 8 et l = 3. Donner le résultat affiché à l'écran.</p>",
          "reponse": "<p>Étape 1 : Le programme affiche \"Entrez la longueur : \" et attend la saisie (L = 8).<br>Étape 2 : Le programme affiche \"Entrez la largeur : \" et attend la saisie (l = 3).<br>Étape 3 : P ← 2 × (8 + 3) = 2 × 11 = 22.<br>Étape 4 : Le programme affiche \"Le périmètre est : 22\".</p>"
        },
        {
          "question": "<p><strong>4.</strong> Modifier cet algorithme pour calculer l'aire d'un rectangle.</p>",
          "reponse": "<p>Algorithme CalculAire<br>Variables L, l, A<br>Début<br>  Écrire(\"Entrez la longueur : \")<br>  Lire(L)<br>  Écrire(\"Entrez la largeur : \")<br>  Lire(l)<br>  A ← L × l<br>  Écrire(\"L'aire est : \", A)<br>Fin</p><p>L'affectation devient A ← L × l et le message final affiche \"L'aire est : A\".</p>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Entretien logiciel de l'ordinateur",
      "points": "4 pts",
      "enonce": "<p>Un ordinateur du collège présente des ralentissements et des fenêtres publicitaires intempestives apparaissent.</p>",
      "questions": [
        {
          "question": "<p><strong>1.</strong> Quel est le problème probable de cet ordinateur et quelle est la première action à mener ?</p>",
          "reponse": "<p>L'ordinateur est probablement infecté par un virus ou un logiciel malveillant (malware) qui provoque des ralentissements et l'affichage de publicités intempestives. La première action à mener est de lancer une analyse antivirus complète après avoir mis à jour les définitions virales.</p>"
        },
        {
          "question": "<p><strong>2.</strong> Comment programmer une analyse automatique pour éviter ce genre de problème à l'avenir ?</p>",
          "reponse": "<p>1. Ouvrir l'antivirus.<br>2. Accéder aux paramètres de planification (\"Analyses programmées\").<br>3. Créer une nouvelle tâche en choisissant le type d'analyse (rapide ou complète).<br>4. Définir la fréquence et l'heure de l'analyse (ex : tous les jours à 23h).<br>5. Sauvegarder la configuration.</p>"
        },
        {
          "question": "<p><strong>3.</strong> Pourquoi est-il important de maintenir à jour les définitions virales de l'antivirus ?</p>",
          "reponse": "<p>De nouveaux virus et malwares apparaissent constamment. Les définitions virales contiennent les \"empreintes\" de ces menaces, ce qui permet à l'antivirus de les détecter. Sans mises à jour régulières, l'antivirus ne peut pas protéger l'ordinateur contre les menaces récentes.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 5 : Gestion des feuilles de calcul",
      "points": "2 pts",
      "enonce": "<p>Dans un tableur (Excel ou LibreOffice Calc), vous travaillez sur un classeur contenant plusieurs feuilles.</p>",
      "questions": [
        {
          "question": "<p><strong>1.</strong> Comment renommer une feuille de calcul ?</p>",
          "reponse": "<p>Double-cliquer sur l'onglet de la feuille, puis taper le nouveau nom et appuyer sur Entrée. On peut aussi faire un clic droit sur l'onglet et choisir \"Renommer\" dans le menu contextuel.</p>"
        },
        {
          "question": "<p><strong>2.</strong> Que se passe-t-il si on supprime une feuille utilisée par des formules dans d'autres feuilles ?</p>",
          "reponse": "<p>Les formules qui font référence à des cellules de la feuille supprimée afficheront l'erreur #REF! (référence invalide). Il faut donc être prudent avant de supprimer une feuille et vérifier les dépendances.</p>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
