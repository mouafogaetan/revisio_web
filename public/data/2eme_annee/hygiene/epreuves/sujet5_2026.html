<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Hygiène",
  "classe": "2ème Année",
  "sequence": "Séquence 5",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Questions à Choix Multiples (QCM) - 14 pts",
      "points": "14 pts",
      "enonce": "<div style='font-size:1.1em; line-height:1.8; padding:12px; background:#f8f9fa; border-radius:8px; color:#222;'>Pour chaque question, une seule réponse est correcte. Recopiez le numéro de la question et la lettre correspondant à la bonne réponse.</div>",
      "questions": [
        {
          "question": "<div style='font-weight:bold; margin-top:15px;'>1) (2 pts) Qu'est-ce qu'une alimentation équilibrée ?</div><div style='margin:8px 0 0 20px;'>A- Une alimentation riche uniquement en protéines<br>B- Une alimentation qui apporte tous les nutriments en quantité suffisante et dans de bonnes proportions<br>C- Une alimentation pauvre en glucides<br>D- Une alimentation composée uniquement de fruits et légumes</div>",
          "reponse": "<div style='background:#e7f3e7; padding:12px; border-radius:6px; border-left:5px solid #2a7a2a; color:#1a3a1a;'><strong>Réponse : B</strong><br><br>Une alimentation équilibrée est une alimentation variée qui apporte à l'organisme tous les nutriments (protides, glucides, lipides, vitamines, minéraux) en quantité suffisante.</div>"
        },
        {
          "question": "<div style='font-weight:bold; margin-top:15px;'>2) (2 pts) Le botulisme est une intoxication alimentaire causée par :</div><div style='margin:8px 0 0 20px;'>A- Un virus<br>B- Un parasite<br>C- Une toxine bactérienne<br>D- Un champignon</div>",
          "reponse": "<div style='background:#e7f3e7; padding:12px; border-radius:6px; border-left:5px solid #2a7a2a; color:#1a3a1a;'><strong>Réponse : C</strong><br><br>Le botulisme est causé par une toxine produite par la bactérie Clostridium botulinum. C'est une intoxication alimentaire grave qui peut provoquer une paralysie.</div>"
        },
        {
          "question": "<div style='font-weight:bold; margin-top:15px;'>3) (2 pts) La toxoplasmose est une parasitose alimentaire que l'on peut contracter en consommant :</div><div style='margin:8px 0 0 20px;'>A- Du riz mal cuit<br>B- De la viande peu cuite<br>C- Des fruits secs<br>D- Du pain trop cuit</div>",
          "reponse": "<div style='background:#e7f3e7; padding:12px; border-radius:6px; border-left:5px solid #2a7a2a; color:#1a3a1a;'><strong>Réponse : B</strong><br><br>La toxoplasmose est causée par un parasite présent dans la viande peu cuite ou dans les excréments de chat. La cuisson à cœur de la viande est essentielle pour éviter cette infection.</div>"
        },
        {
          "question": "<div style='font-weight:bold; margin-top:15px;'>4) (2 pts) L'air est composé principalement de :</div><div style='margin:8px 0 0 20px;'>A- Dioxygène et dioxyde de carbone<br>B- Diazote et dioxygène<br>C- Diazote et argon<br>D- Dioxyde de carbone et vapeur d'eau</div>",
          "reponse": "<div style='background:#e7f3e7; padding:12px; border-radius:6px; border-left:5px solid #2a7a2a; color:#1a3a1a;'><strong>Réponse : B</strong><br><br>L'air est un mélange gazeux composé d'environ 78 % de diazote (N₂) et de 21 % de dioxygène (O₂). Les autres gaz (dioxyde de carbone, argon, etc.) ne représentent qu'environ 1 % du volume total.</div>"
        },
        {
          "question": "<div style='font-weight:bold; margin-top:15px;'>5) (2 pts) Parmi ces sources, laquelle est une cause naturelle de pollution de l'air ?</div><div style='margin:8px 0 0 20px;'>A- Les gaz d'échappement des véhicules<br>B- Les émissions des usines<br>B- Les éruptions volcaniques<br>D- Le chauffage domestique au bois</div>",
          "reponse": "<div style='background:#e7f3e7; padding:12px; border-radius:6px; border-left:5px solid #2a7a2a; color:#1a3a1a;'><strong>Réponse : C</strong><br><br>Les éruptions volcaniques sont des sources naturelles de pollution de l'air. Les autres options sont des sources dues aux activités humaines.</div>"
        },
        {
          "question": "<div style='font-weight:bold; margin-top:15px;'>6) (2 pts) La pollution de l'air peut provoquer des maladies respiratoires. Laquelle de ces maladies est directement liée à la pollution atmosphérique ?</div><div style='margin:8px 0 0 20px;'>A- Le paludisme<br>B- L'asthme<br>C- Le diabète<br>D- La tuberculose</div>",
          "reponse": "<div style='background:#e7f3e7; padding:12px; border-radius:6px; border-left:5px solid #2a7a2a; color:#1a3a1a;'><strong>Réponse : B</strong><br><br>L'asthme est une maladie respiratoire dont les crises peuvent être déclenchées ou aggravées par la pollution de l'air (particules fines, ozone).</div>"
        },
        {
          "question": "<div style='font-weight:bold; margin-top:15px;'>7) (2 pts) Quels sont les deux gaz principaux responsables de la pollution de l'air d'origine automobile ?</div><div style='margin:8px 0 0 20px;'>A- Le dioxyde de carbone (CO₂) et l'ozone (O₃)<br>B- Le dioxyde d'azote (NO₂) et les particules fines<br>C- Le méthane (CH₄) et le dioxyde de soufre (SO₂)<br>D- L'argon (Ar) et le diazote (N₂)</div>",
          "reponse": "<div style='background:#e7f3e7; padding:12px; border-radius:6px; border-left:5px solid #2a7a2a; color:#1a3a1a;'><strong>Réponse : B</strong><br><br>Les véhicules automobiles émettent principalement du dioxyde d'azote (NO₂) et des particules fines, qui sont des polluants majeurs de l'air.</div>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Questions ouvertes sur les parasitoses et intoxications (8 pts)",
      "points": "8 pts",
      "enonce": "<div style='font-size:1.1em; line-height:1.8; padding:12px; background:#f8f9fa; border-radius:8px; color:#222;'><p>Répondez de manière claire et précise aux questions suivantes.</p></div>",
      "questions": [
        {
          "question": "<div style='font-weight:bold; margin-top:15px;'>8) (4 pts) Définissez ce qu'est une intoxication alimentaire et donnez un exemple concret (autre que le botulisme).</div>",
          "reponse": "<div style='background:#e7f3e7; padding:12px; border-radius:6px; border-left:5px solid #2a7a2a; color:#1a3a1a;'><strong>Réponse attendue :</strong><br><br>Une intoxication alimentaire est une maladie qui survient après avoir consommé un aliment ou une boisson contaminée par des microorganismes, des toxines ou des produits chimiques.<br><br><strong>Exemple :</strong> La salmonellose est une intoxication alimentaire causée par la bactérie Salmonella, que l'on trouve souvent dans les œufs, la volaille ou les produits laitiers non pasteurisés.</div>"
        },
        {
          "question": "<div style='font-weight:bold; margin-top:15px;'>9) (4 pts) Citez deux parasitoses alimentaires et proposez pour chacune un moyen de prévention.</div>",
          "reponse": "<div style='background:#e7f3e7; padding:12px; border-radius:6px; border-left:5px solid #2a7a2a; color:#1a3a1a;'><strong>Réponse attendue :</strong><br><br>1) <strong>Toxoplasmose :</strong> Bien cuire la viande et laver soigneusement les fruits et légumes.<br>2) <strong>Taeniasis (ver solitaire) :</strong> Bien cuire la viande de bœuf ou de porc à cœur (éviter la viande crue ou insuffisamment cuite).</div>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Étude de cas sur la pollution de l'air (8 pts)",
      "points": "8 pts",
      "enonce": "<div style='font-size:1.1em; line-height:1.8; padding:12px; background:#f8f9fa; border-radius:8px; color:#222;'><p><strong>Situation :</strong> Dans un quartier populaire de Douala, les habitants constatent une augmentation des cas de toux, de difficultés respiratoires et d'irritations oculaires. La principale source de pollution identifiée est la combustion des déchets ménagers et l'utilisation de combustibles polluants pour la cuisson (charbon de bois, pétrole).</p><p><strong>Consigne :</strong> Répondez aux questions suivantes.</p></div>",
      "questions": [
        {
          "question": "<div style='font-weight:bold; margin-top:15px;'>10) (4 pts) Identifiez les polluants susceptibles d'être émis par la combustion des déchets et des combustibles, et expliquez leurs effets sur la santé.</div>",
          "reponse": "<div style='background:#e7f3e7; padding:12px; border-radius:6px; border-left:5px solid #2a7a2a; color:#1a3a1a;'><strong>Réponse attendue :</strong><br><br>La combustion des déchets et du charbon de bois émet des <strong>particules fines</strong>, du <strong>dioxyde de soufre (SO₂)</strong> et du <strong>monoxyde de carbone (CO)</strong>.<br><br><strong>Effets sur la santé :</strong><br>Les particules fines pénètrent dans les poumons et peuvent provoquer des maladies respiratoires (asthme, bronchite), des irritations oculaires, des maux de tête et des problèmes cardiovasculaires.</div>"
        },
        {
          "question": "<div style='font-weight:bold; margin-top:15px;'>11) (4 pts) Proposez deux solutions concrètes pour réduire la pollution de l'air dans ce quartier.</div>",
          "reponse": "<div style='background:#e7f3e7; padding:12px; border-radius:6px; border-left:5px solid #2a7a2a; color:#1a3a1a;'><strong>Réponse attendue :</strong><br><br>1) <strong>Promouvoir l'utilisation de cuisinières améliorées</strong> à moindre émission de fumée, comme les cuisinières à gaz ou les foyers améliorés.<br>2) <strong>Mettre en place un système de gestion des déchets</strong> efficace (collecte, recyclage, compostage) pour éviter la combustion des déchets à l'air libre.</div>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
