<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Hygiène",
  "classe": "2ème Année",
  "sequence": "Séquence 6",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Partie I : Éducation à la Santé (10 pts)",
      "points": "10 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; padding: 10px; background-color: #e8f5e9; border-radius: 10px; color: #1e3a2f;'><p><strong>Instruction :</strong> Lisez attentivement les consignes et répondez aux questions dans les espaces prévus.</p></div>",
      "questions": [
        {
          "question": "<div style='margin-top: 15px; background-color: #fff; padding: 12px; border-radius: 8px; border-left: 5px solid #2e7d32;'><p><strong>Exercice 1 : Comportements émergents (3 pts)</strong></p><p>1. Définissez les comportements émergents nÉfastes à la santé et à la reproduction (1 pt)</p><p>2. Identifiez et expliquez brièvement deux comportements émergents cités dans votre cours (2 pts)</p></div>",
          "reponse": "<div style='padding: 10px; background-color: #f1f8e9; border-radius: 5px; color: #1e3a2f;'><p><strong>Corrigé :</strong></p><p>1. Les comportements émergents nÉfastes sont des pratiques ou habitudes nouvelles ou en recrudescence qui exposent l'individu à des risques pour sa santé physique, mentale ou sociale, et qui peuvent notamment nuire à sa capacité de reproduction.</p><p>2. <strong>La pédophilie</strong> : attirance sexuelle d'un adulte envers des enfants, causant des traumatismes profonds. <strong>L'homosexualité</strong> : attirance sexuelle envers une personne de même sexe (dans le contexte de l'éducation à la santé, on étudie les risques spécifiques liés aux comportements sexuels). <span style='font-size: 0.8em;'>[citation:1]</span></p></div>"
        },
        {
          "question": "<div style='margin-top: 15px; background-color: #fff; padding: 12px; border-radius: 8px; border-left: 5px solid #2e7d32;'><p><strong>Exercice 2 : IST, VIH/sida et Alimentation (4 pts)</strong></p><p>1. Décrivez les modes de transmission du VIH/sida (1 pt)</p><p>2. Citez un moyen de prévention contre le VIH/sida (1 pt)</p><p>3. Définissez une alimentation équilibrée (1 pt)</p><p>4. Identifiez les rations alimentaires (1 pt)</p></div>",
          "reponse": "<div style='padding: 10px; background-color: #f1f8e9; border-radius: 5px; color: #1e3a2f;'><p><strong>Corrigé :</strong></p><p>1. Le VIH se transmet par : <strong>voie sexuelle</strong> (rapports non protégés), <strong>voie sanguine</strong> (transfusion, partage de seringues) et <strong>voie materno-foetale</strong> (pendant la grossesse, l'accouchement ou l'allaitement).</p><p>2. L'utilisation systématique du <strong>préservatif</strong> est un moyen efficace de prévention.</p><p>3. Une alimentation équilibrée est une alimentation qui apporte à l'organisme les nutriments nécessaires en quantité suffisante pour assurer son bon fonctionnement, sans excès ni carence.</p><p>4. On identifie la <strong>ration énergétique</strong>, la <strong>ration de construction</strong> (protéines) et la <strong>ration de protection</strong> (vitamines et sels minéraux).</p></div>"
        },
        {
          "question": "<div style='margin-top: 15px; background-color: #fff; padding: 12px; border-radius: 8px; border-left: 5px solid #2e7d32;'><p><strong>Exercice 3 : Intoxications et Parasitoses (3 pts)</strong></p><p>1. Définissez une intoxication alimentaire et donnez un exemple (1 pt)</p><p>2. Citez un exemple de parasitose alimentaire (1 pt)</p><p>3. Proposez un moyen de prévention contre les parasitoses alimentaires (1 pt)</p></div>",
          "reponse": "<div style='padding: 10px; background-color: #f1f8e9; border-radius: 5px; color: #1e3a2f;'><p><strong>Corrigé :</strong></p><p>1. Une intoxication alimentaire est une maladie causée par l'ingestion d'aliments contaminés par des toxines ou des micro-organismes. <strong>Exemple</strong> : le botulisme, causé par une toxine bactérienne.</p><p>2. <strong>Exemple</strong> : La téniase (ou tæniasis) est une parasitose due à un ver solitaire (Taenia) contracté en consommant de la viande de boeuf ou de porc mal cuite.</p><p>3. Un moyen de prévention est de <strong>bien cuire les aliments</strong>, notamment la viande, et de se laver les mains avant de préparer les repas.</p></div>"
        }
      ]
    },
    {
      "titre": "Partie II : Éducation à l'Environnement et au Développement Durable (10 pts)",
      "points": "10 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; padding: 10px; background-color: #e3f2fd; border-radius: 10px; color: #0d2b3e;'><p><strong>Consigne :</strong> Répondez aux questions suivantes avec des phrases complètes et des arguments précis.</p></div>",
      "questions": [
        {
          "question": "<div style='margin-top: 15px; background-color: #fff; padding: 12px; border-radius: 8px; border-left: 5px solid #1565c0;'><p><strong>Exercice 4 : Constituants et Usages de l'air (3 pts)</strong></p><p>1. Identifiez les constituants de l'air (1 pt)</p><p>2. Décrivez un usage naturel et un usage artificiel de l'air (2 pts)</p></div>",
          "reponse": "<div style='padding: 10px; background-color: #e3f2fd; border-radius: 5px; color: #0d2b3e;'><p><strong>Corrigé :</strong></p><p>1. L'air est composé principalement de <strong>diazote (N₂)</strong> (environ 78%), de <strong>dioxygène (O₂)</strong> (environ 21%) et de traces de gaz rares, de vapeur d'eau et de dioxyde de carbone (CO₂).</p><p>2. <strong>Usage naturel</strong> : La respiration des êtres vivants (hommes, animaux, plantes) qui prélèvent le dioxygène pour vivre. <strong>Usage artificiel</strong> : La combustion dans les moteurs ou les centrales électriques qui utilise le dioxygène de l'air.</p></div>"
        },
        {
          "question": "<div style='margin-top: 15px; background-color: #fff; padding: 12px; border-radius: 8px; border-left: 5px solid #1565c0;'><p><strong>Exercice 5 : Causes et Conséquences de la Pollution de l'air (4 pts)</strong></p><p>1. Identifiez trois causes de la pollution de l'air (1,5 pt)</p><p>2. Analysez deux conséquences de la pollution de l'air sur la santé de l'Homme (2,5 pts)</p></div>",
          "reponse": "<div style='padding: 10px; background-color: #e3f2fd; border-radius: 5px; color: #0d2b3e;'><p><strong>Corrigé :</strong></p><p>1. Trois causes de la pollution de l'air : <strong>les émissions des véhicules</strong> (gaz d'échappement), <strong>les rejets industriels</strong> (usines) et <strong>l'incinération des déchets</strong> (brûlage à l'air libre).</p><p>2. Conséquences sur la santé : <strong>Les maladies respiratoires</strong> : l'inhalation de particules fines peut provoquer ou aggraver l'asthme, les bronchites et autres affections pulmonaires. <strong>Les allergies</strong> : la pollution peut augmenter la fréquence et la sévérité des allergies, notamment chez les enfants. <span style='font-size: 0.8em;'>[citation:1]</span></p></div>"
        },
        {
          "question": "<div style='margin-top: 15px; background-color: #fff; padding: 12px; border-radius: 8px; border-left: 5px solid #1565c0;'><p><strong>Exercice 6 : La Lutte contre la pollution de l'air (3 pts)</strong></p><p>Proposez trois moyens de lutte contre la pollution de l'air (3 pts)</p></div>",
          "reponse": "<div style='padding: 10px; background-color: #e3f2fd; border-radius: 5px; color: #0d2b3e;'><p><strong>Corrigé :</strong></p><p>Trois moyens de lutte :</p><ul><li><strong>Réduire l'usage des véhicules polluants</strong> : privilégier les transports en commun, le covoiturage ou les modes de déplacement doux (vélo, marche).</li><li><strong>Planter des arbres</strong> : les forêts et les espaces verts agissent comme des puits de carbone en absorbant le CO₂ et en produisant de l'oxygène.</li><li><strong>Promouvoir les énergies propres</strong> : remplacer les combustibles fossiles par des énergies renouvelables (solaire, éolienne) pour réduire les émissions de gaz à effet de serre.</li></ul></div>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
