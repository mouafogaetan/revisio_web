<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Hygiène",
  "classe": "2ème Année",
  "sequence": "Séquence 4",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Définitions et notions de base",
      "points": "4 pts",
      "enonce": "<p>Répondez aux questions suivantes en vous basant sur vos connaissances des leçons 5, 6 et 7 du chapitre 2.</p>",
      "questions": [
        {
          "question": "<p><strong>1) (1 pt)</strong> Citez les quatre principaux constituants de l'air en précisant leur pourcentage approximatif.</p>",
          "reponse": "<p>Les quatre principaux constituants de l'air sont : l'azote (N₂) ≈ 78%, l'oxygène (O₂) ≈ 21%, l'argon (Ar) ≈ 0,93% et le dioxyde de carbone (CO₂) ≈ 0,04%.</p>"
        },
        {
          "question": "<p><strong>2) (1 pt)</strong> Donnez la définition de la pollution de l'air.</p>",
          "reponse": "<p>La pollution de l'air est la modification de la composition naturelle de l'atmosphère par l'introduction de substances nocives (gaz toxiques, particules fines, composés organiques volatils, etc.) d'origine naturelle ou anthropique, ayant des effets néfastes sur la santé humaine, les écosystèmes et le climat.</p>"
        },
        {
          "question": "<p><strong>3) (2 pts)</strong> Énumérez trois usages naturels et trois usages artificiels de l'air.</p>",
          "reponse": "<p><strong>Usages naturels :</strong><br>1. La respiration des êtres vivants (oxygène).<br>2. La photosynthèse des plantes (dioxyde de carbone).<br>3. La dispersion des graines et la pollinisation par le vent.<br><br><strong>Usages artificiels :</strong><br>1. Alimentation des moteurs à combustion (oxygène).<br>2. Fabrication de boissons gazeuses (dioxyde de carbone).<br>3. Production d'énergie éolienne (énergie cinétique du vent).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Causes et conséquences de la pollution de l'air",
      "points": "6 pts",
      "enonce": "<p>La pollution de l'air est un problème majeur de santé publique au Cameroun, en particulier dans les grandes villes comme Douala et Yaoundé où les taux de particules fines (PM2,5) dépassent régulièrement les normes recommandées par l'OMS.</p>",
      "questions": [
        {
          "question": "<p><strong>1) (2 pts)</strong> Identifiez quatre causes de la pollution de l'air en milieu urbain au Cameroun.</p>",
          "reponse": "<p>Les principales causes de la pollution de l'air en milieu urbain au Cameroun sont :<br>1. La circulation automobile intense (émissions de gaz d'échappement).<br>2. Les émissions industrielles (rejets des usines).<br>3. Le brûlage des déchets ménagers et des brousses.<br>4. L'utilisation de combustibles solides pour la cuisson (bois, charbon).</p>"
        },
        {
          "question": "<p><strong>2) (2 pts)</strong> Analysez les conséquences de la pollution de l'air sur la santé humaine.</p>",
          "reponse": "<p>La pollution de l'air a de nombreuses conséquences sur la santé humaine :<br>- Maladies respiratoires (asthme, bronchites, pneumonies).<br>- Maladies cardiovasculaires (hypertension, infarctus).<br>- Cancers (notamment le cancer du poumon).<br>- Irritations des yeux, de la gorge et des muqueuses.<br>- Aggravation des allergies.<br>- Impact sur le développement des enfants (retard de croissance pulmonaire).<br>- Augmentation de la mortalité prématurée.</p>"
        },
        {
          "question": "<p><strong>3) (2 pts)</strong> Expliquez comment les émissions des véhicules contribuent à la pollution de l'air et quels sont les principaux polluants émis.</p>",
          "reponse": "<p>Les véhicules à moteur à combustion (essence ou diesel) émettent plusieurs polluants dans l'atmosphère :<br>- Le dioxyde de carbone (CO₂) : gaz à effet de serre.<br>- Les oxydes d'azote (NOx) : contribuent à la formation de l'ozone troposphérique et des pluies acides.<br>- Les particules fines (PM2,5, PM10) : irritent les voies respiratoires.<br>- Le monoxyde de carbone (CO) : gaz toxique.<br>- Les composés organiques volatils (COV) : précurseurs de l'ozone.<br><br>Ces polluants se forment lors de la combustion incomplète du carburant et sont rejetés par le pot d'échappement.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Étude de cas - Pollution à Douala",
      "points": "5 pts",
      "enonce": "<p><strong>Contexte :</strong> La ville de Douala, capitale économique du Cameroun, connaît une forte pollution de l'air due à la circulation automobile intense, aux émissions industrielles, aux feux de brousse et aux pratiques de brûlage des déchets.</p>",
      "questions": [
        {
          "question": "<p><strong>1) (2 pts)</strong> Proposez un plan d'action concret (3 mesures) pour réduire la pollution de l'air à Douala, en précisant pour chaque mesure les acteurs impliqués.</p>",
          "reponse": "<p><strong>Mesure 1 - Développement des transports en commun :</strong><br>Mettre en place des bus électriques ou au gaz naturel et créer des couloirs dédiés pour fluidifier la circulation.<br><em>Acteurs :</em> Mairie de Douala, Ministère des Transports, sociétés de transport privées.<br><br><strong>Mesure 2 - Contrôle des émissions industrielles :</strong><br>Installer des filtres à particules dans les usines et renforcer les contrôles des rejets.<br><em>Acteurs :</em> Ministère de l'Environnement, industries locales, agences de contrôle.<br><br><strong>Mesure 3 - Sensibilisation et alternatives au brûlage :</strong><br>Organiser des campagnes de sensibilisation sur les dangers du brûlage des déchets et promouvoir le compostage et le recyclage.<br><em>Acteurs :</em> ONG, communautés locales, mairie, ministère de l'Environnement.</p>"
        },
        {
          "question": "<p><strong>2) (1,5 pt)</strong> Justifiez l'importance de la plantation d'arbres en milieu urbain dans la lutte contre la pollution de l'air.</p>",
          "reponse": "<p>La plantation d'arbres en milieu urbain est une mesure efficace pour lutter contre la pollution de l'air car les arbres :<br>- Absorbent le dioxyde de carbone (CO₂) par photosynthèse.<br>- Captent les particules fines sur leurs feuilles.<br>- Produisent de l'oxygène (O₂).<br>- Régulent la température et créent des îlots de fraîcheur.<br>- Améliorent le cadre de vie et la santé mentale des populations.</p>"
        },
        {
          "question": "<p><strong>3) (1,5 pt)</strong> Évaluez l'impact potentiel de la réduction de la pollution de l'air sur la santé des populations de Douala.</p>",
          "reponse": "<p>La réduction de la pollution de l'air à Douala aurait un impact significatif sur la santé des populations :<br>- Diminution des cas de maladies respiratoires (asthme, bronchites).<br>- Réduction des maladies cardiovasculaires.<br>- Baisse de la mortalité prématurée liée à la pollution.<br>- Amélioration de la qualité de vie et de la productivité.<br>- Réduction des dépenses de santé pour les ménages et le système de santé.<br>- Protection des groupes vulnérables (enfants, personnes âgées, femmes enceintes).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Synthèse et proposition de solutions",
      "points": "5 pts",
      "enonce": "<p>La lutte contre la pollution de l'air est un défi complexe qui nécessite une approche intégrée combinant des mesures technologiques, réglementaires, comportementales et de végétalisation.</p>",
      "questions": [
        {
          "question": "<p><strong>1) (2 pts)</strong> Classez les moyens suivants dans les catégories appropriées : A- Installation de filtres à particules dans les cheminées d'usines ; B- Mise en place de zones à faibles émissions dans les villes ; C- Campagne de sensibilisation pour encourager l'utilisation du vélo ; D- Plantation d'arbres le long des routes ; E- Passage à l'utilisation de véhicules électriques.</p>",
          "reponse": "<p>A- Mesures technologiques<br>B- Mesures réglementaires<br>C- Mesures comportementales<br>D- Mesures de végétalisation<br>E- Mesures technologiques</p>"
        },
        {
          "question": "<p><strong>2) (3 pts)</strong> Proposez un programme d'éducation à l'environnement destiné aux élèves de 2ème Année sur le thème \"Lutter contre la pollution de l'air : agir ensemble pour un avenir durable\". Votre programme doit comporter au moins trois activités.</p>",
          "reponse": "<p><strong>Programme d'éducation à l'environnement pour les élèves de 2ème Année</strong><br><br><strong>Objectif :</strong> Sensibiliser les élèves à la pollution de l'air et les encourager à adopter des comportements éco-responsables.<br><br><strong>Activité 1 - Atelier de mesure de la qualité de l'air (2h) :</strong> Utilisation de capteurs simples pour mesurer les particules fines à différents endroits de l'école (près de la route, dans la cour, en classe). Comparaison des résultats et discussion sur les sources de pollution.<br><br><strong>Activité 2 - Jeu de rôle : \"Ma ville durable\" (2h) :</strong> Simulation d'un conseil municipal où les élèves, répartis en groupes (citoyens, industriels, écologistes, élus), débattent de solutions pour réduire la pollution de l'air et prennent des décisions.<br><br><strong>Activité 3 - Projet de végétalisation (sur plusieurs semaines) :</strong> Plantation d'arbres et d'arbustes autour de l'école. Suivi de la croissance et étude de l'impact sur la température et l'ambiance.<br><br><strong>Activité 4 - Campagne de sensibilisation (1 semaine) :</strong> Création d'affiches, de sketchs ou de vidéos pour sensibiliser la communauté scolaire et les familles aux gestes quotidiens qui réduisent la pollution (transports doux, réduction des déchets, économie d'énergie).<br><br><strong>Activité 5 - Sortie pédagogique :</strong> Visite d'une installation de traitement des déchets ou d'un site de production d'énergie renouvelable (si accessible).</p>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
