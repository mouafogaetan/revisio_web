<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Hygiène",
  "classe": "2ème Année",
  "sequence": "Séquence 1",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Évaluation des connaissances sur les comportements émergents (10 pts)",
      "points": "10 pts",
      "enonce": "<div style='font-size:1.1em; line-height:1.8; padding:12px; background:#f8f9fa; border-radius:8px; color:#222;'><p>Pour chacune des affirmations suivantes, dites si elle est <strong>vraie</strong> ou <strong>fausse</strong> en justifiant brièvement votre réponse.</p></div>",
      "questions": [
        {
          "question": "<div style='font-weight:bold; margin-top:15px;'>1) (2 pts) La pédophilie est une orientation sexuelle comme l'homosexualité.</div>",
          "reponse": "<div style='background:#e7f3e7; padding:12px; border-radius:6px; border-left:5px solid #2a7a2a; color:#1a3a1a;'><strong>Réponse : Faux</strong><br><br>La pédophilie est un trouble psychiatrique caractérisé par une attirance sexuelle envers des enfants, ce qui est un crime. L'homosexualité est une orientation sexuelle entre adultes consentants et n'est pas un trouble mental.</div>"
        },
        {
          "question": "<div style='font-weight:bold; margin-top:15px;'>2) (2 pts) L'inceste est une relation sexuelle entre membres d'une même famille, autorisée par la loi dans certains pays.</div>",
          "reponse": "<div style='background:#e7f3e7; padding:12px; border-radius:6px; border-left:5px solid #2a7a2a; color:#1a3a1a;'><strong>Réponse : Faux</strong><br><br>L'inceste est interdit par la loi dans la quasi-totalité des pays, y compris au Cameroun. C'est un crime grave qui peut entraîner de lourdes sanctions pénales.</div>"
        },
        {
          "question": "<div style='font-weight:bold; margin-top:15px;'>3) (2 pts) Le viol est un acte de pénétration sexuelle commis sans le consentement de la personne.</div>",
          "reponse": "<div style='background:#e7f3e7; padding:12px; border-radius:6px; border-left:5px solid #2a7a2a; color:#1a3a1a;'><strong>Réponse : Vrai</strong><br><br>Le viol est un crime qui consiste en un acte de pénétration sexuelle imposé à une personne sans son consentement. Il peut avoir des conséquences physiques et psychologiques graves.</div>"
        },
        {
          "question": "<div style='font-weight:bold; margin-top:15px;'>4) (2 pts) L'homosexualité est un comportement émergent néfaste à la santé de la reproduction.</div>",
          "reponse": "<div style='background:#e7f3e7; padding:12px; border-radius:6px; border-left:5px solid #2a7a2a; color:#1a3a1a;'><strong>Réponse : Faux</strong><br><br>L'homosexualité est une orientation sexuelle, pas un comportement néfaste. Ce qui peut être néfaste, ce sont les discriminations et la stigmatisation dont les personnes homosexuelles peuvent être victimes.</div>"
        },
        {
          "question": "<div style='font-weight:bold; margin-top:15px;'>5) (2 pts) Un comportement émergent néfaste est une pratique ou attitude qui apparaît dans la société et peut nuire à la santé.</div>",
          "reponse": "<div style='background:#e7f3e7; padding:12px; border-radius:6px; border-left:5px solid #2a7a2a; color:#1a3a1a;'><strong>Réponse : Vrai</strong><br><br>Un comportement émergent néfaste est effectivement une pratique ou une attitude nouvelle ou qui se répand, pouvant avoir des conséquences graves sur la santé physique et mentale.</div>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Questions à Choix Multiples (QCM) (12 pts)",
      "points": "12 pts",
      "enonce": "<div style='font-size:1.1em; line-height:1.8; padding:12px; background:#f8f9fa; border-radius:8px; color:#222;'>Pour chaque question, une seule réponse est correcte. Recopiez le numéro de la question et la lettre correspondant à la bonne réponse.</div>",
      "questions": [
        {
          "question": "<div style='font-weight:bold; margin-top:15px;'>6) (2 pts) Qu'est-ce qu'une Infection Sexuellement Transmissible (IST) ?</div><div style='margin:8px 0 0 20px;'>A- Une infection qui se transmet par la nourriture<br>B- Une infection qui se transmet principalement lors de rapports sexuels non protégés<br>C- Une infection transmise par les piqûres de moustiques<br>D- Une infection héréditaire</div>",
          "reponse": "<div style='background:#e7f3e7; padding:12px; border-radius:6px; border-left:5px solid #2a7a2a; color:#1a3a1a;'><strong>Réponse : B</strong><br><br>Les IST se transmettent principalement lors de rapports sexuels non protégés. Certaines peuvent aussi se transmettre par le sang ou de la mère à l'enfant.</div>"
        },
        {
          "question": "<div style='font-weight:bold; margin-top:15px;'>7) (2 pts) Parmi les IST suivantes, laquelle est d'origine bactérienne ?</div><div style='margin:8px 0 0 20px;'>A- L'hépatite B<br>B- Le VIH<br>C- La chlamydia<br>D- L'herpès génital</div>",
          "reponse": "<div style='background:#e7f3e7; padding:12px; border-radius:6px; border-left:5px solid #2a7a2a; color:#1a3a1a;'><strong>Réponse : C</strong><br><br>La chlamydia est une IST d'origine bactérienne. L'hépatite B, le VIH et l'herpès génital sont d'origine virale.</div>"
        },
        {
          "question": "<div style='font-weight:bold; margin-top:15px;'>8) (2 pts) Quelle est la méthode la plus efficace pour se protéger des IST lors des rapports sexuels ?</div><div style='margin:8px 0 0 20px;'>A- La pilule contraceptive<br>B- Le préservatif (masculin ou féminin)<br>C- Le retrait avant l'éjaculation<br>D- La vaccination</div>",
          "reponse": "<div style='background:#e7f3e7; padding:12px; border-radius:6px; border-left:5px solid #2a7a2a; color:#1a3a1a;'><strong>Réponse : B</strong><br><br>Le préservatif est la méthode la plus efficace pour se protéger des IST car il crée une barrière physique empêchant le contact entre les muqueuses et les fluides corporels.</div>"
        },
        {
          "question": "<div style='font-weight:bold; margin-top:15px;'>9) (2 pts) L'hépatite B peut être prévenue par :</div><div style='margin:8px 0 0 20px;'>A- Des antibiotiques<br>B- Un vaccin<br>C- Une bonne alimentation<br>D- Du repos</div>",
          "reponse": "<div style='background:#e7f3e7; padding:12px; border-radius:6px; border-left:5px solid #2a7a2a; color:#1a3a1a;'><strong>Réponse : B</strong><br><br>Il existe un vaccin contre l'hépatite B, recommandé pour les populations à risque. Les antibiotiques n'ont aucun effet sur les virus comme celui de l'hépatite B.</div>"
        },
        {
          "question": "<div style='font-weight:bold; margin-top:15px;'>10) (2 pts) Qu'est-ce qu'une alimentation équilibrée ?</div><div style='margin:8px 0 0 20px;'>A- Une alimentation qui apporte tous les nutriments en quantité suffisante et dans de bonnes proportions<br>B- Une alimentation riche uniquement en protéines<br>C- Une alimentation pauvre en glucides<br>D- Une alimentation composée uniquement de fruits et légumes</div>",
          "reponse": "<div style='background:#e7f3e7; padding:12px; border-radius:6px; border-left:5px solid #2a7a2a; color:#1a3a1a;'><strong>Réponse : A</strong><br><br>Une alimentation équilibrée est une alimentation variée qui apporte à l'organisme tous les nutriments (protides, glucides, lipides, vitamines, minéraux) en quantité suffisante.</div>"
        },
        {
          "question": "<div style='font-weight:bold; margin-top:15px;'>11) (2 pts) Le botulisme est une intoxication alimentaire causée par :</div><div style='margin:8px 0 0 20px;'>A- Un virus<br>B- Un parasite<br>C- Une toxine bactérienne<br>D- Un champignon</div>",
          "reponse": "<div style='background:#e7f3e7; padding:12px; border-radius:6px; border-left:5px solid #2a7a2a; color:#1a3a1a;'><strong>Réponse : C</strong><br><br>Le botulisme est causé par une toxine produite par la bactérie Clostridium botulinum. C'est une intoxication alimentaire grave qui peut provoquer une paralysie.</div>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Étude de cas sur la pollution de l'air (8 pts)",
      "points": "8 pts",
      "enonce": "<div style='font-size:1.1em; line-height:1.8; padding:12px; background:#f8f9fa; border-radius:8px; color:#222;'><p><strong>Situation :</strong> Dans une grande ville du Cameroun, les habitants se plaignent de difficultés respiratoires. La municipalité constate une augmentation des niveaux de dioxyde d'azote (NO₂) et de particules fines.</p><p><strong>Consigne :</strong> Répondez aux questions suivantes.</p></div>",
      "questions": [
        {
          "question": "<div style='font-weight:bold; margin-top:15px;'>12) (4 pts) Identifiez deux sources possibles de cette pollution de l'air et justifiez votre réponse.</div>",
          "reponse": "<div style='background:#e7f3e7; padding:12px; border-radius:6px; border-left:5px solid #2a7a2a; color:#1a3a1a;'><strong>Réponse attendue :</strong><br><br>1) <strong>Trafic automobile</strong> : Le dioxyde d'azote (NO₂) est principalement émis par les moteurs à combustion (voitures, camions).<br>2) <strong>Activités industrielles</strong> : Les usines peuvent émettre des particules fines et du dioxyde d'azote.</div>"
        },
        {
          "question": "<div style='font-weight:bold; margin-top:15px;'>13) (4 pts) Proposez deux mesures concrètes que la municipalité pourrait prendre pour réduire cette pollution.</div>",
          "reponse": "<div style='background:#e7f3e7; padding:12px; border-radius:6px; border-left:5px solid #2a7a2a; color:#1a3a1a;'><strong>Réponse attendue :</strong><br><br>1) <strong>Développer les transports en commun</strong> (bus, tramway) pour réduire le nombre de voitures en circulation.<br>2) <strong>Mettre en place des zones à faibles émissions</strong> où les véhicules polluants sont interdits.</div>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
