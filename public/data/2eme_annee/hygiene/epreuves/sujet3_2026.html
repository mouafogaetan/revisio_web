<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Hygiène",
  "classe": "2ème Année",
  "sequence": "Séquence 3",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Questions à choix multiples",
      "points": "4 pts",
      "enonce": "<div style='padding: 10px; font-size: 16px; line-height: 1.8;'><p>Pour chaque question, une seule proposition est juste. Recopier le tableau ci-dessous et faire correspondre à chaque numéro la lettre indiquant la bonne réponse.</p><div style='background-color: #f5f5f5; padding: 15px; border-radius: 8px; margin: 10px 0;'><table style='width: 100%; border-collapse: collapse; font-size: 14px;'><tr style='background-color: #1976d2; color: white;'><th style='padding: 8px; border: 1px solid #ddd;'>N°</th><th style='padding: 8px; border: 1px solid #ddd;'>Question</th><th style='padding: 8px; border: 1px solid #ddd;'>Réponse</th></tr><tr><td style='padding: 8px; border: 1px solid #ddd;'>1</td><td style='padding: 8px; border: 1px solid #ddd;'>Lequel de ces gaz est le plus abondant dans l'air ?</td><td style='padding: 8px; border: 1px solid #ddd;'>a) Oxygène b) Azote c) Dioxyde de carbone d) Argon</td></tr><tr><td style='padding: 8px; border: 1px solid #ddd;'>2</td><td style='padding: 8px; border: 1px solid #ddd;'>Parmi ces maladies, laquelle est une infection sexuellement transmissible ?</td><td style='padding: 8px; border: 1px solid #ddd;'>a) Paludisme b) Choléra c) Chlamydia d) Tuberculose</td></tr><tr><td style='padding: 8px; border: 1px solid #ddd;'>3</td><td style='padding: 8px; border: 1px solid #ddd;'>Le VIH se transmet par :</td><td style='padding: 8px; border: 1px solid #ddd;'>a) L'air b) Une poignée de main c) Un rapport sexuel non protégé d) Un baiser</td></tr><tr><td style='padding: 8px; border: 1px solid #ddd;'>4</td><td style='padding: 8px; border: 1px solid #ddd;'>Quelle est la cause principale de la pollution de l'air dans les grandes villes camerounaises ?</td><td style='padding: 8px; border: 1px solid #ddd;'>a) Les éruptions volcaniques b) Les émissions des véhicules c) Les tempêtes de sable d) Les marécages</td></tr></table></div></div>",
      "questions": [
        {
          "question": "1) 1-b, 2-c, 3-c, 4-b. Justifier brièvement chaque choix.",
          "reponse": "<div><strong>1-b :</strong> L'azote (N₂) représente 78% de l'air.<br><strong>2-c :</strong> La chlamydia est une IST bactérienne, contrairement au paludisme (transmis par moustique), au choléra (alimentaire) et à la tuberculose (aérienne).<br><strong>3-c :</strong> Le VIH se transmet par les rapports sexuels non protégés, le sang contaminé ou de la mère à l'enfant.<br><strong>4-b :</strong> Les émissions des véhicules sont la principale source de pollution de l'air dans les grandes villes camerounaises comme Douala et Yaoundé.</div>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Alimentation équilibrée",
      "points": "6 pts",
      "enonce": "<div style='padding: 10px; font-size: 16px; line-height: 1.8;'><p>Une alimentation équilibrée est essentielle pour rester en bonne santé. Elle doit apporter à l'organisme tous les nutriments dont il a besoin en quantités suffisantes.</p><div style='background-color: #e8f5e9; padding: 15px; border-radius: 8px; margin: 10px 0;'><p><strong>Document :</strong> Les 7 groupes d'aliments</p><ul style='list-style-type: disc; padding-left: 20px;'><li>Féculents, céréales (riz, manioc, pain, maïs)</li><li>Viandes, poissons, œufs</li><li>Produits laitiers (lait, fromage, yaourt)</li><li>Matières grasses (huile, beurre)</li><li>Fruits et légumes</li><li>Sucreries (sucre, miel, confiture)</li><li>Eau et boissons</li></ul></div></div>",
      "questions": [
        {
          "question": "1) Définir ce qu'est une alimentation équilibrée.",
          "reponse": "Une alimentation équilibrée est une alimentation qui apporte à l'organisme tous les nutriments nécessaires (glucides, lipides, protides, vitamines, minéraux, eau) en quantités suffisantes et dans de bonnes proportions. Elle doit être variée et adaptée aux besoins de chaque individu (âge, sexe, activité physique)."
        },
        {
          "question": "2) Identifier, pour chaque repas suivant, les groupes d'aliments présents :<br>a) Petit-déjeuner : pain beurré + café au lait + orange<br>b) Déjeuner : riz + poulet + sauce tomate + salade + eau",
          "reponse": "<div><strong>a) Petit-déjeuner :</strong> pain (féculents), beurre (matières grasses), lait (produits laitiers), orange (fruits).<br><strong>b) Déjeuner :</strong> riz (féculents), poulet (viandes), tomate et salade (légumes), eau (eau et boissons).</div>"
        },
        {
          "question": "3) Expliquer pourquoi il est recommandé de consommer au moins 5 fruits et légumes par jour.",
          "reponse": "Les fruits et légumes sont riches en vitamines (A, C, etc.), en minéraux, en fibres alimentaires et en antioxydants. Ils permettent de :<br>- Renforcer le système immunitaire<br>- Faciliter le transit intestinal<br>- Réduire le risque de maladies cardiovasculaires et de certains cancers<br>- Maintenir un poids santé grâce à leur faible densité énergétique"
        },
        {
          "question": "4) Proposer un menu équilibré pour une journée en utilisant des aliments locaux accessibles au Cameroun.",
          "reponse": "<div><strong>Petit-déjeuner :</strong> Bouillie de maïs + lait + banane<br><strong>Déjeuner :</strong> Riz + poisson fumé + sauce aux légumes (chou, carotte, tomate) + huile végétale + eau<br><strong>Goûter :</strong> Fruit (mangue, orange) + eau<br><strong>Dîner :</strong> Manioc + viande de bœuf + légumes verts (épinards) + eau</div>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Pollution de l'air et santé",
      "points": "6 pts",
      "enonce": "<div style='padding: 10px; font-size: 16px; line-height: 1.8;'><p>La pollution de l'air est un problème majeur de santé publique dans les grandes villes camerounaises comme Douala et Yaoundé. Elle est due à diverses causes et a des conséquences graves sur la santé humaine.</p></div>",
      "questions": [
        {
          "question": "1) Citer trois causes humaines de la pollution de l'air.",
          "reponse": "Trois causes humaines de la pollution de l'air sont :<br>- Les émissions des véhicules (transport routier)<br>- Les rejets des industries (usines, centrales thermiques)<br>- La combustion domestique (cuisine au charbon ou au bois, incinération des déchets)"
        },
        {
          "question": "2) Analyser les conséquences de la pollution de l'air sur la santé humaine.",
          "reponse": "La pollution de l'air a des conséquences graves sur la santé :<br><strong>À court terme :</strong> irritations oculaires, maux de tête, fatigue, crises d'asthme, infections respiratoires.<br><strong>À long terme :</strong> maladies respiratoires chroniques (bronchite, asthme), maladies cardiovasculaires (infarctus, AVC), cancers du poumon, baisse de l'espérance de vie.<br><strong>Populations vulnérables :</strong> enfants (poumons en développement), personnes âgées, femmes enceintes, personnes souffrant de maladies chroniques."
        },
        {
          "question": "3) Proposer trois moyens de lutte contre la pollution de l'air au niveau individuel et collectif.",
          "reponse": "<div><strong>Au niveau individuel :</strong><br>- Utiliser les transports en commun ou le vélo plutôt que la voiture<br>- Réduire sa consommation d'énergie (éteindre les appareils, utiliser des ampoules LED)<br>- Planter des arbres autour de son domicile<br><br><strong>Au niveau collectif :</strong><br>- Mettre en place des réglementations sur les émissions industrielles<br>- Développer les énergies renouvelables (solaire, éolienne)<br>- Promouvoir l'utilisation de foyers améliorés pour réduire les émissions liées à la cuisson<br>- Sensibiliser les populations aux risques de la pollution de l'air</div>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : IST et prévention",
      "points": "4 pts",
      "enonce": "<div style='padding: 10px; font-size: 16px; line-height: 1.8;'><p>Les infections sexuellement transmissibles (IST) sont des infections qui se transmettent principalement par voie sexuelle. Elles représentent un problème majeur de santé publique, particulièrement chez les jeunes.</p></div>",
      "questions": [
        {
          "question": "1) Décrire deux IST autres que le VIH/SIDA.",
          "reponse": "<div><strong>Chlamydia :</strong> IST bactérienne qui peut être asymptomatique. Chez la femme, elle peut causer des douleurs pelviennes, des pertes vaginales et, si non traitée, une stérilité. Chez l'homme, elle peut provoquer des pertes urétrales et des douleurs.<br><br><strong>Hépatite B :</strong> IST virale qui attaque le foie. Elle peut être asymptomatique ou provoquer une jaunisse, une fatigue, des douleurs abdominales. Elle peut évoluer vers une cirrhose ou un cancer du foie. Elle se transmet par les rapports sexuels et par le sang.</div>"
        },
        {
          "question": "2) Énumérer les trois principaux modes de transmission du VIH.",
          "reponse": "Les trois principaux modes de transmission du VIH sont :<br>1. Transmission sexuelle (rapports non protégés avec une personne infectée)<br>2. Transmission sanguine (partage de seringues, transfusion de sang contaminé, instruments médicaux non stérilisés)<br>3. Transmission mère-enfant (pendant la grossesse, l'accouchement ou l'allaitement)"
        },
        {
          "question": "3) Proposer deux moyens de prévention contre les IST.",
          "reponse": "Deux moyens de prévention contre les IST sont :<br>1. L'utilisation systématique du préservatif (masculin ou féminin) lors de chaque rapport sexuel<br>2. Le dépistage régulier pour connaître son statut et celui de son partenaire<br>3. La fidélité dans une relation stable où les deux partenaires ont été dépistés<br>4. La vaccination contre l'hépatite B pour les personnes à risque"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
