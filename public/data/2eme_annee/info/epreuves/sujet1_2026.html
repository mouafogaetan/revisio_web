<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Informatique",
  "classe": "2ème année",
  "sequence": "Séquence 1",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Gestion du compte utilisateur",
      "points": "5 pts",
      "enonce": "<div style='padding: 10px;'><p>L'ordinateur que vous utilisez est partagé avec d'autres personnes. Vous devez gérer votre profil utilisateur correctement.</p></div>",
      "questions": [
        {
          "question": "1) Définir ce qu'est un compte utilisateur sur un ordinateur. (1 pt)",
          "reponse": "Un compte utilisateur est un espace personnel sur un ordinateur qui permet à une personne de se connecter et d'avoir ses propres fichiers, paramètres et préférences, tout en étant protégé par un nom d'utilisateur et un mot de passe."
        },
        {
          "question": "2) Citer deux raisons pour lesquelles il est important d'avoir un mot de passe fort pour son compte utilisateur. (2 pts)",
          "reponse": "1. Protéger ses données personnelles contre les accès non autorisés.<br>2. Empêcher qu'une autre personne ne modifie ses paramètres ou ne supprime ses fichiers."
        },
        {
          "question": "3) Expliquer la différence entre 'Fermer la session' et 'Éteindre l'ordinateur'. (1 pt)",
          "reponse": "'Fermer la session' permet de quitter son espace utilisateur tout en laissant l'ordinateur allumé, ce qui permet à un autre utilisateur de se connecter. 'Éteindre l'ordinateur' coupe complètement l'alimentation de la machine."
        },
        {
          "question": "4) Décrire les étapes pour modifier son mot de passe sous Windows. (1 pt)",
          "reponse": "1. Appuyer sur Ctrl+Alt+Suppr.<br>2. Cliquer sur 'Changer un mot de passe'.<br>3. Saisir l'ancien mot de passe.<br>4. Saisir le nouveau mot de passe et le confirmer.<br>5. Cliquer sur 'OK' ou 'Valider'."
        }
      ]
    },
    {
      "titre": "Exercice 2 : Environnement de travail et caractéristiques d'un ordinateur",
      "points": "6 pts",
      "enonce": "<div style='padding: 10px;'><p>Le bureau d'un système d'exploitation est l'espace de travail principal de l'utilisateur. Les ordinateurs possèdent également des caractéristiques matérielles et logicielles qu'il faut connaître.</p></div>",
      "questions": [
        {
          "question": "1) Décrire les principaux éléments que l'on trouve sur le bureau d'un système d'exploitation graphique. (2 pts)",
          "reponse": "Le bureau est composé :<br>- Des icônes (raccourcis vers des programmes, fichiers ou dossiers)<br>- De la barre des tâches (contenant le menu Démarrer, les applications ouvertes et l'horloge)<br>- Du fond d'écran (image d'arrière-plan)<br>- De la corbeille (pour les fichiers supprimés)"
        },
        {
          "question": "2) Identifier et expliquer deux caractéristiques matérielles et deux caractéristiques logicielles d'un ordinateur. (2 pts)",
          "reponse": "**Caractéristiques matérielles :**<br>- Le processeur (CPU) : sa vitesse en GHz détermine la rapidité d'exécution des tâches.<br>- La RAM : sa capacité en Go détermine le nombre de programmes pouvant être ouverts simultanément.<br><br>**Caractéristiques logicielles :**<br>- Le système d'exploitation : Windows, macOS ou Linux.<br>- Les logiciels installés : suite bureautique, navigateur, etc."
        },
        {
          "question": "3) Comment modifier la résolution de l'écran sous Windows ? (1 pt)",
          "reponse": "1. Faire un clic droit sur le bureau.<br>2. Sélectionner 'Paramètres d'affichage'.<br>3. Faire défiler jusqu'à 'Résolution d'affichage'.<br>4. Choisir la résolution souhaitée dans le menu déroulant.<br>5. Valider en cliquant sur 'Appliquer'."
        },
        {
          "question": "4) L'environnement multifenêtres permet d'ouvrir plusieurs fenêtres simultanément. Citer deux actions possibles sur une fenêtre. (1 pt)",
          "reponse": "1. **Agrandir/Réduire** : Modifier la taille de la fenêtre (boutons en haut à droite).<br>2. **Déplacer** : Cliquer sur la barre de titre et glisser la fenêtre vers un autre emplacement."
        }
      ]
    },
    {
      "titre": "Exercice 3 : Organisation des données et ordonnancement",
      "points": "5 pts",
      "enonce": "<div style='padding: 10px;'><p>L'organisation des données sur un ordinateur est essentielle pour retrouver facilement ses fichiers. L'ordonnancement est une compétence importante en informatique.</p></div>",
      "questions": [
        {
          "question": "1) Définir ce qu'est un fichier et ce qu'est un dossier. (1 pt)",
          "reponse": "Un **fichier** est une unité de stockage qui contient des données (texte, image, vidéo, programme, etc.). Un **dossier** est un conteneur qui permet d'organiser et de regrouper plusieurs fichiers ou dossiers."
        },
        {
          "question": "2) Expliquer comment organiser efficacement ses fichiers et dossiers. (2 pts)",
          "reponse": "Pour organiser efficacement ses fichiers :<br>- Créer une arborescence logique (dossiers principaux puis sous-dossiers).<br>- Utiliser des noms de fichiers et dossiers clairs et explicites.<br>- Regrouper les fichiers par catégorie (ex: 'Cours', 'Photos', 'Travail').<br>- Supprimer régulièrement les fichiers inutiles."
        },
        {
          "question": "3) Qu'est-ce que l'ordonnancement des tâches ? (1 pt)",
          "reponse": "L'ordonnancement est la planification et l'organisation des tâches dans le temps, en respectant des contraintes (ordre, durée, ressources) pour optimiser l'exécution des activités."
        },
        {
          "question": "4) Donner un exemple de problème d'ordonnancement de la vie quotidienne. (1 pt)",
          "reponse": "Organiser un emploi du temps pour la journée : se lever, prendre le petit-déjeuner, aller au travail, etc. Certaines actions doivent être faites avant d'autres (ex: prendre le petit-déjeuner avant d'aller au travail)."
        }
      ]
    },
    {
      "titre": "Exercice 4 : Traitement de texte",
      "points": "4 pts",
      "enonce": "<div style='padding: 10px;'><p>Le traitement de texte est un outil indispensable pour produire des documents.</p></div>",
      "questions": [
        {
          "question": "1) Citer trois logiciels de traitement de texte. (1 pt)",
          "reponse": "1. Microsoft Word<br>2. LibreOffice Writer<br>3. Google Docs"
        },
        {
          "question": "2) Décrire la fenêtre d'un logiciel de traitement de texte en citant ses principales parties. (1 pt)",
          "reponse": "La fenêtre d'un traitement de texte est composée de :<br>- La barre de titre (nom du document et du logiciel)<br>- Le ruban ou barre d'outils (avec les onglets et les boutons de commande)<br>- La zone de travail (où l'on saisit et met en forme le texte)<br>- La barre d'état (affichant le nombre de pages, le zoom, etc.)"
        },
        {
          "question": "3) Expliquer la différence entre copier-coller et couper-coller. (1 pt)",
          "reponse": "Copier-coller (Ctrl+C puis Ctrl+V) crée une copie du texte sélectionné et la colle à l'endroit souhaité, tout en conservant le texte original. Couper-coller (Ctrl+X puis Ctrl+V) supprime le texte original et le colle à l'endroit souhaité."
        },
        {
          "question": "4) Pourquoi est-il important d'utiliser le correcteur d'orthographe avant d'imprimer un document ? (1 pt)",
          "reponse": "Le correcteur d'orthographe permet de détecter et de corriger les fautes d'orthographe et de grammaire, ce qui améliore la qualité et le professionnalisme du document final."
        }
      ]
    },
    {
      "titre": "Exercice 5 : Internet, navigateurs et moteurs de recherche",
      "points": "5 pts",
      "enonce": "<div style='padding: 10px;'><p>Internet est un réseau mondial qui offre de nombreuses ressources. Les navigateurs et les moteurs de recherche sont des outils essentiels pour y accéder.</p></div>",
      "questions": [
        {
          "question": "1) Définir le terme 'Internet'. (1 pt)",
          "reponse": "Internet est un réseau mondial de communication qui relie des millions d'ordinateurs à travers le monde, permettant l'échange d'informations et de données."
        },
        {
          "question": "2) Citer deux navigateurs Internet et deux moteurs de recherche. (2 pts)",
          "reponse": "**Navigateurs :**<br>- Google Chrome<br>- Mozilla Firefox<br><br>**Moteurs de recherche :**<br>- Google<br>- Bing"
        },
        {
          "question": "3) Expliquer la différence entre un navigateur et un moteur de recherche. (1 pt)",
          "reponse": "Un **navigateur** est un logiciel qui permet d'afficher et de consulter des pages Web (ex: Chrome, Firefox). Un **moteur de recherche** est un service en ligne qui permet de trouver des pages Web en saisissant des mots-clés (ex: Google, Bing)."
        },
        {
          "question": "4) Quels sont les éléments à vérifier pour évaluer la fiabilité d'une source trouvée sur Internet ? (1 pt)",
          "reponse": "Pour évaluer la fiabilité d'une source Internet :<br>- Vérifier l'auteur et ses compétences.<br>- Vérifier la date de publication.<br>- Vérifier le site (extension .edu, .gouv, etc.).<br>- Vérifier si le site cite ses sources.<br>- Vérifier l'objectivité du contenu."
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
