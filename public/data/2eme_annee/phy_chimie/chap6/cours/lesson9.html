<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Présentation mobile</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' },
            options: { skipHtmlTypes: 'script' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 500px;
        margin: 0 auto;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    .slide-header {
        flex-shrink: 0;
        padding: 18px 16px 10px 16px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        z-index: 10;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .slide-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
    }

    .content-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 18px 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        flex-shrink: 0;
    }

    .content-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .content-card li {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        line-height: 1.5;
    }

    .content-card li:last-child {
        border-bottom: none;
    }

    .bullet-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
    }

    .math-block {
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        overflow-x: auto;
        flex-shrink: 0;
        margin: 4px 0;
    }

    .math-block .math {
        font-size: 1.2rem;
        color: #e2e8f0;
    }

    .note-box {
        background: rgba(96, 165, 250, 0.08);
        border-left: 4px solid #60a5fa;
        padding: 12px 16px;
        border-radius: 12px;
        font-style: italic;
        font-size: 0.9rem;
        color: #cbd5e1;
        flex-shrink: 0;
    }

    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        border-radius: 0;
        flex-direction: column;
    }

    .loading-card {
        background: #1e293b;
        padding: 32px 28px;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #334155;
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px auto;
    }

    .loading-text {
        font-weight: 600;
        font-size: 1.1rem;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    .loading-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 16px;
    }
    .loading-progress {
        height: 3px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        animation: loadingProgress 30s ease-out forwards;
    }

    .loading-timeout {
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 12px;
    }

    .btn-cancel-loading {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 40px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #f87171;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }

    .btn-cancel-loading:active {
        transform: scale(0.94);
        background: rgba(239, 68, 68, 0.25);
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
    }

    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .slide-counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255,255,255,0.05);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(255,255,255,0.04);
    }

    .status-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 30px;
        background: rgba(96, 165, 250, 0.12);
        color: #93bbfc;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
    }

    .status-badge .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: pulse-dot 1.2s infinite;
        flex-shrink: 0;
    }

    .status-badge.idle .dot {
        animation: none;
        background: #64748b;
    }
    .status-badge.speaking .dot {
        background: #34d399;
        animation: pulse-dot 0.8s infinite;
    }
    .status-badge.error .dot {
        background: #f87171;
        animation: none;
    }
    .status-badge.paused .dot {
        animation: none;
        background: #fbbf24;
    }
    .status-badge.waiting .dot {
        animation: pulse-dot 1.5s infinite;
        background: #fbbf24;
    }
    .status-badge.loading .dot {
        animation: pulse-dot 0.5s infinite;
        background: #60a5fa;
    }

    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.7); }
    }

    .footer-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(255,255,255,0.1);
    }

    .btn-secondary {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-play {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
        min-width: 80px;
        justify-content: center;
    }
    .btn-play:active {
        background: rgba(52, 211, 153, 0.25);
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
    }

    .auto-indicator {
        font-size: 0.65rem;
        color: #64748b;
        text-align: center;
        letter-spacing: 0.3px;
        padding: 2px 0;
    }

    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.2rem;
        }
        .content-card li {
            font-size: 0.9rem;
            padding: 8px 0;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .btn-play {
            min-width: 60px;
        }
        .footer-buttons {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
        .loading-card {
            padding: 20px 16px;
        }
        .math-block .math {
            font-size: 1rem;
        }
    }

    @media (min-width: 600px) {
        .app-container {
            max-width: 480px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
        .loading-overlay {
            border-radius: 32px;
        }
    }

    /* Mode jour (par défaut) */
    html, body {
        background: #f0f4f8 !important;
        color: #1a202c !important;
    }
    .app-container {
        background: linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%) !important;
    }
    .slide-header {
        background: rgba(255, 255, 255, 0.85) !important;
        border-bottom: 1px solid rgba(0,0,0,0.08) !important;
    }
    .slide-header h1 {
        background: linear-gradient(135deg, #2b6cb0, #6b46c1) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        background-clip: text !important;
    }
    .slide-footer {
        background: rgba(255, 255, 255, 0.9) !important;
        border-top: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card {
        background: rgba(255,255,255,0.8) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card li {
        border-bottom: 1px solid rgba(0,0,0,0.05) !important;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.12) !important;
        border-left: 4px solid #4299e1 !important;
        color: #2c3e50 !important;
    }
    .math-block {
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .math-block .math {
        color: #2d3748 !important;
    }
    .slide-counter {
        color: #4a5568 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .status-badge {
        background: rgba(96, 165, 250, 0.15) !important;
        color: #2b6cb0 !important;
        border: 1px solid rgba(96, 165, 250, 0.15) !important;
    }
    .btn {
        color: #2d3748 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .btn-secondary {
        background: rgba(0,0,0,0.04) !important;
        border-color: rgba(0,0,0,0.08) !important;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15) !important;
        border-color: rgba(52, 211, 153, 0.2) !important;
        color: #38a169 !important;
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15) !important;
        border-color: rgba(251, 191, 36, 0.2) !important;
        color: #d69e2e !important;
    }
    .auto-indicator {
        color: #718096 !important;
    }
    .loading-card {
        background: #ffffff !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .loading-text {
        color: #1a202c !important;
    }
    .loading-sub {
        color: #4a5568 !important;
    }
</style>
</head>
<body>

<div class="app-container">

    <header class="slide-header">
        <h1 id="slideTitle">Chargement...</h1>
    </header>

    <main class="slide-body" id="slideBody"></main>

    <!-- LOADING OVERLAY AVEC BOUTON ANNULER -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Préparation vocale...</div>
            <div class="loading-sub" id="loadingSub">Synthèse en cours</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loadingProgressBar"></div>
            </div>
            <div class="loading-timeout" id="loadingTimeout">⏱️ 30 secondes maximum</div>
            <button class="btn-cancel-loading" id="cancelLoadingBtn">
                <span>✕</span> Annuler
            </button>
        </div>
    </div>

    <footer class="slide-footer">
        <div class="footer-top">
            <span class="slide-counter" id="slideCounter">1 / 3</span>
            <span class="status-badge idle" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">Prêt</span>
            </span>
        </div>

        <div class="footer-buttons">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-secondary" id="replayBtn">
                <span class="btn-icon">🔁</span> <span class="btn-label">Relire</span>
            </button>
            <button class="btn btn-play" id="playBtn">
                <span class="btn-icon">▶</span> <span class="btn-label">Play</span>
            </button>
        </div>

        <div class="auto-indicator" id="autoIndicator">⏸ Lecture manuelle</div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // SLIDES
    // ================================================================
    const slides = [
  {
    "titre": "Introduction aux réactions chimiques",
    "contenu": "<div style='background: linear-gradient(135deg, #1a365d, #2b6cb0); color: white; padding: 20px; border-radius: 16px;'>\n  <h2 style='color: #fbd38d; font-size: 1.3em; margin-top: 0;'>🧪 Les réactions chimiques dans notre vie</h2>\n  <p style='font-size: 1em; line-height: 1.6;'>Les réactions chimiques sont partout autour de nous :</p>\n  <div style='display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px;'>\n    <div style='background: rgba(255,255,255,0.15); padding: 12px; border-radius: 8px; text-align: center;'>\n      <div style='font-size: 2em;'>🔥</div>\n      <p style='margin: 4px 0 0; font-size: 0.9em;'>Combustion (feu, moteurs)</p>\n    </div>\n    <div style='background: rgba(255,255,255,0.15); padding: 12px; border-radius: 8px; text-align: center;'>\n      <div style='font-size: 2em;'>🍞</div>\n      <p style='margin: 4px 0 0; font-size: 0.9em;'>Cuisson (pain, gâteaux)</p>\n    </div>\n    <div style='background: rgba(255,255,255,0.15); padding: 12px; border-radius: 8px; text-align: center;'>\n      <div style='font-size: 2em;'>🦷</div>\n      <p style='margin: 4px 0 0; font-size: 0.9em;'>Digestion des aliments</p>\n    </div>\n    <div style='background: rgba(255,255,255,0.15); padding: 12px; border-radius: 8px; text-align: center;'>\n      <div style='font-size: 2em;'>🌱</div>\n      <p style='margin: 4px 0 0; font-size: 0.9em;'>Photosynthèse (plantes)</p>\n    </div>\n  </div>\n  <p style='margin-top: 12px; font-style: italic; text-align: center;'>\"Les réactions chimiques transforment la matière !\"</p>\n</div>",
    "texteParle": "Bonjour à tous. Aujourd'hui, nous allons plonger dans le monde fascinant des réactions chimiques. Une réaction chimique, c'est une transformation de la matière. On en voit tous les jours : quand on allume un feu, quand on cuit un gâteau, quand on digère nos aliments, ou même quand les plantes réalisent la photosynthèse. Nous allons apprendre à décrire ces transformations à l'aide d'équations chimiques, à les équilibrer, et à faire des bilans de matière.",
    "note": "Une réaction chimique est une transformation de la matière au cours de laquelle des substances sont consommées et d'autres sont formées."
  },
  {
    "titre": "Qu'est-ce qu'une réaction chimique ?",
    "contenu": "<div style='background: #f0f4f8; color: #1e293b; padding: 18px; border-radius: 12px;'>\n  <h3 style='color: #2b6cb0; margin-top: 0;'>🔬 Définition d'une réaction chimique</h3>\n  <div style='background: white; padding: 16px; border-radius: 8px; border-left: 4px solid #2b6cb0;'>\n    <p style='font-size: 1em; line-height: 1.6;'>Une <strong>réaction chimique</strong> est une transformation au cours de laquelle :</p>\n    <ul style='font-size: 0.95em; line-height: 1.8;'>\n      <li>Des <strong>réactifs</strong> (substances de départ) sont consommés.</li>\n      <li>Des <strong>produits</strong> (substances finales) sont formés.</li>\n      <li>Les atomes se <strong>réarrangent</strong> mais ne sont ni créés ni détruits.</li>\n    </ul>\n  </div>\n  <div style='display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px;'>\n    <div style='background: #e6fffa; padding: 14px; border-radius: 8px; border: 1px solid #38b2ac; text-align: center;'>\n      <strong style='color: #2c7a7b;'>📝 Exemple</strong>\n      <p style='margin: 4px 0 0; font-size: 0.9em;'>Fer + Soufre → Sulfure de fer</p>\n      <p style='font-size: 0.85em; color: #4a5568;'>Des réactifs (fer et soufre) donnent un produit (sulfure de fer).</p>\n    </div>\n    <div style='background: #fefcbf; padding: 14px; border-radius: 8px; border: 1px solid #ecc94b; text-align: center;'>\n      <strong style='color: #975a16;'>⚠️ À retenir</strong>\n      <p style='font-size: 0.9em;'>La matière se conserve : rien ne se perd, rien ne se crée, tout se transforme.</p>\n    </div>\n  </div>\n</div>",
    "texteParle": "Commençons par la définition. Une réaction chimique est une transformation de la matière. Les substances qui réagissent sont appelées les réactifs. Les substances qui se forment sont appelées les produits. Pendant une réaction chimique, les atomes se réarrangent pour former de nouvelles molécules, mais ils ne sont ni créés ni détruits. C'est le principe de conservation de la matière. Par exemple, quand le fer réagit avec le soufre, on obtient du sulfure de fer. Les atomes de fer et de soufre se réarrangent pour former un nouveau composé.",
    "note": "Dans une réaction chimique, les réactifs sont consommés et les produits sont formés."
  },
  {
    "titre": "L'équation-bilan d'une réaction",
    "contenu": "<div style='background: #f0f4f8; color: #1e293b; padding: 18px; border-radius: 12px;'>\n  <h3 style='color: #2b6cb0; margin-top: 0;'>✏️ L'équation-bilan</h3>\n  <div style='background: white; padding: 16px; border-radius: 8px; border-left: 4px solid #2b6cb0;'>\n    <p style='font-size: 1em; line-height: 1.6;'>L'<strong>équation-bilan</strong> est une représentation symbolique d'une réaction chimique.</p>\n    <div style='text-align: center; font-size: 1.3em; margin: 12px 0; font-weight: bold;'>\n      <span style='background: #e2e8f0; padding: 8px 16px; border-radius: 8px;'>Réactifs → Produits</span>\n    </div>\n    <ul style='font-size: 0.95em; line-height: 1.8;'>\n      <li>Les <strong>réactifs</strong> sont écrits à gauche de la flèche.</li>\n      <li>Les <strong>produits</strong> sont écrits à droite de la flèche.</li>\n      <li>La flèche (<strong>→</strong>) signifie \"donne\" ou \"se transforme en\".</li>\n    </ul>\n  </div>\n  <div style='background: #e6fffa; padding: 14px; border-radius: 8px; margin-top: 12px; border: 1px solid #38b2ac;'>\n    <strong style='color: #2c7a7b;'>📝 Exemple : Combustion du méthane</strong>\n    <div style='text-align: center; font-size: 1.1em; margin: 8px 0;'>\n      CH₄ + O₂ → CO₂ + H₂O\n    </div>\n    <p style='font-size: 0.9em; margin: 0;'>Le méthane (CH₄) réagit avec le dioxygène (O₂) pour donner du dioxyde de carbone (CO₂) et de l'eau (H₂O).</p>\n  </div>\n</div>",
    "texteParle": "Pour décrire une réaction chimique de façon pratique et universelle, on utilise une équation-bilan. C'est une écriture symbolique avec des formules chimiques. Les réactifs sont écrits à gauche de la flèche, et les produits à droite. La flèche se lit 'donne' ou 'se transforme en'. Par exemple, pour la combustion du méthane, l'équation est : CH₄ plus O₂ donne CO₂ plus H₂O. C'est une équation brute, mais elle n'est pas encore équilibrée : il y a 4 atomes d'hydrogène à gauche mais seulement 2 à droite. Nous allons voir comment équilibrer cela.",
    "note": "L'équation-bilan représente symboliquement une réaction chimique avec les formules des réactifs et des produits."
  },
  {
    "titre": "L'équilibrage des équations-bilan",
    "contenu": "<div style='background: #f0f4f8; color: #1e293b; padding: 18px; border-radius: 12px;'>\n  <h3 style='color: #2b6cb0; margin-top: 0;'>⚖️ Équilibrer une équation-bilan</h3>\n  <div style='background: white; padding: 16px; border-radius: 8px; border-left: 4px solid #2b6cb0;'>\n    <p style='font-size: 1em; line-height: 1.6;'>Équilibrer une équation, c'est respecter la <strong>conservation des atomes</strong> : chaque atome doit être présent en même nombre à gauche et à droite.</p>\n    <p style='font-weight: 500; color: #2b6cb0; margin-top: 8px;'>Méthode :</p>\n    <ul style='font-size: 0.95em; line-height: 1.8;'>\n      <li>On place des <strong>coefficients</strong> devant les formules (jamais à l'intérieur).</li>\n      <li>On commence par les atomes qui apparaissent une seule fois.</li>\n      <li>On termine par l'oxygène et l'hydrogène.</li>\n    </ul>\n  </div>\n  <div style='background: #e6fffa; padding: 14px; border-radius: 8px; margin-top: 12px; border: 1px solid #38b2ac;'>\n    <strong style='color: #2c7a7b;'>📝 Exemple : Combustion du méthane (équilibrée)</strong>\n    <div style='text-align: center; font-size: 1.1em; margin: 8px 0;'>\n      <span style='font-weight: bold;'>CH₄ + 2 O₂ → CO₂ + 2 H₂O</span>\n    </div>\n    <div style='display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 0.85em;'>\n      <div>✅ C : 1 atome à gauche, 1 à droite</div>\n      <div>✅ H : 4 atomes à gauche, 4 à droite</div>\n      <div>✅ O : 4 atomes à gauche, 4 à droite</div>\n    </div>\n  </div>\n</div>",
    "texteParle": "L'équilibrage d'une équation-bilan est une étape indispensable. Il s'agit d'ajouter des coefficients devant les formules chimiques pour que le nombre d'atomes de chaque élément soit le même de part et d'autre de la flèche. On ne change jamais les formules chimiques elles-mêmes. Pour la combustion du méthane, on a CH₄ + O₂ → CO₂ + H₂O. Il y a 4 hydrogènes à gauche et seulement 2 à droite, donc on met 2 devant H₂O. Puis on compte : il y a 4 oxygènes à droite (2 dans CO₂ et 2 dans 2H₂O), donc on met 2 devant O₂. L'équation équilibrée est : CH₄ + 2O₂ → CO₂ + 2H₂O.",
    "note": "L'équilibrage d'une équation-bilan respecte la conservation des atomes : chaque élément doit avoir le même nombre d'atomes de chaque côté."
  },
  {
    "titre": "Le bilan molaire d'une réaction",
    "contenu": "<div style='background: #f0f4f8; color: #1e293b; padding: 18px; border-radius: 12px;'>\n  <h3 style='color: #2b6cb0; margin-top: 0;'>📊 Le bilan molaire</h3>\n  <div style='background: white; padding: 16px; border-radius: 8px; border-left: 4px solid #2b6cb0;'>\n    <p style='font-size: 1em; line-height: 1.6;'>Le <strong>bilan molaire</strong> indique les quantités de matière (en moles) des réactifs consommés et des produits formés.</p>\n    <p style='font-weight: 500; color: #2b6cb0; margin-top: 8px;'>Rappel :</p>\n    <ul style='font-size: 0.95em; line-height: 1.8;'>\n      <li>1 mole = 6,02 × 10²³ entités (atomes, molécules, ions).</li>\n      <li>Les <strong>coefficients</strong> de l'équation équilibrée donnent les proportions molaires.</li>\n    </ul>\n  </div>\n  <div style='background: #e6fffa; padding: 14px; border-radius: 8px; margin-top: 12px; border: 1px solid #38b2ac;'>\n    <strong style='color: #2c7a7b;'>📝 Exemple : Combustion du méthane</strong>\n    <div style='text-align: center; font-size: 1em; margin: 8px 0;'>\n      CH₄ + 2 O₂ → CO₂ + 2 H₂O\n    </div>\n    <p style='font-size: 0.9em;'>1 mole de CH₄ réagit avec 2 moles de O₂ pour donner 1 mole de CO₂ et 2 moles de H₂O.</p>\n    <p style='font-size: 0.9em;'>Proportions : 1 : 2 → 1 : 2</p>\n  </div>\n</div>",
    "texteParle": "Le bilan molaire d'une réaction chimique nous donne les quantités de matière, exprimées en moles, des réactifs et des produits. Les coefficients de l'équation équilibrée nous indiquent les proportions molaires. Par exemple, pour la combustion du méthane : 1 mole de méthane réagit avec 2 moles de dioxygène pour donner 1 mole de dioxyde de carbone et 2 moles d'eau. Le rapport molaire est donc 1:2:1:2. Ce bilan est fondamental car il permet de prévoir les quantités de réactifs nécessaires ou de produits obtenus.",
    "note": "Le bilan molaire est donné par les coefficients de l'équation-bilan équilibrée."
  },
  {
    "titre": "Le bilan massique d'une réaction",
    "contenu": "<div style='background: #f0f4f8; color: #1e293b; padding: 18px; border-radius: 12px;'>\n  <h3 style='color: #2b6cb0; margin-top: 0;'>⚖️ Le bilan massique</h3>\n  <div style='background: white; padding: 16px; border-radius: 8px; border-left: 4px solid #2b6cb0;'>\n    <p style='font-size: 1em; line-height: 1.6;'>Le <strong>bilan massique</strong> vérifie que la <strong>masse se conserve</strong> au cours de la réaction.</p>\n    <ul style='font-size: 0.95em; line-height: 1.8;'>\n      <li>La masse totale des réactifs = la masse totale des produits.</li>\n      <li>On utilise les <strong>masses molaires</strong> (M) pour passer des moles aux grammes.</li>\n    </ul>\n    <div style='text-align: center; font-size: 1.1em; margin: 8px 0;'>\n      m = n × M\n    </div>\n  </div>\n  <div style='background: #e6fffa; padding: 14px; border-radius: 8px; margin-top: 12px; border: 1px solid #38b2ac;'>\n    <strong style='color: #2c7a7b;'>📝 Exemple : Combustion du méthane</strong>\n    <p style='font-size: 0.9em;'>Pour 1 mole de CH₄ (16 g) et 2 moles de O₂ (64 g) → masse des réactifs = 80 g.</p>\n    <p style='font-size: 0.9em;'>Pour 1 mole de CO₂ (44 g) et 2 moles de H₂O (36 g) → masse des produits = 80 g.</p>\n    <p style='font-size: 0.9em;'>✅ La masse se conserve : 80 g = 80 g.</p>\n  </div>\n</div>",
    "texteParle": "Le bilan massique repose sur la loi de conservation de la masse. La masse totale des réactifs est égale à la masse totale des produits. Pour calculer les masses, on utilise la formule m = n × M, où n est le nombre de moles et M la masse molaire. Reprenons l'exemple du méthane : la masse molaire du méthane est de 16 g/mol, celle du dioxygène de 32 g/mol, celle du CO₂ de 44 g/mol et celle de l'eau de 18 g/mol. Avec l'équation équilibrée, on a : 1 × 16 + 2 × 32 = 80 g à gauche, et 1 × 44 + 2 × 18 = 80 g à droite. La masse est bien conservée.",
    "note": "La masse se conserve au cours d'une réaction chimique : masse des réactifs = masse des produits."

    "titre": "Le bilan volumique d'une réaction (gaz)",
    "contenu": "<div style='background: #f0f4f8; color: #1e293b; padding: 18px; border-radius: 12px;'>\n  <h3 style='color: #2b6cb0; margin-top: 0;'>📏 Le bilan volumique (pour les gaz)</h3>\n  <div style='background: white; padding: 16px; border-radius: 8px; border-left: 4px solid #2b6cb0;'>\n    <p style='font-size: 1em; line-height: 1.6;'>Pour les gaz, on peut aussi faire un <strong>bilan volumique</strong>.</p>\n    <ul style='font-size: 0.95em; line-height: 1.8;'>\n      <li>Dans les mêmes conditions (température et pression), une mole de gaz occupe le même volume (<strong>volume molaire</strong> V<sub>m</sub>).</li>\n      <li>V = n × V<sub>m</sub> (avec V<sub>m</sub> ≈ 22,4 L/mol dans les conditions normales).</li>\n    </ul>\n  </div>\n  <div style='background: #e6fffa; padding: 14px; border-radius: 8px; margin-top: 12px; border: 1px solid #38b2ac;'>\n    <strong style='color: #2c7a7b;'>📝 Exemple : Combustion du méthane</strong>\n    <p style='font-size: 0.9em;'>CH₄ + 2 O₂ → CO₂ + 2 H₂O</p>\n    <p style='font-size: 0.9em;'>1 L de CH₄ réagit avec 2 L de O₂ → 1 L de CO₂ + 2 L de H₂O (vapeur).</p>\n    <p style='font-size: 0.9em;'>Proportions volumiques : 1 : 2 → 1 : 2</p>\n  </div>\n  <div style='background: #fefcbf; padding: 10px; border-radius: 8px; margin-top: 12px;'>\n    <p style='margin: 0; font-size: 0.95em;'><strong>💡 Astuce :</strong> Le volume molaire d'un gaz dépend des conditions de température et de pression.</p>\n  </div>\n</div>",
    "texteParle": "Pour les réactions qui font intervenir des gaz, on peut aussi établir un bilan volumique. Dans les mêmes conditions de température et de pression, une mole d'un gaz quelconque occupe le même volume, appelé volume molaire. Dans les conditions normales, ce volume est d'environ 22,4 litres par mole. Pour la combustion du méthane, les proportions volumiques sont les mêmes que les proportions molaires : 1 litre de méthane réagit avec 2 litres de dioxygène pour donner 1 litre de dioxyde de carbone et 2 litres de vapeur d'eau. Le volume se conserve également.",
    "note": "Le bilan volumique s'applique aux gaz et utilise le volume molaire : V = n × V<sub>m</sub>."

    "texteParle": "L'équation-bilan est un outil puissant. Elle permet d'exploiter les proportions stœchiométriques pour faire des calculs. Par exemple, on peut prévoir quelle quantité de produit sera formée à partir d'une quantité donnée de réactif. On peut aussi déterminer le réactif limitant, c'est-à-dire celui qui sera entièrement consommé en premier, et l'autre réactif sera en excès. Dans l'exercice 2, avec 1 mole de méthane et 3 moles de dioxygène, le méthane est le réactif limitant, et il restera 1 mole de dioxygène en excès.",

-bilan.</p>\n  </div>\n</div>",
    "texteParle": "Pour terminer, récapitulons les trois bilans que nous avons vus. Le bilan molaire utilise les coefficients de l'équation équilibrée pour exprimer les proportions en moles. Le bilan massique utilise les masses molaires pour vérifier que la masse se conserve. Le bilan volumique, valable uniquement pour les gaz, utilise le volume molaire pour exprimer les proportions en volume. Ces trois bilans sont essentiels pour résoudre des problèmes de chimie et pour comprendre comment la matière se transforme.",

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentIndex = 0;
    let isSpeaking = false;
    let isPaused = false;
    let currentUtterance = null;
    let isLoading = false;
    let loadingTimeout = null;
    let isTransitioning = false;
    let speechSupported = true;
    let userInteracted = false;
    let isPlaying = false;
    let loadingCancelled = false;

    const total = slides.length;
    const synth = window.speechSynthesis;

    // Références jQuery
    const $title = $('#slideTitle');
    const $body = $('#slideBody');
    const $counter = $('#slideCounter');
    const $statusText = $('#statusText');
    const $statusBadge = $('#statusBadge');
    const $loading = $('#loadingOverlay');
    const $loadingText = $('#loadingText');
    const $loadingSub = $('#loadingSub');
    const $loadingTimeout = $('#loadingTimeout');
    const $loadingProgressBar = $('#loadingProgressBar');
    const $autoIndicator = $('#autoIndicator');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $replay = $('#replayBtn');
    const $play = $('#playBtn');
    const $cancelLoading = $('#cancelLoadingBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function setStatus(text, type) {
        $statusText.text(text);
        $statusBadge.removeClass('idle speaking error paused waiting loading');
        if (type === 'speaking') $statusBadge.addClass('speaking');
        else if (type === 'error') $statusBadge.addClass('error');
        else if (type === 'paused') $statusBadge.addClass('paused');
        else if (type === 'waiting') $statusBadge.addClass('waiting');
        else if (type === 'loading') $statusBadge.addClass('loading');
        else $statusBadge.addClass('idle');
    }

    function updatePlayButton() {
        if (isPlaying) {
            $play.addClass('playing');
            $play.find('.btn-icon').text('⏸');
            $play.find('.btn-label').text('Pause');
        } else {
            $play.removeClass('playing');
            $play.find('.btn-icon').text('▶');
            $play.find('.btn-label').text('Play');
        }
    }

    function showLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        
        loadingCancelled = false;
        isLoading = true;
        
        // Réinitialiser la barre de progression
        $loadingProgressBar.css('animation', 'none');
        $loadingProgressBar.css('width', '0%');
        // Forcer un reflow
        $loadingProgressBar[0].offsetHeight;
        $loadingProgressBar.css('animation', 'loadingProgress 30s ease-out forwards');
        
        $loadingText.text('Préparation vocale...');
        $loadingSub.text('Synthèse en cours');
        $loadingTimeout.text('⏱️ 30 secondes maximum');
        $loading.fadeIn(300);
        setStatus("⏳ Chargement...", 'loading');
        
        // 🔥 TIMEOUT DE 30 SECONDES
        loadingTimeout = setTimeout(() => {
            if (isLoading && !loadingCancelled) {
                hideLoading();
                setStatus("⚠️ Délai dépassé (30s)", 'error');
                isPlaying = false;
                updatePlayButton();
                $loadingSub.text('La synthèse vocale a pris trop de temps');
                $loadingTimeout.text('❌ Délai dépassé');
            }
        }, 30000);
    }

    function hideLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        isLoading = false;
        loadingCancelled = false;
        $loading.fadeOut(300);
        // Ne pas changer le statut si on est en train de parler
        if (!isSpeaking && !isPlaying) {
            setStatus("⏸ Lecture arrêtée", 'paused');
        }
    }

    function cancelLoading() {
        loadingCancelled = true;
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        hideLoading();
        stopSpeaking();
        setStatus("⏸ Annulé", 'paused');
        isPlaying = false;
        updatePlayButton();
        $loadingText.text('Annulé par l\'utilisateur');
        $loadingSub.text('Vous pouvez réessayer');
        $loadingTimeout.text('✕ Annulation');
    }

    // Arrêter la parole proprement
    function stopSpeaking() {
        try {
            if (synth && (synth.speaking || synth.pending)) {
                synth.cancel();
            }
        } catch(e) {
            console.warn('Erreur stopSpeaking:', e);
        }
        if (currentUtterance) {
            try {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance.onstart = null;
            } catch(e) {}
            currentUtterance = null;
        }
        isSpeaking = false;
        isPlaying = false;
        updatePlayButton();
    }

    // Mettre en pause la parole
    function pauseSpeaking() {
        try {
            if (synth && synth.speaking) {
                synth.pause();
                isPaused = true;
                isPlaying = false;
                setStatus("⏸ Lecture en pause", 'paused');
                updatePlayButton();
            }
        } catch(e) {
            console.warn('Erreur pauseSpeaking:', e);
            stopSpeaking();
        }
    }

    // Reprendre la parole
    function resumeSpeaking() {
        try {
            if (synth && synth.paused) {
                synth.resume();
                isPaused = false;
                isPlaying = true;
                setStatus("🔊 Lecture en cours", 'speaking');
                updatePlayButton();
            } else if (!isSpeaking && !synth.speaking && !synth.pending) {
                speakSlide(currentIndex);
            }
        } catch(e) {
            console.warn('Erreur resumeSpeaking:', e);
            speakSlide(currentIndex);
        }
    }

    function renderSlide(index) {
        const slide = slides[index];
        $title.text(slide.titre);

        let html = '';
        html += `<div class="content-card">${slide.contenu}</div>`;
        if (slide.note) {
            html += `<div class="note-box">${slide.note}</div>`;
        }
        $body.html(html);
        $counter.text(`${index+1} / ${total}`);

        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
        }
    }

    // ================================================================
    // LECTURE VOCALE
    // ================================================================
    function speakSlide(index) {
        return new Promise((resolve) => {
            const slide = slides[index];
            const text = slide.texteParle;
            
            if (!text || text.trim() === '' || !speechSupported) {
                resolve();
                return;
            }

            if (!window.speechSynthesis) {
                setStatus("❌ Synthèse vocale non supportée", 'error');
                speechSupported = false;
                resolve();
                return;
            }

            // Arrêter toute lecture en cours
            stopSpeaking();
            
            // Réinitialiser l'état de pause
            isPaused = false;
            
            showLoading();
            setStatus("Initialisation...", 'loading');

            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.92;
                utterance.pitch = 1.05;
                utterance.volume = 1;

                let isFinished = false;
                let errorHandled = false;

                utterance.onstart = function() {
                    if (loadingCancelled) {
                        stopSpeaking();
                        resolve();
                        return;
                    }
                    hideLoading();
                    isSpeaking = true;
                    isPlaying = true;
                    isPaused = false;
                    setStatus("🔊 Lecture en cours", 'speaking');
                    updatePlayButton();
                };

                utterance.onend = function() {
                    if (isFinished) return;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    setStatus("✅ Terminé", 'idle');
                    hideLoading();
                    updatePlayButton();
                    resolve();
                };

                utterance.onerror = function(e) {
                    if (isFinished || errorHandled) return;
                    errorHandled = true;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    hideLoading();
                    updatePlayButton();
                    
                    if (e.error === 'not-allowed') {
                        setStatus("⚠️ Permission refusée", 'error');
                    } else if (e.error === 'synthesis-unavailable') {
                        setStatus("⚠️ Synthèse indisponible", 'error');
                    } else if (e.error === 'canceled') {
                        setStatus("⏸ Annulé", 'paused');
                    } else {
                        setStatus("❌ Erreur audio: " + (e.error || 'inconnue'), 'error');
                    }
                    
                    resolve();
                };

                // Gestion du chargement des voix
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = function() {
                        if (!loadingCancelled) {
                            try {
                                synth.speak(utterance);
                            } catch(err) {
                                // Silencieux
                            }
                        }
                        synth.onvoiceschanged = null;
                    };
                }

                currentUtterance = utterance;
                
                if (!loadingCancelled) {
                    try {
                        synth.speak(utterance);
                    } catch(err) {
                        setTimeout(() => {
                            if (!loadingCancelled) {
                                try {
                                    synth.speak(utterance);
                                } catch(e) {
                                    setStatus("❌ Erreur de lecture", 'error');
                                    isPlaying = false;
                                    updatePlayButton();
                                    hideLoading();
                                    resolve();
                                }
                            } else {
                                resolve();
                            }
                        }, 100);
                    }
                } else {
                    resolve();
                }

            } catch(err) {
                hideLoading();
                setStatus("❌ Erreur générale", 'error');
                isPlaying = false;
                updatePlayButton();
                console.error('Erreur speakSlide:', err);
                resolve();
            }
        });
    }

    // ================================================================
    // NAVIGATION
    // ================================================================
    async function goToSlide(index) {
        if (isTransitioning) return;
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        
        // Si on est en train de lire, on met en pause avant de naviguer
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        // Arrêter complètement la lecture
        stopSpeaking();
        
        await new Promise(r => setTimeout(r, 50));
        
        if (index === currentIndex) {
            setStatus("📄 Slide actuel", 'idle');
            return;
        }

        isTransitioning = true;
        currentIndex = index;
        renderSlide(index);
        
        // Réinitialiser l'état de lecture
        isPlaying = false;
        updatePlayButton();
        setStatus("⏸ Lecture arrêtée", 'paused');

        await new Promise(r => setTimeout(r, 150));
        isTransitioning = false;
    }

    async function goToNext() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex + 1 < total) {
            await goToSlide(currentIndex + 1);
        } else {
            setStatus("🏁 Dernier slide", 'idle');
        }
    }

    async function goToPrev() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex - 1 >= 0) {
            await goToSlide(currentIndex - 1);
        } else {
            setStatus("🔁 Premier slide", 'idle');
        }
    }

    // ================================================================
    // GESTION PLAY/PAUSE
    // ================================================================
    function togglePlay() {
        if (!userInteracted) {
            userInteracted = true;
        }

        // Si le chargement est en cours, on l'annule
        if (isLoading) {
            cancelLoading();
            return;
        }

        // Si le synthétiseur est en pause, on reprend
        if (synth && synth.paused) {
            resumeSpeaking();
            return;
        }

        // Si la lecture est en cours, on met en pause
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
            return;
        }

        // Sinon, on démarre la lecture du slide courant
        if (!isSpeaking && !isPlaying) {
            stopSpeaking();
            speakSlide(currentIndex);
        }
    }

    // ================================================================
    // INIT
    // ================================================================
    async function init() {
        // Vérifier la compatibilité
        if (!window.speechSynthesis) {
            setStatus("❌ Synthèse vocale non supportée", 'error');
            speechSupported = false;
        }

        // Précharger les voix
        try {
            if (synth.getVoices) {
                synth.getVoices();
                setTimeout(() => {
                    try {
                        synth.getVoices();
                    } catch(e) {}
                }, 200);
            }
        } catch(e) {
            console.warn('Erreur chargement voix:', e);
        }

        // Afficher le premier slide
        renderSlide(0);
        $counter.text(`1 / ${total}`);
        
        // État initial
        setStatus("⏸ Appuie sur Play", 'paused');
        updatePlayButton();
        $autoIndicator.text('⏸ Lecture manuelle');

        // ================================================================
        // ÉVÉNEMENTS
        // ================================================================
        
        // Bouton Play/Pause
        $play.on('click', function() {
            togglePlay();
        });

        // Bouton Annuler le chargement
        $cancelLoading.on('click', function() {
            cancelLoading();
        });

        // Navigation
        $prev.on('click', function() {
            // Si chargement en cours, on annule
            if (isLoading) cancelLoading();
            goToPrev();
        });

        $next.on('click', function() {
            if (isLoading) cancelLoading();
            goToNext();
        });

        // Replay - relire le slide courant
        $replay.on('click', function() {
            if (isLoading) cancelLoading();
            stopSpeaking();
            setTimeout(() => {
                speakSlide(currentIndex);
            }, 100);
        });

        // Support du clavier (espace pour play/pause)
        $(document).on('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });

        // Nettoyage
        $(window).on('beforeunload', function() {
            try {
                if (synth.speaking) synth.cancel();
            } catch(e) {}
            hideLoading();
        });

        // Gérer les cas où la synthèse se termine de manière inattendue
        setInterval(() => {
            if (isPlaying && !synth.speaking && !synth.pending && !isPaused && !isLoading) {
                isPlaying = false;
                updatePlayButton();
                setStatus("⏸ Lecture arrêtée", 'paused');
            }
        }, 1000);
    }

    init();
});



    // ================================================================
    // GESTION DU THÈME JOUR/NUIT
    // ================================================================
    let isDarkMode = false;

    function toggleTheme() {
        isDarkMode = !isDarkMode;
        const body = document.body;
        const appContainer = document.querySelector('.app-container');
        const header = document.querySelector('.slide-header');
        const footer = document.querySelector('.slide-footer');
        const contentCards = document.querySelectorAll('.content-card');
        const noteBoxes = document.querySelectorAll('.note-box');
        const mathBlocks = document.querySelectorAll('.math-block');
        const buttons = document.querySelectorAll('.btn');
        const statusBadge = document.querySelector('.status-badge');
        const slideCounter = document.querySelector('.slide-counter');
        const autoIndicator = document.querySelector('.auto-indicator');
        const themeBtn = document.getElementById('themeToggle');

        if (isDarkMode) {
            // Mode nuit
            body.style.background = '#0b1120';
            body.style.color = '#f1f5f9';
            appContainer.style.background = 'linear-gradient(145deg, #0f172a 0%, #1e293b 100%)';
            header.style.background = 'rgba(15, 23, 42, 0.85)';
            footer.style.background = 'rgba(15, 23, 42, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.05)';
                card.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.08)';
                note.style.color = '#cbd5e1';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.25)';
                block.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#e2e8f0';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.12)';
                statusBadge.style.color = '#93bbfc';
            }
            if (slideCounter) {
                slideCounter.style.color = '#94a3b8';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#64748b';
            }
            if (themeBtn) {
                themeBtn.textContent = '☀️';
                themeBtn.title = 'Passer en mode jour';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#e2e8f0';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#e2e8f0';
                }
            });
        } else {
            // Mode jour (par défaut)
            body.style.background = '#f0f4f8';
            body.style.color = '#1a202c';
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
            header.style.background = 'rgba(255, 255, 255, 0.85)';
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.8)';
                card.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.12)';
                note.style.color = '#2c3e50';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.05)';
                block.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#2d3748';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
                statusBadge.style.color = '#2b6cb0';
            }
            if (slideCounter) {
                slideCounter.style.color = '#4a5568';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#718096';
            }
            if (themeBtn) {
                themeBtn.textContent = '🌓';
                themeBtn.title = 'Passer en mode nuit';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#2c3e50';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#2d3748';
                }
            });
        }
    }

    // Initialiser en mode jour
    document.addEventListener('DOMContentLoaded', function() {
        // Appliquer le mode jour par défaut
        const body = document.body;
        body.style.background = '#f0f4f8';
        body.style.color = '#1a202c';
        
        const appContainer = document.querySelector('.app-container');
        if (appContainer) {

        }

            block.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.btn').forEach(btn => {

        if (statusBadge) {

        const autoIndicator = document.querySelector('.auto-indicator');
        if (autoIndicator) {

        document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
            if (!el.closest('.note-box')) {

        document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
