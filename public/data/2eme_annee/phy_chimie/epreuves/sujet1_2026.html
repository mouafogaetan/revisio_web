<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Physique-Chimie",
  "classe": "2ème année",
  "sequence": "Séquence 1",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Structure de l'atome et identification des éléments chimiques",
      "points": "6 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; line-height: 1.6; color: #333; padding: 10px;'><p style='text-align: justify;'>On donne les nucléides suivants : <span class='math'>\\(^{12}_{6}C\\)</span>, <span class='math'>\\(^{14}_{6}C\\)</span>, <span class='math'>\\(^{23}_{11}Na\\)</span> et <span class='math'>\\(^{40}_{20}Ca\\)</span>.</p></div>",
      "questions": [
        {
          "question": "<p style='font-weight: bold;'>1) Donner la composition en protons, neutrons et électrons de chaque nucléide.</p>",
          "reponse": "<div style='background-color: #f0f8ff; padding: 10px; border-radius: 5px; color: #000;'><p><strong>Réponse :</strong></p><ul style='list-style-type: disc;'><li><span class='math'>\\(^{12}_{6}C\\)</span> : 6 protons, 6 neutrons, 6 électrons.</li><li><span class='math'>\\(^{14}_{6}C\\)</span> : 6 protons, 8 neutrons, 6 électrons.</li><li><span class='math'>\\(^{23}_{11}Na\\)</span> : 11 protons, 12 neutrons, 11 électrons.</li><li><span class='math'>\\(^{40}_{20}Ca\\)</span> : 20 protons, 20 neutrons, 20 électrons.</li></ul></div>"
        },
        {
          "question": "<p style='font-weight: bold;'>2) Identifier les isotopes parmi ces nucléides. Justifier votre réponse.</p>",
          "reponse": "<div style='background-color: #f0f8ff; padding: 10px; border-radius: 5px; color: #000;'><p><strong>Réponse :</strong> Les isotopes sont <span class='math'>\\(^{12}_{6}C\\)</span> et <span class='math'>\\(^{14}_{6}C\\)</span> car ils ont le même nombre de protons (6) mais un nombre de neutrons différent (6 et 8 respectivement).</p></div>"
        },
        {
          "question": "<p style='font-weight: bold;'>3) Écrire la formule électronique de l'atome de sodium <span class='math'>\\(^{23}_{11}Na\\)</span> sachant que la règle de l'octet s'applique pour les couches K, L et M.</p>",
          "reponse": "<div style='background-color: #f0f8ff; padding: 10px; border-radius: 5px; color: #000;'><p><strong>Réponse :</strong> La formule électronique du sodium est : <span class='math'>\\( (K)^2 (L)^8 (M)^1 \\)</span>.</p></div>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Application de l'énergie au mouvement et orientation",
      "points": "5 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; line-height: 1.6; color: #333; padding: 10px;'><p style='text-align: justify;'>Un élève se déplace à vélo sur une route rectiligne. Il parcourt une distance de 600 m en 40 s. Il souhaite ensuite s'orienter à l'aide d'une boussole et d'une carte.</p></div>",
      "questions": [
        {
          "question": "<p style='font-weight: bold;'>1) Calculer la vitesse moyenne de l'élève en m/s puis en km/h.</p>",
          "reponse": "<div style='background-color: #f0f8ff; padding: 10px; border-radius: 5px; color: #000;'><p><strong>Réponse :</strong> La vitesse moyenne est donnée par <span class='math'>\\(v = \\frac{d}{t}\\)</span>.<br/>En m/s : <span class='math'>\\(v = \\frac{600}{40} = 15\\, m/s\\)</span>.<br/>En km/h : <span class='math'>\\(15 \\times 3,6 = 54\\, km/h\\)</span>.</p></div>"
        },
        {
          "question": "<p style='font-weight: bold;'>2) Décrire la procédure à suivre pour utiliser une boussole et une carte géographique afin de s'orienter sur le terrain.</p>",
          "reponse": "<div style='background-color: #f0f8ff; padding: 10px; border-radius: 5px; color: #000;'><p><strong>Réponse :</strong> Pour s'orienter avec une boussole et une carte :<br/>1) Placer la boussole à plat et attendre que l'aiguille se stabilise (elle indique le nord magnétique).<br/>2) Orienter la carte en faisant coïncider le nord de la carte avec le nord indiqué par la boussole.<br/>3) La carte est alors orientée. On peut déterminer sa position et la direction à suivre.</p></div>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Les forces et les actions mécaniques",
      "points": "4 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; line-height: 1.6; color: #333; padding: 10px;'><p style='text-align: justify;'>Un livre de masse <span class='math'>\\(m = 500\\, g\\)</span> est posé sur une table. On considère que le livre est au repos.</p></div>",
      "questions": [
        {
          "question": "<p style='font-weight: bold;'>1) Identifier les forces qui s'exercent sur le livre.</p>",
          "reponse": "<div style='background-color: #f0f8ff; padding: 10px; border-radius: 5px; color: #000;'><p><strong>Réponse :</strong> Deux forces s'exercent sur le livre :<br/>- Le poids <span class='math'>\\(\\vec{P}\\)</span> (force à distance exercée par la Terre), vertical vers le bas.<br/>- La réaction du support <span class='math'>\\(\\vec{R}\\)</span> (force de contact exercée par la table), verticale vers le haut.</p></div>"
        },
        {
          "question": "<p style='font-weight: bold;'>2) Construire le diagramme des espaces pour ce système. Justifier l'état d'équilibre du livre.</p>",
          "reponse": "<div style='background-color: #f0f8ff; padding: 10px; border-radius: 5px; color: #000;'><p><strong>Réponse :</strong> Le diagramme des espaces représente le livre (système) avec les forces extérieures : le poids <span class='math'>\\(\\vec{P}\\)</span> vers le bas et la réaction <span class='math'>\\(\\vec{R}\\)</span> vers le haut.<br/>Le livre est en équilibre car ces deux forces se compensent : <span class='math'>\\(\\vec{P} + \\vec{R} = \\vec{0}\\)</span>.</p></div>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : La molécule et les réactions chimiques",
      "points": "6 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; line-height: 1.6; color: #333; padding: 10px;'><p style='text-align: justify;'>On considère la réaction de combustion du méthane (<span class='math'>\\(CH_4\\)</span>) dans le dioxygène (<span class='math'>\\(O_2\\)</span>) qui produit du dioxyde de carbone (<span class='math'>\\(CO_2\\)</span>) et de l'eau (<span class='math'>\\(H_2O\\)</span>).</p></div>",
      "questions": [
        {
          "question": "<p style='font-weight: bold;'>1) Écrire et équilibrer l'équation-bilan de cette réaction.</p>",
          "reponse": "<div style='background-color: #f0f8ff; padding: 10px; border-radius: 5px; color: #000;'><p><strong>Réponse :</strong> L'équation-bilan équilibrée est : <span class='math'>\\(CH_4 + 2O_2 \\rightarrow CO_2 + 2H_2O\\)</span>.</p></div>"
        },
        {
          "question": "<p style='font-weight: bold;'>2) Si on brûle <span class='math'>\\(2\\, mol\\)</span> de méthane, quelle quantité de matière de dioxyde de carbone est produite ? Justifier.</p>",
          "reponse": "<div style='background-color: #f0f8ff; padding: 10px; border-radius: 5px; color: #000;'><p><strong>Réponse :</strong> D'après l'équation, 1 mole de <span class='math'>\\(CH_4\\)</span> produit 1 mole de <span class='math'>\\(CO_2\\)</span>. Donc 2 moles de <span class='math'>\\(CH_4\\)</span> produiront 2 moles de <span class='math'>\\(CO_2\\)</span>.</p></div>"
        },
        {
          "question": "<p style='font-weight: bold;'>3) Calculer la masse de dioxyde de carbone obtenue si on brûle <span class='math'>\\(16\\, g\\)</span> de méthane. (Masses molaires : <span class='math'>\\(M(C) = 12\\, g/mol\\)</span>, <span class='math'>\\(M(H) = 1\\, g/mol\\)</span>, <span class='math'>\\(M(O) = 16\\, g/mol\\)</span>)</p>",
          "reponse": "<div style='background-color: #f0f8ff; padding: 10px; border-radius: 5px; color: #000;'><p><strong>Réponse :</strong> <span class='math'>\\(M(CH_4) = 12 + 4 \\times 1 = 16\\, g/mol\\)</span>.<br/>Quantité de matière de <span class='math'>\\(CH_4\\)</span> : <span class='math'>\\(n = \\frac{16}{16} = 1\\, mol\\)</span>.<br/>D'après l'équation, 1 mole de <span class='math'>\\(CH_4\\)</span> donne 1 mole de <span class='math'>\\(CO_2\\)</span>.<br/><span class='math'>\\(M(CO_2) = 12 + 2 \\times 16 = 44\\, g/mol\\)</span>.<br/>Masse de <span class='math'>\\(CO_2\\)</span> : <span class='math'>\\(m = n \\times M = 1 \\times 44 = 44\\, g\\)</span>.</p></div>"
        }
      ]
    },
    {
      "titre": "Exercice 5 : Notion de projet technique et réalisation d'un objet simple",
      "points": "4 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; line-height: 1.6; color: #333; padding: 10px;'><p style='text-align: justify;'>Un élève souhaite réaliser un tabouret en bambou pour sa maison. Il doit suivre les étapes d'un projet technique.</p></div>",
      "questions": [
        {
          "question": "<p style='font-weight: bold;'>1) Identifier le besoin auquel répond ce projet.</p>",
          "reponse": "<div style='background-color: #f0f8ff; padding: 10px; border-radius: 5px; color: #000;'><p><strong>Réponse :</strong> Le besoin est de disposer d'un siège solide, confortable, peu coûteux et fabriqué à partir d'un matériau local disponible (le bambou).</p></div>"
        },
        {
          "question": "<p style='font-weight: bold;'>2) Justifier le choix du bambou comme matériau principal.</p>",
          "reponse": "<div style='background-color: #f0f8ff; padding: 10px; border-radius: 5px; color: #000;'><p><strong>Réponse :</strong> Le bambou est un matériau résistant, léger, renouvelable, disponible localement et économique. Il est également facile à travailler avec des outils simples.</p></div>"
        },
        {
          "question": "<p style='font-weight: bold;'>3) Élaborer un plan de réalisation en trois étapes principales pour ce projet.</p>",
          "reponse": "<div style='background-color: #f0f8ff; padding: 10px; border-radius: 5px; color: #000;'><p><strong>Réponse :</strong> 1) Collecte et préparation des bambous (découpe, ponçage). 2) Assemblage de la structure (pieds et traverses). 3) Fixation de l'assise et finitions (vernissage).</p></div>"
        },
        {
          "question": "<p style='font-weight: bold;'>4) Indiquer un élément essentiel à inclure dans une fiche de construction.</p>",
          "reponse": "<div style='background-color: #f0f8ff; padding: 10px; border-radius: 5px; color: #000;'><p><strong>Réponse :</strong> Une fiche de construction doit inclure les dimensions précises de l'objet, la liste des matériaux et outils, ainsi que les étapes de montage détaillées.</p></div>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
