<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Physique-Chimie",
  "classe": "2ème année",
  "sequence": "Séquence 4",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Atome - Structure électronique et ion",
      "points": "4 pts",
      "enonce": "<p>Un atome de chlore \\( \\text{Cl} \\) a pour numéro atomique \\( Z = 17 \\) et pour nombre de masse \\( A = 35 \\).</p><p>On rappelle que les capacités maximales des trois premières couches électroniques sont :</p><ul><li>Couche K : 2 électrons</li><li>Couche L : 8 électrons</li><li>Couche M : 8 électrons (pour les éléments de la troisième période)</li></ul>",
      "questions": [
        {
          "question": "<p><strong>1.1</strong> (1 pt) Donner les constituants de l'atome de chlore (protons, neutrons, électrons).</p>",
          "reponse": "<p><strong>Solution :</strong></p><p>L'atome de chlore possède :</p><ul><li>17 protons (Z = 17)</li><li>17 électrons (atome neutre)</li><li>18 neutrons (A - Z = 35 - 17 = 18)</li></ul>"
        },
        {
          "question": "<p><strong>1.2</strong> (1 pt) Remplir les trois premières couches électroniques de l'atome de chlore.</p>",
          "reponse": "<p><strong>Solution :</strong></p><p>Structure électronique du chlore :</p><p>(K)² (L)⁸ (M)⁷</p><p>La couche M possède 7 électrons sur 8 possibles.</p>"
        },
        {
          "question": "<p><strong>1.3</strong> (1 pt) Quel ion le chlore peut-il former pour respecter la règle de l'octet ? Justifier.</p>",
          "reponse": "<p><strong>Solution :</strong></p><p>Le chlore possède 7 électrons sur sa couche externe. Pour respecter la règle de l'octet, il doit gagner 1 électron et former l'ion chlorure \\( \\text{Cl}^- \\).</p><p>Il acquiert alors la structure électronique du gaz rare argon : (K)² (L)⁸ (M)⁸.</p>"
        },
        {
          "question": "<p><strong>1.4</strong> (1 pt) Représenter le nucléide du chlore en utilisant la notation \\( \\text{^{A}_{Z}X} \\).</p>",
          "reponse": "<p><strong>Solution :</strong></p><div class='math-block'><div class='math'>$$ \\text{^{35}_{17}Cl} $$</div></div>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Isotopes et calcul du nombre de moles",
      "points": "4 pts",
      "enonce": "<p>Les isotopes \\( \\text{^{12}_{6}C} \\) et \\( \\text{^{14}_{6}C} \\) sont deux isotopes du carbone. Le carbone 14 est utilisé en datation archéologique.</p>",
      "questions": [
        {
          "question": "<p><strong>2.1</strong> (1 pt) Différencier les deux isotopes du carbone en précisant leurs constituants.</p>",
          "reponse": "<p><strong>Solution :</strong></p><p>Les deux isotopes du carbone ont le même nombre de protons (6) mais des nombres de neutrons différents :</p><ul><li>Carbone 12 : 6 protons et 6 neutrons</li><li>Carbone 14 : 6 protons et 8 neutrons</li></ul><p>Ce sont donc des atomes de même numéro atomique mais de nombre de masse différent.</p>"
        },
        {
          "question": "<p><strong>2.2</strong> (1.5 pt) Calculer la masse molaire du carbone 12 sachant que la masse d'un atome de carbone 12 est \\( 1,99 \\times 10^{-23} \\, g \\).</p>",
          "reponse": "<p><strong>Solution :</strong></p><p>La masse molaire est la masse d'une mole d'atomes. Une mole contient \\( N_A = 6,02 \\times 10^{23} \\) entités.</p><p>\\( M = m_{\\text{atome}} \\times N_A \\)</p><p>\\( M = 1,99 \\times 10^{-23} \\times 6,02 \\times 10^{23} = 1,99 \\times 6,02 \\approx 12 \\, g/mol \\)</p><p>La masse molaire du carbone 12 est d'environ \\( 12 \\, g/mol \\).</p>"
        },
        {
          "question": "<p><strong>2.3</strong> (1.5 pt) Un échantillon contient \\( 12 \\, g \\) de carbone. Calculer le nombre de moles de carbone dans cet échantillon.</p>",
          "reponse": "<p><strong>Solution :</strong></p><p>Le nombre de moles est donné par : \\( n = \\frac{m}{M} \\)</p><p>\\( n = \\frac{12}{12} = 1 \\, mol \\)</p><p>L'échantillon contient 1 mole de carbone.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Vitesse moyenne et diagramme de vitesse",
      "points": "5 pts",
      "enonce": "<p>Un automobiliste effectue un trajet de Douala à Yaoundé, soit une distance de 200 km.</p><p>Il parcourt les 120 premiers kilomètres à une vitesse moyenne de 60 km/h, puis les 80 derniers kilomètres à une vitesse moyenne de 80 km/h.</p>",
      "questions": [
        {
          "question": "<p><strong>3.1</strong> (1 pt) Calculer le temps mis pour parcourir les 120 premiers kilomètres.</p>",
          "reponse": "<p><strong>Solution :</strong></p><p>\\( t_1 = \\frac{120}{60} = 2 \\, h \\)</p><p>L'automobiliste met 2 heures pour les 120 premiers km.</p>"
        },
        {
          "question": "<p><strong>3.2</strong> (1 pt) Calculer le temps mis pour parcourir les 80 derniers kilomètres.</p>",
          "reponse": "<p><strong>Solution :</strong></p><p>\\( t_2 = \\frac{80}{80} = 1 \\, h \\)</p><p>L'automobiliste met 1 heure pour les 80 derniers km.</p>"
        },
        {
          "question": "<p><strong>3.3</strong> (1 pt) Calculer le temps total du trajet.</p>",
          "reponse": "<p><strong>Solution :</strong></p><p>\\( t = t_1 + t_2 = 2 + 1 = 3 \\, h \\)</p><p>Le trajet dure 3 heures au total.</p>"
        },
        {
          "question": "<p><strong>3.4</strong> (1 pt) Calculer la vitesse moyenne du véhicule sur l'ensemble du parcours.</p>",
          "reponse": "<p><strong>Solution :</strong></p><p>\\( v = \\frac{d_{totale}}{t_{total}} = \\frac{200}{3} \\approx 66,67 \\, km/h \\)</p><p>La vitesse moyenne sur l'ensemble du parcours est d'environ 66,67 km/h.</p>"
        },
        {
          "question": "<p><strong>3.5</strong> (1 pt) Représenter le diagramme des vitesses de ce trajet en fonction du temps.</p>",
          "reponse": "<p><strong>Solution :</strong></p><p>Le diagramme des vitesses est un graphique avec le temps en abscisse et la vitesse en ordonnée :</p><ul><li>De 0 à 2 h : segment horizontal à 60 km/h.</li><li>De 2 à 3 h : segment horizontal à 80 km/h.</li></ul><p>La courbe est une fonction en escalier.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Réflexion de la lumière",
      "points": "4 pts",
      "enonce": "<p>Un rayon lumineux arrive sur un miroir plan avec un angle d'incidence \\( i = 30° \\).</p>",
      "questions": [
        {
          "question": "<p><strong>4.1</strong> (1 pt) Énoncer les lois de Descartes pour la réflexion.</p>",
          "reponse": "<p><strong>Solution :</strong></p><p>Les lois de Descartes pour la réflexion sont :</p><ol><li>Le rayon réfléchi, le rayon incident et la normale au point d'incidence sont dans un même plan.</li><li>Les angles d'incidence \\( i \\) et de réflexion \\( r \\) sont égaux : \\( i = r \\).</li></ol>"
        },
        {
          "question": "<p><strong>4.2</strong> (1 pt) Calculer l'angle de réflexion \\( r \\).</p>",
          "reponse": "<p><strong>Solution :</strong></p><p>D'après la deuxième loi de Descartes : \\( i = r \\)</p><p>Donc \\( r = 30° \\).</p>"
        },
        {
          "question": "<p><strong>4.3</strong> (1 pt) Si le miroir tourne de \\( 10° \\), de quel angle tourne le rayon réfléchi ?</p>",
          "reponse": "<p><strong>Solution :</strong></p><p>Lorsqu'un miroir plan tourne d'un angle \\( \\alpha \\), le rayon réfléchi tourne d'un angle double :</p><p>\\( \\theta = 2 \\times 10 = 20° \\)</p><p>Le rayon réfléchi tourne de 20°.</p>"
        },
        {
          "question": "<p><strong>4.4</strong> (1 pt) Construire l'image d'un point objet \\( A \\) placé devant le miroir plan. Décrire brièvement la méthode.</p>",
          "reponse": "<p><strong>Solution :</strong></p><p>Méthode de construction :</p><ol><li>Tracer deux rayons issus du point objet \\( A \\) qui se réfléchissent sur le miroir.</li><li>Appliquer la loi de la réflexion pour chaque rayon.</li><li>Prolonger les rayons réfléchis en arrière (traits pointillés).</li><li>L'intersection de ces prolongements donne l'image virtuelle \\( A' \\).</li></ol><p>L'image \\( A' \\) est symétrique de \\( A \\) par rapport au miroir.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 5 : Projet technique - Construction d'un poulailler",
      "points": "3 pts",
      "enonce": "<p>Un village souhaite construire un poulailler pour élever des poules. Le besoin est d'avoir un abri sécurisé et ventilé pour 50 poules.</p>",
      "questions": [
        {
          "question": "<p><strong>5.1</strong> (1 pt) Identifier le besoin auquel répond ce projet technique.</p>",
          "reponse": "<p><strong>Solution :</strong></p><p>Le besoin est de disposer d'un abri sécurisé et adapté pour élever des poules en protégeant les volailles des prédateurs et des intempéries, tout en assurant une bonne ventilation.</p>"
        },
        {
          "question": "<p><strong>5.2</strong> (1 pt) Citer deux contraintes à prendre en compte pour ce projet.</p>",
          "reponse": "<p><strong>Solution :</strong></p><p>Deux contraintes pour ce projet :</p><ul><li><strong>Contrainte économique :</strong> le budget disponible pour l'achat des matériaux.</li><li><strong>Contrainte technique :</strong> la solidité de la structure pour résister aux intempéries et aux prédateurs.</li></ul><p>On peut aussi citer la contrainte environnementale (utilisation de matériaux locaux) et la contrainte de délai.</p>"
        },
        {
          "question": "<p><strong>5.3</strong> (1 pt) Élaborer un plan de réalisation simplifié en trois étapes pour construire ce poulailler.</p>",
          "reponse": "<p><strong>Solution :</strong></p><p>Plan de réalisation en trois étapes :</p><ol><li><strong>Étape 1 :</strong> Étude et planification (définir l'emplacement, les dimensions, les matériaux).</li><li><strong>Étape 2 :</strong> Construction de la structure (montage du cadre en bois, pose du toit et des murs).</li><li><strong>Étape 3 :</strong> Aménagement intérieur (perchoirs, mangeoires, abreuvoirs) et vérification de la solidité.</li></ol>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
