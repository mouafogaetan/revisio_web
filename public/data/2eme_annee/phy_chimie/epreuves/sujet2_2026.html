<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
 "matiere": "Physique-Chimie",
 "classe": "2ème année",
 "sequence": "Séquence 2",
 "anneeScolaire": "2025-2026",
 "exercices": [
   {
     "titre": "Exercice 1 : Structure de l'atome",
     "points": "4 pts",
     "enonce": "<p>L'atome d'oxygène est représenté par le nucléide suivant : <span class='math'>\\(^{16}_{8}O\\)</span>.</p>",
     "questions": [
       {
         "question": "<p><strong>1.1</strong> (1 pt) Donne la composition de cet atome (nombre de protons, de neutrons et d'électrons).</p>",
         "reponse": "<p><strong>Solution :</strong></p><ul><li>Numéro atomique Z = 8 → 8 protons et 8 électrons</li><li>Nombre de masse A = 16 → nombre de neutrons = A - Z = 16 - 8 = 8</li><li>Composition : 8 protons, 8 neutrons, 8 électrons</li></ul>"
       },
       {
         "question": "<p><strong>1.2</strong> (1 pt) Écris la configuration électronique de l'atome d'oxygène (Z=8).</p>",
         "reponse": "<p><strong>Solution :</strong></p><p>La configuration électronique de l'oxygène est : <span class='math'>\\(1s^2 2s^2 2p^4\\)</span></p><p>Couche K : 2 électrons, couche L : 6 électrons.</p>"
       },
       {
         "question": "<p><strong>1.3</strong> (1 pt) En appliquant la règle de l'octet, précise le nombre d'électrons que doit céder ou gagner l'atome d'oxygène pour devenir stable.</p>",
         "reponse": "<p><strong>Solution :</strong></p><p>L'atome d'oxygène a 6 électrons sur sa couche externe (couche L). Pour respecter la règle de l'octet (8 électrons sur la couche externe), il doit <strong>gagner 2 électrons</strong> pour former l'ion <span class='math'>\\(O^{2-}\\)</span>.</p>"
       },
       {
         "question": "<p><strong>1.4</strong> (1 pt) L'oxygène possède un isotope : <span class='math'>\\(^{18}_{8}O\\)</span>. Explique en quoi il diffère de <span class='math'>\\(^{16}_{8}O\\)</span>.</p>",
         "reponse": "<p><strong>Solution :</strong></p><p>Les deux atomes sont des <strong>isotopes</strong> : ils ont le même nombre de protons (Z=8) mais un nombre de neutrons différent.</p><ul><li><span class='math'>\\(^{16}_{8}O\\)</span> : 8 neutrons</li><li><span class='math'>\\(^{18}_{8}O\\)</span> : 10 neutrons (18 - 8 = 10)</li></ul>"
       }
     ]
   },
   {
     "titre": "Exercice 2 : La molécule",
     "points": "4 pts",
     "enonce": "<p>On considère la molécule d'éthanol de formule brute <span class='math'>\\(C_2H_6O\\)</span>.</p>",
     "questions": [
       {
         "question": "<p><strong>2.1</strong> (1 pt) Combien d'atomes de carbone, d'hydrogène et d'oxygène contient une molécule d'éthanol ?</p>",
         "reponse": "<p><strong>Solution :</strong></p><p><span class='math'>\\(C_2H_6O\\)</span> signifie :</p><ul><li>2 atomes de carbone (C)</li><li>6 atomes d'hydrogène (H)</li><li>1 atome d'oxygène (O)</li></ul>"
       },
       {
         "question": "<p><strong>2.2</strong> (1,5 pts) Écris la formule développée de l'éthanol sachant que les atomes de carbone sont liés entre eux, que l'atome d'oxygène est lié à un atome de carbone et à un atome d'hydrogène, et que chaque atome de carbone est également lié à des atomes d'hydrogène.</p>",
         "reponse": "<p><strong>Solution :</strong></p><p>La formule développée de l'éthanol est : <span class='math'>\\(CH_3-CH_2-OH\\)</span></p><p>Les deux atomes de carbone sont liés entre eux. Le premier carbone est lié à 3 hydrogènes, le deuxième à 2 hydrogènes et au groupe OH.</p>"
       },
       {
         "question": "<p><strong>2.3</strong> (1,5 pts) Décris les modèles moléculaires compact et éclaté de l'éthanol.</p>",
         "reponse": "<p><strong>Solution :</strong></p><ul><li><strong>Modèle compact :</strong> Les atomes sont représentés par des sphères de taille proportionnelle à leur rayon atomique. Les liaisons ne sont pas visibles. On voit l'encombrement de la molécule.</li><li><strong>Modèle éclaté :</strong> Les atomes sont représentés par des sphères plus petites, reliées par des tiges qui symbolisent les liaisons chimiques. On voit clairement la structure de la molécule.</li></ul>"
       }
     ]
   },
   {
     "titre": "Exercice 3 : Puissance et énergie électrique",
     "points": "4 pts",
     "enonce": "<p>Un fer à repasser de puissance 1800 W fonctionne pendant 45 minutes.</p>",
     "questions": [
       {
         "question": "<p><strong>3.1</strong> (1 pt) Calcule l'énergie électrique consommée en joules.</p>",
         "reponse": "<p><strong>Solution :</strong></p><p><span class='math'>\\(E = P \\times t\\)</span></p><p><span class='math'>\\(t = 45\\,min = 45 \\times 60 = 2700\\,s\\)</span></p><p><span class='math'>\\(E = 1800 \\times 2700 = 4\\,860\\,000\\,J = 4,86\\,MJ\\)</span></p>"
       },
       {
         "question": "<p><strong>3.2</strong> (1 pt) Exprime cette énergie en kilowattheures (kWh).</p>",
         "reponse": "<p><strong>Solution :</strong></p><p><span class='math'>\\(1\\,kWh = 3,6 \\times 10^6\\,J\\)</span></p><p><span class='math'>\\(E = \\dfrac{4\\,860\\,000}{3,6 \\times 10^6} = 1,35\\,kWh\\)</span></p>"
       },
       {
         "question": "<p><strong>3.3</strong> (1 pt) Quel est le coût de fonctionnement si le kWh est facturé 150 FCFA ?</p>",
         "reponse": "<p><strong>Solution :</strong></p><p><span class='math'>\\(Coût = 1,35 \\times 150 = 202,5\\,FCFA\\)</span></p>"
       },
       {
         "question": "<p><strong>3.4</strong> (1 pt) Le fer à repasser est branché sur une prise délivrant 230 V. Calcule l'intensité du courant qui le traverse.</p>",
         "reponse": "<p><strong>Solution :</strong></p><p>D'après la relation <span class='math'>\\(P = U \\times I\\)</span> :</p><p><span class='math'>\\(I = \\dfrac{P}{U} = \\dfrac{1800}{230} \\approx 7,83\\,A\\)</span></p>"
       }
     ]
   },
   {
     "titre": "Exercice 4 : Les forces mécaniques",
     "points": "4 pts",
     "enonce": "<p>Un objet de masse 5 kg est posé sur une table horizontale. Il est soumis à son poids et à la réaction de la table.</p><p>On donne : g = 10 N/kg</p>",
     "questions": [
       {
         "question": "<p><strong>4.1</strong> (1 pt) Calcule la valeur du poids de l'objet.</p>",
         "reponse": "<p><strong>Solution :</strong></p><p><span class='math'>\\(P = m \\times g = 5 \\times 10 = 50\\,N\\)</span></p><p>Le poids de l'objet est de <strong>50 N</strong>.</p>"
       },
       {
         "question": "<p><strong>4.2</strong> (1 pt) Quelles sont les caractéristiques de cette force (direction, sens, point d'application) ?</p>",
         "reponse": "<p><strong>Solution :</strong></p><ul><li><strong>Direction :</strong> verticale</li><li><strong>Sens :</strong> vers le bas</li><li><strong>Point d'application :</strong> centre de gravité de l'objet</li></ul>"
       },
       {
         "question": "<p><strong>4.3</strong> (1 pt) L'objet est immobile. Que peut-on dire des forces qui s'exercent sur lui ? Justifie.</p>",
         "reponse": "<p><strong>Solution :</strong></p><p>L'objet étant immobile, les forces qui s'exercent sur lui se <strong>compensent</strong>.</p><p>Le poids <span class='math'>\\(\\vec{P}\\)</span> et la réaction <span class='math'>\\(\\vec{R}\\)</span> de la table ont la même valeur (50 N), la même direction (verticale) et des sens opposés.</p>"
       },
       {
         "question": "<p><strong>4.4</strong> (1 pt) Distingue les forces de contact et les forces à distance dans cet exemple.</p>",
         "reponse": "<p><strong>Solution :</strong></p><ul><li><strong>Force de contact :</strong> la réaction de la table sur l'objet (contact entre l'objet et la table)</li><li><strong>Force à distance :</strong> le poids (action de la Terre sur l'objet, qui s'exerce même sans contact)</li></ul>"
       }
     ]
   },
   {
     "titre": "Exercice 5 : Réflexion de la lumière",
     "points": "4 pts",
     "enonce": "<p>Un rayon lumineux arrive sur un miroir plan avec un angle d'incidence de 45°.</p>",
     "questions": [
       {
         "question": "<p><strong>5.1</strong> (1 pt) Énonce les deux lois de Descartes pour la réflexion.</p>",
         "reponse": "<p><strong>Solution :</strong></p><ul><li>Le rayon incident, le rayon réfléchi et la normale sont dans un même plan.</li><li>L'angle d'incidence <span class='math'>\\(i\\)</span> est égal à l'angle de réflexion <span class='math'>\\(r\\)</span>.</li></ul>"
       },
       {
         "question": "<p><strong>5.2</strong> (1 pt) Calcule l'angle de réflexion.</p>",
         "reponse": "<p><strong>Solution :</strong></p><p>D'après la deuxième loi : <span class='math'>\\(r = i = 45°\\)</span></p><p>L'angle de réflexion est de <strong>45°</strong>.</p>"
       },
       {
         "question": "<p><strong>5.3</strong> (1 pt) Fais un schéma représentant la situation avec le miroir, la normale, le rayon incident et le rayon réfléchi.</p>",
         "reponse": "<p><strong>Solution :</strong></p><p>L'élève doit tracer :</p><ul><li>Un miroir plan horizontal</li><li>La normale perpendiculaire au miroir</li><li>Le rayon incident faisant un angle de 45° avec la normale</li><li>Le rayon réfléchi faisant un angle de 45° avec la normale de l'autre côté</li></ul>"
       },
       {
         "question": "<p><strong>5.4</strong> (1 pt) Si on fait tourner le miroir de 10°, de quel angle sera dévié le rayon réfléchi ?</p>",
         "reponse": "<p><strong>Solution :</strong></p><p>Lorsque le miroir tourne d'un angle <span class='math'>\\(\\theta\\)</span>, le rayon réfléchi tourne d'un angle <span class='math'>\\(2\\theta\\)</span>.</p><p>Donc la déviation est : <span class='math'>\\(\\delta = 2 \\times 10 = 20°\\)</span></p><p>Le rayon réfléchi est dévié de <strong>20°</strong>.</p>"
       }
     ]
   }
 ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
