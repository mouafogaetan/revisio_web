<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Physique-Chimie",
  "classe": "2ème année",
  "sequence": "Évaluation Séquentielle n°5",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : À la découverte de l'atome et des molécules",
      "points": "5 pts",
      "enonce": "<div style='font-size: 1.1em; line-height: 1.6; color: #333;'>Cet exercice explore la structure de l'atome, la formation des molécules et les calculs associés.</div>",
      "questions": [
        {
          "question": "<div style='margin: 15px 0;'><strong>1.1 (1 pt)</strong> L'atome est constitué de trois particules élémentaires. Donnez leur nom et leur charge électrique.</div>",
          "reponse": "<div style='padding: 10px; background-color: #e8f4f8; border-radius: 8px; color: #1a2b4c;'>Les trois particules élémentaires sont :<br>- Le proton (charge positive)<br>- Le neutron (charge nulle)<br>- L'électron (charge négative)</div>"
        },
        {
          "question": "<div style='margin: 15px 0;'><strong>1.2 (1 pt)</strong> Le magnésium (Mg) a pour numéro atomique Z = 12 et nombre de masse A = 24. <br>Écrivez la représentation symbolique du noyau de cet atome et donnez sa composition en protons, neutrons et électrons.</div>",
          "reponse": "<div style='padding: 10px; background-color: #e8f4f8; border-radius: 8px; color: #1a2b4c;'>Représentation : \\( ^{24}_{12}Mg \\) <br> Composition : <br>- 12 protons <br>- 24 - 12 = 12 neutrons <br>- 12 électrons (atome neutre)</div>"
        },
        {
          "question": "<div style='margin: 15px 0;'><strong>1.3 (1 pt)</strong> L'atome de silicium (Si) a pour configuration électronique : (K)<sup>2</sup> (L)<sup>8</sup> (M)<sup>4</sup>. <br>En utilisant la règle de l'octet, dites combien d'électrons doit partager ou céder un atome de silicium pour être stable. Justifiez votre réponse.</div>",
          "reponse": "<div style='padding: 10px; background-color: #e8f4f8; border-radius: 8px; color: #1a2b4c;'>Un atome de silicium doit partager ou céder 4 électrons pour être stable. <br>Justification : Il possède 4 électrons sur sa couche externe (M). Pour respecter la règle de l'octet, il doit atteindre 8 électrons sur cette couche, ce qui correspond à un gain de 4 électrons. Il peut donc former 4 liaisons covalentes.</div>"
        },
        {
          "question": "<div style='margin: 15px 0;'><strong>1.4 (1 pt)</strong> Le méthane est une molécule formée d'un atome de carbone (C) et de quatre atomes d'hydrogène (H). Sachant que le carbone respecte la règle de l'octet et l'hydrogène celle du duet, proposez la formule de Lewis de la molécule de méthane.</div>",
          "reponse": "<div style='padding: 10px; background-color: #e8f4f8; border-radius: 8px; color: #1a2b4c;'>La formule de Lewis du méthane est : <br>H<br>|<br>H – C – H<br>|<br>H<br>Chaque atome d'hydrogène partage une paire d'électrons avec le carbone. Le carbone est entouré de 8 électrons (octet) et chaque hydrogène de 2 électrons (duet).</div>"
        },
        {
          "question": "<div style='margin: 15px 0;'><strong>1.5 (1 pt)</strong> On considère un échantillon contenant \\( 3,01 \\times 10^{23} \\) molécules d'eau (H₂O). <br>Calculez la quantité de matière (nombre de moles) correspondante. On donne \\( N_A = 6,02 \\times 10^{23} \\) mol⁻¹.</div>",
          "reponse": "<div style='padding: 10px; background-color: #e8f4f8; border-radius: 8px; color: #1a2b4c;'>\\( n = \\frac{N}{N_A} = \\frac{3,01 \\times 10^{23}}{6,02 \\times 10^{23}} = 0,5 \\) mol.</div>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Le mouvement et les forces",
      "points": "4 pts",
      "enonce": "<div style='font-size: 1.1em; line-height: 1.6; color: #333;'>Cet exercice met en application les notions de vitesse, de mouvement et de forces.</div>",
      "questions": [
        {
          "question": "<div style='margin: 15px 0;'><strong>2.1 (1 pt)</strong> Un cycliste parcourt une distance de 12 km en 30 minutes. <br>Calculez sa vitesse moyenne en m/s. (Rappel : 1 km = 1000 m, 1 h = 3600 s).</div>",
          "reponse": "<div style='padding: 10px; background-color: #e8f4f8; border-radius: 8px; color: #1a2b4c;'>Vitesse = Distance / Temps. <br>Distance = 12 km = 12 000 m. Temps = 30 min = 0,5 h = 1800 s. <br>Vitesse = 12000 / 1800 = 6,67 m/s.</div>"
        },
        {
          "question": "<div style='margin: 15px 0;'><strong>2.2 (1 pt)</strong> Lorsqu'une voiture freine sur une route horizontale, quelle force est principalement responsable de son ralentissement ? Nommez cette force et donnez sa direction et son sens.</div>",
          "reponse": "<div style='padding: 10px; background-color: #e8f4f8; border-radius: 8px; color: #1a2b4c;'>La force de frottement (ou force de freinage) est responsable du ralentissement. Sa direction est horizontale et son sens est opposé au mouvement de la voiture.</div>"
        },
        {
          "question": "<div style='margin: 15px 0;'><strong>2.3 (1 pt)</strong> Distinguez une force de contact d'une force de champ en donnant un exemple pour chacune.</div>",
          "reponse": "<div style='padding: 10px; background-color: #e8f4f8; border-radius: 8px; color: #1a2b4c;'>Une force de contact s'exerce lorsqu'il y a contact physique entre deux objets. Exemple : la force que la main exerce sur une porte pour l'ouvrir. <br>Une force de champ s'exerce à distance sans contact matériel. Exemple : la force gravitationnelle exercée par la Terre sur un objet.</div>"
        },
        {
          "question": "<div style='margin: 15px 0;'><strong>2.4 (1 pt)</strong> La Terre exerce une force d'attraction sur la Lune. D'après le principe des actions réciproques (3e loi de Newton), quelle est la réaction à cette force ?</div>",
          "reponse": "<div style='padding: 10px; background-color: #e8f4f8; border-radius: 8px; color: #1a2b4c;'>La Lune exerce une force d'attraction sur la Terre de même intensité et de même direction, mais de sens opposé.</div>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Le courant électrique continu",
      "points": "4 pts",
      "enonce": "<div style='font-size: 1.1em; line-height: 1.6; color: #333;'>Les questions suivantes portent sur la nature du courant électrique, les montages électriques et les calculs d'énergie.</div>",
      "questions": [
        {
          "question": "<div style='margin: 15px 0;'><strong>3.1 (1 pt)</strong> Définissez la nature du courant électrique dans un conducteur métallique.</div>",
          "reponse": "<div style='padding: 10px; background-color: #e8f4f8; border-radius: 8px; color: #1a2b4c;'>Le courant électrique dans un conducteur métallique est un mouvement d'ensemble d'électrons libres.</div>"
        },
        {
          "question": "<div style='margin: 15px 0;'><strong>3.2 (1 pt)</strong> Un fer à repasser est traversé par un courant d'intensité I = 5 A sous une tension U = 220 V. <br>Calculez la puissance électrique P consommée par le fer à repasser.</div>",
          "reponse": "<div style='padding: 10px; background-color: #e8f4f8; border-radius: 8px; color: #1a2b4c;'>\\( P = U \\times I = 220 \\times 5 = 1100 \\) W.</div>"
        },
        {
          "question": "<div style='margin: 15px 0;'><strong>3.3 (1 pt)</strong> Ce fer à repasser est utilisé pendant 1h30. <br>Calculez l'énergie électrique E consommée en kWh.</div>",
          "reponse": "<div style='padding: 10px; background-color: #e8f4f8; border-radius: 8px; color: #1a2b4c;'>\\( E = P \\times t \\). <br>P = 1100 W = 1,1 kW. t = 1,5 h. <br>E = 1,1 × 1,5 = 1,65 kWh.</div>"
        },
        {
          "question": "<div style='margin: 15px 0;'><strong>3.4 (1 pt)</strong> Pour allumer une lampe, on réalise un circuit électrique simple. Citez les trois éléments indispensables à la réalisation d'un tel circuit.</div>",
          "reponse": "<div style='padding: 10px; background-color: #e8f4f8; border-radius: 8px; color: #1a2b4c;'>Les trois éléments indispensables sont :<br>- Un générateur (pile ou prise)<br>- Un récepteur (lampe)<br>- Des fils de connexion</div>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Les réactions chimiques",
      "points": "4 pts",
      "enonce": "<div style='font-size: 1.1em; line-height: 1.6; color: #333;'>Cet exercice traite des réactions chimiques et de l'exploitation des équations-bilan.</div>",
      "questions": [
        {
          "question": "<div style='margin: 15px 0;'><strong>4.1 (1 pt)</strong> Équilibrez l'équation-bilan de la réaction suivante : <br>\\( C_3H_8 + O_2 \\rightarrow CO_2 + H_2O \\)</div>",
          "reponse": "<div style='padding: 10px; background-color: #e8f4f8; border-radius: 8px; color: #1a2b4c;'>L'équation équilibrée est : <br>\\( C_3H_8 + 5O_2 \\rightarrow 3CO_2 + 4H_2O \\)</div>"
        },
        {
          "question": "<div style='margin: 15px 0;'><strong>4.2 (1 pt)</strong> On réalise la combustion de 0,2 mol de propane (C₃H₈) dans le dioxygène. <br>D'après l'équation-bilan équilibrée, quelle quantité de matière de dioxygène est consommée ?</div>",
          "reponse": "<div style='padding: 10px; background-color: #e8f4f8; border-radius: 8px; color: #1a2b4c;'>D'après l'équation, 1 mol de C₃H₈ réagit avec 5 mol de O₂. <br>Pour 0,2 mol de C₃H₈, la quantité de O₂ est 0,2 × 5 = 1,0 mol.</div>"
        },
        {
          "question": "<div style='margin: 15px 0;'><strong>4.3 (1 pt)</strong> Quelle est la masse molaire moléculaire du propane (C₃H₈) ? <br>Données : M(C) = 12 g/mol, M(H) = 1 g/mol.</div>",
          "reponse": "<div style='padding: 10px; background-color: #e8f4f8; border-radius: 8px; color: #1a2b4c;'>M(C₃H₈) = 3 × 12 + 8 × 1 = 36 + 8 = 44 g/mol.</div>"
        },
        {
          "question": "<div style='margin: 15px 0;'><strong>4.4 (1 pt)</strong> On fait brûler 3,4 g de propane. Sachant que le volume molaire des gaz est \\( V_m = 24 L/mol \\), calculez le volume de dioxyde de carbone (CO₂) formé.</div>",
          "reponse": "<div style='padding: 10px; background-color: #e8f4f8; border-radius: 8px; color: #1a2b4c;'>1) Quantité de matière de propane : n = m / M = 3,4 / 44 = 0,077 mol. <br>2) D'après l'équation, 1 mol de C₃H₈ donne 3 mol de CO₂. Donc n(CO₂) = 3 × 0,077 = 0,231 mol. <br>3) Volume de CO₂ : V = n × Vm = 0,231 × 24 = 5,54 L.</div>"
        }
      ]
    },
    {
      "titre": "Exercice 5 : La réflexion de la lumière",
      "points": "3 pts",
      "enonce": "<div style='font-size: 1.1em; line-height: 1.6; color: #333;'>Cet exercice est consacré aux lois de la réflexion et à l'utilisation des miroirs plans.</div>",
      "questions": [
        {

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
