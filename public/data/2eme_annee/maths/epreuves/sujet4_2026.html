<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
 "matiere": "Mathématiques",
 "classe": "2ème année",
 "sequence": "Évaluation Séquentielle n°4",
 "anneeScolaire": "2025-2026",
 "exercices": [
   {
     "titre": "Exercice 1 : Proportionnalité",
     "points": "3 pts",
     "enonce": "<div style='background: #fdfefe; padding: 15px; border-radius: 10px; font-family: Arial, sans-serif;'><p>Le tableau suivant donne la distance parcourue par une voiture en fonction du temps.</p><table style='width: 100%; border-collapse: collapse; margin: 15px 0;'><tr style='background: #f0f0f0;'><th style='border: 1px solid #ddd; padding: 8px; text-align: center;'>Temps (en heures)</th><td style='border: 1px solid #ddd; padding: 8px; text-align: center;'>1</td><td style='border: 1px solid #ddd; padding: 8px; text-align: center;'>2</td><td style='border: 1px solid #ddd; padding: 8px; text-align: center;'>3</td><td style='border: 1px solid #ddd; padding: 8px; text-align: center;'>5</td></tr><tr><th style='border: 1px solid #ddd; padding: 8px; text-align: center;'>Distance (en km)</th><td style='border: 1px solid #ddd; padding: 8px; text-align: center;'>60</td><td style='border: 1px solid #ddd; padding: 8px; text-align: center;'>120</td><td style='border: 1px solid #ddd; padding: 8px; text-align: center;'>180</td><td style='border: 1px solid #ddd; padding: 8px; text-align: center;'>300</td></tr></table></div>",
     "questions": [
       {
         "question": "1) Ce tableau est-il un tableau de proportionnalité ? Justifie ta réponse.",
         "reponse": "<p>Oui, c'est un tableau de proportionnalité car le rapport <span class='math inline'>\\( \\frac{\\text{Distance}}{\\text{Temps}} = 60 \\)</span> est constant. Le coefficient de proportionnalité est 60 (la vitesse en km/h).</p>"
       },
       {
         "question": "2) Calcule la distance parcourue en 8 heures.",
         "reponse": "<p>En 8 heures, la distance parcourue est <span class='math inline'>\\( 8 \\times 60 = 480 \\)</span> km.</p>"
       },
       {
         "question": "3) Combien de temps faut-il pour parcourir 420 km ?",
         "reponse": "<p>Temps = <span class='math inline'>\\( \\frac{420}{60} = 7 \\)</span> heures.</p>"
       }
     ]
   },
   {
     "titre": "Exercice 2 : Pourcentages et Échelles",
     "points": "4 pts",
     "enonce": "<div style='background: #fdfefe; padding: 15px; border-radius: 10px; font-family: Arial, sans-serif;'><p>Un commerçant achète un article à 25 000 FCFA. Il applique une marge de 30% sur le prix d'achat.</p></div>",
     "questions": [
       {
         "question": "1) Calcule le montant de la marge.",
         "reponse": "<p>Marge = 30% de 25 000 = <span class='math inline'>\\( \\frac{30}{100} \\times 25 000 = 7 500 \\)</span> FCFA.</p>"
       },
       {
         "question": "2) Détermine le prix de vente hors taxe (HT) de l'article.",
         "reponse": "<p>Prix HT = Prix d'achat + Marge = 25 000 + 7 500 = 32 500 FCFA.</p>"
       },
       {
         "question": "3) Une remise de 15% est accordée sur le prix HT. Calcule le montant de la remise.",
         "reponse": "<p>Remise = 15% de 32 500 = <span class='math inline'>\\( \\frac{15}{100} \\times 32 500 = 4 875 \\)</span> FCFA.</p>"
       },
       {
         "question": "4) Calcule le prix final payé par le client.",
         "reponse": "<p>Prix final = 32 500 - 4 875 = 27 625 FCFA.</p>"
       }
     ]
   },
   {
     "titre": "Exercice 3 : Statistiques",
     "points": "3 pts",
     "enonce": "<div style='background: #fdfefe; padding: 15px; border-radius: 10px; font-family: Arial, sans-serif;'><p>Voici les notes obtenues par une classe de 2<sup>ème</sup> année lors d'un devoir de mathématiques :</p><p style='text-align: center;'>12 - 14 - 10 - 8 - 16 - 14 - 12 - 10 - 8 - 14 - 12 - 16 - 10 - 12 - 14</p></div>",
     "questions": [
       {
         "question": "1) Construis le tableau des effectifs et des fréquences de cette série statistique.",
         "reponse": "<table style='width: 100%; border-collapse: collapse; margin: 15px 0;'><tr style='background: #f0f0f0;'><th style='border: 1px solid #ddd; padding: 8px; text-align: center;'>Note</th><td style='border: 1px solid #ddd; padding: 8px; text-align: center;'>8</td><td style='border: 1px solid #ddd; padding: 8px; text-align: center;'>10</td><td style='border: 1px solid #ddd; padding: 8px; text-align: center;'>12</td><td style='border: 1px solid #ddd; padding: 8px; text-align: center;'>14</td><td style='border: 1px solid #ddd; padding: 8px; text-align: center;'>16</td></tr><tr><th style='border: 1px solid #ddd; padding: 8px; text-align: center;'>Effectif</th><td style='border: 1px solid #ddd; padding: 8px; text-align: center;'>2</td><td style='border: 1px solid #ddd; padding: 8px; text-align: center;'>3</td><td style='border: 1px solid #ddd; padding: 8px; text-align: center;'>4</td><td style='border: 1px solid #ddd; padding: 8px; text-align: center;'>4</td><td style='border: 1px solid #ddd; padding: 8px; text-align: center;'>2</td></tr><tr><th style='border: 1px solid #ddd; padding: 8px; text-align: center;'>Fréquence</th><td style='border: 1px solid #ddd; padding: 8px; text-align: center;'>2/15</td><td style='border: 1px solid #ddd; padding: 8px; text-align: center;'>3/15</td><td style='border: 1px solid #ddd; padding: 8px; text-align: center;'>4/15</td><td style='border: 1px solid #ddd; padding: 8px; text-align: center;'>4/15</td><td style='border: 1px solid #ddd; padding: 8px; text-align: center;'>2/15</td></tr></table>"
       },
       {
         "question": "2) Calcule la moyenne de cette série de notes.",
         "reponse": "<p>Moyenne = <span class='math inline'>\\( \\frac{2\\times8 + 3\\times10 + 4\\times12 + 4\\times14 + 2\\times16}{15} = \\frac{16 + 30 + 48 + 56 + 32}{15} = \\frac{182}{15} \\approx 12,13 \\)</span></p>"
       },
       {
         "question": "3) Détermine la médiane et l'étendue de cette série.",
         "reponse": "<p>La série est déjà rangée. L'effectif total est 15 (impair). La médiane est la 8<sup>ème</sup> valeur : c'est 12.</p><p>Étendue = 16 - 8 = 8.</p>"
       }
     ]
   },
   {
     "titre": "Exercice 4 : Symétries centrales et orthogonales",
     "points": "3 pts",
     "enonce": "<div style='background: #fdfefe; padding: 15px; border-radius: 10px; font-family: Arial, sans-serif;'><p>On considère un segment [AB] de longueur 6 cm. Soit O le milieu de [AB] et (d) la médiatrice de [AB].</p></div>",
     "questions": [
       {
         "question": "1) Construis le symétrique A' du point A par rapport à la droite (d). Justifie ta construction.",
         "reponse": "<p>Le symétrique de A par rapport à (d) est le point B car (d) est la médiatrice de [AB]. La symétrie axiale transforme A en B.</p>"
       },
       {
         "question": "2) Construis le symétrique A'' du point A par rapport au point O.",
         "reponse": "<p>Le symétrique de A par rapport à O est B car O est le milieu de [AB]. La symétrie centrale transforme A en B.</p>"
       },
       {
         "question": "3) Que remarques-tu ? Justifie.",
         "reponse": "<p>On remarque que A' = A'' = B. La symétrie axiale d'axe (d) et la symétrie centrale de centre O transforment A en B. Cela est dû au fait que (d) est la médiatrice de [AB] et O le milieu de [AB].</p>"
       }
     ]
   },
   {
     "titre": "Exercice 5 : Triangles",
     "points": "3 pts",
     "enonce": "<div style='background: #fdfefe; padding: 15px; border-radius: 10px; font-family: Arial, sans-serif;'><p>On considère un triangle ABC rectangle en A tel que AB = 3 cm et AC = 4 cm.</p></div>",
     "questions": [
       {
         "question": "1) Calcule la longueur BC.",
         "reponse": "<p>D'après le théorème de Pythagore : <span class='math inline'>\\( BC^2 = AB^2 + AC^2 = 3^2 + 4^2 = 9 + 16 = 25 \\)</span></p><p><span class='math inline'>\\( BC = \\sqrt{25} = 5 \\)</span> cm.</p>"
       },
       {
         "question": "2) Quelle est la nature du triangle BCD si D est le symétrique de A par rapport au point B ?",
         "reponse": "<p>Le triangle BCD est un triangle isocèle en B car BA = BD (B est le milieu de [AD]) et BC = BA = BD.</p>"
       },
       {
         "question": "3) Construis le cercle circonscrit au triangle ABC. Où se trouve son centre ?",
         "reponse": "<p>Pour un triangle rectangle, le centre du cercle circonscrit est le milieu de l'hypoténuse. Ici, l'hypoténuse est [BC] car l'angle droit est en A. Le centre est donc le milieu de [BC].</p>"
       }
     ]
   }
 ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
