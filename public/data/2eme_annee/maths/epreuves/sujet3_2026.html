<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Mathématiques",
  "classe": "2ème année",
  "sequence": "Séquence 3",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Nombres décimaux relatifs",
      "points": "4 pts",
      "enonce": "<div><p>Le tableau ci-dessous donne les températures relevées dans trois villes du Cameroun à deux moments de la journée.</p><div style='overflow-x: auto;'><table style='width: 100%; border-collapse: collapse; margin: 10px 0;'><tr style='background-color: #34495e; color: white;'><th style='padding: 8px; border: 1px solid #ddd;'>Ville</th><th style='padding: 8px; border: 1px solid #ddd;'>Matin (°C)</th><th style='padding: 8px; border: 1px solid #ddd;'>Après-midi (°C)</th></tr><tr><td style='padding: 8px; border: 1px solid #ddd;'>Yaoundé</td><td style='padding: 8px; border: 1px solid #ddd;'>+22</td><td style='padding: 8px; border: 1px solid #ddd;'>+30</td></tr><tr style='background-color: #f2f2f2;'><td style='padding: 8px; border: 1px solid #ddd;'>Bamenda</td><td style='padding: 8px; border: 1px solid #ddd;'>+18</td><td style='padding: 8px; border: 1px solid #ddd;'>+25</td></tr><tr><td style='padding: 8px; border: 1px solid #ddd;'>Garoua</td><td style='padding: 8px; border: 1px solid #ddd;'>+25</td><td style='padding: 8px; border: 1px solid #ddd;'>+38</td></tr></table></div></div>",
      "questions": [
        {
          "question": "<p><strong>1.1</strong> Calculer la variation de température entre le matin et l'après-midi pour chaque ville. (1 pt)</p>",
          "reponse": "<p>Yaoundé : $30 - 22 = 8$ °C<br>Bamenda : $25 - 18 = 7$ °C<br>Garoua : $38 - 25 = 13$ °C</p>"
        },
        {
          "question": "<p><strong>1.2</strong> Ranger ces trois villes de celle qui a la plus petite variation à celle qui a la plus grande variation. (1 pt)</p>",
          "reponse": "<p>Bamenda (7°C) < Yaoundé (8°C) < Garoua (13°C)</p>"
        },
        {
          "question": "<p><strong>1.3</strong> Calculer la température moyenne de ces trois villes l'après-midi. (1 pt)</p>",
          "reponse": "<p>$\\frac{30 + 25 + 38}{3} = \\frac{93}{3} = 31$ °C</p>"
        },
        {
          "question": "<p><strong>1.4</strong> À Garoua, la température descend de 12 °C pendant la nuit. Quelle est la température nocturne ? (1 pt)</p>",
          "reponse": "<p>$38 - 12 = 26$ °C</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Nombres rationnels",
      "points": "5 pts",
      "enonce": "<div><p>Un éleveur de poulets à Bafoussam vend des œufs. Il a vendu les quantités suivantes :</p><ul><li>Lundi : $\\frac{1}{4}$ de sa production</li><li>Mardi : $\\frac{1}{3}$ de sa production</li><li>Mercredi : $\\frac{1}{6}$ de sa production</li><li>Jeudi : le reste, soit 45 œufs</li></ul><p><strong>Consigne :</strong> Réponds aux questions suivantes.</p></div>",
      "questions": [
        {
          "question": "<p><strong>2.1</strong> Quelle fraction de la production a été vendue les trois premiers jours ? (1 pt)</p>",
          "reponse": "<p>$\\frac{1}{4} + \\frac{1}{3} + \\frac{1}{6} = \\frac{3}{12} + \\frac{4}{12} + \\frac{2}{12} = \\frac{9}{12} = \\frac{3}{4}$</p>"
        },
        {
          "question": "<p><strong>2.2</strong> Quelle fraction de la production représente le reste (jeudi) ? (1 pt)</p>",
          "reponse": "<p>$1 - \\frac{3}{4} = \\frac{1}{4}$</p>"
        },
        {
          "question": "<p><strong>2.3</strong> Déterminer la production totale d'œufs de l'éleveur. (1,5 pt)</p>",
          "reponse": "<p>Si $\\frac{1}{4}$ de la production correspond à 45 œufs, alors la production totale est $45 \\times 4 = 180$ œufs.</p>"
        },
        {
          "question": "<p><strong>2.4</strong> Calculer le nombre d'œufs vendus lundi, mardi et mercredi. (1,5 pt)</p>",
          "reponse": "<p>Lundi : $180 \\times \\frac{1}{4} = 45$ œufs<br>Mardi : $180 \\times \\frac{1}{3} = 60$ œufs<br>Mercredi : $180 \\times \\frac{1}{6} = 30$ œufs</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Équations du premier degré",
      "points": "4 pts",
      "enonce": "<div><p>Un magasin de Douala propose des réductions sur des chaussures. Un client achète des chaussures qui coûtent initialement un certain prix. Après une réduction, il paie 16 500 FCFA.</p></div>",
      "questions": [
        {
          "question": "<p><strong>3.1</strong> Si la réduction est de 4 500 FCFA, quel était le prix initial des chaussures ? (1 pt)</p>",
          "reponse": "<p>Soit $x$ le prix initial. $x - 4500 = 16500$, donc $x = 16500 + 4500 = 21000$ FCFA.</p>"
        },
        {
          "question": "<p><strong>3.2</strong> Si la réduction est de 25% du prix initial, quel était le prix initial des chaussures ? (1,5 pt)</p>",
          "reponse": "<p>Soit $x$ le prix initial. On a $x - 25\\% \\times x = 16500$, soit $x - 0,25x = 16500$, donc $0,75x = 16500$. $x = \\frac{16500}{0,75} = 22000$ FCFA.</p>"
        },
        {
          "question": "<p><strong>3.3</strong> Si le client avait acheté 3 paires identiques, il aurait bénéficié d'une réduction de 15%. Combien aurait-il payé pour les 3 paires ? (1,5 pt)</p>",
          "reponse": "<p>Prix total sans réduction : $3 \\times 22000 = 66000$ FCFA.<br>Avec réduction de 15% : $66000 - 15\\% \\times 66000 = 66000 - 9900 = 56100$ FCFA.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Proportionnalité et pourcentages",
      "points": "5 pts",
      "enonce": "<div><p>Un transporteur effectue le trajet Douala-Yaoundé. Il consomme 8 litres de carburant pour 100 km. La distance Douala-Yaoundé est de 250 km.</p></div>",
      "questions": [
        {
          "question": "<p><strong>4.1</strong> Combien de litres de carburant consomme-t-il pour ce trajet ? (1 pt)</p>",
          "reponse": "<p>$8 \\times \\frac{250}{100} = 8 \\times 2,5 = 20$ litres</p>"
        },
        {
          "question": "<p><strong>4.2</strong> Si le prix du carburant est de 750 FCFA le litre, quel est le coût du carburant pour ce trajet ? (1 pt)</p>",
          "reponse": "<p>$20 \\times 750 = 15000$ FCFA</p>"
        },
        {
          "question": "<p><strong>4.3</strong> Le transporteur fait ce trajet 5 fois par semaine. Quel est son coût hebdomadaire en carburant ? (1 pt)</p>",
          "reponse": "<p>$15000 \\times 5 = 75000$ FCFA</p>"
        },
        {
          "question": "<p><strong>4.4</strong> Le prix du carburant augmente de 5%. Quel sera le nouveau prix du litre ? (1 pt)</p>",
          "reponse": "<p>$750 + 5\\% \\times 750 = 750 + 37,5 = 787,5$ FCFA</p>"
        },
        {
          "question": "<p><strong>4.5</strong> Si le transporteur veut faire un bénéfice de 20% sur le coût du carburant pour un trajet, quel prix doit-il facturer pour le carburant ? (1 pt)</p>",
          "reponse": "<p>$15000 + 20\\% \\times 15000 = 15000 + 3000 = 18000$ FCFA</p>"
        }
      ]
    },
    {
      "titre": "Exercice 5 : Statistiques",
      "points": "4 pts",
      "enonce": "<div><p>Une enquête a été réalisée auprès des élèves d'une classe de 2ème année sur leur sport préféré. Voici les résultats :</p><div style='overflow-x: auto;'><table style='width: 100%; border-collapse: collapse; margin: 10px 0;'><tr style='background-color: #34495e; color: white;'><th style='padding: 8px; border: 1px solid #ddd;'>Sport</th><th style='padding: 8px; border: 1px solid #ddd;'>Football</th><th style='padding: 8px; border: 1px solid #ddd;'>Basketball</th><th style='padding: 8px; border: 1px solid #ddd;'>Volleyball</th><th style='padding: 8px; border: 1px solid #ddd;'>Athlétisme</th></tr><tr><td style='padding: 8px; border: 1px solid #ddd;'>Effectif</td><td style='padding: 8px; border: 1px solid #ddd;'>12</td><td style='padding: 8px; border: 1px solid #ddd;'>8</td><td style='padding: 8px; border: 1px solid #ddd;'>6</td><td style='padding: 8px; border: 1px solid #ddd;'>4</td></tr></table></div></div>",
      "questions": [
        {
          "question": "<p><strong>5.1</strong> Quel est l'effectif total de la classe ? (0,5 pt)</p>",
          "reponse": "<p>$12 + 8 + 6 + 4 = 30$ élèves</p>"
        },
        {
          "question": "<p><strong>5.2</strong> Calculer la fréquence (en pourcentage) de chaque sport. (1 pt)</p>",
          "reponse": "<p>Football : $\\frac{12}{30} \\times 100 = 40\\%$<br>Basketball : $\\frac{8}{30} \\times 100 \\approx 26,7\\%$<br>Volleyball : $\\frac{6}{30} \\times 100 = 20\\%$<br>Atllétisme : $\\frac{4}{30} \\times 100 \\approx 13,3\\%$</p>"
        },
        {
          "question": "<p><strong>5.3</strong> Construire un diagramme circulaire représentant ces données. (1 pt)</p>",
          "reponse": "<p>Diagramme circulaire avec des secteurs angulaires :<br>Football : $40\\% \\times 360° = 144°$<br>Basketball : $26,7\\% \\times 360° \\approx 96°$<br>Volleyball : $20\\% \\times 360° = 72°$<br>Atllétisme : $13,3\\% \\times 360° \\approx 48°$</p>"
        },
        {
          "question": "<p><strong>5.4</strong> Quel est le sport le plus pratiqué ? Quelle est sa fréquence ? (0,5 pt)</p>",
          "reponse": "<p>Le sport le plus pratiqué est le football avec 40% des élèves.</p>"
        },
        {
          "question": "<p><strong>5.5</strong> Combien d'élèves ne pratiquent pas le football ? (0,5 pt)</p>",
          "reponse": "<p>$30 - 12 = 18$ élèves</p>"
        },
        {
          "question": "<p><strong>5.6</strong> Quelle fraction des élèves préfère le basketball ou le volleyball ? (0,5 pt)</p>",
          "reponse": "<p>$\\frac{8 + 6}{30} = \\frac{14}{30} = \\frac{7}{15}$</p>"
        }
      ]
    },
    {
      "titre": "Exercice 6 : Géométrie (Distances et Angles)",
      "points": "4 pts",
      "enonce": "<div><p>Observe la figure ci-dessous :</p><div style='text-align: center; background-color: #ecf0f1; padding: 15px; border-radius: 8px; margin: 10px 0;'><p style='color: #2c3e50;'>📐 Figure : Triangle ABC avec M milieu de [AB]</p></div><p>On donne : $AB = 12$ cm, $AC = 10$ cm, $BC = 8$ cm.</p></div>",
      "questions": [
        {
          "question": "<p><strong>6.1</strong> Vérifier l'inégalité triangulaire pour ce triangle. (1 pt)</p>",
          "reponse": "<p>$AC + BC = 10 + 8 = 18 > 12$<br>$AB + BC = 12 + 8 = 20 > 10$<br>$AB + AC = 12 + 10 = 22 > 8$<br>Les trois inégalités sont vérifiées, donc le triangle est constructible.</p>"

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
