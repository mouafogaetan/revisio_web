<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Mathématiques",
  "classe": "2ème année",
  "sequence": "Séquence 6",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Nombres rationnels et opérations",
      "points": "4 pts",
      "enonce": "<div><p>Un cultivateur de la région du Noun produit du maïs. Il vend une partie de sa récolte à un commerçant de Bafoussam. Les opérations se font en plusieurs étapes.</p><p><strong>1ère étape :</strong> Il vend \( \\frac{2}{5} \) de sa récolte.</p><p><strong>2ème étape :</strong> Il vend \( \\frac{1}{3} \) du reste.</p><p><strong>3ème étape :</strong> Il lui reste alors 40 sacs de maïs.</p></div>",
      "questions": [
        {
          "question": "<p><strong>1.1</strong> Calculer la fraction de la récolte vendue lors de la 2ème étape par rapport à la récolte totale. (1 pt)</p>",
          "reponse": "<p>Reste après la 1ère étape : \( 1 - \\frac{2}{5} = \\frac{3}{5} \)<br>Vendu lors de la 2ème étape : \( \\frac{1}{3} \\times \\frac{3}{5} = \\frac{1}{5} \)</p>"
        },
        {
          "question": "<p><strong>1.2</strong> Calculer la fraction de la récolte vendue au total. (1 pt)</p>",
          "reponse": "<p>\( \\frac{2}{5} + \\frac{1}{5} = \\frac{3}{5} \)</p>"
        },
        {
          "question": "<p><strong>1.3</strong> Déterminer la fraction de la récolte restante. (0,5 pt)</p>",
          "reponse": "<p>\( 1 - \\frac{3}{5} = \\frac{2}{5} \)</p>"
        },
        {
          "question": "<p><strong>1.4</strong> Calculer la récolte totale du cultivateur. (1 pt)</p>",
          "reponse": "<p>Si \( \\frac{2}{5} \) de la récolte correspond à 40 sacs, alors la récolte totale est \( 40 \\times \\frac{5}{2} = 100 \) sacs.</p>"
        },
        {
          "question": "<p><strong>1.5</strong> Calculer le nombre de sacs vendus lors de chaque étape. (0,5 pt)</p>",
          "reponse": "<p>1ère étape : \( 100 \\times \\frac{2}{5} = 40 \) sacs<br>2ème étape : \( 100 \\times \\frac{1}{5} = 20 \) sacs</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Équations et problèmes de la vie courante",
      "points": "4 pts",
      "enonce": "<div><p>Un artisan de Yaoundé fabrique des tables et des chaises. Pour une commande spéciale, il doit livrer un certain nombre de tables.</p><p><strong>Informations :</strong></p><ul><li>Le prix d'une table est de 25 000 FCFA.</li><li>Le prix d'une chaise est de 8 000 FCFA.</li><li>Le client a commandé 3 tables et un certain nombre de chaises.</li><li>La facture totale s'élève à 115 000 FCFA.</li></ul></div>",
      "questions": [
        {
          "question": "<p><strong>2.1</strong> Écrire une équation permettant de déterminer le nombre de chaises commandées. (1 pt)</p>",
          "reponse": "<p>Soit \( x \) le nombre de chaises. On a : \( 3 \\times 25000 + x \\times 8000 = 115000 \)</p>"
        },
        {
          "question": "<p><strong>2.2</strong> Résoudre cette équation et donner le nombre de chaises. (1 pt)</p>",
          "reponse": "<p>\( 75000 + 8000x = 115000 \)<br>\( 8000x = 115000 - 75000 = 40000 \)<br>\( x = \\frac{40000}{8000} = 5 \)<br>Le client a commandé 5 chaises.</p>"
        },
        {
          "question": "<p><strong>2.3</strong> Si le client bénéficie d'une réduction de 10% sur le prix total, combien paiera-t-il ? (1 pt)</p>",
          "reponse": "<p>Réduction : \( 115000 \\times 0,1 = 11500 \) FCFA<br>Prix après réduction : \( 115000 - 11500 = 103500 \) FCFA</p>"
        },
        {
          "question": "<p><strong>2.4</strong> L'artisan veut faire un bénéfice de 20% sur le prix de vente. Quel prix de vente doit-il fixer pour une table ? (1 pt)</p>",
          "reponse": "<p>Si le bénéfice est de 20%, le prix de vente est égal à 120% du prix de revient.<br>\( 25000 \\times 1,2 = 30000 \) FCFA</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Proportionnalité et pourcentages",
      "points": "5 pts",
      "enonce": "<div><p>Un transporteur effectue le trajet Douala-Bafoussam. La distance est de 300 km. Le véhicule consomme 10 litres de carburant aux 100 km.</p></div>",
      "questions": [
        {
          "question": "<p><strong>3.1</strong> Calculer la consommation de carburant pour le trajet aller. (1 pt)</p>",
          "reponse": "<p>\( 10 \\times \\frac{300}{100} = 10 \\times 3 = 30 \) litres</p>"
        },
        {
          "question": "<p><strong>3.2</strong> Si le prix du carburant est de 750 FCFA/litre, quel est le coût du carburant pour l'aller ? (1 pt)</p>",
          "reponse": "<p>\( 30 \\times 750 = 22500 \) FCFA</p>"
        },
        {
          "question": "<p><strong>3.3</strong> Le transporteur fait l'aller-retour. Calculer le coût total du carburant. (1 pt)</p>",
          "reponse": "<p>\( 22500 \\times 2 = 45000 \) FCFA</p>"
        },
        {
          "question": "<p><strong>3.4</strong> Le prix du carburant augmente de 8%. Quel sera le nouveau prix du litre ? (1 pt)</p>",
          "reponse": "<p>\( 750 + 8\\% \\times 750 = 750 + 60 = 810 \) FCFA</p>"
        },
        {
          "question": "<p><strong>3.5</strong> En tenant compte de cette augmentation, quel sera le nouveau coût pour l'aller-retour ? (1 pt)</p>",
          "reponse": "<p>Consommation totale : 60 litres<br>Coût total : \( 60 \\times 810 = 48600 \) FCFA</p>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Statistiques",
      "points": "4 pts",
      "enonce": "<div><p>Une enquête sur les moyens de transport utilisés par les élèves d'une classe de 2ème année de Douala a donné les résultats suivants :</p><div style='overflow-x: auto;'><table style='width: 100%; border-collapse: collapse; margin: 10px 0;'><tr style='background-color: #34495e; color: white;'><th style='padding: 8px; border: 1px solid #ddd;'>Moyen de transport</th><th style='padding: 8px; border: 1px solid #ddd;'>Bus</th><th style='padding: 8px; border: 1px solid #ddd;'>Moto</th><th style='padding: 8px; border: 1px solid #ddd;'>Voiture</th><th style='padding: 8px; border: 1px solid #ddd;'>À pied</th></tr><tr><td style='padding: 8px; border: 1px solid #ddd;'>Effectif</td><td style='padding: 8px; border: 1px solid #ddd;'>18</td><td style='padding: 8px; border: 1px solid #ddd;'>10</td><td style='padding: 8px; border: 1px solid #ddd;'>6</td><td style='padding: 8px; border: 1px solid #ddd;'>6</td></tr></table></div></div>",
      "questions": [
        {
          "question": "<p><strong>4.1</strong> Quel est l'effectif total de la classe ? (0,5 pt)</p>",
          "reponse": "<p>\( 18 + 10 + 6 + 6 = 40 \) élèves</p>"
        },
        {
          "question": "<p><strong>4.2</strong> Calculer la fréquence en pourcentage de chaque moyen de transport. (1 pt)</p>",
          "reponse": "<p>Bus : \( \\frac{18}{40} \\times 100 = 45\\% \)<br>Moto : \( \\frac{10}{40} \\times 100 = 25\\% \)<br>Voiture : \( \\frac{6}{40} \\times 100 = 15\\% \)<br>À pied : \( \\frac{6}{40} \\times 100 = 15\\% \)</p>"
        },
        {
          "question": "<p><strong>4.3</strong> Construire un diagramme circulaire représentant ces données. (1 pt)</p>",
          "reponse": "<p>Angles correspondants :<br>Bus : \( 45\\% \\times 360° = 162° \)<br>Moto : \( 25\\% \\times 360° = 90° \)<br>Voiture : \( 15\\% \\times 360° = 54° \)<br>À pied : \( 15\\% \\times 360° = 54° \)</p>"
        },
        {
          "question": "<p><strong>4.4</strong> Le moyen de transport le plus utilisé est le bus. Combien d'élèves l'utilisent ? (0,5 pt)</p>",
          "reponse": "<p>18 élèves utilisent le bus.</p>"
        },
        {
          "question": "<p><strong>4.5</strong> Combien d'élèves n'utilisent pas la voiture ? (0,5 pt)</p>",
          "reponse": "<p>\( 40 - 6 = 34 \) élèves</p>"
        },
        {
          "question": "<p><strong>4.6</strong> Quelle fraction des élèves utilise une moto ou un bus ? (0,5 pt)</p>",
          "reponse": "<p>\( \\frac{10 + 18}{40} = \\frac{28}{40} = \\frac{7}{10} \)</p>"
        }
      ]
    },
    {
      "titre": "Exercice 5 : Géométrie - Angles et droites parallèles",
      "points": "4 pts",
      "enonce": "<div><p>Observe la figure suivante où les droites (AB) et (CD) sont parallèles. La droite (EF) est une sécante.</p><div style='text-align: center; background-color: #ecf0f1; padding: 15px; border-radius: 8px; margin: 10px 0;'><p style='color: #2c3e50;'>📐 Figure : Deux droites parallèles coupées par une sécante</p></div><p>On donne : \( \\widehat{AGH} = 60° \)</p></div>",
      "questions": [
        {
          "question": "<p><strong>5.1</strong> Identifier un angle alternes-internes avec \( \\widehat{AGH} \). (1 pt)</p>",
          "reponse": "<p>\( \\widehat{DHE} \) est alternes-internes avec \( \\widehat{AGH} \).</p>"
        },
        {
          "question": "<p><strong>5.2</strong> En déduire la mesure de cet angle. (1 pt)</p>",
          "reponse": "<p>Si deux droites sont parallèles, les angles alternes-internes sont égaux. Donc \( \\widehat{DHE} = \\widehat{AGH} = 60° \).</p>"
        },
        {
          "question": "<p><strong>5.3</strong> Identifier un angle correspondant avec \( \\widehat{AGH} \). (1 pt)</p>",
          "reponse": "<p>\( \\widehat{CHF} \) est correspondant avec \( \\widehat{AGH} \).</p>"
        },
        {
          "question": "<p><strong>5.4</strong> Que peut-on dire d'un angle supplémentaire à \( \\widehat{AGH} \) ? Donner sa mesure. (1 pt)</p>",
          "reponse": "<p>Un angle supplémentaire à \( \\widehat{AGH} \) mesure \( 180° - 60° = 120° \).<br>Par exemple, \( \\widehat{EGH} = 120° \).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 6 : Triangles - Théorème de Pythagore",
      "points": "4 pts",
      "enonce": "<div><p>Un terrain agricole à Bafoussam a la forme d'un triangle ABC rectangle en A.</p><div style='text-align: center; background-color: #ecf0f1; padding: 15px; border-radius: 8px; margin: 10px 0;'><p style='color: #2c3e50;'>📐 Figure : Triangle ABC rectangle en A</p></div><p>On sait que :</p><ul><li>\( AB = 12 \) m</li><li>\( AC = 9 \) m</li></ul></div>",
      "questions": [
        {
          "question": "<p><strong>6.1</strong> Calculer la longueur \( BC \). (1 pt)</p>",
          "reponse": "<p>\( BC^2 = AB^2 + AC^2 = 12^2 + 9^2 = 144 + 81 = 225 \)<br>\( BC = \\sqrt{225} = 15 \) m</p>"
        },
        {
          "question": "<p><strong>6.2</strong> Calculer le périmètre du triangle ABC. (1 pt)</p>",

    {

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
