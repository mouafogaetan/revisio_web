<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Mathématiques",
  "classe": "2ème année",
  "sequence": "Séquence 2",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Nombres décimaux relatifs",
      "points": "4 pts",
      "enonce": "<div style='font-size:1em; line-height:1.6;'><p>Cet exercice porte sur la manipulation des nombres décimaux relatifs, leurs opérations et les puissances.</p></div>",
      "questions": [
        {
          "question": "<div><p><strong>1. (1 pt)</strong> Place les nombres suivants sur une droite graduée : <span class='math'>\\( -3,5 \\)</span> ; <span class='math'>\\( +2,25 \\)</span> ; <span class='math'>\\( -0,75 \\)</span> ; <span class='math'>\\( +4 \\)</span>.</p><p>Détermine l'opposé de chacun de ces nombres.</p></div>",
          "reponse": "<div><ul><li>Les positions sur la droite graduée doivent montrer l'ordre croissant : -3,5 ; -0,75 ; 2,25 ; 4.</li><li>Opposés : 3,5 ; -2,25 ; 0,75 ; -4.</li></ul></div>"
        },
        {
          "question": "<div><p><strong>2. (1,5 pts)</strong> Calcule en respectant les règles de priorités et en détaillant les étapes :</p><ul><li>a) <span class='math'>\\( (-5) + (-3) - (-7) + 2 \\)</span></li><li>b) <span class='math'>\\( (-4) \\times (-6) - 10 \\div (-2) \\)</span></li><li>c) <span class='math'>\\( 3 - 2 \\times (5 - 8) \\)</span></li></ul></div>",
          "reponse": "<div><ul><li>a) <span class='math'>\\( -5 - 3 + 7 + 2 = 1 \\)</span></li><li>b) <span class='math'>\\( 24 - (-5) = 24 + 5 = 29 \\)</span></li><li>c) <span class='math'>\\( 3 - 2 \\times (-3) = 3 + 6 = 9 \\)</span></li></ul></div>"
        },
        {
          "question": "<div><p><strong>3. (1,5 pts)</strong> Calcule les puissances suivantes :</p><ul><li>a) <span class='math'>\\( (-3)^4 \\)</span></li><li>b) <span class='math'>\\( 10^{-2} \\)</span></li><li>c) <span class='math'>\\( 2^3 \\times 2^5 \\)</span></li><li>d) <span class='math'>\\( (3 \\times 4)^2 \\)</span></li></ul><p>Applique les propriétés pour simplifier <span class='math'>\\( 5^3 \\times 5^{-1} \\)</span>.</p></div>",
          "reponse": "<div><ul><li>a) <span class='math'>\\( 81 \\)</span></li><li>b) <span class='math'>\\( 0,01 \\)</span></li><li>c) <span class='math'>\\( 2^{8} = 256 \\)</span></li><li>d) <span class='math'>\\( 3^2 \\times 4^2 = 9 \\times 16 = 144 \\)</span></li><li><span class='math'>\\( 5^3 \\times 5^{-1} = 5^{3-1} = 5^2 = 25 \\)</span></li></ul></div>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Nombres rationnels et équations",
      "points": "4 pts",
      "enonce": "<div style='font-size:1em; line-height:1.6;'><p>Cet exercice porte sur les opérations sur les nombres rationnels et la résolution d'équations simples.</p></div>",
      "questions": [
        {
          "question": "<div><p><strong>1. (2 pts)</strong> Effectue les opérations suivantes en donnant le résultat sous forme de fraction irréductible :</p><ul><li>a) <span class='math'>\\( \\frac{3}{4} + \\frac{5}{6} \\)</span></li><li>b) <span class='math'>\\( \\frac{7}{8} - \\frac{3}{10} \\)</span></li><li>c) <span class='math'>\\( \\frac{2}{3} \\times \\frac{9}{4} \\)</span></li><li>d) <span class='math'>\\( \\frac{5}{7} \\div \\frac{10}{21} \\)</span></li></ul></div>",
          "reponse": "<div><ul><li>a) <span class='math'>\\( \\frac{9}{12} + \\frac{10}{12} = \\frac{19}{12} \\)</span></li><li>b) <span class='math'>\\( \\frac{35}{40} - \\frac{12}{40} = \\frac{23}{40} \\)</span></li><li>c) <span class='math'>\\( \\frac{2 \\times 9}{3 \\times 4} = \\frac{18}{12} = \\frac{3}{2} \\)</span></li><li>d) <span class='math'>\\( \\frac{5}{7} \\times \\frac{21}{10} = \\frac{5 \\times 21}{7 \\times 10} = \\frac{105}{70} = \\frac{3}{2} \\)</span></li></ul></div>"
        },
        {
          "question": "<div><p><strong>2. (1 pt)</strong> Résous les équations suivantes dans l'ensemble des nombres rationnels :</p><ul><li>a) <span class='math'>\\( x + \\frac{3}{4} = \\frac{7}{8} \\)</span></li><li>b) <span class='math'>\\( \\frac{2}{3} x = \\frac{5}{6} \\)</span></li></ul></div>",
          "reponse": "<div><ul><li>a) <span class='math'>\\( x = \\frac{7}{8} - \\frac{3}{4} = \\frac{7}{8} - \\frac{6}{8} = \\frac{1}{8} \\)</span></li><li>b) <span class='math'>\\( x = \\frac{5}{6} \\div \\frac{2}{3} = \\frac{5}{6} \\times \\frac{3}{2} = \\frac{15}{12} = \\frac{5}{4} \\)</span></li></ul></div>"
        },
        {
          "question": "<div><p><strong>3. (1 pt)</strong> Traduis le problème suivant en équation et résous-le : <em>Un nombre augmenté de 7 donne 25. Quel est ce nombre ?</em></p></div>",
          "reponse": "<div><ul><li>Soit <span class='math'>\\( x \\)</span> ce nombre. L'équation est : <span class='math'>\\( x + 7 = 25 \\)</span>.</li><li>La solution est <span class='math'>\\( x = 25 - 7 = 18 \\)</span>.</li></ul></div>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Proportionnalité, pourcentage et échelle",
      "points": "4 pts",
      "enonce": "<div style='font-size:1em; line-height:1.6;'><p>Cet exercice permet de vérifier la maîtrise des notions de proportionnalité, de pourcentage et d'échelle.</p></div>",
      "questions": [
        {
          "question": "<div><p><strong>1. (1,5 pts)</strong> Le tableau ci-dessous est-il un tableau de proportionnalité ? Justifie.</p><table style='border-collapse: collapse; width: auto; margin: 10px auto;'><tr><td style='border: 1px solid black; padding: 8px;'>Nombre de paires</td><td style='border: 1px solid black; padding: 8px;'>2</td><td style='border: 1px solid black; padding: 8px;'>5</td><td style='border: 1px solid black; padding: 8px;'>7</td></tr><tr><td style='border: 1px solid black; padding: 8px;'>Prix en FCFA</td><td style='border: 1px solid black; padding: 8px;'>1000</td><td style='border: 1px solid black; padding: 8px;'>2500</td><td style='border: 1px solid black; padding: 8px;'>3500</td></tr></table><p>Calcule le coefficient de proportionnalité.</p></div>",
          "reponse": "<div><ul><li>Les quotients sont égaux : <span class='math'>\\( \\frac{1000}{2} = \\frac{2500}{5} = \\frac{3500}{7} = 500 \\)</span>.</li><li>Le tableau est un tableau de proportionnalité. Le coefficient de proportionnalité est 500 FCFA/paire.</li></ul></div>"
        },
        {
          "question": "<div><p><strong>2. (1,5 pts)</strong> Dans un collège de 600 élèves, 45 % sont des filles.</p><ul><li>a) Calcule le nombre de filles dans ce collège.</li><li>b) Calcule le nombre de garçons.</li></ul></div>",
          "reponse": "<div><ul><li>a) Nombre de filles : <span class='math'>\\( 600 \\times \\frac{45}{100} = 270 \\)</span>.</li><li>b) Nombre de garçons : <span class='math'>\\( 600 - 270 = 330 \\)</span>.</li></ul></div>"
        },
        {
          "question": "<div><p><strong>3. (1 pt)</strong> Sur une carte à l'échelle <span class='math'>\\( \\frac{1}{50000} \\)</span>, la distance entre deux villes est de 8 cm.</p><p>Quelle est la distance réelle entre ces deux villes en kilomètres ?</p></div>",
          "reponse": "<div><ul><li>Distance réelle = <span class='math'>\\( 8 \\times 50000 = 400000 \\)</span> cm = 4 km.</li></ul></div>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Statistiques et représentations graphiques",
      "points": "3 pts",
      "enonce": "<div style='font-size:1em; line-height:1.6;'><p>Cet exercice porte sur l'organisation et la représentation de données statistiques.</p></div>",
      "questions": [
        {
          "question": "<div><p><strong>1. (1,5 pts)</strong> On a relevé les notes (sur 20) obtenues par les 25 élèves d'une classe :</p><p>12 ; 8 ; 15 ; 10 ; 13 ; 8 ; 12 ; 14 ; 9 ; 11 ; 16 ; 7 ; 13 ; 12 ; 10 ; 14 ; 11 ; 9 ; 15 ; 12 ; 13 ; 10 ; 8 ; 11 ; 14</p><ul><li>a) Construis un tableau des effectifs et des fréquences (en pourcentage).</li></ul></div>",
          "reponse": "<div><ul><li>Tableau des effectifs (Notes : Effectifs) : 7:1, 8:3, 9:2, 10:3, 11:3, 12:4, 13:3, 14:3, 15:2, 16:1.</li><li>Fréquences (%) : 4% ; 12% ; 8% ; 12% ; 12% ; 16% ; 12% ; 12% ; 8% ; 4%.</li></ul></div>"
        },
        {
          "question": "<div><p><strong>2. (1 pt)</strong> Représente ces données par un diagramme en bâtons.</p></div>",
          "reponse": "<div><ul><li>Le diagramme doit avoir les notes sur l'axe horizontal et les effectifs sur l'axe vertical, avec des bâtons proportionnels aux effectifs.</li></ul></div>"
        },
        {
          "question": "<div><p><strong>3. (0,5 pt)</strong> Calcule l'effectif total et le nombre d'élèves ayant obtenu une note supérieure ou égale à 12.</p></div>",
          "reponse": "<div><ul><li>Effectif total : 25 élèves.</li><li>Nombre d'élèves ayant une note ≥ 12 : 4 + 3 + 3 + 2 + 1 = 13 élèves.</li></ul></div>"
        }
      ]
    },
    {
      "titre": "Exercice 5 : Géométrie (Distances, angles, triangles, cercles)",
      "points": "3 pts",
      "enonce": "<div style='font-size:1em; line-height:1.6;'><p>Cet exercice aborde les propriétés géométriques fondamentales : distances, angles, triangles et cercles.</p></div>",
      "questions": [
        {
          "question": "<div><p><strong>1. (1 pt)</strong> Trace un segment [AB] de longueur 6 cm.</p><ul><li>a) Construis la médiatrice de [AB]. Justifie la construction.</li><li>b) Place un point M sur cette médiatrice. Que peux-tu dire des distances MA et MB ?</li></ul></div>",
          "reponse": "<div><ul><li>a) La médiatrice est la droite perpendiculaire à [AB] passant par son milieu. Construction avec un compas en traçant deux arcs de cercle de même rayon de part et d'autre du segment.</li><li>b) M est sur la médiatrice, donc MA = MB.</li></ul></div>"
        },
        {
          "question": "<div><p><strong>2. (1 pt)</strong> Deux droites parallèles (d1) et (d2) sont coupées par une sécante (s).</p><ul><li>a) Cite deux angles correspondants.</li><li>b) Si un angle mesure 70°, quelle est la mesure de son angle alterne-interne ? Justifie.</li></ul></div>",
          "reponse": "<div><ul><li>a) Les angles correspondants sont ceux qui ont la même position par rapport à la sécante. Exemple : un angle en haut à gauche sur (d1) et un angle en haut à gauche sur (d2).</li><li>b) L'angle alterne-interne a la même mesure que l'angle de 70° car les droites sont parallèles.</li></ul></div>"
        },
        {
          "question": "<div><p><strong>3. (1 pt)</strong> Soit un triangle ABC rectangle en A avec AB = 3 cm et AC = 4 cm.</p><ul><li>a) Calcule la longueur BC en utilisant le théorème de Pythagore.</li><li>b) Construis le cercle circonscrit à ce triangle. Quel est son centre ? Justifie.</li></ul></div>",
          "reponse": "<div><ul><li>a) <span class='math'>\\( BC^2 = AB^2 + AC^2 = 3^2 + 4^2 = 9 + 16 = 25 \\)</span>, donc <span class='math'>\\( BC = 5 \\)</span> cm.</li><li>b) Le centre du cercle circonscrit est le milieu de l'hypoténuse BC (propriété du triangle rectangle).</li></ul></div>"
        }
      ]
    },
    {
      "titre": "Exercice 6 : Figures symétriques et solides de l'espace",
      "points": "2 pts",
      "enonce": "<div style='font-size:1em; line-height:1.6;'><p>Cet exercice porte sur les symétries et les calculs de volumes pour les solides.</p></div>",
      "questions": [
        {
          "question": "<div><p><strong>1. (1 pt)</strong> Construis le symétrique du triangle ABC par rapport à une droite (d) en utilisant les propriétés de conservation des longueurs et des angles.</p></div>",
          "reponse": "<div><ul><li>La construction doit montrer que le symétrique d'un point est obtenu en traçant la perpendiculaire à (d) et en reportant la distance de part et d'autre de (d). Les longueurs et les angles sont conservés.</li></ul></div>"
        },
        {
          "question": "<div><p><strong>2. (1 pt)</strong> Un prisme droit a pour base un triangle rectangle dont les côtés de l'angle droit mesurent 3 cm et 4 cm. Sa hauteur est de 10 cm.</p><ul><li>a) Calcule l'aire latérale de ce prisme.</li><li>b) Calcule son volume.</li></ul></div>",
          "reponse": "<div><ul><li>a) Aire latérale = Périmètre de la base × Hauteur. L'hypoténuse mesure 5 cm (Pythagore). P = 3 + 4 + 5 = 12 cm. Aire latérale = 12 × 10 = 120 cm².</li><li>b) Aire de la base (triangle rectangle) = <span class='math'>\\( \\frac{3 \\times 4}{2} = 6 \\)</span> cm². Volume = Aire de la base × Hauteur = 6 × 10 = 60 cm³.</li></ul></div>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
