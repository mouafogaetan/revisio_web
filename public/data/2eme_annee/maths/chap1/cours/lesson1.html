<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Présentation mobile</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' },
            options: { skipHtmlTypes: 'script' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 500px;
        margin: 0 auto;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    .slide-header {
        flex-shrink: 0;
        padding: 18px 16px 10px 16px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        z-index: 10;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .slide-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
    }

    .content-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 18px 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        flex-shrink: 0;
    }

    .content-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .content-card li {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        line-height: 1.5;
    }

    .content-card li:last-child {
        border-bottom: none;
    }

    .bullet-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
    }

    .math-block {
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        overflow-x: auto;
        flex-shrink: 0;
        margin: 4px 0;
    }

    .math-block .math {
        font-size: 1.2rem;
        color: #e2e8f0;
    }

    .note-box {
        background: rgba(96, 165, 250, 0.08);
        border-left: 4px solid #60a5fa;
        padding: 12px 16px;
        border-radius: 12px;
        font-style: italic;
        font-size: 0.9rem;
        color: #cbd5e1;
        flex-shrink: 0;
    }

    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        border-radius: 0;
        flex-direction: column;
    }

    .loading-card {
        background: #1e293b;
        padding: 32px 28px;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #334155;
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px auto;
    }

    .loading-text {
        font-weight: 600;
        font-size: 1.1rem;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    .loading-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 16px;
    }
    .loading-progress {
        height: 3px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        animation: loadingProgress 30s ease-out forwards;
    }

    .loading-timeout {
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 12px;
    }

    .btn-cancel-loading {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 40px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #f87171;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }

    .btn-cancel-loading:active {
        transform: scale(0.94);
        background: rgba(239, 68, 68, 0.25);
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
    }

    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .slide-counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255,255,255,0.05);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(255,255,255,0.04);
    }

    .status-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 30px;
        background: rgba(96, 165, 250, 0.12);
        color: #93bbfc;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
    }

    .status-badge .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: pulse-dot 1.2s infinite;
        flex-shrink: 0;
    }

    .status-badge.idle .dot {
        animation: none;
        background: #64748b;
    }
    .status-badge.speaking .dot {
        background: #34d399;
        animation: pulse-dot 0.8s infinite;
    }
    .status-badge.error .dot {
        background: #f87171;
        animation: none;
    }
    .status-badge.paused .dot {
        animation: none;
        background: #fbbf24;
    }
    .status-badge.waiting .dot {
        animation: pulse-dot 1.5s infinite;
        background: #fbbf24;
    }
    .status-badge.loading .dot {
        animation: pulse-dot 0.5s infinite;
        background: #60a5fa;
    }

    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.7); }
    }

    .footer-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(255,255,255,0.1);
    }

    .btn-secondary {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-play {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
        min-width: 80px;
        justify-content: center;
    }
    .btn-play:active {
        background: rgba(52, 211, 153, 0.25);
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
    }

    .auto-indicator {
        font-size: 0.65rem;
        color: #64748b;
        text-align: center;
        letter-spacing: 0.3px;
        padding: 2px 0;
    }

    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.2rem;
        }
        .content-card li {
            font-size: 0.9rem;
            padding: 8px 0;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .btn-play {
            min-width: 60px;
        }
        .footer-buttons {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
        .loading-card {
            padding: 20px 16px;
        }
        .math-block .math {
            font-size: 1rem;
        }
    }

    @media (min-width: 600px) {
        .app-container {
            max-width: 480px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
        .loading-overlay {
            border-radius: 32px;
        }
    }

    /* Mode jour (par défaut) */
    html, body {
        background: #f0f4f8 !important;
        color: #1a202c !important;
    }
    .app-container {
        background: linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%) !important;
    }
    .slide-header {
        background: rgba(255, 255, 255, 0.85) !important;
        border-bottom: 1px solid rgba(0,0,0,0.08) !important;
    }
    .slide-header h1 {
        background: linear-gradient(135deg, #2b6cb0, #6b46c1) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        background-clip: text !important;
    }
    .slide-footer {
        background: rgba(255, 255, 255, 0.9) !important;
        border-top: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card {
        background: rgba(255,255,255,0.8) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card li {
        border-bottom: 1px solid rgba(0,0,0,0.05) !important;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.12) !important;
        border-left: 4px solid #4299e1 !important;
        color: #2c3e50 !important;
    }
    .math-block {
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .math-block .math {
        color: #2d3748 !important;
    }
    .slide-counter {
        color: #4a5568 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .status-badge {
        background: rgba(96, 165, 250, 0.15) !important;
        color: #2b6cb0 !important;
        border: 1px solid rgba(96, 165, 250, 0.15) !important;
    }
    .btn {
        color: #2d3748 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .btn-secondary {
        background: rgba(0,0,0,0.04) !important;
        border-color: rgba(0,0,0,0.08) !important;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15) !important;
        border-color: rgba(52, 211, 153, 0.2) !important;
        color: #38a169 !important;
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15) !important;
        border-color: rgba(251, 191, 36, 0.2) !important;
        color: #d69e2e !important;
    }
    .auto-indicator {
        color: #718096 !important;
    }
    .loading-card {
        background: #ffffff !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .loading-text {
        color: #1a202c !important;
    }
    .loading-sub {
        color: #4a5568 !important;
    }
</style>
</head>
<body>

<div class="app-container">

    <header class="slide-header">
        <h1 id="slideTitle">Chargement...</h1>
    </header>

    <main class="slide-body" id="slideBody"></main>

    <!-- LOADING OVERLAY AVEC BOUTON ANNULER -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Préparation vocale...</div>
            <div class="loading-sub" id="loadingSub">Synthèse en cours</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loadingProgressBar"></div>
            </div>
            <div class="loading-timeout" id="loadingTimeout">⏱️ 30 secondes maximum</div>
            <button class="btn-cancel-loading" id="cancelLoadingBtn">
                <span>✕</span> Annuler
            </button>
        </div>
    </div>

    <footer class="slide-footer">
        <div class="footer-top">
            <span class="slide-counter" id="slideCounter">1 / 3</span>
            <span class="status-badge idle" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">Prêt</span>
            </span>
        </div>

        <div class="footer-buttons">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-secondary" id="replayBtn">
                <span class="btn-icon">🔁</span> <span class="btn-label">Relire</span>
            </button>
            <button class="btn btn-play" id="playBtn">
                <span class="btn-icon">▶</span> <span class="btn-label">Play</span>
            </button>
        </div>

        <div class="auto-indicator" id="autoIndicator">⏸ Lecture manuelle</div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // SLIDES
    // ================================================================
    const slides = [
  {
    "titre": "Introduction",
    "contenu": "<div style='font-family: Arial, sans-serif; font-size: 1em; line-height: 1.6; color: #222;'>\n  <p>Bienvenue dans cette leçon sur les <strong>nombres décimaux relatifs</strong>.</p>\n  <p>Que représentent ces nombres dans notre quotidien ? Voici quelques exemples :</p>\n  <ul style='padding-left: 20px;'>\n    <li>La <strong>température</strong> : Il peut faire -2°C.</li>\n    <li>L'<strong>altitude</strong> : La mer Morte est à -430 m.</n></li>\n    <li>Un <strong>débit bancaire</strong> : Un découvert de -50 000 FCFA.</li>\n  </ul>\n  <div style='background-color: #e9f7ef; padding: 15px; border-radius: 8px; border-left: 5px solid #28a745; color: #222; margin-top: 15px;'>\n    <strong>Objectifs de la leçon :</strong><br>\n    - Reconnaître ces nombres.<br>\n    - Les placer, les comparer et les ranger.<br>\n    - Effectuer des opérations (addition, soustraction, multiplication).<br>\n    - Utiliser les puissances et les règles de priorité.\n  </div>\n</div>",
    "texteParle": "Bienvenue dans cette leçon sur les nombres décimaux relatifs. Ces nombres sont très présents dans notre vie quotidienne. Par exemple, la température peut être négative, comme moins deux degrés Celsius. L'altitude de la mer Morte est aussi négative. Ou encore, un découvert bancaire de moins cinquante mille francs CFA. Dans cette leçon, nous allons apprendre à reconnaître ces nombres, à les placer sur une droite, à les comparer, et à effectuer des opérations comme l'addition, la soustraction et la multiplication.",
    "note": "Les nombres relatifs sont utilisés pour quantifier des grandeurs qui peuvent être positives ou négatives."
  },
  {
    "titre": "1. Reconnaître les nombres relatifs",
    "contenu": "<div style='font-family: Arial, sans-serif; font-size: 1em; line-height: 1.6; color: #222;'>\n  <p>Un <strong>nombre relatif</strong> est un nombre qui peut être positif ou négatif.</p>\n  <ul style='padding-left: 20px;'>\n    <li><strong>Nombre positif :</strong> Il est précédé du signe <span style='color: #28a745;'>+</span> (ou sans signe).<br>Exemples : +5, 3,2, +12,75.</li>\n    <li><strong>Nombre négatif :</strong> Il est précédé du signe <span style='color: #dc3545;'>-</span>.<br>Exemples : -7, -4,5, -0,02.</li>\n  </ul>\n  <p>On distingue deux types :</p>\n  <ul style='padding-left: 20px;'>\n    <li><strong>Entiers relatifs :</strong> Ils n'ont pas de partie décimale.<br>Exemples : -5, 0, +12.</li>\n    <li><strong>Décimaux relatifs :</strong> Ils ont une partie décimale finie.<br>Exemples : -3,5, +1,25, 4,0.</li>\n  </ul>\n  <div style='background-color: #fff3cd; padding: 15px; border-radius: 8px; border-left: 5px solid #ffc107; color: #856404;'>\n    <strong>À retenir :</strong> L'ensemble des nombres décimaux relatifs est noté <strong>D</strong>.\n  </div>\n</div>",
    "texteParle": "Un nombre relatif est un nombre qui peut être positif ou négatif. Il est positif s'il est précédé du signe plus, ou sans signe, comme 5 ou 3,2. Il est négatif s'il est précédé du signe moins, comme moins 7 ou moins 4,5. On distingue deux types de nombres relatifs. Les entiers relatifs, qui n'ont pas de partie décimale, comme moins 5 ou 12. Et les décimaux relatifs, qui ont une partie décimale finie, comme moins 3,5 ou plus 1,25. L'ensemble de ces nombres est appelé D.",
    "note": "Le signe '+' est souvent omis pour les nombres positifs."
  },
  {
    "titre": "2. Droite graduée et opposé",
    "contenu": "<div style='font-family: Arial, sans-serif; font-size: 1em; line-height: 1.6; color: #222;'>\n  <p><strong>Placer sur une droite graduée :</strong></p>\n  <p>Sur une droite, les nombres positifs sont à droite de 0, et les négatifs à gauche.</p>\n  <div style='background-color: #f8f9fa; padding: 15px; border-radius: 8px; text-align: center; border: 1px solid #dee2e6;'>\n    <span style='margin: 0 15px;'>-3</span>\n    <span style='margin: 0 15px;'>-2</span>\n    <span style='margin: 0 15px;'>-1</span>\n    <span style='margin: 0 15px; font-weight: bold;'>0</span>\n    <span style='margin: 0 15px;'>1</span>\n    <span style='margin: 0 15px;'>2</span>\n    <span style='margin: 0 15px;'>3</span>\n  </div>\n  <p><strong>L'opposé d'un nombre :</strong></p>\n  <ul style='padding-left: 20px;'>\n    <li>L'opposé d'un nombre est le nombre qui a la même distance à 0, mais de signe contraire.</li>\n    <li>Exemples :\n      <ul style='padding-left: 20px;'>\n        <li>L'opposé de +5 est -5.</li>\n        <li>L'opposé de -3,2 est +3,2.</li>\n      </ul>\n    </li>\n  </ul>\n  <div style='background-color: #e9f7ef; padding: 15px; border-radius: 8px; border-left: 5px solid #28a745; color: #222;'>\n    <strong>Notation :</strong> L'opposé d'un nombre a est noté <strong>-a</strong>.\n  </div>\n</div>",
    "texteParle": "Les nombres relatifs peuvent être placés sur une droite graduée. Les nombres positifs sont toujours à droite de zéro, et les négatifs à gauche. Par exemple, ici sur la droite, nous avons moins 3, moins 2, moins 1, puis 0, 1, 2, 3. Chaque nombre possède aussi un opposé. L'opposé d'un nombre est le nombre qui a la même distance par rapport à zéro, mais de signe contraire. Par exemple, l'opposé de 5 est moins 5. L'opposé de moins 3,2 est plus 3,2.",
    "note": "L'opposé de l'opposé d'un nombre est le nombre lui-même : -(-a) = a."
  },
  {
    "titre": "3. Comparer des nombres relatifs",
    "contenu": "<div style='font-family: Arial, sans-serif; font-size: 1em; line-height: 1.6; color: #222;'>\n  <p>Pour comparer deux nombres relatifs, on utilise la droite graduée :</p>\n  <ul style='padding-left: 20px;'>\n    <li>Un nombre est <strong>plus grand</strong> qu'un autre s'il est <strong>à sa droite</strong> sur la droite graduée.</li>\n  </ul>\n  <div style='background-color: #f8f9fa; padding: 15px; border-radius: 8px; text-align: center; border: 1px solid #dee2e6;'>\n    <span style='margin: 0 15px; color: #dc3545;'>-4</span>\n    <span style='margin: 0 15px;'>-3</span>\n    <span style='margin: 0 15px;'>-2</span>\n    <span style='margin: 0 15px; color: #28a745;'>-1</span>\n    <span style='margin: 0 15px; font-weight: bold;'>0</span>\n  </div>\n  <p style='margin-top: 15px;'>Exemples :</p>\n  <ul style='padding-left: 20px;'>\n    <li>Comparons -2 et -5 : -2 est à droite de -5, donc <strong>-2 > -5</strong>.</li>\n    <li>Comparons -1 et +3 : -1 est à gauche de 3, donc <strong>-1 < 3</strong>.</li>\n    <li>Comparons -0,5 et -1,2 : -0,5 est à droite de -1,2, donc <strong>-0,5 > -1,2</strong>.</li>\n  </ul>\n  <div style='background-color: #fff3cd; padding: 15px; border-radius: 8px; border-left: 5px solid #ffc107; color: #856404;'>\n    <strong>Règle :</strong> Entre deux nombres négatifs, le plus grand est celui qui a la plus petite valeur absolue.\n  </div>\n</div>",
    "texteParle": "Pour comparer deux nombres relatifs, on utilise la droite graduée. Un nombre est plus grand qu'un autre s'il se trouve à sa droite sur la droite graduée. Par exemple, moins 2 est à droite de moins 5, donc moins 2 est plus grand que moins 5. Moins 1 est à gauche de 3, donc moins 1 est plus petit que 3. Entre deux nombres négatifs, comme moins 0,5 et moins 1,2, le plus grand est celui qui a la plus petite valeur absolue, c'est-à-dire moins 0,5.",
    "note": "Tout nombre positif est supérieur à tout nombre négatif."
  },
  {
    "titre": "4. Addition et soustraction",
    "contenu": "<div style='font-family: Arial, sans-serif; font-size: 1em; line-height: 1.6; color: #222;'>\n  <p><strong>Addition de deux nombres de même signe :</strong></p>\n  <ul style='padding-left: 20px;'>\n    <li>On additionne leurs valeurs absolues.</li>\n    <li>Le résultat garde le signe commun.</li>\n  </ul>\n  <div style='background-color: #f8f9fa; padding: 10px; border-radius: 8px; margin: 10px 0;'>\n    (+5) + (+3) = +8 &nbsp;&nbsp;|&nbsp;&nbsp; (-7) + (-2) = -9\n  </div>\n  <p><strong>Addition de deux nombres de signes contraires :</strong></p>\n  <ul style='padding-left: 20px;'>\n    <li>On soustrait leurs valeurs absolues.</li>\n    <li>Le résultat prend le signe du nombre qui a la plus grande valeur absolue.</li>\n  </ul>\n  <div style='background-color: #f8f9fa; padding: 10px; border-radius: 8px; margin: 10px 0;'>\n    (+8) + (-3) = +5 &nbsp;&nbsp;|&nbsp;&nbsp; (-4) + (+9) = +5 &nbsp;&nbsp;|&nbsp;&nbsp; (-6) + (+2) = -4\n  </div>\n  <p><strong>Soustraire un nombre, c'est additionner son opposé.</strong></p>\n  <div style='background-color: #e9f7ef; padding: 10px; border-radius: 8px; margin: 10px 0; border-left: 5px solid #28a745;'>\n    <strong>Règle :</strong> a - b = a + (-b)\n  </div>\n  <div style='background-color: #f8f9fa; padding: 10px; border-radius: 8px;'>\n    (+5) - (+2) = (+5) + (-2) = +3 &nbsp;&nbsp;|&nbsp;&nbsp; (-4) - (-3) = (-4) + (+3) = -1\n  </div>\n</div>",
    "texteParle": "Pour additionner deux nombres de même signe, on additionne leurs valeurs absolues et on garde le signe commun. Par exemple, 5 plus 3 donne 8, et moins 7 plus moins 2 donne moins 9. Pour additionner deux nombres de signes contraires, on soustrait leurs valeurs absolues et on prend le signe du nombre qui a la plus grande valeur absolue. Par exemple, 8 plus moins 3 donne 5, et moins 6 plus 2 donne moins 4. Pour la soustraction, la règle est simple : soustraire un nombre, c'est additionner son opposé. Par exemple, 5 moins 2 devient 5 plus moins 2, ce qui donne 3. Et moins 4 moins moins 3 devient moins 4 plus 3, ce qui donne moins 1.",
    "note": "Transformer une soustraction en addition permet d'éviter les erreurs de signes."

    "titre": "5. Multiplication et règles de signes",
    "contenu": "<div style='font-family: Arial, sans-serif; font-size: 1em; line-height: 1.6; color: #222;'>\n  <p>Pour multiplier des nombres relatifs, on multiplie leurs valeurs absolues, puis on applique la règle des signes.</p>\n  <div style='background-color: #fff3cd; padding: 15px; border-radius: 8px; border-left: 5px solid #ffc107; color: #856404;'>\n    <strong>Règle des signes :</strong><br>\n    - Le produit de deux nombres de même signe est <strong>positif</strong> (+).<br>\n    - Le produit de deux nombres de signes contraires est <strong>négatif</strong> (-).\n  </div>\n  <div style='background-color: #f8f9fa; padding: 10px; border-radius: 8px; margin: 15px 0;'>\n    (+3) × (+4) = +12 &nbsp;&nbsp;|&nbsp;&nbsp; (-2) × (-5) = +10<br>\n    (-6) × (+7) = -42 &nbsp;&nbsp;|&nbsp;&nbsp; (+8) × (-3) = -24\n  </div>\n  <div style='background-color: #e9f7ef; padding: 15px; border-radius: 8px; border-left: 5px solid #28a745; color: #222;'>\n    <strong>Note :</strong> Le produit d'un nombre par (-1) donne son opposé.<br>\n    Exemple : (-5) × (-1) = +5.\n  </div>\n</div>",
    "texteParle": "Pour multiplier des nombres relatifs, on multiplie d'abord leurs valeurs absolues. Ensuite, on applique la règle des signes. Le produit de deux nombres de même signe est positif. Par exemple, 3 fois 4 donne 12, et moins 2 fois moins 5 donne 10. Le produit de deux nombres de signes contraires est négatif. Par exemple, moins 6 fois 7 donne moins 42, et 8 fois moins 3 donne moins 24. De plus, multiplier un nombre par moins 1 donne son opposé. Par exemple, moins 5 fois moins 1 donne 5.",
    "note": "Pour le produit de plus de deux nombres, on compte le nombre de facteurs négatifs : s'il est pair, le résultat est positif ; s'il est impair, il est négatif."

    "titre": "6. Priorités des opérations",
    "contenu": "<div style='font-family: Arial, sans-serif; font-size: 1em; line-height: 1.6; color: #222;'>\n  <p>Pour calculer une expression avec des nombres relatifs, on respecte les règles de priorités :</p>\n  <ol style='padding-left: 20px;'>\n    <li>Les calculs entre <strong>parenthèses</strong> sont prioritaires.</li>\n    <li>Les <strong>puissances</strong> sont effectuées avant les multiplications et les divisions.</li>\n    <li>Les <strong>multiplications et divisions</strong> sont prioritaires sur les additions et soustractions.</li>\n    <li>Les <strong>additions et soustractions</strong> sont effectuées en dernier, de gauche à droite.</li>\n  </ol>\n  <div style='background-color: #f8f9fa; padding: 15px; border-radius: 8px; margin: 10px 0; border: 1px solid #dee2e6;'>\n    <p><strong>Exemple :</strong> Calculer A = -5 + 3 × (-2)</p>\n    <p>A = -5 + (3 × (-2)) = -5 + (-6) = -11</p>\n  </div>\n  <div style='background-color: #f8f9fa; padding: 15px; border-radius: 8px; border: 1px solid #dee2e6;'>\n    <p><strong>Exemple avec parenthèses :</strong> Calculer B = (-5 + 3) × (-2)</p>\n    <p>B = (-2) × (-2) = +4</p>\n  </div>\n</div>",
    "texteParle": "Dans les calculs, il faut respecter les priorités opératoires. D'abord, on calcule ce qui est entre parenthèses. Ensuite, on effectue les puissances. Puis, les multiplications et les divisions sont prioritaires sur les additions et les soustractions. Enfin, on effectue les additions et soustractions de gauche à droite. Par exemple, pour calculer -5 plus 3 fois -2, on fait d'abord 3 fois -2, ce qui donne -6, puis -5 plus -6 donne -11. En revanche, si l'expression est moins 5 plus 3 le tout fois moins 2, on commence par la parenthèse, -5 plus 3 donne -2, et -2 fois -2 donne 4.",

    "texteParle": "Une puissance entière d'un nombre relatif est le produit de ce nombre par lui-même un certain nombre de fois. Par exemple, moins 3 au carré est égal à moins 3 fois moins 3, ce qui donne 9. Moins 2 au cube est égal à moins 2 fois moins 2 fois moins 2, ce qui donne moins 8. 0,5 au carré est égal à 0,5 fois 0,5, soit 0,25. La règle des signes pour les puissances est simple : si l'exposant est pair, la puissance est toujours positive. Si l'exposant est impair, la puissance garde le signe de la base.",

    "contenu": "<div style='font-family: Arial, sans-serif; font-size: 1em; line-height: 1.6; color: #222;'>\n  <p>Deux propriétés fondamentales permettent de simplifier les calculs :</p>\n  <div style='background-color: #e9f7ef; padding: 15px; border-radius: 8px; border-left: 5px solid #28a745; color: #222; margin: 10px 0;'>\n    <strong>1. Produit de puissances d'un même nombre :</strong><br>\n    \\( a^n \\times a^m = a^{n+m} \\)\n  </div>\n  <div style='background-color: #e9f7ef; padding: 15px; border-radius: 8px; border-left: 5px solid #28a745; color: #222; margin: 10px 0;'>\n    <strong>2. Puissance d'un produit :</strong><br>\n    \\( (a \\times b)^n = a^n \\times b^n \\)\n  </div>\n  <div style='background-color: #f8f9fa; padding: 15px; border-radius: 8px; border: 1px solid #dee2e6;'>\n    <p><strong>Exemples :</strong></p>\n    <ul style='padding-left: 20px;'>\n      <li>\\( (-2)^3 \\times (-2)^4 = (-2)^{3+4} = (-2)^7 = -128 \\)</li>\n      <li>\\( (2 \\times (-3))^3 = 2^3 \\times (-3)^3 = 8 \\times (-27) = -216 \\)</li>\n    </ul>\n  </div>\n</div>",
    "texteParle": "Deux propriétés des puissances sont très utiles pour simplifier les calculs. La première propriété concerne le produit de puissances d'un même nombre. On a : a puissance n, fois a puissance m, est égal à a puissance n plus m. Par exemple, moins 2 puissance 3, fois moins 2 puissance 4, est égal à moins 2 puissance 7. La deuxième propriété est la puissance d'un produit. On a : a fois b le tout puissance n, est égal à a puissance n, fois b puissance n. Par exemple, 2 fois moins 3 le tout puissance 3, est égal à 2 puissance 3, fois moins 3 puissance 3, ce qui donne 8 fois moins 27, soit moins 216.",
    "note": "Ces propriétés s'appliquent pour les bases non nulles (a ≠ 0 et b ≠ 0)."

    "texteParle": "Pour conclure cette leçon, rappelons ce que nous avons appris. Nous savons maintenant reconnaître et distinguer les nombres entiers et décimaux relatifs. Nous savons les placer, les comparer et les ranger sur une droite graduée. Nous maîtrisons le calcul de l'opposé. Nous avons appris à additionner, soustraire et multiplier ces nombres en respectant les règles de signes et les priorités opératoires. Enfin, nous savons calculer des puissances et utiliser leurs propriétés. Un petit exercice pour vérifier votre compréhension : calculez A égal moins 3 plus moins 5 moins moins 2, B égal moins 4 fois 2 moins 7, et C égal moins 2 au carré fois moins 3 au cube.",

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentIndex = 0;
    let isSpeaking = false;
    let isPaused = false;
    let currentUtterance = null;
    let isLoading = false;
    let loadingTimeout = null;
    let isTransitioning = false;
    let speechSupported = true;
    let userInteracted = false;
    let isPlaying = false;
    let loadingCancelled = false;

    const total = slides.length;
    const synth = window.speechSynthesis;

    // Références jQuery
    const $title = $('#slideTitle');
    const $body = $('#slideBody');
    const $counter = $('#slideCounter');
    const $statusText = $('#statusText');
    const $statusBadge = $('#statusBadge');
    const $loading = $('#loadingOverlay');
    const $loadingText = $('#loadingText');
    const $loadingSub = $('#loadingSub');
    const $loadingTimeout = $('#loadingTimeout');
    const $loadingProgressBar = $('#loadingProgressBar');
    const $autoIndicator = $('#autoIndicator');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $replay = $('#replayBtn');
    const $play = $('#playBtn');
    const $cancelLoading = $('#cancelLoadingBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function setStatus(text, type) {
        $statusText.text(text);
        $statusBadge.removeClass('idle speaking error paused waiting loading');
        if (type === 'speaking') $statusBadge.addClass('speaking');
        else if (type === 'error') $statusBadge.addClass('error');
        else if (type === 'paused') $statusBadge.addClass('paused');
        else if (type === 'waiting') $statusBadge.addClass('waiting');
        else if (type === 'loading') $statusBadge.addClass('loading');
        else $statusBadge.addClass('idle');
    }

    function updatePlayButton() {
        if (isPlaying) {
            $play.addClass('playing');
            $play.find('.btn-icon').text('⏸');
            $play.find('.btn-label').text('Pause');
        } else {
            $play.removeClass('playing');
            $play.find('.btn-icon').text('▶');
            $play.find('.btn-label').text('Play');
        }
    }

    function showLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        
        loadingCancelled = false;
        isLoading = true;
        
        // Réinitialiser la barre de progression
        $loadingProgressBar.css('animation', 'none');
        $loadingProgressBar.css('width', '0%');
        // Forcer un reflow
        $loadingProgressBar[0].offsetHeight;
        $loadingProgressBar.css('animation', 'loadingProgress 30s ease-out forwards');
        
        $loadingText.text('Préparation vocale...');
        $loadingSub.text('Synthèse en cours');
        $loadingTimeout.text('⏱️ 30 secondes maximum');
        $loading.fadeIn(300);
        setStatus("⏳ Chargement...", 'loading');
        
        // 🔥 TIMEOUT DE 30 SECONDES
        loadingTimeout = setTimeout(() => {
            if (isLoading && !loadingCancelled) {
                hideLoading();
                setStatus("⚠️ Délai dépassé (30s)", 'error');
                isPlaying = false;
                updatePlayButton();
                $loadingSub.text('La synthèse vocale a pris trop de temps');
                $loadingTimeout.text('❌ Délai dépassé');
            }
        }, 30000);
    }

    function hideLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        isLoading = false;
        loadingCancelled = false;
        $loading.fadeOut(300);
        // Ne pas changer le statut si on est en train de parler
        if (!isSpeaking && !isPlaying) {
            setStatus("⏸ Lecture arrêtée", 'paused');
        }
    }

    function cancelLoading() {
        loadingCancelled = true;
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        hideLoading();
        stopSpeaking();
        setStatus("⏸ Annulé", 'paused');
        isPlaying = false;
        updatePlayButton();
        $loadingText.text('Annulé par l\'utilisateur');
        $loadingSub.text('Vous pouvez réessayer');
        $loadingTimeout.text('✕ Annulation');
    }

    // Arrêter la parole proprement
    function stopSpeaking() {
        try {
            if (synth && (synth.speaking || synth.pending)) {
                synth.cancel();
            }
        } catch(e) {
            console.warn('Erreur stopSpeaking:', e);
        }
        if (currentUtterance) {
            try {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance.onstart = null;
            } catch(e) {}
            currentUtterance = null;
        }
        isSpeaking = false;
        isPlaying = false;
        updatePlayButton();
    }

    // Mettre en pause la parole
    function pauseSpeaking() {
        try {
            if (synth && synth.speaking) {
                synth.pause();
                isPaused = true;
                isPlaying = false;
                setStatus("⏸ Lecture en pause", 'paused');
                updatePlayButton();
            }
        } catch(e) {
            console.warn('Erreur pauseSpeaking:', e);
            stopSpeaking();
        }
    }

    // Reprendre la parole
    function resumeSpeaking() {
        try {
            if (synth && synth.paused) {
                synth.resume();
                isPaused = false;
                isPlaying = true;
                setStatus("🔊 Lecture en cours", 'speaking');
                updatePlayButton();
            } else if (!isSpeaking && !synth.speaking && !synth.pending) {
                speakSlide(currentIndex);
            }
        } catch(e) {
            console.warn('Erreur resumeSpeaking:', e);
            speakSlide(currentIndex);
        }
    }

    function renderSlide(index) {
        const slide = slides[index];
        $title.text(slide.titre);

        let html = '';
        html += `<div class="content-card">${slide.contenu}</div>`;
        if (slide.note) {
            html += `<div class="note-box">${slide.note}</div>`;
        }
        $body.html(html);
        $counter.text(`${index+1} / ${total}`);

        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
        }
    }

    // ================================================================
    // LECTURE VOCALE
    // ================================================================
    function speakSlide(index) {
        return new Promise((resolve) => {
            const slide = slides[index];
            const text = slide.texteParle;
            
            if (!text || text.trim() === '' || !speechSupported) {
                resolve();
                return;
            }

            if (!window.speechSynthesis) {
                setStatus("❌ Synthèse vocale non supportée", 'error');
                speechSupported = false;
                resolve();
                return;
            }

            // Arrêter toute lecture en cours
            stopSpeaking();
            
            // Réinitialiser l'état de pause
            isPaused = false;
            
            showLoading();
            setStatus("Initialisation...", 'loading');

            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.92;
                utterance.pitch = 1.05;
                utterance.volume = 1;

                let isFinished = false;
                let errorHandled = false;

                utterance.onstart = function() {
                    if (loadingCancelled) {
                        stopSpeaking();
                        resolve();
                        return;
                    }
                    hideLoading();
                    isSpeaking = true;
                    isPlaying = true;
                    isPaused = false;
                    setStatus("🔊 Lecture en cours", 'speaking');
                    updatePlayButton();
                };

                utterance.onend = function() {
                    if (isFinished) return;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    setStatus("✅ Terminé", 'idle');
                    hideLoading();
                    updatePlayButton();
                    resolve();
                };

                utterance.onerror = function(e) {
                    if (isFinished || errorHandled) return;
                    errorHandled = true;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    hideLoading();
                    updatePlayButton();
                    
                    if (e.error === 'not-allowed') {
                        setStatus("⚠️ Permission refusée", 'error');
                    } else if (e.error === 'synthesis-unavailable') {
                        setStatus("⚠️ Synthèse indisponible", 'error');
                    } else if (e.error === 'canceled') {
                        setStatus("⏸ Annulé", 'paused');
                    } else {
                        setStatus("❌ Erreur audio: " + (e.error || 'inconnue'), 'error');
                    }
                    
                    resolve();
                };

                // Gestion du chargement des voix
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = function() {
                        if (!loadingCancelled) {
                            try {
                                synth.speak(utterance);
                            } catch(err) {
                                // Silencieux
                            }
                        }
                        synth.onvoiceschanged = null;
                    };
                }

                currentUtterance = utterance;
                
                if (!loadingCancelled) {
                    try {
                        synth.speak(utterance);
                    } catch(err) {
                        setTimeout(() => {
                            if (!loadingCancelled) {
                                try {
                                    synth.speak(utterance);
                                } catch(e) {
                                    setStatus("❌ Erreur de lecture", 'error');
                                    isPlaying = false;
                                    updatePlayButton();
                                    hideLoading();
                                    resolve();
                                }
                            } else {
                                resolve();
                            }
                        }, 100);
                    }
                } else {
                    resolve();
                }

            } catch(err) {
                hideLoading();
                setStatus("❌ Erreur générale", 'error');
                isPlaying = false;
                updatePlayButton();
                console.error('Erreur speakSlide:', err);
                resolve();
            }
        });
    }

    // ================================================================
    // NAVIGATION
    // ================================================================
    async function goToSlide(index) {
        if (isTransitioning) return;
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        
        // Si on est en train de lire, on met en pause avant de naviguer
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        // Arrêter complètement la lecture
        stopSpeaking();
        
        await new Promise(r => setTimeout(r, 50));
        
        if (index === currentIndex) {
            setStatus("📄 Slide actuel", 'idle');
            return;
        }

        isTransitioning = true;
        currentIndex = index;
        renderSlide(index);
        
        // Réinitialiser l'état de lecture
        isPlaying = false;
        updatePlayButton();
        setStatus("⏸ Lecture arrêtée", 'paused');

        await new Promise(r => setTimeout(r, 150));
        isTransitioning = false;
    }

    async function goToNext() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex + 1 < total) {
            await goToSlide(currentIndex + 1);
        } else {
            setStatus("🏁 Dernier slide", 'idle');
        }
    }

    async function goToPrev() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex - 1 >= 0) {
            await goToSlide(currentIndex - 1);
        } else {
            setStatus("🔁 Premier slide", 'idle');
        }
    }

    // ================================================================
    // GESTION PLAY/PAUSE
    // ================================================================
    function togglePlay() {
        if (!userInteracted) {
            userInteracted = true;
        }

        // Si le chargement est en cours, on l'annule
        if (isLoading) {
            cancelLoading();
            return;
        }

        // Si le synthétiseur est en pause, on reprend
        if (synth && synth.paused) {
            resumeSpeaking();
            return;
        }

        // Si la lecture est en cours, on met en pause
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
            return;
        }

        // Sinon, on démarre la lecture du slide courant
        if (!isSpeaking && !isPlaying) {
            stopSpeaking();
            speakSlide(currentIndex);
        }
    }

    // ================================================================
    // INIT
    // ================================================================
    async function init() {
        // Vérifier la compatibilité
        if (!window.speechSynthesis) {
            setStatus("❌ Synthèse vocale non supportée", 'error');
            speechSupported = false;
        }

        // Précharger les voix
        try {
            if (synth.getVoices) {
                synth.getVoices();
                setTimeout(() => {
                    try {
                        synth.getVoices();
                    } catch(e) {}
                }, 200);
            }
        } catch(e) {
            console.warn('Erreur chargement voix:', e);
        }

        // Afficher le premier slide
        renderSlide(0);
        $counter.text(`1 / ${total}`);
        
        // État initial
        setStatus("⏸ Appuie sur Play", 'paused');
        updatePlayButton();
        $autoIndicator.text('⏸ Lecture manuelle');

        // ================================================================
        // ÉVÉNEMENTS
        // ================================================================
        
        // Bouton Play/Pause
        $play.on('click', function() {
            togglePlay();
        });

        // Bouton Annuler le chargement
        $cancelLoading.on('click', function() {
            cancelLoading();
        });

        // Navigation
        $prev.on('click', function() {
            // Si chargement en cours, on annule
            if (isLoading) cancelLoading();
            goToPrev();
        });

        $next.on('click', function() {
            if (isLoading) cancelLoading();
            goToNext();
        });

        // Replay - relire le slide courant
        $replay.on('click', function() {
            if (isLoading) cancelLoading();
            stopSpeaking();
            setTimeout(() => {
                speakSlide(currentIndex);
            }, 100);
        });

        // Support du clavier (espace pour play/pause)
        $(document).on('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });

        // Nettoyage
        $(window).on('beforeunload', function() {
            try {
                if (synth.speaking) synth.cancel();
            } catch(e) {}
            hideLoading();
        });

        // Gérer les cas où la synthèse se termine de manière inattendue
        setInterval(() => {
            if (isPlaying && !synth.speaking && !synth.pending && !isPaused && !isLoading) {
                isPlaying = false;
                updatePlayButton();
                setStatus("⏸ Lecture arrêtée", 'paused');
            }
        }, 1000);
    }

    init();
});



    // ================================================================
    // GESTION DU THÈME JOUR/NUIT
    // ================================================================
    let isDarkMode = false;

    function toggleTheme() {
        isDarkMode = !isDarkMode;
        const body = document.body;
        const appContainer = document.querySelector('.app-container');
        const header = document.querySelector('.slide-header');
        const footer = document.querySelector('.slide-footer');
        const contentCards = document.querySelectorAll('.content-card');
        const noteBoxes = document.querySelectorAll('.note-box');
        const mathBlocks = document.querySelectorAll('.math-block');
        const buttons = document.querySelectorAll('.btn');
        const statusBadge = document.querySelector('.status-badge');
        const slideCounter = document.querySelector('.slide-counter');
        const autoIndicator = document.querySelector('.auto-indicator');
        const themeBtn = document.getElementById('themeToggle');

        if (isDarkMode) {
            // Mode nuit
            body.style.background = '#0b1120';
            body.style.color = '#f1f5f9';
            appContainer.style.background = 'linear-gradient(145deg, #0f172a 0%, #1e293b 100%)';
            header.style.background = 'rgba(15, 23, 42, 0.85)';
            footer.style.background = 'rgba(15, 23, 42, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.05)';
                card.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.08)';
                note.style.color = '#cbd5e1';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.25)';
                block.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#e2e8f0';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.12)';
                statusBadge.style.color = '#93bbfc';
            }
            if (slideCounter) {
                slideCounter.style.color = '#94a3b8';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#64748b';
            }
            if (themeBtn) {
                themeBtn.textContent = '☀️';
                themeBtn.title = 'Passer en mode jour';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#e2e8f0';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#e2e8f0';
                }
            });
        } else {
            // Mode jour (par défaut)
            body.style.background = '#f0f4f8';
            body.style.color = '#1a202c';
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
            header.style.background = 'rgba(255, 255, 255, 0.85)';
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.8)';
                card.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.12)';
                note.style.color = '#2c3e50';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.05)';
                block.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#2d3748';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
                statusBadge.style.color = '#2b6cb0';
            }
            if (slideCounter) {
                slideCounter.style.color = '#4a5568';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#718096';
            }
            if (themeBtn) {
                themeBtn.textContent = '🌓';
                themeBtn.title = 'Passer en mode nuit';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#2c3e50';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#2d3748';
                }
            });
        }
    }

    // Initialiser en mode jour
    document.addEventListener('DOMContentLoaded', function() {
        // Appliquer le mode jour par défaut
        const body = document.body;
        body.style.background = '#f0f4f8';
        body.style.color = '#1a202c';

        const autoIndicator = document.querySelector('.auto-indicator');
        if (autoIndicator) {

        }
        
        document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
            if (!el.closest('.note-box')) {
                el.style.color = '#2c3e50';
            }
        });
        
        document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
            if (!el.closest('.note-box') && !el.closest('.math-block')) {

        });
        
        const themeBtn = document.getElementById('themeToggle');
        if (themeBtn) {
            themeBtn.textContent = '🌓';
            themeBtn.title = 'Passer en mode nuit';
        }
    });
</script>
