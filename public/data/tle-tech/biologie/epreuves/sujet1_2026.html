<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
 "matiere": "Biologie",
 "classe": "Tle technique",
 "sequence": "Évaluation Séquentielle n°1",
 "anneeScolaire": "2025-2026",
 "exercices": [
   {
     "titre": "Exercice 1 : Alimentation équilibrée et besoins énergétiques",
     "points": "4 pts",
     "enonce": "<div style='font-size: 1em; line-height: 1.6; color: #1a1a2e;'>Cet exercice porte sur la classification des aliments, les besoins et les dépenses énergétiques.</div>",
     "questions": [
       {
         "question": "<div style='margin: 10px 0;'><strong>1.1 (1 pt)</strong> Citez les sept groupes d'aliments selon leur fonction nutritionnelle en donnant un exemple pour chacun.</div>",
         "reponse": "<div style='padding: 12px; background-color: #eef2f7; border-radius: 8px; color: #1a2b4c;'><strong>1. Viandes, poissons, œufs</strong> (ex: poulet, sardine, œuf)<br><strong>2. Lait et produits laitiers</strong> (ex: lait, yaourt, fromage)<br><strong>3. Céréales et dérivés</strong> (ex: riz, pain, pâtes)<br><strong>4. Légumes et fruits</strong> (ex: carotte, banane, orange)<br><strong>5. Matières grasses</strong> (ex: huile, beurre, margarine)<br><strong>6. Sucres et produits sucrés</strong> (ex: sucre, miel, confiture)<br><strong>7. Boissons</strong> (ex: eau, café, thé)</div>"
       },
       {
         "question": "<div style='margin: 10px 0;'><strong>1.2 (1 pt)</strong> Distinguez les dépenses énergétiques de base (métabolisme de base) des dépenses variables en donnant leur définition.</div>",
         "reponse": "<div style='padding: 12px; background-color: #eef2f7; border-radius: 8px; color: #1a2b4c;'><strong>Dépenses de base (métabolisme de base) :</strong> C'est l'énergie minimale nécessaire aux fonctions vitales (respiration, battements cardiaques, maintien de la température corporelle) au repos. Elle représente environ 60 à 70 % des dépenses totales.<br><strong>Dépenses variables :</strong> Elles correspondent à l'énergie dépensée lors des activités physiques et intellectuelles, ainsi qu'à l'effet thermique des aliments. Elles varient selon l'activité, l'âge et le sexe.</div>"
       },
       {
         "question": "<div style='margin: 10px 0;'><strong>1.3 (1 pt)</strong> Un élève de 17 ans (1,70 m, 65 kg) a une activité physique modérée. Son métabolisme de base est de 1600 kcal/jour. Calculez son besoin énergétique total sachant que pour une activité modérée, le coefficient multiplicateur est de 1,6.</div>",
         "reponse": "<div style='padding: 12px; background-color: #eef2f7; border-radius: 8px; color: #1a2b4c;'>Besoin énergétique total = Métabolisme de base × coefficient d'activité<br>= 1600 × 1,6 = <strong>2560 kcal/jour</strong></div>"
       },
       {
         "question": "<div style='margin: 10px 0;'><strong>1.4 (1 pt)</strong> Donnez la valeur énergétique des macronutriments suivants : glucides, lipides et protides.</div>",
         "reponse": "<div style='padding: 12px; background-color: #eef2f7; border-radius: 8px; color: #1a2b4c;'><strong>Glucides :</strong> 4 kcal/g (17 kJ/g)<br><strong>Protides :</strong> 4 kcal/g (17 kJ/g)<br><strong>Lipides :</strong> 9 kcal/g (38 kJ/g)</div>"
       }
     ]
   },
   {
     "titre": "Exercice 2 : Apports nutritionnels et élaboration de menus",
     "points": "4 pts",
     "enonce": "<div style='font-size: 1em; line-height: 1.6; color: #1a1a2e;'>Cet exercice porte sur les Apports Nutritionnels Conseillés (ANC), les rations alimentaires et l'élaboration de menus équilibrés.</div>",
     "questions": [
       {
         "question": "<div style='margin: 10px 0;'><strong>2.1 (1 pt)</strong> Définissez la notion de ration alimentaire.</div>",
         "reponse": "<div style='padding: 12px; background-color: #eef2f7; border-radius: 8px; color: #1a2b4c;'>La ration alimentaire est la quantité d'aliments qu'une personne doit consommer quotidiennement pour couvrir ses besoins énergétiques et nutritionnels. Elle varie selon l'âge, le sexe, l'activité physique et l'état physiologique.</div>"
       },
       {
         "question": "<div style='margin: 10px 0;'><strong>2.2 (1 pt)</strong> Proposez une répartition idéale de l'apport alimentaire sur une journée (petit-déjeuner, déjeuner, goûter, dîner) en pourcentages des apports énergétiques totaux.</div>",
         "reponse": "<div style='padding: 12px; background-color: #eef2f7; border-radius: 8px; color: #1a2b4c;'><strong>Répartition journalière recommandée :</strong><br>- Petit-déjeuner : 20 à 25 %<br>- Déjeuner : 35 à 40 %<br>- Goûter : 10 à 15 %<br>- Dîner : 20 à 25 %</div>"
       },
       {
         "question": "<div style='margin: 10px 0;'><strong>2.3 (1 pt)</strong> Élaborez un menu équilibré pour le déjeuner d'un adolescent en respectant les règles de diététique.</div>",
         "reponse": "<div style='padding: 12px; background-color: #eef2f7; border-radius: 8px; color: #1a2b4c;'><strong>Déjeuner équilibré :</strong><br><strong>Entrée :</strong> Salade de crudités (carottes râpées, betteraves) assaisonnée d'huile d'olive<br><strong>Plat principal :</strong> Riz (source de glucides) accompagné de poisson grillé (source de protides) et d'une portion de légumes verts (haricots verts)<br><strong>Produit laitier :</strong> Un yaourt<br><strong>Dessert :</strong> Un fruit de saison (pomme, banane ou orange)<br><strong>Boisson :</strong> Eau</div>"
       },
       {
         "question": "<div style='margin: 10px 0;'><strong>2.4 (1 pt)</strong> Citez deux règles d'hygiène alimentaire à respecter lors de la préparation des repas.</div>",
         "reponse": "<div style='padding: 12px; background-color: #eef2f7; border-radius: 8px; color: #1a2b4c;'>1. <strong>Se laver les mains</strong> soigneusement avant de manipuler les aliments et après chaque interruption.<br>2. <strong>Séparer les aliments crus des aliments cuits</strong> pour éviter les contaminations croisées (utiliser des planches à découper et des ustensiles différents).</div>"
       }
     ]
   },
   {
     "titre": "Exercice 3 : Hygiène, désinfection et conservation des aliments",
     "points": "4 pts",
     "enonce": "<div style='font-size: 1em; line-height: 1.6; color: #1a1a2e;'>Cet exercice aborde les règles d'hygiène, la lutte antimicrobienne et les méthodes de conservation des aliments.</div>",
     "questions": [
       {
         "question": "<div style='margin: 10px 0;'><strong>3.1 (1 pt)</strong> Quels sont les quatre gestes essentiels d'hygiène individuelle à adopter dans un cadre professionnel (restauration, milieu hospitalier) ?</div>",
         "reponse": "<div style='padding: 12px; background-color: #eef2f7; border-radius: 8px; color: #1a2b4c;'><strong>1. Lavage des mains :</strong> avant et après le travail, après être allé aux toilettes.<br><strong>2. Port de la tenue professionnelle :</strong> vêtements de travail propres, charlotte, gants.<br><strong>3. Hygiène corporelle :</strong> douche quotidienne, cheveux attachés.<br><strong>4. État de santé :</strong> déclarer toute maladie infectieuse (gastro-entérite, infections cutanées).</div>"
       },
       {
         "question": "<div style='margin: 10px 0;'><strong>3.2 (1 pt)</strong> Définissez la désinfection et décrivez ses trois étapes principales.</div>",
         "reponse": "<div style='padding: 12px; background-color: #eef2f7; border-radius: 8px; color: #1a2b4c;'>La désinfection est un procédé qui consiste à éliminer ou à détruire les micro-organismes pathogènes présents sur des surfaces ou des objets.<br><strong>Les trois étapes :</strong><br>1. <strong>Nettoyage :</strong> élimination des salissures par l'action d'un détergent.<br>2. <strong>Rinçage :</strong> élimination du détergent et des salissures résiduelles.<br>3. <strong>Désinfection :</strong> application d'un désinfectant (eau de Javel, alcool, etc.).</div>"
       },
       {
         "question": "<div style='margin: 10px 0;'><strong>3.3 (1 pt)</strong> Citez cinq méthodes de conservation des aliments en expliquant brièvement le principe de chacune.</div>",
         "reponse": "<div style='padding: 12px; background-color: #eef2f7; border-radius: 8px; color: #1a2b4c;'><strong>1. Réfrigération :</strong> ralentit la croissance des micro-organismes par le froid (4 à 8°C).<br><strong>2. Congélation/surgélation :</strong> stoppe la croissance des micro-organismes à très basse température (-18°C).<br><strong>3. Pasteurisation :</strong> chauffage à 72°C pendant 15 à 30 secondes pour éliminer les germes pathogènes.<br><strong>4. Stérilisation :</strong> chauffage à 110-120°C pour détruire tous les micro-organismes.<br><strong>5. Salaison/séchage :</strong> déshydratation et ajout de sel qui crée un milieu hostile aux micro-organismes.</div>"
       },
       {
         "question": "<div style='margin: 10px 0;'><strong>3.4 (1 pt)</strong> Expliquez le mode d'action de l'eau de Javel comme désinfectant.</div>",
         "reponse": "<div style='padding: 12px; background-color: #eef2f7; border-radius: 8px; color: #1a2b4c;'>L'eau de Javel est un agent oxydant. Elle libère du chlore actif qui agit en détruisant les parois cellulaires des micro-organismes (bactéries, virus, champignons), en oxydant les protéines et en dégradant l'ADN. Elle est efficace contre une large gamme de micro-organismes pathogènes.</div>"
       }
     ]
   },
   {
     "titre": "Exercice 4 : Déséquilibres alimentaires et santé reproductive",
     "points": "4 pts",
     "enonce": "<div style='font-size: 1em; line-height: 1.6; color: #1a1a2e;'>Cet exercice traite des déséquilibres alimentaires, des maladies nutritionnelles et des problèmes de santé reproductive.</div>",
     "questions": [
       {
         "question": "<div style='margin: 10px 0;'><strong>4.1 (1 pt)</strong> Citez deux maladies nutritionnelles par carence et deux par excès en précisant leurs causes principales.</div>",
         "reponse": "<div style='padding: 12px; background-color: #eef2f7; border-radius: 8px; color: #1a2b4c;'><strong>Maladies par carence :</strong><br>- <strong>Anémie ferriprive :</strong> due à un manque de fer (alimentation pauvre en viande, légumes verts).<br>- <strong>Ostéoporose :</strong> due à une carence en calcium et en vitamine D (faible consommation de produits laitiers).<br><strong>Maladies par excès :</strong><br>- <strong>Obésité :</strong> due à un apport énergétique excessif, déséquilibre glucides/lipides.<br>- <strong>Diabète de type 2 :</strong> dû à une alimentation trop riche en sucres rapides.</div>"
       },
       {
         "question": "<div style='margin: 10px 0;'><strong>4.2 (1 pt)</strong> Proposez deux moyens de lutte contre l'obésité en milieu scolaire.</div>",
         "reponse": "<div style='padding: 12px; background-color: #eef2f7; border-radius: 8px; color: #1a2b4c;'>1. <strong>Éducation nutritionnelle :</strong> sensibiliser les élèves à une alimentation équilibrée et à la lecture des étiquettes nutritionnelles.<br>2. <strong>Activités physiques régulières :</strong> promouvoir le sport à l'école (cours d'EPS, clubs sportifs, activités périscolaires).</div>"
       },
       {

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
