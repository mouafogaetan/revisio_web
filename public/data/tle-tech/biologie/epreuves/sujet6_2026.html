<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Biologie",
  "classe": "Tle technique",
  "sequence": "Séquence 6",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Alimentation et santé (8 points)",
      "points": "8 pts",
      "enonce": "<p style='font-weight: bold; font-size: 1.1em;'>Document :</p><p>Voici les résultats d'une enquête alimentaire réalisée auprès de deux adolescents, Koffi et Amina, âgés de 17 ans.</p><ul style='list-style-type: none; padding-left: 0;'><li style='margin-bottom: 8px;'><strong>Koffi</strong> : Il est sédentaire et consacre son temps libre aux jeux vidéo. Il consomme beaucoup de boissons sucrées, de frites et de viandes grillées. Il ne mange que très rarement des fruits et des légumes.</li><li style='margin-bottom: 8px;'><strong>Amina</strong> : Elle pratique le volleyball trois fois par semaine. Elle a une alimentation variée, riche en céréales complètes, en légumineuses et en poisson. Elle consomme des fruits et des légumes à chaque repas.</li></ul><p style='margin-top: 10px;'>Vous êtes chargé(e), en tant que biologiste, d'analyser ces situations et de proposer des conseils personnalisés.</p>",
      "questions": [
        {
          "question": "<p><strong>1.1)</strong> Classez les aliments suivants dans les groupes correspondants (énergétiques, bâtisseurs ou protecteurs) : <span style='font-style: italic;'>boissons sucrées, viande grillée, légumes verts, fruits, céréales complètes, poisson, frites.</span></p>",
          "reponse": "<p>Aliments énergétiques : boissons sucrées, céréales complètes, frites.</p><p>Aliments bâtisseurs : viande grillée, poisson.</p><p>Aliments protecteurs : légumes verts, fruits.</p>"
        },
        {
          "question": "<p><strong>1.2)</strong> Calculez les besoins énergétiques journaliers de Koffi et d'Amina. On donne la formule de Harris et Benedict pour les adolescents de 17 ans : <div class='math-block'><div class='math'>$$ \\text{MB} = 66 + (13,7 \\times \\text{P}) + (5 \\times \\text{T}) - (6,8 \\times \\text{A}) $$</div></div> où MB est le métabolisme de base en kcal, P est le poids en kg, T est la taille en cm et A est l'âge en années.</p><p>Données : Koffi pèse 70 kg pour 175 cm ; Amina pèse 60 kg pour 165 cm. Le facteur d'activité est de 1,5 pour un sédentaire et de 1,8 pour un sportif régulier.</p>",
          "reponse": "<p><strong>Calcul pour Koffi :</strong></p><p>MB = 66 + (13,7 x 70) + (5 x 175) - (6,8 x 17) = 66 + 959 + 875 - 115,6 = 1784,4 kcal.</p><p>Besoins énergétiques = MB x facteur d'activité = 1784,4 x 1,5 = 2676,6 kcal par jour.</p><p><strong>Calcul pour Amina :</strong></p><p>MB = 66 + (13,7 x 60) + (5 x 165) - (6,8 x 17) = 66 + 822 + 825 - 115,6 = 1597,4 kcal.</p><p>Besoins énergétiques = MB x facteur d'activité = 1597,4 x 1,8 = 2875,3 kcal par jour.</p>"
        },
        {
          "question": "<p><strong>1.3)</strong> D'après vos calculs et les informations du document, déterminez quel adolescent est le plus exposé aux déséquilibres alimentaires. Justifiez votre réponse en identifiant les risques de carences ou d'excès.</p>",
          "reponse": "<p>Koffi est le plus exposé. Son alimentation est riche en sucres rapides et en graisses saturées (excès), ce qui peut entraîner un surpoids, des problèmes cardiovasculaires et un risque accru de diabète de type 2. Sa faible consommation de fruits et légumes peut également entraîner des carences en vitamines et en fibres.</p><p>Amina, malgré des besoins énergétiques plus élevés, a une alimentation équilibrée, ce qui réduit les risques de maladies nutritionnelles.</p>"
        },
        {
          "question": "<p><strong>1.4)</strong> En vous basant sur les règles d'une alimentation équilibrée, proposez un menu type pour une journée pour Koffi afin de rééquilibrer ses apports. (Vous devez répartir l'apport alimentaire sur la journée).</p>",
          "reponse": "<p><strong>Petit-déjeuner (25%) :</strong> Un bol de lait ou de cacao, du pain complet avec un peu de beurre et de la confiture, un fruit (orange ou banane).</p><p><strong>Déjeuner (40%) :</strong> Une entrée de crudités (carottes râpées), un plat principal de riz ou de pâtes avec une portion de viande ou de poisson grillé, et des légumes cuits (haricots verts, brocolis). Un dessert : un yaourt nature ou un fruit.</p><p><strong>Dîner (25%) :</strong> Une soupe de légumes, une protéine (œuf ou poisson) avec des pommes de terre vapeur ou une purée, et une salade verte. Un laitage.</p><p><strong>Collation (10%) :</strong> Un fruit ou un produit laitier en milieu d'après-midi.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Hygiène et santé reproductive (6 points)",
      "points": "6 pts",
      "enonce": "<p style='font-weight: bold; font-size: 1.1em;'>Contexte :</p><p>Dans le cadre de la lutte contre les infections et la promotion de la santé en milieu scolaire, un club de santé a été créé dans votre lycée technique. Les membres du club souhaitent organiser une campagne d'information.</p>",
      "questions": [
        {
          "question": "<p><strong>2.1)</strong> Décrivez les 5 étapes principales du lavage des mains efficace, selon les recommandations de l'OMS, en précisant l'importance de chaque étape.</p>",
          "reponse": "<ol><li><strong>Se mouiller les mains</strong> : à l'eau courante propre (tiède de préférence).</li><li><strong>Appliquer du savon</strong> : en quantité suffisante pour faire mousser.</li><li><strong>Frotter vigoureusement</strong> : pendant au moins 20 secondes, en insistant sur le dos des mains, entre les doigts, les ongles et les poignets.</li><li><strong>Rincer abondamment</strong> : à l'eau courante propre pour éliminer le savon et les micro-organismes.</li><li><strong>Sécher les mains</strong> : avec une serviette en papier ou un sèche-mains à air chaud (éviter les serviettes communes).</li></ol><p>Le but est d'éliminer mécaniquement et chimiquement les micro-organismes présents sur la peau.</p>"
        },
        {
          "question": "<p><strong>2.2)</strong> Définissez la désinfection et expliquez son rôle dans la prévention des infections en milieu scolaire.</p>",
          "reponse": "<p><strong>Désinfection :</strong> C'est une opération qui vise à éliminer ou tuer la plupart des micro-organismes pathogènes présents sur une surface ou un objet, à l'aide de produits chimiques (désinfectants) ou de procédés physiques (chaleur).</p><p><strong>Rôle en milieu scolaire :</strong> La désinfection régulière des surfaces (tables, poignées de porte, sanitaires) et du matériel permet de réduire la transmission des germes responsables d'infections (gastro-entérites, grippes, etc.) au sein de la communauté scolaire.</p>"
        },
        {
          "question": "<p><strong>2.3)</strong> Parmi les problèmes de santé reproductive en milieu scolaire, le VIH/SIDA reste une préoccupation majeure. Expliquez brièvement comment le VIH se multiplie dans l'organisme et indiquez deux moyens de prévention efficaces.</p>",
          "reponse": "<p><strong>Multiplication du VIH :</strong> Le VIH est un virus qui utilise une enzyme, la transcriptase inverse, pour fabriquer une copie d'ADN de son matériel génétique (ARN). Cet ADN s'intègre dans le génome des cellules hôtes (notamment les lymphocytes T4). Le virus se multiplie ensuite à l'intérieur de la cellule, détruisant les lymphocytes T4. Cette destruction progressive affaiblit le système immunitaire.</p><p><strong>Moyens de prévention :</strong></p><ul><li>L'utilisation systématique du préservatif (masculin ou féminin) lors de rapports sexuels.</li><li>Le dépistage volontaire pour connaître son statut et, en cas de test positif, suivre un traitement antirétroviral qui réduit la charge virale et rend la transmission quasi nulle.</li></ul>"
        },
        {
          "question": "<p><strong>2.4)</strong> En quoi une bonne hygiène individuelle et collective contribue-t-elle à la lutte contre les problèmes de santé reproductive et les infections ? Rédigez un paragraphe de 5 à 10 lignes.</p>",
          "reponse": "<p>Une bonne hygiène individuelle, comme le lavage régulier des mains, est la première barrière contre les infections, notamment celles qui se transmettent par contact ou par voie oro-fécale. En milieu scolaire, cela limite la propagation des maladies diarrhéiques et respiratoires. Concernant la santé reproductive, des pratiques d'hygiène adéquates (comme l'utilisation de serviettes hygiéniques propres pour les filles) préviennent les infections gynécologiques. De plus, l'éducation à la santé, qui inclut l'hygiène, permet de sensibiliser les jeunes aux risques liés aux IST et au VIH, et de promouvoir des comportements responsables. Ainsi, l'hygiène collective, par le nettoyage des infrastructures (sanitaires, réfectoires) et la gestion des déchets, crée un environnement sain, propice à la prévention et à l'épanouissement des élèves.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Environnement et gestion des déchets (6 points)",
      "points": "6 pts",
      "enonce": "<p style='font-weight: bold; font-size: 1.1em;'>Situation :</p><p>Dans un quartier de Douala, les habitants constatent une augmentation des cas d'infections respiratoires et des mauvaises odeurs. Cette pollution est principalement due aux déchets ménagers qui sont brûlés à ciel ouvert.</p>",
      "questions": [
        {
          "question": "<p><strong>3.1)</strong> Identifiez et expliquez les polluants atmosphériques émis par l'incinération sauvage des déchets, ainsi que leurs conséquences sur la santé humaine.</p>",
          "reponse": "<p><strong>Polluants :</strong></p><ul><li><strong>Dioxyde de carbone (CO2) :</strong> Gaz à effet de serre.</li><li><strong>Monoxyde de carbone (CO) :</strong> Gaz toxique qui réduit la capacité du sang à transporter l'oxygène.</li><li><strong>Dioxyde de soufre (SO2) et oxydes d'azote :</strong> Responsables des pluies acides, ils irritent les voies respiratoires.</li><li><strong>Particules fines :</strong> (PM2.5, PM10) qui pénètrent profondément dans les poumons et peuvent provoquer des maladies respiratoires, des cancers et des problèmes cardiovasculaires.</li><li><strong>Dioxines et furannes :</strong> Polluants organiques persistants, très toxiques et cancérigènes.</li></ul>"
        },
        {
          "question": "<p><strong>3.2)</strong> Proposez deux techniques de traitement des déchets respectueuses de l'environnement pour lutter contre la pollution de l'air. Expliquez brièvement leur principe.</p>",
          "reponse": "<ol><li><strong>Le compostage :</strong> C'est une technique de valorisation des déchets organiques (déchets de cuisine, de jardin) par un processus de décomposition aérobie (en présence d'oxygène) sous l'action de micro-organismes. Le résultat est un compost, un fertilisant naturel pour les sols.</li><li><strong>Le recyclage :</strong> Il consiste à réintroduire les déchets (plastiques, verre, métaux, papiers) dans le cycle de production pour fabriquer de nouveaux objets, réduisant ainsi la quantité de déchets à brûler ou à enfouir.</li></ol>"
        },
        {
          "question": "<p><strong>3.3)</strong> Expliquez comment la pollution de l'air par les déchets peut avoir des effets écotoxicologiques sur les écosystèmes.</p>",
          "reponse": "<p>La pollution de l'air par les déchets a des effets dévastateurs sur les écosystèmes :</p><ul><li><strong>Pluies acides :</strong> Les oxydes de soufre et d'azote se transforment en acides dans l'atmosphère, acidifiant les sols et les cours d'eau, ce qui nuit à la vie aquatique et aux forêts.</li><li><strong>Contamination de la chaîne alimentaire :</strong> Les polluants persistants comme les dioxines et les métaux lourds se déposent sur les sols et les plantes. Ils sont ingérés par les animaux et se bioaccumulent dans les tissus gras, pouvant atteindre des concentrations toxiques chez les prédateurs en haut de la chaîne alimentaire (dont l'homme).</li><li><strong>Perte de biodiversité :</strong> La dégradation de la qualité de l'air et des sols réduit les habitats propices à de nombreuses espèces, entraînant un déclin de la biodiversité.</li></ul>"
        },
        {
          "question": "<p><strong>3.4)</strong> En tant qu'élève en classe de Tle technique, proposez une action concrète que vous pourriez mettre en place dans votre lycée pour réduire la pollution liée aux déchets.</p>",
          "reponse": "<p>Je proposerai de mettre en place un système de tri sélectif des déchets au sein du lycée. Cela consisterait à :</p><ul><li>Installer des poubelles de couleurs différentes pour les déchets (plastiques, papiers/cartons, déchets organiques, déchets dangereux).</li><li>Créer un composteur pour recycler les déchets organiques de la cantine et du jardin du lycée.</li><li>Organiser des campagnes de sensibilisation auprès des élèves et du personnel sur l'importance du tri et du compostage.</li><li>Établir un partenariat avec une entreprise de recyclage locale pour la collecte des déchets recyclables.</li></ul>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
