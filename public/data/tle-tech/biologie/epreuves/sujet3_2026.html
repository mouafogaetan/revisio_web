<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
    "matiere": "Biologie",
    "classe": "Tle technique",
    "sequence": "Séquence 3",
    "anneeScolaire": "2025-2026",
    "exercices": [
        {
            "titre": "Évaluation des savoirs",
            "points": "10 points",
            "enonce": "<div style='padding: 12px; background-color: #f5f5f5; border-radius: 10px; border-left: 6px solid #1565c0;'><p style='margin: 0; color: #0d47a1;'><strong>PARTIE A : ÉVALUATION DES RESSOURCES</strong></p></div>",
            "questions": [
                {
                    "question": "<div style='margin-bottom: 16px;'><p><strong>Exercice 1 : Questionnaire à Choix Multiples (QCM)</strong> <span style='color: #1565c0;'>(4 pts)</span></p><p><em>Chaque série d'affirmations ci-dessous comporte une seule réponse exacte. Recopier le numéro de la question et la lettre correspondant à la réponse choisie.</em></p><p style='margin-top: 12px;'><strong>1-</strong> L'incinération des déchets se fait à une température comprise entre :</p><ul style='list-style-type: lower-alpha;'><li>200°C et 400°C</li><li>500°C et 700°C</li><li>800°C et 1000°C</li><li>1200°C et 1500°C</li></ul><p style='margin-top: 12px;'><strong>2-</strong> Le compostage est une technique qui concerne les déchets :</p><ul style='list-style-type: lower-alpha;'><li>plastiques</li><li>organiques</li><li>métalliques</li><li>verre</li></ul><p style='margin-top: 12px;'><strong>3-</strong> Parmi les polluants suivants, lequel est un gaz toxique issu de la combustion incomplète ?</p><ul style='list-style-type: lower-alpha;'><li>Le CO₂</li><li>Le CO</li><li>Le SO₂</li><li>Les PM2.5</li></ul><p style='margin-top: 12px;'><strong>4-</strong> L'écotoxicologie étudie :</p><ul style='list-style-type: lower-alpha;'><li>la reproduction des espèces animales</li><li>les effets des polluants sur les écosystèmes</li><li>la croissance des plantes en milieu urbain</li><li>les bienfaits des pesticides</li></ul></div>",
                    "reponse": "<div style='background-color: #e8f5e9; padding: 12px; border-radius: 8px; border-left: 6px solid #2e7d32;'><p style='margin: 0; color: #1b5e20;'><strong>Corrigé :</strong></p><ol style='color: #1a1a1a;'><li><strong>Réponse c.</strong> L'incinération nécessite une température élevée comprise entre 800°C et 1000°C pour une combustion complète des déchets.</li><li><strong>Réponse b.</strong> Le compostage concerne exclusivement les déchets organiques biodégradables (épluchures, restes de repas, feuilles mortes, etc.).</li><li><strong>Réponse b.</strong> Le monoxyde de carbone (CO) est un gaz toxique provenant d'une combustion incomplète du carbone.</li><li><strong>Réponse b.</strong> L'écotoxicologie est la science qui étudie les effets des polluants sur les écosystèmes et les organismes vivants.</li></ol></div>"
                },
                {
                    "question": "<div style='margin-bottom: 16px;'><p><strong>Exercice 2 : Définition et schématisation</strong> <span style='color: #1565c0;'>(6 pts)</span></p><p><strong>1-</strong> Définir la gestion des déchets <span style='color: #1565c0;'>(1,5 pt)</span></p><p><strong>2-</strong> Citer et expliquer deux techniques de traitement des déchets <span style='color: #1565c0;'>(3 pts)</span></p><p><strong>3-</strong> Qu'est-ce qu'une pluie acide ? <span style='color: #1565c0;'>(1,5 pt)</span></p></div>",
                    "reponse": "<div style='background-color: #e8f5e9; padding: 12px; border-radius: 8px; border-left: 6px solid #2e7d32;'><p style='margin: 0; color: #1b5e20;'><strong>Corrigé :</strong></p><p style='color: #1a1a1a;'><strong>1-</strong> La gestion des déchets est l'ensemble des opérations de collecte, transport, traitement, recyclage et élimination des déchets.</p><p style='color: #1a1a1a;'><strong>2-</strong> Les techniques de traitement des déchets :</p><ul style='color: #1a1a1a;'><li><strong>L'incinération :</strong> Technique qui consiste à brûler les déchets à haute température (800-1000°C) pour réduire leur volume de 90%. Elle permet de produire de l'énergie mais émet des gaz polluants comme le CO₂, les dioxines et les particules fines.</li><li><strong>Le compostage :</strong> Technique biologique qui transforme les déchets organiques en un engrais naturel (compost) grâce à l'action des micro-organismes. C'est une méthode écologique et économique.</li></ul><p style='color: #1a1a1a;'><strong>3-</strong> Une pluie acide est une précipitation qui contient des acides (sulfurique et nitrique) formés par la combinaison du dioxyde de soufre (SO₂) et des oxydes d'azote (NOx) avec l'eau de l'atmosphère. Elle a des effets nocifs sur les forêts, les lacs et les bâtiments.</p></div>"
                }
            ]
        },
        {
            "titre": "Évaluation des savoir-faire",
            "points": "10 points",
            "enonce": "<div style='padding: 12px; background-color: #f5f5f5; border-radius: 10px; border-left: 6px solid #2e7d32;'><p style='margin: 0; color: #1b5e20;'><strong>PARTIE B : ÉVALUATION DES SAVOIR-FAIRE</strong></p></div>",
            "questions": [
                {
                    "question": "<div style='margin-bottom: 16px;'><p><strong>Exercice 3 : Étude de cas</strong> <span style='color: #1565c0;'>(4 pts)</span></p><p><em>Dans un quartier de Yaoundé, les habitants brûlent leurs déchets ménagers faute de collecte. La fumée qui se dégage provoque des irritations des yeux et de la gorge chez les enfants et les personnes âgées. Des analyses montrent la présence de dioxyde de carbone, de monoxyde de carbone, de particules fines (PM2.5) et de dioxines dans l'air.</em></p><p><strong>1-</strong> Identifier les polluants gazeux présents dans cet air pollué <span style='color: #1565c0;'>(1 pt)</span></p><p><strong>2-</strong> Expliquer pourquoi les enfants et les personnes âgées sont les plus touchés <span style='color: #1565c0;'>(1,5 pt)</span></p><p><strong>3-</strong> Proposer deux solutions à ce problème <span style='color: #1565c0;'>(1,5 pt)</span></p></div>",
                    "reponse": "<div style='background-color: #e8f5e9; padding: 12px; border-radius: 8px; border-left: 6px solid #2e7d32;'><p style='margin: 0; color: #1b5e20;'><strong>Corrigé :</strong></p><p style='color: #1a1a1a;'><strong>1-</strong> Les polluants gazeux sont : le dioxyde de carbone (CO₂) et le monoxyde de carbone (CO). Les particules fines (PM2.5) et les dioxines ne sont pas gazeuses.</p><p style='color: #1a1a1a;'><strong>2-</strong> Les enfants sont plus vulnérables car leur système immunitaire et leurs voies respiratoires sont encore en développement. Ils respirent plus d'air par kilogramme de poids corporel et sont donc plus exposés. Les personnes âgées ont un système immunitaire affaibli et des pathologies préexistantes qui les rendent plus sensibles.</p><p style='color: #1a1a1a;'><strong>3-</strong> Solutions :</p><ul style='color: #1a1a1a;'><li>Mettre en place un système de collecte sélective des déchets avec des points de dépôt et des tournées régulières.</li><li>Promouvoir le compostage individuel des déchets organiques et sensibiliser la population aux dangers du brûlage des déchets.</li></ul></div>"
                },
                {
                    "question": "<div style='margin-bottom: 16px;'><p><strong>Exercice 4 : Situation problème</strong> <span style='color: #1565c0;'>(6 pts)</span></p><p><em>Un établissement scolaire de Douala envisage de mettre en place un système de gestion durable de ses déchets pour réduire son impact sur l'environnement et sensibiliser les élèves.</em></p><p><strong>1-</strong> Identifier les types de déchets produits par un établissement scolaire <span style='color: #1565c0;'>(1 pt)</span></p><p><strong>2-</strong> Proposer un plan de gestion des déchets pour cet établissement en abordant :</p><ul style='list-style-type: lower-alpha;'><li>Le tri des déchets à la source <span style='color: #1565c0;'>(1 pt)</span></li><li>La mise en place d'un composteur <span style='color: #1565c0;'>(1,5 pt)</span></li><li>La sensibilisation des élèves <span style='color: #1565c0;'>(1,5 pt)</span></li><li>L'évaluation de l'impact de ce plan <span style='color: #1565c0;'>(1 pt)</span></li></ul></div>",
                    "reponse": "<div style='background-color: #e8f5e9; padding: 12px; border-radius: 8px; border-left: 6px solid #2e7d32;'><p style='margin: 0; color: #1b5e20;'><strong>Corrigé :</strong></p><p style='color: #1a1a1a;'><strong>1-</strong> Les déchets produits sont : les déchets organiques (restes de cantine), les papiers/cartons, les plastiques, les métaux et les déchets dangereux (piles, produits chimiques du laboratoire).</p><p style='color: #1a1a1a;'><strong>2-</strong> Plan de gestion des déchets :</p><ul style='color: #1a1a1a;'><li><strong>Tri à la source :</strong> Installer des poubelles de couleurs différentes (verre, plastique, papier, organique) dans les classes, la cantine et les bureaux.</li><li><strong>Composteur :</strong> Installer un composteur dans l'enceinte de l'école pour transformer les déchets organiques de la cantine en engrais naturel pour le jardin scolaire.</li><li><strong>Sensibilisation :</strong> Organiser des ateliers et des conférences sur la gestion des déchets, créer des clubs d'éco-délégués, et intégrer ces notions dans les cours de biologie.</li><li><strong>Évaluation :</strong> Mesurer la réduction des déchets envoyés à la décharge, évaluer le volume de compost produit, et suivre l'évolution des comportements des élèves.</li></ul></div>"
                }
            ]
        }
    ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
