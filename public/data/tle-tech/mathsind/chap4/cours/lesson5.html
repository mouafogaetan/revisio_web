<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Présentation mobile</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' },
            options: { skipHtmlTypes: 'script' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 500px;
        margin: 0 auto;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    .slide-header {
        flex-shrink: 0;
        padding: 18px 16px 10px 16px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        z-index: 10;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .slide-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
    }

    .content-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 18px 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        flex-shrink: 0;
    }

    .content-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .content-card li {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        line-height: 1.5;
    }

    .content-card li:last-child {
        border-bottom: none;
    }

    .bullet-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
    }

    .math-block {
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        overflow-x: auto;
        flex-shrink: 0;
        margin: 4px 0;
    }

    .math-block .math {
        font-size: 1.2rem;
        color: #e2e8f0;
    }

    .note-box {
        background: rgba(96, 165, 250, 0.08);
        border-left: 4px solid #60a5fa;
        padding: 12px 16px;
        border-radius: 12px;
        font-style: italic;
        font-size: 0.9rem;
        color: #cbd5e1;
        flex-shrink: 0;
    }

    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        border-radius: 0;
        flex-direction: column;
    }

    .loading-card {
        background: #1e293b;
        padding: 32px 28px;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #334155;
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px auto;
    }

    .loading-text {
        font-weight: 600;
        font-size: 1.1rem;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    .loading-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 16px;
    }
    .loading-progress {
        height: 3px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        animation: loadingProgress 30s ease-out forwards;
    }

    .loading-timeout {
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 12px;
    }

    .btn-cancel-loading {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 40px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #f87171;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }

    .btn-cancel-loading:active {
        transform: scale(0.94);
        background: rgba(239, 68, 68, 0.25);
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
    }

    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .slide-counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255,255,255,0.05);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(255,255,255,0.04);
    }

    .status-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 30px;
        background: rgba(96, 165, 250, 0.12);
        color: #93bbfc;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
    }

    .status-badge .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: pulse-dot 1.2s infinite;
        flex-shrink: 0;
    }

    .status-badge.idle .dot {
        animation: none;
        background: #64748b;
    }
    .status-badge.speaking .dot {
        background: #34d399;
        animation: pulse-dot 0.8s infinite;
    }
    .status-badge.error .dot {
        background: #f87171;
        animation: none;
    }
    .status-badge.paused .dot {
        animation: none;
        background: #fbbf24;
    }
    .status-badge.waiting .dot {
        animation: pulse-dot 1.5s infinite;
        background: #fbbf24;
    }
    .status-badge.loading .dot {
        animation: pulse-dot 0.5s infinite;
        background: #60a5fa;
    }

    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.7); }
    }

    .footer-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(255,255,255,0.1);
    }

    .btn-secondary {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-play {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
        min-width: 80px;
        justify-content: center;
    }
    .btn-play:active {
        background: rgba(52, 211, 153, 0.25);
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
    }

    .auto-indicator {
        font-size: 0.65rem;
        color: #64748b;
        text-align: center;
        letter-spacing: 0.3px;
        padding: 2px 0;
    }

    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.2rem;
        }
        .content-card li {
            font-size: 0.9rem;
            padding: 8px 0;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .btn-play {
            min-width: 60px;
        }
        .footer-buttons {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
        .loading-card {
            padding: 20px 16px;
        }
        .math-block .math {
            font-size: 1rem;
        }
    }

    @media (min-width: 600px) {
        .app-container {
            max-width: 480px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
        .loading-overlay {
            border-radius: 32px;
        }
    }

    /* Mode jour (par défaut) */
    html, body {
        background: #f0f4f8 !important;
        color: #1a202c !important;
    }
    .app-container {
        background: linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%) !important;
    }
    .slide-header {
        background: rgba(255, 255, 255, 0.85) !important;
        border-bottom: 1px solid rgba(0,0,0,0.08) !important;
    }
    .slide-header h1 {
        background: linear-gradient(135deg, #2b6cb0, #6b46c1) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        background-clip: text !important;
    }
    .slide-footer {
        background: rgba(255, 255, 255, 0.9) !important;
        border-top: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card {
        background: rgba(255,255,255,0.8) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card li {
        border-bottom: 1px solid rgba(0,0,0,0.05) !important;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.12) !important;
        border-left: 4px solid #4299e1 !important;
        color: #2c3e50 !important;
    }
    .math-block {
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .math-block .math {
        color: #2d3748 !important;
    }
    .slide-counter {
        color: #4a5568 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .status-badge {
        background: rgba(96, 165, 250, 0.15) !important;
        color: #2b6cb0 !important;
        border: 1px solid rgba(96, 165, 250, 0.15) !important;
    }
    .btn {
        color: #2d3748 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .btn-secondary {
        background: rgba(0,0,0,0.04) !important;
        border-color: rgba(0,0,0,0.08) !important;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15) !important;
        border-color: rgba(52, 211, 153, 0.2) !important;
        color: #38a169 !important;
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15) !important;
        border-color: rgba(251, 191, 36, 0.2) !important;
        color: #d69e2e !important;
    }
    .auto-indicator {
        color: #718096 !important;
    }
    .loading-card {
        background: #ffffff !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .loading-text {
        color: #1a202c !important;
    }
    .loading-sub {
        color: #4a5568 !important;
    }
</style>
</head>
<body>

<div class="app-container">

    <header class="slide-header">
        <h1 id="slideTitle">Chargement...</h1>
    </header>

    <main class="slide-body" id="slideBody"></main>

    <!-- LOADING OVERLAY AVEC BOUTON ANNULER -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Préparation vocale...</div>
            <div class="loading-sub" id="loadingSub">Synthèse en cours</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loadingProgressBar"></div>
            </div>
            <div class="loading-timeout" id="loadingTimeout">⏱️ 30 secondes maximum</div>
            <button class="btn-cancel-loading" id="cancelLoadingBtn">
                <span>✕</span> Annuler
            </button>
        </div>
    </div>

    <footer class="slide-footer">
        <div class="footer-top">
            <span class="slide-counter" id="slideCounter">1 / 3</span>
            <span class="status-badge idle" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">Prêt</span>
            </span>
        </div>

        <div class="footer-buttons">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-secondary" id="replayBtn">
                <span class="btn-icon">🔁</span> <span class="btn-label">Relire</span>
            </button>
            <button class="btn btn-play" id="playBtn">
                <span class="btn-icon">▶</span> <span class="btn-label">Play</span>
            </button>
        </div>

        <div class="auto-indicator" id="autoIndicator">⏸ Lecture manuelle</div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // SLIDES
    // ================================================================
   const slides = [
  {
    "titre": "Bienvenue en Terminale Technique !",
    "contenu": "<div style='text-align: center; padding: 20px 10px; background: linear-gradient(135deg, #0d47a1, #1565c0); border-radius: 15px; color: white;'><h1 style='color: #ffd54f; margin-bottom: 5px;'>⚙️ Mathématiques Industrielles</h1><h2 style='color: white; font-weight: 300;'>Chapitre 4 : Primitives et intégration</h2><hr style='width: 50px; border-color: #ffd54f;'><p style='font-size: 1.2em; margin-top: 15px;'>Leçon 5 : Primitive d'une fonction sur un intervalle</p><p style='font-style: italic; opacity: 0.9;'>Objectif : Déterminer les primitives des fonctions usuelles.</p></div>",
    "texteParle": "Bonjour à toutes et à tous, bienvenue en classe de Terminale Technique pour notre leçon sur les primitives. Aujourd'hui, nous allons découvrir un outil fondamental en mathématiques industrielles : la notion de primitive d'une fonction. C'est le concept inverse de la dérivation, et il est essentiel pour résoudre de nombreux problèmes en électricité, en mécanique et en économie. Nous allons apprendre à trouver les primitives des fonctions usuelles en utilisant le tableau des dérivées à l'envers.",
    "note": "Introduction générale à la notion de primitive."
  },
  {
    "titre": "Définition d'une primitive",
    "contenu": "<div style='background-color: #e3f2fd; padding: 20px; border-radius: 10px; border-left: 5px solid #0d47a1;'><h3 style='color: #0d47a1; margin-top: 0;'>📐 Définition fondamentale</h3><p style='background: white; padding: 15px; border-radius: 8px; font-size: 1.1em;'>Une fonction $$F$$ est une <strong>primitive</strong> de la fonction $$f$$ sur un intervalle $$I$$ si $$F$$ est dérivable sur $$I$$ et si, pour tout $$x \\in I$$, on a :</p><div class='math-block' style='background: #bbdefb; padding: 12px; border-radius: 8px; text-align: center; margin: 10px 0;'><div class='math'>$$F'(x) = f(x)$$</div></div><p style='background: #fff8e1; padding: 10px; border-radius: 6px; border-left: 3px solid #ff8f00;'><strong>Exemple :</strong> Une primitive de $$f(x) = 2x$$ est $$F(x) = x^2$$ car $$(x^2)' = 2x$$.</p></div>",
    "texteParle": "Commençons par la définition. Une primitive d'une fonction f est une fonction F dont la dérivée est exactement f. En d'autres termes, c'est l'opération inverse de la dérivation. Si vous dérivez F, vous obtenez f. Par exemple, la dérivée de x au carré est 2x, donc x au carré est une primitive de 2x. C'est simple, mais il y a un détail important à retenir que nous verrons dans le prochain slide.",
    "note": "Définition de la primitive comme opération inverse de la dérivation."
  },
  {
    "titre": "Le problème de l'unicité",
    "contenu": "<div style='background-color: #fff3e0; padding: 20px; border-radius: 10px; border-left: 5px solid #e65100;'><h3 style='color: #e65100; margin-top: 0;'>⚠️ Attention !</h3><p style='background: white; padding: 12px; border-radius: 8px;'>Si $$F$$ est une primitive de $$f$$, alors toute fonction $$G$$ de la forme $$G(x) = F(x) + C$$, où $$C$$ est une constante réelle, est aussi une primitive de $$f$$.</p><div class='math-block' style='background: #ffe0b2; padding: 12px; border-radius: 8px; text-align: center; margin: 10px 0;'><div class='math'>$$(F(x) + C)' = F'(x) + 0 = f(x)$$</div></div><div style='background: #ffccbc; padding: 10px; border-radius: 6px;'><strong>Conséquence :</strong> Une fonction $$f$$ admet <strong>une infinité</strong> de primitives, toutes diffèrent d'une constante additive.</div></div>",
    "texteParle": "Attention, il y a un point très important à retenir. Si vous trouvez une primitive d'une fonction, vous en avez en fait trouvé une infinité ! En effet, si F est une primitive de f, alors F plus une constante C est aussi une primitive, car la dérivée d'une constante est nulle. Par exemple, pour la fonction 2x, les primitives sont x au carré, x au carré plus 1, x au carré moins 5, et ainsi de suite. Cette constante C est souvent appelée constante d'intégration. On l'écrit généralement pour indiquer qu'il y a une infinité de solutions.",
    "note": "Les primitives d'une fonction sont définies à une constante additive près."
  },
  {
    "titre": "Tableau des primitives usuelles",
    "contenu": "<div style='background-color: #f5f5f5; padding: 15px; border-radius: 10px;'><h4 style='color: #1a237e;'>📋 Lecture inverse du tableau des dérivées</h4><div style='overflow-x: auto;'><table style='width: 100%; border-collapse: collapse; font-size: 0.9em;'><tr style='background: #1a237e; color: white;'><th style='padding: 10px; border: 1px solid #ddd;'>Fonction $$f(x)$$</th><th style='padding: 10px; border: 1px solid #ddd;'>Primitive $$F(x)$$</th></tr><tr><td style='padding: 8px; border: 1px solid #ddd; background: #e8eaf6;'>$$a$$ (constante)</td><td style='padding: 8px; border: 1px solid #ddd;'>$$ax + C$$</td></tr><tr><td style='padding: 8px; border: 1px solid #ddd; background: #e8eaf6;'>$$x^n$$ ($$n \\neq -1$$)</td><td style='padding: 8px; border: 1px solid #ddd;'>$$\\dfrac{x^{n+1}}{n+1} + C$$</td></tr><tr><td style='padding: 8px; border: 1px solid #ddd; background: #e8eaf6;'>$$\\dfrac{1}{x}$$</td><td style='padding: 8px; border: 1px solid #ddd;'>$$\\ln|x| + C$$</td></tr><tr><td style='padding: 8px; border: 1px solid #ddd; background: #e8eaf6;'>$$e^x$$</td><td style='padding: 8px; border: 1px solid #ddd;'>$$e^x + C$$</td></tr><tr><td style='padding: 8px; border: 1px solid #ddd; background: #e8eaf6;'>$$\\cos x$$</td><td style='padding: 8px; border: 1px solid #ddd;'>$$\\sin x + C$$</td></tr><tr><td style='padding: 8px; border: 1px solid #ddd; background: #e8eaf6;'>$$\\sin x$$</td><td style='padding: 8px; border: 1px solid #ddd;'>$$-\\cos x + C$$</td></tr><tr><td style='padding: 8px; border: 1px solid #ddd; background: #e8eaf6;'>$$\\dfrac{1}{\\sqrt{1 - x^2}}$$</td><td style='padding: 8px; border: 1px solid #ddd;'>$$\\arcsin x + C$$</td></tr><tr><td style='padding: 8px; border: 1px solid #ddd; background: #e8eaf6;'>$$\\dfrac{1}{1 + x^2}$$</td><td style='padding: 8px; border: 1px solid #ddd;'>$$\\arctan x + C$$</td></tr></table></div><p style='margin-top: 10px; font-style: italic; color: #555;'>💡 Ce tableau se lit de droite à gauche : la dérivée de la primitive donne la fonction.</p></div>",
    "texteParle": "Voici le tableau des primitives des fonctions usuelles. C'est le même tableau que celui des dérivées, mais lu à l'envers. Par exemple, si vous voyez x puissance n, sa primitive est x puissance n plus 1 divisé par n plus 1. Pour 1 sur x, la primitive est le logarithme népérien de la valeur absolue de x. Pour exponentielle de x, c'est exponentielle de x lui-même. Pour cosinus, c'est sinus, et pour sinus, c'est moins cosinus. Ce tableau est votre outil principal pour trouver des primitives. Gardez-le toujours à portée de main !",
    "note": "Tableau des primitives usuelles à retenir."
  },
  {
    "titre": "Exemple 1 : Primitive d'une constante",
    "contenu": "<div style='background-color: #e8f5e9; padding: 20px; border-radius: 10px; border-left: 5px solid #2e7d32;'><h4 style='color: #1b5e20;'>📝 Cas d'une fonction constante</h4><p><strong>Problème :</strong> Déterminer les primitives de $$f(x) = 5$$.</p><div style='background: white; padding: 15px; border-radius: 8px; margin: 10px 0;'><strong>🔍 Solution :</strong><br>D'après le tableau, une primitive d'une constante $$a$$ est $$ax + C$$.<br>Donc les primitives de $$f(x) = 5$$ sont :<br><div class='math-block' style='text-align: center; padding: 8px;'>$$F(x) = 5x + C$$</div>Vérification : $$(5x + C)' = 5$$.</div><div style='background: #c8e6c9; padding: 8px; border-radius: 6px;'><strong>Application :</strong> Un courant constant de 5 ampères est la dérivée d'une charge $$Q(t) = 5t + C$$.</div></div>",
    "texteParle": "Voyons un premier exemple. Si vous avez une fonction constante, par exemple f de x égal 5, sa primitive est 5 fois x plus la constante C. Vérifions : la dérivée de 5x plus C est bien 5. En industrie, cela a une application concrète. Si un courant électrique est constant, la charge électrique, qui est la primitive du courant, varie linéairement avec le temps. C'est un exemple classique de l'utilité des primitives en électricité.",
    "note": "Primitive d'une fonction constante : F(x) = ax + C."

  {
    "titre": "Exemple 2 : Primitive d'une puissance",
    "contenu": "<div style='background-color: #e3f2fd; padding: 20px; border-radius: 10px; border-left: 5px solid #0d47a1;'><h4 style='color: #0d47a1;'>📝 Cas d'une fonction puissance</h4><p><strong>Problème :</strong> Déterminer les primitives de $$f(x) = x^3$$.</p><div style='background: white; padding: 15px; border-radius: 8px; margin: 10px 0;'><strong>🔍 Solution :</strong><br>Pour $$n = 3$$, on a :<br><div class='math-block' style='text-align: center; padding: 8px;'>$$F(x) = \\dfrac{x^{3+1}}{3+1} + C = \\dfrac{x^4}{4} + C$$</div>Vérification : $$\\left(\\dfrac{x^4}{4} + C\\right)' = \\dfrac{4x^3}{4} = x^3$$.</div><div style='background: #bbdefb; padding: 8px; border-radius: 6px;'><strong>Interprétation :</strong> En mécanique, si l'accélération est en $$t^3$$, la vitesse (primitive) est en $$\\dfrac{t^4}{4}$$.</div></div>",
    "texteParle": "Deuxième exemple avec une fonction puissance. Pour x puissance 3, la primitive est x puissance 4 divisé par 4, plus la constante. La règle est simple : on ajoute 1 à l'exposant, et on divise par le nouvel exposant. C'est la règle de base pour toutes les puissances, sauf pour x puissance moins 1, qui est un cas particulier avec le logarithme. Cette règle est très utilisée en mécanique. Par exemple, si l'accélération d'un véhicule varie en t au cube, alors sa vitesse, qui est la primitive de l'accélération, varie en t puissance 4 sur 4.",
    "note": "Primitive de x^n : F(x) = x^(n+1)/(n+1) + C."

  {
    "titre": "Exemple 3 : Cas particulier de 1/x",
    "contenu": "<div style='background-color: #fff3e0; padding: 20px; border-radius: 10px; border-left: 5px solid #e65100;'><h4 style='color: #e65100;'>📝 Cas particulier : $$f(x) = \\dfrac{1}{x}$$</h4><p><strong>Problème :</strong> Déterminer les primitives de $$f(x) = \\dfrac{1}{x}$$.</p><div style='background: white; padding: 15px; border-radius: 8px; margin: 10px 0;'><strong>🔍 Solution :</strong><br>La primitive de $$1/x$$ est le <strong>logarithme népérien</strong> :<br><div class='math-block' style='text-align: center; padding: 8px;'>$$F(x) = \\ln|x| + C$$</div>Vérification : $$(\\ln|x|)' = \\dfrac{1}{x}$$ pour $$x \\neq 0$$.</div><div style='background: #ffe0b2; padding: 8px; border-radius: 6px;'><strong>⚠️ Attention :</strong> Cette primitive n'est valable que pour $$x \\neq 0$$. On utilise souvent $$\\ln|x|$$ pour couvrir les deux intervalles $$]-\\infty; 0[$$ et $$]0; +\\infty[$$.</div></div>",
    "texteParle": "Troisième exemple, un cas particulier important : la primitive de 1 sur x. C'est le logarithme népérien de la valeur absolue de x, plus la constante. Ce cas est particulier car il ne suit pas la règle des puissances. En effet, si on essayait d'appliquer la formule avec n égal moins 1, on aurait une division par zéro, ce qui n'est pas possible. C'est pourquoi on a une fonction spéciale, le logarithme. En électronique, on retrouve souvent cette primitive dans les calculs de temps de charge des condensateurs.",
    "note": "Primitive de 1/x : F(x) = ln|x| + C."

  {
    "titre": "Primitive d'une exponentielle",
    "contenu": "<div style='background-color: #f3e5f5; padding: 20px; border-radius: 10px; border-left: 5px solid #6a1b9a;'><h4 style='color: #6a1b9a;'>📝 Cas de l'exponentielle</h4><p><strong>Problème :</strong> Déterminer les primitives de $$f(x) = e^{2x}$$.</p><div style='background: white; padding: 15px; border-radius: 8px; margin: 10px 0;'><strong>🔍 Solution :</strong><br>Pour une exponentielle de la forme $$e^{kx}$$, la primitive est :<br><div class='math-block' style='text-align: center; padding: 8px;'>$$F(x) = \\dfrac{1}{k} e^{kx} + C$$</div>Donc pour $$f(x) = e^{2x}$$ :<br><div class='math-block' style='text-align: center; padding: 8px;'>$$F(x) = \\dfrac{1}{2} e^{2x} + C$$</div>Vérification : $$\\left(\\dfrac{1}{2} e^{2x} + C\\right)' = \\dfrac{1}{2} \\times 2e^{2x} = e^{2x}$$.</div><div style='background: #e1bee7; padding: 8px; border-radius: 6px;'><strong>Application :</strong> En biologie, les populations suivant une croissance exponentielle $$P(t) = P_0 e^{kt}$$.</div></div>",
    "texteParle": "Passons aux exponentielles. Pour une fonction exponentielle de la forme e puissance kx, la primitive est 1 sur k fois e puissance kx, plus la constante. Par exemple, pour e puissance 2x, la primitive est un demi fois e puissance 2x. Vérifions : la dérivée de un demi fois e puissance 2x est bien e puissance 2x. Les exponentielles sont très fréquentes en sciences, notamment en biologie pour modéliser la croissance des populations, ou en électricité pour les courbes de charge et de décharge des condensateurs.",
    "note": "Primitive de e^(kx) : F(x) = (1/k) e^(kx) + C."

  {
    "titre": "Exemple 4 : Fonction trigonométrique",
    "contenu": "<div style='background-color: #fce4ec; padding: 20px; border-radius: 10px; border-left: 5px solid #c62828;'><h4 style='color: #c62828;'>📝 Cas des fonctions trigonométriques</h4><p><strong>Problème :</strong> Déterminer les primitives de $$f(x) = \\sin(3x)$$.</p><div style='background: white; padding: 15px; border-radius: 8px; margin: 10px 0;'><strong>🔍 Solution :</strong><br>Pour $$\\sin(kx)$$, la primitive est :<br><div class='math-block' style='text-align: center; padding: 8px;'>$$F(x) = -\\dfrac{1}{k} \\cos(kx) + C$$</div>Donc pour $$f(x) = \\sin(3x)$$ :<br><div class='math-block' style='text-align: center; padding: 8px;'>$$F(x) = -\\dfrac{1}{3} \\cos(3x) + C$$</div>Vérification : $$\\left(-\\dfrac{1}{3} \\cos(3x) + C\\right)' = -\\dfrac{1}{3} \\times (-3\\sin(3x)) = \\sin(3x)$$.</div></div>",
    "texteParle": "Voyons maintenant les fonctions trigonométriques. Pour sin de 3x, la primitive est moins un tiers fois cos de 3x, plus la constante. La règle est simple : pour sin de kx, on a moins 1 sur k fois cos de kx. Pour cos de kx, on a 1 sur k fois sin de kx. Ces primitives sont très utiles en électricité pour analyser les courants et tensions alternatifs sinusoïdaux, ce qui est un sujet important dans votre formation technique.",
    "note": "Primitive de sin(kx) : F(x) = -1/k cos(kx) + C."

  {
    "titre": "La primitive avec condition initiale",
    "contenu": "<div style='background-color: #e0f7fa; padding: 20px; border-radius: 10px; border-left: 5px solid #00695c;'><h4 style='color: #00695c;'>🎯 Trouver la primitive unique</h4><p style='background: white; padding: 12px; border-radius: 8px;'>Pour déterminer la constante $$C$$, on utilise une <strong>condition initiale</strong> : $$F(x_0) = y_0$$.</p><div style='background: white; padding: 15px; border-radius: 8px; margin: 10px 0;'><strong>Exemple :</strong><br>Déterminer la primitive de $$f(x) = 2x$$ qui vérifie $$F(1) = 3$$.<br><br>On a $$F(x) = x^2 + C$$.<br>La condition $$F(1) = 3$$ donne $$1^2 + C = 3$$, donc $$C = 2$$.<br>La primitive cherchée est $$F(x) = x^2 + 2$$.</div><div style='background: #b2dfdb; padding: 8px; border-radius: 6px;'><strong>Interprétation :</strong> En physique, une condition initiale est la position ou la vitesse à un instant donné.</div></div>",
    "texteParle": "Un dernier point important. Comment choisir la bonne primitive parmi l'infinité de possibilités ? On utilise une condition initiale. Par exemple, si on sait que la primitive doit valoir 3 quand x vaut 1, on peut déterminer la constante C. Prenons l'exemple de f de x égal 2x. La primitive générale est x au carré plus C. Si on impose F de 1 égal 3, on obtient 1 plus C égal 3, donc C égal 2. La primitive unique est donc x au carré plus 2. C'est très important en physique, où les conditions initiales comme la position ou la vitesse à un instant donné permettent de déterminer les constantes.",
    "note": "Une condition initiale permet de déterminer la constante C de la primitive."

    "contenu": "<div style='background-color: #f5f5f5; padding: 20px; border-radius: 10px; border-bottom: 5px solid #0d47a1;'><h4 style='color: #0d47a1;'>📝 Ce qu'il faut retenir</h4><div style='display: flex; flex-direction: column; gap: 8px;'><div style='background: white; padding: 10px 12px; border-radius: 20px;'><span style='color: #0d47a1;'>✔</span> Une primitive de $$f$$ est une fonction $$F$$ telle que $$F' = f$$.</div><div style='background: white; padding: 10px 12px; border-radius: 20px;'><span style='color: #0d47a1;'>✔</span> Une fonction admet une infinité de primitives $$F(x) + C$$.</div><div style='background: white; padding: 10px 12px; border-radius: 20px;'><span style='color: #0d47a1;'>✔</span> $$\\displaystyle\\int x^n dx = \\dfrac{x^{n+1}}{n+1} + C$$ (pour $$n \\neq -1$$)</div><div style='background: white; padding: 10px 12px; border-radius: 20px;'><span style='color: #0d47a1;'>✔</span> $$\\displaystyle\\int \\dfrac{1}{x} dx = \\ln|x| + C$$</div><div style='background: white; padding: 10px 12px; border-radius: 20px;'><span style='color: #0d47a1;'>✔</span> $$\\displaystyle\\int e^{kx} dx = \\dfrac{1}{k} e^{kx} + C$$</div><div style='background: white; padding: 10px 12px; border-radius: 20px;'><span style='color: #0d47a1;'>✔</span> $$\\displaystyle\\int \\sin(kx) dx = -\\dfrac{1}{k} \\cos(kx) + C$$</div><div style='background: white; padding: 10px 12px; border-radius: 20px;'><span style='color: #0d47a1;'>✔</span> Une condition initiale permet de déterminer $$C$$.</div></div></div>",
    "texteParle": "Pour terminer cette leçon, voici un résumé des points essentiels à retenir. Une primitive est une fonction dont la dérivée est la fonction donnée. Il y a une infinité de primitives, toutes diffèrent d'une constante additive. Vous devez maîtriser les primitives des fonctions usuelles : les puissances, le logarithme, les exponentielles et les fonctions trigonométriques. N'oubliez pas qu'une condition initiale permet de déterminer la constante unique pour un problème donné. Ces notions sont fondamentales pour la suite du cours sur l'intégration et ses applications industrielles.",

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentIndex = 0;
    let isSpeaking = false;
    let isPaused = false;
    let currentUtterance = null;
    let isLoading = false;
    let loadingTimeout = null;
    let isTransitioning = false;
    let speechSupported = true;
    let userInteracted = false;
    let isPlaying = false;
    let loadingCancelled = false;

    const total = slides.length;
    const synth = window.speechSynthesis;

    // Références jQuery
    const $title = $('#slideTitle');
    const $body = $('#slideBody');
    const $counter = $('#slideCounter');
    const $statusText = $('#statusText');
    const $statusBadge = $('#statusBadge');
    const $loading = $('#loadingOverlay');
    const $loadingText = $('#loadingText');
    const $loadingSub = $('#loadingSub');
    const $loadingTimeout = $('#loadingTimeout');
    const $loadingProgressBar = $('#loadingProgressBar');
    const $autoIndicator = $('#autoIndicator');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $replay = $('#replayBtn');
    const $play = $('#playBtn');
    const $cancelLoading = $('#cancelLoadingBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function setStatus(text, type) {
        $statusText.text(text);
        $statusBadge.removeClass('idle speaking error paused waiting loading');
        if (type === 'speaking') $statusBadge.addClass('speaking');
        else if (type === 'error') $statusBadge.addClass('error');
        else if (type === 'paused') $statusBadge.addClass('paused');
        else if (type === 'waiting') $statusBadge.addClass('waiting');
        else if (type === 'loading') $statusBadge.addClass('loading');
        else $statusBadge.addClass('idle');
    }

    function updatePlayButton() {
        if (isPlaying) {
            $play.addClass('playing');
            $play.find('.btn-icon').text('⏸');
            $play.find('.btn-label').text('Pause');
        } else {
            $play.removeClass('playing');
            $play.find('.btn-icon').text('▶');
            $play.find('.btn-label').text('Play');
        }
    }

    function showLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        
        loadingCancelled = false;
        isLoading = true;
        
        // Réinitialiser la barre de progression
        $loadingProgressBar.css('animation', 'none');
        $loadingProgressBar.css('width', '0%');
        // Forcer un reflow
        $loadingProgressBar[0].offsetHeight;
        $loadingProgressBar.css('animation', 'loadingProgress 30s ease-out forwards');
        
        $loadingText.text('Préparation vocale...');
        $loadingSub.text('Synthèse en cours');
        $loadingTimeout.text('⏱️ 30 secondes maximum');
        $loading.fadeIn(300);
        setStatus("⏳ Chargement...", 'loading');
        
        // 🔥 TIMEOUT DE 30 SECONDES
        loadingTimeout = setTimeout(() => {
            if (isLoading && !loadingCancelled) {
                hideLoading();
                setStatus("⚠️ Délai dépassé (30s)", 'error');
                isPlaying = false;
                updatePlayButton();
                $loadingSub.text('La synthèse vocale a pris trop de temps');
                $loadingTimeout.text('❌ Délai dépassé');
            }
        }, 30000);
    }

    function hideLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        isLoading = false;
        loadingCancelled = false;
        $loading.fadeOut(300);
        // Ne pas changer le statut si on est en train de parler
        if (!isSpeaking && !isPlaying) {
            setStatus("⏸ Lecture arrêtée", 'paused');
        }
    }

    function cancelLoading() {
        loadingCancelled = true;
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        hideLoading();
        stopSpeaking();
        setStatus("⏸ Annulé", 'paused');
        isPlaying = false;
        updatePlayButton();
        $loadingText.text('Annulé par l\'utilisateur');
        $loadingSub.text('Vous pouvez réessayer');
        $loadingTimeout.text('✕ Annulation');
    }

    // Arrêter la parole proprement
    function stopSpeaking() {
        try {
            if (synth && (synth.speaking || synth.pending)) {
                synth.cancel();
            }
        } catch(e) {
            console.warn('Erreur stopSpeaking:', e);
        }
        if (currentUtterance) {
            try {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance.onstart = null;
            } catch(e) {}
            currentUtterance = null;
        }
        isSpeaking = false;
        isPlaying = false;
        updatePlayButton();
    }

    // Mettre en pause la parole
    function pauseSpeaking() {
        try {
            if (synth && synth.speaking) {
                synth.pause();
                isPaused = true;
                isPlaying = false;
                setStatus("⏸ Lecture en pause", 'paused');
                updatePlayButton();
            }
        } catch(e) {
            console.warn('Erreur pauseSpeaking:', e);
            stopSpeaking();
        }
    }

    // Reprendre la parole
    function resumeSpeaking() {
        try {
            if (synth && synth.paused) {
                synth.resume();
                isPaused = false;
                isPlaying = true;
                setStatus("🔊 Lecture en cours", 'speaking');
                updatePlayButton();
            } else if (!isSpeaking && !synth.speaking && !synth.pending) {
                speakSlide(currentIndex);
            }
        } catch(e) {
            console.warn('Erreur resumeSpeaking:', e);
            speakSlide(currentIndex);
        }
    }

    function renderSlide(index) {
        const slide = slides[index];
        $title.text(slide.titre);

        let html = '';
        html += `<div class="content-card">${slide.contenu}</div>`;
        if (slide.note) {
            html += `<div class="note-box">${slide.note}</div>`;
        }
        $body.html(html);
        $counter.text(`${index+1} / ${total}`);

        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
        }
    }

    // ================================================================
    // LECTURE VOCALE
    // ================================================================
    function speakSlide(index) {
        return new Promise((resolve) => {
            const slide = slides[index];
            const text = slide.texteParle;
            
            if (!text || text.trim() === '' || !speechSupported) {
                resolve();
                return;
            }

            if (!window.speechSynthesis) {
                setStatus("❌ Synthèse vocale non supportée", 'error');
                speechSupported = false;
                resolve();
                return;
            }

            // Arrêter toute lecture en cours
            stopSpeaking();
            
            // Réinitialiser l'état de pause
            isPaused = false;
            
            showLoading();
            setStatus("Initialisation...", 'loading');

            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.92;
                utterance.pitch = 1.05;
                utterance.volume = 1;

                let isFinished = false;
                let errorHandled = false;

                utterance.onstart = function() {
                    if (loadingCancelled) {
                        stopSpeaking();
                        resolve();
                        return;
                    }
                    hideLoading();
                    isSpeaking = true;
                    isPlaying = true;
                    isPaused = false;
                    setStatus("🔊 Lecture en cours", 'speaking');
                    updatePlayButton();
                };

                utterance.onend = function() {
                    if (isFinished) return;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    setStatus("✅ Terminé", 'idle');
                    hideLoading();
                    updatePlayButton();
                    resolve();
                };

                utterance.onerror = function(e) {
                    if (isFinished || errorHandled) return;
                    errorHandled = true;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    hideLoading();
                    updatePlayButton();
                    
                    if (e.error === 'not-allowed') {
                        setStatus("⚠️ Permission refusée", 'error');
                    } else if (e.error === 'synthesis-unavailable') {
                        setStatus("⚠️ Synthèse indisponible", 'error');
                    } else if (e.error === 'canceled') {
                        setStatus("⏸ Annulé", 'paused');
                    } else {
                        setStatus("❌ Erreur audio: " + (e.error || 'inconnue'), 'error');
                    }
                    
                    resolve();
                };

                // Gestion du chargement des voix
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = function() {
                        if (!loadingCancelled) {
                            try {
                                synth.speak(utterance);
                            } catch(err) {
                                // Silencieux
                            }
                        }
                        synth.onvoiceschanged = null;
                    };
                }

                currentUtterance = utterance;
                
                if (!loadingCancelled) {
                    try {
                        synth.speak(utterance);
                    } catch(err) {
                        setTimeout(() => {
                            if (!loadingCancelled) {
                                try {
                                    synth.speak(utterance);
                                } catch(e) {
                                    setStatus("❌ Erreur de lecture", 'error');
                                    isPlaying = false;
                                    updatePlayButton();
                                    hideLoading();
                                    resolve();
                                }
                            } else {
                                resolve();
                            }
                        }, 100);
                    }
                } else {
                    resolve();
                }

            } catch(err) {
                hideLoading();
                setStatus("❌ Erreur générale", 'error');
                isPlaying = false;
                updatePlayButton();
                console.error('Erreur speakSlide:', err);
                resolve();
            }
        });
    }

    // ================================================================
    // NAVIGATION
    // ================================================================
    async function goToSlide(index) {
        if (isTransitioning) return;
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        
        // Si on est en train de lire, on met en pause avant de naviguer
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        // Arrêter complètement la lecture
        stopSpeaking();
        
        await new Promise(r => setTimeout(r, 50));
        
        if (index === currentIndex) {
            setStatus("📄 Slide actuel", 'idle');
            return;
        }

        isTransitioning = true;
        currentIndex = index;
        renderSlide(index);
        
        // Réinitialiser l'état de lecture
        isPlaying = false;
        updatePlayButton();
        setStatus("⏸ Lecture arrêtée", 'paused');

        await new Promise(r => setTimeout(r, 150));
        isTransitioning = false;
    }

    async function goToNext() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex + 1 < total) {
            await goToSlide(currentIndex + 1);
        } else {
            setStatus("🏁 Dernier slide", 'idle');
        }
    }

    async function goToPrev() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex - 1 >= 0) {
            await goToSlide(currentIndex - 1);
        } else {
            setStatus("🔁 Premier slide", 'idle');
        }
    }

    // ================================================================
    // GESTION PLAY/PAUSE
    // ================================================================
    function togglePlay() {
        if (!userInteracted) {
            userInteracted = true;
        }

        // Si le chargement est en cours, on l'annule
        if (isLoading) {
            cancelLoading();
            return;
        }

        // Si le synthétiseur est en pause, on reprend
        if (synth && synth.paused) {
            resumeSpeaking();
            return;
        }

        // Si la lecture est en cours, on met en pause
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
            return;
        }

        // Sinon, on démarre la lecture du slide courant
        if (!isSpeaking && !isPlaying) {
            stopSpeaking();
            speakSlide(currentIndex);
        }
    }

    // ================================================================
    // INIT
    // ================================================================
    async function init() {
        // Vérifier la compatibilité
        if (!window.speechSynthesis) {
            setStatus("❌ Synthèse vocale non supportée", 'error');
            speechSupported = false;
        }

        // Précharger les voix
        try {
            if (synth.getVoices) {
                synth.getVoices();
                setTimeout(() => {
                    try {
                        synth.getVoices();
                    } catch(e) {}
                }, 200);
            }
        } catch(e) {
            console.warn('Erreur chargement voix:', e);
        }

        // Afficher le premier slide
        renderSlide(0);
        $counter.text(`1 / ${total}`);
        
        // État initial
        setStatus("⏸ Appuie sur Play", 'paused');
        updatePlayButton();
        $autoIndicator.text('⏸ Lecture manuelle');

        // ================================================================
        // ÉVÉNEMENTS
        // ================================================================
        
        // Bouton Play/Pause
        $play.on('click', function() {
            togglePlay();
        });

        // Bouton Annuler le chargement
        $cancelLoading.on('click', function() {
            cancelLoading();
        });

        // Navigation
        $prev.on('click', function() {
            // Si chargement en cours, on annule
            if (isLoading) cancelLoading();
            goToPrev();
        });

        $next.on('click', function() {
            if (isLoading) cancelLoading();
            goToNext();
        });

        // Replay - relire le slide courant
        $replay.on('click', function() {
            if (isLoading) cancelLoading();
            stopSpeaking();
            setTimeout(() => {
                speakSlide(currentIndex);
            }, 100);
        });

        // Support du clavier (espace pour play/pause)
        $(document).on('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });

        // Nettoyage
        $(window).on('beforeunload', function() {
            try {
                if (synth.speaking) synth.cancel();
            } catch(e) {}
            hideLoading();
        });

        // Gérer les cas où la synthèse se termine de manière inattendue
        setInterval(() => {
            if (isPlaying && !synth.speaking && !synth.pending && !isPaused && !isLoading) {
                isPlaying = false;
                updatePlayButton();
                setStatus("⏸ Lecture arrêtée", 'paused');
            }
        }, 1000);
    }

    init();
});



    // ================================================================
    // GESTION DU THÈME JOUR/NUIT
    // ================================================================
    let isDarkMode = false;

    function toggleTheme() {
        isDarkMode = !isDarkMode;
        const body = document.body;
        const appContainer = document.querySelector('.app-container');
        const header = document.querySelector('.slide-header');
        const footer = document.querySelector('.slide-footer');
        const contentCards = document.querySelectorAll('.content-card');
        const noteBoxes = document.querySelectorAll('.note-box');
        const mathBlocks = document.querySelectorAll('.math-block');
        const buttons = document.querySelectorAll('.btn');
        const statusBadge = document.querySelector('.status-badge');
        const slideCounter = document.querySelector('.slide-counter');
        const autoIndicator = document.querySelector('.auto-indicator');
        const themeBtn = document.getElementById('themeToggle');

        if (isDarkMode) {
            // Mode nuit
            body.style.background = '#0b1120';
            body.style.color = '#f1f5f9';
            appContainer.style.background = 'linear-gradient(145deg, #0f172a 0%, #1e293b 100%)';
            header.style.background = 'rgba(15, 23, 42, 0.85)';
            footer.style.background = 'rgba(15, 23, 42, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.05)';
                card.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.08)';
                note.style.color = '#cbd5e1';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.25)';
                block.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#e2e8f0';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.12)';
                statusBadge.style.color = '#93bbfc';
            }
            if (slideCounter) {
                slideCounter.style.color = '#94a3b8';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#64748b';
            }
            if (themeBtn) {
                themeBtn.textContent = '☀️';
                themeBtn.title = 'Passer en mode jour';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#e2e8f0';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#e2e8f0';
                }
            });
        } else {
            // Mode jour (par défaut)
            body.style.background = '#f0f4f8';
            body.style.color = '#1a202c';
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
            header.style.background = 'rgba(255, 255, 255, 0.85)';
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.8)';
                card.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.12)';
                note.style.color = '#2c3e50';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.05)';
                block.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#2d3748';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
                statusBadge.style.color = '#2b6cb0';
            }
            if (slideCounter) {
                slideCounter.style.color = '#4a5568';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#718096';
            }
            if (themeBtn) {
                themeBtn.textContent = '🌓';
                themeBtn.title = 'Passer en mode nuit';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#2c3e50';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#2d3748';
                }
            });
        }
    }

    // Initialiser en mode jour
    document.addEventListener('DOMContentLoaded', function() {
        // Appliquer le mode jour par défaut
        const body = document.body;
        body.style.background = '#f0f4f8';
        body.style.color = '#1a202c';
        
        const appContainer = document.querySelector('.app-container');

        if (statusBadge) {

        }
        
        const slideCounter = document.querySelector('.slide-counter');
        if (slideCounter) {

        }
        
        const autoIndicator = document.querySelector('.auto-indicator');
        if (autoIndicator) {
            autoIndicator.style.color = '#718096';
        }
        
        document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
            if (!el.closest('.note-box')) {
                el.style.color = '#2c3e50';
            }
        });
        
        document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
            if (!el.closest('.note-box') && !el.closest('.math-block')) {
                el.style.color = '#2d3748';

        });
        
        const themeBtn = document.getElementById('themeToggle');
        if (themeBtn) {
            themeBtn.textContent = '🌓';
            themeBtn.title = 'Passer en mode nuit';
        }
    });
</script>
