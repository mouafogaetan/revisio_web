<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Présentation mobile</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' },
            options: { skipHtmlTypes: 'script' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 500px;
        margin: 0 auto;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    .slide-header {
        flex-shrink: 0;
        padding: 18px 16px 10px 16px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        z-index: 10;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .slide-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
    }

    .content-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 18px 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        flex-shrink: 0;
    }

    .content-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .content-card li {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        line-height: 1.5;
    }

    .content-card li:last-child {
        border-bottom: none;
    }

    .bullet-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
    }

    .math-block {
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        overflow-x: auto;
        flex-shrink: 0;
        margin: 4px 0;
    }

    .math-block .math {
        font-size: 1.2rem;
        color: #e2e8f0;
    }

    .note-box {
        background: rgba(96, 165, 250, 0.08);
        border-left: 4px solid #60a5fa;
        padding: 12px 16px;
        border-radius: 12px;
        font-style: italic;
        font-size: 0.9rem;
        color: #cbd5e1;
        flex-shrink: 0;
    }

    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        border-radius: 0;
        flex-direction: column;
    }

    .loading-card {
        background: #1e293b;
        padding: 32px 28px;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #334155;
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px auto;
    }

    .loading-text {
        font-weight: 600;
        font-size: 1.1rem;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    .loading-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 16px;
    }
    .loading-progress {
        height: 3px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        animation: loadingProgress 30s ease-out forwards;
    }

    .loading-timeout {
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 12px;
    }

    .btn-cancel-loading {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 40px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #f87171;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }

    .btn-cancel-loading:active {
        transform: scale(0.94);
        background: rgba(239, 68, 68, 0.25);
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
    }

    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .slide-counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255,255,255,0.05);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(255,255,255,0.04);
    }

    .status-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 30px;
        background: rgba(96, 165, 250, 0.12);
        color: #93bbfc;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
    }

    .status-badge .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: pulse-dot 1.2s infinite;
        flex-shrink: 0;
    }

    .status-badge.idle .dot {
        animation: none;
        background: #64748b;
    }
    .status-badge.speaking .dot {
        background: #34d399;
        animation: pulse-dot 0.8s infinite;
    }
    .status-badge.error .dot {
        background: #f87171;
        animation: none;
    }
    .status-badge.paused .dot {
        animation: none;
        background: #fbbf24;
    }
    .status-badge.waiting .dot {
        animation: pulse-dot 1.5s infinite;
        background: #fbbf24;
    }
    .status-badge.loading .dot {
        animation: pulse-dot 0.5s infinite;
        background: #60a5fa;
    }

    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.7); }
    }

    .footer-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(255,255,255,0.1);
    }

    .btn-secondary {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-play {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
        min-width: 80px;
        justify-content: center;
    }
    .btn-play:active {
        background: rgba(52, 211, 153, 0.25);
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
    }

    .auto-indicator {
        font-size: 0.65rem;
        color: #64748b;
        text-align: center;
        letter-spacing: 0.3px;
        padding: 2px 0;
    }

    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.2rem;
        }
        .content-card li {
            font-size: 0.9rem;
            padding: 8px 0;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .btn-play {
            min-width: 60px;
        }
        .footer-buttons {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
        .loading-card {
            padding: 20px 16px;
        }
        .math-block .math {
            font-size: 1rem;
        }
    }

    @media (min-width: 600px) {
        .app-container {
            max-width: 480px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
        .loading-overlay {
            border-radius: 32px;
        }
    }

    /* Mode jour (par défaut) */
    html, body {
        background: #f0f4f8 !important;
        color: #1a202c !important;
    }
    .app-container {
        background: linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%) !important;
    }
    .slide-header {
        background: rgba(255, 255, 255, 0.85) !important;
        border-bottom: 1px solid rgba(0,0,0,0.08) !important;
    }
    .slide-header h1 {
        background: linear-gradient(135deg, #2b6cb0, #6b46c1) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        background-clip: text !important;
    }
    .slide-footer {
        background: rgba(255, 255, 255, 0.9) !important;
        border-top: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card {
        background: rgba(255,255,255,0.8) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card li {
        border-bottom: 1px solid rgba(0,0,0,0.05) !important;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.12) !important;
        border-left: 4px solid #4299e1 !important;
        color: #2c3e50 !important;
    }
    .math-block {
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .math-block .math {
        color: #2d3748 !important;
    }
    .slide-counter {
        color: #4a5568 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .status-badge {
        background: rgba(96, 165, 250, 0.15) !important;
        color: #2b6cb0 !important;
        border: 1px solid rgba(96, 165, 250, 0.15) !important;
    }
    .btn {
        color: #2d3748 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .btn-secondary {
        background: rgba(0,0,0,0.04) !important;
        border-color: rgba(0,0,0,0.08) !important;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15) !important;
        border-color: rgba(52, 211, 153, 0.2) !important;
        color: #38a169 !important;
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15) !important;
        border-color: rgba(251, 191, 36, 0.2) !important;
        color: #d69e2e !important;
    }
    .auto-indicator {
        color: #718096 !important;
    }
    .loading-card {
        background: #ffffff !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .loading-text {
        color: #1a202c !important;
    }
    .loading-sub {
        color: #4a5568 !important;
    }
</style>
</head>
<body>

<div class="app-container">

    <header class="slide-header">
        <h1 id="slideTitle">Chargement...</h1>
    </header>

    <main class="slide-body" id="slideBody"></main>

    <!-- LOADING OVERLAY AVEC BOUTON ANNULER -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Préparation vocale...</div>
            <div class="loading-sub" id="loadingSub">Synthèse en cours</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loadingProgressBar"></div>
            </div>
            <div class="loading-timeout" id="loadingTimeout">⏱️ 30 secondes maximum</div>
            <button class="btn-cancel-loading" id="cancelLoadingBtn">
                <span>✕</span> Annuler
            </button>
        </div>
    </div>

    <footer class="slide-footer">
        <div class="footer-top">
            <span class="slide-counter" id="slideCounter">1 / 3</span>
            <span class="status-badge idle" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">Prêt</span>
            </span>
        </div>

        <div class="footer-buttons">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-secondary" id="replayBtn">
                <span class="btn-icon">🔁</span> <span class="btn-label">Relire</span>
            </button>
            <button class="btn btn-play" id="playBtn">
                <span class="btn-icon">▶</span> <span class="btn-label">Play</span>
            </button>
        </div>

        <div class="auto-indicator" id="autoIndicator">⏸ Lecture manuelle</div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // SLIDES
    // ================================================================
    const slides = [
  {
    "titre": "Introduction aux équations avec logarithmes et exponentielles",
    "contenu": "<div style='background: linear-gradient(135deg, #1a365d, #2b6cb0); color: white; padding: 20px; border-radius: 16px;'>\n  <h2 style='color: #fbd38d; font-size: 1.3em; margin-top: 0;'>📐 Résoudre avec ln et exp</h2>\n  <p style='font-size: 1em; line-height: 1.6;'>Les logarithmes et exponentielles apparaissent dans de nombreux domaines :</p>\n  <div style='display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px;'>\n    <div style='background: rgba(255,255,255,0.15); padding: 12px; border-radius: 8px; text-align: center;'>\n      <div style='font-size: 2em;'>💰</div>\n      <p style='margin: 4px 0 0; font-size: 0.9em;'>Économie (intérêts composés)</p>\n    </div>\n    <div style='background: rgba(255,255,255,0.15); padding: 12px; border-radius: 8px; text-align: center;'>\n      <div style='font-size: 2em;'>🧪</div>\n      <p style='margin: 4px 0 0; font-size: 0.9em;'>Chimie (pH, cinétique)</p>\n    </div>\n    <div style='background: rgba(255,255,255,0.15); padding: 12px; border-radius: 8px; text-align: center;'>\n      <div style='font-size: 2em;'>📈</div>\n      <p style='margin: 4px 0 0; font-size: 0.9em;'>Biologie (croissance)</p>\n    </div>\n    <div style='background: rgba(255,255,255,0.15); padding: 12px; border-radius: 8px; text-align: center;'>\n      <div style='font-size: 2em;'>⚡</div>\n      <p style='margin: 4px 0 0; font-size: 0.9em;'>Physique (décroissance radioactive)</p>\n    </div>\n  </div>\n  <p style='margin-top: 12px; font-style: italic; text-align: center;'>\"ln et exp : deux fonctions inverses pour résoudre l'inconnue !\"</p>\n</div>",
    "texteParle": "Bonjour à tous. Aujourd'hui, nous allons apprendre à résoudre des équations, des inéquations et des systèmes qui font intervenir les fonctions logarithme népérien et exponentielle. Ces fonctions sont omniprésentes dans les sciences appliquées : en économie pour les intérêts composés, en chimie pour le pH, en biologie pour la croissance des populations, ou encore en physique pour la décroissance radioactive. Maîtriser leur résolution est donc essentiel.",
    "note": "Les équations avec logarithmes et exponentielles se résolvent en utilisant leurs propriétés et le fait qu'elles sont inverses l'une de l'autre."
  },
  {
    "titre": "Rappel : propriétés des logarithmes",
    "contenu": "<div style='background: #f0f4f8; color: #1e293b; padding: 18px; border-radius: 12px;'>\n  <h3 style='color: #2b6cb0; margin-top: 0;'>📋 Rappel : Propriétés de ln</h3>\n  <div style='background: white; padding: 16px; border-radius: 8px; border-left: 4px solid #2b6cb0;'>\n    <p style='font-weight: 500; color: #2b6cb0;'>Pour tous \\(a > 0\\) et \\(b > 0\\) :</p>\n    <ul style='font-size: 0.95em; line-height: 1.8;'>\n      <li>\\(\\ln(a \\times b) = \\ln(a) + \\ln(b)\\)</li>\n      <li>\\(\\ln(a / b) = \\ln(a) - \\ln(b)\\)</li>\n      <li>\\(\\ln(a^{n}) = n \\times \\ln(a)\\)</li>\n      <li>\\(\\ln(1) = 0\\)</li>\n      <li>\\(\\ln(e) = 1\\)</li>\n      <li>\\(\\ln(\\sqrt{a}) = \\frac{1}{2} \\times \\ln(a)\\)</li>\n    </ul>\n  </div>\n  <div style='display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px;'>\n    <div style='background: #e6fffa; padding: 12px; border-radius: 8px; border: 1px solid #38b2ac;'>\n      <strong style='color: #2c7a7b;'>📝 Exemple 1</strong>\n      <p style='font-size: 0.9em;'>\\(\\ln(8) = \\ln(2^3) = 3\\ln(2)\\)</p>\n    </div>\n    <div style='background: #e6fffa; padding: 12px; border-radius: 8px; border: 1px solid #38b2ac;'>\n      <strong style='color: #2c7a7b;'>📝 Exemple 2</strong>\n      <p style='font-size: 0.9em;'>\\(\\ln(12/5) = \\ln(12) - \\ln(5)\\)</p>\n    </div>\n  </div>\n  <div style='background: #fefcbf; padding: 10px; border-radius: 8px; margin-top: 12px;'>\n    <p style='margin: 0; font-size: 0.95em;'><strong>💡 Rappel :</strong> \\(\\ln(x)\\) est défini uniquement pour \\(x > 0\\).</p>\n  </div>\n</div>",
    "texteParle": "Avant de résoudre des équations, rappelons les propriétés essentielles du logarithme népérien. ln(a × b) = ln(a) + ln(b), ln(a/b) = ln(a) - ln(b), ln(aⁿ) = n × ln(a). Ces propriétés sont très utiles pour simplifier des équations. N'oubliez pas que ln(x) n'est défini que pour x > 0, ce qui est important pour déterminer les domaines de validité des solutions.",
    "note": "Les propriétés de ln (produit, quotient, puissance) sont essentielles pour simplifier les équations."
  },
  {
    "titre": "Rappel : propriétés de l'exponentielle",
    "contenu": "<div style='background: #f0f4f8; color: #1e293b; padding: 18px; border-radius: 12px;'>\n  <h3 style='color: #2b6cb0; margin-top: 0;'>📋 Rappel : Propriétés de exp</h3>\n  <div style='background: white; padding: 16px; border-radius: 8px; border-left: 4px solid #2b6cb0;'>\n    <p style='font-weight: 500; color: #2b6cb0;'>Pour tous \\(a\\) et \\(b\\) réels :</p>\n    <ul style='font-size: 0.95em; line-height: 1.8;'>\n      <li>\\(e^{a} \\times e^{b} = e^{a+b}\\)</li>\n      <li>\\(e^{a} / e^{b} = e^{a-b}\\)</li>\n      <li>\\((e^{a})^{n} = e^{an}\\)</li>\n      <li>\\(e^{0} = 1\\)</li>\n      <li>\\(e^{1} = e\\)</li>\n      <li>\\(e^{-a} = 1 / e^{a}\\)</li>\n    </ul>\n  </div>\n  <div style='display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px;'>\n    <div style='background: #e6fffa; padding: 12px; border-radius: 8px; border: 1px solid #38b2ac;'>\n      <strong style='color: #2c7a7b;'>📝 Exemple 1</strong>\n      <p style='font-size: 0.9em;'>\\(e^{2} \\times e^{3} = e^{5}\\)</p>\n    </div>\n    <div style='background: #e6fffa; padding: 12px; border-radius: 8px; border: 1px solid #38b2ac;'>\n      <strong style='color: #2c7a7b;'>📝 Exemple 2</strong>\n      <p style='font-size: 0.9em;'>\\((e^{x})^{2} = e^{2x}\\)</p>\n    </div>\n  </div>\n  <div style='background: #fefcbf; padding: 10px; border-radius: 8px; margin-top: 12px;'>\n    <p style='margin: 0; font-size: 0.95em;'><strong>💡 Rappel :</strong> \\(e^{x} > 0\\) pour tout \\(x\\) réel.</p>\n  </div>\n</div>",
    "texteParle": "De même, rappelons les propriétés de l'exponentielle. e^(a) × e^(b) = e^(a+b), e^(a)/e^(b) = e^(a-b), (e^(a))^n = e^(an). L'exponentielle est toujours strictement positive, ce qui est important pour les domaines de validité. Ces propriétés permettent de simplifier les expressions et de résoudre les équations.",
    "note": "Les propriétés de exp (produit, quotient, puissance) sont essentielles pour simplifier les équations."
  },
  {
    "titre": "Rappel : ln et exp sont inverses",
    "contenu": "<div style='background: #f0f4f8; color: #1e293b; padding: 18px; border-radius: 12px;'>\n  <h3 style='color: #2b6cb0; margin-top: 0;'>🔄 ln et exp : deux fonctions réciproques</h3>\n  <div style='background: white; padding: 16px; border-radius: 8px; border-left: 4px solid #2b6cb0;'>\n    <p style='font-size: 1em; line-height: 1.6;'>La fonction <strong>logarithme népérien</strong> et la fonction <strong>exponentielle</strong> sont <strong>réciproques</strong> :</p>\n    <div style='text-align: center; font-size: 1.2em; margin: 12px 0;'>\n      <span style='background: #e2e8f0; padding: 8px 16px; border-radius: 8px;'>\\(\\ln(e^{x}) = x\\)</span>\n      <span style='background: #e2e8f0; padding: 8px 16px; border-radius: 8px; margin-left: 8px;'>\\(e^{\\ln(x)} = x\\)</span>\n    </div>\n    <ul style='font-size: 0.95em; line-height: 1.8;'>\n      <li>Pour tout \\(x\\) réel : <strong>\\(\\ln(e^{x}) = x\\)</strong></li>\n      <li>Pour tout \\(x > 0\\) : <strong>\\(e^{\\ln(x)} = x\\)</strong></li>\n      <li>Ce sont les <strong>règles de simplification</strong> fondamentales.</li>\n    </ul>\n  </div>\n  <div style='background: #e6fffa; padding: 14px; border-radius: 8px; margin-top: 12px; border: 1px solid #38b2ac;'>\n    <strong style='color: #2c7a7b;'>📝 Exemple</strong>\n    <p style='font-size: 0.9em;'>Résoudre \\(e^{x} = 5\\)</p>\n    <p style='font-size: 0.9em;'>On applique \\(\\ln\\) des deux côtés : \\(\\ln(e^{x}) = \\ln(5)\\) → \\(x = \\ln(5)\\)</p>\n  </div>\n</div>",
    "texteParle": "La propriété la plus importante est que ln et exp sont des fonctions réciproques : ln(e^x) = x pour tout x réel, et e^(ln(x)) = x pour tout x > 0. C'est cette propriété qui nous permet de résoudre les équations. Par exemple, pour résoudre e^x = 5, on applique ln des deux côtés : ln(e^x) = ln(5), donc x = ln(5). De même, pour résoudre ln(x) = 3, on applique exp : e^(ln(x)) = e^3, donc x = e^3.",
    "note": "ln(e^x) = x et e^(ln(x)) = x : ce sont les règles de simplification fondamentales."
  },
  {
    "titre": "Équations du type e^{u(x)} = e^{v(x)}",
    "contenu": "<div style='background: #f0f4f8; color: #1e293b; padding: 18px; border-radius: 12px;'>\n  <h3 style='color: #2b6cb0; margin-top: 0;'>📝 Équations : \\(e^{u(x)} = e^{v(x)}\\)</h3>\n  <div style='background: white; padding: 16px; border-radius: 8px; border-left: 4px solid #2b6cb0;'>\n    <p style='font-size: 1em; line-height: 1.6;'>L'équation <strong>\\(e^{u(x)} = e^{v(x)}\\)</strong> est équivalente à <strong>\\(u(x) = v(x)\\)</strong>.</p>\n    <p style='font-size: 0.95em; line-height: 1.6;'>Puisque la fonction exp est <strong>strictement croissante</strong> et <strong>injective</strong>.</p>\n  </div>\n  <div style='display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px;'>\n    <div style='background: #e6fffa; padding: 14px; border-radius: 8px; border: 1px solid #38b2ac;'>\n      <strong style='color: #2c7a7b;'>📝 Exemple 1</strong>\n      <p style='font-size: 0.9em;'>\\(e^{2x+1} = e^{5}\\)</p>\n      <p style='font-size: 0.9em;'>\\(2x + 1 = 5\\)</p>\n      <p style='font-size: 0.9em;'>\\(x = 2\\)</p>\n    </div>\n    <div style='background: #e6fffa; padding: 14px; border-radius: 8px; border: 1px solid #38b2ac;'>\n      <strong style='color: #2c7a7b;'>📝 Exemple 2</strong>\n      <p style='font-size: 0.9em;'>\\(e^{x^{2}} = e^{4}\\)</p>\n      <p style='font-size: 0.9em;'>\\(x^{2} = 4\\)</p>\n      <p style='font-size: 0.9em;'>\\(x = 2\\) ou \\(x = -2\\)</p>\n    </div>\n  </div>\n  <div style='background: #fefcbf; padding: 10px; border-radius: 8px; margin-top: 12px;'>\n    <p style='margin: 0; font-size: 0.95em;'><strong>⚠️ Attention :</strong> Ne pas oublier de simplifier avant de conclure.</p>\n  </div>\n</div>",
    "texteParle": "Commençons par les équations de la forme e^(u(x)) = e^(v(x)). Puisque l'exponentielle est une fonction strictement croissante, elle est injective : si deux exponentielles sont égales, alors leurs arguments sont égaux. On peut donc simplifier en écrivant u(x) = v(x). Par exemple, e^(2x+1) = e^5 donne 2x+1 = 5, donc x = 2. C'est une méthode très simple et rapide.",
    "note": "e^(u(x)) = e^(v(x)) ⇔ u(x) = v(x) (car exp est injective)."
  },
  {
    "titre": "Équations du type ln(u(x)) = ln(v(x))",
    "contenu": "<div style='background: #f0f4f8; color: #1e293b; padding: 18px; border-radius: 12px;'>\n  <h3 style='color: #2b6cb0; margin-top: 0;'>📝 Équations : \\(\\ln(u(x)) = \\ln(v(x))\\)</h3>\n  <div style='background: white; padding: 16px; border-radius: 8px; border-left: 4px solid #2b6cb0;'>\n    <p style='font-size: 1em; line-height: 1.6;'>L'équation <strong>\\(\\ln(u(x)) = \\ln(v(x))\\)</strong> est équivalente à :</p>\n    <div style='text-align: center; font-size: 1.1em; margin: 12px 0;'>\n      <span style='background: #e2e8f0; padding: 8px 16px; border-radius: 8px;'>\\(u(x) = v(x)\\) <strong>ET</strong> \\(u(x) > 0, v(x) > 0\\)</span>\n    </div>\n    <p style='font-size: 0.95em; line-height: 1.6;'>Puisque la fonction ln est <strong>strictement croissante</strong> et <strong>injective</strong> sur \\(]0;+\\infty[\\).</p>\n  </div>\n  <div style='display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px;'>\n    <div style='background: #e6fffa; padding: 14px; border-radius: 8px; border: 1px solid #38b2ac;'>\n      <strong style='color: #2c7a7b;'>📝 Exemple 1</strong>\n      <p style='font-size: 0.9em;'>\\(\\ln(2x+1) = \\ln(5)\\)</p>\n      <p style='font-size: 0.9em;'>\\(2x+1 = 5\\) et \\(2x+1 > 0\\)</p>\n      <p style='font-size: 0.9em;'>\\(x = 2\\) (vérifie la condition)</p>\n    </div>\n    <div style='background: #e6fffa; padding: 14px; border-radius: 8px; border: 1px solid #38b2ac;'>\n      <strong style='color: #2c7a7b;'>📝 Exemple 2</strong>\n      <p style='font-size: 0.9em;'>\\(\\ln(x^{2}) = \\ln(4)\\)</p>\n      <p style='font-size: 0.9em;'>\\(x^{2} = 4\\) et \\(x^{2} > 0\\)</p>\n      <p style='font-size: 0.9em;'>\\(x = 2\\) ou \\(x = -2\\) (les deux conviennent)</p>\n    </div>\n  </div>\n  <div style='background: #fefcbf; padding: 10px; border-radius: 8px; margin-top: 12px;'>\n    <p style='margin: 0; font-size: 0.95em;'><strong>⚠️ Attention :</strong> Toujours vérifier les conditions de domaine !</p>\n  </div>\n</div>",
    "texteParle": "Pour les équations de la forme ln(u(x)) = ln(v(x)), on utilise le même principe : puisque ln est injective sur ]0;+∞[, on a u(x) = v(x). Mais attention, il faut aussi vérifier que u(x) > 0 et v(x) > 0 pour que les logarithmes soient définis. Par exemple, ln(2x+1) = ln(5) donne 2x+1 = 5, donc x = 2, et on vérifie que 2x+1 = 5 > 0, la solution est valide.",
    "note": "ln(u(x)) = ln(v(x)) ⇔ u(x) = v(x) ET u(x) > 0, v(x) > 0."
  },
  {
    "titre": "Équations du type e^{u(x)} = a",
    "contenu": "<div style='background: #f0f4f8; color: #1e293b; padding: 18px; border-radius: 12px;'>\n  <h3 style='color: #2b6cb0; margin-top: 0;'>📝 Équations : \\(e^{u(x)} = a\\)</h3>\n  <div style='background: white; padding: 16px; border-radius: 8px; border-left: 4px solid #2b6cb0;'>\n    <p style='font-size: 1em; line-height: 1.6;'>L'équation <strong>\\(e^{u(x)} = a\\)</strong> (avec \\(a > 0\\)) se résout en appliquant ln :</p>\n    <div style='text-align: center; font-size: 1.1em; margin: 12px 0;'>\n      <span style='background: #e2e8f0; padding: 8px 16px; border-radius: 8px;'>\\(u(x) = \\ln(a)\\)</span>\n    </div>\n  </div>\n  <div style='display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px;'>\n    <div style='background: #e6fffa; padding: 14px; border-radius: 8px; border: 1px solid #38b2ac;'>\n      <strong style='color: #2c7a7b;'>📝 Exemple 1</strong>\n      <p style='font-size: 0.9em;'>\\(e^{2x} = 7\\)</p>\n      <p style='font-size: 0.9em;'>\\(2x = \\ln(7)\\)</p>\n      <p style='font-size: 0.9em;'>\\(x = \\ln(7)/2\\)</p>\n    </div>\n    <div style='background: #e6fffa; padding: 14px; border-radius: 8px; border: 1px solid #38b2ac;'>\n      <strong style='color: #2c7a7b;'>📝 Exemple 2</strong>\n      <p style='font-size: 0.9em;'>\\(e^{-3x+1} = 10\\)</p>\n      <p style='font-size: 0.9em;'>\\(-3x+1 = \\ln(10)\\)</p>\n      <p style='font-size: 0.9em;'>\\(x = (1 - \\ln(10))/3\\)</p>\n    </div>\n  </div>\n  <div style='background: #fefcbf; padding: 10px; border-radius: 8px; margin-top: 12px;'>\n    <p style='margin: 0; font-size: 0.95em;'><strong>💡 Rappel :</strong> \\(a\\) doit être strictement positif.</p>\n  </div>\n</div>",
    "texteParle": "Pour les équations de la forme e^(u(x)) = a où a est un réel positif, on applique le logarithme népérien des deux côtés. On obtient u(x) = ln(a). Par exemple, e^(2x) = 7 donne 2x = ln(7), donc x = ln(7)/2. Si l'équation est e^(-3x+1) = 10, alors -3x+1 = ln(10), donc x = (1 - ln(10))/3. Rappelez-vous que a doit être strictement positif car l'exponentielle est toujours positive.",
    "note": "e^(u(x)) = a (a > 0) ⇔ u(x) = ln(a)."
  },
  {
    "titre": "Équations du type ln(u(x)) = a",
    "contenu": "<div style='background: #f0f4f8; color: #1e293b; padding: 18px; border-radius: 12px;'>\n  <h3 style='color: #2b6cb0; margin-top: 0;'>📝 Équations : \\(\\ln(u(x)) = a\\)</h3>\n  <div style='background: white; padding: 16px; border-radius: 8px; border-left: 4px solid #2b6cb0;'>\n    <p style='font-size: 1em; line-height: 1.6;'>L'équation <strong>\\(\\ln(u(x)) = a\\)</strong> se résout en appliquant exp :</p>\n    <div style='text-align: center; font-size: 1.1em; margin: 12px 0;'>\n      <span style='background: #e2e8f0; padding: 8px 16px; border-radius: 8px;'>\\(u(x) = e^{a}\\) <strong>ET</strong> \\(u(x) > 0\\)</span>\n    </div>\n  </div>\n  <div style='display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px;'>\n    <div style='background: #e6fffa; padding: 14px; border-radius: 8px; border: 1px solid #38b2ac;'>\n      <strong style='color: #2c7a7b;'>📝 Exemple 1</strong>\n      <p style='font-size: 0.9em;'>\\(\\ln(2x+3) = 4\\)</p>\n      <p style='font-size: 0.9em;'>\\(2x+3 = e^{4}\\)</p>\n      <p style='font-size: 0.9em;'>\\(x = (e^{4} - 3)/2\\)</p>\n    </div>\n    <div style='background: #e6fffa; padding: 14px; border-radius: 8px; border: 1px solid #38b2ac;'>\n      <strong style='color: #2c7a7b;'>📝 Exemple 2</strong>\n      <p style='font-size: 0.9em;'>\\(\\ln(x^{2}) = 2\\)</p>\n      <p style='font-size: 0.9em;'>\\(x^{2} = e^{2}\\)</p>\n      <p style='font-size: 0.9em;'>\\(x = e\\) ou \\(x = -e\\) (les deux conviennent car \\(x^{2} > 0\\))</p>\n    </div>\n  </div>\n  <div style='background: #fefcbf; padding: 10px; border-radius: 8px; margin-top: 12px;'>\n    <p style='margin: 0; font-size: 0.95em;'><strong>⚠️ Attention :</strong> Vérifier que \\(u(x) > 0\\).</p>\n  </div>\n</div>",
    "texteParle": "Pour les équations de la forme ln(u(x)) = a, on applique l'exponentielle des deux côtés. On obtient u(x) = e^a, avec la condition u(x) > 0. Par exemple, ln(2x+3) = 4 donne 2x+3 = e^4, donc x = (e^4 - 3)/2. Pour ln(x²) = 2, on a x² = e², donc x = e ou x = -e, et les deux solutions conviennent car x² > 0. N'oubliez pas de toujours vérifier les conditions de domaine.",
    "note": "ln(u(x)) = a ⇔ u(x) = e^a ET u(x) > 0."
  },
  {
    "titre": "Équations du type a^{u(x)} = b",
    "contenu": "<div style='background: #f0f4f8; color: #1e293b; padding: 18px; border-radius: 12px;'>\n  <h3 style='color: #2b6cb0; margin-top: 0;'>📝 Équations : \\(a^{u(x)} = b\\)</h3>\n  <div style='background: white; padding: 16px; border-radius: 8px; border-left: 4px solid #2b6cb0;'>\n    <p style='font-size: 1em; line-height: 1.6;'>L'équation <strong>\\(a^{u(x)} = b\\)</strong> (avec \\(a > 0, a \\neq 1, b > 0\\)) se résout en utilisant ln :</p>\n    <div style='text-align: center; font-size: 1.1em; margin: 12px 0;'>\n      <span style='background: #e2e8f0; padding: 8px 16px; border-radius: 8px;'>\\(a^{u(x)} = b \\iff u(x) \\times \\ln(a) = \\ln(b)\\)</span>\n    </div>\n    <p style='font-size: 0.95em; line-height: 1.6;'>On utilise la propriété : <strong>\\(\\ln(a^{u}) = u \\times \\ln(a)\\)</strong></p>\n  </div>\n  <div style='display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px;'>\n    <div style='background: #e6fffa; padding: 14px; border-radius: 8px; border: 1px solid #38b2ac;'>\n      <strong style='color: #2c7a7b;'>📝 Exemple 1</strong>\n      <p style='font-size: 0.9em;'>\\(2^{x} = 8\\)</p>\n      <p style='font-size: 0.9em;'>\\(x \\times \\ln(2) = \\ln(8)\\)</p>\n      <p style='font-size: 0.9em;'>\\(x = \\ln(8)/\\ln(2) = 3\\)</p>\n    </div>\n    <div style='background: #e6fffa; padding: 14px; border-radius: 8px; border: 1px solid #38b2ac;'>\n      <strong style='color: #2c7a7b;'>📝 Exemple 2</strong>\n      <p style='font-size: 0.9em;'>\\(3^{2x+1} = 27\\)</p>\n      <p style='font-size: 0.9em;'>\\((2x+1) \\times \\ln(3) = \\ln(27)\\)</p>\n      <p style='font-size: 0.9em;'>\\(2x+1 = 3 \\rightarrow x = 1\\)</p>\n    </div>\n  </div>\n</div>",
    "texteParle": "Pour les équations de la forme a^(u(x)) = b, avec a > 0, a ≠ 1 et b > 0, on utilise la propriété ln(a^u) = u × ln(a). On applique ln des deux côtés : ln(a^(u(x))) = ln(b), donc u(x) × ln(a) = ln(b), et on isole u(x). Par exemple, 2^x = 8 donne x × ln(2) = ln(8), donc x = ln(8)/ln(2) = 3. Cette méthode est très utile quand on ne peut pas exprimer b comme une puissance de a.",
    "note": "a^(u(x)) = b (a > 0, b > 0) ⇔ u(x) × ln(a) = ln(b)."
  },
  {
    "titre": "Inéquations avec ln et exp",
    "contenu": "<div style='background: #f0f4f8; color: #1e293b; padding: 18px; border-radius: 12px;'>\n  <h3 style='color: #2b6cb0; margin-top: 0;'>⚖️ Inéquations avec ln et exp</h3>\n  <div style='background: white; padding: 16px; border-radius: 8px; border-left: 4px solid #2b6cb0;'>\n    <p style='font-size: 1em; line-height: 1.6;'>Les fonctions ln et exp sont <strong>strictement croissantes</strong>, donc :</p>\n    <div style='display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 12px 0;'>\n      <div style='background: #e6fffa; padding: 12px; border-radius: 8px; border: 1px solid #38b2ac;'>\n        <strong style='color: #2c7a7b;'>Avec exp</strong>\n        <p style='font-size: 0.9em;'>\\(e^{u} < e^{v} \\iff u < v\\)</p>\n        <p style='font-size: 0.9em;'>\\(e^{u} > e^{v} \\iff u > v\\)</p>\n      </div>\n      <div style='background: #e6fffa; padding: 12px; border-radius: 8px; border: 1px solid #38b2ac;'>\n        <strong style='color: #2c7a7b;'>Avec ln</strong>\n        <p style='font-size: 0.9em;'>\\(\\ln(u) < \\ln(v) \\iff u < v\\) ET \\(u > 0\\)</p>\n        <p style='font-size: 0.9em;'>\\(\\ln(u) > \\ln(v) \\iff u > v\\) ET \\(u > 0\\)</p>\n      </div>\n    </div>\n  </div>\n  <div style='display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px;'>\n    <div style='background: #e6fffa; padding: 14px; border-radius: 8px; border: 1px solid #38b2ac;'>\n      <strong style='color: #2c7a7b;'>📝 Exemple 1</strong>\n      <p style='font-size: 0.9em;'>\\(e^{2x} < e^{5}\\)</p>\n      <p style='font-size: 0.9em;'>\\(2x < 5 \\rightarrow x < 5/2\\)</p>\n    </div>\n    <div style='background: #e6fffa; padding: 14px; border-radius: 8px; border: 1px solid #38b2ac;'>\n      <strong style='color: #2c7a7b;'>📝 Exemple 2</strong>\n      <p style='font-size: 0.9em;'>\\(\\ln(x) < 3\\)</p>\n      <p style='font-size: 0.9em;'>\\(x < e^{3}\\) ET \\(x > 0\\)</p>\n      <p style='font-size: 0.9em;'>\\(x \\in ]0; e^{3}[\\)</p>\n    </div>\n  </div>\n</div>",
    "texteParle": "Pour les inéquations, on utilise le fait que ln et exp sont strictement croissantes. Pour une inéquation avec exp, on peut simplifier directement : e^(u) < e^(v) ⇔ u < v. Pour une inéquation avec ln, il faut faire attention au domaine : ln(u) < ln(v) ⇔ u < v ET u > 0. Par exemple, e^(2x) < e^5 donne 2x < 5, donc x < 5/2. L'inéquation ln(x) < 3 donne x < e^3 ET x > 0, donc x ∈ ]0; e³[.",
    "note": "Pour les inéquations : exp est croissante, donc on simplifie ; ln est croissante, mais attention au domaine."
  },
  {
    "titre": "Systèmes d'équations",

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentIndex = 0;
    let isSpeaking = false;
    let isPaused = false;
    let currentUtterance = null;
    let isLoading = false;
    let loadingTimeout = null;
    let isTransitioning = false;
    let speechSupported = true;
    let userInteracted = false;
    let isPlaying = false;
    let loadingCancelled = false;

    const total = slides.length;
    const synth = window.speechSynthesis;

    // Références jQuery
    const $title = $('#slideTitle');
    const $body = $('#slideBody');
    const $counter = $('#slideCounter');
    const $statusText = $('#statusText');
    const $statusBadge = $('#statusBadge');
    const $loading = $('#loadingOverlay');
    const $loadingText = $('#loadingText');
    const $loadingSub = $('#loadingSub');
    const $loadingTimeout = $('#loadingTimeout');
    const $loadingProgressBar = $('#loadingProgressBar');
    const $autoIndicator = $('#autoIndicator');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $replay = $('#replayBtn');
    const $play = $('#playBtn');
    const $cancelLoading = $('#cancelLoadingBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function setStatus(text, type) {
        $statusText.text(text);
        $statusBadge.removeClass('idle speaking error paused waiting loading');
        if (type === 'speaking') $statusBadge.addClass('speaking');
        else if (type === 'error') $statusBadge.addClass('error');
        else if (type === 'paused') $statusBadge.addClass('paused');
        else if (type === 'waiting') $statusBadge.addClass('waiting');
        else if (type === 'loading') $statusBadge.addClass('loading');
        else $statusBadge.addClass('idle');
    }

    function updatePlayButton() {
        if (isPlaying) {
            $play.addClass('playing');
            $play.find('.btn-icon').text('⏸');
            $play.find('.btn-label').text('Pause');
        } else {
            $play.removeClass('playing');
            $play.find('.btn-icon').text('▶');
            $play.find('.btn-label').text('Play');
        }
    }

    function showLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        
        loadingCancelled = false;
        isLoading = true;
        
        // Réinitialiser la barre de progression
        $loadingProgressBar.css('animation', 'none');
        $loadingProgressBar.css('width', '0%');
        // Forcer un reflow
        $loadingProgressBar[0].offsetHeight;
        $loadingProgressBar.css('animation', 'loadingProgress 30s ease-out forwards');
        
        $loadingText.text('Préparation vocale...');
        $loadingSub.text('Synthèse en cours');
        $loadingTimeout.text('⏱️ 30 secondes maximum');
        $loading.fadeIn(300);
        setStatus("⏳ Chargement...", 'loading');
        
        // 🔥 TIMEOUT DE 30 SECONDES
        loadingTimeout = setTimeout(() => {
            if (isLoading && !loadingCancelled) {
                hideLoading();
                setStatus("⚠️ Délai dépassé (30s)", 'error');
                isPlaying = false;
                updatePlayButton();
                $loadingSub.text('La synthèse vocale a pris trop de temps');
                $loadingTimeout.text('❌ Délai dépassé');
            }
        }, 30000);
    }

    function hideLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        isLoading = false;
        loadingCancelled = false;
        $loading.fadeOut(300);
        // Ne pas changer le statut si on est en train de parler
        if (!isSpeaking && !isPlaying) {
            setStatus("⏸ Lecture arrêtée", 'paused');
        }
    }

    function cancelLoading() {
        loadingCancelled = true;
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        hideLoading();
        stopSpeaking();
        setStatus("⏸ Annulé", 'paused');
        isPlaying = false;
        updatePlayButton();
        $loadingText.text('Annulé par l\'utilisateur');
        $loadingSub.text('Vous pouvez réessayer');
        $loadingTimeout.text('✕ Annulation');
    }

    // Arrêter la parole proprement
    function stopSpeaking() {
        try {
            if (synth && (synth.speaking || synth.pending)) {
                synth.cancel();
            }
        } catch(e) {
            console.warn('Erreur stopSpeaking:', e);
        }
        if (currentUtterance) {
            try {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance.onstart = null;
            } catch(e) {}
            currentUtterance = null;
        }
        isSpeaking = false;
        isPlaying = false;
        updatePlayButton();
    }

    // Mettre en pause la parole
    function pauseSpeaking() {
        try {
            if (synth && synth.speaking) {
                synth.pause();
                isPaused = true;
                isPlaying = false;
                setStatus("⏸ Lecture en pause", 'paused');
                updatePlayButton();
            }
        } catch(e) {
            console.warn('Erreur pauseSpeaking:', e);
            stopSpeaking();
        }
    }

    // Reprendre la parole
    function resumeSpeaking() {
        try {
            if (synth && synth.paused) {
                synth.resume();
                isPaused = false;
                isPlaying = true;
                setStatus("🔊 Lecture en cours", 'speaking');
                updatePlayButton();
            } else if (!isSpeaking && !synth.speaking && !synth.pending) {
                speakSlide(currentIndex);
            }
        } catch(e) {
            console.warn('Erreur resumeSpeaking:', e);
            speakSlide(currentIndex);
        }
    }

    function renderSlide(index) {
        const slide = slides[index];
        $title.text(slide.titre);

        let html = '';
        html += `<div class="content-card">${slide.contenu}</div>`;
        if (slide.note) {
            html += `<div class="note-box">${slide.note}</div>`;
        }
        $body.html(html);
        $counter.text(`${index+1} / ${total}`);

        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
        }
    }

    // ================================================================
    // LECTURE VOCALE
    // ================================================================
    function speakSlide(index) {
        return new Promise((resolve) => {
            const slide = slides[index];
            const text = slide.texteParle;
            
            if (!text || text.trim() === '' || !speechSupported) {
                resolve();
                return;
            }

            if (!window.speechSynthesis) {
                setStatus("❌ Synthèse vocale non supportée", 'error');
                speechSupported = false;
                resolve();
                return;
            }

            // Arrêter toute lecture en cours
            stopSpeaking();
            
            // Réinitialiser l'état de pause
            isPaused = false;
            
            showLoading();
            setStatus("Initialisation...", 'loading');

            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.92;
                utterance.pitch = 1.05;
                utterance.volume = 1;

                let isFinished = false;
                let errorHandled = false;

                utterance.onstart = function() {
                    if (loadingCancelled) {
                        stopSpeaking();
                        resolve();
                        return;
                    }
                    hideLoading();
                    isSpeaking = true;
                    isPlaying = true;
                    isPaused = false;
                    setStatus("🔊 Lecture en cours", 'speaking');
                    updatePlayButton();
                };

                utterance.onend = function() {
                    if (isFinished) return;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    setStatus("✅ Terminé", 'idle');
                    hideLoading();
                    updatePlayButton();
                    resolve();
                };

                utterance.onerror = function(e) {
                    if (isFinished || errorHandled) return;
                    errorHandled = true;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    hideLoading();
                    updatePlayButton();
                    
                    if (e.error === 'not-allowed') {
                        setStatus("⚠️ Permission refusée", 'error');
                    } else if (e.error === 'synthesis-unavailable') {
                        setStatus("⚠️ Synthèse indisponible", 'error');
                    } else if (e.error === 'canceled') {
                        setStatus("⏸ Annulé", 'paused');
                    } else {
                        setStatus("❌ Erreur audio: " + (e.error || 'inconnue'), 'error');
                    }
                    
                    resolve();
                };

                // Gestion du chargement des voix
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = function() {
                        if (!loadingCancelled) {
                            try {
                                synth.speak(utterance);
                            } catch(err) {
                                // Silencieux
                            }
                        }
                        synth.onvoiceschanged = null;
                    };
                }

                currentUtterance = utterance;
                
                if (!loadingCancelled) {
                    try {
                        synth.speak(utterance);
                    } catch(err) {
                        setTimeout(() => {
                            if (!loadingCancelled) {
                                try {
                                    synth.speak(utterance);
                                } catch(e) {
                                    setStatus("❌ Erreur de lecture", 'error');
                                    isPlaying = false;
                                    updatePlayButton();
                                    hideLoading();
                                    resolve();
                                }
                            } else {
                                resolve();
                            }
                        }, 100);
                    }
                } else {
                    resolve();
                }

            } catch(err) {
                hideLoading();
                setStatus("❌ Erreur générale", 'error');
                isPlaying = false;
                updatePlayButton();
                console.error('Erreur speakSlide:', err);
                resolve();
            }
        });
    }

    // ================================================================
    // NAVIGATION
    // ================================================================
    async function goToSlide(index) {
        if (isTransitioning) return;
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        
        // Si on est en train de lire, on met en pause avant de naviguer
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        // Arrêter complètement la lecture
        stopSpeaking();
        
        await new Promise(r => setTimeout(r, 50));
        
        if (index === currentIndex) {
            setStatus("📄 Slide actuel", 'idle');
            return;
        }

        isTransitioning = true;
        currentIndex = index;
        renderSlide(index);
        
        // Réinitialiser l'état de lecture
        isPlaying = false;
        updatePlayButton();
        setStatus("⏸ Lecture arrêtée", 'paused');

        await new Promise(r => setTimeout(r, 150));
        isTransitioning = false;
    }

    async function goToNext() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex + 1 < total) {
            await goToSlide(currentIndex + 1);
        } else {
            setStatus("🏁 Dernier slide", 'idle');
        }
    }

    async function goToPrev() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex - 1 >= 0) {
            await goToSlide(currentIndex - 1);
        } else {
            setStatus("🔁 Premier slide", 'idle');
        }
    }

    // ================================================================
    // GESTION PLAY/PAUSE
    // ================================================================
    function togglePlay() {
        if (!userInteracted) {
            userInteracted = true;
        }

        // Si le chargement est en cours, on l'annule
        if (isLoading) {
            cancelLoading();
            return;
        }

        // Si le synthétiseur est en pause, on reprend
        if (synth && synth.paused) {
            resumeSpeaking();
            return;
        }

        // Si la lecture est en cours, on met en pause
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
            return;
        }

        // Sinon, on démarre la lecture du slide courant
        if (!isSpeaking && !isPlaying) {
            stopSpeaking();
            speakSlide(currentIndex);
        }
    }

    // ================================================================
    // INIT
    // ================================================================
    async function init() {
        // Vérifier la compatibilité
        if (!window.speechSynthesis) {
            setStatus("❌ Synthèse vocale non supportée", 'error');
            speechSupported = false;
        }

        // Précharger les voix
        try {
            if (synth.getVoices) {
                synth.getVoices();
                setTimeout(() => {
                    try {
                        synth.getVoices();
                    } catch(e) {}
                }, 200);
            }
        } catch(e) {
            console.warn('Erreur chargement voix:', e);
        }

        // Afficher le premier slide
        renderSlide(0);
        $counter.text(`1 / ${total}`);
        
        // État initial
        setStatus("⏸ Appuie sur Play", 'paused');
        updatePlayButton();
        $autoIndicator.text('⏸ Lecture manuelle');

        // ================================================================
        // ÉVÉNEMENTS
        // ================================================================
        
        // Bouton Play/Pause
        $play.on('click', function() {
            togglePlay();
        });

        // Bouton Annuler le chargement
        $cancelLoading.on('click', function() {
            cancelLoading();
        });

        // Navigation
        $prev.on('click', function() {
            // Si chargement en cours, on annule
            if (isLoading) cancelLoading();
            goToPrev();
        });

        $next.on('click', function() {
            if (isLoading) cancelLoading();
            goToNext();
        });

        // Replay - relire le slide courant
        $replay.on('click', function() {
            if (isLoading) cancelLoading();
            stopSpeaking();
            setTimeout(() => {
                speakSlide(currentIndex);
            }, 100);
        });

        // Support du clavier (espace pour play/pause)
        $(document).on('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });

        // Nettoyage
        $(window).on('beforeunload', function() {
            try {
                if (synth.speaking) synth.cancel();
            } catch(e) {}
            hideLoading();
        });

        // Gérer les cas où la synthèse se termine de manière inattendue
        setInterval(() => {
            if (isPlaying && !synth.speaking && !synth.pending && !isPaused && !isLoading) {
                isPlaying = false;
                updatePlayButton();
                setStatus("⏸ Lecture arrêtée", 'paused');
            }
        }, 1000);
    }

    init();
});

                note.style.color = '#2c3e50';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.05)';
                block.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#2d3748';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
                statusBadge.style.color = '#2b6cb0';
            }
            if (slideCounter) {
                slideCounter.style.color = '#4a5568';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#718096';
            }
            if (themeBtn) {
                themeBtn.textContent = '🌓';
                themeBtn.title = 'Passer en mode nuit';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#2c3e50';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#2d3748';
                }
            });
        }
    }

    // Initialiser en mode jour
    document.addEventListener('DOMContentLoaded', function() {
        // Appliquer le mode jour par défaut
        const body = document.body;
        body.style.background = '#f0f4f8';
        body.style.color = '#1a202c';
        
        const appContainer = document.querySelector('.app-container');
        if (appContainer) {
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
        }
        
        const header = document.querySelector('.slide-header');
        if (header) {
            header.style.background = 'rgba(255, 255, 255, 0.85)';
        }
        
        const footer = document.querySelector('.slide-footer');
        if (footer) {
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
        }
        
        document.querySelectorAll('.content-card').forEach(card => {
            card.style.background = 'rgba(255,255,255,0.8)';
            card.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.note-box').forEach(note => {
            note.style.background = 'rgba(96, 165, 250, 0.12)';
            note.style.color = '#2c3e50';
        });
        
        document.querySelectorAll('.math-block').forEach(block => {
            block.style.background = 'rgba(0,0,0,0.05)';
            block.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.btn').forEach(btn => {
            btn.style.color = '#2d3748';
        });
        
        const statusBadge = document.querySelector('.status-badge');
        if (statusBadge) {
            statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
            statusBadge.style.color = '#2b6cb0';
        }
        
        const slideCounter = document.querySelector('.slide-counter');
        if (slideCounter) {
            slideCounter.style.color = '#4a5568';
        }
        
        const autoIndicator = document.querySelector('.auto-indicator');
        if (autoIndicator) {
            autoIndicator.style.color = '#718096';
        }
        
        document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
            if (!el.closest('.note-box')) {
                el.style.color = '#2c3e50';
            }
        });
        
        document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
            if (!el.closest('.note-box') && !el.closest('.math-block')) {
                el.style.color = '#2d3748';
            }
        });
        
        const themeBtn = document.getElementById('themeToggle');
        if (themeBtn) {
            themeBtn.textContent = '🌓';
            themeBtn.title = 'Passer en mode nuit';
        }
    });
</script>
</body>
</html>
