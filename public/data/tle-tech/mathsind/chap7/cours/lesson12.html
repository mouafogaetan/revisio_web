<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Présentation mobile</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' },
            options: { skipHtmlTypes: 'script' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 500px;
        margin: 0 auto;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    .slide-header {
        flex-shrink: 0;
        padding: 18px 16px 10px 16px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        z-index: 10;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .slide-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
    }

    .content-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 18px 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        flex-shrink: 0;
    }

    .content-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .content-card li {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        line-height: 1.5;
    }

    .content-card li:last-child {
        border-bottom: none;
    }

    .bullet-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
    }

    .math-block {
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        overflow-x: auto;
        flex-shrink: 0;
        margin: 4px 0;
    }

    .math-block .math {
        font-size: 1.2rem;
        color: #e2e8f0;
    }

    .note-box {
        background: rgba(96, 165, 250, 0.08);
        border-left: 4px solid #60a5fa;
        padding: 12px 16px;
        border-radius: 12px;
        font-style: italic;
        font-size: 0.9rem;
        color: #cbd5e1;
        flex-shrink: 0;
    }

    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        border-radius: 0;
        flex-direction: column;
    }

    .loading-card {
        background: #1e293b;
        padding: 32px 28px;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #334155;
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px auto;
    }

    .loading-text {
        font-weight: 600;
        font-size: 1.1rem;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    .loading-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 16px;
    }
    .loading-progress {
        height: 3px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        animation: loadingProgress 30s ease-out forwards;
    }

    .loading-timeout {
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 12px;
    }

    .btn-cancel-loading {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 40px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #f87171;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }

    .btn-cancel-loading:active {
        transform: scale(0.94);
        background: rgba(239, 68, 68, 0.25);
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
    }

    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .slide-counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255,255,255,0.05);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(255,255,255,0.04);
    }

    .status-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 30px;
        background: rgba(96, 165, 250, 0.12);
        color: #93bbfc;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
    }

    .status-badge .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: pulse-dot 1.2s infinite;
        flex-shrink: 0;
    }

    .status-badge.idle .dot {
        animation: none;
        background: #64748b;
    }
    .status-badge.speaking .dot {
        background: #34d399;
        animation: pulse-dot 0.8s infinite;
    }
    .status-badge.error .dot {
        background: #f87171;
        animation: none;
    }
    .status-badge.paused .dot {
        animation: none;
        background: #fbbf24;
    }
    .status-badge.waiting .dot {
        animation: pulse-dot 1.5s infinite;
        background: #fbbf24;
    }
    .status-badge.loading .dot {
        animation: pulse-dot 0.5s infinite;
        background: #60a5fa;
    }

    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.7); }
    }

    .footer-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(255,255,255,0.1);
    }

    .btn-secondary {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-play {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
        min-width: 80px;
        justify-content: center;
    }
    .btn-play:active {
        background: rgba(52, 211, 153, 0.25);
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
    }

    .auto-indicator {
        font-size: 0.65rem;
        color: #64748b;
        text-align: center;
        letter-spacing: 0.3px;
        padding: 2px 0;
    }

    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.2rem;
        }
        .content-card li {
            font-size: 0.9rem;
            padding: 8px 0;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .btn-play {
            min-width: 60px;
        }
        .footer-buttons {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
        .loading-card {
            padding: 20px 16px;
        }
        .math-block .math {
            font-size: 1rem;
        }
    }

    @media (min-width: 600px) {
        .app-container {
            max-width: 480px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
        .loading-overlay {
            border-radius: 32px;
        }
    }

    /* Mode jour (par défaut) */
    html, body {
        background: #f0f4f8 !important;
        color: #1a202c !important;
    }
    .app-container {
        background: linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%) !important;
    }
    .slide-header {
        background: rgba(255, 255, 255, 0.85) !important;
        border-bottom: 1px solid rgba(0,0,0,0.08) !important;
    }
    .slide-header h1 {
        background: linear-gradient(135deg, #2b6cb0, #6b46c1) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        background-clip: text !important;
    }
    .slide-footer {
        background: rgba(255, 255, 255, 0.9) !important;
        border-top: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card {
        background: rgba(255,255,255,0.8) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card li {
        border-bottom: 1px solid rgba(0,0,0,0.05) !important;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.12) !important;
        border-left: 4px solid #4299e1 !important;
        color: #2c3e50 !important;
    }
    .math-block {
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .math-block .math {
        color: #2d3748 !important;
    }
    .slide-counter {
        color: #4a5568 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .status-badge {
        background: rgba(96, 165, 250, 0.15) !important;
        color: #2b6cb0 !important;
        border: 1px solid rgba(96, 165, 250, 0.15) !important;
    }
    .btn {
        color: #2d3748 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .btn-secondary {
        background: rgba(0,0,0,0.04) !important;
        border-color: rgba(0,0,0,0.08) !important;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15) !important;
        border-color: rgba(52, 211, 153, 0.2) !important;
        color: #38a169 !important;
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15) !important;
        border-color: rgba(251, 191, 36, 0.2) !important;
        color: #d69e2e !important;
    }
    .auto-indicator {
        color: #718096 !important;
    }
    .loading-card {
        background: #ffffff !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .loading-text {
        color: #1a202c !important;
    }
    .loading-sub {
        color: #4a5568 !important;
    }
</style>
</head>
<body>

<div class="app-container">

    <header class="slide-header">
        <h1 id="slideTitle">Chargement...</h1>
    </header>

    <main class="slide-body" id="slideBody"></main>

    <!-- LOADING OVERLAY AVEC BOUTON ANNULER -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Préparation vocale...</div>
            <div class="loading-sub" id="loadingSub">Synthèse en cours</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loadingProgressBar"></div>
            </div>
            <div class="loading-timeout" id="loadingTimeout">⏱️ 30 secondes maximum</div>
            <button class="btn-cancel-loading" id="cancelLoadingBtn">
                <span>✕</span> Annuler
            </button>
        </div>
    </div>

    <footer class="slide-footer">
        <div class="footer-top">
            <span class="slide-counter" id="slideCounter">1 / 3</span>
            <span class="status-badge idle" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">Prêt</span>
            </span>
        </div>

        <div class="footer-buttons">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-secondary" id="replayBtn">
                <span class="btn-icon">🔁</span> <span class="btn-label">Relire</span>
            </button>
            <button class="btn btn-play" id="playBtn">
                <span class="btn-icon">▶</span> <span class="btn-label">Play</span>
            </button>
        </div>

        <div class="auto-indicator" id="autoIndicator">⏸ Lecture manuelle</div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // SLIDES
    // ================================================================
    const slides = [
  {
    "titre": "Introduction aux suites numériques",
    "contenu": "<div style='background: linear-gradient(135deg, #1a365d, #2b6cb0); color: white; padding: 20px; border-radius: 16px;'>\n  <h2 style='color: #fbd38d; font-size: 1.3em; margin-top: 0;'>🔢 Les suites numériques : des modèles discrets</h2>\n  <p style='font-size: 1em; line-height: 1.6;'>Les suites apparaissent dans de nombreux domaines :</p>\n  <div style='display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px;'>\n    <div style='background: rgba(255,255,255,0.15); padding: 12px; border-radius: 8px; text-align: center;'>\n      <div style='font-size: 2em;'>💰</div>\n      <p style='margin: 4px 0 0; font-size: 0.9em;'>Économie (intérêts, amortissements)</p>\n    </div>\n    <div style='background: rgba(255,255,255,0.15); padding: 12px; border-radius: 8px; text-align: center;'>\n      <div style='font-size: 2em;'>🧬</div>\n      <p style='margin: 4px 0 0; font-size: 0.9em;'>Biologie (populations)</p>\n    </div>\n    <div style='background: rgba(255,255,255,0.15); padding: 12px; border-radius: 8px; text-align: center;'>\n      <div style='font-size: 2em;'>⚡</div>\n      <p style='margin: 4px 0 0; font-size: 0.9em;'>Physique (échantillonnage)</p>\n    </div>\n    <div style='background: rgba(255,255,255,0.15); padding: 12px; border-radius: 8px; text-align: center;'>\n      <div style='font-size: 2em;'>📊</div>\n      <p style='margin: 4px 0 0; font-size: 0.9em;'>Informatique (algorithmes)</p>\n    </div>\n  </div>\n  <p style='margin-top: 12px; font-style: italic; text-align: center;'>\"Une suite : une liste ordonnée de nombres, chacun ayant sa place !\"</p>\n</div>",
    "texteParle": "Bonjour à tous. Aujourd'hui, nous allons étudier les suites numériques. Une suite est une liste ordonnée de nombres, indexés par des entiers. Les suites sont très utilisées dans les sciences appliquées : en économie pour modéliser des flux financiers, en biologie pour l'évolution des populations, en physique pour l'échantillonnage de signaux, ou en informatique pour les algorithmes. Nous allons nous concentrer sur deux types fondamentaux : les suites arithmétiques et les suites géométriques.",
    "note": "Une suite numérique est une fonction définie sur l'ensemble des entiers naturels ou une partie de celui-ci."
  },
  {
    "titre": "Définition d'une suite",
    "contenu": "<div style='background: #f0f4f8; color: #1e293b; padding: 18px; border-radius: 12px;'>\n  <h3 style='color: #2b6cb0; margin-top: 0;'>📖 Qu'est-ce qu'une suite ?</h3>\n  <div style='background: white; padding: 16px; border-radius: 8px; border-left: 4px solid #2b6cb0;'>\n    <p style='font-size: 1em; line-height: 1.6;'>Une <strong>suite numérique</strong> est une fonction définie sur $\\mathbb{N}$ (ou une partie de $\\mathbb{N}$) à valeurs dans $\\mathbb{R}$.</p>\n    <p style='font-size: 1em; line-height: 1.6; margin-top: 8px;'>On note une suite :</p>\n    <div style='text-align: center; font-size: 1.2em; margin: 12px 0;'>\n      <span style='background: #e2e8f0; padding: 8px 24px; border-radius: 8px;'>$(u_n)$ ou $u_n = f(n)$</span>\n    </div>\n    <ul style='font-size: 0.95em; line-height: 1.8;'>\n      <li>$u_n$ est le <strong>terme général</strong> de la suite.</li>\n      <li>$n$ est l'<strong>indice</strong> ou le <strong>rang</strong> du terme.</li>\n      <li>On peut définir une suite par :\n        <ul>\n          <li>une <strong>formule explicite</strong> : $u_n = f(n)$</li>\n          <li>une <strong>relation de récurrence</strong> : $u_{n+1} = f(u_n)$</li>\n        </ul>\n      </li>\n    </ul>\n  </div>\n  <div style='display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px;'>\n    <div style='background: #e6fffa; padding: 12px; border-radius: 8px; border: 1px solid #38b2ac;'>\n      <strong style='color: #2c7a7b;'>📝 Formule explicite</strong>\n      <p style='font-size: 0.9em;'>$u_n = 2n + 1$</p>\n      <p style='font-size: 0.85em;'>$u_0 = 1, u_1 = 3, u_2 = 5, ...$</p>\n    </div>\n    <div style='background: #e6fffa; padding: 12px; border-radius: 8px; border: 1px solid #38b2ac;'>\n      <strong style='color: #2c7a7b;'>📝 Relation de récurrence</strong>\n      <p style='font-size: 0.9em;'>$u_{n+1} = 2u_n + 1$ avec $u_0 = 0$</p>\n      <p style='font-size: 0.85em;'>$u_0 = 0, u_1 = 1, u_2 = 3, u_3 = 7, ...$</p>\n    </div>\n  </div>\n</div>",
    "texteParle": "Une suite numérique est une fonction définie sur les entiers naturels. On note une suite $(u_n)$, où $u_n$ est le terme de rang $n$. Il y a deux façons de définir une suite : par une formule explicite $u_n = f(n)$, qui permet de calculer directement n'importe quel terme ; ou par une relation de récurrence $u_{n+1} = f(u_n)$, qui permet de calculer un terme à partir du précédent. Nous allons voir ces deux types.",
    "note": "Une suite peut être définie par une formule explicite $u_n = f(n)$ ou par une relation de récurrence $u_{n+1} = f(u_n)$."
  },
  {
    "titre": "Les suites arithmétiques",
    "contenu": "<div style='background: #f0f4f8; color: #1e293b; padding: 18px; border-radius: 12px;'>\n  <h3 style='color: #2b6cb0; margin-top: 0;'>➕ Les suites arithmétiques</h3>\n  <div style='background: white; padding: 16px; border-radius: 8px; border-left: 4px solid #2b6cb0;'>\n    <p style='font-size: 1em; line-height: 1.6;'>Une suite <strong>arithmétique</strong> est une suite où la différence entre deux termes consécutifs est <strong>constante</strong>.</p>\n    <div style='text-align: center; font-size: 1.2em; margin: 12px 0;'>\n      <span style='background: #e2e8f0; padding: 8px 24px; border-radius: 8px;'>$u_{n+1} - u_n = r$ (constante)</span>\n    </div>\n    <p style='font-size: 0.95em; line-height: 1.6;'>$r$ est la <strong>raison</strong> de la suite arithmétique.</p>\n    <div style='display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 12px 0;'>\n      <div style='background: #e6fffa; padding: 12px; border-radius: 8px; border: 1px solid #38b2ac;'>\n        <strong style='color: #2c7a7b;'>Formule explicite</strong>\n        <p style='font-size: 0.9em;'>$u_n = u_0 + n \\times r$</p>\n        <p style='font-size: 0.85em;'>ou $u_n = u_p + (n-p) \\times r$</p>\n      </div>\n      <div style='background: #fefcbf; padding: 12px; border-radius: 8px; border: 1px solid #ecc94b;'>\n        <strong style='color: #975a16;'>Cas particulier</strong>\n        <p style='font-size: 0.9em;'>Si $r = 0$ : suite constante</p>\n        <p style='font-size: 0.9em;'>Si $r > 0$ : suite croissante</p>\n        <p style='font-size: 0.9em;'>Si $r < 0$ : suite décroissante</p>\n      </div>\n    </div>\n  </div>\n  <div style='background: #e6fffa; padding: 14px; border-radius: 8px; margin-top: 12px; border: 1px solid #38b2ac;'>\n    <strong style='color: #2c7a7b;'>📝 Exemple :</strong>\n    <p style='font-size: 0.9em;'>$u_0 = 2$ et $r = 3$ → $u_n = 2 + 3n$</p>\n    <p style='font-size: 0.9em;'>$u_0 = 2, u_1 = 5, u_2 = 8, u_3 = 11, ...$</p>\n  </div>\n</div>",
    "texteParle": "Une suite arithmétique est caractérisée par une différence constante entre deux termes consécutifs. Cette différence est appelée la raison, notée $r$. On a $u_{n+1} - u_n = r$, donc $u_{n+1} = u_n + r$. La formule explicite est $u_n = u_0 + n \\times r$. Si $r > 0$, la suite est croissante ; si $r < 0$, elle est décroissante ; si $r = 0$, elle est constante. Par exemple, $u_0 = 2$ et $r = 3$ donne la suite $2, 5, 8, 11, ...$.",
    "note": "Une suite arithmétique a une différence constante $r$ : $u_{n+1} - u_n = r$."
  },
  {
    "titre": "Les suites géométriques",
    "contenu": "<div style='background: #f0f4f8; color: #1e293b; padding: 18px; border-radius: 12px;'>\n  <h3 style='color: #2b6cb0; margin-top: 0;'>✖️ Les suites géométriques</h3>\n  <div style='background: white; padding: 16px; border-radius: 8px; border-left: 4px solid #2b6cb0;'>\n    <p style='font-size: 1em; line-height: 1.6;'>Une suite <strong>géométrique</strong> est une suite où le rapport entre deux termes consécutifs est <strong>constant</strong>.</p>\n    <div style='text-align: center; font-size: 1.2em; margin: 12px 0;'>\n      <span style='background: #e2e8f0; padding: 8px 24px; border-radius: 8px;'>$\\dfrac{u_{n+1}}{u_n} = q$ (constante)</span>\n    </div>\n    <p style='font-size: 0.95em; line-height: 1.6;'>$q$ est la <strong>raison</strong> de la suite géométrique.</p>\n    <div style='display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 12px 0;'>\n      <div style='background: #e6fffa; padding: 12px; border-radius: 8px; border: 1px solid #38b2ac;'>\n        <strong style='color: #2c7a7b;'>Formule explicite</strong>\n        <p style='font-size: 0.9em;'>$u_n = u_0 \\times q^n$</p>\n        <p style='font-size: 0.85em;'>ou $u_n = u_p \\times q^{n-p}$</p>\n      </div>\n      <div style='background: #fefcbf; padding: 12px; border-radius: 8px; border: 1px solid #ecc94b;'>\n        <strong style='color: #975a16;'>Cas particulier</strong>\n        <p style='font-size: 0.9em;'>Si $q = 1$ : suite constante</p>\n        <p style='font-size: 0.9em;'>Si $q > 1$ : suite croissante (si $u_0 > 0$)</p>\n        <p style='font-size: 0.9em;'>Si $0 < q < 1$ : suite décroissante (si $u_0 > 0$)</p>\n      </div>\n    </div>\n  </div>\n  <div style='background: #e6fffa; padding: 14px; border-radius: 8px; margin-top: 12px; border: 1px solid #38b2ac;'>\n    <strong style='color: #2c7a7b;'>📝 Exemple :</strong>\n    <p style='font-size: 0.9em;'>$u_0 = 3$ et $q = 2$ → $u_n = 3 \\times 2^n$</p>\n    <p style='font-size: 0.9em;'>$u_0 = 3, u_1 = 6, u_2 = 12, u_3 = 24, ...$</p>\n  </div>\n</div>",
    "texteParle": "Une suite géométrique est caractérisée par un rapport constant entre deux termes consécutifs. Ce rapport est appelé la raison, notée $q$. On a $u_{n+1}/u_n = q$, donc $u_{n+1} = q \\times u_n$. La formule explicite est $u_n = u_0 \\times q^n$. Si $q > 1$ et $u_0 > 0$, la suite est croissante ; si $0 < q < 1$ et $u_0 > 0$, elle est décroissante ; si $q = 1$, elle est constante. Par exemple, $u_0 = 3$ et $q = 2$ donne la suite $3, 6, 12, 24, ...$.",
    "note": "Une suite géométrique a un rapport constant $q$ : $u_{n+1} / u_n = q$."
  },
  {
    "titre": "Somme des termes d'une suite arithmétique",
    "contenu": "<div style='background: #f0f4f8; color: #1e293b; padding: 18px; border-radius: 12px;'>\n  <h3 style='color: #2b6cb0; margin-top: 0;'>📊 Somme des termes d'une suite arithmétique</h3>\n  <div style='background: white; padding: 16px; border-radius: 8px; border-left: 4px solid #2b6cb0;'>\n    <p style='font-size: 1em; line-height: 1.6;'>La somme des $n+1$ premiers termes d'une suite arithmétique est :</p>\n    <div style='text-align: center; font-size: 1.2em; margin: 12px 0;'>\n      <span style='background: #e2e8f0; padding: 8px 24px; border-radius: 8px;'>$S_n = u_0 + u_1 + ... + u_n = (n+1) \\times \\dfrac{u_0 + u_n}{2}$</span>\n    </div>\n    <p style='font-size: 0.95em; line-height: 1.6;'>On peut aussi l'écrire :</p>\n    <div style='text-align: center; font-size: 1.1em; margin: 8px 0;'>\n      <span style='background: #e2e8f0; padding: 8px 24px; border-radius: 8px;'>$S_n = (n+1) \\times u_0 + \\dfrac{n(n+1)}{2} \\times r$</span>\n    </div>\n    <p style='font-size: 0.95em; line-height: 1.6;'>Le nombre de termes est $n+1$ (pour $u_0$ à $u_n$).</p>\n  </div>\n  <div style='background: #e6fffa; padding: 14px; border-radius: 8px; margin-top: 12px; border: 1px solid #38b2ac;'>\n    <strong style='color: #2c7a7b;'>📝 Exemple :</strong>\n    <p style='font-size: 0.9em;'>$u_n = 2 + 3n$ avec $n = 0$ à $n = 4$</p>\n    <p style='font-size: 0.9em;'>$u_0 = 2, u_1 = 5, u_2 = 8, u_3 = 11, u_4 = 14$</p>\n    <p style='font-size: 0.9em;'>$S_4 = 5 \\times \\dfrac{2 + 14}{2} = 5 \\times 8 = 40$</p>\n  </div>\n</div>",
    "texteParle": "La somme des termes d'une suite arithmétique se calcule facilement. Pour les $n+1$ premiers termes (de $u_0$ à $u_n$), la formule est $S_n = (n+1) \\times (u_0 + u_n)/2$. C'est la moyenne du premier et du dernier terme, multipliée par le nombre de termes. Par exemple, pour la suite $u_n = 2 + 3n$ de $n=0$ à $n=4$, les termes sont $2, 5, 8, 11, 14$, et la somme est $5 \\times (2+14)/2 = 40$.",
    "note": "La somme des termes d'une suite arithmétique est $S_n = (n+1) \\times \\dfrac{u_0 + u_n}{2}$."
  },
  {
    "titre": "Somme des termes d'une suite géométrique",
    "contenu": "<div style='background: #f0f4f8; color: #1e293b; padding: 18px; border-radius: 12px;'>\n  <h3 style='color: #2b6cb0; margin-top: 0;'>📊 Somme des termes d'une suite géométrique</h3>\n  <div style='background: white; padding: 16px; border-radius: 8px; border-left: 4px solid #2b6cb0;'>\n    <p style='font-size: 1em; line-height: 1.6;'>La somme des $n+1$ premiers termes d'une suite géométrique est :</p>\n    <div style='text-align: center; font-size: 1.2em; margin: 12px 0;'>\n      <span style='background: #e2e8f0; padding: 8px 24px; border-radius: 8px;'>$S_n = u_0 + u_1 + ... + u_n = u_0 \\times \\dfrac{1 - q^{n+1}}{1 - q}$</span>\n    </div>\n    <p style='font-size: 0.95em; line-height: 1.6;'>Cette formule est valable pour $q \\neq 1$.</p>\n    <div style='background: #fefcbf; padding: 10px; border-radius: 6px; margin-top: 8px;'>\n      <p style='margin: 0; font-size: 0.9em;'><strong>Cas particulier :</strong> Si $q = 1$, alors $S_n = (n+1) \\times u_0$ (suite constante).</p>\n    </div>\n    <p style='font-size: 0.95em; line-height: 1.6; margin-top: 8px;'>Le nombre de termes est $n+1$ (pour $u_0$ à $u_n$).</p>\n  </div>\n  <div style='background: #e6fffa; padding: 14px; border-radius: 8px; margin-top: 12px; border: 1px solid #38b2ac;'>\n    <strong style='color: #2c7a7b;'>📝 Exemple :</strong>\n    <p style='font-size: 0.9em;'>$u_n = 3 \\times 2^n$ avec $n = 0$ à $n = 4$</p>\n    <p style='font-size: 0.9em;'>$u_0 = 3, u_1 = 6, u_2 = 12, u_3 = 24, u_4 = 48$</p>\n    <p style='font-size: 0.9em;'>$S_4 = 3 \\times \\dfrac{1 - 2^5}{1 - 2} = 3 \\times \\dfrac{1 - 32}{-1} = 3 \\times 31 = 93$</p>\n  </div>\n</div>",
    "texteParle": "La somme des termes d'une suite géométrique a une formule spécifique. Pour les $n+1$ premiers termes (de $u_0$ à $u_n$), on a $S_n = u_0 \\times (1 - q^{n+1})/(1 - q)$ pour $q \\neq 1$. Si $q = 1$, la suite est constante et $S_n = (n+1) \\times u_0$. Par exemple, pour $u_n = 3 \\times 2^n$ de $n=0$ à $n=4$, la somme est $3 \\times (1 - 2^5)/(1 - 2) = 3 \\times 31 = 93$.",
    "note": "La somme des termes d'une suite géométrique est $S_n = u_0 \\times \\dfrac{1 - q^{n+1}}{1 - q}$ pour $q \\neq 1$."
  },
  {
    "titre": "Utiliser les suites pour résoudre des équations",
    "contenu": "<div style='background: #f0f4f8; color: #1e293b; padding: 18px; border-radius: 12px;'>\n  <h3 style='color: #2b6cb0; margin-top: 0;'>🔍 Utiliser les suites pour résoudre des équations</h3>\n  <div style='background: white; padding: 16px; border-radius: 8px; border-left: 4px solid #2b6cb0;'>\n    <p style='font-size: 1em; line-height: 1.6;'>Les suites sont souvent utilisées pour résoudre des équations de manière itérative.</p>\n    <ul style='font-size: 0.95em; line-height: 1.8;'>\n      <li><strong>Méthode de recherche de solution</strong> : on définit une suite qui converge vers la solution.</li>\n      <li><strong>Méthode de Newton</strong> : $u_{n+1} = u_n - \\dfrac{f(u_n)}{f'(u_n)}$</li>\n      <li><strong>Méthode du point fixe</strong> : $u_{n+1} = g(u_n)$ où la solution est $x = g(x)$.</li>\n    </ul>\n  </div>\n  <div style='display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px;'>\n    <div style='background: #e6fffa; padding: 14px; border-radius: 8px; border: 1px solid #38b2ac;'>\n      <strong style='color: #2c7a7b;'>📝 Exemple : équation $x^2 = 2$</strong>\n      <p style='font-size: 0.9em;'>Définir $u_{n+1} = \\dfrac{1}{2}\\left(u_n + \\dfrac{2}{u_n}\\right)$</p>\n      <p style='font-size: 0.9em;'>Avec $u_0 = 1$ :</p>\n      <p style='font-size: 0.85em;'>$u_1 = 1,5$ ; $u_2 \\approx 1,4167$ ; $u_3 \\approx 1,4142$</p>\n      <p style='font-size: 0.85em;'>La suite converge vers $\\sqrt{2}$.</p>\n    </div>\n    <div style='background: #fefcbf; padding: 14px; border-radius: 8px; border: 1px solid #ecc94b;'>\n      <strong style='color: #975a16;'>📝 Application : intérêts composés</strong>\n      <p style='font-size: 0.9em;'>Capital $C_n = C_0 \\times (1 + t)^n$</p>\n      <p style='font-size: 0.9em;'>Trouver $n$ tel que $C_n = 2C_0$ :</p>\n      <p style='font-size: 0.85em;'>$(1 + t)^n = 2$ → $n = \\dfrac{\\ln(2)}{\\ln(1+t)}$</p>\n    </div>\n  </div>\n</div>",
    "texteParle": "Les suites sont très utiles pour résoudre des équations de manière approchée. Par exemple, la méthode de Newton définit une suite qui converge vers la solution d'une équation $f(x) = 0$. Pour résoudre $x^2 = 2$, on peut définir $u_{n+1} = (u_n + 2/u_n)/2$, qui converge vers $\\sqrt{2}$. Les suites sont aussi utilisées en économie avec les intérêts composés : pour trouver le nombre d'années nécessaires pour doubler un capital, on utilise le logarithme.",
    "note": "Les suites permettent de résoudre des équations par des méthodes itératives (Newton, point fixe)."
  },
  {
    "titre": "Suites et intérêts composés",
    "contenu": "<div style='background: #f0f4f8; color: #1e293b; padding: 18px; border-radius: 12px;'>\n  <h3 style='color: #2b6cb0; margin-top: 0;'>💰 Suites et intérêts composés</h3>\n  <div style='background: white; padding: 16px; border-radius: 8px; border-left: 4px solid #2b6cb0;'>\n    <p style='font-size: 1em; line-height: 1.6;'>Les intérêts composés sont modélisés par une <strong>suite géométrique</strong>.</p>\n    <div style='text-align: center; font-size: 1.2em; margin: 12px 0;'>\n      <span style='background: #e2e8f0; padding: 8px 24px; border-radius: 8px;'>$C_n = C_0 \\times (1 + t)^n$</span>\n    </div>\n    <ul style='font-size: 0.95em; line-height: 1.8;'>\n      <li>$C_0$ : capital initial</li>\n      <li>$t$ : taux d'intérêt (ex: 0,05 pour 5%)</li>\n      <li>$n$ : nombre de périodes (années)</li>\n      <li>$C_n$ : capital après $n$ périodes</li>\n    </ul>\n  </div>\n  <div style='display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px;'>\n    <div style='background: #e6fffa; padding: 14px; border-radius: 8px; border: 1px solid #38b2ac;'>\n      <strong style='color: #2c7a7b;'>📝 Exemple 1</strong>\n      <p style='font-size: 0.9em;'>Capital initial 1000 €, taux 4%</p>\n      <p style='font-size: 0.9em;'>$C_n = 1000 \\times (1,04)^n$</p>\n      <p style='font-size: 0.9em;'>Après 5 ans : $C_5 = 1000 \\times (1,04)^5 \\approx 1216,65$ €</p>\n    </div>\n    <div style='background: #e6fffa; padding: 14px; border-radius: 8px; border: 1px solid #38b2ac;'>\n      <strong style='color: #2c7a7b;'>📝 Exemple 2</strong>\n      <p style='font-size: 0.9em;'>Trouver le taux pour doubler en 10 ans :</p>\n      <p style='font-size: 0.9em;'>$(1 + t)^{10} = 2$</p>\n      <p style='font-size: 0.9em;'>$t = 2^{1/10} - 1 \\approx 0,0718$ (7,18%)</p>\n    </div>\n  </div>\n  <div style='background: #fefcbf; padding: 10px; border-radius: 8px; margin-top: 12px;'>\n    <p style='margin: 0; font-size: 0.95em;'><strong>💡 Règle de 72 :</strong> Pour doubler un capital, $n \\approx 72/t$ (avec $t$ en %).</p>\n  </div>\n</div>",
    "texteParle": "Les intérêts composés sont un exemple classique de suite géométrique. Le capital après $n$ périodes est $C_n = C_0 \\times (1 + t)^n$, où $t$ est le taux d'intérêt. Par exemple, un capital de 1000 € à 4% d'intérêts composés devient $1000 \\times (1,04)^5 \\approx 1216,65$ € après 5 ans. Pour trouver le taux qui permet de doubler le capital en 10 ans, on résout $(1+t)^{10} = 2$, ce qui donne $t \\approx 7,18$%. On peut utiliser la règle de 72 pour une approximation rapide.",
    "note": "Les intérêts composés forment une suite géométrique $C_n = C_0 \\times (1 + t)^n$."
  },
  {
    "titre": "Suites et emprunts (amortissement)",
    "contenu": "<div style='background: #f0f4f8; color: #1e293b; padding: 18px; border-radius: 12px;'>\n  <h3 style='color: #2b6cb0; margin-top: 0;'>🏦 Suites et emprunts (amortissement)</h3>\n  <div style='background: white; padding: 16px; border-radius: 8px; border-left: 4px solid #2b6cb0;'>\n    <p style='font-size: 1em; line-height: 1.6;'>Dans un emprunt à mensualités constantes, le capital restant dû suit une suite.</p>\n    <p style='font-size: 0.95em; line-height: 1.6;'>Si $D_n$ est le capital restant dû après $n$ mensualités :</p>\n    <div style='text-align: center; font-size: 1.2em; margin: 12px 0;'>\n      <span style='background: #e2e8f0; padding: 8px 24px; border-radius: 8px;'>$D_n = D_0 \\times \\dfrac{(1+t)^n - 1}{t}$</span>\n    </div>\n    <p style='font-size: 0.95em; line-height: 1.6;'>Ou pour le capital restant dû :</p>\n    <div style='text-align: center; font-size: 1.1em; margin: 8px 0;'>\n      <span style='background: #e2e8f0; padding: 8px 24px; border-radius: 8px;'>$C_n = C_0 \\times (1+t)^n - M \\times \\dfrac{(1+t)^n - 1}{t}$</span>\n    </div>\n    <p style='font-size: 0.85em;'>où $M$ est la mensualité constante.</p>\n  </div>\n  <div style='background: #e6fffa; padding: 14px; border-radius: 8px; margin-top: 12px; border: 1px solid #38b2ac;'>\n    <strong style='color: #2c7a7b;'>📝 Exemple :</strong>\n    <p style='font-size: 0.9em;'>Emprunt 100 000 € à 5% sur 20 ans (240 mois)</p>\n    <p style='font-size: 0.9em;'>Mensualité $M \\approx 659,96$ €</p>\n    <p style='font-size: 0.9em;'>Après 120 mois, capital restant dû $\\approx 63 214$ €</p>\n  </div>\n</div>",
    "texteParle": "Les suites sont aussi utilisées pour modéliser les emprunts. Dans un emprunt à mensualités constantes, le capital restant dû suit une suite géométrique. La formule est $C_n = C_0 \\times (1+t)^n - M \\times ((1+t)^n - 1)/t$, où $M$ est la mensualité constante. Par exemple, pour un emprunt de 100 000 € à 5% sur 20 ans, la mensualité est d'environ 660 €. Après 10 ans (120 mois), le capital restant dû est d'environ 63 214 €.",
    "note": "Les emprunts à mensualités constantes sont modélisés par des suites géométriques."
  },
  {
    "titre": "Récapitulatif des suites",
    "contenu": "<div style='background: #f0f4f8; color: #1e293b; padding: 18px; border-radius: 12px;'>\n  <h3 style='color: #2b6cb0; margin-top: 0;'>📋 Synthèse : suites arithmétiques et géométriques</h3>\n  <div style='background: white; padding: 16px; border-radius: 8px;'>\n    <table style='width: 100%; border-collapse: collapse; font-size: 0.85em;'>\n      <thead style='background: #2b6cb0; color: white;'>\n        <tr>\n          <th style='padding: 8px; border: 1px solid #e2e8f0;'>Propriété</th>\n          <th style='padding: 8px; border: 1px solid #e2e8f0;'>Suite arithmétique</th>\n          <th style='padding: 8px; border: 1px solid #e2e8f0;'>Suite géométrique</th>\n        </tr>\n      </thead>\n      <tbody>\n        <tr style='background: #e6fffa;'>\n          <td style='padding: 8px; border: 1px solid #e2e8f0;'>Définition</td>\n          <td style='padding: 8px; border: 1px solid #e2e8f0;'>$u_{n+1} = u_n + r$</td>\n          <td style='padding: 8px; border: 1px solid #e2e8f0;'>$u_{n+1} = q \\times u_n$</td>\n        </tr>\n        <tr style='background: #f0f4f8;'>\n          <td style='padding: 8px; border: 1px solid #e2e8f0;'>Terme général</td>\n          <td style='padding: 8px; border: 1px solid #e2e8f0;'>$u_n = u_0 + n \\times r$</td>\n          <td style='padding: 8px; border: 1px solid #e2e8f0;'>$u_n = u_0 \\times q^n$</td>\n        </tr>\n        <tr style='background: #e6fffa;'>\n          <td style='padding: 8px; border: 1px solid #e2e8f0;'>Somme ($n+1$ termes)</td>\n          <td style='padding: 8px; border: 1px solid #e2e8f0;'>$S_n = (n+1) \\times \\dfrac{u_0 + u_n}{2}$</td>\n          <td style='padding: 8px; border: 1px solid #e2e8f0;'>$S_n = u_0 \\times \\dfrac{1 - q^{n+1}}{1 - q}$</td>\n        </tr>\n        <tr style='background: #f0f4f8;'>\n          <td style='padding: 8px; border: 1px solid #e2e8f0;'>Variations ($u_0 > 0$)</td>\n          <td style='padding: 8px; border: 1px solid #e2e8f0;'>$r > 0$ : croissante<br>$r < 0$ : décroissante</td>\n          <td style='padding: 8px; border: 1px solid #e2e8f0;'>$q > 1$ : croissante<br>$0 < q < 1$ : décroissante</td>\n        </tr>\n        <tr style='background: #e6fffa;'>\n          <td style='padding: 8px; border: 1px solid #e2e8f0;'>Applications</td>\n          <td style='padding: 8px; border: 1px solid #e2e8f0;'>Amortissements linéaires</td>\n          <td style='padding: 8px; border: 1px solid #e2e8f0;'>Intérêts composés, emprunts</td>\n        </tr>\n      </tbody>\n    </table>\n  </div>\n  <div style='background: #e2e8f0; padding: 12px; border-radius: 8px; margin-top: 12px; text-align: center;'>\n    <p style='margin: 0; font-size: 1em;'><strong>🔑 La clé :</strong> Les suites arithmétiques sont additives, les suites géométriques sont multiplicatives.</p>\n  </div>\n</div>",
    "texteParle": "Pour terminer, récapitulons les différences entre les suites arithmétiques et géométriques. Les suites arithmétiques ont une différence constante $r$ : $u_{n+1} = u_n + r$, et leur terme général est $u_n = u_0 + n \\times r$. La somme se calcule par $S_n = (n+1) \\times (u_0 + u_n)/2$. Les suites géométriques ont un rapport constant $q$ : $u_{n+1} = q \\times u_n$, et leur terme général est $u_n = u_0 \\times q^n$. La somme se calcule par $S_n = u_0 \\times (1 - q^{n+1})/(1 - q)$. Les deux types ont des applications importantes en économie et en sciences.",

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentIndex = 0;
    let isSpeaking = false;
    let isPaused = false;
    let currentUtterance = null;
    let isLoading = false;
    let loadingTimeout = null;
    let isTransitioning = false;
    let speechSupported = true;
    let userInteracted = false;
    let isPlaying = false;
    let loadingCancelled = false;

    const total = slides.length;
    const synth = window.speechSynthesis;

    // Références jQuery
    const $title = $('#slideTitle');
    const $body = $('#slideBody');
    const $counter = $('#slideCounter');
    const $statusText = $('#statusText');
    const $statusBadge = $('#statusBadge');
    const $loading = $('#loadingOverlay');
    const $loadingText = $('#loadingText');
    const $loadingSub = $('#loadingSub');
    const $loadingTimeout = $('#loadingTimeout');
    const $loadingProgressBar = $('#loadingProgressBar');
    const $autoIndicator = $('#autoIndicator');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $replay = $('#replayBtn');
    const $play = $('#playBtn');
    const $cancelLoading = $('#cancelLoadingBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function setStatus(text, type) {
        $statusText.text(text);
        $statusBadge.removeClass('idle speaking error paused waiting loading');
        if (type === 'speaking') $statusBadge.addClass('speaking');
        else if (type === 'error') $statusBadge.addClass('error');
        else if (type === 'paused') $statusBadge.addClass('paused');
        else if (type === 'waiting') $statusBadge.addClass('waiting');
        else if (type === 'loading') $statusBadge.addClass('loading');
        else $statusBadge.addClass('idle');
    }

    function updatePlayButton() {
        if (isPlaying) {
            $play.addClass('playing');
            $play.find('.btn-icon').text('⏸');
            $play.find('.btn-label').text('Pause');
        } else {
            $play.removeClass('playing');
            $play.find('.btn-icon').text('▶');
            $play.find('.btn-label').text('Play');
        }
    }

    function showLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        
        loadingCancelled = false;
        isLoading = true;
        
        // Réinitialiser la barre de progression
        $loadingProgressBar.css('animation', 'none');
        $loadingProgressBar.css('width', '0%');
        // Forcer un reflow
        $loadingProgressBar[0].offsetHeight;
        $loadingProgressBar.css('animation', 'loadingProgress 30s ease-out forwards');
        
        $loadingText.text('Préparation vocale...');
        $loadingSub.text('Synthèse en cours');
        $loadingTimeout.text('⏱️ 30 secondes maximum');
        $loading.fadeIn(300);
        setStatus("⏳ Chargement...", 'loading');
        
        // 🔥 TIMEOUT DE 30 SECONDES
        loadingTimeout = setTimeout(() => {
            if (isLoading && !loadingCancelled) {
                hideLoading();
                setStatus("⚠️ Délai dépassé (30s)", 'error');
                isPlaying = false;
                updatePlayButton();
                $loadingSub.text('La synthèse vocale a pris trop de temps');
                $loadingTimeout.text('❌ Délai dépassé');
            }
        }, 30000);
    }

    function hideLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        isLoading = false;
        loadingCancelled = false;
        $loading.fadeOut(300);
        // Ne pas changer le statut si on est en train de parler
        if (!isSpeaking && !isPlaying) {
            setStatus("⏸ Lecture arrêtée", 'paused');
        }
    }

    function cancelLoading() {
        loadingCancelled = true;
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        hideLoading();
        stopSpeaking();
        setStatus("⏸ Annulé", 'paused');
        isPlaying = false;
        updatePlayButton();
        $loadingText.text('Annulé par l\'utilisateur');
        $loadingSub.text('Vous pouvez réessayer');
        $loadingTimeout.text('✕ Annulation');
    }

    // Arrêter la parole proprement
    function stopSpeaking() {
        try {
            if (synth && (synth.speaking || synth.pending)) {
                synth.cancel();
            }
        } catch(e) {
            console.warn('Erreur stopSpeaking:', e);
        }
        if (currentUtterance) {
            try {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance.onstart = null;
            } catch(e) {}
            currentUtterance = null;
        }
        isSpeaking = false;
        isPlaying = false;
        updatePlayButton();
    }

    // Mettre en pause la parole
    function pauseSpeaking() {
        try {
            if (synth && synth.speaking) {
                synth.pause();
                isPaused = true;
                isPlaying = false;
                setStatus("⏸ Lecture en pause", 'paused');
                updatePlayButton();
            }
        } catch(e) {
            console.warn('Erreur pauseSpeaking:', e);
            stopSpeaking();
        }
    }

    // Reprendre la parole
    function resumeSpeaking() {
        try {
            if (synth && synth.paused) {
                synth.resume();
                isPaused = false;
                isPlaying = true;
                setStatus("🔊 Lecture en cours", 'speaking');
                updatePlayButton();
            } else if (!isSpeaking && !synth.speaking && !synth.pending) {
                speakSlide(currentIndex);
            }
        } catch(e) {
            console.warn('Erreur resumeSpeaking:', e);
            speakSlide(currentIndex);
        }
    }

    function renderSlide(index) {
        const slide = slides[index];
        $title.text(slide.titre);

        let html = '';
        html += `<div class="content-card">${slide.contenu}</div>`;
        if (slide.note) {
            html += `<div class="note-box">${slide.note}</div>`;
        }
        $body.html(html);
        $counter.text(`${index+1} / ${total}`);

        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
        }
    }

    // ================================================================
    // LECTURE VOCALE
    // ================================================================
    function speakSlide(index) {
        return new Promise((resolve) => {
            const slide = slides[index];
            const text = slide.texteParle;
            
            if (!text || text.trim() === '' || !speechSupported) {
                resolve();
                return;
            }

            if (!window.speechSynthesis) {
                setStatus("❌ Synthèse vocale non supportée", 'error');
                speechSupported = false;
                resolve();
                return;
            }

            // Arrêter toute lecture en cours
            stopSpeaking();
            
            // Réinitialiser l'état de pause
            isPaused = false;
            
            showLoading();
            setStatus("Initialisation...", 'loading');

            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.92;
                utterance.pitch = 1.05;
                utterance.volume = 1;

                let isFinished = false;
                let errorHandled = false;

                utterance.onstart = function() {
                    if (loadingCancelled) {
                        stopSpeaking();
                        resolve();
                        return;
                    }
                    hideLoading();
                    isSpeaking = true;
                    isPlaying = true;
                    isPaused = false;
                    setStatus("🔊 Lecture en cours", 'speaking');
                    updatePlayButton();
                };

                utterance.onend = function() {
                    if (isFinished) return;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    setStatus("✅ Terminé", 'idle');
                    hideLoading();
                    updatePlayButton();
                    resolve();
                };

                utterance.onerror = function(e) {
                    if (isFinished || errorHandled) return;
                    errorHandled = true;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    hideLoading();
                    updatePlayButton();
                    
                    if (e.error === 'not-allowed') {
                        setStatus("⚠️ Permission refusée", 'error');
                    } else if (e.error === 'synthesis-unavailable') {
                        setStatus("⚠️ Synthèse indisponible", 'error');
                    } else if (e.error === 'canceled') {
                        setStatus("⏸ Annulé", 'paused');
                    } else {
                        setStatus("❌ Erreur audio: " + (e.error || 'inconnue'), 'error');
                    }
                    
                    resolve();
                };

                // Gestion du chargement des voix
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = function() {
                        if (!loadingCancelled) {
                            try {
                                synth.speak(utterance);
                            } catch(err) {
                                // Silencieux
                            }
                        }
                        synth.onvoiceschanged = null;
                    };
                }

                currentUtterance = utterance;
                
                if (!loadingCancelled) {
                    try {
                        synth.speak(utterance);
                    } catch(err) {
                        setTimeout(() => {
                            if (!loadingCancelled) {
                                try {
                                    synth.speak(utterance);
                                } catch(e) {
                                    setStatus("❌ Erreur de lecture", 'error');
                                    isPlaying = false;
                                    updatePlayButton();
                                    hideLoading();
                                    resolve();
                                }
                            } else {
                                resolve();
                            }
                        }, 100);
                    }
                } else {
                    resolve();
                }

            } catch(err) {
                hideLoading();
                setStatus("❌ Erreur générale", 'error');
                isPlaying = false;
                updatePlayButton();
                console.error('Erreur speakSlide:', err);
                resolve();
            }
        });
    }

    // ================================================================
    // NAVIGATION
    // ================================================================
    async function goToSlide(index) {
        if (isTransitioning) return;
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        
        // Si on est en train de lire, on met en pause avant de naviguer
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        // Arrêter complètement la lecture
        stopSpeaking();
        
        await new Promise(r => setTimeout(r, 50));
        
        if (index === currentIndex) {
            setStatus("📄 Slide actuel", 'idle');
            return;
        }

        isTransitioning = true;
        currentIndex = index;
        renderSlide(index);
        
        // Réinitialiser l'état de lecture
        isPlaying = false;
        updatePlayButton();
        setStatus("⏸ Lecture arrêtée", 'paused');

        await new Promise(r => setTimeout(r, 150));
        isTransitioning = false;
    }

    async function goToNext() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex + 1 < total) {
            await goToSlide(currentIndex + 1);
        } else {
            setStatus("🏁 Dernier slide", 'idle');
        }
    }

    async function goToPrev() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex - 1 >= 0) {
            await goToSlide(currentIndex - 1);
        } else {
            setStatus("🔁 Premier slide", 'idle');
        }
    }

    // ================================================================
    // GESTION PLAY/PAUSE
    // ================================================================
    function togglePlay() {
        if (!userInteracted) {
            userInteracted = true;
        }

        // Si le chargement est en cours, on l'annule
        if (isLoading) {
            cancelLoading();
            return;
        }

        // Si le synthétiseur est en pause, on reprend
        if (synth && synth.paused) {
            resumeSpeaking();
            return;
        }

        // Si la lecture est en cours, on met en pause
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
            return;
        }

        // Sinon, on démarre la lecture du slide courant
        if (!isSpeaking && !isPlaying) {
            stopSpeaking();
            speakSlide(currentIndex);
        }
    }

    // ================================================================
    // INIT
    // ================================================================
    async function init() {
        // Vérifier la compatibilité
        if (!window.speechSynthesis) {
            setStatus("❌ Synthèse vocale non supportée", 'error');
            speechSupported = false;
        }

        // Précharger les voix
        try {
            if (synth.getVoices) {
                synth.getVoices();
                setTimeout(() => {
                    try {
                        synth.getVoices();
                    } catch(e) {}
                }, 200);
            }
        } catch(e) {
            console.warn('Erreur chargement voix:', e);
        }

        // Afficher le premier slide
        renderSlide(0);
        $counter.text(`1 / ${total}`);
        
        // État initial
        setStatus("⏸ Appuie sur Play", 'paused');
        updatePlayButton();
        $autoIndicator.text('⏸ Lecture manuelle');

        // ================================================================
        // ÉVÉNEMENTS
        // ================================================================
        
        // Bouton Play/Pause
        $play.on('click', function() {
            togglePlay();
        });

        // Bouton Annuler le chargement
        $cancelLoading.on('click', function() {
            cancelLoading();
        });

        // Navigation
        $prev.on('click', function() {
            // Si chargement en cours, on annule
            if (isLoading) cancelLoading();
            goToPrev();
        });

        $next.on('click', function() {
            if (isLoading) cancelLoading();
            goToNext();
        });

        // Replay - relire le slide courant
        $replay.on('click', function() {
            if (isLoading) cancelLoading();
            stopSpeaking();
            setTimeout(() => {
                speakSlide(currentIndex);
            }, 100);
        });

        // Support du clavier (espace pour play/pause)
        $(document).on('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });

        // Nettoyage
        $(window).on('beforeunload', function() {
            try {
                if (synth.speaking) synth.cancel();
            } catch(e) {}
            hideLoading();
        });

        // Gérer les cas où la synthèse se termine de manière inattendue
        setInterval(() => {
            if (isPlaying && !synth.speaking && !synth.pending && !isPaused && !isLoading) {
                isPlaying = false;
                updatePlayButton();
                setStatus("⏸ Lecture arrêtée", 'paused');
            }
        }, 1000);
    }

    init();
});

            btn.style.color = '#2d3748';
        });
        
        const statusBadge = document.querySelector('.status-badge');
        if (statusBadge) {
            statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
            statusBadge.style.color = '#2b6cb0';
        }
        
        const slideCounter = document.querySelector('.slide-counter');
        if (slideCounter) {
            slideCounter.style.color = '#4a5568';
        }
        
        const autoIndicator = document.querySelector('.auto-indicator');
        if (autoIndicator) {
            autoIndicator.style.color = '#718096';
        }
        
        document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
            if (!el.closest('.note-box')) {
                el.style.color = '#2c3e50';
            }
        });
        
        document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
            if (!el.closest('.note-box') && !el.closest('.math-block')) {
                el.style.color = '#2d3748';
            }
        });
        
        const themeBtn = document.getElementById('themeToggle');
        if (themeBtn) {
            themeBtn.textContent = '🌓';
            themeBtn.title = 'Passer en mode nuit';
        }
    });
</script>
</body>
</html>
