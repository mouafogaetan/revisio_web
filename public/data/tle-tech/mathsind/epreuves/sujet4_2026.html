<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Maths Industriel",
  "classe": "Tle technique",
  "sequence": "Séquence 4",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Nombres complexes (2 pts)",
      "points": "2 pts",
      "enonce": "<p style='font-size: 16px; color: #2c3e50;'>On considère le nombre complexe $z = 1 + i\\sqrt{3}$.</p>",
      "questions": [
        {
          "question": "1) Écrire $z$ sous forme trigonométrique.",
          "reponse": "<p>$|z| = \\sqrt{1^2 + (\\sqrt{3})^2} = \\sqrt{1+3} = 2$.</p><p>$z = 2\\left(\\frac{1}{2} + i\\frac{\\sqrt{3}}{2}\\right) = 2\\left(\\cos\\frac{\\pi}{3} + i\\sin\\frac{\\pi}{3}\\right) = 2e^{i\\frac{\\pi}{3}}$.</p>"
        },
        {
          "question": "2) Calculer $z^3$ en utilisant la forme trigonométrique.",
          "reponse": "<p>$z^3 = \\left(2e^{i\\frac{\\pi}{3}}\\right)^3 = 2^3 e^{i\\pi} = 8(\\cos\\pi + i\\sin\\pi) = -8$.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Limites et continuité (2 pts)",
      "points": "2 pts",
      "enonce": "<p style='font-size: 16px; color: #2c3e50;'>Soit $f$ la fonction définie sur $\\mathbb{R}$ par $f(x) = x^3 - 3x + 1$.</p>",
      "questions": [
        {
          "question": "1) Déterminer les limites de $f$ en $-\\infty$ et en $+\\infty$.",
          "reponse": "<p>$\\lim_{x \\to -\\infty} f(x) = \\lim_{x \\to -\\infty} x^3 = -\\infty$.</p><p>$\\lim_{x \\to +\\infty} f(x) = \\lim_{x \\to +\\infty} x^3 = +\\infty$.</p>"
        },
        {
          "question": "2) Montrer que l'équation $f(x) = 0$ admet au moins une solution dans l'intervalle $[0;1]$.",
          "reponse": "<p>$f$ est continue sur $[0;1]$ car c'est un polynôme.</p><p>$f(0) = 1 > 0$ et $f(1) = 1 - 3 + 1 = -1 < 0$.</p><p>D'après le théorème des valeurs intermédiaires, il existe $c \\in [0;1]$ tel que $f(c) = 0$.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Étude de fonction (4 pts)",
      "points": "4 pts",
      "enonce": "<p style='font-size: 16px; color: #2c3e50;'>On considère la fonction $f$ définie sur $\\mathbb{R} \\setminus \\{-1\\}$ par $f(x) = \\frac{x^2 - 2x + 3}{x + 1}$.</p>",
      "questions": [
        {
          "question": "1) Déterminer les limites de $f$ aux bornes de son ensemble de définition.",
          "reponse": "<p>$\\lim_{x \\to +\\infty} f(x) = \\lim_{x \\to +\\infty} \\frac{x^2}{x} = \\lim_{x \\to +\\infty} x = +\\infty$.</p><p>$\\lim_{x \\to -\\infty} f(x) = \\lim_{x \\to -\\infty} x = -\\infty$.</p><p>$\\lim_{x \\to -1^-} f(x) = \\lim_{x \\to -1^-} \\frac{1+2+3}{0^-} = -\\infty$.</p><p>$\\lim_{x \\to -1^+} f(x) = \\lim_{x \\to -1^+} \\frac{6}{0^+} = +\\infty$.</p>"
        },
        {
          "question": "2) Déterminer l'asymptote oblique de la courbe.",
          "reponse": "<p>On effectue la division euclidienne : $x^2 - 2x + 3 = (x+1)(x-3) + 6$.</p><p>$f(x) = x - 3 + \\frac{6}{x+1}$.</p><p>L'asymptote oblique est la droite $y = x - 3$.</p>"
        },
        {
          "question": "3) Calculer la dérivée $f'(x)$ et étudier les variations de $f$.",
          "reponse": "<p>$f'(x) = \\frac{(2x-2)(x+1) - (x^2-2x+3)}{(x+1)^2}$</p><p>$= \\frac{2x^2 + 2x - 2x - 2 - x^2 + 2x - 3}{(x+1)^2} = \\frac{x^2 + 2x - 5}{(x+1)^2}$.</p><p>Signe de $x^2 + 2x - 5$ : $\\Delta = 4 + 20 = 24$, $x_1 = -1 - \\sqrt{6}$, $x_2 = -1 + \\sqrt{6}$.</p><p>$f$ est croissante sur $]-\\infty; -1-\\sqrt{6}] \\cup [-1+\\sqrt{6}; +\\infty[$ et décroissante sur $[-1-\\sqrt{6}; -1[$ et $]-1; -1+\\sqrt{6}]$.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Intégration et calcul d'aire (4 pts)",
      "points": "4 pts",
      "enonce": "<p style='font-size: 16px; color: #2c3e50;'>On considère la fonction $f$ définie sur $\\mathbb{R}$ par $f(x) = x^2 - 2x$.</p>",
      "questions": [
        {
          "question": "1) Calculer l'intégrale $I = \\int_0^2 (x^2 - 2x) \\, dx$.",
          "reponse": "<p>$I = [\\frac{x^3}{3} - x^2]_0^2 = (\\frac{8}{3} - 4) - 0 = \\frac{8}{3} - \\frac{12}{3} = -\\frac{4}{3}$.</p>"
        },
        {
          "question": "2) Interpréter géométriquement le résultat obtenu.",
          "reponse": "<p>Sur $[0;2]$, $f(x) = x(x-2) \\le 0$. L'intégrale est négative, ce qui signifie que l'aire de la région délimitée par la courbe et l'axe des abscisses est $\\frac{4}{3}$ unités d'aire.</p>"
        },
        {
          "question": "3) Calculer l'aire de la région délimitée par la courbe $y = f(x)$ et l'axe des abscisses sur $[0;2]$.",
          "reponse": "<p>$A = \\int_0^2 |f(x)| \\, dx = \\int_0^2 -(x^2 - 2x) \\, dx = -\\int_0^2 (x^2 - 2x) \\, dx = -(-\\frac{4}{3}) = \\frac{4}{3}$ unités d'aire.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 5 : Équation différentielle (4 pts)",
      "points": "4 pts",
      "enonce": "<p style='font-size: 16px; color: #2c3e50;'>Résoudre l'équation différentielle : $y'' - 4y' + 4y = 0$.</p>",
      "questions": [
        {
          "question": "1) Écrire l'équation caractéristique et déterminer ses racines.",
          "reponse": "<p>L'équation caractéristique est $r^2 - 4r + 4 = 0$.</p><p>$(r-2)^2 = 0$ donc $r = 2$ (racine double).</p>"
        },
        {
          "question": "2) Donner la solution générale de l'équation différentielle.",
          "reponse": "<p>La solution générale est $y = (C_1 + C_2 x)e^{2x}$.</p>"
        },
        {
          "question": "3) Déterminer la solution particulière vérifiant $y(0) = 1$ et $y'(0) = 0$.",
          "reponse": "<p>$y(0) = C_1 = 1$.</p><p>$y'(x) = C_2 e^{2x} + 2(C_1 + C_2 x)e^{2x}$.</p><p>$y'(0) = C_2 + 2C_1 = 0 \\Rightarrow C_2 + 2 = 0 \\Rightarrow C_2 = -2$.</p><p>La solution est $y = (1 - 2x)e^{2x}$.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 6 : Géométrie analytique (4 pts)",
      "points": "4 pts",
      "enonce": "<p style='font-size: 16px; color: #2c3e50;'>Soit le cercle d'équation $x^2 + y^2 - 4x - 6y - 12 = 0$.</p>",
      "questions": [
        {
          "question": "1) Déterminer le centre et le rayon de ce cercle.",
          "reponse": "<p>On complète les carrés : $x^2 - 4x + y^2 - 6y = 12$.</p><p>$(x-2)^2 - 4 + (y-3)^2 - 9 = 12$.</p><p>$(x-2)^2 + (y-3)^2 = 25$.</p><p>Le centre est $C(2;3)$ et le rayon est $r = 5$.</p>"
        },
        {
          "question": "2) Vérifier que le point $A(5;7)$ appartient au cercle.",
          "reponse": "<p>$(5-2)^2 + (7-3)^2 = 3^2 + 4^2 = 9 + 16 = 25 = r^2$.</p><p>Donc $A$ appartient au cercle.</p>"
        },
        {
          "question": "3) Déterminer l'équation de la tangente au cercle au point $A$.",
          "reponse": "<p>La tangente en $A$ a pour équation : $(x_A - x_0)(x - x_0) + (y_A - y_0)(y - y_0) = r^2$.</p><p>Avec $x_0=2, y_0=3$ : $3(x-2) + 4(y-3) = 25$.</p><p>$3x - 6 + 4y - 12 = 25 \\Rightarrow 3x + 4y - 43 = 0$.</p>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
