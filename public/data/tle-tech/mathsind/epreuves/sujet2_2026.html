<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Mathématiques Industrielles",
  "classe": "Tle technique",
  "sequence": "Séquence 2",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Nombres complexes et électricité",
      "points": "5 pts",
      "enonce": "<p>Dans un circuit électrique, l'impédance complexe \( Z \) d'un dipôle est donnée par \( Z = 4 + 3i \) en ohms.</p><p>1) Déterminer le module et l'argument de \( Z \).</p><p>2) Calculer \( Z^2 \) sous forme algébrique.</p><p>3) Déterminer les racines carrées de \( Z \).</p>",
      "questions": [
        {
          "question": "1) Déterminer le module \( |Z| \) et l'argument \( \\arg(Z) \) de \( Z = 4 + 3i \).",
          "reponse": "<p><strong>Réponse :</strong></p><p>\( |Z| = \\sqrt{4^2 + 3^2} = \\sqrt{16 + 9} = 5 \).</p><p>\( \\arg(Z) = \\arctan\\left(\\dfrac{3}{4}\\right) \\approx 0,6435 \\text{ rad} \\).</p><p>Donc \( Z = 5e^{i\\theta} \) avec \( \\theta = \\arctan(3/4) \\).</p>"
        },
        {
          "question": "2) Calculer \( Z^2 \) sous forme algébrique.",
          "reponse": "<p><strong>Réponse :</strong></p><p>\( Z^2 = (4 + 3i)^2 = 16 + 24i + 9i^2 = 16 + 24i - 9 = 7 + 24i \\).</p>"
        },
        {
          "question": "3) Déterminer les racines carrées de \( Z \).",
          "reponse": "<p><strong>Réponse :</strong></p><p>On cherche \( w = a + ib \) tel que \( w^2 = 4 + 3i \\).</p><p>\( \\begin{cases} a^2 - b^2 = 4 \\\\ 2ab = 3 \\end{cases} \)</p><p>De plus \( a^2 + b^2 = |Z| = 5 \\).</p><p>Donc \( a^2 = \\dfrac{5 + 4}{2} = \\dfrac{9}{2} \\), \( a = \\pm \\dfrac{3}{\\sqrt{2}} \\).</p><p>\( b^2 = \\dfrac{5 - 4}{2} = \\dfrac{1}{2} \\), \( b = \\pm \\dfrac{1}{\\sqrt{2}} \\).</p><p>Comme \( 2ab = 3 > 0 \\), \( a \) et \( b \) sont de même signe.</p><p>Les racines sont : \( w_1 = \\dfrac{3}{\\sqrt{2}} + \\dfrac{i}{\\sqrt{2}} \\) et \( w_2 = -\\dfrac{3}{\\sqrt{2}} - \\dfrac{i}{\\sqrt{2}} \\).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Limites et continuité",
      "points": "4 pts",
      "enonce": "<p>On considère la fonction \( f \) définie par \( f(x) = \\dfrac{x^2 - 1}{x - 1} \) pour \( x \\neq 1 \\).</p><p>1) Déterminer \( \\lim_{x \\to 1} f(x) \\).</p><p>2) Prolonger \( f \) par continuité en \( x = 1 \\).</p><p>3) Résoudre l'équation \( f(x) = 3 \) sur \( \\mathbb{R} \\setminus \\{1\\} \\).</p>",
      "questions": [
        {
          "question": "1) Déterminer la limite de \( f(x) = \\dfrac{x^2 - 1}{x - 1} \) lorsque \( x \\to 1 \\).",
          "reponse": "<p><strong>Réponse :</strong></p><p>On factorise : \( x^2 - 1 = (x - 1)(x + 1) \\).</p><p>Pour \( x \\neq 1 \\), \( f(x) = x + 1 \\).</p><p>Donc \( \\lim_{x \\to 1} f(x) = \\lim_{x \\to 1} (x + 1) = 2 \\).</p>"
        },
        {
          "question": "2) Prolonger \( f \) par continuité en \( x = 1 \\).",
          "reponse": "<p><strong>Réponse :</strong></p><p>On définit \( F(1) = 2 \\) et \( F(x) = \\dfrac{x^2 - 1}{x - 1} \) pour \( x \\neq 1 \\).</p><p>\( F \) est alors continue en 1 car \( \\lim_{x \\to 1} F(x) = F(1) = 2 \\).</p>"
        },
        {
          "question": "3) Résoudre \( f(x) = 3 \) sur \( \\mathbb{R} \\setminus \\{1\\} \\).",
          "reponse": "<p><strong>Réponse :</strong></p><p>\( \\dfrac{x^2 - 1}{x - 1} = 3 \\) pour \( x \\neq 1 \\).</p><p>\( x + 1 = 3 \\) donc \( x = 2 \\).</p><p>La solution est \( x = 2 \\).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Dérivation et étude de fonction",
      "points": "6 pts",
      "enonce": "<p>On considère la fonction \( f(x) = \\dfrac{x^2 - 3x + 2}{x - 1} \\).</p><p>1) Déterminer l'ensemble de définition de \( f \\).</p><p>2) Calculer \( f'(x) \\) et dresser le tableau de variation de \( f \\).</p><p>3) Déterminer les asymptotes éventuelles de la courbe \( \\mathcal{C}_f \\).</p>",
      "questions": [
        {
          "question": "1) Déterminer le domaine de définition de \( f \\).",
          "reponse": "<p><strong>Réponse :</strong></p><p>Le dénominateur \( x - 1 \) s'annule pour \( x = 1 \\).</p><p>Donc \( \\mathcal{D}_f = \\mathbb{R} \\setminus \\{1\\} = ]-\\infty; 1[ \\cup ]1; +\\infty[ \\).</p>"
        },
        {
          "question": "2) Calculer \( f'(x) \\) et dresser le tableau de variation de \( f \\).",
          "reponse": "<p><strong>Réponse :</strong></p><p>On factorise le numérateur : \( x^2 - 3x + 2 = (x - 1)(x - 2) \\).</p><p>Pour \( x \\neq 1 \\), \( f(x) = x - 2 \\).</p><p>Donc \( f'(x) = 1 \\) pour tout \( x \\neq 1 \\).</p><p>\( f \) est strictement croissante sur \( ]-\\infty; 1[ \\) et sur \( ]1; +\\infty[ \\).</p><p>Tableau de variation :</p><div style='overflow-x: auto;'><table style='width: 100%; border-collapse: collapse; text-align: center;'><tr><td style='padding: 8px; border: 1px solid #ddd;'>x</td><td style='padding: 8px; border: 1px solid #ddd;'>-∞</td><td style='padding: 8px; border: 1px solid #ddd;'>1</td><td style='padding: 8px; border: 1px solid #ddd;'>+∞</td></tr><tr><td style='padding: 8px; border: 1px solid #ddd; background: #e3f2fd;'>f'(x)</td><td style='padding: 8px; border: 1px solid #ddd;'>+</td><td style='padding: 8px; border: 1px solid #ddd;'>||</td><td style='padding: 8px; border: 1px solid #ddd;'>+</td></tr><tr><td style='padding: 8px; border: 1px solid #ddd; background: #e3f2fd;'>f(x)</td><td style='padding: 8px; border: 1px solid #ddd;'>↗</td><td style='padding: 8px; border: 1px solid #ddd;'>||</td><td style='padding: 8px; border: 1px solid #ddd;'>↗</td></tr></table></div>"
        },
        {
          "question": "3) Déterminer les asymptotes éventuelles.",
          "reponse": "<p><strong>Réponse :</strong></p><p>On a \( f(x) = x - 2 \\) pour \( x \\neq 1 \\).</p><p>\( \\lim_{x \\to 1^+} f(x) = \\lim_{x \\to 1^+} (x - 2) = -1 \\)</p><p>\( \\lim_{x \\to 1^-} f(x) = \\lim_{x \\to 1^-} (x - 2) = -1 \\)</p><p>Donc il y a un trou (point exclu) en \( (1; -1) \\) et pas d'asymptote verticale.</p><p>Comme \( f \\) est une fonction affine (pour \( x \\neq 1 \\)), il n'y a pas d'autre asymptote.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Primitives et intégration",
      "points": "5 pts",
      "enonce": "<p>On considère la fonction \( f(x) = 3x^2 - 2x + 1 \\).</p><p>1) Déterminer une primitive \( F \\) de \( f \\).</p><p>2) Calculer \( \\displaystyle\\int_0^2 f(x) \\, dx \\).</p><p>3) Interpréter géométriquement l'intégrale obtenue.</p>",
      "questions": [
        {
          "question": "1) Déterminer une primitive \( F \\) de \( f(x) = 3x^2 - 2x + 1 \\).",
          "reponse": "<p><strong>Réponse :</strong></p><p>\( F(x) = x^3 - x^2 + x + C \\), où \( C \\in \\mathbb{R} \\).</p>"
        },
        {
          "question": "2) Calculer \( \\displaystyle\\int_0^2 (3x^2 - 2x + 1) \\, dx \\).",
          "reponse": "<p><strong>Réponse :</strong></p><p>\( \\displaystyle\\int_0^2 (3x^2 - 2x + 1) \\, dx = [x^3 - x^2 + x]_0^2 \\)</p><p>\( = (8 - 4 + 2) - (0 - 0 + 0) = 6 \\).</p>"
        },
        {
          "question": "3) Interpréter géométriquement le résultat.",
          "reponse": "<p><strong>Réponse :</strong></p><p>L'intégrale \( \\displaystyle\\int_0^2 f(x) \\, dx = 6 \\) représente l'aire (en unités d'aire) du domaine compris entre la courbe \( y = f(x) \\), l'axe des abscisses, et les droites \( x = 0 \\) et \( x = 2 \\).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 5 : Fonction logarithme et exponentielle",
      "points": "4 pts",
      "enonce": "<p>Une entreprise modélise le nombre d'employés \( N(t) \) par la fonction \( N(t) = 50e^{0,05t} \\) où \( t \\) est le nombre d'années écoulées depuis 2020.</p><p>1) Combien y avait-il d'employés en 2020 ?</p><p>2) Combien y aura-t-il d'employés en 2025 ?</p><p>3) En quelle année l'entreprise comptera-t-elle 100 employés ?</p>",
      "questions": [
        {
          "question": "1) Combien y avait-il d'employés en 2020 ?",
          "reponse": "<p><strong>Réponse :</strong></p><p>En 2020, \( t = 0 \\) donc \( N(0) = 50e^{0} = 50 \\) employés.</p>"
        },
        {
          "question": "2) Combien y aura-t-il d'employés en 2025 ?",
          "reponse": "<p><strong>Réponse :</strong></p><p>En 2025, \( t = 5 \\) donc \( N(5) = 50e^{0,05 \\times 5} = 50e^{0,25} \\approx 50 \\times 1,284 = 64,2 \\) employés.</p><p>Soit environ 64 employés.</p>"
        },
        {
          "question": "3) En quelle année l'entreprise comptera-t-elle 100 employés ?",
          "reponse": "<p><strong>Réponse :</strong></p><p>On résout \( 50e^{0,05t} = 100 \\)</p><p>\( e^{0,05t} = 2 \\)</p><p>\( 0,05t = \\ln 2 \\)</p><p>\( t = \\dfrac{\\ln 2}{0,05} \\approx \\dfrac{0,693}{0,05} \\approx 13,86 \\)</p><p>L'entreprise comptera 100 employés environ 13,86 ans après 2020, soit au cours de l'année 2034.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 6 : Équation différentielle",
      "points": "4 pts",
      "enonce": "<p>On considère l'équation différentielle \( y' + 2y = 4 \\).</p><p>1) Résoudre cette équation différentielle.</p><p>2) Déterminer la solution vérifiant la condition initiale \( y(0) = 1 \\).</p>",
      "questions": [
        {
          "question": "1) Résoudre l'équation différentielle \( y' + 2y = 4 \\).",
          "reponse": "<p><strong>Réponse :</strong></p><p>L'équation est de la forme \( y' + ay = b \\) avec \( a = 2 \\) et \( b = 4 \\).</p><p>La solution générale est :</p><p>\( y(x) = Ce^{-2x} + \\dfrac{b}{a} = Ce^{-2x} + 2 \\).</p>"
        },
        {
          "question": "2) Déterminer la solution vérifiant \( y(0) = 1 \\).",
          "reponse": "<p><strong>Réponse :</strong></p><p>On a \( y(0) = C + 2 = 1 \\), donc \( C = -1 \\).</p><p>La solution particulière est \( y(x) = -e^{-2x} + 2 = 2 - e^{-2x} \\).</p>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
