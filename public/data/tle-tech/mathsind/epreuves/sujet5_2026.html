<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
 "matiere": "Mathématiques Industrielles",
 "classe": "Tle technique",
 "sequence": "Séquence 5",
 "anneeScolaire": "2025-2026",
 "exercices": [
   {
     "titre": "Exercice 1 : Équations et systèmes logarithmiques et exponentiels",
     "points": "5 pts",
     "enonce": "<p>Résoudre dans \\(\\mathbb{R}\\) les équations et inéquations suivantes. Le candidat devra préciser l'ensemble de définition avant toute résolution.</p>",
     "questions": [
       {
         "question": "<p><strong>1. a)</strong> (1.5 pt) Résoudre l'équation : \\(\\ln(x^2 - 4) = \\ln(3x - 2)\\).</p>",
         "reponse": "<p><strong>Solution :</strong></p><p><strong>1. a) Ensemble de définition :</strong> \\(x^2 - 4 > 0\\) et \\(3x - 2 > 0\\).</p><p>On a \\(x \\in ]-\\infty, -2[ \\cup ]2, +\\infty[\\) et \\(x > \\frac{2}{3}\\). Donc \\(D = ]2, +\\infty[\\).</p><p>Sur \\(D\\), l'équation équivaut à : \\(x^2 - 4 = 3x - 2\\).</p><p>\\(\\iff x^2 - 3x - 2 = 0\\).</p><p>\\(\\Delta = 9 + 8 = 17\\).</p><p>Les racines sont \\(x_1 = \\frac{3 - \\sqrt{17}}{2}\\) et \\(x_2 = \\frac{3 + \\sqrt{17}}{2}\\).</p><p>On a \\(x_1 \\approx -0.56 \\notin D\\) et \\(x_2 \\approx 3.56 \\in D\\).</p><p>La solution est donc : \\(S = \\left\\{ \\frac{3 + \\sqrt{17}}{2} \\right\\}\\).</p>"
       },
       {
         "question": "<p><strong>1. b)</strong> (1.5 pt) Résoudre l'inéquation : \\(e^{2x - 1} \\leq 5e^{x - 3}\\).</p>",
         "reponse": "<p><strong>Solution :</strong></p><p><strong>1. b)</strong> L'inéquation est définie sur \\(\\mathbb{R}\\).</p><p>\\(e^{2x - 1} \\leq 5e^{x - 3}\\)</p><p>\\(\\iff e^{2x - 1 - (x - 3)} \\leq 5\\)</p><p>\\(\\iff e^{x + 2} \\leq 5\\).</p><p>La fonction \\(\\ln\\) est strictement croissante, donc :</p><p>\\(\\iff x + 2 \\leq \\ln(5)\\).</p><p>D'où : \\(S = ]-\\infty, \\ln(5) - 2]\\).</p>"
       },
       {
         "question": "<p><strong>1. c)</strong> (2 pts) Résoudre le système d'équations :</p><div class='math-block'><div class='math'>$$ \\begin{cases} 2e^{x + y} = 8e^{3} \\\\ e^{2x - y} = e^{x - 2y} \\end{cases} $$</div></div>",
         "reponse": "<p><strong>Solution :</strong></p><p><strong>1. c) Domaine de définition :</strong> Les équations sont définies sur \\(\\mathbb{R}^2\\).</p><p>La première équation se simplifie :</p><p>\\(2e^{x + y} = 8e^{3} \\iff e^{x + y} = 4e^{3}\\).</p><p>En passant au logarithme : \\(x + y = \\ln(4e^{3}) = \\ln(4) + 3 = 3 + 2\\ln(2)\\).</p><p>La deuxième équation : \\(e^{2x - y} = e^{x - 2y} \\iff 2x - y = x - 2y\\).</p><p>\\(\\iff x + y = 0\\).</p><p>On a donc le système :</p><div class='math-block'><div class='math'>$$ \\begin{cases} x + y = 3 + 2\\ln(2) \\\\ x + y = 0 \\end{cases} $$</div></div><p>Ce système est incompatible (car \\(3 + 2\\ln(2) \\neq 0\\)).</p><p>Donc : \\(S = \\varnothing\\).</p>"
       }
     ]
   },
   {
     "titre": "Exercice 2 : Application à la biologie (Croissance bactérienne)",
     "type": "competence",
     "niveau": "hard",
     "points": "6 pts",
     "enonce": "<p>Dans un laboratoire de Yaoundé, une population de bactéries se développe dans une culture. La taille de la population \\(P(t)\\) (en milliers d'individus) à l'instant \\(t\\) (en heures) est modélisée par la fonction suivante :</p><div class='math-block'><div class='math'>$$ P(t) = \\frac{20}{1 + 3e^{-0.5t}} $$</div></div><p>où \\(t\\) est le temps écoulé depuis le début de l'expérience.</p>",
     "questions": [
       {
         "question": "<p><strong>2. a)</strong> (1.5 pt) Déterminer la population initiale \\(P(0)\\).</p>",
         "reponse": "<p><strong>2. a)</strong> \\(P(0) = \\frac{20}{1 + 3e^{0}} = \\frac{20}{1 + 3} = 5\\).</p><p>La population initiale est de 5 000 bactéries.</p>"
       },
       {
         "question": "<p><strong>2. b)</strong> (1.5 pt) En utilisant la fonction logarithme, déterminer le temps \\(t\\) au bout duquel la population atteindra 10 000 individus.</p>",
         "reponse": "<p><strong>2. b)</strong> On résout \\(P(t) = 10\\).</p><p>\\(\\frac{20}{1 + 3e^{-0.5t}} = 10 \\iff 1 + 3e^{-0.5t} = 2\\).</p><p>\\(\\iff 3e^{-0.5t} = 1 \\iff e^{-0.5t} = \\frac{1}{3}\\).</p><p>En passant au logarithme : \\(-0.5t = \\ln\\left(\\frac{1}{3}\\right) = -\\ln(3)\\).</p><p>Donc : \\(t = 2\\ln(3) \\approx 2.2\\) heures.</p>"
       },
       {
         "question": "<p><strong>2. c)</strong> (1.5 pt) Quelle est la population maximale que peut atteindre cette culture ? Justifier.</p>",
         "reponse": "<p><strong>2. c)</strong> \\(\\lim\\limits_{t \\to +\\infty} e^{-0.5t} = 0\\).</p><p>Donc \\(\\lim\\limits_{t \\to +\\infty} P(t) = \\frac{20}{1 + 0} = 20\\).</p><p>La population maximale est de 20 000 bactéries. Cette limite est la capacité limite du milieu.</p>"
       },
       {
         "question": "<p><strong>2. d)</strong> (1.5 pt) Calculer la dérivée \\(P'(t)\\) et en déduire le sens de variation de \\(P\\). Interpréter le résultat.</p>",
         "reponse": "<p><strong>2. d)</strong> On a \\(P(t) = 20 (1 + 3e^{-0.5t})^{-1}\\).</p><p>La dérivée de \\(e^{-0.5t}\\) est \\(-0.5e^{-0.5t}\\).</p><p>\\(P'(t) = -20 \\times (1 + 3e^{-0.5t})^{-2} \\times 3 \\times (-0.5)e^{-0.5t}\\).</p><p>\\(P'(t) = \\frac{30e^{-0.5t}}{(1 + 3e^{-0.5t})^{2}}\\).</p><p>Pour tout \\(t \\geq 0\\), \\(P'(t) > 0\\). La fonction \\(P\\) est strictement croissante sur \\([0, +\\infty[\\).</p><p>La population augmente constamment jusqu'à sa valeur maximale.</p>"
       }
     ]
   },
   {
     "titre": "Exercice 3 : Application à l'électrochimie (Loi de Nernst)",
     "type": "competence",
     "niveau": "hard",
     "points": "5 pts",
     "enonce": "<p>En électrochimie, la loi de Nernst permet de calculer le potentiel d'une électrode. Pour une solution de concentration \\(C\\) en ions \\(\\text{Cu}^{2+}\\) à une température \\(T = 298 \\, \\text{K}\\), le potentiel est donné par :</p><div class='math-block'><div class='math'>$$ E = E^0 + \\frac{0.06}{n} \\log_{10}(C) $$</div></div><p>où \\(E^0 = 0.34 \\, \\text{V}\\) est le potentiel standard de l'électrode de cuivre et \\(n=2\\) est le nombre d'électrons échangés.</p>",
     "questions": [
       {
         "question": "<p><strong>3. a)</strong> (1.5 pt) Déterminer la concentration \\(C\\) en ions \\(\\text{Cu}^{2+}\\) pour que le potentiel \\(E\\) soit égal à \\(0.28 \\, \\text{V}\\). Arrondir le résultat à \\(10^{-2}\\) près.</p>",
         "reponse": "<p><strong>3. a)</strong> On résout l'équation \\(E = 0.28\\).</p><p>\\(0.34 + \\frac{0.06}{2} \\log_{10}(C) = 0.28\\).</p><p>\\(0.03 \\log_{10}(C) = -0.06\\).</p><p>\\(\\log_{10}(C) = -2\\).</p><p>Donc \\(C = 10^{-2} = 0.01 \\, \\text{mol.L}^{-1}\\).</p>"
       },
       {
         "question": "<p><strong>3. b)</strong> (1.5 pt) Quelle est la concentration minimale \\(C\\) pour que le potentiel \\(E\\) soit supérieur ou égal à \\(0.30 \\, \\text{V}\\) ?</p>",
         "reponse": "<p><strong>3. b)</strong> On résout l'inéquation \\(E \\geq 0.30\\).</p><p>\\(0.34 + 0.03 \\log_{10}(C) \\geq 0.30\\).</p><p>\\(0.03 \\log_{10}(C) \\geq -0.04\\).</p><p>\\(\\log_{10}(C) \\geq -\\frac{4}{3}\\).</p><p>La fonction \\(x \\mapsto 10^{x}\\) est strictement croissante, donc :</p><p>\\(C \\geq 10^{-\\frac{4}{3}} \\approx 0.0464\\).</p><p>La concentration minimale est donc \\(C \\geq 0.05 \\, \\text{mol.L}^{-1}\\).</p>"
       },
       {
         "question": "<p><strong>3. c)</strong> (2 pts) En utilisant la formule de changement de base \\(\\log_{10}(x) = \\frac{\\ln(x)}{\\ln(10)}\\), exprimer \\(E\\) en fonction de \\(\\ln(C)\\).</p>",
         "reponse": "<p><strong>3. c)</strong> On remplace \\(\\log_{10}(C)\\) :</p><p>\\(E = E^0 + \\frac{0.06}{n} \\times \\frac{\\ln(C)}{\\ln(10)}\\).</p><p>Avec \\(E^0 = 0.34\\), \\(n = 2\\) et \\(\\ln(10) \\approx 2.3026\\), on obtient :</p><p>\\(E = 0.34 + \\frac{0.03}{\\ln(10)} \\ln(C) \\approx 0.34 + 0.013 \\ln(C)\\).</p>"
       }
     ]
   },
   {
     "titre": "Exercice 4 : Problème de physique (Décroissance radioactive)",
     "points": "4 pts",
     "enonce": "<p>Le Carbone 14 (\\(^{14}C\\)) est un isotope radioactif utilisé en archéologie pour dater des fossiles. Sa loi de décroissance est donnée par :</p><div class='math-block'><div class='math'>$$ N(t) = N_0 e^{-\\lambda t} $$</div></div><p>où \\(N_0\\) est le nombre initial de noyaux, \\(\\lambda = 1.21 \\times 10^{-4} \\, \\text{an}^{-1}\\) est la constante radioactive, et \\(t\\) est le temps en années.</p>",
     "questions": [
       {
         "question": "<p><strong>4. a)</strong> (1.5 pt) Montrer que la demi-vie \\(T_{1/2}\\) du Carbone 14 est donnée par \\(T_{1/2} = \\frac{\\ln(2)}{\\lambda}\\). Calculer sa valeur numérique.</p>",
         "reponse": "<p><strong>4. a)</strong> La demi-vie est le temps \\(T_{1/2}\\) tel que \\(N(T_{1/2}) = \\frac{N_0}{2}\\).</p><p>\\(N_0 e^{-\\lambda T_{1/2}} = \\frac{N_0}{2} \\iff e^{-\\lambda T_{1/2}} = \\frac{1}{2}\\).</p><p>En passant au logarithme : \\(-\\lambda T_{1/2} = \\ln\\left(\\frac{1}{2}\\right) = -\\ln(2)\\).</p><p>Donc \\(T_{1/2} = \\frac{\\ln(2)}{\\lambda}\\).</p><p>Application numérique : \\(T_{1/2} = \\frac{\\ln(2)}{1.21 \\times 10^{-4}} \\approx 5728 \\, \\text{ans}\\).</p>"
       },
       {
         "question": "<p><strong>4. b)</strong> (1.5 pt) Un fossile contient 25 % de la quantité initiale de Carbone 14. Déterminer son âge.</p>",
         "reponse": "<p><strong>4. b)</strong> On résout \\(N(t) = 0.25 N_0\\).</p><p>\\(N_0 e^{-\\lambda t} = 0.25 N_0 \\iff e^{-\\lambda t} = 0.25\\).</p><p>\\(-\\lambda t = \\ln(0.25) = -\\ln(4)\\).</p><p>\\(t = \\frac{\\ln(4)}{\\lambda} = \\frac{2\\ln(2)}{\\lambda} = 2 T_{1/2}\\).</p><p>Donc \\(t \\approx 11456 \\, \\text{ans}\\).</p>"
       },
       {
         "question": "<p><strong>4. c)</strong> (1 pt) Si un échantillon a un âge de 10 000 ans, quel pourcentage de la quantité initiale de Carbone 14 reste-t-il ?</p>",
         "reponse": "<p><strong>4. c)</strong> On calcule \\(\\frac{N(10000)}{N_0} = e^{-\\lambda \\times 10000}\\).</p><p>\\(\\frac{N(10000)}{N_0} = e^{-1.21 \\times 10^{-4} \\times 10000} = e^{-1.21} \\approx 0.298\\).</p><p>Il reste environ \\(29.8\\%\\) du Carbone 14 initial.</p>"
       }
     ]
   }
 ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
