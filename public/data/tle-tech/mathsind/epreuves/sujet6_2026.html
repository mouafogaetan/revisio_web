<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
 "matiere": "Mathématiques Industrielles",
 "classe": "Tle Technique",
 "sequence": "Séquence 6",
 "anneeScolaire": "2025-2026",
 "exercices": [
   {
     "titre": "Exercice 1 : Limites et continuité",
     "points": "4 pts",
     "enonce": "<div style='padding: 15px; background-color: #f8f9fa; border-radius: 8px; font-family: Arial, sans-serif; color: #333;'>On considère la fonction <span style='font-weight: bold;'>f</span> définie sur <span style='font-weight: bold;'>R</span> par : <div class='math-block' style='text-align: center;'><div class='math' style='font-size: 1.2rem; color: #000;'>$$f(x) = \\frac{2x^2 + 3x - 5}{x - 1}$$</div></div><ol style='margin-top: 10px; padding-left: 20px;'><li>Déterminer l'ensemble de définition de <span style='font-weight: bold;'>f</span>.</li><li>Calculer la limite de <span style='font-weight: bold;'>f</span> en <span style='font-weight: bold;'>1</span>.</li><li>La fonction <span style='font-weight: bold;'>f</span> est-elle continue en <span style='font-weight: bold;'>1</span> ? Justifier.</li></ol></div>",
     "questions": [
       {
         "question": "1) Déterminer l'ensemble de définition de \\( f \\).",
         "reponse": "\\( D_f = \\mathbb{R} \\setminus \\{1\\} \\)"
       },
       {
         "question": "2) Calculer \\( \\lim\\limits_{x \\to 1} f(x) \\).",
         "reponse": "\\( \\lim\\limits_{x \\to 1} \\frac{2x^2 + 3x - 5}{x - 1} = \\lim\\limits_{x \\to 1} \\frac{(x-1)(2x+5)}{x-1} = \\lim\\limits_{x \\to 1} (2x+5) = 7 \\)"
       },
       {
         "question": "3) La fonction \\( f \\) est-elle continue en \\( 1 \\) ? Justifier.",
         "reponse": "Non, car \\( f(1) \\) n'est pas défini bien que la limite existe. La fonction est prolongeable par continuité en posant \\( f(1) = 7 \\)."
       }
     ]
   },
   {
     "titre": "Exercice 2 : Dérivation et inégalité des accroissements finis",
     "points": "4 pts",
     "enonce": "<div style='padding: 15px; background-color: #f8f9fa; border-radius: 8px; font-family: Arial, sans-serif; color: #333;'>Soit <span style='font-weight: bold;'>g</span> la fonction définie sur <span style='font-weight: bold;'>[0, 1]</span> par <span style='font-weight: bold;'>g(x) = ln(1 + x)</span>.<ol style='margin-top: 10px; padding-left: 20px;'><li>Vérifier que <span style='font-weight: bold;'>g</span> satisfait les conditions de l'inégalité des accroissements finis.</li><li>Montrer que pour tout <span style='font-weight: bold;'>x</span> dans <span style='font-weight: bold;'>[0, 1]</span>, <span style='font-weight: bold;'>|g'(x)| ≤ 1</span>.</li><li>En déduire un encadrement de <span style='font-weight: bold;'>ln(2)</span>.</li></ol></div>",
     "questions": [
       {
         "question": "1) Vérifier que \\( g \\) satisfait les conditions de l'inégalité des accroissements finis.",
         "reponse": "La fonction \\( g(x) = \\ln(1+x) \\) est continue sur \\( [0,1] \\) et dérivable sur \\( ]0,1[ \\) car \\( x \\mapsto 1+x \\) est positive et dérivable, et \\( \\ln \\) est dérivable sur \\( ]0,+\\infty[ \\)."
       },
       {
         "question": "2) Montrer que pour tout \\( x \\in [0, 1] \\), \\( |g'(x)| \\le 1 \\).",
         "reponse": "On a \\( g'(x) = \\frac{1}{1+x} \\). Pour \\( x \\in [0, 1] \\), \\( 1 \\le 1+x \\le 2 \\), donc \\( \\frac{1}{2} \\le \\frac{1}{1+x} \\le 1 \\). Ainsi, \\( |g'(x)| \\le 1 \\)."
       },
       {
         "question": "3) En déduire un encadrement de \\( \\ln(2) \\).",
         "reponse": "D'après l'inégalité des accroissements finis, \\( |g(1) - g(0)| \\le M |1-0| \\) avec \\( M = 1 \\). Donc \\( |\\ln(2) - \\ln(1)| \\le 1 \\), soit \\( |\\ln(2)| \\le 1 \\). On a aussi \\( \\ln(2) \\ge 0 \\), donc \\( 0 \\le \\ln(2) \\le 1 \\)."
       }
     ]
   },
   {
     "titre": "Exercice 3 : Primitives et intégration",
     "points": "4 pts",
     "enonce": "<div style='padding: 15px; background-color: #f8f9fa; border-radius: 8px; font-family: Arial, sans-serif; color: #333;'>On donne la fonction <span style='font-weight: bold;'>h</span> définie sur <span style='font-weight: bold;'>R</span> par <span style='font-weight: bold;'>h(x) = 3x^2 - 2x + 1</span>.<ol style='margin-top: 10px; padding-left: 20px;'><li>Déterminer la primitive <span style='font-weight: bold;'>H</span> de <span style='font-weight: bold;'>h</span> telle que <span style='font-weight: bold;'>H(1) = 4</span>.</li><li>Calculer l'intégrale <span style='font-weight: bold;'>I = ∫_0^2 h(x) dx</span>.</li><li>Interpréter géométriquement le résultat obtenu.</li></ol></div>",
     "questions": [
       {
         "question": "1) Déterminer la primitive \\( H \\) de \\( h \\) telle que \\( H(1) = 4 \\).",
         "reponse": "Les primitives de \\( h \\) sont \\( H(x) = x^3 - x^2 + x + C \\). Or \\( H(1) = 1 - 1 + 1 + C = 4 \\) donc \\( C = 3 \\). Ainsi, \\( H(x) = x^3 - x^2 + x + 3 \\)."
       },
       {
         "question": "2) Calculer \\( I = \\int_0^2 h(x) \\, dx \\).",
         "reponse": "\\( I = \\int_0^2 (3x^2 - 2x + 1) \\, dx = [x^3 - x^2 + x]_0^2 = (8 - 4 + 2) - (0) = 6 \\)"
       },
       {
         "question": "3) Interpréter géométriquement le résultat obtenu.",
         "reponse": "Le résultat \\( I = 6 \\) représente l'aire (en unités d'aire) de la surface délimitée par la courbe de \\( h \\), l'axe des abscisses et les droites \\( x=0 \\) et \\( x=2 \\)."
       }
     ]
   },
   {
     "titre": "Exercice 4 : Fonctions exponentielles et logarithmes",
     "points": "4 pts",
     "enonce": "<div style='padding: 15px; background-color: #f8f9fa; border-radius: 8px; font-family: Arial, sans-serif; color: #333;'>Résoudre dans <span style='font-weight: bold;'>R</span> les équations et inéquations suivantes :<ol style='margin-top: 10px; padding-left: 20px;'><li><span style='font-weight: bold;'>e^{2x} = 7</span></li><li><span style='font-weight: bold;'>ln(3x - 1) = 2</span></li><li><span style='font-weight: bold;'>e^{x} > 5</span></li><li><span style='font-weight: bold;'>ln(x) ≤ 0</span></li></ol></div>",
     "questions": [
       {
         "question": "1) Résoudre \\( e^{2x} = 7 \\).",
         "reponse": "En prenant le logarithme népérien des deux côtés : \\( 2x = \\ln(7) \\), donc \\( x = \\frac{\\ln(7)}{2} \\)."
       },
       {
         "question": "2) Résoudre \\( \\ln(3x - 1) = 2 \\).",
         "reponse": "L'équation est définie pour \\( 3x - 1 > 0 \\), soit \\( x > \\frac{1}{3} \\). En passant à l'exponentielle : \\( 3x - 1 = e^2 \\), donc \\( x = \\frac{e^2 + 1}{3} \\). Cette valeur est bien supérieure à \\( \\frac{1}{3} \\)."
       },
       {
         "question": "3) Résoudre \\( e^x > 5 \\).",
         "reponse": "En prenant le logarithme népérien (strictement croissant) : \\( x > \\ln(5) \\)."
       },
       {
         "question": "4) Résoudre \\( \\ln(x) \\le 0 \\).",
         "reponse": "L'équation est définie pour \\( x > 0 \\). \\( \\ln(x) \\le 0 \\iff \\ln(x) \\le \\ln(1) \\), donc \\( 0 < x \\le 1 \\)."
       }
     ]
   },
   {
     "titre": "Exercice 5 : Équations différentielles",
     "points": "4 pts",
     "enonce": "<div style='padding: 15px; background-color: #f8f9fa; border-radius: 8px; font-family: Arial, sans-serif; color: #333;'>Résoudre les équations différentielles suivantes :<ol style='margin-top: 10px; padding-left: 20px;'><li><span style='font-weight: bold;'>y' = 3y</span></li><li><span style='font-weight: bold;'>y' + 2y = 4</span></li><li><span style='font-weight: bold;'>y'' - 3y' + 2y = 0</span></li></ol></div>",
     "questions": [
       {
         "question": "1) Résoudre \\( y' = 3y \\).",
         "reponse": "La solution générale est \\( y = C e^{3x} \\), où \\( C \\in \\mathbb{R} \\)."
       },
       {
         "question": "2) Résoudre \\( y' + 2y = 4 \\).",
         "reponse": "L'équation est de la forme \\( y' = -2y + 4 \\). La solution générale est \\( y = C e^{-2x} + 2 \\), où \\( C \\in \\mathbb{R} \\)."
       },
       {
         "question": "3) Résoudre \\( y'' - 3y' + 2y = 0 \\).",
         "reponse": "L'équation caractéristique est \\( r^2 - 3r + 2 = 0 \\), dont les racines sont \\( r_1 = 1 \\) et \\( r_2 = 2 \\). La solution générale est \\( y = C_1 e^{x} + C_2 e^{2x} \\), où \\( C_1, C_2 \\in \\mathbb{R} \\)."
       }
     ]
   }
 ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
