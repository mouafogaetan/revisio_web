<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Présentation mobile</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' },
            options: { skipHtmlTypes: 'script' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 500px;
        margin: 0 auto;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    .slide-header {
        flex-shrink: 0;
        padding: 18px 16px 10px 16px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        z-index: 10;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .slide-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
    }

    .content-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 18px 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        flex-shrink: 0;
    }

    .content-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .content-card li {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        line-height: 1.5;
    }

    .content-card li:last-child {
        border-bottom: none;
    }

    .bullet-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
    }

    .math-block {
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        overflow-x: auto;
        flex-shrink: 0;
        margin: 4px 0;
    }

    .math-block .math {
        font-size: 1.2rem;
        color: #e2e8f0;
    }

    .note-box {
        background: rgba(96, 165, 250, 0.08);
        border-left: 4px solid #60a5fa;
        padding: 12px 16px;
        border-radius: 12px;
        font-style: italic;
        font-size: 0.9rem;
        color: #cbd5e1;
        flex-shrink: 0;
    }

    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        border-radius: 0;
        flex-direction: column;
    }

    .loading-card {
        background: #1e293b;
        padding: 32px 28px;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #334155;
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px auto;
    }

    .loading-text {
        font-weight: 600;
        font-size: 1.1rem;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    .loading-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 16px;
    }
    .loading-progress {
        height: 3px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        animation: loadingProgress 30s ease-out forwards;
    }

    .loading-timeout {
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 12px;
    }

    .btn-cancel-loading {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 40px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #f87171;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }

    .btn-cancel-loading:active {
        transform: scale(0.94);
        background: rgba(239, 68, 68, 0.25);
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
    }

    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .slide-counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255,255,255,0.05);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(255,255,255,0.04);
    }

    .status-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 30px;
        background: rgba(96, 165, 250, 0.12);
        color: #93bbfc;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
    }

    .status-badge .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: pulse-dot 1.2s infinite;
        flex-shrink: 0;
    }

    .status-badge.idle .dot {
        animation: none;
        background: #64748b;
    }
    .status-badge.speaking .dot {
        background: #34d399;
        animation: pulse-dot 0.8s infinite;
    }
    .status-badge.error .dot {
        background: #f87171;
        animation: none;
    }
    .status-badge.paused .dot {
        animation: none;
        background: #fbbf24;
    }
    .status-badge.waiting .dot {
        animation: pulse-dot 1.5s infinite;
        background: #fbbf24;
    }
    .status-badge.loading .dot {
        animation: pulse-dot 0.5s infinite;
        background: #60a5fa;
    }

    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.7); }
    }

    .footer-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(255,255,255,0.1);
    }

    .btn-secondary {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-play {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
        min-width: 80px;
        justify-content: center;
    }
    .btn-play:active {
        background: rgba(52, 211, 153, 0.25);
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
    }

    .auto-indicator {
        font-size: 0.65rem;
        color: #64748b;
        text-align: center;
        letter-spacing: 0.3px;
        padding: 2px 0;
    }

    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.2rem;
        }
        .content-card li {
            font-size: 0.9rem;
            padding: 8px 0;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .btn-play {
            min-width: 60px;
        }
        .footer-buttons {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
        .loading-card {
            padding: 20px 16px;
        }
        .math-block .math {
            font-size: 1rem;
        }
    }

    @media (min-width: 600px) {
        .app-container {
            max-width: 480px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
        .loading-overlay {
            border-radius: 32px;
        }
    }

    /* Mode jour (par défaut) */
    html, body {
        background: #f0f4f8 !important;
        color: #1a202c !important;
    }
    .app-container {
        background: linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%) !important;
    }
    .slide-header {
        background: rgba(255, 255, 255, 0.85) !important;
        border-bottom: 1px solid rgba(0,0,0,0.08) !important;
    }
    .slide-header h1 {
        background: linear-gradient(135deg, #2b6cb0, #6b46c1) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        background-clip: text !important;
    }
    .slide-footer {
        background: rgba(255, 255, 255, 0.9) !important;
        border-top: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card {
        background: rgba(255,255,255,0.8) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card li {
        border-bottom: 1px solid rgba(0,0,0,0.05) !important;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.12) !important;
        border-left: 4px solid #4299e1 !important;
        color: #2c3e50 !important;
    }
    .math-block {
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .math-block .math {
        color: #2d3748 !important;
    }
    .slide-counter {
        color: #4a5568 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .status-badge {
        background: rgba(96, 165, 250, 0.15) !important;
        color: #2b6cb0 !important;
        border: 1px solid rgba(96, 165, 250, 0.15) !important;
    }
    .btn {
        color: #2d3748 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .btn-secondary {
        background: rgba(0,0,0,0.04) !important;
        border-color: rgba(0,0,0,0.08) !important;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15) !important;
        border-color: rgba(52, 211, 153, 0.2) !important;
        color: #38a169 !important;
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15) !important;
        border-color: rgba(251, 191, 36, 0.2) !important;
        color: #d69e2e !important;
    }
    .auto-indicator {
        color: #718096 !important;
    }
    .loading-card {
        background: #ffffff !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .loading-text {
        color: #1a202c !important;
    }
    .loading-sub {
        color: #4a5568 !important;
    }
</style>
</head>
<body>

<div class="app-container">

    <header class="slide-header">
        <h1 id="slideTitle">Chargement...</h1>
    </header>

    <main class="slide-body" id="slideBody"></main>

    <!-- LOADING OVERLAY AVEC BOUTON ANNULER -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Préparation vocale...</div>
            <div class="loading-sub" id="loadingSub">Synthèse en cours</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loadingProgressBar"></div>
            </div>
            <div class="loading-timeout" id="loadingTimeout">⏱️ 30 secondes maximum</div>
            <button class="btn-cancel-loading" id="cancelLoadingBtn">
                <span>✕</span> Annuler
            </button>
        </div>
    </div>

    <footer class="slide-footer">
        <div class="footer-top">
            <span class="slide-counter" id="slideCounter">1 / 3</span>
            <span class="status-badge idle" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">Prêt</span>
            </span>
        </div>

        <div class="footer-buttons">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-secondary" id="replayBtn">
                <span class="btn-icon">🔁</span> <span class="btn-label">Relire</span>
            </button>
            <button class="btn btn-play" id="playBtn">
                <span class="btn-icon">▶</span> <span class="btn-label">Play</span>
            </button>
        </div>

        <div class="auto-indicator" id="autoIndicator">⏸ Lecture manuelle</div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // SLIDES
    // ================================================================
    const slides = [
  {
    "titre": "Introduction à l'étude des fonctions",
    "contenu": "<div style='background: linear-gradient(135deg, #1a365d, #2b6cb0); color: white; padding: 20px; border-radius: 16px;'>\n  <h2 style='color: #fbd38d; font-size: 1.3em; margin-top: 0;'>📈 Étudier une fonction : pourquoi ?</h2>\n  <p style='font-size: 1em; line-height: 1.6;'>L'étude des fonctions est essentielle dans de nombreux domaines :</p>\n  <div style='display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px;'>\n    <div style='background: rgba(255,255,255,0.15); padding: 12px; border-radius: 8px; text-align: center;'>\n      <div style='font-size: 2em;'>🏗️</div>\n      <p style='margin: 4px 0 0; font-size: 0.9em;'>Génie civil (optimisation des structures)</p>\n    </div>\n    <div style='background: rgba(255,255,255,0.15); padding: 12px; border-radius: 8px; text-align: center;'>\n      <div style='font-size: 2em;'>⚡</div>\n      <p style='margin: 4px 0 0; font-size: 0.9em;'>Électricité (analyse des signaux)</p>\n    </div>\n    <div style='background: rgba(255,255,255,0.15); padding: 12px; border-radius: 8px; text-align: center;'>\n      <div style='font-size: 2em;'>💰</div>\n      <p style='margin: 4px 0 0; font-size: 0.9em;'>Économie (coûts, bénéfices)</p>\n    </div>\n    <div style='background: rgba(255,255,255,0.15); padding: 12px; border-radius: 8px; text-align: center;'>\n      <div style='font-size: 2em;'>🔬</div>\n      <p style='margin: 4px 0 0; font-size: 0.9em;'>Physique (trajectoires, phénomènes)</p>\n    </div>\n  </div>\n  <p style='margin-top: 12px; font-style: italic; text-align: center;'>\"Une fonction bien étudiée est une fonction bien comprise !\"</p>\n</div>",
    "texteParle": "Bonjour à tous. Aujourd'hui, nous allons approfondir l'étude des fonctions numériques. Étudier une fonction, c'est comprendre son comportement : où elle est croissante ou décroissante, quels sont ses extremums, comment elle se comporte à l'infini, et comment tracer sa courbe représentative. Ces compétences sont essentielles dans de nombreux domaines techniques et industriels. Nous allons voir comment mener cette étude de manière systématique.",
    "note": "L'étude complète d'une fonction permet de comprendre son comportement et de tracer sa courbe représentative."
  },
  {
    "titre": "Le plan d'étude d'une fonction",
    "contenu": "<div style='background: #f0f4f8; color: #1e293b; padding: 18px; border-radius: 12px;'>\n  <h3 style='color: #2b6cb0; margin-top: 0;'>📋 Les étapes de l'étude d'une fonction</h3>\n  <div style='background: white; padding: 16px; border-radius: 8px; border-left: 4px solid #2b6cb0;'>\n    <p style='font-size: 1em; line-height: 1.6;'>Pour étudier une fonction f, on suit généralement les étapes suivantes :</p>\n    <ol style='font-size: 0.95em; line-height: 1.8;'>\n      <li><strong>Domaine de définition</strong> : ensemble des x où f(x) existe.</li>\n      <li><strong>Parité et périodicité</strong> (si présentes) pour réduire l'étude.</li>\n      <li><strong>Limites aux bornes</strong> du domaine et comportement asymptotique.</li>\n      <li><strong>Dérivée première</strong> et <strong>signe</strong> de f'(x) → variations de f.</li>\n      <li><strong>Dérivée seconde</strong> et <strong>signe</strong> de f''(x) → convexité et points d'inflexion.</li>\n      <li><strong>Tableau de variations</strong> synthétique.</li>\n      <li><strong>Construction de la courbe</strong> : points particuliers, asymptotes, tangentes.</li>\n    </ol>\n  </div>\n  <div style='background: #e6fffa; padding: 12px; border-radius: 8px; margin-top: 12px; border: 1px solid #38b2ac;'>\n    <strong style='color: #2c7a7b;'>💡 Astuce :</strong> Une étude systématique permet d'éviter les erreurs et d'obtenir une courbe précise.</p>\n  </div>\n</div>",
    "texteParle": "L'étude d'une fonction suit un plan méthodique. D'abord, on détermine son domaine de définition, c'est-à-dire les valeurs de x pour lesquelles elle est définie. Ensuite, on examine les éventuelles symétries (parité) ou périodicités qui peuvent simplifier l'étude. Puis on calcule les limites aux bornes du domaine pour connaître le comportement à l'infini et identifier les asymptotes. La dérivée première permet d'étudier les variations, la dérivée seconde la convexité. Enfin, on construit le tableau de variations et on trace la courbe.",
    "note": "L'étude d'une fonction se fait en plusieurs étapes : domaine, limites, variations, convexité, tracé."
  },
  {
    "titre": "Domaine de définition et parité",
    "contenu": "<div style='background: #f0f4f8; color: #1e293b; padding: 18px; border-radius: 12px;'>\n  <h3 style='color: #2b6cb0; margin-top: 0;'>🎯 Domaine de définition et parité</h3>\n  <div style='display: grid; grid-template-columns: 1fr 1fr; gap: 16px;'>\n    <div style='background: white; padding: 16px; border-radius: 8px; border-left: 4px solid #2b6cb0;'>\n      <h4 style='color: #2b6cb0; margin-top: 0;'>Domaine de définition</h4>\n      <p style='font-size: 0.95em; line-height: 1.6;'>Ensemble des valeurs de x pour lesquelles f(x) existe.</p>\n      <div style='background: #e2e8f0; padding: 8px; border-radius: 4px; margin-top: 4px;'>\n        <p style='margin: 0; font-size: 0.9em;'><strong>Exemple :</strong> f(x) = 1/x → D = ℝ* = ℝ \\ {0}</p>\n        <p style='margin: 0; font-size: 0.9em;'><strong>Exemple :</strong> f(x) = √x → D = [0 ; +∞[</p>\n      </div>\n    </div>\n    <div style='background: white; padding: 16px; border-radius: 8px; border-left: 4px solid #2b6cb0;'>\n      <h4 style='color: #2b6cb0; margin-top: 0;'>Parité</h4>\n      <ul style='font-size: 0.95em; line-height: 1.8;'>\n        <li><strong>Fonction paire</strong> : f(-x) = f(x) → symétrie par rapport à l'axe des ordonnées.</li>\n        <li><strong>Fonction impaire</strong> : f(-x) = -f(x) → symétrie par rapport à l'origine.</li>\n      </ul>\n      <div style='background: #e2e8f0; padding: 8px; border-radius: 4px; margin-top: 4px;'>\n        <p style='margin: 0; font-size: 0.9em;'><strong>Exemple :</strong> f(x) = x² est paire</p>\n        <p style='margin: 0; font-size: 0.9em;'><strong>Exemple :</strong> f(x) = x³ est impaire</p>\n      </div>\n    </div>\n  </div>\n  <div style='background: #fefcbf; padding: 10px; border-radius: 8px; margin-top: 12px;'>\n    <p style='margin: 0; font-size: 0.95em;'><strong>💡 Astuce :</strong> La parité permet de réduire l'étude à la moitié du domaine.</p>\n  </div>\n</div>",
    "texteParle": "Commençons par les premières étapes. Le domaine de définition est l'ensemble des x pour lesquels la fonction est définie. Par exemple, 1/x n'est pas définie en 0, et √x n'est définie que pour x positif ou nul. La parité, quant à elle, permet de simplifier l'étude : une fonction paire est symétrique par rapport à l'axe des ordonnées, une fonction impaire est symétrique par rapport à l'origine. Si la fonction est paire ou impaire, on peut réduire l'étude à x ≥ 0 puis compléter par symétrie.",
    "note": "Le domaine de définition et la parité sont les premières étapes de l'étude d'une fonction."
  },
  {
    "titre": "Limites et asymptotes",
    "contenu": "<div style='background: #f0f4f8; color: #1e293b; padding: 18px; border-radius: 12px;'>\n  <h3 style='color: #2b6cb0; margin-top: 0;'>📏 Limites aux bornes et asymptotes</h3>\n  <div style='background: white; padding: 16px; border-radius: 8px; border-left: 4px solid #2b6cb0;'>\n    <p style='font-size: 1em; line-height: 1.6;'>L'étude des limites permet de connaître le comportement de la fonction aux extrémités de son domaine et d'identifier les <strong>asymptotes</strong>.</p>\n    <div style='display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 8px;'>\n      <div style='background: #e6fffa; padding: 12px; border-radius: 8px; border: 1px solid #38b2ac;'>\n        <strong style='color: #2c7a7b;'>Asymptote verticale</strong>\n        <p style='font-size: 0.9em;'>Si lim<sub>x→a</sub> f(x) = ±∞</p>\n        <p style='font-size: 0.85em;'>Ex : f(x) = 1/x a pour asymptote verticale x = 0</p>\n      </div>\n      <div style='background: #e6fffa; padding: 12px; border-radius: 8px; border: 1px solid #38b2ac;'>\n        <strong style='color: #2c7a7b;'>Asymptote horizontale</strong>\n        <p style='font-size: 0.9em;'>Si lim<sub>x→±∞</sub> f(x) = L</p>\n        <p style='font-size: 0.85em;'>Ex : f(x) = 1/x + 2 a pour asymptote horizontale y = 2</p>\n      </div>\n      <div style='background: #e6fffa; padding: 12px; border-radius: 8px; border: 1px solid #38b2ac;'>\n        <strong style='color: #2c7a7b;'>Asymptote oblique</strong>\n        <p style='font-size: 0.9em;'>Si lim<sub>x→±∞</sub> [f(x) - (ax+b)] = 0</p>\n        <p style='font-size: 0.85em;'>Ex : f(x) = x + 1/x a pour asymptote oblique y = x</p>\n      </div>\n      <div style='background: #fefcbf; padding: 12px; border-radius: 8px; border: 1px solid #ecc94b;'>\n        <strong style='color: #975a16;'>Positions relatives</strong>\n        <p style='font-size: 0.9em;'>Étudier le signe de f(x) - (ax+b) pour savoir si la courbe est au-dessus ou en dessous de l'asymptote.</p>\n      </div>\n    </div>\n  </div>\n</div>",
    "texteParle": "L'étude des limites aux bornes du domaine permet de déterminer le comportement asymptotique de la fonction. Une asymptote verticale est une droite x = a vers laquelle la courbe tend lorsque x s'approche de a. Une asymptote horizontale est une droite y = L vers laquelle la courbe tend à l'infini. Une asymptote oblique est une droite y = ax + b vers laquelle la courbe s'approche à l'infini. Il est aussi important de déterminer la position relative de la courbe par rapport à ses asymptotes en étudiant le signe de f(x) - (ax+b).",
    "note": "Les asymptotes verticales, horizontales et obliques décrivent le comportement de la fonction à l'infini."
  },
  {
    "titre": "Variations d'une fonction",
    "contenu": "<div style='background: #f0f4f8; color: #1e293b; padding: 18px; border-radius: 12px;'>\n  <h3 style='color: #2b6cb0; margin-top: 0;'>📈 Variations et extremums</h3>\n  <div style='background: white; padding: 16px; border-radius: 8px; border-left: 4px solid #2b6cb0;'>\n    <p style='font-size: 1em; line-height: 1.6;'>Le signe de la <strong>dérivée première</strong> f'(x) détermine les variations de f.</p>\n    <div style='display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 12px 0;'>\n      <div style='background: #e6fffa; padding: 14px; border-radius: 8px; border: 1px solid #38b2ac;'>\n        <div style='text-align: center; font-size: 1.8em;'>📈</div>\n        <p style='text-align: center;'><strong>f'(x) > 0</strong></p>\n        <p style='text-align: center; font-size: 0.9em;'>f est <strong>croissante</strong></p>\n      </div>\n      <div style='background: #fefcbf; padding: 14px; border-radius: 8px; border: 1px solid #ecc94b;'>\n        <div style='text-align: center; font-size: 1.8em;'>📉</div>\n        <p style='text-align: center;'><strong>f'(x) < 0</strong></p>\n        <p style='text-align: center; font-size: 0.9em;'>f est <strong>décroissante</strong></p>\n      </div>\n    </div>\n    <p style='font-size: 1em; line-height: 1.6;'><strong>Extremums :</strong> quand f'(x) = 0 et change de signe, on a un <strong>maximum</strong> (si + → -) ou un <strong>minimum</strong> (si - → +).</p>\n  </div>\n  <div style='background: #e6fffa; padding: 14px; border-radius: 8px; margin-top: 12px; border: 1px solid #38b2ac;'>\n    <strong style='color: #2c7a7b;'>📝 Exemple :</strong>\n    <p style='font-size: 0.9em;'>f(x) = x² - 4x + 3 → f'(x) = 2x - 4</p>\n    <p style='font-size: 0.9em;'>f'(x) = 0 → x = 2 ; f'(x) < 0 sur ]-∞;2[ → f décroissante ; f'(x) > 0 sur ]2;+∞[ → f croissante.</p>\n    <p style='font-size: 0.9em;'>En x = 2, f(2) = -1 est un <strong>minimum</strong>.</p>\n  </div>\n</div>",
    "texteParle": "L'étude des variations est l'étape centrale. La dérivée première f'(x) nous renseigne sur la croissance ou la décroissance de la fonction. Si f'(x) est positive, la fonction est croissante. Si f'(x) est négative, la fonction est décroissante. Les points où f'(x) s'annule sont des extremums potentiels : si la dérivée change de + à -, c'est un maximum ; si elle change de - à +, c'est un minimum. Par exemple, pour f(x) = x² - 4x + 3, la dérivée s'annule en x = 2, qui est un minimum.",
    "note": "Le signe de la dérivée première détermine les variations de la fonction et les extremums."
  },
  {
    "titre": "Convexité et points d'inflexion",
    "contenu": "<div style='background: #f0f4f8; color: #1e293b; padding: 18px; border-radius: 12px;'>\n  <h3 style='color: #2b6cb0; margin-top: 0;'>🔍 Convexité et points d'inflexion</h3>\n  <div style='background: white; padding: 16px; border-radius: 8px; border-left: 4px solid #2b6cb0;'>\n    <p style='font-size: 1em; line-height: 1.6;'>Le signe de la <strong>dérivée seconde</strong> f''(x) détermine la <strong>convexité</strong> de la fonction.</p>\n    <div style='display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 12px 0;'>\n      <div style='background: #e6fffa; padding: 14px; border-radius: 8px; border: 1px solid #38b2ac;'>\n        <div style='text-align: center; font-size: 1.8em;'>∪</div>\n        <p style='text-align: center;'><strong>f''(x) > 0</strong></p>\n        <p style='text-align: center; font-size: 0.9em;'>f est <strong>convexe</strong> (courbe tournée vers le haut)</p>\n      </div>\n      <div style='background: #fefcbf; padding: 14px; border-radius: 8px; border: 1px solid #ecc94b;'>\n        <div style='text-align: center; font-size: 1.8em;'>∩</div>\n        <p style='text-align: center;'><strong>f''(x) < 0</strong></p>\n        <p style='text-align: center; font-size: 0.9em;'>f est <strong>concave</strong> (courbe tournée vers le bas)</p>\n      </div>\n    </div>\n    <p style='font-size: 1em; line-height: 1.6;'><strong>Point d'inflexion :</strong> quand f''(x) = 0 et change de signe, la courbe traverse sa tangente.</p>\n  </div>\n  <div style='background: #e6fffa; padding: 14px; border-radius: 8px; margin-top: 12px; border: 1px solid #38b2ac;'>\n    <strong style='color: #2c7a7b;'>📝 Exemple :</strong>\n    <p style='font-size: 0.9em;'>f(x) = x³ - 3x → f'(x) = 3x² - 3 ; f''(x) = 6x</p>\n    <p style='font-size: 0.9em;'>f''(x) = 0 → x = 0 ; f''(x) < 0 sur ]-∞;0[ → concave ; f''(x) > 0 sur ]0;+∞[ → convexe.</p>\n    <p style='font-size: 0.9em;'>En x = 0, f(0) = 0 est un <strong>point d'inflexion</strong>.</p>\n  </div>\n</div>",
    "texteParle": "La dérivée seconde f''(x) donne des informations sur la convexité de la fonction. Si f''(x) est positive, la fonction est convexe, c'est-à-dire que la courbe est tournée vers le haut. Si f''(x) est négative, la fonction est concave, la courbe est tournée vers le bas. Les points où f''(x) s'annule et change de signe sont appelés points d'inflexion : la courbe traverse sa tangente en ce point. Par exemple, pour f(x) = x³ - 3x, le point (0;0) est un point d'inflexion.",
    "note": "Le signe de la dérivée seconde détermine la convexité et les points d'inflexion."
  },
  {
    "titre": "Le tableau de variations complet",
    "contenu": "<div style='background: #f0f4f8; color: #1e293b; padding: 18px; border-radius: 12px;'>\n  <h3 style='color: #2b6cb0; margin-top: 0;'>📊 Le tableau de variations</h3>\n  <div style='background: white; padding: 16px; border-radius: 8px; border-left: 4px solid #2b6cb0;'>\n    <p style='font-size: 1em; line-height: 1.6;'>Le tableau de variations synthétise toutes les informations obtenues.</p>\n  </div>\n  <div style='background: white; padding: 12px; border-radius: 8px; border: 1px solid #e2e8f0; overflow-x: auto;'>\n    <table style='width: 100%; border-collapse: collapse; font-size: 0.85em;'>\n      <thead style='background: #2b6cb0; color: white;'>\n        <tr>\n          <th style='padding: 8px; border: 1px solid #e2e8f0;'>x</th>\n          <th style='padding: 8px; border: 1px solid #e2e8f0;'>-∞</th>\n          <th style='padding: 8px; border: 1px solid #e2e8f0;'>a</th>\n          <th style='padding: 8px; border: 1px solid #e2e8f0;'>b</th>\n          <th style='padding: 8px; border: 1px solid #e2e8f0;'>+∞</th>\n        </tr>\n      </thead>\n      <tbody>\n        <tr style='background: #e6fffa;'>\n          <td style='padding: 8px; border: 1px solid #e2e8f0;'>f'(x)</td>\n          <td style='padding: 8px; border: 1px solid #e2e8f0;'>+</td>\n          <td style='padding: 8px; border: 1px solid #e2e8f0;'>0</td>\n          <td style='padding: 8px; border: 1px solid #e2e8f0;'>−</td>\n          <td style='padding: 8px; border: 1px solid #e2e8f0;'>+</td>\n        </tr>\n        <tr style='background: #f0f4f8;'>\n          <td style='padding: 8px; border: 1px solid #e2e8f0;'>f''(x)</td>\n          <td style='padding: 8px; border: 1px solid #e2e8f0;'>−</td>\n          <td style='padding: 8px; border: 1px solid #e2e8f0;'>0</td>\n          <td style='padding: 8px; border: 1px solid #e2e8f0;'>+</td>\n          <td style='padding: 8px; border: 1px solid #e2e8f0;'>+</td>\n        </tr>\n        <tr style='background: #e6fffa;'>\n          <td style='padding: 8px; border: 1px solid #e2e8f0;'>f(x)</td>\n          <td style='padding: 8px; border: 1px solid #e2e8f0;'>↘</td>\n          <td style='padding: 8px; border: 1px solid #e2e8f0;'>max</td>\n          <td style='padding: 8px; border: 1px solid #e2e8f0;'>min</td>\n          <td style='padding: 8px; border: 1px solid #e2e8f0;'>↗</td>\n        </tr>\n      </tbody>\n    </table>\n  </div>\n  <div style='background: #fefcbf; padding: 10px; border-radius: 8px; margin-top: 12px;'>\n    <p style='margin: 0; font-size: 0.95em;'><strong>💡 À retenir :</strong> Le tableau de variations est un outil indispensable pour le tracé de la courbe.</p>\n  </div>\n</div>",
    "texteParle": "Le tableau de variations est la synthèse de toute l'étude. Il fait apparaître les intervalles de variation, les extremums et les points d'inflexion. Sur une première ligne, on place les valeurs remarquables de x. Sur la deuxième ligne, le signe de f'(x) avec les zéros. Sur la troisième ligne, le signe de f''(x). Sur la quatrième ligne, le sens de variation de f avec des flèches et les valeurs correspondantes. Ce tableau est l'outil clé pour tracer précisément la courbe de la fonction.",
    "note": "Le tableau de variations synthétise les informations de l'étude : variations et convexité."
  },
  {
    "titre": "Points particuliers : points anguleux",
    "contenu": "<div style='background: #f0f4f8; color: #1e293b; padding: 18px; border-radius: 12px;'>\n  <h3 style='color: #2b6cb0; margin-top: 0;'>🔺 Points anguleux</h3>\n  <div style='background: white; padding: 16px; border-radius: 8px; border-left: 4px solid #2b6cb0;'>\n    <p style='font-size: 1em; line-height: 1.6;'>Un <strong>point anguleux</strong> est un point de la courbe où la fonction est continue mais <strong>non dérivable</strong>. La courbe présente un \"angle\" ou une \"pointe\".</p>\n    <ul style='font-size: 0.95em; line-height: 1.8;'>\n      <li>La dérivée à gauche et la dérivée à droite existent mais sont <strong>différentes</strong>.</li>\n      <li>La tangente à gauche et la tangente à droite sont différentes.</li>\n    </ul>\n  </div>\n  <div style='display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px;'>\n    <div style='background: #e6fffa; padding: 14px; border-radius: 8px; border: 1px solid #38b2ac;'>\n      <strong style='color: #2c7a7b;'>📝 Exemple 1</strong>\n      <p style='font-size: 0.9em;'>f(x) = |x| en x = 0</p>\n      <p style='font-size: 0.9em;'>f'(0⁻) = -1 ; f'(0⁺) = 1</p>\n      <p style='font-size: 0.9em;'>La courbe présente une pointe en (0;0).</p>\n    </div>\n    <div style='background: #e6fffa; padding: 14px; border-radius: 8px; border: 1px solid #38b2ac;'>\n      <strong style='color: #2c7a7b;'>📝 Exemple 2</strong>\n      <p style='font-size: 0.9em;'>f(x) = √x en x = 0</p>\n      <p style='font-size: 0.9em;'>f'(0⁺) = +∞</p>\n      <p style='font-size: 0.9em;'>Tangente verticale en (0;0).</p>\n    </div>\n  </div>\n  <div style='background: #fefcbf; padding: 10px; border-radius: 8px; margin-top: 12px;'>\n    <p style='margin: 0; font-size: 0.95em;'><strong>⚠️ Attention :</strong> Un point anguleux n'est pas un extremum local !</p>\n  </div>\n</div>",
    "texteParle": "Certaines fonctions présentent des points anguleux, c'est-à-dire des points où la fonction est continue mais pas dérivable. En ce point, la courbe forme un angle ou une pointe. La dérivée à gauche et la dérivée à droite existent mais sont différentes. L'exemple classique est la fonction valeur absolue en x = 0, qui forme une pointe. Un autre exemple est la fonction racine carrée en x = 0, où la tangente est verticale. Attention, un point anguleux n'est pas un extremum local, c'est simplement un point de non-dérivabilité.",
    "note": "Un point anguleux est un point de non-dérivabilité où la courbe forme un angle."
  },
  {
    "titre": "Tracer la courbe représentative",
    "contenu": "<div style='background: #f0f4f8; color: #1e293b; padding: 18px; border-radius: 12px;'>\n  <h3 style='color: #2b6cb0; margin-top: 0;'>✏️ Tracer la courbe de la fonction</h3>\n  <div style='background: white; padding: 16px; border-radius: 8px; border-left: 4px solid #2b6cb0;'>\n    <p style='font-size: 1em; line-height: 1.6;'>Pour tracer la courbe, on utilise toutes les informations collectées :</p>\n    <ol style='font-size: 0.95em; line-height: 1.8;'>\n      <li>Placer les <strong>points remarquables</strong> : intersections avec les axes, extremums, points d'inflexion, points anguleux.</li>\n      <li>Représenter les <strong>asymptotes</strong> (verticales, horizontales, obliques).</li>\n      <li>Indiquer les <strong>tangentes</strong> aux points remarquables.</li>\n      <li>Tracer la courbe en respectant le tableau de variations et la convexité.</li>\n      <li>Étudier la <strong>position par rapport aux asymptotes</strong> pour préciser le tracé.</li>\n    </ol>\n  </div>\n  <div style='display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px;'>\n    <div style='background: #e6fffa; padding: 12px; border-radius: 8px; border: 1px solid #38b2ac; text-align: center;'>\n      <strong style='color: #2c7a7b;'>📐 Éléments à identifier</strong>\n      <ul style='font-size: 0.85em; line-height: 1.6; text-align: left;'>\n        <li>Domaine de définition</li>\n        <li>Parité (symétries)</li>\n        <li>Asymptotes</li>\n        <li>Extremums (max/min)</li>\n        <li>Points d'inflexion</li>\n        <li>Points anguleux</li>\n        <li>Intersections avec les axes</li>\n      </ul>\n    </div>\n    <div style='background: #fefcbf; padding: 12px; border-radius: 8px; border: 1px solid #ecc94b; text-align: center;'>\n      <strong style='color: #975a16;'>⚠️ Conseils de tracé</strong>\n      <ul style='font-size: 0.85em; line-height: 1.6; text-align: left;'>\n        <li>Choisir une échelle adaptée</li>\n        <li>Placer les points remarquables</li>\n        <li>Tracer les asymptotes en pointillé</li>\n        <li>Suivre les variations avec des flèches</li>\n        <li>Vérifier la cohérence globale</li>\n      </ul>\n    </div>\n  </div>\n</div>",
    "texteParle": "Pour tracer la courbe, on utilise toutes les informations que nous avons collectées. On commence par placer les points remarquables : intersections avec les axes, extremums, points d'inflexion, points anguleux. On trace les asymptotes en pointillé. On indique les tangentes aux points importants. Enfin, on trace la courbe en respectant le tableau de variations et la convexité. Il faut aussi déterminer la position de la courbe par rapport aux asymptotes pour préciser le tracé. Une fois toutes ces étapes réalisées, on obtient une courbe précise et complète.",
    "note": "Le tracé d'une courbe utilise toutes les informations collectées : domaines, asymptotes, variations, convexité."
  },
  {
    "titre": "Récapitulatif : l'étude complète d'une fonction",
    "contenu": "<div style='background: #f0f4f8; color: #1e293b; padding: 18px; border-radius: 12px;'>\n  <h3 style='color: #2b6cb0; margin-top: 0;'>📋 Synthèse des étapes d'étude d'une fonction</h3>\n  <div style='background: white; padding: 16px; border-radius: 8px;'>\n    <table style='width: 100%; border-collapse: collapse; font-size: 0.85em;'>\n      <thead style='background: #2b6cb0; color: white;'>\n        <tr>\n          <th style='padding: 8px; border: 1px solid #e2e8f0;'>Étape</th>\n          <th style='padding: 8px; border: 1px solid #e2e8f0;'>Ce qu'on étudie</th>\n          <th style='padding: 8px; border: 1px solid #e2e8f0;'>Ce qu'on trouve</th>\n        </tr>\n      </thead>\n      <tbody>\n        <tr style='background: #e6fffa;'>\n          <td style='padding: 8px; border: 1px solid #e2e8f0;'>1</td>\n          <td style='padding: 8px; border: 1px solid #e2e8f0;'>Domaine de définition</td>\n          <td style='padding: 8px; border: 1px solid #e2e8f0;'>Valeurs de x possibles</td>\n        </tr>\n        <tr style='background: #f0f4f8;'>\n          <td style='padding: 8px; border: 1px solid #e2e8f0;'>2</td>\n          <td style='padding: 8px; border: 1px solid #e2e8f0;'>Parité et périodicité</td>\n          <td style='padding: 8px; border: 1px solid #e2e8f0;'>Symétries éventuelles</td>\n        </tr>\n        <tr style='background: #e6fffa;'>\n          <td style='padding: 8px; border: 1px solid #e2e8f0;'>3</td>\n          <td style='padding: 8px; border: 1px solid #e2e8f0;'>Limites aux bornes</td>\n          <td style='padding: 8px; border: 1px solid #e2e8f0;'>Asymptotes</td>\n        </tr>\n        <tr style='background: #f0f4f8;'>\n          <td style='padding: 8px; border: 1px solid #e2e8f0;'>4</td>\n          <td style='padding: 8px; border: 1px solid #e2e8f0;'>Dérivée première f'</td>\n          <td style='padding: 8px; border: 1px solid #e2e8f0;'>Variations, extremums</td>\n        </tr>\n        <tr style='background: #e6fffa;'>\n          <td     // ================================================================
    // ÉTAT
    // ================================================================
    let currentIndex = 0;
    let isSpeaking = false;
    let isPaused = false;
    let currentUtterance = null;
    let isLoading = false;
    let loadingTimeout = null;
    let isTransitioning = false;
    let speechSupported = true;
    let userInteracted = false;
    let isPlaying = false;
    let loadingCancelled = false;

    const total = slides.length;
    const synth = window.speechSynthesis;

    // Références jQuery
    const $title = $('#slideTitle');
    const $body = $('#slideBody');
    const $counter = $('#slideCounter');
    const $statusText = $('#statusText');
    const $statusBadge = $('#statusBadge');
    const $loading = $('#loadingOverlay');
    const $loadingText = $('#loadingText');
    const $loadingSub = $('#loadingSub');
    const $loadingTimeout = $('#loadingTimeout');
    const $loadingProgressBar = $('#loadingProgressBar');
    const $autoIndicator = $('#autoIndicator');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $replay = $('#replayBtn');
    const $play = $('#playBtn');
    const $cancelLoading = $('#cancelLoadingBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function setStatus(text, type) {
        $statusText.text(text);
        $statusBadge.removeClass('idle speaking error paused waiting loading');
        if (type === 'speaking') $statusBadge.addClass('speaking');
        else if (type === 'error') $statusBadge.addClass('error');
        else if (type === 'paused') $statusBadge.addClass('paused');
        else if (type === 'waiting') $statusBadge.addClass('waiting');
        else if (type === 'loading') $statusBadge.addClass('loading');
        else $statusBadge.addClass('idle');
    }

    function updatePlayButton() {
        if (isPlaying) {
            $play.addClass('playing');
            $play.find('.btn-icon').text('⏸');
            $play.find('.btn-label').text('Pause');
        } else {
            $play.removeClass('playing');
            $play.find('.btn-icon').text('▶');
            $play.find('.btn-label').text('Play');
        }
    }

    function showLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        
        loadingCancelled = false;
        isLoading = true;
        
        // Réinitialiser la barre de progression
        $loadingProgressBar.css('animation', 'none');
        $loadingProgressBar.css('width', '0%');
        // Forcer un reflow
        $loadingProgressBar[0].offsetHeight;
        $loadingProgressBar.css('animation', 'loadingProgress 30s ease-out forwards');
        
        $loadingText.text('Préparation vocale...');
        $loadingSub.text('Synthèse en cours');
        $loadingTimeout.text('⏱️ 30 secondes maximum');
        $loading.fadeIn(300);
        setStatus("⏳ Chargement...", 'loading');
        
        // 🔥 TIMEOUT DE 30 SECONDES
        loadingTimeout = setTimeout(() => {
            if (isLoading && !loadingCancelled) {
                hideLoading();
                setStatus("⚠️ Délai dépassé (30s)", 'error');
                isPlaying = false;
                updatePlayButton();
                $loadingSub.text('La synthèse vocale a pris trop de temps');
                $loadingTimeout.text('❌ Délai dépassé');
            }
        }, 30000);
    }

    function hideLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        isLoading = false;
        loadingCancelled = false;
        $loading.fadeOut(300);
        // Ne pas changer le statut si on est en train de parler
        if (!isSpeaking && !isPlaying) {
            setStatus("⏸ Lecture arrêtée", 'paused');
        }
    }

    function cancelLoading() {
        loadingCancelled = true;
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        hideLoading();
        stopSpeaking();
        setStatus("⏸ Annulé", 'paused');
        isPlaying = false;
        updatePlayButton();
        $loadingText.text('Annulé par l\'utilisateur');
        $loadingSub.text('Vous pouvez réessayer');
        $loadingTimeout.text('✕ Annulation');
    }

    // Arrêter la parole proprement
    function stopSpeaking() {
        try {
            if (synth && (synth.speaking || synth.pending)) {
                synth.cancel();
            }
        } catch(e) {
            console.warn('Erreur stopSpeaking:', e);
        }
        if (currentUtterance) {
            try {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance.onstart = null;
            } catch(e) {}
            currentUtterance = null;
        }
        isSpeaking = false;
        isPlaying = false;
        updatePlayButton();
    }

    // Mettre en pause la parole
    function pauseSpeaking() {
        try {
            if (synth && synth.speaking) {
                synth.pause();
                isPaused = true;
                isPlaying = false;
                setStatus("⏸ Lecture en pause", 'paused');
                updatePlayButton();
            }
        } catch(e) {
            console.warn('Erreur pauseSpeaking:', e);
            stopSpeaking();
        }
    }

    // Reprendre la parole
    function resumeSpeaking() {
        try {
            if (synth && synth.paused) {
                synth.resume();
                isPaused = false;
                isPlaying = true;
                setStatus("🔊 Lecture en cours", 'speaking');
                updatePlayButton();
            } else if (!isSpeaking && !synth.speaking && !synth.pending) {
                speakSlide(currentIndex);
            }
        } catch(e) {
            console.warn('Erreur resumeSpeaking:', e);
            speakSlide(currentIndex);
        }
    }

    function renderSlide(index) {
        const slide = slides[index];
        $title.text(slide.titre);

        let html = '';
        html += `<div class="content-card">${slide.contenu}</div>`;
        if (slide.note) {
            html += `<div class="note-box">${slide.note}</div>`;
        }
        $body.html(html);
        $counter.text(`${index+1} / ${total}`);

        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
        }
    }

    // ================================================================
    // LECTURE VOCALE
    // ================================================================
    function speakSlide(index) {
        return new Promise((resolve) => {
            const slide = slides[index];
            const text = slide.texteParle;
            
            if (!text || text.trim() === '' || !speechSupported) {
                resolve();
                return;
            }

            if (!window.speechSynthesis) {
                setStatus("❌ Synthèse vocale non supportée", 'error');
                speechSupported = false;
                resolve();
                return;
            }

            // Arrêter toute lecture en cours
            stopSpeaking();
            
            // Réinitialiser l'état de pause
            isPaused = false;
            
            showLoading();
            setStatus("Initialisation...", 'loading');

            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.92;
                utterance.pitch = 1.05;
                utterance.volume = 1;

                let isFinished = false;
                let errorHandled = false;

                utterance.onstart = function() {
                    if (loadingCancelled) {
                        stopSpeaking();
                        resolve();
                        return;
                    }
                    hideLoading();
                    isSpeaking = true;
                    isPlaying = true;
                    isPaused = false;
                    setStatus("🔊 Lecture en cours", 'speaking');
                    updatePlayButton();
                };

                utterance.onend = function() {
                    if (isFinished) return;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    setStatus("✅ Terminé", 'idle');
                    hideLoading();
                    updatePlayButton();
                    resolve();
                };

                utterance.onerror = function(e) {
                    if (isFinished || errorHandled) return;
                    errorHandled = true;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    hideLoading();
                    updatePlayButton();
                    
                    if (e.error === 'not-allowed') {
                        setStatus("⚠️ Permission refusée", 'error');
                    } else if (e.error === 'synthesis-unavailable') {
                        setStatus("⚠️ Synthèse indisponible", 'error');
                    } else if (e.error === 'canceled') {
                        setStatus("⏸ Annulé", 'paused');
                    } else {
                        setStatus("❌ Erreur audio: " + (e.error || 'inconnue'), 'error');
                    }
                    
                    resolve();
                };

                // Gestion du chargement des voix
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = function() {
                        if (!loadingCancelled) {
                            try {
                                synth.speak(utterance);
                            } catch(err) {
                                // Silencieux
                            }
                        }
                        synth.onvoiceschanged = null;
                    };
                }

                currentUtterance = utterance;
                
                if (!loadingCancelled) {
                    try {
                        synth.speak(utterance);
                    } catch(err) {
                        setTimeout(() => {
                            if (!loadingCancelled) {
                                try {
                                    synth.speak(utterance);
                                } catch(e) {
                                    setStatus("❌ Erreur de lecture", 'error');
                                    isPlaying = false;
                                    updatePlayButton();
                                    hideLoading();
                                    resolve();
                                }
                            } else {
                                resolve();
                            }
                        }, 100);
                    }
                } else {
                    resolve();
                }

            } catch(err) {
                hideLoading();
                setStatus("❌ Erreur générale", 'error');
                isPlaying = false;
                updatePlayButton();
                console.error('Erreur speakSlide:', err);
                resolve();
            }
        });
    }

    // ================================================================
    // NAVIGATION
    // ================================================================
    async function goToSlide(index) {
        if (isTransitioning) return;
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        
        // Si on est en train de lire, on met en pause avant de naviguer
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        // Arrêter complètement la lecture
        stopSpeaking();
        
        await new Promise(r => setTimeout(r, 50));
        
        if (index === currentIndex) {
            setStatus("📄 Slide actuel", 'idle');
            return;
        }

        isTransitioning = true;
        currentIndex = index;
        renderSlide(index);
        
        // Réinitialiser l'état de lecture
        isPlaying = false;
        updatePlayButton();
        setStatus("⏸ Lecture arrêtée", 'paused');

        await new Promise(r => setTimeout(r, 150));
        isTransitioning = false;
    }

    async function goToNext() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex + 1 < total) {
            await goToSlide(currentIndex + 1);
        } else {
            setStatus("🏁 Dernier slide", 'idle');
        }
    }

    async function goToPrev() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex - 1 >= 0) {
            await goToSlide(currentIndex - 1);
        } else {
            setStatus("🔁 Premier slide", 'idle');
        }
    }

    // ================================================================
    // GESTION PLAY/PAUSE
    // ================================================================
    function togglePlay() {
        if (!userInteracted) {
            userInteracted = true;
        }

        // Si le chargement est en cours, on l'annule
        if (isLoading) {
            cancelLoading();
            return;
        }

        // Si le synthétiseur est en pause, on reprend
        if (synth && synth.paused) {
            resumeSpeaking();
            return;
        }

        // Si la lecture est en cours, on met en pause
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
            return;
        }

        // Sinon, on démarre la lecture du slide courant
        if (!isSpeaking && !isPlaying) {
            stopSpeaking();
            speakSlide(currentIndex);
        }
    }

    // ================================================================
    // INIT
    // ================================================================
    async function init() {
        // Vérifier la compatibilité
        if (!window.speechSynthesis) {
            setStatus("❌ Synthèse vocale non supportée", 'error');
            speechSupported = false;
        }

        // Précharger les voix
        try {
            if (synth.getVoices) {
                synth.getVoices();
                setTimeout(() => {
                    try {
                        synth.getVoices();
                    } catch(e) {}
                }, 200);
            }
        } catch(e) {
            console.warn('Erreur chargement voix:', e);
        }

        // Afficher le premier slide
        renderSlide(0);
        $counter.text(`1 / ${total}`);
        
        // État initial
        setStatus("⏸ Appuie sur Play", 'paused');
        updatePlayButton();
        $autoIndicator.text('⏸ Lecture manuelle');

        // ================================================================
        // ÉVÉNEMENTS
        // ================================================================
        
        // Bouton Play/Pause
        $play.on('click', function() {
            togglePlay();
        });

        // Bouton Annuler le chargement
        $cancelLoading.on('click', function() {
            cancelLoading();
        });

        // Navigation
        $prev.on('click', function() {
            // Si chargement en cours, on annule
            if (isLoading) cancelLoading();
            goToPrev();
        });

        $next.on('click', function() {
            if (isLoading) cancelLoading();
            goToNext();
        });

        // Replay - relire le slide courant
        $replay.on('click', function() {
            if (isLoading) cancelLoading();
            stopSpeaking();
            setTimeout(() => {
                speakSlide(currentIndex);
            }, 100);
        });

        // Support du clavier (espace pour play/pause)
        $(document).on('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });

        // Nettoyage
        $(window).on('beforeunload', function() {
            try {
                if (synth.speaking) synth.cancel();
            } catch(e) {}
            hideLoading();
        });

        // Gérer les cas où la synthèse se termine de manière inattendue
        setInterval(() => {
            if (isPlaying && !synth.speaking && !synth.pending && !isPaused && !isLoading) {
                isPlaying = false;
                updatePlayButton();
                setStatus("⏸ Lecture arrêtée", 'paused');
            }
        }, 1000);
    }

    init();
});

        document.querySelectorAll('.content-card').forEach(card => {
            card.style.background = 'rgba(255,255,255,0.8)';
            card.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.note-box').forEach(note => {
            note.style.background = 'rgba(96, 165, 250, 0.12)';
            note.style.color = '#2c3e50';
        });
        
        document.querySelectorAll('.math-block').forEach(block => {
            block.style.background = 'rgba(0,0,0,0.05)';
            block.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.btn').forEach(btn => {
            btn.style.color = '#2d3748';
        });
        
        const statusBadge = document.querySelector('.status-badge');
        if (statusBadge) {
            statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
            statusBadge.style.color = '#2b6cb0';
        }
        
        const slideCounter = document.querySelector('.slide-counter');
        if (slideCounter) {
            slideCounter.style.color = '#4a5568';
        }
        
        const autoIndicator = document.querySelector('.auto-indicator');
        if (autoIndicator) {
            autoIndicator.style.color = '#718096';
        }
        
        document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
            if (!el.closest('.note-box')) {
                el.style.color = '#2c3e50';
            }
        });
        
        document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
            if (!el.closest('.note-box') && !el.closest('.math-block')) {
                el.style.color = '#2d3748';
            }
        });
        
        const themeBtn = document.getElementById('themeToggle');
        if (themeBtn) {
            themeBtn.textContent = '🌓';
            themeBtn.title = 'Passer en mode nuit';
        }
    });
</script>
</body>
</html>
