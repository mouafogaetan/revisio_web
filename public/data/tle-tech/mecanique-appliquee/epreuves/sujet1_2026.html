<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
    "matiere": "Mécanique Appliquée",
    "classe": "Terminale Technique",
    "sequence": "Séquence 1",
    "anneeScolaire": "2025-2026",
    "exercices": [
        {
            "titre": "Exercice 1 : Dynamique et Principe Fondamental",
            "points": "5 pts",
            "enonce": "<p>Un chariot de masse \\( m = 200 \\, \\text{kg} \\) est tracté sur une voie horizontale par une force constante \\( F = 800 \\, \\text{N} \\) faisant un angle \\( \\alpha = 30^\\circ \\) avec l'horizontale. Les forces de frottement sont négligées. Le chariot part du repos.</p><div style='background-color: #e9ecef; padding: 10px; border-radius: 5px; margin-top: 10px;'><p><strong>Schéma :</strong> Un chariot sur une voie horizontale. La force \\( F \\) est appliquée avec un angle de \\( 30^\\circ \\) par rapport à l'horizontale.</p></div>",
            "questions": [
                {
                    "question": "1) Faire le bilan des forces extérieures s'exerçant sur le chariot.",
                    "reponse": "<p>Les forces extérieures sont :</p><ul><li>Le poids \\( \\vec{P} \\) (vertical vers le bas).</li><li>La réaction normale \\( \\vec{R} \\) de la voie (verticale vers le haut).</li><li>La force de traction \\( \\vec{F} \\) (faisant un angle \\( \\alpha \\) avec l'horizontale).</li></ul>"
                },
                {
                    "question": "2) Énoncer le Principe Fondamental de la Dynamique (PFD) pour le chariot.",
                    "reponse": "<p>Le PFD s'écrit :</p><div class='math-block'><div class='math'>$$ \\sum \\vec{F}_{ext} = m \\times \\vec{a} $$</div></div><p>Soit : \\( \\vec{P} + \\vec{R} + \\vec{F} = m \\times \\vec{a} \\)</p><p>En projection sur l'axe horizontal (x) et vertical (y) :</p><ul><li>Sur \\( x \\) : \\( F \\cos(\\alpha) = m a_x \\) (car \\( \\vec{P} \\) et \\( \\vec{R} \\) n'ont pas de composante horizontale).</li><li>Sur \\( y \\) : \\( -P + R + F \\sin(\\alpha) = 0 \\) (car \\( a_y = 0 \\)).</li></ul>"
                },
                {
                    "question": "3) Calculer l'accélération du chariot.",
                    "reponse": "<p>D'après la projection sur l'axe horizontal :</p><div class='math-block'><div class='math'>$$ a = a_x = \\dfrac{F \\cos(\\alpha)}{m} $$</div></div><p>Application numérique : \\( a = \\dfrac{800 \\times \\cos(30^\\circ)}{200} = \\dfrac{800 \\times 0,866}{200} = \\dfrac{692,8}{200} \\approx 3,46 \\, \\text{m/s}^2 \\)</p><p>L'accélération du chariot est d'environ \\( 3,46 \\, \\text{m/s}^2 \\).</p>"
                },
                {
                    "question": "4) Calculer la vitesse du chariot après 5 secondes de mouvement.",
                    "reponse": "<p>Le chariot part du repos : \\( v_0 = 0 \\). Le mouvement étant uniformément accéléré :</p><div class='math-block'><div class='math'>$$ v = a \\times t $$</div></div><p>\\( v = 3,46 \\times 5 = 17,3 \\, \\text{m/s} \\)</p><p>La vitesse du chariot après 5 secondes est de \\( 17,3 \\, \\text{m/s} \\).</p>"
                }
            ]
        },
        {
            "titre": "Exercice 2 : Énergie Cinétique et Théorème de l'Énergie Cinétique",
            "points": "6 pts",
            "enonce": "<p>Un solide de masse \\( m = 50 \\, \\text{kg} \\) glisse sur un plan incliné d'un angle \\( \\beta = 30^\\circ \\) par rapport à l'horizontale. Il part du repos du point A situé à une hauteur \\( h = 5 \\, \\text{m} \\) par rapport au sol. On néglige les frottements.</p><div style='background-color: #e9ecef; padding: 10px; border-radius: 5px; margin-top: 10px;'><p><strong>Schéma :</strong> Plan incliné d'angle \\( \\beta \\). Le point A est en haut, le point B en bas du plan incliné.</p></div>",
            "questions": [
                {
                    "question": "1) Calculer l'énergie cinétique du solide au point A (au repos).",
                    "reponse": "<p>Au point A, le solide est au repos, donc sa vitesse est nulle : \\( v_A = 0 \\).</p><div class='math-block'><div class='math'>$$ E_{cA} = \\dfrac{1}{2} m v_A^2 = 0 \\, \\text{J} $$</div></div>"
                },
                {
                    "question": "2) Calculer le travail du poids lors du déplacement de A vers B.",
                    "reponse": "<p>Le travail du poids ne dépend que de la différence de hauteur :</p><div class='math-block'><div class='math'>$$ W(\\vec{P}) = m \\times g \\times (h_A - h_B) = m \\times g \\times h $$</div></div><p>Application numérique : \\( W(\\vec{P}) = 50 \\times 9,81 \\times 5 = 2452,5 \\, \\text{J} \\)</p>"
                },
                {
                    "question": "3) Appliquer le Théorème de l'Énergie Cinétique (TEC) pour déterminer la vitesse du solide au point B.",
                    "reponse": "<p>Le TEC s'écrit : \\( \\Delta E_c = \\sum W(\\vec{F}_{ext}) \\)</p><p>Ici, seule la force \\( \\vec{P} \\) travaille (la réaction normale \\( \\vec{R} \\) ne travaille pas car elle est perpendiculaire au déplacement).</p><div class='math-block'><div class='math'>$$ E_{cB} - E_{cA} = W(\\vec{P}) $$</div></div><div class='math-block'><div class='math'>$$ \\dfrac{1}{2} m v_B^2 - 0 = m \\times g \\times h $$</div></div><div class='math-block'><div class='math'>$$ v_B = \\sqrt{2 \\times g \\times h} = \\sqrt{2 \\times 9,81 \\times 5} = \\sqrt{98,1} \\approx 9,9 \\, \\text{m/s} $$</div></div>"
                },
                {
                    "question": "4) Si le solide arrive en B avec une vitesse de \\( 8 \\, \\text{m/s} \\) (en présence de frottement), calculer le travail des forces de frottement.",
                    "reponse": "<p>Le travail total est la somme du travail du poids et du travail des frottements :</p><div class='math-block'><div class='math'>$$ W(\\vec{P}) + W(\\vec{f}) = \\dfrac{1}{2} m v_B^2 - \\dfrac{1}{2} m v_A^2 $$</div></div><p>\\( 2452,5 + W(\\vec{f}) = \\dfrac{1}{2} \\times 50 \\times 8^2 = 1600 \\)</p><p>\\( W(\\vec{f}) = 1600 - 2452,5 = -852,5 \\, \\text{J} \\)</p><p>Le travail des forces de frottement est de \\( -852,5 \\, \\text{J} \\) (le signe négatif indique une perte d'énergie).</p>"
                }
            ]
        },
        {
            "titre": "Exercice 3 : Puissance et Rendement",
            "points": "4 pts",
            "enonce": "<p>Un moteur électrique entraîne une pompe via une transmission par courroie. Le moteur absorbe une puissance électrique \\( P_{abs} = 2 \\, \\text{kW} \\). La pompe délivre une puissance hydraulique \\( P_{utile} = 1,6 \\, \\text{kW} \\).</p>",
            "questions": [
                {
                    "question": "1) Calculer le rendement global du système (moteur + transmission).",
                    "reponse": "<p>Le rendement global est :</p><div class='math-block'><div class='math'>$$ \\eta_{global} = \\dfrac{P_{utile}}{P_{abs}} = \\dfrac{1,6}{2} = 0,8 = 80\\% $$</div></div><p>Le rendement global est de 80%.</p>"
                },
                {
                    "question": "2) Sachant que le rendement de la transmission par courroie est de 90%, calculer le rendement du moteur.",
                    "reponse": "<p>Le rendement global est le produit des rendements :</p><div class='math-block'><div class='math'>$$ \\eta_{global} = \\eta_{moteur} \\times \\eta_{transmission} $$</div></div><p>\\( 0,8 = \\eta_{moteur} \\times 0,9 \\)</p><p>\\( \\eta_{moteur} = \\dfrac{0,8}{0,9} \\approx 0,889 = 88,9\\% \\)</p><p>Le rendement du moteur est d'environ 88,9%.</p>"
                },
                {
                    "question": "3) Calculer la puissance perdue dans le système.",
                    "reponse": "<p>La puissance perdue est la différence entre la puissance absorbée et la puissance utile :</p><div class='math-block'><div class='math'>$$ P_{perdue} = P_{abs} - P_{utile} = 2 - 1,6 = 0,4 \\, \\text{kW} = 400 \\, \\text{W} $$</div></div><p>La puissance perdue est de 400 W.</p>"
                }
            ]
        },
        {
            "titre": "Exercice 4 : Torseur Cinématique et Composition des Mouvements",
            "points": "5 pts",
            "enonce": "<p>Un mécanisme est constitué de deux engrenages \\( E_1 \\) et \\( E_2 \\) en contact. Le pignon \\( E_1 \\) a un rayon \\( R_1 = 0,05 \\, \\text{m} \\) et 20 dents. La roue \\( E_2 \\) a un rayon \\( R_2 = 0,15 \\, \\text{m} \\) et 60 dents. Le pignon tourne à la vitesse angulaire constante \\( \\omega_1 = 150 \\, \\text{rad/s} \\).</p><div style='background-color: #e9ecef; padding: 10px; border-radius: 5px; margin-top: 10px;'><p><strong>Schéma :</strong> Deux engrenages en contact, \\( E_1 \\) (petit) et \\( E_2 \\) (grand).</p></div>",
            "questions": [
                {
                    "question": "1) Déterminer le torseur cinématique du pignon \\( E_1 \\) en un point \\( A \\) de son axe, sachant que \\( \\vec{V}_A = \\vec{0} \\).",
                    "reponse": "<p>Le torseur cinématique du pignon \\( E_1 \\) est :</p><div class='math-block'><div class='math'>$$ \\{V_{E_1}\\} = \\begin{Bmatrix} \\vec{\\omega}_1 \\\\ \\vec{0} \\end{Bmatrix}_A $$</div></div><p>Avec \\( \\vec{\\omega}_1 = 150 \\, \\vec{k} \\, \\text{rad/s} \\) (perpendiculaire au plan du mécanisme).</p>"
                },
                {
                    "question": "2) Calculer la vitesse linéaire au point de contact \\( I \\) des deux engrenages.",
                    "reponse": "<p>La vitesse au point de contact sur le pignon \\( E_1 \\) est :</p><div class='math-block'><div class='math'>$$ \\vec{V}_{I \\in E_1} = \\vec{V}_A + \\vec{\\omega}_1 \\times \\vec{AI} $$</div></div><p>Comme \\( \\vec{V}_A = \\vec{0} \\) et \\( \\vec{AI} \\) est perpendiculaire à l'axe :</p><div class='math-block'><div class='math'>$$ V_{I} = \\omega_1 \\times R_1 = 150 \\times 0,05 = 7,5 \\, \\text{m/s} $$</div></div><p>La vitesse linéaire au point de contact est de \\( 7,5 \\, \\text{m/s} \\).</p>"
                },
                {
                    "question": "3) En déduire la vitesse angulaire \\( \\omega_2 \\) de la roue \\( E_2 \\).",
                    "reponse": "<p>La vitesse linéaire au point de contact est la même pour les deux engrenages (pas de glissement) :</p><div class='math-block'><div class='math'>$$ V_I = \\omega_2 \\times R_2 $$</div></div><p>\\( \\omega_2 = \\dfrac{V_I}{R_2} = \\dfrac{7,5}{0,15} = 50 \\, \\text{rad/s} \\)</p><p>La vitesse angulaire de la roue \\( E_2 \\) est de \\( 50 \\, \\text{rad/s} \\).</p>"
                },
                {
                    "question": "4) Calculer le rapport de transmission \\( r = \\dfrac{\\omega_2}{\\omega_1} \\) et vérifier la relation avec les nombres de dents.",
                    "reponse": "<p>Le rapport de transmission est :</p><div class='math-block'><div class='math'>$$ r = \\dfrac{\\omega_2}{\\omega_1} = \\dfrac{50}{150} = \\dfrac{1}{3} $$</div></div><p>Vérification avec les nombres de dents : \\( \\dfrac{Z_1}{Z_2} = \\dfrac{20}{60} = \\dfrac{1}{3} \\).</p><p>La relation \\( r = \\dfrac{Z_1}{Z_2} \\) est bien vérifiée.</p>"
                }
            ]
        }
    ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
