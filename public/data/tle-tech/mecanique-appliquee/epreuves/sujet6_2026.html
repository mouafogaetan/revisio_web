<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Mécanique Appliquée",
  "classe": "Terminale Technique",
  "sequence": "Séquence 6",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Torseur Cinématique d'un Solide en Mouvement",
      "points": "5 pts",
      "enonce": "<p>Un solide \\( S \\) est en mouvement plan. On connaît les vitesses de deux de ses points \\( A \\) et \\( B \\) :</p><ul><li>\\( \\vec{V}_A = 2\\vec{i} \\, \\text{m/s} \\)</li><li>\\( \\vec{V}_B = 4\\vec{i} + 3\\vec{j} \\, \\text{m/s} \\)</li></ul><p>On donne \\( \\vec{AB} = 0,5\\vec{i} \\, \\text{m} \\).</p><div style='background-color: #e9ecef; padding: 10px; border-radius: 5px; margin-top: 10px;'><p><strong>Schéma :</strong> Un solide avec deux points A et B, A à gauche de B, avec les vecteurs vitesses représentés.</p></div>",
      "questions": [
        {
          "question": "1) Déterminer le vecteur rotation \\( \\vec{\\Omega} \\) du solide.",
          "reponse": "<p>La loi de distribution des vitesses donne : \\( \\vec{V}_B = \\vec{V}_A + \\vec{\\Omega} \\times \\vec{AB} \\)</p><p>Soit : \\( \\vec{\\Omega} \\times (0,5\\vec{i}) = (4\\vec{i} + 3\\vec{j}) - 2\\vec{i} = 2\\vec{i} + 3\\vec{j} \\)</p><p>Le vecteur \\( \\vec{\\Omega} \\) est perpendiculaire au plan, donc \\( \\vec{\\Omega} = \\omega \\vec{k} \\).</p><p>\\( (\\omega \\vec{k}) \\times (0,5\\vec{i}) = 0,5\\omega (\\vec{k} \\times \\vec{i}) = 0,5\\omega \\vec{j} \\)</p><p>Donc : \\( 0,5\\omega \\vec{j} = 2\\vec{i} + 3\\vec{j} \\)</p><p>Ceci est impossible car il n'y a pas de composante en \\( \\vec{i} \\). Il y a une incompatibilité. Les vitesses données ne peuvent pas correspondre à un solide indéformable.</p>"
        },
        {
          "question": "2) Vérifier la propriété d'équiprojectivité. Conclure.",
          "reponse": "<p>La propriété d'équiprojectivité s'écrit : \\( \\vec{V}_A \\cdot \\vec{AB} = \\vec{V}_B \\cdot \\vec{AB} \\)</p><p>\\( \\vec{V}_A \\cdot \\vec{AB} = (2\\vec{i}) \\cdot (0,5\\vec{i}) = 2 \\times 0,5 = 1 \\, \\text{m}^2/\\text{s} \\)</p><p>\\( \\vec{V}_B \\cdot \\vec{AB} = (4\\vec{i} + 3\\vec{j}) \\cdot (0,5\\vec{i}) = 4 \\times 0,5 = 2 \\, \\text{m}^2/\\text{s} \\)</p><p>Les projections sont différentes (1 ≠ 2). La propriété d'équiprojectivité n'est pas vérifiée.</p><p><strong>Conclusion :</strong> Les vitesses données ne peuvent pas être celles d'un solide indéformable.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Composition des Mouvements dans un Système Bielles-Manivelles",
      "points": "6 pts",
      "enonce": "<p>Un mécanisme bielle-manivelle est utilisé pour transformer un mouvement de rotation en translation. La manivelle \\( OA \\) de longueur \\( r = 0,2 \\, \\text{m} \\) tourne à la vitesse angulaire constante \\( \\omega = 20 \\, \\text{rad/s} \\). La bielle \\( AB \\) de longueur \\( l = 0,8 \\, \\text{m} \\) relie la manivelle à un piston en \\( B \\) qui se déplace sur un axe horizontal.</p><div style='background-color: #e9ecef; padding: 10px; border-radius: 5px; margin-top: 10px;'><p><strong>Schéma :</strong> Mécanisme bielle-manivelle : O est fixe, OA tourne, AB relie A à B, B se déplace horizontalement.</p></div>",
      "questions": [
        {
          "question": "1) Déterminer la vitesse du point \\( A \\).",
          "reponse": "<p>La vitesse de \\( A \\) est perpendiculaire à \\( OA \\) car \\( A \\) décrit un cercle de centre \\( O \\).</p><p>\\( V_A = \\omega \\times r = 20 \\times 0,2 = 4 \\, \\text{m/s} \\)</p><p>La direction de \\( \\vec{V}_A \\) est perpendiculaire à \\( OA \\).</p>"
        },
        {
          "question": "2) En utilisant la composition des vitesses, déterminer la vitesse du point \\( B \\) sachant que \\( \\vec{V}_B \\) est horizontale et que \\( \\vec{V}_A \\) est perpendiculaire à \\( OA \\).",
          "reponse": "<p>La vitesse de \\( B \\) par rapport à \\( A \\) est perpendiculaire à \\( AB \\) (la bielle est supposée rigide).</p><p>La relation de composition s'écrit : \\( \\vec{V}_B = \\vec{V}_A + \\vec{V}_{B/A} \\)</p><p>On projette cette relation vectorielle sur l'axe horizontal et vertical.</p><p>Soit \\( \\theta \\) l'angle que fait \\( OA \\) avec l'horizontale et \\( \\varphi \\) l'angle que fait \\( AB \\) avec l'horizontale.</p><p>En projection sur l'horizontale : \\( V_B = V_A \\cos(\\theta) + V_{B/A} \\cos(\\varphi) \\)</p><p>En projection sur la verticale : \\( 0 = V_A \\sin(\\theta) - V_{B/A} \\sin(\\varphi) \\) (car \\( V_B \\) est horizontale)</p><p>De la deuxième équation : \\( V_{B/A} = \\dfrac{V_A \\sin(\\theta)}{\\sin(\\varphi)} \\)</p><p>En remplaçant dans la première : \\( V_B = V_A \\cos(\\theta) + \\dfrac{V_A \\sin(\\theta)}{\\sin(\\varphi)} \\cos(\\varphi) \\)</p><p>\\( V_B = V_A \\left( \\cos(\\theta) + \\dfrac{\\sin(\\theta)}{\\tan(\\varphi)} \\right) \\)</p>"
        },
        {
          "question": "3) Calculer \\( V_B \\) lorsque \\( \\theta = 30^\\circ \\) et \\( \\varphi = 15^\\circ \\).",
          "reponse": "<p>Application numérique avec \\( V_A = 4 \\, \\text{m/s} \\) :</p><p>\\( V_B = 4 \\times \\left( \\cos(30^\\circ) + \\dfrac{\\sin(30^\\circ)}{\\tan(15^\\circ)} \\right) \\)</p><p>\\( \\cos(30^\\circ) = 0,866 \\)</p><p>\\( \\sin(30^\\circ) = 0,5 \\)</p><p>\\( \\tan(15^\\circ) \\approx 0,268 \\)</p><p>\\( V_B = 4 \\times \\left( 0,866 + \\dfrac{0,5}{0,268} \\right) = 4 \\times (0,866 + 1,866) = 4 \\times 2,732 \\approx 10,93 \\, \\text{m/s} \\)</p><p>La vitesse du piston est d'environ \\( 10,93 \\, \\text{m/s} \\).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Engrenages et Rapport de Transmission",
      "points": "4 pts",
      "enonce": "<p>Un train d'engrenages est composé de deux roues dentées en contact. Le pignon d'entrée a \\( Z_1 = 25 \\) dents et tourne à \\( \\omega_1 = 300 \\, \\text{rad/s} \\). La roue de sortie a \\( Z_2 = 75 \\) dents.</p>",
      "questions": [
        {
          "question": "1) Calculer le rapport de transmission \\( r = \\dfrac{\\omega_2}{\\omega_1} \\).",
          "reponse": "<p>Le rapport de transmission est : \\( r = \\dfrac{Z_1}{Z_2} = \\dfrac{25}{75} = \\dfrac{1}{3} \\)</p><p>Le rapport de transmission est de \\( \\dfrac{1}{3} \\).</p>"
        },
        {
          "question": "2) Calculer la vitesse angulaire \\( \\omega_2 \\) de la roue de sortie.",
          "reponse": "<p>On a : \\( r = \\dfrac{\\omega_2}{\\omega_1} \\Rightarrow \\omega_2 = r \\times \\omega_1 \\)</p><p>\\( \\omega_2 = \\dfrac{1}{3} \\times 300 = 100 \\, \\text{rad/s} \\)</p><p>La vitesse angulaire de la roue de sortie est de \\( 100 \\, \\text{rad/s} \\).</p>"
        },
        {
          "question": "3) Si le pignon d'entrée a un rayon \\( R_1 = 0,05 \\, \\text{m} \\), calculer le rayon \\( R_2 \\) de la roue de sortie.",
          "reponse": "<p>Dans un engrenage, on a la relation : \\( \\dfrac{R_1}{R_2} = \\dfrac{Z_1}{Z_2} = r \\)</p><p>D'où : \\( R_2 = \\dfrac{R_1}{r} = \\dfrac{0,05}{1/3} = 0,05 \\times 3 = 0,15 \\, \\text{m} \\)</p><p>Le rayon de la roue de sortie est de \\( 0,15 \\, \\text{m} \\).</p>"
        },
        {
          "question": "4) Calculer la vitesse linéaire au point de contact des deux engrenages.",
          "reponse": "<p>La vitesse linéaire au point de contact est la même pour les deux roues :</p><p>\\( V = \\omega_1 \\times R_1 = 300 \\times 0,05 = 15 \\, \\text{m/s} \\)</p><p>Vérification avec la roue de sortie : \\( V = \\omega_2 \\times R_2 = 100 \\times 0,15 = 15 \\, \\text{m/s} \\)</p><p>La vitesse linéaire au point de contact est de \\( 15 \\, \\text{m/s} \\).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Transmission par Courroie",
      "points": "5 pts",
      "enonce": "<p>Un moteur entraîne une poulie de diamètre \\( D_1 = 200 \\, \\text{mm} \\) à la vitesse de \\( N_1 = 1200 \\, \\text{tr/min} \\). Cette poulie est reliée par une courroie à une poulie de diamètre \\( D_2 = 600 \\, \\text{mm} \\).</p>",
      "questions": [
        {
          "question": "1) Calculer la vitesse angulaire \\( \\omega_1 \\) de la poulie motrice en rad/s.",
          "reponse": "<p>\\( \\omega_1 = \\dfrac{2\\pi N_1}{60} = \\dfrac{2\\pi \\times 1200}{60} = 40\\pi \\approx 125,66 \\, \\text{rad/s} \\)</p><p>La vitesse angulaire de la poulie motrice est d'environ \\( 125,66 \\, \\text{rad/s} \\).</p>"
        },
        {
          "question": "2) Calculer la vitesse linéaire \\( V \\) de la courroie.",
          "reponse": "<p>La vitesse linéaire de la courroie est : \\( V = \\omega_1 \\times R_1 = \\omega_1 \\times \\dfrac{D_1}{2} \\)</p><p>\\( V = 125,66 \\times \\dfrac{0,2}{2} = 125,66 \\times 0,1 = 12,57 \\, \\text{m/s} \\)</p><p>La vitesse de la courroie est d'environ \\( 12,57 \\, \\text{m/s} \\).</p>"
        },
        {
          "question": "3) Calculer la vitesse de rotation \\( N_2 \\) de la poulie réceptrice en tr/min.",
          "reponse": "<p>On a : \\( V = \\omega_2 \\times R_2 \\Rightarrow \\omega_2 = \\dfrac{V}{R_2} = \\dfrac{V}{D_2/2} \\)</p><p>\\( \\omega_2 = \\dfrac{12,57}{0,3} = 41,9 \\, \\text{rad/s} \\)</p><p>\\( N_2 = \\dfrac{60 \\times \\omega_2}{2\\pi} = \\dfrac{60 \\times 41,9}{2\\pi} \\approx 400 \\, \\text{tr/min} \\)</p><p>La vitesse de la poulie réceptrice est d'environ \\( 400 \\, \\text{tr/min} \\).</p>"
        },
        {
          "question": "4) Quel est le rapport de transmission \\( r = \\dfrac{\\omega_2}{\\omega_1} \\) ?",
          "reponse": "<p>Le rapport de transmission est : \\( r = \\dfrac{\\omega_2}{\\omega_1} = \\dfrac{41,9}{125,66} \\approx \\dfrac{1}{3} \\)</p><p>Vérification : \\( r = \\dfrac{D_1}{D_2} = \\dfrac{200}{600} = \\dfrac{1}{3} \\)</p><p>Le rapport de transmission est de \\( \\dfrac{1}{3} \\).</p>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
