<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Mécanique Appliquée",
  "classe": "Terminale Technique",
  "sequence": "Sequence 3",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Évaluation des Connaissances en Cinématique et Dynamique",
      "points": "3 pts",
      "enonce": "<p>Cet exercice vise à évaluer vos connaissances théoriques sur les notions fondamentales de la dynamique, de la cinématique et de la résistance des matériaux.</p>",
      "questions": [
        {
          "question": "<p>1. Distinguez clairement le domaine d'étude de la <strong>Statique</strong> de celui de la <strong>Dynamique</strong>. En vous appuyant sur le principe fondamental de la dynamique (PFD), expliquez comment on passe de l'étude d'un système au repos à celle d'un système en mouvement.</p>",
          "reponse": "<p>La <strong>Statique</strong> est le domaine de la mécanique qui étudie les corps au repos ou en mouvement de translation rectiligne uniforme (équilibre). La <strong>Dynamique</strong> étudie les corps en mouvement accéléré. Le PFD s'énonce : \\( \\sum \\vec{F} = m \\cdot \\vec{a} \\). Il permet de passer de l'équilibre (où \\( \\vec{a} = 0 \\), donc \\( \\sum \\vec{F} = 0 \\)) à un mouvement accéléré en reliant la résultante des forces à l'accélération. Cette accélération est la cause de la variation du mouvement.</p>"
        },
        {
          "question": "<p>2. L'énergie cinétique (\\(E_c\\)) d'un solide en translation et celle d'un solide en rotation sont exprimées par des formules différentes. <br> a) Rappelez ces deux formules, en définissant clairement chaque paramètre. <br> b) Le théorème de l'énergie cinétique (TEC) permet de relier la variation de \\(E_c\\) au travail des forces. Pourquoi le théorème est-il particulièrement utile pour déterminer une vitesse ou un effort inconnu dans un système mécanique ?</p>",
          "reponse": "<p>a) Pour un solide en <strong>translation</strong>, la formule est : \\( E_c = \\frac{1}{2} \\cdot m \\cdot v^2 \\), où \\(m\\) est la masse (en kg) et \\(v\\) la vitesse (en m/s). <br> Pour un solide en <strong>rotation</strong> autour d'un axe fixe, la formule est : \\( E_c = \\frac{1}{2} \\cdot J_{\\Delta} \\cdot \\omega^2 \\), où \\(J_{\\Delta}\\) est le moment d'inertie (en kg·m²) et \\(\\omega\\) la vitesse angulaire (en rad/s). <br> b) Le TEC ( \\(\\Delta E_c = \\sum W(\\vec{F}) \\)) est un bilan énergétique qui permet de résoudre des problèmes en évitant de calculer les accélérations à chaque instant. Il relie directement la vitesse à un travail, ce qui est idéal pour déterminer des vitesses (par intégration) ou des efforts (par dérivation) lorsque la trajectoire et les forces sont connues.</p>"
        },
        {
          "question": "<p>3. En Résistance des Matériaux (RDM), les sollicitations simples sont nombreuses. <br> a) Citez trois sollicitations simples différentes. <br> b) Pour la sollicitation de <strong>traction simple</strong>, qu'appelle-t-on la contrainte normale \\(\\sigma\\) ? Donnez sa formule et son unité. <br> c) Quelle est la condition de résistance à respecter pour qu'une pièce soumise à la traction ne subisse pas de déformation permanente ?</p>",
          "reponse": "<p>a) Trois sollicitations simples sont : la <strong>Traction</strong>, la <strong>Compression</strong> et le <strong>Cisaillement</strong>. (Torsion et Flexion sont également des sollicitations simples). <br> b) La contrainte normale \\(\\sigma\\) est définie comme l'effort normal \\(N\\) divisé par la section \\(S\\) de la pièce. Sa formule est \\( \\sigma = \\frac{N}{S} \\). Son unité est le Pascal (Pa) ou le MégaPascal (MPa). <br> c) La condition de résistance est : \\( \\sigma \\le R_{pe} \\), où \\(R_{pe}\\) est la résistance pratique à l'extension (ou la limite d'élasticité pratique). Cela garantit que la pièce ne subit pas de déformation permanente.</p>"
        }
      ]
    },
    {
      "titre": "Application du PFD et Théorèmes de l'Énergie",
      "points": "4 pts",
      "enonce": "<div style='background-color: #f0f8ff; padding: 12px; border-radius: 8px; border-left: 4px solid #0073e6; color: #000;'><p>Un véhicule de masse \\( m = 1200 \\, kg \\) roule sur une route horizontale rectiligne à la vitesse constante \\( v = 72 \\, km/h \\). Le conducteur freine brusquement en bloquant les roues. Le coefficient de frottement entre les pneus et la route est \\( f = 0,7 \\). La résistance de l'air est négligée.</p></div>",
      "questions": [
        {
          "question": "<p>1) (Calcul) Convertir la vitesse en \\( m/s \\). Quelle est l'énergie cinétique initiale du véhicule ?</p>",
          "reponse": "<p>Conversion : \\( v = 72 \\, km/h = \\frac{72 \\times 1000}{3600} = 20 \\, m/s \\). <br> Énergie cinétique initiale : \\( E_c = \\frac{1}{2} m v^2 = \\frac{1}{2} \\times 1200 \\times 20^2 = 600 \\times 400 = 240\\,000 \\, J = 240 \\, kJ \\).</p>"
        },
        {
          "question": "<p>2) (Analyse) La force de frottement \\( \\vec{F} \\) est la seule force horizontale lors du freinage. Calculez sa norme en utilisant le PFD sur l'axe vertical puis la relation \\( F = f \\cdot R \\).</p>",
          "reponse": "<p>Sur l'axe vertical, la réaction normale \\( R \\) est égale au poids \\( P = m \\cdot g \\) car il n'y a pas de mouvement vertical ( \\( a_y = 0 \\) ). <br> \\( R = m \\cdot g = 1200 \\times 9,81 = 11\\,772 \\, N \\). <br> La force de frottement est \\( F = f \\cdot R = 0,7 \\times 11\\,772 \\approx 8\\,240 \\, N \\).</p>"
        },
        {
          "question": "<p>3) (Application du TEC) En appliquant le Théorème de l'Énergie Cinétique (TEC), calculer la distance de freinage \\( d \\) du véhicule.</p>",
          "reponse": "<p>Le TEC donne : \\( \\Delta E_c = \\sum W(\\vec{F}) \\). <br> La variation d'énergie cinétique est \\( \\Delta E_c = 0 - 240\\,000 = -240\\,000 \\, J \\) (car la vitesse finale est nulle). <br> Le travail de la force de frottement est \\( W = \\vec{F} \\cdot \\vec{d} = -F \\cdot d \\) (car la force est opposée au déplacement). <br> On a donc \\( -F \\cdot d = -240\\,000 \\Rightarrow F \\cdot d = 240\\,000 \\). <br> \\( d = \\frac{240\\,000}{8\\,240} \\approx 29,1 \\, m \\). <br> La distance de freinage est d'environ \\( 29,1 \\, m \\).</p>"
        }
      ]
    },
    {
      "titre": "Étude d'une Poutre en Flexion",
      "points": "4 pts",
      "enonce": "<div style='background-color: #f5f5dc; padding: 12px; border-radius: 8px; border-left: 4px solid #8b4513; color: #000;'><p>Une poutre simplement appuyée de longueur \\( L = 4 \\, m \\) repose sur deux appuis simples en A et B. Elle est soumise à une charge uniformément répartie \\( q = 2\\,000 \\, N/m \\) sur toute sa longueur. Le moment fléchissant maximal pour ce type de chargement est \\( M_{f,max} = \\frac{q \\cdot L^2}{8} \\). La poutre a une section rectangulaire pleine de largeur \\( b = 80 \\, mm \\) et de hauteur \\( h = 120 \\, mm \\). Le moment quadratique de la section est \\( I_{Gz} = \\frac{b \\cdot h^3}{12} \\).</p></div>",
      "questions": [
        {
          "question": "<p>1) (Conception) Calculer le moment fléchissant maximal \\( M_{f,max} \\) en \\( N\\cdot m \\).</p>",
          "reponse": "<p>\\( M_{f,max} = \\frac{q \\cdot L^2}{8} = \\frac{2000 \\times 4^2}{8} = \\frac{2000 \\times 16}{8} = 4000 \\, N\\cdot m \\).</p>"
        },
        {
          "question": "<p>2) (Application numérique) Convertir les dimensions de la section en mètres, puis calculer le moment quadratique \\( I_{Gz} \\). En déduire la contrainte normale maximale \\( \\sigma_{max} \\) (en \\( MPa \\) et en \\( N/mm^2 \\)) en utilisant la formule \\( \\sigma_{max} = \\frac{M_{f,max}}{I_{Gz}/v} \\) où \\( v = h/2 \\).</p>",
          "reponse": "<p>Dimensions en mètres : \\( b = 0,08 \\, m \\), \\( h = 0,12 \\, m \\). <br> \\( I_{Gz} = \\frac{b \\cdot h^3}{12} = \\frac{0,08 \\times 0,12^3}{12} = \\frac{0,08 \\times 0,001728}{12} = \\frac{0,00013824}{12} = 1,152 \\times 10^{-5} \\, m^4 \\). <br> \\( v = \\frac{h}{2} = \\frac{0,12}{2} = 0,06 \\, m \\). <br> \\( \\sigma_{max} = \\frac{M_{f,max}}{I_{Gz}/v} = \\frac{4000}{1,152 \\times 10^{-5} / 0,06} = \\frac{4000}{1,92 \\times 10^{-4}} = 20\\,833\\,333 \\, Pa \\approx 20,8 \\, MPa \\). En \\( N/mm^2 \\), cela donne \\( 20,8 \\, N/mm^2 \\) (car \\( 1\\,MPa = 1\\,N/mm^2 \\)).</p>"
        },
        {
          "question": "<p>3) (Critique) La contrainte maximale trouvée est de \\( 20,8 \\, MPa \\). Si le matériau a une résistance pratique à la flexion de \\( R_{pe} = 25 \\, MPa \\), la poutre est-elle bien dimensionnée ? Justifiez votre réponse.</p>",
          "reponse": "<p>La condition de résistance est \\( \\sigma_{max} \\le R_{pe} \\). <br> Ici, \\( 20,8 \\, MPa \\le 25 \\, MPa \\). La condition est vérifiée, la poutre est donc bien dimensionnée pour supporter cette charge.</p>"
        }
      ]
    },
    {
      "titre": "Analyse d'un Mécanisme Bielle-Manivelle",
      "points": "4 pts",
      "enonce": "<div style='background-color: #e6ffe6; padding: 12px; border-radius: 8px; border-left: 4px solid #008000; color: #000;'><p>Un mécanisme bielle-manivelle est utilisé dans un moteur. La manivelle \\( OA \\) de longueur \\( r = 40 \\, mm \\) tourne autour d'un axe fixe \\( O \\) à la vitesse angulaire constante \\( \\omega = 100 \\, rad/s \\). La bielle \\( AB \\) de longueur \\( l = 120 \\, mm \\) est articulée en \\( A \\) et en \\( B \\) (piston). Le piston se déplace suivant un axe horizontal passant par \\( O \\). À un instant donné, \\( \\theta = 30° \\).</p></div>",
      "questions": [
        {
          "question": "<p>1) (Connaissances) Rappelez la loi de composition des vitesses pour le point \\( A \\), qui est un point commun à la manivelle et à la bielle.</p>",
          "reponse": "<p>Le point \\( A \\) appartient à la fois à la manivelle (solide 1) et à la bielle (solide 2). La loi de composition des vitesses s'écrit : <br> \\( \\vec{V}(A \\in 1/0) = \\vec{V}(A \\in 2/0) \\). <br> Autrement dit, la vitesse du point \\( A \\) est la même qu'on la considère comme appartenant à la manivelle ou à la bielle.</p>"
        },
        {
          "question": "<p>2) (Application) Calculez la norme de la vitesse du point \\( A \\) appartenant à la manivelle. Utilisez la formule \\( v = \\omega \\cdot r \\).</p>",
          "reponse": "<p>En convertissant \\( r = 40 \\, mm = 0,04 \\, m \\) : <br> \\( v_A = \\omega \\cdot r = 100 \\times 0,04 = 4 \\, m/s \\). <br> La vitesse de \\( A \\) est de \\( 4 \\, m/s \\).</p>"
        },
        {
          "question": "<p>3) (Déduction) En vous appuyant sur la loi de distribution des vitesses dans la bielle, écrivez la relation vectorielle qui donne la vitesse du point \\( B \\) en fonction de la vitesse de \\( A \\) et de la vitesse angulaire \\( \\omega_{bielle} \\) de la bielle. <br> \\( \\vec{V}(B \\in 2/0) = \\vec{V}(A \\in 2/0) + ? \\)</p>",
          "reponse": "<p>La loi de distribution des vitesses dans un solide indéformable (la bielle) s'écrit : <br> \\( \\vec{V}(B \\in 2/0) = \\vec{V}(A \\in 2/0) + \\vec{\\Omega}_{2/0} \\wedge \\vec{AB} \\). <br> Où \\( \\vec{\\Omega}_{2/0} = \\omega_{bielle} \\cdot \\vec{z} \\) est le vecteur rotation de la bielle par rapport au référentiel fixe. La relation complète est donc : <br> \\( \\vec{V}(B \\in 2/0) = \\vec{V}(A \\in 2/0) + \\vec{\\omega}_{bielle} \\wedge \\vec{AB} \\).</p>"
        }
      ]
    },
    {
      "titre": "Transmission de Puissance par Engrenages",
      "points": "5 pts",
      "enonce": "<div style='background-color: #fff0f5; padding: 12px; border-radius: 8px; border-left: 4px solid #c71585; color: #000;'><p>Un train d'engrenages simple est composé de deux roues dentées : <br> Roue 1 (menante) : \\( Z_1 = 20 \\) dents, rayon primitif \\( r_1 = 40 \\, mm \\). <br> Roue 2 (menée) : \\( Z_2 = 50 \\) dents.</p></div>",
      "questions": [
        {
          "question": "<p>1) (Calcul) La roue 1 tourne à une vitesse \\( N_1 = 1500 \\, tr/min \\). Calculez la vitesse de rotation \\( N_2 \\) de la roue 2.</p>",
          "reponse": "<p>Le rapport de transmission est : \\( \\frac{N_2}{N_1} = \\frac{Z_1}{Z_2} \\). <br> Donc \\( N_2 = N_1 \\times \\frac{Z_1}{Z_2} = 1500 \\times \\frac{20}{50} = 1500 \\times 0,4 = 600 \\, tr/min \\). <br> La roue 2 tourne à \\( 600 \\, tr/min \\).</p>"
        },
        {
          "question": "<p>2) (Application numérique) Calculez les vitesses angulaires \\( \\omega_1 \\) et \\( \\omega_2 \\) en \\( rad/s \\).</p>",
          "reponse": "<p>\\( \\omega_1 = \\frac{2\\pi \\cdot N_1}{60} = \\frac{2\\pi \\times 1500}{60} = 50\\pi \\approx 157,1 \\, rad/s \\). <br> \\( \\omega_2 = \\frac{2\\pi \\cdot N_2}{60} = \\frac{2\\pi \\times 600}{60} = 20\\pi \\approx 62,8 \\, rad/s \\).</p>"
        },
        {
          "question": "<p>3) (Théorème de l'énergie) La roue 2 transmet un couple résistant \\( C_2 = 20 \\, N\\cdot m \\). En négligeant les pertes (rendement \\( \\eta = 1 \\)), quelle est la puissance \\( P \\) fournie par la roue 2 ? Quelle est la puissance \\( P \\) que doit fournir la roue 1 ? En déduire le couple \\( C_1 \\) sur la roue 1.</p>",
          "reponse": "<p>Puissance fournie par la roue 2 : \\( P_2 = C_2 \\cdot \\omega_2 = 20 \\times 62,8 = 1256 \\, W \\approx 1,26 \\, kW \\). <br> Si le rendement est de \\( 100\\% \\), la puissance se conserve : \\( P_1 = P_2 = 1256 \\, W \\). <br> Le couple sur la roue 1 est : \\( C_1 = \\frac{P_1}{\\omega_1} = \\frac{1256}{157,1} \\approx 8 \\, N\\cdot m \\). <br> On retrouve que le couple est inversement proportionnel à la vitesse.</p>"

};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
