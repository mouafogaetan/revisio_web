<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Mécanique Appliquée",
  "classe": "Terminale Technique",
  "sequence": "Séquence 2",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Questions de Cours",
      "points": "4 pts",
      "enonce": "<div style='background-color: #f8f9fa; padding: 15px; border-radius: 10px; color: #212529; font-size: 1em;'><p style='font-weight: bold;'>Répondez aux questions suivantes de manière claire et précise :</p></div>",
      "questions": [
        {
          "question": "1) Énoncer le Principe Fondamental de la Dynamique (PFD) pour un solide en translation. Donner les unités de chaque grandeur.",
          "reponse": "Le PFD s'énonce : \\( \\sum \\vec{F}_{ext} = m \\cdot \\vec{a} \\). La somme vectorielle des forces extérieures appliquées à un solide est égale au produit de sa masse par son accélération. Les unités sont : \\( \\vec{F} \\) en Newton (N), \\( m \\) en kilogramme (kg) et \\( \\vec{a} \\) en mètre par seconde carrée (m/s²)."
        },
        {
          "question": "2) Rappeler la loi de Hooke en traction et donner la signification de chaque terme.",
          "reponse": "La loi de Hooke s'écrit : \\( \\sigma = E \\times \\varepsilon \\). \\( \\sigma \\) est la contrainte normale en \\( \\text{Pa} \\) ou \\( \\text{MPa} \\), \\( E \\) est le module d'Young (ou module d'élasticité) en \\( \\text{Pa} \\) (caractéristique du matériau), et \\( \\varepsilon = \\frac{\\Delta L}{L_0} \\) est l'allongement relatif (sans unité)."
        },
        {
          "question": "3) Définir le torseur cinématique d'un solide. Quelles sont ses composantes ?",
          "reponse": "Le torseur cinématique est l'outil mathématique qui permet de décrire complètement le mouvement d'un solide indéformable. Il est composé de la résultante \\( \\vec{\\Omega} \\) (vecteur rotation) et du moment \\( \\vec{V} \\) (vecteur vitesse) en un point donné. On le note : \\( \\{ \\mathcal{V} \\} = \\begin{Bmatrix} \\vec{\\Omega} \\\\ \\vec{V} \\end{Bmatrix} \\) au point considéré."
        },
        {
          "question": "4) Donner la relation liant les vitesses angulaires de deux engrenages en contact. Justifier.",
          "reponse": "La relation est \\( \\omega_1 \\times R_1 = \\omega_2 \\times R_2 \\). Au point de contact des deux roues dentées, les vitesses linéaires sont égales : \\( V = \\omega_1 \\times R_1 = \\omega_2 \\times R_2 \\). Le rapport de transmission est donc \\( \\frac{\\omega_2}{\\omega_1} = \\frac{R_1}{R_2} \\)."
        }
      ]
    },
    {
      "titre": "Exercice 2 : Dynamique et Théorème de l'Énergie Cinétique",
      "points": "6 pts",
      "enonce": "<div style='background-color: #f8f9fa; padding: 15px; border-radius: 10px; color: #212529;'><p>Un véhicule de masse \\( m = 1200\\,\\text{kg} \\) roule sur une route horizontale. Il est soumis à une force motrice constante \\( F = 2000\\,\\text{N} \\) et à une force de frottement résistante \\( f = 400\\,\\text{N} \\). Le véhicule part du repos.</p><div style='background: #e9ecef; padding: 10px; border-radius: 8px; margin: 10px 0; color: #212529;'><p style='font-weight: bold;'>Données :</p><p>\\( m = 1200\\,\\text{kg} \\), \\( F = 2000\\,\\text{N} \\), \\( f = 400\\,\\text{N} \\), \\( v_0 = 0\\,\\text{m/s} \\)</p></div></div>",
      "questions": [
        {
          "question": "1) Appliquer le PFD au véhicule. En déduire l'accélération \\( a \\) du véhicule.",
          "reponse": "Bilan des forces extérieures : poids \\( \\vec{P} \\), réaction du sol \\( \\vec{R} \\), force motrice \\( \\vec{F} \\) et force de frottement \\( \\vec{f} \\).<br>Sur l'axe horizontal : \\( \\sum F_x = F - f = m \\cdot a \\).<br>Donc \\( a = \\frac{F - f}{m} = \\frac{2000 - 400}{1200} = \\frac{1600}{1200} \\approx 1,33\\,\\text{m/s}^2 \\)."
        },
        {
          "question": "2) Calculer la vitesse du véhicule après un parcours de \\( d = 100\\,\\text{m} \\) en utilisant le théorème de l'énergie cinétique.",
          "reponse": "Le TEC s'écrit : \\( \\Delta E_c = \\sum W(\\vec{F}_{ext}) \\).<br>\\( \\frac{1}{2} m v^2 - \\frac{1}{2} m v_0^2 = (F - f) \\times d \\) (seules les forces horizontales travaillent).<br>\\( \\frac{1}{2} \\times 1200 \\times v^2 = (2000 - 400) \\times 100 = 1600 \\times 100 = 160000 \\).<br>\\( v^2 = \\frac{160000 \\times 2}{1200} = \\frac{320000}{1200} \\approx 266,67 \\Rightarrow v \\approx \\sqrt{266,67} \\approx 16,3\\,\\text{m/s} \\)."
        },
        {
          "question": "3) Vérifier la cohérence des résultats obtenus par le PFD et le TEC.",
          "reponse": "Par le PFD, \\( v^2 = v_0^2 + 2ad = 0 + 2 \\times 1,33 \\times 100 = 266 \\Rightarrow v \\approx 16,3\\,\\text{m/s} \\). Les deux méthodes donnent le même résultat, ce qui confirme la cohérence et l'équivalence entre le PFD et le TEC."
        }
      ]
    },
    {
      "titre": "Exercice 3 : Résistance des Matériaux - Traction et Cisaillement",
      "points": "5 pts",
      "enonce": "<div style='background-color: #f8f9fa; padding: 15px; border-radius: 10px; color: #212529;'><p>Un câble en acier de diamètre \\( d = 10\\,\\text{mm} \\) est utilisé pour soulever une charge. Il est soumis à un effort de traction \\( F = 20\\,\\text{kN} \\). Le câble est fixé à une poutre par l'intermédiaire d'un axe de diamètre \\( D = 12\\,\\text{mm} \\).</p><div style='background: #e9ecef; padding: 10px; border-radius: 8px; margin: 10px 0; color: #212529;'><p style='font-weight: bold;'>Données :</p><p>Acier : \\( E = 210\\,\\text{GPa} \\), \\( R_{pe} = 250\\,\\text{MPa} \\), \\( R_{pg} = 80\\,\\text{MPa} \\)</p></div></div>",
      "questions": [
        {
          "question": "1) Calculer la contrainte normale \\( \\sigma \\) dans le câble. Vérifier la condition de résistance en traction.",
          "reponse": "Section du câble : \\( S = \\frac{\\pi d^2}{4} = \\frac{\\pi \\times (10\\times 10^{-3})^2}{4} = \\frac{\\pi \\times 100 \\times 10^{-6}}{4} = 7,85 \\times 10^{-5}\\,\\text{m}^2 = 78,5\\,\\text{mm}^2 \\).<br>Contrainte : \\( \\sigma = \\frac{F}{S} = \\frac{20000}{78,5 \\times 10^{-6}} = 254,8\\,\\text{MPa} \\).<br>Condition : \\( \\sigma = 254,8\\,\\text{MPa} \\le R_{pe} = 250\\,\\text{MPa} \\) <span style='color: red;'>non vérifiée</span>. Le câble n'est pas résistant, il faut augmenter le diamètre."
        },
        {
          "question": "2) L'axe de fixation est sollicité en double cisaillement. Calculer la contrainte tangentielle \\( \\tau \\) dans l'axe.",
          "reponse": "Section de l'axe : \\( S = \\frac{\\pi D^2}{4} = \\frac{\\pi \\times (12\\times 10^{-3})^2}{4} = \\frac{\\pi \\times 144 \\times 10^{-6}}{4} = 113,1\\,\\text{mm}^2 \\).<br>En double cisaillement, l'effort est réparti sur deux sections : \\( \\tau = \\frac{F}{2 \\times S} = \\frac{20000}{2 \\times 113,1 \\times 10^{-6}} = \\frac{20000}{226,2 \\times 10^{-6}} = 88,4\\,\\text{MPa} \\)."
        },
        {
          "question": "3) Vérifier la condition de résistance en cisaillement pour l'axe.",
          "reponse": "Condition : \\( \\tau = 88,4\\,\\text{MPa} \\le R_{pg} = 80\\,\\text{MPa} \\) <span style='color: red;'>non vérifiée</span>. L'axe n'est pas résistant en cisaillement. Il faut augmenter son diamètre ou choisir un matériau avec une résistance pratique au glissement plus élevée."
        }
      ]
    },
    {
      "titre": "Exercice 4 : Torsion d'un Arbre de Transmission",
      "points": "5 pts",
      "enonce": "<div style='background-color: #f8f9fa; padding: 15px; border-radius: 10px; color: #212529;'><p>Un arbre de transmission en acier de diamètre \\( d = 30\\,\\text{mm} \\) transmet une puissance \\( P = 15\\,\\text{kW} \\) à une vitesse de rotation \\( N = 1500\\,\\text{tr/min} \\).</p><div style='background: #e9ecef; padding: 10px; border-radius: 8px; margin: 10px 0; color: #212529;'><p style='font-weight: bold;'>Données :</p><p>Acier : \\( R_{pg} = 80\\,\\text{MPa} \\), \\( G = 80\\,\\text{GPa} \\)</p></div></div>",
      "questions": [
        {
          "question": "1) Calculer la vitesse angulaire \\( \\omega \\) de l'arbre en rad/s.",
          "reponse": "\\( \\omega = \\frac{2\\pi N}{60} = \\frac{2\\pi \\times 1500}{60} = 157,1\\,\\text{rad/s} \\)"
        },
        {
          "question": "2) Calculer le couple de torsion \\( C \\) transmis par l'arbre.",
          "reponse": "\\( P = C \\times \\omega \\Rightarrow C = \\frac{P}{\\omega} = \\frac{15000}{157,1} \\approx 95,5\\,\\text{N}\\cdot\\text{m} \\)"
        },
        {
          "question": "3) Calculer la contrainte tangentielle maximale \\( \\tau_{max} \\) dans l'arbre. Vérifier la condition de résistance.",
          "reponse": "Moment d'inertie polaire : \\( I_o = \\frac{\\pi d^4}{32} = \\frac{\\pi \\times (30\\times 10^{-3})^4}{32} = 7,95 \\times 10^{-8}\\,\\text{m}^4 \\).<br>Distance maximale à l'axe : \\( v = \\frac{d}{2} = 15\\,\\text{mm} = 15 \\times 10^{-3}\\,\\text{m} \\).<br>Contrainte : \\( \\tau_{max} = \\frac{M_t \\times v}{I_o} = \\frac{95,5 \\times 15 \\times 10^{-3}}{7,95 \\times 10^{-8}} \\approx 18,0\\,\\text{MPa} \\).<br>Condition : \\( \\tau_{max} = 18\\,\\text{MPa} \\le R_{pg} = 80\\,\\text{MPa} \\) <span style='color: green;'>vérifiée</span>. L'arbre est résistant en torsion."
        }
      ]
    },
    {
      "titre": "Exercice 5 : Torseur Cinématique et Composition des Mouvements",
      "points": "5 pts",
      "enonce": "<div style='background-color: #f8f9fa; padding: 15px; border-radius: 10px; color: #212529;'><p>Un mécanisme est composé de deux roues dentées en contact. La roue 1 de rayon \\( R_1 = 0,1\\,\\text{m} \\) est entraînée à une vitesse angulaire \\( \\omega_1 = 120\\,\\text{rad/s} \\). La roue 2 a un rayon \\( R_2 = 0,25\\,\\text{m} \\).</p><div style='background: #e9ecef; padding: 10px; border-radius: 8px; margin: 10px 0; color: #212529;'><p style='font-weight: bold;'>Données :</p><p>\\( R_1 = 0,1\\,\\text{m} \\), \\( \\omega_1 = 120\\,\\text{rad/s} \\), \\( R_2 = 0,25\\,\\text{m} \\)</p></div></div>",
      "questions": [
        {
          "question": "1) Déterminer le torseur cinématique de la roue 1 en son centre O₁.",
          "reponse": "Le torseur cinématique de la roue 1 en son centre O₁ est : <br>\\( \\{ \\mathcal{V}_{1} \\} = \\begin{Bmatrix} \\vec{\\omega}_1 \\\\ \\vec{0} \\end{Bmatrix} \\) avec \\( \\vec{\\omega}_1 = 120\\,\\vec{k}\\,\\text{rad/s} \\) (selon l'axe de rotation)."
        },
        {
          "question": "2) Calculer la vitesse du point de contact I entre les deux roues.",
          "reponse": "Au point de contact I, la vitesse linéaire est \\( V_I = \\omega_1 \\times R_1 = 120 \\times 0,1 = 12\\,\\text{m/s} \\)."
        },
        {
          "question": "3) Calculer la vitesse angulaire \\( \\omega_2 \\) de la roue 2.",
          "reponse": "La vitesse linéaire au point de contact est la même pour les deux roues : \\( V_I = \\omega_1 \\times R_1 = \\omega_2 \\times R_2 \\).<br>Donc \\( \\omega_2 = \\frac{\\omega_1 \\times R_1}{R_2} = \\frac{120 \\times 0,1}{0,25} = \\frac{12}{0,25} = 48\\,\\text{rad/s} \\)."
        },
        {
          "question": "4) Calculer le rapport de transmission \\( r = \\frac{\\omega_2}{\\omega_1} \\).",
          "reponse": "Le rapport de transmission est \\( r = \\frac{\\omega_2}{\\omega_1} = \\frac{48}{120} = 0,4 \\). <br>On vérifie que \\( r = \\frac{R_1}{R_2} = \\frac{0,1}{0,25} = 0,4 \\)."
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
