<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Informatique",
  "classe": "Tle Technique (Tle TI)",
  "sequence": "Séquence 4",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Architecture des Systèmes Informatiques et Outils TIC",
      "points": "4 pts",
      "enonce": "<p style='font-size: 1rem; color: #2d3436;'>Cet exercice porte sur l'architecture des systèmes informatiques, les types de systèmes et les outils des Technologies de l'Information et de la Communication (TIC).</p><div style='background-color: #dfe6e9; padding: 15px; border-radius: 8px; margin-top: 10px; color: #2d3436;'><p><strong>Document :</strong> Un système informatique est un ensemble de composants (matériels, logiciels et humains) qui interagissent pour traiter l'information. On distingue généralement trois types de systèmes informatiques : les systèmes personnels, les systèmes d'organisation et les systèmes de contrôle-commande.</p></div>",
      "questions": [
        {
          "question": "<p><strong>1. (1 pt)</strong> Définir en une phrase un système informatique.</p>",
          "reponse": "<p>Un système informatique est un ensemble organisé de ressources matérielles, logicielles et humaines qui permet de collecter, traiter, stocker et diffuser de l'information pour atteindre un objectif précis.</p>"
        },
        {
          "question": "<p><strong>2. (1.5 pts)</strong> Citer et décrire brièvement les trois types de systèmes informatiques évoqués dans le document.</p>",
          "reponse": "<ul style='list-style-type: disc; padding-left: 20px;'><li><strong>Système personnel :</strong> Conçu pour un usage individuel. Exemples : ordinateurs de bureau, ordinateurs portables, smartphones.</li><li><strong>Système d'organisation :</strong> Destiné à une entreprise ou une organisation pour gérer ses opérations. Exemples : les systèmes de gestion des ressources humaines, les systèmes de gestion de la relation client (CRM).</li><li><strong>Système de contrôle-commande :</strong> Utilisé pour surveiller et contrôler des processus physiques ou techniques. Exemples : les systèmes embarqués dans les voitures, les systèmes de pilotage d'avions, les automates industriels.</li></ul>"
        },
        {
          "question": "<p><strong>3. (1.5 pts)</strong> Donner un exemple d'outil TIC <strong>matériel</strong> et un exemple d'outil TIC <strong>logiciel</strong> et décrire leur utilité dans un environnement éducatif.</p>",
          "reponse": "<ul style='list-style-type: disc; padding-left: 20px;'><li><strong>Outil TIC matériel :</strong> Le vidéoprojecteur interactif. Il permet de projeter l'écran de l'ordinateur sur une surface plus grande, facilitant les présentations et le partage de contenu numérique avec toute la classe.</li><li><strong>Outil TIC logiciel :</strong> La plateforme de gestion de classe (ex: Moodle, Google Classroom). Elle permet de diffuser des cours, de rendre des devoirs, de communiquer avec les élèves et de suivre leurs progrès.</li></ul>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Logiciels, Pilotes et Architecture de l'Ordinateur",
      "points": "4 pts",
      "enonce": "<p style='font-size: 1rem; color: #2d3436;'>Cet exercice porte sur la classification des logiciels, le rôle des pilotes et les composants matériels d'un ordinateur.</p>",
      "questions": [
        {
          "question": "<p><strong>1. (1.5 pts)</strong> Décrire les trois principaux types de logiciels (système, application, utilitaire) en donnant un exemple pour chacun.</p>",
          "reponse": "<ul style='list-style-type: disc; padding-left: 20px;'><li><strong>Logiciels système :</strong> Ce sont les logiciels qui gèrent les ressources matérielles et fournissent une plateforme pour les autres logiciels. <em>Exemple :</em> Windows, Linux, macOS.</li><li><strong>Logiciels d'application :</strong> Ce sont des programmes conçus pour aider l'utilisateur à effectuer des tâches spécifiques. <em>Exemple :</em> Microsoft Word, Excel, un navigateur web comme Firefox.</li><li><strong>Logiciels utilitaires :</strong> Ils effectuent des tâches de maintenance ou d'optimisation du système. <em>Exemple :</em> un antivirus, un logiciel de nettoyage de disque (CCleaner).</li></ul>"
        },
        {
          "question": "<p><strong>2. (1 pt)</strong> Donner le rôle d'un pilote (driver).</p>",
          "reponse": "<p>Un pilote (ou driver) est un logiciel qui permet au système d'exploitation de communiquer et de contrôler un périphérique matériel spécifique. Il fait le lien entre le matériel et le logiciel.</p>"
        },
        {
          "question": "<p><strong>3. (1.5 pts)</strong> Expliquer le schéma fonctionnel simplifié de l'ordinateur (Unité Centrale, Entrée/Sortie, Mémoire) en décrivant le rôle de chaque élément.</p>",
          "reponse": "<p>Le schéma fonctionnel simplifié de l'ordinateur repose sur le modèle de von Neumann :</p><ul style='list-style-type: disc; padding-left: 20px;'><li><strong>Unité Centrale (UC) :</strong> C'est le cerveau de l'ordinateur. Elle est composée de l'unité de contrôle (qui orchestre les opérations) et de l'unité arithmétique et logique (UAL) qui effectue les calculs.</li><li><strong>Périphériques d'entrée :</strong> Ils permettent de fournir des données à l'ordinateur. <em>Exemples :</em> clavier, souris, scanner.</li><li><strong>Périphériques de sortie :</strong> Ils permettent de restituer les informations traitées. <em>Exemples :</em> écran, imprimante.</li><li><strong>Mémoire :</strong> Elle stocke les données et les instructions. On distingue la mémoire vive (RAM) qui est volatile et la mémoire morte (ROM) qui est non-volatile. Les données transitent par la mémoire pour être traitées par l'unité centrale.</li></ul>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Protection et Maintenance de l'Environnement de Travail",
      "points": "4 pts",
      "enonce": "<p style='font-size: 1rem; color: #2d3436;'>Cet exercice porte sur les mesures de protection et de maintenance d'un environnement informatique.</p><div style='background-color: #fdf2e9; padding: 15px; border-radius: 8px; margin-top: 10px; border-left: 4px solid #e67e22; color: #2d3436;'><p><strong>Situation :</strong> Un élève de la classe de Tle TI utilise régulièrement la salle informatique. Il remarque que les ordinateurs redémarrent parfois soudainement et que certains fichiers sont corrompus. Il soupçonne un problème électrique et un manque de maintenance.</p></div>",
      "questions": [
        {
          "question": "<p><strong>1. (0.5 pt)</strong> Définir le mot « maintenance ».</p>",
          "reponse": "<p>La maintenance est l'ensemble des actions techniques, administratives et de management qui permettent de maintenir ou de rétablir un bien (ici un système informatique) dans un état spécifié afin qu'il puisse accomplir une fonction requise.</p>"
        },
        {
          "question": "<p><strong>2. (1 pt)</strong> Identifier les catégories de maintenance qui pourraient prévenir les problèmes observés dans la situation.</p>",
          "reponse": "<p>Deux catégories principales de maintenance pourraient résoudre ces problèmes :</p><ul style='list-style-type: disc; padding-left: 20px;'><li><strong>Maintenance matérielle :</strong> Consiste à vérifier et à remplacer les composants défectueux, comme le bloc d'alimentation qui pourrait être instable.</li><li><strong>Maintenance logicielle :</strong> Consiste à mettre à jour les logiciels, les antivirus et les pilotes pour prévenir les corruptions de fichiers et les bugs.</li></ul>"
        },
        {
          "question": "<p><strong>3. (1.5 pts)</strong> Identifier les risques liés à la non-protection de l'environnement de travail (électrique) pour le matériel informatique, puis expliquer le rôle des équipements suivants : <strong>onduleur</strong>, <strong>régulateur de tension</strong>, <strong>parafoudre</strong>.</p>",
          "reponse": "<p><strong>Risques :</strong></p><ul style='list-style-type: disc; padding-left: 20px;'><li>Les coupures et les variations de tension peuvent endommager les composants fragiles (alimentation, carte mère).</li><li>Les surtensions (foudre) peuvent détruire instantanément le matériel.</li></ul><p><strong>Rôles des équipements :</strong></p><ul style='list-style-type: disc; padding-left: 20px;'><li><strong>Parafoudre :</strong> Protège le matériel contre les pics de tension provoqués par la foudre ou le réseau électrique.</li><li><strong>Régulateur de tension :</strong> Maintient une tension stable (par exemple 220V) en lissant les variations du réseau.</li><li><strong>Onduleur :</strong> Assure une alimentation électrique constante, en fournissant une réserve d'énergie (batterie) en cas de coupure et en filtrant les variations du réseau, ce qui protège les données en cours de travail.</li></ul>"
        },
        {
          "question": "<p><strong>4. (1 pt)</strong> Identifier la fonction principale du bloc d'alimentation dans un ordinateur.</p>",
          "reponse": "<p>Le bloc d'alimentation (ou alimentation) a pour fonction de convertir le courant électrique alternatif du secteur (220V) en une tension continue basse (3.3V, 5V, 12V) nécessaire au fonctionnement des composants internes de l'ordinateur.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Production d'une Feuille de Calcul (Tableur)",
      "points": "4 pts",
      "enonce": "<p style='font-size: 1rem; color: #2d3436;'>Cet exercice a pour objectif d'évaluer votre maîtrise de la production et de la mise en forme d'une feuille de calculs avec un tableur (cas de MS Excel).</p><div style='background-color: #eafaf1; padding: 15px; border-radius: 8px; margin-top: 10px; border-left: 4px solid #27ae60; color: #2d3436;'><p><strong>Document :</strong> Vous devez réaliser la facture suivante pour l'achat de fournitures scolaires.</p><table style='width:100%; border-collapse: collapse; background-color: #ffffff; margin-top: 10px;'><tr style='background-color: #d5f5e3;'><th style='border: 1px solid #ddd; padding: 8px; text-align: left;'>Désignation</th><th style='border: 1px solid #ddd; padding: 8px; text-align: center;'>Quantité</th><th style='border: 1px solid #ddd; padding: 8px; text-align: center;'>Prix unitaire (FCFA)</th></tr><tr><td style='border: 1px solid #ddd; padding: 8px;'>Cahier 96 pages</td><td style='border: 1px solid #ddd; padding: 8px; text-align: center;'>2</td><td style='border: 1px solid #ddd; padding: 8px; text-align: center;'>1000</td></tr><tr><td style='border: 1px solid #ddd; padding: 8px;'>Stylo Bic</td><td style='border: 1px solid #ddd; padding: 8px; text-align: center;'>5</td><td style='border: 1px solid #ddd; padding: 8px; text-align: center;'>300</td></tr><tr><td style='border: 1px solid #ddd; padding: 8px;'>Calculatrice scientifique</td><td style='border: 1px solid #ddd; padding: 8px; text-align: center;'>1</td><td style='border: 1px solid #ddd; padding: 8px; text-align: center;'>5000</td></tr><tr style='background-color: #f9f9f9;'><td colspan='3' style='border: 1px solid #ddd; padding: 8px; text-align: right;'><strong>Total TTC</strong> (FCFA)</td></tr></table></div>",
      "questions": [

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
