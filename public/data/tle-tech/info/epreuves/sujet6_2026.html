<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
    "matiere": "Informatique",
    "classe": "Tle technique",
    "sequence": "Séquence 6",
    "anneeScolaire": "2025-2026",
    "exercices": [
        {
            "titre": "Exercice 1 : Bases de Données et SQL",
            "points": "7 pts",
            "enonce": "<p>Un établissement scolaire de Garoua souhaite gérer ses élèves et leurs notes à l'aide d'une base de données. Le schéma suivant a été proposé :</p><div style='background-color: #f0f0f0; padding: 15px; border-radius: 10px;'><p style='color: #333;'><strong>Table Élèves</strong> : id_eleve (INT, clé primaire), nom (VARCHAR(50)), prenom (VARCHAR(50)), date_naissance (DATE), classe (VARCHAR(20))</p><p style='color: #333;'><strong>Table Notes</strong> : id_note (INT, clé primaire), id_eleve (INT, clé étrangère), matiere (VARCHAR(30)), note (DECIMAL(4,2)), coefficient (INT)</p></div>",
            "questions": [
                {
                    "question": "1) <strong>Définir les concepts</strong> (2 pts) : <br> a) Définis ce qu'est une clé primaire et une clé étrangère.<br> b) Explique le rôle d'un SGBD.",
                    "reponse": "<p><strong>a) Clé primaire</strong> : C'est un champ (ou un ensemble de champs) qui identifie de façon unique chaque enregistrement dans une table. La clé primaire ne peut pas contenir de valeurs nulles et doit être unique pour chaque ligne.</p><p><strong>Clé étrangère</strong> : C'est un champ qui fait référence à la clé primaire d'une autre table. Elle permet de créer des relations entre les tables et d'assurer l'intégrité référentielle.</p><p><strong>b) SGBD (Système de Gestion de Bases de Données)</strong> : C'est un logiciel qui permet de créer, gérer et interroger une base de données. Il assure la sécurité, l'intégrité et la cohérence des données. Des exemples sont MySQL, Oracle, SQL Server.</p>"
                },
                {
                    "question": "2) <strong>Écrire des requêtes SQL</strong> (3 pts) : <br> a) Écris la requête SQL pour créer la table Notes.<br> b) Écris la requête SQL pour insérer un élève nommé 'Kamga', prénom 'Jean', né le '15/03/2008', en classe 'Tle Tech 1'.<br> c) Écris la requête SQL pour afficher les notes de l'élève d'id 2, triées par matière.",
                    "reponse": "<p><strong>a) Création de la table Notes</strong> :</p><pre style='background-color: #2C3E50; color: #ecf0f1; padding: 15px; border-radius: 8px;'>CREATE TABLE Notes (<br>    id_note INT PRIMARY KEY AUTO_INCREMENT,<br>    id_eleve INT,<br>    matiere VARCHAR(30),<br>    note DECIMAL(4,2),<br>    coefficient INT,<br>    FOREIGN KEY (id_eleve) REFERENCES Eleves(id_eleve)<br>);</pre><p><strong>b) Insertion d'un élève</strong> :</p><pre style='background-color: #2C3E50; color: #ecf0f1; padding: 15px; border-radius: 8px;'>INSERT INTO Eleves (nom, prenom, date_naissance, classe)<br>VALUES ('Kamga', 'Jean', '2008-03-15', 'Tle Tech 1');</pre><p><strong>c) Affichage des notes</strong> :</p><pre style='background-color: #2C3E50; color: #ecf0f1; padding: 15px; border-radius: 8px;'>SELECT * FROM Notes<br>WHERE id_eleve = 2<br>ORDER BY matiere;</pre>"
                },
                {
                    "question": "3) <strong>Analyser et interpréter</strong> (2 pts) : <br> a) Quelle est l'utilité de la clause JOIN dans une requête SQL ?<br> b) Écris une requête SQL pour afficher le nom et la note moyenne des élèves.",
                    "reponse": "<p><strong>a) Clause JOIN</strong> : La clause JOIN permet de combiner des lignes de deux ou plusieurs tables en se basant sur une colonne commune. Elle est essentielle pour interroger des données qui sont réparties dans plusieurs tables liées.</p><p><strong>b) Requête avec JOIN</strong> :</p><pre style='background-color: #2C3E50; color: #ecf0f1; padding: 15px; border-radius: 8px;'>SELECT e.nom, AVG(n.note) AS moyenne<br>FROM Eleves e<br>JOIN Notes n ON e.id_eleve = n.id_eleve<br>GROUP BY e.id_eleve;</pre>"
                }
            ]
        },
        {
            "titre": "Exercice 2 : Réalisation d'un Dessin avec Visio",
            "points": "5 pts",
            "enonce": "<p>Un technicien en électricité doit réaliser un schéma électrique pour une maison à Yaoundé avec Microsoft Visio.</p>",
            "questions": [
                {
                    "question": "1) <strong>Identifier les éléments</strong> (2 pts) : <br> a) Cite deux types de formes disponibles dans Visio pour réaliser un schéma électrique.<br> b) Décris comment ajouter une forme à un dessin dans Visio.",
                    "reponse": "<p><strong>a) Formes Visio pour schéma électrique</strong> :</p><ul><li>Source d'alimentation (Batterie, Générateur)</li><li>Interrupteur (SPST, SPDT)</li><li>Charges (Lampes, Moteurs, Résistances)</li><li>Connecteurs (Fils, Câbles)</li></ul><p><strong>b) Ajout d'une forme</strong> : Pour ajouter une forme, on ouvre le panneau des formes à gauche, on sélectionne la catégorie souhaitée, on clique sur la forme et on la glisse-dépose dans la zone de dessin. On peut ensuite la redimensionner et la positionner précisément.</p>",
                    "sousQuestions": []
                },
                {
                    "question": "2) <strong>Appliquer les connaissances</strong> (3 pts) : <br> a) Décris les étapes pour réaliser un schéma électrique simple (Source → Interrupteur → Lampe) dans Visio.<br> b) Explique comment relier les éléments entre eux avec des connecteurs.",
                    "reponse": "<p><strong>a) Étapes pour le schéma</strong> :</p><ol><li>Ouvrir Visio et choisir le modèle 'Ingénierie' → 'Électrique'.</li><li>Glisser la forme 'Source d'alimentation' dans la zone de dessin.</li><li>Glisser la forme 'Interrupteur' et la placer à côté.</li><li>Glisser la forme 'Lampe' et la placer après l'interrupteur.</li><li>Vérifier le parcours du circuit.</li></ol><p><strong>b) Connexion avec des connecteurs</strong> :</p><ol><li>Sélectionner l'outil 'Connecteur' dans la barre d'outils.</li><li>Cliquer sur le point de connexion de la première forme (Source).</li><li>Glisser jusqu'au point de connexion de la forme suivante (Interrupteur).</li><li>Répéter pour connecter l'Interrupteur à la Lampe.</li><li>Le connecteur s'ajuste automatiquement si les formes sont déplacées.</li></ol>",
                    "sousQuestions": []
                }
            ]
        },
        {
            "titre": "Exercice 3 : Gestion de Projet avec Gantt Project",
            "points": "8 pts",
            "enonce": "<p>Une entreprise de construction à Douala doit réaliser un projet de construction d'un magasin. Les tâches suivantes ont été identifiées avec leurs durées et dépendances :</p><table style='border-collapse: collapse; width: 100%; font-size: 0.85em;'><tr style='background-color: #2C3E50; color: white;'><th style='padding: 6px; border: 1px solid #ddd;'>Tâche</th><th style='padding: 6px; border: 1px solid #ddd;'>Durée (jours)</th><th style='padding: 6px; border: 1px solid #ddd;'>Prédécesseur</th></tr><tr><td style='padding: 6px; border: 1px solid #ddd;'>A. Études</td><td style='padding: 6px; border: 1px solid #ddd;'>5</td><td style='padding: 6px; border: 1px solid #ddd;'>-</td></tr><tr><td style='padding: 6px; border: 1px solid #ddd;'>B. Fondations</td><td style='padding: 6px; border: 1px solid #ddd;'>8</td><td style='padding: 6px; border: 1px solid #ddd;'>A</td></tr><tr><td style='padding: 6px; border: 1px solid #ddd;'>C. Murs</td><td style='padding: 6px; border: 1px solid #ddd;'>10</td><td style='padding: 6px; border: 1px solid #ddd;'>B</td></tr><tr><td style='padding: 6px; border: 1px solid #ddd;'>D. Toiture</td><td style='padding: 6px; border: 1px solid #ddd;'>6</td><td style='padding: 6px; border: 1px solid #ddd;'>C</td></tr><tr><td style='padding: 6px; border: 1px solid #ddd;'>E. Électricité</td><td style='padding: 6px; border: 1px solid #ddd;'>4</td><td style='padding: 6px; border: 1px solid #ddd;'>C</td></tr><tr><td style='padding: 6px; border: 1px solid #ddd;'>F. Finitions</td><td style='padding: 6px; border: 1px solid #ddd;'>7</td><td style='padding: 6px; border: 1px solid #ddd;'>D, E</td></tr></table>",
            "questions": [
                {
                    "question": "1) <strong>Analyser et identifier</strong> (3 pts) : <br> a) Définis ce qu'est un diagramme de Gantt.<br> b) Qu'est-ce que le chemin critique dans un projet ?<br> c) Calcule la durée totale du projet en identifiant le chemin critique.",
                    "reponse": "<p><strong>a) Diagramme de Gantt</strong> : C'est un outil de gestion de projet qui représente visuellement la planification des tâches sous forme de barres horizontales. Chaque barre correspond à une tâche et sa longueur est proportionnelle à sa durée. Il permet de visualiser l'avancement du projet dans le temps.</p><p><strong>b) Chemin critique</strong> : C'est la séquence de tâches qui détermine la durée minimale du projet. Toute tâche sur le chemin critique ne peut pas être retardée sans allonger la durée totale du projet.</p><p><strong>c) Calcul du chemin critique</strong> : Le chemin critique est A → B → C → D → F (ou C → E → F).</p><p>Durée = 5 + 8 + 10 + 6 + 7 = <strong>36 jours</strong>.</p>",
                    "sousQuestions": []
                },
                {
                    "question": "2) <strong>Appliquer et interpréter</strong> (3 pts) : <br> a) Décris comment créer ce projet dans Gantt Project (tâches, durées, dépendances).<br> b) Si la tâche C (Murs) est retardée de 3 jours, quel sera l'impact sur la durée du projet ? Justifie.",
                    "reponse": "<p><strong>a) Création dans Gantt Project</strong> :</p><ol><li>Ouvrir Gantt Project et créer un nouveau projet.</li><li>Ajouter chaque tâche avec son nom et sa durée.</li><li>Définir les dépendances en spécifiant les prédécesseurs.</li><li>Visualiser le diagramme de Gantt généré automatiquement.</li><li>Générer le diagramme PERT avec la fonction dédiée.</li><li>Identifier le chemin critique (affiché en rouge).</li></ol><p><strong>b) Impact du retard</strong> : La tâche C (Murs) est sur le chemin critique. Un retard de 3 jours sur une tâche du chemin critique allonge la durée totale du projet de 3 jours. La nouvelle durée serait de 36 + 3 = <strong>39 jours</strong>.</p>",
                    "sousQuestions": []
                },
                {
                    "question": "3) <strong>Proposer des solutions</strong> (2 pts) : <br> Pour réduire la durée du projet de 5 jours, propose des actions à mener.",
                    "reponse": "<p><strong>Solutions pour réduire la durée</strong> :</p><ul><li><strong>Ajouter des ressources</strong> : Augmenter le nombre d'ouvriers sur les tâches du chemin critique (B, C, D).</li><li><strong>Raccourcir les durées</strong> : Réduire la durée de certaines tâches critiques en optimisant les méthodes de travail.</li><li><strong>Paralléliser</strong> : Si possible, faire chevaucher certaines tâches (ex : commencer E avant la fin de D).</li><li><strong>Travailler en plus</strong> : Organiser des équipes supplémentaires ou des heures supplémentaires.</li></ul>",
                    "sousQuestions": []
                }
            ]
        }
    ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
