<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Informatique",
  "classe": "Tle technique",
  "sequence": "Séquence 5",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Systèmes d'information et bases de données (6 pts)",
      "points": "6 pts",
      "enonce": "<p style='font-weight:bold;'>Cet exercice évalue les connaissances sur les systèmes d'information et les bases de données relationnelles.</p>",
      "questions": [
        {
          "question": "<p><strong>1.1 (2 pts)</strong> Définissez les termes suivants :</p><ul><li>a) Système d'information</li><li>b) SGBD</li><li>c) Clé primaire</li></ul>",
          "reponse": "<p>a) Un système d'information est un ensemble organisé de ressources (matérielles, logicielles, humaines) permettant de collecter, stocker, traiter et diffuser des informations.</p><p>b) Un SGBD (Système de Gestion de Base de Données) est un logiciel qui permet de créer, manipuler et administrer des bases de données.</p><p>c) Une clé primaire est un attribut (ou un ensemble d'attributs) qui permet d'identifier de manière unique chaque enregistrement dans une table.</p>"
        },
        {
          "question": "<p><strong>1.2 (2 pts)</strong> Décrivez les trois modèles de bases de données (hiérarchique, réseau, relationnel).</p>",
          "reponse": "<p><strong>Modèle hiérarchique :</strong> Les données sont organisées en arborescence (parent-enfant). Chaque enregistrement a un seul parent.</p><p><strong>Modèle réseau :</strong> Les données sont organisées en graphe, permettant à un enregistrement d'avoir plusieurs parents.</p><p><strong>Modèle relationnel :</strong> Les données sont organisées en tables (relations) avec des lignes (enregistrements) et des colonnes (attributs). C'est le modèle le plus utilisé.</p>"
        },
        {
          "question": "<p><strong>1.3 (2 pts)</strong> Expliquez le rôle des opérations de base sur une base de données (CRUD).</p>",
          "reponse": "<p>CRUD est l'acronyme de :</p><ul><li><strong>Create (Création) :</strong> Ajout de nouvelles données dans la base (ex: INSERT).</li><li><strong>Read (Lecture) :</strong> Extraction et consultation des données (ex: SELECT).</li><li><strong>Update (Mise à jour) :</strong> Modification des données existantes (ex: UPDATE).</li><li><strong>Delete (Suppression) :</strong> Retrait des données (ex: DELETE).</li></ul>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Conception et SQL (6 pts)",
      "points": "6 pts",
      "enonce": "<p style='font-weight:bold;'>Cet exercice porte sur la conception de bases de données et l'écriture de requêtes SQL.</p>",
      "questions": [
        {
          "question": "<p><strong>2.1 (2 pts)</strong> Soit un système de gestion des notes d'une école avec les entités suivantes : Élève, Matière, Note. Proposez un Modèle Conceptuel des Données (MCD) simple en identifiant les entités, leurs attributs et les relations.</p>",
          "reponse": "<p><strong>Entités et attributs :</strong></p><ul><li>Élève (id_eleve, nom, prenom, classe)</li><li>Matière (id_matiere, nom, coefficient)</li><li>Note (id_note, valeur, date)</li></ul><p><strong>Relations :</strong></p><ul><li>Un Élève reçoit plusieurs Notes (1,N)</li><li>Une Matière est associée à plusieurs Notes (1,N)</li><li>Un Élève est inscrit dans plusieurs Matières (via la table Note)</li></ul>"
        },
        {
          "question": "<p><strong>2.2 (2 pts)</strong> Écrivez une requête SQL pour créer la table <strong>Élève</strong> avec les champs : id_eleve (clé primaire), nom, prenom, classe.</p>",
          "reponse": "<div style='background-color:#1a237e; color:white; padding:10px; border-radius:6px; font-family:monospace;'>CREATE TABLE Eleve (<br/>    id_eleve INT PRIMARY KEY,<br/>    nom VARCHAR(50),<br/>    prenom VARCHAR(50),<br/>    classe VARCHAR(10)<br/>);</div>"
        },
        {
          "question": "<p><strong>2.3 (2 pts)</strong> À partir des tables Élève et Note, écrivez une requête SQL pour afficher les noms et prénoms des élèves ayant une note supérieure à 15.</p>",
          "reponse": "<div style='background-color:#1a237e; color:white; padding:10px; border-radius:6px; font-family:monospace;'>SELECT e.nom, e.prenom<br/>FROM Eleve e<br/>JOIN Note n ON e.id_eleve = n.id_eleve<br/>WHERE n.valeur > 15;</div>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Gestion de projet avec Gantt Project (4 pts)",
      "points": "4 pts",
      "enonce": "<p style='font-weight:bold;'>Cet exercice porte sur l'utilisation du logiciel Gantt Project pour la gestion de projet.</p>",
      "questions": [
        {
          "question": "<p><strong>3.1 (1 pt)</strong> Présentez l'interface et les principales fonctionnalités de Gantt Project.</p>",
          "reponse": "<p>Gantt Project est un logiciel open source de gestion de projet. Son interface principale comprend :</p><ul><li>La vue diagramme de Gantt (barres horizontales représentant les tâches).</li><li>La liste des tâches avec leurs durées et dates.</li><li>La gestion des ressources (humaines, matérielles).</li><li>Les outils de création de dépendances entre tâches.</li></ul>"
        },
        {
          "question": "<p><strong>3.2 (1.5 pts)</strong> Dans un projet, vous avez les tâches suivantes :</p><ul><li>A : Analyse (5 jours)</li><li>B : Conception (3 jours) - dépend de A</li><li>C : Développement (7 jours) - dépend de B</li></ul><p>Calculez la durée totale du projet.</p>",
          "reponse": "<p>Durée totale = A + B + C = 5 + 3 + 7 = <strong>15 jours</strong>. Les dépendances étant séquentielles (Fin-Début), les tâches s'enchaînent les unes après les autres.</p>"
        },
        {
          "question": "<p><strong>3.3 (1.5 pts)</strong> Qu'est-ce que le chemin critique dans un projet ? Identifiez le chemin critique dans l'exemple ci-dessus.</p>",
          "reponse": "<p>Le chemin critique est l'ensemble des tâches qui déterminent la durée totale du projet. Si une tâche du chemin critique est retardée, le projet est retardé.</p><p>Dans l'exemple, le chemin critique est : <strong>A → B → C</strong> (15 jours), car toutes les tâches sont dépendantes et ne peuvent pas être parallélisées.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Réseaux et sécurité (4 pts)",
      "points": "4 pts",
      "enonce": "<p style='font-weight:bold;'>Cet exercice traite des concepts de réseaux informatiques et de sécurité.</p>",
      "questions": [
        {
          "question": "<p><strong>4.1 (2 pts)</strong> Classez les types de réseaux selon leur taille (PAN, LAN, CAN, MAN, WAN).</p>",
          "reponse": "<p>Par ordre croissant de taille :</p><ul><li><strong>PAN (Personal Area Network) :</strong> réseau personnel (ex: Bluetooth).</li><li><strong>LAN (Local Area Network) :</strong> réseau local (ex: entreprise, école).</li><li><strong>CAN (Campus Area Network) :</strong> réseau de campus (ex: université).</li><li><strong>MAN (Metropolitan Area Network) :</strong> réseau métropolitain (ex: ville).</li><li><strong>WAN (Wide Area Network) :</strong> réseau étendu (ex: Internet).</li></ul>"
        },
        {
          "question": "<p><strong>4.2 (1 pt)</strong> Distinguez les réseaux filaires et les réseaux sans fil.</p>",
          "reponse": "<p><strong>Réseaux filaires :</strong> Utilisent des câbles pour la transmission (paire torsadée, fibre optique). Ils offrent généralement une meilleure stabilité et vitesse.</p><p><strong>Réseaux sans fil :</strong> Utilisent des ondes radio (Wi-Fi, Bluetooth). Ils offrent une plus grande mobilité mais sont plus sensibles aux interférences.</p>"
        },
        {
          "question": "<p><strong>4.3 (1 pt)</strong> Identifiez deux risques liés à la non-protection d'un environnement de travail informatique.</p>",
          "reponse": "<p>Deux risques sont :</p><ul><li><strong>Perte de données :</strong> en cas de panne électrique ou de défaillance matérielle.</li><li><strong>Piratage informatique :</strong> accès non autorisé aux données sensibles en l'absence de sécurité (pare-feu, antivirus).</li></ul>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
