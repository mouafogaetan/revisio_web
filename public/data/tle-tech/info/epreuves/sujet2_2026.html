<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Informatique",
  "classe": "Tle technique (Tle C, D, E et TI)",
  "sequence": "Séquence 2",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "EXERCICE 1 : SYSTÈME INFORMATIQUE ET RÉSEAUX (6 pts)",
      "points": "6 pts",
      "enonce": "<div style='background-color: #f0f8ff; padding: 15px; border-radius: 8px; border-left: 6px solid #1a5276; color: #333; margin-bottom: 15px;'><p style='margin: 0; font-weight: bold;'>Contexte :</p><p style='margin: 5px 0 0 0;'>Le lycée technique de Mbalmayo décide de moderniser sa gestion administrative et pédagogique. Il souhaite pour cela mettre en place un système informatique en réseau reliant le secrétariat, la salle des professeurs et la salle informatique.</p></div><p style='color: #333;'>Après la mise en place, la secrétaire du proviseur, Madame Mbarga, rencontre des difficultés pour imprimer les documents depuis son ordinateur. Par ailleurs, le directeur des études aimerait pouvoir accéder aux données des élèves depuis son domicile.</p>",
      "questions": [
        {
          "question": "<p style='color: #333;'><strong>1.</strong> Définir le terme <span style='font-weight: bold;'>système informatique</span>. <span style='color: #888; font-size: 0.9em;'>(0.5 pt)</span></p>",
          "reponse": "<p style='color: #333;'>Un système informatique est un ensemble organisé de composants (matériels, logiciels et ressources humaines) permettant de collecter, traiter, stocker et diffuser des informations.</p>"
        },
        {
          "question": "<p style='color: #333;'><strong>2.</strong> Identifier le type de système informatique mis en place au sein du lycée. Justifier. <span style='color: #888; font-size: 0.9em;'>(0.75 pt)</span></p>",
          "reponse": "<p style='color: #333;'>Il s'agit d'un <span style='font-weight: bold;'>système d'organisation</span> car il est conçu pour gérer et automatiser les tâches administratives et pédagogiques d'une institution.</p>"
        },
        {
          "question": "<p style='color: #333;'><strong>3.</strong> L'imprimante n'apparaît pas dans la liste des périphériques de l'ordinateur de Madame Mbarga. Proposer deux causes possibles et une solution pour chaque cause. <span style='color: #888; font-size: 0.9em;'>(1 pt)</span></p>",
          "reponse": "<ul style='color: #333;'><li><span style='font-weight: bold;'>Cause 1 :</span> Le pilote (driver) de l'imprimante n'est pas installé. <span style='font-weight: bold;'>Solution :</span> Installer le pilote approprié à partir du CD fourni ou du site du fabricant.</li><li><span style='font-weight: bold;'>Cause 2 :</span> Le câble USB est défectueux ou mal branché. <span style='font-weight: bold;'>Solution :</span> Vérifier et remplacer le câble si nécessaire.</li></ul>"
        },
        {
          "question": "<p style='color: #333;'><strong>4.</strong> Le directeur des études souhaite se connecter à distance. <span style='color: #888; font-size: 0.9em;'>(1 pt)</span></p><ul style='color: #333;'><li><strong>a)</strong> Quel type de réseau est nécessaire pour cette connexion à distance ? <span style='color: #888; font-size: 0.9em;'>(0.5 pt)</span></li><li><strong>b)</strong> Quel équipement du réseau local permettrait de rendre cette connexion sécurisée ? <span style='color: #888; font-size: 0.9em;'>(0.5 pt)</span></li></ul>",
          "reponse": "<p style='color: #333;'><strong>a)</strong> Un réseau étendu (<span style='font-weight: bold;'>WAN</span>) est nécessaire pour une connexion à distance.</p><p style='color: #333;'><strong>b)</strong> Un <span style='font-weight: bold;'>routeur</span> permet d'assurer la connexion et la sécurité via un <span style='font-weight: bold;'>pare-feu</span> (firewall).</p>"
        },
        {
          "question": "<p style='color: #333;'><strong>5.</strong> On souhaite affecter l'adresse IP 192.168.10.25 à l'ordinateur du secrétariat. <span style='color: #888; font-size: 0.9em;'>(1.25 pt)</span></p><ul style='color: #333;'><li><strong>a)</strong> Donner la classe de cette adresse IP. <span style='color: #888; font-size: 0.9em;'>(0.25 pt)</span></li><li><strong>b)</strong> Quel est le masque de sous-réseau par défaut de cette classe ? <span style='color: #888; font-size: 0.9em;'>(0.5 pt)</span></li><li><strong>c)</strong> Préciser si cette adresse est publique ou privée. Justifier. <span style='color: #888; font-size: 0.9em;'>(0.5 pt)</span></li></ul>",
          "reponse": "<p style='color: #333;'><strong>a)</strong> Cette adresse appartient à la <span style='font-weight: bold;'>classe C</span> (premier octet compris entre 192 et 223).</p><p style='color: #333;'><strong>b)</strong> Le masque par défaut est <span style='font-weight: bold;'>255.255.255.0</span>.</p><p style='color: #333;'><strong>c)</strong> Il s'agit d'une adresse <span style='font-weight: bold;'>privée</span> car elle appartient à la plage 192.168.0.0 – 192.168.255.255, réservée aux réseaux locaux.</p>"
        },
        {
          "question": "<p style='color: #333;'><strong>6.</strong> Après une panne de courant, l'ordinateur de la secrétaire s'est éteint brutalement, entraînant une perte de données. <span style='color: #888; font-size: 0.9em;'>(0.5 pt)</span></p><p style='color: #333;'>Quel équipement de protection conseillez-vous pour éviter ce problème ? Justifier.</p>",
          "reponse": "<p style='color: #333;'>Il faut conseiller un <span style='font-weight: bold;'>onduleur</span>. Il permet, en cas de coupure de courant, de maintenir l'ordinateur en marche pendant quelques minutes, le temps de sauvegarder le travail et d'éteindre correctement la machine.</p>"
        }
      ]
    },
    {
      "titre": "EXERCICE 2 : SYSTÈME D'INFORMATION ET BASE DE DONNÉES (7 pts)",
      "points": "7 pts",
      "enonce": "<div style='background-color: #f0f8ff; padding: 15px; border-radius: 8px; border-left: 6px solid #1a5276; color: #333; margin-bottom: 15px;'><p style='margin: 0; font-weight: bold;'>Contexte :</p><p style='margin: 5px 0 0 0;'>La bibliothèque municipale de Bafoussam souhaite informatiser la gestion des prêts de livres. Le responsable vous soumet le cahier des charges suivant :</p><ul style='color: #333;'><li>Un <span style='font-weight: bold;'>abonné</span> est identifié par son <span style='font-weight: bold;'>numéro d'abonné</span>. On enregistre son nom, prénom, adresse, téléphone.</li><li>Un <span style='font-weight: bold;'>livre</span> est identifié par son <span style='font-weight: bold;'>ISBN</span>. On enregistre son titre, auteur, maison d'édition, année de parution.</li><li>Un abonné peut emprunter <span style='font-weight: bold;'>un ou plusieurs</span> livres. Un livre peut être emprunté par <span style='font-weight: bold;'>plusieurs</span> abonnés au fil du temps (prêts successifs).</li><li>Un <span style='font-weight: bold;'>prêt</span> est caractérisé par une date de prêt et une date de retour effective (ou prévue).</li></ul></div>",
      "questions": [
        {
          "question": "<p style='color: #333;'><strong>1.</strong> Définir les notions suivantes : <span style='font-weight: bold;'>entité</span> et <span style='font-weight: bold;'>cardinalité</span>. <span style='color: #888; font-size: 0.9em;'>(1 pt)</span></p>",
          "reponse": "<ul style='color: #333;'><li><span style='font-weight: bold;'>Entité :</span> un objet concret ou abstrait du monde réel dont on souhaite stocker des informations (exemple : Abonné, Livre).</li><li><span style='font-weight: bold;'>Cardinalité :</span> elle précise le nombre minimum et maximum de participations d'une occurrence d'entité à une association.</li></ul>"
        },
        {
          "question": "<p style='color: #333;'><strong>2.</strong> Identifier les entités du système d'information avec leurs identifiants. <span style='color: #888; font-size: 0.9em;'>(1.5 pts)</span></p>",
          "reponse": "<ul style='color: #333;'><li><span style='font-weight: bold;'>ABONNÉ</span> : <span style='font-weight: bold;'>#num_abonne</span> (identifiant), nom, prenom, adresse, telephone.</li><li><span style='font-weight: bold;'>LIVRE</span> : <span style='font-weight: bold;'>#ISBN</span> (identifiant), titre, auteur, maison_edition, annee_parution.</li><li><span style='font-weight: bold;'>PRÊT</span> : <span style='font-weight: bold;'>#num_pret</span> (identifiant), date_pret, date_retour.</li></ul>"
        },
        {
          "question": "<p style='color: #333;'><strong>3.</strong> Citer deux méthodes de conception d'un système d'information. <span style='color: #888; font-size: 0.9em;'>(1 pt)</span></p>",
          "reponse": "<ul style='color: #333;'><li><span style='font-weight: bold;'>Merise</span> : méthode française basée sur une approche systémique et une séparation des données et des traitements.</li><li><span style='font-weight: bold;'>UML (Unified Modeling Language)</span> : langage de modélisation orienté objet unifié.</li></ul>"
        },
        {
          "question": "<p style='color: #333;'><strong>4.</strong> Construire le Modèle Conceptuel de Données (MCD) en identifiant les associations, leurs cardinalités et les attributs. <span style='color: #888; font-size: 0.9em;'>(2 pts)</span></p>",
          "reponse": "<div style='background-color: #f4f6f9; padding: 15px; border-radius: 8px; color: #333;'><p style='font-weight: bold;'>MCD :</p><ul><li><span style='font-weight: bold;'>ABONNÉ</span> (0,n) –<span style='font-weight: bold;'>EMPRUNTE</span>– (1,1) <span style='font-weight: bold;'>PRÊT</span></li><li><span style='font-weight: bold;'>LIVRE</span> (0,n) –<span style='font-weight: bold;'>CONCERNE</span>– (1,1) <span style='font-weight: bold;'>PRÊT</span></li></ul><p style='font-style: italic;'>Un abonné peut effectuer 0 à n prêts. Un prêt est fait par un et un seul abonné.<br>Un livre peut concerner 0 à n prêts. Un prêt concerne un et un seul livre.</p></div>"
        },
        {
          "question": "<p style='color: #333;'><strong>5.</strong> Donner le schéma relationnel (Modèle Logique de Données) de la base. <span style='color: #888; font-size: 0.9em;'>(1.5 pts)</span></p>",
          "reponse": "<div style='background-color: #f4f6f9; padding: 15px; border-radius: 8px; color: #333;'><ul><li><span style='font-weight: bold;'>ABONNÉ</span> (<u>num_abonne</u>, nom, prenom, adresse, telephone)</li><li><span style='font-weight: bold;'>LIVRE</span> (<u>ISBN</u>, titre, auteur, maison_edition, annee_parution)</li><li><span style='font-weight: bold;'>PRÊT</span> (<u>num_pret</u>, date_pret, date_retour, <span style='font-weight: bold;'>#num_abonne</span>, <span style='font-weight: bold;'>#ISBN</span>)</li></ul><p style='font-style: italic;'>Les clés étrangères sont indiquées en gras et précédées de #.</p></div>"
        }
      ]
    },
    {
      "titre": "EXERCICE 3 : SQL - LANGAGE DE MANIPULATION DE DONNÉES (7 pts)",
      "points": "7 pts",

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
