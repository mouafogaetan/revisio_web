<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Mathématiques",
  "classe": "Tle technique",
  "sequence": "Séquence 5",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Dénombrement et combinatoire",
      "points": "4 pts",
      "enonce": "<p>Un code d'accès à un laboratoire d'informatique est composé de 4 caractères : le premier caractère est une lettre majuscule (A à Z), les trois suivants sont des chiffres (0 à 9).</p>",
      "questions": [
        {
          "question": "1) Combien de codes différents peut-on former si les répétitions sont autorisées ?",
          "reponse": "Pour la lettre : 26 possibilités. Pour chaque chiffre : 10 possibilités. Total = 26 × 10 × 10 × 10 = 26 000 codes différents."
        },
        {
          "question": "2) Combien de codes peut-on former si les répétitions ne sont pas autorisées (les caractères sont tous distincts) ?",
          "reponse": "26 choix pour la lettre, 10 choix pour le premier chiffre, 9 pour le deuxième, 8 pour le troisième. Total = 26 × 10 × 9 × 8 = 18 720 codes."
        },
        {
          "question": "3) Utiliser le triangle de Pascal pour déterminer \\( \\binom{6}{2} \\) et donner l'interprétation de ce nombre dans le contexte du dénombrement.",
          "reponse": "\\[ \\binom{6}{2} = 15 \\] Ce nombre représente le nombre de façons de choisir 2 éléments parmi 6 (combinaisons sans répétition)."
        }
      ]
    },
    {
      "titre": "Exercice 2 : Probabilités et loi binomiale",
      "points": "5 pts",
      "enonce": "<p>Dans une entreprise de Yaoundé, 70% des employés possèdent un téléphone Android. On interroge 6 employés au hasard. Le choix des employés est indépendant.</p>",
      "questions": [
        {
          "question": "1) Justifier que la variable aléatoire \\( X \\) comptant le nombre d'employés possédant un Android suit une loi binomiale. Préciser ses paramètres.",
          "reponse": "Il s'agit d'un schéma de Bernoulli avec \\( n=6 \\) épreuves indépendantes, chacune ayant une probabilité de succès \\( p=0.7 \\). Ainsi, \\( X \\sim \\mathcal{B}(6; 0.7) \\)."
        },
        {
          "question": "2) Déterminer la loi de probabilité de \\( X \\) en donnant les valeurs de \\( P(X=k) \\) pour \\( k=0,1,2,3,4,5,6 \\).",
          "reponse": "\\[ P(X=k) = \\binom{6}{k} (0.7)^k (0.3)^{6-k} \\] <br> \\( P(X=0) = 0.000729 \\), \\( P(X=1) \\approx 0.0102 \\), \\( P(X=2) \\approx 0.0595 \\), <br> \\( P(X=3) \\approx 0.1852 \\), \\( P(X=4) \\approx 0.3241 \\), <br> \\( P(X=5) \\approx 0.3025 \\), \\( P(X=6) \\approx 0.1176 \\)."
        },
        {
          "question": "3) Calculer la probabilité qu'au moins 5 employés possèdent un Android.",
          "reponse": "\\[ P(X \\ge 5) = P(X=5) + P(X=6) \\approx 0.3025 + 0.1176 = 0.4201 \\]"
        },
        {
          "question": "4) Calculer l'espérance mathématique \\( E(X) \\) et la variance \\( V(X) \\) de \\( X \\). Interpréter l'espérance.",
          "reponse": "\\[ E(X) = n \\times p = 6 \\times 0.7 = 4.2 \\] <br> \\[ V(X) = n \\times p \\times (1-p) = 6 \\times 0.7 \\times 0.3 = 1.26 \\] <br> L'espérance \\( E(X) = 4.2 \\) signifie qu'en moyenne, sur 6 employés interrogés, environ 4 à 5 possèdent un Android."
        },
        {
          "question": "5) Déterminer la fonction de répartition \\( F \\) de \\( X \\) et donner la valeur de \\( F(2) \\).",
          "reponse": "\\[ F(k) = P(X \\le k) = \\sum_{i=0}^{k} P(X=i) \\] <br> \\[ F(2) = P(X \\le 2) = P(X=0) + P(X=1) + P(X=2) \\approx 0.0007 + 0.0102 + 0.0595 = 0.0704 \\]"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Étude de fonction logarithme et exponentielle",
      "points": "6 pts",
      "enonce": "<p>On considère la fonction \\( f(x) = \\ln(2x+1) \\) définie sur \\( \\left]-\\frac{1}{2}; +\\infty\\right[ \\).</p>",
      "questions": [
        {
          "question": "1) Déterminer la limite de \\( f(x) \\) en \\( -\\frac{1}{2}^+ \\) et en \\( +\\infty \\).",
          "reponse": "En \\( -\\frac{1}{2}^+ \\) : \\( 2x+1 \\to 0^+ \\), donc \\( f(x) \\to -\\infty \\). <br> En \\( +\\infty \\) : \\( 2x+1 \\to +\\infty \\), donc \\( f(x) \\to +\\infty \\)."
        },
        {
          "question": "2) Calculer la dérivée \\( f'(x) \\) et étudier le signe de la dérivée.",
          "reponse": "\\[ f'(x) = \\frac{2}{2x+1} \\] <br> Pour \\( x > -\\frac{1}{2} \\), \\( 2x+1 > 0 \\), donc \\( f'(x) > 0 \\). La fonction \\( f \\) est strictement croissante sur son domaine de définition."
        },
        {
          "question": "3) Résoudre l'équation \\( \\ln(2x+1) = 1 \\).",
          "reponse": "\\[ \\ln(2x+1) = 1 \\Rightarrow 2x+1 = e \\Rightarrow 2x = e-1 \\Rightarrow x = \\frac{e-1}{2} \\]"
        },
        {
          "question": "4) Résoudre l'inéquation \\( \\ln(2x+1) \\ge 0 \\).",
          "reponse": "\\[ \\ln(2x+1) \\ge 0 \\Rightarrow 2x+1 \\ge e^0 = 1 \\Rightarrow 2x \\ge 0 \\Rightarrow x \\ge 0 \\] <br> En tenant compte du domaine de définition, la solution est \\( x \\ge 0 \\)."
        },
        {
          "question": "5) Déterminer la primitive \\( F \\) de \\( f \\) sur \\( \\left]-\\frac{1}{2}; +\\infty\\right[ \\) telle que \\( F(0) = 0 \\).",
          "reponse": "On utilise la formule \\( \\int \\ln(ax+b) dx = \\frac{(ax+b)\\ln(ax+b) - ax}{a} + C \\). <br> \\[ F(x) = \\frac{(2x+1)\\ln(2x+1) - 2x}{2} + C \\] <br> \\( F(0) = \\frac{1 \\times 0 - 0}{2} + C = C = 0 \\). <br> Donc \\( F(x) = \\frac{(2x+1)\\ln(2x+1) - 2x}{2} \\)."
        }
      ]
    },
    {
      "titre": "Exercice 4 : Ajustement linéaire par la méthode de Mayer",
      "points": "5 pts",
      "enonce": "<p>Le tableau ci-dessous donne le nombre d'habitants (en milliers) d'une ville de la région de l'Ouest Cameroun en fonction de l'année.</p><table style='width:100%; border-collapse:collapse; margin:10px 0;'><tr style='background:#1a237e; color:white;'><th style='padding:8px; border:1px solid #004d40;'>Année (x<sub>i</sub>)</th><td style='padding:8px; border:1px solid #004d40;'>2010</td><td style='padding:8px; border:1px solid #004d40;'>2012</td><td style='padding:8px; border:1px solid #004d40;'>2014</td><td style='padding:8px; border:1px solid #004d40;'>2016</td><td style='padding:8px; border:1px solid #004d40;'>2018</td><td style='padding:8px; border:1px solid #004d40;'>2020</td></tr><tr style='background:#e3f2fd;'><th style='padding:8px; border:1px solid #004d40;'>Habitants (y<sub>i</sub>)</th><td style='padding:8px; border:1px solid #004d40;'>12</td><td style='padding:8px; border:1px solid #004d40;'>14</td><td style='padding:8px; border:1px solid #004d40;'>15</td><td style='padding:8px; border:1px solid #004d40;'>18</td><td style='padding:8px; border:1px solid #004d40;'>20</td><td style='padding:8px; border:1px solid #004d40;'>23</td></tr></table>",
      "questions": [
        {
          "question": "1) Représenter le nuage de points \\( M_i(x_i; y_i) \\) dans un repère orthogonal (1 cm pour 1 an en abscisse et 1 cm pour 2 milliers en ordonnée).",
          "reponse": "Construction graphique du nuage de points."
        },
        {
          "question": "2) Déterminer les coordonnées du point moyen \\( G \\) du nuage.",
          "reponse": "\\[ \\bar{x} = \\frac{2010+2012+2014+2016+2018+2020}{6} = 2015 \\] <br> \\[ \\bar{y} = \\frac{12+14+15+18+20+23}{6} = 17 \\] <br> Donc \\( G(2015; 17) \\)."
        },
        {
          "question": "3) En utilisant la méthode de Mayer (deux sous-groupes de 3 points), déterminer l'équation de la droite d'ajustement \\( y = ax + b \\).",
          "reponse": "G1 avec les 3 premiers points (2010;12), (2012;14), (2014;15) : <br> \\( G_1 \\left(\\frac{2010+2012+2014}{3}; \\frac{12+14+15}{3}\\right) = \\left(2012; \\frac{41}{3}\\right) \\approx (2012; 13.67) \\). <br> G2 avec les 3 derniers points (2016;18), (2018;20), (2020;23) : <br> \\( G_2 \\left(\\frac{2016+2018+2020}{3}; \\frac{18+20+23}{3}\\right) = \\left(2018; \\frac{61}{3}\\right) \\approx (2018; 20.33) \\). <br> Coefficient directeur : \\( a = \\frac{20.33 - 13.67}{2018 - 2012} = \\frac{6.66}{6} \\approx 1.11 \\). <br> \\( y - 13.67 = 1.11(x - 2012) \\Rightarrow y = 1.11x - 2220.65 \\)."
        },
        {
          "question": "4) En utilisant cet ajustement, estimer le nombre d'habitants en 2024.",
          "reponse": "En remplaçant \\( x = 2024 \\) : <br> \\( y = 1.11 \\times 2024 - 2220.65 = 2246.64 - 2220.65 = 25.99 \\). <br> Soit environ 26 000 habitants."
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
