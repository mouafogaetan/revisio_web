<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Mathématiques IH/ESF",
  "classe": "Tle technique",
  "sequence": "Séquence 4 : Statistiques et Probabilités",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Ajustement linéaire par la méthode de Mayer",
      "points": "4 pts",
      "enonce": "<p>Le tableau ci-dessous donne l'évolution du chiffre d'affaires (en millions de FCFA) d'une entreprise camerounaise au cours des années :</p><div style='overflow-x: auto;'><table style='width: 100%; border-collapse: collapse; text-align: center;'><tr style='background: #1565c0; color: white;'><th style='padding: 8px; border: 1px solid #ddd;'>Année (x)</th><th style='padding: 8px; border: 1px solid #ddd;'>2018</th><th style='padding: 8px; border: 1px solid #ddd;'>2019</th><th style='padding: 8px; border: 1px solid #ddd;'>2020</th><th style='padding: 8px; border: 1px solid #ddd;'>2021</th><th style='padding: 8px; border: 1px solid #ddd;'>2022</th></tr><tr><td style='padding: 8px; border: 1px solid #ddd; background: #e3f2fd;'><strong>CA (y)</strong></td><td style='padding: 8px; border: 1px solid #ddd;'>15</td><td style='padding: 8px; border: 1px solid #ddd;'>18</td><td style='padding: 8px; border: 1px solid #ddd;'>22</td><td style='padding: 8px; border: 1px solid #ddd;'>25</td><td style='padding: 8px; border: 1px solid #ddd;'>28</td></tr></table></div><p><strong>Objectif :</strong> Utiliser la méthode de Mayer pour ajuster ce nuage de points.</p>",
      "questions": [
        {
          "question": "1) Déterminer les coordonnées des points moyens \( G_1 \) et \( G_2 \) en partageant la série en deux groupes égaux.",
          "reponse": "<p><strong>Réponse :</strong></p><p>Pour \( n = 5 \), on divise en 2 groupes : les 2 premières années et les 3 dernières.</p><p>Groupe 1 (2018, 2019) : <br>\( G_1 = \left( \dfrac{2018+2019}{2} ; \dfrac{15+18}{2} \right) = (2018,5 ; 16,5) \)</p><p>Groupe 2 (2020, 2021, 2022) : <br>\( G_2 = \left( \dfrac{2020+2021+2022}{3} ; \dfrac{22+25+28}{3} \right) = (2021 ; 25) \)</p>"
        },
        {
          "question": "2) Déterminer l'équation de la droite d'ajustement \( y = ax + b \) passant par ces deux points moyens.",
          "reponse": "<p><strong>Réponse :</strong></p><p>\( a = \dfrac{y_2 - y_1}{x_2 - x_1} = \dfrac{25 - 16,5}{2021 - 2018,5} = \dfrac{8,5}{2,5} = 3,4 \)</p><p>On utilise \( y - y_1 = a(x - x_1) \) : <br>\( y - 16,5 = 3,4(x - 2018,5) \)</p><p>Donc \( y = 3,4x - 6862,9 + 16,5 = 3,4x - 6846,4 \)</p>"
        },
        {
          "question": "3) En utilisant cet ajustement, estimer le chiffre d'affaires prévisionnel pour l'année 2025.",
          "reponse": "<p><strong>Réponse :</strong></p><p>\( y = 3,4 \times 2025 - 6846,4 = 6885 - 6846,4 = 38,6 \)</p><p>Le chiffre d'affaires prévisionnel pour 2025 est d'environ <strong>38,6 millions de FCFA</strong>.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Loi binomiale et contrôle de qualité",
      "points": "5 pts",
      "enonce": "<p>Dans une chocolaterie artisanale de Yaoundé, on estime que 5% des tablettes produites présentent un défaut d'emballage. On prélève au hasard un lot de 8 tablettes. La production est suffisamment importante pour assimiler ce prélèvement à un tirage avec remise. Soit \( X \) la variable aléatoire égale au nombre de tablettes défectueuses dans ce lot.</p>",
      "questions": [
        {
          "question": "1) Justifier que \( X \) suit une loi binomiale et préciser ses paramètres.",
          "reponse": "<p><strong>Réponse :</strong></p><p>On répète \( n = 8 \) fois une expérience de Bernoulli indépendante (prélèvement d'une tablette) avec une probabilité de succès (défaut) \( p = 0,05 \).</p><p>Donc \( X \sim \mathcal{B}(8 ; 0,05) \).</p>"
        },
        {
          "question": "2) Calculer la probabilité qu'il y ait exactement 2 tablettes défectueuses dans le lot.",
          "reponse": "<p><strong>Réponse :</strong></p><p>\( P(X = 2) = \binom{8}{2} \times 0,05^2 \times 0,95^{6} \)</p><p>\( P(X = 2) = 28 \times 0,0025 \times 0,73509 \)</p><p>\( P(X = 2) \approx 0,0515 \) (soit 5,15 %).</p>"
        },
        {
          "question": "3) Le lot est considéré comme acceptable si aucune tablette n'est défectueuse. Quelle est la probabilité que le lot soit accepté ?",
          "reponse": "<p><strong>Réponse :</strong></p><p>\( P(X = 0) = \binom{8}{0} \times 0,05^0 \times 0,95^{8} = 0,95^8 \)</p><p>\( P(X = 0) \approx 0,6634 \) (soit 66,34 %).</p>"
        },
        {
          "question": "4) Calculer l'espérance mathématique et l'écart-type de \( X \). Interpréter l'espérance.",
          "reponse": "<p><strong>Réponse :</strong></p><p>\( E(X) = n \times p = 8 \times 0,05 = 0,4 \)</p><p>\( \sigma(X) = \sqrt{np(1-p)} = \sqrt{8 \times 0,05 \times 0,95} = \sqrt{0,38} \approx 0,616 \)</p><p><strong>Interprétation :</strong> En moyenne, sur un grand nombre de lots de 8 tablettes, on trouve 0,4 tablette défectueuse par lot.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Dérivées et primitives",
      "points": "4 pts",
      "enonce": "<p>On considère la fonction \( f \) définie par \( f(x) = (3x - 1)^2 \).</p>",
      "questions": [
        {
          "question": "1) Développer \( f(x) \) puis calculer \( f'(x) \) en utilisant les règles de dérivation usuelles.",
          "reponse": "<p><strong>Réponse :</strong></p><p>\( f(x) = (3x - 1)^2 = 9x^2 - 6x + 1 \)</p><p>\( f'(x) = 18x - 6 \)</p>"
        },
        {
          "question": "2) Déterminer une primitive \( F \) de la fonction \( f \) sur \( \mathbb{R} \).",
          "reponse": "<p><strong>Réponse :</strong></p><p>\( F(x) = \dfrac{9x^3}{3} - \dfrac{6x^2}{2} + x + C = 3x^3 - 3x^2 + x + C \)</p><p>où \( C \) est une constante réelle.</p>"
        },
        {
          "question": "3) Déterminer la primitive \( F \) de \( f \) qui s'annule en \( x = 1 \).",
          "reponse": "<p><strong>Réponse :</strong></p><p>On a \( F(1) = 3(1)^3 - 3(1)^2 + 1 + C = 3 - 3 + 1 + C = 1 + C = 0 \)</p><p>Donc \( C = -1 \).</p><p>La primitive est \( F(x) = 3x^3 - 3x^2 + x - 1 \).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Calcul d'aire par intégration",
      "points": "3 pts",
      "enonce": "<p>On souhaite calculer l'aire du domaine compris entre la parabole d'équation \( y = x^2 \), l'axe des abscisses et les droites verticales \( x = 0 \) et \( x = 2 \).</p>",
      "questions": [
        {
          "question": "1) Représenter la situation graphiquement.",
          "reponse": "<p><strong>Réponse :</strong></p><p>L'aire est comprise entre la courbe \( y = x^2 \), l'axe des abscisses, et les droites \( x=0 \) et \( x=2 \).</p>"
        },
        {
          "question": "2) Calculer l'intégrale \( \displaystyle\int_{0}^{2} x^2 \, dx \).",
          "reponse": "<p><strong>Réponse :</strong></p><p>\( \displaystyle\int_{0}^{2} x^2 \, dx = \left[ \dfrac{x^3}{3} \right]_{0}^{2} = \dfrac{2^3}{3} - \dfrac{0^3}{3} = \dfrac{8}{3} \)</p>"
        },
        {
          "question": "3) En déduire l'aire du domaine considéré.",
          "reponse": "<p><strong>Réponse :</strong></p><p>L'aire est \( \dfrac{8}{3} \) unités d'aire.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 5 : Problème de gestion - Équations exponentielles",
      "points": "4 pts",
      "enonce": "<p>Une entreprise de transport au Cameroun constate que le nombre de véhicules en circulation suit une croissance exponentielle modélisée par la fonction \( N(t) = 1500 \times e^{0,12t} \), où \( t \) est le nombre d'années écoulées depuis l'année de référence 2020.</p>",
      "questions": [
        {
          "question": "1) Calculer le nombre de véhicules en 2025. (Arrondir à l'unité)",
          "reponse": "<p><strong>Réponse :</strong></p><p>En 2025, \( t = 5 \).</p><p>\( N(5) = 1500 \times e^{0,12 \times 5} = 1500 \times e^{0,6} \approx 1500 \times 1,8221 \approx 2733 \) véhicules.</p>"
        },
        {
          "question": "2) Déterminer l'année où le nombre de véhicules atteindra 3000.",
          "reponse": "<p><strong>Réponse :</strong></p><p>Il faut résoudre \( 1500 \times e^{0,12t} = 3000 \)</p><p>\( e^{0,12t} = 2 \)</p><p>\( 0,12t = \ln(2) \)</p><p>\( t = \dfrac{\ln(2)}{0,12} \approx \dfrac{0,6931}{0,12} \approx 5,77 \)</p><p>Le nombre atteindra 3000 environ 5,77 ans après 2020, soit au cours de l'année <strong>2026</strong>.</p>"
        },
        {
          "question": "3) Résoudre l'inéquation \( N(t) > 2000 \). Interpréter le résultat.",
          "reponse": "<p><strong>Réponse :</strong></p><p>\( 1500 \times e^{0,12t} > 2000 \)</p><p>\( e^{0,12t} > \dfrac{2000}{1500} = \dfrac{4}{3} \)</p><p>\( 0,12t > \ln\left(\dfrac{4}{3}\right) \)</p><p>\( t > \dfrac{\ln(4/3)}{0,12} \approx \dfrac{0,2877}{0,12} \approx 2,4 \)</p><p>Le nombre de véhicules dépassera 2000 à partir de l'année 2023 (2,4 ans après 2020).</p>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
