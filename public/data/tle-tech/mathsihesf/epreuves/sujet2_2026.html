<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
 "matiere": "Mathématiques IH/ESF",
 "classe": "Tle technique",
 "sequence": "Séquence 2",
 "anneeScolaire": "2025-2026",
 "exercices": [
   {
     "titre": "Exercice 1 : Calcul numérique et systèmes",
     "points": "3 pts",
     "enonce": "<div style='font-size: 1rem; line-height: 1.6;'>Cet exercice porte sur les calculs avec les grands nombres, les puissances et la résolution de systèmes linéaires.</div>",
     "questions": [
       {
         "question": "<div style='display: flex; align-items: baseline; gap: 0.5rem; flex-wrap: wrap;'><span style='font-weight: bold;'>1)</span> <span>Calculer en utilisant les propriétés des puissances de 10 et donner le résultat en notation scientifique :</span></div><div style='margin: 0.5rem 0 0 1.5rem;'><div class='math-block'><div class='math'>$$ A = \\frac{3,2 \\times 10^5 \\times 4 \\times 10^{-7}}{8 \\times 10^2} $$</div></div>",
         "reponse": "<div style='font-size: 0.95rem; line-height: 1.6;'><span style='font-weight: bold;'>Réponse :</span><div style='margin-top: 0.3rem;'><div class='math-block'><div class='math'>$$ A = \\frac{3,2 \\times 4}{8} \\times 10^{5-7-2} = 1,6 \\times 10^{-4} $$</div></div></div>"
       },
       {
         "question": "<div style='display: flex; align-items: baseline; gap: 0.5rem; flex-wrap: wrap;'><span style='font-weight: bold;'>2)</span> <span>Résoudre dans \\(\\mathbb{R}^3\\) le système linéaire suivant par la méthode de substitution :</span></div><div style='margin: 0.5rem 0 0 1.5rem;'><div class='math-block'><div class='math'>$$ \\begin{cases} x + 2y + z = 6 \\\\ 2x - y + z = 3 \\\\ -x + y + 2z = 5 \\end{cases} $$</div></div>",
         "reponse": "<div style='font-size: 0.95rem; line-height: 1.6;'><span style='font-weight: bold;'>Réponse :</span><div style='margin-top: 0.3rem;'>De la première équation, on tire \\( x = 6 - 2y - z \\).<br>En substituant dans les deux autres, on obtient un système de deux équations à deux inconnues.<br>Après résolution, on trouve : <span style='font-weight: bold;'>\\( (x;y;z) = (1; 2; 1) \\)</span>.<br>La solution est unique.</div></div>"
       }
     ]
   },
   {
     "titre": "Exercice 2 : Équations et inéquations logarithmiques et exponentielles",
     "points": "4 pts",
     "enonce": "<div style='font-size: 1rem; line-height: 1.6;'>Cet exercice teste votre maîtrise des équations et inéquations faisant intervenir les fonctions logarithme et exponentielle.</div>",
     "questions": [
       {
         "question": "<div style='display: flex; align-items: baseline; gap: 0.5rem; flex-wrap: wrap;'><span style='font-weight: bold;'>1)</span> <span>Résoudre dans \\(\\mathbb{R}\\) l'équation :</span></div><div style='margin: 0.5rem 0 0 1.5rem;'><div class='math-block'><div class='math'>$$ e^{2x-1} = e^{x+3} $$</div></div>",
         "reponse": "<div style='font-size: 0.95rem; line-height: 1.6;'><span style='font-weight: bold;'>Réponse :</span><div style='margin-top: 0.3rem;'>La fonction exponentielle est bijective, donc :<br><div class='math-block'><div class='math'>$$ 2x-1 = x+3 \\iff x = 4 $$</div></div>L'ensemble des solutions est <span style='font-weight: bold;'>\\( S = \\{4\\} \\)</span>.</div></div>"
       },
       {
         "question": "<div style='display: flex; align-items: baseline; gap: 0.5rem; flex-wrap: wrap;'><span style='font-weight: bold;'>2)</span> <span>Résoudre dans \\(\\mathbb{R}\\) l'inéquation :</span></div><div style='margin: 0.5rem 0 0 1.5rem;'><div class='math-block'><div class='math'>$$ \\ln(2x-3) > \\ln(x+1) $$</div></div>",
         "reponse": "<div style='font-size: 0.95rem; line-height: 1.6;'><span style='font-weight: bold;'>Réponse :</span><div style='margin-top: 0.3rem;'>Il faut d'abord déterminer l'ensemble de définition : \\( 2x-3 > 0 \\) et \\( x+1 > 0 \\), donc \\( x > \\frac{3}{2} \\).<br>La fonction logarithme est strictement croissante, donc :<br><div class='math-block'><div class='math'>$$ 2x-3 > x+1 \\iff x > 4 $$</div></div>En tenant compte de l'ensemble de définition, l'ensemble des solutions est <span style='font-weight: bold;'>\\( S = ]4; +\\infty[ \\)</span>.</div></div>"
       }
     ]
   },
   {
     "titre": "Exercice 3 : Étude d'une fonction polynôme et calcul d'aire",
     "points": "5 pts",
     "enonce": "<div style='font-size: 1rem; line-height: 1.6;'>Soit la fonction \\( f \\) définie sur \\(\\mathbb{R}\\) par \\( f(x) = -x^2 + 4x - 3 \\). On note \\( \\mathcal{C}_f \\) sa courbe représentative dans un repère orthonormé \\( (O; \\vec{i}, \\vec{j}) \\) d'unité 1 cm.</div>",
     "questions": [
       {
         "question": "<div style='display: flex; align-items: baseline; gap: 0.5rem; flex-wrap: wrap;'><span style='font-weight: bold;'>1)</span> <span>Déterminer la dérivée \\( f'(x) \\) de la fonction \\( f \\).</span></div>",
         "reponse": "<div style='font-size: 0.95rem; line-height: 1.6;'><span style='font-weight: bold;'>Réponse :</span><div style='margin-top: 0.3rem;'>La dérivée de \\( f \\) est :<br><div class='math-block'><div class='math'>$$ f'(x) = -2x + 4 $$</div></div></div></div>"
       },
       {
         "question": "<div style='display: flex; align-items: baseline; gap: 0.5rem; flex-wrap: wrap;'><span style='font-weight: bold;'>2)</span> <span>Étudier les variations de \\( f \\) et dresser son tableau de variation.</span></div>",
         "reponse": "<div style='font-size: 0.95rem; line-height: 1.6;'><span style='font-weight: bold;'>Réponse :</span><div style='margin-top: 0.3rem;'>\\( f'(x) = 0 \\iff -2x+4=0 \\iff x=2 \\).<br>Pour \\( x<2 \\), \\( f'(x)>0 \\), donc \\( f \\) est strictement croissante sur \\( ]-\\infty; 2] \\).<br>Pour \\( x>2 \\), \\( f'(x)<0 \\), donc \\( f \\) est strictement décroissante sur \\( [2; +\\infty[ \\).<br>Le maximum est \\( f(2) = -4+8-3=1 \\).</div></div>"
       },
       {
         "question": "<div style='display: flex; align-items: baseline; gap: 0.5rem; flex-wrap: wrap;'><span style='font-weight: bold;'>3)</span> <span>Calculer la primitive \\( F \\) de \\( f \\) qui s'annule en \\( x=0 \\).</span></div>",
         "reponse": "<div style='font-size: 0.95rem; line-height: 1.6;'><span style='font-weight: bold;'>Réponse :</span><div style='margin-top: 0.3rem;'>Les primitives de \\( f \\) sont de la forme :<br><div class='math-block'><div class='math'>$$ F(x) = -\\frac{x^3}{3} + 2x^2 - 3x + C $$</div></div>On a \\( F(0)=C \\). Pour que \\( F(0)=0 \\), il faut que \\( C=0 \\).<br>La primitive cherchée est donc : <span style='font-weight: bold;'>\\( F(x) = -\\frac{x^3}{3} + 2x^2 - 3x \\)</span>.</div></div>"
       },
       {
         "question": "<div style='display: flex; align-items: baseline; gap: 0.5rem; flex-wrap: wrap;'><span style='font-weight: bold;'>4)</span> <span>Déterminer l'aire, en \\( \\text{cm}^2 \\), du domaine plan délimité par la courbe \\( \\mathcal{C}_f \\), l'axe des abscisses et les droites d'équations \\( x=1 \\) et \\( x=3 \\).</span></div>",
         "reponse": "<div style='font-size: 0.95rem; line-height: 1.6;'><span style='font-weight: bold;'>Réponse :</span><div style='margin-top: 0.3rem;'>Sur l'intervalle \\([1; 3]\\), \\( f(x) \\ge 0 \\). L'aire en unités d'aire est :<br><div class='math-block'><div class='math'>$$ \\mathcal{A} = \\int_1^3 f(x) \\, dx = \\left[ -\\frac{x^3}{3} + 2x^2 - 3x \\right]_1^3 = \\left( -9 + 18 - 9 \\right) - \\left( -\\frac{1}{3} + 2 - 3 \\right) = 0 - \\left( -\\frac{4}{3} \\right) = \\frac{4}{3} \\text{ u.a.} $$</div></div>Comme 1 u.a. = 1 cm², l'aire est de <span style='font-weight: bold;'>\\( \\frac{4}{3} \\text{ cm}^2 \\)</span>.</div></div>"
       }
     ]
   },
   {
     "titre": "Exercice 4 : Dénombrement et Loi Binomiale",
     "points": "4 pts",
     "enonce": "<div style='font-size: 1rem; line-height: 1.6;'>Une urne contient 5 boules noires et 3 boules blanches. On tire simultanément 3 boules de l'urne.</div>",
     "questions": [
       {
         "question": "<div style='display: flex; align-items: baseline; gap: 0.5rem; flex-wrap: wrap;'><span style='font-weight: bold;'>1)</span> <span>Calculer le nombre de tirages possibles.</span></div>",
         "reponse": "<div style='font-size: 0.95rem; line-height: 1.6;'><span style='font-weight: bold;'>Réponse :</span><div style='margin-top: 0.3rem;'>Le nombre de tirages possibles (combinaisons) est :<br><div class='math-block'><div class='math'>$$ \\binom{8}{3} = \\frac{8 \\times 7 \\times 6}{3 \\times 2 \\times 1} = 56 $$</div></div></div></div>"
       },
       {
         "question": "<div style='display: flex; align-items: baseline; gap: 0.5rem; flex-wrap: wrap;'><span style='font-weight: bold;'>2)</span> <span>Soit \\( X \\) la variable aléatoire qui donne le nombre de boules blanches tirées. Déterminer la loi de probabilité de \\( X \\).</span></div>",
         "reponse": "<div style='font-size: 0.95rem; line-height: 1.6;'><span style='font-weight: bold;'>Réponse :</span><div style='margin-top: 0.3rem;'>\\( X \\) suit une loi hypergéométrique. On a :<br><div class='math-block'><div class='math'>$$ P(X=k) = \\frac{\\binom{3}{k} \\binom{5}{3-k}}{\\binom{8}{3}} $$</div></div>Avec \\( k \\in \\{0, 1, 2, 3\\} \\).<br>On obtient :<br>\\( P(X=0) = \\frac{1 \\times 10}{56} = \\frac{10}{56} \\)<br>\\( P(X=1) = \\frac{3 \\times 10}{56} = \\frac{30}{56} \\)<br>\\( P(X=2) = \\frac{3 \\times 5}{56} = \\frac{15}{56} \\)<br>\\( P(X=3) = \\frac{1 \\times 1}{56} = \\frac{1}{56} \\)</div></div>"
       },
       {
         "question": "<div style='display: flex; align-items: baseline; gap: 0.5rem; flex-wrap: wrap;'><span style='font-weight: bold;'>3)</span> <span>Calculer l'espérance mathématique \\( E(X) \\) et l'écart-type \\( \\sigma(X) \\) de la variable aléatoire \\( X \\).</span></div>",
         "reponse": "<div style='font-size: 0.95rem; line-height: 1.6;'><span style='font-weight: bold;'>Réponse :</span><div style='margin-top: 0.3rem;'>L'espérance est :<br><div class='math-block'><div class='math'>$$ E(X) = \\sum k P(X=k) = 0 \\times \\frac{10}{56} + 1 \\times \\frac{30}{56} + 2 \\times \\frac{15}{56} + 3 \\times \\frac{1}{56} = \\frac{30+30+3}{56} = \\frac{63}{56} = 1,125 $$</div></div>La variance est \\( V(X) = E(X^2) - (E(X))^2 \\).<br>\\( E(X^2) = 0^2 \\times \\frac{10}{56} + 1^2 \\times \\frac{30}{56} + 2^2 \\times \\frac{15}{56} + 3^2 \\times \\frac{1}{56} = \\frac{30+60+9}{56} = \\frac{99}{56} \\approx 1,7679 \\)<br>Donc \\( V(X) = \\frac{99}{56} - \\left(\\frac{63}{56}\\right)^2 \\approx 1,7679 - 1,2656 = 0,5023 \\)<br>L'écart-type est <span style='font-weight: bold;'>\\( \\sigma(X) = \\sqrt{V(X)} \\approx 0,709 \\)</span>.</div></div>"

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
