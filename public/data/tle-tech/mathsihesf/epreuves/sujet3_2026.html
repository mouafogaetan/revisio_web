<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
 "matiere": "Mathématiques IH/ESF",
 "classe": "Tle technique",
 "sequence": "Séquence 3",
 "anneeScolaire": "2025-2026",
 "exercices": [
   {
     "titre": "Exercice 1 : Calcul numérique et systèmes",
     "points": "4 pts",
     "enonce": "<p>Cet exercice porte sur les calculs avec les grands nombres et la résolution de systèmes linéaires.</p>",
     "questions": [
       {
         "question": "<p><strong>1.1</strong> (2 pts) En utilisant les propriétés des puissances de 10, effectue les calculs suivants sans utiliser la calculatrice et donne le résultat en notation scientifique :</p><p style='margin-left:20px;'>A = 150 000 000 × 0,000 000 03</p><p style='margin-left:20px;'>B = 0,000 000 072 ÷ 0,000 000 000 12</p>",
         "reponse": "<p><strong>Solution :</strong></p><p>A = (1,5 × 10<sup>8</sup>) × (3 × 10<sup>-8</sup>) = 4,5 × 10<sup>0</sup> = 4,5</p><p>B = (7,2 × 10<sup>-8</sup>) ÷ (1,2 × 10<sup>-10</sup>) = (7,2/1,2) × 10<sup>(-8)-(-10)</sup> = 6 × 10<sup>2</sup> = 600</p><p>L'écriture scientifique de B est 6 × 10<sup>2</sup>.</p>"
       },
       {
         "question": "<p><strong>1.2</strong> (2 pts) Résous le système linéaire suivant dans R<sup>3</sup> en utilisant la méthode de substitution ou des combinaisons linéaires :</p><div class='math-block'><div class='math'>$$ \\begin{cases} x + y - z = 2 \\\\ 2x - y + z = 1 \\\\ -x + 2y + 3z = 7 \\end{cases} $$</div></div>",
         "reponse": "<p><strong>Solution :</strong></p><p>Par combinaisons linéaires :</p><p>L<sub>1</sub> + L<sub>2</sub> donne (x + y - z) + (2x - y + z) = 2 + 1, soit 3x = 3, donc <strong>x = 1</strong>.</p><p>L<sub>1</sub> + L<sub>3</sub> donne (x + y - z) + (-x + 2y + 3z) = 2 + 7, soit 3y + 2z = 9.</p><p>2L<sub>2</sub> + L<sub>3</sub> donne 2(2x - y + z) + (-x + 2y + 3z) = 2(1) + 7, soit 3x + 5z = 9.</p><p>Avec x = 1, on a 3(1) + 5z = 9 ⇒ 5z = 6 ⇒ <strong>z = 6/5</strong>.</p><p>En remplaçant dans 3y + 2z = 9, on obtient 3y + 2(6/5) = 9 ⇒ 3y = 9 - 12/5 = (45-12)/5 = 33/5 ⇒ <strong>y = 11/5</strong>.</p><p>La solution est donc <strong>S = { (1, 11/5, 6/5) }</strong>.</p>"
       }
     ]
   },
   {
     "titre": "Exercice 2 : Équations et inéquations logarithmiques/exponentielles",
     "points": "4 pts",
     "enonce": "<p>L'objectif est de résoudre des équations et inéquations faisant intervenir les fonctions logarithmes et exponentielles.</p>",
     "questions": [
       {
         "question": "<p><strong>2.1</strong> (2 pts) Résous dans R les équations suivantes :</p><p>a) \\( 2\\ln(x) = \\ln(4x + 12) \\)</p><p>b) \\( e^{2x-1} = 4 \\)</p>",
         "reponse": "<p><strong>Solution :</strong></p><p><strong>a)</strong> Domaine de définition : x > 0 et 4x + 12 > 0 ⇒ x > -3. Donc x > 0.</p><p>2ln(x) = ln(x<sup>2</sup>) donc l'équation devient ln(x<sup>2</sup>) = ln(4x + 12).</p><p>La fonction ln est injective, donc x<sup>2</sup> = 4x + 12 ⇒ x<sup>2</sup> - 4x - 12 = 0.</p><p>Δ = 16 + 48 = 64. x<sub>1</sub> = (4 - 8)/2 = -2 (exclu car x > 0) et x<sub>2</sub> = (4 + 8)/2 = 6.</p><p>La solution est <strong>S = {6}</strong>.</p><p><strong>b)</strong> e<sup>2x-1</sup> = 4 ⇒ 2x - 1 = ln(4) ⇒ 2x = 1 + ln(4) ⇒ x = (1 + ln(4))/2.</p><p>La solution est <strong>S = { (1 + 2ln(2))/2 }</strong>.</p>"
       },
       {
         "question": "<p><strong>2.2</strong> (2 pts) Résous dans R l'inéquation suivante :</p><div class='math-block'><div class='math'>$$ e^{3x+1} > 2e^{x-2} $$</div></div>",
         "reponse": "<p><strong>Solution :</strong></p><p>e<sup>3x+1</sup> > 2e<sup>x-2</sup>.</p><p>Comme l'exponentielle est strictement positive, on peut diviser par e<sup>x-2</sup> :</p><p>e<sup>3x+1 - (x-2)</sup> > 2 ⇒ e<sup>2x+3</sup> > 2.</p><p>La fonction ln est strictement croissante, donc :</p><p>2x + 3 > ln(2) ⇒ 2x > ln(2) - 3 ⇒ x > (ln(2) - 3)/2.</p><p>L'ensemble des solutions est <strong>S = ] (ln(2)-3)/2, +∞ [</strong>.</p>"
       }
     ]
   },
   {
     "titre": "Exercice 3 : Étude de fonction polynôme et rationnelle",
     "points": "5 pts",
     "enonce": "<p>Cet exercice permet d'étudier une fonction rationnelle en utilisant les dérivées et d'en déduire des propriétés graphiques.</p>",
     "questions": [
       {
         "question": "<p>Soit la fonction f définie par \\( f(x) = \\dfrac{x^2 - 3x + 3}{x - 2} \\) sur son ensemble de définition D<sub>f</sub>.</p><p><strong>3.1</strong> (0.5 pt) Détermine D<sub>f</sub>.</p>",
         "reponse": "<p><strong>Solution :</strong></p><p>La fonction f est définie lorsque le dénominateur est différent de 0, c'est-à-dire x - 2 ≠ 0 ⇒ x ≠ 2.</p><p>Donc <strong>D<sub>f</sub> = R \\ {2}</strong>.</p>"
       },
       {
         "question": "<p><strong>3.2</strong> (0.5 pt) Calcule les limites de f aux bornes de son ensemble de définition.</p>",
         "reponse": "<p><strong>Solution :</strong></p><p>En +∞ et -∞ : f(x) = (x<sup>2</sup> - 3x + 3)/(x - 2). Les termes dominants sont x<sup>2</sup>/x = x. Donc lim<sub>x→+∞</sub> f(x) = +∞ et lim<sub>x→-∞</sub> f(x) = -∞.</p><p>En 2 : lim<sub>x→2<sup>+</sup></sub> (x<sup>2</sup> - 3x + 3) = 4 - 6 + 3 = 1 > 0 et (x - 2) → 0<sup>+</sup>, donc lim<sub>x→2<sup>+</sup></sub> f(x) = +∞.</p><p>lim<sub>x→2<sup>-</sup></sub> (x<sup>2</sup> - 3x + 3) = 1 > 0 et (x - 2) → 0<sup>-</sup>, donc lim<sub>x→2<sup>-</sup></sub> f(x) = -∞.</p><p>La droite x = 2 est une asymptote verticale.</p>"
       },
       {
         "question": "<p><strong>3.3</strong> (1.5 pts) Calcule la dérivée f'(x) et étudie son signe. Donne le tableau de variations de f.</p>",
         "reponse": "<p><strong>Solution :</strong></p><p>f'(x) = [(2x - 3)(x - 2) - (x<sup>2</sup> - 3x + 3)(1)] / (x - 2)<sup>2</sup></p><p>= (2x<sup>2</sup> - 4x - 3x + 6 - x<sup>2</sup> + 3x - 3) / (x - 2)<sup>2</sup></p><p>= (x<sup>2</sup> - 4x + 3) / (x - 2)<sup>2</sup>.</p><p>Le dénominateur est toujours positif (sauf en x=2). Le signe de f'(x) est celui de x<sup>2</sup> - 4x + 3 = (x - 1)(x - 3).</p><p>Un trinôme du second degré est positif à l'extérieur des racines. Donc f'(x) > 0 sur ]-∞, 1[ ∪ ]3, +∞[ et f'(x) < 0 sur ]1, 2[ ∪ ]2, 3[.</p><p><strong>Tableau de variations :</strong></p><p>f(1) = (1 - 3 + 3)/(1 - 2) = 1/(-1) = -1.</p><p>f(3) = (9 - 9 + 3)/(3 - 2) = 3.</p><p>f est croissante sur ]-∞, 1[, décroissante sur ]1, 2[, décroissante sur ]2, 3[, puis croissante sur ]3, +∞[.</p>"
       },
       {
         "question": "<p><strong>3.4</strong> (1 pt) Détermine l'équation de l'asymptote oblique à la courbe représentative de f en +∞ et en -∞.</p>",
         "reponse": "<p><strong>Solution :</strong></p><p>On effectue la division euclidienne de (x<sup>2</sup> - 3x + 3) par (x - 2) :</p><p>x<sup>2</sup> - 3x + 3 = (x - 1)(x - 2) + 1.</p><p>Donc f(x) = x - 1 + 1/(x - 2).</p><p>Comme lim<sub>x→±∞</sub> 1/(x - 2) = 0, la courbe admet une asymptote oblique d'équation <strong>y = x - 1</strong>.</p>"
       },
       {
         "question": "<p><strong>3.5</strong> (1 pt) Calcule les coordonnées des points d'intersection de la courbe avec l'axe des abscisses (si ils existent).</p>",
         "reponse": "<p><strong>Solution :</strong></p><p>f(x) = 0 ⇒ x<sup>2</sup> - 3x + 3 = 0.</p><p>Δ = 9 - 12 = -3 < 0. Le polynôme n'a pas de racine réelle.</p><p>Donc la courbe ne coupe pas l'axe des abscisses.</p>"
       }
     ]
   },
   {
     "titre": "Exercice 4 : Primitives et intégrales",
     "points": "4 pts",
     "enonce": "<p>Les questions portent sur le calcul de primitives et d'intégrales.</p>",
     "questions": [
       {
         "question": "<p><strong>4.1</strong> (1.5 pts) Détermine les primitives suivantes sur les intervalles donnés :</p><p>a) \\( \\int (3x^2 - 2x + 5) \\, dx \\) sur R</p><p>b) \\( \\int \\dfrac{1}{2x-3} \\, dx \\) sur ]3/2, +∞[</p>",
         "reponse": "<p><strong>Solution :</strong></p><p><strong>a)</strong> Une primitive est F(x) = x<sup>3</sup> - x<sup>2</sup> + 5x + C, avec C ∈ R.</p><p><strong>b)</strong> Une primitive est G(x) = (1/2) ln(2x - 3) + C, avec C ∈ R.</p>"
       },
       {
         "question": "<p><strong>4.2</strong> (2.5 pts) Calcule l'intégrale suivante et interprète graphiquement le résultat.</p><div class='math-block'><div class='math'>$$ I = \\int_{1}^{3} (x^2 - 2x + 1) \\, dx $$</div></div>",
         "reponse": "<p><strong>Solution :</strong></p><p>La fonction g(x) = x<sup>2</sup> - 2x + 1 = (x - 1)<sup>2</sup> est positive sur [1, 3].</p><p>Une primitive de g est G(x) = x<sup>3</sup>/3 - x<sup>2</sup> + x.</p><p>I = G(3) - G(1) = (27/3 - 9 + 3) - (1/3 - 1 + 1) = (9 - 9 + 3) - (1/3) = 3 - 1/3 = 8/3.</p><p><strong>Interprétation graphique :</strong> I représente l'aire (en unités d'aire) de la partie du plan délimitée par la courbe de g, l'axe des abscisses et les droites verticales x=1 et x=3.</p>"
       }
     ]
   },
   {
     "titre": "Exercice 5 : Logarithme et exponentielle (étude de fonction)",
     "points": "5 pts",
     "enonce": "<p>Cet exercice permet d'étudier une fonction simple faisant intervenir le logarithme népérien.</p>",

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
