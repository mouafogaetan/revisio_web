<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Mathématiques IH/ESF",
  "classe": "Tle technique",
  "sequence": "Séquence 6",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Probabilités et loi binomiale",
      "points": "5 pts",
      "enonce": "<div style='padding: 10px; font-size: 1rem; color: #1a202c;'> <p>Dans une entreprise de transport, 20 % des camions présentent un défaut technique lors du contrôle annuel. On prélève au hasard un échantillon de 5 camions. Soit \\( X \\) la variable aléatoire comptant le nombre de camions défectueux dans l'échantillon.</p> </div>",
      "questions": [
        {
          "question": "<p>1. Déterminer la loi de probabilité suivie par \\( X \\). Préciser ses paramètres.</p>",
          "reponse": "<p>\\( X \\) suit une loi binomiale de paramètres \\( n = 5 \\) et \\( p = 0,2 \\). On note \\( X \\sim \\mathcal{B}(5; 0,2) \\).</p>"
        },
        {
          "question": "<p>2. Calculer la probabilité qu'il y ait exactement 3 camions défectueux.</p>",
          "reponse": "<p>\\( P(X = 3) = \\binom{5}{3} (0,2)^3 (0,8)^2 = 10 \\times 0,008 \\times 0,64 = 0,0512 \\).</p>"
        },
        {
          "question": "<p>3. Calculer la probabilité qu'il y ait au plus 2 camions défectueux.</p>",
          "reponse": "<p>\\( P(X \\leq 2) = P(X=0) + P(X=1) + P(X=2) \\)</p><p>\\( P(X=0) = 0,8^5 = 0,32768 \\)</p><p>\\( P(X=1) = 5 \\times 0,2 \\times 0,8^4 = 0,4096 \\)</p><p>\\( P(X=2) = 10 \\times 0,04 \\times 0,8^3 = 0,2048 \\)</p><p>Donc \\( P(X \\leq 2) = 0,32768 + 0,4096 + 0,2048 = 0,94208 \\).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Espérance, variance et écart-type",
      "points": "4 pts",
      "enonce": "<div style='padding: 10px; font-size: 1rem; color: #1a202c;'> <p>Une entreprise vend des billets de tombola au prix de 1 000 FCFA. Le billet permet de gagner :</p> <ul><li>50 000 FCFA avec une probabilité de 0,01</li><li>10 000 FCFA avec une probabilité de 0,05</li><li>5 000 FCFA avec une probabilité de 0,10</li><li>0 FCFA avec une probabilité de 0,84</li></ul> <p>Soit \\( G \\) la variable aléatoire donnant le gain net (gain - prix du billet).</p> </div>",
      "questions": [
        {
          "question": "<p>1. Déterminer la loi de probabilité de \\( G \\).</p>",
          "reponse": "<p>Gain net = gain - 1000. Donc les valeurs possibles sont : 49 000, 9 000, 4 000, -1 000.</p><p>Loi : \\( P(G = 49000) = 0,01 \\), \\( P(G = 9000) = 0,05 \\), \\( P(G = 4000) = 0,10 \\), \\( P(G = -1000) = 0,84 \\).</p>"
        },
        {
          "question": "<p>2. Calculer l'espérance mathématique \\( E(G) \\).</p>",
          "reponse": "<p>\\( E(G) = 49000 \\times 0,01 + 9000 \\times 0,05 + 4000 \\times 0,10 + (-1000) \\times 0,84 \\)</p><p>\\( E(G) = 490 + 450 + 400 - 840 = 500 \\).</p><p>L'entreprise gagne en moyenne 500 FCFA par billet vendu.</p>"
        },
        {
          "question": "<p>3. Calculer la variance et l'écart-type de \\( G \\).</p>",
          "reponse": "<p>On calcule \\( E(G^2) = 49000^2 \\times 0,01 + 9000^2 \\times 0,05 + 4000^2 \\times 0,10 + (-1000)^2 \\times 0,84 \\)</p><p>\\( E(G^2) = 2 401 000 000 \\times 0,01 + 81 000 000 \\times 0,05 + 16 000 000 \\times 0,10 + 1 000 000 \\times 0,84 \\)</p><p>\\( E(G^2) = 24 010 000 + 4 050 000 + 1 600 000 + 840 000 = 30 500 000 \\).</p><p>\\( V(G) = E(G^2) - (E(G))^2 = 30 500 000 - 250 000 = 30 250 000 \\).</p><p>\\( \\sigma(G) = \\sqrt{30 250 000} \\approx 5 500 \\).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Fonction de répartition",
      "points": "3 pts",
      "enonce": "<div style='padding: 10px; font-size: 1rem; color: #1a202c;'> <p>Soit \\( X \\) une variable aléatoire dont la loi de probabilité est donnée par :</p> <table style='width: 100%; border-collapse: collapse; background: #f7fafc; border-radius: 10px; overflow: hidden;'> <thead> <tr style='background: #2b6cb0; color: #ffffff;'> <th style='padding: 10px; text-align: center;'>\\( x_i \\)</th> <th style='padding: 10px; text-align: center;'>1</th> <th style='padding: 10px; text-align: center;'>2</th> <th style='padding: 10px; text-align: center;'>3</th> <th style='padding: 10px; text-align: center;'>4</th> </tr> </thead> <tbody> <tr style='border-bottom: 1px solid #e2e8f0;'> <td style='padding: 10px; text-align: center; font-weight: bold;'>\\( P(X = x_i) \\)</td> <td style='padding: 10px; text-align: center;'>0,2</td> <td style='padding: 10px; text-align: center;'>0,3</td> <td style='padding: 10px; text-align: center;'>0,4</td> <td style='padding: 10px; text-align: center;'>0,1</td> </tr> </tbody> </table> </div>",
      "questions": [
        {
          "question": "<p>1. Vérifier que la somme des probabilités est égale à 1.</p>",
          "reponse": "<p>\\( 0,2 + 0,3 + 0,4 + 0,1 = 1 \\). La loi est bien définie.</p>"
        },
        {
          "question": "<p>2. Déterminer la fonction de répartition \\( F(x) \\).</p>",
          "reponse": "<p>\\( F(x) = \\begin{cases} 0 & \\text{si } x < 1 \\\\ 0,2 & \\text{si } 1 \\leq x < 2 \\\\ 0,5 & \\text{si } 2 \\leq x < 3 \\\\ 0,9 & \\text{si } 3 \\leq x < 4 \\\\ 1 & \\text{si } x \\geq 4 \\end{cases} \\)</p>"
        },
        {
          "question": "<p>3. Calculer \\( P(X > 2) \\).</p>",
          "reponse": "<p>\\( P(X > 2) = 1 - P(X \\leq 2) = 1 - F(2) = 1 - 0,5 = 0,5 \\).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Problème d'application en gestion",
      "points": "4 pts",
      "enonce": "<div style='padding: 10px; font-size: 1rem; color: #1a202c;'> <p>Un commerçant sait que 8 % de ses clients paient par chèque sans provision. Il reçoit 12 clients par jour.</p> <p>Soit \\( X \\) la variable aléatoire comptant le nombre de clients payant par chèque sans provision parmi les 12.</p> </div>",
      "questions": [
        {
          "question": "<p>1. Quelle est la loi de \\( X \\) ?</p>",
          "reponse": "<p>\\( X \\sim \\mathcal{B}(12; 0,08) \\).</p>"
        },
        {
          "question": "<p>2. Calculer la probabilité qu'aucun client ne paie par chèque sans provision.</p>",
          "reponse": "<p>\\( P(X = 0) = (0,92)^{12} \\approx 0,3677 \\).</p>"
        },
        {
          "question": "<p>3. Calculer le nombre moyen de clients payant par chèque sans provision par jour.</p>",
          "reponse": "<p>\\( E(X) = 12 \\times 0,08 = 0,96 \\). En moyenne, environ 1 client par jour.</p>"
        },
        {
          "question": "<p>4. Le commerçant décide de refuser les chèques si plus de 2 clients par jour présentent un risque. Quelle est la probabilité qu'il prenne cette décision ?</p>",
          "reponse": "<p>Il refuse si \\( X > 2 \\), soit \\( P(X > 2) = 1 - P(X \\leq 2) \\).</p><p>\\( P(X=0) = 0,3677 \\)</p><p>\\( P(X=1) = 12 \\times 0,08 \\times (0,92)^{11} = 0,3837 \\)</p><p>\\( P(X=2) = \\binom{12}{2} (0,08)^2 (0,92)^{10} = 66 \\times 0,0064 \\times 0,4344 = 0,1835 \\)</p><p>\\( P(X \\leq 2) = 0,3677 + 0,3837 + 0,1835 = 0,9349 \\)</p><p>\\( P(X > 2) = 1 - 0,9349 = 0,0651 \\).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 5 : Problème de prise de décision",
      "points": "4 pts",
      "enonce": "<div style='padding: 10px; font-size: 1rem; color: #1a202c;'> <p>Une entreprise hésite entre deux fournisseurs A et B. Le fournisseur A livre 5 % de pièces défectueuses, tandis que le fournisseur B en livre 8 %. On commande un lot de 10 pièces à chaque fournisseur.</p> </div>",
      "questions": [
        {
          "question": "<p>1. Quelle est la probabilité que le lot du fournisseur A contienne exactement 1 pièce défectueuse ?</p>",
          "reponse": "<p>Pour A : \\( X_A \\sim \\mathcal{B}(10; 0,05) \\).</p><p>\\( P(X_A = 1) = \\binom{10}{1} (0,05)^1 (0,95)^9 = 10 \\times 0,05 \\times 0,6302 = 0,3151 \\).</p>"
        },
        {
          "question": "<p>2. Quelle est la probabilité que le lot du fournisseur B contienne au plus 1 pièce défectueuse ?</p>",
          "reponse": "<p>Pour B : \\( X_B \\sim \\mathcal{B}(10; 0,08) \\).</p><p>\\( P(X_B \\leq 1) = P(X_B=0) + P(X_B=1) \\)</p><p>\\( P(X_B=0) = 0,92^{10} = 0,4344 \\)</p><p>\\( P(X_B=1) = 10 \\times 0,08 \\times 0,92^9 = 0,3778 \\)</p><p>\\( P(X_B \\leq 1) = 0,4344 + 0,3778 = 0,8122 \\).</p>"
        },
        {
          "question": "<p>3. Quel fournisseur l'entreprise devrait-elle choisir si elle souhaite minimiser le nombre de pièces défectueuses ? Justifier.</p>",
          "reponse": "<p>Le fournisseur A a un taux de défaut plus faible (5% contre 8%). L'espérance pour A est \\( 10 \\times 0,05 = 0,5 \\) pièce défectueuse, contre \\( 10 \\times 0,08 = 0,8 \\) pour B. L'entreprise devrait choisir le fournisseur A.</p>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
