<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
 "matiere": "Mathématiques",
 "classe": "Tle technique",
 "sequence": "Séquence 1",
 "anneeScolaire": "2025-2026",
 "exercices": [
   {
     "titre": "Exercice 1 : Systèmes d'équations linéaires",
     "points": "3 pts",
     "enonce": "<p>Un commerçant de Douala vend trois types de produits : A, B et C. Les prix unitaires sont respectivement de 1000 FCFA, 1500 FCFA et 2000 FCFA. Un client achète 5 articles, pour un total de 6500 FCFA. Sachant qu'il a acheté deux fois plus de produits A que de produits B, déterminer le nombre d'articles de chaque type.</p>",
     "questions": [
       {
         "question": "1) Traduire le problème en un système d'équations linéaires à trois inconnues.",
         "reponse": "Soit x le nombre d'articles de type A, y le nombre d'articles de type B et z le nombre d'articles de type C. Le système est : <br> \\( \\begin{cases} x + y + z = 5 \\\\ 1000x + 1500y + 2000z = 6500 \\\\ x = 2y \\end{cases} \\)"
       },
       {
         "question": "2) Résoudre le système et donner les quantités de chaque produit achetées.",
         "reponse": "En remplaçant x par 2y dans les deux premières équations : <br> \\( 3y + z = 5 \\Rightarrow z = 5 - 3y \\) <br> \\( 1000(2y) + 1500y + 2000(5-3y) = 6500 \\) <br> \\( 2000y + 1500y + 10000 - 6000y = 6500 \\) <br> \\( -2500y = -3500 \\Rightarrow y = 1.4 \\) <br> Ce résultat n'est pas un nombre entier, ce qui indique que les données du problème ne sont pas cohérentes avec des quantités entières."
       }
     ]
   },
   {
     "titre": "Exercice 2 : Équations logarithmiques et exponentielles",
     "points": "4 pts",
     "enonce": "<p>Résoudre dans \\( \\mathbb{R} \\) les équations et inéquations suivantes :</p>",
     "questions": [
       {
         "question": "1) Résoudre l'équation : \\( \\ln(x-1) + \\ln(x+1) = \\ln(3) \\).",
         "reponse": "Domaine de définition : \\( x > 1 \\). <br> \\( \\ln((x-1)(x+1)) = \\ln(3) \\Rightarrow x^2 - 1 = 3 \\Rightarrow x^2 = 4 \\Rightarrow x = \\pm 2 \\). <br> Seule la valeur \\( x = 2 \\) appartient au domaine de définition. Solution : \\( x = 2 \\)."
       },
       {
         "question": "2) Résoudre l'inéquation : \\( e^{2x-1} \\le e^{x+3} \\).",
         "reponse": "La fonction exponentielle est strictement croissante sur \\( \\mathbb{R} \\), donc : <br> \\( 2x-1 \\le x+3 \\Rightarrow x \\le 4 \\). <br> Solution : \\( ]-\\infty; 4] \\)."
       },
       {
         "question": "3) Résoudre l'équation : \\( e^{2x} - 6e^x + 5 = 0 \\).",
         "reponse": "En posant \\( t = e^x > 0 \\), l'équation devient : <br> \\( t^2 - 6t + 5 = 0 \\Rightarrow (t-1)(t-5) = 0 \\Rightarrow t = 1 \\, \\text{ou} \\, t = 5 \\). <br> \\( e^x = 1 \\Rightarrow x = 0 \\) et \\( e^x = 5 \\Rightarrow x = \\ln(5) \\). <br> Solutions : \\( x = 0 \\) et \\( x = \\ln(5) \\)."
       }
     ]
   },
   {
     "titre": "Exercice 3 : Primitives et intégrales",
     "points": "5 pts",
     "enonce": "<p>On considère la fonction \\( f(x) = 3x^2 + 2x - 1 \\) définie sur \\( \\mathbb{R} \\).</p>",
     "questions": [
       {
         "question": "1) Déterminer la primitive \\( F \\) de \\( f \\) telle que \\( F(0) = 2 \\).",
         "reponse": "Les primitives de \\( f \\) sont de la forme \\( F(x) = x^3 + x^2 - x + C \\). <br> \\( F(0) = C = 2 \\), donc \\( F(x) = x^3 + x^2 - x + 2 \\)."
       },
       {
         "question": "2) Calculer l'intégrale \\( I = \\int_0^2 f(x) dx \\).",
         "reponse": "\\( I = \\int_0^2 (3x^2 + 2x - 1) dx = [x^3 + x^2 - x]_0^2 = (8 + 4 - 2) - 0 = 10 \\)."
       },
       {
         "question": "3) Interpréter géométriquement cette intégrale.",
         "reponse": "L'intégrale \\( I = 10 \\) représente l'aire (en unités d'aire) de la région délimitée par la courbe de la fonction \\( f \\), l'axe des abscisses, et les droites d'équation \\( x = 0 \\) et \\( x = 2 \\)."
       }
     ]
   },
   {
     "titre": "Exercice 4 : Statistiques à deux caractères",
     "points": "4 pts",
     "enonce": "<p>Dans un lycée de Yaoundé, on a relevé le nombre de livres lus par semaine par 6 élèves et la note moyenne qu'ils obtiennent en français.</p><table style='width:100%; border-collapse:collapse; margin:10px 0;'><tr style='background:#1a237e; color:white;'><th style='padding:8px; border:1px solid #004d40;'>Livres (x<sub>i</sub>)</th><td style='padding:8px; border:1px solid #004d40;'>1</td><td style='padding:8px; border:1px solid #004d40;'>2</td><td style='padding:8px; border:1px solid #004d40;'>3</td><td style='padding:8px; border:1px solid #004d40;'>4</td><td style='padding:8px; border:1px solid #004d40;'>5</td><td style='padding:8px; border:1px solid #004d40;'>6</td></tr><tr style='background:#e3f2fd;'><th style='padding:8px; border:1px solid #004d40;'>Notes (y<sub>i</sub>)</th><td style='padding:8px; border:1px solid #004d40;'>10</td><td style='padding:8px; border:1px solid #004d40;'>11</td><td style='padding:8px; border:1px solid #004d40;'>13</td><td style='padding:8px; border:1px solid #004d40;'>14</td><td style='padding:8px; border:1px solid #004d40;'>16</td><td style='padding:8px; border:1px solid #004d40;'>17</td></tr></table>",
     "questions": [
       {
         "question": "1) Représenter le nuage de points \\( M_i(x_i; y_i) \\) dans un repère orthogonal.",
         "reponse": "Construction graphique du nuage de points."
       },
       {
         "question": "2) Calculer les coordonnées du point moyen \\( G \\) du nuage.",
         "reponse": "L'abscisse du point moyen est \\( \\bar{x} = \\frac{1+2+3+4+5+6}{6} = 3.5 \\). <br> L'ordonnée du point moyen est \\( \\bar{y} = \\frac{10+11+13+14+16+17}{6} = 13.5 \\). <br> Donc \\( G(3.5; 13.5) \\)."
       },
       {
         "question": "3) Effectuer un ajustement linéaire du nuage par la méthode de Mayer.",
         "reponse": "Sous-groupes : G1 avec les 3 premiers points (1;10), (2;11), (3;13) et G2 avec les 3 derniers (4;14), (5;16), (6;17). <br> \\( G_1 \\left(\\frac{1+2+3}{3}; \\frac{10+11+13}{3}\\right) = (2; \\frac{34}{3}) \\approx (2; 11.33) \\). <br> \\( G_2 \\left(\\frac{4+5+6}{3}; \\frac{14+16+17}{3}\\right) = (5; \\frac{47}{3}) \\approx (5; 15.67) \\). <br> Le coefficient directeur est \\( a = \\frac{15.67 - 11.33}{5 - 2} = \\frac{4.34}{3} \\approx 1.45 \\). <br> L'équation est \\( y - 11.33 = 1.45(x - 2) \\Rightarrow y = 1.45x + 8.43 \\)."
       },
       {
         "question": "4) En utilisant cet ajustement, estimer la note d'un élève qui lit 7 livres par semaine.",
         "reponse": "En remplaçant \\( x = 7 \\) dans l'équation : <br> \\( y = 1.45 \\times 7 + 8.43 = 10.15 + 8.43 = 18.58 \\). <br> La note estimée est d'environ 18.58/20."
       }
     ]
   }
 ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
