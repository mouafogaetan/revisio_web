<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Présentation mobile</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' },
            options: { skipHtmlTypes: 'script' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 500px;
        margin: 0 auto;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    .slide-header {
        flex-shrink: 0;
        padding: 18px 16px 10px 16px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        z-index: 10;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .slide-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
    }

    .content-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 18px 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        flex-shrink: 0;
    }

    .content-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .content-card li {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        line-height: 1.5;
    }

    .content-card li:last-child {
        border-bottom: none;
    }

    .bullet-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
    }

    .math-block {
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        overflow-x: auto;
        flex-shrink: 0;
        margin: 4px 0;
    }

    .math-block .math {
        font-size: 1.2rem;
        color: #e2e8f0;
    }

    .note-box {
        background: rgba(96, 165, 250, 0.08);
        border-left: 4px solid #60a5fa;
        padding: 12px 16px;
        border-radius: 12px;
        font-style: italic;
        font-size: 0.9rem;
        color: #cbd5e1;
        flex-shrink: 0;
    }

    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        border-radius: 0;
        flex-direction: column;
    }

    .loading-card {
        background: #1e293b;
        padding: 32px 28px;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #334155;
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px auto;
    }

    .loading-text {
        font-weight: 600;
        font-size: 1.1rem;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    .loading-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 16px;
    }
    .loading-progress {
        height: 3px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        animation: loadingProgress 30s ease-out forwards;
    }

    .loading-timeout {
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 12px;
    }

    .btn-cancel-loading {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 40px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #f87171;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }

    .btn-cancel-loading:active {
        transform: scale(0.94);
        background: rgba(239, 68, 68, 0.25);
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
    }

    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .slide-counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255,255,255,0.05);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(255,255,255,0.04);
    }

    .status-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 30px;
        background: rgba(96, 165, 250, 0.12);
        color: #93bbfc;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
    }

    .status-badge .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: pulse-dot 1.2s infinite;
        flex-shrink: 0;
    }

    .status-badge.idle .dot {
        animation: none;
        background: #64748b;
    }
    .status-badge.speaking .dot {
        background: #34d399;
        animation: pulse-dot 0.8s infinite;
    }
    .status-badge.error .dot {
        background: #f87171;
        animation: none;
    }
    .status-badge.paused .dot {
        animation: none;
        background: #fbbf24;
    }
    .status-badge.waiting .dot {
        animation: pulse-dot 1.5s infinite;
        background: #fbbf24;
    }
    .status-badge.loading .dot {
        animation: pulse-dot 0.5s infinite;
        background: #60a5fa;
    }

    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.7); }
    }

    .footer-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(255,255,255,0.1);
    }

    .btn-secondary {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-play {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
        min-width: 80px;
        justify-content: center;
    }
    .btn-play:active {
        background: rgba(52, 211, 153, 0.25);
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
    }

    .auto-indicator {
        font-size: 0.65rem;
        color: #64748b;
        text-align: center;
        letter-spacing: 0.3px;
        padding: 2px 0;
    }

    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.2rem;
        }
        .content-card li {
            font-size: 0.9rem;
            padding: 8px 0;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .btn-play {
            min-width: 60px;
        }
        .footer-buttons {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
        .loading-card {
            padding: 20px 16px;
        }
        .math-block .math {
            font-size: 1rem;
        }
    }

    @media (min-width: 600px) {
        .app-container {
            max-width: 480px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
        .loading-overlay {
            border-radius: 32px;
        }
    }

    /* Mode jour (par défaut) */
    html, body {
        background: #f0f4f8 !important;
        color: #1a202c !important;
    }
    .app-container {
        background: linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%) !important;
    }
    .slide-header {
        background: rgba(255, 255, 255, 0.85) !important;
        border-bottom: 1px solid rgba(0,0,0,0.08) !important;
    }
    .slide-header h1 {
        background: linear-gradient(135deg, #2b6cb0, #6b46c1) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        background-clip: text !important;
    }
    .slide-footer {
        background: rgba(255, 255, 255, 0.9) !important;
        border-top: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card {
        background: rgba(255,255,255,0.8) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card li {
        border-bottom: 1px solid rgba(0,0,0,0.05) !important;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.12) !important;
        border-left: 4px solid #4299e1 !important;
        color: #2c3e50 !important;
    }
    .math-block {
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .math-block .math {
        color: #2d3748 !important;
    }
    .slide-counter {
        color: #4a5568 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .status-badge {
        background: rgba(96, 165, 250, 0.15) !important;
        color: #2b6cb0 !important;
        border: 1px solid rgba(96, 165, 250, 0.15) !important;
    }
    .btn {
        color: #2d3748 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .btn-secondary {
        background: rgba(0,0,0,0.04) !important;
        border-color: rgba(0,0,0,0.08) !important;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15) !important;
        border-color: rgba(52, 211, 153, 0.2) !important;
        color: #38a169 !important;
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15) !important;
        border-color: rgba(251, 191, 36, 0.2) !important;
        color: #d69e2e !important;
    }
    .auto-indicator {
        color: #718096 !important;
    }
    .loading-card {
        background: #ffffff !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .loading-text {
        color: #1a202c !important;
    }
    .loading-sub {
        color: #4a5568 !important;
    }
</style>
</head>
<body>

<div class="app-container">

    <header class="slide-header">
        <h1 id="slideTitle">Chargement...</h1>
    </header>

    <main class="slide-body" id="slideBody"></main>

    <!-- LOADING OVERLAY AVEC BOUTON ANNULER -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Préparation vocale...</div>
            <div class="loading-sub" id="loadingSub">Synthèse en cours</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loadingProgressBar"></div>
            </div>
            <div class="loading-timeout" id="loadingTimeout">⏱️ 30 secondes maximum</div>
            <button class="btn-cancel-loading" id="cancelLoadingBtn">
                <span>✕</span> Annuler
            </button>
        </div>
    </div>

    <footer class="slide-footer">
        <div class="footer-top">
            <span class="slide-counter" id="slideCounter">1 / 3</span>
            <span class="status-badge idle" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">Prêt</span>
            </span>
        </div>

        <div class="footer-buttons">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-secondary" id="replayBtn">
                <span class="btn-icon">🔁</span> <span class="btn-label">Relire</span>
            </button>
            <button class="btn btn-play" id="playBtn">
                <span class="btn-icon">▶</span> <span class="btn-label">Play</span>
            </button>
        </div>

        <div class="auto-indicator" id="autoIndicator">⏸ Lecture manuelle</div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // SLIDES
    // ================================================================
    const slides = [
  {
    "titre": "Introduction aux statistiques à deux caractères",
    "contenu": "<div style='padding: 10px; background: #f0f4f8; border-radius: 15px; color: #1a202c;'> <div style='text-align: justify;'> <p><strong>Définition :</strong> Les statistiques à deux caractères consistent à étudier deux variables simultanément pour une même population. On cherche à mettre en évidence une éventuelle relation entre ces deux variables.</p> <ul style='list-style: none; padding: 0;'> <li style='background: #ffffff; margin: 8px 0; padding: 10px; border-radius: 8px; border-left: 4px solid #2b6cb0;'>• <strong>Variable explicative (X) :</strong> souvent notée en abscisse.</li> <li style='background: #ffffff; margin: 8px 0; padding: 10px; border-radius: 8px; border-left: 4px solid #2b6cb0;'>• <strong>Variable à expliquer (Y) :</strong> souvent notée en ordonnée.</li> <li style='background: #ffffff; margin: 8px 0; padding: 10px; border-radius: 8px; border-left: 4px solid #2b6cb0;'>• <strong>Exemple :</strong> Taille et poids des élèves, âge et salaire, production et coût.</li> </ul> <div style='background: #e2e8f0; padding: 12px; border-radius: 10px; margin: 15px 0; text-align: center;'> <p>L'objectif est de déterminer si les deux variables sont liées et comment.</p> </div> </div> </div>",
    "texteParle": "Bonjour à tous. Aujourd'hui, nous abordons le chapitre sur les statistiques à deux caractères. Il s'agit d'étudier deux variables en même temps pour une même population. Par exemple, on peut étudier la taille et le poids des élèves, ou encore l'âge et le salaire des employés. L'objectif est de déterminer s'il existe une relation entre ces deux variables et de quantifier cette relation. Cela nous permettra de faire des prévisions et de mieux comprendre les phénomènes que nous observons.",
    "note": "Les statistiques à deux caractères permettent d'étudier les relations entre variables."
  },
  {
    "titre": "Le nuage de points",
    "contenu": "<div style='padding: 10px; background: #f0f4f8; border-radius: 15px; color: #1a202c;'> <div style='text-align: justify;'> <p><strong>Définition :</strong> Un <strong>nuage de points</strong> est une représentation graphique d'une série statistique à deux caractères. Chaque individu est représenté par un point dont les coordonnées sont les valeurs des deux variables.</p> <ul style='list-style: none; padding: 0;'> <li style='background: #ffffff; margin: 8px 0; padding: 10px; border-radius: 8px; border-left: 4px solid #2b6cb0;'>• <strong>Abscisse :</strong> valeur de la variable X.</li> <li style='background: #ffffff; margin: 8px 0; padding: 10px; border-radius: 8px; border-left: 4px solid #2b6cb0;'>• <strong>Ordonnée :</strong> valeur de la variable Y.</li> <li style='background: #ffffff; margin: 8px 0; padding: 10px; border-radius: 8px; border-left: 4px solid #2b6cb0;'>• <strong>Point moyen :</strong> \\( G(\\bar{x}, \\bar{y}) \\) où \\( \\bar{x} \\) et \\( \\bar{y} \\) sont les moyennes de X et Y.</li> </ul> <div style='background: #e2e8f0; padding: 12px; border-radius: 10px; margin: 15px 0; text-align: center;'> <p>Le nuage de points permet de visualiser la relation entre les deux variables.</p> </div> <div style='background: #ffffff; padding: 12px; border-radius: 10px; margin: 15px 0;'> <p><strong>Exemple :</strong> Pour des données de taille et poids, on place chaque élève par un point (taille, poids).</p> </div> </div> </div>",
    "texteParle": "Le nuage de points est la représentation graphique de nos données. On place sur un graphique un point pour chaque individu. En abscisse, on met la valeur de la première variable, et en ordonnée, la valeur de la seconde. Cela nous donne une visualisation directe de la relation entre les deux variables. On peut ainsi voir si les points forment une ligne, une courbe, ou s'ils sont dispersés. Le point moyen est le point dont les coordonnées sont les moyennes des deux variables. C'est un point important pour l'ajustement.",
    "note": "Le nuage de points est l'outil de base pour visualiser une corrélation."
  },
  {
    "titre": "Le point moyen",
    "contenu": "<div style='padding: 10px; background: #f0f4f8; border-radius: 15px; color: #1a202c;'> <div style='text-align: justify;'> <p><strong>Définition :</strong> Le <strong>point moyen</strong> du nuage est le point \\( G(\\bar{x}, \\bar{y}) \\) où :</p> <div class='math-block' style='background: #e2e8f0; padding: 15px; border-radius: 10px; margin: 15px 0; text-align: center;'> <div class='math' style='font-size: 1.1rem;'>$$ \\bar{x} = \\dfrac{1}{n} \\sum_{i=1}^{n} x_i \\quad \\text{et} \\quad \\bar{y} = \\dfrac{1}{n} \\sum_{i=1}^{n} y_i $$</div> </div> <ul style='list-style: none; padding: 0;'> <li style='background: #ffffff; margin: 8px 0; padding: 10px; border-radius: 8px; border-left: 4px solid #2b6cb0;'>• Il représente le <strong>centre de gravité</strong> du nuage.</li> <li style='background: #ffffff; margin: 8px 0; padding: 10px; border-radius: 8px; border-left: 4px solid #2b6cb0;'>• Il est toujours situé sur la droite d'ajustement.</li> <li style='background: #ffffff; margin: 8px 0; padding: 10px; border-radius: 8px; border-left: 4px solid #2b6cb0;'>• On le calcule à partir des données.</li> </ul> <div style='background: #ffffff; padding: 12px; border-radius: 10px; margin: 15px 0;'> <p><strong>Exemple :</strong> Si on a les points (1,2), (2,3), (3,4), le point moyen est \\( G(2,3) \\).</p> </div> </div> </div>",
    "texteParle": "Le point moyen, noté G, est le centre de gravité du nuage. Ses coordonnées sont les moyennes des deux variables. Il est très important car il est toujours situé sur la droite que l'on va chercher pour ajuster le nuage. Pour calculer ses coordonnées, on fait la moyenne de toutes les valeurs de la première variable, puis la moyenne de toutes les valeurs de la deuxième variable. C'est un point de référence qui nous servira pour tracer la droite d'ajustement.",
    "note": "Le point moyen est le centre de gravité du nuage de points."
  },
  {
    "titre": "Ajustement linéaire graphique",
    "contenu": "<div style='padding: 10px; background: #f0f4f8; border-radius: 15px; color: #1a202c;'> <div style='text-align: justify;'> <p><strong>Principe :</strong> L'ajustement linéaire consiste à tracer une droite qui <strong>passe au plus près</strong> des points du nuage.</p> <div style='background: #ffffff; padding: 15px; border-radius: 10px; margin: 15px 0; border-left: 4px solid #2b6cb0;'> <p><strong>Méthode graphique :</strong></p> <ul style='list-style: none; padding: 0;'> <li style='margin: 5px 0;'>1. Placer le point moyen \\( G \\).</li> <li style='margin: 5px 0;'>2. Tracer une droite qui passe par \\( G \\) et qui semble \"coller\" aux points.</li> <li style='margin: 5px 0;'>3. Déterminer l'équation de cette droite : \\( y = ax + b \\).</li> <li style='margin: 5px 0;'>4. Utiliser deux points de la droite pour calculer \\( a \\) et \\( b \\).</li> </ul> </div> <div style='background: #e2e8f0; padding: 12px; border-radius: 10px; margin: 15px 0;'> <p><strong>Avantage :</strong> Simple et rapide.</p> <p><strong>Inconvénient :</strong> Subjectif, car le tracé dépend de l'œil de l'observateur.</p> </div> </div> </div>",
    "texteParle": "L'ajustement linéaire graphique est la méthode la plus simple. Elle consiste à tracer une droite qui passe au plus près de tous les points du nuage. Pour cela, on commence par placer le point moyen, puis on trace à la règle une droite qui semble épouser au mieux la forme du nuage. Ensuite, on détermine l'équation de cette droite en utilisant deux points. Cette méthode est rapide mais elle est subjective, car deux personnes différentes peuvent tracer des droites légèrement différentes.",
    "note": "La méthode graphique est intuitive mais manque de précision."
  },
  {
    "titre": "Ajustement par la méthode de Mayer",
    "contenu": "<div style='padding: 10px; background: #f0f4f8; border-radius: 15px; color: #1a202c;'> <div style='text-align: justify;'> <p><strong>Principe :</strong> La méthode de Mayer consiste à partager le nuage en deux groupes de points et à tracer la droite qui relie les points moyens de ces deux groupes.</p> <div style='background: #ffffff; padding: 15px; border-radius: 10px; margin: 15px 0; border-left: 4px solid #2b6cb0;'> <p><strong>Étapes :</strong></p> <ul style='list-style: none; padding: 0;'> <li style='margin: 5px 0;'>1. <strong>Classer</strong> les points par ordre croissant des \\( x_i \\).</li> <li style='margin: 5px 0;'>2. <strong>Partager</strong> la série en deux groupes de même effectif (ou presque).</li> <li style='margin: 5px 0;'>3. <strong>Calculer</strong> les points moyens \\( G_1 \\) et \\( G_2 \\) de chaque groupe.</li> <li style='margin: 5px 0;'>4. <strong>Tracer</strong> la droite \\( (G_1 G_2) \\).</li> <li style='margin: 5px 0;'>5. <strong>Déterminer</strong> l'équation de cette droite.</li> </ul> </div> <div style='background: #e2e8f0; padding: 12px; border-radius: 10px; margin: 15px 0; text-align: center;'> <p>La méthode de Mayer est plus objective que la méthode graphique.</p> </div> </div> </div>",
    "texteParle": "La méthode de Mayer est une méthode plus rigoureuse pour ajuster un nuage de points. On commence par classer les points dans l'ordre croissant des x. Ensuite, on divise la série en deux groupes de taille égale. On calcule le point moyen de chaque groupe, ce qui donne deux points G1 et G2. La droite d'ajustement est alors la droite qui relie G1 et G2. Cette méthode est plus objective que la méthode graphique car elle ne dépend pas de la main de celui qui trace la droite.",
    "note": "La méthode de Mayer est plus précise que la méthode graphique."
  },
  {
    "titre": "Calcul des points moyens de Mayer",
    "contenu": "<div style='padding: 10px; background: #f0f4f8; border-radius: 15px; color: #1a202c;'> <div style='text-align: justify;'> <p><strong>Méthode de calcul :</strong></p> <div style='background: #ffffff; padding: 15px; border-radius: 10px; margin: 15px 0;'> <p><strong>Pour le premier groupe :</strong></p> <div class='math-block' style='background: #e2e8f0; padding: 15px; border-radius: 10px; margin: 10px 0; text-align: center;'> <div class='math' style='font-size: 1.1rem;'>$$ G_1(\\bar{x}_1, \\bar{y}_1) = \\left( \\dfrac{1}{n_1} \\sum_{i=1}^{n_1} x_i, \\dfrac{1}{n_1} \\sum_{i=1}^{n_1} y_i \\right) $$</div> </div> <p><strong>Pour le deuxième groupe :</strong></p> <div class='math-block' style='background: #e2e8f0; padding: 15px; border-radius: 10px; margin: 10px 0; text-align: center;'> <div class='math' style='font-size: 1.1rem;'>$$ G_2(\\bar{x}_2, \\bar{y}_2) = \\left( \\dfrac{1}{n_2} \\sum_{i=n_1+1}^{n} x_i, \\dfrac{1}{n_2} \\sum_{i=n_1+1}^{n} y_i \\right) $$</div> </div> </div> <div style='background: #e2e8f0; padding: 12px; border-radius: 10px; margin: 15px 0;'> <p><strong>Exemple :</strong> Avec 6 points, les 3 premiers pour G1, les 3 derniers pour G2.</p> </div> </div> </div>",
    "texteParle": "Voyons comment calculer les points moyens de Mayer. Pour chaque groupe, on calcule la moyenne des x et la moyenne des y. La formule est simple : on additionne toutes les valeurs du groupe, puis on divise par le nombre de points du groupe. Pour le premier groupe, on obtient G1, et pour le deuxième, G2. Par exemple, si on a 6 points, on prend les 3 premiers pour G1 et les 3 derniers pour G2. On obtient ainsi deux points qui nous permettront de tracer notre droite d'ajustement.",
    "note": "Les points moyens de Mayer sont calculés à partir des moyennes de chaque groupe."

  {
    "titre": "Équation de la droite de Mayer",
    "contenu": "<div style='padding: 10px; background: #f0f4f8; border-radius: 15px; color: #1a202c;'> <div style='text-align: justify;'> <p><strong>Détermination de l'équation :</strong></p> <div style='background: #ffffff; padding: 15px; border-radius: 10px; margin: 15px 0;'> <p>La droite de Mayer passe par \\( G_1 \\) et \\( G_2 \\). Son équation est de la forme :</p> <div class='math-block' style='background: #e2e8f0; padding: 15px; border-radius: 10px; margin: 10px 0; text-align: center;'> <div class='math' style='font-size: 1.1rem;'>$$ y = ax + b $$</div> </div> <p>Le coefficient directeur \\( a \\) est donné par :</p> <div class='math-block' style='background: #e2e8f0; padding: 15px; border-radius: 10px; margin: 10px 0; text-align: center;'> <div class='math' style='font-size: 1.1rem;'>$$ a = \\dfrac{\\bar{y}_2 - \\bar{y}_1}{\\bar{x}_2 - \\bar{x}_1} $$</div> </div> <p>Puis \\( b \\) est déterminé en utilisant \\( G_1 \\) ou \\( G_2 \\) :</p> <div class='math-block' style='background: #e2e8f0; padding: 15px; border-radius: 10px; margin: 10px 0; text-align: center;'> <div class='math' style='font-size: 1.1rem;'>$$ b = \\bar{y}_1 - a \\bar{x}_1 $$</div> </div> </div> <div style='background: #e2e8f0; padding: 12px; border-radius: 10px; margin: 15px 0;'> <p><strong>Remarque :</strong> Le point moyen général \\( G \\) est toujours sur cette droite.</p> </div> </div> </div>",
    "texteParle": "Une fois que nous avons les points G1 et G2, nous pouvons déterminer l'équation de la droite qui les relie. Cette droite a une équation de la forme y égal a x plus b. Le coefficient directeur a est la différence des y divisée par la différence des x. Ensuite, on calcule b en utilisant les coordonnées de G1. Cette droite est notre droite d'ajustement. Elle passe forcément par le point moyen général G, ce qui est une bonne vérification.",
    "note": "La droite de Mayer est la droite passant par les deux points moyens."
  },

    "texteParle": "L'interprétation des résultats est une étape cruciale. La droite d'ajustement nous donne une relation linéaire entre les deux variables. Le coefficient directeur a nous indique la tendance. Si a est positif, les deux variables évoluent dans le même sens. Si a est négatif, elles évoluent en sens inverse. Si a est proche de zéro, il n'y a pas de relation linéaire. On peut aussi utiliser cette droite pour faire des prévisions. Par exemple, pour une valeur donnée de X, on peut estimer la valeur de Y. Mais attention, ces prévisions ne sont valables que dans le domaine des données observées.",

    "texteParle": "Nous avons vu deux méthodes d'ajustement : la méthode graphique et la méthode de Mayer. La méthode graphique est rapide et simple, mais elle est subjective. La méthode de Mayer est plus objective car elle repose sur des calculs précis. Elle est donc plus fiable. En pratique, il est préférable d'utiliser la méthode de Mayer pour obtenir des résultats plus précis. Cependant, la méthode graphique peut être utile pour avoir une première idée de la tendance.",

    "texteParle": "Pour terminer ce chapitre, retenez les points essentiels. Le nuage de points est un outil de visualisation. Le point moyen est le centre de gravité. L'ajustement linéaire permet de modéliser la relation entre les deux variables. La méthode de Mayer est une méthode objective pour tracer la droite d'ajustement. Enfin, l'interprétation des résultats est cruciale pour faire des prévisions. Ces outils sont très utilisés en économie, en gestion et dans de nombreux autres domaines. N'hésitez pas à pratiquer avec des exercices pour bien maîtriser ces concepts.",

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentIndex = 0;
    let isSpeaking = false;
    let isPaused = false;
    let currentUtterance = null;
    let isLoading = false;
    let loadingTimeout = null;
    let isTransitioning = false;
    let speechSupported = true;
    let userInteracted = false;
    let isPlaying = false;
    let loadingCancelled = false;

    const total = slides.length;
    const synth = window.speechSynthesis;

    // Références jQuery
    const $title = $('#slideTitle');
    const $body = $('#slideBody');
    const $counter = $('#slideCounter');
    const $statusText = $('#statusText');
    const $statusBadge = $('#statusBadge');
    const $loading = $('#loadingOverlay');
    const $loadingText = $('#loadingText');
    const $loadingSub = $('#loadingSub');
    const $loadingTimeout = $('#loadingTimeout');
    const $loadingProgressBar = $('#loadingProgressBar');
    const $autoIndicator = $('#autoIndicator');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $replay = $('#replayBtn');
    const $play = $('#playBtn');
    const $cancelLoading = $('#cancelLoadingBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function setStatus(text, type) {
        $statusText.text(text);
        $statusBadge.removeClass('idle speaking error paused waiting loading');
        if (type === 'speaking') $statusBadge.addClass('speaking');
        else if (type === 'error') $statusBadge.addClass('error');
        else if (type === 'paused') $statusBadge.addClass('paused');
        else if (type === 'waiting') $statusBadge.addClass('waiting');
        else if (type === 'loading') $statusBadge.addClass('loading');
        else $statusBadge.addClass('idle');
    }

    function updatePlayButton() {
        if (isPlaying) {
            $play.addClass('playing');
            $play.find('.btn-icon').text('⏸');
            $play.find('.btn-label').text('Pause');
        } else {
            $play.removeClass('playing');
            $play.find('.btn-icon').text('▶');
            $play.find('.btn-label').text('Play');
        }
    }

    function showLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        
        loadingCancelled = false;
        isLoading = true;
        
        // Réinitialiser la barre de progression
        $loadingProgressBar.css('animation', 'none');
        $loadingProgressBar.css('width', '0%');
        // Forcer un reflow
        $loadingProgressBar[0].offsetHeight;
        $loadingProgressBar.css('animation', 'loadingProgress 30s ease-out forwards');
        
        $loadingText.text('Préparation vocale...');
        $loadingSub.text('Synthèse en cours');
        $loadingTimeout.text('⏱️ 30 secondes maximum');
        $loading.fadeIn(300);
        setStatus("⏳ Chargement...", 'loading');
        
        // 🔥 TIMEOUT DE 30 SECONDES
        loadingTimeout = setTimeout(() => {
            if (isLoading && !loadingCancelled) {
                hideLoading();
                setStatus("⚠️ Délai dépassé (30s)", 'error');
                isPlaying = false;
                updatePlayButton();
                $loadingSub.text('La synthèse vocale a pris trop de temps');
                $loadingTimeout.text('❌ Délai dépassé');
            }
        }, 30000);
    }

    function hideLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        isLoading = false;
        loadingCancelled = false;
        $loading.fadeOut(300);
        // Ne pas changer le statut si on est en train de parler
        if (!isSpeaking && !isPlaying) {
            setStatus("⏸ Lecture arrêtée", 'paused');
        }
    }

    function cancelLoading() {
        loadingCancelled = true;
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        hideLoading();
        stopSpeaking();
        setStatus("⏸ Annulé", 'paused');
        isPlaying = false;
        updatePlayButton();
        $loadingText.text('Annulé par l\'utilisateur');
        $loadingSub.text('Vous pouvez réessayer');
        $loadingTimeout.text('✕ Annulation');
    }

    // Arrêter la parole proprement
    function stopSpeaking() {
        try {
            if (synth && (synth.speaking || synth.pending)) {
                synth.cancel();
            }
        } catch(e) {
            console.warn('Erreur stopSpeaking:', e);
        }
        if (currentUtterance) {
            try {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance.onstart = null;
            } catch(e) {}
            currentUtterance = null;
        }
        isSpeaking = false;
        isPlaying = false;
        updatePlayButton();
    }

    // Mettre en pause la parole
    function pauseSpeaking() {
        try {
            if (synth && synth.speaking) {
                synth.pause();
                isPaused = true;
                isPlaying = false;
                setStatus("⏸ Lecture en pause", 'paused');
                updatePlayButton();
            }
        } catch(e) {
            console.warn('Erreur pauseSpeaking:', e);
            stopSpeaking();
        }
    }

    // Reprendre la parole
    function resumeSpeaking() {
        try {
            if (synth && synth.paused) {
                synth.resume();
                isPaused = false;
                isPlaying = true;
                setStatus("🔊 Lecture en cours", 'speaking');
                updatePlayButton();
            } else if (!isSpeaking && !synth.speaking && !synth.pending) {
                speakSlide(currentIndex);
            }
        } catch(e) {
            console.warn('Erreur resumeSpeaking:', e);
            speakSlide(currentIndex);
        }
    }

    function renderSlide(index) {
        const slide = slides[index];
        $title.text(slide.titre);

        let html = '';
        html += `<div class="content-card">${slide.contenu}</div>`;
        if (slide.note) {
            html += `<div class="note-box">${slide.note}</div>`;
        }
        $body.html(html);
        $counter.text(`${index+1} / ${total}`);

        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
        }
    }

    // ================================================================
    // LECTURE VOCALE
    // ================================================================
    function speakSlide(index) {
        return new Promise((resolve) => {
            const slide = slides[index];
            const text = slide.texteParle;
            
            if (!text || text.trim() === '' || !speechSupported) {
                resolve();
                return;
            }

            if (!window.speechSynthesis) {
                setStatus("❌ Synthèse vocale non supportée", 'error');
                speechSupported = false;
                resolve();
                return;
            }

            // Arrêter toute lecture en cours
            stopSpeaking();
            
            // Réinitialiser l'état de pause
            isPaused = false;
            
            showLoading();
            setStatus("Initialisation...", 'loading');

            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.92;
                utterance.pitch = 1.05;
                utterance.volume = 1;

                let isFinished = false;
                let errorHandled = false;

                utterance.onstart = function() {
                    if (loadingCancelled) {
                        stopSpeaking();
                        resolve();
                        return;
                    }
                    hideLoading();
                    isSpeaking = true;
                    isPlaying = true;
                    isPaused = false;
                    setStatus("🔊 Lecture en cours", 'speaking');
                    updatePlayButton();
                };

                utterance.onend = function() {
                    if (isFinished) return;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    setStatus("✅ Terminé", 'idle');
                    hideLoading();
                    updatePlayButton();
                    resolve();
                };

                utterance.onerror = function(e) {
                    if (isFinished || errorHandled) return;
                    errorHandled = true;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    hideLoading();
                    updatePlayButton();
                    
                    if (e.error === 'not-allowed') {
                        setStatus("⚠️ Permission refusée", 'error');
                    } else if (e.error === 'synthesis-unavailable') {
                        setStatus("⚠️ Synthèse indisponible", 'error');
                    } else if (e.error === 'canceled') {
                        setStatus("⏸ Annulé", 'paused');
                    } else {
                        setStatus("❌ Erreur audio: " + (e.error || 'inconnue'), 'error');
                    }
                    
                    resolve();
                };

                // Gestion du chargement des voix
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = function() {
                        if (!loadingCancelled) {
                            try {
                                synth.speak(utterance);
                            } catch(err) {
                                // Silencieux
                            }
                        }
                        synth.onvoiceschanged = null;
                    };
                }

                currentUtterance = utterance;
                
                if (!loadingCancelled) {
                    try {
                        synth.speak(utterance);
                    } catch(err) {
                        setTimeout(() => {
                            if (!loadingCancelled) {
                                try {
                                    synth.speak(utterance);
                                } catch(e) {
                                    setStatus("❌ Erreur de lecture", 'error');
                                    isPlaying = false;
                                    updatePlayButton();
                                    hideLoading();
                                    resolve();
                                }
                            } else {
                                resolve();
                            }
                        }, 100);
                    }
                } else {
                    resolve();
                }

            } catch(err) {
                hideLoading();
                setStatus("❌ Erreur générale", 'error');
                isPlaying = false;
                updatePlayButton();
                console.error('Erreur speakSlide:', err);
                resolve();
            }
        });
    }

    // ================================================================
    // NAVIGATION
    // ================================================================
    async function goToSlide(index) {
        if (isTransitioning) return;
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        
        // Si on est en train de lire, on met en pause avant de naviguer
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        // Arrêter complètement la lecture
        stopSpeaking();
        
        await new Promise(r => setTimeout(r, 50));
        
        if (index === currentIndex) {
            setStatus("📄 Slide actuel", 'idle');
            return;
        }

        isTransitioning = true;
        currentIndex = index;
        renderSlide(index);
        
        // Réinitialiser l'état de lecture
        isPlaying = false;
        updatePlayButton();
        setStatus("⏸ Lecture arrêtée", 'paused');

        await new Promise(r => setTimeout(r, 150));
        isTransitioning = false;
    }

    async function goToNext() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex + 1 < total) {
            await goToSlide(currentIndex + 1);
        } else {
            setStatus("🏁 Dernier slide", 'idle');
        }
    }

    async function goToPrev() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex - 1 >= 0) {
            await goToSlide(currentIndex - 1);
        } else {
            setStatus("🔁 Premier slide", 'idle');
        }
    }

    // ================================================================
    // GESTION PLAY/PAUSE
    // ================================================================
    function togglePlay() {
        if (!userInteracted) {
            userInteracted = true;
        }

        // Si le chargement est en cours, on l'annule
        if (isLoading) {
            cancelLoading();
            return;
        }

        // Si le synthétiseur est en pause, on reprend
        if (synth && synth.paused) {
            resumeSpeaking();
            return;
        }

        // Si la lecture est en cours, on met en pause
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
            return;
        }

        // Sinon, on démarre la lecture du slide courant
        if (!isSpeaking && !isPlaying) {
            stopSpeaking();
            speakSlide(currentIndex);
        }
    }

    // ================================================================
    // INIT
    // ================================================================
    async function init() {
        // Vérifier la compatibilité
        if (!window.speechSynthesis) {
            setStatus("❌ Synthèse vocale non supportée", 'error');
            speechSupported = false;
        }

        // Précharger les voix
        try {
            if (synth.getVoices) {
                synth.getVoices();
                setTimeout(() => {
                    try {
                        synth.getVoices();
                    } catch(e) {}
                }, 200);
            }
        } catch(e) {
            console.warn('Erreur chargement voix:', e);
        }

        // Afficher le premier slide
        renderSlide(0);
        $counter.text(`1 / ${total}`);
        
        // État initial
        setStatus("⏸ Appuie sur Play", 'paused');
        updatePlayButton();
        $autoIndicator.text('⏸ Lecture manuelle');

        // ================================================================
        // ÉVÉNEMENTS
        // ================================================================
        
        // Bouton Play/Pause
        $play.on('click', function() {
            togglePlay();
        });

        // Bouton Annuler le chargement
        $cancelLoading.on('click', function() {
            cancelLoading();
        });

        // Navigation
        $prev.on('click', function() {
            // Si chargement en cours, on annule
            if (isLoading) cancelLoading();
            goToPrev();
        });

        $next.on('click', function() {
            if (isLoading) cancelLoading();
            goToNext();
        });

        // Replay - relire le slide courant
        $replay.on('click', function() {
            if (isLoading) cancelLoading();
            stopSpeaking();
            setTimeout(() => {
                speakSlide(currentIndex);
            }, 100);
        });

        // Support du clavier (espace pour play/pause)
        $(document).on('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });

        // Nettoyage
        $(window).on('beforeunload', function() {
            try {
                if (synth.speaking) synth.cancel();
            } catch(e) {}
            hideLoading();
        });

        // Gérer les cas où la synthèse se termine de manière inattendue
        setInterval(() => {
            if (isPlaying && !synth.speaking && !synth.pending && !isPaused && !isLoading) {
                isPlaying = false;
                updatePlayButton();
                setStatus("⏸ Lecture arrêtée", 'paused');
            }
        }, 1000);
    }

    init();
});



    // ================================================================
    // GESTION DU THÈME JOUR/NUIT
    // ================================================================
    let isDarkMode = false;

    function toggleTheme() {
        isDarkMode = !isDarkMode;
        const body = document.body;
        const appContainer = document.querySelector('.app-container');
        const header = document.querySelector('.slide-header');
        const footer = document.querySelector('.slide-footer');
        const contentCards = document.querySelectorAll('.content-card');
        const noteBoxes = document.querySelectorAll('.note-box');
        const mathBlocks = document.querySelectorAll('.math-block');
        const buttons = document.querySelectorAll('.btn');
        const statusBadge = document.querySelector('.status-badge');
        const slideCounter = document.querySelector('.slide-counter');
        const autoIndicator = document.querySelector('.auto-indicator');
        const themeBtn = document.getElementById('themeToggle');

        if (isDarkMode) {
            // Mode nuit
            body.style.background = '#0b1120';
            body.style.color = '#f1f5f9';
            appContainer.style.background = 'linear-gradient(145deg, #0f172a 0%, #1e293b 100%)';
            header.style.background = 'rgba(15, 23, 42, 0.85)';
            footer.style.background = 'rgba(15, 23, 42, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.05)';
                card.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.08)';
                note.style.color = '#cbd5e1';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.25)';
                block.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#e2e8f0';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.12)';
                statusBadge.style.color = '#93bbfc';
            }
            if (slideCounter) {
                slideCounter.style.color = '#94a3b8';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#64748b';
            }
            if (themeBtn) {
                themeBtn.textContent = '☀️';
                themeBtn.title = 'Passer en mode jour';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#e2e8f0';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#e2e8f0';
                }
            });
        } else {
            // Mode jour (par défaut)
            body.style.background = '#f0f4f8';
            body.style.color = '#1a202c';
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
            header.style.background = 'rgba(255, 255, 255, 0.85)';
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.8)';
                card.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.12)';
                note.style.color = '#2c3e50';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.05)';
                block.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#2d3748';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
                statusBadge.style.color = '#2b6cb0';
            }
            if (slideCounter) {
                slideCounter.style.color = '#4a5568';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#718096';
            }
            if (themeBtn) {
                themeBtn.textContent = '🌓';
                themeBtn.title = 'Passer en mode nuit';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#2c3e50';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#2d3748';
                }
            });
        }
    }

    document.addEventListener('DOMContentLoaded', function() {

        document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
