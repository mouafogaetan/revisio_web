<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
 "matiere": "Mathématiques",
 "classe": "Tle technique",
 "sequence": "Séquence 4",
 "anneeScolaire": "2025-2026",
 "exercices": [
   {
     "titre": "Exercice 1 : Statistiques - Ajustement linéaire par la méthode de Mayer",
     "points": "4 pts",
     "enonce": "<p>Une entreprise de transport au Cameroun a relevé le nombre de trajets (en centaines) effectués par mois en fonction du prix du carburant (en francs CFA) sur une période de 6 mois.</p><table style='width:100%; border-collapse:collapse; margin:10px 0;'><tr style='background:#1a237e; color:white;'><th style='padding:8px; border:1px solid #004d40;'>Prix (x<sub>i</sub>)</th><td style='padding:8px; border:1px solid #004d40;'>600</td><td style='padding:8px; border:1px solid #004d40;'>620</td><td style='padding:8px; border:1px solid #004d40;'>640</td><td style='padding:8px; border:1px solid #004d40;'>660</td><td style='padding:8px; border:1px solid #004d40;'>680</td><td style='padding:8px; border:1px solid #004d40;'>700</td></tr><tr style='background:#e3f2fd;'><th style='padding:8px; border:1px solid #004d40;'>Trajets (y<sub>i</sub>)</th><td style='padding:8px; border:1px solid #004d40;'>45</td><td style='padding:8px; border:1px solid #004d40;'>42</td><td style='padding:8px; border:1px solid #004d40;'>40</td><td style='padding:8px; border:1px solid #004d40;'>38</td><td style='padding:8px; border:1px solid #004d40;'>35</td><td style='padding:8px; border:1px solid #004d40;'>32</td></tr></table>",
     "questions": [
       {
         "question": "1) Représenter le nuage de points \\( M_i(x_i; y_i) \\) dans un repère orthogonal (1 cm pour 10 unités en abscisse et 1 cm pour 5 unités en ordonnée).",
         "reponse": "Construction graphique du nuage de points."
       },
       {
         "question": "2) Déterminer les coordonnées des points moyens \\( G_1 \\) et \\( G_2 \\) des deux sous-groupes (3 premiers mois et 3 derniers mois) par la méthode de Mayer.",
         "reponse": "G1 (630; 42.33) ≈ (630; 42.3) et G2 (680; 35) en arrondissant."
       },
       {
         "question": "3) Calculer l'équation de la droite de Mayer \\( y = ax + b \\).",
         "reponse": "La droite a pour coefficient directeur \\( a = \\frac{35 - 42.3}{680 - 630} = \\frac{-7.3}{50} = -0.146 \\). En prenant G1 : \\( 42.3 = -0.146 \\times 630 + b \\), donc \\( b \\approx 134.3 \\). L'équation est \\( y = -0.146x + 134.3 \\)."
       },
       {
         "question": "4) En utilisant cet ajustement, estimer le nombre de trajets (en centaines) si le prix du carburant est de 720 FCFA.",
         "reponse": "En remplaçant \\( x = 720 \\), \\( y = -0.146 \\times 720 + 134.3 \\approx 29.2 \\). Soit environ 2920 trajets."
       },
       {
         "question": "5) Interpréter le coefficient directeur de la droite dans le contexte de l'exercice.",
         "reponse": "Le coefficient directeur est négatif, ce qui indique une corrélation négative entre le prix du carburant et le nombre de trajets. Lorsque le prix augmente, le nombre de trajets diminue."
       }
     ]
   },
   {
     "titre": "Exercice 2 : Fonctions - Étude de fonction et calcul d'aire",
     "points": "6 pts",
     "enonce": "<p>Soit la fonction \\( f(x) = \\frac{2x^2 + 3x + 1}{x + 1} \\) définie sur \\( \\mathbb{R} \\setminus \\{-1\\} \\).</p>",
     "questions": [
       {
         "question": "1) Déterminer l'ensemble de définition de \\( f \\).",
         "reponse": "Ensemble de définition : \\( D_f = \\mathbb{R} \\setminus \\{-1\\} \\)."
       },
       {
         "question": "2) Montrer que \\( f(x) = 2x + 1 + \\frac{?}{x+1} \\). (Déterminer le terme manquant).",
         "reponse": "En effectuant la division euclidienne de \\( 2x^2+3x+1 \\) par \\( x+1 \\), on obtient \\( f(x) = 2x + 1 + \\frac{0}{x+1} \\). En réalité, \\( 2x^2+3x+1 = (x+1)(2x+1) \\), donc la fraction est nulle."
       },
       {
         "question": "3) Déterminer les limites de \\( f(x) \\) aux bornes de son ensemble de définition.",
         "reponse": "En \\( +\\infty \\) et \\( -\\infty \\), la fonction se comporte comme \\( 2x \\) donc les limites sont respectivement \\( +\\infty \\) et \\( -\\infty \\). En \\( x \\to -1^+ \\) et \\( x \\to -1^- \\), le numérateur vaut \\( 2 -3 +1 = 0 \\), donc la fonction est prolongeable par continuité."
       },
       {
         "question": "4) Calculer la dérivée \\( f'(x) \\) et étudier les variations de \\( f \\) sur son ensemble de définition.",
         "reponse": "Après simplification, \\( f(x) = 2x+1 \\), donc \\( f'(x) = 2 \\). La fonction est strictement croissante sur \\( \\mathbb{R} \\setminus \\{-1\\} \\)."
       },
       {
         "question": "5) Donner les coordonnées du point d'intersection de la courbe avec l'axe des ordonnées et le point où elle coupe l'axe des abscisses.",
         "reponse": "Axe des ordonnées (x=0) : \\( f(0) = 1 \\), soit (0;1). Axe des abscisses (f(x)=0) : \\( 2x+1=0 \\Rightarrow x = -0.5 \\)."
       },
       {
         "question": "6) A l'aide de l'intégrale, calculer l'aire comprise entre la courbe de \\( f \\), l'axe des abscisses et les droites d'équations \\( x=0 \\) et \\( x=2 \\).",
         "reponse": "L'aire est \\( A = \\int_0^2 f(x) dx = \\int_0^2 (2x+1) dx = [x^2+x]_0^2 = 6 \\) unités d'aire."
       }
     ]
   },
   {
     "titre": "Exercice 3 : Probabilités - Loi binomiale",
     "points": "5 pts",
     "enonce": "<p>Dans une entreprise de Yaoundé, 60% des employés possèdent un véhicule personnel. On interroge 5 employés au hasard. On suppose que le choix des employés est indépendant.</p>",
     "questions": [
       {
         "question": "1) Justifier que la variable aléatoire \\( X \\) comptant le nombre d'employés possédant un véhicule suit une loi binomiale. Préciser ses paramètres.",
         "reponse": "Il s'agit d'un schéma de Bernoulli de paramètres \\( n=5 \\) et \\( p=0.6 \\). Ainsi, \\( X \\sim \\mathcal{B}(5; 0.6) \\)."
       },
       {
         "question": "2) Calculer la probabilité qu'exactement 3 employés possèdent un véhicule.",
         "reponse": "\\[ P(X=3) = \\binom{5}{3} (0.6)^3 (0.4)^2 = 10 \\times 0.216 \\times 0.16 = 0.3456 \\]"
       },
       {
         "question": "3) Déterminer la probabilité qu'au moins 4 employés possèdent un véhicule.",
         "reponse": "\\[ P(X \\ge 4) = P(X=4) + P(X=5) = \\binom{5}{4}(0.6)^4(0.4)^1 + \\binom{5}{5}(0.6)^5(0.4)^0 \\] \\[ = 5 \\times 0.1296 \\times 0.4 + 1 \\times 0.07776 \\approx 0.2592 + 0.07776 = 0.33696 \\]"
       },
       {
         "question": "4) Calculer l'espérance mathématique de \\( X \\) et interpréter le résultat.",
         "reponse": "L'espérance est \\( E(X) = n \\times p = 5 \\times 0.6 = 3 \\). En moyenne, sur 5 employés interrogés, 3 possèdent un véhicule."
       },
       {
         "question": "5) Déterminer la variance et l'écart-type de \\( X \\).",
         "reponse": "La variance est \\( V(X) = n \\times p \\times (1-p) = 5 \\times 0.6 \\times 0.4 = 1.2 \\). L'écart-type est \\( \\sigma(X) = \\sqrt{1.2} \\approx 1.095 \\)."
       }
     ]
   },
   {
     "titre": "Exercice 4 : Logarithme et Exponentielle",
     "points": "5 pts",
     "enonce": "<p>Résoudre dans \\( \\mathbb{R} \\) les équations et inéquations suivantes :</p>",
     "questions": [
       {
         "question": "1) Résoudre l'équation : \\( \\ln(x-2) + \\ln(x+2) = \\ln(5) \\).",
         "reponse": "Domaine de définition : \\( x > 2 \\). \\( \\ln((x-2)(x+2)) = \\ln(5) \\Rightarrow x^2 - 4 = 5 \\Rightarrow x^2 = 9 \\Rightarrow x = \\pm 3 \\). Seule \\( x=3 \\) appartient au domaine de définition."
       },
       {
         "question": "2) Résoudre l'inéquation : \\( e^{2x+1} \\ge e^{3x-2} \\).",
         "reponse": "Puisque la fonction exponentielle est strictement croissante : \\( 2x+1 \\ge 3x-2 \\Rightarrow 1+2 \\ge 3x-2x \\Rightarrow 3 \\ge x \\Rightarrow x \\le 3 \\)."
       },
       {
         "question": "3) Résoudre l'équation : \\( e^{2x} - 5e^x + 6 = 0 \\).",
         "reponse": "En posant \\( t = e^x > 0 \\), l'équation devient \\( t^2 - 5t + 6 = 0 \\Rightarrow (t-2)(t-3) = 0 \\). D'où \\( t=2 \\Rightarrow x = \\ln(2) \\) et \\( t=3 \\Rightarrow x = \\ln(3) \\)."
       }
     ]
   }
 ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
