<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Mathématiques CG",
  "classe": "Tle technique",
  "sequence": "Séquence 2",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Fonctions logarithme et exponentielle",
      "points": "4 pts",
      "enonce": "<div style='background-color: #f8f9fa; padding: 15px; border-radius: 8px; border-left: 4px solid #2c3e50; color: #2c3e50; margin-bottom: 15px;'><strong>Situation-problème :</strong> Une entreprise de services au Cameroun modélise l'évolution de son chiffre d'affaires (en millions de FCFA) par la fonction \( f(x) = \ln(x) + 2 \), où \( x \) représente le nombre d'années depuis sa création. </div>",
      "questions": [
        {
          "question": "<div style='margin-bottom: 10px; color: #1a1a1a;'><strong>1)</strong> Déterminez l'ensemble de définition de la fonction \( f \).</div>",
          "reponse": "<div style='background-color: #d4edda; padding: 10px; border-radius: 5px; color: #155724;'>La fonction logarithme népérien est définie pour \( x > 0 \). Donc \( D_f = ]0; +\infty[ \).</div>"
        },
        {
          "question": "<div style='margin-bottom: 10px; color: #1a1a1a;'><strong>2)</strong> Calculez le chiffre d'affaires prévu par le modèle pour \( x = e^2 \).</div>",
          "reponse": "<div style='background-color: #d4edda; padding: 10px; border-radius: 5px; color: #155724;'>\( f(e^2) = \ln(e^2) + 2 = 2 + 2 = 4 \) millions de FCFA.</div>"
        },
        {
          "question": "<div style='margin-bottom: 10px; color: #1a1a1a;'><strong>3)</strong> Déterminez la limite de \( f(x) \) lorsque \( x \) tend vers \( +\infty \).</div>",
          "reponse": "<div style='background-color: #d4edda; padding: 10px; border-radius: 5px; color: #155724;'>\( \lim_{x \to +\infty} \ln(x) = +\infty \), donc \( \lim_{x \to +\infty} f(x) = +\infty \).</div>"
        },
        {
          "question": "<div style='margin-bottom: 10px; color: #1a1a1a;'><strong>4)</strong> Calculez la dérivée de \( f \) et donnez son signe.</div>",
          "reponse": "<div style='background-color: #d4edda; padding: 10px; border-radius: 5px; color: #155724;'>\( f'(x) = \frac{1}{x} \). Sur \( ]0; +\infty[ \), \( \frac{1}{x} > 0 \). La fonction est donc strictement croissante sur son intervalle de définition.</div>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Équations et inéquations logarithmiques",
      "points": "4 pts",
      "enonce": "<div style='background-color: #f8f9fa; padding: 15px; border-radius: 8px; border-left: 4px solid #2c3e50; color: #2c3e50; margin-bottom: 15px;'><strong>Situation-problème :</strong> Un investisseur souhaite savoir dans combien d'années la valeur de son placement, modélisée par \( g(x) = e^{0.05x} \), atteindra le double de sa valeur initiale.</div>",
      "questions": [
        {
          "question": "<div style='margin-bottom: 10px; color: #1a1a1a;'><strong>1)</strong> Résolvez l'équation \( e^{0.05x} = 2 \) dans \( \mathbb{R} \).</div>",
          "reponse": "<div style='background-color: #d4edda; padding: 10px; border-radius: 5px; color: #155724;'>\( e^{0.05x} = 2 \iff 0.05x = \ln(2) \iff x = \frac{\ln(2)}{0.05} \). \( x \approx 13.86 \) années.</div>"
        },
        {
          "question": "<div style='margin-bottom: 10px; color: #1a1a1a;'><strong>2)</strong> Résolvez l'inéquation \( e^{0.05x} > 3 \).</div>",
          "reponse": "<div style='background-color: #d4edda; padding: 10px; border-radius: 5px; color: #155724;'>\( e^{0.05x} > 3 \iff 0.05x > \ln(3) \iff x > \frac{\ln(3)}{0.05} \approx 21.97 \).</div>"
        },
        {
          "question": "<div style='margin-bottom: 10px; color: #1a1a1a;'><strong>3)</strong> Résolvez l'équation \( \ln(x) = 3 \).</div>",
          "reponse": "<div style='background-color: #d4edda; padding: 10px; border-radius: 5px; color: #155724;'>\( \ln(x) = 3 \iff x = e^3 \).</div>"
        },
        {
          "question": "<div style='margin-bottom: 10px; color: #1a1a1a;'><strong>4)</strong> Résolvez l'inéquation \( \ln(x) \leq 0 \) dans \( ]0; +\infty[ \).</div>",
          "reponse": "<div style='background-color: #d4edda; padding: 10px; border-radius: 5px; color: #155724;'>\( \ln(x) \leq 0 \iff \ln(x) \leq \ln(1) \iff x \leq 1 \). Donc \( x \in ]0; 1] \).</div>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Statistiques à deux caractères et ajustement",
      "points": "6 pts",
      "enonce": "<div style='background-color: #f8f9fa; padding: 15px; border-radius: 8px; border-left: 4px solid #2c3e50; color: #2c3e50; margin-bottom: 15px;'><strong>Situation-problème :</strong> On a relevé pour une entreprise le nombre de clients et le chiffre d'affaires mensuel sur plusieurs mois :</div><table style='width: 100%; border-collapse: collapse; font-size: 0.9em; background-color: #f8f9fa; color: #1a1a1a;'><tr style='background-color: #2c3e50; color: white;'><th style='padding: 8px; border: 1px solid #ddd;'>Nombre de clients (x)</th><th style='padding: 8px; border: 1px solid #ddd;'>18</th><th style='padding: 8px; border: 1px solid #ddd;'>20</th><th style='padding: 8px; border: 1px solid #ddd;'>22</th><th style='padding: 8px; border: 1px solid #ddd;'>24</th><th style='padding: 8px; border: 1px solid #ddd;'>26</th><th style='padding: 8px; border: 1px solid #ddd;'>28</th></tr><tr><td style='padding: 8px; border: 1px solid #ddd; font-weight: bold;'>Chiffre d'affaires (y)</td><td style='padding: 8px; border: 1px solid #ddd;'>120</td><td style='padding: 8px; border: 1px solid #ddd;'>125</td><td style='padding: 8px; border: 1px solid #ddd;'>130</td><td style='padding: 8px; border: 1px solid #ddd;'>140</td><td style='padding: 8px; border: 1px solid #ddd;'>145</td><td style='padding: 8px; border: 1px solid #ddd;'>150</td></tr></table>",
      "questions": [
        {
          "question": "<div style='margin-bottom: 10px; color: #1a1a1a;'><strong>1)</strong> Représentez le nuage de points de la série statistique double.</div>",
          "reponse": "<div style='background-color: #d4edda; padding: 10px; border-radius: 5px; color: #155724;'>Le nuage de points est formé par les couples (18;120), (20;125), (22;130), (24;140), (26;145) et (28;150). On les place dans un repère orthogonal.</div>"
        },
        {
          "question": "<div style='margin-bottom: 10px; color: #1a1a1a;'><strong>2)</strong> Calculez les coordonnées du point moyen \( G \).</div>",
          "reponse": "<div style='background-color: #d4edda; padding: 10px; border-radius: 5px; color: #155724;'>\( \bar{x} = \frac{18+20+22+24+26+28}{6} = \frac{138}{6} = 23 \). <br>\( \bar{y} = \frac{120+125+130+140+145+150}{6} = \frac{810}{6} = 135 \). <br>Les coordonnées du point moyen sont \( G(23 ; 135) \).</div>"
        },
        {
          "question": "<div style='margin-bottom: 10px; color: #1a1a1a;'><strong>3)</strong> Par la méthode de Mayer, déterminez la droite d'ajustement pour cette série.</div>",
          "reponse": "<div style='background-color: #d4edda; padding: 10px; border-radius: 5px; color: #155724;'>On partage la série en deux groupes égaux : <br>Groupe 1 : (18;120), (20;125), (22;130). Points moyen \( G_1 = (20 ; 125) \). <br>Groupe 2 : (24;140), (26;145), (28;150). Points moyen \( G_2 = (26 ; 145) \). <br>La droite de Mayer passe par \( G_1 \) et \( G_2 \). Son coefficient directeur est : \( a = \frac{145-125}{26-20} = \frac{20}{6} = \frac{10}{3} \approx 3.33 \). <br>L'équation est de la forme \( y = \frac{10}{3}x + b \). En utilisant \( G_1 \) : \( 125 = \frac{10}{3} \times 20 + b \iff 125 = \frac{200}{3} + b \iff b = \frac{375-200}{3} = \frac{175}{3} \approx 58.33 \). <br>Donc \( y = \frac{10}{3}x + \frac{175}{3} \).</div>"
        },
        {
          "question": "<div style='margin-bottom: 10px; color: #1a1a1a;'><strong>4)</strong> Estimez le chiffre d'affaires pour un nombre de clients de 30.</div>",
          "reponse": "<div style='background-color: #d4edda; padding: 10px; border-radius: 5px; color: #155724;'>En utilisant la droite d'ajustement : \( y = \frac{10}{3} \times 30 + \frac{175}{3} = 100 + \frac{175}{3} = \frac{475}{3} \approx 158.33 \). <br>Le chiffre d'affaires estimé est d'environ 158.33 milliers de FCFA.</div>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Dénombrement, Binôme de Newton et Probabilités",
      "points": "6 pts",
      "enonce": "<div style='background-color: #f8f9fa; padding: 15px; border-radius: 8px; border-left: 4px solid #2c3e50; color: #2c3e50; margin-bottom: 15px;'><strong>Situation-problème :</strong> Un centre de formation en informatique au Cameroun organise un tirage au sort pour offrir des bourses à ses étudiants. Le tirage s'effectue parmi un groupe de 10 étudiants, composé de 6 garçons et 4 filles.</div>",
      "questions": [
        {
          "question": "<div style='margin-bottom: 10px; color: #1a1a1a;'><strong>1)</strong> On constitue un comité de 3 étudiants tirés au sort parmi les 10. Dénombrez le nombre de comités possibles.</div>",
          "reponse": "<div style='background-color: #d4edda; padding: 10px; border-radius: 5px; color: #155724;'>Il s'agit d'une combinaison de 3 éléments parmi 10 : \( C_{10}^3 = \frac{10!}{3! \times 7!} = \frac{10 \times 9 \times 8}{3 \times 2 \times 1} = 120 \) comités possibles.</div>"
        },
        {
          "question": "<div style='margin-bottom: 10px; color: #1a1a1a;'><strong>2)</strong> Développez le binôme \( (a + b)^4 \) en utilisant le triangle de Pascal ou la formule du binôme de Newton.</div>",
          "reponse": "<div style='background-color: #d4edda; padding: 10px; border-radius: 5px; color: #155724;'>\( (a+b)^4 = \sum_{k=0}^{4} \binom{4}{k} a^{4-k}b^k = a^4 + 4a^3b + 6a^2b^2 + 4ab^3 + b^4 \).</div>"
        },
        {
          "question": "<div style='margin-bottom: 10px; color: #1a1a1a;'><strong>3)</strong> On tire une combinaison de 3 étudiants au hasard. Quelle est la probabilité d'obtenir un comité exclusivement composé de filles ?</div>",
          "reponse": "<div style='background-color: #d4edda; padding: 10px; border-radius: 5px; color: #155724;'>Nombre de comités de 3 filles parmi 4 : \( C_4^3 = 4 \). <br>Probabilité : \( P = \frac{C_4^3}{C_{10}^3} = \frac{4}{120} = \frac{1}{30} \).</div>"
        },
        {
          "question": "<div style='margin-bottom: 10px; color: #1a1a1a;'><strong>4)</strong> Quelle est la probabilité d'obtenir un comité contenant au moins deux garçons ?</div>",
          "reponse": "<div style='background-color: #d4edda; padding: 10px; border-radius: 5px; color: #155724;'>\( P(\text{au moins 2 garçons}) = P(2G,1F) + P(3G,0F) \). <br>Nombre de comités de 2 garçons (parmi 6) et 1 fille (parmi 4) : \( C_6^2 \times C_4^1 = 15 \times 4 = 60 \). <br>Nombre de comités de 3 garçons (parmi 6) : \( C_6^3 = 20 \). <br>Nombre de cas favorables : \( 60 + 20 = 80 \). <br>Probabilité : \( P = \frac{80}{120} = \frac{2}{3} \).</div>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
