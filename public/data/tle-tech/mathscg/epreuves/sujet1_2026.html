<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "maths CG",
  "classe": "Tle technique",
  "sequence": "Séquence 1",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Calcul numérique et résolution d'équations",
      "points": "4 pts",
      "enonce": "<div style='font-size: 16px; line-height: 1.6; color: #333;'><p>Le calcul numérique est essentiel dans les métiers techniques. Cet exercice aborde la manipulation des puissances, des logarithmes et des systèmes d'équations.</p></div>",
      "questions": [
        {
          "question": "<div style='font-size: 16px; line-height: 1.6; color: #333;'><p>1) Calcule la valeur de \\( A = \\frac{2,4 \\times 10^5 \\times 5 \\times 10^{-2}}{6 \\times 10^3} \\). Donne le résultat en notation scientifique.</p></div>",
          "reponse": "<div style='font-size: 16px; line-height: 1.6; color: #333;'><p>\\( A = \\frac{2,4 \\times 5}{6} \\times 10^{5-2-3} = \\frac{12}{6} \\times 10^{0} = 2 \\times 10^0 = 2 \\).</p></div>"
        },
        {
          "question": "<div style='font-size: 16px; line-height: 1.6; color: #333;'><p>2) Calcule le déterminant de la matrice \\( \\begin{pmatrix} 3 & -1 \\\\ 2 & 4 \\end{pmatrix} \\) et utilise-le pour dire si le système \\( \\begin{cases} 3x - y = 5 \\\\ 2x + 4y = 8 \\end{cases} \\) a une solution unique.</p></div>",
          "reponse": "<div style='font-size: 16px; line-height: 1.6; color: #333;'><p>Déterminant : \\( \\Delta = (3)(4) - (-1)(2) = 12 + 2 = 14 \\). Puisque \\( \\Delta \\ne 0 \\), le système admet une solution unique.</p></div>"
        },
        {
          "question": "<div style='font-size: 16px; line-height: 1.6; color: #333;'><p>3) Résoudre l'équation \\( \\ln(2x - 1) = \\ln(x + 3) \\).</p></div>",
          "reponse": "<div style='font-size: 16px; line-height: 1.6; color: #333;'><p>La fonction logarithme est bijective, donc on peut égaler les arguments à condition qu'ils soient positifs :<br><br>\\( 2x - 1 = x + 3 \\)<br>\\( 2x - x = 3 + 1 \\)<br>\\( x = 4 \\).<br><br>Vérification des conditions : \\( 2(4) - 1 = 7 > 0 \\) et \\( 4 + 3 = 7 > 0 \\).<br>La solution est donc \\( x = 4 \\).</p></div>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Dérivées et étude de fonction",
      "points": "6 pts",
      "enonce": "<div style='font-size: 16px; line-height: 1.6; color: #333;'><p>On considère la fonction \\( f(x) = \\frac{x^2 - 3x + 4}{x - 2} \\).</p></div>",
      "questions": [
        {
          "question": "<div style='font-size: 16px; line-height: 1.6; color: #333;'><p>1) Détermine l'ensemble de définition \\( D_f \\) de la fonction \\( f \\).</p></div>",
          "reponse": "<div style='font-size: 16px; line-height: 1.6; color: #333;'><p>Le dénominateur ne doit pas s'annuler : \\( x - 2 = 0 \\Rightarrow x = 2 \\).<br>Donc \\( D_f = \\mathbb{R} \\setminus \\{2\\} = ]-\\infty; 2[ \\cup ]2; +\\infty[ \\).</p></div>"
        },
        {
          "question": "<div style='font-size: 16px; line-height: 1.6; color: #333;'><p>2) Calcule la dérivée \\( f'(x) \\) et montre que \\( f'(x) = \\frac{x^2 - 4x + 2}{(x-2)^2} \\).</p></div>",
          "reponse": "<div style='font-size: 16px; line-height: 1.6; color: #333;'><p>La fonction est de la forme \\( \\frac{u}{v} \\) avec \\( u = x^2 - 3x + 4 \\) et \\( v = x - 2 \\).<br><br>\\( u' = 2x - 3 \\) et \\( v' = 1 \\).<br><br>La formule de dérivation donne :<br>\\( f'(x) = \\frac{(2x - 3)(x - 2) - (x^2 - 3x + 4)(1)}{(x - 2)^2} \\)<br>\\( = \\frac{2x^2 - 4x - 3x + 6 - x^2 + 3x - 4}{(x-2)^2} \\)<br>\\( = \\frac{x^2 - 4x + 2}{(x-2)^2} \\).</p></div>"
        },
        {
          "question": "<div style='font-size: 16px; line-height: 1.6; color: #333;'><p>3) Détermine l'équation de l'asymptote oblique à la courbe de \\( f \\).</p></div>",
          "reponse": "<div style='font-size: 16px; line-height: 1.6; color: #333;'><p>On effectue la division euclidienne de \\( x^2 - 3x + 4 \\) par \\( x - 2 \\) :<br>\\( x^2 - 3x + 4 = (x - 1)(x - 2) + 2 \\).<br><br>Donc \\( f(x) = x - 1 + \\frac{2}{x - 2} \\).<br><br>Comme \\( \\lim_{x \\to +\\infty} \\frac{2}{x - 2} = 0 \\) et \\( \\lim_{x \\to -\\infty} \\frac{2}{x - 2} = 0 \\), la droite \\( y = x - 1 \\) est asymptote oblique à la courbe.</p></div>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Statistiques et ajustement linéaire",
      "points": "5 pts",
      "enonce": "<div style='font-size: 16px; line-height: 1.6; color: #333;'><p>Un artisan veut étudier la relation entre le nombre d'heures de travail \\( x \\) et le nombre de pièces produites \\( y \\). Il relève les données suivantes :</p><table style='width: 100%; border-collapse: collapse; margin: 10px 0;'><tr style='background-color: #f2f2f2;'><th style='padding: 8px; border: 1px solid #ddd;'>\\( x \\) (heures)</th><td style='padding: 8px; border: 1px solid #ddd;'>1</td><td style='padding: 8px; border: 1px solid #ddd;'>2</td><td style='padding: 8px; border: 1px solid #ddd;'>3</td><td style='padding: 8px; border: 1px solid #ddd;'>4</td><td style='padding: 8px; border: 1px solid #ddd;'>5</td></tr><tr style='background-color: #fff;'><th style='padding: 8px; border: 1px solid #ddd;'>\\( y \\) (pièces)</th><td style='padding: 8px; border: 1px solid #ddd;'>5</td><td style='padding: 8px; border: 1px solid #ddd;'>8</td><td style='padding: 8px; border: 1px solid #ddd;'>10</td><td style='padding: 8px; border: 1px solid #ddd;'>13</td><td style='padding: 8px; border: 1px solid #ddd;'>16</td></tr></table></div>",
      "questions": [
        {
          "question": "<div style='font-size: 16px; line-height: 1.6; color: #333;'><p>1) Représente le nuage de points de cette série statistique.</p></div>",
          "reponse": "<div style='font-size: 16px; line-height: 1.6; color: #333;'><p>Le nuage de points est formé par les coordonnées \\( (1;5), (2;8), (3;10), (4;13), (5;16) \\).</p></div>"
        },
        {
          "question": "<div style='font-size: 16px; line-height: 1.6; color: #333;'><p>2) Calcule les coordonnées du point moyen \\( G \\).</p></div>",
          "reponse": "<div style='font-size: 16px; line-height: 1.6; color: #333;'><p>\\( \\bar{x} = \\frac{1+2+3+4+5}{5} = 3 \\)<br>\\( \\bar{y} = \\frac{5+8+10+13+16}{5} = \\frac{52}{5} = 10,4 \\).<br>Le point moyen est \\( G(3; 10,4) \\).</p></div>"
        },
        {
          "question": "<div style='font-size: 16px; line-height: 1.6; color: #333;'><p>3) Détermine l'équation de la droite de Mayer pour ajuster ce nuage, puis estime le nombre de pièces produites pour 6 heures de travail.</p></div>",
          "reponse": "<div style='font-size: 16px; line-height: 1.6; color: #333;'><p>On divise la série en deux groupes de même effectif :<br>Groupe 1 : (1;5) et (2;8) &rarr; \\( G_1(1,5; 6,5) \\)<br>Groupe 2 : (4;13) et (5;16) &rarr; \\( G_2(4,5; 14,5) \\)<br><br>La droite de Mayer passe par \\( G_1 \\) et \\( G_2 \\).<br>Coefficient directeur : \\( a = \\frac{14,5 - 6,5}{4,5 - 1,5} = \\frac{8}{3} \\approx 2,67 \\).<br><br>Equation : \\( y - 6,5 = \\frac{8}{3}(x - 1,5) \\)<br>\\( y = \\frac{8}{3}x - 4 + 6,5 = \\frac{8}{3}x + 2,5 \\).<br><br>Pour \\( x = 6 \\) heures : \\( y = \\frac{8}{3} \\times 6 + 2,5 = 16 + 2,5 = 18,5 \\) soit environ 19 pièces.</p></div>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Probabilités et loi binomiale",
      "points": "5 pts",
      "enonce": "<div style='font-size: 16px; line-height: 1.6; color: #333;'><p>Une entreprise fabrique des pièces détachées. La probabilité qu'une pièce soit défectueuse est \\( p = 0,05 \\). On prélève un échantillon de 10 pièces.</p></div>",
      "questions": [
        {
          "question": "<div style='font-size: 16px; line-height: 1.6; color: #333;'><p>1) Justifie que la variable aléatoire \\( X \\) comptant le nombre de pièces défectueuses suit une loi binomiale. Précise ses paramètres.</p></div>",
          "reponse": "<div style='font-size: 16px; line-height: 1.6; color: #333;'><p>L'expérience consiste à répéter 10 fois un tirage de Bernoulli (succès = pièce défectueuse) de manière indépendante avec une probabilité de succès \\( p = 0,05 \\). Donc \\( X \\) suit la loi binomiale de paramètres \\( n = 10 \\) et \\( p = 0,05 \\), notée \\( \\mathcal{B}(10; 0,05) \\).</p></div>"
        },
        {
          "question": "<div style='font-size: 16px; line-height: 1.6; color: #333;'><p>2) Calcule la probabilité qu'il y ait exactement 2 pièces défectueuses dans cet échantillon.</p></div>",
          "reponse": "<div style='font-size: 16px; line-height: 1.6; color: #333;'><p>\\( P(X = 2) = \\binom{10}{2} (0,05)^2 (0,95)^8 \\)<br>\\( = 45 \\times 0,0025 \\times 0,6634 \\)<br>\\( \\approx 45 \\times 0,0016585 \\)<br>\\( \\approx 0,0746 \\).<br>La probabilité est d'environ 7,46%.</p></div>"
        },
        {
          "question": "<div style='font-size: 16px; line-height: 1.6; color: #333;'><p>3) Calcule l'espérance mathématique \\( E(X) \\) et la variance \\( V(X) \\) de cette variable aléatoire.</p></div>",
          "reponse": "<div style='font-size: 16px; line-height: 1.6; color: #333;'><p>Pour une loi binomiale \\( \\mathcal{B}(n; p) \\) :<br>\\( E(X) = np = 10 \\times 0,05 = 0,5 \\).<br>\\( V(X) = np(1-p) = 10 \\times 0,05 \\times 0,95 = 0,475 \\).</p></div>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
