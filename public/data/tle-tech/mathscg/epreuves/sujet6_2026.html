<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Mathématiques CG",
  "classe": "Tle technique",
  "sequence": "Séquence 6",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Ajustement graphique et point moyen",
      "points": "4 pts",
      "enonce": "<div style='padding: 10px; font-size: 1rem; color: #1a202c;'> <p>Le tableau ci-dessous donne la taille (en cm) et le poids (en kg) de 5 élèves d'une classe de Tle technique.</p> <table style='width: 100%; border-collapse: collapse; background: #f7fafc; border-radius: 10px; overflow: hidden;'> <thead> <tr style='background: #2b6cb0; color: #ffffff;'> <th style='padding: 10px; text-align: center;'>Taille (x)</th> <th style='padding: 10px; text-align: center;'>160</th> <th style='padding: 10px; text-align: center;'>165</th> <th style='padding: 10px; text-align: center;'>170</th> <th style='padding: 10px; text-align: center;'>175</th> <th style='padding: 10px; text-align: center;'>180</th> </tr> </thead> <tbody> <tr style='border-bottom: 1px solid #e2e8f0;'> <td style='padding: 10px; text-align: center; font-weight: bold;'>Poids (y)</td> <td style='padding: 10px; text-align: center;'>52</td> <td style='padding: 10px; text-align: center;'>56</td> <td style='padding: 10px; text-align: center;'>60</td> <td style='padding: 10px; text-align: center;'>65</td> <td style='padding: 10px; text-align: center;'>70</td> </tr> </tbody> </table> <p style='margin-top: 15px;'>1. Représenter le nuage de points associé à cette série statistique dans un repère orthogonal (unités : 1 cm pour 5 cm en abscisse et 1 cm pour 5 kg en ordonnée).</p> <p>2. Déterminer les coordonnées du point moyen \\( G \\) du nuage.</p> <p>3. Tracer la droite d'ajustement passant par \\( G \\) et ayant pour équation \\( y = 0,9x - 92 \\).</p> <p>4. En utilisant cette droite, estimer le poids d'un élève mesurant 190 cm.</p> <p>5. Ce résultat est-il fiable ? Justifier.</p> </div>",
      "questions": [
        {
          "question": "<p>1. Représenter le nuage de points associé à cette série statistique dans un repère orthogonal (unités : 1 cm pour 5 cm en abscisse et 1 cm pour 5 kg en ordonnée).</p>",
          "reponse": "<p>Nuage de points avec les coordonnées (160;52), (165;56), (170;60), (175;65), (180;70).</p>"
        },
        {
          "question": "<p>2. Déterminer les coordonnées du point moyen \\( G \\) du nuage.</p>",
          "reponse": "<p>\\( \\bar{x} = \\dfrac{160+165+170+175+180}{5} = 170 \\)</p><p>\\( \\bar{y} = \\dfrac{52+56+60+65+70}{5} = 60,6 \\)</p><p>Donc \\( G(170; 60,6) \\).</p>"
        },
        {
          "question": "<p>3. Tracer la droite d'ajustement passant par \\( G \\) et ayant pour équation \\( y = 0,9x - 92 \\).</p>",
          "reponse": "<p>Vérification : \\( 0,9 \\times 170 - 92 = 153 - 92 = 61 \\). Le point \\( G \\) n'est pas exactement sur la droite (61 ≠ 60,6).</p><p>La droite passe par \\( G \\) et le point d'abscisse 180 : \\( y = 0,9 \\times 180 - 92 = 70 \\).</p>"
        },
        {
          "question": "<p>4. En utilisant cette droite, estimer le poids d'un élève mesurant 190 cm.</p>",
          "reponse": "<p>Pour \\( x = 190 \\), \\( y = 0,9 \\times 190 - 92 = 171 - 92 = 79 \\) kg.</p>"
        },
        {
          "question": "<p>5. Ce résultat est-il fiable ? Justifier.</p>",
          "reponse": "<p>Non, car 190 cm est en dehors du domaine des données observées (160 à 180 cm). C'est une extrapolation, donc le résultat est incertain.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Ajustement par la méthode de Mayer",
      "points": "6 pts",
      "enonce": "<div style='padding: 10px; font-size: 1rem; color: #1a202c;'> <p>On a relevé pour 6 commerçants d'un marché, le montant des ventes (en milliers de FCFA) et le bénéfice réalisé (en milliers de FCFA).</p> <table style='width: 100%; border-collapse: collapse; background: #f7fafc; border-radius: 10px; overflow: hidden;'> <thead> <tr style='background: #2b6cb0; color: #ffffff;'> <th style='padding: 10px; text-align: center;'>Ventes (x)</th> <th style='padding: 10px; text-align: center;'>10</th> <th style='padding: 10px; text-align: center;'>15</th> <th style='padding: 10px; text-align: center;'>20</th> <th style='padding: 10px; text-align: center;'>25</th> <th style='padding: 10px; text-align: center;'>30</th> <th style='padding: 10px; text-align: center;'>35</th> </tr> </thead> <tbody> <tr style='border-bottom: 1px solid #e2e8f0;'> <td style='padding: 10px; text-align: center; font-weight: bold;'>Bénéfice (y)</td> <td style='padding: 10px; text-align: center;'>1,2</td> <td style='padding: 10px; text-align: center;'>1,8</td> <td style='padding: 10px; text-align: center;'>2,5</td> <td style='padding: 10px; text-align: center;'>3,0</td> <td style='padding: 10px; text-align: center;'>4,0</td> <td style='padding: 10px; text-align: center;'>4,5</td> </tr> </tbody> </table> <p style='margin-top: 15px;'>1. Représenter le nuage de points.</p> <p>2. Partager la série en deux groupes de 3 points et déterminer les points moyens \\( G_1 \\) et \\( G_2 \\) de chaque groupe.</p> <p>3. Déterminer l'équation de la droite \\( (G_1 G_2) \\).</p> <p>4. Estimer le bénéfice pour un montant de ventes de 40 000 FCFA.</p> <p>5. Comparer avec la méthode graphique.</p> </div>",
      "questions": [
        {
          "question": "<p>1. Représenter le nuage de points.</p>",
          "reponse": "<p>Nuage avec les points (10;1,2), (15;1,8), (20;2,5), (25;3,0), (30;4,0), (35;4,5).</p>"
        },
        {
          "question": "<p>2. Partager la série en deux groupes de 3 points et déterminer les points moyens \\( G_1 \\) et \\( G_2 \\) de chaque groupe.</p>",
          "reponse": "<p><strong>Groupe 1 :</strong> (10;1,2), (15;1,8), (20;2,5)</p><p>\\( \\bar{x}_1 = \\dfrac{10+15+20}{3} = 15 \\)</p><p>\\( \\bar{y}_1 = \\dfrac{1,2+1,8+2,5}{3} = 1,833 \\)</p><p>Donc \\( G_1(15; 1,833) \\).</p><p><strong>Groupe 2 :</strong> (25;3,0), (30;4,0), (35;4,5)</p><p>\\( \\bar{x}_2 = \\dfrac{25+30+35}{3} = 30 \\)</p><p>\\( \\bar{y}_2 = \\dfrac{3,0+4,0+4,5}{3} = 3,833 \\)</p><p>Donc \\( G_2(30; 3,833) \\).</p>"
        },
        {
          "question": "<p>3. Déterminer l'équation de la droite \\( (G_1 G_2) \\).</p>",
          "reponse": "<p>Le coefficient directeur : \\( a = \\dfrac{3,833 - 1,833}{30 - 15} = \\dfrac{2}{15} \\approx 0,133 \\).</p><p>L'ordonnée à l'origine : \\( b = \\bar{y}_1 - a\\bar{x}_1 = 1,833 - 0,133 \\times 15 = 1,833 - 1,995 = -0,162 \\).</p><p>Donc \\( y = 0,133x - 0,162 \\).</p>"
        },
        {
          "question": "<p>4. Estimer le bénéfice pour un montant de ventes de 40 000 FCFA.</p>",
          "reponse": "<p>Pour \\( x = 40 \\), \\( y = 0,133 \\times 40 - 0,162 = 5,32 - 0,162 = 5,158 \\) milliers de FCFA, soit environ 5 158 FCFA.</p>"
        },
        {
          "question": "<p>5. Comparer avec la méthode graphique.</p>",
          "reponse": "<p>La méthode de Mayer est plus objective car elle repose sur des calculs précis, contrairement à la méthode graphique qui est subjective.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Problème de prévision",
      "points": "5 pts",
      "enonce": "<div style='padding: 10px; font-size: 1rem; color: #1a202c;'> <p>Un commerçant souhaite étudier la relation entre le nombre d'articles vendus et le chiffre d'affaires réalisé. Il dispose des données suivantes :</p> <table style='width: 100%; border-collapse: collapse; background: #f7fafc; border-radius: 10px; overflow: hidden;'> <thead> <tr style='background: #2b6cb0; color: #ffffff;'> <th style='padding: 10px; text-align: center;'>Articles (x)</th> <th style='padding: 10px; text-align: center;'>10</th> <th style='padding: 10px; text-align: center;'>20</th> <th style='padding: 10px; text-align: center;'>30</th> <th style='padding: 10px; text-align: center;'>40</th> <th style='padding: 10px; text-align: center;'>50</th> </tr> </thead> <tbody> <tr style='border-bottom: 1px solid #e2e8f0;'> <td style='padding: 10px; text-align: center; font-weight: bold;'>CA (y)</td> <td style='padding: 10px; text-align: center;'>50</td> <td style='padding: 10px; text-align: center;'>95</td> <td style='padding: 10px; text-align: center;'>145</td> <td style='padding: 10px; text-align: center;'>190</td> <td style='padding: 10px; text-align: center;'>245</td> </tr> </tbody> </table> <p style='margin-top: 15px;'>1. Calculer les coordonnées du point moyen \\( G \\).</p> <p>2. Déterminer l'équation de la droite d'ajustement par la méthode de Mayer.</p> <p>3. Estimer le chiffre d'affaires pour 60 articles vendus.</p> <p>4. Interpréter le coefficient directeur de la droite obtenue.</p> </div>",
      "questions": [
        {
          "question": "<p>1. Calculer les coordonnées du point moyen \\( G \\).</p>",
          "reponse": "<p>\\( \\bar{x} = \\dfrac{10+20+30+40+50}{5} = 30 \\)</p><p>\\( \\bar{y} = \\dfrac{50+95+145+190+245}{5} = 145 \\)</p><p>Donc \\( G(30; 145) \\).</p>"
        },
        {
          "question": "<p>2. Déterminer l'équation de la droite d'ajustement par la méthode de Mayer.</p>",
          "reponse": "<p>Les points sont déjà classés par ordre croissant. On prend les 2 premiers et les 3 derniers (car 5 points).</p><p><strong>Groupe 1 :</strong> (10;50), (20;95) → \\( G_1(15; 72,5) \\)</p><p><strong>Groupe 2 :</strong> (30;145), (40;190), (50;245) → \\( G_2(40; 193,33) \\)</p><p>\\( a = \\dfrac{193,33 - 72,5}{40 - 15} = \\dfrac{120,83}{25} \\approx 4,833 \\)</p><p>\\( b = 72,5 - 4,833 \\times 15 = 72,5 - 72,5 = 0 \\)</p><p>Donc \\( y = 4,83x \\).</p>"
        },
        {
          "question": "<p>3. Estimer le chiffre d'affaires pour 60 articles vendus.</p>",
          "reponse": "<p>Pour \\( x = 60 \\), \\( y = 4,83 \\times 60 = 289,8 \\) milliers de FCFA.</p>"
        },
        {
          "question": "<p>4. Interpréter le coefficient directeur de la droite obtenue.</p>",
          "reponse": "<p>Le coefficient directeur \\( a = 4,83 \\) signifie que pour un article supplémentaire vendu, le chiffre d'affaires augmente d'environ 4,83 milliers de FCFA (soit 4 830 FCFA).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Application en gestion",
      "points": "5 pts",
      "enonce": "<div style='padding: 10px; font-size: 1rem; color: #1a202c;'> <p>Une entreprise de transport souhaite étudier l'évolution de sa consommation de carburant en fonction du kilométrage parcouru. Les données mensuelles sont les suivantes :</p> <table style='width: 100%; border-collapse: collapse; background: #f7fafc; border-radius: 10px; overflow: hidden;'> <thead> <tr style='background: #2b6cb0; color: #ffffff;'> <th style='padding: 10px; text-align: center;'>Km (x)</th> <th style='padding: 10px; text-align: center;'>100</th> <th style='padding: 10px; text-align: center;'>200</th> <th style='padding: 10px; text-align: center;'>300</th> <th style='padding: 10px; text-align: center;'>400</th> <th style='padding: 10px; text-align: center;'>500</th> </tr> </thead> <tbody> <tr style='border-bottom: 1px solid #e2e8f0;'> <td style='padding: 10px; text-align: center; font-weight: bold;'>Consommation (y)</td> <td style='padding: 10px; text-align: center;'>8</td> <td style='padding: 10px; text-align: center;'>15</td> <td style='padding: 10px; text-align: center;'>23</td> <td style='padding: 10px; text-align: center;'>30</td> <td style='padding: 10px; text-align: center;'>38</td> </tr> </tbody> </table> <p style='margin-top: 15px;'>1. Représenter le nuage de points.</p> <p>2. Déterminer les coordonnées du point moyen.</p> <p>3. Par la méthode de Mayer, déterminer l'équation de la droite d'ajustement.</p> <p>4. Estimer la consommation pour 600 km.</p> <p>5. Le directeur prévoit un budget de 50 L de carburant. Quelle distance maximale peut-il prévoir ?</p> </div>",
      "questions": [
        {
          "question": "<p>1. Représenter le nuage de points.</p>",
          "reponse": "<p>Nuage avec les points (100;8), (200;15), (300;23), (400;30), (500;38).</p>"
        },
        {
          "question": "<p>2. Déterminer les coordonnées du point moyen.</p>",
          "reponse": "<p>\\( \\bar{x} = \\dfrac{100+200+300+400+500}{5} = 300 \\)</p><p>\\( \\bar{y} = \\dfrac{8+15+23+30+38}{5} = 22,8 \\)</p><p>Donc \\( G(300; 22,8) \\).</p>"
        },
        {
          "question": "<p>3. Par la méthode de Mayer, déterminer l'équation de la droite d'ajustement.</p>",
          "reponse": "<p><strong>Groupe 1 :</strong> (100;8), (200;15) → \\( G_1(150; 11,5) \\)</p><p><strong>Groupe 2 :</strong> (300;23), (400;30), (500;38) → \\( G_2(400; 30,33) \\)</p><p>\\( a = \\dfrac{30,33 - 11,5}{400 - 150} = \\dfrac{18,83}{250} \\approx 0,0753 \\)</p><p>\\( b = 11,5 - 0,0753 \\times 150 = 11,5 - 11,295 = 0,205 \\)</p><p>Donc \\( y = 0,0753x + 0,205 \\).</p>"
        },
        {
          "question": "<p>4. Estimer la consommation pour 600 km.</p>",
          "reponse": "<p>Pour \\( x = 600 \\), \\( y = 0,0753 \\times 600 + 0,205 = 45,18 + 0,205 = 45,385 \\) L.</p>"
        },
        {
          "question": "<p>5. Le directeur prévoit un budget de 50 L de carburant. Quelle distance maximale peut-il prévoir ?</p>",
          "reponse": "<p>On résout \\( 0,0753x + 0,205 = 50 \\)</p><p>\\( 0,0753x = 49,795 \\)</p><p>\\( x \\approx 661,3 \\) km.</p>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
