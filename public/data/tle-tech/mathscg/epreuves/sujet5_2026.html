<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Maths CG",
  "classe": "Tle technique",
  "sequence": "Séquence 5",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Programmation linéaire et déterminant (5 pts)",
      "points": "5 pts",
      "enonce": "<p>Une entreprise de menuiserie fabrique deux types de chaises : le modèle <strong>Confort</strong> et le modèle <strong>Classique</strong>. La fabrication d'une chaise Confort nécessite 2 heures de travail et 3 unités de bois. La fabrication d'une chaise Classique nécessite 1 heure de travail et 2 unités de bois. L'entreprise dispose de 40 heures de travail et de 90 unités de bois par jour. Le bénéfice est de 4 000 FCFA par chaise Confort et de 2 000 FCFA par chaise Classique.</p><p>On note <span class='math inline'><i>x</i></span> le nombre de chaises Confort et <span class='math inline'><i>y</i></span> le nombre de chaises Classique produites par jour.</p>",
      "questions": [
        {
          "question": "<p><strong>1.</strong> Écris le système d'inéquations modélisant les contraintes de production.</p>",
          "reponse": "<div class='math-block'><div class='math'>$$ \\begin{cases} 2x + y \\le 40 \\\\ 3x + 2y \\le 90 \\\\ x \\ge 0 \\\\ y \\ge 0 \\end{cases} $$</div></div><p>Les contraintes sont : temps de travail (2 heures pour Confort et 1 heure pour Classique, max 40 heures) et unités de bois (3 pour Confort et 2 pour Classique, max 90 unités).</p>"
        },
        {
          "question": "<p><strong>2.</strong> Le bénéfice est donné par <span class='math inline'><i>B</i>(<i>x</i>, <i>y</i>) = 4 000<i>x</i> + 2 000<i>y</i></span>. Détermine la production qui maximise le bénéfice.</p>",
          "reponse": "<p>On résout graphiquement le système. Les sommets du polygone des contraintes sont :</p><ul><li><span class='math inline'>(0, 0)</span> → <span class='math inline'><i>B</i> = 0</span></li><li><span class='math inline'>(20, 0)</span> (intersection <span class='math inline'>2x + y = 40</span> et <span class='math inline'>y = 0</span>) → <span class='math inline'><i>B</i> = 80 000</span></li><li><span class='math inline'>(0, 40)</span> → <span class='math inline'><i>B</i> = 80 000</span></li><li>Intersection de <span class='math inline'>2x + y = 40</span> et <span class='math inline'>3x + 2y = 90</span> :<br><span class='math inline'>2x + y = 40</span> → <span class='math inline'>y = 40 - 2x</span><br><span class='math inline'>3x + 2(40 - 2x) = 90</span> → <span class='math inline'>3x + 80 - 4x = 90</span> → <span class='math inline'>-x = 10</span> → <span class='math inline'>x = 10</span>, <span class='math inline'>y = 20</span><br><span class='math inline'><i>B</i> = 4 000 × 10 + 2 000 × 20 = 40 000 + 40 000 = 80 000</span></li></ul><p>Le bénéfice maximum est de <strong>80 000 FCFA</strong>, atteint pour plusieurs combinaisons : (20, 0), (0, 40) ou (10, 20).</p>"
        },
        {
          "question": "<p><strong>3.</strong> Calcule le déterminant des vecteurs <span class='math inline'>\\vec{u}(2, 3)</span> et <span class='math inline'>\\vec{v}(1, 2)</span>. Que représente ce déterminant dans le contexte du système ?</p>",
          "reponse": "<div class='math-block'><div class='math'>$$ \\det(\\vec{u}, \\vec{v}) = 2 \\times 2 - 3 \\times 1 = 4 - 3 = 1 $$</div></div><p>Le déterminant est <strong>1</strong>. Il est non nul, ce qui signifie que les deux vecteurs ne sont pas colinéaires, donc le système a une solution unique pour l'intersection des droites correspondantes.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Logarithme et exponentielle (5 pts)",
      "points": "5 pts",
      "enonce": "<p>On considère les fonctions <span class='math inline'><i>f</i>(<i>x</i>) = \\ln(2x - 1)</span> et <span class='math inline'><i>g</i>(<i>x</i>) = e^{3x - 2}</span>.</p>",
      "questions": [
        {
          "question": "<p><strong>1.</strong> Détermine l'ensemble de définition de la fonction <span class='math inline'><i>f</i></span>.</p>",
          "reponse": "<p>La fonction <span class='math inline'>\\ln</span> est définie pour des arguments strictement positifs :</p><div class='math-block'><div class='math'>$$ 2x - 1 > 0 \\Rightarrow x > \\frac{1}{2} $$</div></div><p>L'ensemble de définition est <span class='math inline'>D_f = \\left]\\frac{1}{2}; +\\infty\\right[</span>.</p>"
        },
        {
          "question": "<p><strong>2.</strong> Résous l'équation <span class='math inline'>\\ln(2x - 1) = 0</span>.</p>",
          "reponse": "<div class='math-block'><div class='math'>$$ \\ln(2x - 1) = 0 \\Rightarrow 2x - 1 = e^0 = 1 \\Rightarrow 2x = 2 \\Rightarrow x = 1 $$</div></div><p>La solution est <span class='math inline'>x = 1</span>.</p>"
        },
        {
          "question": "<p><strong>3.</strong> Résous l'inéquation <span class='math inline'>e^{3x - 2} > 1</span>.</p>",
          "reponse": "<div class='math-block'><div class='math'>$$ e^{3x - 2} > 1 \\Rightarrow e^{3x - 2} > e^0 \\Rightarrow 3x - 2 > 0 \\Rightarrow x > \\frac{2}{3} $$</div></div><p>L'ensemble des solutions est <span class='math inline'>\\left]\\frac{2}{3}; +\\infty\\right[</span>.</p>"
        },
        {
          "question": "<p><strong>4.</strong> Calcule la dérivée de <span class='math inline'><i>f</i></span> et celle de <span class='math inline'><i>g</i></span>.</p>",
          "reponse": "<ul><li><span class='math inline'>f'(x) = \\dfrac{2}{2x - 1}</span></li><li><span class='math inline'>g'(x) = 3e^{3x - 2}</span></li></ul>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Dérivées et étude de fonction (7 pts)",
      "points": "7 pts",
      "enonce": "<p>Soit la fonction <span class='math inline'><i>f</i>(<i>x</i>) = \\dfrac{x^2 - 3x + 4}{x - 2}</span>.</p>",
      "questions": [
        {
          "question": "<p><strong>1.</strong> Détermine le domaine de définition de <span class='math inline'><i>f</i></span>.</p>",
          "reponse": "<p>Le dénominateur <span class='math inline'>x - 2</span> ne doit pas être nul, donc <span class='math inline'>x \\neq 2</span>.</p><p><span class='math inline'>D_f = \\mathbb{R} \\setminus \\{2\\}</span>.</p>"
        },
        {
          "question": "<p><strong>2.</strong> Calcule la dérivée <span class='math inline'><i>f'</i>(<i>x</i>)</span>.</p>",
          "reponse": "<p>On utilise la formule de dérivation d'un quotient :</p><div class='math-block'><div class='math'>$$ f'(x) = \\dfrac{(2x - 3)(x - 2) - (x^2 - 3x + 4)(1)}{(x - 2)^2} $$</div></div><div class='math-block'><div class='math'>$$ f'(x) = \\dfrac{2x^2 - 4x - 3x + 6 - x^2 + 3x - 4}{(x - 2)^2} = \\dfrac{x^2 - 4x + 2}{(x - 2)^2} $$</div></div><p>Donc <span class='math inline'>f'(x) = \\dfrac{x^2 - 4x + 2}{(x - 2)^2}</span>.</p>"
        },
        {
          "question": "<p><strong>3.</strong> Détermine les limites de <span class='math inline'><i>f</i></span> en <span class='math inline'>2^-</span>, en <span class='math inline'>2^+</span>, en <span class='math inline'>-\\infty</span> et en <span class='math inline'>+\\infty</span>. Quelles asymptotes en déduis-tu ?</p>",
          "reponse": "<ul><li><span class='math inline'>\\lim\\limits_{x \\to -\\infty} f(x) = -\\infty</span> et <span class='math inline'>\\lim\\limits_{x \\to +\\infty} f(x) = +\\infty</span> (car le terme dominant est <span class='math inline'>\\frac{x^2}{x} = x</span>).</li><li>Asymptote oblique : on effectue la division euclidienne : <span class='math inline'>x^2 - 3x + 4 = (x - 1)(x - 2) + 2</span>, donc <span class='math inline'>f(x) = x - 1 + \\dfrac{2}{x - 2}</span>. L'asymptote oblique est <span class='math inline'><i>y</i> = <i>x</i> - 1</span>.</li><li><span class='math inline'>\\lim\\limits_{x \\to 2^-} f(x) = -\\infty</span> et <span class='math inline'>\\lim\\limits_{x \\to 2^+} f(x) = +\\infty</span> (car <span class='math inline'>\\lim\\limits_{x \\to 2} \\dfrac{2}{x - 2}</span> tend vers <span class='math inline'>\\pm\\infty</span>).</li><li>Asymptote verticale : <span class='math inline'><i>x</i> = 2</span>.</li></ul>"
        },
        {
          "question": "<p><strong>4.</strong> Étudie les variations de <span class='math inline'><i>f</i></span> sur son domaine de définition.</p>",
          "reponse": "<p>On étudie le signe de <span class='math inline'>f'(x) = \\dfrac{x^2 - 4x + 2}{(x - 2)^2}</span>.</p><p>Le dénominateur est toujours positif (<span class='math inline'>(x - 2)^2 > 0</span>). Le signe dépend donc du numérateur <span class='math inline'>x^2 - 4x + 2</span>.</p><p>Discriminant : <span class='math inline'>\\Delta = 16 - 8 = 8</span>. Racines : <span class='math inline'>x_1 = \\dfrac{4 - \\sqrt{8}}{2} = 2 - \\sqrt{2}</span> et <span class='math inline'>x_2 = 2 + \\sqrt{2}</span>.</p><ul><li>Sur <span class='math inline'>]-\\infty; 2 - \\sqrt{2}[</span> : <span class='math inline'>f'(x) > 0</span> → <span class='math inline'><i>f</i></span> croissante</li><li>Sur <span class='math inline'>]2 - \\sqrt{2}; 2[</span> : <span class='math inline'>f'(x) < 0</span> → <span class='math inline'><i>f</i></span> décroissante</li><li>Sur <span class='math inline'>]2; 2 + \\sqrt{2}[</span> : <span class='math inline'>f'(x) < 0</span> → <span class='math inline'><i>f</i></span> décroissante</li><li>Sur <span class='math inline'>]2 + \\sqrt{2}; +\\infty[</span> : <span class='math inline'>f'(x) > 0</span> → <span class='math inline'><i>f</i></span> croissante</li></ul>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Intégration et calcul d'aire (5 pts)",
      "points": "5 pts",
      "enonce": "<p>On considère la fonction <span class='math inline'><i>f</i>(<i>x</i>) = <i>x</i>^2 - 2<i>x</i> + 1</span>.</p>",
      "questions": [
        {
          "question": "<p><strong>1.</strong> Détermine une primitive <span class='math inline'><i>F</i></span> de <span class='math inline'><i>f</i></span> sur <span class='math inline'>\\mathbb{R}</span>.</p>",
          "reponse": "<div class='math-block'><div class='math'>$$ F(x) = \\dfrac{x^3}{3} - x^2 + x + C $$</div></div><p>où <span class='math inline'><i>C</i></span> est une constante réelle.</p>"
        },
        {
          "question": "<p><strong>2.</strong> Calcule <span class='math inline'>\\displaystyle\\int_{0}^{2} (x^2 - 2x + 1) \\, dx</span>.</p>",
          "reponse": "<div class='math-block'><div class='math'>$$ \\int_{0}^{2} (x^2 - 2x + 1) \\, dx = \\left[ \\dfrac{x^3}{3} - x^2 + x \\right]_{0}^{2} $$</div></div><div class='math-block'><div class='math'>$$ = \\left(\\dfrac{8}{3} - 4 + 2\\right) - (0) = \\dfrac{8}{3} - 2 = \\dfrac{8}{3} - \\dfrac{6}{3} = \\dfrac{2}{3} $$</div></div><p>L'intégrale vaut <span class='math inline'>\\dfrac{2}{3}</span>.</p>"
        },
        {
          "question": "<p><strong>3.</strong> Donne une interprétation géométrique de ce résultat.</p>",
          "reponse": "<p>L'intégrale <span class='math inline'>\\displaystyle\\int_{0}^{2} f(x) \\, dx</span> représente l'aire (en unités d'aire) de la partie du plan comprise entre la courbe de <span class='math inline'><i>f</i></span>, l'axe des abscisses et les droites <span class='math inline'><i>x</i> = 0</span> et <span class='math inline'><i>x</i> = 2</span>. L'aire est donc de <span class='math inline'>\\dfrac{2}{3}</span> unités d'aire.</p>"

        {

          "reponse": "<p><span class='math inline'>F'(x) = \\dfrac{3x^2}{3} - 2x + 1 = x^2 - 2x + 1 = f(x)</span>.</p><p>On a bien <span class='math inline'>F'(x) = f(x)</span>, donc <span class='math inline'><i>F</i></span> est une primitive de <span class='math inline'><i>f</i></span>.</p>"

    {

      "points": "6 pts",

          "reponse": "<div class='math-block'><div class='math'>$$ P(X = 0) = \\binom{10}{0} (0,05)^0 (0,95)^{10} = 1 \\times 1 \\times (0,95)^{10} \\approx 0,5987 $$</div></div><p>La probabilité de ne trouver <strong>aucune pièce défectueuse</strong> dans l'échantillon est d'environ <strong>59,87 %</strong>.</p>"

          "reponse": "<ul><li><span class='math inline'>E(X) = n \\times p = 10 \\times 0,05 = 0,5</span></li><li><span class='math inline'>V(X) = n \\times p \\times (1 - p) = 10 \\times 0,05 \\times 0,95 = 0,475</span></li><li><span class='math inline'>\\sigma(X) = \\sqrt{V(X)} = \\sqrt{0,475} \\approx 0,689</span></li></ul>"

          "reponse": "<ul><li><span class='math inline'>F(0) = P(X \\le 0) = P(X = 0) \\approx 0,5987</span></li><li><span class='math inline'>P(X = 1) = \\binom{10}{1} (0,05)^1 (0,95)^9 = 10 \\times 0,05 \\times (0,95)^9 \\approx 0,3151</span></li><li><span class='math inline'>F(1) = P(X \\le 1) = P(X = 0) + P(X = 1) \\approx 0,9138</span></li><li><span class='math inline'>P(X = 2) = \\binom{10}{2} (0,05)^2 (0,95)^8 = 45 \\times 0,0025 \\times (0,95)^8 \\approx 0,0746</span></li><li><span class='math inline'>F(2) = P(X \\le 2) \\approx 0,9884</span></li></ul>"

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
