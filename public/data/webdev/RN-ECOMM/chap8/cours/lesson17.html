<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Présentation mobile</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' },
            options: { skipHtmlTypes: 'script' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 500px;
        margin: 0 auto;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    .slide-header {
        flex-shrink: 0;
        padding: 18px 16px 10px 16px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        z-index: 10;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .slide-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
    }

    .content-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 18px 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        flex-shrink: 0;
    }

    .content-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .content-card li {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        line-height: 1.5;
    }

    .content-card li:last-child {
        border-bottom: none;
    }

    .bullet-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
    }

    .math-block {
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        overflow-x: auto;
        flex-shrink: 0;
        margin: 4px 0;
    }

    .math-block .math {
        font-size: 1.2rem;
        color: #e2e8f0;
    }

    .note-box {
        background: rgba(96, 165, 250, 0.08);
        border-left: 4px solid #60a5fa;
        padding: 12px 16px;
        border-radius: 12px;
        font-style: italic;
        font-size: 0.9rem;
        color: #cbd5e1;
        flex-shrink: 0;
    }

    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        border-radius: 0;
        flex-direction: column;
    }

    .loading-card {
        background: #1e293b;
        padding: 32px 28px;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #334155;
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px auto;
    }

    .loading-text {
        font-weight: 600;
        font-size: 1.1rem;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    .loading-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 16px;
    }
    .loading-progress {
        height: 3px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        animation: loadingProgress 30s ease-out forwards;
    }

    .loading-timeout {
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 12px;
    }

    .btn-cancel-loading {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 40px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #f87171;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }

    .btn-cancel-loading:active {
        transform: scale(0.94);
        background: rgba(239, 68, 68, 0.25);
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
    }

    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .slide-counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255,255,255,0.05);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(255,255,255,0.04);
    }

    .status-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 30px;
        background: rgba(96, 165, 250, 0.12);
        color: #93bbfc;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
    }

    .status-badge .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: pulse-dot 1.2s infinite;
        flex-shrink: 0;
    }

    .status-badge.idle .dot {
        animation: none;
        background: #64748b;
    }
    .status-badge.speaking .dot {
        background: #34d399;
        animation: pulse-dot 0.8s infinite;
    }
    .status-badge.error .dot {
        background: #f87171;
        animation: none;
    }
    .status-badge.paused .dot {
        animation: none;
        background: #fbbf24;
    }
    .status-badge.waiting .dot {
        animation: pulse-dot 1.5s infinite;
        background: #fbbf24;
    }
    .status-badge.loading .dot {
        animation: pulse-dot 0.5s infinite;
        background: #60a5fa;
    }

    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.7); }
    }

    .footer-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(255,255,255,0.1);
    }

    .btn-secondary {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-play {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
        min-width: 80px;
        justify-content: center;
    }
    .btn-play:active {
        background: rgba(52, 211, 153, 0.25);
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
    }

    .auto-indicator {
        font-size: 0.65rem;
        color: #64748b;
        text-align: center;
        letter-spacing: 0.3px;
        padding: 2px 0;
    }

    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.2rem;
        }
        .content-card li {
            font-size: 0.9rem;
            padding: 8px 0;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .btn-play {
            min-width: 60px;
        }
        .footer-buttons {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
        .loading-card {
            padding: 20px 16px;
        }
        .math-block .math {
            font-size: 1rem;
        }
    }

    @media (min-width: 600px) {
        .app-container {
            max-width: 480px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
        .loading-overlay {
            border-radius: 32px;
        }
    }

    /* Mode jour (par défaut) */
    html, body {
        background: #f0f4f8 !important;
        color: #1a202c !important;
    }
    .app-container {
        background: linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%) !important;
    }
    .slide-header {
        background: rgba(255, 255, 255, 0.85) !important;
        border-bottom: 1px solid rgba(0,0,0,0.08) !important;
    }
    .slide-header h1 {
        background: linear-gradient(135deg, #2b6cb0, #6b46c1) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        background-clip: text !important;
    }
    .slide-footer {
        background: rgba(255, 255, 255, 0.9) !important;
        border-top: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card {
        background: rgba(255,255,255,0.8) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card li {
        border-bottom: 1px solid rgba(0,0,0,0.05) !important;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.12) !important;
        border-left: 4px solid #4299e1 !important;
        color: #2c3e50 !important;
    }
    .math-block {
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .math-block .math {
        color: #2d3748 !important;
    }
    .slide-counter {
        color: #4a5568 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .status-badge {
        background: rgba(96, 165, 250, 0.15) !important;
        color: #2b6cb0 !important;
        border: 1px solid rgba(96, 165, 250, 0.15) !important;
    }
    .btn {
        color: #2d3748 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .btn-secondary {
        background: rgba(0,0,0,0.04) !important;
        border-color: rgba(0,0,0,0.08) !important;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15) !important;
        border-color: rgba(52, 211, 153, 0.2) !important;
        color: #38a169 !important;
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15) !important;
        border-color: rgba(251, 191, 36, 0.2) !important;
        color: #d69e2e !important;
    }
    .auto-indicator {
        color: #718096 !important;
    }
    .loading-card {
        background: #ffffff !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .loading-text {
        color: #1a202c !important;
    }
    .loading-sub {
        color: #4a5568 !important;
    }
</style>
</head>
<body>

<div class="app-container">

    <header class="slide-header">
        <h1 id="slideTitle">Chargement...</h1>
    </header>

    <main class="slide-body" id="slideBody"></main>

    <!-- LOADING OVERLAY AVEC BOUTON ANNULER -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Préparation vocale...</div>
            <div class="loading-sub" id="loadingSub">Synthèse en cours</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loadingProgressBar"></div>
            </div>
            <div class="loading-timeout" id="loadingTimeout">⏱️ 30 secondes maximum</div>
            <button class="btn-cancel-loading" id="cancelLoadingBtn">
                <span>✕</span> Annuler
            </button>
        </div>
    </div>

    <footer class="slide-footer">
        <div class="footer-top">
            <span class="slide-counter" id="slideCounter">1 / 3</span>
            <span class="status-badge idle" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">Prêt</span>
            </span>
        </div>

        <div class="footer-buttons">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-secondary" id="replayBtn">
                <span class="btn-icon">🔁</span> <span class="btn-label">Relire</span>
            </button>
            <button class="btn btn-play" id="playBtn">
                <span class="btn-icon">▶</span> <span class="btn-label">Play</span>
            </button>
        </div>

        <div class="auto-indicator" id="autoIndicator">⏸ Lecture manuelle</div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // SLIDES
    // ================================================================
    const slides = [
  {
    "titre": "Gestion des Utilisateurs - Admin",
    "contenu": "<div style='font-family: system-ui, -apple-system, sans-serif; color: #0f172a; padding: 0.5rem;'><h2 style='font-size: 1.2rem; color: #1e293b; margin-bottom: 0.8rem;'>👑 Administration des Utilisateurs</h2><div style='background: #f1f5f9; padding: 0.8rem; border-radius: 8px; margin-bottom: 0.5rem;'><h3 style='font-size: 1rem; margin: 0 0 0.3rem 0;'>Objectifs de la leçon</h3><ul style='margin: 0.1rem 0; padding-left: 1.2rem; font-size: 0.9rem;'><li>📋 <strong>UsersListScreen</strong> - Liste des utilisateurs avec filtres et recherche</li><li>➕ <strong>CreateUserScreen</strong> - Création d'utilisateurs avec rôles</li><li>🔒 <strong>Blocage/Déblocage</strong> - Gestion des accès utilisateur</li><li>⚙️ <strong>ConfigScreen</strong> - Paramètres de l'application</li><li>💰 <strong>UpdatePaymentGatewayScreen</strong> - Gestion des passerelles de paiement</li></ul></div><div style='background: #f1f5f9; padding: 0.8rem; border-radius: 8px;'><p style='margin: 0; font-size: 0.85rem;'>🔐 <strong>Rôle Admin</strong> : Accès à tous les écrans d'administration</p></div></div>",
    "texteParle": "Bonjour à tous. Dans cette leçon, nous allons voir comment gérer l'administration des utilisateurs dans notre application Sawamart. Nous allons créer plusieurs écrans : un écran pour lister tous les utilisateurs avec des filtres et une recherche, un écran pour créer de nouveaux utilisateurs avec attribution de rôles, un écran pour gérer les paramètres de l'application comme les limites et les frais, et enfin un écran pour configurer les passerelles de paiement. Ces fonctionnalités sont réservées aux administrateurs de la plateforme.",
    "note": "La gestion des utilisateurs est une fonctionnalité critique pour toute application e-commerce."
  },
  {
    "titre": "UsersListScreen",
    "contenu": "<div style='font-family: system-ui, -apple-system, sans-serif; color: #0f172a; padding: 0.5rem;'><h3 style='font-size: 1.1rem; color: #1e293b; margin-bottom: 0.5rem;'>📋 Liste des Utilisateurs</h3><div style='background: #f1f5f9; padding: 0.8rem; border-radius: 8px;'><p style='margin: 0 0 0.3rem 0; font-size: 0.9rem;'><strong>Fonctionnalités :</strong></p><ul style='margin: 0.1rem 0; padding-left: 1.2rem; font-size: 0.85rem;'><li>🔍 Recherche par nom, téléphone ou email</li><li>📊 Filtres par rôle (Utilisateur, Vendeur, Assistant, Comptable, Admin)</li><li>📅 Filtrage par date d'inscription</li><li>📱 Affichage en grille ou en liste</li><li>🔄 Pull-to-refresh pour rafraîchir</li></ul><pre style='background: #1e293b; color: #e2e8f0; padding: 0.6rem; border-radius: 6px; font-size: 0.65rem; margin: 0.4rem 0;'>// Dans UsersListScreen.tsx\nconst UsersListScreen = () => {\n  const { users, fetchUsers, isLoading, filters, setFilter } = useUserStore();\n  \n  useEffect(() => {\n    fetchUsers();\n  }, []);\n\n  const handleSearch = (query: string) => {\n    setFilter('search', query);\n  };\n\n  return (\n    &lt;View&gt;\n      &lt;SearchBar onChangeText={handleSearch} /&gt;\n      &lt;FilterBar /&gt;\n      &lt;FlatList\n        data={users}\n        renderItem={({ item }) => &lt;UserCard user={item} /&gt;}\n        onRefresh={fetchUsers}\n        refreshing={isLoading}\n      /&gt;\n    &lt;/View&gt;\n  );\n};</pre></div></div>",
    "texteParle": "L'écran de liste des utilisateurs est le tableau de bord principal pour les administrateurs. Il permet de voir tous les utilisateurs inscrits sur la plateforme. L'administrateur peut effectuer une recherche par nom, numéro de téléphone ou email. Il peut aussi filtrer les utilisateurs par leur rôle, par exemple pour afficher seulement les vendeurs ou les assistants. Le chargement des données se fait avec un rafraîchissement par tirage vers le bas, et les résultats peuvent s'afficher en grille ou en liste selon les préférences.",
    "note": "Un bon système de recherche et de filtres est essentiel pour gérer une base d'utilisateurs importante."
  },
  {
    "titre": "Création d'Utilisateur",
    "contenu": "<div style='font-family: system-ui, -apple-system, sans-serif; color: #0f172a; padding: 0.5rem;'><h3 style='font-size: 1.1rem; color: #1e293b; margin-bottom: 0.5rem;'>➕ Créer un Utilisateur</h3><div style='background: #f1f5f9; padding: 0.8rem; border-radius: 8px;'><p style='margin: 0 0 0.3rem 0; font-size: 0.9rem;'><strong>Formulaire de création :</strong></p><ul style='margin: 0.1rem 0; padding-left: 1.2rem; font-size: 0.85rem;'><li>👤 Nom complet</li><li>📱 Numéro de téléphone</li><li>📧 Email (optionnel)</li><li>🔑 Mot de passe</li><li>🎭 Rôle (Admin, Assistant, Comptable, Vendeur, Utilisateur)</li></ul><pre style='background: #1e293b; color: #e2e8f0; padding: 0.6rem; border-radius: 6px; font-size: 0.65rem; margin: 0.4rem 0;'>const CreateUserScreen = () => {\n  const [form, setForm] = useState({ name, phone, email, password, role });\n  const { createUser } = useUserStore();\n\n  const handleSubmit = async () => {\n    try {\n      await createUser(form);\n      Alert.alert('Succès', 'Utilisateur créé avec succès');\n      navigation.goBack();\n    } catch (error) {\n      Alert.alert('Erreur', error.message);\n    }\n  };\n\n  return (\n    &lt;ScrollView&gt;\n      &lt;Input label=\"Nom\" value={form.name} /&gt;\n      &lt;Input label=\"Téléphone\" value={form.phone} /&gt;\n      &lt;Input label=\"Email\" value={form.email} /&gt;\n      &lt;Input label=\"Mot de passe\" secureTextEntry /&gt;\n      &lt;Picker label=\"Rôle\" selectedValue={form.role}&gt;\n        &lt;Picker.Item label=\"Utilisateur\" value=\"user\" /&gt;\n        &lt;Picker.Item label=\"Vendeur\" value=\"seller\" /&gt;\n        &lt;Picker.Item label=\"Assistant\" value=\"assistant\" /&gt;\n        &lt;Picker.Item label=\"Comptable\" value=\"accountant\" /&gt;\n        &lt;Picker.Item label=\"Admin\" value=\"admin\" /&gt;\n      &lt;/Picker&gt;\n      &lt;Button title=\"Créer l'utilisateur\" onPress={handleSubmit} /&gt;\n    &lt;/ScrollView&gt;\n  );\n};</pre></div></div>",
    "texteParle": "L'écran de création d'utilisateur permet à l'administrateur d'ajouter manuellement un nouvel utilisateur sur la plateforme. Le formulaire demande les informations de base comme le nom, le numéro de téléphone, l'email et le mot de passe. L'administrateur peut aussi attribuer un rôle spécifique à l'utilisateur : utilisateur standard, vendeur, assistant, comptable ou administrateur. Une fois le formulaire soumis, l'utilisateur est créé dans la base de données et peut immédiatement se connecter à l'application.",
    "note": "La création manuelle est utile pour les cas où les utilisateurs rencontrent des difficultés d'inscription."
  },
  {
    "titre": "Blocage et Déblocage",
    "contenu": "<div style='font-family: system-ui, -apple-system, sans-serif; color: #0f172a; padding: 0.5rem;'><h3 style='font-size: 1.1rem; color: #1e293b; margin-bottom: 0.5rem;'>🔒 Gestion des Accès</h3><div style='background: #f1f5f9; padding: 0.8rem; border-radius: 8px;'><p style='margin: 0 0 0.3rem 0; font-size: 0.9rem;'><strong>Fonctionnalités de gestion :</strong></p><ul style='margin: 0.1rem 0; padding-left: 1.2rem; font-size: 0.85rem;'><li>🚫 <strong>Bloquer</strong> - L'utilisateur ne peut plus se connecter</li><li>✅ <strong>Débloquer</strong> - Restaurer l'accès à l'utilisateur</li><li>📝 <strong>Motif</strong> - Saisir une raison pour le blocage</li><li>🔔 <strong>Notification</strong> - L'utilisateur reçoit une notification</li></ul><pre style='background: #1e293b; color: #e2e8f0; padding: 0.6rem; border-radius: 6px; font-size: 0.65rem; margin: 0.4rem 0;'>const UserCard = ({ user }) => {\n  const { blockUser, unblockUser } = useUserStore();\n\n  const handleBlock = () => {\n    Alert.alert(\n      'Bloquer l\\'utilisateur',\n      'Voulez-vous vraiment bloquer cet utilisateur ?',\n      [\n        { text: 'Annuler', style: 'cancel' },\n        { \n          text: 'Bloquer', \n          style: 'destructive',\n          onPress: () => blockUser(user.id, 'Motif de blocage')\n        }\n      ]\n    );\n  };\n\n  return (\n    &lt;View style={styles.card}&gt;\n      &lt;Avatar source={{ uri: user.avatar }} /&gt;\n      &lt;Text&gt;{user.name}&lt;/Text&gt;\n      &lt;Text style={styles.role}&gt;{user.role}&lt;/Text&gt;\n      &lt;Text style={user.isBlocked ? styles.blocked : styles.active}&gt;\n        {user.isBlocked ? 'Bloqué' : 'Actif'}\n      &lt;/Text&gt;\n      &lt;Button \n        title={user.isBlocked ? 'Débloquer' : 'Bloquer'}\n        onPress={user.isBlocked ? () => unblockUser(user.id) : handleBlock}\n        color={user.isBlocked ? '#10b981' : '#ef4444'}\n      /&gt;\n    &lt;/View&gt;\n  );\n};</pre></div></div>",
    "texteParle": "La gestion des accès est une fonctionnalité importante pour l'administration. L'administrateur peut bloquer un utilisateur pour diverses raisons, comme des activités suspectes, des violations des conditions d'utilisation ou des plaintes d'autres utilisateurs. L'utilisateur bloqué ne peut plus se connecter à l'application. Un déblocage est également possible pour restaurer l'accès. Pour chaque blocage, l'administrateur peut saisir un motif qui sera enregistré pour traçabilité. L'utilisateur reçoit également une notification pour l'informer de la décision prise.",
    "note": "Le blocage doit être utilisé avec précaution et toujours justifié par une raison valable."
  },
  {
    "titre": "Configuration de l'Application",
    "contenu": "<div style='font-family: system-ui, -apple-system, sans-serif; color: #0f172a; padding: 0.5rem;'><h3 style='font-size: 1.1rem; color: #1e293b; margin-bottom: 0.5rem;'>⚙️ ConfigScreen</h3><div style='background: #f1f5f9; padding: 0.8rem; border-radius: 8px;'><p style='margin: 0 0 0.3rem 0; font-size: 0.9rem;'><strong>Paramètres configurables :</strong></p><ul style='margin: 0.1rem 0; padding-left: 1.2rem; font-size: 0.85rem;'><li>💰 <strong>Frais de séquestre</strong> - Pourcentage prélevé sur les transactions</li><li>📊 <strong>Quota de litiges gratuits</strong> - Nombre de litiges gratuits par utilisateur</li><li>🚚 <strong>Frais de transport</strong> - Tarifs de livraison</li><li>🔒 <strong>Limites de retrait</strong> - Montant maximum par retrait</li><li>📱 <strong>Version de l'application</strong> - Version minimale requise</li></ul><pre style='background: #1e293b; color: #e2e8f0; padding: 0.6rem; border-radius: 6px; font-size: 0.65rem; margin: 0.4rem 0;'>const ConfigScreen = () => {\n  const { config, updateConfig, isLoading } = useConfigStore();\n\n  return (\n    &lt;ScrollView&gt;\n      &lt;Slider\n        label=\"Frais de séquestre\"\n        value={config.escrowFee}\n        min={0}\n        max={10}\n        step={0.5}\n        onValueChange={(val) => updateConfig('escrowFee', val)}\n      /&gt;\n      &lt;Input\n        label=\"Quota litiges gratuits\"\n        value={String(config.freeDisputeQuota)}\n        keyboardType=\"numeric\"\n        onChangeText={(val) => updateConfig('freeDisputeQuota', parseInt(val))}\n      /&gt;\n      &lt;Input\n        label=\"Limite retrait\"\n        value={String(config.maxWithdrawal)}\n        keyboardType=\"numeric\"\n      /&gt;\n      &lt;Button title=\"Sauvegarder\" onPress={saveConfig} /&gt;\n    &lt;/ScrollView>\n  );\n};</pre></div></div>",
    "texteParle": "L'écran de configuration permet à l'administrateur de gérer les paramètres globaux de l'application. On peut y configurer les frais de séquestre, qui sont des pourcentages prélevés sur les transactions pour couvrir les coûts de la plateforme. Le quota de litiges gratuits définit le nombre de litiges qu'un utilisateur peut ouvrir sans frais. Les frais de transport peuvent être personnalisés selon différentes zones géographiques. Les limites de retrait fixent le montant maximum qu'un utilisateur peut retirer en une seule fois. Enfin, on peut aussi définir la version minimale de l'application pour contrôler les mises à jour.",
    "note": "La configuration doit être facile à comprendre pour permettre des ajustements rapides."
  },
  {
    "titre": "Configuration des Passerelles",
    "contenu": "<div style='font-family: system-ui, -apple-system, sans-serif; color: #0f172a; padding: 0.5rem;'><h3 style='font-size: 1.1rem; color: #1e293b; margin-bottom: 0.5rem;'>💰 UpdatePaymentGatewayScreen</h3><div style='background: #f1f5f9; padding: 0.8rem; border-radius: 8px;'><p style='margin: 0 0 0.3rem 0; font-size: 0.9rem;'><strong>Passerelles de paiement :</strong></p><ul style='margin: 0.1rem 0; padding-left: 1.2rem; font-size: 0.85rem;'><li>📱 <strong>Orange Money</strong> - API pour les paiements mobile</li><li>📱 <strong>MTN Mobile Money</strong> - API pour les paiements mobile</li><li>🏦 <strong>Banque</strong> - Virements bancaires</li><li>💳 <strong>Carte bancaire</strong> - Paiements par carte</li></ul><pre style='background: #1e293b; color: #e2e8f0; padding: 0.6rem; border-radius: 6px; font-size: 0.65rem; margin: 0.4rem 0;'>const UpdatePaymentGatewayScreen = () => {\n  const { gateways, updateGateway, toggleGateway, isLoading } = useGatewayStore();\n\n  return (\n    &lt;ScrollView&gt;\n      {gateways.map((gateway) => (\n        &lt;View key={gateway.id} style={styles.gatewayCard}&gt;\n          &lt;Text style={styles.gatewayName}&gt;{gateway.name}&lt;/Text&gt;\n          &lt;Switch\n            value={gateway.isActive}\n            onValueChange={() => toggleGateway(gateway.id)}\n          /&gt;\n          &lt;Input\n            label=\"Clé API\"\n            value={gateway.apiKey}\n            secureTextEntry\n            onChangeText={(val) => updateGateway(gateway.id, 'apiKey', val)}\n          /&gt;\n          &lt;Input\n            label=\"URL de callback\"\n            value={gateway.callbackUrl}\n            onChangeText={(val) => updateGateway(gateway.id, 'callbackUrl', val)}\n          /&gt;\n        &lt;/View&gt;\n      ))}\n      &lt;Button title=\"Sauvegarder\" onPress={saveGateways} /&gt;\n    &lt;/ScrollView>\n  );\n};</pre></div></div>",
    "texteParle": "L'écran de configuration des passerelles de paiement est essentiel pour gérer les moyens de paiement disponibles sur la plateforme. L'administrateur peut activer ou désactiver une passerelle, configurer les clés API nécessaires pour la communication avec les services de paiement comme Orange Money ou MTN Mobile Money, et définir les URL de callback pour recevoir les confirmations de paiement. Une interface propre permet de visualiser d'un coup d'œil toutes les passerelles configurées et leur état. La sauvegarde des modifications envoie les nouvelles configurations au backend.",
    "note": "Les clés API doivent être stockées de manière sécurisée, jamais en clair."
  },
  {
    "titre": "Sécurité et Permissions",
    "contenu": "<div style='font-family: system-ui, -apple-system, sans-serif; color: #0f172a; padding: 0.5rem;'><h3 style='font-size: 1.1rem; color: #1e293b; margin-bottom: 0.5rem;'>🛡️ Sécurité et Permissions</h3><div style='background: #f1f5f9; padding: 0.8rem; border-radius: 8px;'><p style='margin: 0 0 0.3rem 0; font-size: 0.9rem;'><strong>Protection des routes Admin :</strong></p><pre style='background: #1e293b; color: #e2e8f0; padding: 0.6rem; border-radius: 6px; font-size: 0.65rem; margin: 0.4rem 0;'>// Dans le RootNavigator\nconst AdminStack = () => {\n  const { user } = useAuthStore();\n  \n  if (user?.role !== 'admin') {\n    return &lt;AccessDeniedScreen /&gt;;\n  }\n  \n  return (\n    &lt;Stack.Navigator&gt;\n      &lt;Stack.Screen name=\"UsersList\" component={UsersListScreen} /&gt;\n      &lt;Stack.Screen name=\"CreateUser\" component={CreateUserScreen} /&gt;\n      &lt;Stack.Screen name=\"Config\" component={ConfigScreen} /&gt;\n      &lt;Stack.Screen name=\"PaymentGateways\" component={UpdatePaymentGatewayScreen} /&gt;\n    &lt;/Stack.Navigator&gt;\n  );\n};</pre><p style='margin: 0.3rem 0 0 0; font-size: 0.85rem;'><strong>Bonnes pratiques :</strong></p><ul style='margin: 0.1rem 0; padding-left: 1.2rem; font-size: 0.8rem;'><li>🔐 Vérification du rôle côté client ET côté serveur</li><li>📱 Utilisation de <code>RolesGuard</code> pour protéger les routes</li><li>🔒 Stockage sécurisé du token JWT</li><li>🚫 Affichage d'une page d'accès refusé</li></ul></div></div>",
    "texteParle": "La sécurité est primordiale pour les fonctionnalités d'administration. Toutes les routes admin doivent être protégées par une vérification du rôle de l'utilisateur. Cette vérification doit se faire à la fois côté client, dans la navigation, pour masquer les écrans, et côté serveur pour valider chaque requête. Si un utilisateur non admin tente d'accéder à une route admin, on affiche une page d'accès refusé. On utilise également des guards comme RolesGuard pour une protection supplémentaire. Le token JWT est stocké de manière sécurisée, par exemple avec SecureStore pour les données sensibles.",
    "note": "La sécurité par défaut est essentielle pour protéger les données et les fonctionnalités sensibles."
  },
  {
    "titre": "Bonnes Pratiques Admin",
    "contenu": "<div style='font-family: system-ui, -apple-system, sans-serif; color: #0f172a; padding: 0.5rem;'><h3 style='font-size: 1.1rem; color: #1e293b; margin-bottom: 0.5rem;'>✅ Bonnes Pratiques</h3><div style='background: #f1f5f9; padding: 0.8rem; border-radius: 8px;'><ul style='margin: 0.1rem 0; padding-left: 1.2rem; font-size: 0.9rem;'><li>📊 <strong>Pagination</strong> - Charger les utilisateurs par lots pour les performances</li><li>🔍 <strong>Recherche optimisée</strong> - Utiliser des index en base de données</li><li>📱 <strong>UI responsive</strong> - Adapter l'affichage pour toutes les tailles d'écran</li><li>🔄 <strong>Rafraîchissement</strong> - Pull-to-refresh pour mettre à jour les données</li><li>🔔 <strong>Notifications</strong> - Avertir les utilisateurs des changements</li><li>📝 <strong>Journalisation</strong> - Enregistrer toutes les actions admin</li></ul></div><div style='background: #f1f5f9; padding: 0.8rem; border-radius: 8px; margin-top: 0.5rem;'><h4 style='margin: 0 0 0.3rem 0; font-size: 1rem;'>📌 Récapitulatif</h4><ul style='margin: 0.1rem 0; padding-left: 1.2rem; font-size: 0.85rem;'><li>✅ UsersListScreen : Liste et recherche d'utilisateurs</li><li>✅ CreateUserScreen : Création avec rôles</li><li>✅ Blocage/Déblocage : Gestion des accès</li><li>✅ ConfigScreen : Paramètres de l'application</li><li>✅ PaymentGateways : Configuration des paiements</li></ul></div></div>",
    "texteParle": "Pour terminer cette leçon, je vais récapituler les bonnes pratiques pour l'administration. Pour les performances, il est important d'utiliser la pagination pour charger les utilisateurs par lots plutôt que tous à la fois. La recherche doit être optimisée avec des index en base de données. L'interface doit s'adapter à toutes les tailles d'écran, car les administrateurs peuvent utiliser différents appareils. Le rafraîchissement des données se fait par tirage vers le bas. L'administrateur doit être notifié des changements importants. Enfin, toutes les actions doivent être journalisées pour assurer la traçabilité et la sécurité.",
    "note": "Une bonne administration nécessite une attention particulière à la performance et à la sécurité."
  }
];

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentIndex = 0;
    let isSpeaking = false;
    let isPaused = false;
    let currentUtterance = null;
    let isLoading = false;
    let loadingTimeout = null;
    let isTransitioning = false;
    let speechSupported = true;
    let userInteracted = false;
    let isPlaying = false;
    let loadingCancelled = false;

    const total = slides.length;
    const synth = window.speechSynthesis;

    // Références jQuery
    const $title = $('#slideTitle');
    const $body = $('#slideBody');
    const $counter = $('#slideCounter');
    const $statusText = $('#statusText');
    const $statusBadge = $('#statusBadge');
    const $loading = $('#loadingOverlay');
    const $loadingText = $('#loadingText');
    const $loadingSub = $('#loadingSub');
    const $loadingTimeout = $('#loadingTimeout');
    const $loadingProgressBar = $('#loadingProgressBar');
    const $autoIndicator = $('#autoIndicator');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $replay = $('#replayBtn');
    const $play = $('#playBtn');
    const $cancelLoading = $('#cancelLoadingBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function setStatus(text, type) {
        $statusText.text(text);
        $statusBadge.removeClass('idle speaking error paused waiting loading');
        if (type === 'speaking') $statusBadge.addClass('speaking');
        else if (type === 'error') $statusBadge.addClass('error');
        else if (type === 'paused') $statusBadge.addClass('paused');
        else if (type === 'waiting') $statusBadge.addClass('waiting');
        else if (type === 'loading') $statusBadge.addClass('loading');
        else $statusBadge.addClass('idle');
    }

    function updatePlayButton() {
        if (isPlaying) {
            $play.addClass('playing');
            $play.find('.btn-icon').text('⏸');
            $play.find('.btn-label').text('Pause');
        } else {
            $play.removeClass('playing');
            $play.find('.btn-icon').text('▶');
            $play.find('.btn-label').text('Play');
        }
    }

    function showLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        
        loadingCancelled = false;
        isLoading = true;
        
        // Réinitialiser la barre de progression
        $loadingProgressBar.css('animation', 'none');
        $loadingProgressBar.css('width', '0%');
        // Forcer un reflow
        $loadingProgressBar[0].offsetHeight;
        $loadingProgressBar.css('animation', 'loadingProgress 30s ease-out forwards');
        
        $loadingText.text('Préparation vocale...');
        $loadingSub.text('Synthèse en cours');
        $loadingTimeout.text('⏱️ 30 secondes maximum');
        $loading.fadeIn(300);
        setStatus("⏳ Chargement...", 'loading');
        
        // 🔥 TIMEOUT DE 30 SECONDES
        loadingTimeout = setTimeout(() => {
            if (isLoading && !loadingCancelled) {
                hideLoading();
                setStatus("⚠️ Délai dépassé (30s)", 'error');
                isPlaying = false;
                updatePlayButton();
                $loadingSub.text('La synthèse vocale a pris trop de temps');
                $loadingTimeout.text('❌ Délai dépassé');
            }
        }, 30000);
    }

    function hideLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        isLoading = false;
        loadingCancelled = false;
        $loading.fadeOut(300);
        // Ne pas changer le statut si on est en train de parler
        if (!isSpeaking && !isPlaying) {
            setStatus("⏸ Lecture arrêtée", 'paused');
        }
    }

    function cancelLoading() {
        loadingCancelled = true;
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        hideLoading();
        stopSpeaking();
        setStatus("⏸ Annulé", 'paused');
        isPlaying = false;
        updatePlayButton();
        $loadingText.text('Annulé par l\'utilisateur');
        $loadingSub.text('Vous pouvez réessayer');
        $loadingTimeout.text('✕ Annulation');
    }

    // Arrêter la parole proprement
    function stopSpeaking() {
        try {
            if (synth && (synth.speaking || synth.pending)) {
                synth.cancel();
            }
        } catch(e) {
            console.warn('Erreur stopSpeaking:', e);
        }
        if (currentUtterance) {
            try {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance.onstart = null;
            } catch(e) {}
            currentUtterance = null;
        }
        isSpeaking = false;
        isPlaying = false;
        updatePlayButton();
    }

    // Mettre en pause la parole
    function pauseSpeaking() {
        try {
            if (synth && synth.speaking) {
                synth.pause();
                isPaused = true;
                isPlaying = false;
                setStatus("⏸ Lecture en pause", 'paused');
                updatePlayButton();
            }
        } catch(e) {
            console.warn('Erreur pauseSpeaking:', e);
            stopSpeaking();
        }
    }

    // Reprendre la parole
    function resumeSpeaking() {
        try {
            if (synth && synth.paused) {
                synth.resume();
                isPaused = false;
                isPlaying = true;
                setStatus("🔊 Lecture en cours", 'speaking');
                updatePlayButton();
            } else if (!isSpeaking && !synth.speaking && !synth.pending) {
                speakSlide(currentIndex);
            }
        } catch(e) {
            console.warn('Erreur resumeSpeaking:', e);
            speakSlide(currentIndex);
        }
    }

    function renderSlide(index) {
        const slide = slides[index];
        $title.text(slide.titre);

        let html = '';
        html += `<div class="content-card">${slide.contenu}</div>`;
        if (slide.note) {
            html += `<div class="note-box">${slide.note}</div>`;
        }
        $body.html(html);
        $counter.text(`${index+1} / ${total}`);

        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
        }
    }

    // ================================================================
    // LECTURE VOCALE
    // ================================================================
    function speakSlide(index) {
        return new Promise((resolve) => {
            const slide = slides[index];
            const text = slide.texteParle;
            
            if (!text || text.trim() === '' || !speechSupported) {
                resolve();
                return;
            }

            if (!window.speechSynthesis) {
                setStatus("❌ Synthèse vocale non supportée", 'error');
                speechSupported = false;
                resolve();
                return;
            }

            // Arrêter toute lecture en cours
            stopSpeaking();
            
            // Réinitialiser l'état de pause
            isPaused = false;
            
            showLoading();
            setStatus("Initialisation...", 'loading');

            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.92;
                utterance.pitch = 1.05;
                utterance.volume = 1;

                let isFinished = false;
                let errorHandled = false;

                utterance.onstart = function() {
                    if (loadingCancelled) {
                        stopSpeaking();
                        resolve();
                        return;
                    }
                    hideLoading();
                    isSpeaking = true;
                    isPlaying = true;
                    isPaused = false;
                    setStatus("🔊 Lecture en cours", 'speaking');
                    updatePlayButton();
                };

                utterance.onend = function() {
                    if (isFinished) return;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    setStatus("✅ Terminé", 'idle');
                    hideLoading();
                    updatePlayButton();
                    resolve();
                };

                utterance.onerror = function(e) {
                    if (isFinished || errorHandled) return;
                    errorHandled = true;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    hideLoading();
                    updatePlayButton();
                    
                    if (e.error === 'not-allowed') {
                        setStatus("⚠️ Permission refusée", 'error');
                    } else if (e.error === 'synthesis-unavailable') {
                        setStatus("⚠️ Synthèse indisponible", 'error');
                    } else if (e.error === 'canceled') {
                        setStatus("⏸ Annulé", 'paused');
                    } else {
                        setStatus("❌ Erreur audio: " + (e.error || 'inconnue'), 'error');
                    }
                    
                    resolve();
                };

                // Gestion du chargement des voix
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = function() {
                        if (!loadingCancelled) {
                            try {
                                synth.speak(utterance);
                            } catch(err) {
                                // Silencieux
                            }
                        }
                        synth.onvoiceschanged = null;
                    };
                }

                currentUtterance = utterance;
                
                if (!loadingCancelled) {
                    try {
                        synth.speak(utterance);
                    } catch(err) {
                        setTimeout(() => {
                            if (!loadingCancelled) {
                                try {
                                    synth.speak(utterance);
                                } catch(e) {
                                    setStatus("❌ Erreur de lecture", 'error');
                                    isPlaying = false;
                                    updatePlayButton();
                                    hideLoading();
                                    resolve();
                                }
                            } else {
                                resolve();
                            }
                        }, 100);
                    }
                } else {
                    resolve();
                }

            } catch(err) {
                hideLoading();
                setStatus("❌ Erreur générale", 'error');
                isPlaying = false;
                updatePlayButton();
                console.error('Erreur speakSlide:', err);
                resolve();
            }
        });
    }

    // ================================================================
    // NAVIGATION
    // ================================================================
    async function goToSlide(index) {
        if (isTransitioning) return;
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        
        // Si on est en train de lire, on met en pause avant de naviguer
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        // Arrêter complètement la lecture
        stopSpeaking();
        
        await new Promise(r => setTimeout(r, 50));
        
        if (index === currentIndex) {
            setStatus("📄 Slide actuel", 'idle');
            return;
        }

        isTransitioning = true;
        currentIndex = index;
        renderSlide(index);
        
        // Réinitialiser l'état de lecture
        isPlaying = false;
        updatePlayButton();
        setStatus("⏸ Lecture arrêtée", 'paused');

        await new Promise(r => setTimeout(r, 150));
        isTransitioning = false;
    }

    async function goToNext() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex + 1 < total) {
            await goToSlide(currentIndex + 1);
        } else {
            setStatus("🏁 Dernier slide", 'idle');
        }
    }

    async function goToPrev() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex - 1 >= 0) {
            await goToSlide(currentIndex - 1);
        } else {
            setStatus("🔁 Premier slide", 'idle');
        }
    }

    // ================================================================
    // GESTION PLAY/PAUSE
    // ================================================================
    function togglePlay() {
        if (!userInteracted) {
            userInteracted = true;
        }

        // Si le chargement est en cours, on l'annule
        if (isLoading) {
            cancelLoading();
            return;
        }

        // Si le synthétiseur est en pause, on reprend
        if (synth && synth.paused) {
            resumeSpeaking();
            return;
        }

        // Si la lecture est en cours, on met en pause
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
            return;
        }

        // Sinon, on démarre la lecture du slide courant
        if (!isSpeaking && !isPlaying) {
            stopSpeaking();
            speakSlide(currentIndex);
        }
    }

    // ================================================================
    // INIT
    // ================================================================
    async function init() {
        // Vérifier la compatibilité
        if (!window.speechSynthesis) {
            setStatus("❌ Synthèse vocale non supportée", 'error');
            speechSupported = false;
        }

        // Précharger les voix
        try {
            if (synth.getVoices) {
                synth.getVoices();
                setTimeout(() => {
                    try {
                        synth.getVoices();
                    } catch(e) {}
                }, 200);
            }
        } catch(e) {
            console.warn('Erreur chargement voix:', e);
        }

        // Afficher le premier slide
        renderSlide(0);
        $counter.text(`1 / ${total}`);
        
        // État initial
        setStatus("⏸ Appuie sur Play", 'paused');
        updatePlayButton();
        $autoIndicator.text('⏸ Lecture manuelle');

        // ================================================================
        // ÉVÉNEMENTS
        // ================================================================
        
        // Bouton Play/Pause
        $play.on('click', function() {
            togglePlay();
        });

        // Bouton Annuler le chargement
        $cancelLoading.on('click', function() {
            cancelLoading();
        });

        // Navigation
        $prev.on('click', function() {
            // Si chargement en cours, on annule
            if (isLoading) cancelLoading();
            goToPrev();
        });

        $next.on('click', function() {
            if (isLoading) cancelLoading();
            goToNext();
        });

        // Replay - relire le slide courant
        $replay.on('click', function() {
            if (isLoading) cancelLoading();
            stopSpeaking();
            setTimeout(() => {
                speakSlide(currentIndex);
            }, 100);
        });

        // Support du clavier (espace pour play/pause)
        $(document).on('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });

        // Nettoyage
        $(window).on('beforeunload', function() {
            try {
                if (synth.speaking) synth.cancel();
            } catch(e) {}
            hideLoading();
        });

        // Gérer les cas où la synthèse se termine de manière inattendue
        setInterval(() => {
            if (isPlaying && !synth.speaking && !synth.pending && !isPaused && !isLoading) {
                isPlaying = false;
                updatePlayButton();
                setStatus("⏸ Lecture arrêtée", 'paused');
            }
        }, 1000);
    }

    init();
});



    // ================================================================
    // GESTION DU THÈME JOUR/NUIT
    // ================================================================
    let isDarkMode = false;

    function toggleTheme() {
        isDarkMode = !isDarkMode;
        const body = document.body;
        const appContainer = document.querySelector('.app-container');
        const header = document.querySelector('.slide-header');
        const footer = document.querySelector('.slide-footer');
        const contentCards = document.querySelectorAll('.content-card');
        const noteBoxes = document.querySelectorAll('.note-box');
        const mathBlocks = document.querySelectorAll('.math-block');
        const buttons = document.querySelectorAll('.btn');
        const statusBadge = document.querySelector('.status-badge');
        const slideCounter = document.querySelector('.slide-counter');
        const autoIndicator = document.querySelector('.auto-indicator');
        const themeBtn = document.getElementById('themeToggle');

        if (isDarkMode) {
            // Mode nuit
            body.style.background = '#0b1120';
            body.style.color = '#f1f5f9';
            appContainer.style.background = 'linear-gradient(145deg, #0f172a 0%, #1e293b 100%)';
            header.style.background = 'rgba(15, 23, 42, 0.85)';
            footer.style.background = 'rgba(15, 23, 42, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.05)';
                card.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.08)';
                note.style.color = '#cbd5e1';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.25)';
                block.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#e2e8f0';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.12)';
                statusBadge.style.color = '#93bbfc';
            }
            if (slideCounter) {
                slideCounter.style.color = '#94a3b8';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#64748b';
            }
            if (themeBtn) {
                themeBtn.textContent = '☀️';
                themeBtn.title = 'Passer en mode jour';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#e2e8f0';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#e2e8f0';
                }
            });
        } else {
            // Mode jour (par défaut)
            body.style.background = '#f0f4f8';
            body.style.color = '#1a202c';
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
            header.style.background = 'rgba(255, 255, 255, 0.85)';
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.8)';
                card.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.12)';
                note.style.color = '#2c3e50';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.05)';
                block.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#2d3748';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
                statusBadge.style.color = '#2b6cb0';
            }
            if (slideCounter) {
                slideCounter.style.color = '#4a5568';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#718096';
            }
            if (themeBtn) {
                themeBtn.textContent = '🌓';
                themeBtn.title = 'Passer en mode nuit';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#2c3e50';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#2d3748';
                }
            });
        }
    }

    // Initialiser en mode jour
    document.addEventListener('DOMContentLoaded', function() {
        // Appliquer le mode jour par défaut
        const body = document.body;
        body.style.background = '#f0f4f8';
        body.style.color = '#1a202c';
        
        const appContainer = document.querySelector('.app-container');

            note.style.color = '#2c3e50';

        if (statusBadge) {

        }
        
        const slideCounter = document.querySelector('.slide-counter');
        if (slideCounter) {

        }
        
        const autoIndicator = document.querySelector('.auto-indicator');
        if (autoIndicator) {
            autoIndicator.style.color = '#718096';
        }
        
        document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
            if (!el.closest('.note-box')) {
                el.style.color = '#2c3e50';
            }
        });
        
        document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
            if (!el.closest('.note-box') && !el.closest('.math-block')) {
                el.style.color = '#2d3748';
            }
        });
        
        const themeBtn = document.getElementById('themeToggle');
        if (themeBtn) {
            themeBtn.textContent = '🌓';
            themeBtn.title = 'Passer en mode nuit';
        }
    });
</script>
