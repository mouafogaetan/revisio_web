<html lang="fr">

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 500px;
        margin: 0 auto;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    .slide-header {
        flex-shrink: 0;
        padding: 18px 16px 10px 16px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        z-index: 10;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .slide-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
    }

    .content-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 18px 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        flex-shrink: 0;
    }

    .content-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .content-card li {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        line-height: 1.5;
    }

    .content-card li:last-child {
        border-bottom: none;
    }

    .bullet-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
    }

    .math-block {
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        overflow-x: auto;
        flex-shrink: 0;
        margin: 4px 0;
    }

    .math-block .math {
        font-size: 1.2rem;
        color: #e2e8f0;
    }

    .note-box {
        background: rgba(96, 165, 250, 0.08);
        border-left: 4px solid #60a5fa;
        padding: 12px 16px;
        border-radius: 12px;
        font-style: italic;
        font-size: 0.9rem;
        color: #cbd5e1;
        flex-shrink: 0;
    }

    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        border-radius: 0;
        flex-direction: column;
    }

    .loading-card {
        background: #1e293b;
        padding: 32px 28px;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #334155;
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px auto;
    }

    .loading-text {
        font-weight: 600;
        font-size: 1.1rem;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    .loading-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 16px;
    }
    .loading-progress {
        height: 3px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        animation: loadingProgress 30s ease-out forwards;
    }

    .loading-timeout {
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 12px;
    }

    .btn-cancel-loading {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 40px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #f87171;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }

    .btn-cancel-loading:active {
        transform: scale(0.94);
        background: rgba(239, 68, 68, 0.25);
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
    }

    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .slide-counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255,255,255,0.05);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(255,255,255,0.04);
    }

    .status-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 30px;
        background: rgba(96, 165, 250, 0.12);
        color: #93bbfc;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
    }

    .status-badge .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: pulse-dot 1.2s infinite;
        flex-shrink: 0;
    }

    .status-badge.idle .dot {
        animation: none;
        background: #64748b;
    }
    .status-badge.speaking .dot {
        background: #34d399;
        animation: pulse-dot 0.8s infinite;
    }
    .status-badge.error .dot {
        background: #f87171;
        animation: none;
    }
    .status-badge.paused .dot {
        animation: none;
        background: #fbbf24;
    }
    .status-badge.waiting .dot {
        animation: pulse-dot 1.5s infinite;
        background: #fbbf24;
    }
    .status-badge.loading .dot {
        animation: pulse-dot 0.5s infinite;
        background: #60a5fa;
    }

    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.7); }
    }

    .footer-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(255,255,255,0.1);
    }

    .btn-secondary {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-play {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
        min-width: 80px;
        justify-content: center;
    }
    .btn-play:active {
        background: rgba(52, 211, 153, 0.25);
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
    }

    .auto-indicator {
        font-size: 0.65rem;
        color: #64748b;
        text-align: center;
        letter-spacing: 0.3px;
        padding: 2px 0;
    }

    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.2rem;
        }
        .content-card li {
            font-size: 0.9rem;
            padding: 8px 0;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .btn-play {
            min-width: 60px;
        }
        .footer-buttons {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
        .loading-card {
            padding: 20px 16px;
        }
        .math-block .math {
            font-size: 1rem;
        }
    }

    @media (min-width: 600px) {
        .app-container {
            max-width: 480px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
        .loading-overlay {
            border-radius: 32px;
        }
    }

    /* Mode jour (par défaut) */
    html, body {
        background: #f0f4f8 !important;
        color: #1a202c !important;
    }
    .app-container {
        background: linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%) !important;
    }
    .slide-header {
        background: rgba(255, 255, 255, 0.85) !important;
        border-bottom: 1px solid rgba(0,0,0,0.08) !important;
    }
    .slide-header h1 {
        background: linear-gradient(135deg, #2b6cb0, #6b46c1) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        background-clip: text !important;
    }
    .slide-footer {
        background: rgba(255, 255, 255, 0.9) !important;
        border-top: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card {
        background: rgba(255,255,255,0.8) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card li {
        border-bottom: 1px solid rgba(0,0,0,0.05) !important;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.12) !important;
        border-left: 4px solid #4299e1 !important;
        color: #2c3e50 !important;
    }
    .math-block {
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .math-block .math {
        color: #2d3748 !important;
    }
    .slide-counter {
        color: #4a5568 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .status-badge {
        background: rgba(96, 165, 250, 0.15) !important;
        color: #2b6cb0 !important;
        border: 1px solid rgba(96, 165, 250, 0.15) !important;
    }
    .btn {
        color: #2d3748 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .btn-secondary {
        background: rgba(0,0,0,0.04) !important;
        border-color: rgba(0,0,0,0.08) !important;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15) !important;
        border-color: rgba(52, 211, 153, 0.2) !important;
        color: #38a169 !important;
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15) !important;
        border-color: rgba(251, 191, 36, 0.2) !important;
        color: #d69e2e !important;
    }
    .auto-indicator {
        color: #718096 !important;
    }
    .loading-card {
        background: #ffffff !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .loading-text {
        color: #1a202c !important;
    }
    .loading-sub {
        color: #4a5568 !important;
    }
</style>
</head>
<body>

<div class="app-container">

    <header class="slide-header">
        <h1 id="slideTitle">Chargement...</h1>
    </header>

    <main class="slide-body" id="slideBody"></main>

    <!-- LOADING OVERLAY AVEC BOUTON ANNULER -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Préparation vocale...</div>
            <div class="loading-sub" id="loadingSub">Synthèse en cours</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loadingProgressBar"></div>
            </div>
            <div class="loading-timeout" id="loadingTimeout">⏱️ 30 secondes maximum</div>
            <button class="btn-cancel-loading" id="cancelLoadingBtn">
                <span>✕</span> Annuler
            </button>
        </div>
    </div>

    <footer class="slide-footer">
        <div class="footer-top">
            <span class="slide-counter" id="slideCounter">1 / 3</span>
            <span class="status-badge idle" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">Prêt</span>
            </span>
        </div>

        <div class="footer-buttons">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-secondary" id="replayBtn">
                <span class="btn-icon">🔁</span> <span class="btn-label">Relire</span>
            </button>
            <button class="btn btn-play" id="playBtn">
                <span class="btn-icon">▶</span> <span class="btn-label">Play</span>
            </button>
        </div>

        <div class="auto-indicator" id="autoIndicator">⏸ Lecture manuelle</div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // SLIDES
    // ================================================================
    const slides = [
  {
    "titre": "Résilience et Offline",
    "contenu": "<div style='font-family: system-ui, -apple-system, sans-serif; color: #0f172a; padding: 0.5rem;'><h2 style='font-size: 1.2rem; color: #1e293b; margin-bottom: 0.8rem;'>📶 Application Résiliente et Hors Ligne</h2><div style='background: #f1f5f9; padding: 0.8rem; border-radius: 8px; margin-bottom: 0.5rem;'><h3 style='font-size: 1rem; margin: 0 0 0.3rem 0;'>Objectifs de la leçon</h3><ul style='margin: 0.1rem 0; padding-left: 1.2rem; font-size: 0.9rem;'><li>📦 <strong>offlineQueue</strong> - File d'attente avec AsyncStorage</li><li>💾 <strong>Stockage local</strong> - Sauvegarde des messages hors ligne</li><li>🔄 <strong>Reconnexion</strong> - Vidage automatique de la file</li><li>🔔 <strong>Indicateurs</strong> - Badge pour messages en attente</li><li>⏱️ <strong>Retry et Timeout</strong> - Gestion des appels API</li></ul></div><div style='background: #f1f5f9; padding: 0.8rem; border-radius: 8px;'><p style='margin: 0; font-size: 0.85rem;'>🌍 <strong>Contexte</strong> : Au Cameroun, la connexion internet peut être instable. L'application doit continuer à fonctionner.</p></div></div>",
    "texteParle": "Bonjour à tous. Dans cette leçon, nous allons voir comment rendre notre application résiliente aux problèmes de réseau. Au Cameroun, la connexion internet peut parfois être instable, surtout dans certaines zones. Il est donc essentiel que notre application mobile continue à fonctionner même hors ligne. Nous allons mettre en place un système de file d'attente avec AsyncStorage pour stocker les messages envoyés hors ligne, gérer automatiquement la reconnexion, afficher des indicateurs visuels pour les messages en attente, et configurer des mécanismes de retry et de timeout pour les appels API. Ces fonctionnalités amélioreront considérablement l'expérience utilisateur.",
    "note": "La résilience est essentielle pour les applications mobiles au Cameroun."
  },
  {
    "titre": "File d'attente hors ligne",
    "contenu": "<div style='font-family: system-ui, -apple-system, sans-serif; color: #0f172a; padding: 0.5rem;'><h3 style='font-size: 1.1rem; color: #1e293b; margin-bottom: 0.5rem;'>📦 offlineQueue Service</h3><div style='background: #f1f5f9; padding: 0.8rem; border-radius: 8px;'><p style='margin: 0 0 0.3rem 0; font-size: 0.9rem;'><strong>Fonctionnalités :</strong></p><ul style='margin: 0.1rem 0; padding-left: 1.2rem; font-size: 0.85rem;'><li>💾 Stockage des messages dans AsyncStorage</li><li>📋 File d'attente FIFO</li><li>🔄 Replay automatique à la reconnexion</li><li>📊 Compteur des éléments en attente</li><li>🗑️ Suppression après succès</li></ul><pre style='background: #1e293b; color: #e2e8f0; padding: 0.6rem; border-radius: 6px; font-size: 0.65rem; margin: 0.4rem 0;'>// services/offlineQueue.ts\nimport AsyncStorage from '@react-native-async-storage/async-storage';\n\nexport class OfflineQueue {\n  private static readonly QUEUE_KEY = '@offline_queue';\n\n  static async addToQueue(item: any): Promise<void> {\n    const queue = await this.getQueue();\n    queue.push(item);\n    await AsyncStorage.setItem(this.QUEUE_KEY, JSON.stringify(queue));\n  }\n\n  static async getQueue(): Promise<any[]> {\n    const data = await AsyncStorage.getItem(this.QUEUE_KEY);\n    return data ? JSON.parse(data) : [];\n  }\n\n  static async removeFromQueue(index: number): Promise<void> {\n    const queue = await this.getQueue();\n    queue.splice(index, 1);\n    await AsyncStorage.setItem(this.QUEUE_KEY, JSON.stringify(queue));\n  }\n\n  static async clearQueue(): Promise<void> {\n    await AsyncStorage.removeItem(this.QUEUE_KEY);\n  }\n\n  static async processQueue(processFn: (item: any) => Promise<void>): Promise<void> {\n    const queue = await this.getQueue();\n    for (let i = 0; i < queue.length; i++) {\n      try {\n        await processFn(queue[i]);\n        await this.removeFromQueue(i);\n        i--; // Ajuster l'index après suppression\n      } catch (error) {\n        // Si l'élément échoue, on passe au suivant\n        console.log('Échec du traitement de l\\'élément', error);\n      }\n    }\n  }\n}</pre></div></div>",
    "texteParle": "Le service offlineQueue est le cœur de notre système de résilience. Il utilise AsyncStorage pour stocker une file d'attente de messages qui n'ont pas pu être envoyés à cause d'un problème de connexion. La file d'attente fonctionne en mode FIFO, c'est-à-dire que les premiers messages entrés seront les premiers à être traités. Lorsque la connexion est rétablie, la file d'attente est automatiquement vidée. Nous avons aussi des méthodes pour ajouter, récupérer, supprimer et vider complètement la file d'attente. Le compteur d'éléments en attente permet à l'interface d'afficher un badge pour informer l'utilisateur.",
    "note": "AsyncStorage est persistant même après la fermeture de l'application."
  },
  {
    "titre": "Gestion des messages hors ligne",
    "contenu": "<div style='font-family: system-ui, -apple-system, sans-serif; color: #0f172a; padding: 0.5rem;'><h3 style='font-size: 1.1rem; color: #1e293b; margin-bottom: 0.5rem;'>💬 Messages Hors Ligne</h3><div style='background: #f1f5f9; padding: 0.8rem; border-radius: 8px;'><p style='margin: 0 0 0.3rem 0; font-size: 0.9rem;'><strong>Processus d'envoi :</strong></p><ol style='margin: 0.1rem 0; padding-left: 1.2rem; font-size: 0.85rem;'><li>L'utilisateur envoie un message</li><li>L'application tente d'envoyer via WebSocket</li><li>Si échec → ajout à la file d'attente</li><li>Le message est affiché avec un statut 'en attente'</li><li>À la reconnexion, la file est vidée</li></ol><pre style='background: #1e293b; color: #e2e8f0; padding: 0.6rem; border-radius: 6px; font-size: 0.65rem; margin: 0.4rem 0;'>// Dans ChatScreen\nconst sendMessage = async (content: string) => {\n  const message = {\n    chatId,\n    content,\n    senderId: user.id,\n    status: 'sending',\n    createdAt: new Date(),\n  };\n\n  // Mise à jour optimiste\n  chatStore.addMessage({ ...message, id: `temp-${Date.now()}` });\n\n  try {\n    if (networkStore.isConnected) {\n      socket.emit('send_message', message);\n    } else {\n      // Hors ligne - ajouter à la file d'attente\n      await OfflineQueue.addToQueue({\n        type: 'message',\n        data: message,\n        timestamp: Date.now(),\n      });\n      // Mettre à jour le statut du message\n      chatStore.updateMessageStatus(message.id, 'pending');\n    }\n  } catch (error) {\n    // Erreur - ajouter à la file d'attente\n    await OfflineQueue.addToQueue({\n      type: 'message',\n      data: message,\n      timestamp: Date.now(),\n    });\n    chatStore.updateMessageStatus(message.id, 'pending');\n  }\n};</pre></div></div>",
    "texteParle": "Lorsqu'un utilisateur envoie un message et que la connexion est disponible, le message est envoyé normalement via WebSocket. Si la connexion est absente ou si l'envoi échoue, le message est ajouté à la file d'attente offlineQueue. Dans l'interface, le message apparaît avec un statut 'en attente' pour informer l'utilisateur qu'il n'a pas encore été envoyé. Dès que la connexion est rétablie, la file d'attente est automatiquement traitée. Chaque message est envoyé un par un, et une fois envoyé avec succès, il est retiré de la file d'attente et son statut dans l'interface est mis à jour.",
    "note": "L'utilisateur doit toujours savoir si son message a été envoyé ou non."
  },
  {
    "titre": "Détection de la connexion",
    "contenu": "<div style='font-family: system-ui, -apple-system, sans-serif; color: #0f172a; padding: 0.5rem;'><h3 style='font-size: 1.1rem; color: #1e293b; margin-bottom: 0.5rem;'>📶 Détection Réseau</h3><div style='background: #f1f5f9; padding: 0.8rem; border-radius: 8px;'><p style='margin: 0 0 0.3rem 0; font-size: 0.9rem;'><strong>Suivi de la connexion :</strong></p><ul style='margin: 0.1rem 0; padding-left: 1.2rem; font-size: 0.85rem;'><li>📱 <code>NetInfo</code> pour détecter l'état réseau</li><li>🔄 Événements de changement de connexion</li><li>📊 Store réseau pour partager l'état</li><li>🔔 Notifications de reconnexion</li></ul><pre style='background: #1e293b; color: #e2e8f0; padding: 0.6rem; border-radius: 6px; font-size: 0.65rem; margin: 0.4rem 0;'>// networkStore.ts\nimport { create } from 'zustand';\nimport NetInfo from '@react-native-community/netinfo';\n\ninterface NetworkState {\n  isConnected: boolean;\n  isInternetReachable: boolean;\n  type: string | null;\n  setConnected: (isConnected: boolean) => void;\n}\n\nexport const useNetworkStore = create<NetworkState>((set) => ({\n  isConnected: true,\n  isInternetReachable: true,\n  type: null,\n  setConnected: (isConnected) => set({ isConnected }),\n}));\n\n// Dans App.tsx\nuseEffect(() => {\n  const unsubscribe = NetInfo.addEventListener(state => {\n    const isConnected = state.isConnected && state.isInternetReachable;\n    useNetworkStore.getState().setConnected(isConnected);\n    \n    if (isConnected) {\n      // Vider la file d'attente\n      OfflineQueue.processQueue(processOfflineItem);\n    }\n  });\n  \n  return unsubscribe;\n}, []);</pre></div></div>",
    "texteParle": "Pour détecter l'état de la connexion, nous utilisons la bibliothèque NetInfo. Elle nous permet de savoir si l'appareil est connecté à un réseau et si Internet est accessible. Nous écoutons les changements de connexion en temps réel. Lorsque la connexion est établie ou rétablie, nous mettons à jour notre store réseau qui partage l'état avec toute l'application. Le store peut être utilisé par les composants pour adapter l'interface utilisateur, par exemple pour afficher un message d'erreur ou désactiver certains boutons. À chaque reconnexion, nous vidons automatiquement la file d'attente des messages hors ligne.",
    "note": "NetInfo est aussi disponible pour React Native Web."
  },
  {
    "titre": "Indicateurs de statut",
    "contenu": "<div style='font-family: system-ui, -apple-system, sans-serif; color: #0f172a; padding: 0.5rem;'><h3 style='font-size: 1.1rem; color: #1e293b; margin-bottom: 0.5rem;'>🔔 Indicateurs de Statut</h3><div style='background: #f1f5f9; padding: 0.8rem; border-radius: 8px;'><p style='margin: 0 0 0.3rem 0; font-size: 0.9rem;'><strong>Affichage des statuts :</strong></p><ul style='margin: 0.1rem 0; padding-left: 1.2rem; font-size: 0.85rem;'><li>🟡 <strong>En attente</strong> - Message en file d'attente</li><li>🟢 <strong>Envoyé</strong> - Message envoyé avec succès</li><li>🔵 <strong>Lu</strong> - Message lu par le destinataire</li><li>🔴 <strong>Échec</strong> - Message non envoyé (problème persistant)</li></ul><pre style='background: #1e293b; color: #e2e8f0; padding: 0.6rem; border-radius: 6px; font-size: 0.65rem; margin: 0.4rem 0;'>// MessageBubble.tsx\nconst MessageBubble = ({ message }) => {\n  const getStatusIcon = () => {\n    switch (message.status) {\n      case 'sending':\n        return &lt;ActivityIndicator size=\"small\" color=\"#94a3b8\" /&gt;;\n      case 'pending':\n        return &lt;Text style={styles.pendingBadge}&gt;⏳ En attente&lt;/Text&gt;;\n      case 'sent':\n        return &lt;Text style={styles.sentBadge}&gt;✓&lt;/Text&gt;;\n      case 'delivered':\n        return &lt;Text style={styles.deliveredBadge}&gt;✓✓&lt;/Text&gt;;\n      case 'read':\n        return &lt;Text style={styles.readBadge}&gt;✓✓&lt;/Text&gt;;\n      case 'failed':\n        return &lt;Text style={styles.failedBadge}&gt;⚠️ Échec&lt;/Text&gt;;\n      default:\n        return null;\n    }\n  };\n\n  return (\n    &lt;View style={styles.bubble}&gt;\n      &lt;Text&gt;{message.content}&lt;/Text&gt;\n      {getStatusIcon()}\n      &lt;Text style={styles.time}&gt;{formatTime(message.createdAt)}&lt;/Text&gt;\n    &lt;/View>\n  );\n};</pre></div></div>",
    "texteParle": "Pour une meilleure expérience utilisateur, nous affichons des indicateurs visuels pour chaque message. Un message en attente d'envoi affiche une icône de chargement ou un badge 'En attente'. Lorsque le message a été envoyé avec succès, nous affichons une coche. Une double coche indique que le message a été livré et une double coche bleue indique qu'il a été lu. En cas d'échec persistant, nous affichons un badge d'erreur avec la possibilité de réessayer. Ces indicateurs rassurent l'utilisateur sur l'état de ses messages et améliorent la confiance dans l'application.",
    "note": "Les coches de statut sont devenues un standard dans les applications de messagerie."
  },
  {
    "titre": "Gestion des appels API",
    "contenu": "<div style='font-family: system-ui, -apple-system, sans-serif; color: #0f172a; padding: 0.5rem;'><h3 style='font-size: 1.1rem; color: #1e293b; margin-bottom: 0.5rem;'>🔄 Retry et Timeout</h3><div style='background: #f1f5f9; padding: 0.8rem; border-radius: 8px;'><p style='margin: 0 0 0.3rem 0; font-size: 0.9rem;'><strong>Configuration Axios :</strong></p><ul style='margin: 0.1rem 0; padding-left: 1.2rem; font-size: 0.85rem;'><li>⏱️ <strong>Timeout</strong> - 30 secondes maximum</li><li>🔄 <strong>Retry</strong> - 3 tentatives automatiques</li><li>📈 <strong>Backoff</strong> - Temps d'attente progressif</li><li>📊 <strong>Monitoring</strong> - Journalisation des échecs</li></ul><pre style='background: #1e293b; color: #e2e8f0; padding: 0.6rem; border-radius: 6px; font-size: 0.65rem; margin: 0.4rem 0;'>// api.ts avec retry et timeout\nimport axios, { AxiosError } from 'axios';\n\nconst api = axios.create({\n  baseURL: process.env.API_URL,\n  timeout: 30000, // 30 secondes\n  headers: {\n    'Content-Type': 'application/json',\n  },\n});\n\n// Intercepteur pour le retry\napi.interceptors.response.use(\n  (response) => response,\n  async (error: AxiosError) => {\n    const config = error.config;\n    \n    // Configurer les retries\n    if (!config?.retry) {\n      config.retry = 0;\n    }\n    \n    if (config.retry < 3) {\n      config.retry++;\n      \n      // Backoff exponentiel\n      const delay = 1000 * Math.pow(2, config.retry);\n      await new Promise(resolve => setTimeout(resolve, delay));\n      \n      return api(config);\n    }\n    \n    return Promise.reject(error);\n  }\n);\n\n// Utilisation avec gestion d'erreur\nconst fetchData = async () => {\n  try {\n    const response = await api.get('/data');\n    return response.data;\n  } catch (error) {\n    if (error.code === 'ECONNABORTED') {\n      console.log('Timeout - tentative échouée');\n    }\n    throw error;\n  }\n};</pre></div></div>",
    "texteParle": "Pour les appels API, nous configurons un timeout de 30 secondes. Au-delà, la requête est annulée. Nous implémentons également un mécanisme de retry automatique avec un backoff exponentiel. Cela signifie que si une requête échoue, nous réessayons automatiquement jusqu'à 3 fois, avec un temps d'attente qui double à chaque tentative. Cette approche est particulièrement utile dans des environnements où la connexion peut être instable. Nous journalisons également les échecs pour pouvoir les analyser et améliorer l'application. L'utilisateur n'a pas à se soucier de relancer manuellement les requêtes qui échouent.",
    "note": "Le backoff exponentiel réduit la charge sur le serveur lors des pics de demande."
  },
  {
    "titre": "Synchronisation des données",
    "contenu": "<div style='font-family: system-ui, -apple-system, sans-serif; color: #0f172a; padding: 0.5rem;'><h3 style='font-size: 1.1rem; color: #1e293b; margin-bottom: 0.5rem;'>🔄 Synchronisation Hors Ligne</h3><div style='background: #f1f5f9; padding: 0.8rem; border-radius: 8px;'><p style='margin: 0 0 0.3rem 0; font-size: 0.9rem;'><strong>Stratégies de synchronisation :</strong></p><ul style='margin: 0.1rem 0; padding-left: 1.2rem; font-size: 0.85rem;'><li>📦 <strong>Cache local</strong> - Stockage des données consultées</li><li>🔄 <strong>Diff</strong> - Seulement les changements synchronisés</li><li>⏰ <strong>Background sync</strong> - Synchronisation en arrière-plan</li><li>📊 <strong>Priority queue</strong> - Messages d'abord, puis données</li></ul><pre style='background: #1e293b; color: #e2e8f0; padding: 0.6rem; border-radius: 6px; font-size: 0.65rem; margin: 0.4rem 0;'>// syncService.ts\nimport { OfflineQueue } from './offlineQueue';\n\nexport class SyncService {\n  static async syncAll(): Promise<void> {\n    // 1. Traiter la file d'attente (messages)\n    await OfflineQueue.processQueue(async (item) => {\n      if (item.type === 'message') {\n        await chatService.sendMessage(item.data);\n      }\n    });\n    \n    // 2. Synchroniser les données importantes\n    await this.syncUserData();\n    await this.syncProductData();\n    await this.syncWalletData();\n  }\n  \n  static async syncUserData(): Promise<void> {\n    // Récupérer les dernières données utilisateur\n    const user = await authService.getCurrentUser();\n    if (user) {\n      await AsyncStorage.setItem('@user_data', JSON.stringify(user));\n    }\n  }\n  \n  static async syncProductData(): Promise<void> {\n    // Récupérer les produits récents\n    const products = await productService.getRecentProducts();\n    if (products) {\n      await AsyncStorage.setItem('@products_cache', JSON.stringify(products));\n    }\n  }\n}</pre></div></div>",
    "texteParle": "La synchronisation des données est une partie importante du fonctionnement hors ligne. Nous utilisons une stratégie de cache local pour stocker les données consultées régulièrement. Lorsque la connexion est rétablie, nous synchronisons les changements en envoyant uniquement les modifications, ce qui économise la bande passante. Une synchronisation en arrière-plan peut être planifiée pour maintenir les données à jour sans impacter l'expérience utilisateur. La priorité est donnée aux messages, puis aux données utilisateur, puis aux produits. Cette hiérarchie garantit que les fonctionnalités de communication sont toujours privilégiées.",
    "note": "La synchronisation en arrière-plan doit être configurée avec parcimonie pour économiser la batterie."
  },
  {
    "titre": "Bonnes Pratiques Offline",
    "contenu": "<div style='font-family: system-ui, -apple-system, sans-serif; color: #0f172a; padding: 0.5rem;'><h3 style='font-size: 1.1rem; color: #1e293b; margin-bottom: 0.5rem;'>✅ Bonnes Pratiques</h3><div style='background: #f1f5f9; padding: 0.8rem; border-radius: 8px;'><ul style='margin: 0.1rem 0; padding-left: 1.2rem; font-size: 0.9rem;'><li>📱 <strong>UI adaptative</strong> - Désactiver les boutons en mode hors ligne</li><li>💾 <strong>Persistance</strong> - Utiliser AsyncStorage pour le cache</li><li>🔄 <strong>Idempotence</strong> - Les opérations doivent être réexécutables</li><li>🔔 <strong>Feedback</strong> - Toujours informer l'utilisateur du statut</li><li>📊 <strong>Monitoring</strong> - Suivre les échecs pour améliorer l'app</li><li>🧹 <strong>Nettoyage</strong> - Vider le cache régulièrement</li></ul></div><div style='background: #f1f5f9; padding: 0.8rem; border-radius: 8px; margin-top: 0.5rem;'><h4 style='margin: 0 0 0.3rem 0; font-size: 1rem;'>📌 Récapitulatif</h4><ul style='margin: 0.1rem 0; padding-left: 1.2rem; font-size: 0.85rem;'><li>✅ offlineQueue : File d'attente avec AsyncStorage</li><li>✅ Détection réseau : NetInfo pour suivre la connexion</li><li>✅ Indicateurs : Statuts clairs pour les messages</li><li>✅ Retry & Timeout : Appels API robustes</li><li>✅ Synchronisation : Données à jour en permanence</li></ul></div></div>",
    "texteParle": "Pour conclure cette leçon, je vais récapituler les bonnes pratiques pour le fonctionnement hors ligne. L'interface utilisateur doit s'adapter en désactivant les boutons qui nécessitent une connexion. Nous utilisons AsyncStorage pour la persistance des données. Les opérations doivent être idempotentes, c'est-à-dire qu'elles peuvent être réexécutées sans effet de bord. Le feedback utilisateur est crucial : l'utilisateur doit toujours savoir ce qui se passe. Nous surveillons les échecs pour améliorer l'application. Enfin, nous nettoyons régulièrement le cache pour éviter les problèmes de performance. En résumé, nous avons mis en place un système complet de file d'attente, de détection réseau, d'indicateurs visuels, de retry pour les appels API, et de synchronisation des données.",
    "note": "Une bonne expérience hors ligne distingue une application mobile d'une application web."
  }
];

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentIndex = 0;
    let isSpeaking = false;
    let isPaused = false;
    let currentUtterance = null;
    let isLoading = false;
    let loadingTimeout = null;
    let isTransitioning = false;
    let speechSupported = true;
    let userInteracted = false;
    let isPlaying = false;
    let loadingCancelled = false;

    const total = slides.length;
    const synth = window.speechSynthesis;

    // Références jQuery
    const $title = $('#slideTitle');
    const $body = $('#slideBody');
    const $counter = $('#slideCounter');
    const $statusText = $('#statusText');
    const $statusBadge = $('#statusBadge');
    const $loading = $('#loadingOverlay');
    const $loadingText = $('#loadingText');
    const $loadingSub = $('#loadingSub');
    const $loadingTimeout = $('#loadingTimeout');
    const $loadingProgressBar = $('#loadingProgressBar');
    const $autoIndicator = $('#autoIndicator');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $replay = $('#replayBtn');
    const $play = $('#playBtn');
    const $cancelLoading = $('#cancelLoadingBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function setStatus(text, type) {
        $statusText.text(text);
        $statusBadge.removeClass('idle speaking error paused waiting loading');
        if (type === 'speaking') $statusBadge.addClass('speaking');
        else if (type === 'error') $statusBadge.addClass('error');
        else if (type === 'paused') $statusBadge.addClass('paused');
        else if (type === 'waiting') $statusBadge.addClass('waiting');
        else if (type === 'loading') $statusBadge.addClass('loading');
        else $statusBadge.addClass('idle');
    }

    function updatePlayButton() {
        if (isPlaying) {
            $play.addClass('playing');
            $play.find('.btn-icon').text('⏸');
            $play.find('.btn-label').text('Pause');
        } else {
            $play.removeClass('playing');
            $play.find('.btn-icon').text('▶');
            $play.find('.btn-label').text('Play');
        }
    }

    function showLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        
        loadingCancelled = false;
        isLoading = true;
        
        // Réinitialiser la barre de progression
        $loadingProgressBar.css('animation', 'none');
        $loadingProgressBar.css('width', '0%');
        // Forcer un reflow
        $loadingProgressBar[0].offsetHeight;
        $loadingProgressBar.css('animation', 'loadingProgress 30s ease-out forwards');
        
        $loadingText.text('Préparation vocale...');
        $loadingSub.text('Synthèse en cours');
        $loadingTimeout.text('⏱️ 30 secondes maximum');
        $loading.fadeIn(300);
        setStatus("⏳ Chargement...", 'loading');
        
        // 🔥 TIMEOUT DE 30 SECONDES
        loadingTimeout = setTimeout(() => {
            if (isLoading && !loadingCancelled) {
                hideLoading();
                setStatus("⚠️ Délai dépassé (30s)", 'error');
                isPlaying = false;
                updatePlayButton();
                $loadingSub.text('La synthèse vocale a pris trop de temps');
                $loadingTimeout.text('❌ Délai dépassé');
            }
        }, 30000);
    }

    function hideLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        isLoading = false;
        loadingCancelled = false;
        $loading.fadeOut(300);
        // Ne pas changer le statut si on est en train de parler
        if (!isSpeaking && !isPlaying) {
            setStatus("⏸ Lecture arrêtée", 'paused');
        }
    }

    function cancelLoading() {
        loadingCancelled = true;
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        hideLoading();
        stopSpeaking();
        setStatus("⏸ Annulé", 'paused');
        isPlaying = false;
        updatePlayButton();
        $loadingText.text('Annulé par l\'utilisateur');
        $loadingSub.text('Vous pouvez réessayer');
        $loadingTimeout.text('✕ Annulation');
    }

    // Arrêter la parole proprement
    function stopSpeaking() {
        try {
            if (synth && (synth.speaking || synth.pending)) {
                synth.cancel();
            }
        } catch(e) {
            console.warn('Erreur stopSpeaking:', e);
        }
        if (currentUtterance) {
            try {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance.onstart = null;
            } catch(e) {}
            currentUtterance = null;
        }
        isSpeaking = false;
        isPlaying = false;
        updatePlayButton();
    }

    // Mettre en pause la parole
    function pauseSpeaking() {
        try {
            if (synth && synth.speaking) {
                synth.pause();
                isPaused = true;
                isPlaying = false;
                setStatus("⏸ Lecture en pause", 'paused');
                updatePlayButton();
            }
        } catch(e) {
            console.warn('Erreur pauseSpeaking:', e);
            stopSpeaking();
        }
    }

    // Reprendre la parole
    function resumeSpeaking() {
        try {
            if (synth && synth.paused) {
                synth.resume();
                isPaused = false;
                isPlaying = true;
                setStatus("🔊 Lecture en cours", 'speaking');
                updatePlayButton();
            } else if (!isSpeaking && !synth.speaking && !synth.pending) {
                speakSlide(currentIndex);
            }
        } catch(e) {
            console.warn('Erreur resumeSpeaking:', e);
            speakSlide(currentIndex);
        }
    }

    function renderSlide(index) {
        const slide = slides[index];
        $title.text(slide.titre);

        let html = '';
        html += `<div class="content-card">${slide.contenu}</div>`;
        if (slide.note) {
            html += `<div class="note-box">${slide.note}</div>`;
        }
        $body.html(html);
        $counter.text(`${index+1} / ${total}`);

        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
        }
    }

    // ================================================================
    // LECTURE VOCALE
    // ================================================================
    function speakSlide(index) {
        return new Promise((resolve) => {
            const slide = slides[index];
            const text = slide.texteParle;
            
            if (!text || text.trim() === '' || !speechSupported) {
                resolve();
                return;
            }

            if (!window.speechSynthesis) {
                setStatus("❌ Synthèse vocale non supportée", 'error');
                speechSupported = false;
                resolve();
                return;
            }

            // Arrêter toute lecture en cours
            stopSpeaking();
            
            // Réinitialiser l'état de pause
            isPaused = false;
            
            showLoading();
            setStatus("Initialisation...", 'loading');

            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.92;
                utterance.pitch = 1.05;
                utterance.volume = 1;

                let isFinished = false;
                let errorHandled = false;

                utterance.onstart = function() {
                    if (loadingCancelled) {
                        stopSpeaking();
                        resolve();
                        return;
                    }
                    hideLoading();
                    isSpeaking = true;
                    isPlaying = true;
                    isPaused = false;
                    setStatus("🔊 Lecture en cours", 'speaking');
                    updatePlayButton();
                };

                utterance.onend = function() {
                    if (isFinished) return;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    setStatus("✅ Terminé", 'idle');
                    hideLoading();
                    updatePlayButton();
                    resolve();
                };

                utterance.onerror = function(e) {
                    if (isFinished || errorHandled) return;
                    errorHandled = true;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    hideLoading();
                    updatePlayButton();
                    
                    if (e.error === 'not-allowed') {
                        setStatus("⚠️ Permission refusée", 'error');
                    } else if (e.error === 'synthesis-unavailable') {
                        setStatus("⚠️ Synthèse indisponible", 'error');
                    } else if (e.error === 'canceled') {
                        setStatus("⏸ Annulé", 'paused');
                    } else {
                        setStatus("❌ Erreur audio: " + (e.error || 'inconnue'), 'error');
                    }
                    
                    resolve();
                };

                // Gestion du chargement des voix
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = function() {
                        if (!loadingCancelled) {
                            try {
                                synth.speak(utterance);
                            } catch(err) {
                                // Silencieux
                            }
                        }
                        synth.onvoiceschanged = null;
                    };
                }

                currentUtterance = utterance;
                
                if (!loadingCancelled) {
                    try {
                        synth.speak(utterance);
                    } catch(err) {
                        setTimeout(() => {
                            if (!loadingCancelled) {
                                try {
                                    synth.speak(utterance);
                                } catch(e) {
                                    setStatus("❌ Erreur de lecture", 'error');
                                    isPlaying = false;
                                    updatePlayButton();
                                    hideLoading();
                                    resolve();
                                }
                            } else {
                                resolve();
                            }
                        }, 100);
                    }
                } else {
                    resolve();
                }

            } catch(err) {
                hideLoading();
                setStatus("❌ Erreur générale", 'error');
                isPlaying = false;
                updatePlayButton();
                console.error('Erreur speakSlide:', err);
                resolve();
            }
        });
    }

    // ================================================================
    // NAVIGATION
    // ================================================================
    async function goToSlide(index) {
        if (isTransitioning) return;
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        
        // Si on est en train de lire, on met en pause avant de naviguer
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        // Arrêter complètement la lecture
        stopSpeaking();
        
        await new Promise(r => setTimeout(r, 50));
        
        if (index === currentIndex) {
            setStatus("📄 Slide actuel", 'idle');
            return;
        }

        isTransitioning = true;
        currentIndex = index;
        renderSlide(index);
        
        // Réinitialiser l'état de lecture
        isPlaying = false;
        updatePlayButton();
        setStatus("⏸ Lecture arrêtée", 'paused');

        await new Promise(r => setTimeout(r, 150));
        isTransitioning = false;
    }

    async function goToNext() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex + 1 < total) {
            await goToSlide(currentIndex + 1);
        } else {
            setStatus("🏁 Dernier slide", 'idle');
        }
    }

    async function goToPrev() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex - 1 >= 0) {
            await goToSlide(currentIndex - 1);
        } else {
            setStatus("🔁 Premier slide", 'idle');
        }
    }

    // ================================================================
    // GESTION PLAY/PAUSE
    // ================================================================
    function togglePlay() {
        if (!userInteracted) {
            userInteracted = true;
        }

        // Si le chargement est en cours, on l'annule
        if (isLoading) {
            cancelLoading();
            return;
        }

        // Si le synthétiseur est en pause, on reprend
        if (synth && synth.paused) {
            resumeSpeaking();
            return;
        }

        // Si la lecture est en cours, on met en pause
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
            return;
        }

        // Sinon, on démarre la lecture du slide courant
        if (!isSpeaking && !isPlaying) {
            stopSpeaking();
            speakSlide(currentIndex);
        }
    }

    // ================================================================
    // INIT
    // ================================================================
    async function init() {
        // Vérifier la compatibilité
        if (!window.speechSynthesis) {
            setStatus("❌ Synthèse vocale non supportée", 'error');
            speechSupported = false;
        }

        // Précharger les voix
        try {
            if (synth.getVoices) {
                synth.getVoices();
                setTimeout(() => {
                    try {
                        synth.getVoices();
                    } catch(e) {}
                }, 200);
            }
        } catch(e) {
            console.warn('Erreur chargement voix:', e);
        }

        // Afficher le premier slide
        renderSlide(0);
        $counter.text(`1 / ${total}`);
        
        // État initial
        setStatus("⏸ Appuie sur Play", 'paused');
        updatePlayButton();
        $autoIndicator.text('⏸ Lecture manuelle');

        // ================================================================
        // ÉVÉNEMENTS
        // ================================================================
        
        // Bouton Play/Pause
        $play.on('click', function() {
            togglePlay();
        });

        // Bouton Annuler le chargement
        $cancelLoading.on('click', function() {
            cancelLoading();
        });

        // Navigation
        $prev.on('click', function() {
            // Si chargement en cours, on annule
            if (isLoading) cancelLoading();
            goToPrev();
        });

        $next.on('click', function() {
            if (isLoading) cancelLoading();
            goToNext();
        });

        // Replay - relire le slide courant
        $replay.on('click', function() {
            if (isLoading) cancelLoading();
            stopSpeaking();
            setTimeout(() => {
                speakSlide(currentIndex);
            }, 100);
        });

        // Support du clavier (espace pour play/pause)
        $(document).on('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });

        // Nettoyage
        $(window).on('beforeunload', function() {
            try {
                if (synth.speaking) synth.cancel();
            } catch(e) {}
            hideLoading();
        });

        // Gérer les cas où la synthèse se termine de manière inattendue
        setInterval(() => {
            if (isPlaying && !synth.speaking && !synth.pending && !isPaused && !isLoading) {
                isPlaying = false;
                updatePlayButton();
                setStatus("⏸ Lecture arrêtée", 'paused');
            }
        }, 1000);
    }

    init();
});



    // ================================================================
    // GESTION DU THÈME JOUR/NUIT
    // ================================================================
    let isDarkMode = false;

    function toggleTheme() {
        isDarkMode = !isDarkMode;
        const body = document.body;
        const appContainer = document.querySelector('.app-container');
        const header = document.querySelector('.slide-header');
        const footer = document.querySelector('.slide-footer');
        const contentCards = document.querySelectorAll('.content-card');
        const noteBoxes = document.querySelectorAll('.note-box');
        const mathBlocks = document.querySelectorAll('.math-block');
        const buttons = document.querySelectorAll('.btn');
        const statusBadge = document.querySelector('.status-badge');
        const slideCounter = document.querySelector('.slide-counter');
        const autoIndicator = document.querySelector('.auto-indicator');
        const themeBtn = document.getElementById('themeToggle');

        if (isDarkMode) {
            // Mode nuit
            body.style.background = '#0b1120';
            body.style.color = '#f1f5f9';
            appContainer.style.background = 'linear-gradient(145deg, #0f172a 0%, #1e293b 100%)';
            header.style.background = 'rgba(15, 23, 42, 0.85)';
            footer.style.background = 'rgba(15, 23, 42, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.05)';
                card.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.08)';
                note.style.color = '#cbd5e1';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.25)';
                block.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#e2e8f0';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.12)';
                statusBadge.style.color = '#93bbfc';
            }
            if (slideCounter) {
                slideCounter.style.color = '#94a3b8';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#64748b';
            }
            if (themeBtn) {
                themeBtn.textContent = '☀️';
                themeBtn.title = 'Passer en mode jour';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#e2e8f0';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#e2e8f0';
                }
            });
        } else {
            // Mode jour (par défaut)
            body.style.background = '#f0f4f8';
            body.style.color = '#1a202c';
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
            header.style.background = 'rgba(255, 255, 255, 0.85)';
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.8)';
                card.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.12)';
                note.style.color = '#2c3e50';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.05)';
                block.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#2d3748';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
                statusBadge.style.color = '#2b6cb0';
            }
            if (slideCounter) {
                slideCounter.style.color = '#4a5568';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#718096';
            }
            if (themeBtn) {
                themeBtn.textContent = '🌓';
                themeBtn.title = 'Passer en mode nuit';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#2c3e50';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#2d3748';
                }
            });
        }
    }

    // Initialiser en mode jour
    document.addEventListener('DOMContentLoaded', function() {
        // Appliquer le mode jour par défaut
        const body = document.body;
        body.style.background = '#f0f4f8';
        body.style.color = '#1a202c';
        
        const appContainer = document.querySelector('.app-container');

            note.style.color = '#2c3e50';

        });

        if (statusBadge) {

            statusBadge.style.color = '#2b6cb0';
        }
        
        const slideCounter = document.querySelector('.slide-counter');
        if (slideCounter) {
            slideCounter.style.color = '#4a5568';
        }
        
        const autoIndicator = document.querySelector('.auto-indicator');
        if (autoIndicator) {
            autoIndicator.style.color = '#718096';
        }
        
        document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
            if (!el.closest('.note-box')) {
                el.style.color = '#2c3e50';
            }
        });
        
        document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
            if (!el.closest('.note-box') && !el.closest('.math-block')) {
                el.style.color = '#2d3748';

        const themeBtn = document.getElementById('themeToggle');
        if (themeBtn) {

    });
