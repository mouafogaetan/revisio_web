<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
 "matiere": "Développement d'une application mobile e-commerce multiplateforme",
 "classe": "Développement Web",
 "sequence": "Séquence 4",
 "anneeScolaire": "2025-2026",
 "exercices": [
   {
     "titre": "Exercice 1 : Tests unitaires des stores Zustand",
     "points": "4 pts",
     "enonce": "<div style='padding: 10px;'><p>Dans une application React Native, les stores Zustand sont au cœur de la gestion d'état. Il est essentiel de les tester pour garantir leur bon fonctionnement.</p><p>Analyser le code du <code>authStore</code> ci-dessous et répondez aux questions.</p><div style='background: #f0f4f8; padding: 15px; border-radius: 8px; margin: 10px 0;'><pre style='background: #2c3e50; color: #ecf0f1; padding: 12px; border-radius: 5px; overflow-x: auto;'><code>import { create } from 'zustand';\nimport { authService } from '../services/authService';\n\ninterface AuthState {\n  user: User | null;\n  token: string | null;\n  isAuthenticated: boolean;\n  isLoading: boolean;\n  login: (email: string, password: string) => Promise<void>;\n  logout: () => void;\n}\n\nexport const useAuthStore = create<AuthState>((set) => ({\n  user: null,\n  token: null,\n  isAuthenticated: false,\n  isLoading: false,\n  login: async (email, password) => {\n    set({ isLoading: true });\n    try {\n      const response = await authService.login(email, password);\n      set({ user: response.user, token: response.token, isAuthenticated: true, isLoading: false });\n    } catch (error) {\n      set({ isLoading: false });\n      throw error;\n    }\n  },\n  logout: () => set({ user: null, token: null, isAuthenticated: false }),\n}));</code></pre></div></div>",
     "questions": [
       {
         "question": "1) Expliquer le rôle du fichier <code>jest.config.js</code> dans un projet React Native. ",
         "reponse": "Le fichier <code>jest.config.js</code> permet de configurer Jest pour l'environnement React Native. Il définit les options de test comme le répertoire des tests, les extensions de fichiers, les transformations, les mocks, et les rapports de couverture."
       },
       {
         "question": "2) Écrire un test unitaire pour la méthode <code>login</code> du <code>authStore</code> qui vérifie que le token et les données utilisateur sont correctement stockés en cas de succès. ",
         "reponse": "```typescript\nimport { act } from '@testing-library/react-native';\nimport { useAuthStore } from '../stores/authStore';\nimport { authService } from '../services/authService';\n\njest.mock('../services/authService', () => ({\n  authService: {\n    login: jest.fn(),\n  },\n}));\n\ndescribe('authStore', () => {\n  beforeEach(() => {\n    jest.clearAllMocks();\n    useAuthStore.setState({ user: null, token: null, isAuthenticated: false });\n  });\n\n  test('login should store token and user data on success', async () => {\n    const mockResponse = {\n      token: 'fake-jwt-token',\n      user: { id: '123', name: 'Jean', email: 'jean@example.com' },\n    };\n    \n    (authService.login as jest.Mock).mockResolvedValue(mockResponse);\n\n    await act(async () => {\n      await useAuthStore.getState().login('jean@example.com', 'password123');\n    });\n\n    const state = useAuthStore.getState();\n    expect(state.token).toBe('fake-jwt-token');\n    expect(state.user).toEqual(mockResponse.user);\n    expect(state.isAuthenticated).toBe(true);\n  });\n});\n```"
       },
       {
         "question": "3) Décrire comment tester la persistance du store avec <code>AsyncStorage</code>. ",
         "reponse": "Pour tester la persistance, on peut utiliser un mock de <code>AsyncStorage</code> avec <code>@react-native-async-storage/async-storage/jest/async-storage-mock</code>. On vérifie que les données sont sauvegardées lors des actions (login, updateProfile) et qu'elles sont correctement restaurées au chargement de l'application."
       }
     ]
   },
   {
     "titre": "Exercice 2 : Tests d'intégration des services API",
     "points": "5 pts",
     "enonce": "<div style='padding: 10px;'><p>Les services API sont la couche de communication avec le backend. Il est important de les tester pour s'assurer que les appels sont correctement effectués.</p><p>Analysez le code du <code>authService</code> et répondez aux questions.</p></div>",
     "questions": [
       {
         "question": "1) Écrire un test d'intégration pour la méthode <code>login</code> du <code>authService</code> en utilisant <code>jest.mock</code> pour simuler la réponse de l'API. ",
         "reponse": "```typescript\nimport { authService } from '../services/authService';\nimport api from '../services/api';\n\njest.mock('../services/api', () => ({\n  post: jest.fn(),\n}));\n\ndescribe('authService', () => {\n  beforeEach(() => {\n    jest.clearAllMocks();\n  });\n\n  test('login should call the correct endpoint and return user data', async () => {\n    const mockResponse = {\n      data: {\n        token: 'fake-jwt-token',\n        user: { id: '123', name: 'Jean', email: 'jean@example.com' },\n      },\n    };\n    \n    (api.post as jest.Mock).mockResolvedValue(mockResponse);\n\n    const result = await authService.login('jean@example.com', 'password123');\n\n    expect(api.post).toHaveBeenCalledWith('/auth/login', {\n      email: 'jean@example.com',\n      password: 'password123',\n    });\n    expect(result).toEqual(mockResponse.data);\n  });\n});\n```"
       },
       {
         "question": "2) Expliquer comment tester le mécanisme de refresh token dans les intercepteurs Axios. ",
         "reponse": "On peut simuler une requête qui retourne une erreur 401, puis vérifier que l'intercepteur appelle automatiquement l'endpoint de refresh token, met à jour le token, et réessaie la requête originale. On utilise des mocks pour contrôler les réponses de l'API et vérifier le comportement de l'intercepteur."
       }
     ]
   },
   {
     "titre": "Exercice 3 : Tests de navigation et d'écrans",
     "points": "5 pts",
     "enonce": "<div style='padding: 10px;'><p>Les écrans sont la partie visible de l'application. Leur bon fonctionnement doit être validé par des tests.</p><p>Écrire des tests pour l'écran de connexion (<code>LoginScreen</code>) qui contient deux champs (email et mot de passe) et un bouton de connexion.</p></div>",
     "questions": [
       {
         "question": "1) Expliquer comment tester la navigation vers l'écran d'inscription lorsque l'utilisateur clique sur le lien. ",
         "reponse": "On utilise <code>@testing-library/react-native</code> pour rendre l'écran avec un navigateur mocké. On simule un clic sur le lien d'inscription et on vérifie que la fonction <code>navigation.navigate</code> a été appelée avec le bon nom de route."
       },
       {
         "question": "2) Écrire un test qui vérifie que le bouton de connexion est désactivé lorsque les champs sont vides. ",
         "reponse": "```typescript\nimport { render, screen, fireEvent } from '@testing-library/react-native';\nimport { LoginScreen } from '../screens/LoginScreen';\n\ndescribe('LoginScreen', () => {\n  test('should disable login button when fields are empty', () => {\n    render(<LoginScreen />);\n    \n    const loginButton = screen.getByTestId('login-button');\n    expect(loginButton).toBeDisabled();\n  });\n\n  test('should enable login button when both fields are filled', () => {\n    render(<LoginScreen />);\n    \n    const emailInput = screen.getByPlaceholderText('Email');\n    const passwordInput = screen.getByPlaceholderText('Mot de passe');\n    \n    fireEvent.changeText(emailInput, 'test@example.com');\n    fireEvent.changeText(passwordInput, 'password123');\n    \n    const loginButton = screen.getByTestId('login-button');\n    expect(loginButton).toBeEnabled();\n  });\n});\n```"
       },
       {
         "question": "3) Décrire comment mocker le <code>authStore</code> dans un test d'écran pour simuler un état authentifié. ",
         "reponse": "On utilise <code>jest.mock</code> pour remplacer le store par un mock, puis on modifie l'état du store avec <code>useAuthStore.setState({ isAuthenticated: true, user: mockUser })</code> avant de rendre l'écran. Cela permet de tester le comportement de l'écran dans différents états d'authentification."
       }
     ]
   },
   {
     "titre": "Exercice 4 : Couverture de code et bonnes pratiques",
     "points": "4 pts",
     "enonce": "<div style='padding: 10px;'><p>Les tests sont un élément clé du développement professionnel. Une bonne couverture de code et des tests bien conçus garantissent la qualité de l'application.</p><p>Répondez aux questions suivantes.</p></div>",
     "questions": [
       {
         "question": "1) Définir ce qu'est la couverture de code et expliquer son importance. ",
         "reponse": "La couverture de code mesure le pourcentage de code qui est exécuté par les tests. Elle est importante car elle permet d'identifier les parties du code qui ne sont pas testées, ce qui peut cacher des bugs potentiels. Une bonne couverture (généralement > 80%) est un indicateur de qualité mais ne garantit pas l'absence de bugs."
       },
       {
         "question": "2) Décrire les différentes stratégies de test (unitaires, intégration, end-to-end) et leur utilité. ",
         "reponse": "Les tests unitaires vérifient des composants isolés (stores, services). Les tests d'intégration vérifient l'interaction entre plusieurs composants (ex: service API + store). Les tests end-to-end simulent l'utilisation complète de l'application par un utilisateur (ex: via Detox ou Maestro). Chaque stratégie a son utilité pour garantir la qualité à différents niveaux de l'application."
       },
       {
         "question": "3) Expliquer la différence entre <code>jest.fn()</code> et <code>jest.mock()</code> dans Jest. ",
         "reponse": "<code>jest.fn()</code> crée une fonction simulée (spy) qui peut être utilisée pour tester les appels de fonctions. <code>jest.mock()</code> permet de remplacer un module entier par des mocks, ce qui est utile pour simuler des dépendances externes comme des services API."
       }
     ]
   }
 ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
