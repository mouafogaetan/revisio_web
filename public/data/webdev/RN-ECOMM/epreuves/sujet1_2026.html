<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Développement d'une application mobile e-commerce multiplateforme",
  "classe": "Développement Web",
  "sequence": "Séquence 1",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Installation et Configuration du Projet Expo",
      "points": "4 pts",
      "enonce": "<div style='font-family: system-ui, -apple-system, sans-serif; background-color: #f8fafc; color: #0f172a; padding: 1rem; border-radius: 8px;'><p>Vous êtes développeur mobile dans une startup camerounaise et devez lancer le développement de l'application mobile <strong>Sawamart</strong> avec Expo et React Native.</p><p><strong>Consignes :</strong></p><ol><li>Installez Node.js, npm et l'outil de ligne de commande Expo.</li><li>Créez un nouveau projet Expo avec TypeScript nommé <code>sawamart-mobile</code>.</li><li>Configurez le fichier <code>app.json</code> avec les informations suivantes : nom = \"Sawamart\", slug = \"sawamart-mobile\", orientation = \"portrait\".</li><li>Mettez en place un fichier <code>.env</code> pour les variables d'environnement.</li></ol></div>",
      "questions": [
        {
          "question": "<div style='font-family: system-ui, -apple-system, sans-serif; color: #0f172a;'>1. a) Quelle commande utilisez-vous pour installer Expo CLI globalement ?</div>",
          "reponse": "<div style='font-family: system-ui, -apple-system, sans-serif; background-color: #eef2ff; padding: 0.75rem; border-radius: 6px; border-left: 4px solid #4f46e5; color: #0f172a;'><code>npm install -g expo-cli</code> ou <code>npx create-expo-app</code></div>"
        },
        {
          "question": "<div style='font-family: system-ui, -apple-system, sans-serif; color: #0f172a;'>1. b) Quelle commande permet de créer le projet <code>sawamart-mobile</code> avec TypeScript ?</div>",
          "reponse": "<div style='font-family: system-ui, -apple-system, sans-serif; background-color: #eef2ff; padding: 0.75rem; border-radius: 6px; border-left: 4px solid #4f46e5; color: #0f172a;'><code>npx create-expo-app sawamart-mobile --template</code> (puis sélectionner le template TypeScript)</div>"
        },
        {
          "question": "<div style='font-family: system-ui, -apple-system, sans-serif; color: #0f172a;'>1. c) Quel est le rôle du fichier <code>app.json</code> dans un projet Expo ?</div>",
          "reponse": "<div style='font-family: system-ui, -apple-system, sans-serif; background-color: #eef2ff; padding: 0.75rem; border-radius: 6px; border-left: 4px solid #4f46e5; color: #0f172a;'><p>Le fichier <code>app.json</code> est le fichier de configuration principal de l'application. Il contient des métadonnées comme le nom, le slug, la version, l'orientation, l'icône, l'écran de démarrage, le schéma URL, etc. Il est utilisé par Expo pour configurer l'application lors du build.</p></div>"
        },
        {
          "question": "<div style='font-family: system-ui, -apple-system, sans-serif; color: #0f172a;'>1. d) Quel package utilise-t-on pour accéder aux variables d'environnement dans un projet Expo ?</div>",
          "reponse": "<div style='font-family: system-ui, -apple-system, sans-serif; background-color: #eef2ff; padding: 0.75rem; border-radius: 6px; border-left: 4px solid #4f46e5; color: #0f172a;'><p>On utilise <code>expo-constants</code>. Il permet d'accéder aux variables définies dans le fichier <code>.env</code> via <code>Constants.expoConfig.extra</code>.</p></div>"
        }
      ]
    },
    {
      "titre": "Navigation et Structure de l'Application",
      "points": "6 pts",
      "enonce": "<div style='font-family: system-ui, -apple-system, sans-serif; background-color: #f8fafc; color: #0f172a; padding: 1rem; border-radius: 8px;'><p>L'application Sawamart doit gérer une navigation fluide entre les écrans d'authentification et l'application principale.</p><p><strong>Consignes :</strong> Répondez aux questions suivantes sur la configuration de la navigation avec React Navigation.</p></div>",
      "questions": [
        {
          "question": "<div style='font-family: system-ui, -apple-system, sans-serif; color: #0f172a;'>2. a) Quels packages devez-vous installer pour utiliser React Navigation dans un projet Expo ?</div>",
          "reponse": "<div style='font-family: system-ui, -apple-system, sans-serif; background-color: #eef2ff; padding: 0.75rem; border-radius: 6px; border-left: 4px solid #4f46e5; color: #0f172a;'><p><code>npm install @react-navigation/native @react-navigation/native-stack @react-navigation/bottom-tabs react-native-screens react-native-safe-area-context</code></p></div>"
        },
        {
          "question": "<div style='font-family: system-ui, -apple-system, sans-serif; color: #0f172a;'>2. b) Expliquez la différence entre une navigation par piles (Stack) et une navigation par onglets (Tabs).</div>",
          "reponse": "<div style='font-family: system-ui, -apple-system, sans-serif; background-color: #eef2ff; padding: 0.75rem; border-radius: 6px; border-left: 4px solid #4f46e5; color: #0f172a;'><p><strong>Navigation par piles (Stack) :</strong> Permet de naviguer entre les écrans avec un historique. Chaque nouvel écran est empilé sur le précédent. On peut revenir en arrière avec un bouton de retour.</p><p><strong>Navigation par onglets (Tabs) :</strong> Permet de basculer entre plusieurs écrans principaux (ex: Accueil, Recherche, Chat, Profil) via des onglets en bas de l'écran.</p></div>"
        },
        {
          "question": "<div style='font-family: system-ui, -apple-system, sans-serif; color: #0f172a;'>2. c) Comment structure-t-on le <code>RootNavigator</code> pour gérer le routage conditionnel en fonction de l'authentification ?</div>",
          "reponse": "<div style='font-family: system-ui, -apple-system, sans-serif; background-color: #eef2ff; padding: 0.75rem; border-radius: 6px; border-left: 4px solid #4f46e5; color: #0f172a;'><p>Le <code>RootNavigator</code> est un composant qui retourne un <code>NavigationContainer</code> contenant soit le <code>AuthStack</code> (si l'utilisateur n'est pas authentifié), soit le <code>MainTabs</code> (si l'utilisateur est authentifié). On utilise <code>useAuthStore</code> pour connaître l'état d'authentification.</p><pre style='background-color: #1e293b; color: #e2e8f0; padding: 0.75rem; border-radius: 6px;'>const RootNavigator = () => {\n  const { user } = useAuthStore();\n  \n  return (\n    &lt;NavigationContainer&gt;\n      {user ? &lt;MainTabs /&gt; : &lt;AuthStack /&gt;}\n    &lt;/NavigationContainer&gt;\n  );\n};</pre></div>"
        },
        {
          "question": "<div style='font-family: system-ui, -apple-system, sans-serif; color: #0f172a;'>2. d) Pourquoi est-il important de définir les types de navigation dans un fichier <code>types.ts</code> ?</div>",
          "reponse": "<div style='font-family: system-ui, -apple-system, sans-serif; background-color: #eef2ff; padding: 0.75rem; border-radius: 6px; border-left: 4px solid #4f46e5; color: #0f172a;'><p>Définir les types de navigation permet d'assurer la sécurité des routes et d'obtenir une autocomplétion des paramètres lors de la navigation. Cela évite les erreurs de frappe et les bugs liés à des paramètres manquants ou de type incorrect.</p></div>"
        }
      ]
    },
    {
      "titre": "Gestion d'État Avancée avec Zustand",
      "points": "5 pts",
      "enonce": "<div style='font-family: system-ui, -apple-system, sans-serif; background-color: #f8fafc; color: #0f172a; padding: 1rem; border-radius: 8px;'><p>L'application utilise Zustand pour la gestion d'état global. Vous devez créer plusieurs stores pour gérer les différentes fonctionnalités.</p><p><strong>Consignes :</strong></p><ol><li>Installez Zustand dans le projet.</li><li>Créez un store d'authentification avec persistance.</li><li>Créez un store de produits pour gérer le feed et les recherches.</li></ol></div>",
      "questions": [
        {
          "question": "<div style='font-family: system-ui, -apple-system, sans-serif; color: #0f172a;'>3. a) Quelle commande permet d'installer Zustand ?</div>",
          "reponse": "<div style='font-family: system-ui, -apple-system, sans-serif; background-color: #eef2ff; padding: 0.75rem; border-radius: 6px; border-left: 4px solid #4f46e5; color: #0f172a;'><code>npm install zustand</code></div>"
        },
        {
          "question": "<div style='font-family: system-ui, -apple-system, sans-serif; color: #0f172a;'>3. b) Écrivez la structure du store d'authentification (<code>authStore</code>) avec persistance.</div>",
          "reponse": "<div style='font-family: system-ui, -apple-system, sans-serif; background-color: #eef2ff; padding: 0.75rem; border-radius: 6px; border-left: 4px solid #4f46e5; color: #0f172a;'><pre style='background-color: #1e293b; color: #e2e8f0; padding: 0.75rem; border-radius: 6px;'>import { create } from 'zustand';\nimport { persist } from 'zustand/middleware';\nimport AsyncStorage from '@react-native-async-storage/async-storage';\n\ninterface AuthState {\n  user: User | null;\n  token: string | null;\n  isLoading: boolean;\n  login: (user: User, token: string) => void;\n  logout: () => void;\n  setLoading: (loading: boolean) => void;\n}\n\nexport const useAuthStore = create&lt;AuthState&gt;()(\n  persist(\n    (set) => ({\n      user: null,\n      token: null,\n      isLoading: false,\n      login: (user, token) => set({ user, token }),\n      logout: () => set({ user: null, token: null }),\n      setLoading: (loading) => set({ isLoading: loading }),\n    }),\n    {\n      name: 'auth-storage',\n      getStorage: () => AsyncStorage,\n    }\n  )\n);</pre></div>"
        },
        {
          "question": "<div style='font-family: system-ui, -apple-system, sans-serif; color: #0f172a;'>3. c) Expliquez le rôle du middleware <code>persist</code> dans Zustand.</div>",
          "reponse": "<div style='font-family: system-ui, -apple-system, sans-serif; background-color: #eef2ff; padding: 0.75rem; border-radius: 6px; border-left: 4px solid #4f46e5; color: #0f172a;'><p>Le middleware <code>persist</code> permet de sauvegarder l'état du store dans un stockage persistant (comme AsyncStorage). Cela permet de conserver les données même après la fermeture ou le redémarrage de l'application. Il est particulièrement utile pour le store d'authentification afin de garder l'utilisateur connecté entre les sessions.</p></div>"
        }
      ]
    },
    {
      "titre": "Communication avec l'API Backend",
      "points": "5 pts",
      "enonce": "<div style='font-family: system-ui, -apple-system, sans-serif; background-color: #f8fafc; color: #0f172a; padding: 1rem; border-radius: 8px;'><p>L'application doit communiquer avec le backend NestJS via des appels API sécurisés.</p><p><strong>Consignes :</strong> Configurez Axios et créez les intercepteurs nécessaires.</p></div>",
      "questions": [
        {
          "question": "<div style='font-family: system-ui, -apple-system, sans-serif; color: #0f172a;'>4. a) Quelle commande permet d'installer Axios ?</div>",
          "reponse": "<div style='font-family: system-ui, -apple-system, sans-serif; background-color: #eef2ff; padding: 0.75rem; border-radius: 6px; border-left: 4px solid #4f46e5; color: #0f172a;'><code>npm install axios</code></div>"
        },
        {
          "question": "<div style='font-family: system-ui, -apple-system, sans-serif; color: #0f172a;'>4. b) Expliquez le fonctionnement des intercepteurs de requête et de réponse dans Axios.</div>",
          "reponse": "<div style='font-family: system-ui, -apple-system, sans-serif; background-color: #eef2ff; padding: 0.75rem; border-radius: 6px; border-left: 4px solid #4f46e5; color: #0f172a;'><p><strong>Intercepteur de requête :</strong> Permet d'intercepter et de modifier les requêtes avant qu'elles ne soient envoyées. On l'utilise pour ajouter automatiquement le token JWT dans l'en-tête <code>Authorization</code>.</p><p><strong>Intercepteur de réponse :</strong> Permet d'intercepter les réponses avant qu'elles ne soient traitées par le code applicatif. On l'utilise pour gérer les erreurs 401 (token expiré) et déclencher un refresh token.</p></div>"
        },
        {
          "question": "<div style='font-family: system-ui, -apple-system, sans-serif; color: #0f172a;'>4. c) Comment gérez-vous les appels multipart/form-data pour l'upload d'images dans Axios ?</div>",
          "reponse": "<div style='font-family: system-ui, -apple-system, sans-serif; background-color: #eef2ff; padding: 0.75rem; border-radius: 6px; border-left: 4px solid #4f46e5; color: #0f172a;'><p>On utilise <code>FormData</code> pour construire la requête. On définit l'en-tête <code>'Content-Type': 'multipart/form-data'</code>. On peut également utiliser un intercepteur pour détecter automatiquement les données de type <code>FormData</code> et définir l'en-tête approprié.</p><pre style='background-color: #1e293b; color: #e2e8f0; padding: 0.75rem; border-radius: 6px;'>const formData = new FormData();\nformData.append('image', {\n  uri: imageUri,\n  type: 'image/jpeg',\n  name: 'photo.jpg',\n});\nconst response = await api.post('/upload', formData, {\n  headers: { 'Content-Type': 'multipart/form-data' },\n});</pre></div>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
