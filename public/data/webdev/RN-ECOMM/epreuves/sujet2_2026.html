<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Développement d'une application mobile e-commerce multiplateforme",
  "classe": "Développement Web",
  "sequence": "Séquence 2",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Configuration du Projet Expo et Navigation",
      "points": "4 pts",
      "enonce": "<p>Vous êtes chargé de mettre en place la base d'une application mobile e-commerce avec Expo et React Navigation.</p><p>L'application doit comporter un flux d'authentification (Login, Register) et une partie principale avec un onglet d'accueil et un onglet profil.</p>",
      "questions": [
        {
          "question": "<p><strong>1. (1 pt)</strong> Écrivez les commandes pour créer un nouveau projet Expo avec TypeScript et installer les dépendances nécessaires pour la navigation.</p>",
          "reponse": "<pre style='background:#2d2d2d; color:#f8f8f2; padding:12px; border-radius:6px; font-size:0.85em;'>\n# Création du projet\nnpx create-expo-app sawamart-mobile --template\n\n# Installation des dépendances de navigation\nnpm install @react-navigation/native @react-navigation/native-stack @react-navigation/bottom-tabs\nnpm install react-native-screens react-native-safe-area-context react-native-gesture-handler\n</pre>"
        },
        {
          "question": "<p><strong>2. (1,5 pts)</strong> Définissez les types de navigation (<code>RootStackParamList</code> et <code>TabParamList</code>) pour l'application.</p>",
          "reponse": "<pre style='background:#2d2d2d; color:#f8f8f2; padding:12px; border-radius:6px; font-size:0.85em;'>\n// types/navigation.ts\nimport { NavigatorScreenParams } from '@react-navigation/native';\n\nexport type RootStackParamList = {\n  Splash: undefined;\n  Onboarding: undefined;\n  Login: undefined;\n  Register: undefined;\n  OtpVerification: { phone: string };\n  MainTabs: NavigatorScreenParams<TabParamList>;\n};\n\nexport type TabParamList = {\n  Home: undefined;\n  Search: undefined;\n  Chat: undefined;\n  Wallet: undefined;\n  Profile: undefined;\n};\n</pre>"
        },
        {
          "question": "<p><strong>3. (1,5 pts)</strong> Créez le <code>RootNavigator</code> qui gère le routage conditionnel en fonction de l'authentification.</p>",
          "reponse": "<pre style='background:#2d2d2d; color:#f8f8f2; padding:12px; border-radius:6px; font-size:0.85em;'>\n// navigation/RootNavigator.tsx\nimport React from 'react';\nimport { NavigationContainer } from '@react-navigation/native';\nimport { createNativeStackNavigator } from '@react-navigation/native-stack';\nimport { useAuthStore } from '../stores/authStore';\nimport { RootStackParamList } from '../types/navigation';\n\n// Écrans d'authentification\nimport LoginScreen from '../screens/auth/LoginScreen';\nimport RegisterScreen from '../screens/auth/RegisterScreen';\nimport OtpVerificationScreen from '../screens/auth/OtpVerificationScreen';\nimport SplashScreen from '../screens/auth/SplashScreen';\n\n// Écrans principaux\nimport MainTabs from './MainTabs';\n\nconst Stack = createNativeStackNavigator<RootStackParamList>();\n\nexport const RootNavigator = () => {\n  const { isAuthenticated, isLoading } = useAuthStore();\n\n  if (isLoading) {\n    return <SplashScreen />;\n  }\n\n  return (\n    <NavigationContainer>\n      <Stack.Navigator screenOptions={{ headerShown: false }}>\n        {!isAuthenticated ? (\n          // Écrans d'authentification\n          <>\n            <Stack.Screen name=\"Login\" component={LoginScreen} />\n            <Stack.Screen name=\"Register\" component={RegisterScreen} />\n            <Stack.Screen name=\"OtpVerification\" component={OtpVerificationScreen} />\n          </>\n        ) : (\n          // Écrans principaux\n          <>\n            <Stack.Screen name=\"MainTabs\" component={MainTabs} />\n          </>\n        )}\n      </Stack.Navigator>\n    </NavigationContainer>\n  );\n};\n</pre>"
        }
      ]
    },
    {
      "titre": "Gestion d'État avec Zustand",
      "points": "4 pts",
      "enonce": "<p>L'application utilise Zustand pour la gestion d'état globale. Vous devez implémenter un store d'authentification avec persistance et un store de produits pour gérer le feed et les recherches.</p>",
      "questions": [
        {
          "question": "<p><strong>1. (2 pts)</strong> Écrivez le store d'authentification (<code>authStore</code>) complet avec persistance dans AsyncStorage. Il doit gérer l'utilisateur, le token, les états de chargement et d'erreur, ainsi que les actions <code>login</code>, <code>logout</code> et <code>updateProfile</code>.</p>",
          "reponse": "<pre style='background:#2d2d2d; color:#f8f8f2; padding:12px; border-radius:6px; font-size:0.8em;'>\nimport { create } from 'zustand';\nimport { persist, devtools, createJSONStorage } from 'zustand/middleware';\nimport AsyncStorage from '@react-native-async-storage/async-storage';\nimport { User } from '../types';\n\ninterface AuthState {\n  user: User | null;\n  token: string | null;\n  isAuthenticated: boolean;\n  isLoading: boolean;\n  error: string | null;\n\n  login: (email: string, password: string) => Promise<void>;\n  logout: () => void;\n  updateProfile: (data: Partial<User>) => void;\n  clearError: () => void;\n}\n\nexport const useAuthStore = create<AuthState>()(\n  devtools(\n    persist(\n      (set, get) => ({\n        user: null,\n        token: null,\n        isAuthenticated: false,\n        isLoading: false,\n        error: null,\n\n        login: async (email: string, password: string) => {\n          set({ isLoading: true, error: null });\n          try {\n            const response = await authService.login({ email, password });\n            set({\n              user: response.user,\n              token: response.token,\n              isAuthenticated: true,\n              isLoading: false,\n            });\n          } catch (error) {\n            set({ error: error.message, isLoading: false });\n          }\n        },\n\n        logout: () => {\n          set({ user: null, token: null, isAuthenticated: false, error: null });\n        },\n\n        updateProfile: (data: Partial<User>) => {\n          set((state) => ({\n            user: state.user ? { ...state.user, ...data } : null,\n          }));\n        },\n\n        clearError: () => set({ error: null }),\n      }),\n      {\n        name: 'auth-storage',\n        storage: createJSONStorage(() => AsyncStorage),\n        partialize: (state) => ({\n          user: state.user,\n          token: state.token,\n          isAuthenticated: state.isAuthenticated,\n        }),\n      }\n    ),\n    { name: 'AuthStore' }\n  )\n);\n</pre>"
        },
        {
          "question": "<p><strong>2. (1,5 pts)</strong> Créez le store de produits (<code>productStore</code>) avec les états pour le feed, les recherches et les articles personnels. Incluez les actions <code>fetchFeed</code>, <code>searchProducts</code> et <code>fetchPersonalProducts</code> avec gestion de la pagination.</p>",
          "reponse": "<pre style='background:#2d2d2d; color:#f8f8f2; padding:12px; border-radius:6px; font-size:0.8em;'>\nimport { create } from 'zustand';\nimport { devtools } from 'zustand/middleware';\n\ninterface ProductStore {\n  products: Product[];\n  personalProducts: Product[];\n  searchResults: Product[];\n  isLoading: boolean;\n  error: string | null;\n  page: number;\n  hasMore: boolean;\n  searchQuery: string;\n\n  fetchFeed: (page?: number) => Promise<void>;\n  searchProducts: (query: string, page?: number) => Promise<void>;\n  fetchPersonalProducts: (page?: number) => Promise<void>;\n  clearSearch: () => void;\n}\n\nexport const useProductStore = create<ProductStore>()(\n  devtools(\n    (set, get) => ({\n      products: [],\n      personalProducts: [],\n      searchResults: [],\n      isLoading: false,\n      error: null,\n      page: 0,\n      hasMore: true,\n      searchQuery: '',\n\n      fetchFeed: async (page = 1) => {\n        if (get().isLoading) return;\n        set({ isLoading: true, error: null });\n        try {\n          const response = await productService.getFeed(page);\n          set((state) => ({\n            products: page === 1 ? response.data : [...state.products, ...response.data],\n            hasMore: response.meta.hasNextPage,\n            page: response.meta.currentPage,\n            isLoading: false,\n          }));\n        } catch (error) {\n          set({ error: error.message, isLoading: false });\n        }\n      },\n\n      searchProducts: async (query: string, page = 1) => {\n        set({ isLoading: true, error: null, searchQuery: query });\n        try {\n          const response = await productService.search(query, page);\n          set((state) => ({\n            searchResults: page === 1 ? response.data : [...state.searchResults, ...response.data],\n            hasMore: response.meta.hasNextPage,\n            page: response.meta.currentPage,\n            isLoading: false,\n          }));\n        } catch (error) {\n          set({ error: error.message, isLoading: false });\n        }\n      },\n\n      fetchPersonalProducts: async (page = 1) => {\n        set({ isLoading: true, error: null });\n        try {\n          const response = await productService.getPersonal(page);\n          set((state) => ({\n            personalProducts: page === 1 ? response.data : [...state.personalProducts, ...response.data],\n            hasMore: response.meta.hasNextPage,\n            page: response.meta.currentPage,\n            isLoading: false,\n          }));\n        } catch (error) {\n          set({ error: error.message, isLoading: false });\n        }\n      },\n\n      clearSearch: () => set({ searchResults: [], searchQuery: '' }),\n    }),\n    { name: 'ProductStore' }\n  )\n);\n</pre>"
        },
        {
          "question": "<p><strong>3. (0,5 pt)</strong> Expliquez l'utilité du middleware <code>devtools</code> et de <code>persist</code> dans les stores Zustand.</p>",
          "reponse": "<p><strong><code>devtools</code> :</strong> Ce middleware intègre le store avec Redux DevTools, permettant de visualiser les mutations d'état, de naviguer dans l'historique des actions et de chronométrer les performances. Très utile pour le débogage.</p><p><strong><code>persist</code> :</strong> Ce middleware permet de sauvegarder l'état du store dans un stockage persistant (AsyncStorage, SecureStore, etc.). Les données sont automatiquement restaurées au redémarrage de l'application, ce qui est essentiel pour le token JWT ou les préférences utilisateur.</p>"
        }
      ]
    },
    {
      "titre": "Communication avec l'API Backend",
      "points": "3 pts",
      "enonce": "<p>L'application communique avec un backend NestJS via Axios. Vous devez configurer le client HTTP et les services d'API.</p>",
      "questions": [
        {
          "question": "<p><strong>1. (1,5 pts)</strong> Configurez le service <code>api.ts</code> avec Axios en incluant : la baseURL, les intercepteurs de requête pour ajouter le token JWT, et les intercepteurs de réponse pour gérer les erreurs 401 (refresh token).</p>",
          "reponse": "<pre style='background:#2d2d2d; color:#f8f8f2; padding:12px; border-radius:6px; font-size:0.8em;'>\nimport axios from 'axios';\nimport AsyncStorage from '@react-native-async-storage/async-storage';\nimport Constants from 'expo-constants';\n\nconst API_URL = Constants.expoConfig?.extra?.apiUrl || 'http://localhost:3000';\n\nexport const api = axios.create({\n  baseURL: API_URL,\n  timeout: 30000,\n  headers: {\n    'Content-Type': 'application/json',\n  },\n});\n\n// Intercepteur de requête - Ajout du token\napi.interceptors.request.use(\n  async (config) => {\n    const token = await AsyncStorage.getItem('auth_token');\n    if (token) {\n      config.headers.Authorization = `Bearer ${token}`;\n    }\n    return config;\n  },\n  (error) => Promise.reject(error)\n);\n\n// Intercepteur de réponse - Gestion des erreurs 401\napi.interceptors.response.use(\n  (response) => response,\n  async (error) => {\n    const originalRequest = error.config;\n    \n    if (error.response?.status === 401 && !originalRequest._retry) {\n      originalRequest._retry = true;\n      \n      try {\n        const refreshToken = await AsyncStorage.getItem('refresh_token');\n        const response = await api.post('/auth/refresh', { refreshToken });\n        const { token } = response.data;\n        \n        await AsyncStorage.setItem('auth_token', token);\n        originalRequest.headers.Authorization = `Bearer ${token}`;\n        \n        return api(originalRequest);\n      } catch (refreshError) {\n        // Rediriger vers l'écran de login\n        return Promise.reject(refreshError);\n      }\n    }\n    \n    return Promise.reject(error);\n  }\n);\n</pre>"
        },
        {

          "reponse": "<pre style='background:#2d2d2d; color:#f8f8f2; padding:12px; border-radius:6px; font-size:0.75em; overflow-x:auto;'>\nimport React, { useEffect, useCallback } from 'react';\nimport { View, ScrollView, RefreshControl } from 'react-native';\nimport { useFocusEffect } from '@react-navigation/native';\nimport { useProductStore } from '../stores/productStore';\nimport { useCategoryStore } from '../stores/categoryStore';\nimport { useRecommendationStore } from '../stores/recommendationStore';\nimport { CategoryGrid } from '../components/CategoryGrid';\nimport { ProductSection } from '../components/ProductSection';\n\nconst HomeScreen = () => {\n  const { products, isLoading, fetchFeed } = useProductStore();\n  const { categories, fetchCategories } = useCategoryStore();\n  const { recommendations, fetchRecommendations } = useRecommendationStore();\n\n  // Chargement initial\n  useEffect(() => {\n    fetchFeed();\n    fetchCategories();\n    fetchRecommendations();\n  }, []);\n\n  // Rafraîchissement au focus\n  useFocusEffect(\n    useCallback(() => {\n      fetchFeed();\n      fetchRecommendations();\n    }, [])\n  );\n\n  const onRefresh = useCallback(() => {\n    fetchFeed(1, true);\n    fetchCategories(true);\n    fetchRecommendations(true);\n  }, []);\n\n  return (\n    <ScrollView\n      refreshControl={\n        <RefreshControl refreshing={isLoading} onRefresh={onRefresh} />\n      }\n    >\n      {/* Barre de recherche rapide */}\n      <SearchBar onPress={() => navigation.navigate('Search')} />\n\n      {/* Catégories */}\n      <CategoryGrid categories={categories} />\n\n      {/* Produits en vedette */}\n      <ProductSection\n        title=\"En vedette\"\n        products={products.filter(p => p.isFeatured)}\n        horizontal\n      />\n\n      {/* Recommandations personnalisées */}\n      <ProductSection\n        title=\"Recommandations pour vous\"\n        products={recommendations}\n        horizontal\n      />\n\n      {/* Produits près de vous */}\n      <ProductSection\n        title=\"Près de vous\"\n        products={products.filter(p => p.distance < 10)}\n        horizontal\n      />\n\n      {/* Tous les produits */}\n      <ProductSection\n        title=\"Découvrir plus\"\n        products={products}\n        variant=\"grid\"\n        onSeeAll={() => navigation.navigate('Search')}\n      />\n    </ScrollView>\n  );\n};\n\nexport default HomeScreen;\n</pre>"

rice}>{product.price.toLocaleString('fr-FR')} FCFA</Text>\n        \n        <View style={styles.sellerInfo}>\n          <Image source={{ uri: product.sellerAvatar }} style={styles.sellerAvatar} />\n          <View>\n            <Text style={styles.sellerName}>{product.sellerName}</Text>\n            <Text style={styles.sellerRating}>⭐ {product.sellerRating} ({product.sellerReviews} avis)</Text>\n          </View>\n        </View>\n\n        <Text style={styles.description}>{product.description}</Text>\n      </View>\n\n      {/* Boutons d'action */}\n      <View style={styles.actionButtons}>\n        <TouchableOpacity style={styles.contactButton} onPress={handleContact}>\n          <Text style={styles.contactButtonText}>💬 Contacter le vendeur</Text>\n        </TouchableOpacity>\n        <TouchableOpacity style={styles.shareButton} onPress={handleShare}>\n          <Text style={styles.shareButtonText}>📤 Partager</Text>\n        </TouchableOpacity>\n      </View>\n\n      {/* Produits similaires */}\n      <ProductSection title=\"Produits similaires\" products={similarProducts} horizontal />\n    </ScrollView>\n  );\n};\n\nconst styles = StyleSheet.create({\n  container: {\n    flex: 1,\n    backgroundColor: '#fff',\n  },\n  carouselImage: {\n    width: 400,\n    height: 350,\n    resizeMode: 'cover',\n  },\n  favoriteButton: {\n    position: 'absolute',\n    top: 16,\n    right: 16,\n    backgroundColor: '#fff',\n    borderRadius: 24,\n    padding: 10,\n    shadowColor: '#000',\n    shadowOffset: { width: 0, height: 2 },\n    shadowOpacity: 0.1,\n    shadowRadius: 4,\n    elevation: 2,\n  },\n  infoContainer: {\n    padding: 16,\n  },\n  title: {\n    fontSize: 20,\n    fontWeight: 'bold',\n    color: '#1A1A1A',\n  },\n  price: {\n    fontSize: 24,\n    fontWeight: 'bold',\n    color: '#4CAF50',\n    marginTop: 8,\n  },\n  sellerInfo: {\n    flexDirection: 'row',\n    alignItems: 'center',\n    marginTop: 16,\n    padding: 12,\n    backgroundColor: '#F5F5F5',\n    borderRadius: 8,\n  },\n  sellerAvatar: {\n    width: 40,\n    height: 40,\n    borderRadius: 20,\n    marginRight: 12,\n  },\n  sellerName: {\n    fontSize: 14,\n    fontWeight: '600',\n  },\n  sellerRating: {\n    fontSize: 12,\n    color: '#757575',\n  },\n  description: {\n    fontSize: 14,\n    color: '#757575',\n    lineHeight: 20,\n    marginTop: 16,\n  },\n  actionButtons: {\n    flexDirection: 'row',\n    padding: 16,\n    gap: 12,\n  },\n  contactButton: {\n    flex: 1,\n    backgroundColor: '#4CAF50',\n    padding: 14,\n    borderRadius: 8,\n    alignItems: 'center',\n  },\n  contactButtonText: {\n    color: '#fff',\n    fontWeight: '600',\n  },\n  shareButton: {\n    padding: 14,\n    borderRadius: 8,\n    backgroundColor: '#F5F5F5',\n    alignItems: 'center',\n  },\n  shareButtonText: {\n    color: '#1A1A1A',\n  },\n});\n\nexport default ProductDetailScreen;\n</pre>"

          "reponse": "<p><strong>Implémentation de la recherche :</strong></p><ul><li><strong>Barre de recherche :</strong> Utiliser un <code>TextInput</code> avec <code>onChangeText</code> et un <code>useDebounce</code> de 300ms pour éviter les appels API trop fréquents.</li><li><strong>Autocomplétion :</strong> Afficher les suggestions sous forme de liste déroulante en utilisant le store <code>searchStore</code> qui stocke les suggestions de recherche.</li><li><strong>Pagination :</strong> Utiliser <code>FlatList</code> avec <code>onEndReached</code> et <code>onEndReachedThreshold</code> pour charger les résultats suivants. Le store gère l'état de la page et le flag <code>hasMore</code>.</li><li><strong>Filtres :</strong> Un modal de filtres (<code>FilterModal</code>) permet à l'utilisateur de trier par prix, état, localisation, etc.</li></ul><pre style='background:#2d2d2d; color:#f8f8f2; padding:12px; border-radius:6px; font-size:0.8em;'>\n// Utilisation du debounce\nconst debouncedQuery = useDebounce(query, 300);\n\nuseEffect(() => {\n  if (debouncedQuery.length > 2) {\n    searchProducts(debouncedQuery);\n  }\n}, [debouncedQuery]);\n\n// Pagination avec FlatList\n<FlatList\n  data={searchResults}\n  renderItem={({ item }) => <ProductCard product={item} />}\n  keyExtractor={(item) => item.id}\n  onEndReached={() => {\n    if (hasMore && !isLoading) {\n      searchProducts(searchQuery, page + 1);\n    }\n  }}\n  onEndReachedThreshold={0.3}\n/>\n</pre>"

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
