<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->

        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>

        <div class="footer-actions">

                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>

            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Développement d'une application mobile e-commerce multiplateforme",
  "classe": "Développement Web",
  "sequence": "Séquence 6 : Résilience, Notifications et Déploiement",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Gestion de la résilience hors ligne (8 pts)",
      "points": "8 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; padding: 10px;'> <p>Dans le contexte du Cameroun, où la couverture réseau peut être instable, la résilience hors ligne est une fonctionnalité essentielle de l'application Sawamart. L'objectif de cet exercice est d'évaluer votre capacité à concevoir et à implémenter des mécanismes de gestion hors ligne.</p> <div style='background-color: #f0f8ff; padding: 15px; border-radius: 8px; margin: 15px 0;'> <p><strong>Contexte :</strong></p> <p>Un utilisateur tente d'envoyer un message dans une discussion de chat, mais sa connexion réseau est interrompue. L'application doit garantir que son message n'est pas perdu et qu'il sera envoyé automatiquement dès que la connexion sera rétablie.</p> <p>De plus, l'application doit être capable de stocker en cache les dernières données consultées (produits, catégories) pour permettre une navigation en mode dégradé.</p> </div> <div style='background-color: #f5f5f5; padding: 15px; border-radius: 8px;'> <p><strong>Ressource :</strong></p> <p>Voici une structure de base d'un service de file d'attente hors ligne :</p> <pre style='background-color: #2d2d2d; color: #f8f8f2; padding: 10px; border-radius: 5px; overflow-x: auto;'><code>class OfflineQueueService { private QUEUE_KEY = '@offline_messages'; private isProcessing = false; private isOnline = false;  async addMessage(message) { /* À compléter */ } async processQueue() { /* À compléter */ } private async getQueue() { /* À compléter */ } private async removeFromQueue(messageId) { /* À compléter */ } }</code></pre> </div> </div>",
      "questions": [
        {
          "question": "<div style='font-family: Arial, sans-serif;'><p><strong>1.1 - Analyser (2 pts)</strong></p><p>Expliquez, en au moins 5 lignes, le rôle et l'importance du service <code>OfflineQueueService</code> dans l'application Sawamart. Quels sont les bénéfices pour l'utilisateur final ?</p></div>",
          "reponse": "<div style='font-family: Arial, sans-serif; padding: 10px;'><p>Le service <code>OfflineQueueService</code> est un composant central pour la résilience de l'application. Il agit comme un tampon de fiabilité en stockant les actions utilisateur (comme l'envoi de messages) dans une file d'attente locale lorsqu'aucune connexion réseau n'est disponible.</p><p><strong>Bénéfices pour l'utilisateur :</strong></p><ul><li><strong>Continuité d'utilisation :</strong> L'utilisateur n'est pas bloqué par une perte de connexion. Il peut continuer à utiliser l'application comme si de rien n'était.</li><li><strong>Fiabilité :</strong> Les données ne sont pas perdues. L'utilisateur a la certitude que ses actions seront exécutées automatiquement dès que la connexion sera rétablie.</li><li><strong>Transparence :</strong> Le processus de synchronisation est automatisé et ne nécessite aucune action de la part de l'utilisateur.</li><li><strong>Confiance :</strong> Une application qui ne perd pas les données des utilisateurs inspire confiance et fidélise.</li></ul></div>"
        },
        {
          "question": "<div style='font-family: Arial, sans-serif;'><p><strong>1.2 - Appliquer (3 pts)</strong></p><p>Complétez le code de la classe <code>OfflineQueueService</code> en implémentant les méthodes <code>addMessage</code> et <code>processQueue</code>. Vous pouvez utiliser les structures de données et librairies que vous jugerez appropriées.</p></div>",
          "reponse": "<div style='font-family: Arial, sans-serif; padding: 10px;'><pre style='background-color: #2d2d2d; color: #f8f8f2; padding: 10px; border-radius: 5px; overflow-x: auto;'><code>async addMessage(message) { const id = `temp_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`; const queuedMessage = { ...message, id, status: 'pending', retries: 0 };  // Stocker dans AsyncStorage await this.saveToQueue(queuedMessage);  // Si connecté, tenter l'envoi immédiat if (this.isOnline) { this.processQueue(); }  return id; }  async processQueue() { if (this.isProcessing || !this.isOnline) { return; }  this.isProcessing = true; const queue = await this.getQueue();  for (const message of queue) { if (message.status === 'sending') continue;  try { message.status = 'sending'; await this.updateMessageInQueue(message);  // Envoyer le message via WebSocket ou API const response = await this.sendMessageToServer(message);  // Supprimer de la file si réussi await this.removeFromQueue(message.id);  // Émettre un événement pour mettre à jour l'UI this.onMessageSent(message.id, response);  } catch (error) { // En cas d'échec, incrémenter le compteur de retries message.retries += 1; message.status = message.retries >= 3 ? 'failed' : 'pending'; await this.updateMessageInQueue(message); } }  this.isProcessing = false; }</code></pre></div>"
        },
        {
          "question": "<div style='font-family: Arial, sans-serif;'><p><strong>1.3 - Évaluer (3 pts)</strong></p><p>Imaginez que le réseau est instable et que la file d'attente contient plusieurs messages. Décrivez les mécanismes de gestion d'erreur que vous mettriez en place pour garantir l'intégrité des données. Discutez également de l'importance du feedback utilisateur dans ce contexte.</p></div>",
          "reponse": "<div style='font-family: Arial, sans-serif; padding: 10px;'><p>Pour garantir l'intégrité des données avec une file d'attente hors ligne, il est crucial de mettre en place plusieurs mécanismes :</p><p><strong>1. Persistance et reprise :</strong> Chaque message dans la file doit être persistant (sauvegardé dans AsyncStorage). En cas de redémarrage de l'application ou de perte de données, la file peut être reconstituée.</p><p><strong>2. Gestion des échecs (Retry) :</strong> Comme illustré dans l'exercice précédent, un mécanisme de retry avec un nombre de tentatives limité (ex: 3) est essentiel. Les échecs sont souvent temporaires (réseau instable, serveur saturé).</p><p><strong>3. Backoff exponentiel :</strong> L'espacement des tentatives (1s, 2s, 4s, 8s) permet de ne pas surcharger le serveur et de laisser le temps au réseau de se rétablir.</p><p><strong>4. Isolation des échecs :</strong> Un message qui échoue ne doit pas bloquer les autres. La file doit continuer à être traitée.</p><p><strong>5. Feedback utilisateur (le plus important !) :</strong></p><ul><li><strong>Indicateur de statut :</strong> Chaque message doit afficher un statut : "En cours d'envoi", "Envoyé", "Échec".</li><li><strong>Notification visuelle :</strong> Un indicateur global (badge) peut compter le nombre d'actions en attente.</li><li><strong>Actions utilisateur :</strong> L'utilisateur doit avoir la possibilité de réessayer manuellement en cas d'échec, ou de supprimer un message.</li></ul><p>Un feedback clair transforme une frustration potentielle (échec de l'envoi) en une confiance renforcée (l'utilisateur sait que l'application gère l'erreur et que le message est en sécurité).</p></div>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Notifications Push et Engagement Utilisateur (6 pts)",
      "points": "6 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; padding: 10px;'> <p>Les notifications push sont un levier puissant pour l'engagement des utilisateurs sur une plateforme e-commerce. Elles permettent de notifier en temps réel l'utilisateur sur des événements importants comme la confirmation d'un paiement, la validation d'un produit ou l'arrivée d'un nouveau message.</p> <div style='background-color: #f0fff0; padding: 15px; border-radius: 8px; margin: 15px 0;'> <p><strong>Rappel :</strong> Expo Notifications est l'outil recommandé pour gérer les notifications push dans les applications Expo.</p> </div> </div>",
      "questions": [
        {
          "question": "<div style='font-family: Arial, sans-serif;'><p><strong>2.1 - Comprendre (2 pts)</strong></p><p>Décrivez le flux complet d'une notification push, depuis l'initiation de l'événement côté serveur jusqu'à son affichage et au traitement du clic sur l'appareil de l'utilisateur.</p></div>",
          "reponse": "<div style='font-family: Arial, sans-serif; padding: 10px;'><p><strong>Flux complet d'une notification push :</strong></p><ol><li><strong>Événement serveur :</strong> Un événement déclenche l'envoi (ex: un nouveau message).</li><li><strong>Envoi par le Backend :</strong> Le serveur envoie une requête à FCM (Firebase Cloud Messaging) ou APNs (Apple Push Notification service) via l'API Expo.</li><li><strong>Réception par le service push :</strong> FCM/APNs reçoit la notification et la transmet à l'appareil cible.</li><li><strong>Réception par l'application (service worker) :</strong> L'application reçoit la notification et décide de l'afficher (ou de la traiter en arrière-plan).</li><li><strong>Affichage :</strong> La notification s'affiche dans le centre de notifications de l'appareil.</li><li><strong>Interaction utilisateur :</strong> L'utilisateur clique sur la notification.</li><li><strong>Deep Linking :</strong> L'application s'ouvre et navigue vers l'écran approprié (ex: l'écran de chat).</li></ol></div>"
        },
        {
          "question": "<div style='font-family: Arial, sans-serif;'><p><strong>2.2 - Appliquer (2 pts)</strong></p><p>Écrivez un exemple de code pour l'envoi d'une notification push à un utilisateur spécifique lorsque son produit a été validé. Utilisez la bibliothèque <code>expo-server-sdk</code> ou l'API REST d'Expo. Précisez les données que vous enverriez dans la notification (titre, corps, données, canal).</p></div>",
          "reponse": "<div style='font-family: Arial, sans-serif; padding: 10px;'><pre style='background-color: #2d2d2d; color: #f8f8f2; padding: 10px; border-radius: 5px; overflow-x: auto;'><code>import { Expo } from 'expo-server-sdk';  const expo = new Expo();  async function sendProductValidationNotification(userPushToken, productName) { // Vérifier si le token est valide if (!Expo.isExpoPushToken(userPushToken)) { console.error('Token invalide'); return; }  const messages = [{ to: userPushToken, sound: 'default', title: '✅ Produit validé !', body: `Votre produit "${productName}" est maintenant en ligne.`, data: { type: 'product_validation', productId: '123', screen: 'ProductDetail' }, }];  const chunks = expo.chunkPushNotifications(messages);  for (const chunk of chunks) { try { const receipts = await expo.sendPushNotificationsAsync(chunk); console.log(receipts); } catch (error) { console.error(error); } } }</code></pre></div>"
        },
        {
          "question": "<div style='font-family: Arial, sans-serif;'><p><strong>2.3 - Évaluer (2 pts)</strong></p><p>Comparez les avantages et les inconvénients de l'utilisation des notifications push "transactionnelles" (ex: confirmation de paiement) par rapport aux notifications "promotionnelles" (ex: nouvelles offres). Quelles sont les bonnes pratiques à adopter pour ne pas ennuyer l'utilisateur ?</p></div>",

          "reponse": "<div style='font-family: Arial, sans-serif; padding: 10px;'><p><strong>Étapes clés avec EAS :</strong></p><ol><li><strong>Configuration :</strong> Créer un compte EAS et configurer le projet (<code>eas.json</code>).</li><li><strong>Assets :</strong> Préparer les icônes, le splash screen et les captures d'écran pour Android.</li><li><strong>Compte Google Play :</strong> Avoir un compte développeur Google Play (payant).</li><li><strong>Keystore :</strong> Générer et gérer un fichier de signature (keystore). EAS peut le faire automatiquement.</li><li><strong>Build :</strong> Exécuter <code>eas build -p android --profile production</code> pour compiler le bundle (AAB).</li><li><strong>Test :</strong> Tester le build sur un émulateur ou un appareil réel.</li><li><strong>Soumission :</strong> Exécuter <code>eas submit -p android</code> pour soumettre l'AAB à la console Google Play.</li></ol></div>"

veloppement non disponibles en production.</li><li><strong>Rejet par les stores :</strong> Un build mal signé ou avec des permissions inappropriées sera rejeté.</li></ul></div>"

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
