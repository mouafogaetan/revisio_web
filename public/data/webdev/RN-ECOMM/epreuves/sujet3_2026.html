<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Développement d'une application mobile e-commerce multiplateforme",
  "classe": "Développement Web",
  "sequence": "Séquence 3 : Communication API, Authentification et Gestion des Utilisateurs",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Configuration d'Axios et Intercepteurs",
      "points": "4 pts",
      "enonce": "<p>Dans le cadre du développement de l'application mobile <strong>SawaMart</strong>, vous devez mettre en place une couche de communication robuste avec le backend NestJS.</p><p>L'API backend est accessible à l'adresse <code>https://api.sawamart.com</code> et utilise des tokens JWT pour l'authentification.</p><p>Rappel : Un intercepteur Axios permet d'intercepter les requêtes avant qu'elles ne soient envoyées ou les réponses avant qu'elles ne soient traitées.</p>",
      "questions": [
        {
          "question": "1) Créez un fichier <code>api.ts</code> qui configure une instance Axios avec une baseURL, un timeout de 10 secondes et les en-têtes appropriés.",
          "reponse": "```typescript\n// services/api.ts\nimport axios from 'axios';\n\nconst api = axios.create({\n  baseURL: 'https://api.sawamart.com',\n  timeout: 10000,\n  headers: {\n    'Content-Type': 'application/json',\n    'Accept': 'application/json',\n  },\n});\n\nexport default api;\n```"
        },
        {
          "question": "2) Mettez en place un intercepteur de requête qui ajoute automatiquement le token JWT dans l'en-tête <code>Authorization</code> si l'utilisateur est authentifié.",
          "reponse": "```typescript\n// services/api.ts\nimport axios from 'axios';\nimport { authStore } from '../stores/authStore';\n\nconst api = axios.create({\n  baseURL: 'https://api.sawamart.com',\n  timeout: 10000,\n});\n\n// Intercepteur de requête\napi.interceptors.request.use(\n  (config) => {\n    const token = authStore.getState().token;\n    if (token) {\n      config.headers.Authorization = `Bearer ${token}`;\n    }\n    return config;\n  },\n  (error) => Promise.reject(error)\n);\n\nexport default api;\n```"
        },
        {
          "question": "3) Mettez en place un intercepteur de réponse qui gère les erreurs 401 (token expiré) en tentant de rafraîchir le token automatiquement.",
          "reponse": "```typescript\n// services/api.ts\nimport axios from 'axios';\nimport { authStore } from '../stores/authStore';\n\napi.interceptors.response.use(\n  (response) => response,\n  async (error) => {\n    const originalRequest = error.config;\n    \n    if (error.response?.status === 401 && !originalRequest._retry) {\n      originalRequest._retry = true;\n      \n      try {\n        const refreshToken = authStore.getState().refreshToken;\n        const response = await axios.post('https://api.sawamart.com/auth/refresh', {\n          refreshToken,\n        });\n        \n        const newToken = response.data.accessToken;\n        authStore.getState().setToken(newToken);\n        \n        originalRequest.headers.Authorization = `Bearer ${newToken}`;\n        return api(originalRequest);\n      } catch (refreshError) {\n        authStore.getState().logout();\n        return Promise.reject(refreshError);\n      }\n    }\n    \n    return Promise.reject(error);\n  }\n);\n```"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Services d'API et Authentification",
      "points": "5 pts",
      "enonce": "<p>Vous devez créer les services d'API pour l'authentification des utilisateurs de SawaMart.</p><p>L'API backend expose les endpoints suivants :</p><ul><li><code>POST /auth/register</code> : inscription d'un nouvel utilisateur</li><li><code>POST /auth/login</code> : connexion d'un utilisateur</li><li><code>POST /auth/refresh</code> : rafraîchissement du token JWT</li><li><code>POST /auth/verify-otp</code> : vérification du code OTP</li></ul><p>Les réponses de l'API sont typées en TypeScript.</p>",
      "questions": [
        {
          "question": "1) Définissez les interfaces TypeScript pour les requêtes et réponses de l'API d'authentification.",
          "reponse": "```typescript\n// types/auth.types.ts\n\nexport interface RegisterRequest {\n  phone: string;\n  password: string;\n  name: string;\n}\n\nexport interface LoginRequest {\n  phone: string;\n  password: string;\n}\n\nexport interface AuthResponse {\n  accessToken: string;\n  refreshToken: string;\n  user: User;\n}\n\nexport interface VerifyOtpRequest {\n  phone: string;\n  otp: string;\n}\n\nexport interface RefreshTokenRequest {\n  refreshToken: string;\n}\n\nexport interface User {\n  id: string;\n  phone: string;\n  name: string;\n  email?: string;\n  role: 'user' | 'seller' | 'admin';\n  isActive: boolean;\n  createdAt: string;\n}\n```"
        },
        {
          "question": "2) Créez un <code>authService</code> avec les méthodes <code>register</code>, <code>login</code>, <code>verifyOTP</code> et <code>refreshToken</code>.",
          "reponse": "```typescript\n// services/authService.ts\nimport api from './api';\nimport {\n  RegisterRequest,\n  LoginRequest,\n  AuthResponse,\n  VerifyOtpRequest,\n  RefreshTokenRequest,\n} from '../types/auth.types';\n\nexport const authService = {\n  register: async (data: RegisterRequest): Promise<AuthResponse> => {\n    const response = await api.post<AuthResponse>('/auth/register', data);\n    return response.data;\n  },\n\n  login: async (data: LoginRequest): Promise<AuthResponse> => {\n    const response = await api.post<AuthResponse>('/auth/login', data);\n    return response.data;\n  },\n\n  verifyOTP: async (data: VerifyOtpRequest): Promise<{ verified: boolean }> => {\n    const response = await api.post<{ verified: boolean }>('/auth/verify-otp', data);\n    return response.data;\n  },\n\n  refreshToken: async (data: RefreshTokenRequest): Promise<{ accessToken: string }> => {\n    const response = await api.post<{ accessToken: string }>('/auth/refresh', data);\n    return response.data;\n  },\n};\n```"
        },
        {
          "question": "3) Expliquez comment le <code>authStore</code> (Zustand) doit interagir avec le <code>authService</code> pour gérer l'état d'authentification.",
          "reponse": "Le <code>authStore</code> et le <code>authService</code> interagissent selon le schéma suivant :\n\n<ol><li><strong>Connexion</strong> : L'utilisateur soumet ses identifiants → <code>authService.login()</code> est appelé → En cas de succès, <code>authStore.setAuth(data)</code> est appelé pour stocker le token et les informations utilisateur</li><li><strong>Inscription</strong> : L'utilisateur remplit le formulaire → <code>authService.register()</code> est appelé → En cas de succès, un OTP est envoyé → L'utilisateur est redirigé vers l'écran de vérification</li><li><strong>Vérification OTP</strong> : L'utilisateur saisit le code → <code>authService.verifyOTP()</code> est appelé → En cas de succès, l'utilisateur est connecté</li><li><strong>Rafraîchissement</strong> : L'intercepteur Axios détecte un 401 → <code>authService.refreshToken()</code> est appelé → En cas de succès, <code>authStore.setToken(newToken)</code> est appelé</li><li><strong>Déconnexion</strong> : L'utilisateur se déconnecte → <code>authStore.logout()</code> est appelé → Le token est supprimé et l'utilisateur est redirigé vers l'écran de connexion</li></ol>\n\n<pre style='background:#1a202c; color:#a0aec0; padding:15px; border-radius:8px; font-size:0.8rem;'>\n// Exemple d'utilisation dans un composant\nconst login = async (phone: string, password: string) => {\n  try {\n    setLoading(true);\n    const response = await authService.login({ phone, password });\n    authStore.getState().setAuth(response);\n    navigation.navigate('Home');\n  } catch (error) {\n    setError('Identifiants invalides');\n  } finally {\n    setLoading(false);\n  }\n};\n</pre>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Écrans d'Authentification",
      "points": "5 pts",
      "enonce": "<p>Vous devez implémenter les écrans d'authentification pour SawaMart.</p><p>L'application doit gérer le flux suivant :</p><ol><li>L'utilisateur arrive sur l'écran de connexion (<code>LoginScreen</code>)</li><li>Il peut se connecter ou naviguer vers l'écran d'inscription (<code>RegisterScreen</code>)</li><li>Après inscription, il doit vérifier son numéro via OTP (<code>OtpVerificationScreen</code>)</li><li>L'écran OTP doit avoir un timer de 60 secondes et permettre la resoumission du code</li></ol>",
      "questions": [
        {
          "question": "1) Concevez l'interface utilisateur de l'écran <code>LoginScreen</code> avec validation des champs (téléphone, mot de passe).",
          "reponse": "```typescript\n// screens/LoginScreen.tsx\nimport React, { useState } from 'react';\nimport { View, Text, TextInput, TouchableOpacity, StyleSheet, Alert } from 'react-native';\nimport { useNavigation } from '@react-navigation/native';\nimport { authService } from '../services/authService';\nimport { authStore } from '../stores/authStore';\n\nexport const LoginScreen = () => {\n  const navigation = useNavigation();\n  const [phone, setPhone] = useState('');\n  const [password, setPassword] = useState('');\n  const [loading, setLoading] = useState(false);\n  const [errors, setErrors] = useState<{ phone?: string; password?: string }>({});\n\n  const validate = () => {\n    const newErrors: { phone?: string; password?: string } = {};\n    if (!phone || phone.length < 12) {\n      newErrors.phone = 'Numéro de téléphone invalide (ex: +237699999999)';\n    }\n    if (!password || password.length < 6) {\n      newErrors.password = 'Le mot de passe doit contenir au moins 6 caractères';\n    }\n    setErrors(newErrors);\n    return Object.keys(newErrors).length === 0;\n  };\n\n  const handleLogin = async () => {\n    if (!validate()) return;\n    setLoading(true);\n    try {\n      const response = await authService.login({ phone, password });\n      authStore.getState().setAuth(response);\n      navigation.navigate('Home');\n    } catch (error) {\n      Alert.alert('Erreur', 'Identifiants invalides ou compte non vérifié');\n    } finally {\n      setLoading(false);\n    }\n  };\n\n  return (\n    <View style={styles.container}>\n      <Text style={styles.title}>Connexion</Text>\n      <Text style={styles.subtitle}>Bienvenue sur SawaMart</Text>\n\n      <View style={styles.form}>\n        <TextInput\n          style={[styles.input, errors.phone && styles.inputError]}\n          placeholder=\"+237 699 999 999\"\n          keyboardType=\"phone-pad\"\n          value={phone}\n          onChangeText={setPhone}\n        />\n        {errors.phone && <Text style={styles.error}>{errors.phone}</Text>}\n\n        <TextInput\n          style={[styles.input, errors.password && styles.inputError]}\n          placeholder=\"Mot de passe\"\n          secureTextEntry\n          value={password}\n          onChangeText={setPassword}\n        />\n        {errors.password && <Text style={styles.error}>{errors.password}</Text>}\n\n        <TouchableOpacity\n          style={styles.loginButton}\n          onPress={handleLogin}\n          disabled={loading}\n        >\n          <Text style={styles.loginButtonText}>\n            {loading ? 'Connexion...' : 'Se connecter'}\n          </Text>\n        </TouchableOpacity>\n\n        <TouchableOpacity\n          onPress={() => navigation.navigate('Register')}\n        >\n          <Text style={styles.registerLink}>\n            Pas encore de compte ? S'inscrire\n          </Text>\n        </TouchableOpacity>\n      </View>\n    </View>\n  );\n};\n```"
        },
        {
          "question": "2) Implémentez l'écran <code>OtpVerificationScreen</code> avec un timer de 60 secondes et la possibilité de renvoyer le code.",

ner}>\n      <Text style={styles.title}>Vérification</Text>\n      <Text style={styles.subtitle}>\n        Un code à 6 chiffres a été envoyé au {phone}\n      </Text>\n\n      <View style={styles.otpContainer}>\n        {otp.map((digit, index) => (\n          <TextInput\n            key={index}\n            style={styles.otpInput}\n            keyboardType=\"number-pad\"\n            maxLength={1}\n            value={digit}\n            onChangeText={(text) => {\n              const newOtp = [...otp];\n              newOtp[index] = text;\n              setOtp(newOtp);\n              // Auto-avancement vers le champ suivant\n              if (text && index < 5) {\n                const nextInput = document.getElementById(`otp-${index + 1}`);\n                if (nextInput) nextInput.focus();\n              }\n            }}\n          />\n        ))}\n      </View>\n\n      <TouchableOpacity\n        style={styles.verifyButton}\n        onPress={handleVerify}\n        disabled={loading}\n      >\n        <Text style={styles.verifyButtonText}>\n          {loading ? 'Vérification...' : 'Vérifier'}\n        </Text>\n      </TouchableOpacity>\n\n      <View style={styles.resendContainer}>\n        {canResend ? (\n          <TouchableOpacity onPress={handleResend}>\n            <Text style={styles.resendText}>Renvoyer le code</Text>\n          </TouchableOpacity>\n        ) : (\n          <Text style={styles.timerText}>Renvoyer dans {timer}s</Text>\n        )}\n      </View>\n    </View>\n  );\n};\n```"

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
