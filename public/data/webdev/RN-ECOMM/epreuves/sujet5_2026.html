<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Développement d'une application mobile e-commerce multiplateforme",
  "classe": "Développement Web",
  "sequence": "Sequence 5",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Gestion d'état avec Zustand et Communication API",
      "points": "6 pts",
      "enonce": "<div style='padding: 10px;'>\n<p>Dans le cadre du développement de l'application mobile <strong>SawaMart</strong>, vous devez gérer l'état de l'application et la communication avec le backend. Vous avez mis en place des stores Zustand et un client Axios pour interagir avec l'API NestJS.</p>\n<p>Répondez aux questions suivantes en vous appuyant sur les spécifications et les bonnes pratiques vues en cours.</p>\n</div>",
      "questions": [
        {
          "question": "<p><strong>1. Store d'authentification (2 pts)</strong></p><p>Créez un store Zustand <code>useAuthStore</code> qui gère l'état d'authentification de l'utilisateur. Ce store doit :</p><p>- Stocker le token d'accès, le refresh token et les informations de l'utilisateur.</p><p>- Fournir des méthodes <code>login</code>, <code>logout</code> et <code>refreshToken</code>.</p><p>- Utiliser la persistance avec <code>AsyncStorage</code> via le middleware <code>persist</code>.</p>",
          "reponse": "<div style='background: #1e1e1e; color: #d4d4d4; padding: 15px; border-radius: 8px; font-family: monospace; overflow-x: auto;'>\n<p>// stores/authStore.ts</p>\n<p>import { create } from 'zustand';</p>\n<p>import { persist, createJSONStorage } from 'zustand/middleware';</p>\n<p>import AsyncStorage from '@react-native-async-storage/async-storage';</p>\n<p>import { authService } from '../services/authService';</p>\n<br>\n<p>interface AuthState {</p>\n<p>  user: User | null;</p>\n<p>  accessToken: string | null;</p>\n<p>  refreshToken: string | null;</p>\n<p>  isAuthenticated: boolean;</p>\n<p>  login: (email: string, password: string) => Promise<void>;</p>\n<p>  logout: () => Promise<void>;</p>\n<p>  refreshToken: () => Promise<void>;</p>\n<p>}</p>\n<br>\n<p>export const useAuthStore = create&lt;AuthState&gt;()(</p>\n<p>  persist(</p>\n<p>    (set, get) => ({</p>\n<p>      user: null,</p>\n<p>      accessToken: null,</p>\n<p>      refreshToken: null,</p>\n<p>      isAuthenticated: false,</p>\n<p>      login: async (email: string, password: string) => {</p>\n<p>        const response = await authService.login(email, password);</p>\n<p>        set({</p>\n<p>          user: response.user,</p>\n<p>          accessToken: response.accessToken,</p>\n<p>          refreshToken: response.refreshToken,</p>\n<p>          isAuthenticated: true,</p>\n<p>        });</p>\n<p>      },</p>\n<p>      logout: async () => {</p>\n<p>        await authService.logout();</p>\n<p>        set({</p>\n<p>          user: null,</p>\n<p>          accessToken: null,</p>\n<p>          refreshToken: null,</p>\n<p>          isAuthenticated: false,</p>\n<p>        });</p>\n<p>      },</p>\n<p>      refreshToken: async () => {</p>\n<p>        const { refreshToken } = get();</p>\n<p>        if (!refreshToken) throw new Error('No refresh token');</p>\n<p>        const response = await authService.refresh(refreshToken);</p>\n<p>        set({ accessToken: response.accessToken });</p>\n<p>      },</p>\n<p>    }),</p>\n<p>    {</p>\n<p>      name: 'auth-storage',</p>\n<p>      storage: createJSONStorage(() => AsyncStorage),</p>\n<p>    }</p>\n<p>  )</p>\n<p>);</p>\n</div>"
        },
        {
          "question": "<p><strong>2. Intercepteur Axios pour l'authentification (2 pts)</strong></p><p>Configurez un intercepteur de requête Axios qui ajoute automatiquement le token JWT à l'en-tête <code>Authorization</code> de chaque requête.</p><p>Configurez également un intercepteur de réponse qui gère les erreurs 401 en tentant de rafraîchir le token automatiquement.</p>",
          "reponse": "<div style='background: #1e1e1e; color: #d4d4d4; padding: 15px; border-radius: 8px; font-family: monospace; overflow-x: auto;'>\n<p>// services/api.ts</p>\n<p>import axios from 'axios';</p>\n<p>import { useAuthStore } from '../stores/authStore';</p>\n<br>\n<p>export const api = axios.create({</p>\n<p>  baseURL: process.env.API_URL,</p>\n<p>  timeout: 30000,</p>\n<p>  headers: { 'Content-Type': 'application/json' },</p>\n<p>});</p>\n<br>\n<p>// Intercepteur de requête</p>\n<p>api.interceptors.request.use(</p>\n<p>  (config) => {</p>\n<p>    const token = useAuthStore.getState().accessToken;</p>\n<p>    if (token) {</p>\n<p>      config.headers.Authorization = `Bearer ${token}`;</p>\n<p>    }</p>\n<p>    return config;</p>\n<p>  },</p>\n<p>  (error) => Promise.reject(error)</p>\n<p>);</p>\n<br>\n<p>// Intercepteur de réponse</p>\n<p>let isRefreshing = false;</p>\n<p>let failedQueue: any[] = [];</p>\n<br>\n<p>api.interceptors.response.use(</p>\n<p>  (response) => response,</p>\n<p>  async (error) => {</p>\n<p>    const originalRequest = error.config;</p>\n<p>    if (error.response?.status === 401 && !originalRequest._retry) {</p>\n<p>      originalRequest._retry = true;</p>\n<p>      if (!isRefreshing) {</p>\n<p>        isRefreshing = true;</p>\n<p>        try {</p>\n<p>          await useAuthStore.getState().refreshToken();</p>\n<p>          const newToken = useAuthStore.getState().accessToken;</p>\n<p>          isRefreshing = false;</p>\n<p>          failedQueue.forEach((cb) => cb(newToken));</p>\n<p>          failedQueue = [];</p>\n<p>          return api(originalRequest);</p>\n<p>        } catch (refreshError) {</p>\n<p>          isRefreshing = false;</p>\n<p>          useAuthStore.getState().logout();</p>\n<p>          return Promise.reject(refreshError);</p>\n<p>        }</p>\n<p>      }</p>\n<p>      return new Promise((resolve) => {</p>\n<p>        failedQueue.push((token: string) => {</p>\n<p>          originalRequest.headers.Authorization = `Bearer ${token}`;</p>\n<p>          resolve(api(originalRequest));</p>\n<p>        });</p>\n<p>      });</p>\n<p>    }</p>\n<p>    return Promise.reject(error);</p>\n<p>  }</p>\n<p>);</p>\n</div>"
        },
        {
          "question": "<p><strong>3. Upload d'images (2 pts)</strong></p><p>Écrivez une fonction <code>uploadProductImages</code> qui utilise <code>FormData</code> pour envoyer plusieurs images au backend.</p><p>Détaillez la structure du FormData et les headers nécessaires.</p>",
          "reponse": "<div style='background: #1e1e1e; color: #d4d4d4; padding: 15px; border-radius: 8px; font-family: monospace; overflow-x: auto;'>\n<p>// services/productService.ts</p>\n<p>import { api } from './api';</p>\n<p>import { ImageAsset } from 'expo-image-picker';</p>\n<br>\n<p>export const uploadProductImages = async (</p>\n<p>  productId: string,</p>\n<p>  images: ImageAsset[]</p>\n<p>): Promise&lt;string[]&gt; => {</p>\n<p>  const formData = new FormData();</p>\n<p>  </p>\n<p>  images.forEach((image, index) => {</p>\n<p>    formData.append('images', {</p>\n<p>      uri: image.uri,</p>\n<p>      name: image.filename || `image_${index}.jpg`,</p>\n<p>      type: image.mimeType || 'image/jpeg',</p>\n<p>    } as any);</p>\n<p>  });</p>\n<p>  </p>\n<p>  const response = await api.post(</p>\n<p>    `/products/${productId}/images`,</p>\n<p>    formData,</p>\n<p>    {</p>\n<p>      headers: {</p>\n<p>        'Content-Type': 'multipart/form-data',</p>\n<p>      },</p>\n<p>    }</p>\n<p>  );</p>\n<p>  </p>\n<p>  return response.data.imageUrls;</p>\n<p>};</p>\n</div>\n<p><strong>Explication :</strong></p>\n<p>1. On crée un objet <code>FormData</code> pour construire la requête multipart.</p>\n<p>2. On ajoute chaque image avec son URI, son nom et son type MIME.</p>\n<p>3. On envoie la requête POST avec le header <code>Content-Type: multipart/form-data</code>.</p>\n<p>4. Le backend traite les images et retourne les URLs stockées (Cloudinary, S3).</p>"
        }
      ]
    },
    {
      "titre": "Authentification et Gestion du Profil",
      "points": "6 pts",
      "enonce": "<div style='padding: 10px;'>\n<p>L'application SawaMart doit permettre aux utilisateurs de s'authentifier et de gérer leur profil. Vous devez développer les écrans d'authentification et de gestion du profil utilisateur.</p>\n</div>",
      "questions": [
        {
          "question": "<p><strong>1. Écran de connexion (2 pts)</strong></p><p>Créez l'écran <code>LoginScreen</code> avec :</p><p>- Des champs pour le numéro de téléphone et le mot de passe.</p><p>- Une validation des champs avant soumission.</p><p>- Une gestion des erreurs d'authentification.</p><p>- Une navigation vers l'écran d'inscription.</p>",

on...' : 'Se connecter'}&lt;/Text&gt;</p>\n<p>      &lt;/TouchableOpacity&gt;</p>\n<p>      &lt;TouchableOpacity onPress={() => navigation.navigate('Register')}&gt;</p>\n<p>        &lt;Text&gt;Créer un compte&lt;/Text&gt;</p>\n<p>      &lt;/TouchableOpacity&gt;</p>\n<p>    &lt;/View&gt;</p>\n<p>  );</p>\n<p>};</p>\n</div>"

uchableOpacity&gt;</p>\n<p>    &lt;/View&gt;</p>\n<p>  );</p>\n<p>};</p>\n</div>"

          "reponse": "<div style='background: #1e1e1e; color: #d4d4d4; padding: 15px; border-radius: 8px; font-family: monospace; overflow-x: auto;'>\n<p>// components/ProductCard.tsx</p>\n<p>import { View, Text, Image, TouchableOpacity } from 'react-native';</p>\n<p>import { useFavoriteStore } from '../stores/favoriteStore';</p>\n<p>import { useNavigation } from '@react-navigation/native';</p>\n<br>\n<p>interface ProductCardProps {</p>\n<p>  product: Product;</p>\n<p>  variant: 'grid' | 'list' | 'horizontal';</p>\n<p>}</p>\n<br>\n<p>export const ProductCard = ({ product, variant }: ProductCardProps) => {</p>\n<p>  const { toggleFavorite, isFavorite } = useFavoriteStore();</p>\n<p>  const navigation = useNavigation();</p>\n<br>\n<p>  const handlePress = () => {</p>\n<p>    navigation.navigate('ProductDetail', { productId: product.id });</p>\n<p>  };</p>\n<br>\n<p>  const variantStyles = {</p>\n<p>    grid: { width: '48%', marginBottom: 16 },</p>\n<p>    list: { width: '100%', marginBottom: 12, flexDirection: 'row' },</p>\n<p>    horizontal: { width: 200, marginRight: 12 },</p>\n<p>  };</p>\n<br>\n<p>  return (</p>\n<p>    &lt;TouchableOpacity style={variantStyles[variant]} onPress={handlePress}&gt;</p>\n<p>      &lt;Image source={{ uri: product.images[0] }} style={{ width: '100%', height: 150 }} /&gt;</p>\n<p>      &lt;View&gt;</p>\n<p>        &lt;Text numberOfLines={1}&gt;{product.name}&lt;/Text&gt;</p>\n<p>        &lt;Text&gt;{product.price} FCFA&lt;/Text&gt;</p>\n<p>        &lt;Text&gt;{product.seller.location}&lt;/Text&gt;</p>\n<p>      &lt;/View&gt;</p>\n<p>      &lt;TouchableOpacity onPress={() => toggleFavorite(product.id)}&gt;</p>\n<p>        &lt;Text&gt;{isFavorite(product.id) ? '❤️' : '🤍'}&lt;/Text&gt;</p>\n<p>      &lt;/TouchableOpacity&gt;</p>\n<p>    &lt;/TouchableOpacity&gt;</p>\n<p>  );</p>\n<p>};</p>\n</div>"

          "reponse": "<p><strong>Structure du HomeScreen :</strong></p>\n<p>L'écran d'accueil est organisé en sections dans une <code>ScrollView</code> :</p>\n<br>\n<ul>\n<li><strong>Barre de recherche</strong> : En haut pour une recherche rapide.</li>\n<li><strong>CategoryGrid</strong> : Grille 4 colonnes avec <code>FlatList numColumns={4}</code>.</li>\n<li><strong>Section \"En vedette\"</strong> : <code>FlatList horizontal</code> avec <code>ProductCard variant='horizontal'</code>.</li>\n<li><strong>Section \"Recommandations\"</strong> : <code>FlatList horizontal</code> avec <code>ProductCard variant='horizontal'</code>.</li>\n</ul>\n<br>\n<p><strong>Rafraîchissement :</strong></p>\n<div style='background: #1e1e1e; color: #d4d4d4; padding: 15px; border-radius: 8px; font-family: monospace; overflow-x: auto;'>\n<p>// HomeScreen.tsx</p>\n<p>const [refreshing, setRefreshing] = useState(false);</p>\n<p>const { fetchFeed, fetchCategories, fetchRecommendations } = useProductStore();</p>\n<br>\n<p>const loadData = async () => {</p>\n<p>  setRefreshing(true);</p>\n<p>  await Promise.all([</p>\n<p>    fetchFeed(),</p>\n<p>    fetchCategories(),</p>\n<p>    fetchRecommendations(),</p>\n<p>  ]);</p>\n<p>  setRefreshing(false);</p>\n<p>};</p>\n<br>\n<p>useFocusEffect(useCallback(() => { loadData(); }, []));</p>\n<br>\n<p>&lt;ScrollView</p>\n<p>  refreshControl={</p>\n<p>    &lt;RefreshControl refreshing={refreshing} onRefresh={loadData} /&gt;</p>\n<p>  }</p>\n<p>&gt;</p>\n<p>  {/* Contenu */}</p>\n<p>&lt;/ScrollView&gt;</p>\n</div>"

        {
          "question": "<p><strong>1. Service WebSocket (2 pts)</strong></p><p>Créez un service WebSocket singleton qui :</p><p>- Se connecte au serveur avec le token JWT.</p><p>- Gère la reconnexion automatique.</p><p>- Écoute les événements <code>new_message</code> et <code>typing_status</code>.</p><p>- Fournit des méthodes <code>sendMessage</code> et <code>joinRoom</code>.</p>",
          "reponse": "<div style='background: #1e1e1e; color: #d4d4d4; padding: 15px; border-radius: 8px; font-family: monospace; overflow-x: auto;'>\n<p>// services/websocket.service.ts</p>\n<p>import { io, Socket } from 'socket.io-client';</p>\n<p>import { useAuthStore } from '../stores/authStore';</p>\n<p>import { useChatStore } from '../stores/chatStore';</p>\n<br>\n<p>const WS_URL = process.env.WS_URL || 'wss://api.sawamart.com';</p>\n<br>\n<p>class WebSocketService {</p>\n<p>  private socket: Socket | null = null;</p>\n<p>  private reconnectAttempts = 0;</p>\n<p>  private maxAttempts = 5;</p>\n<br>\n<p>  connect() {</p>\n<p>    const token = useAuthStore.getState().accessToken;</p>\n<p>    if (!token || this.socket?.connected) return;</p>\n<br>\n<p>    this.socket = io(WS_URL, {</p>\n<p>      auth: { token },</p>\n<p>      reconnection: true,</p>\n<p>      reconnectionAttempts: this.maxAttempts,</p>\n<p>      reconnectionDelay: 1000,</p>\n<p>    });</p>\n<br>\n<p>    this.socket.on('connect', () => {</p>\n<p>      console.log('Connecté au serveur');</p>\n<p>      this.reconnectAttempts = 0;</p>\n<p>    });</p>\n<br>\n<p>    this.socket.on('new_message', (data) => {</p>\n<p>      useChatStore.getState().addMessage(data.chatId, data.message);</p>\n<p>    });</p>\n<br>\n<p>    this.socket.on('typing_status', (data) => {</p>\n<p>      useChatStore.getState().setTypingStatus(data.userId, data.isTyping);</p>\n<p>    });</p>\n<p>  }</p>\n<br>\n<p>  sendMessage(chatId: string, content: string) {</p>\n<p>    this.socket?.emit('send_message', { chatId, content });</p>\n<p>  }</p>\n<br>\n<p>  joinRoom(roomId: string) {</p>\n<p>    this.socket?.emit('join_room', { roomId });</p>\n<p>  }</p>\n<p>}</p>\n<br>\n<p>export const websocketService = new WebSocketService();</p>\n</div>"

        {
          "question": "<p><strong>2. Gestion hors ligne (2 pts)</strong></p><p>Expliquez comment gérer l'envoi de messages lorsque l'utilisateur est hors ligne.</p><p>Décrivez le mécanisme de file d'attente avec AsyncStorage.</p>",
          "reponse": "<p><strong>File d'attente de messages hors ligne :</strong></p>\n<div style='background: #1e1e1e; color: #d4d4d4; padding: 15px; border-radius: 8px; font-family: monospace; overflow-x: auto;'>\n<p>// stores/offlineQueueStore.ts</p>\n<p>interface QueuedMessage {</p>\n<p>  id: string;</p>\n<p>  chatId: string;</p>\n<p>  content: string;</p>\n<p>  timestamp: number;</p>\n<p>  status: 'pending' | 'sending' | 'sent' | 'error';</p>\n<p>}</p>\n<br>\n<p>export const useOfflineQueueStore = create((set, get) => ({</p>\n<p>  queue: [],</p>\n<br>\n<p>  addMessage: (message) => set((state) => ({</p>\n<p>    queue: [...state.queue, { ...message, status: 'pending' }]</p>\n<p>  })),</p>\n<br>\n<p>  processQueue: async () => {</p>\n<p>    const { queue } = get();</p>\n<p>    const pending = queue.filter(m => m.status === 'pending');</p>\n<p>    for (const msg of pending) {</p>\n<p>      try {</p>\n<p>        await websocketService.sendMessage(msg.chatId, msg.content);</p>\n<p>        set((state) => ({</p>\n<p>          queue: state.queue.filter(m => m.id !== msg.id)</p>\n<p>        }));</p>\n<p>      } catch (error) {</p>\n<p>        set((state) => ({</p>\n<p>          queue: state.queue.map(m =></p>\n<p>            m.id === msg.id ? { ...m, status: 'error' } : m</p>\n<p>          )</p>\n<p>        }));</p>\n<p>      }</p>\n<p>    }</p>\n<p>  },</p>\n<p>}));</p>\n</div>\n<p><strong>Fonctionnement :</strong></p>\n<ul>\n<li>Lors de l'envoi d'un message, on vérifie la connexion WebSocket.</li>\n<li>Si déconnecté, le message est stocké dans la file d'attente avec;
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
