<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Présentation mobile</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' },
            options: { skipHtmlTypes: 'script' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 500px;
        margin: 0 auto;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    .slide-header {
        flex-shrink: 0;
        padding: 18px 16px 10px 16px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        z-index: 10;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .slide-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
    }

    .content-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 18px 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        flex-shrink: 0;
    }

    .content-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .content-card li {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        line-height: 1.5;
    }

    .content-card li:last-child {
        border-bottom: none;
    }

    .bullet-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
    }

    .math-block {
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        overflow-x: auto;
        flex-shrink: 0;
        margin: 4px 0;
    }

    .math-block .math {
        font-size: 1.2rem;
        color: #e2e8f0;
    }

    .note-box {
        background: rgba(96, 165, 250, 0.08);
        border-left: 4px solid #60a5fa;
        padding: 12px 16px;
        border-radius: 12px;
        font-style: italic;
        font-size: 0.9rem;
        color: #cbd5e1;
        flex-shrink: 0;
    }

    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        border-radius: 0;
        flex-direction: column;
    }

    .loading-card {
        background: #1e293b;
        padding: 32px 28px;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #334155;
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px auto;
    }

    .loading-text {
        font-weight: 600;
        font-size: 1.1rem;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    .loading-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 16px;
    }
    .loading-progress {
        height: 3px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        animation: loadingProgress 30s ease-out forwards;
    }

    .loading-timeout {
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 12px;
    }

    .btn-cancel-loading {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 40px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #f87171;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }

    .btn-cancel-loading:active {
        transform: scale(0.94);
        background: rgba(239, 68, 68, 0.25);
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
    }

    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .slide-counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255,255,255,0.05);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(255,255,255,0.04);
    }

    .status-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 30px;
        background: rgba(96, 165, 250, 0.12);
        color: #93bbfc;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
    }

    .status-badge .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: pulse-dot 1.2s infinite;
        flex-shrink: 0;
    }

    .status-badge.idle .dot {
        animation: none;
        background: #64748b;
    }
    .status-badge.speaking .dot {
        background: #34d399;
        animation: pulse-dot 0.8s infinite;
    }
    .status-badge.error .dot {
        background: #f87171;
        animation: none;
    }
    .status-badge.paused .dot {
        animation: none;
        background: #fbbf24;
    }
    .status-badge.waiting .dot {
        animation: pulse-dot 1.5s infinite;
        background: #fbbf24;
    }
    .status-badge.loading .dot {
        animation: pulse-dot 0.5s infinite;
        background: #60a5fa;
    }

    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.7); }
    }

    .footer-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(255,255,255,0.1);
    }

    .btn-secondary {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-play {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
        min-width: 80px;
        justify-content: center;
    }
    .btn-play:active {
        background: rgba(52, 211, 153, 0.25);
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
    }

    .auto-indicator {
        font-size: 0.65rem;
        color: #64748b;
        text-align: center;
        letter-spacing: 0.3px;
        padding: 2px 0;
    }

    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.2rem;
        }
        .content-card li {
            font-size: 0.9rem;
            padding: 8px 0;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .btn-play {
            min-width: 60px;
        }
        .footer-buttons {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
        .loading-card {
            padding: 20px 16px;
        }
        .math-block .math {
            font-size: 1rem;
        }
    }

    @media (min-width: 600px) {
        .app-container {
            max-width: 480px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
        .loading-overlay {
            border-radius: 32px;
        }
    }

    /* Mode jour (par défaut) */
    html, body {
        background: #f0f4f8 !important;
        color: #1a202c !important;
    }
    .app-container {
        background: linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%) !important;
    }
    .slide-header {
        background: rgba(255, 255, 255, 0.85) !important;
        border-bottom: 1px solid rgba(0,0,0,0.08) !important;
    }
    .slide-header h1 {
        background: linear-gradient(135deg, #2b6cb0, #6b46c1) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        background-clip: text !important;
    }
    .slide-footer {
        background: rgba(255, 255, 255, 0.9) !important;
        border-top: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card {
        background: rgba(255,255,255,0.8) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card li {
        border-bottom: 1px solid rgba(0,0,0,0.05) !important;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.12) !important;
        border-left: 4px solid #4299e1 !important;
        color: #2c3e50 !important;
    }
    .math-block {
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .math-block .math {
        color: #2d3748 !important;
    }
    .slide-counter {
        color: #4a5568 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .status-badge {
        background: rgba(96, 165, 250, 0.15) !important;
        color: #2b6cb0 !important;
        border: 1px solid rgba(96, 165, 250, 0.15) !important;
    }
    .btn {
        color: #2d3748 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .btn-secondary {
        background: rgba(0,0,0,0.04) !important;
        border-color: rgba(0,0,0,0.08) !important;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15) !important;
        border-color: rgba(52, 211, 153, 0.2) !important;
        color: #38a169 !important;
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15) !important;
        border-color: rgba(251, 191, 36, 0.2) !important;
        color: #d69e2e !important;
    }
    .auto-indicator {
        color: #718096 !important;
    }
    .loading-card {
        background: #ffffff !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .loading-text {
        color: #1a202c !important;
    }
    .loading-sub {
        color: #4a5568 !important;
    }
</style>
</head>
<body>

<div class="app-container">

    <header class="slide-header">
        <h1 id="slideTitle">Chargement...</h1>
    </header>

    <main class="slide-body" id="slideBody"></main>

    <!-- LOADING OVERLAY AVEC BOUTON ANNULER -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Préparation vocale...</div>
            <div class="loading-sub" id="loadingSub">Synthèse en cours</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loadingProgressBar"></div>
            </div>
            <div class="loading-timeout" id="loadingTimeout">⏱️ 30 secondes maximum</div>
            <button class="btn-cancel-loading" id="cancelLoadingBtn">
                <span>✕</span> Annuler
            </button>
        </div>
    </div>

    <footer class="slide-footer">
        <div class="footer-top">
            <span class="slide-counter" id="slideCounter">1 / 3</span>
            <span class="status-badge idle" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">Prêt</span>
            </span>
        </div>

        <div class="footer-buttons">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-secondary" id="replayBtn">
                <span class="btn-icon">🔁</span> <span class="btn-label">Relire</span>
            </button>
            <button class="btn btn-play" id="playBtn">
                <span class="btn-icon">▶</span> <span class="btn-label">Play</span>
            </button>
        </div>

        <div class="auto-indicator" id="autoIndicator">⏸ Lecture manuelle</div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // SLIDES
    // ================================================================
    const slides = [
  {
    "titre": "Wallet et Transaction",
    "contenu": "<div style='background: linear-gradient(135deg, #1e3c72, #2a5298); color: white; padding: 2rem; border-radius: 15px; text-align: center; margin-bottom: 1.5rem;'><h2 style='color: #fff; margin-bottom: 0.5rem;'>💰 Le cœur financier</h2><p style='color: #e0e0e0; font-size: 1.1rem;'>Wallet et Transaction en TypeORM</p><hr style='border-color: #4a7db0; width: 50%;'><p style='color: #f0f0f0;'>Leçon 2.5 : Modéliser le système financier de SawaMart</p></div><p>Nous entrons dans le <strong>système financier</strong> de SawaMart. C'est le module le plus sensible de l'application : une erreur ici peut faire perdre de l'argent à un utilisateur, ce qui peut avoir des conséquences juridiques. Nous allons donc prendre le temps de bien modéliser les deux entités centrales : <strong>Wallet</strong> (le portefeuille) et <strong>Transaction</strong> (l'historique de tous les mouvements).</p>",
    "texteParle": "Bonjour à toutes et à tous. Bienvenue dans cette cinquième leçon du chapitre deux. Aujourd'hui, nous allons modéliser le système financier de SawaMart. C'est le module le plus sensible de toute l'application. Une erreur ici peut faire perdre de l'argent à un utilisateur, ce qui peut avoir des conséquences juridiques réelles. Nous allons donc prendre le temps de bien comprendre les enjeux avant de coder. Les deux entités que nous allons créer sont Wallet, le portefeuille de chaque utilisateur, et Transaction, qui garde l'historique de tous les mouvements. Ces deux entités fonctionnent ensemble : le Wallet dit combien vous avez, la Transaction dit comment vous y êtes arrivé. C'est parti.",
    "note": "Dans une app financière, la traçabilité complète est obligatoire. Chaque centime doit être justifié."
  },
  {
    "titre": "Le concept de Wallet",
    "contenu": "<div style='background: #f8f9fa; padding: 1.5rem; border-radius: 12px; border-left: 6px solid #2a5298;'><p style='color: #1e3c72; font-weight: bold; margin-top: 0;'>Un wallet, c'est un portefeuille virtuel. Il contient :</p><ul style='padding-left: 1.2rem; color: #333; line-height: 1.9;'><li>💰 Un <strong>solde disponible</strong> : l'argent utilisable immédiatement</li><li>🔒 Un <strong>solde séquestré</strong> : l'argent bloqué pour des commandes en cours</li><li>📊 Des <strong>compteurs cumulés</strong> : total déposé, retiré, dépensé, gagné</li><li>📅 La date de la <strong>dernière transaction</strong> pour l'affichage</li></ul><p style='color: #333; margin-top: 1rem;'><strong>Règles fondamentales :</strong></p><ul style='padding-left: 1.2rem; color: #333; line-height: 1.8;'><li>1️⃣ Un wallet par utilisateur (relation 1-1)</li><li>2️⃣ Le solde ne peut jamais être négatif</li><li>3️⃣ Chaque mouvement laisse une trace indélébile</li></ul></div>",
    "texteParle": "Commençons par le concept de wallet. Un wallet, c'est un portefeuille virtuel. Il contient plusieurs informations. Un solde disponible, qui est l'argent que l'utilisateur peut utiliser immédiatement. Un solde séquestré, qui est l'argent bloqué pour des commandes en cours. C'est la grande spécificité de SawaMart : quand vous achetez quelque chose, l'argent est débité de votre solde disponible mais n'est pas encore donné au vendeur. Il est séquestré, comme dans un coffre fort, jusqu'à ce que la transaction soit confirmée. Ce solde séquestré est stocké séparément. Ensuite, le wallet contient des compteurs cumulés : le total déposé, retiré, dépensé, gagné depuis la création du compte. Ces compteurs sont utiles pour les statistiques et pour l'affichage rapide. Enfin, une date de dernière transaction, pour afficher les wallets récents en premier. Trois règles fondamentales s'appliquent. Premièrement, chaque utilisateur a un et un seul wallet : relation un à un. Deuxièmement, le solde ne peut jamais devenir négatif : c'est une garantie contre les bugs. Troisièmement, chaque mouvement d'argent, chaque débit, chaque crédit, laisse une trace indélébile dans la table Transaction. On ne supprime jamais une transaction, on en crée une nouvelle pour annuler.",
    "note": "Le solde séquestré est LA particularité de SawaMart. Il ne faut jamais le confondre avec le solde disponible."
  },
  {
    "titre": "L'entité Wallet",
    "contenu": "<div style='background: #e9ecef; padding: 1rem; border-radius: 12px;'><p style='color: #333;'>Créons <code>src/database/entities/wallet.entity.ts</code> :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.72rem; line-height: 1.6; white-space: pre;'>@Entity('wallets')<br>export class Wallet {<br>&nbsp;&nbsp;@PrimaryGeneratedColumn('uuid')<br>&nbsp;&nbsp;id!: string;<br><br>&nbsp;&nbsp;@Column({ type: 'uuid', unique: true })<br>&nbsp;&nbsp;user_id!: string;<br><br>&nbsp;&nbsp;@Column({<br>&nbsp;&nbsp;&nbsp;&nbsp;type: 'decimal', precision: 15, scale: 2, default: 0,<br>&nbsp;&nbsp;&nbsp;&nbsp;transformer: {<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;to: (v: number) =&gt; v,<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;from: (v: string) =&gt; parseFloat(v),<br>&nbsp;&nbsp;&nbsp;&nbsp;},<br>&nbsp;&nbsp;})<br>&nbsp;&nbsp;balance!: number;<br>&nbsp;&nbsp;<br>&nbsp;&nbsp;<span style='color: #6a9955;'>// ... autres champs</span><br>}</div><p style='color: #555; font-size: 0.9rem; margin-top: 0.8rem;'>💡 <code>decimal(15,2)</code> = jusqu'à 15 chiffres, dont 2 après la virgule.</p></div>",
    "texteParle": "Créons maintenant le fichier wallet.entity.ts. Regardez la structure. On utilise le décorateur Entity avec 'wallets' comme nom de table. On déclare une clé primaire UUID. Puis user_id, qui est l'identifiant de l'utilisateur propriétaire du wallet. Le décorateur unique assure qu'un utilisateur ne peut avoir qu'un seul wallet. C'est la relation un à un au niveau de la base. Et là, le champ crucial : balance, le solde. Il est de type decimal, avec une précision de quinze et une échelle de deux. Cela signifie qu'on peut stocker jusqu'à quinze chiffres, dont deux après la virgule. C'est largement suffisant pour des montants en FCFA. Pourquoi décimal et pas float ? Parce que float a des erreurs de précision. 0.1 + 0.2 donne 0.30000000004 en float. Pour de l'argent, c'est inacceptable. Decimal est exact. Notez aussi le transformer. C'est une astuce importante : PostgreSQL renvoie les valeurs decimal sous forme de chaînes de caractères. On utilise donc un transformer qui convertit automatiquement en number à la lecture, et inversement à l'écriture. Grâce à ça, dans notre code TypeScript, balance est un number, pas une string. C'est transparent.",
    "note": "Toujours utiliser decimal pour l'argent, jamais float. C'est une règle non négociable."
  },
  {
    "titre": "Les autres champs du Wallet",
    "contenu": "<div style='background: #f8f9fa; padding: 1rem; border-radius: 12px; border-left: 6px solid #10b981;'><p style='color: #333;'>Ajoutons les autres soldes et compteurs :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.7rem; line-height: 1.6; white-space: pre;'>@Column({ type: 'decimal', precision: 15, scale: 2, default: 0 })<br>escrow_balance!: number;<br><br>@Column({ type: 'decimal', precision: 15, scale: 2, default: 0 })<br>total_deposited!: number;<br><br>@Column({ type: 'decimal', precision: 15, scale: 2, default: 0 })<br>total_withdrawn!: number;<br><br>@Column({ type: 'decimal', precision: 15, scale: 2, default: 0 })<br>total_spent!: number;<br><br>@Column({ type: 'decimal', precision: 15, scale: 2, default: 0 })<br>total_earned!: number;<br><br>@Column({ type: 'boolean', default: true })<br>is_active!: boolean;<br><br>@Column({ type: 'timestamp', nullable: true })<br>last_transaction_at!: Date;</div></div>",
    "texteParle": "Ajoutons maintenant les autres champs. escrow_balance est le solde séquestré. C'est de l'argent qui a été débité du solde disponible, mais qui n'appartient encore ni à l'acheteur ni au vendeur. Il est en attente. total_deposited est le total cumulé de tous les dépôts effectués par l'utilisateur. total_withdrawn est le total cumulé de tous les retraits. total_spent est le total cumulé des dépenses, c'est-à-dire l'argent utilisé pour acheter des produits. total_earned est le total cumulé des gains, c'est-à-dire l'argent reçu en vendant des produits. Ces compteurs sont utiles pour les statistiques personnelles : quand un utilisateur voit son wallet, il voit combien il a gagné depuis qu'il utilise la plateforme. is_active : un drapeau qui indique si le wallet est actif. Quand un admin bloque un utilisateur, il désactive son wallet pour empêcher toute opération. last_transaction_at : la date de la dernière transaction. Utile pour trier les wallets par activité récente. Notez que tous ces champs sont initialisés à zéro par défaut, sauf is_active qui est à true. Un nouveau wallet est vide mais actif.",
    "note": "Les compteurs cumulés ne sont jamais recalculés. On les incrémente à chaque nouvelle opération. Plus performant."
  },
  {
    "titre": "Relations du Wallet",
    "contenu": "<div style='background: #e9ecef; padding: 1rem; border-radius: 12px;'><p style='color: #333;'>Le Wallet a deux relations :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.75rem; line-height: 1.7; white-space: pre;'><span style='color: #6a9955;'>// 1-1 avec User (propriétaire)</span><br>@OneToOne(() =&gt; User, (u) =&gt; u.wallet)<br>@JoinColumn({ name: 'user_id' })<br>user!: User;<br><br><span style='color: #6a9955;'>// 1-N avec Transaction (historique)</span><br>@OneToMany(() =&gt; Transaction, (t) =&gt; t.wallet)<br>transactions!: Transaction[];</div><p style='color: #333; margin-top: 0.8rem;'><strong>Explications :</strong></p><ul style='padding-left: 1.2rem; color: #333; line-height: 1.7;'><li>Le <code>@JoinColumn</code> indique que c'est cette table qui stocke la clé étrangère <code>user_id</code></li><li>Un wallet peut avoir des milliers de transactions, mais chaque transaction appartient à un seul wallet</li></ul></div>",
    "texteParle": "Ajoutons les deux relations du Wallet. Première relation : OneToOne avec User. Chaque wallet appartient à un utilisateur unique. Le décorateur @JoinColumn indique que c'est la table wallets qui stocke la clé étrangère user_id. C'est la table qui 'possède' la relation. L'autre côté, côté User, aurait juste la propriété wallet sans JoinColumn. Cette convention est importante en TypeORM : la clé étrangère est toujours du côté de la propriété qui porte le JoinColumn. La flèche (u) => u.wallet indique à TypeORM quelle propriété de User pointe en retour. Deuxième relation : OneToMany avec Transaction. Un wallet peut avoir plusieurs transactions. Chaque fois qu'il y a un débit, un crédit, un séquestre, une libération, une nouvelle Transaction est créée, associée au wallet. Le tableau transactions contiendra tout l'historique. Cette relation est très utile : quand on veut afficher l'historique d'un utilisateur, on charge son wallet avec toutes ses transactions en une requête. C'est l'un des bénéfices des relations TypeORM : on évite les requêtes manuelles.",
    "note": "@JoinColumn est toujours du côté 'plusieurs' en ManyToOne, ou du côté propriétaire en OneToOne."
  },
  {
    "titre": "Le concept de Transaction",
    "contenu": "<div style='background: #f8f9fa; padding: 1.5rem; border-radius: 12px; border-left: 6px solid #2a5298;'><p style='color: #1e3c72; font-weight: bold; margin-top: 0;'>Une Transaction = un mouvement d'argent</p><p style='color: #333;'>Il y a plusieurs types de transactions :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.72rem; line-height: 1.7; white-space: pre;'><span style='color: #6a9955;'>// Types</span><br>DEPOSIT — dépôt d'argent<br>WITHDRAWAL — retrait d'argent<br>PAYMENT — paiement direct<br>ESCROW — mise sous séquestre<br>ESCROW_RELEASE — libération vers vendeur<br>ESCROW_REFUND — remboursement acheteur<br>DISPUTE_FEE — frais de litige<br>REFUND — remboursement</div><p style='color: #333; margin-top: 0.8rem;'><strong>Chaque transaction garde l'empreinte du solde avant et après.</strong></p></div>",
    "texteParle": "Passons maintenant à la Transaction. Une transaction représente un mouvement d'argent. Il y a plusieurs types. DEPOSIT : un dépôt d'argent sur la plateforme, via mobile money. WITHDRAWAL : un retrait, l'utilisateur récupère son argent. PAYMENT : un paiement direct, cas rare dans notre système. ESCROW : la mise sous séquestre, quand un acheteur valide une commande. ESCROW_RELEASE : la libération des fonds vers le vendeur, quand la livraison est confirmée. ESCROW_REFUND : le remboursement de l'acheteur, en cas de litige ou d'annulation. DISPUTE_FEE : les frais de litige payés par l'acheteur. REFUND : un remboursement générique. Chaque transaction garde une trace très précise. Elle contient le montant, les frais éventuels, le solde avant l'opération, et le solde après. Cette traçabilité est essentielle : si un utilisateur réclame, on peut reconstituer exactement ce qui s'est passé, à quelle heure, pour quel montant. C'est indispensable pour un système financier.",
    "note": "Ne jamais supprimer une transaction. Créer une transaction inverse pour annuler. C'est la base de l'audit."
  },
  {
    "titre": "L'entité Transaction",
    "contenu": "<div style='background: #e9ecef; padding: 1rem; border-radius: 12px;'><p style='color: #333;'>Créons <code>src/database/entities/transaction.entity.ts</code> :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.7rem; line-height: 1.6; white-space: pre;'>@Entity('transactions')<br>@Index(['wallet_id', 'created_at'])<br>@Index(['user_id', 'created_at'])<br>@Index(['status', 'created_at'])<br>export class Transaction {<br>&nbsp;&nbsp;@PrimaryGeneratedColumn('uuid')<br>&nbsp;&nbsp;id!: string;<br><br>&nbsp;&nbsp;@Column({ type: 'uuid' })<br>&nbsp;&nbsp;wallet_id!: string;<br><br>&nbsp;&nbsp;@Column({ type: 'uuid' })<br>&nbsp;&nbsp;user_id!: string;<br><br>&nbsp;&nbsp;@Column({ type: 'uuid', nullable: true })<br>&nbsp;&nbsp;chat_id!: string;<br><br>&nbsp;&nbsp;<span style='color: #6a9955;'>// ... autres champs</span><br>}</div><p style='color: #555; font-size: 0.9rem; margin-top: 0.8rem;'>💡 <code>@Index</code> sur des colonnes composites accélère les requêtes fréquentes.</p></div>",
    "texteParle": "Créons le fichier transaction.entity.ts. Regardez d'abord les décorateurs @Index avant la classe. Ils définissent des index composites sur la table. Un index est une structure de données qui accélère les recherches. Le premier index sur wallet_id et created_at accélère la requête 'donne-moi les transactions de ce wallet, triées par date'. C'est la requête qu'on fera tout le temps pour afficher l'historique. Le deuxième index sur user_id et created_at accélère la même chose mais par utilisateur, au cas où on veuille le faire sans passer par le wallet. Le troisième index sur status et created_at accélère les requêtes du type 'trouve-moi toutes les transactions en attente'. Ces index sont cruciaux pour la performance. Sans eux, chaque requête ferait un scan complet de la table, ce qui serait très lent avec des millions de transactions. Avec eux, c'est quasi instantané. C'est le prix à payer pour la performance : quelques octets d'espace disque en plus, mais des gains de vitesse énormes.",
    "note": "Index sur les colonnes utilisées dans WHERE, ORDER BY, ou JOIN. C'est la règle de base de l'optimisation SQL."
  },
  {
    "titre": "Les énumérations de Transaction",
    "contenu": "<div style='background: #f8f9fa; padding: 1rem; border-radius: 12px; border-left: 6px solid #a78bfa;'><p style='color: #333;'>Trois énumérations définissent une transaction :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.7rem; line-height: 1.6; white-space: pre;'>export enum TransactionType {<br>&nbsp;&nbsp;DEPOSIT = 'deposit',<br>&nbsp;&nbsp;WITHDRAWAL = 'withdrawal',<br>&nbsp;&nbsp;PAYMENT = 'payment',<br>&nbsp;&nbsp;ESCROW = 'escrow',<br>&nbsp;&nbsp;ESCROW_RELEASE = 'escrow_release',<br>&nbsp;&nbsp;ESCROW_REFUND = 'escrow_refund',<br>&nbsp;&nbsp;DISPUTE_FEE = 'dispute_fee',<br>&nbsp;&nbsp;DISPUTE_RESOLUTION = 'dispute_resolution',<br>&nbsp;&nbsp;REFUND = 'refund',<br>}<br><br>export enum TransactionStatus {<br>&nbsp;&nbsp;PENDING = 'pending',<br>&nbsp;&nbsp;COMPLETED = 'completed',<br>&nbsp;&nbsp;FAILED = 'failed',<br>&nbsp;&nbsp;CANCELLED = 'cancelled',<br>&nbsp;&nbsp;REFUNDED = 'refunded',<br>}<br><br>export enum TransactionSource {<br>&nbsp;&nbsp;MOBILE_MONEY = 'mobile_money',<br>&nbsp;&nbsp;BANK_TRANSFER = 'bank_transfer',<br>&nbsp;&nbsp;CARD = 'card',<br>&nbsp;&nbsp;INTERNAL = 'internal',<br>&nbsp;&nbsp;SYSTEM = 'system',<br>}</div></div>",
    "texteParle": "Définissons trois énumérations pour caractériser une transaction. TransactionType : c'est la nature du mouvement. On a déjà vu la liste. TransactionStatus : c'est l'état du mouvement. PENDING : en attente, la transaction a été créée mais pas encore finalisée. C'est le cas d'un dépôt mobile money en attente de validation manuelle. COMPLETED : complétée, l'argent a effectivement bougé. FAILED : échouée, quelque chose n'a pas fonctionné. CANCELLED : annulée, quelqu'un a interrompu l'opération. REFUNDED : remboursée, l'opération a été annulée et l'argent est revenu. TransactionSource : c'est l'origine du mouvement. MOBILE_MONEY : via MTN ou Orange Money. BANK_TRANSFER : via un virement bancaire. CARD : via une carte de crédit, mais nous n'utiliserons pas ce mode au Cameroun. INTERNAL : un mouvement interne à la plateforme, par exemple un séquestre. SYSTEM : un mouvement initié par le système, par exemple un remboursement automatique. Ces trois énumérations permettent de qualifier précisément chaque transaction. Elles sont essentielles pour les statistiques et le débogage.",
    "note": "Les énumérations en base évitent les valeurs invalides. Une transaction ne peut pas avoir un type inconnu."
  },
  {
    "titre": "Les champs financiers de Transaction",
    "contenu": "<div style='background: #e9ecef; padding: 1rem; border-radius: 12px;'><p style='color: #333;'>Les champs qui tracent le mouvement d'argent :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.7rem; line-height: 1.6; white-space: pre;'>@Column({ type: 'enum', enum: TransactionType })<br>type!: TransactionType;<br><br>@Column({<br>&nbsp;&nbsp;type: 'enum', enum: TransactionStatus,<br>&nbsp;&nbsp;default: TransactionStatus.PENDING,<br>})<br>status!: TransactionStatus;<br><br>@Column({ type: 'enum', enum: TransactionSource, nullable: true })<br>source!: TransactionSource;<br><br>@Column({ type: 'decimal', precision: 15, scale: 2 })<br>amount!: number;<br><br>@Column({ type: 'decimal', precision: 15, scale: 2, default: 0 })<br>fee!: number;<br><br>@Column({ type: 'decimal', precision: 15, scale: 2 })<br>balance_before!: number;<br><br>@Column({ type: 'decimal', precision: 15, scale: 2 })<br>balance_after!: number;</div></div>",
    "texteParle": "Ajoutons les champs financiers de Transaction. type : le type de mouvement, avec l'énumération que nous avons définie. status : l'état, avec PENDING par défaut. source : l'origine du mouvement. amount : le montant de la transaction. fee : les frais éventuels prélevés. balance_before : le solde du wallet avant cette transaction. balance_after : le solde du wallet après cette transaction. Ces deux derniers champs sont très importants. Ils permettent de reconstituer exactement l'état du wallet à n'importe quel moment. Si un utilisateur conteste son solde, on peut dérouler l'historique de ses transactions et vérifier chaque étape. Cette traçabilité est une exigence légale dans beaucoup de pays pour les systèmes financiers. Chez SawaMart, c'est un principe de base. On peut dire à tout moment : 'avant cette transaction vous aviez X, après vous avez Y, la différence est Z, voici pourquoi'. C'est ce qui rend le système auditable et de confiance.",
    "note": "balance_before et balance_after permettent un audit a posteriori. Indispensable."
  },
  {
    "titre": "Champs complémentaires et relations",
    "contenu": "<div style='background: #f8f9fa; padding: 1rem; border-radius: 12px; border-left: 6px solid #2a5298;'><p style='color: #333;'>Les champs complémentaires :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.7rem; line-height: 1.6; white-space: pre;'>@Column({ type: 'text', nullable: true })<br>description!: string;<br><br>@Column({ type: 'jsonb', nullable: true })<br>metadata!: {<br>&nbsp;&nbsp;reference?: string;<br>&nbsp;&nbsp;provider?: string;<br>&nbsp;&nbsp;dispute_id?: string;<br>&nbsp;&nbsp;[key: string]: any;<br>};<br><br>@Column({ type: 'timestamp', nullable: true })<br>completed_at!: Date;<br><br>@CreateDateColumn({ type: 'timestamp' })<br>created_at!: Date;</div><p style='color: #333; margin-top: 0.8rem;'>Relations : <code>@ManyToOne</code> vers Wallet, User, et Chat (optionnel).</p></div>",
    "texteParle": "Terminons avec les champs complémentaires. description : un texte lisible qui décrit la transaction, par exemple 'Séquestre pour la commande abc-123'. C'est affiché à l'utilisateur dans son historique. metadata : un JSONB très flexible. On y met la référence externe du provider mobile money, le nom du provider, l'ID d'un litige éventuel, et tout autre champ qu'on pourrait avoir besoin de stocker sans créer de nouvelle colonne. C'est l'un des avantages de PostgreSQL : JSONB est indexable et interrogeable, donc on peut mettre beaucoup de choses dedans sans pénaliser les performances. completed_at : la date à laquelle la transaction est passée au statut COMPLETED. created_at : la date de création. Enfin, trois relations ManyToOne : vers Wallet, vers User, et vers Chat. Celle vers Chat est nullable, car beaucoup de transactions ne sont pas liées à une commande (dépôts, retraits). Celles vers Wallet et User sont obligatoires. Grâce à ces relations, on peut facilement faire des jointures : 'donne-moi la transaction, son wallet, son utilisateur, et le chat associé'. C'est très puissant.",

    "contenu": "<div style='background: linear-gradient(135deg, #1e3c72, #2a5298); color: white; padding: 2rem; border-radius: 15px; text-align: center;'><h3 style='color: #fff;'>🎉 Module financier modélisé !</h3><p style='color: #e0e0e0;'>Wallet et Transaction sont en place.</p><hr style='border-color: #4a7db0; width: 50%;'><p style='color: #f0f0f0; margin-bottom: 0.5rem;'>Ce que nous avons appris :</p><ul style='text-align: left; padding-left: 1.5rem; color: #f0f0f0; line-height: 1.8;'><li>✅ Le concept de wallet virtuel</li><li>✅ Solde disponible vs solde séquestré</li><li>✅ Les compteurs cumulés (total_deposited, etc.)</li><li>✅ Types et statuts de transactions</li><li>✅ Importance de balance_before / balance_after</li><li>✅ Le rôle de <code>metadata</code> en JSONB</li><li>✅ Les index composites pour la performance</li></ul><p style='color: #f0f0f0; margin-top: 1rem;'>👉 <strong>Prochaine leçon :</strong> Product et Category</p></div>",
    "texteParle": "Résumons cette leçon, qui est probablement l'une des plus importantes du cours. Nous avons modélisé deux entités financières cruciales. Wallet, le portefeuille de chaque utilisateur, avec son solde disponible, son solde séquestré, ses compteurs cumulés, et son statut actif. Nous avons vu pourquoi on utilise le type decimal pour l'argent, et pourquoi on convertit automatiquement en number via un transformer. Nous avons aussi modélisé Transaction, qui est l'historique de tous les mouvements. Nous avons vu les différents types de transactions, les statuts, les sources, et surtout l'importance des champs balance_before et balance_after, qui permettent un audit complet. Nous avons parlé des index composites pour la performance, et de l'utilisation de JSONB pour les metadata. C'est un module dense, mais c'est la fondation de tout le système financier de SawaMart. Dans la prochaine leçon, nous allons sortir du domaine financier pour aborder le catalogue produits : les entités Product et Category. À très bientôt !",

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentIndex = 0;
    let isSpeaking = false;
    let isPaused = false;
    let currentUtterance = null;
    let isLoading = false;
    let loadingTimeout = null;
    let isTransitioning = false;
    let speechSupported = true;
    let userInteracted = false;
    let isPlaying = false;
    let loadingCancelled = false;

    const total = slides.length;
    const synth = window.speechSynthesis;

    // Références jQuery
    const $title = $('#slideTitle');
    const $body = $('#slideBody');
    const $counter = $('#slideCounter');
    const $statusText = $('#statusText');
    const $statusBadge = $('#statusBadge');
    const $loading = $('#loadingOverlay');
    const $loadingText = $('#loadingText');
    const $loadingSub = $('#loadingSub');
    const $loadingTimeout = $('#loadingTimeout');
    const $loadingProgressBar = $('#loadingProgressBar');
    const $autoIndicator = $('#autoIndicator');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $replay = $('#replayBtn');
    const $play = $('#playBtn');
    const $cancelLoading = $('#cancelLoadingBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function setStatus(text, type) {
        $statusText.text(text);
        $statusBadge.removeClass('idle speaking error paused waiting loading');
        if (type === 'speaking') $statusBadge.addClass('speaking');
        else if (type === 'error') $statusBadge.addClass('error');
        else if (type === 'paused') $statusBadge.addClass('paused');
        else if (type === 'waiting') $statusBadge.addClass('waiting');
        else if (type === 'loading') $statusBadge.addClass('loading');
        else $statusBadge.addClass('idle');
    }

    function updatePlayButton() {
        if (isPlaying) {
            $play.addClass('playing');
            $play.find('.btn-icon').text('⏸');
            $play.find('.btn-label').text('Pause');
        } else {
            $play.removeClass('playing');
            $play.find('.btn-icon').text('▶');
            $play.find('.btn-label').text('Play');
        }
    }

    function showLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        
        loadingCancelled = false;
        isLoading = true;
        
        // Réinitialiser la barre de progression
        $loadingProgressBar.css('animation', 'none');
        $loadingProgressBar.css('width', '0%');
        // Forcer un reflow
        $loadingProgressBar[0].offsetHeight;
        $loadingProgressBar.css('animation', 'loadingProgress 30s ease-out forwards');
        
        $loadingText.text('Préparation vocale...');
        $loadingSub.text('Synthèse en cours');
        $loadingTimeout.text('⏱️ 30 secondes maximum');
        $loading.fadeIn(300);
        setStatus("⏳ Chargement...", 'loading');
        
        // 🔥 TIMEOUT DE 30 SECONDES
        loadingTimeout = setTimeout(() => {
            if (isLoading && !loadingCancelled) {
                hideLoading();
                setStatus("⚠️ Délai dépassé (30s)", 'error');
                isPlaying = false;
                updatePlayButton();
                $loadingSub.text('La synthèse vocale a pris trop de temps');
                $loadingTimeout.text('❌ Délai dépassé');
            }
        }, 30000);
    }

    function hideLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        isLoading = false;
        loadingCancelled = false;
        $loading.fadeOut(300);
        // Ne pas changer le statut si on est en train de parler
        if (!isSpeaking && !isPlaying) {
            setStatus("⏸ Lecture arrêtée", 'paused');
        }
    }

    function cancelLoading() {
        loadingCancelled = true;
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        hideLoading();
        stopSpeaking();
        setStatus("⏸ Annulé", 'paused');
        isPlaying = false;
        updatePlayButton();
        $loadingText.text('Annulé par l\'utilisateur');
        $loadingSub.text('Vous pouvez réessayer');
        $loadingTimeout.text('✕ Annulation');
    }

    // Arrêter la parole proprement
    function stopSpeaking() {
        try {
            if (synth && (synth.speaking || synth.pending)) {
                synth.cancel();
            }
        } catch(e) {
            console.warn('Erreur stopSpeaking:', e);
        }
        if (currentUtterance) {
            try {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance.onstart = null;
            } catch(e) {}
            currentUtterance = null;
        }
        isSpeaking = false;
        isPlaying = false;
        updatePlayButton();
    }

    // Mettre en pause la parole
    function pauseSpeaking() {
        try {
            if (synth && synth.speaking) {
                synth.pause();
                isPaused = true;
                isPlaying = false;
                setStatus("⏸ Lecture en pause", 'paused');
                updatePlayButton();
            }
        } catch(e) {
            console.warn('Erreur pauseSpeaking:', e);
            stopSpeaking();
        }
    }

    // Reprendre la parole
    function resumeSpeaking() {
        try {
            if (synth && synth.paused) {
                synth.resume();
                isPaused = false;
                isPlaying = true;
                setStatus("🔊 Lecture en cours", 'speaking');
                updatePlayButton();
            } else if (!isSpeaking && !synth.speaking && !synth.pending) {
                speakSlide(currentIndex);
            }
        } catch(e) {
            console.warn('Erreur resumeSpeaking:', e);
            speakSlide(currentIndex);
        }
    }

    function renderSlide(index) {
        const slide = slides[index];
        $title.text(slide.titre);

        let html = '';
        html += `<div class="content-card">${slide.contenu}</div>`;
        if (slide.note) {
            html += `<div class="note-box">${slide.note}</div>`;
        }
        $body.html(html);
        $counter.text(`${index+1} / ${total}`);

        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
        }
    }

    // ================================================================
    // LECTURE VOCALE
    // ================================================================
    function speakSlide(index) {
        return new Promise((resolve) => {
            const slide = slides[index];
            const text = slide.texteParle;
            
            if (!text || text.trim() === '' || !speechSupported) {
                resolve();
                return;
            }

            if (!window.speechSynthesis) {
                setStatus("❌ Synthèse vocale non supportée", 'error');
                speechSupported = false;
                resolve();
                return;
            }

            // Arrêter toute lecture en cours
            stopSpeaking();
            
            // Réinitialiser l'état de pause
            isPaused = false;
            
            showLoading();
            setStatus("Initialisation...", 'loading');

            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.92;
                utterance.pitch = 1.05;
                utterance.volume = 1;

                let isFinished = false;
                let errorHandled = false;

                utterance.onstart = function() {
                    if (loadingCancelled) {
                        stopSpeaking();
                        resolve();
                        return;
                    }
                    hideLoading();
                    isSpeaking = true;
                    isPlaying = true;
                    isPaused = false;
                    setStatus("🔊 Lecture en cours", 'speaking');
                    updatePlayButton();
                };

                utterance.onend = function() {
                    if (isFinished) return;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    setStatus("✅ Terminé", 'idle');
                    hideLoading();
                    updatePlayButton();
                    resolve();
                };

                utterance.onerror = function(e) {
                    if (isFinished || errorHandled) return;
                    errorHandled = true;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    hideLoading();
                    updatePlayButton();
                    
                    if (e.error === 'not-allowed') {
                        setStatus("⚠️ Permission refusée", 'error');
                    } else if (e.error === 'synthesis-unavailable') {
                        setStatus("⚠️ Synthèse indisponible", 'error');
                    } else if (e.error === 'canceled') {
                        setStatus("⏸ Annulé", 'paused');
                    } else {
                        setStatus("❌ Erreur audio: " + (e.error || 'inconnue'), 'error');
                    }
                    
                    resolve();
                };

                // Gestion du chargement des voix
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = function() {
                        if (!loadingCancelled) {
                            try {
                                synth.speak(utterance);
                            } catch(err) {
                                // Silencieux
                            }
                        }
                        synth.onvoiceschanged = null;
                    };
                }

                currentUtterance = utterance;
                
                if (!loadingCancelled) {
                    try {
                        synth.speak(utterance);
                    } catch(err) {
                        setTimeout(() => {
                            if (!loadingCancelled) {
                                try {
                                    synth.speak(utterance);
                                } catch(e) {
                                    setStatus("❌ Erreur de lecture", 'error');
                                    isPlaying = false;
                                    updatePlayButton();
                                    hideLoading();
                                    resolve();
                                }
                            } else {
                                resolve();
                            }
                        }, 100);
                    }
                } else {
                    resolve();
                }

            } catch(err) {
                hideLoading();
                setStatus("❌ Erreur générale", 'error');
                isPlaying = false;
                updatePlayButton();
                console.error('Erreur speakSlide:', err);
                resolve();
            }
        });
    }

    // ================================================================
    // NAVIGATION
    // ================================================================
    async function goToSlide(index) {
        if (isTransitioning) return;
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        
        // Si on est en train de lire, on met en pause avant de naviguer
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        // Arrêter complètement la lecture
        stopSpeaking();
        
        await new Promise(r => setTimeout(r, 50));
        
        if (index === currentIndex) {
            setStatus("📄 Slide actuel", 'idle');
            return;
        }

        isTransitioning = true;
        currentIndex = index;
        renderSlide(index);
        
        // Réinitialiser l'état de lecture
        isPlaying = false;
        updatePlayButton();
        setStatus("⏸ Lecture arrêtée", 'paused');

        await new Promise(r => setTimeout(r, 150));
        isTransitioning = false;
    }

    async function goToNext() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex + 1 < total) {
            await goToSlide(currentIndex + 1);
        } else {
            setStatus("🏁 Dernier slide", 'idle');
        }
    }

    async function goToPrev() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex - 1 >= 0) {
            await goToSlide(currentIndex - 1);
        } else {
            setStatus("🔁 Premier slide", 'idle');
        }
    }

    // ================================================================
    // GESTION PLAY/PAUSE
    // ================================================================
    function togglePlay() {
        if (!userInteracted) {
            userInteracted = true;
        }

        // Si le chargement est en cours, on l'annule
        if (isLoading) {
            cancelLoading();
            return;
        }

        // Si le synthétiseur est en pause, on reprend
        if (synth && synth.paused) {
            resumeSpeaking();
            return;
        }

        // Si la lecture est en cours, on met en pause
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
            return;
        }

        // Sinon, on démarre la lecture du slide courant
        if (!isSpeaking && !isPlaying) {
            stopSpeaking();
            speakSlide(currentIndex);
        }
    }

    // ================================================================
    // INIT
    // ================================================================
    async function init() {
        // Vérifier la compatibilité
        if (!window.speechSynthesis) {
            setStatus("❌ Synthèse vocale non supportée", 'error');
            speechSupported = false;
        }

        // Précharger les voix
        try {
            if (synth.getVoices) {
                synth.getVoices();
                setTimeout(() => {
                    try {
                        synth.getVoices();
                    } catch(e) {}
                }, 200);
            }
        } catch(e) {
            console.warn('Erreur chargement voix:', e);
        }

        // Afficher le premier slide
        renderSlide(0);
        $counter.text(`1 / ${total}`);
        
        // État initial
        setStatus("⏸ Appuie sur Play", 'paused');
        updatePlayButton();
        $autoIndicator.text('⏸ Lecture manuelle');

        // ================================================================
        // ÉVÉNEMENTS
        // ================================================================
        
        // Bouton Play/Pause
        $play.on('click', function() {
            togglePlay();
        });

        // Bouton Annuler le chargement
        $cancelLoading.on('click', function() {
            cancelLoading();
        });

        // Navigation
        $prev.on('click', function() {
            // Si chargement en cours, on annule
            if (isLoading) cancelLoading();
            goToPrev();
        });

        $next.on('click', function() {
            if (isLoading) cancelLoading();
            goToNext();
        });

        // Replay - relire le slide courant
        $replay.on('click', function() {
            if (isLoading) cancelLoading();
            stopSpeaking();
            setTimeout(() => {
                speakSlide(currentIndex);
            }, 100);
        });

        // Support du clavier (espace pour play/pause)
        $(document).on('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });

        // Nettoyage
        $(window).on('beforeunload', function() {
            try {
                if (synth.speaking) synth.cancel();
            } catch(e) {}
            hideLoading();
        });

        // Gérer les cas où la synthèse se termine de manière inattendue
        setInterval(() => {
            if (isPlaying && !synth.speaking && !synth.pending && !isPaused && !isLoading) {
                isPlaying = false;
                updatePlayButton();
                setStatus("⏸ Lecture arrêtée", 'paused');
            }
        }, 1000);
    }

    init();
});



    // ================================================================
    // GESTION DU THÈME JOUR/NUIT
    // ================================================================
    let isDarkMode = false;

    function toggleTheme() {
        isDarkMode = !isDarkMode;
        const body = document.body;
        const appContainer = document.querySelector('.app-container');
        const header = document.querySelector('.slide-header');
        const footer = document.querySelector('.slide-footer');
        const contentCards = document.querySelectorAll('.content-card');
        const noteBoxes = document.querySelectorAll('.note-box');
        const mathBlocks = document.querySelectorAll('.math-block');
        const buttons = document.querySelectorAll('.btn');
        const statusBadge = document.querySelector('.status-badge');
        const slideCounter = document.querySelector('.slide-counter');
        const autoIndicator = document.querySelector('.auto-indicator');
        const themeBtn = document.getElementById('themeToggle');

        if (isDarkMode) {
            // Mode nuit
            body.style.background = '#0b1120';
            body.style.color = '#f1f5f9';
            appContainer.style.background = 'linear-gradient(145deg, #0f172a 0%, #1e293b 100%)';
            header.style.background = 'rgba(15, 23, 42, 0.85)';
            footer.style.background = 'rgba(15, 23, 42, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.05)';
                card.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.08)';
                note.style.color = '#cbd5e1';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.25)';
                block.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#e2e8f0';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.12)';
                statusBadge.style.color = '#93bbfc';
            }
            if (slideCounter) {
                slideCounter.style.color = '#94a3b8';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#64748b';
            }
            if (themeBtn) {
                themeBtn.textContent = '☀️';
                themeBtn.title = 'Passer en mode jour';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#e2e8f0';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#e2e8f0';
                }
            });
        } else {
            // Mode jour (par défaut)
            body.style.background = '#f0f4f8';
            body.style.color = '#1a202c';
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
            header.style.background = 'rgba(255, 255, 255, 0.85)';
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.8)';
                card.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.12)';
                note.style.color = '#2c3e50';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.05)';
                block.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#2d3748';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
                statusBadge.style.color = '#2b6cb0';
            }
            if (slideCounter) {
                slideCounter.style.color = '#4a5568';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#718096';
            }
            if (themeBtn) {
                themeBtn.textContent = '🌓';
                themeBtn.title = 'Passer en mode nuit';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#2c3e50';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#2d3748';
                }
            });
        }
    }

    // Initialiser en mode jour
    document.addEventListener('DOMContentLoaded', function() {
        // Appliquer le mode jour par défaut
        const body = document.body;
        body.style.background = '#f0f4f8';
        body.style.color = '#1a202c';
        
        const appContainer = document.querySelector('.app-container');
        if (appContainer) {
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
        }
        
        const header = document.querySelector('.slide-header');
        if (header) {
            header.style.background = 'rgba(255, 255, 255, 0.85)';
        }
        
        const footer = document.querySelector('.slide-footer');
        if (footer) {
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
        }
        
        document.querySelectorAll('.content-card').forEach(card => {
            card.style.background = 'rgba(255,255,255,0.8)';
            card.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.note-box').forEach(note => {
            note.style.background = 'rgba(96, 165, 250, 0.12)';
            note.style.color = '#2c3e50';
        });
        
        document.querySelectorAll('.math-block').forEach(block => {
            block.style.background = 'rgba(0,0,0,0.05)';
            block.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.btn').forEach(btn => {
            btn.style.color = '#2d3748';
        });
        
        const statusBadge = document.querySelector('.status-badge');
        if (statusBadge) {
            statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
            statusBadge.style.color = '#2b6cb0';
        }
        
        const slideCounter = document.querySelector('.slide-counter');
        if (slideCounter) {
            slideCounter.style.color = '#4a5568';
        }
        
        const autoIndicator = document.querySelector('.auto-indicator');
        if (autoIndicator) {
            autoIndicator.style.color = '#718096';
        }
        
        document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
            if (!el.closest('.note-box')) {
                el.style.color = '#2c3e50';
            }
        });
        
        document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
            if (!el.closest('.note-box') && !el.closest('.math-block')) {
                el.style.color = '#2d3748';
            }
        });
        
        const themeBtn = document.getElementById('themeToggle');
        if (themeBtn) {
            themeBtn.textContent = '🌓';
            themeBtn.title = 'Passer en mode nuit';
        }
    });
</script>
