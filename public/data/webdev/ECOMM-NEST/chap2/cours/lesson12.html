<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Présentation mobile</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' },
            options: { skipHtmlTypes: 'script' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 500px;
        margin: 0 auto;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    .slide-header {
        flex-shrink: 0;
        padding: 18px 16px 10px 16px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        z-index: 10;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .slide-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
    }

    .content-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 18px 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        flex-shrink: 0;
    }

    .content-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .content-card li {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        line-height: 1.5;
    }

    .content-card li:last-child {
        border-bottom: none;
    }

    .bullet-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
    }

    .math-block {
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        overflow-x: auto;
        flex-shrink: 0;
        margin: 4px 0;
    }

    .math-block .math {
        font-size: 1.2rem;
        color: #e2e8f0;
    }

    .note-box {
        background: rgba(96, 165, 250, 0.08);
        border-left: 4px solid #60a5fa;
        padding: 12px 16px;
        border-radius: 12px;
        font-style: italic;
        font-size: 0.9rem;
        color: #cbd5e1;
        flex-shrink: 0;
    }

    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        border-radius: 0;
        flex-direction: column;
    }

    .loading-card {
        background: #1e293b;
        padding: 32px 28px;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #334155;
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px auto;
    }

    .loading-text {
        font-weight: 600;
        font-size: 1.1rem;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    .loading-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 16px;
    }
    .loading-progress {
        height: 3px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        animation: loadingProgress 30s ease-out forwards;
    }

    .loading-timeout {
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 12px;
    }

    .btn-cancel-loading {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 40px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #f87171;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }

    .btn-cancel-loading:active {
        transform: scale(0.94);
        background: rgba(239, 68, 68, 0.25);
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
    }

    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .slide-counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255,255,255,0.05);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(255,255,255,0.04);
    }

    .status-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 30px;
        background: rgba(96, 165, 250, 0.12);
        color: #93bbfc;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
    }

    .status-badge .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: pulse-dot 1.2s infinite;
        flex-shrink: 0;
    }

    .status-badge.idle .dot {
        animation: none;
        background: #64748b;
    }
    .status-badge.speaking .dot {
        background: #34d399;
        animation: pulse-dot 0.8s infinite;
    }
    .status-badge.error .dot {
        background: #f87171;
        animation: none;
    }
    .status-badge.paused .dot {
        animation: none;
        background: #fbbf24;
    }
    .status-badge.waiting .dot {
        animation: pulse-dot 1.5s infinite;
        background: #fbbf24;
    }
    .status-badge.loading .dot {
        animation: pulse-dot 0.5s infinite;
        background: #60a5fa;
    }

    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.7); }
    }

    .footer-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(255,255,255,0.1);
    }

    .btn-secondary {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-play {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
        min-width: 80px;
        justify-content: center;
    }
    .btn-play:active {
        background: rgba(52, 211, 153, 0.25);
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
    }

    .auto-indicator {
        font-size: 0.65rem;
        color: #64748b;
        text-align: center;
        letter-spacing: 0.3px;
        padding: 2px 0;
    }

    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.2rem;
        }
        .content-card li {
            font-size: 0.9rem;
            padding: 8px 0;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .btn-play {
            min-width: 60px;
        }
        .footer-buttons {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
        .loading-card {
            padding: 20px 16px;
        }
        .math-block .math {
            font-size: 1rem;
        }
    }

    @media (min-width: 600px) {
        .app-container {
            max-width: 480px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
        .loading-overlay {
            border-radius: 32px;
        }
    }

    /* Mode jour (par défaut) */
    html, body {
        background: #f0f4f8 !important;
        color: #1a202c !important;
    }
    .app-container {
        background: linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%) !important;
    }
    .slide-header {
        background: rgba(255, 255, 255, 0.85) !important;
        border-bottom: 1px solid rgba(0,0,0,0.08) !important;
    }
    .slide-header h1 {
        background: linear-gradient(135deg, #2b6cb0, #6b46c1) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        background-clip: text !important;
    }
    .slide-footer {
        background: rgba(255, 255, 255, 0.9) !important;
        border-top: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card {
        background: rgba(255,255,255,0.8) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card li {
        border-bottom: 1px solid rgba(0,0,0,0.05) !important;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.12) !important;
        border-left: 4px solid #4299e1 !important;
        color: #2c3e50 !important;
    }
    .math-block {
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .math-block .math {
        color: #2d3748 !important;
    }
    .slide-counter {
        color: #4a5568 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .status-badge {
        background: rgba(96, 165, 250, 0.15) !important;
        color: #2b6cb0 !important;
        border: 1px solid rgba(96, 165, 250, 0.15) !important;
    }
    .btn {
        color: #2d3748 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .btn-secondary {
        background: rgba(0,0,0,0.04) !important;
        border-color: rgba(0,0,0,0.08) !important;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15) !important;
        border-color: rgba(52, 211, 153, 0.2) !important;
        color: #38a169 !important;
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15) !important;
        border-color: rgba(251, 191, 36, 0.2) !important;
        color: #d69e2e !important;
    }
    .auto-indicator {
        color: #718096 !important;
    }
    .loading-card {
        background: #ffffff !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .loading-text {
        color: #1a202c !important;
    }
    .loading-sub {
        color: #4a5568 !important;
    }
</style>
</head>
<body>

<div class="app-container">

    <header class="slide-header">
        <h1 id="slideTitle">Chargement...</h1>
    </header>

    <main class="slide-body" id="slideBody"></main>

    <!-- LOADING OVERLAY AVEC BOUTON ANNULER -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Préparation vocale...</div>
            <div class="loading-sub" id="loadingSub">Synthèse en cours</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loadingProgressBar"></div>
            </div>
            <div class="loading-timeout" id="loadingTimeout">⏱️ 30 secondes maximum</div>
            <button class="btn-cancel-loading" id="cancelLoadingBtn">
                <span>✕</span> Annuler
            </button>
        </div>
    </div>

    <footer class="slide-footer">
        <div class="footer-top">
            <span class="slide-counter" id="slideCounter">1 / 3</span>
            <span class="status-badge idle" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">Prêt</span>
            </span>
        </div>

        <div class="footer-buttons">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-secondary" id="replayBtn">
                <span class="btn-icon">🔁</span> <span class="btn-label">Relire</span>
            </button>
            <button class="btn btn-play" id="playBtn">
                <span class="btn-icon">▶</span> <span class="btn-label">Play</span>
            </button>
        </div>

        <div class="auto-indicator" id="autoIndicator">⏸ Lecture manuelle</div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // SLIDES
    // ================================================================
    const slides = [
  {
    "titre": "L'entité Product",
    "contenu": "<div style='background: linear-gradient(135deg, #1e3c72, #2a5298); color: white; padding: 2rem; border-radius: 15px; text-align: center; margin-bottom: 1.5rem;'><h2 style='color: #fff; margin-bottom: 0.5rem;'>📦 L'entité Product</h2><p style='color: #e0e0e0; font-size: 1.1rem;'>Le catalogue et sa flexibilité JSONB</p><hr style='border-color: #4a7db0; width: 50%;'><p style='color: #f0f0f0;'>Leçon 2.6 : Modéliser un article et son metadata</p></div><p>Nous quittons le monde financier pour entrer dans le <strong>catalogue</strong>. <code>Product</code> est l'entité qui représente un article mis en vente par un utilisateur. Elle est très riche, car un article a beaucoup d'informations : nom, description, prix, quantité, état, localisation, statut de validation, dates de publication. Nous allons aussi découvrir une fonctionnalité puissante de PostgreSQL : la colonne <strong>JSONB</strong>, qui va stocker des métadonnées flexibles.</p>",
    "texteParle": "Bonjour à toutes et à tous et bienvenue dans cette sixième leçon. Aujourd'hui, nous quittons le monde de l'argent pour entrer dans le monde du catalogue. L'entité que nous allons créer s'appelle Product, c'est-à-dire l'article en vente. C'est une entité très riche, car un article contient beaucoup d'informations. Son nom, sa description, son prix, sa quantité disponible, son état neuf ou usagé, sa localisation géographique, son statut de validation, ses dates de publication. Et en plus de tous ces champs classiques, nous allons utiliser une colonne spéciale de PostgreSQL : la colonne JSONB. C'est une colonne qui peut stocker du JSON, avec toute la flexibilité du NoSQL, mais indexable et interrogeable comme du SQL classique. C'est une fonctionnalité très puissante de PostgreSQL, et nous allons l'exploiter à fond dans Product. C'est parti.",
    "note": "Product est une entité qui évoluera beaucoup. La colonne metadata permettra de l'enrichir sans migration."
  },
  {
    "titre": "À quoi sert l'entité Product ?",
    "contenu": "<div style='background: #f8f9fa; padding: 1.5rem; border-radius: 12px; border-left: 6px solid #2a5298;'><p style='color: #1e3c72; font-weight: bold; margin-top: 0;'>Product représente un article mis en vente par un utilisateur.</p><p style='color: #333;'>Il contient <strong>toutes</strong> les informations utiles :</p><ul style='padding-left: 1.2rem; color: #333; line-height: 1.9;'><li>📝 Le <strong>contenu</strong> : nom, description, état, défauts</li><li>💰 Le <strong>prix</strong> et la <strong>quantité</strong> disponible</li><li>📍 La <strong>localisation</strong> : pays, ville, coordonnées GPS</li><li>📊 Le <strong>statut</strong> : en attente, validé, rejeté, en ligne, hors ligne</li><li>📅 Les <strong>dates de publication</strong> et d'expiration</li><li>👤 Le <strong>vendeur</strong> : qui l'a publié</li><li>🏷️ La <strong>catégorie</strong> : à quel type de produit il appartient</li></ul></div>",
    "texteParle": "Faisons un tour rapide de ce que contient un article sur SawaMart. D'abord, le contenu : un nom, une description, l'état neuf ou utilisé, et les défauts éventuels si c'est de l'occasion. Ensuite, le prix et la quantité disponible. Si vous vendez un article, vous en avez peut-être plusieurs exemplaires, donc il faut stocker la quantité. Puis la localisation : au minimum le pays et la ville, mais aussi les coordonnées GPS latitude et longitude, pour permettre la recherche de proximité. Ensuite, le statut : un article nouvellement publié est en attente de validation par un assistant. S'il est validé, il devient en ligne. S'il est rejeté, il reste rejeté. S'il expire ou si le stock tombe à zéro, il passe hors ligne. Puis les dates de publication : un article reste en ligne pendant trente jours par défaut, après quoi il expire automatiquement. Enfin, deux relations critiques : le vendeur, qui est un utilisateur, et la catégorie, qui structure le catalogue. Ce sont toutes ces informations qu'il faut modéliser correctement.",
    "note": "Un Product sans vendeur n'existe pas. Sans catégorie non plus. Ces deux relations sont obligatoires."
  },
  {
    "titre": "Les énumérations de Product",
    "contenu": "<div style='background: #e9ecef; padding: 1rem; border-radius: 12px;'><p style='color: #333;'>Deux énumérations définissent un article :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.72rem; line-height: 1.6; white-space: pre;'><span style='color: #6a9955;'>// État physique de l'article</span><br>export enum ProductCondition {<br>&nbsp;&nbsp;NEW = 'new',<br>&nbsp;&nbsp;USED = 'used',<br>}<br><br><span style='color: #6a9955;'>// Statut dans le cycle de vie</span><br>export enum ProductStatus {<br>&nbsp;&nbsp;PENDING = 'pending',&nbsp;&nbsp;&nbsp;&nbsp;<span style='color: #6a9955;'>// En attente de validation</span><br>&nbsp;&nbsp;APPROVED = 'approved',&nbsp;&nbsp;<span style='color: #6a9955;'>// Approuvé (transitoire)</span><br>&nbsp;&nbsp;REJECTED = 'rejected',&nbsp;&nbsp;<span style='color: #6a9955;'>// Rejeté par assistant</span><br>&nbsp;&nbsp;ONLINE = 'online',&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span style='color: #6a9955;'>// En ligne, visible</span><br>&nbsp;&nbsp;OFFLINE = 'offline',&nbsp;&nbsp;&nbsp;&nbsp;<span style='color: #6a9955;'>// Hors ligne</span><br>}</div><p style='color: #555; font-size: 0.9rem; margin-top: 0.8rem;'>💡 <code>condition</code> décrit l'état physique. <code>status</code> décrit l'état administratif.</p></div>",
    "texteParle": "Définissons deux énumérations pour Product. La première, ProductCondition, décrit l'état physique de l'article. Il y a deux valeurs : NEW pour un article neuf, USED pour un article d'occasion. C'est important, car les utilisateurs veulent pouvoir filtrer par état. La deuxième, ProductStatus, décrit l'état administratif de l'article dans son cycle de vie. PENDING : l'article vient d'être publié, il attend la validation d'un assistant. APPROVED : un statut intermédiaire, rarement utilisé seul, qui signifie que l'article a été approuvé par un assistant, mais n'est pas encore en ligne. REJECTED : un assistant a rejeté l'article, il ne sera jamais mis en ligne. ONLINE : l'article est validé et visible par tous les utilisateurs. OFFLINE : l'article a été retiré, soit par le vendeur, soit automatiquement (expiration, rupture de stock). Notez bien la distinction entre condition et status : condition c'est l'état physique (neuf/usagé), status c'est l'état administratif (en attente/validé/rejeté). Ce sont deux dimensions différentes qu'il ne faut pas confondre.",
    "note": "Un article peut être 'neuf' mais 'rejeté', ou 'usagé' mais 'en ligne'. Les deux dimensions sont indépendantes."
  },
  {
    "titre": "Début de l'entité Product",
    "contenu": "<div style='background: #f8f9fa; padding: 1rem; border-radius: 12px; border-left: 6px solid #2a5298;'><p style='color: #333;'>Créons <code>src/database/entities/product.entity.ts</code> :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.72rem; line-height: 1.6; white-space: pre;'>@Entity('products')<br>export class Product {<br>&nbsp;&nbsp;@PrimaryGeneratedColumn('uuid')<br>&nbsp;&nbsp;id!: string;<br><br>&nbsp;&nbsp;@Column({ type: 'uuid' })<br>&nbsp;&nbsp;seller_id!: string;<br><br>&nbsp;&nbsp;@Column({ type: 'uuid' })<br>&nbsp;&nbsp;category_id!: string;<br><br>&nbsp;&nbsp;@Column({ type: 'varchar', length: 200 })<br>&nbsp;&nbsp;name!: string;<br><br>&nbsp;&nbsp;@Column({ type: 'text', nullable: true })<br>&nbsp;&nbsp;description!: string;<br><br>&nbsp;&nbsp;<span style='color: #6a9955;'>// ... autres champs</span><br>}</div></div>",
    "texteParle": "Créons le fichier product.entity.ts. Le décorateur Entity avec 'products' comme nom de table. Clé primaire UUID. Ensuite, deux clés étrangères : seller_id, qui pointe vers l'utilisateur vendeur, et category_id, qui pointe vers la catégorie. Ces deux champs sont obligatoires : un article sans vendeur ou sans catégorie n'a pas de sens. Puis le nom : varchar de deux cents caractères. Un nom de produit doit être court, pas un roman. Puis la description : text, sans limite, nullable. Certains vendeurs ne mettent pas de description. C'est leur droit. Notez bien qu'on n'utilise pas de varchar pour la description, mais text. La différence ? varchar a une longueur maximale fixe, text n'a pas de limite pratique. En PostgreSQL, il n'y a pas de différence de performance entre les deux. Donc pour les champs qui peuvent être longs, on utilise text. Pour les champs courts et prédéfinis, on utilise varchar avec une limite, ce qui est plus explicite.",
    "note": "text et varchar sans limite ont les mêmes performances en PostgreSQL. Utilisez text pour les longues chaînes."
  },
  {
    "titre": "Prix, quantité et condition",
    "contenu": "<div style='background: #e9ecef; padding: 1rem; border-radius: 12px;'><p style='color: #333;'>Les champs commerciaux :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.72rem; line-height: 1.6; white-space: pre;'>@Column({<br>&nbsp;&nbsp;type: 'decimal', precision: 15, scale: 2,<br>&nbsp;&nbsp;transformer: {<br>&nbsp;&nbsp;&nbsp;&nbsp;to: (v: number) =&gt; v,<br>&nbsp;&nbsp;&nbsp;&nbsp;from: (v: string) =&gt; parseFloat(v),<br>&nbsp;&nbsp;},<br>})<br>price!: number;<br><br>@Column({ type: 'int', default: 1 })<br>quantity!: number;<br><br>@Column({ type: 'enum', enum: ProductCondition })<br>condition!: ProductCondition;<br><br>@Column({ type: 'text', nullable: true })<br>defects!: string;</div><p style='color: #555; font-size: 0.9rem; margin-top: 0.8rem;'>💡 <code>defects</code> n'a de sens que pour un article USED.</p></div>",
    "texteParle": "Ajoutons les champs commerciaux. price, d'abord : c'est un decimal de quinze chiffres dont deux après la virgule, exactement comme balance dans le Wallet. Je répète : pour de l'argent, jamais de float, toujours du decimal. Le transformer convertit automatiquement en number dans le code. quantity, ensuite : un entier, par défaut un. Un vendeur peut proposer un seul exemplaire ou plusieurs. Si la quantité tombe à zéro, on considère que l'article est épuisé et il sera automatiquement mis hors ligne. condition : l'état physique, NEW ou USED. defects : un texte nullable. C'est là que le vendeur décrit les défauts de l'article, s'il est d'occasion. Par exemple, 'Léger rayure sur l'écran, visible à la lumière forte'. Pour un article neuf, ce champ est null. Pour un article usagé, il est vivement recommandé de le remplir, car un article vendu sans mention de défaut pourrait donner lieu à un litige. C'est une question de transparence et de confiance.",
    "note": "Un vendeur qui ne déclare pas les défauts s'expose à un litige. La description doit être honnête."
  },
  {
    "titre": "Localisation géographique",
    "contenu": "<div style='background: #f8f9fa; padding: 1rem; border-radius: 12px; border-left: 6px solid #10b981;'><p style='color: #333;'>La localisation complète pour la recherche de proximité :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.72rem; line-height: 1.6; white-space: pre;'>@Column({ type: 'varchar', length: 100 })<br>country!: string;<br><br>@Column({ type: 'varchar', length: 100 })<br>city!: string;<br><br>@Column({ type: 'varchar', length: 100, nullable: true })<br>neighborhood!: string;<br><br>@Column({<br>&nbsp;&nbsp;type: 'decimal', precision: 10, scale: 8, default: 0,<br>&nbsp;&nbsp;transformer: { to: (v) =&gt; v, from: (v) =&gt; parseFloat(v) },<br>})<br>latitude!: number;<br><br>@Column({<br>&nbsp;&nbsp;type: 'decimal', precision: 10, scale: 8, default: 0,<br>&nbsp;&nbsp;transformer: { to: (v) =&gt; v, from: (v) =&gt; parseFloat(v) },<br>})<br>longitude!: number;</div><p style='color: #555; font-size: 0.9rem; margin-top: 0.8rem;'>💡 <code>precision: 10, scale: 8</code> permet des coordonnées très précises.</p></div>",
    "texteParle": "Ajoutons la localisation. Un article est proposé dans une zone géographique précise. country : le pays. city : la ville. neighborhood : le quartier, optionnel. Ce sont des chaînes de caractères simples. Puis, latitude et longitude : des coordonnées GPS. On utilise le type decimal avec une précision de dix et une échelle de huit. Cela signifie qu'on peut stocker des nombres jusqu'à dix chiffres, dont huit après la virgule. Pourquoi une telle précision ? Parce que les coordonnées GPS ont besoin de huit décimales pour être précises à environ un centimètre. Par exemple, la latitude de Douala est 4.0511. Avec huit décimales, on aurait 4.05110000. C'est largement suffisant. On utilise là aussi un transformer pour convertir en number automatiquement. Grâce à ces coordonnées, nous pourrons implémenter la recherche de proximité avec la formule de Haversine. Un utilisateur à Douala verra d'abord les articles à Douala, puis ceux des environs, puis plus loin. C'est une fonctionnalité essentielle pour une marketplace locale.",
    "note": "La précision 10,8 permet de stocker n'importe quelle coordonnée GPS avec une précision centimétrique."
  },
  {
    "titre": "Statut et validation",
    "contenu": "<div style='background: #e9ecef; padding: 1rem; border-radius: 12px;'><p style='color: #333;'>Les champs de gestion du cycle de vie :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.7rem; line-height: 1.6; white-space: pre;'>@Column({ type: 'boolean', default: true })<br>is_active!: boolean;<br><br>@Column({ type: 'boolean', default: false })<br>is_boosted!: boolean;<br><br>@Column({ type: 'timestamp', nullable: true })<br>boost_expiry!: Date;<br><br>@Column({<br>&nbsp;&nbsp;type: 'enum', enum: ProductStatus,<br>&nbsp;&nbsp;default: ProductStatus.PENDING,<br>})<br>status!: ProductStatus;<br><br>@Column({ type: 'uuid', nullable: true })<br>validation_assistant_id!: string | null;<br><br>@Column({ type: 'text', nullable: true })<br>validation_comment!: string | null;<br><br>@Column({ type: 'timestamp', nullable: true })<br>validation_date!: Date | null;</div></div>",
    "texteParle": "Ajoutons les champs de gestion du cycle de vie. is_active : un booléen qui indique si l'article est actif. C'est différent de status, car is_active est utilisé pour des désactivations rapides sans passer par le workflow de validation. is_boosted : un booléen qui indique si l'article est boosté, c'est-à-dire mis en avant contre paiement. boost_expiry : la date d'expiration du boost. Un boost dure quelques jours, puis expire automatiquement. status : le statut de validation, avec l'énumération ProductStatus, PENDING par défaut. validation_assistant_id : l'identifiant de l'assistant qui a validé ou rejeté l'article. C'est important pour la traçabilité : on sait toujours qui a pris la décision. validation_comment : le commentaire de l'assistant, notamment le motif de rejet. validation_date : la date de la décision. Ces trois derniers champs sont nullables, car un article en attente n'a pas encore été traité. Ce sont ces champs qui permettent à ProductValidationService de faire son travail : quand un assistant valide un article, il remplit ces trois champs et passe le statut à ONLINE. Quand il rejette, il les remplit et passe à REJECTED.",
    "note": "La traçabilité des décisions de modération est essentielle. Ne stockez jamais une décision sans son auteur."
  },
  {
    "titre": "Dates de publication et compteurs",
    "contenu": "<div style='background: #f8f9fa; padding: 1rem; border-radius: 12px; border-left: 6px solid #a78bfa;'><p style='color: #333;'>Les dates de vie et les compteurs :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.7rem; line-height: 1.6; white-space: pre;'>@Column({ type: 'int', default: 0 })<br>view_count!: number;<br><br>@Column({ type: 'int', default: 0 })<br>favorite_count!: number;<br><br>@Column({ type: 'timestamp', nullable: true })<br>publish_start!: Date | null;<br><br>@Column({ type: 'timestamp', nullable: true })<br>publish_end!: Date | null;<br><br>@CreateDateColumn({ type: 'timestamp' })<br>created_at!: Date;<br><br>@UpdateDateColumn({ type: 'timestamp' })<br>updated_at!: Date;</div><p style='color: #555; font-size: 0.9rem; margin-top: 0.8rem;'>💡 <code>publish_start</code> et <code>publish_end</code> gèrent l'expiration automatique.</p></div>",
    "texteParle": "Ajoutons les dates de vie et les compteurs. view_count : un entier qui compte le nombre de fois que l'article a été vu. Il démarre à zéro, et s'incrémente à chaque affichage. C'est utile pour l'affichage 'X vues' et pour trier les articles par popularité. favorite_count : un compteur du nombre de fois que l'article a été ajouté aux favoris. Pareil, il démarre à zéro et s'incrémente. Grâce à ces deux compteurs, on peut trier les articles par popularité, ce qui est très utile pour le feed. publish_start et publish_end : deux dates qui gèrent l'expiration. publish_start est la date à laquelle l'article est mis en ligne, donc la date de validation par l'assistant. publish_end est la date à laquelle il doit expirer, soit publish_start plus trente jours par défaut. Un cron job vérifie chaque nuit si des articles ont dépassé leur publish_end, et les met hors ligne automatiquement. C'est ce qui permet de ne pas avoir de vieux articles qui traînent indéfiniment. Cela encourage aussi les vendeurs à renouveler régulièrement leurs annonces. Enfin, created_at et updated_at, gérés automatiquement par TypeORM.",
    "note": "L'expiration automatique garde le catalogue propre et pousse les vendeurs à rester actifs."
  },
  {
    "titre": "Le champ metadata JSONB",
    "contenu": "<div style='background: #f8f9fa; padding: 1rem; border-radius: 12px; border-left: 6px solid #fbbf24;'><p style='color: #333;'>La colonne magique qui évite les migrations futures :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.7rem; line-height: 1.6; white-space: pre;'>@Column({ type: 'jsonb', nullable: true })<br>metadata!: {<br>&nbsp;&nbsp;expired_at?: Date;<br>&nbsp;&nbsp;expired_after_days?: number;<br>&nbsp;&nbsp;expiration_reason?: 'lifetime_expired' | 'out_of_stock';<br>&nbsp;&nbsp;out_of_stock_at?: Date;<br>&nbsp;&nbsp;validation_auto?: boolean;<br>&nbsp;&nbsp;boost_start?: Date;<br>&nbsp;&nbsp;boost_end?: Date;<br>&nbsp;&nbsp;avg_view_duration?: number;<br>&nbsp;&nbsp;meta_title?: string;<br>&nbsp;&nbsp;meta_description?: string;<br>&nbsp;&nbsp;keywords?: string[];<br>&nbsp;&nbsp;[key: string]: any;<br>};</div></div>",
    "texteParle": "Voici la fonctionnalité la plus intéressante de cette leçon : la colonne metadata JSONB. C'est un type de colonne PostgreSQL qui stocke du JSON indexable. Regardez la structure : c'est un objet JavaScript, avec des propriétés optionnelles de types variés. On y stocke des choses comme la date d'expiration, la raison de l'expiration, la date de rupture de stock, les dates de boost, le taux de clic, les données SEO. L'astuce, c'est le [key: string]: any en bas, qui autorise n'importe quelle autre propriété. Cela veut dire qu'on peut enrichir cet objet au fur et à mesure du développement, sans jamais toucher au schéma de la base. C'est énorme. Imaginez : vous avez une idée de fonctionnalité qui demande de stocker une nouvelle métadonnée. Au lieu de faire une migration pour ajouter une colonne, vous utilisez metadata. C'est plus rapide, plus flexible, et ça évite de polluer la table avec vingt colonnes rarement utilisées. L'inconvénient, c'est que ces données ne sont pas typées au niveau de la base : on doit les valider côté code. Mais pour des métadonnées internes, c'est parfait.",
    "note": "JSONB : la flexibilité du NoSQL dans la rigueur du SQL. À utiliser pour les données non critiques."
  },
  {
    "titre": "Les relations de Product",
    "contenu": "<div style='background: #e9ecef; padding: 1rem; border-radius: 12px;'><p style='color: #333;'>Les relations qui structurent l'entité Product :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.7rem; line-height: 1.6; white-space: pre;'><span style='color: #6a9955;'>// Vendeur (N-1)</span><br>@ManyToOne(() =&gt; User, (u) =&gt; u.products)<br>@JoinColumn({ name: 'seller_id' })<br>seller!: User;<br><br><span style='color: #6a9955;'>// Catégorie (N-1)</span><br>@ManyToOne(() =&gt; Category, (c) =&gt; c.products)<br>@JoinColumn({ name: 'category_id' })<br>category!: Category;<br><br><span style='color: #6a9955;'>// Images (1-N)</span><br>@OneToMany(() =&gt; ProductImage, (img) =&gt; img.product, {<br>&nbsp;&nbsp;cascade: true, eager: true,<br>})<br>images!: ProductImage[];<br><br><span style='color: #6a9955;'>// Assistant validateur (N-1 optionnel)</span><br>@ManyToOne(() =&gt; User, (u) =&gt; u.validatedProducts)<br>@JoinColumn({ name: 'validation_assistant_id' })<br>validation_assistant!: User;</div></div>",
    "texteParle": "Ajoutons les relations de Product. Première relation : ManyToOne vers User. Chaque article a un vendeur unique. La flèche (u) => u.products indique à TypeORM que côté User, il y a un tableau products. Le JoinColumn indique que c'est cette table qui stocke la clé étrangère seller_id. Deuxième relation : ManyToOne vers Category. Chaque article appartient à une catégorie unique. Côté Category, il y a un tableau products. Troisième relation : OneToMany vers ProductImage. Un article peut avoir jusqu'à quatre images. On utilise cascade: true, ce qui signifie que si on sauvegarde un Product avec ses images, TypeORM sauvegardera aussi les images. Et eager: true, ce qui signifie que TypeORM chargera automatiquement les images à chaque fois qu'on charge un produit. C'est pratique pour l'affichage, un peu moins performant pour les grosses listes, mais on peut désactiver eager au cas par cas. Quatrième relation : ManyToOne vers User, cette fois pour l'assistant qui a validé l'article. Cette relation est optionnelle, car un article en attente n'a pas encore été validé.",
    "note": "cascade: true sur images est pratique : sauvegarder un Product sauvegarde ses images automatiquement."
  },
  {
    "titre": "Résumé et prochaine étape",
    "contenu": "<div style='background: linear-gradient(135deg, #1e3c72, #2a5298); color: white; padding: 2rem; border-radius: 15px; text-align: center;'><h3 style='color: #fff;'>🎉 Product modélisée !</h3><p style='color: #e0e0e0;'>Le catalogue de SawaMart prend forme.</p><hr style='border-color: #4a7db0; width: 50%;'><p style='color: #f0f0f0; margin-bottom: 0.5rem;'>Ce que nous avons appris :</p><ul style='text-align: left; padding-left: 1.5rem; color: #f0f0f0; line-height: 1.8;'><li>✅ Deux énumérations : ProductCondition et ProductStatus</li><li>✅ Prix en decimal, quantité en int</li><li>✅ Localisation complète avec GPS</li><li>✅ Statut de validation avec traçabilité</li><li>✅ Dates de publication et expiration</li><li>✅ Le puissant champ <code>metadata</code> JSONB</li><li>✅ Les relations vendeur, catégorie, images, assistant</li></ul><p style='color: #f0f0f0; margin-top: 1rem;'>👉 <strong>Prochaine leçon :</strong> Chat et cycle de vie d'une commande</p></div>",
    "texteParle": "Résumons cette leçon. Nous avons créé l'entité Product, qui représente un article mis en vente. Nous avons défini deux énumérations : ProductCondition pour l'état physique, et ProductStatus pour l'état administratif. Nous avons ajouté tous les champs nécessaires : nom, description, prix en decimal, quantité, localisation complète avec coordonnées GPS, statut de validation avec traçabilité complète, dates de publication et d'expiration, compteurs de vues et de favoris. Et surtout, nous avons découvert la colonne metadata JSONB, qui nous permettra d'enrichir l'entité sans jamais faire de migration. C'est une entité riche, mais c'est nécessaire : c'est l'objet principal de notre marketplace. Dans la prochaine leçon, nous allons aborder une entité encore plus complexe : Chat. C'est elle qui porte tout le cycle de vie d'une commande, avec son ordre_status. C'est probablement l'entité la plus originale de SawaMart. À très bientôt !",
    "note": "Product est une entité qui évoluera beaucoup. Le champ metadata est là pour ça."
  }
];
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentIndex = 0;
    let isSpeaking = false;
    let isPaused = false;
    let currentUtterance = null;
    let isLoading = false;
    let loadingTimeout = null;
    let isTransitioning = false;
    let speechSupported = true;
    let userInteracted = false;
    let isPlaying = false;
    let loadingCancelled = false;

    const total = slides.length;
    const synth = window.speechSynthesis;

    // Références jQuery
    const $title = $('#slideTitle');
    const $body = $('#slideBody');
    const $counter = $('#slideCounter');
    const $statusText = $('#statusText');
    const $statusBadge = $('#statusBadge');
    const $loading = $('#loadingOverlay');
    const $loadingText = $('#loadingText');
    const $loadingSub = $('#loadingSub');
    const $loadingTimeout = $('#loadingTimeout');
    const $loadingProgressBar = $('#loadingProgressBar');
    const $autoIndicator = $('#autoIndicator');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $replay = $('#replayBtn');
    const $play = $('#playBtn');
    const $cancelLoading = $('#cancelLoadingBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function setStatus(text, type) {
        $statusText.text(text);
        $statusBadge.removeClass('idle speaking error paused waiting loading');
        if (type === 'speaking') $statusBadge.addClass('speaking');
        else if (type === 'error') $statusBadge.addClass('error');
        else if (type === 'paused') $statusBadge.addClass('paused');
        else if (type === 'waiting') $statusBadge.addClass('waiting');
        else if (type === 'loading') $statusBadge.addClass('loading');
        else $statusBadge.addClass('idle');
    }

    function updatePlayButton() {
        if (isPlaying) {
            $play.addClass('playing');
            $play.find('.btn-icon').text('⏸');
            $play.find('.btn-label').text('Pause');
        } else {
            $play.removeClass('playing');
            $play.find('.btn-icon').text('▶');
            $play.find('.btn-label').text('Play');
        }
    }

    function showLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        
        loadingCancelled = false;
        isLoading = true;
        
        // Réinitialiser la barre de progression
        $loadingProgressBar.css('animation', 'none');
        $loadingProgressBar.css('width', '0%');
        // Forcer un reflow
        $loadingProgressBar[0].offsetHeight;
        $loadingProgressBar.css('animation', 'loadingProgress 30s ease-out forwards');
        
        $loadingText.text('Préparation vocale...');
        $loadingSub.text('Synthèse en cours');
        $loadingTimeout.text('⏱️ 30 secondes maximum');
        $loading.fadeIn(300);
        setStatus("⏳ Chargement...", 'loading');
        
        // 🔥 TIMEOUT DE 30 SECONDES
        loadingTimeout = setTimeout(() => {
            if (isLoading && !loadingCancelled) {
                hideLoading();
                setStatus("⚠️ Délai dépassé (30s)", 'error');
                isPlaying = false;
                updatePlayButton();
                $loadingSub.text('La synthèse vocale a pris trop de temps');
                $loadingTimeout.text('❌ Délai dépassé');
            }
        }, 30000);
    }

    function hideLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        isLoading = false;
        loadingCancelled = false;
        $loading.fadeOut(300);
        // Ne pas changer le statut si on est en train de parler
        if (!isSpeaking && !isPlaying) {
            setStatus("⏸ Lecture arrêtée", 'paused');
        }
    }

    function cancelLoading() {
        loadingCancelled = true;
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        hideLoading();
        stopSpeaking();
        setStatus("⏸ Annulé", 'paused');
        isPlaying = false;
        updatePlayButton();
        $loadingText.text('Annulé par l\'utilisateur');
        $loadingSub.text('Vous pouvez réessayer');
        $loadingTimeout.text('✕ Annulation');
    }

    // Arrêter la parole proprement
    function stopSpeaking() {
        try {
            if (synth && (synth.speaking || synth.pending)) {
                synth.cancel();
            }
        } catch(e) {
            console.warn('Erreur stopSpeaking:', e);
        }
        if (currentUtterance) {
            try {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance.onstart = null;
            } catch(e) {}
            currentUtterance = null;
        }
        isSpeaking = false;
        isPlaying = false;
        updatePlayButton();
    }

    // Mettre en pause la parole
    function pauseSpeaking() {
        try {
            if (synth && synth.speaking) {
                synth.pause();
                isPaused = true;
                isPlaying = false;
                setStatus("⏸ Lecture en pause", 'paused');
                updatePlayButton();
            }
        } catch(e) {
            console.warn('Erreur pauseSpeaking:', e);
            stopSpeaking();
        }
    }

    // Reprendre la parole
    function resumeSpeaking() {
        try {
            if (synth && synth.paused) {
                synth.resume();
                isPaused = false;
                isPlaying = true;
                setStatus("🔊 Lecture en cours", 'speaking');
                updatePlayButton();
            } else if (!isSpeaking && !synth.speaking && !synth.pending) {
                speakSlide(currentIndex);
            }
        } catch(e) {
            console.warn('Erreur resumeSpeaking:', e);
            speakSlide(currentIndex);
        }
    }

    function renderSlide(index) {
        const slide = slides[index];
        $title.text(slide.titre);

        let html = '';
        html += `<div class="content-card">${slide.contenu}</div>`;
        if (slide.note) {
            html += `<div class="note-box">${slide.note}</div>`;
        }
        $body.html(html);
        $counter.text(`${index+1} / ${total}`);

        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
        }
    }

    // ================================================================
    // LECTURE VOCALE
    // ================================================================
    function speakSlide(index) {
        return new Promise((resolve) => {
            const slide = slides[index];
            const text = slide.texteParle;
            
            if (!text || text.trim() === '' || !speechSupported) {
                resolve();
                return;
            }

            if (!window.speechSynthesis) {
                setStatus("❌ Synthèse vocale non supportée", 'error');
                speechSupported = false;
                resolve();
                return;
            }

            // Arrêter toute lecture en cours
            stopSpeaking();
            
            // Réinitialiser l'état de pause
            isPaused = false;
            
            showLoading();
            setStatus("Initialisation...", 'loading');

            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.92;
                utterance.pitch = 1.05;
                utterance.volume = 1;

                let isFinished = false;
                let errorHandled = false;

                utterance.onstart = function() {
                    if (loadingCancelled) {
                        stopSpeaking();
                        resolve();
                        return;
                    }
                    hideLoading();
                    isSpeaking = true;
                    isPlaying = true;
                    isPaused = false;
                    setStatus("🔊 Lecture en cours", 'speaking');
                    updatePlayButton();
                };

                utterance.onend = function() {
                    if (isFinished) return;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    setStatus("✅ Terminé", 'idle');
                    hideLoading();
                    updatePlayButton();
                    resolve();
                };

                utterance.onerror = function(e) {
                    if (isFinished || errorHandled) return;
                    errorHandled = true;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    hideLoading();
                    updatePlayButton();
                    
                    if (e.error === 'not-allowed') {
                        setStatus("⚠️ Permission refusée", 'error');
                    } else if (e.error === 'synthesis-unavailable') {
                        setStatus("⚠️ Synthèse indisponible", 'error');
                    } else if (e.error === 'canceled') {
                        setStatus("⏸ Annulé", 'paused');
                    } else {
                        setStatus("❌ Erreur audio: " + (e.error || 'inconnue'), 'error');
                    }
                    
                    resolve();
                };

                // Gestion du chargement des voix
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = function() {
                        if (!loadingCancelled) {
                            try {
                                synth.speak(utterance);
                            } catch(err) {
                                // Silencieux
                            }
                        }
                        synth.onvoiceschanged = null;
                    };
                }

                currentUtterance = utterance;
                
                if (!loadingCancelled) {
                    try {
                        synth.speak(utterance);
                    } catch(err) {
                        setTimeout(() => {
                            if (!loadingCancelled) {
                                try {
                                    synth.speak(utterance);
                                } catch(e) {
                                    setStatus("❌ Erreur de lecture", 'error');
                                    isPlaying = false;
                                    updatePlayButton();
                                    hideLoading();
                                    resolve();
                                }
                            } else {
                                resolve();
                            }
                        }, 100);
                    }
                } else {
                    resolve();
                }

            } catch(err) {
                hideLoading();
                setStatus("❌ Erreur générale", 'error');
                isPlaying = false;
                updatePlayButton();
                console.error('Erreur speakSlide:', err);
                resolve();
            }
        });
    }

    // ================================================================
    // NAVIGATION
    // ================================================================
    async function goToSlide(index) {
        if (isTransitioning) return;
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        
        // Si on est en train de lire, on met en pause avant de naviguer
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        // Arrêter complètement la lecture
        stopSpeaking();
        
        await new Promise(r => setTimeout(r, 50));
        
        if (index === currentIndex) {
            setStatus("📄 Slide actuel", 'idle');
            return;
        }

        isTransitioning = true;
        currentIndex = index;
        renderSlide(index);
        
        // Réinitialiser l'état de lecture
        isPlaying = false;
        updatePlayButton();
        setStatus("⏸ Lecture arrêtée", 'paused');

        await new Promise(r => setTimeout(r, 150));
        isTransitioning = false;
    }

    async function goToNext() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex + 1 < total) {
            await goToSlide(currentIndex + 1);
        } else {
            setStatus("🏁 Dernier slide", 'idle');
        }
    }

    async function goToPrev() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex - 1 >= 0) {
            await goToSlide(currentIndex - 1);
        } else {
            setStatus("🔁 Premier slide", 'idle');
        }
    }

    // ================================================================
    // GESTION PLAY/PAUSE
    // ================================================================
    function togglePlay() {
        if (!userInteracted) {
            userInteracted = true;
        }

        // Si le chargement est en cours, on l'annule
        if (isLoading) {
            cancelLoading();
            return;
        }

        // Si le synthétiseur est en pause, on reprend
        if (synth && synth.paused) {
            resumeSpeaking();
            return;
        }

        // Si la lecture est en cours, on met en pause
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
            return;
        }

        // Sinon, on démarre la lecture du slide courant
        if (!isSpeaking && !isPlaying) {
            stopSpeaking();
            speakSlide(currentIndex);
        }
    }

    // ================================================================
    // INIT
    // ================================================================
    async function init() {
        // Vérifier la compatibilité
        if (!window.speechSynthesis) {
            setStatus("❌ Synthèse vocale non supportée", 'error');
            speechSupported = false;
        }

        // Précharger les voix
        try {
            if (synth.getVoices) {
                synth.getVoices();
                setTimeout(() => {
                    try {
                        synth.getVoices();
                    } catch(e) {}
                }, 200);
            }
        } catch(e) {
            console.warn('Erreur chargement voix:', e);
        }

        // Afficher le premier slide
        renderSlide(0);
        $counter.text(`1 / ${total}`);
        
        // État initial
        setStatus("⏸ Appuie sur Play", 'paused');
        updatePlayButton();
        $autoIndicator.text('⏸ Lecture manuelle');

        // ================================================================
        // ÉVÉNEMENTS
        // ================================================================
        
        // Bouton Play/Pause
        $play.on('click', function() {
            togglePlay();
        });

        // Bouton Annuler le chargement
        $cancelLoading.on('click', function() {
            cancelLoading();
        });

        // Navigation
        $prev.on('click', function() {
            // Si chargement en cours, on annule
            if (isLoading) cancelLoading();
            goToPrev();
        });

        $next.on('click', function() {
            if (isLoading) cancelLoading();
            goToNext();
        });

        // Replay - relire le slide courant
        $replay.on('click', function() {
            if (isLoading) cancelLoading();
            stopSpeaking();
            setTimeout(() => {
                speakSlide(currentIndex);
            }, 100);
        });

        // Support du clavier (espace pour play/pause)
        $(document).on('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });

        // Nettoyage
        $(window).on('beforeunload', function() {
            try {
                if (synth.speaking) synth.cancel();
            } catch(e) {}
            hideLoading();
        });

        // Gérer les cas où la synthèse se termine de manière inattendue
        setInterval(() => {
            if (isPlaying && !synth.speaking && !synth.pending && !isPaused && !isLoading) {
                isPlaying = false;
                updatePlayButton();
                setStatus("⏸ Lecture arrêtée", 'paused');
            }
        }, 1000);
    }

    init();
});



    // ================================================================
    // GESTION DU THÈME JOUR/NUIT
    // ================================================================
    let isDarkMode = false;

    function toggleTheme() {
        isDarkMode = !isDarkMode;
        const body = document.body;
        const appContainer = document.querySelector('.app-container');
        const header = document.querySelector('.slide-header');
        const footer = document.querySelector('.slide-footer');
        const contentCards = document.querySelectorAll('.content-card');
        const noteBoxes = document.querySelectorAll('.note-box');
        const mathBlocks = document.querySelectorAll('.math-block');
        const buttons = document.querySelectorAll('.btn');
        const statusBadge = document.querySelector('.status-badge');
        const slideCounter = document.querySelector('.slide-counter');
        const autoIndicator = document.querySelector('.auto-indicator');
        const themeBtn = document.getElementById('themeToggle');

        if (isDarkMode) {
            // Mode nuit
            body.style.background = '#0b1120';
            body.style.color = '#f1f5f9';
            appContainer.style.background = 'linear-gradient(145deg, #0f172a 0%, #1e293b 100%)';
            header.style.background = 'rgba(15, 23, 42, 0.85)';
            footer.style.background = 'rgba(15, 23, 42, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.05)';
                card.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.08)';
                note.style.color = '#cbd5e1';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.25)';
                block.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#e2e8f0';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.12)';
                statusBadge.style.color = '#93bbfc';
            }
            if (slideCounter) {
                slideCounter.style.color = '#94a3b8';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#64748b';
            }
            if (themeBtn) {
                themeBtn.textContent = '☀️';
                themeBtn.title = 'Passer en mode jour';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#e2e8f0';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#e2e8f0';
                }
            });
        } else {
            // Mode jour (par défaut)
            body.style.background = '#f0f4f8';
            body.style.color = '#1a202c';
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
            header.style.background = 'rgba(255, 255, 255, 0.85)';
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.8)';
                card.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.12)';
                note.style.color = '#2c3e50';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.05)';
                block.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#2d3748';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
                statusBadge.style.color = '#2b6cb0';
            }
            if (slideCounter) {
                slideCounter.style.color = '#4a5568';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#718096';
            }
            if (themeBtn) {
                themeBtn.textContent = '🌓';
                themeBtn.title = 'Passer en mode nuit';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#2c3e50';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#2d3748';
                }
            });
        }
    }

    // Initialiser en mode jour
    document.addEventListener('DOMContentLoaded', function() {
        // Appliquer le mode jour par défaut
        const body = document.body;
        body.style.background = '#f0f4f8';
        body.style.color = '#1a202c';
        
        const appContainer = document.querySelector('.app-container');
        if (appContainer) {
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
        }
        
        const header = document.querySelector('.slide-header');
        if (header) {
            header.style.background = 'rgba(255, 255, 255, 0.85)';
        }
        
        const footer = document.querySelector('.slide-footer');
        if (footer) {
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
        }
        
        document.querySelectorAll('.content-card').forEach(card => {
            card.style.background = 'rgba(255,255,255,0.8)';
            card.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.note-box').forEach(note => {
            note.style.background = 'rgba(96, 165, 250, 0.12)';
            note.style.color = '#2c3e50';
        });
        
        document.querySelectorAll('.math-block').forEach(block => {
            block.style.background = 'rgba(0,0,0,0.05)';
            block.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.btn').forEach(btn => {
            btn.style.color = '#2d3748';
        });
        
        const statusBadge = document.querySelector('.status-badge');
        if (statusBadge) {
            statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
            statusBadge.style.color = '#2b6cb0';
        }
        
        const slideCounter = document.querySelector('.slide-counter');
        if (slideCounter) {
            slideCounter.style.color = '#4a5568';
        }
        
        const autoIndicator = document.querySelector('.auto-indicator');
        if (autoIndicator) {
            autoIndicator.style.color = '#718096';
        }
        
        document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
            if (!el.closest('.note-box')) {
                el.style.color = '#2c3e50';
            }
        });
        
        document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
            if (!el.closest('.note-box') && !el.closest('.math-block')) {
                el.style.color = '#2d3748';
            }
        });
        
        const themeBtn = document.getElementById('themeToggle');
        if (themeBtn) {
            themeBtn.textContent = '🌓';
            themeBtn.title = 'Passer en mode nuit';
        }
    });
</script>
