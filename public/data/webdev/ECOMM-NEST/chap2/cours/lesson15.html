<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Présentation mobile</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' },
            options: { skipHtmlTypes: 'script' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 500px;
        margin: 0 auto;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    .slide-header {
        flex-shrink: 0;
        padding: 18px 16px 10px 16px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        z-index: 10;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .slide-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
    }

    .content-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 18px 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        flex-shrink: 0;
    }

    .content-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .content-card li {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        line-height: 1.5;
    }

    .content-card li:last-child {
        border-bottom: none;
    }

    .bullet-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
    }

    .math-block {
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        overflow-x: auto;
        flex-shrink: 0;
        margin: 4px 0;
    }

    .math-block .math {
        font-size: 1.2rem;
        color: #e2e8f0;
    }

    .note-box {
        background: rgba(96, 165, 250, 0.08);
        border-left: 4px solid #60a5fa;
        padding: 12px 16px;
        border-radius: 12px;
        font-style: italic;
        font-size: 0.9rem;
        color: #cbd5e1;
        flex-shrink: 0;
    }

    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        border-radius: 0;
        flex-direction: column;
    }

    .loading-card {
        background: #1e293b;
        padding: 32px 28px;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #334155;
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px auto;
    }

    .loading-text {
        font-weight: 600;
        font-size: 1.1rem;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    .loading-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 16px;
    }
    .loading-progress {
        height: 3px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        animation: loadingProgress 30s ease-out forwards;
    }

    .loading-timeout {
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 12px;
    }

    .btn-cancel-loading {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 40px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #f87171;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }

    .btn-cancel-loading:active {
        transform: scale(0.94);
        background: rgba(239, 68, 68, 0.25);
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
    }

    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .slide-counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255,255,255,0.05);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(255,255,255,0.04);
    }

    .status-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 30px;
        background: rgba(96, 165, 250, 0.12);
        color: #93bbfc;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
    }

    .status-badge .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: pulse-dot 1.2s infinite;
        flex-shrink: 0;
    }

    .status-badge.idle .dot {
        animation: none;
        background: #64748b;
    }
    .status-badge.speaking .dot {
        background: #34d399;
        animation: pulse-dot 0.8s infinite;
    }
    .status-badge.error .dot {
        background: #f87171;
        animation: none;
    }
    .status-badge.paused .dot {
        animation: none;
        background: #fbbf24;
    }
    .status-badge.waiting .dot {
        animation: pulse-dot 1.5s infinite;
        background: #fbbf24;
    }
    .status-badge.loading .dot {
        animation: pulse-dot 0.5s infinite;
        background: #60a5fa;
    }

    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.7); }
    }

    .footer-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(255,255,255,0.1);
    }

    .btn-secondary {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-play {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
        min-width: 80px;
        justify-content: center;
    }
    .btn-play:active {
        background: rgba(52, 211, 153, 0.25);
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
    }

    .auto-indicator {
        font-size: 0.65rem;
        color: #64748b;
        text-align: center;
        letter-spacing: 0.3px;
        padding: 2px 0;
    }

    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.2rem;
        }
        .content-card li {
            font-size: 0.9rem;
            padding: 8px 0;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .btn-play {
            min-width: 60px;
        }
        .footer-buttons {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
        .loading-card {
            padding: 20px 16px;
        }
        .math-block .math {
            font-size: 1rem;
        }
    }

    @media (min-width: 600px) {
        .app-container {
            max-width: 480px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
        .loading-overlay {
            border-radius: 32px;
        }
    }

    /* Mode jour (par défaut) */
    html, body {
        background: #f0f4f8 !important;
        color: #1a202c !important;
    }
    .app-container {
        background: linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%) !important;
    }
    .slide-header {
        background: rgba(255, 255, 255, 0.85) !important;
        border-bottom: 1px solid rgba(0,0,0,0.08) !important;
    }
    .slide-header h1 {
        background: linear-gradient(135deg, #2b6cb0, #6b46c1) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        background-clip: text !important;
    }
    .slide-footer {
        background: rgba(255, 255, 255, 0.9) !important;
        border-top: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card {
        background: rgba(255,255,255,0.8) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card li {
        border-bottom: 1px solid rgba(0,0,0,0.05) !important;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.12) !important;
        border-left: 4px solid #4299e1 !important;
        color: #2c3e50 !important;
    }
    .math-block {
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .math-block .math {
        color: #2d3748 !important;
    }
    .slide-counter {
        color: #4a5568 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .status-badge {
        background: rgba(96, 165, 250, 0.15) !important;
        color: #2b6cb0 !important;
        border: 1px solid rgba(96, 165, 250, 0.15) !important;
    }
    .btn {
        color: #2d3748 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .btn-secondary {
        background: rgba(0,0,0,0.04) !important;
        border-color: rgba(0,0,0,0.08) !important;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15) !important;
        border-color: rgba(52, 211, 153, 0.2) !important;
        color: #38a169 !important;
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15) !important;
        border-color: rgba(251, 191, 36, 0.2) !important;
        color: #d69e2e !important;
    }
    .auto-indicator {
        color: #718096 !important;
    }
    .loading-card {
        background: #ffffff !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .loading-text {
        color: #1a202c !important;
    }
    .loading-sub {
        color: #4a5568 !important;
    }
</style>
</head>
<body>

<div class="app-container">

    <header class="slide-header">
        <h1 id="slideTitle">Chargement...</h1>
    </header>

    <main class="slide-body" id="slideBody"></main>

    <!-- LOADING OVERLAY AVEC BOUTON ANNULER -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Préparation vocale...</div>
            <div class="loading-sub" id="loadingSub">Synthèse en cours</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loadingProgressBar"></div>
            </div>
            <div class="loading-timeout" id="loadingTimeout">⏱️ 30 secondes maximum</div>
            <button class="btn-cancel-loading" id="cancelLoadingBtn">
                <span>✕</span> Annuler
            </button>
        </div>
    </div>

    <footer class="slide-footer">
        <div class="footer-top">
            <span class="slide-counter" id="slideCounter">1 / 3</span>
            <span class="status-badge idle" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">Prêt</span>
            </span>
        </div>

        <div class="footer-buttons">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-secondary" id="replayBtn">
                <span class="btn-icon">🔁</span> <span class="btn-label">Relire</span>
            </button>
            <button class="btn btn-play" id="playBtn">
                <span class="btn-icon">▶</span> <span class="btn-label">Play</span>
            </button>
        </div>

        <div class="auto-indicator" id="autoIndicator">⏸ Lecture manuelle</div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // SLIDES
    // ================================================================
    const slides = [
  {
    "titre": "Les relations TypeORM",
    "contenu": "<div style='background: linear-gradient(135deg, #1e3c72, #2a5298); color: white; padding: 2rem; border-radius: 15px; text-align: center; margin-bottom: 1.5rem;'><h2 style='color: #fff; margin-bottom: 0.5rem;'>🔗 Les relations TypeORM</h2><p style='color: #e0e0e0; font-size: 1.1rem;'>OneToMany, ManyToOne, OneToOne, ManyToMany</p><hr style='border-color: #4a7db0; width: 50%;'><p style='color: #f0f0f0;'>Leçon 2.9 : Maîtriser les relations entre entités</p></div><p>Nous avons déjà croisé des relations dans les leçons précédentes : <code>@OneToMany</code>, <code>@ManyToOne</code>, <code>@OneToOne</code>. Mais nous ne les avons jamais vraiment expliquées. Aujourd'hui, on prend le temps de <strong>tout comprendre</strong> : comment elles fonctionnent, quand les utiliser, et surtout les <strong>pièges à éviter</strong>. Une relation mal modélisée peut plomber les performances de votre application.</p>",
    "texteParle": "Bonjour à toutes et à tous et bienvenue dans cette neuvième leçon du chapitre deux. Aujourd'hui, nous allons faire une pause dans la création d'entités pour approfondir un sujet que nous avons croisé plusieurs fois sans vraiment l'expliquer : les relations TypeORM. Nous avons déjà utilisé OneToMany, ManyToOne, OneToOne. Mais savez-vous vraiment quand utiliser l'un plutôt que l'autre ? Connaissez-vous les pièges ? Savez-vous comment TypeORM génère les clés étrangères ? Savez-vous ce que fait vraiment JoinColumn ? C'est ce que nous allons voir aujourd'hui. Cette leçon est théorique mais cruciale : une relation mal modélisée peut plomber les performances, créer des bugs difficiles à trouver, ou rendre votre schéma de base de données incohérent. Prenez le temps de bien comprendre. C'est parti.",
    "note": "Les relations TypeORM sont la partie la plus subtile de la modélisation. Une erreur ici coûte cher."
  },
  {
    "titre": "Pourquoi des relations ?",
    "contenu": "<div style='background: #f8f9fa; padding: 1.5rem; border-radius: 12px; border-left: 6px solid #2a5298;'><p style='color: #1e3c72; font-weight: bold; margin-top: 0;'>Une relation, c'est un lien entre deux tables.</p><p style='color: #333;'>Dans une base relationnelle, les données ne sont pas isolées. Elles sont <strong>liées</strong> :</p><ul style='padding-left: 1.2rem; color: #333; line-height: 1.9;'><li>Un <strong>produit</strong> appartient à un <strong>vendeur</strong></li><li>Un <strong>utilisateur</strong> a un <strong>profil</strong></li><li>Un <strong>message</strong> appartient à un <strong>chat</strong></li><li>Un <strong>chat</strong> concerne un <strong>produit</strong></li><li>Un <strong>litige</strong> implique un <strong>acheteur</strong> et un <strong>vendeur</strong></li></ul><p style='color: #333; margin-top: 1rem;'>Ces liens se traduisent en SQL par des <strong>clés étrangères</strong> (FOREIGN KEY).</p><p style='color: #333;'>En TypeORM, ces liens se déclarent avec des <strong>décorateurs de relation</strong>.</p></div>",
    "texteParle": "Commençons par le pourquoi. Une relation, c'est un lien entre deux tables. Dans une base relationnelle, les données ne sont pas isolées : elles sont liées. Un produit appartient à un vendeur, qui est un utilisateur. Un utilisateur a un profil, une relation un à un. Un message appartient à un chat. Un chat concerne un produit. Un litige implique un acheteur et un vendeur. Tous ces liens existent dans le monde réel. Notre base de données doit les refléter. En SQL, ces liens se traduisent par des clés étrangères, ou FOREIGN KEY. Une clé étrangère, c'est une colonne qui référence la clé primaire d'une autre table. Par exemple, la table products a une colonne seller_id qui référence l'id d'un utilisateur. La base garantit qu'on ne peut pas créer un produit avec un seller_id qui n'existe pas. En TypeORM, ces clés étrangères ne sont pas déclarées manuellement : on déclare une relation avec un décorateur, et TypeORM génère la clé étrangère correspondante. C'est plus propre et moins sujet aux erreurs.",
    "note": "En TypeORM, on ne déclare jamais une clé étrangère directement. On déclare une relation, TypeORM s'occupe du reste."
  },
  {
    "titre": "Les 4 types de relations",
    "contenu": "<div style='background: #e9ecef; padding: 1.5rem; border-radius: 12px;'><p style='color: #333;'>Il y a quatre types de relations :</p><div style='display: flex; flex-direction: column; gap: 0.7rem; margin-top: 1rem;'><div style='background: #d1ecf1; padding: 0.9rem; border-radius: 8px; border-left: 4px solid #0c5460;'><strong>@OneToOne</strong> — 1 utilisateur → 1 profil</div><div style='background: #d4edda; padding: 0.9rem; border-radius: 8px; border-left: 4px solid #155724;'><strong>@OneToMany</strong> + <strong>@ManyToOne</strong> — 1 vendeur → N produits</div><div style='background: #fff3cd; padding: 0.9rem; border-radius: 8px; border-left: 4px solid #856404;'><strong>@ManyToMany</strong> — N users ↔ N favoris</div><div style='background: #f8d7da; padding: 0.9rem; border-radius: 8px; border-left: 4px solid #721c24;'><strong>@OneToOne (optionnelle)</strong> — 1 chat → 0 ou 1 litige</div></div><p style='color: #555; font-size: 0.9rem; margin-top: 1rem;'>💡 Chaque type a ses règles, ses pièges, et son usage.</p></div>",
    "texteParle": "Il y a quatre types de relations en TypeORM. Premièrement, OneToOne : un utilisateur a un seul profil, un profil appartient à un seul utilisateur. Deuxièmement, OneToMany et ManyToOne : ce sont les deux faces d'une même relation. Un vendeur peut avoir plusieurs produits, mais chaque produit appartient à un seul vendeur. On déclare OneToMany côté vendeur, et ManyToOne côté produit. Ce sont les relations les plus courantes. Troisièmement, ManyToMany : plusieurs utilisateurs peuvent avoir plusieurs produits en favori. On utilise une table de jointure pour représenter ça. Quatrièmement, une variante de OneToOne : la relation optionnelle. Un chat peut avoir zéro ou un litige. C'est toujours un à un, mais pas obligatoire. Nous allons voir chacun de ces types en détail, avec ses cas d'usage, sa syntaxe, et ses pièges.",
    "note": "Les relations OneToMany et ManyToOne vont toujours par paire. L'un sans l'autre n'a pas de sens."
  },
  {
    "titre": "Relation OneToOne",
    "contenu": "<div style='background: #f8f9fa; padding: 1rem; border-radius: 12px; border-left: 6px solid #2a5298;'><p style='color: #333;'><strong>Cas d'usage :</strong> User ↔ UserProfile, User ↔ Wallet</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.7rem; line-height: 1.6; white-space: pre;'><span style='color: #6a9955;'>// Côté User (propriétaire de la relation)</span><br>@OneToOne(() =&gt; UserProfile, (p) =&gt; p.user, { cascade: true })<br>@JoinColumn()<br>profile!: UserProfile;<br><br><span style='color: #6a9955;'>// Côté UserProfile (côté inverse)</span><br>@OneToOne(() =&gt; User, (u) =&gt; u.profile)<br>user!: User;</div><p style='color: #333; margin-top: 0.8rem;'><strong>Règles :</strong></p><ul style='padding-left: 1.2rem; color: #333; line-height: 1.7;'><li>🅰️ <code>@JoinColumn()</code> est <strong>obligatoire d'un seul côté</strong></li><li>🅱️ C'est la table avec JoinColumn qui stocke la clé étrangère</li><li>🅲 L'autre côté n'a pas de clé étrangère</li></ul></div>",
    "texteParle": "Commençons par la relation OneToOne. C'est la plus simple : un élément d'une table est lié à un seul élément d'une autre. Cas d'usage classiques : un utilisateur a un profil, un profil appartient à un utilisateur. Un utilisateur a un wallet, un wallet appartient à un utilisateur. Regardez la syntaxe. Côté User, on déclare @OneToOne avec la classe UserProfile, puis la flèche qui dit quelle propriété pointe en retour, puis @JoinColumn. Le @JoinColumn est obligatoire, mais d'un seul côté. Il indique à TypeORM que c'est cette table qui doit stocker la clé étrangère. Côté UserProfile, on déclare juste @OneToOne sans JoinColumn. Trois règles à retenir. Premièrement, @JoinColumn est obligatoire d'un seul côté, jamais des deux. Deuxièmement, la table qui porte le JoinColumn est celle qui stocke la clé étrangère. Ici, c'est users qui stocke profile_id. Troisièmement, l'autre côté n'a pas de clé étrangère. C'est juste une propriété virtuelle pour naviguer. Si vous mettez JoinColumn des deux côtés, TypeORM va créer deux clés étrangères, ce qui est une erreur courante. Notez aussi cascade: true : cela permet de sauvegarder le profil automatiquement quand on sauvegarde l'utilisateur.",
    "note": "JoinColumn d'un seul côté, jamais des deux. Si TypeORM génère deux clés étrangères, c'est un bug."
  },
  {
    "titre": "Relation OneToMany / ManyToOne",
    "contenu": "<div style='background: #e9ecef; padding: 1rem; border-radius: 12px;'><p style='color: #333;'><strong>Cas d'usage :</strong> User ↔ Product, Chat ↔ Message</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.7rem; line-height: 1.6; white-space: pre;'><span style='color: #6a9955;'>// Côté "un" : User (vendeur)</span><br>@OneToMany(() =&gt; Product, (p) =&gt; p.seller)<br>products!: Product[];<br><br><span style='color: #6a9955;'>// Côté "plusieurs" : Product</span><br>@ManyToOne(() =&gt; User, (u) =&gt; u.products)<br>@JoinColumn({ name: 'seller_id' })<br>seller!: User;</div><p style='color: #333; margin-top: 0.8rem;'><strong>Règles :</strong></p><ul style='padding-left: 1.2rem; color: #333; line-height: 1.7;'><li>🅰️ <code>@JoinColumn</code> est <strong>TOUJOURS côté ManyToOne</strong></li><li>🅱️ Côté OneToMany, c'est un <strong>tableau</strong> (<code>Product[]</code>)</li><li>🅲 Côté ManyToOne, c'est un <strong>objet unique</strong></li></ul></div>",
    "texteParle": "Passons à la relation la plus courante : OneToMany et ManyToOne. Ce sont les deux faces d'une même relation. Cas d'usage : un utilisateur peut vendre plusieurs produits, mais un produit appartient à un seul utilisateur. Un chat peut contenir plusieurs messages, mais un message appartient à un seul chat. Regardez la syntaxe. Côté 'un', c'est-à-dire User, on déclare @OneToMany, avec une flèche vers Product, et une propriété retour seller. La propriété products est un tableau de Product. Côté 'plusieurs', c'est-à-dire Product, on déclare @ManyToOne, avec une flèche vers User, une propriété retour products, et le @JoinColumn. Trois règles à retenir. Premièrement, @JoinColumn est TOUJOURS côté ManyToOne. C'est la table 'plusieurs' qui stocke la clé étrangère. Dans notre exemple, products a une colonne seller_id qui référence users.id. C'est logique : c'est le produit qui appartient à un vendeur, donc c'est lui qui stocke la référence. Deuxièmement, côté OneToMany, la propriété est un tableau. Troisièmement, côté ManyToOne, la propriété est un objet unique. Cette asymétrie est très importante. Si vous vous trompez, TypeORM génère des erreurs au démarrage.",
    "note": "Règle d'or : @JoinColumn est toujours côté ManyToOne. C'est la table 'plusieurs' qui stocke la clé étrangère."
  },
  {
    "titre": "Relation ManyToMany",
    "contenu": "<div style='background: #f8f9fa; padding: 1rem; border-radius: 12px; border-left: 6px solid #10b981;'><p style='color: #333;'><strong>Cas d'usage :</strong> User ↔ Product (favoris)</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.7rem; line-height: 1.6; white-space: pre;'><span style='color: #6a9955;'>// Côté User</span><br>@ManyToMany(() =&gt; Product)<br>@JoinTable({ name: 'favorites' })<br>favorites!: Product[];<br><br><span style='color: #6a9955;'>// Côté Product</span><br>@ManyToMany(() =&gt; User)<br>favoritedBy!: User[];</div><p style='color: #333; margin-top: 0.8rem;'><strong>Comment ça marche :</strong></p><ul style='padding-left: 1.2rem; color: #333; line-height: 1.7;'><li>🅰️ Une <strong>table de jointure</strong> est créée automatiquement</li><li>🅱️ Elle contient 2 colonnes : <code>user_id</code> et <code>product_id</code></li><li>🅲 <code>@JoinTable</code> est déclaré d'un seul côté</li></ul><div style='background: #fff3cd; border-left: 4px solid #856404; padding: 0.8rem; border-radius: 4px; margin-top: 1rem;'><strong>⚠️ Dans SawaMart</strong> : nous n'utilisons PAS <code>@ManyToMany</code> pour les favoris. Nous avons une vraie table <code>Favorite</code> pour ajouter <code>created_at</code>.</div></div>",
    "texteParle": "Passons à la relation ManyToMany. Cas d'usage typique : les favoris. Un utilisateur peut avoir plusieurs produits en favori, et un produit peut être en favori de plusieurs utilisateurs. C'est une relation plusieurs à plusieurs. Comment ça marche ? On déclare @ManyToMany des deux côtés. Sur un côté, on met @JoinTable pour indiquer quelle table de jointure est utilisée. TypeORM crée automatiquement une table intermédiaire avec deux colonnes : user_id et product_id. Chaque ligne de cette table signifie 'cet utilisateur a ce produit en favori'. Notez que @JoinTable est déclaré d'un seul côté, comme @JoinColumn. Maintenant, une remarque importante sur SawaMart. Nous n'utilisons PAS @ManyToMany pour les favoris. Pourquoi ? Parce que nous avons besoin d'ajouter des métadonnées à la relation : la date à laquelle l'utilisateur a mis le produit en favori. Une table de jointure automatique ne permet pas ça facilement. Donc nous avons créé une vraie entité Favorite, avec user_id, product_id, et created_at. C'est plus flexible. C'est un choix important à comprendre : quand la relation elle-même porte des données, il faut créer une entité dédiée plutôt qu'utiliser ManyToMany.",
    "note": "Si la relation porte des données (created_at, quantité, etc.), créez une entité dédiée au lieu de ManyToMany."
  },
  {
    "titre": "Le piège du eager loading",
    "contenu": "<div style='background: #e9ecef; padding: 1rem; border-radius: 12px; border-left: 6px solid #dc3545;'><p style='color: #333;'>Chaque relation peut être chargée de deux manières :</p><div style='display: flex; flex-direction: column; gap: 0.7rem; margin-top: 1rem;'><div style='background: #d4edda; padding: 0.9rem; border-radius: 8px; border-left: 4px solid #155724;'><strong>Lazy loading</strong> (par défaut) : la relation est chargée seulement si on la demande avec <code>relations: { ... }</code></div><div style='background: #f8d7da; padding: 0.9rem; border-radius: 8px; border-left: 4px solid #721c24;'><strong>Eager loading</strong> : la relation est chargée automatiquement à chaque find, via <code>{ eager: true }</code></div></div><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.7rem; line-height: 1.6; white-space: pre; margin-top: 1rem;'><span style='color: #6a9955;'>// Dangereux</span><br>@OneToMany(() =&gt; Message, (m) =&gt; m.chat, { eager: true })<br>messages!: Message[];<br><br><span style='color: #6a9955;'>// Mieux</span><br>@OneToMany(() =&gt; Message, (m) =&gt; m.chat)<br>messages!: Message[];</div><p style='color: #555; font-size: 0.9rem; margin-top: 0.8rem;'>💡 <code>eager: true</code> peut charger des milliers de lignes sans qu'on s'en rende compte.</p></div>",
    "texteParle": "Passons maintenant à un piège classique : le eager loading. Chaque relation peut être chargée de deux manières. En lazy loading, qui est la valeur par défaut, la relation n'est chargée que si on la demande explicitement avec un objet relations dans la requête. En eager loading, la relation est chargée automatiquement à chaque fois qu'on charge l'entité, grâce à l'option eager true. Le eager loading semble pratique, mais c'est un piège. Regardez cet exemple : si on met eager true sur la relation messages d'un Chat, chaque fois qu'on chargera un chat, TypeORM chargera TOUS ses messages. Imaginez un chat avec 5000 messages. À chaque chargement du chat, on charge 5000 lignes. C'est un désastre pour les performances. C'est ce qu'on appelle le 'N+1 problem' à l'envers. Il faut être très prudent avec eager true. Utilisez-le seulement sur des relations où le nombre de lignes est limité et connu : par exemple, les images d'un produit, maximum 4. Mais jamais sur les messages, les transactions, ou toute relation qui peut être volumineuse. La règle : eager true sur les petites relations, lazy partout ailleurs.",
    "note": "eager: true est tentant mais dangereux. Utilisez-le avec parcimonie."
  },
  {
    "titre": "Les options importantes",
    "contenu": "<div style='background: #f8f9fa; padding: 1rem; border-radius: 12px; border-left: 6px solid #2a5298;'><p style='color: #333;'>Voici les options que vous pouvez passer à une relation :</p><ul style='padding-left: 1.2rem; color: #333; line-height: 1.9;'><li><strong>cascade</strong> : propager les opérations (save, remove) aux entités liées</li><li><strong>eager</strong> : charger automatiquement la relation</li><li><strong>nullable</strong> : autoriser la relation à être nulle</li><li><strong>onDelete</strong> : que faire si l'entité liée est supprimée (CASCADE, SET NULL, RESTRICT)</li><li><strong>lazy</strong> : charger la relation via un Promise (rarement utilisé)</li><li><strong>orphanedRowAction</strong> : que faire des enfants orphelins (cascade sur les relations OneToMany)</li></ul><div style='background: #fff3cd; border-left: 4px solid #856404; padding: 0.8rem; border-radius: 4px; margin-top: 1rem;'><strong>⚠️ Attention à <code>cascade: true</code></strong> : si vous supprimez un Chat, cela peut supprimer automatiquement tous ses Messages. Parfois voulu, parfois non.</div></div>",
    "texteParle": "Voici les options les plus importantes qu'on peut passer à une relation. cascade : propage les opérations aux entités liées. Si on sauvegarde un Chat avec cascade true sur messages, TypeORM sauvegardera aussi les messages. Si on supprime, il supprimera en cascade. C'est puissant mais dangereux : on peut supprimer des données sans le vouloir. eager : on en a déjà parlé. nullable : autorise la relation à être nulle. Utile pour les relations optionnelles, comme Chat.assistant. onDelete : que faire si l'entité liée est supprimée. CASCADE signifie supprimer les enfants. SET NULL signifie mettre à null la clé étrangère. RESTRICT signifie interdire la suppression. Dans SawaMart, on utilise souvent RESTRICT pour éviter de supprimer accidentellement des données critiques. Par exemple, on ne peut pas supprimer un utilisateur qui a des produits. On le bloque, on ne le supprime pas. lazy : charge la relation via un Promise. Rarement utilisé, car ça complique le code. Et orphanedRowAction : contrôle le sort des enfants quand on les retire d'une relation OneToMany. Bref, ces options vous donnent un contrôle fin, mais utilisez-les avec conscience. Les valeurs par défaut sont souvent les meilleures.",
    "note": "onDelete: RESTRICT est le choix sûr par défaut pour les données critiques."
  },

    "texteParle": "Récapitulons les relations que nous avons vues dans SawaMart. En OneToOne, on a User et UserProfile, User et Wallet, Chat et Dispute. C'est trois relations un à un. En OneToMany et ManyToOne, on a beaucoup de relations. User est vendeur de plusieurs produits. User est acheteur, vendeur, ou assistant dans plusieurs chats. Category contient plusieurs produits. Product a plusieurs images. Chat contient plusieurs messages, plusieurs transactions, plusieurs ratings. Wallet a plusieurs transactions. User a plusieurs notifications, dépôts, retraits. Et enfin, pour les relations ManyToMany, nous avons préféré créer des entités dédiées. Favorite est une entité qui représente la relation User-Product. UserInteraction est aussi une entité dédiée. Rating est une entité qui relie deux Users (rater et rated). Pourquoi ce choix ? Parce que ces relations portent des données : la date pour Favorite, le type et la durée pour UserInteraction, la note et le commentaire pour Rating. Quand une relation porte des données, il faut une entité dédiée. C'est une règle importante de modélisation.",

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentIndex = 0;
    let isSpeaking = false;
    let isPaused = false;
    let currentUtterance = null;
    let isLoading = false;
    let loadingTimeout = null;
    let isTransitioning = false;
    let speechSupported = true;
    let userInteracted = false;
    let isPlaying = false;
    let loadingCancelled = false;

    const total = slides.length;
    const synth = window.speechSynthesis;

    // Références jQuery
    const $title = $('#slideTitle');
    const $body = $('#slideBody');
    const $counter = $('#slideCounter');
    const $statusText = $('#statusText');
    const $statusBadge = $('#statusBadge');
    const $loading = $('#loadingOverlay');
    const $loadingText = $('#loadingText');
    const $loadingSub = $('#loadingSub');
    const $loadingTimeout = $('#loadingTimeout');
    const $loadingProgressBar = $('#loadingProgressBar');
    const $autoIndicator = $('#autoIndicator');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $replay = $('#replayBtn');
    const $play = $('#playBtn');
    const $cancelLoading = $('#cancelLoadingBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function setStatus(text, type) {
        $statusText.text(text);
        $statusBadge.removeClass('idle speaking error paused waiting loading');
        if (type === 'speaking') $statusBadge.addClass('speaking');
        else if (type === 'error') $statusBadge.addClass('error');
        else if (type === 'paused') $statusBadge.addClass('paused');
        else if (type === 'waiting') $statusBadge.addClass('waiting');
        else if (type === 'loading') $statusBadge.addClass('loading');
        else $statusBadge.addClass('idle');
    }

    function updatePlayButton() {
        if (isPlaying) {
            $play.addClass('playing');
            $play.find('.btn-icon').text('⏸');
            $play.find('.btn-label').text('Pause');
        } else {
            $play.removeClass('playing');
            $play.find('.btn-icon').text('▶');
            $play.find('.btn-label').text('Play');
        }
    }

    function showLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        
        loadingCancelled = false;
        isLoading = true;
        
        // Réinitialiser la barre de progression
        $loadingProgressBar.css('animation', 'none');
        $loadingProgressBar.css('width', '0%');
        // Forcer un reflow
        $loadingProgressBar[0].offsetHeight;
        $loadingProgressBar.css('animation', 'loadingProgress 30s ease-out forwards');
        
        $loadingText.text('Préparation vocale...');
        $loadingSub.text('Synthèse en cours');
        $loadingTimeout.text('⏱️ 30 secondes maximum');
        $loading.fadeIn(300);
        setStatus("⏳ Chargement...", 'loading');
        
        // 🔥 TIMEOUT DE 30 SECONDES
        loadingTimeout = setTimeout(() => {
            if (isLoading && !loadingCancelled) {
                hideLoading();
                setStatus("⚠️ Délai dépassé (30s)", 'error');
                isPlaying = false;
                updatePlayButton();
                $loadingSub.text('La synthèse vocale a pris trop de temps');
                $loadingTimeout.text('❌ Délai dépassé');
            }
        }, 30000);
    }

    function hideLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        isLoading = false;
        loadingCancelled = false;
        $loading.fadeOut(300);
        // Ne pas changer le statut si on est en train de parler
        if (!isSpeaking && !isPlaying) {
            setStatus("⏸ Lecture arrêtée", 'paused');
        }
    }

    function cancelLoading() {
        loadingCancelled = true;
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        hideLoading();
        stopSpeaking();
        setStatus("⏸ Annulé", 'paused');
        isPlaying = false;
        updatePlayButton();
        $loadingText.text('Annulé par l\'utilisateur');
        $loadingSub.text('Vous pouvez réessayer');
        $loadingTimeout.text('✕ Annulation');
    }

    // Arrêter la parole proprement
    function stopSpeaking() {
        try {
            if (synth && (synth.speaking || synth.pending)) {
                synth.cancel();
            }
        } catch(e) {
            console.warn('Erreur stopSpeaking:', e);
        }
        if (currentUtterance) {
            try {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance.onstart = null;
            } catch(e) {}
            currentUtterance = null;
        }
        isSpeaking = false;
        isPlaying = false;
        updatePlayButton();
    }

    // Mettre en pause la parole
    function pauseSpeaking() {
        try {
            if (synth && synth.speaking) {
                synth.pause();
                isPaused = true;
                isPlaying = false;
                setStatus("⏸ Lecture en pause", 'paused');
                updatePlayButton();
            }
        } catch(e) {
            console.warn('Erreur pauseSpeaking:', e);
            stopSpeaking();
        }
    }

    // Reprendre la parole
    function resumeSpeaking() {
        try {
            if (synth && synth.paused) {
                synth.resume();
                isPaused = false;
                isPlaying = true;
                setStatus("🔊 Lecture en cours", 'speaking');
                updatePlayButton();
            } else if (!isSpeaking && !synth.speaking && !synth.pending) {
                speakSlide(currentIndex);
            }
        } catch(e) {
            console.warn('Erreur resumeSpeaking:', e);
            speakSlide(currentIndex);
        }
    }

    function renderSlide(index) {
        const slide = slides[index];
        $title.text(slide.titre);

        let html = '';
        html += `<div class="content-card">${slide.contenu}</div>`;
        if (slide.note) {
            html += `<div class="note-box">${slide.note}</div>`;
        }
        $body.html(html);
        $counter.text(`${index+1} / ${total}`);

        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
        }
    }

    // ================================================================
    // LECTURE VOCALE
    // ================================================================
    function speakSlide(index) {
        return new Promise((resolve) => {
            const slide = slides[index];
            const text = slide.texteParle;
            
            if (!text || text.trim() === '' || !speechSupported) {
                resolve();
                return;
            }

            if (!window.speechSynthesis) {
                setStatus("❌ Synthèse vocale non supportée", 'error');
                speechSupported = false;
                resolve();
                return;
            }

            // Arrêter toute lecture en cours
            stopSpeaking();
            
            // Réinitialiser l'état de pause
            isPaused = false;
            
            showLoading();
            setStatus("Initialisation...", 'loading');

            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.92;
                utterance.pitch = 1.05;
                utterance.volume = 1;

                let isFinished = false;
                let errorHandled = false;

                utterance.onstart = function() {
                    if (loadingCancelled) {
                        stopSpeaking();
                        resolve();
                        return;
                    }
                    hideLoading();
                    isSpeaking = true;
                    isPlaying = true;
                    isPaused = false;
                    setStatus("🔊 Lecture en cours", 'speaking');
                    updatePlayButton();
                };

                utterance.onend = function() {
                    if (isFinished) return;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    setStatus("✅ Terminé", 'idle');
                    hideLoading();
                    updatePlayButton();
                    resolve();
                };

                utterance.onerror = function(e) {
                    if (isFinished || errorHandled) return;
                    errorHandled = true;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    hideLoading();
                    updatePlayButton();
                    
                    if (e.error === 'not-allowed') {
                        setStatus("⚠️ Permission refusée", 'error');
                    } else if (e.error === 'synthesis-unavailable') {
                        setStatus("⚠️ Synthèse indisponible", 'error');
                    } else if (e.error === 'canceled') {
                        setStatus("⏸ Annulé", 'paused');
                    } else {
                        setStatus("❌ Erreur audio: " + (e.error || 'inconnue'), 'error');
                    }
                    
                    resolve();
                };

                // Gestion du chargement des voix
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = function() {
                        if (!loadingCancelled) {
                            try {
                                synth.speak(utterance);
                            } catch(err) {
                                // Silencieux
                            }
                        }
                        synth.onvoiceschanged = null;
                    };
                }

                currentUtterance = utterance;
                
                if (!loadingCancelled) {
                    try {
                        synth.speak(utterance);
                    } catch(err) {
                        setTimeout(() => {
                            if (!loadingCancelled) {
                                try {
                                    synth.speak(utterance);
                                } catch(e) {
                                    setStatus("❌ Erreur de lecture", 'error');
                                    isPlaying = false;
                                    updatePlayButton();
                                    hideLoading();
                                    resolve();
                                }
                            } else {
                                resolve();
                            }
                        }, 100);
                    }
                } else {
                    resolve();
                }

            } catch(err) {
                hideLoading();
                setStatus("❌ Erreur générale", 'error');
                isPlaying = false;
                updatePlayButton();
                console.error('Erreur speakSlide:', err);
                resolve();
            }
        });
    }

    // ================================================================
    // NAVIGATION
    // ================================================================
    async function goToSlide(index) {
        if (isTransitioning) return;
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        
        // Si on est en train de lire, on met en pause avant de naviguer
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        // Arrêter complètement la lecture
        stopSpeaking();
        
        await new Promise(r => setTimeout(r, 50));
        
        if (index === currentIndex) {
            setStatus("📄 Slide actuel", 'idle');
            return;
        }

        isTransitioning = true;
        currentIndex = index;
        renderSlide(index);
        
        // Réinitialiser l'état de lecture
        isPlaying = false;
        updatePlayButton();
        setStatus("⏸ Lecture arrêtée", 'paused');

        await new Promise(r => setTimeout(r, 150));
        isTransitioning = false;
    }

    async function goToNext() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex + 1 < total) {
            await goToSlide(currentIndex + 1);
        } else {
            setStatus("🏁 Dernier slide", 'idle');
        }
    }

    async function goToPrev() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex - 1 >= 0) {
            await goToSlide(currentIndex - 1);
        } else {
            setStatus("🔁 Premier slide", 'idle');
        }
    }

    // ================================================================
    // GESTION PLAY/PAUSE
    // ================================================================
    function togglePlay() {
        if (!userInteracted) {
            userInteracted = true;
        }

        // Si le chargement est en cours, on l'annule
        if (isLoading) {
            cancelLoading();
            return;
        }

        // Si le synthétiseur est en pause, on reprend
        if (synth && synth.paused) {
            resumeSpeaking();
            return;
        }

        // Si la lecture est en cours, on met en pause
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
            return;
        }

        // Sinon, on démarre la lecture du slide courant
        if (!isSpeaking && !isPlaying) {
            stopSpeaking();
            speakSlide(currentIndex);
        }
    }

    // ================================================================
    // INIT
    // ================================================================
    async function init() {
        // Vérifier la compatibilité
        if (!window.speechSynthesis) {
            setStatus("❌ Synthèse vocale non supportée", 'error');
            speechSupported = false;
        }

        // Précharger les voix
        try {
            if (synth.getVoices) {
                synth.getVoices();
                setTimeout(() => {
                    try {
                        synth.getVoices();
                    } catch(e) {}
                }, 200);
            }
        } catch(e) {
            console.warn('Erreur chargement voix:', e);
        }

        // Afficher le premier slide
        renderSlide(0);
        $counter.text(`1 / ${total}`);
        
        // État initial
        setStatus("⏸ Appuie sur Play", 'paused');
        updatePlayButton();
        $autoIndicator.text('⏸ Lecture manuelle');

        // ================================================================
        // ÉVÉNEMENTS
        // ================================================================
        
        // Bouton Play/Pause
        $play.on('click', function() {
            togglePlay();
        });

        // Bouton Annuler le chargement
        $cancelLoading.on('click', function() {
            cancelLoading();
        });

        // Navigation
        $prev.on('click', function() {
            // Si chargement en cours, on annule
            if (isLoading) cancelLoading();
            goToPrev();
        });

        $next.on('click', function() {
            if (isLoading) cancelLoading();
            goToNext();
        });

        // Replay - relire le slide courant
        $replay.on('click', function() {
            if (isLoading) cancelLoading();
            stopSpeaking();
            setTimeout(() => {
                speakSlide(currentIndex);
            }, 100);
        });

        // Support du clavier (espace pour play/pause)
        $(document).on('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });

        // Nettoyage
        $(window).on('beforeunload', function() {
            try {
                if (synth.speaking) synth.cancel();
            } catch(e) {}
            hideLoading();
        });

        // Gérer les cas où la synthèse se termine de manière inattendue
        setInterval(() => {
            if (isPlaying && !synth.speaking && !synth.pending && !isPaused && !isLoading) {
                isPlaying = false;
                updatePlayButton();
                setStatus("⏸ Lecture arrêtée", 'paused');
            }
        }, 1000);
    }

    init();
});



    // ================================================================
    // GESTION DU THÈME JOUR/NUIT
    // ================================================================
    let isDarkMode = false;

    function toggleTheme() {
        isDarkMode = !isDarkMode;
        const body = document.body;
        const appContainer = document.querySelector('.app-container');
        const header = document.querySelector('.slide-header');
        const footer = document.querySelector('.slide-footer');
        const contentCards = document.querySelectorAll('.content-card');
        const noteBoxes = document.querySelectorAll('.note-box');
        const mathBlocks = document.querySelectorAll('.math-block');
        const buttons = document.querySelectorAll('.btn');
        const statusBadge = document.querySelector('.status-badge');
        const slideCounter = document.querySelector('.slide-counter');
        const autoIndicator = document.querySelector('.auto-indicator');
        const themeBtn = document.getElementById('themeToggle');

        if (isDarkMode) {
            // Mode nuit
            body.style.background = '#0b1120';
            body.style.color = '#f1f5f9';
            appContainer.style.background = 'linear-gradient(145deg, #0f172a 0%, #1e293b 100%)';
            header.style.background = 'rgba(15, 23, 42, 0.85)';
            footer.style.background = 'rgba(15, 23, 42, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.05)';
                card.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.08)';
                note.style.color = '#cbd5e1';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.25)';
                block.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#e2e8f0';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.12)';
                statusBadge.style.color = '#93bbfc';
            }
            if (slideCounter) {
                slideCounter.style.color = '#94a3b8';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#64748b';
            }
            if (themeBtn) {
                themeBtn.textContent = '☀️';
                themeBtn.title = 'Passer en mode jour';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#e2e8f0';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#e2e8f0';
                }
            });
        } else {
            // Mode jour (par défaut)
            body.style.background = '#f0f4f8';
            body.style.color = '#1a202c';
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
            header.style.background = 'rgba(255, 255, 255, 0.85)';
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.8)';
                card.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.12)';
                note.style.color = '#2c3e50';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.05)';
                block.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#2d3748';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
                statusBadge.style.color = '#2b6cb0';
            }
            if (slideCounter) {
                slideCounter.style.color = '#4a5568';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#718096';
            }
            if (themeBtn) {
                themeBtn.textContent = '🌓';
                themeBtn.title = 'Passer en mode nuit';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#2c3e50';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#2d3748';
                }
            });
        }
    }

    // Initialiser en mode jour
    document.addEventListener('DOMContentLoaded', function() {
        // Appliquer le mode jour par défaut
        const body = document.body;
        body.style.background = '#f0f4f8';
        body.style.color = '#1a202c';

        const autoIndicator = document.querySelector('.auto-indicator');

        document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {

        document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
