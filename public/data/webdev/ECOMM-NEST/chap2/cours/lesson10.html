<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Présentation mobile</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' },
            options: { skipHtmlTypes: 'script' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 500px;
        margin: 0 auto;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    .slide-header {
        flex-shrink: 0;
        padding: 18px 16px 10px 16px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        z-index: 10;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .slide-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
    }

    .content-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 18px 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        flex-shrink: 0;
    }

    .content-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .content-card li {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        line-height: 1.5;
    }

    .content-card li:last-child {
        border-bottom: none;
    }

    .bullet-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
    }

    .math-block {
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        overflow-x: auto;
        flex-shrink: 0;
        margin: 4px 0;
    }

    .math-block .math {
        font-size: 1.2rem;
        color: #e2e8f0;
    }

    .note-box {
        background: rgba(96, 165, 250, 0.08);
        border-left: 4px solid #60a5fa;
        padding: 12px 16px;
        border-radius: 12px;
        font-style: italic;
        font-size: 0.9rem;
        color: #cbd5e1;
        flex-shrink: 0;
    }

    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        border-radius: 0;
        flex-direction: column;
    }

    .loading-card {
        background: #1e293b;
        padding: 32px 28px;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #334155;
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px auto;
    }

    .loading-text {
        font-weight: 600;
        font-size: 1.1rem;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    .loading-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 16px;
    }
    .loading-progress {
        height: 3px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        animation: loadingProgress 30s ease-out forwards;
    }

    .loading-timeout {
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 12px;
    }

    .btn-cancel-loading {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 40px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #f87171;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }

    .btn-cancel-loading:active {
        transform: scale(0.94);
        background: rgba(239, 68, 68, 0.25);
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
    }

    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .slide-counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255,255,255,0.05);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(255,255,255,0.04);
    }

    .status-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 30px;
        background: rgba(96, 165, 250, 0.12);
        color: #93bbfc;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
    }

    .status-badge .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: pulse-dot 1.2s infinite;
        flex-shrink: 0;
    }

    .status-badge.idle .dot {
        animation: none;
        background: #64748b;
    }
    .status-badge.speaking .dot {
        background: #34d399;
        animation: pulse-dot 0.8s infinite;
    }
    .status-badge.error .dot {
        background: #f87171;
        animation: none;
    }
    .status-badge.paused .dot {
        animation: none;
        background: #fbbf24;
    }
    .status-badge.waiting .dot {
        animation: pulse-dot 1.5s infinite;
        background: #fbbf24;
    }
    .status-badge.loading .dot {
        animation: pulse-dot 0.5s infinite;
        background: #60a5fa;
    }

    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.7); }
    }

    .footer-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(255,255,255,0.1);
    }

    .btn-secondary {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-play {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
        min-width: 80px;
        justify-content: center;
    }
    .btn-play:active {
        background: rgba(52, 211, 153, 0.25);
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
    }

    .auto-indicator {
        font-size: 0.65rem;
        color: #64748b;
        text-align: center;
        letter-spacing: 0.3px;
        padding: 2px 0;
    }

    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.2rem;
        }
        .content-card li {
            font-size: 0.9rem;
            padding: 8px 0;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .btn-play {
            min-width: 60px;
        }
        .footer-buttons {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
        .loading-card {
            padding: 20px 16px;
        }
        .math-block .math {
            font-size: 1rem;
        }
    }

    @media (min-width: 600px) {
        .app-container {
            max-width: 480px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
        .loading-overlay {
            border-radius: 32px;
        }
    }

    /* Mode jour (par défaut) */
    html, body {
        background: #f0f4f8 !important;
        color: #1a202c !important;
    }
    .app-container {
        background: linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%) !important;
    }
    .slide-header {
        background: rgba(255, 255, 255, 0.85) !important;
        border-bottom: 1px solid rgba(0,0,0,0.08) !important;
    }
    .slide-header h1 {
        background: linear-gradient(135deg, #2b6cb0, #6b46c1) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        background-clip: text !important;
    }
    .slide-footer {
        background: rgba(255, 255, 255, 0.9) !important;
        border-top: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card {
        background: rgba(255,255,255,0.8) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card li {
        border-bottom: 1px solid rgba(0,0,0,0.05) !important;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.12) !important;
        border-left: 4px solid #4299e1 !important;
        color: #2c3e50 !important;
    }
    .math-block {
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .math-block .math {
        color: #2d3748 !important;
    }
    .slide-counter {
        color: #4a5568 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .status-badge {
        background: rgba(96, 165, 250, 0.15) !important;
        color: #2b6cb0 !important;
        border: 1px solid rgba(96, 165, 250, 0.15) !important;
    }
    .btn {
        color: #2d3748 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .btn-secondary {
        background: rgba(0,0,0,0.04) !important;
        border-color: rgba(0,0,0,0.08) !important;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15) !important;
        border-color: rgba(52, 211, 153, 0.2) !important;
        color: #38a169 !important;
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15) !important;
        border-color: rgba(251, 191, 36, 0.2) !important;
        color: #d69e2e !important;
    }
    .auto-indicator {
        color: #718096 !important;
    }
    .loading-card {
        background: #ffffff !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .loading-text {
        color: #1a202c !important;
    }
    .loading-sub {
        color: #4a5568 !important;
    }
</style>
</head>
<body>

<div class="app-container">

    <header class="slide-header">
        <h1 id="slideTitle">Chargement...</h1>
    </header>

    <main class="slide-body" id="slideBody"></main>

    <!-- LOADING OVERLAY AVEC BOUTON ANNULER -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Préparation vocale...</div>
            <div class="loading-sub" id="loadingSub">Synthèse en cours</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loadingProgressBar"></div>
            </div>
            <div class="loading-timeout" id="loadingTimeout">⏱️ 30 secondes maximum</div>
            <button class="btn-cancel-loading" id="cancelLoadingBtn">
                <span>✕</span> Annuler
            </button>
        </div>
    </div>

    <footer class="slide-footer">
        <div class="footer-top">
            <span class="slide-counter" id="slideCounter">1 / 3</span>
            <span class="status-badge idle" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">Prêt</span>
            </span>
        </div>

        <div class="footer-buttons">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-secondary" id="replayBtn">
                <span class="btn-icon">🔁</span> <span class="btn-label">Relire</span>
            </button>
            <button class="btn btn-play" id="playBtn">
                <span class="btn-icon">▶</span> <span class="btn-label">Play</span>
            </button>
        </div>

        <div class="auto-indicator" id="autoIndicator">⏸ Lecture manuelle</div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // SLIDES
    // ================================================================
    const slides = [
  {
    "titre": "L'entité User",
    "contenu": "<div style='background: linear-gradient(135deg, #1e3c72, #2a5298); color: white; padding: 2rem; border-radius: 15px; text-align: center; margin-bottom: 1.5rem;'><h2 style='color: #fff; margin-bottom: 0.5rem;'>👤 L'entité User</h2><p style='color: #e0e0e0; font-size: 1.1rem;'>Le cœur absolu de SawaMart</p><hr style='border-color: #4a7db0; width: 50%;'><p style='color: #f0f0f0;'>Leçon 2.4 : Modéliser User avec TypeORM</p></div><p>Entrons dans le vif du sujet. <strong>User</strong> est l'entité la plus importante de notre projet. Presque toutes les autres tables y font référence : un produit a un vendeur, un wallet a un propriétaire, un message a un expéditeur, un litige a un acheteur et un vendeur. Modéliser <code>User</code> correctement, c'est poser les fondations de tout le reste.</p>",
    "texteParle": "Bonjour à toutes et à tous et bienvenue dans cette quatrième leçon du chapitre deux. Nous entrons enfin dans le vif du sujet : la création de notre première entité TypeORM. Et pas n'importe laquelle, puisque nous commençons par User, l'utilisateur. C'est l'entité la plus importante du projet, parce que tout tourne autour d'elle. Un produit appartient à un vendeur, un wallet appartient à un utilisateur, un message a un expéditeur, un litige a un acheteur et un vendeur. Bref, si vous ratez User, tout le reste sera bancal. Nous allons donc prendre le temps de bien la concevoir, champ par champ, en comprenant pourquoi chaque information est là. C'est parti.",
    "note": "Bien modéliser User dès le départ vous évitera des migrations douloureuses plus tard."
  },
  {
    "titre": "Rappel : qu'est-ce qu'une entité ?",
    "contenu": "<div style='background: #f8f9fa; padding: 1.5rem; border-radius: 12px; border-left: 6px solid #2a5298;'><p style='color: #1e3c72; font-weight: bold; margin-top: 0;'>Une entité TypeORM, c'est :</p><ul style='padding-left: 1.2rem; color: #333; line-height: 1.9;'><li>🏛️ Une <strong>classe TypeScript</strong></li><li>🗄️ Qui correspond à une <strong>table SQL</strong></li><li>🔧 Décorée avec <code>@Entity()</code></li><li>📝 Chaque propriété est une colonne avec <code>@Column()</code></li><li>🔄 Les relations utilisent <code>@OneToMany</code>, <code>@ManyToOne</code>, etc.</li></ul><p style='color: #333; margin-top: 1rem;'>Le fichier <code>user.entity.ts</code> va décrire à lui seul :</p><div style='background: #e9ecef; padding: 0.8rem; border-radius: 8px; font-family: monospace; font-size: 0.8rem; color: #333;'>📋 La structure de la table users<br>🔐 Les contraintes (unique, not null)<br>🔗 Les relations vers les autres tables</div></div>",
    "texteParle": "Avant de plonger dans le code, rappelons ce qu'est une entité TypeORM. C'est une classe TypeScript qui correspond à une table SQL. Elle est décorée avec @Entity. Chaque propriété de la classe correspond à une colonne de la table, décorée avec @Column. Les relations entre entités se déclarent avec des décorateurs comme @OneToMany, @ManyToOne, @OneToOne. Notre fichier user.entity.ts va donc décrire à lui seul trois choses : la structure de la table users, avec toutes ses colonnes et leurs types SQL. Les contraintes, comme unique sur le numéro de téléphone, ou not null sur le nom d'utilisateur. Et enfin, les relations vers toutes les autres tables. TypeORM va lire cette classe et générer automatiquement le SQL nécessaire pour créer ou modifier la table. C'est extrêmement puissant. Une seule source de vérité, qui est le code.",
    "note": "Un fichier .entity.ts = une table SQL. C'est aussi simple que ça."
  },
  {
    "titre": "Les énumérations UserRole et VerificationStatus",
    "contenu": "<div style='background: #e9ecef; padding: 1rem; border-radius: 12px;'><p style='color: #333;'>Avant de créer l'entité, définissons deux énumérations :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.75rem; line-height: 1.6; white-space: pre;'><span style='color: #6a9955;'>// Rôles utilisateur</span><br>export enum UserRole {<br>&nbsp;&nbsp;USER = 'user',<br>&nbsp;&nbsp;ASSISTANT = 'assistant',<br>&nbsp;&nbsp;ACCOUNTANT = 'accountant',<br>&nbsp;&nbsp;ADMIN = 'admin',<br>}<br><br><span style='color: #6a9955;'>// Statut de vérification KYC</span><br>export enum VerificationStatus {<br>&nbsp;&nbsp;PENDING = 'pending',<br>&nbsp;&nbsp;APPROVED = 'approved',<br>&nbsp;&nbsp;REJECTED = 'rejected',<br>&nbsp;&nbsp;EXPIRED = 'expired',<br>}</div><p style='color: #555; font-size: 0.9rem; margin-top: 0.8rem;'>💡 On utilise des chaînes ('user', 'admin') plutôt que des nombres, pour la lisibilité en base.</p></div>",
    "texteParle": "Avant de créer l'entité User, nous devons définir deux énumérations. Une énumération, c'est une liste de valeurs possibles pour un champ. La première, UserRole, définit les quatre rôles de notre plateforme : USER, ASSISTANT, ACCOUNTANT, ADMIN. La deuxième, VerificationStatus, définit les statuts possibles pour le KYC : PENDING quand la demande est en attente, APPROVED quand elle est validée, REJECTED quand elle est refusée, EXPIRED quand elle a expiré. Notez bien : on utilise des chaînes de caractères comme valeurs : 'user', 'admin', etc., plutôt que des nombres. Pourquoi ? Parce que c'est beaucoup plus lisible en base de données. Quand vous ouvrez pgAdmin et que vous voyez la colonne role, vous voyez 'admin' écrit en toutes lettres, pas '3'. C'est un gain énorme pour la maintenance et le débogage. TypeORM gère très bien les énumérations PostgreSQL, qui sont des types natifs.",
    "note": "Toujours utiliser des chaînes dans les énumérations exposées en base. Plus lisible, plus maintenable."
  },
  {
    "titre": "Début de l'entité User",
    "contenu": "<div style='background: #f8f9fa; padding: 1rem; border-radius: 12px; border-left: 6px solid #2a5298;'><p style='color: #333;'>Créons le fichier <code>src/database/entities/user.entity.ts</code> :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.72rem; line-height: 1.6; white-space: pre;'>import {<br>&nbsp;&nbsp;Entity, Column, PrimaryGeneratedColumn,<br>&nbsp;&nbsp;CreateDateColumn, UpdateDateColumn,<br>&nbsp;&nbsp;OneToOne, OneToMany, JoinColumn,<br>} from 'typeorm';<br>import { UserProfile } from './user-profile.entity';<br>import { Wallet } from './wallet.entity';<br><span style='color: #6a9955;'>// ... autres imports</span><br><br>@Entity('users')<br>export class User {<br>&nbsp;&nbsp;@PrimaryGeneratedColumn('uuid')<br>&nbsp;&nbsp;id!: string;<br>&nbsp;&nbsp;<br>&nbsp;&nbsp;<span style='color: #6a9955;'>// ... la suite dans les slides suivants</span><br>}</div></div>",
    "texteParle": "Créons maintenant le fichier src/database/entities/user.entity.ts. Regardez la structure. On importe d'abord les décorateurs TypeORM dont nous aurons besoin : Entity, Column, PrimaryGeneratedColumn, CreateDateColumn, UpdateDateColumn, OneToOne, OneToMany, JoinColumn. On importe aussi les autres entités avec lesquelles User a des relations : UserProfile, Wallet, et d'autres que nous ajouterons. Puis, on déclare la classe avec le décorateur @Entity('users'). Le paramètre 'users' indique le nom exact de la table dans PostgreSQL. Sans ce paramètre, TypeORM aurait utilisé le nom de la classe en minuscules, 'user', ce qui n'est pas idéal car 'user' est un mot réservé dans PostgreSQL. Donc on précise 'users'. Ensuite, la classe commence par la propriété id, décorée avec @PrimaryGeneratedColumn('uuid'). Cela signifie que c'est la clé primaire, générée automatiquement, et de type UUID. Un UUID, c'est un identifiant unique universel, comme un très long code aléatoire. C'est plus sûr qu'un simple entier incrémental, car on ne peut pas deviner le prochain ID. C'est important pour la sécurité. Voilà pour le squelette. Nous allons ajouter les autres champs un par un.",
    "note": "@Entity('users') : toujours préciser le nom de table pour éviter les conflits avec les mots réservés SQL."
  },
  {
    "titre": "Champs d'identité",
    "contenu": "<div style='background: #e9ecef; padding: 1rem; border-radius: 12px;'><p style='color: #333;'>Les champs qui identifient l'utilisateur :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.75rem; line-height: 1.7; white-space: pre;'>@Column({ type: 'varchar', length: 20, unique: true })<br>phone_number!: string;<br><br>@Column({ type: 'varchar', length: 50, unique: true })<br>username!: string;<br><br>@Column({ type: 'varchar', length: 255 })<br>password_hash!: string;<br><br>@Column({<br>&nbsp;&nbsp;type: 'enum',<br>&nbsp;&nbsp;enum: UserRole,<br>&nbsp;&nbsp;default: UserRole.USER,<br>})<br>role!: UserRole;</div><p style='color: #555; font-size: 0.9rem; margin-top: 0.8rem;'>💡 <code>unique: true</code> empêche les doublons au niveau de la base.</p></div>",
    "texteParle": "Ajoutons les champs d'identité. Premièrement, phone_number. C'est le numéro de téléphone, de type varchar, longueur maximum vingt caractères, et surtout unique. L'unicité est cruciale : deux utilisateurs ne peuvent pas avoir le même numéro. Si quelqu'un tente de s'inscrire avec un numéro existant, la base de données rejettera l'insertion. C'est une garantie au niveau du plus bas niveau. Deuxièmement, username. Même chose : varchar, cinquante caractères, unique. Troisièmement, password_hash. C'est le mot de passe, mais jamais en clair. On stocke un hash, c'est-à-dire une empreinte cryptographique irréversible. On utilise bcrypt pour ça, qui produit une chaîne de soixante caractères. On prévoit donc deux cent cinquante-cinq caractères pour être large. Quatrièmement, role. C'est un champ de type énumération, avec l'énumération UserRole que nous avons définie. Par défaut, un nouvel utilisateur est USER. C'est le rôle le moins privilégié, celui qui peut vendre et acheter mais pas administrer. Seul un admin peut promouvoir quelqu'un à un autre rôle. Voilà les quatre premiers champs. C'est la carte d'identité de base de chaque utilisateur.",
    "note": "unique: true crée un index en base. Donc les recherches par phone_number ou username sont très rapides."
  },
  {
    "titre": "Champs de vérification et de blocage",
    "contenu": "<div style='background: #f8f9fa; padding: 1rem; border-radius: 12px; border-left: 6px solid #10b981;'><p style='color: #333;'>Les champs d'état de l'utilisateur :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.7rem; line-height: 1.6; white-space: pre;'>@Column({ type: 'boolean', default: false })<br>is_verified!: boolean;<br><br>@Column({<br>&nbsp;&nbsp;type: 'enum', enum: VerificationStatus,<br>&nbsp;&nbsp;default: VerificationStatus.PENDING,<br>})<br>verification_status!: VerificationStatus;<br><br>@Column({ type: 'timestamp', nullable: true })<br>verification_date!: Date;<br><br>@Column({ type: 'boolean', default: false })<br>is_blocked!: boolean;<br><br>@Column({ type: 'text', nullable: true })<br>block_reason!: string;<br><br>@Column({ type: 'timestamp', nullable: true })<br>blocked_at!: Date;</div></div>",
    "texteParle": "Ajoutons maintenant les champs d'état. is_verified : un booléen qui indique si l'utilisateur est vérifié. Par défaut, false. verification_status : une énumération qui donne plus de détails : pending, approved, rejected, expired. C'est plus riche que is_verified seul, car ça permet de savoir pourquoi un utilisateur n'est pas vérifié. verification_date : la date à laquelle la vérification a été approuvée. is_blocked : un booléen qui indique si le compte est bloqué. Quand un admin bloque un utilisateur, ce champ passe à true et l'utilisateur ne peut plus rien faire. block_reason : un texte qui explique pourquoi l'utilisateur a été bloqué. C'est utile pour les recours. blocked_at : la date du blocage. Ces champs forment l'état du compte. Ils changent rarement, mais leur changement a un impact fort. Par exemple, is_blocked à true bloque la quasi-totalité des actions de l'utilisateur. C'est un état critique de notre application.",
    "note": "Distinguer is_verified et verification_status permet plus de granularité."
  },
  {
    "titre": "Champs de sécurité anti-brute-force",
    "contenu": "<div style='background: #f8f9fa; padding: 1rem; border-radius: 12px; border-left: 6px solid #dc3545;'><p style='color: #333;'>Protection contre les attaques par force brute :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.75rem; line-height: 1.7; white-space: pre;'>@Column({ type: 'int', default: 0 })<br>failed_login_attempts!: number;<br><br>@Column({ type: 'timestamp', nullable: true })<br>last_failed_login_attempt!: Date | null;<br><br>@Column({ type: 'timestamp', nullable: true })<br>login_blocked_until!: Date | null;<br><br>@Column({ type: 'boolean', default: false })<br>is_login_blocked!: boolean;</div><p style='color: #333; margin-top: 0.8rem;'><strong>Comment ça marche :</strong></p><ul style='padding-left: 1.2rem; color: #333; line-height: 1.7;'><li>Chaque échec incrémente <code>failed_login_attempts</code></li><li>Après 5 échecs, <code>is_login_blocked = true</code> pour 1 jour</li><li>Après expiration, le compteur se réinitialise automatiquement</li></ul></div>",
    "texteParle": "Ajoutons maintenant quatre champs critiques pour la sécurité. C'est notre système anti-brute-force. Vous savez, les attaques où un robot essaie des milliers de mots de passe pour trouver le bon. failed_login_attempts : un compteur entier qui démarre à zéro. À chaque échec de connexion, on l'incrémente. last_failed_login_attempt : la date du dernier échec, utile pour l'audit. login_blocked_until : la date jusqu'à laquelle l'utilisateur est bloqué temporairement. Si cette date est dans le futur, la connexion est refusée. is_login_blocked : un drapeau qui indique si le blocage est actif. Comment ça marche ? À chaque échec, on incrémente le compteur. Après cinq échecs consécutifs, on passe is_login_blocked à true et on fixe login_blocked_until à maintenant plus vingt-quatre heures. Pendant ce temps, toute tentative de connexion sera refusée avec un message clair. Après expiration, on réinitialise le compteur. C'est un mécanisme classique mais très efficace. Attention à bien distinguer is_blocked, qui est un blocage définitif par un admin, de is_login_blocked, qui est un blocage temporaire automatique. Les deux sont différents, avec des règles différentes.",
    "note": "Ne jamais utiliser is_blocked pour un blocage temporaire. Créez un champ dédié. C'est plus clair."
  },
  {
    "titre": "Champs de suspension de publication",
    "contenu": "<div style='background: #e9ecef; padding: 1rem; border-radius: 12px;'><p style='color: #333;'>Suspension de la capacité à publier des articles (≠ blocage) :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.75rem; line-height: 1.7; white-space: pre;'>@Column({ type: 'boolean', default: false })<br>is_publishing_suspended!: boolean;<br><br>@Column({ type: 'timestamp', nullable: true })<br>publishing_suspended_until!: Date | null;<br><br>@Column({ type: 'text', nullable: true })<br>publishing_suspension_reason!: string | null;</div><p style='color: #333; margin-top: 0.8rem;'><strong>Pourquoi cette distinction ?</strong></p><ul style='padding-left: 1.2rem; color: #333; line-height: 1.7;'><li>Un utilisateur qui publie trop d'articles rejetés peut voir sa publication suspendue 1 mois</li><li>Il peut toujours acheter, chatter, utiliser son wallet</li><li>Mais il ne peut plus publier d'articles pendant la suspension</li><li>C'est une sanction <strong>graduée</strong>, plus juste que le blocage total</li></ul></div>",
    "texteParle": "Ajoutons maintenant trois champs pour une sanction graduée : la suspension de publication. Imaginez un utilisateur qui publie cinq articles, tous rejetés par les assistants car ils ne respectent pas les règles. On ne veut pas le bloquer complètement, car il peut toujours acheter ou discuter. Mais on veut lui faire comprendre qu'il doit s'améliorer. On suspend donc sa capacité à publier pendant un mois. is_publishing_suspended : un booléen qui indique si la suspension est active. publishing_suspended_until : la date de fin de suspension. publishing_suspension_reason : la raison de la suspension. Quand un utilisateur tente de publier un article, ProductLimitsService vérifie ces champs. Si la suspension est active, il reçoit une erreur lui expliquant qu'il ne peut pas publier pour le moment. Cette distinction entre blocage total et suspension ciblée est importante pour la justice de notre plateforme. C'est une bonne pratique : sanctionner de façon proportionnée.",
    "note": "Un système de sanctions graduées motive les utilisateurs à s'améliorer, plutôt que de les frustrer."
  },
  {
    "titre": "Champs de notification et de date",
    "contenu": "<div style='background: #f8f9fa; padding: 1rem; border-radius: 12px; border-left: 6px solid #a78bfa;'><p style='color: #333;'>Les derniers champs simples avant les relations :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.75rem; line-height: 1.7; white-space: pre;'>@Column({ type: 'varchar', length: 255, nullable: true })<br>fcm_token!: string | null;<br><br>@Column({ type: 'int', default: 0 })<br>report_count!: number;<br><br>@Column({ type: 'timestamp', nullable: true })<br>last_login_at!: Date;<br><br>@CreateDateColumn({ type: 'timestamp' })<br>created_at!: Date;<br><br>@UpdateDateColumn({ type: 'timestamp' })<br>updated_at!: Date;</div><p style='color: #555; font-size: 0.9rem; margin-top: 0.8rem;'>💡 <code>fcm_token</code> change à chaque installation de l'app mobile.</p></div>",
    "texteParle": "Terminons les champs simples avant de passer aux relations. fcm_token : c'est le token Firebase Cloud Messaging, qui permet d'envoyer des notifications push à l'appareil de l'utilisateur. Ce token change à chaque réinstallation de l'app mobile, ou si l'utilisateur change d'appareil. D'où la nécessité de pouvoir le mettre à jour. Il est nullable, car un nouvel utilisateur n'a pas encore installé l'app. report_count : un compteur du nombre de signalements reçus. Si ce compteur devient trop élevé, l'utilisateur peut être automatiquement signalé aux admins. last_login_at : la dernière date de connexion. Utile pour les statistiques et la détection d'inactivité. created_at et updated_at : les dates de création et de dernière modification. On utilise les décorateurs @CreateDateColumn et @UpdateDateColumn, qui sont automatiques : TypeORM les remplit pour nous sans qu'on ait à y penser. C'est très pratique. Voilà tous les champs simples de User. Nous avons couvert l'identité, la vérification, la sécurité, la suspension, et les dates. Maintenant, place aux relations, qui sont la partie vraiment intéressante.",
    "note": "Ne jamais mettre à jour manuellement created_at ou updated_at. Laissez TypeORM le faire."
  },
  {
    "titre": "Les relations de User",
    "contenu": "<div style='background: #e9ecef; padding: 1rem; border-radius: 12px;'><p style='color: #333;'>User est relié à presque toutes les entités. Voici les relations principales :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.7rem; line-height: 1.7; white-space: pre;'><span style='color: #6a9955;'>// 1-1 avec UserProfile</span><br>@OneToOne(() => UserProfile, (p) =&gt; p.user, { cascade: true })<br>profile!: UserProfile;<br><br><span style='color: #6a9955;'>// 1-1 avec Wallet</span><br>@OneToOne(() => Wallet, (w) =&gt; w.user)<br>wallet!: Wallet;<br><br><span style='color: #6a9955;'>// 1-N : produits vendus</span><br>@OneToMany(() =&gt; Product, (p) =&gt; p.seller)<br>products!: Product[];<br><br><span style='color: #6a9955;'>// 1-N : notifications</span><br>@OneToMany(() =&gt; Notification, (n) =&gt; n.user)<br>notifications!: Notification[];</div></div>",
    "texteParle": "Voici les relations de User. C'est la partie vraiment puissante de TypeORM. La première relation : OneToOne avec UserProfile. Chaque utilisateur a un profil unique. La flèche (p) => p.user indique à TypeORM quelle propriété de UserProfile pointe en retour. cascade: true signifie que si on sauvegarde un User avec son profile, TypeORM sauvegardera automatiquement le profile aussi. Très pratique. Deuxième relation : OneToOne avec Wallet. Même logique, chaque utilisateur a un wallet unique. Troisième relation : OneToMany avec Product. Un utilisateur peut vendre plusieurs produits. Le tableau products contiendra tous les produits dont il est le vendeur. La flèche (p) => p.seller indique à TypeORM que côté Product, c'est la propriété seller qui pointe vers User. Quatrième relation : OneToMany avec Notification. Un utilisateur peut recevoir plusieurs notifications. Le tableau notifications contiendra toutes ses notifications. Ces relations sont bidirectionnelles : côté User, on a le tableau, et côté Product par exemple, on a le champ seller. TypeORM maintient les deux en synchronisation. Grâce à ces relations, on peut écrire des requêtes très puissantes, comme : 'charge l'utilisateur, son profil, son wallet, et ses produits en une seule requête'.",
    "note": "cascade: true sur profile est pratique : sauvegarder User sauvegarde aussi son profil."
  },
  {
    "titre": "Les relations de chat et de dispute",
    "contenu": "<div style='background: #f8f9fa; padding: 1rem; border-radius: 12px; border-left: 6px solid #2a5298;'><p style='color: #333;'>User a plusieurs rôles dans les chats et les litiges :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.7rem; line-height: 1.7; white-space: pre;'><span style='color: #6a9955;'>// Chats où User est acheteur</span><br>@OneToMany(() =&gt; Chat, (c) =&gt; c.buyer)<br>buyerChats!: Chat[];<br><br><span style='color: #6a9955;'>// Chats où User est vendeur</span><br>@OneToMany(() =&gt; Chat, (c) =&gt; c.seller)<br>sellerChats!: Chat[];<br><br><span style='color: #6a9955;'>// Chats où User est assistant</span><br>@OneToMany(() =&gt; Chat, (c) =&gt; c.assistant)<br>assignedChats!: Chat[];<br><br><span style='color: #6a9955;'>// Disputes en tant qu'acheteur/vendeur/résolveur</span><br>@OneToMany(() =&gt; Dispute, (d) =&gt; d.buyer)<br>disputesAsBuyer!: Dispute[];</div><p style='color: #555; font-size: 0.9rem; margin-top: 0.8rem;'>💡 Un utilisateur peut être acheteur, vendeur et assistant en même temps (jamais sur le même chat).</p></div>",
    "texteParle": "Passons aux relations les plus intéressantes : celles liées aux chats et aux litiges. Un utilisateur peut apparaître dans un chat sous trois rôles différents. Comme acheteur, c'est celui qui initie la conversation. Comme vendeur, c'est celui qui reçoit les messages et qui vend le produit. Comme assistant, c'est celui qui est assigné pour arbitrer un litige. On crée donc trois relations OneToMany vers Chat. buyerChats, sellerChats, et assignedChats. Chacune renvoie la même entité Chat, mais avec un filtre différent. C'est TypeORM qui se charge de la logique : côté Chat, il y a trois propriétés différentes, buyer, seller, assistant, qui pointent chacune vers User. De même pour les litiges : un utilisateur peut être l'acheteur du litige, le vendeur du litige, ou l'assistant qui l'a résolu. On crée trois relations : disputesAsBuyer, disputesAsSeller, resolvedDisputes. C'est un pattern classique quand une entité joue plusieurs rôles vis-à-vis d'une même autre entité. Ce n'est pas un problème pour TypeORM, il gère ça très bien. Simplement, à la lecture du code, il faut bien comprendre quel rôle on est en train de manipuler.",
    "note": "Trois relations vers la même entité, c'est normal. Ça signifie trois rôles différents."
  },

    "texteParle": "Résumons cette leçon. Nous avons créé l'entité la plus importante du projet : User. Nous avons commencé par définir les énumérations UserRole et VerificationStatus. Puis nous avons ajouté les champs d'identité : téléphone unique, username unique, mot de passe hashé, rôle. Ensuite, les champs de vérification et de blocage. Puis la sécurité anti-brute-force avec quatre champs dédiés. Puis la suspension de publication, une sanction graduée. Enfin, les relations qui lient User à toutes les autres entités. C'est une entité riche, mais c'est justifié : elle est au cœur de tout. Dans la prochaine leçon, nous allons créer UserProfile, Wallet et Transaction, qui sont intimement liés à User. Nous continuerons à construire notre modèle pas à pas. À très bientôt !",

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentIndex = 0;
    let isSpeaking = false;
    let isPaused = false;
    let currentUtterance = null;
    let isLoading = false;
    let loadingTimeout = null;
    let isTransitioning = false;
    let speechSupported = true;
    let userInteracted = false;
    let isPlaying = false;
    let loadingCancelled = false;

    const total = slides.length;
    const synth = window.speechSynthesis;

    // Références jQuery
    const $title = $('#slideTitle');
    const $body = $('#slideBody');
    const $counter = $('#slideCounter');
    const $statusText = $('#statusText');
    const $statusBadge = $('#statusBadge');
    const $loading = $('#loadingOverlay');
    const $loadingText = $('#loadingText');
    const $loadingSub = $('#loadingSub');
    const $loadingTimeout = $('#loadingTimeout');
    const $loadingProgressBar = $('#loadingProgressBar');
    const $autoIndicator = $('#autoIndicator');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $replay = $('#replayBtn');
    const $play = $('#playBtn');
    const $cancelLoading = $('#cancelLoadingBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function setStatus(text, type) {
        $statusText.text(text);
        $statusBadge.removeClass('idle speaking error paused waiting loading');
        if (type === 'speaking') $statusBadge.addClass('speaking');
        else if (type === 'error') $statusBadge.addClass('error');
        else if (type === 'paused') $statusBadge.addClass('paused');
        else if (type === 'waiting') $statusBadge.addClass('waiting');
        else if (type === 'loading') $statusBadge.addClass('loading');
        else $statusBadge.addClass('idle');
    }

    function updatePlayButton() {
        if (isPlaying) {
            $play.addClass('playing');
            $play.find('.btn-icon').text('⏸');
            $play.find('.btn-label').text('Pause');
        } else {
            $play.removeClass('playing');
            $play.find('.btn-icon').text('▶');
            $play.find('.btn-label').text('Play');
        }
    }

    function showLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        
        loadingCancelled = false;
        isLoading = true;
        
        // Réinitialiser la barre de progression
        $loadingProgressBar.css('animation', 'none');
        $loadingProgressBar.css('width', '0%');
        // Forcer un reflow
        $loadingProgressBar[0].offsetHeight;
        $loadingProgressBar.css('animation', 'loadingProgress 30s ease-out forwards');
        
        $loadingText.text('Préparation vocale...');
        $loadingSub.text('Synthèse en cours');
        $loadingTimeout.text('⏱️ 30 secondes maximum');
        $loading.fadeIn(300);
        setStatus("⏳ Chargement...", 'loading');
        
        // 🔥 TIMEOUT DE 30 SECONDES
        loadingTimeout = setTimeout(() => {
            if (isLoading && !loadingCancelled) {
                hideLoading();
                setStatus("⚠️ Délai dépassé (30s)", 'error');
                isPlaying = false;
                updatePlayButton();
                $loadingSub.text('La synthèse vocale a pris trop de temps');
                $loadingTimeout.text('❌ Délai dépassé');
            }
        }, 30000);
    }

    function hideLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        isLoading = false;
        loadingCancelled = false;
        $loading.fadeOut(300);
        // Ne pas changer le statut si on est en train de parler
        if (!isSpeaking && !isPlaying) {
            setStatus("⏸ Lecture arrêtée", 'paused');
        }
    }

    function cancelLoading() {
        loadingCancelled = true;
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        hideLoading();
        stopSpeaking();
        setStatus("⏸ Annulé", 'paused');
        isPlaying = false;
        updatePlayButton();
        $loadingText.text('Annulé par l\'utilisateur');
        $loadingSub.text('Vous pouvez réessayer');
        $loadingTimeout.text('✕ Annulation');
    }

    // Arrêter la parole proprement
    function stopSpeaking() {
        try {
            if (synth && (synth.speaking || synth.pending)) {
                synth.cancel();
            }
        } catch(e) {
            console.warn('Erreur stopSpeaking:', e);
        }
        if (currentUtterance) {
            try {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance.onstart = null;
            } catch(e) {}
            currentUtterance = null;
        }
        isSpeaking = false;
        isPlaying = false;
        updatePlayButton();
    }

    // Mettre en pause la parole
    function pauseSpeaking() {
        try {
            if (synth && synth.speaking) {
                synth.pause();
                isPaused = true;
                isPlaying = false;
                setStatus("⏸ Lecture en pause", 'paused');
                updatePlayButton();
            }
        } catch(e) {
            console.warn('Erreur pauseSpeaking:', e);
            stopSpeaking();
        }
    }

    // Reprendre la parole
    function resumeSpeaking() {
        try {
            if (synth && synth.paused) {
                synth.resume();
                isPaused = false;
                isPlaying = true;
                setStatus("🔊 Lecture en cours", 'speaking');
                updatePlayButton();
            } else if (!isSpeaking && !synth.speaking && !synth.pending) {
                speakSlide(currentIndex);
            }
        } catch(e) {
            console.warn('Erreur resumeSpeaking:', e);
            speakSlide(currentIndex);
        }
    }

    function renderSlide(index) {
        const slide = slides[index];
        $title.text(slide.titre);

        let html = '';
        html += `<div class="content-card">${slide.contenu}</div>`;
        if (slide.note) {
            html += `<div class="note-box">${slide.note}</div>`;
        }
        $body.html(html);
        $counter.text(`${index+1} / ${total}`);

        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
        }
    }

    // ================================================================
    // LECTURE VOCALE
    // ================================================================
    function speakSlide(index) {
        return new Promise((resolve) => {
            const slide = slides[index];
            const text = slide.texteParle;
            
            if (!text || text.trim() === '' || !speechSupported) {
                resolve();
                return;
            }

            if (!window.speechSynthesis) {
                setStatus("❌ Synthèse vocale non supportée", 'error');
                speechSupported = false;
                resolve();
                return;
            }

            // Arrêter toute lecture en cours
            stopSpeaking();
            
            // Réinitialiser l'état de pause
            isPaused = false;
            
            showLoading();
            setStatus("Initialisation...", 'loading');

            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.92;
                utterance.pitch = 1.05;
                utterance.volume = 1;

                let isFinished = false;
                let errorHandled = false;

                utterance.onstart = function() {
                    if (loadingCancelled) {
                        stopSpeaking();
                        resolve();
                        return;
                    }
                    hideLoading();
                    isSpeaking = true;
                    isPlaying = true;
                    isPaused = false;
                    setStatus("🔊 Lecture en cours", 'speaking');
                    updatePlayButton();
                };

                utterance.onend = function() {
                    if (isFinished) return;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    setStatus("✅ Terminé", 'idle');
                    hideLoading();
                    updatePlayButton();
                    resolve();
                };

                utterance.onerror = function(e) {
                    if (isFinished || errorHandled) return;
                    errorHandled = true;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    hideLoading();
                    updatePlayButton();
                    
                    if (e.error === 'not-allowed') {
                        setStatus("⚠️ Permission refusée", 'error');
                    } else if (e.error === 'synthesis-unavailable') {
                        setStatus("⚠️ Synthèse indisponible", 'error');
                    } else if (e.error === 'canceled') {
                        setStatus("⏸ Annulé", 'paused');
                    } else {
                        setStatus("❌ Erreur audio: " + (e.error || 'inconnue'), 'error');
                    }
                    
                    resolve();
                };

                // Gestion du chargement des voix
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = function() {
                        if (!loadingCancelled) {
                            try {
                                synth.speak(utterance);
                            } catch(err) {
                                // Silencieux
                            }
                        }
                        synth.onvoiceschanged = null;
                    };
                }

                currentUtterance = utterance;
                
                if (!loadingCancelled) {
                    try {
                        synth.speak(utterance);
                    } catch(err) {
                        setTimeout(() => {
                            if (!loadingCancelled) {
                                try {
                                    synth.speak(utterance);
                                } catch(e) {
                                    setStatus("❌ Erreur de lecture", 'error');
                                    isPlaying = false;
                                    updatePlayButton();
                                    hideLoading();
                                    resolve();
                                }
                            } else {
                                resolve();
                            }
                        }, 100);
                    }
                } else {
                    resolve();
                }

            } catch(err) {
                hideLoading();
                setStatus("❌ Erreur générale", 'error');
                isPlaying = false;
                updatePlayButton();
                console.error('Erreur speakSlide:', err);
                resolve();
            }
        });
    }

    // ================================================================
    // NAVIGATION
    // ================================================================
    async function goToSlide(index) {
        if (isTransitioning) return;
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        
        // Si on est en train de lire, on met en pause avant de naviguer
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        // Arrêter complètement la lecture
        stopSpeaking();
        
        await new Promise(r => setTimeout(r, 50));
        
        if (index === currentIndex) {
            setStatus("📄 Slide actuel", 'idle');
            return;
        }

        isTransitioning = true;
        currentIndex = index;
        renderSlide(index);
        
        // Réinitialiser l'état de lecture
        isPlaying = false;
        updatePlayButton();
        setStatus("⏸ Lecture arrêtée", 'paused');

        await new Promise(r => setTimeout(r, 150));
        isTransitioning = false;
    }

    async function goToNext() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex + 1 < total) {
            await goToSlide(currentIndex + 1);
        } else {
            setStatus("🏁 Dernier slide", 'idle');
        }
    }

    async function goToPrev() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex - 1 >= 0) {
            await goToSlide(currentIndex - 1);
        } else {
            setStatus("🔁 Premier slide", 'idle');
        }
    }

    // ================================================================
    // GESTION PLAY/PAUSE
    // ================================================================
    function togglePlay() {
        if (!userInteracted) {
            userInteracted = true;
        }

        // Si le chargement est en cours, on l'annule
        if (isLoading) {
            cancelLoading();
            return;
        }

        // Si le synthétiseur est en pause, on reprend
        if (synth && synth.paused) {
            resumeSpeaking();
            return;
        }

        // Si la lecture est en cours, on met en pause
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
            return;
        }

        // Sinon, on démarre la lecture du slide courant
        if (!isSpeaking && !isPlaying) {
            stopSpeaking();
            speakSlide(currentIndex);
        }
    }

    // ================================================================
    // INIT
    // ================================================================
    async function init() {
        // Vérifier la compatibilité
        if (!window.speechSynthesis) {
            setStatus("❌ Synthèse vocale non supportée", 'error');
            speechSupported = false;
        }

        // Précharger les voix
        try {
            if (synth.getVoices) {
                synth.getVoices();
                setTimeout(() => {
                    try {
                        synth.getVoices();
                    } catch(e) {}
                }, 200);
            }
        } catch(e) {
            console.warn('Erreur chargement voix:', e);
        }

        // Afficher le premier slide
        renderSlide(0);
        $counter.text(`1 / ${total}`);
        
        // État initial
        setStatus("⏸ Appuie sur Play", 'paused');
        updatePlayButton();
        $autoIndicator.text('⏸ Lecture manuelle');

        // ================================================================
        // ÉVÉNEMENTS
        // ================================================================
        
        // Bouton Play/Pause
        $play.on('click', function() {
            togglePlay();
        });

        // Bouton Annuler le chargement
        $cancelLoading.on('click', function() {
            cancelLoading();
        });

        // Navigation
        $prev.on('click', function() {
            // Si chargement en cours, on annule
            if (isLoading) cancelLoading();
            goToPrev();
        });

        $next.on('click', function() {
            if (isLoading) cancelLoading();
            goToNext();
        });

        // Replay - relire le slide courant
        $replay.on('click', function() {
            if (isLoading) cancelLoading();
            stopSpeaking();
            setTimeout(() => {
                speakSlide(currentIndex);
            }, 100);
        });

        // Support du clavier (espace pour play/pause)
        $(document).on('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });

        // Nettoyage
        $(window).on('beforeunload', function() {
            try {
                if (synth.speaking) synth.cancel();
            } catch(e) {}
            hideLoading();
        });

        // Gérer les cas où la synthèse se termine de manière inattendue
        setInterval(() => {
            if (isPlaying && !synth.speaking && !synth.pending && !isPaused && !isLoading) {
                isPlaying = false;
                updatePlayButton();
                setStatus("⏸ Lecture arrêtée", 'paused');
            }
        }, 1000);
    }

    init();
});



    // ================================================================
    // GESTION DU THÈME JOUR/NUIT
    // ================================================================
    let isDarkMode = false;

    function toggleTheme() {
        isDarkMode = !isDarkMode;
        const body = document.body;
        const appContainer = document.querySelector('.app-container');
        const header = document.querySelector('.slide-header');
        const footer = document.querySelector('.slide-footer');
        const contentCards = document.querySelectorAll('.content-card');
        const noteBoxes = document.querySelectorAll('.note-box');
        const mathBlocks = document.querySelectorAll('.math-block');
        const buttons = document.querySelectorAll('.btn');
        const statusBadge = document.querySelector('.status-badge');
        const slideCounter = document.querySelector('.slide-counter');
        const autoIndicator = document.querySelector('.auto-indicator');
        const themeBtn = document.getElementById('themeToggle');

        if (isDarkMode) {
            // Mode nuit
            body.style.background = '#0b1120';
            body.style.color = '#f1f5f9';
            appContainer.style.background = 'linear-gradient(145deg, #0f172a 0%, #1e293b 100%)';
            header.style.background = 'rgba(15, 23, 42, 0.85)';
            footer.style.background = 'rgba(15, 23, 42, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.05)';
                card.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.08)';
                note.style.color = '#cbd5e1';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.25)';
                block.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#e2e8f0';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.12)';
                statusBadge.style.color = '#93bbfc';
            }
            if (slideCounter) {
                slideCounter.style.color = '#94a3b8';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#64748b';
            }
            if (themeBtn) {
                themeBtn.textContent = '☀️';
                themeBtn.title = 'Passer en mode jour';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#e2e8f0';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#e2e8f0';
                }
            });
        } else {
            // Mode jour (par défaut)
            body.style.background = '#f0f4f8';
            body.style.color = '#1a202c';
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
            header.style.background = 'rgba(255, 255, 255, 0.85)';
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.8)';
                card.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.12)';
                note.style.color = '#2c3e50';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.05)';
                block.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#2d3748';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
                statusBadge.style.color = '#2b6cb0';
            }
            if (slideCounter) {
                slideCounter.style.color = '#4a5568';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#718096';
            }
            if (themeBtn) {
                themeBtn.textContent = '🌓';
                themeBtn.title = 'Passer en mode nuit';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#2c3e50';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#2d3748';
                }
            });
        }
    }

    // Initialiser en mode jour
    document.addEventListener('DOMContentLoaded', function() {
        // Appliquer le mode jour par défaut
        const body = document.body;
        body.style.background = '#f0f4f8';
        body.style.color = '#1a202c';
        
        const appContainer = document.querySelector('.app-container');
        if (appContainer) {
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
        }
        
        const header = document.querySelector('.slide-header');
        if (header) {
            header.style.background = 'rgba(255, 255, 255, 0.85)';
        }
        
        const footer = document.querySelector('.slide-footer');
        if (footer) {
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
        }
        
        document.querySelectorAll('.content-card').forEach(card => {
            card.style.background = 'rgba(255,255,255,0.8)';
            card.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.note-box').forEach(note => {
            note.style.background = 'rgba(96, 165, 250, 0.12)';
            note.style.color = '#2c3e50';
        });
        
        document.querySelectorAll('.math-block').forEach(block => {
            block.style.background = 'rgba(0,0,0,0.05)';
            block.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.btn').forEach(btn => {
            btn.style.color = '#2d3748';
        });
        
        const statusBadge = document.querySelector('.status-badge');
        if (statusBadge) {
            statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
            statusBadge.style.color = '#2b6cb0';
        }
        
        const slideCounter = document.querySelector('.slide-counter');
        if (slideCounter) {
            slideCounter.style.color = '#4a5568';
        }
        
        const autoIndicator = document.querySelector('.auto-indicator');
        if (autoIndicator) {
            autoIndicator.style.color = '#718096';
        }
        
        document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
            if (!el.closest('.note-box')) {
                el.style.color = '#2c3e50';
            }
        });
        
        document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
            if (!el.closest('.note-box') && !el.closest('.math-block')) {
                el.style.color = '#2d3748';
            }
        });
        
        const themeBtn = document.getElementById('themeToggle');
        if (themeBtn) {
            themeBtn.textContent = '🌓';
            themeBtn.title = 'Passer en mode nuit';
        }
    });
</script>
