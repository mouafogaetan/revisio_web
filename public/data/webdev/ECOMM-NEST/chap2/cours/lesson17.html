<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Présentation mobile</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' },
            options: { skipHtmlTypes: 'script' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 500px;
        margin: 0 auto;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    .slide-header {
        flex-shrink: 0;
        padding: 18px 16px 10px 16px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        z-index: 10;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .slide-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
    }

    .content-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 18px 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        flex-shrink: 0;
    }

    .content-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .content-card li {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        line-height: 1.5;
    }

    .content-card li:last-child {
        border-bottom: none;
    }

    .bullet-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
    }

    .math-block {
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        overflow-x: auto;
        flex-shrink: 0;
        margin: 4px 0;
    }

    .math-block .math {
        font-size: 1.2rem;
        color: #e2e8f0;
    }

    .note-box {
        background: rgba(96, 165, 250, 0.08);
        border-left: 4px solid #60a5fa;
        padding: 12px 16px;
        border-radius: 12px;
        font-style: italic;
        font-size: 0.9rem;
        color: #cbd5e1;
        flex-shrink: 0;
    }

    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        border-radius: 0;
        flex-direction: column;
    }

    .loading-card {
        background: #1e293b;
        padding: 32px 28px;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #334155;
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px auto;
    }

    .loading-text {
        font-weight: 600;
        font-size: 1.1rem;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    .loading-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 16px;
    }
    .loading-progress {
        height: 3px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        animation: loadingProgress 30s ease-out forwards;
    }

    .loading-timeout {
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 12px;
    }

    .btn-cancel-loading {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 40px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #f87171;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }

    .btn-cancel-loading:active {
        transform: scale(0.94);
        background: rgba(239, 68, 68, 0.25);
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
    }

    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .slide-counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255,255,255,0.05);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(255,255,255,0.04);
    }

    .status-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 30px;
        background: rgba(96, 165, 250, 0.12);
        color: #93bbfc;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
    }

    .status-badge .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: pulse-dot 1.2s infinite;
        flex-shrink: 0;
    }

    .status-badge.idle .dot {
        animation: none;
        background: #64748b;
    }
    .status-badge.speaking .dot {
        background: #34d399;
        animation: pulse-dot 0.8s infinite;
    }
    .status-badge.error .dot {
        background: #f87171;
        animation: none;
    }
    .status-badge.paused .dot {
        animation: none;
        background: #fbbf24;
    }
    .status-badge.waiting .dot {
        animation: pulse-dot 1.5s infinite;
        background: #fbbf24;
    }
    .status-badge.loading .dot {
        animation: pulse-dot 0.5s infinite;
        background: #60a5fa;
    }

    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.7); }
    }

    .footer-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(255,255,255,0.1);
    }

    .btn-secondary {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-play {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
        min-width: 80px;
        justify-content: center;
    }
    .btn-play:active {
        background: rgba(52, 211, 153, 0.25);
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
    }

    .auto-indicator {
        font-size: 0.65rem;
        color: #64748b;
        text-align: center;
        letter-spacing: 0.3px;
        padding: 2px 0;
    }

    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.2rem;
        }
        .content-card li {
            font-size: 0.9rem;
            padding: 8px 0;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .btn-play {
            min-width: 60px;
        }
        .footer-buttons {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
        .loading-card {
            padding: 20px 16px;
        }
        .math-block .math {
            font-size: 1rem;
        }
    }

    @media (min-width: 600px) {
        .app-container {
            max-width: 480px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
        .loading-overlay {
            border-radius: 32px;
        }
    }

    /* Mode jour (par défaut) */
    html, body {
        background: #f0f4f8 !important;
        color: #1a202c !important;
    }
    .app-container {
        background: linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%) !important;
    }
    .slide-header {
        background: rgba(255, 255, 255, 0.85) !important;
        border-bottom: 1px solid rgba(0,0,0,0.08) !important;
    }
    .slide-header h1 {
        background: linear-gradient(135deg, #2b6cb0, #6b46c1) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        background-clip: text !important;
    }
    .slide-footer {
        background: rgba(255, 255, 255, 0.9) !important;
        border-top: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card {
        background: rgba(255,255,255,0.8) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card li {
        border-bottom: 1px solid rgba(0,0,0,0.05) !important;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.12) !important;
        border-left: 4px solid #4299e1 !important;
        color: #2c3e50 !important;
    }
    .math-block {
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .math-block .math {
        color: #2d3748 !important;
    }
    .slide-counter {
        color: #4a5568 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .status-badge {
        background: rgba(96, 165, 250, 0.15) !important;
        color: #2b6cb0 !important;
        border: 1px solid rgba(96, 165, 250, 0.15) !important;
    }
    .btn {
        color: #2d3748 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .btn-secondary {
        background: rgba(0,0,0,0.04) !important;
        border-color: rgba(0,0,0,0.08) !important;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15) !important;
        border-color: rgba(52, 211, 153, 0.2) !important;
        color: #38a169 !important;
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15) !important;
        border-color: rgba(251, 191, 36, 0.2) !important;
        color: #d69e2e !important;
    }
    .auto-indicator {
        color: #718096 !important;
    }
    .loading-card {
        background: #ffffff !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .loading-text {
        color: #1a202c !important;
    }
    .loading-sub {
        color: #4a5568 !important;
    }
</style>
</head>
<body>

<div class="app-container">

    <header class="slide-header">
        <h1 id="slideTitle">Chargement...</h1>
    </header>

    <main class="slide-body" id="slideBody"></main>

    <!-- LOADING OVERLAY AVEC BOUTON ANNULER -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Préparation vocale...</div>
            <div class="loading-sub" id="loadingSub">Synthèse en cours</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loadingProgressBar"></div>
            </div>
            <div class="loading-timeout" id="loadingTimeout">⏱️ 30 secondes maximum</div>
            <button class="btn-cancel-loading" id="cancelLoadingBtn">
                <span>✕</span> Annuler
            </button>
        </div>
    </div>

    <footer class="slide-footer">
        <div class="footer-top">
            <span class="slide-counter" id="slideCounter">1 / 3</span>
            <span class="status-badge idle" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">Prêt</span>
            </span>
        </div>

        <div class="footer-buttons">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-secondary" id="replayBtn">
                <span class="btn-icon">🔁</span> <span class="btn-label">Relire</span>
            </button>
            <button class="btn btn-play" id="playBtn">
                <span class="btn-icon">▶</span> <span class="btn-label">Play</span>
            </button>
        </div>

        <div class="auto-indicator" id="autoIndicator">⏸ Lecture manuelle</div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // SLIDES
    // ================================================================
    const slides = [
  {
    "titre": "Le Seeding des données",
    "contenu": "<div style='background: linear-gradient(135deg, #1e3c72, #2a5298); color: white; padding: 2rem; border-radius: 15px; text-align: center; margin-bottom: 1.5rem;'><h2 style='color: #fff; margin-bottom: 0.5rem;'>🌱 Le Seeding des données</h2><p style='color: #e0e0e0; font-size: 1.1rem;'>Peupler la base avec des données initiales</p><hr style='border-color: #4a7db0; width: 50%;'><p style='color: #f0f0f0;'>Leçon 2.11 : Créer les données de démarrage</p></div><p>Nos tables existent, mais elles sont <strong>vides</strong>. SawaMart ne peut pas fonctionner sans un minimum de données : catégories pour classer les produits, configurations pour piloter la plateforme, utilisateurs admin pour gérer le système, passerelles de paiement pour encaisser. C'est le rôle du <strong>seeding</strong> : insérer automatiquement ces données au démarrage.</p>",
    "texteParle": "Bonjour à toutes et à tous et bienvenue dans cette onzième et dernière leçon du chapitre deux. Nous avons créé nos entités, généré nos migrations, et notre base de données contient maintenant toutes les tables nécessaires. Bravo ! Mais il y a un problème : nos tables sont vides. Or, SawaMart ne peut pas fonctionner sans un minimum de données de départ. Imaginez une marketplace sans catégories : impossible de classer les produits. Sans configurations : impossible de piloter la plateforme. Sans utilisateurs admin : impossible de modérer. Sans passerelles de paiement : impossible d'encaisser. Il faut donc insérer ces données initiales. C'est ce qu'on appelle le seeding, ou ensemencement. Nous allons voir comment créer ces seeds et les exécuter. C'est une leçon pratique, la dernière du chapitre deux. C'est parti.",
    "note": "Un projet sans seeds est un projet difficile à démarrer. Les seeds font partie du setup."
  },
  {
    "titre": "Qu'est-ce qu'un seed ?",
    "contenu": "<div style='background: #f8f9fa; padding: 1.5rem; border-radius: 12px; border-left: 6px solid #2a5298;'><p style='color: #1e3c72; font-weight: bold; margin-top: 0;'>Un seed, c'est un script qui insère des données dans la base.</p><p style='color: #333;'>Il existe deux types de seeds :</p><div style='display: flex; flex-direction: column; gap: 0.8rem; margin-top: 1rem;'><div style='background: #d1ecf1; padding: 0.9rem; border-radius: 8px; border-left: 4px solid #0c5460;'><strong>📌 Seeds de référence (production)</strong><br><small style='color: #333;'>Catégories, configurations, passerelles, utilisateurs admin. <br>Ils sont <strong>obligatoires</strong> dans tous les environnements.</small></div><div style='background: #fff3cd; padding: 0.9rem; border-radius: 8px; border-left: 4px solid #856404;'><strong>🧪 Seeds de test (développement)</strong><br><small style='color: #333;'>Utilisateurs fictifs, produits d'exemple, chats. <br>Ils ne s'exécutent <strong>jamais</strong> en production.</small></div></div></div>",
    "texteParle": "Commençons par clarifier ce qu'est un seed. Un seed, c'est un script qui insère des données dans la base. Il y a deux catégories de seeds. La première catégorie, ce sont les seeds de référence. Ce sont des données indispensables au fonctionnement de la plateforme, dans tous les environnements, y compris la production. Par exemple, les catégories : sans elles, aucun produit ne peut être classé. Les configurations : sans elles, la plateforme ne sait pas quel est le montant minimum de dépôt. Les passerelles de paiement : sans elles, on ne peut pas encaisser. Et les utilisateurs admin : sans eux, personne ne peut modérer. Ces seeds sont obligatoires. La deuxième catégorie, ce sont les seeds de test. Ce sont des données fictives pour le développement : des utilisateurs bidons, des produits d'exemple, des chats pré-remplis. Ils sont très utiles en développement, mais ils ne doivent JAMAIS être exécutés en production. Imaginez si votre base de production contenait 50 utilisateurs 'test123' et 100 produits 'iPhone bidon'. Ce serait catastrophique. Nous allons donc séparer clairement ces deux types de seeds.",
    "note": "Seeds de référence en prod, seeds de test en dev. Ne les mélangez jamais."
  },
  {
    "titre": "Les 4 seeds de référence",
    "contenu": "<div style='background: #e9ecef; padding: 1.5rem; border-radius: 12px;'><p style='color: #333;'>SawaMart a besoin de 4 seeds de référence :</p><div style='display: flex; flex-direction: column; gap: 0.7rem; margin-top: 1rem;'><div style='background: #d1ecf1; padding: 0.9rem; border-radius: 8px;'><strong>1️⃣ categories.seed.ts</strong><br><small style='color: #333;'>Les 32 catégories + sous-catégories du Cameroun</small></div><div style='background: #d4edda; padding: 0.9rem; border-radius: 8px;'><strong>2️⃣ configurations.seed.ts</strong><br><small style='color: #333;'>Toutes les ConfigurationKey avec valeurs par défaut</small></div><div style='background: #fff3cd; padding: 0.9rem; border-radius: 8px;'><strong>3️⃣ payment-gateways.seed.ts</strong><br><small style='color: #333;'>MTN Mobile Money, Orange Money</small></div><div style='background: #e9d5ff; padding: 0.9rem; border-radius: 8px;'><strong>4️⃣ users.seed.ts</strong><br><small style='color: #333;'>Admin, assistant, comptable par défaut</small></div></div><p style='color: #555; font-size: 0.9rem; margin-top: 1rem;'>💡 Chaque seed est <strong>idempotent</strong> : on peut le relancer sans créer de doublons.</p></div>",
    "texteParle": "SawaMart a besoin de quatre seeds de référence. Le premier, categories.seed.ts, qui insère les trente-deux catégories principales et leurs sous-catégories. C'est un gros fichier car il y a beaucoup de catégories. Le deuxième, configurations.seed.ts, qui insère toutes les ConfigurationKey avec leurs valeurs par défaut. C'est ce seed qui rend notre système de configuration dynamique fonctionnel. Le troisième, payment-gateways.seed.ts, qui insère les passerelles MTN Mobile Money et Orange Money avec leurs configurations. C'est ce seed qui permet les dépôts et les retraits. Le quatrième, users.seed.ts, qui crée les utilisateurs par défaut : un admin, un assistant, un comptable. Ces trois comptes sont nécessaires pour démarrer : sans admin, personne ne peut gérer la plateforme. Une caractéristique importante de tous ces seeds : ils sont idempotents. Cela signifie qu'on peut les exécuter plusieurs fois de suite sans créer de doublons. À chaque exécution, ils vérifient si les données existent déjà, et ne les insèrent que si nécessaire. C'est crucial pour la robustesse.",
    "note": "Idempotent : on peut relancer un seed sans casser la base. C'est une règle d'or."
  },
  {
    "titre": "Le seed des catégories - Structure",
    "contenu": "<div style='background: #f8f9fa; padding: 1rem; border-radius: 12px; border-left: 6px solid #10b981;'><p style='color: #333;'>Créons <code>src/database/seeds/categories.seed.ts</code> :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.7rem; line-height: 1.6; white-space: pre;'>import { DataSource } from 'typeorm';<br>import { Category } from '../entities/category.entity';<br><br>const categoriesData = [<br>&nbsp;&nbsp;{ name: 'Électronique', slug: 'electronique', icon: 'phone-portrait', display_order: 1 },<br>&nbsp;&nbsp;{ name: 'Informatique', slug: 'informatique', icon: 'laptop', display_order: 2 },<br>&nbsp;&nbsp;<span style='color: #6a9955;'>// ... 30 autres catégories</span><br>&nbsp;&nbsp;<br>&nbsp;&nbsp;<span style='color: #6a9955;'>// Sous-catégories (avec parent_name)</span><br>&nbsp;&nbsp;{ name: 'TV et Audio', slug: 'tv-audio', parent_name: 'Électronique', display_order: 1 },<br>&nbsp;&nbsp;{ name: 'Smartphones', slug: 'smartphones', parent_name: 'Téléphonie', display_order: 1 },<br>&nbsp;&nbsp;<span style='color: #6a9955;'>// ...</span><br>];</div><p style='color: #555; font-size: 0.9rem; margin-top: 0.8rem;'>💡 Le <code>parent_name</code> permet de résoudre la hiérarchie après insertion.</p></div>",
    "texteParle": "Commençons par le seed des catégories, qui est le plus volumineux. Créons le fichier categories.seed.ts. On importe DataSource de TypeORM, qui sera notre connexion à la base. Puis on importe l'entité Category. Ensuite, on définit un grand tableau categoriesData. Chaque élément a un nom, un slug pour l'URL, une icône, et un ordre d'affichage. Regardez l'astuce importante : pour les sous-catégories, on utilise un champ parent_name au lieu de parent_id. Pourquoi ? Parce qu'au moment où on écrit le seed, on ne connaît pas encore l'UUID que PostgreSQL va générer pour la catégorie parente. On met donc le nom de la catégorie parente, et on résoudra la relation après insertion. C'est un pattern classique en seeding : on identifie les entités par un champ métier (ici le nom) plutôt que par la clé primaire. Le seed s'occupera de faire la correspondance. Cette approche rend le seed beaucoup plus lisible et maintenable.",
    "note": "Au moment d'écrire un seed, on ne connaît pas les UUID. Utilisez des identifiants métier (nom, slug)."
  },
  {
    "titre": "Le seed des catégories - Logique",
    "contenu": "<div style='background: #e9ecef; padding: 1rem; border-radius: 12px;'><p style='color: #333;'>La fonction d'exécution du seed :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.68rem; line-height: 1.6; white-space: pre;'>export async function seedCategories(dataSource: DataSource) {<br>&nbsp;&nbsp;const repo = dataSource.getRepository(Category);<br>&nbsp;&nbsp;const parentMap = new Map&lt;string, Category&gt;();<br><br>&nbsp;&nbsp;<span style='color: #6a9955;'>// 1. Créer d'abord les parents</span><br>&nbsp;&nbsp;for (const data of categoriesData.filter(c =&gt; !c.parent_name)) {<br>&nbsp;&nbsp;&nbsp;&nbsp;const existing = await repo.findOne({ where: { slug: data.slug } });<br>&nbsp;&nbsp;&nbsp;&nbsp;if (existing) { parentMap.set(data.name, existing); continue; }<br>&nbsp;&nbsp;&nbsp;&nbsp;const category = repo.create({ name: data.name, slug: data.slug, ... });<br>&nbsp;&nbsp;&nbsp;&nbsp;const saved = await repo.save(category);<br>&nbsp;&nbsp;&nbsp;&nbsp;parentMap.set(data.name, saved);<br>&nbsp;&nbsp;}<br><br>&nbsp;&nbsp;<span style='color: #6a9955;'>// 2. Puis les enfants (résolution du parent_id)</span><br>&nbsp;&nbsp;for (const data of categoriesData.filter(c =&gt; c.parent_name)) {<br>&nbsp;&nbsp;&nbsp;&nbsp;const parent = parentMap.get(data.parent_name);<br>&nbsp;&nbsp;&nbsp;&nbsp;if (!parent) continue;<br>&nbsp;&nbsp;&nbsp;&nbsp;<span style='color: #6a9955;'>// Idempotence : vérifier si existe déjà</span><br>&nbsp;&nbsp;&nbsp;&nbsp;const existing = await repo.findOne({ where: { slug: data.slug } });<br>&nbsp;&nbsp;&nbsp;&nbsp;if (existing) continue;<br>&nbsp;&nbsp;&nbsp;&nbsp;await repo.save(repo.create({ ..., parent_id: parent.id }));<br>&nbsp;&nbsp;}<br>}</div></div>",
    "texteParle": "Détaillons la logique du seed. La fonction prend un DataSource, qui est la connexion à la base. On récupère le repository Category. Puis on crée un Map, qui va contenir les catégories parentes, indexées par leur nom. Ensuite, deux boucles. La première boucle traite les catégories racines, celles qui n'ont pas de parent_name. Pour chacune, on vérifie si elle existe déjà en base (par son slug, qui est unique). Si oui, on la récupère et on la met dans le Map. Si non, on la crée et on la sauvegarde, puis on la met dans le Map. La deuxième boucle traite les sous-catégories. Pour chacune, on récupère la catégorie parente depuis le Map, grâce à son nom. On vérifie aussi si la sous-catégorie existe déjà. Si non, on la crée avec le parent_id qu'on a résolu. Grâce à ce système à deux passes, on gère la hiérarchie sans connaître les UUID à l'avance. Et les vérifications 'existe déjà' rendent le seed idempotent : on peut le relancer autant de fois qu'on veut, il n'ajoutera que ce qui manque.",
    "note": "Deux passes : d'abord les parents, puis les enfants. C'est le pattern classique pour les hiérarchies."
  },
  {
    "titre": "Le seed des configurations",
    "contenu": "<div style='background: #f8f9fa; padding: 1rem; border-radius: 12px; border-left: 6px solid #a78bfa;'><p style='color: #333;'>Créons <code>configurations.seed.ts</code> :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.68rem; line-height: 1.6; white-space: pre;'>import { Configuration, ConfigurationKey } from '../entities/configuration.entity';<br><br>const CONFIGURATIONS = [<br>&nbsp;&nbsp;{<br>&nbsp;&nbsp;&nbsp;&nbsp;key: ConfigurationKey.MAX_PENDING_PRODUCTS,<br>&nbsp;&nbsp;&nbsp;&nbsp;value: 5,<br>&nbsp;&nbsp;&nbsp;&nbsp;description: 'Max articles en attente de validation',<br>&nbsp;&nbsp;&nbsp;&nbsp;group: 'articles',<br>&nbsp;&nbsp;&nbsp;&nbsp;is_editable: true,<br>&nbsp;&nbsp;},<br>&nbsp;&nbsp;{<br>&nbsp;&nbsp;&nbsp;&nbsp;key: ConfigurationKey.MIN_DEPOSIT_AMOUNT,<br>&nbsp;&nbsp;&nbsp;&nbsp;value: 100,<br>&nbsp;&nbsp;&nbsp;&nbsp;description: 'Montant minimum de dépôt (FCFA)',<br>&nbsp;&nbsp;&nbsp;&nbsp;group: 'deposits',<br>&nbsp;&nbsp;&nbsp;&nbsp;is_editable: true,<br>&nbsp;&nbsp;},<br>&nbsp;&nbsp;<span style='color: #6a9955;'>// ... une quarantaine de configurations</span><br>];</div></div>",
    "texteParle": "Passons au seed des configurations. C'est probablement le seed le plus important, car il définit toute la logique de la plateforme. Créons le fichier configurations.seed.ts. On importe l'entité Configuration et l'énumération ConfigurationKey. Puis on définit un grand tableau CONFIGURATIONS. Chaque entrée contient une clé, une valeur, une description, un groupe, et un drapeau is_editable. Regardez les deux exemples. MAX_PENDING_PRODUCTS est à 5 : un utilisateur ne peut pas avoir plus de cinq articles en attente de validation. MIN_DEPOSIT_AMOUNT est à 100 : le premier dépôt doit être d'au moins cent FCFA. Ce sont des valeurs par défaut, mais un admin pourra les modifier depuis l'interface d'administration, sans redéployer le code. C'est toute la puissance du système de configuration dynamique. Il y a une quarantaine de configurations au total, couvrant tous les aspects : produits, dépôts, retraits, litiges, boost, sécurité, KYC, notifications, commissions, maintenance. C'est le panneau de contrôle de SawaMart.",
    "note": "Configurer, c'est piloter. Plus vous mettez en configuration, moins vous redéployez."

  {
    "titre": "La logique du seed des configurations",
    "contenu": "<div style='background: #e9ecef; padding: 1rem; border-radius: 12px;'><p style='color: #333;'>La fonction d'exécution :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.68rem; line-height: 1.6; white-space: pre;'>export async function seedConfigurations(dataSource: DataSource) {<br>&nbsp;&nbsp;const repo = dataSource.getRepository(Configuration);<br>&nbsp;&nbsp;let inserted = 0, updated = 0;<br><br>&nbsp;&nbsp;for (const configData of CONFIGURATIONS) {<br>&nbsp;&nbsp;&nbsp;&nbsp;const existing = await repo.findOne({ where: { key: configData.key } });<br>&nbsp;&nbsp;&nbsp;&nbsp;if (existing) {<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span style='color: #6a9955;'>// Mettre à jour la valeur et la description</span><br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;existing.value = configData.value;<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;existing.description = configData.description;<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;await repo.save(existing);<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;updated++;<br>&nbsp;&nbsp;&nbsp;&nbsp;} else {<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span style='color: #6a9955;'>// Créer</span><br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;await repo.save(repo.create({ ...configData, updated_by: 'system' }));<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;inserted++;<br>&nbsp;&nbsp;&nbsp;&nbsp;}<br>&nbsp;&nbsp;}<br>&nbsp;&nbsp;console.log(`✅ ${inserted} créées, ${updated} mises à jour`);<br>}</div></div>",
    "texteParle": "Détaillons la logique du seed des configurations. C'est une boucle simple sur chaque configuration. Pour chaque entrée, on cherche en base si une configuration avec la même clé existe déjà. Si oui, on met à jour sa valeur et sa description, sans recréer la ligne. Si non, on crée une nouvelle ligne. On garde aussi deux compteurs, inserted et updated, pour afficher un résumé à la fin. Une question qu'on pourrait se poser : pourquoi mettre à jour les valeurs existantes ? Ne devrait-on pas les laisser telles quelles, au cas où un admin les aurait modifiées ? Bonne question. En fait, c'est un choix. Si on met à jour, on écrase les personnalisations d'un admin. Si on ne met à jour que les configurations manquantes, on risque d'avoir une base désynchronisée après un changement de valeur par défaut dans le code. Pour SawaMart, nous avons fait le choix de mettre à jour. Cela garantit que la base reflète toujours les valeurs du code au démarrage. Si un admin veut personnaliser une valeur, il le fait via l'API, et cette personnalisation est préservée jusqu'au prochain seed. C'est un compromis acceptable. Dans un vrai projet, il faudrait peut-être ne mettre à jour que si is_editable est false, pour ne pas écraser les personnalisations.",
    "note": "Un seed qui met à jour les valeurs existantes est utile au démarrage. Mais attention à ne pas écraser les personnalisations."
  },

    "texteParle": "Passons au seed des passerelles de paiement. C'est un seed plus court, mais tout aussi important. Créons payment-gateways.seed.ts. On définit un tableau avec deux passerelles : MTN et Orange. Chaque passerelle a un nom, un code, un pays. Le champ phone_regex_pattern est crucial : c'est la regex qui valide les numéros de téléphone associés à cette passerelle. Par exemple, pour MTN au Cameroun, les préfixes valides sont 65 à 69, 80 à 89, 75, 76, 77. La regex capture ça. Ensuite, code_paiement_manuel : c'est le code USSD que l'utilisateur doit taper sur son téléphone pour effectuer un dépôt. Par exemple '*150*10*00#' pour MTN. Les drapeaux is_active, deposit_enabled, withdrawal_enabled contrôlent si la passerelle est disponible. La fees_config définit les frais pour cette passerelle : pourcentage de retrait, montant minimum de dépôt, maximum de dépôt. C'est ce qui permet de facturer des frais différents selon la passerelle. Enfin, metadata contient des informations visuelles : la couleur de la marque, une description. Voilà ce qu'est une passerelle de paiement dans notre système.",

    "texteParle": "Dernier seed de référence : les utilisateurs par défaut. Créons users.seed.ts. On définit un tableau avec trois utilisateurs : un admin, un assistant, un comptable. Ce sont trois rôles critiques. Sans admin, personne ne peut gérer la plateforme. Sans assistant, personne ne peut valider les articles ni trancher les litiges. Sans comptable, personne ne peut valider les dépôts ni traiter les retraits. Notez bien les champs. Le phone_number est un numéro fictif mais valide : '+237600000001' et suivants. Le username est explicite : 'admin_sawamart' pour l'admin. Le mot de passe est fort : 'Admin@SawaMart2026!' : une majuscule, un chiffre, un caractère spécial. Chaque utilisateur a un profil avec au moins un prénom et un nom. L'admin est vérifié, les autres aussi. Une fois ce seed exécuté, on peut se connecter avec ces comptes, et ils sont fonctionnels. Attention, un avertissement critique : ces mots de passe par défaut doivent être changés immédiatement après le premier déploiement en production. Sinon, n'importe qui pourrait se connecter en admin. C'est une faille de sécurité béante. Dans un vrai projet, on utiliserait des variables d'environnement pour ces mots de passe, ou on les générerait aléatoirement.",

    "titre": "Le script d'exécution global",
    "contenu": "<div style='background: #f8f9fa; padding: 1rem; border-radius: 12px; border-left: 6px solid #2a5298;'><p style='color: #333;'>Créons <code>scripts/run-all-seeds.js</code> :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.68rem; line-height: 1.6; white-space: pre;'>const { DataSource } = require('typeorm');<br>require('dotenv').config();<br><br>const dataSource = new DataSource({<br>&nbsp;&nbsp;type: 'postgres',<br>&nbsp;&nbsp;url: process.env.DATABASE_URL,<br>&nbsp;&nbsp;entities: ['dist/database/entities/*.entity.js'],<br>&nbsp;&nbsp;synchronize: false,<br>});<br><br>async function runAllSeeds() {<br>&nbsp;&nbsp;await dataSource.initialize();<br>&nbsp;&nbsp;console.log('✅ Connexion établie');<br>&nbsp;&nbsp;<br>&nbsp;&nbsp;<span style='color: #6a9955;'>// 1. Configurations</span><br>&nbsp;&nbsp;const configSeed = require('dist/database/seeds/configurations.seed.js');<br>&nbsp;&nbsp;await configSeed.seedConfigurations(dataSource);<br>&nbsp;&nbsp;<br>&nbsp;&nbsp;<span style='color: #6a9955;'>// 2. Catégories</span><br>&nbsp;&nbsp;const catSeed = require('dist/database/seeds/categories.seed.js');<br>&nbsp;&nbsp;await catSeed.seedCategories(dataSource);<br>&nbsp;&nbsp;<br>&nbsp;&nbsp;<span style='color: #6a9955;'>// 3. Users et 4. Gateways</span><br>&nbsp;&nbsp;<span style='color: #6a9955;'>// ...</span><br>&nbsp;&nbsp;<br>&nbsp;&nbsp;await dataSource.destroy();<br>}<br>runAllSeeds();</div></div>",
    "texteParle": "Pour exécuter tous les seeds facilement, créons un script global : scripts/run-all-seeds.js. Ce script est en JavaScript pur, pas en TypeScript, car il est destiné à être exécuté en production après compilation. Il se connecte à la base avec la configuration DataSource de TypeORM, en lisant DATABASE_URL depuis l'environnement. Ensuite, il importe et exécute chaque seed dans l'ordre. L'ordre est important. D'abord les configurations, car elles sont indépendantes. Ensuite les catégories, car elles sont indépendantes aussi. Puis les utilisateurs, car ils sont référencés par les seeds de test. Enfin les passerelles de paiement. À la fin, il ferme la connexion. Ce script peut être exécuté à tout moment : après une migration, après un déploiement, ou pour initialiser un environnement de développement. Grâce à l'idempotence des seeds, il peut être relancé sans risque. C'est un outil précieux pour la maintenance et le déploiement.",

    "texteParle": "Résumons cette leçon. Nous avons compris ce qu'est un seed et pourquoi il y a deux types : les seeds de référence, indispensables en production, et les seeds de test, réservés au développement. Nous avons créé quatre seeds de référence pour SawaMart : les catégories avec leurs sous-catégories, les configurations avec leurs valeurs par défaut, les passerelles de paiement MTN et Orange, et les utilisateurs admin/assistant/comptable. Nous avons vu comment gérer la hiérarchie des catégories avec un système à deux passes. Nous avons parlé de l'idempotence, qui permet de relancer un seed sans créer de doublons. Et nous avons créé un script global pour exécuter tous les seeds en une commande. Félicitations, vous venez de terminer le chapitre deux ! C'est un chapitre énorme : nous avons modélisé tout le schéma de la base de SawaMart, créé toutes les entités, migré, et semé les données de départ. Votre base de données est maintenant prête pour la production. Dans le prochain chapitre, nous allons entrer dans la partie authentification : comment un utilisateur s'inscrit, comment on lui envoie un code OTP par SMS, comment il se connecte, et comment on protège nos routes avec JWT. C'est un chapitre passionnant. À très bientôt !",

    let loadingCancelled = false;

    const total = slides.length;
    const synth = window.speechSynthesis;

    // Références jQuery
    const $title = $('#slideTitle');
    const $body = $('#slideBody');
    const $counter = $('#slideCounter');
    const $statusText = $('#statusText');
    const $statusBadge = $('#statusBadge');
    const $loading = $('#loadingOverlay');
    const $loadingText = $('#loadingText');
    const $loadingSub = $('#loadingSub');
    const $loadingTimeout = $('#loadingTimeout');
    const $loadingProgressBar = $('#loadingProgressBar');
    const $autoIndicator = $('#autoIndicator');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $replay = $('#replayBtn');
    const $play = $('#playBtn');
    const $cancelLoading = $('#cancelLoadingBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function setStatus(text, type) {
        $statusText.text(text);
        $statusBadge.removeClass('idle speaking error paused waiting loading');
        if (type === 'speaking') $statusBadge.addClass('speaking');
        else if (type === 'error') $statusBadge.addClass('error');
        else if (type === 'paused') $statusBadge.addClass('paused');
        else if (type === 'waiting') $statusBadge.addClass('waiting');
        else if (type === 'loading') $statusBadge.addClass('loading');
        else $statusBadge.addClass('idle');
    }

    function updatePlayButton() {
        if (isPlaying) {
            $play.addClass('playing');
            $play.find('.btn-icon').text('⏸');
            $play.find('.btn-label').text('Pause');
        } else {
            $play.removeClass('playing');
            $play.find('.btn-icon').text('▶');
            $play.find('.btn-label').text('Play');
        }
    }

    function showLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        
        loadingCancelled = false;
        isLoading = true;
        
        // Réinitialiser la barre de progression
        $loadingProgressBar.css('animation', 'none');
        $loadingProgressBar.css('width', '0%');
        // Forcer un reflow
        $loadingProgressBar[0].offsetHeight;
        $loadingProgressBar.css('animation', 'loadingProgress 30s ease-out forwards');
        
        $loadingText.text('Préparation vocale...');
        $loadingSub.text('Synthèse en cours');
        $loadingTimeout.text('⏱️ 30 secondes maximum');
        $loading.fadeIn(300);
        setStatus("⏳ Chargement...", 'loading');
        
        // 🔥 TIMEOUT DE 30 SECONDES
        loadingTimeout = setTimeout(() => {
            if (isLoading && !loadingCancelled) {
                hideLoading();
                setStatus("⚠️ Délai dépassé (30s)", 'error');
                isPlaying = false;
                updatePlayButton();
                $loadingSub.text('La synthèse vocale a pris trop de temps');
                $loadingTimeout.text('❌ Délai dépassé');
            }
        }, 30000);
    }

    function hideLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        isLoading = false;
        loadingCancelled = false;
        $loading.fadeOut(300);
        // Ne pas changer le statut si on est en train de parler
        if (!isSpeaking && !isPlaying) {
            setStatus("⏸ Lecture arrêtée", 'paused');
        }
    }

    function cancelLoading() {
        loadingCancelled = true;
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        hideLoading();
        stopSpeaking();
        setStatus("⏸ Annulé", 'paused');
        isPlaying = false;
        updatePlayButton();
        $loadingText.text('Annulé par l\'utilisateur');
        $loadingSub.text('Vous pouvez réessayer');
        $loadingTimeout.text('✕ Annulation');
    }

    // Arrêter la parole proprement
    function stopSpeaking() {
        try {
            if (synth && (synth.speaking || synth.pending)) {
                synth.cancel();
            }
        } catch(e) {
            console.warn('Erreur stopSpeaking:', e);
        }
        if (currentUtterance) {
            try {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance.onstart = null;
            } catch(e) {}
            currentUtterance = null;
        }
        isSpeaking = false;
        isPlaying = false;
        updatePlayButton();
    }

    // Mettre en pause la parole
    function pauseSpeaking() {
        try {
            if (synth && synth.speaking) {
                synth.pause();
                isPaused = true;
                isPlaying = false;
                setStatus("⏸ Lecture en pause", 'paused');
                updatePlayButton();
            }
        } catch(e) {
            console.warn('Erreur pauseSpeaking:', e);
            stopSpeaking();
        }
    }

    // Reprendre la parole
    function resumeSpeaking() {
        try {
            if (synth && synth.paused) {
                synth.resume();
                isPaused = false;
                isPlaying = true;
                setStatus("🔊 Lecture en cours", 'speaking');
                updatePlayButton();
            } else if (!isSpeaking && !synth.speaking && !synth.pending) {
                speakSlide(currentIndex);
            }
        } catch(e) {
            console.warn('Erreur resumeSpeaking:', e);
            speakSlide(currentIndex);
        }
    }

    function renderSlide(index) {
        const slide = slides[index];
        $title.text(slide.titre);

        let html = '';
        html += `<div class="content-card">${slide.contenu}</div>`;
        if (slide.note) {
            html += `<div class="note-box">${slide.note}</div>`;
        }
        $body.html(html);
        $counter.text(`${index+1} / ${total}`);

        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
        }
    }

    // ================================================================
    // LECTURE VOCALE
    // ================================================================
    function speakSlide(index) {
        return new Promise((resolve) => {
            const slide = slides[index];
            const text = slide.texteParle;
            
            if (!text || text.trim() === '' || !speechSupported) {
                resolve();
                return;
            }

            if (!window.speechSynthesis) {
                setStatus("❌ Synthèse vocale non supportée", 'error');
                speechSupported = false;
                resolve();
                return;
            }

            // Arrêter toute lecture en cours
            stopSpeaking();
            
            // Réinitialiser l'état de pause
            isPaused = false;
            
            showLoading();
            setStatus("Initialisation...", 'loading');

            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.92;
                utterance.pitch = 1.05;
                utterance.volume = 1;

                let isFinished = false;
                let errorHandled = false;

                utterance.onstart = function() {
                    if (loadingCancelled) {
                        stopSpeaking();
                        resolve();
                        return;
                    }
                    hideLoading();
                    isSpeaking = true;
                    isPlaying = true;
                    isPaused = false;
                    setStatus("🔊 Lecture en cours", 'speaking');
                    updatePlayButton();
                };

                utterance.onend = function() {
                    if (isFinished) return;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    setStatus("✅ Terminé", 'idle');
                    hideLoading();
                    updatePlayButton();
                    resolve();
                };

                utterance.onerror = function(e) {
                    if (isFinished || errorHandled) return;
                    errorHandled = true;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    hideLoading();
                    updatePlayButton();
                    
                    if (e.error === 'not-allowed') {
                        setStatus("⚠️ Permission refusée", 'error');
                    } else if (e.error === 'synthesis-unavailable') {
                        setStatus("⚠️ Synthèse indisponible", 'error');
                    } else if (e.error === 'canceled') {
                        setStatus("⏸ Annulé", 'paused');
                    } else {
                        setStatus("❌ Erreur audio: " + (e.error || 'inconnue'), 'error');
                    }
                    
                    resolve();
                };

                // Gestion du chargement des voix
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = function() {
                        if (!loadingCancelled) {
                            try {
                                synth.speak(utterance);
                            } catch(err) {
                                // Silencieux
                            }
                        }
                        synth.onvoiceschanged = null;
                    };
                }

                currentUtterance = utterance;
                
                if (!loadingCancelled) {
                    try {
                        synth.speak(utterance);
                    } catch(err) {
                        setTimeout(() => {
                            if (!loadingCancelled) {
                                try {
                                    synth.speak(utterance);
                                } catch(e) {
                                    setStatus("❌ Erreur de lecture", 'error');
                                    isPlaying = false;
                                    updatePlayButton();
                                    hideLoading();
                                    resolve();
                                }
                            } else {
                                resolve();
                            }
                        }, 100);
                    }
                } else {
                    resolve();
                }

            } catch(err) {
                hideLoading();
                setStatus("❌ Erreur générale", 'error');
                isPlaying = false;
                updatePlayButton();
                console.error('Erreur speakSlide:', err);
                resolve();
            }
        });
    }

    // ================================================================
    // NAVIGATION
    // ================================================================
    async function goToSlide(index) {
        if (isTransitioning) return;
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        
        // Si on est en train de lire, on met en pause avant de naviguer
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        // Arrêter complètement la lecture
        stopSpeaking();
        
        await new Promise(r => setTimeout(r, 50));
        
        if (index === currentIndex) {
            setStatus("📄 Slide actuel", 'idle');
            return;
        }

        isTransitioning = true;
        currentIndex = index;
        renderSlide(index);
        
        // Réinitialiser l'état de lecture
        isPlaying = false;
        updatePlayButton();
        setStatus("⏸ Lecture arrêtée", 'paused');

        await new Promise(r => setTimeout(r, 150));
        isTransitioning = false;
    }

    async function goToNext() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex + 1 < total) {
            await goToSlide(currentIndex + 1);
        } else {
            setStatus("🏁 Dernier slide", 'idle');
        }
    }

    async function goToPrev() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex - 1 >= 0) {
            await goToSlide(currentIndex - 1);
        } else {
            setStatus("🔁 Premier slide", 'idle');
        }
    }

    // ================================================================
    // GESTION PLAY/PAUSE
    // ================================================================
    function togglePlay() {
        if (!userInteracted) {
            userInteracted = true;
        }

        // Si le chargement est en cours, on l'annule
        if (isLoading) {
            cancelLoading();
            return;
        }

        // Si le synthétiseur est en pause, on reprend
        if (synth && synth.paused) {
            resumeSpeaking();
            return;
        }

        // Si la lecture est en cours, on met en pause
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
            return;
        }

        // Sinon, on démarre la lecture du slide courant
        if (!isSpeaking && !isPlaying) {
            stopSpeaking();
            speakSlide(currentIndex);
        }
    }

    // ================================================================
    // INIT
    // ================================================================
    async function init() {
        // Vérifier la compatibilité
        if (!window.speechSynthesis) {
            setStatus("❌ Synthèse vocale non supportée", 'error');
            speechSupported = false;
        }

        // Précharger les voix
        try {
            if (synth.getVoices) {
                synth.getVoices();
                setTimeout(() => {
                    try {
                        synth.getVoices();
                    } catch(e) {}
                }, 200);
            }
        } catch(e) {
            console.warn('Erreur chargement voix:', e);
        }

        // Afficher le premier slide
        renderSlide(0);
        $counter.text(`1 / ${total}`);
        
        // État initial
        setStatus("⏸ Appuie sur Play", 'paused');
        updatePlayButton();
        $autoIndicator.text('⏸ Lecture manuelle');

        // ================================================================
        // ÉVÉNEMENTS
        // ================================================================
        
        // Bouton Play/Pause
        $play.on('click', function() {
            togglePlay();
        });

        // Bouton Annuler le chargement
        $cancelLoading.on('click', function() {
            cancelLoading();
        });

        // Navigation
        $prev.on('click', function() {
            // Si chargement en cours, on annule
            if (isLoading) cancelLoading();
            goToPrev();
        });

        $next.on('click', function() {
            if (isLoading) cancelLoading();
            goToNext();
        });

        // Replay - relire le slide courant
        $replay.on('click', function() {
            if (isLoading) cancelLoading();
            stopSpeaking();
            setTimeout(() => {
                speakSlide(currentIndex);
            }, 100);
        });

        // Support du clavier (espace pour play/pause)
        $(document).on('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });

        // Nettoyage
        $(window).on('beforeunload', function() {
            try {
                if (synth.speaking) synth.cancel();
            } catch(e) {}
            hideLoading();
        });

        // Gérer les cas où la synthèse se termine de manière inattendue
        setInterval(() => {
            if (isPlaying && !synth.speaking && !synth.pending && !isPaused && !isLoading) {
                isPlaying = false;
                updatePlayButton();
                setStatus("⏸ Lecture arrêtée", 'paused');
            }
        }, 1000);
    }

    init();
});



    // ================================================================
    // GESTION DU THÈME JOUR/NUIT
    // ================================================================
    let isDarkMode = false;

    function toggleTheme() {
        isDarkMode = !isDarkMode;
        const body = document.body;
        const appContainer = document.querySelector('.app-container');
        const header = document.querySelector('.slide-header');
        const footer = document.querySelector('.slide-footer');
        const contentCards = document.querySelectorAll('.content-card');
        const noteBoxes = document.querySelectorAll('.note-box');
        const mathBlocks = document.querySelectorAll('.math-block');
        const buttons = document.querySelectorAll('.btn');
        const statusBadge = document.querySelector('.status-badge');
        const slideCounter = document.querySelector('.slide-counter');
        const autoIndicator = document.querySelector('.auto-indicator');
        const themeBtn = document.getElementById('themeToggle');

        if (isDarkMode) {
            // Mode nuit
            body.style.background = '#0b1120';
            body.style.color = '#f1f5f9';
            appContainer.style.background = 'linear-gradient(145deg, #0f172a 0%, #1e293b 100%)';
            header.style.background = 'rgba(15, 23, 42, 0.85)';
            footer.style.background = 'rgba(15, 23, 42, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.05)';
                card.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.08)';
                note.style.color = '#cbd5e1';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.25)';
                block.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#e2e8f0';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.12)';
                statusBadge.style.color = '#93bbfc';
            }
            if (slideCounter) {
                slideCounter.style.color = '#94a3b8';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#64748b';
            }
            if (themeBtn) {
                themeBtn.textContent = '☀️';
                themeBtn.title = 'Passer en mode jour';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#e2e8f0';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#e2e8f0';
                }
            });
        } else {
            // Mode jour (par défaut)
            body.style.background = '#f0f4f8';
            body.style.color = '#1a202c';
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
            header.style.background = 'rgba(255, 255, 255, 0.85)';
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.8)';
                card.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.12)';
                note.style.color = '#2c3e50';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.05)';
                block.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#2d3748';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
                statusBadge.style.color = '#2b6cb0';
            }
            if (slideCounter) {
                slideCounter.style.color = '#4a5568';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#718096';
            }
            if (themeBtn) {
                themeBtn.textContent = '🌓';
                themeBtn.title = 'Passer en mode nuit';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#2c3e50';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#2d3748';
                }
            });
        }
    }

    // Initialiser en mode jour
    document.addEventListener('DOMContentLoaded', function() {
        // Appliquer le mode jour par défaut
        const body = document.body;
        body.style.background = '#f0f4f8';
        body.style.color = '#1a202c';
        
        const appContainer = document.querySelector('.app-container');
        if (appContainer) {
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
        }
        
        const header = document.querySelector('.slide-header');
        if (header) {
            header.style.background = 'rgba(255, 255, 255, 0.85)';
        }
        
        const footer = document.querySelector('.slide-footer');
        if (footer) {
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
        }
        
        document.querySelectorAll('.content-card').forEach(card => {
            card.style.background = 'rgba(255,255,255,0.8)';
            card.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.note-box').forEach(note => {
            note.style.background = 'rgba(96, 165, 250, 0.12)';
            note.style.color = '#2c3e50';
        });
        
        document.querySelectorAll('.math-block').forEach(block => {
            block.style.background = 'rgba(0,0,0,0.05)';
            block.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.btn').forEach(btn => {
            btn.style.color = '#2d3748';
        });
        
        const statusBadge = document.querySelector('.status-badge');
        if (statusBadge) {
            statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
            statusBadge.style.color = '#2b6cb0';
        }
        
        const slideCounter = document.querySelector('.slide-counter');
        if (slideCounter) {
            slideCounter.style.color = '#4a5568';
        }
        
        const autoIndicator = document.querySelector('.auto-indicator');
        if (autoIndicator) {
            autoIndicator.style.color = '#718096';
        }
        
        document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
            if (!el.closest('.note-box')) {
                el.style.color = '#2c3e50';
            }
        });
        
        document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
            if (!el.closest('.note-box') && !el.closest('.math-block')) {
                el.style.color = '#2d3748';
            }
        });
        
        const themeBtn = document.getElementById('themeToggle');
        if (themeBtn) {
            themeBtn.textContent = '🌓';
            themeBtn.title = 'Passer en mode nuit';
        }
    });
</script>
