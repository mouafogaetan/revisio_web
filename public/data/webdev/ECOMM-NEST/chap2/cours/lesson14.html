<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Présentation mobile</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' },
            options: { skipHtmlTypes: 'script' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 500px;
        margin: 0 auto;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    .slide-header {
        flex-shrink: 0;
        padding: 18px 16px 10px 16px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        z-index: 10;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .slide-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
    }

    .content-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 18px 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        flex-shrink: 0;
    }

    .content-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .content-card li {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        line-height: 1.5;
    }

    .content-card li:last-child {
        border-bottom: none;
    }

    .bullet-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
    }

    .math-block {
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        overflow-x: auto;
        flex-shrink: 0;
        margin: 4px 0;
    }

    .math-block .math {
        font-size: 1.2rem;
        color: #e2e8f0;
    }

    .note-box {
        background: rgba(96, 165, 250, 0.08);
        border-left: 4px solid #60a5fa;
        padding: 12px 16px;
        border-radius: 12px;
        font-style: italic;
        font-size: 0.9rem;
        color: #cbd5e1;
        flex-shrink: 0;
    }

    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        border-radius: 0;
        flex-direction: column;
    }

    .loading-card {
        background: #1e293b;
        padding: 32px 28px;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #334155;
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px auto;
    }

    .loading-text {
        font-weight: 600;
        font-size: 1.1rem;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    .loading-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 16px;
    }
    .loading-progress {
        height: 3px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        animation: loadingProgress 30s ease-out forwards;
    }

    .loading-timeout {
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 12px;
    }

    .btn-cancel-loading {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 40px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #f87171;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }

    .btn-cancel-loading:active {
        transform: scale(0.94);
        background: rgba(239, 68, 68, 0.25);
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
    }

    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .slide-counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255,255,255,0.05);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(255,255,255,0.04);
    }

    .status-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 30px;
        background: rgba(96, 165, 250, 0.12);
        color: #93bbfc;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
    }

    .status-badge .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: pulse-dot 1.2s infinite;
        flex-shrink: 0;
    }

    .status-badge.idle .dot {
        animation: none;
        background: #64748b;
    }
    .status-badge.speaking .dot {
        background: #34d399;
        animation: pulse-dot 0.8s infinite;
    }
    .status-badge.error .dot {
        background: #f87171;
        animation: none;
    }
    .status-badge.paused .dot {
        animation: none;
        background: #fbbf24;
    }
    .status-badge.waiting .dot {
        animation: pulse-dot 1.5s infinite;
        background: #fbbf24;
    }
    .status-badge.loading .dot {
        animation: pulse-dot 0.5s infinite;
        background: #60a5fa;
    }

    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.7); }
    }

    .footer-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(255,255,255,0.1);
    }

    .btn-secondary {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-play {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
        min-width: 80px;
        justify-content: center;
    }
    .btn-play:active {
        background: rgba(52, 211, 153, 0.25);
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
    }

    .auto-indicator {
        font-size: 0.65rem;
        color: #64748b;
        text-align: center;
        letter-spacing: 0.3px;
        padding: 2px 0;
    }

    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.2rem;
        }
        .content-card li {
            font-size: 0.9rem;
            padding: 8px 0;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .btn-play {
            min-width: 60px;
        }
        .footer-buttons {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
        .loading-card {
            padding: 20px 16px;
        }
        .math-block .math {
            font-size: 1rem;
        }
    }

    @media (min-width: 600px) {
        .app-container {
            max-width: 480px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
        .loading-overlay {
            border-radius: 32px;
        }
    }

    /* Mode jour (par défaut) */
    html, body {
        background: #f0f4f8 !important;
        color: #1a202c !important;
    }
    .app-container {
        background: linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%) !important;
    }
    .slide-header {
        background: rgba(255, 255, 255, 0.85) !important;
        border-bottom: 1px solid rgba(0,0,0,0.08) !important;
    }
    .slide-header h1 {
        background: linear-gradient(135deg, #2b6cb0, #6b46c1) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        background-clip: text !important;
    }
    .slide-footer {
        background: rgba(255, 255, 255, 0.9) !important;
        border-top: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card {
        background: rgba(255,255,255,0.8) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card li {
        border-bottom: 1px solid rgba(0,0,0,0.05) !important;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.12) !important;
        border-left: 4px solid #4299e1 !important;
        color: #2c3e50 !important;
    }
    .math-block {
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .math-block .math {
        color: #2d3748 !important;
    }
    .slide-counter {
        color: #4a5568 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .status-badge {
        background: rgba(96, 165, 250, 0.15) !important;
        color: #2b6cb0 !important;
        border: 1px solid rgba(96, 165, 250, 0.15) !important;
    }
    .btn {
        color: #2d3748 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .btn-secondary {
        background: rgba(0,0,0,0.04) !important;
        border-color: rgba(0,0,0,0.08) !important;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15) !important;
        border-color: rgba(52, 211, 153, 0.2) !important;
        color: #38a169 !important;
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15) !important;
        border-color: rgba(251, 191, 36, 0.2) !important;
        color: #d69e2e !important;
    }
    .auto-indicator {
        color: #718096 !important;
    }
    .loading-card {
        background: #ffffff !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .loading-text {
        color: #1a202c !important;
    }
    .loading-sub {
        color: #4a5568 !important;
    }
</style>
</head>
<body>

<div class="app-container">

    <header class="slide-header">
        <h1 id="slideTitle">Chargement...</h1>
    </header>

    <main class="slide-body" id="slideBody"></main>

    <!-- LOADING OVERLAY AVEC BOUTON ANNULER -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Préparation vocale...</div>
            <div class="loading-sub" id="loadingSub">Synthèse en cours</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loadingProgressBar"></div>
            </div>
            <div class="loading-timeout" id="loadingTimeout">⏱️ 30 secondes maximum</div>
            <button class="btn-cancel-loading" id="cancelLoadingBtn">
                <span>✕</span> Annuler
            </button>
        </div>
    </div>

    <footer class="slide-footer">
        <div class="footer-top">
            <span class="slide-counter" id="slideCounter">1 / 3</span>
            <span class="status-badge idle" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">Prêt</span>
            </span>
        </div>

        <div class="footer-buttons">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-secondary" id="replayBtn">
                <span class="btn-icon">🔁</span> <span class="btn-label">Relire</span>
            </button>
            <button class="btn btn-play" id="playBtn">
                <span class="btn-icon">▶</span> <span class="btn-label">Play</span>
            </button>
        </div>

        <div class="auto-indicator" id="autoIndicator">⏸ Lecture manuelle</div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // SLIDES
    // ================================================================
    const slides = [
  {
    "titre": "L'entité Dispute",
    "contenu": "<div style='background: linear-gradient(135deg, #1e3c72, #2a5298); color: white; padding: 2rem; border-radius: 15px; text-align: center; margin-bottom: 1.5rem;'><h2 style='color: #fff; margin-bottom: 0.5rem;'>⚖️ L'entité Dispute</h2><p style='color: #e0e0e0; font-size: 1.1rem;'>Modéliser le système d'arbitrage</p><hr style='border-color: #4a7db0; width: 50%;'><p style='color: #f0f0f0;'>Leçon 2.8 : Verdict JSONB et résolution de litige</p></div><p>Quand un acheteur et un vendeur ne parviennent pas à un accord, un <strong>litige</strong> est ouvert. Un <strong>assistant humain</strong> examine le dossier et rend un <strong>verdict</strong> : qui reçoit combien, et pourquoi. C'est le rôle de l'entité <code>Dispute</code>. Nous allons voir comment modéliser ce processus d'arbitrage, et comment le <strong>verdict JSONB</strong> permet de stocker une décision complexe et évolutive.</p>",
    "texteParle": "Bonjour à toutes et à tous et bienvenue dans cette huitième leçon du chapitre deux. Aujourd'hui, nous allons modéliser l'entité Dispute, qui gère les litiges. Rappelons le contexte : quand un acheteur et un vendeur ne parviennent pas à un accord, quand la livraison ne se passe pas comme prévu, quand le produit n'est pas conforme, un litige est ouvert. À ce moment-là, un assistant humain prend le dossier en main, examine les preuves, interroge les deux parties dans le chat, et rend un verdict. Ce verdict dit qui reçoit combien, et pourquoi. C'est ce processus que nous allons modéliser. Et pour stocker le verdict, nous allons utiliser une colonne JSONB, ce qui va nous permettre de gérer des verdicts flexibles et évolutifs. C'est une leçon importante, car c'est ce système qui garantit la justice et la confiance sur la plateforme. C'est parti.",
    "note": "Le système de litige est l'une des fonctionnalités les plus importantes de SawaMart. C'est ce qui rassure les utilisateurs."
  },
  {
    "titre": "Le concept de Dispute",
    "contenu": "<div style='background: #f8f9fa; padding: 1.5rem; border-radius: 12px; border-left: 6px solid #2a5298;'><p style='color: #1e3c72; font-weight: bold; margin-top: 0;'>Un Dispute, c'est :</p><ul style='padding-left: 1.2rem; color: #333; line-height: 1.9;'><li>⚖️ Un <strong>processus d'arbitrage</strong> entre deux parties</li><li>👤 Ouvert par l'<strong>acheteur</strong> (seul habilité)</li><li>🛡️ Prise en charge par un <strong>assistant</strong></li><li>💰 Un <strong>verdict</strong> qui répartit les fonds séquestrés</li><li>📝 Une <strong>raison</strong> obligatoire à l'ouverture</li><li>📊 Un <strong>statut</strong> : ouvert, en révision, résolu</li></ul><p style='color: #333; margin-top: 1rem;'><strong>Contraintes métier :</strong></p><ul style='padding-left: 1.2rem; color: #333; line-height: 1.8;'><li>1️⃣ Un seul litige actif par chat</li><li>2️⃣ Seul l'acheteur peut ouvrir un litige</li><li>3️⃣ L'ouverture se fait dans le délai (30j)</li><li>4️⃣ Le litige implique les fonds séquestrés</li></ul></div>",
    "texteParle": "Commençons par clarifier ce qu'est un Dispute. Un Dispute, c'est un processus d'arbitrage entre deux parties. Il est ouvert par l'acheteur, car c'est lui qui a payé et qui n'a pas reçu ce qu'il attendait. Le vendeur ne peut pas ouvrir un litige : s'il a un problème, il peut annuler la commande avant le séquestre, mais une fois les fonds séquestrés, c'est l'acheteur qui a le contrôle. Ensuite, le litige est pris en charge par un assistant humain, qui va examiner le dossier. Puis, l'assistant rend un verdict qui répartit les fonds séquestrés entre les deux parties. Par exemple, il peut dire : l'acheteur reçoit 100% en remboursement, ou le vendeur reçoit 100%, ou bien un partage : 60% à l'acheteur, 40% au vendeur. La raison est obligatoire à l'ouverture : l'acheteur doit expliquer pourquoi il conteste. Enfin, un statut permet de suivre l'avancement : ouvert, en révision, résolu. Il y a quatre contraintes métier importantes. Premièrement, un chat ne peut avoir qu'un seul litige actif à la fois. Deuxièmement, seul l'acheteur peut ouvrir un litige. Troisièmement, l'ouverture doit se faire dans le délai de trente jours après le séquestre. Quatrièmement, le litige ne peut être ouvert que si les fonds sont effectivement séquestrés. Sinon, il n'y a rien à arbitrer.",
    "note": "Le délai de 30 jours est crucial : il pousse l'acheteur à vérifier rapidement son achat."
  },
  {
    "titre": "Les 3 statuts d'un Dispute",
    "contenu": "<div style='background: #e9ecef; padding: 1rem; border-radius: 12px;'><p style='color: #333;'>L'énumération DisputeStatus définit trois états :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.75rem; line-height: 1.7; white-space: pre;'>export enum DisputeStatus {<br>&nbsp;&nbsp;OPEN = 'open',<br>&nbsp;&nbsp;UNDER_REVIEW = 'under_review',<br>&nbsp;&nbsp;RESOLVED = 'resolved',<br>}</div><p style='color: #333; margin-top: 0.8rem;'><strong>Le cycle :</strong></p><div style='background: #f8f9fa; padding: 0.8rem; border-radius: 8px; font-size: 0.9rem; color: #333; line-height: 1.7;'><strong>OPEN</strong> → L'acheteur a ouvert le litige, aucun assistant n'est encore assigné<br><br><strong>UNDER_REVIEW</strong> → Un assistant a pris en charge et examine le dossier<br><br><strong>RESOLVED</strong> → L'assistant a rendu son verdict, le litige est clos</div></div>",
    "texteParle": "Le Dispute a trois statuts, définis par l'énumération DisputeStatus. Le premier, OPEN : l'acheteur vient d'ouvrir le litige, aucun assistant n'est encore assigné. C'est l'état initial. À ce moment-là, tous les assistants voient le litige dans leur liste 'litiges disponibles'. Le deuxième, UNDER_REVIEW : un assistant a cliqué sur 'prendre en charge', il est maintenant responsable du dossier. C'est lui, et lui seul, qui devra trancher. Les autres assistants ne voient plus le litige dans leur liste. Le troisième, RESOLVED : l'assistant a rendu son verdict. Le litige est clos. Les fonds ont été répartis. Les deux parties ont été notifiées. C'est la fin du cycle. Ce sont trois états simples, mais qui structurent tout le processus d'arbitrage. Entre OPEN et UNDER_REVIEW, il peut y avoir plusieurs assistants qui consultent le dossier sans le prendre. Entre UNDER_REVIEW et RESOLVED, l'assistant peut prendre plusieurs jours pour décider, en fonction de la complexité. Mais dans tous les cas, la transition est explicite et traçable.",
    "note": "Un litige OPEN est visible par tous les assistants. Dès qu'il passe à UNDER_REVIEW, il devient privé."
  },
  {
    "titre": "L'interface DisputeVerdict",
    "contenu": "<div style='background: #f8f9fa; padding: 1rem; border-radius: 12px; border-left: 6px solid #fbbf24;'><p style='color: #333;'>Le verdict est une structure de données complexe. On la définit comme une interface :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.72rem; line-height: 1.6; white-space: pre;'>export interface DisputeVerdict {<br>&nbsp;&nbsp;buyerAmount: number;&nbsp;&nbsp;&nbsp;&nbsp;<span style='color: #6a9955;'>// Montant remboursé à l'acheteur</span><br>&nbsp;&nbsp;sellerAmount: number;&nbsp;&nbsp;&nbsp;<span style='color: #6a9955;'>// Montant payé au vendeur</span><br>&nbsp;&nbsp;reason: string;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span style='color: #6a9955;'>// Explication de la décision</span><br>}</div><p style='color: #333; margin-top: 0.8rem;'><strong>Exemple concret :</strong></p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.7rem; border-radius: 8px; font-family: monospace; font-size: 0.75rem; line-height: 1.6; white-space: pre;'>{<br>&nbsp;&nbsp;buyerAmount: 8000,<br>&nbsp;&nbsp;sellerAmount: 2000,<br>&nbsp;&nbsp;reason: \"Le produit présente des défauts non mentionnés. Compensation partielle.\"<br>}</div><p style='color: #555; font-size: 0.9rem; margin-top: 0.8rem;'>💡 La somme buyerAmount + sellerAmount doit être égale au total séquestré.</p></div>",
    "texteParle": "Intéressons-nous maintenant au verdict, qui est une structure de données complexe. On la définit comme une interface TypeScript, ce qui garantit qu'on ne peut pas se tromper sur les propriétés. Le verdict contient trois choses. buyerAmount : le montant qui sera remboursé à l'acheteur. sellerAmount : le montant qui sera payé au vendeur. reason : l'explication textuelle de la décision. Regardez l'exemple concret : le total séquestré était de 10 000 FCFA. L'assistant décide que l'acheteur reçoit 8 000 et le vendeur 2 000. La raison : le produit présente des défauts non mentionnés, donc l'acheteur mérite une compensation partielle, mais le vendeur a quand même livré quelque chose, donc il reçoit une petite part. La règle d'or : la somme buyerAmount plus sellerAmount doit être égale au total séquestré. On ne peut pas distribuer plus qu'il n'y a. Le service DisputeService vérifie cette contrainte avant d'appliquer le verdict. Si la somme est inférieure au total, la différence est remboursée à l'acheteur par défaut. C'est une sécurité.",
    "note": "buyerAmount + sellerAmount + reste = total séquestré. Le reste est toujours remboursé à l'acheteur."
  },
  {
    "titre": "Début de l'entité Dispute",
    "contenu": "<div style='background: #e9ecef; padding: 1rem; border-radius: 12px;'><p style='color: #333;'>Créons <code>src/database/entities/dispute.entity.ts</code> :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.72rem; line-height: 1.6; white-space: pre;'>@Entity('disputes')<br>export class Dispute {<br>&nbsp;&nbsp;@PrimaryGeneratedColumn('uuid')<br>&nbsp;&nbsp;id!: string;<br><br>&nbsp;&nbsp;@Column({ type: 'uuid' })<br>&nbsp;&nbsp;chat_id!: string;<br><br>&nbsp;&nbsp;@Column({ type: 'uuid' })<br>&nbsp;&nbsp;buyer_id!: string;<br><br>&nbsp;&nbsp;@Column({ type: 'uuid' })<br>&nbsp;&nbsp;seller_id!: string;<br><br>&nbsp;&nbsp;@Column({ type: 'text' })<br>&nbsp;&nbsp;reason!: string;<br><br>&nbsp;&nbsp;<span style='color: #6a9955;'>// ... autres champs</span><br>}</div></div>",
    "texteParle": "Créons le fichier dispute.entity.ts. Comme d'habitude, une clé primaire UUID. Puis trois clés étrangères : chat_id, buyer_id, seller_id. On pourrait penser que buyer_id et seller_id sont redondants, car ils sont déjà dans le chat. Mais c'est volontaire : c'est de la dénormalisation, une pratique courante pour éviter des jointures coûteuses. Quand on veut afficher l'historique des litiges d'un utilisateur, on n'a pas besoin de faire une jointure avec chats. C'est plus rapide. Ensuite, reason : la raison du litige, en text. C'est obligatoire : l'acheteur doit expliquer pourquoi il ouvre un litige. Une phrase courte mais claire : 'Produit non conforme', 'Colis non reçu après 15 jours', 'Article endommagé pendant le transport'. Cette raison est visible par tous les assistants et reste dans l'historique. C'est un élément important pour la transparence.",
    "note": "La dénormalisation (dupliquer buyer_id et seller_id) est un choix assumé pour la performance."
  },
  {
    "titre": "Statut et verdict",
    "contenu": "<div style='background: #f8f9fa; padding: 1rem; border-radius: 12px; border-left: 6px solid #2a5298;'><p style='color: #333;'>Les champs critiques du Dispute :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.72rem; line-height: 1.6; white-space: pre;'>@Column({<br>&nbsp;&nbsp;type: 'enum', enum: DisputeStatus,<br>&nbsp;&nbsp;default: DisputeStatus.OPEN,<br>})<br>status!: DisputeStatus;<br><br>@Column({ type: 'text', nullable: true })<br>resolution!: string;<br><br>@Column({ type: 'jsonb', nullable: true })<br>verdict!: DisputeVerdict;<br><br>@Column({ type: 'uuid', nullable: true })<br>resolved_by!: string;<br><br>@Column({ type: 'timestamp', nullable: true })<br>resolved_at!: Date;</div><p style='color: #555; font-size: 0.9rem; margin-top: 0.8rem;'>💡 <code>verdict</code> reste null tant que l'assistant n'a pas tranché.</p></div>",
    "texteParle": "Ajoutons les champs critiques. status : le statut, avec l'énumération DisputeStatus, par défaut OPEN. resolution : un texte nullable qui explique la décision finale. C'est différent de la reason d'ouverture : reason c'est pourquoi on ouvre, resolution c'est ce qu'on décide. Par exemple, reason pourrait être 'Produit non conforme', et resolution pourrait être 'Après examen des photos, le produit présentait effectivement des défauts non mentionnés. L'acheteur reçoit une compensation de 80%.'. verdict : la structure JSONB qui contient les montants et la raison de la décision. C'est le cœur du jugement. Il est nullable tant que l'assistant n'a pas tranché. resolved_by : l'identifiant de l'assistant qui a tranché. Utile pour la traçabilité. resolved_at : la date à laquelle le litige a été résolu. Après cette date, le litige est clos, on ne peut plus le modifier. Notez la cohérence : ces trois derniers champs sont tous nullables et tous remplis au moment de la résolution. C'est un bloc : soit on est en cours, soit on a tranché.",
    "note": "Les trois champs verdict, resolved_by et resolved_at forment un trio indissociable."
  },
  {
    "titre": "Les relations de Dispute",
    "contenu": "<div style='background: #e9ecef; padding: 1rem; border-radius: 12px;'><p style='color: #333;'>Dispute a quatre relations :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.72rem; line-height: 1.6; white-space: pre;'><span style='color: #6a9955;'>// 1-1 vers Chat (le litige concerne UN chat)</span><br>@OneToOne(() =&gt; Chat)<br>@JoinColumn({ name: 'chat_id' })<br>chat!: Chat;<br><br><span style='color: #6a9955;'>// N-1 vers User (l'acheteur)</span><br>@ManyToOne(() =&gt; User, (u) =&gt; u.disputesAsBuyer)<br>@JoinColumn({ name: 'buyer_id' })<br>buyer!: User;<br><br><span style='color: #6a9955;'>// N-1 vers User (le vendeur)</span><br>@ManyToOne(() =&gt; User, (u) =&gt; u.disputesAsSeller)<br>@JoinColumn({ name: 'seller_id' })<br>seller!: User;<br><br><span style='color: #6a9955;'>// N-1 vers User (l'assistant qui a résolu)</span><br>@ManyToOne(() =&gt; User, (u) =&gt; u.resolvedDisputes)<br>@JoinColumn({ name: 'resolved_by' })<br>resolver!: User;</div></div>",
    "texteParle": "Ajoutons les quatre relations de Dispute. Première relation : OneToOne vers Chat. On a déjà vu cette relation côté Chat dans la leçon précédente. Ici, on l'explicite côté Dispute. Le JoinColumn indique que c'est la table disputes qui stocke la clé étrangère chat_id. C'est cohérent : le litige appartient au chat. Deuxième relation : ManyToOne vers User, avec la propriété buyer. La flèche (u) => u.disputesAsBuyer indique à TypeORM que côté User, il y a un tableau disputesAsBuyer. Troisième relation : ManyToOne vers User, avec la propriété seller. Même logique. Quatrième relation : ManyToOne vers User, avec la propriété resolver. C'est l'assistant qui a résolu le litige. Notez que cette relation est optionnelle : tant que le litige n'est pas résolu, resolved_by est null, et donc resolver est null. Grâce à ces quatre relations, on peut facilement interroger : 'donne-moi le litige, son chat, son acheteur, son vendeur, et l'assistant qui l'a résolu'. C'est très puissant pour l'interface d'arbitrage.",
    "note": "Trois relations ManyToOne vers User, c'est normal : trois rôles différents dans un litige."
  },
  {
    "titre": "Le workflow d'assignation",
    "contenu": "<div style='background: #f8f9fa; padding: 1rem; border-radius: 12px; border-left: 6px solid #10b981;'><p style='color: #333;'>Comment un assistant prend un litige en charge :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.72rem; line-height: 1.6; white-space: pre;'><span style='color: #6a9955;'>// 1. Assistant voit les litiges OPEN</span><br>GET /disputes/available<br><span style='color: #6a9955;'>→ status = 'open'</span><br><br><span style='color: #6a9955;'>// 2. Assistant clique sur "prendre en charge"</span><br>POST /disputes/:id/assign<br><span style='color: #6a9955;'>→ dispute.status = 'under_review'</span><br><span style='color: #6a9955;'>→ chat.assistant_id = assistant.id</span><br><span style='color: #6a9955;'>→ chat.assigned_at = now()</span><br><br><span style='color: #6a9955;'>// 3. Litige n'apparaît plus dans les disponibles</span></div><p style='color: #555; font-size: 0.9rem; margin-top: 0.8rem;'>💡 Le chat est aussi mis à jour : l'assistant peut maintenant y envoyer des messages.</p></div>",
    "texteParle": "Parlons du workflow d'assignation. Comment un assistant prend un litige en charge ? Étape une : il consulte la liste des litiges disponibles. C'est un endpoint qui retourne tous les litiges en statut OPEN. Sur notre plateforme, ça peut être une dizaine de litiges en attente. Étape deux : il clique sur 'prendre en charge' sur un litige. Cela déclenche un appel à l'endpoint POST /disputes/:id/assign. Le service DisputeService fait alors deux choses en une transaction. Premièrement, il passe le statut du litige de OPEN à UNDER_REVIEW. Deuxièmement, il met à jour le chat associé : assistant_id devient l'identifiant de l'assistant, assigned_at devient la date actuelle. Cela donne à l'assistant l'accès au chat pour discuter avec les deux parties. Étape trois : à partir de ce moment, le litige n'apparaît plus dans la liste des disponibles pour les autres assistants. Il apparaît dans la liste 'mes litiges assignés' de l'assistant qui l'a pris. C'est un workflow simple mais efficace. Il évite que deux assistants travaillent en parallèle sur le même litige, ce qui serait source de confusion. Une fois assigné, c'est l'assistant seul qui décide.",
    "note": "L'assignation modifie deux entités en une transaction. C'est un bon exemple de transaction ACID."
  },

    "texteParle": "Résumons cette leçon. Nous avons créé l'entité Dispute, qui modélise le système d'arbitrage de SawaMart. Nous avons vu les quatre contraintes métier : un seul litige par chat, ouverture par l'acheteur uniquement, dans le délai de trente jours, avec des fonds séquestrés. Nous avons défini trois statuts : OPEN, UNDER_REVIEW, RESOLVED. Nous avons créé l'interface DisputeVerdict avec ses deux montants et sa raison, et posé la règle que la somme doit être inférieure ou égale au total séquestré. Nous avons vu comment le verdict est stocké en JSONB, ce qui permet une grande flexibilité. Nous avons ajouté les quatre relations : Chat, Buyer, Seller, Resolver. Et nous avons décrit le workflow d'assignation d'un assistant, qui passe le litige de OPEN à UNDER_REVIEW et l'associe à un chat. C'est une entité cruciale : c'est elle qui garantit la justice sur la plateforme. Dans la prochaine leçon, nous allons prendre un peu de recul et revenir en détail sur les relations TypeORM : OneToMany, ManyToOne, OneToOne, ManyToMany. Nous verrons quand utiliser chaque type et les pièges à éviter. À très bientôt !",

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentIndex = 0;
    let isSpeaking = false;
    let isPaused = false;
    let currentUtterance = null;
    let isLoading = false;
    let loadingTimeout = null;
    let isTransitioning = false;
    let speechSupported = true;
    let userInteracted = false;
    let isPlaying = false;
    let loadingCancelled = false;

    const total = slides.length;
    const synth = window.speechSynthesis;

    // Références jQuery
    const $title = $('#slideTitle');
    const $body = $('#slideBody');
    const $counter = $('#slideCounter');
    const $statusText = $('#statusText');
    const $statusBadge = $('#statusBadge');
    const $loading = $('#loadingOverlay');
    const $loadingText = $('#loadingText');
    const $loadingSub = $('#loadingSub');
    const $loadingTimeout = $('#loadingTimeout');
    const $loadingProgressBar = $('#loadingProgressBar');
    const $autoIndicator = $('#autoIndicator');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $replay = $('#replayBtn');
    const $play = $('#playBtn');
    const $cancelLoading = $('#cancelLoadingBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function setStatus(text, type) {
        $statusText.text(text);
        $statusBadge.removeClass('idle speaking error paused waiting loading');
        if (type === 'speaking') $statusBadge.addClass('speaking');
        else if (type === 'error') $statusBadge.addClass('error');
        else if (type === 'paused') $statusBadge.addClass('paused');
        else if (type === 'waiting') $statusBadge.addClass('waiting');
        else if (type === 'loading') $statusBadge.addClass('loading');
        else $statusBadge.addClass('idle');
    }

    function updatePlayButton() {
        if (isPlaying) {
            $play.addClass('playing');
            $play.find('.btn-icon').text('⏸');
            $play.find('.btn-label').text('Pause');
        } else {
            $play.removeClass('playing');
            $play.find('.btn-icon').text('▶');
            $play.find('.btn-label').text('Play');
        }
    }

    function showLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        
        loadingCancelled = false;
        isLoading = true;
        
        // Réinitialiser la barre de progression
        $loadingProgressBar.css('animation', 'none');
        $loadingProgressBar.css('width', '0%');
        // Forcer un reflow
        $loadingProgressBar[0].offsetHeight;
        $loadingProgressBar.css('animation', 'loadingProgress 30s ease-out forwards');
        
        $loadingText.text('Préparation vocale...');
        $loadingSub.text('Synthèse en cours');
        $loadingTimeout.text('⏱️ 30 secondes maximum');
        $loading.fadeIn(300);
        setStatus("⏳ Chargement...", 'loading');
        
        // 🔥 TIMEOUT DE 30 SECONDES
        loadingTimeout = setTimeout(() => {
            if (isLoading && !loadingCancelled) {
                hideLoading();
                setStatus("⚠️ Délai dépassé (30s)", 'error');
                isPlaying = false;
                updatePlayButton();
                $loadingSub.text('La synthèse vocale a pris trop de temps');
                $loadingTimeout.text('❌ Délai dépassé');
            }
        }, 30000);
    }

    function hideLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        isLoading = false;
        loadingCancelled = false;
        $loading.fadeOut(300);
        // Ne pas changer le statut si on est en train de parler
        if (!isSpeaking && !isPlaying) {
            setStatus("⏸ Lecture arrêtée", 'paused');
        }
    }

    function cancelLoading() {
        loadingCancelled = true;
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        hideLoading();
        stopSpeaking();
        setStatus("⏸ Annulé", 'paused');
        isPlaying = false;
        updatePlayButton();
        $loadingText.text('Annulé par l\'utilisateur');
        $loadingSub.text('Vous pouvez réessayer');
        $loadingTimeout.text('✕ Annulation');
    }

    // Arrêter la parole proprement
    function stopSpeaking() {
        try {
            if (synth && (synth.speaking || synth.pending)) {
                synth.cancel();
            }
        } catch(e) {
            console.warn('Erreur stopSpeaking:', e);
        }
        if (currentUtterance) {
            try {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance.onstart = null;
            } catch(e) {}
            currentUtterance = null;
        }
        isSpeaking = false;
        isPlaying = false;
        updatePlayButton();
    }

    // Mettre en pause la parole
    function pauseSpeaking() {
        try {
            if (synth && synth.speaking) {
                synth.pause();
                isPaused = true;
                isPlaying = false;
                setStatus("⏸ Lecture en pause", 'paused');
                updatePlayButton();
            }
        } catch(e) {
            console.warn('Erreur pauseSpeaking:', e);
            stopSpeaking();
        }
    }

    // Reprendre la parole
    function resumeSpeaking() {
        try {
            if (synth && synth.paused) {
                synth.resume();
                isPaused = false;
                isPlaying = true;
                setStatus("🔊 Lecture en cours", 'speaking');
                updatePlayButton();
            } else if (!isSpeaking && !synth.speaking && !synth.pending) {
                speakSlide(currentIndex);
            }
        } catch(e) {
            console.warn('Erreur resumeSpeaking:', e);
            speakSlide(currentIndex);
        }
    }

    function renderSlide(index) {
        const slide = slides[index];
        $title.text(slide.titre);

        let html = '';
        html += `<div class="content-card">${slide.contenu}</div>`;
        if (slide.note) {
            html += `<div class="note-box">${slide.note}</div>`;
        }
        $body.html(html);
        $counter.text(`${index+1} / ${total}`);

        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
        }
    }

    // ================================================================
    // LECTURE VOCALE
    // ================================================================
    function speakSlide(index) {
        return new Promise((resolve) => {
            const slide = slides[index];
            const text = slide.texteParle;
            
            if (!text || text.trim() === '' || !speechSupported) {
                resolve();
                return;
            }

            if (!window.speechSynthesis) {
                setStatus("❌ Synthèse vocale non supportée", 'error');
                speechSupported = false;
                resolve();
                return;
            }

            // Arrêter toute lecture en cours
            stopSpeaking();
            
            // Réinitialiser l'état de pause
            isPaused = false;
            
            showLoading();
            setStatus("Initialisation...", 'loading');

            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.92;
                utterance.pitch = 1.05;
                utterance.volume = 1;

                let isFinished = false;
                let errorHandled = false;

                utterance.onstart = function() {
                    if (loadingCancelled) {
                        stopSpeaking();
                        resolve();
                        return;
                    }
                    hideLoading();
                    isSpeaking = true;
                    isPlaying = true;
                    isPaused = false;
                    setStatus("🔊 Lecture en cours", 'speaking');
                    updatePlayButton();
                };

                utterance.onend = function() {
                    if (isFinished) return;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    setStatus("✅ Terminé", 'idle');
                    hideLoading();
                    updatePlayButton();
                    resolve();
                };

                utterance.onerror = function(e) {
                    if (isFinished || errorHandled) return;
                    errorHandled = true;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    hideLoading();
                    updatePlayButton();
                    
                    if (e.error === 'not-allowed') {
                        setStatus("⚠️ Permission refusée", 'error');
                    } else if (e.error === 'synthesis-unavailable') {
                        setStatus("⚠️ Synthèse indisponible", 'error');
                    } else if (e.error === 'canceled') {
                        setStatus("⏸ Annulé", 'paused');
                    } else {
                        setStatus("❌ Erreur audio: " + (e.error || 'inconnue'), 'error');
                    }
                    
                    resolve();
                };

                // Gestion du chargement des voix
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = function() {
                        if (!loadingCancelled) {
                            try {
                                synth.speak(utterance);
                            } catch(err) {
                                // Silencieux
                            }
                        }
                        synth.onvoiceschanged = null;
                    };
                }

                currentUtterance = utterance;
                
                if (!loadingCancelled) {
                    try {
                        synth.speak(utterance);
                    } catch(err) {
                        setTimeout(() => {
                            if (!loadingCancelled) {
                                try {
                                    synth.speak(utterance);
                                } catch(e) {
                                    setStatus("❌ Erreur de lecture", 'error');
                                    isPlaying = false;
                                    updatePlayButton();
                                    hideLoading();
                                    resolve();
                                }
                            } else {
                                resolve();
                            }
                        }, 100);
                    }
                } else {
                    resolve();
                }

            } catch(err) {
                hideLoading();
                setStatus("❌ Erreur générale", 'error');
                isPlaying = false;
                updatePlayButton();
                console.error('Erreur speakSlide:', err);
                resolve();
            }
        });
    }

    // ================================================================
    // NAVIGATION
    // ================================================================
    async function goToSlide(index) {
        if (isTransitioning) return;
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        
        // Si on est en train de lire, on met en pause avant de naviguer
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        // Arrêter complètement la lecture
        stopSpeaking();
        
        await new Promise(r => setTimeout(r, 50));
        
        if (index === currentIndex) {
            setStatus("📄 Slide actuel", 'idle');
            return;
        }

        isTransitioning = true;
        currentIndex = index;
        renderSlide(index);
        
        // Réinitialiser l'état de lecture
        isPlaying = false;
        updatePlayButton();
        setStatus("⏸ Lecture arrêtée", 'paused');

        await new Promise(r => setTimeout(r, 150));
        isTransitioning = false;
    }

    async function goToNext() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex + 1 < total) {
            await goToSlide(currentIndex + 1);
        } else {
            setStatus("🏁 Dernier slide", 'idle');
        }
    }

    async function goToPrev() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex - 1 >= 0) {
            await goToSlide(currentIndex - 1);
        } else {
            setStatus("🔁 Premier slide", 'idle');
        }
    }

    // ================================================================
    // GESTION PLAY/PAUSE
    // ================================================================
    function togglePlay() {
        if (!userInteracted) {
            userInteracted = true;
        }

        // Si le chargement est en cours, on l'annule
        if (isLoading) {
            cancelLoading();
            return;
        }

        // Si le synthétiseur est en pause, on reprend
        if (synth && synth.paused) {
            resumeSpeaking();
            return;
        }

        // Si la lecture est en cours, on met en pause
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
            return;
        }

        // Sinon, on démarre la lecture du slide courant
        if (!isSpeaking && !isPlaying) {
            stopSpeaking();
            speakSlide(currentIndex);
        }
    }

    // ================================================================
    // INIT
    // ================================================================
    async function init() {
        // Vérifier la compatibilité
        if (!window.speechSynthesis) {
            setStatus("❌ Synthèse vocale non supportée", 'error');
            speechSupported = false;
        }

        // Précharger les voix
        try {
            if (synth.getVoices) {
                synth.getVoices();
                setTimeout(() => {
                    try {
                        synth.getVoices();
                    } catch(e) {}
                }, 200);
            }
        } catch(e) {
            console.warn('Erreur chargement voix:', e);
        }

        // Afficher le premier slide
        renderSlide(0);
        $counter.text(`1 / ${total}`);
        
        // État initial
        setStatus("⏸ Appuie sur Play", 'paused');
        updatePlayButton();
        $autoIndicator.text('⏸ Lecture manuelle');

        // ================================================================
        // ÉVÉNEMENTS
        // ================================================================
        
        // Bouton Play/Pause
        $play.on('click', function() {
            togglePlay();
        });

        // Bouton Annuler le chargement
        $cancelLoading.on('click', function() {
            cancelLoading();
        });

        // Navigation
        $prev.on('click', function() {
            // Si chargement en cours, on annule
            if (isLoading) cancelLoading();
            goToPrev();
        });

        $next.on('click', function() {
            if (isLoading) cancelLoading();
            goToNext();
        });

        // Replay - relire le slide courant
        $replay.on('click', function() {
            if (isLoading) cancelLoading();
            stopSpeaking();
            setTimeout(() => {
                speakSlide(currentIndex);
            }, 100);
        });

        // Support du clavier (espace pour play/pause)
        $(document).on('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });

        // Nettoyage
        $(window).on('beforeunload', function() {
            try {
                if (synth.speaking) synth.cancel();
            } catch(e) {}
            hideLoading();
        });

        // Gérer les cas où la synthèse se termine de manière inattendue
        setInterval(() => {
            if (isPlaying && !synth.speaking && !synth.pending && !isPaused && !isLoading) {
                isPlaying = false;
                updatePlayButton();
                setStatus("⏸ Lecture arrêtée", 'paused');
            }
        }, 1000);
    }

    init();
});



    // ================================================================
    // GESTION DU THÈME JOUR/NUIT
    // ================================================================
    let isDarkMode = false;

    function toggleTheme() {
        isDarkMode = !isDarkMode;
        const body = document.body;
        const appContainer = document.querySelector('.app-container');
        const header = document.querySelector('.slide-header');
        const footer = document.querySelector('.slide-footer');
        const contentCards = document.querySelectorAll('.content-card');
        const noteBoxes = document.querySelectorAll('.note-box');
        const mathBlocks = document.querySelectorAll('.math-block');
        const buttons = document.querySelectorAll('.btn');
        const statusBadge = document.querySelector('.status-badge');
        const slideCounter = document.querySelector('.slide-counter');
        const autoIndicator = document.querySelector('.auto-indicator');
        const themeBtn = document.getElementById('themeToggle');

        if (isDarkMode) {
            // Mode nuit
            body.style.background = '#0b1120';
            body.style.color = '#f1f5f9';
            appContainer.style.background = 'linear-gradient(145deg, #0f172a 0%, #1e293b 100%)';
            header.style.background = 'rgba(15, 23, 42, 0.85)';
            footer.style.background = 'rgba(15, 23, 42, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.05)';
                card.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.08)';
                note.style.color = '#cbd5e1';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.25)';
                block.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#e2e8f0';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.12)';
                statusBadge.style.color = '#93bbfc';
            }
            if (slideCounter) {
                slideCounter.style.color = '#94a3b8';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#64748b';
            }
            if (themeBtn) {
                themeBtn.textContent = '☀️';
                themeBtn.title = 'Passer en mode jour';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#e2e8f0';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#e2e8f0';
                }
            });
        } else {
            // Mode jour (par défaut)
            body.style.background = '#f0f4f8';
            body.style.color = '#1a202c';
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
            header.style.background = 'rgba(255, 255, 255, 0.85)';
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.8)';
                card.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.12)';
                note.style.color = '#2c3e50';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.05)';
                block.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#2d3748';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
                statusBadge.style.color = '#2b6cb0';
            }
            if (slideCounter) {
                slideCounter.style.color = '#4a5568';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#718096';
            }
            if (themeBtn) {
                themeBtn.textContent = '🌓';
                themeBtn.title = 'Passer en mode nuit';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#2c3e50';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#2d3748';
                }
            });
        }
    }

    // Initialiser en mode jour
    document.addEventListener('DOMContentLoaded', function() {
        // Appliquer le mode jour par défaut
        const body = document.body;
        body.style.background = '#f0f4f8';
        body.style.color = '#1a202c';
        
        const appContainer = document.querySelector('.app-container');

            note.style.color = '#2c3e50';

        if (statusBadge) {

        }
        
        const slideCounter = document.querySelector('.slide-counter');
        if (slideCounter) {

        }
        
        const autoIndicator = document.querySelector('.auto-indicator');
        if (autoIndicator) {
            autoIndicator.style.color = '#718096';
        }
        
        document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
            if (!el.closest('.note-box')) {
                el.style.color = '#2c3e50';
            }
        });
        
        document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {

        const themeBtn = document.getElementById('themeToggle');
        if (themeBtn) {

    });
