<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Présentation mobile</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' },
            options: { skipHtmlTypes: 'script' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 500px;
        margin: 0 auto;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    .slide-header {
        flex-shrink: 0;
        padding: 18px 16px 10px 16px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        z-index: 10;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .slide-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
    }

    .content-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 18px 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        flex-shrink: 0;
    }

    .content-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .content-card li {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        line-height: 1.5;
    }

    .content-card li:last-child {
        border-bottom: none;
    }

    .bullet-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
    }

    .math-block {
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        overflow-x: auto;
        flex-shrink: 0;
        margin: 4px 0;
    }

    .math-block .math {
        font-size: 1.2rem;
        color: #e2e8f0;
    }

    .note-box {
        background: rgba(96, 165, 250, 0.08);
        border-left: 4px solid #60a5fa;
        padding: 12px 16px;
        border-radius: 12px;
        font-style: italic;
        font-size: 0.9rem;
        color: #cbd5e1;
        flex-shrink: 0;
    }

    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        border-radius: 0;
        flex-direction: column;
    }

    .loading-card {
        background: #1e293b;
        padding: 32px 28px;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #334155;
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px auto;
    }

    .loading-text {
        font-weight: 600;
        font-size: 1.1rem;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    .loading-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 16px;
    }
    .loading-progress {
        height: 3px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        animation: loadingProgress 30s ease-out forwards;
    }

    .loading-timeout {
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 12px;
    }

    .btn-cancel-loading {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 40px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #f87171;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }

    .btn-cancel-loading:active {
        transform: scale(0.94);
        background: rgba(239, 68, 68, 0.25);
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
    }

    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .slide-counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255,255,255,0.05);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(255,255,255,0.04);
    }

    .status-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 30px;
        background: rgba(96, 165, 250, 0.12);
        color: #93bbfc;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
    }

    .status-badge .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: pulse-dot 1.2s infinite;
        flex-shrink: 0;
    }

    .status-badge.idle .dot {
        animation: none;
        background: #64748b;
    }
    .status-badge.speaking .dot {
        background: #34d399;
        animation: pulse-dot 0.8s infinite;
    }
    .status-badge.error .dot {
        background: #f87171;
        animation: none;
    }
    .status-badge.paused .dot {
        animation: none;
        background: #fbbf24;
    }
    .status-badge.waiting .dot {
        animation: pulse-dot 1.5s infinite;
        background: #fbbf24;
    }
    .status-badge.loading .dot {
        animation: pulse-dot 0.5s infinite;
        background: #60a5fa;
    }

    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.7); }
    }

    .footer-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(255,255,255,0.1);
    }

    .btn-secondary {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-play {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
        min-width: 80px;
        justify-content: center;
    }
    .btn-play:active {
        background: rgba(52, 211, 153, 0.25);
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
    }

    .auto-indicator {
        font-size: 0.65rem;
        color: #64748b;
        text-align: center;
        letter-spacing: 0.3px;
        padding: 2px 0;
    }

    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.2rem;
        }
        .content-card li {
            font-size: 0.9rem;
            padding: 8px 0;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .btn-play {
            min-width: 60px;
        }
        .footer-buttons {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
        .loading-card {
            padding: 20px 16px;
        }
        .math-block .math {
            font-size: 1rem;
        }
    }

    @media (min-width: 600px) {
        .app-container {
            max-width: 480px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
        .loading-overlay {
            border-radius: 32px;
        }
    }

    /* Mode jour (par défaut) */
    html, body {
        background: #f0f4f8 !important;
        color: #1a202c !important;
    }
    .app-container {
        background: linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%) !important;
    }
    .slide-header {
        background: rgba(255, 255, 255, 0.85) !important;
        border-bottom: 1px solid rgba(0,0,0,0.08) !important;
    }
    .slide-header h1 {
        background: linear-gradient(135deg, #2b6cb0, #6b46c1) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        background-clip: text !important;
    }
    .slide-footer {
        background: rgba(255, 255, 255, 0.9) !important;
        border-top: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card {
        background: rgba(255,255,255,0.8) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card li {
        border-bottom: 1px solid rgba(0,0,0,0.05) !important;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.12) !important;
        border-left: 4px solid #4299e1 !important;
        color: #2c3e50 !important;
    }
    .math-block {
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .math-block .math {
        color: #2d3748 !important;
    }
    .slide-counter {
        color: #4a5568 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .status-badge {
        background: rgba(96, 165, 250, 0.15) !important;
        color: #2b6cb0 !important;
        border: 1px solid rgba(96, 165, 250, 0.15) !important;
    }
    .btn {
        color: #2d3748 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .btn-secondary {
        background: rgba(0,0,0,0.04) !important;
        border-color: rgba(0,0,0,0.08) !important;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15) !important;
        border-color: rgba(52, 211, 153, 0.2) !important;
        color: #38a169 !important;
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15) !important;
        border-color: rgba(251, 191, 36, 0.2) !important;
        color: #d69e2e !important;
    }
    .auto-indicator {
        color: #718096 !important;
    }
    .loading-card {
        background: #ffffff !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .loading-text {
        color: #1a202c !important;
    }
    .loading-sub {
        color: #4a5568 !important;
    }
</style>
</head>
<body>

<div class="app-container">

    <header class="slide-header">
        <h1 id="slideTitle">Chargement...</h1>
    </header>

    <main class="slide-body" id="slideBody"></main>

    <!-- LOADING OVERLAY AVEC BOUTON ANNULER -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Préparation vocale...</div>
            <div class="loading-sub" id="loadingSub">Synthèse en cours</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loadingProgressBar"></div>
            </div>
            <div class="loading-timeout" id="loadingTimeout">⏱️ 30 secondes maximum</div>
            <button class="btn-cancel-loading" id="cancelLoadingBtn">
                <span>✕</span> Annuler
            </button>
        </div>
    </div>

    <footer class="slide-footer">
        <div class="footer-top">
            <span class="slide-counter" id="slideCounter">1 / 3</span>
            <span class="status-badge idle" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">Prêt</span>
            </span>
        </div>

        <div class="footer-buttons">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-secondary" id="replayBtn">
                <span class="btn-icon">🔁</span> <span class="btn-label">Relire</span>
            </button>
            <button class="btn btn-play" id="playBtn">
                <span class="btn-icon">▶</span> <span class="btn-label">Play</span>
            </button>
        </div>

        <div class="auto-indicator" id="autoIndicator">⏸ Lecture manuelle</div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // SLIDES
    // ================================================================
    const slides = [
  {
    "titre": "L'inscription (register)",
    "contenu": "<div style='background: linear-gradient(135deg, #1e3c72, #2a5298); color: white; padding: 2rem; border-radius: 15px; text-align: center; margin-bottom: 1.5rem;'><h2 style='color: #fff; margin-bottom: 0.5rem;'>📝 L'inscription</h2><p style='color: #e0e0e0; font-size: 1.1rem;'>Créer un compte utilisateur en transaction</p><hr style='border-color: #4a7db0; width: 50%;'><p style='color: #f0f0f0;'>Leçon 3.6 : Enregistrement complet avec User + Profile + Wallet</p></div><p>L'inscription est le <strong>point d'entrée</strong> de tout utilisateur dans SawaMart. C'est une opération critique qui doit être <strong>atomique</strong> : soit tout réussit (utilisateur créé, profil créé, wallet créé), soit tout échoue. Sinon, on se retrouve avec des données incohérentes : un utilisateur sans wallet, un profil orphelin, etc. Dans cette leçon, nous allons construire une méthode <code>register</code> robuste, avec une <strong>transaction</strong> PostgreSQL.</p>",
    "texteParle": "Bonjour à toutes et à tous et bienvenue dans cette sixième leçon du chapitre trois. Aujourd'hui, nous allons construire la méthode d'inscription, ou register. C'est le point d'entrée de tout utilisateur dans SawaMart. C'est une opération critique, car elle crée trois entités en même temps : un utilisateur, son profil, et son wallet. Si une seule de ces créations échoue, on se retrouve avec des données incohérentes. Par exemple, un utilisateur sans wallet : il ne pourra jamais acheter ni vendre. Un profil orphelin : il pointe vers un utilisateur inexistant. Ce genre de bug est très difficile à corriger une fois en production. La solution, c'est une transaction PostgreSQL. Soit tout réussit, soit tout échoue. C'est ce que nous allons voir aujourd'hui. C'est parti.",
    "note": "Une inscription est une opération atomique. Trois entités créées ou aucune. Pas d'entre-deux."
  },
  {
    "titre": "Le parcours d'inscription",
    "contenu": "<div style='background: #f8f9fa; padding: 1.5rem; border-radius: 12px; border-left: 6px solid #2a5298;'><p style='color: #1e3c72; font-weight: bold; margin-top: 0;'>La méthode register fait 7 choses :</p><ol style='padding-left: 1.2rem; color: #333; line-height: 1.8;'><li>Vérifier l'unicité du <strong>téléphone</strong></li><li>Vérifier l'unicité du <strong>username</strong></li><li>Valider le numéro via le <strong>PhoneValidationService</strong></li><li>Hasher le <strong>mot de passe</strong> avec bcrypt</li><li><strong>Créer User + Profile + Wallet</strong> (transaction)</li><li><strong>Nettoyer l'OTP</strong> du cache</li><li><strong>Retourner</strong> l'utilisateur formaté</li></ol><div style='background: #d1ecf1; border-left: 4px solid #0c5460; padding: 0.8rem; border-radius: 4px; margin-top: 1rem;'><strong>💡 Point d'attention :</strong> l'ordre est important. On vérifie l'unicité AVANT la transaction, pour éviter de bloquer inutilement.</div></div>",
    "texteParle": "Détaillons le parcours d'inscription. La méthode register fait sept choses dans un ordre précis. Étape une : vérifier que le numéro de téléphone n'est pas déjà utilisé. Étape deux : vérifier que le nom d'utilisateur n'est pas déjà pris. Étape trois : valider le format du numéro de téléphone, avec notre PhoneValidationService qui vérifie l'opérateur et la regex. Étape quatre : hasher le mot de passe avec bcrypt. Étape cinq : créer trois entités en une transaction : User, UserProfile, et Wallet. Étape six : nettoyer l'OTP du cache, car il a été consommé. Étape sept : retourner l'utilisateur sous forme de DTO, sans le mot de passe. L'ordre est important. Les vérifications d'unicité et de format viennent en premier, car elles peuvent lever des exceptions sans avoir touché à la base. On évite ainsi d'ouvrir une transaction pour rien. Une transaction PostgreSQL prend un verrou, c'est une ressource rare. On ne veut pas la monopoliser pour une simple vérification d'unicité. Donc on vérifie d'abord, on écrit ensuite. C'est un principe classique en développement de base de données.",
    "note": "Vérifier avant d'écrire. Les vérifications ne nécessitent pas de transaction. Elles sont plus légères."
  },
  {
    "titre": "Vérifications préalables",
    "contenu": "<div style='background: #e9ecef; padding: 1rem; border-radius: 12px;'><p style='color: #333;'>Première partie de la méthode :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.68rem; line-height: 1.6; white-space: pre;'>async register(createUserDto: CreateUserDto): Promise&lt;UserResponseDto&gt; {<br>&nbsp;&nbsp;const { phone_number, username, password } = createUserDto;<br><br>&nbsp;&nbsp;<span style='color: #6a9955;'>// 1. Vérifier l'unicité du téléphone</span><br>&nbsp;&nbsp;const existingUserByPhone = await this.userRepository.findOne({<br>&nbsp;&nbsp;&nbsp;&nbsp;where: { phone_number },<br>&nbsp;&nbsp;});<br>&nbsp;&nbsp;if (existingUserByPhone) {<br>&nbsp;&nbsp;&nbsp;&nbsp;throw new ConflictException('Ce numéro est déjà utilisé');<br>&nbsp;&nbsp;}<br><br>&nbsp;&nbsp;<span style='color: #6a9955;'>// 2. Vérifier l'unicité du username</span><br>&nbsp;&nbsp;const existingUserByUsername = await this.userRepository.findOne({<br>&nbsp;&nbsp;&nbsp;&nbsp;where: { username },<br>&nbsp;&nbsp;});<br>&nbsp;&nbsp;if (existingUserByUsername) {<br>&nbsp;&nbsp;&nbsp;&nbsp;throw new ConflictException('Ce nom est déjà utilisé');<br>&nbsp;&nbsp;}<br><br>&nbsp;&nbsp;<span style='color: #6a9955;'>// 3. Valider le format du téléphone</span><br>&nbsp;&nbsp;const validation = await this.phoneValidationService.validatePhoneNumber(phone_number);<br>&nbsp;&nbsp;if (!validation.isValid) {<br>&nbsp;&nbsp;&nbsp;&nbsp;throw new BadRequestException(validation.error || 'Numéro non supporté');<br>&nbsp;&nbsp;}<br><br>&nbsp;&nbsp;<span style='color: #6a9955;'>// ...</span><br>}</div></div>",
    "texteParle": "Regardons la première partie de la méthode register. On récupère les données du DTO : phone_number, username, password. Première vérification : l'unicité du téléphone. On cherche un utilisateur en base avec ce numéro. Si on en trouve un, on lève une ConflictException, qui correspond à un statut HTTP 409. Le message est explicite : 'Ce numéro est déjà utilisé'. Deuxième vérification : l'unicité du username. Même logique. Si un utilisateur existe avec ce nom, on lève une ConflictException. Troisième vérification : la validation du format du numéro via PhoneValidationService. Cette méthode fait plusieurs choses. Elle vérifie que le numéro est au format E.164. Elle vérifie que c'est un numéro camerounais. Elle cherche quel opérateur (MTN, Orange) correspond au préfixe. Elle retourne un objet avec isValid, operator, gateway, formattedNumber, et éventuellement error. Si isValid est false, on lève une BadRequestException avec le message d'erreur. C'est mieux qu'une simple vérification de format, car ça nous dit aussi quel opérateur utiliser pour les dépôts. Trois vérifications avant d'écrire quoi que ce soit.",
    "note": "ConflictException = 409 (conflit, ressource existante). BadRequestException = 400 (données invalides)."
  },
  {
    "titre": "Hasher le mot de passe",
    "contenu": "<div style='background: #f8f9fa; padding: 1rem; border-radius: 12px; border-left: 6px solid #10b981;'><p style='color: #333;'>Suite de la méthode :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.7rem; line-height: 1.6; white-space: pre;'><span style='color: #6a9955;'>// 4. Hasher le mot de passe (bcrypt, ~100ms)</span><br>const hashedPassword = await this.hashPassword(password);<br><br><span style='color: #6a9955;'>// À partir d'ici, tout est prêt pour la transaction</span></div><p style='color: #333; margin-top: 0.8rem;'><strong>Pourquoi hasher AVANT la transaction ?</strong></p><ul style='padding-left: 1.2rem; color: #333; line-height: 1.7;'><li>🐢 bcrypt prend ~100ms (c'est voulu !)</li><li>🔒 Une transaction ne doit jamais rester ouverte aussi longtemps</li><li>💡 On hash avant, on stocke le hash dans la transaction</li></ul><div style='background: #fff3cd; border-left: 4px solid #856404; padding: 0.8rem; border-radius: 4px; margin-top: 1rem;'><strong>⚠️ Piège classique :</strong> ne jamais faire un appel bcrypt DANS une transaction. Cela bloque la base pendant 100ms à chaque inscription.</div></div>",
    "texteParle": "Quatrième étape de notre méthode : hasher le mot de passe. On appelle this.hashPassword avec le mot de passe en clair. Cette méthode, on l'a vue dans la leçon 3.3, utilise bcrypt pour générer un hash sécurisé. Elle prend environ cent millisecondes à s'exécuter. C'est voulu, c'est ce qui rend bcrypt résistant aux attaques. Mais c'est un point important : on hashe AVANT d'ouvrir la transaction. Pourquoi ? Parce qu'une transaction PostgreSQL prend un verrou sur les ressources. Si on garde ce verrou pendant cent millisecondes, on bloque potentiellement les autres inscriptions. Imaginez cent utilisateurs qui s'inscrivent en même temps : chacune attendrait cent millisecondes, soit un total de dix secondes. Ce serait un goulot d'étranglement majeur. Donc on hash en dehors de la transaction. C'est un piège classique : beaucoup de développeurs mettent tout dans une transaction, y compris les appels bcrypt. C'est une erreur de performance. La règle : dans une transaction, uniquement les opérations de base de données. Les appels réseau, les calculs, les hachages se font avant ou après. Maintenant que le hash est prêt, nous pouvons ouvrir la transaction.",
    "note": "Jamais de bcrypt dans une transaction. Le hash avant, la transaction rapide."
  },
  {
    "titre": "Créer la transaction",
    "contenu": "<div style='background: #e9ecef; padding: 1rem; border-radius: 12px;'><p style='color: #333;'>Créons le queryRunner pour la transaction :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.7rem; line-height: 1.6; white-space: pre;'><span style='color: #6a9955;'>// 5. Ouvrir une transaction</span><br>const queryRunner = this.dataSource.createQueryRunner();<br>await queryRunner.connect();<br>await queryRunner.startTransaction();<br><br>try {<br>&nbsp;&nbsp;<span style='color: #6a9955;'>// ... opérations DB</span><br>&nbsp;&nbsp;await queryRunner.commitTransaction();<br>} catch (error) {<br>&nbsp;&nbsp;await queryRunner.rollbackTransaction();<br>&nbsp;&nbsp;throw error;<br>} finally {<br>&nbsp;&nbsp;await queryRunner.release();<br>}</div><p style='color: #333; margin-top: 0.8rem;'><strong>Les 3 étapes clés :</strong></p><ul style='padding-left: 1.2rem; color: #333; line-height: 1.7;'><li>🚀 <code>startTransaction()</code> : ouvre la transaction</li><li>✅ <code>commitTransaction()</code> : valide si tout va bien</li><li>↩️ <code>rollbackTransaction()</code> : annule en cas d'erreur</li></ul></div>",
    "texteParle": "Créons maintenant la transaction. On utilise queryRunner, un objet qui gère une connexion isolée à la base. Trois étapes. D'abord, createQueryRunner pour créer le runner. Ensuite, connect pour établir la connexion. Enfin, startTransaction pour ouvrir la transaction. À partir de ce moment, toutes les opérations passent par ce runner, dans une seule transaction. On utilise un bloc try catch finally. Dans le try, on fait toutes les opérations de base de données. Si tout va bien, on appelle commitTransaction, qui valide définitivement les changements. Si une erreur survient, on appelle rollbackTransaction, qui annule tout ce qui a été fait dans la transaction. C'est cette annulation qui garantit l'atomicité : si la création du wallet échoue, l'utilisateur et le profil sont aussi annulés. Rien n'est laissé en base. Enfin, dans le finally, on appelle release, qui libère la connexion. C'est crucial : si on ne libère pas la connexion, elle reste bloquée dans le pool, et après quelques inscriptions, le pool est épuisé. C'est un bug classique avec les transactions mal gérées. Le pattern try catch finally est standard, retenez-le bien.",
    "note": "release() dans finally est crucial. Sans lui, le pool de connexions s'épuise après quelques transactions."
  },
  {
    "titre": "Créer l'utilisateur dans la transaction",
    "contenu": "<div style='background: #f8f9fa; padding: 1rem; border-radius: 12px; border-left: 6px solid #2a5298;'><p style='color: #333;'>Dans la transaction, on utilise le <code>manager</code> :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.68rem; line-height: 1.6; white-space: pre;'>try {<br>&nbsp;&nbsp;<span style='color: #6a9955;'>// 1. Créer l'utilisateur</span><br>&nbsp;&nbsp;const user = this.userRepository.create({<br>&nbsp;&nbsp;&nbsp;&nbsp;phone_number,<br>&nbsp;&nbsp;&nbsp;&nbsp;username,<br>&nbsp;&nbsp;&nbsp;&nbsp;password_hash: hashedPassword,<br>&nbsp;&nbsp;&nbsp;&nbsp;role: UserRole.USER,<br>&nbsp;&nbsp;&nbsp;&nbsp;is_verified: false,<br>&nbsp;&nbsp;&nbsp;&nbsp;verification_status: VerificationStatus.PENDING,<br>&nbsp;&nbsp;});<br><br>&nbsp;&nbsp;const savedUser = await queryRunner.manager.save(user);<br><br>&nbsp;&nbsp;<span style='color: #6a9955;'>// 2. Créer le profil</span><br>&nbsp;&nbsp;const profile = this.userProfileRepository.create({<br>&nbsp;&nbsp;&nbsp;&nbsp;user_id: savedUser.id,<br>&nbsp;&nbsp;});<br>&nbsp;&nbsp;await queryRunner.manager.save(profile);<br><br>&nbsp;&nbsp;<span style='color: #6a9955;'>// ...</span><br>}</div><p style='color: #555; font-size: 0.9rem; margin-top: 0.8rem;'>💡 Important : on utilise <code>queryRunner.manager.save()</code>, pas <code>this.userRepository.save()</code>.</p></div>",
    "texteParle": "Dans la transaction, on utilise le manager de queryRunner pour toutes les opérations. Pourquoi ? Parce que c'est lui qui est lié à la transaction. Si on utilise le repository standard, on sort de la transaction et on perd l'atomicité. C'est un piège classique : on ouvre une transaction, on utilise le repository, et on se retrouve avec des opérations qui ne sont pas dans la transaction. Donc ici, on appelle queryRunner.manager.save au lieu de this.userRepository.save. Première opération : créer l'utilisateur. On utilise this.userRepository.create, ce qui crée une instance non sauvegardée. Attention, create ne touche pas la base, c'est juste une fabrique d'objets. On lui passe les données : le numéro, le username, le hash du mot de passe, le rôle USER par défaut, is_verified false, et verification_status PENDING. Puis, on sauvegarde avec queryRunner.manager.save, qui écrit dans la base dans la transaction. On récupère l'utilisateur sauvegardé avec son ID généré. C'est cet ID qu'on utilise pour le profil et le wallet. Voilà la première étape.",
    "note": "queryRunner.manager.save dans une transaction. Jamais this.userRepository.save."
  },
  {
    "titre": "Créer le profil",
    "contenu": "<div style='background: #e9ecef; padding: 1rem; border-radius: 12px;'><p style='color: #333;'>Deuxième opération dans la transaction :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.7rem; line-height: 1.6; white-space: pre;'><span style='color: #6a9955;'>// 2. Créer le profil utilisateur</span><br>const profile = this.userProfileRepository.create({<br>&nbsp;&nbsp;user_id: savedUser.id,<br>&nbsp;&nbsp;<span style='color: #6a9955;'>// Pas de prénom/nom : ils seront ajoutés au KYC</span><br>});<br>await queryRunner.manager.save(profile);</div><p style='color: #333; margin-top: 0.8rem;'><strong>Pourquoi un profil vide ?</strong></p><ul style='padding-left: 1.2rem; color: #333; line-height: 1.7;'><li>📝 À l'inscription, on demande juste téléphone + username + mot de passe</li><li>🪪 Les informations personnelles (nom, CNI) sont collectées au KYC</li><li>🔗 Mais on crée le profil immédiatement pour pouvoir le mettre à jour plus tard</li><li>⚡ Le profil est vide mais lié : pas de problème d'orphelin</li></ul></div>",
    "texteParle": "Deuxième opération dans la transaction : créer le profil utilisateur. On utilise this.userProfileRepository.create, en lui passant uniquement user_id, qui est l'ID de l'utilisateur qu'on vient de sauvegarder. Le reste est vide. Pourquoi un profil vide ? Parce qu'à l'inscription, on ne demande que trois informations : téléphone, nom d'utilisateur, mot de passe. On ne demande pas le prénom, le nom, la date de naissance, la CNI. Ces informations sont collectées plus tard, à l'étape du KYC. Mais on crée quand même le profil maintenant, pour trois raisons. Premièrement, ça garantit qu'un utilisateur a toujours un profil, même vide. On évite les cas où il faudrait vérifier l'existence du profil avant chaque accès. Deuxièmement, ça évite les problèmes d'orphelins. Si on créait le profil plus tard, et que l'utilisateur se connectait entre-temps, on aurait un utilisateur sans profil. Troisièmement, c'est plus rapide à gérer : le jour où l'utilisateur soumet son KYC, on met simplement à jour le profil existant, au lieu de le créer. C'est une simplification. Une relation OneToOne est mieux gérée quand les deux côtés existent dès le départ.",
    "note": "Un profil vide est mieux qu'un profil absent. Évitez les relations OneToOne sans contrepartie."
  },
  {
    "titre": "Créer le wallet",
    "contenu": "<div style='background: #f8f9fa; padding: 1rem; border-radius: 12px; border-left: 6px solid #10b981;'><p style='color: #333;'>Troisième opération dans la transaction :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.7rem; line-height: 1.6; white-space: pre;'><span style='color: #6a9955;'>// 3. Créer le wallet</span><br>const wallet = queryRunner.manager.create(Wallet, {<br>&nbsp;&nbsp;user_id: savedUser.id,<br>&nbsp;&nbsp;balance: 0,<br>&nbsp;&nbsp;escrow_balance: 0,<br>&nbsp;&nbsp;is_active: true,<br>});<br>await queryRunner.manager.save(wallet);</div><p style='color: #333; margin-top: 0.8rem;'><strong>Rôle du wallet :</strong></p><ul style='padding-left: 1.2rem; color: #333; line-height: 1.7;'><li>💰 Stocker le solde disponible de l'utilisateur</li><li>🔒 Stocker le solde séquestré (commandes en cours)</li><li>📊 Comptabiliser les totaux (dépôts, retraits, gains, dépenses)</li></ul><div style='background: #d1ecf1; border-left: 4px solid #0c5460; padding: 0.8rem; border-radius: 4px; margin-top: 1rem;'><strong>💡 Note :</strong> on utilise <code>queryRunner.manager.create(Wallet, ...)</code> car Wallet n'est pas injecté comme repository dans AuthService.</div></div>",
    "texteParle": "Troisième opération dans la transaction : créer le wallet. Ici, on utilise queryRunner.manager.create avec la classe Wallet directement. Pourquoi ne pas utiliser this.walletRepository ? Parce que Wallet n'est pas injecté comme repository dans AuthService. On a deux approches possibles : soit injecter WalletRepository, soit utiliser queryRunner.manager.create avec la classe. La deuxième est plus simple dans ce contexte, car elle évite d'injecter une dépendance supplémentaire juste pour une création. C'est une question de préférence. Ici, on crée le wallet avec user_id, balance zéro, escrow_balance zéro, et is_active true. Un nouveau wallet est vide mais actif. C'est l'état attendu pour un nouvel utilisateur. Le wallet servira pour toutes les opérations financières : dépôts, retraits, séquestres, gains, dépenses. Sans wallet, l'utilisateur ne peut rien faire dans SawaMart. C'est pour ça qu'on le crée dès l'inscription. On pourrait le créer à la première transaction, mais ce serait moins propre : il faudrait vérifier à chaque fois si le wallet existe. Là, il existe toujours. C'est un gain de simplicité pour tous les autres modules.",

  {
    "titre": "Commit et retour",
    "contenu": "<div style='background: #e9ecef; padding: 1rem; border-radius: 12px;'><p style='color: #333;'>Fin de la transaction :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.68rem; line-height: 1.6; white-space: pre;'><span style='color: #6a9955;'>// 4. Commit de la transaction</span><br>await queryRunner.commitTransaction();<br><br><span style='color: #6a9955;'>// 5. Nettoyer l'OTP</span><br>this.otpService.clearOtp(phone_number);<br><br><span style='color: #6a9955;'>// 6. Recharger l'utilisateur avec ses relations</span><br>const finalUser = await this.userRepository.findOne({<br>&nbsp;&nbsp;where: { id: savedUser.id },<br>&nbsp;&nbsp;relations: { profile: true, wallet: true },<br>});<br><br>&nbsp;&nbsp;if (!finalUser) {<br>&nbsp;&nbsp;&nbsp;&nbsp;throw new InternalServerErrorException('Erreur de chargement');<br>&nbsp;&nbsp;}<br><br>&nbsp;&nbsp;<span style='color: #6a9955;'>// 7. Retourner</span><br>&nbsp;&nbsp;return UserResponseDto.fromUser(finalUser);</div></div>",
    "texteParle": "On arrive à la fin de la transaction. Étape quatre : commit. On appelle queryRunner.commitTransaction, ce qui valide définitivement les trois insertions : utilisateur, profil, wallet. C'est l'instant de vérité : à partir de maintenant, les données sont persistées. Étape cinq : nettoyer l'OTP. On appelle otpService.clearOtp avec le numéro de téléphone. C'est important : une fois l'inscription réussie, l'OTP a été consommé. On le supprime du cache pour qu'il ne puisse pas être réutilisé. Étape six : recharger l'utilisateur avec ses relations. On utilise findOne avec relations profile et wallet. Cela permet de charger l'utilisateur et de remplir les objets profile et wallet. Si on ne rechargeait pas, le savedUser aurait les propriétés profile et wallet vides, car on ne les a pas hydratées. Étape sept : on vérifie que l'utilisateur est bien chargé, sinon on lève une InternalServerErrorException. C'est une sécurité : si ce rechargement échoue, quelque chose de grave s'est passé. Enfin, on retourne UserResponseDto.fromUser, qui convertit l'utilisateur en un objet DTO propre, sans le mot de passe.",
    "note": "clearOtp APRÈS le commit. Si le commit échoue, l'utilisateur peut réessayer avec le même OTP."
  },
  {
    "titre": "Le catch et le rollback",
    "contenu": "<div style='background: #f8f9fa; padding: 1rem; border-radius: 12px; border-left: 6px solid #dc3545;'><p style='color: #333;'>Gestion des erreurs :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.7rem; line-height: 1.6; white-space: pre;'>} catch (error) {<br>&nbsp;&nbsp;await queryRunner.rollbackTransaction();<br>&nbsp;&nbsp;throw error;<br>} finally {<br>&nbsp;&nbsp;await queryRunner.release();<br>}</div><p style='color: #333; margin-top: 0.8rem;'><strong>Ce qui se passe en cas d'erreur :</strong></p><ol style='padding-left: 1.2rem; color: #333; line-height: 1.7;'><li>❌ Une exception est levée dans le try</li><li>↩️ <code>rollbackTransaction()</code> annule TOUT</li><li>🔁 L'erreur originale est relancée au client</li><li>🔓 <code>release()</code> libère la connexion dans le finally</li></ol><div style='background: #fff3cd; border-left: 4px solid #856404; padding: 0.8rem; border-radius: 4px; margin-top: 1rem;'><strong>💡 Que se passe-t-il côté base ?</strong> Aucune des trois insertions n'est conservée. La base reste exactement comme avant.</div></div>",
    "texteParle": "Regardons maintenant le catch et le finally. Si une exception est levée à n'importe quel moment dans le try, on tombe dans le catch. On appelle queryRunner.rollbackTransaction, qui annule toutes les opérations de la transaction. Imaginez qu'on ait créé l'utilisateur, puis le profil, et que la création du wallet échoue. Le rollback annule les trois insertions. La base revient à son état initial, comme si rien ne s'était passé. C'est la beauté d'ACID : atomicité, cohérence. On relance ensuite l'erreur avec throw, pour que le client reçoive le message d'erreur approprié. Puis, dans le finally, on appelle queryRunner.release pour libérer la connexion. Ce finally s'exécute toujours, que ce soit en cas de succès ou d'erreur. C'est essentiel : si on ne libérait pas la connexion, elle resterait bloquée indéfiniment. Après quelques inscriptions ratées, le pool de connexions serait épuisé, et l'application serait paralysée. Cette gestion d'erreur en trois blocs try catch finally est un pattern standard. Retenez-le bien, vous l'utiliserez à chaque fois que vous ferez une transaction.",
    "note": "Le rollback annule TOUT, pas seulement la dernière opération. C'est la force d'ACID."
  },

    "contenu": "<div style='background: linear-gradient(135deg, #1e3c72, #2a5298); color: white; padding: 2rem; border-radius: 15px; text-align: center;'><h3 style='color: #fff;'>🎉 Inscription maîtrisée !</h3><p style='color: #e0e0e0;'>Vous savez créer un compte utilisateur en toute sécurité.</p><hr style='border-color: #4a7db0; width: 50%;'><p style='color: #f0f0f0; margin-bottom: 0.5rem;'>Ce que nous avons appris :</p><ul style='text-align: left; padding-left: 1.5rem; color: #f0f0f0; line-height: 1.8;'><li>✅ Pourquoi l'inscription doit être atomique</li><li>✅ Les 7 étapes de la méthode register</li><li>✅ Vérifications avant transaction (unicité, format)</li><li>✅ Hasher AVANT la transaction</li><li>✅ Créer User + Profile + Wallet en une transaction</li><li>✅ Utiliser queryRunner.manager.save</li><li>✅ Le pattern try catch finally</li><li>✅ Nettoyer l'OTP après commit</li></ul><p style='color: #f0f0f0; margin-top: 1rem;'>👉 <strong>Prochaine leçon :</strong> Connexion (login) avec anti-brute-force</p></div>",
    "texteParle": "Résumons cette leçon. Nous avons compris pourquoi l'inscription doit être atomique : trois entités doivent être créées ou aucune. Nous avons détaillé les sept étapes de la méthode register : vérifier l'unicité du téléphone, du username, valider le format, hasher le mot de passe, créer les trois entités en transaction, nettoyer l'OTP, retourner l'utilisateur. Nous avons insisté sur l'ordre : les vérifications et le hash se font AVANT d'ouvrir la transaction, pour ne pas bloquer la base inutilement. Nous avons appris à utiliser queryRunner.manager.save dans une transaction, au lieu du repository standard, sinon on perd l'atomicité. Nous avons vu le pattern try catch finally avec commit, rollback, et release. Nous avons nettoyé l'OTP après le commit, pour empêcher le rejeu. Cette méthode register est un exemple complet de ce qu'on appelle une opération métier complexe : plusieurs vérifications, plusieurs entités, une transaction, une gestion d'erreur. C'est un pattern que vous retrouverez partout dans SawaMart : dans le paiement, dans la résolution de litige, dans le dépôt, dans le retrait. Dans la prochaine leçon, nous allons passer à la connexion, avec le mécanisme anti-brute-force. À très bientôt !",

];

    // ================================================================

    function setStatus(text, type) {
        $statusText.text(text);
        $statusBadge.removeClass('idle speaking error paused waiting loading');
        if (type === 'speaking') $statusBadge.addClass('speaking');
        else if (type === 'error') $statusBadge.addClass('error');
        else if (type === 'paused') $statusBadge.addClass('paused');
        else if (type === 'waiting') $statusBadge.addClass('waiting');
        else if (type === 'loading') $statusBadge.addClass('loading');
        else $statusBadge.addClass('idle');
    }

    function updatePlayButton() {
        if (isPlaying) {
            $play.addClass('playing');
            $play.find('.btn-icon').text('⏸');
            $play.find('.btn-label').text('Pause');
        } else {
            $play.removeClass('playing');
            $play.find('.btn-icon').text('▶');
            $play.find('.btn-label').text('Play');
        }
    }

    function showLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        
        loadingCancelled = false;
        isLoading = true;
        
        // Réinitialiser la barre de progression
        $loadingProgressBar.css('animation', 'none');
        $loadingProgressBar.css('width', '0%');
        // Forcer un reflow
        $loadingProgressBar[0].offsetHeight;
        $loadingProgressBar.css('animation', 'loadingProgress 30s ease-out forwards');
        
        $loadingText.text('Préparation vocale...');
        $loadingSub.text('Synthèse en cours');
        $loadingTimeout.text('⏱️ 30 secondes maximum');
        $loading.fadeIn(300);
        setStatus("⏳ Chargement...", 'loading');
        
        // 🔥 TIMEOUT DE 30 SECONDES
        loadingTimeout = setTimeout(() => {
            if (isLoading && !loadingCancelled) {
                hideLoading();
                setStatus("⚠️ Délai dépassé (30s)", 'error');
                isPlaying = false;
                updatePlayButton();
                $loadingSub.text('La synthèse vocale a pris trop de temps');
                $loadingTimeout.text('❌ Délai dépassé');
            }
        }, 30000);
    }

    function hideLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        isLoading = false;
        loadingCancelled = false;
        $loading.fadeOut(300);
        // Ne pas changer le statut si on est en train de parler
        if (!isSpeaking && !isPlaying) {
            setStatus("⏸ Lecture arrêtée", 'paused');
        }
    }

    function cancelLoading() {
        loadingCancelled = true;
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        hideLoading();
        stopSpeaking();
        setStatus("⏸ Annulé", 'paused');
        isPlaying = false;
        updatePlayButton();
        $loadingText.text('Annulé par l\'utilisateur');
        $loadingSub.text('Vous pouvez réessayer');
        $loadingTimeout.text('✕ Annulation');
    }

    // Arrêter la parole proprement
    function stopSpeaking() {
        try {
            if (synth && (synth.speaking || synth.pending)) {
                synth.cancel();
            }
        } catch(e) {
            console.warn('Erreur stopSpeaking:', e);
        }
        if (currentUtterance) {
            try {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance.onstart = null;
            } catch(e) {}
            currentUtterance = null;
        }
        isSpeaking = false;
        isPlaying = false;
        updatePlayButton();
    }

    // Mettre en pause la parole
    function pauseSpeaking() {
        try {
            if (synth && synth.speaking) {
                synth.pause();
                isPaused = true;
                isPlaying = false;
                setStatus("⏸ Lecture en pause", 'paused');
                updatePlayButton();
            }
        } catch(e) {
            console.warn('Erreur pauseSpeaking:', e);
            stopSpeaking();
        }
    }

    // Reprendre la parole
    function resumeSpeaking() {
        try {
            if (synth && synth.paused) {
                synth.resume();
                isPaused = false;
                isPlaying = true;
                setStatus("🔊 Lecture en cours", 'speaking');
                updatePlayButton();
            } else if (!isSpeaking && !synth.speaking && !synth.pending) {
                speakSlide(currentIndex);
            }
        } catch(e) {
            console.warn('Erreur resumeSpeaking:', e);
            speakSlide(currentIndex);
        }
    }

    function renderSlide(index) {
        const slide = slides[index];
        $title.text(slide.titre);

        let html = '';
        html += `<div class="content-card">${slide.contenu}</div>`;
        if (slide.note) {
            html += `<div class="note-box">${slide.note}</div>`;
        }
        $body.html(html);
        $counter.text(`${index+1} / ${total}`);

        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
        }
    }

    // ================================================================
    // LECTURE VOCALE
    // ================================================================
    function speakSlide(index) {
        return new Promise((resolve) => {
            const slide = slides[index];
            const text = slide.texteParle;
            
            if (!text || text.trim() === '' || !speechSupported) {
                resolve();
                return;
            }

            if (!window.speechSynthesis) {
                setStatus("❌ Synthèse vocale non supportée", 'error');
                speechSupported = false;
                resolve();
                return;
            }

            // Arrêter toute lecture en cours
            stopSpeaking();
            
            // Réinitialiser l'état de pause
            isPaused = false;
            
            showLoading();
            setStatus("Initialisation...", 'loading');

            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.92;
                utterance.pitch = 1.05;
                utterance.volume = 1;

                let isFinished = false;
                let errorHandled = false;

                utterance.onstart = function() {
                    if (loadingCancelled) {
                        stopSpeaking();
                        resolve();
                        return;
                    }
                    hideLoading();
                    isSpeaking = true;
                    isPlaying = true;
                    isPaused = false;
                    setStatus("🔊 Lecture en cours", 'speaking');
                    updatePlayButton();
                };

                utterance.onend = function() {
                    if (isFinished) return;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    setStatus("✅ Terminé", 'idle');
                    hideLoading();
                    updatePlayButton();
                    resolve();
                };

                utterance.onerror = function(e) {
                    if (isFinished || errorHandled) return;
                    errorHandled = true;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    hideLoading();
                    updatePlayButton();
                    
                    if (e.error === 'not-allowed') {
                        setStatus("⚠️ Permission refusée", 'error');
                    } else if (e.error === 'synthesis-unavailable') {
                        setStatus("⚠️ Synthèse indisponible", 'error');
                    } else if (e.error === 'canceled') {
                        setStatus("⏸ Annulé", 'paused');
                    } else {
                        setStatus("❌ Erreur audio: " + (e.error || 'inconnue'), 'error');
                    }
                    
                    resolve();
                };

                // Gestion du chargement des voix
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = function() {
                        if (!loadingCancelled) {
                            try {
                                synth.speak(utterance);
                            } catch(err) {
                                // Silencieux
                            }
                        }
                        synth.onvoiceschanged = null;
                    };
                }

                currentUtterance = utterance;
                
                if (!loadingCancelled) {
                    try {
                        synth.speak(utterance);
                    } catch(err) {
                        setTimeout(() => {
                            if (!loadingCancelled) {
                                try {
                                    synth.speak(utterance);
                                } catch(e) {
                                    setStatus("❌ Erreur de lecture", 'error');
                                    isPlaying = false;
                                    updatePlayButton();
                                    hideLoading();
                                    resolve();
                                }
                            } else {
                                resolve();
                            }
                        }, 100);
                    }
                } else {
                    resolve();
                }

            } catch(err) {
                hideLoading();
                setStatus("❌ Erreur générale", 'error');
                isPlaying = false;
                updatePlayButton();
                console.error('Erreur speakSlide:', err);
                resolve();
            }
        });
    }

    // ================================================================
    // NAVIGATION
    // ================================================================
    async function goToSlide(index) {
        if (isTransitioning) return;
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        
        // Si on est en train de lire, on met en pause avant de naviguer
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        // Arrêter complètement la lecture
        stopSpeaking();
        
        await new Promise(r => setTimeout(r, 50));
        
        if (index === currentIndex) {
            setStatus("📄 Slide actuel", 'idle');
            return;
        }

        isTransitioning = true;
        currentIndex = index;
        renderSlide(index);
        
        // Réinitialiser l'état de lecture
        isPlaying = false;
        updatePlayButton();
        setStatus("⏸ Lecture arrêtée", 'paused');

        await new Promise(r => setTimeout(r, 150));
        isTransitioning = false;
    }

    async function goToNext() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex + 1 < total) {
            await goToSlide(currentIndex + 1);
        } else {
            setStatus("🏁 Dernier slide", 'idle');
        }
    }

    async function goToPrev() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex - 1 >= 0) {
            await goToSlide(currentIndex - 1);
        } else {
            setStatus("🔁 Premier slide", 'idle');
        }
    }

    // ================================================================
    // GESTION PLAY/PAUSE
    // ================================================================
    function togglePlay() {
        if (!userInteracted) {
            userInteracted = true;
        }

        // Si le chargement est en cours, on l'annule
        if (isLoading) {
            cancelLoading();
            return;
        }

        // Si le synthétiseur est en pause, on reprend
        if (synth && synth.paused) {
            resumeSpeaking();
            return;
        }

        // Si la lecture est en cours, on met en pause
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
            return;
        }

        // Sinon, on démarre la lecture du slide courant
        if (!isSpeaking && !isPlaying) {
            stopSpeaking();
            speakSlide(currentIndex);
        }
    }

    // ================================================================
    // INIT
    // ================================================================
    async function init() {
        // Vérifier la compatibilité
        if (!window.speechSynthesis) {
            setStatus("❌ Synthèse vocale non supportée", 'error');
            speechSupported = false;
        }

        // Précharger les voix
        try {
            if (synth.getVoices) {
                synth.getVoices();
                setTimeout(() => {
                    try {
                        synth.getVoices();
                    } catch(e) {}
                }, 200);
            }
        } catch(e) {
            console.warn('Erreur chargement voix:', e);
        }

        // Afficher le premier slide
        renderSlide(0);
        $counter.text(`1 / ${total}`);
        
        // État initial
        setStatus("⏸ Appuie sur Play", 'paused');
        updatePlayButton();
        $autoIndicator.text('⏸ Lecture manuelle');

        // ================================================================
        // ÉVÉNEMENTS
        // ================================================================
        
        // Bouton Play/Pause
        $play.on('click', function() {
            togglePlay();
        });

        // Bouton Annuler le chargement
        $cancelLoading.on('click', function() {
            cancelLoading();
        });

        // Navigation
        $prev.on('click', function() {
            // Si chargement en cours, on annule
            if (isLoading) cancelLoading();
            goToPrev();
        });

        $next.on('click', function() {
            if (isLoading) cancelLoading();
            goToNext();
        });

        // Replay - relire le slide courant
        $replay.on('click', function() {
            if (isLoading) cancelLoading();
            stopSpeaking();
            setTimeout(() => {
                speakSlide(currentIndex);
            }, 100);
        });

        // Support du clavier (espace pour play/pause)
        $(document).on('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });

        // Nettoyage
        $(window).on('beforeunload', function() {
            try {
                if (synth.speaking) synth.cancel();
            } catch(e) {}
            hideLoading();
        });

        // Gérer les cas où la synthèse se termine de manière inattendue
        setInterval(() => {
            if (isPlaying && !synth.speaking && !synth.pending && !isPaused && !isLoading) {
                isPlaying = false;
                updatePlayButton();
                setStatus("⏸ Lecture arrêtée", 'paused');
            }
        }, 1000);
    }

    init();
});



    // ================================================================
    // GESTION DU THÈME JOUR/NUIT
    // ================================================================
    let isDarkMode = false;

    function toggleTheme() {
        isDarkMode = !isDarkMode;
        const body = document.body;
        const appContainer = document.querySelector('.app-container');
        const header = document.querySelector('.slide-header');
        const footer = document.querySelector('.slide-footer');
        const contentCards = document.querySelectorAll('.content-card');
        const noteBoxes = document.querySelectorAll('.note-box');
        const mathBlocks = document.querySelectorAll('.math-block');
        const buttons = document.querySelectorAll('.btn');
        const statusBadge = document.querySelector('.status-badge');
        const slideCounter = document.querySelector('.slide-counter');
        const autoIndicator = document.querySelector('.auto-indicator');
        const themeBtn = document.getElementById('themeToggle');

        if (isDarkMode) {
            // Mode nuit
            body.style.background = '#0b1120';
            body.style.color = '#f1f5f9';
            appContainer.style.background = 'linear-gradient(145deg, #0f172a 0%, #1e293b 100%)';
            header.style.background = 'rgba(15, 23, 42, 0.85)';
            footer.style.background = 'rgba(15, 23, 42, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.05)';
                card.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.08)';
                note.style.color = '#cbd5e1';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.25)';
                block.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#e2e8f0';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.12)';
                statusBadge.style.color = '#93bbfc';
            }
            if (slideCounter) {
                slideCounter.style.color = '#94a3b8';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#64748b';
            }
            if (themeBtn) {
                themeBtn.textContent = '☀️';
                themeBtn.title = 'Passer en mode jour';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#e2e8f0';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#e2e8f0';
                }
            });
        } else {
            // Mode jour (par défaut)
            body.style.background = '#f0f4f8';
            body.style.color = '#1a202c';
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
            header.style.background = 'rgba(255, 255, 255, 0.85)';
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.8)';
                card.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.12)';
                note.style.color = '#2c3e50';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.05)';
                block.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#2d3748';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
                statusBadge.style.color = '#2b6cb0';
            }
            if (slideCounter) {
                slideCounter.style.color = '#4a5568';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#718096';
            }
            if (themeBtn) {
                themeBtn.textContent = '🌓';
                themeBtn.title = 'Passer en mode nuit';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#2c3e50';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#2d3748';
                }
            });
        }
    }

    // Initialiser en mode jour
    document.addEventListener('DOMContentLoaded', function() {
        // Appliquer le mode jour par défaut
        const body = document.body;
        body.style.background = '#f0f4f8';
        body.style.color = '#1a202c';
        
        const appContainer = document.querySelector('.app-container');
        if (appContainer) {
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
        }
        
        const header = document.querySelector('.slide-header');
        if (header) {
            header.style.background = 'rgba(255, 255, 255, 0.85)';
        }
        
        const footer = document.querySelector('.slide-footer');
        if (footer) {
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
        }
        
        document.querySelectorAll('.content-card').forEach(card => {
            card.style.background = 'rgba(255,255,255,0.8)';
            card.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.note-box').forEach(note => {
            note.style.background = 'rgba(96, 165, 250, 0.12)';
            note.style.color = '#2c3e50';
        });
        
        document.querySelectorAll('.math-block').forEach(block => {
            block.style.background = 'rgba(0,0,0,0.05)';
            block.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.btn').forEach(btn => {
            btn.style.color = '#2d3748';
        });
        
        const statusBadge = document.querySelector('.status-badge');
        if (statusBadge) {
            statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
            statusBadge.style.color = '#2b6cb0';
        }
        
        const slideCounter = document.querySelector('.slide-counter');
        if (slideCounter) {
            slideCounter.style.color = '#4a5568';
        }
        
        const autoIndicator = document.querySelector('.auto-indicator');
        if (autoIndicator) {
            autoIndicator.style.color = '#718096';
        }
        
        document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {

            }
        });
        
        document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
            if (!el.closest('.note-box') && !el.closest('.math-block')) {
                el.style.color = '#2d3748';

        });
        
        const themeBtn = document.getElementById('themeToggle');
        if (themeBtn) {
            themeBtn.textContent = '🌓';
            themeBtn.title = 'Passer en mode nuit';
        }
    });
</script>
