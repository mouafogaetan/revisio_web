<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Présentation mobile</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' },
            options: { skipHtmlTypes: 'script' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 500px;
        margin: 0 auto;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    .slide-header {
        flex-shrink: 0;
        padding: 18px 16px 10px 16px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        z-index: 10;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .slide-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
    }

    .content-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 18px 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        flex-shrink: 0;
    }

    .content-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .content-card li {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        line-height: 1.5;
    }

    .content-card li:last-child {
        border-bottom: none;
    }

    .bullet-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
    }

    .math-block {
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        overflow-x: auto;
        flex-shrink: 0;
        margin: 4px 0;
    }

    .math-block .math {
        font-size: 1.2rem;
        color: #e2e8f0;
    }

    .note-box {
        background: rgba(96, 165, 250, 0.08);
        border-left: 4px solid #60a5fa;
        padding: 12px 16px;
        border-radius: 12px;
        font-style: italic;
        font-size: 0.9rem;
        color: #cbd5e1;
        flex-shrink: 0;
    }

    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        border-radius: 0;
        flex-direction: column;
    }

    .loading-card {
        background: #1e293b;
        padding: 32px 28px;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #334155;
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px auto;
    }

    .loading-text {
        font-weight: 600;
        font-size: 1.1rem;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    .loading-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 16px;
    }
    .loading-progress {
        height: 3px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        animation: loadingProgress 30s ease-out forwards;
    }

    .loading-timeout {
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 12px;
    }

    .btn-cancel-loading {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 40px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #f87171;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }

    .btn-cancel-loading:active {
        transform: scale(0.94);
        background: rgba(239, 68, 68, 0.25);
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
    }

    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .slide-counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255,255,255,0.05);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(255,255,255,0.04);
    }

    .status-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 30px;
        background: rgba(96, 165, 250, 0.12);
        color: #93bbfc;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
    }

    .status-badge .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: pulse-dot 1.2s infinite;
        flex-shrink: 0;
    }

    .status-badge.idle .dot {
        animation: none;
        background: #64748b;
    }
    .status-badge.speaking .dot {
        background: #34d399;
        animation: pulse-dot 0.8s infinite;
    }
    .status-badge.error .dot {
        background: #f87171;
        animation: none;
    }
    .status-badge.paused .dot {
        animation: none;
        background: #fbbf24;
    }
    .status-badge.waiting .dot {
        animation: pulse-dot 1.5s infinite;
        background: #fbbf24;
    }
    .status-badge.loading .dot {
        animation: pulse-dot 0.5s infinite;
        background: #60a5fa;
    }

    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.7); }
    }

    .footer-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(255,255,255,0.1);
    }

    .btn-secondary {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-play {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
        min-width: 80px;
        justify-content: center;
    }
    .btn-play:active {
        background: rgba(52, 211, 153, 0.25);
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
    }

    .auto-indicator {
        font-size: 0.65rem;
        color: #64748b;
        text-align: center;
        letter-spacing: 0.3px;
        padding: 2px 0;
    }

    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.2rem;
        }
        .content-card li {
            font-size: 0.9rem;
            padding: 8px 0;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .btn-play {
            min-width: 60px;
        }
        .footer-buttons {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
        .loading-card {
            padding: 20px 16px;
        }
        .math-block .math {
            font-size: 1rem;
        }
    }

    @media (min-width: 600px) {
        .app-container {
            max-width: 480px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
        .loading-overlay {
            border-radius: 32px;
        }
    }

    /* Mode jour (par défaut) */
    html, body {
        background: #f0f4f8 !important;
        color: #1a202c !important;
    }
    .app-container {
        background: linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%) !important;
    }
    .slide-header {
        background: rgba(255, 255, 255, 0.85) !important;
        border-bottom: 1px solid rgba(0,0,0,0.08) !important;
    }
    .slide-header h1 {
        background: linear-gradient(135deg, #2b6cb0, #6b46c1) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        background-clip: text !important;
    }
    .slide-footer {
        background: rgba(255, 255, 255, 0.9) !important;
        border-top: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card {
        background: rgba(255,255,255,0.8) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card li {
        border-bottom: 1px solid rgba(0,0,0,0.05) !important;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.12) !important;
        border-left: 4px solid #4299e1 !important;
        color: #2c3e50 !important;
    }
    .math-block {
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .math-block .math {
        color: #2d3748 !important;
    }
    .slide-counter {
        color: #4a5568 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .status-badge {
        background: rgba(96, 165, 250, 0.15) !important;
        color: #2b6cb0 !important;
        border: 1px solid rgba(96, 165, 250, 0.15) !important;
    }
    .btn {
        color: #2d3748 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .btn-secondary {
        background: rgba(0,0,0,0.04) !important;
        border-color: rgba(0,0,0,0.08) !important;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15) !important;
        border-color: rgba(52, 211, 153, 0.2) !important;
        color: #38a169 !important;
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15) !important;
        border-color: rgba(251, 191, 36, 0.2) !important;
        color: #d69e2e !important;
    }
    .auto-indicator {
        color: #718096 !important;
    }
    .loading-card {
        background: #ffffff !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .loading-text {
        color: #1a202c !important;
    }
    .loading-sub {
        color: #4a5568 !important;
    }
</style>
</head>
<body>

<div class="app-container">

    <header class="slide-header">
        <h1 id="slideTitle">Chargement...</h1>
    </header>

    <main class="slide-body" id="slideBody"></main>

    <!-- LOADING OVERLAY AVEC BOUTON ANNULER -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Préparation vocale...</div>
            <div class="loading-sub" id="loadingSub">Synthèse en cours</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loadingProgressBar"></div>
            </div>
            <div class="loading-timeout" id="loadingTimeout">⏱️ 30 secondes maximum</div>
            <button class="btn-cancel-loading" id="cancelLoadingBtn">
                <span>✕</span> Annuler
            </button>
        </div>
    </div>

    <footer class="slide-footer">
        <div class="footer-top">
            <span class="slide-counter" id="slideCounter">1 / 3</span>
            <span class="status-badge idle" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">Prêt</span>
            </span>
        </div>

        <div class="footer-buttons">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-secondary" id="replayBtn">
                <span class="btn-icon">🔁</span> <span class="btn-label">Relire</span>
            </button>
            <button class="btn btn-play" id="playBtn">
                <span class="btn-icon">▶</span> <span class="btn-label">Play</span>
            </button>
        </div>

        <div class="auto-indicator" id="autoIndicator">⏸ Lecture manuelle</div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // SLIDES
    // ================================================================
    const slides = [
  {
    "titre": "RolesGuard et @Roles()",
    "contenu": "<div style='background: linear-gradient(135deg, #1e3c72, #2a5298); color: white; padding: 2rem; border-radius: 15px; text-align: center; margin-bottom: 1.5rem;'><h2 style='color: #fff; margin-bottom: 0.5rem;'>🎭 RolesGuard et @Roles()</h2><p style='color: #e0e0e0; font-size: 1.1rem;'>Autorisation basée sur les rôles</p><hr style='border-color: #4a7db0; width: 50%;'><p style='color: #f0f0f0;'>Leçon 3.10 : Contrôler qui peut accéder à quoi</p></div><p>Dans la leçon précédente, nous avons appris à vérifier <strong>qui est</strong> l'utilisateur (authentification). Maintenant, nous allons apprendre à vérifier <strong>ce qu'il a le droit de faire</strong> (autorisation). C'est le rôle du <code>RolesGuard</code> : il lit les rôles autorisés sur une route, et refuse les utilisateurs qui n'ont pas le bon rôle. Combiné au décorateur <code>@Roles()</code>, il permet de protéger finement les endpoints admin, assistant, ou comptable.</p>",
    "texteParle": "Bonjour à toutes et à tous et bienvenue dans cette dixième leçon du chapitre trois. Aujourd'hui, nous allons parler d'autorisation. Dans la leçon précédente, nous avons appris à vérifier qui est l'utilisateur grâce à l'authentification JWT. Le JwtAuthGuard garantit que l'utilisateur a un token valide. Mais ça ne suffit pas. Il faut aussi vérifier ce qu'il a le droit de faire. Par exemple, un utilisateur normal ne doit pas pouvoir accéder aux endpoints admin. Un assistant ne doit pas pouvoir valider des dépôts. Un comptable ne doit pas pouvoir valider des articles. C'est là qu'intervient le contrôle d'accès basé sur les rôles, ou RBAC, Role-Based Access Control. Nous allons mettre en place deux éléments : le décorateur Roles, qui marque une route avec les rôles autorisés, et le RolesGuard, qui vérifie ces rôles à chaque requête. C'est une leçon cruciale pour la sécurité de notre plateforme. C'est parti.",
    "note": "Authentification : qui es-tu ? Autorisation : qu'as-tu le droit de faire ? Les deux sont différents."
  },
  {
    "titre": "Rappel : les 4 rôles de SawaMart",
    "contenu": "<div style='background: #f8f9fa; padding: 1.5rem; border-radius: 12px; border-left: 6px solid #2a5298;'><p style='color: #1e3c72; font-weight: bold; margin-top: 0;'>SawaMart a 4 rôles utilisateurs :</p><div style='display: flex; flex-direction: column; gap: 0.7rem; margin-top: 1rem;'><div style='background: #d1ecf1; padding: 0.9rem; border-radius: 8px; border-left: 4px solid #0c5460;'><strong>👤 USER</strong> — l'utilisateur standard. Il achète et vend.</div><div style='background: #d4edda; padding: 0.9rem; border-radius: 8px; border-left: 4px solid #155724;'><strong>🛠️ ASSISTANT</strong> — valide les articles, les KYC, tranche les litiges.</div><div style='background: #fff3cd; padding: 0.9rem; border-radius: 8px; border-left: 4px solid #856404;'><strong>💰 ACCOUNTANT</strong> — valide les dépôts, traite les retraits.</div><div style='background: #f8d7da; padding: 0.9rem; border-radius: 8px; border-left: 4px solid #721c24;'><strong>👑 ADMIN</strong> — supervise tout, bloque, configure.</div></div><p style='color: #555; font-size: 0.9rem; margin-top: 1rem;'>💡 Chaque endpoint doit déclarer quel(s) rôle(s) peuvent y accéder.</p></div>",
    "texteParle": "Rappelons les quatre rôles de SawaMart. Premièrement, USER : c'est l'utilisateur standard. Il peut acheter des produits et en vendre. C'est le rôle par défaut, celui qui est attribué à chaque nouvelle inscription. Deuxièmement, ASSISTANT : c'est un rôle de modération. Un assistant valide les articles en attente, vérifie les dossiers KYC, et tranche les litiges entre acheteurs et vendeurs. C'est le modérateur humain de la plateforme. Troisièmement, ACCOUNTANT : c'est un rôle financier. Un comptable valide manuellement les dépôts mobile money, traite les demandes de retrait, gère les flux d'argent. C'est le banquier de la plateforme. Quatrièmement, ADMIN : c'est le super rôle. Un admin peut tout faire : bloquer des utilisateurs, modifier les configurations, gérer les autres comptes, etc. C'est le propriétaire de la plateforme. Maintenant, chaque endpoint de notre API doit déclarer explicitement quel(s) rôle(s) peuvent y accéder. Un endpoint pour valider un article doit être réservé aux ASSISTANT et ADMIN. Un endpoint pour valider un dépôt doit être réservé aux ACCOUNTANT et ADMIN. Un endpoint pour bloquer un utilisateur doit être réservé aux ADMIN. C'est ce contrôle que nous allons mettre en place.",
    "note": "Chaque endpoint sensible doit explicitement déclarer ses rôles autorisés. Pas de rôle implicite."
  },
  {
    "titre": "Le décorateur @Roles()",
    "contenu": "<div style='background: #e9ecef; padding: 1rem; border-radius: 12px;'><p style='color: #333;'>Créons <code>src/common/decorators/roles.decorator.ts</code> :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.7rem; line-height: 1.6; white-space: pre;'>import { SetMetadata } from '@nestjs/common';<br>import { UserRole } from '../../database/entities/user.entity';<br><br>export const ROLES_KEY = 'roles';<br><br>export const Roles = (...roles: UserRole[]) =&gt;<br>&nbsp;&nbsp;SetMetadata(ROLES_KEY, roles);</div><p style='color: #333; margin-top: 0.8rem;'><strong>Comment ça marche :</strong></p><ul style='padding-left: 1.2rem; color: #333; line-height: 1.7;'><li>📌 <code>ROLES_KEY</code> : la clé des métadonnées</li><li>🎯 <code>Roles()</code> : fonction qui attache la liste des rôles</li><li>📦 <code>SetMetadata</code> : mécanisme natif NestJS</li></ul><div style='background: #d1ecf1; border-left: 4px solid #0c5460; padding: 0.8rem; border-radius: 4px; margin-top: 1rem;'><strong>💡 Usage :</strong> <code>@Roles(UserRole.ADMIN)</code> ou <code>@Roles(UserRole.ASSISTANT, UserRole.ADMIN)</code></div></div>",
    "texteParle": "Créons le décorateur Roles dans le fichier src/common/decorators/roles.decorator.ts. On importe SetMetadata de NestJS et l'énumération UserRole de notre entité User. On déclare une constante ROLES_KEY, qui vaut la chaîne 'roles'. C'est le nom de la métadonnée qu'on va attacher aux routes. Puis on déclare la fonction Roles. C'est une fonction qui prend un nombre variable de rôles en paramètres, grâce au spread operator trois petits points, et qui retourne le résultat de SetMetadata avec la clé ROLES_KEY et les rôles. SetMetadata est une fonction NestJS qui enregistre une métadonnée sur une classe ou une méthode. Ces métadonnées seront lisibles plus tard par le Reflector, dans le RolesGuard. L'utilisation est très simple. Sur un endpoint, on écrit arobase Roles, puis on ouvre les parenthèses et on liste les rôles autorisés. Par exemple, arobase Roles avec UserRole.ADMIN signifie que seuls les admins peuvent accéder. Arobase Roles avec UserRole.ASSISTANT et UserRole.ADMIN signifie que les deux peuvent accéder. C'est extrêmement lisible : en un coup d'œil, on voit qui peut faire quoi.",
    "note": "SetMetadata est un mécanisme générique de NestJS. On peut l'utiliser pour d'autres métadonnées aussi."
  },
  {
    "titre": "Créer le RolesGuard",
    "contenu": "<div style='background: #f8f9fa; padding: 1rem; border-radius: 12px; border-left: 6px solid #10b981;'><p style='color: #333;'>Créons <code>src/common/guards/roles.guard.ts</code> :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.68rem; line-height: 1.6; white-space: pre;'>import { Injectable, CanActivate, ExecutionContext, UnauthorizedException } from '@nestjs/common';<br>import { Reflector } from '@nestjs/core';<br>import { ROLES_KEY } from '../decorators/roles.decorator';<br>import { UserRole } from '../../database/entities/user.entity';<br><br>@Injectable()<br>export class RolesGuard implements CanActivate {<br>&nbsp;&nbsp;constructor(private reflector: Reflector) {}<br><br>&nbsp;&nbsp;canActivate(context: ExecutionContext): boolean {<br>&nbsp;&nbsp;&nbsp;&nbsp;const requiredRoles = this.reflector.getAllAndOverride&lt;UserRole[]&gt;(<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;ROLES_KEY,<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;[context.getHandler(), context.getClass()],<br>&nbsp;&nbsp;&nbsp;&nbsp;);<br>&nbsp;&nbsp;&nbsp;&nbsp;<br>&nbsp;&nbsp;&nbsp;&nbsp;if (!requiredRoles) return true; <span style='color: #6a9955;'>// Pas de rôles requis</span><br>&nbsp;&nbsp;&nbsp;&nbsp;<br>&nbsp;&nbsp;&nbsp;&nbsp;const { user } = context.switchToHttp().getRequest();<br>&nbsp;&nbsp;&nbsp;&nbsp;if (!user) throw new UnauthorizedException();<br><br>&nbsp;&nbsp;&nbsp;&nbsp;return requiredRoles.some((role) =&gt; user.role === role);<br>&nbsp;&nbsp;}<br>}</div></div>",
    "texteParle": "Créons maintenant le RolesGuard dans src/common/guards/roles.guard.ts. On importe les décorateurs et interfaces NestJS : Injectable, CanActivate, ExecutionContext, UnauthorizedException. On importe aussi Reflector de @nestjs/core, la clé ROLES_KEY, et l'énumération UserRole. La classe RolesGuard implémente l'interface CanActivate. Elle a une méthode unique : canActivate, qui retourne un booléen. Vrai si l'utilisateur peut accéder, faux sinon. Dans le constructeur, on injecte un Reflector. C'est le service NestJS qui permet de lire les métadonnées attachées aux classes et méthodes. C'est lui qui va nous permettre de lire les rôles déclarés avec arobase Roles. Regardons la méthode canActivate. Première étape, on lit les rôles requis avec reflector.getAllAndOverride. Cette méthode prend la clé ROLES_KEY et un tableau contenant le handler, c'est-à-dire la méthode, et la classe, c'est-à-dire le contrôleur. Elle cherche les métadonnées en priorité sur la méthode, puis sur la classe. C'est ce qui permet de mettre arobase Roles au niveau du contrôleur pour protéger tous les endpoints, ou au niveau d'un endpoint pour n'en protéger qu'un. Si aucun rôle n'est déclaré, requiredRoles est undefined, et on retourne vrai : pas de restriction. Sinon, on récupère l'utilisateur depuis la requête, et on vérifie que son rôle est dans la liste. Si oui, accès autorisé. Sinon, accès refusé avec une 403.",
    "note": "getAllAndOverride cherche d'abord sur la méthode, puis sur la classe. Méthode plus précise = priorité."
  },
  {
    "titre": "Comprendre canActivate",
    "contenu": "<div style='background: #e9ecef; padding: 1rem; border-radius: 12px;'><p style='color: #333;'>Détaillons les 4 étapes de <code>canActivate</code> :</p><ol style='padding-left: 1.2rem; color: #333; line-height: 1.9;'><li><strong>Lire les rôles requis</strong><br><code>reflector.getAllAndOverride(ROLES_KEY, [handler, class])</code></li><li><strong>Si aucun rôle requis</strong><br>→ retourner <code>true</code> (accès libre)</li><li><strong>Récupérer l'utilisateur</strong><br><code>req.user</code> (défini par JwtStrategy)</li><li><strong>Vérifier le rôle</strong><br><code>requiredRoles.some(role =&gt; user.role === role)</code></li></ol><div style='background: #fff3cd; border-left: 4px solid #856404; padding: 0.8rem; border-radius: 4px; margin-top: 1rem;'><strong>⚠️ Prérequis :</strong> le <code>RolesGuard</code> doit être utilisé <strong>APRÈS</strong> le <code>JwtAuthGuard</code>. Sinon, <code>req.user</code> n'existe pas encore.</div></div>",
    "texteParle": "Détaillons les quatre étapes de canActivate. Étape une : lire les rôles requis avec reflector.getAllAndOverride. Cette méthode cherche la métadonnée ROLES_KEY en priorité sur la méthode, puis sur la classe du contrôleur. Si elle la trouve, elle retourne la liste. Sinon, elle retourne undefined. Étape deux : si aucun rôle n'est requis, on retourne true. Cela signifie : pas de restriction de rôle sur cet endpoint. N'importe quel utilisateur authentifié peut y accéder. Étape trois : on récupère l'utilisateur depuis la requête. Attention, req.user est rempli par la JwtStrategy, pas par le RolesGuard. Donc le RolesGuard ne peut fonctionner que si le JwtAuthGuard a été exécuté avant. Étape quatre : on vérifie que le rôle de l'utilisateur est bien dans la liste des rôles requis. On utilise la méthode some sur le tableau, qui retourne vrai dès qu'un élément correspond. Si oui, accès autorisé. Sinon, accès refusé. Un point crucial : l'ordre des guards. Sur un endpoint, on écrit UseGuards avec JwtAuthGuard en premier, puis RolesGuard. NestJS exécute les guards dans l'ordre de déclaration. Donc JwtAuthGuard s'exécute d'abord, remplit req.user, puis RolesGuard s'exécute et lit req.user. Si on inversait, RolesGuard s'exécuterait en premier, req.user serait undefined, et toutes les requêtes seraient refusées. C'est une erreur classique à éviter.",
    "note": "Ordre des guards : JwtAuthGuard d'abord, RolesGuard ensuite. Sinon, req.user est undefined."
  },
  {
    "titre": "Utilisation sur les endpoints",
    "contenu": "<div style='background: #f8f9fa; padding: 1rem; border-radius: 12px; border-left: 6px solid #a78bfa;'><p style='color: #333;'>Exemples concrets :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.65rem; line-height: 1.6; white-space: pre;'><span style='color: #6a9955;'>// Endpoint admin seulement</span><br>@Post(&#39;users/:id/block&#39;)<br>@UseGuards(JwtAuthGuard, RolesGuard)<br>@Roles(UserRole.ADMIN)<br>async blockUser(@Param(&#39;id&#39;) id: string) { ... }<br><br><span style='color: #6a9955;'>// Endpoint assistant ET admin</span><br>@Get(&#39;kyc/pending&#39;)<br>@UseGuards(JwtAuthGuard, RolesGuard)<br>@Roles(UserRole.ASSISTANT, UserRole.ADMIN)<br>async getPendingKyc() { ... }<br><br><span style='color: #6a9955;'>// Endpoint comptable ET admin</span><br>@Get(&#39;deposits/pending&#39;)<br>@UseGuards(JwtAuthGuard, RolesGuard)<br>@Roles(UserRole.ACCOUNTANT, UserRole.ADMIN)<br>async getPendingDeposits() { ... }</div></div>",
    "texteParle": "Voyons des exemples concrets. Premier exemple : bloquer un utilisateur. C'est un endpoint très sensible, réservé aux admins. On utilise trois décorateurs : Post pour la méthode HTTP, UseGuards avec JwtAuthGuard et RolesGuard, et Roles avec UserRole.ADMIN. Résultat : seuls les admins authentifiés peuvent bloquer des utilisateurs. Un utilisateur normal reçoit un 403 s'il tente. Deuxième exemple : liste des KYC en attente. C'est un endpoint pour les assistants qui valident les dossiers. On passe Roles avec UserRole.ASSISTANT et UserRole.ADMIN. Pourquoi aussi l'admin ? Parce qu'un admin doit pouvoir faire tout ce qu'un assistant fait. C'est une bonne pratique : l'admin est un super-utilisateur, il a tous les droits. Un assistant ne peut pas accéder aux endpoints admin, mais un admin peut accéder aux endpoints assistant. C'est un modèle hiérarchique. Troisième exemple : liste des dépôts en attente. Réservé aux ACCOUNTANT et ADMIN. Un assistant ne peut pas voir les dépôts. Chaque rôle a son domaine, mais l'admin a tous les domaines. C'est cette granularité qui rend SawaMart sûr. Chaque endpoint est protégé par le bon rôle.",
    "note": "Toujours inclure ADMIN dans les rôles autorisés. C'est le super-utilisateur qui doit tout pouvoir."
  },
  {
    "titre": "Combiner au niveau du contrôleur",
    "contenu": "<div style='background: #e9ecef; padding: 1rem; border-radius: 12px;'><p style='color: #333;'>On peut aussi protéger tout un contrôleur :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.68rem; line-height: 1.6; white-space: pre;'><span style='color: #6a9955;'>// Tous les endpoints du contrôleur sont réservés aux assistants</span><br>@Controller(&#39;assistant/kyc&#39;)<br>@UseGuards(JwtAuthGuard, RolesGuard)<br>@Roles(UserRole.ASSISTANT, UserRole.ADMIN)<br>export class AssistantKycController {<br>&nbsp;&nbsp;<span style='color: #6a9955;'>// Hérite du guard et des rôles</span><br>&nbsp;&nbsp;@Get(&#39;pending&#39;)<br>&nbsp;&nbsp;async getPending() { ... }<br>&nbsp;&nbsp;<br>&nbsp;&nbsp;<span style='color: #6a9955;'>// Peut redéfinir les rôles pour cet endpoint</span><br>&nbsp;&nbsp;@Get(&#39;stats&#39;)<br>&nbsp;&nbsp;@Roles(UserRole.ADMIN)<br>&nbsp;&nbsp;async getStats() { ... }<br>}</div><p style='color: #555; font-size: 0.9rem; margin-top: 0.8rem;'>💡 <code>@Roles</code> sur la méthode <strong>écrase</strong> <code>@Roles</code> sur la classe. La méthode est plus précise.</p></div>",
    "texteParle": "On peut aussi protéger tout un contrôleur en une seule fois. Regardez cet exemple. On a un AssistantKycController, dédié aux assistants qui valident les dossiers KYC. Tous ses endpoints doivent être réservés aux assistants et admins. Au lieu de répéter arobase UseGuards et arobase Roles sur chaque méthode, on les met au niveau du contrôleur. Le décorateur UseGuards avec JwtAuthGuard et RolesGuard protège tous les endpoints. Le décorateur Roles avec ASSISTANT et ADMIN s'applique par défaut. Résultat : chaque endpoint hérite de ces protections. C'est plus concis et plus sûr : on ne risque pas d'oublier la protection sur un endpoint. Mais on peut aussi redéfinir au niveau de la méthode. Regardez l'endpoint stats : il est décoré avec Roles ADMIN uniquement. Cela écrase le Roles du contrôleur. C'est ce que fait getAllAndOverride : il cherche d'abord sur la méthode, puis sur la classe. Résultat : cet endpoint spécifique n'est accessible qu'aux admins, alors que les autres sont accessibles aux assistants et admins. Ce mécanisme de surcharge est très pratique : on définit une politique par défaut au niveau du contrôleur, et on l'affine au cas par cas.",
    "note": "Définir les rôles au niveau du contrôleur évite de les répéter. Surcharger sur un endpoint pour plus de précision."
  },
  {
    "titre": "Déclarer RolesGuard dans AppModule",
    "contenu": "<div style='background: #f8f9fa; padding: 1rem; border-radius: 12px; border-left: 6px solid #10b981;'><p style='color: #333;'>Pour utiliser <code>RolesGuard</code> partout, déclarons-le dans <code>AppModule</code> :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.68rem; line-height: 1.6; white-space: pre;'>import { Module } from &#39;@nestjs/common&#39;;<br>import { RolesGuard } from &#39;./common/guards/roles.guard&#39;;<br><br>@Module({<br>&nbsp;&nbsp;imports: [...],<br>&nbsp;&nbsp;providers: [<br>&nbsp;&nbsp;&nbsp;&nbsp;<span style='color: #6a9955;'>// ... autres providers</span><br>&nbsp;&nbsp;&nbsp;&nbsp;RolesGuard,<br>&nbsp;&nbsp;],<br>&nbsp;&nbsp;exports: [RolesGuard],<br>})<br>export class AppModule {}</div><p style='color: #333; margin-top: 0.8rem;'><strong>Pourquoi ?</strong></p><ul style='padding-left: 1.2rem; color: #333; line-height: 1.7;'><li>🎯 Le <code>Reflector</code> doit être injecté</li><li>🔌 Le guard doit être disponible partout</li><li>💡 Sans <code>Reflector</code>, impossible de lire les métadonnées <code>@Roles</code></li></ul></div>",
    "texteParle": "Pour que RolesGuard fonctionne, il faut l'enregistrer quelque part. On pourrait l'enregistrer dans AuthModule, car c'est lié à l'authentification. Mais le plus simple est de l'enregistrer dans AppModule, avec les autres providers globaux. Regardez le code. On importe RolesGuard depuis son fichier. Dans le décorateur Module, on ajoute RolesGuard à la liste des providers. On l'exporte aussi, pour qu'il soit disponible pour d'autres modules. Pourquoi cette étape est-elle nécessaire ? Parce que RolesGuard a un constructeur qui prend un Reflector en paramètre. Ce Reflector doit être injecté par NestJS. Et pour qu'il soit injecté, il faut que RolesGuard soit un provider connu. C'est le principe de l'injection de dépendances : un provider ne peut recevoir une dépendance que s'il est lui-même enregistré. Sinon, NestJS ne saura pas comment l'instancier. Une fois RolesGuard enregistré dans AppModule, on peut l'utiliser dans n'importe quel contrôleur de n'importe quel module, en l'important et en le passant à UseGuards. C'est un point facile à oublier, donc assurez-vous de bien enregistrer tous vos guards custom. Une erreur de type 'Nest can't resolve dependencies of the RolesGuard' signifie généralement que le guard n'est pas enregistré ou que ses dépendances ne sont pas fournies.",
    "note": "Un guard avec dépendances doit être enregistré comme provider. Sinon, erreur au démarrage."
  },
  {
    "titre": "Résumé et prochaine étape",
    "contenu": "<div style='background: linear-gradient(135deg, #1e3c72, #2a5298); color: white; padding: 2rem; border-radius: 15px; text-align: center;'><h3 style='color: #fff;'>🎉 Autorisation maîtrisée !</h3><p style='color: #e0e0e0;'>Vos endpoints sont maintenant protégés par rôle.</p><hr style='border-color: #4a7db0; width: 50%;'><p style='color: #f0f0f0; margin-bottom: 0.5rem;'>Ce que nous avons appris :</p><ul style='text-align: left; padding-left: 1.5rem; color: #f0f0f0; line-height: 1.8;'><li>✅ Authentification vs Autorisation</li><li>✅ Les 4 rôles de SawaMart</li><li>✅ Le décorateur <code>@Roles()</code> avec <code>SetMetadata</code></li><li>✅ Le <code>RolesGuard</code> avec <code>Reflector</code></li><li>✅ La méthode <code>canActivate</code> en 4 étapes</li><li>✅ L'ordre des guards : JWT puis Roles</li><li>✅ Utilisation sur méthodes et contrôleurs</li><li>✅ Déclarer dans <code>AppModule</code></li></ul><p style='color: #f0f0f0; margin-top: 1rem;'>👉 <strong>Prochaine leçon :</strong> Endpoint verify-password et refresh token</p></div>",
    "texteParle": "Résumons cette leçon. Nous avons vu la différence entre authentification et autorisation. La première vérifie qui est l'utilisateur, la seconde vérifie ce qu'il peut faire. Nous avons rappelé les quatre rôles de SawaMart : USER, ASSISTANT, ACCOUNTANT, ADMIN. Chacun a son domaine, et l'admin a tous les domaines. Nous avons créé le décorateur Roles, qui utilise SetMetadata pour attacher la liste des rôles autorisés à une route. Nous avons créé le RolesGuard, qui implémente CanActivate et lit ces métadonnées avec le Reflector. La méthode canActivate fait quatre choses : lire les rôles requis, retourner vrai si aucun, récupérer l'utilisateur, et vérifier que son rôle est dans la liste. Nous avons vu l'importance de l'ordre des guards : JwtAuthGuard doit être en premier, RolesGuard ensuite. Sinon, req.user n'existe pas. Nous avons vu comment utiliser ces guards sur des endpoints individuels ou sur des contrôleurs entiers, avec la possibilité de surcharger les rôles au niveau de la méthode. Enfin, nous avons enregistré RolesGuard dans AppModule pour qu'il soit disponible partout. Votre système d'autorisation est maintenant complet. Dans la prochaine leçon, nous allons voir deux derniers aspects de l'authentification : l'endpoint verify-password, qui permet de vérifier un mot de passe sans se reconnecter, et le refresh token, qui permet de renouveler un token expiré. À très bientôt !",

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentIndex = 0;
    let isSpeaking = false;
    let isPaused = false;
    let currentUtterance = null;
    let isLoading = false;
    let loadingTimeout = null;
    let isTransitioning = false;
    let speechSupported = true;
    let userInteracted = false;
    let isPlaying = false;
    let loadingCancelled = false;

    const total = slides.length;
    const synth = window.speechSynthesis;

    // Références jQuery
    const $title = $('#slideTitle');
    const $body = $('#slideBody');
    const $counter = $('#slideCounter');
    const $statusText = $('#statusText');
    const $statusBadge = $('#statusBadge');
    const $loading = $('#loadingOverlay');
    const $loadingText = $('#loadingText');
    const $loadingSub = $('#loadingSub');
    const $loadingTimeout = $('#loadingTimeout');
    const $loadingProgressBar = $('#loadingProgressBar');
    const $autoIndicator = $('#autoIndicator');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $replay = $('#replayBtn');
    const $play = $('#playBtn');
    const $cancelLoading = $('#cancelLoadingBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function setStatus(text, type) {
        $statusText.text(text);
        $statusBadge.removeClass('idle speaking error paused waiting loading');
        if (type === 'speaking') $statusBadge.addClass('speaking');
        else if (type === 'error') $statusBadge.addClass('error');
        else if (type === 'paused') $statusBadge.addClass('paused');
        else if (type === 'waiting') $statusBadge.addClass('waiting');
        else if (type === 'loading') $statusBadge.addClass('loading');
        else $statusBadge.addClass('idle');
    }

    function updatePlayButton() {
        if (isPlaying) {
            $play.addClass('playing');
            $play.find('.btn-icon').text('⏸');
            $play.find('.btn-label').text('Pause');
        } else {
            $play.removeClass('playing');
            $play.find('.btn-icon').text('▶');
            $play.find('.btn-label').text('Play');
        }
    }

    function showLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        
        loadingCancelled = false;
        isLoading = true;
        
        // Réinitialiser la barre de progression
        $loadingProgressBar.css('animation', 'none');
        $loadingProgressBar.css('width', '0%');
        // Forcer un reflow
        $loadingProgressBar[0].offsetHeight;
        $loadingProgressBar.css('animation', 'loadingProgress 30s ease-out forwards');
        
        $loadingText.text('Préparation vocale...');
        $loadingSub.text('Synthèse en cours');
        $loadingTimeout.text('⏱️ 30 secondes maximum');
        $loading.fadeIn(300);
        setStatus("⏳ Chargement...", 'loading');
        
        // 🔥 TIMEOUT DE 30 SECONDES
        loadingTimeout = setTimeout(() => {
            if (isLoading && !loadingCancelled) {
                hideLoading();
                setStatus("⚠️ Délai dépassé (30s)", 'error');
                isPlaying = false;
                updatePlayButton();
                $loadingSub.text('La synthèse vocale a pris trop de temps');
                $loadingTimeout.text('❌ Délai dépassé');
            }
        }, 30000);
    }

    function hideLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        isLoading = false;
        loadingCancelled = false;
        $loading.fadeOut(300);
        // Ne pas changer le statut si on est en train de parler
        if (!isSpeaking && !isPlaying) {
            setStatus("⏸ Lecture arrêtée", 'paused');
        }
    }

    function cancelLoading() {
        loadingCancelled = true;
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        hideLoading();
        stopSpeaking();
        setStatus("⏸ Annulé", 'paused');
        isPlaying = false;
        updatePlayButton();
        $loadingText.text('Annulé par l\'utilisateur');
        $loadingSub.text('Vous pouvez réessayer');
        $loadingTimeout.text('✕ Annulation');
    }

    // Arrêter la parole proprement
    function stopSpeaking() {
        try {
            if (synth && (synth.speaking || synth.pending)) {
                synth.cancel();
            }
        } catch(e) {
            console.warn('Erreur stopSpeaking:', e);
        }
        if (currentUtterance) {
            try {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance.onstart = null;
            } catch(e) {}
            currentUtterance = null;
        }
        isSpeaking = false;
        isPlaying = false;
        updatePlayButton();
    }

    // Mettre en pause la parole
    function pauseSpeaking() {
        try {
            if (synth && synth.speaking) {
                synth.pause();
                isPaused = true;
                isPlaying = false;
                setStatus("⏸ Lecture en pause", 'paused');
                updatePlayButton();
            }
        } catch(e) {
            console.warn('Erreur pauseSpeaking:', e);
            stopSpeaking();
        }
    }

    // Reprendre la parole
    function resumeSpeaking() {
        try {
            if (synth && synth.paused) {
                synth.resume();
                isPaused = false;
                isPlaying = true;
                setStatus("🔊 Lecture en cours", 'speaking');
                updatePlayButton();
            } else if (!isSpeaking && !synth.speaking && !synth.pending) {
                speakSlide(currentIndex);
            }
        } catch(e) {
            console.warn('Erreur resumeSpeaking:', e);
            speakSlide(currentIndex);
        }
    }

    function renderSlide(index) {
        const slide = slides[index];
        $title.text(slide.titre);

        let html = '';
        html += `<div class="content-card">${slide.contenu}</div>`;
        if (slide.note) {
            html += `<div class="note-box">${slide.note}</div>`;
        }
        $body.html(html);
        $counter.text(`${index+1} / ${total}`);

        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
        }
    }

    // ================================================================
    // LECTURE VOCALE
    // ================================================================
    function speakSlide(index) {
        return new Promise((resolve) => {
            const slide = slides[index];
            const text = slide.texteParle;
            
            if (!text || text.trim() === '' || !speechSupported) {
                resolve();
                return;
            }

            if (!window.speechSynthesis) {
                setStatus("❌ Synthèse vocale non supportée", 'error');
                speechSupported = false;
                resolve();
                return;
            }

            // Arrêter toute lecture en cours
            stopSpeaking();
            
            // Réinitialiser l'état de pause
            isPaused = false;
            
            showLoading();
            setStatus("Initialisation...", 'loading');

            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.92;
                utterance.pitch = 1.05;
                utterance.volume = 1;

                let isFinished = false;
                let errorHandled = false;

                utterance.onstart = function() {
                    if (loadingCancelled) {
                        stopSpeaking();
                        resolve();
                        return;
                    }
                    hideLoading();
                    isSpeaking = true;
                    isPlaying = true;
                    isPaused = false;
                    setStatus("🔊 Lecture en cours", 'speaking');
                    updatePlayButton();
                };

                utterance.onend = function() {
                    if (isFinished) return;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    setStatus("✅ Terminé", 'idle');
                    hideLoading();
                    updatePlayButton();
                    resolve();
                };

                utterance.onerror = function(e) {
                    if (isFinished || errorHandled) return;
                    errorHandled = true;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    hideLoading();
                    updatePlayButton();
                    
                    if (e.error === 'not-allowed') {
                        setStatus("⚠️ Permission refusée", 'error');
                    } else if (e.error === 'synthesis-unavailable') {
                        setStatus("⚠️ Synthèse indisponible", 'error');
                    } else if (e.error === 'canceled') {
                        setStatus("⏸ Annulé", 'paused');
                    } else {
                        setStatus("❌ Erreur audio: " + (e.error || 'inconnue'), 'error');
                    }
                    
                    resolve();
                };

                // Gestion du chargement des voix
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = function() {
                        if (!loadingCancelled) {
                            try {
                                synth.speak(utterance);
                            } catch(err) {
                                // Silencieux
                            }
                        }
                        synth.onvoiceschanged = null;
                    };
                }

                currentUtterance = utterance;
                
                if (!loadingCancelled) {
                    try {
                        synth.speak(utterance);
                    } catch(err) {
                        setTimeout(() => {
                            if (!loadingCancelled) {
                                try {
                                    synth.speak(utterance);
                                } catch(e) {
                                    setStatus("❌ Erreur de lecture", 'error');
                                    isPlaying = false;
                                    updatePlayButton();
                                    hideLoading();
                                    resolve();
                                }
                            } else {
                                resolve();
                            }
                        }, 100);
                    }
                } else {
                    resolve();
                }

            } catch(err) {
                hideLoading();
                setStatus("❌ Erreur générale", 'error');
                isPlaying = false;
                updatePlayButton();
                console.error('Erreur speakSlide:', err);
                resolve();
            }
        });
    }

    // ================================================================
    // NAVIGATION
    // ================================================================
    async function goToSlide(index) {
        if (isTransitioning) return;
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        
        // Si on est en train de lire, on met en pause avant de naviguer
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        // Arrêter complètement la lecture
        stopSpeaking();
        
        await new Promise(r => setTimeout(r, 50));
        
        if (index === currentIndex) {
            setStatus("📄 Slide actuel", 'idle');
            return;
        }

        isTransitioning = true;
        currentIndex = index;
        renderSlide(index);
        
        // Réinitialiser l'état de lecture
        isPlaying = false;
        updatePlayButton();
        setStatus("⏸ Lecture arrêtée", 'paused');

        await new Promise(r => setTimeout(r, 150));
        isTransitioning = false;
    }

    async function goToNext() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex + 1 < total) {
            await goToSlide(currentIndex + 1);
        } else {
            setStatus("🏁 Dernier slide", 'idle');
        }
    }

    async function goToPrev() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex - 1 >= 0) {
            await goToSlide(currentIndex - 1);
        } else {
            setStatus("🔁 Premier slide", 'idle');
        }
    }

    // ================================================================
    // GESTION PLAY/PAUSE
    // ================================================================
    function togglePlay() {
        if (!userInteracted) {
            userInteracted = true;
        }

        // Si le chargement est en cours, on l'annule
        if (isLoading) {
            cancelLoading();
            return;
        }

        // Si le synthétiseur est en pause, on reprend
        if (synth && synth.paused) {
            resumeSpeaking();
            return;
        }

        // Si la lecture est en cours, on met en pause
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
            return;
        }

        // Sinon, on démarre la lecture du slide courant
        if (!isSpeaking && !isPlaying) {
            stopSpeaking();
            speakSlide(currentIndex);
        }
    }

    // ================================================================
    // INIT
    // ================================================================
    async function init() {
        // Vérifier la compatibilité
        if (!window.speechSynthesis) {
            setStatus("❌ Synthèse vocale non supportée", 'error');
            speechSupported = false;
        }

        // Précharger les voix
        try {
            if (synth.getVoices) {
                synth.getVoices();
                setTimeout(() => {
                    try {
                        synth.getVoices();
                    } catch(e) {}
                }, 200);
            }
        } catch(e) {
            console.warn('Erreur chargement voix:', e);
        }

        // Afficher le premier slide
        renderSlide(0);
        $counter.text(`1 / ${total}`);
        
        // État initial
        setStatus("⏸ Appuie sur Play", 'paused');
        updatePlayButton();
        $autoIndicator.text('⏸ Lecture manuelle');

        // ================================================================
        // ÉVÉNEMENTS
        // ================================================================
        
        // Bouton Play/Pause
        $play.on('click', function() {
            togglePlay();
        });

        // Bouton Annuler le chargement
        $cancelLoading.on('click', function() {
            cancelLoading();
        });

        // Navigation
        $prev.on('click', function() {
            // Si chargement en cours, on annule
            if (isLoading) cancelLoading();
            goToPrev();
        });

        $next.on('click', function() {
            if (isLoading) cancelLoading();
            goToNext();
        });

        // Replay - relire le slide courant
        $replay.on('click', function() {
            if (isLoading) cancelLoading();
            stopSpeaking();
            setTimeout(() => {
                speakSlide(currentIndex);
            }, 100);
        });

        // Support du clavier (espace pour play/pause)
        $(document).on('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });

        // Nettoyage
        $(window).on('beforeunload', function() {
            try {
                if (synth.speaking) synth.cancel();
            } catch(e) {}
            hideLoading();
        });

        // Gérer les cas où la synthèse se termine de manière inattendue
        setInterval(() => {
            if (isPlaying && !synth.speaking && !synth.pending && !isPaused && !isLoading) {
                isPlaying = false;
                updatePlayButton();
                setStatus("⏸ Lecture arrêtée", 'paused');
            }
        }, 1000);
    }

    init();
});



    // ================================================================
    // GESTION DU THÈME JOUR/NUIT
    // ================================================================
    let isDarkMode = false;

    function toggleTheme() {
        isDarkMode = !isDarkMode;
        const body = document.body;
        const appContainer = document.querySelector('.app-container');
        const header = document.querySelector('.slide-header');
        const footer = document.querySelector('.slide-footer');
        const contentCards = document.querySelectorAll('.content-card');
        const noteBoxes = document.querySelectorAll('.note-box');
        const mathBlocks = document.querySelectorAll('.math-block');
        const buttons = document.querySelectorAll('.btn');
        const statusBadge = document.querySelector('.status-badge');
        const slideCounter = document.querySelector('.slide-counter');
        const autoIndicator = document.querySelector('.auto-indicator');
        const themeBtn = document.getElementById('themeToggle');

        if (isDarkMode) {
            // Mode nuit
            body.style.background = '#0b1120';
            body.style.color = '#f1f5f9';
            appContainer.style.background = 'linear-gradient(145deg, #0f172a 0%, #1e293b 100%)';
            header.style.background = 'rgba(15, 23, 42, 0.85)';
            footer.style.background = 'rgba(15, 23, 42, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.05)';
                card.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.08)';
                note.style.color = '#cbd5e1';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.25)';
                block.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#e2e8f0';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.12)';
                statusBadge.style.color = '#93bbfc';
            }
            if (slideCounter) {
                slideCounter.style.color = '#94a3b8';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#64748b';
            }
            if (themeBtn) {
                themeBtn.textContent = '☀️';
                themeBtn.title = 'Passer en mode jour';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#e2e8f0';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#e2e8f0';
                }
            });
        } else {
            // Mode jour (par défaut)
            body.style.background = '#f0f4f8';
            body.style.color = '#1a202c';
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
            header.style.background = 'rgba(255, 255, 255, 0.85)';
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.8)';
                card.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.12)';
                note.style.color = '#2c3e50';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.05)';
                block.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#2d3748';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
                statusBadge.style.color = '#2b6cb0';
            }
            if (slideCounter) {
                slideCounter.style.color = '#4a5568';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#718096';
            }
            if (themeBtn) {
                themeBtn.textContent = '🌓';
                themeBtn.title = 'Passer en mode nuit';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#2c3e50';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#2d3748';
                }
            });
        }
    }

    // Initialiser en mode jour
    document.addEventListener('DOMContentLoaded', function() {
        // Appliquer le mode jour par défaut
        const body = document.body;
        body.style.background = '#f0f4f8';
        body.style.color = '#1a202c';
        
        const appContainer = document.querySelector('.app-container');
        if (appContainer) {
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
        }
        
        const header = document.querySelector('.slide-header');
        if (header) {
            header.style.background = 'rgba(255, 255, 255, 0.85)';
        }
        
        const footer = document.querySelector('.slide-footer');
        if (footer) {
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
        }
        
        document.querySelectorAll('.content-card').forEach(card => {
            card.style.background = 'rgba(255,255,255,0.8)';
            card.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.note-box').forEach(note => {
            note.style.background = 'rgba(96, 165, 250, 0.12)';
            note.style.color = '#2c3e50';
        });
        
        document.querySelectorAll('.math-block').forEach(block => {
            block.style.background = 'rgba(0,0,0,0.05)';
            block.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.btn').forEach(btn => {
            btn.style.color = '#2d3748';
        });
        
        const statusBadge = document.querySelector('.status-badge');
        if (statusBadge) {
            statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
            statusBadge.style.color = '#2b6cb0';
        }
        
        const slideCounter = document.querySelector('.slide-counter');
        if (slideCounter) {
            slideCounter.style.color = '#4a5568';
        }
        
        const autoIndicator = document.querySelector('.auto-indicator');
        if (autoIndicator) {
            autoIndicator.style.color = '#718096';
        }
        
        document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
            if (!el.closest('.note-box')) {
                el.style.color = '#2c3e50';
            }
        });
        
        document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
            if (!el.closest('.note-box') && !el.closest('.math-block')) {
                el.style.color = '#2d3748';
            }
        });
        
        const themeBtn = document.getElementById('themeToggle');
        if (themeBtn) {
            themeBtn.textContent = '🌓';
            themeBtn.title = 'Passer en mode nuit';
        }
    });
</script>
