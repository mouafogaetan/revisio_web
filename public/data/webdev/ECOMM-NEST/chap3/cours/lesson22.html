<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Présentation mobile</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' },
            options: { skipHtmlTypes: 'script' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 500px;
        margin: 0 auto;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    .slide-header {
        flex-shrink: 0;
        padding: 18px 16px 10px 16px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        z-index: 10;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .slide-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
    }

    .content-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 18px 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        flex-shrink: 0;
    }

    .content-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .content-card li {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        line-height: 1.5;
    }

    .content-card li:last-child {
        border-bottom: none;
    }

    .bullet-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
    }

    .math-block {
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        overflow-x: auto;
        flex-shrink: 0;
        margin: 4px 0;
    }

    .math-block .math {
        font-size: 1.2rem;
        color: #e2e8f0;
    }

    .note-box {
        background: rgba(96, 165, 250, 0.08);
        border-left: 4px solid #60a5fa;
        padding: 12px 16px;
        border-radius: 12px;
        font-style: italic;
        font-size: 0.9rem;
        color: #cbd5e1;
        flex-shrink: 0;
    }

    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        border-radius: 0;
        flex-direction: column;
    }

    .loading-card {
        background: #1e293b;
        padding: 32px 28px;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #334155;
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px auto;
    }

    .loading-text {
        font-weight: 600;
        font-size: 1.1rem;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    .loading-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 16px;
    }
    .loading-progress {
        height: 3px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        animation: loadingProgress 30s ease-out forwards;
    }

    .loading-timeout {
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 12px;
    }

    .btn-cancel-loading {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 40px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #f87171;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }

    .btn-cancel-loading:active {
        transform: scale(0.94);
        background: rgba(239, 68, 68, 0.25);
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
    }

    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .slide-counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255,255,255,0.05);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(255,255,255,0.04);
    }

    .status-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 30px;
        background: rgba(96, 165, 250, 0.12);
        color: #93bbfc;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
    }

    .status-badge .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: pulse-dot 1.2s infinite;
        flex-shrink: 0;
    }

    .status-badge.idle .dot {
        animation: none;
        background: #64748b;
    }
    .status-badge.speaking .dot {
        background: #34d399;
        animation: pulse-dot 0.8s infinite;
    }
    .status-badge.error .dot {
        background: #f87171;
        animation: none;
    }
    .status-badge.paused .dot {
        animation: none;
        background: #fbbf24;
    }
    .status-badge.waiting .dot {
        animation: pulse-dot 1.5s infinite;
        background: #fbbf24;
    }
    .status-badge.loading .dot {
        animation: pulse-dot 0.5s infinite;
        background: #60a5fa;
    }

    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.7); }
    }

    .footer-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(255,255,255,0.1);
    }

    .btn-secondary {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-play {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
        min-width: 80px;
        justify-content: center;
    }
    .btn-play:active {
        background: rgba(52, 211, 153, 0.25);
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
    }

    .auto-indicator {
        font-size: 0.65rem;
        color: #64748b;
        text-align: center;
        letter-spacing: 0.3px;
        padding: 2px 0;
    }

    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.2rem;
        }
        .content-card li {
            font-size: 0.9rem;
            padding: 8px 0;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .btn-play {
            min-width: 60px;
        }
        .footer-buttons {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
        .loading-card {
            padding: 20px 16px;
        }
        .math-block .math {
            font-size: 1rem;
        }
    }

    @media (min-width: 600px) {
        .app-container {
            max-width: 480px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
        .loading-overlay {
            border-radius: 32px;
        }
    }

    /* Mode jour (par défaut) */
    html, body {
        background: #f0f4f8 !important;
        color: #1a202c !important;
    }
    .app-container {
        background: linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%) !important;
    }
    .slide-header {
        background: rgba(255, 255, 255, 0.85) !important;
        border-bottom: 1px solid rgba(0,0,0,0.08) !important;
    }
    .slide-header h1 {
        background: linear-gradient(135deg, #2b6cb0, #6b46c1) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        background-clip: text !important;
    }
    .slide-footer {
        background: rgba(255, 255, 255, 0.9) !important;
        border-top: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card {
        background: rgba(255,255,255,0.8) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card li {
        border-bottom: 1px solid rgba(0,0,0,0.05) !important;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.12) !important;
        border-left: 4px solid #4299e1 !important;
        color: #2c3e50 !important;
    }
    .math-block {
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .math-block .math {
        color: #2d3748 !important;
    }
    .slide-counter {
        color: #4a5568 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .status-badge {
        background: rgba(96, 165, 250, 0.15) !important;
        color: #2b6cb0 !important;
        border: 1px solid rgba(96, 165, 250, 0.15) !important;
    }
    .btn {
        color: #2d3748 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .btn-secondary {
        background: rgba(0,0,0,0.04) !important;
        border-color: rgba(0,0,0,0.08) !important;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15) !important;
        border-color: rgba(52, 211, 153, 0.2) !important;
        color: #38a169 !important;
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15) !important;
        border-color: rgba(251, 191, 36, 0.2) !important;
        color: #d69e2e !important;
    }
    .auto-indicator {
        color: #718096 !important;
    }
    .loading-card {
        background: #ffffff !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .loading-text {
        color: #1a202c !important;
    }
    .loading-sub {
        color: #4a5568 !important;
    }
</style>
</head>
<body>

<div class="app-container">

    <header class="slide-header">
        <h1 id="slideTitle">Chargement...</h1>
    </header>

    <main class="slide-body" id="slideBody"></main>

    <!-- LOADING OVERLAY AVEC BOUTON ANNULER -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Préparation vocale...</div>
            <div class="loading-sub" id="loadingSub">Synthèse en cours</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loadingProgressBar"></div>
            </div>
            <div class="loading-timeout" id="loadingTimeout">⏱️ 30 secondes maximum</div>
            <button class="btn-cancel-loading" id="cancelLoadingBtn">
                <span>✕</span> Annuler
            </button>
        </div>
    </div>

    <footer class="slide-footer">
        <div class="footer-top">
            <span class="slide-counter" id="slideCounter">1 / 3</span>
            <span class="status-badge idle" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">Prêt</span>
            </span>
        </div>

        <div class="footer-buttons">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-secondary" id="replayBtn">
                <span class="btn-icon">🔁</span> <span class="btn-label">Relire</span>
            </button>
            <button class="btn btn-play" id="playBtn">
                <span class="btn-icon">▶</span> <span class="btn-label">Play</span>
            </button>
        </div>

        <div class="auto-indicator" id="autoIndicator">⏸ Lecture manuelle</div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // SLIDES
    // ================================================================
    const slides = [
  {
    "titre": "Le service OTP",
    "contenu": "<div style='background: linear-gradient(135deg, #1e3c72, #2a5298); color: white; padding: 2rem; border-radius: 15px; text-align: center; margin-bottom: 1.5rem;'><h2 style='color: #fff; margin-bottom: 0.5rem;'>📲 Le service OTP</h2><p style='color: #e0e0e0; font-size: 1.1rem;'>Envoyer et vérifier des codes SMS</p><hr style='border-color: #4a7db0; width: 50%;'><p style='color: #f0f0f0;'>Leçon 3.5 : Twilio + NodeCache</p></div><p>L'OTP (One-Time Password) est un code à 6 chiffres envoyé par SMS. Il sert à <strong>prouver que l'utilisateur possède bien le téléphone</strong> qu'il prétend avoir. C'est la brique centrale de notre inscription et de notre réinitialisation de mot de passe. Dans cette leçon, nous allons construire le <strong>service OTP</strong> : comment générer un code, l'envoyer via Twilio, le stocker temporairement, et le vérifier.</p>",
    "texteParle": "Bonjour à toutes et à tous et bienvenue dans cette cinquième leçon du chapitre trois. Aujourd'hui, nous allons parler du service OTP. OTP signifie One-Time Password, c'est-à-dire mot de passe à usage unique. C'est un code à six chiffres qu'on envoie par SMS à l'utilisateur. Il sert à prouver que l'utilisateur possède bien le téléphone qu'il prétend avoir. C'est la brique centrale de deux de nos fonctionnalités : l'inscription et la réinitialisation du mot de passe. Dans cette leçon, nous allons construire ce service étape par étape. Comment générer un code aléatoire à six chiffres. Comment l'envoyer par SMS via Twilio. Comment le stocker temporairement en mémoire avec NodeCache. Comment le vérifier quand l'utilisateur le saisit. Et comment gérer les cas d'erreur et le rate limiting. C'est un module court mais essentiel. C'est parti.",
    "note": "L'OTP est le pont entre le monde numérique et le monde physique. Il relie un compte à un téléphone."
  },
  {
    "titre": "Pourquoi un OTP ?",
    "contenu": "<div style='background: #f8f9fa; padding: 1.5rem; border-radius: 12px; border-left: 6px solid #2a5298;'><p style='color: #1e3c72; font-weight: bold; margin-top: 0;'>Un OTP répond à une question simple :</p><p style='color: #333; font-style: italic; text-align: center; font-size: 1.1rem;'>\"Cet utilisateur possède-t-il vraiment ce numéro de téléphone ?\"</p><p style='color: #333; margin-top: 1rem;'>Sans OTP, un utilisateur pourrait s'inscrire avec :</p><ul style='padding-left: 1.2rem; color: #333; line-height: 1.8;'><li>❌ Le numéro de quelqu'un d'autre</li><li>❌ Un numéro fictif</li><li>❌ Un numéro jetable</li></ul><p style='color: #333; margin-top: 1rem;'>Avec un OTP envoyé par SMS :</p><ul style='padding-left: 1.2rem; color: #333; line-height: 1.8;'><li>✅ Seul le propriétaire du téléphone reçoit le code</li><li>✅ Le compte est lié à un vrai numéro</li><li>✅ La confiance est établie dès l'inscription</li></ul></div>",
    "texteParle": "Pourquoi utiliser un OTP ? La question à laquelle il répond est très simple : cet utilisateur possède-t-il vraiment ce numéro de téléphone ? Sans OTP, un utilisateur pourrait s'inscrire avec n'importe quel numéro. Le numéro de quelqu'un d'autre, un numéro fictif comme zéro-zéro-zéro, un numéro jetable acheté dans une boutique. Ce serait une catastrophe pour la plateforme. Les utilisateurs auraient des comptes liés à des numéros qu'ils ne contrôlent pas. Impossible de réinitialiser leur mot de passe. Impossible de les contacter. Impossible de leur envoyer des notifications. Et si quelqu'un s'inscrivait avec le numéro d'un autre, il pourrait nuire à la réputation de cette personne. Avec un OTP envoyé par SMS, la situation change complètement. Seul le propriétaire du téléphone reçoit le code. Il doit le saisir pour valider son inscription. Le compte est donc lié à un vrai numéro, contrôlé par une vraie personne. La confiance est établie dès la première étape. C'est ce qui rend un système d'OTP indispensable pour toute plateforme sérieuse qui utilise le téléphone comme identifiant.",
    "note": "L'OTP est la preuve de possession. Sans lui, votre système est ouvert aux abus."
  },
  {
    "titre": "Le workflow de l'OTP",
    "contenu": "<div style='background: #e9ecef; padding: 1rem; border-radius: 12px;'><p style='color: #333;'>Voici le parcours complet d'un OTP :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.72rem; line-height: 1.8; white-space: pre;'>1. Utilisateur demande un OTP<br>&nbsp;&nbsp;&nbsp;POST /auth/send-otp { phone_number }<br><br>2. Backend génère un code à 6 chiffres<br>&nbsp;&nbsp;&nbsp;Ex: 472819<br><br>3. Backend stocke le code en cache<br>&nbsp;&nbsp;&nbsp;Clé: phone, Valeur: code, TTL: 5min<br><br>4. Backend envoie le SMS via Twilio<br>&nbsp;&nbsp;&nbsp;\"Votre code SawaMart: 472819\"<br><br>5. Utilisateur saisit le code<br>&nbsp;&nbsp;&nbsp;POST /auth/verify-otp { phone, otp }<br><br>6. Backend vérifie et supprime le code<br>&nbsp;&nbsp;&nbsp;Si OK: valid = true</div></div>",
    "texteParle": "Voyons le workflow complet d'un OTP. Étape une : l'utilisateur demande un OTP en envoyant son numéro de téléphone à l'endpoint send-otp. Étape deux : le backend génère un code aléatoire à six chiffres, par exemple quatre-sept-deux-huit-un-neuf. Étape trois : le backend stocke ce code en mémoire cache, avec le numéro de téléphone comme clé, et une durée de vie de cinq minutes. Étape quatre : le backend envoie le SMS via Twilio. Le message est simple : 'Votre code SawaMart est 472819'. Étape cinq : l'utilisateur reçoit le SMS, lit le code, et le saisit dans l'application mobile. Le mobile envoie une requête à l'endpoint verify-otp avec le numéro et le code. Étape six : le backend vérifie que le code correspond à celui stocké en cache. Si oui, il retourne valid égal true et supprime le code du cache pour empêcher les rejeux. Si non, il retourne valid égal false. Le code expire automatiquement après cinq minutes grâce au TTL de NodeCache. C'est tout le workflow. Six étapes, mais chacune est simple.",
    "note": "Le code est supprimé du cache après vérification. Un OTP ne peut servir qu'une fois."
  },
  {
    "titre": "Twilio : envoyer des SMS",
    "contenu": "<div style='background: #f8f9fa; padding: 1.5rem; border-radius: 12px; border-left: 6px solid #10b981;'><p style='color: #333;'><strong>Twilio</strong> est un service cloud qui permet d'envoyer des SMS, des appels vocaux, et bien plus.</p><ul style='padding-left: 1.2rem; color: #333; line-height: 1.8;'><li>💬 <strong>API simple</strong> : une ligne de code pour envoyer un SMS</li><li>🌍 <strong>Couverture mondiale</strong> : fonctionne au Cameroun et partout</li><li>💵 <strong>Tarification à l'usage</strong> : environ 0,05 $ par SMS au Cameroun</li><li>📊 <strong>Tableau de bord</strong> : suivi de tous les SMS envoyés</li><li>🔒 <strong>Sécurisé</strong> : signature des requêtes, HTTPS</li></ul><div style='background: #d1ecf1; border-left: 4px solid #0c5460; padding: 0.8rem; border-radius: 4px; margin-top: 1rem;'><strong>💡 Alternative :</strong> Orange SMS API, Vonage (ex-Nexmo), ou un fournisseur local camerounais.</div></div>",
    "texteParle": "Pour envoyer des SMS, nous allons utiliser Twilio. C'est un service cloud américain qui permet d'envoyer des SMS, des appels vocaux, et plein d'autres choses. Il a plusieurs avantages. Son API est très simple : une ligne de code pour envoyer un SMS. Sa couverture est mondiale : il fonctionne au Cameroun, en Afrique, partout dans le monde. Sa tarification est à l'usage : environ cinq centimes de dollar par SMS envoyé au Cameroun. Pas d'abonnement mensuel, on paye ce qu'on consomme. Il fournit aussi un tableau de bord pour suivre tous les SMS envoyés : combien, à qui, quand, avec le statut de livraison. Enfin, c'est sécurisé : les requêtes sont signées, HTTPS est obligatoire. Il existe des alternatives. Orange a sa propre API SMS au Cameroun. Vonage, ex-Nexmo, propose des services similaires. Il y a aussi des fournisseurs locaux camerounais. Le choix dépend de vos besoins et de votre budget. Twilio est le plus populaire, le mieux documenté, et le plus fiable. C'est pour ça que nous l'avons choisi pour SawaMart.",
    "note": "Twilio est payant mais fiable. Testez avec le compte d'essai avant de passer en production."
  },
  {
    "titre": "NodeCache : stocker temporairement",
    "contenu": "<div style='background: #e9ecef; padding: 1.5rem; border-radius: 12px;'><p style='color: #333;'><strong>NodeCache</strong> est une bibliothèque qui stocke des données en mémoire, avec une durée de vie (TTL).</p><ul style='padding-left: 1.2rem; color: #333; line-height: 1.8;'><li>⚡ <strong>Ultra rapide</strong> : tout est en RAM</li><li>⏰ <strong>TTL automatique</strong> : les entrées expirent toutes seules</li><li>🔑 <strong>Clé-valeur</strong> : simple dictionnaire</li><li>💾 <strong>Léger</strong> : aucune dépendance externe</li></ul><p style='color: #333; margin-top: 1rem;'><strong>Notre usage :</strong></p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.72rem; line-height: 1.7; white-space: pre;'>cache.set(\"+237672345678\", \"472819\");<br><span style='color: #6a9955;'>// 5 minutes plus tard</span><br>cache.get(\"+237672345678\");<br><span style='color: #6a9955;'>// → undefined (expiré)</span></div><div style='background: #fff3cd; border-left: 4px solid #856404; padding: 0.8rem; border-radius: 4px; margin-top: 1rem;'><strong>⚠️ Attention :</strong> NodeCache est en mémoire. Si le serveur redémarre, tout est perdu. Pour de la prod multi-instances, utilisez Redis.</div></div>",
    "texteParle": "Pour stocker temporairement nos codes OTP, nous allons utiliser NodeCache. C'est une bibliothèque de cache en mémoire très simple. Elle stocke des paires clé-valeur, comme un dictionnaire. Elle a quatre avantages. Elle est ultra rapide, car tout est en RAM, pas sur disque. Elle gère automatiquement le TTL, c'est-à-dire la durée de vie des entrées : on peut dire 'cette clé expire dans cinq minutes', et cinq minutes plus tard, la clé a disparu. Elle utilise un modèle simple clé-valeur, ce qui la rend facile à utiliser. Et elle est très légère : aucune dépendance externe, aucun service à démarrer. Regardez notre usage. On stocke un code OTP avec le numéro de téléphone comme clé. Si on essaie de récupérer le code cinq minutes plus tard, on obtient undefined, car le TTL est expiré. C'est exactement ce qu'il nous faut. Attention cependant : NodeCache est en mémoire. Si votre serveur redémarre, toutes les données sont perdues. Pour un petit déploiement, c'est acceptable : l'utilisateur peut simplement redemander un code. Mais pour un déploiement multi-instances avec load balancing, il faut un cache partagé, comme Redis. Nous avons déjà mentionné Redis dans le chapitre précédent, et nous pourrons l'utiliser plus tard. Pour l'instant, NodeCache suffit.",
    "note": "NodeCache est en mémoire, donc perdu au redémarrage. Parfait pour un petit projet, à remplacer par Redis en production scalable."
  },
  {
    "titre": "Installer les dépendances",
    "contenu": "<div style='background: #f8f9fa; padding: 1rem; border-radius: 12px; border-left: 6px solid #2a5298;'><p style='color: #333;'>Installons les paquets nécessaires :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.8rem; line-height: 1.7; white-space: pre;'>npm install twilio node-cache<br>npm install -D @types/node-cache</div><p style='color: #333; margin-top: 0.8rem;'><strong>À quoi sert chaque paquet :</strong></p><ul style='padding-left: 1.2rem; color: #333; line-height: 1.8;'><li>📦 <strong>twilio</strong> — SDK Node.js pour envoyer des SMS</li><li>📦 <strong>node-cache</strong> — bibliothèque de cache en mémoire</li><li>📦 <strong>@types/node-cache</strong> — types TypeScript</li></ul><div style='background: #d1ecf1; border-left: 4px solid #0c5460; padding: 0.8rem; border-radius: 4px; margin-top: 1rem;'><strong>💡 Astuce :</strong> Twilio installe beaucoup de dépendances. Si la commande échoue, essayez <code>npm install twilio --legacy-peer-deps</code>.</div></div>",
    "texteParle": "Installons les paquets nécessaires. Trois paquets. Le premier, twilio, c'est le SDK Node.js officiel de Twilio. C'est lui qui fournit le client pour envoyer des SMS, passer des appels, etc. Le deuxième, node-cache, c'est la bibliothèque de cache en mémoire. C'est un paquet très léger, sans dépendances. Le troisième, @types/node-cache, ce sont les types TypeScript pour NodeCache. Sans lui, vous auriez des erreurs dans l'éditeur. Notez que twilio n'a pas besoin de @types, car il vient avec ses propres types. Une astuce au passage : Twilio a beaucoup de dépendances. Parfois, npm se plaint de conflits de versions de pairs. Si la commande échoue, utilisez l'option --legacy-peer-deps pour ignorer ces conflits. C'est un workaround connu et sans danger. Une fois ces trois paquets installés, nous pouvons passer à la création du service OTP.",
    "note": "Twilio a beaucoup de dépendances. --legacy-peer-deps est votre ami en cas de conflit."
  },
  {
    "titre": "Créer le fichier otp.service.ts",
    "contenu": "<div style='background: #e9ecef; padding: 1rem; border-radius: 12px;'><p style='color: #333;'>Créons <code>src/auth/otp.service.ts</code> :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.7rem; line-height: 1.6; white-space: pre;'>import { Injectable, BadRequestException } from '@nestjs/common';<br>import { ConfigService } from '@nestjs/config';<br>import twilio from 'twilio';<br>import NodeCache from 'node-cache';<br><br>@Injectable()<br>export class OtpService {<br>&nbsp;&nbsp;private twilioClient?: twilio.Twilio;<br>&nbsp;&nbsp;private cache: NodeCache;<br>&nbsp;&nbsp;private isTestMode: boolean = false;<br><br>&nbsp;&nbsp;constructor(private configService: ConfigService) {<br>&nbsp;&nbsp;&nbsp;&nbsp;this.cache = new NodeCache({ stdTTL: 300 });<br>&nbsp;&nbsp;&nbsp;&nbsp;this.isTestMode = process.env.NODE_ENV === 'test';<br>&nbsp;&nbsp;&nbsp;&nbsp;<br>&nbsp;&nbsp;&nbsp;&nbsp;<span style='color: #6a9955;'>// Init Twilio si pas en mode test</span><br>&nbsp;&nbsp;}<br>}</div></div>",
    "texteParle": "Créons maintenant notre OtpService dans le fichier src/auth/otp.service.ts. On importe d'abord les décorateurs NestJS : Injectable et BadRequestException. On importe ConfigService de @nestjs/config. On importe le client Twilio avec la syntaxe import twilio from 'twilio'. On importe NodeCache avec import NodeCache from 'node-cache'. Puis on déclare la classe OtpService, décorée avec Injectable. On y met trois propriétés privées. twilioClient, qui est optionnel : c'est l'instance du client Twilio. Elle sera définie dans le constructeur si les identifiants Twilio sont présents dans le .env. cache, qui est une instance de NodeCache. isTestMode, un booléen qui vaut true quand on est en mode test. Dans le constructeur, on injecte ConfigService. On crée une instance de NodeCache avec stdTTL à trois cents secondes, soit cinq minutes. C'est notre durée de vie par défaut. On initialise isTestMode en vérifiant la variable d'environnement NODE_ENV. Et on initialise Twilio si on n'est pas en mode test. La suite du constructeur, nous la verrons dans la slide suivante.",
    "note": "stdTTL à 300 = 5 minutes. C'est la durée de vie par défaut de chaque entrée du cache."
  },
  {
    "titre": "Initialiser le client Twilio",
    "contenu": "<div style='background: #f8f9fa; padding: 1rem; border-radius: 12px; border-left: 6px solid #10b981;'><p style='color: #333;'>Suite du constructeur :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.7rem; line-height: 1.6; white-space: pre;'>if (!this.isTestMode) {<br>&nbsp;&nbsp;const accountSid = this.configService.get('TWILIO_ACCOUNT_SID');<br>&nbsp;&nbsp;const authToken = this.configService.get('TWILIO_AUTH_TOKEN');<br>&nbsp;&nbsp;<br>&nbsp;&nbsp;if (accountSid &amp;&amp; authToken &amp;&amp; accountSid.startsWith('AC')) {<br>&nbsp;&nbsp;&nbsp;&nbsp;this.twilioClient = twilio(accountSid, authToken);<br>&nbsp;&nbsp;} else {<br>&nbsp;&nbsp;&nbsp;&nbsp;console.warn('⚠️ Twilio credentials not configured. OTP service will use mock mode.');<br>&nbsp;&nbsp;}<br>}</div><p style='color: #333; margin-top: 0.8rem;'><strong>Pourquoi ce mode MOCK ?</strong></p><ul style='padding-left: 1.2rem; color: #333; line-height: 1.7;'><li>🧪 Pas besoin de compte Twilio en développement</li><li>💵 Pas de frais pendant les tests</li><li>📋 Le code OTP est simplement loggué dans la console</li></ul></div>",
    "texteParle": "Continuons le constructeur. On vérifie qu'on n'est pas en mode test. Si on n'est pas en mode test, on lit les identifiants Twilio depuis ConfigService. On récupère le SID et le token. On vérifie que le SID existe, que le token existe, et que le SID commence par 'AC'. C'est un détail important : les SID Twilio commencent toujours par les lettres A et C majuscules. Si c'est bien le cas, on instancie le client Twilio. Sinon, on affiche un avertissement et on laisse twilioClient undefined. C'est ce qu'on appelle le mode MOCK. Pourquoi ce mode MOCK ? Pour plusieurs raisons. Premièrement, en développement, vous n'avez pas besoin de créer un compte Twilio pour tester votre code. Deuxièmement, vous ne payez rien pendant les tests : Twilio facture chaque SMS, même en développement. Troisièmement, le code OTP est simplement loggué dans la console du serveur. Vous pouvez le voir, le copier, et tester votre flux d'authentification sans envoyer de vrai SMS. C'est un énorme gain de temps et d'argent pour le développement. En production, les identifiants seront renseignés dans le .env, et le mode réel s'activera automatiquement.",
    "note": "Le mode MOCK est votre ami en développement. Il évite de créer un compte Twilio pour tester."
  },
  {
    "titre": "Générer un OTP",
    "contenu": "<div style='background: #e9ecef; padding: 1rem; border-radius: 12px;'><p style='color: #333;'>Ajoutons les méthodes de base pour générer et gérer les codes :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.7rem; line-height: 1.6; white-space: pre;'><span style='color: #6a9955;'>// Générer un code à 6 chiffres</span><br>generateOtp(): string {<br>&nbsp;&nbsp;return Math.floor(100000 + Math.random() * 900000).toString();<br>}<br><br><span style='color: #6a9955;'>// Stocker en cache</span><br>storeOtp(phoneNumber: string, otp: string, customKey?: string): void {<br>&nbsp;&nbsp;this.cache.set(phoneNumber, otp);<br>}<br><br><span style='color: #6a9955;'>// Récupérer depuis le cache</span><br>getStoredOtp(phoneNumber: string, customKey?: string): string | undefined {<br>&nbsp;&nbsp;return this.cache.get(phoneNumber);<br>}<br><br><span style='color: #6a9955;'>// Vérifier</span><br>verifyOtp(phoneNumber: string, otp: string, customKey?: string): boolean {<br>&nbsp;&nbsp;const storedOtp = this.getStoredOtp(phoneNumber, customKey);<br>&nbsp;&nbsp;return storedOtp === otp;<br>}<br><br><span style='color: #6a9955;'>// Supprimer</span><br>clearOtp(phoneNumber: string, customKey?: string): void {<br>&nbsp;&nbsp;this.cache.del(phoneNumber);<br>}</div></div>",
    "texteParle": "Ajoutons les méthodes de base pour générer et gérer les codes. Première méthode, generateOtp. Elle retourne une chaîne à six chiffres. Regardez l'expression : Math.floor de 100000 plus Math.random fois 900000, converti en chaîne. Math.random retourne un nombre entre zéro et un. En le multipliant par neuf cent mille, on obtient un nombre entre zéro et neuf cent mille. En ajoutant cent mille, on obtient un nombre entre cent mille et un million. En prenant la partie entière, on a un entier entre cent mille et neuf cent quatre-vingt-dix-neuf mille neuf cent quatre-vingt-dix-neuf. C'est toujours un nombre à six chiffres, jamais cinq. C'est important pour la cohérence du format. Deuxième méthode, storeOtp. Elle stocke le code dans le cache avec le numéro comme clé. Le troisième paramètre customKey est optionnel, on en parlera plus tard, pour distinguer l'inscription de la réinitialisation. Troisième méthode, getStoredOtp, qui récupère le code. Quatrième, verifyOtp, qui compare le code fourni avec celui du cache. Cinquième, clearOtp, qui supprime le code du cache après usage. Ces cinq méthodes forment l'API de base de notre service OTP.",
    "note": "generateOtp garantit toujours 6 chiffres : 100000 minimum. Pas de code à 5 chiffres."
  },
  {
    "titre": "Envoyer le SMS",
    "contenu": "<div style='background: #f8f9fa; padding: 1rem; border-radius: 12px; border-left: 6px solid #a78bfa;'><p style='color: #333;'>La méthode <code>sendOtpSms</code> :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.68rem; line-height: 1.6; white-space: pre;'>async sendOtpSms(phoneNumber: string, otp: string): Promise&lt;{ success: boolean; message: string }&gt; {<br>&nbsp;&nbsp;try {<br>&nbsp;&nbsp;&nbsp;&nbsp;<span style='color: #6a9955;'>// Mode MOCK si Twilio non configuré</span><br>&nbsp;&nbsp;&nbsp;&nbsp;if (!this.twilioClient) {<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;console.log(`📱 [MOCK] OTP à ${phoneNumber}: ${otp}`);<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;return { success: true, message: 'OTP envoyé (mock)' };<br>&nbsp;&nbsp;&nbsp;&nbsp;}<br><br>&nbsp;&nbsp;&nbsp;&nbsp;<span style='color: #6a9955;'>// Envoi réel</span><br>&nbsp;&nbsp;&nbsp;&nbsp;const message = await this.twilioClient.messages.create({<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;body: `Votre code SawaMart est : ${otp}. Valable 5 minutes.`,<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;from: this.configService.get('TWILIO_PHONE_NUMBER'),<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;to: phoneNumber,<br>&nbsp;&nbsp;&nbsp;&nbsp;});<br>&nbsp;&nbsp;&nbsp;&nbsp;return { success: true, message: 'OTP envoyé avec succès' };<br>&nbsp;&nbsp;} catch (error) {<br>&nbsp;&nbsp;&nbsp;&nbsp;throw new BadRequestException('Erreur lors de l\\'envoi du SMS');<br>&nbsp;&nbsp;}<br>}</div></div>",
    "texteParle": "Passons à la méthode la plus importante du service : sendOtpSms. Cette méthode envoie un SMS contenant le code. Elle prend le numéro et le code en paramètres, et retourne un objet avec success et message. Regardons la logique. D'abord, on est dans un try catch pour gérer les erreurs réseau. Si twilioClient est undefined, cela signifie qu'on est en mode MOCK. Dans ce cas, on loggue simplement le code dans la console avec un préfixe MOCK, et on retourne un succès simulé. C'est le mode développement. Sinon, on est en mode réel. On appelle this.twilioClient.messages.create avec trois paramètres. Le body, qui contient le message. Notez qu'on utilise un template literal avec des backticks pour insérer dynamiquement le code. Le from, qui est le numéro Twilio depuis lequel on envoie. Le to, qui est le numéro du destinataire. Twilio retourne un objet message avec un SID, mais on ne l'utilise pas ici. On retourne simplement un succès. Si une erreur se produit, on lève une BadRequestException avec un message générique. On ne veut pas révéler les détails internes de l'erreur Twilio au client.",
    "note": "Utilisez un template literal (backticks) pour insérer le code dans le message. Plus lisible que la concaténation."
  },
  {
    "titre": "Le rate limiting",
    "contenu": "<div style='background: #e9ecef; padding: 1rem; border-radius: 12px;'><p style='color: #333;'>Sans protection, un utilisateur pourrait demander des milliers d'OTP :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.7rem; line-height: 1.6; white-space: pre;'>checkRateLimit(phoneNumber: string, maxAttempts: number = 3): boolean {<br>&nbsp;&nbsp;const attempts = this.cache.get&lt;number&gt;(phoneNumber) || 0;<br>&nbsp;&nbsp;<br>&nbsp;&nbsp;if (attempts &gt;= maxAttempts) {<br>&nbsp;&nbsp;&nbsp;&nbsp;return false; <span style='color: #6a9955;'>// refusé</span><br>&nbsp;&nbsp;}<br>&nbsp;&nbsp;<br>&nbsp;&nbsp;<span style='color: #6a9955;'>// Incrémenter avec TTL de 10 minutes</span><br>&nbsp;&nbsp;this.cache.set(phoneNumber, attempts + 1, 600);<br>&nbsp;&nbsp;return true;<br>}</div><p style='color: #333; margin-top: 0.8rem;'><strong>Résultat :</strong></p><ul style='padding-left: 1.2rem; color: #333; line-height: 1.7;'><li>✅ Maximum 3 OTP par numéro toutes les 10 minutes</li><li>✅ Protège contre le spam SMS</li><li>✅ Protège votre crédit Twilio</li></ul></div>",
    "texteParle": "Un point critique : le rate limiting. Sans protection, un utilisateur malveillant pourrait demander des milliers d'OTP en quelques minutes. Imaginez : à cinq centimes par SMS, mille demandes coûtent cinquante dollars. Et votre utilisateur légitime est noyé sous les SMS. Il faut donc limiter. La méthode checkRateLimit fait ça. Elle récupère le nombre de tentatives en cache pour ce numéro. Si c'est déjà à trois ou plus, elle retourne false, ce qui signifie 'refusé'. Sinon, elle incrémente le compteur avec un TTL de six cents secondes, soit dix minutes, et retourne true. Résultat : maximum trois OTP par numéro toutes les dix minutes. C'est un équilibre raisonnable. Trois demandes, c'est largement suffisant pour un utilisateur normal. Si son premier SMS n'arrive pas, il peut redemander. S'il ne reçoit toujours rien, il redemande une troisième fois. Au-delà, c'est probablement un abus. Cette limite protège contre le spam SMS, contre l'épuisement de votre crédit Twilio, et contre les attaques par déni de service. C'est une protection indispensable.",
    "note": "3 OTP par 10 minutes est un bon compromis. Ajustable selon votre tolérance."
  },
  {
    "titre": "La méthode sendOtp principale",
    "contenu": "<div style='background: #f8f9fa; padding: 1rem; border-radius: 12px; border-left: 6px solid #2a5298;'><p style='color: #333;'>La méthode qui orchestre tout :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.68rem; line-height: 1.6; white-space: pre;'>async sendOtp(phoneNumber: string, customKey?: string) {<br>&nbsp;&nbsp;<span style='color: #6a9955;'>// 1. Vérifier le rate limit</span><br>&nbsp;&nbsp;if (!this.checkRateLimit(phoneNumber)) {<br>&nbsp;&nbsp;&nbsp;&nbsp;throw new BadRequestException('Trop de tentatives. Attendez 10 minutes.');<br>&nbsp;&nbsp;}<br><br>&nbsp;&nbsp;<span style='color: #6a9955;'>// 2. Générer l'OTP</span><br>&nbsp;&nbsp;const otp = this.generateOtp();<br><br>&nbsp;&nbsp;<span style='color: #6a9955;'>// 3. Stocker en cache</span><br>&nbsp;&nbsp;this.storeOtp(phoneNumber, otp, customKey);<br><br>&nbsp;&nbsp;<span style='color: #6a9955;'>// 4. Envoyer par SMS</span><br>&nbsp;&nbsp;await this.sendOtpSms(phoneNumber, otp);<br><br>&nbsp;&nbsp;<span style='color: #6a9955;'>// 5. Retourner</span><br>&nbsp;&nbsp;return { success: true, message: 'Code envoyé', expiresIn: 300 };<br>}</div></div>",
    "texteParle": "La méthode sendOtp orchestre tout. Elle fait cinq choses dans l'ordre. Premièrement, elle vérifie le rate limit. Si le numéro a déjà demandé trois OTP dans les dix dernières minutes, elle lève une exception avec un message explicite. Deuxièmement, elle génère un nouveau code OTP. Troisièmement, elle le stocke en cache avec le numéro comme clé, et éventuellement une clé custom pour distinguer les contextes. Quatrièmement, elle envoie le SMS via la méthode sendOtpSms. Cinquièmement, elle retourne un objet avec success égal true, un message, et expiresIn égal trois cents secondes, c'est-à-dire cinq minutes. Le champ expiresIn est utile pour le client, qui peut afficher un compte à rebours à l'utilisateur : 'Votre code expire dans 4 minutes 30 secondes'. C'est un détail ergonomique important. Le TTL du cache est aussi de cinq minutes, donc le compte à rebours est cohérent avec la réalité. Voilà une méthode propre, lisible, qui fait une seule chose : envoyer un OTP. Chaque sous-étape est dans sa propre méthode, ce qui facilite la maintenance et les tests.",
    "note": "Une méthode = une responsabilité. sendOtp orchestre, chaque sous-étape est isolée."
  },
  {
    "titre": "Vérifier un OTP",
    "contenu": "<div style='background: #e9ecef; padding: 1rem; border-radius: 12px;'><p style='color: #333;'>La méthode <code>verifyOtpCode</code> :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.68rem; line-height: 1.6; white-space: pre;'>async verifyOtpCode(phoneNumber: string, otp: string, customKey?: string) {<br>&nbsp;&nbsp;<span style='color: #6a9955;'>// 1. Vérifier la longueur</span><br>&nbsp;&nbsp;if (!otp || otp.length !== 6) {<br>&nbsp;&nbsp;&nbsp;&nbsp;return { valid: false, message: 'Le code doit contenir 6 chiffres' };<br>&nbsp;&nbsp;}<br><br>&nbsp;&nbsp;<span style='color: #6a9955;'>// 2. Comparer avec le cache</span><br>&nbsp;&nbsp;const isValid = this.verifyOtp(phoneNumber, otp, customKey);<br><br>&nbsp;&nbsp;<span style='color: #6a9955;'>// 3. Si valide, supprimer du cache (anti-replay)</span><br>&nbsp;&nbsp;if (isValid) {<br>&nbsp;&nbsp;&nbsp;&nbsp;this.clearOtp(phoneNumber, customKey);<br>&nbsp;&nbsp;&nbsp;&nbsp;return { valid: true, message: 'Code vérifié avec succès' };<br>&nbsp;&nbsp;}<br><br>&nbsp;&nbsp;<span style='color: #6a9955;'>// 4. Sinon, échec</span><br>&nbsp;&nbsp;return { valid: false, message: 'Code invalide ou expiré' };<br>}</div><p style='color: #555; font-size: 0.9rem; margin-top: 0.8rem;'>💡 Le code est supprimé dès qu'il est validé. Impossible de le réutiliser.</p></div>",

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentIndex = 0;
    let isSpeaking = false;
    let isPaused = false;
    let currentUtterance = null;
    let isLoading = false;
    let loadingTimeout = null;
    let isTransitioning = false;
    let speechSupported = true;
    let userInteracted = false;
    let isPlaying = false;
    let loadingCancelled = false;

    const total = slides.length;
    const synth = window.speechSynthesis;

    // Références jQuery
    const $title = $('#slideTitle');
    const $body = $('#slideBody');
    const $counter = $('#slideCounter');
    const $statusText = $('#statusText');
    const $statusBadge = $('#statusBadge');
    const $loading = $('#loadingOverlay');
    const $loadingText = $('#loadingText');
    const $loadingSub = $('#loadingSub');
    const $loadingTimeout = $('#loadingTimeout');
    const $loadingProgressBar = $('#loadingProgressBar');
    const $autoIndicator = $('#autoIndicator');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $replay = $('#replayBtn');
    const $play = $('#playBtn');
    const $cancelLoading = $('#cancelLoadingBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function setStatus(text, type) {
        $statusText.text(text);
        $statusBadge.removeClass('idle speaking error paused waiting loading');
        if (type === 'speaking') $statusBadge.addClass('speaking');
        else if (type === 'error') $statusBadge.addClass('error');
        else if (type === 'paused') $statusBadge.addClass('paused');
        else if (type === 'waiting') $statusBadge.addClass('waiting');
        else if (type === 'loading') $statusBadge.addClass('loading');
        else $statusBadge.addClass('idle');
    }

    function updatePlayButton() {
        if (isPlaying) {
            $play.addClass('playing');
            $play.find('.btn-icon').text('⏸');
            $play.find('.btn-label').text('Pause');
        } else {
            $play.removeClass('playing');
            $play.find('.btn-icon').text('▶');
            $play.find('.btn-label').text('Play');
        }
    }

    function showLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        
        loadingCancelled = false;
        isLoading = true;
        
        // Réinitialiser la barre de progression
        $loadingProgressBar.css('animation', 'none');
        $loadingProgressBar.css('width', '0%');
        // Forcer un reflow
        $loadingProgressBar[0].offsetHeight;
        $loadingProgressBar.css('animation', 'loadingProgress 30s ease-out forwards');
        
        $loadingText.text('Préparation vocale...');
        $loadingSub.text('Synthèse en cours');
        $loadingTimeout.text('⏱️ 30 secondes maximum');
        $loading.fadeIn(300);
        setStatus("⏳ Chargement...", 'loading');
        
        // 🔥 TIMEOUT DE 30 SECONDES
        loadingTimeout = setTimeout(() => {
            if (isLoading && !loadingCancelled) {
                hideLoading();
                setStatus("⚠️ Délai dépassé (30s)", 'error');
                isPlaying = false;
                updatePlayButton();
                $loadingSub.text('La synthèse vocale a pris trop de temps');
                $loadingTimeout.text('❌ Délai dépassé');
            }
        }, 30000);
    }

    function hideLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        isLoading = false;
        loadingCancelled = false;
        $loading.fadeOut(300);
        // Ne pas changer le statut si on est en train de parler
        if (!isSpeaking && !isPlaying) {
            setStatus("⏸ Lecture arrêtée", 'paused');
        }
    }

    function cancelLoading() {
        loadingCancelled = true;
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        hideLoading();
        stopSpeaking();
        setStatus("⏸ Annulé", 'paused');
        isPlaying = false;
        updatePlayButton();
        $loadingText.text('Annulé par l\'utilisateur');
        $loadingSub.text('Vous pouvez réessayer');
        $loadingTimeout.text('✕ Annulation');
    }

    // Arrêter la parole proprement
    function stopSpeaking() {
        try {
            if (synth && (synth.speaking || synth.pending)) {
                synth.cancel();
            }
        } catch(e) {
            console.warn('Erreur stopSpeaking:', e);
        }
        if (currentUtterance) {
            try {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance.onstart = null;
            } catch(e) {}
            currentUtterance = null;
        }
        isSpeaking = false;
        isPlaying = false;
        updatePlayButton();
    }

    // Mettre en pause la parole
    function pauseSpeaking() {
        try {
            if (synth && synth.speaking) {
                synth.pause();
                isPaused = true;
                isPlaying = false;
                setStatus("⏸ Lecture en pause", 'paused');
                updatePlayButton();
            }
        } catch(e) {
            console.warn('Erreur pauseSpeaking:', e);
            stopSpeaking();
        }
    }

    // Reprendre la parole
    function resumeSpeaking() {
        try {
            if (synth && synth.paused) {
                synth.resume();
                isPaused = false;
                isPlaying = true;
                setStatus("🔊 Lecture en cours", 'speaking');
                updatePlayButton();
            } else if (!isSpeaking && !synth.speaking && !synth.pending) {
                speakSlide(currentIndex);
            }
        } catch(e) {
            console.warn('Erreur resumeSpeaking:', e);
            speakSlide(currentIndex);
        }
    }

    function renderSlide(index) {
        const slide = slides[index];
        $title.text(slide.titre);

        let html = '';
        html += `<div class="content-card">${slide.contenu}</div>`;
        if (slide.note) {
            html += `<div class="note-box">${slide.note}</div>`;
        }
        $body.html(html);
        $counter.text(`${index+1} / ${total}`);

        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
        }
    }

    // ================================================================
    // LECTURE VOCALE
    // ================================================================
    function speakSlide(index) {
        return new Promise((resolve) => {
            const slide = slides[index];
            const text = slide.texteParle;
            
            if (!text || text.trim() === '' || !speechSupported) {
                resolve();
                return;
            }

            if (!window.speechSynthesis) {
                setStatus("❌ Synthèse vocale non supportée", 'error');
                speechSupported = false;
                resolve();
                return;
            }

            // Arrêter toute lecture en cours
            stopSpeaking();
            
            // Réinitialiser l'état de pause
            isPaused = false;
            
            showLoading();
            setStatus("Initialisation...", 'loading');

            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.92;
                utterance.pitch = 1.05;
                utterance.volume = 1;

                let isFinished = false;
                let errorHandled = false;

                utterance.onstart = function() {
                    if (loadingCancelled) {
                        stopSpeaking();
                        resolve();
                        return;
                    }
                    hideLoading();
                    isSpeaking = true;
                    isPlaying = true;
                    isPaused = false;
                    setStatus("🔊 Lecture en cours", 'speaking');
                    updatePlayButton();
                };

                utterance.onend = function() {
                    if (isFinished) return;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    setStatus("✅ Terminé", 'idle');
                    hideLoading();
                    updatePlayButton();
                    resolve();
                };

                utterance.onerror = function(e) {
                    if (isFinished || errorHandled) return;
                    errorHandled = true;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    hideLoading();
                    updatePlayButton();
                    
                    if (e.error === 'not-allowed') {
                        setStatus("⚠️ Permission refusée", 'error');
                    } else if (e.error === 'synthesis-unavailable') {
                        setStatus("⚠️ Synthèse indisponible", 'error');
                    } else if (e.error === 'canceled') {
                        setStatus("⏸ Annulé", 'paused');
                    } else {
                        setStatus("❌ Erreur audio: " + (e.error || 'inconnue'), 'error');
                    }
                    
                    resolve();
                };

                // Gestion du chargement des voix
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = function() {
                        if (!loadingCancelled) {
                            try {
                                synth.speak(utterance);
                            } catch(err) {
                                // Silencieux
                            }
                        }
                        synth.onvoiceschanged = null;
                    };
                }

                currentUtterance = utterance;
                
                if (!loadingCancelled) {
                    try {
                        synth.speak(utterance);
                    } catch(err) {
                        setTimeout(() => {
                            if (!loadingCancelled) {
                                try {
                                    synth.speak(utterance);
                                } catch(e) {
                                    setStatus("❌ Erreur de lecture", 'error');
                                    isPlaying = false;
                                    updatePlayButton();
                                    hideLoading();
                                    resolve();
                                }
                            } else {
                                resolve();
                            }
                        }, 100);
                    }
                } else {
                    resolve();
                }

            } catch(err) {
                hideLoading();
                setStatus("❌ Erreur générale", 'error');
                isPlaying = false;
                updatePlayButton();
                console.error('Erreur speakSlide:', err);
                resolve();
            }
        });
    }

    // ================================================================
    // NAVIGATION
    // ================================================================
    async function goToSlide(index) {
        if (isTransitioning) return;
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        
        // Si on est en train de lire, on met en pause avant de naviguer
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        // Arrêter complètement la lecture
        stopSpeaking();
        
        await new Promise(r => setTimeout(r, 50));
        
        if (index === currentIndex) {
            setStatus("📄 Slide actuel", 'idle');
            return;
        }

        isTransitioning = true;
        currentIndex = index;
        renderSlide(index);
        
        // Réinitialiser l'état de lecture
        isPlaying = false;
        updatePlayButton();
        setStatus("⏸ Lecture arrêtée", 'paused');

        await new Promise(r => setTimeout(r, 150));
        isTransitioning = false;
    }

    async function goToNext() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex + 1 < total) {
            await goToSlide(currentIndex + 1);
        } else {
            setStatus("🏁 Dernier slide", 'idle');
        }
    }

    async function goToPrev() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex - 1 >= 0) {
            await goToSlide(currentIndex - 1);
        } else {
            setStatus("🔁 Premier slide", 'idle');
        }
    }

    // ================================================================
    // GESTION PLAY/PAUSE
    // ================================================================
    function togglePlay() {
        if (!userInteracted) {
            userInteracted = true;
        }

        // Si le chargement est en cours, on l'annule
        if (isLoading) {
            cancelLoading();
            return;
        }

        // Si le synthétiseur est en pause, on reprend
        if (synth && synth.paused) {
            resumeSpeaking();
            return;
        }

        // Si la lecture est en cours, on met en pause
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
            return;
        }

        // Sinon, on démarre la lecture du slide courant
        if (!isSpeaking && !isPlaying) {
            stopSpeaking();
            speakSlide(currentIndex);
        }
    }

    // ================================================================
    // INIT
    // ================================================================
    async function init() {
        // Vérifier la compatibilité
        if (!window.speechSynthesis) {
            setStatus("❌ Synthèse vocale non supportée", 'error');
            speechSupported = false;
        }

        // Précharger les voix
        try {
            if (synth.getVoices) {
                synth.getVoices();
                setTimeout(() => {
                    try {
                        synth.getVoices();
                    } catch(e) {}
                }, 200);
            }
        } catch(e) {
            console.warn('Erreur chargement voix:', e);
        }

        // Afficher le premier slide
        renderSlide(0);
        $counter.text(`1 / ${total}`);
        
        // État initial
        setStatus("⏸ Appuie sur Play", 'paused');
        updatePlayButton();
        $autoIndicator.text('⏸ Lecture manuelle');

        // ================================================================
        // ÉVÉNEMENTS
        // ================================================================
        
        // Bouton Play/Pause
        $play.on('click', function() {
            togglePlay();
        });

        // Bouton Annuler le chargement
        $cancelLoading.on('click', function() {
            cancelLoading();
        });

        // Navigation
        $prev.on('click', function() {
            // Si chargement en cours, on annule
            if (isLoading) cancelLoading();
            goToPrev();
        });

        $next.on('click', function() {
            if (isLoading) cancelLoading();
            goToNext();
        });

        // Replay - relire le slide courant
        $replay.on('click', function() {
            if (isLoading) cancelLoading();
            stopSpeaking();
            setTimeout(() => {
                speakSlide(currentIndex);
            }, 100);
        });

        // Support du clavier (espace pour play/pause)
        $(document).on('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });

        // Nettoyage
        $(window).on('beforeunload', function() {
            try {
                if (synth.speaking) synth.cancel();
            } catch(e) {}
            hideLoading();
        });

        // Gérer les cas où la synthèse se termine de manière inattendue
        setInterval(() => {
            if (isPlaying && !synth.speaking && !synth.pending && !isPaused && !isLoading) {
                isPlaying = false;
                updatePlayButton();
                setStatus("⏸ Lecture arrêtée", 'paused');
            }
        }, 1000);
    }

    init();
});

        const appContainer = document.querySelector('.app-container');
        if (appContainer) {
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
        }
        
        const header = document.querySelector('.slide-header');
        if (header) {
            header.style.background = 'rgba(255, 255, 255, 0.85)';
        }
        
        const footer = document.querySelector('.slide-footer');
        if (footer) {
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
        }
        
        document.querySelectorAll('.content-card').forEach(card => {
            card.style.background = 'rgba(255,255,255,0.8)';
            card.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.note-box').forEach(note => {
            note.style.background = 'rgba(96, 165, 250, 0.12)';
            note.style.color = '#2c3e50';
        });
        
        document.querySelectorAll('.math-block').forEach(block => {
            block.style.background = 'rgba(0,0,0,0.05)';
            block.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.btn').forEach(btn => {
            btn.style.color = '#2d3748';
        });
        
        const statusBadge = document.querySelector('.status-badge');
        if (statusBadge) {
            statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
            statusBadge.style.color = '#2b6cb0';
        }
        
        const slideCounter = document.querySelector('.slide-counter');
        if (slideCounter) {
            slideCounter.style.color = '#4a5568';
        }
        
        const autoIndicator = document.querySelector('.auto-indicator');
        if (autoIndicator) {
            autoIndicator.style.color = '#718096';
        }
        
        document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
            if (!el.closest('.note-box')) {
                el.style.color = '#2c3e50';
            }
        });
        
        document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
            if (!el.closest('.note-box') && !el.closest('.math-block')) {
                el.style.color = '#2d3748';
            }
        });
        
        const themeBtn = document.getElementById('themeToggle');
        if (themeBtn) {
            themeBtn.textContent = '🌓';
            themeBtn.title = 'Passer en mode nuit';
        }
    });
</script>
</body>
</html>
