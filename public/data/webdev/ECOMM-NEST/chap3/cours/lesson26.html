<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 500px;
        margin: 0 auto;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    .slide-header {
        flex-shrink: 0;
        padding: 18px 16px 10px 16px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        z-index: 10;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .slide-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
    }

    .content-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 18px 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        flex-shrink: 0;
    }

    .content-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .content-card li {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        line-height: 1.5;
    }

    .content-card li:last-child {
        border-bottom: none;
    }

    .bullet-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
    }

    .math-block {
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        overflow-x: auto;
        flex-shrink: 0;
        margin: 4px 0;
    }

    .math-block .math {
        font-size: 1.2rem;
        color: #e2e8f0;
    }

    .note-box {
        background: rgba(96, 165, 250, 0.08);
        border-left: 4px solid #60a5fa;
        padding: 12px 16px;
        border-radius: 12px;
        font-style: italic;
        font-size: 0.9rem;
        color: #cbd5e1;
        flex-shrink: 0;
    }

    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        border-radius: 0;
        flex-direction: column;
    }

    .loading-card {
        background: #1e293b;
        padding: 32px 28px;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #334155;
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px auto;
    }

    .loading-text {
        font-weight: 600;
        font-size: 1.1rem;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    .loading-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 16px;
    }
    .loading-progress {
        height: 3px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        animation: loadingProgress 30s ease-out forwards;
    }

    .loading-timeout {
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 12px;
    }

    .btn-cancel-loading {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 40px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #f87171;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }

    .btn-cancel-loading:active {
        transform: scale(0.94);
        background: rgba(239, 68, 68, 0.25);
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
    }

    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .slide-counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255,255,255,0.05);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(255,255,255,0.04);
    }

    .status-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 30px;
        background: rgba(96, 165, 250, 0.12);
        color: #93bbfc;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
    }

    .status-badge .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: pulse-dot 1.2s infinite;
        flex-shrink: 0;
    }

    .status-badge.idle .dot {
        animation: none;
        background: #64748b;
    }
    .status-badge.speaking .dot {
        background: #34d399;
        animation: pulse-dot 0.8s infinite;
    }
    .status-badge.error .dot {
        background: #f87171;
        animation: none;
    }
    .status-badge.paused .dot {
        animation: none;
        background: #fbbf24;
    }
    .status-badge.waiting .dot {
        animation: pulse-dot 1.5s infinite;
        background: #fbbf24;
    }
    .status-badge.loading .dot {
        animation: pulse-dot 0.5s infinite;
        background: #60a5fa;
    }

    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.7); }
    }

    .footer-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(255,255,255,0.1);
    }

    .btn-secondary {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-play {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
        min-width: 80px;
        justify-content: center;
    }
    .btn-play:active {
        background: rgba(52, 211, 153, 0.25);
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
    }

    .auto-indicator {
        font-size: 0.65rem;
        color: #64748b;
        text-align: center;
        letter-spacing: 0.3px;
        padding: 2px 0;
    }

    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.2rem;
        }
        .content-card li {
            font-size: 0.9rem;
            padding: 8px 0;
        }

            padding: 6px 10px;
            min-height: 34px;
        }
        .btn-play {

        }
        .footer-buttons {
            gap: 5px;
        }
        .slide-body {

        }
        .loading-card {
            padding: 20px 16px;
        }
        .math-block .math {

        }
    }

    @media (min-width: 600px) {
        .app-container {
            max-width: 480px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
        .loading-overlay {
            border-radius: 32px;
        }

    /* Mode jour (par défaut) */
    html, body {
        background: #f0f4f8 !important;
        color: #1a202c !important;
    }
    .app-container {
        background: linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%) !important;
    }
    .slide-header {
        background: rgba(255, 255, 255, 0.85) !important;
        border-bottom: 1px solid rgba(0,0,0,0.08) !important;
    }
    .slide-header h1 {
        background: linear-gradient(135deg, #2b6cb0, #6b46c1) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        background-clip: text !important;
    }
    .slide-footer {
        background: rgba(255, 255, 255, 0.9) !important;
        border-top: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card {
        background: rgba(255,255,255,0.8) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card li {
        border-bottom: 1px solid rgba(0,0,0,0.05) !important;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.12) !important;
        border-left: 4px solid #4299e1 !important;
        color: #2c3e50 !important;
    }
    .math-block {
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .math-block .math {
        color: #2d3748 !important;
    }
    .slide-counter {
        color: #4a5568 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .status-badge {
        background: rgba(96, 165, 250, 0.15) !important;
        color: #2b6cb0 !important;
        border: 1px solid rgba(96, 165, 250, 0.15) !important;
    }
    .btn {
        color: #2d3748 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .btn-secondary {
        background: rgba(0,0,0,0.04) !important;
        border-color: rgba(0,0,0,0.08) !important;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15) !important;
        border-color: rgba(52, 211, 153, 0.2) !important;
        color: #38a169 !important;
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15) !important;
        border-color: rgba(251, 191, 36, 0.2) !important;

</style>
</head>
<body>

<div class="app-container">

    <header class="slide-header">
        <h1 id="slideTitle">Chargement...</h1>
    </header>

    <main class="slide-body" id="slideBody"></main>

    <!-- LOADING OVERLAY AVEC BOUTON ANNULER -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Préparation vocale...</div>
            <div class="loading-sub" id="loadingSub">Synthèse en cours</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loadingProgressBar"></div>
            </div>
            <div class="loading-timeout" id="loadingTimeout">⏱️ 30 secondes maximum</div>
            <button class="btn-cancel-loading" id="cancelLoadingBtn">
                <span>✕</span> Annuler
            </button>
        </div>
    </div>

    <footer class="slide-footer">
        <div class="footer-top">
            <span class="slide-counter" id="slideCounter">1 / 3</span>
            <span class="status-badge idle" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">Prêt</span>
            </span>
        </div>

        <div class="footer-buttons">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-secondary" id="replayBtn">
                <span class="btn-icon">🔁</span> <span class="btn-label">Relire</span>
            </button>
            <button class="btn btn-play" id="playBtn">
                <span class="btn-icon">▶</span> <span class="btn-label">Play</span>
            </button>
        </div>

        <div class="auto-indicator" id="autoIndicator">⏸ Lecture manuelle</div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // SLIDES
    // ================================================================
    const slides = [
  {
    "titre": "JWT Strategy + Guard",
    "contenu": "<div style='background: linear-gradient(135deg, #1e3c72, #2a5298); color: white; padding: 2rem; border-radius: 15px; text-align: center; margin-bottom: 1.5rem;'><h2 style='color: #fff; margin-bottom: 0.5rem;'>🛡️ JWT Strategy + Guard</h2><p style='color: #e0e0e0; font-size: 1.1rem;'>Protéger les endpoints avec Passport</p><hr style='border-color: #4a7db0; width: 50%;'><p style='color: #f0f0f0;'>Leçon 3.9 : Vérifier et valider les tokens JWT</p></div><p>Nous savons <strong>générer</strong> un token JWT avec <code>generateToken</code>. Mais comment le <strong>vérifier</strong> à chaque requête ? Comment recharger l'utilisateur à partir du token ? Comment <strong>protéger</strong> nos endpoints ? La réponse tient en deux briques complémentaires : la <strong>JwtStrategy</strong> (qui valide) et le <strong>JwtAuthGuard</strong> (qui bloque ou laisse passer). C'est ce que nous allons voir dans cette leçon.</p>",
    "texteParle": "Bonjour à toutes et à tous et bienvenue dans cette neuvième leçon du chapitre trois. Aujourd'hui, nous allons voir comment protéger nos endpoints avec un token JWT. Nous avons déjà vu comment générer un token après la connexion. Mais générer un token ne sert à rien si on ne le vérifie pas à chaque requête. Sinon, n'importe qui pourrait se prétendre utilisateur en envoyant un faux token. La réponse tient en deux briques complémentaires. La première, JwtStrategy : c'est la stratégie Passport qui valide le token et recharge l'utilisateur. La deuxième, JwtAuthGuard : c'est le guard NestJS qui bloque les requêtes non authentifiées et laisse passer les autres. Ensemble, ces deux briques forment le système de protection de nos endpoints. Chaque endpoint décoré avec UseGuards plus JwtAuthGuard sera protégé. C'est ce que nous allons voir. C'est parti.",
    "note": "Générer sans vérifier = inutile. Le couple Strategy + Guard est la clé de la protection."
  },
  {
    "titre": "Rappel : Passport.js",
    "contenu": "<div style='background: #f8f9fa; padding: 1.5rem; border-radius: 12px; border-left: 6px solid #2a5298;'><p style='color: #1e3c72; font-weight: bold; margin-top: 0;'>Passport est un framework d'authentification pour Node.js.</p><ul style='padding-left: 1.2rem; color: #333; line-height: 1.9;'><li>🎯 <strong>Multi-stratégies</strong> : JWT, OAuth, Basic, Google, Facebook...</li><li>🔌 <strong>Plugins</strong> : une stratégie par méthode d'auth</li><li>🔒 <strong>Standard</strong> : utilisé par des millions d'applications</li><li>🎨 <strong>Compatible NestJS</strong> via <code>@nestjs/passport</code></li></ul><p style='color: #333; margin-top: 1rem;'><strong>Pour SawaMart :</strong></p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.75rem; line-height: 1.6; white-space: pre;'>Passport + passport-jwt = vérification des tokens</div><p style='color: #555; font-size: 0.9rem; margin-top: 0.8rem;'>💡 On n'utilise que la stratégie JWT. Passport gère tout le reste.</p></div>",
    "texteParle": "Avant d'entrer dans le code, rappelons ce qu'est Passport.js. Passport est un framework d'authentification pour Node.js. Il a une approche unique : il sépare la logique d'authentification en ce qu'on appelle des stratégies. Chaque stratégie correspond à une méthode d'auth : JWT, OAuth, Basic, Google, Facebook, Apple, etc. Pour chaque méthode, il existe un paquet passport-xyz. Pour JWT, c'est passport-jwt. Pour Google, c'est passport-google-oauth20. Pour Facebook, c'est passport-facebook. Il y en a des centaines. Chaque stratégie est un plugin indépendant. Passport lui-même est très léger, il ne fait qu'orchestrer les stratégies. Cela a plusieurs avantages. Premièrement, c'est modulaire : on installe seulement les stratégies dont on a besoin. Deuxièmement, c'est un standard : passport est utilisé par des millions d'applications Node.js dans le monde. Troisièmement, NestJS l'intègre très bien via le paquet @nestjs/passport. Pour SawaMart, nous n'utilisons qu'une seule stratégie : JWT. Passport se charge d'extraire le token du header, de le vérifier avec notre secret, et d'appeler notre code de validation.",
    "note": "Passport = orchestrateur de stratégies. Une seule stratégie pour SawaMart : JWT."
  },
  {
    "titre": "Comprendre le flux JWT",
    "contenu": "<div style='background: #e9ecef; padding: 1rem; border-radius: 12px;'><p style='color: #333;'>Voici ce qui se passe à chaque requête protégée :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.7rem; line-height: 1.8; white-space: pre;'>1. Client envoie une requête protégée<br>&nbsp;&nbsp;&nbsp;GET /users/me<br>&nbsp;&nbsp;&nbsp;Authorization: Bearer eyJhbGci...<br><br>2. JwtAuthGuard intercepte la requête<br><br>3. JwtStrategy.extractJwt : extrait le token<br><br>4. JwtStrategy.validate : vérifie la signature + appelle notre code<br><br>5. Si OK : attache user à la requête<br>&nbsp;&nbsp;&nbsp;req.user = user<br><br>6. Sinon : 401 Unauthorized<br><br>7. Le controller utilise req.user.id</div></div>",
    "texteParle": "Comprendre ce qui se passe en interne nous aidera à mieux utiliser le système. À chaque requête protégée, plusieurs étapes se déroulent en cascade. Étape une : le client envoie une requête protégée, par exemple GET sur /users/me, avec un header Authorization Bearer suivi du token. Étape deux : le JwtAuthGuard intercepte la requête avant même que le contrôleur ne soit appelé. C'est le rôle du guard : bloquer ou laisser passer. Étape trois : la JwtStrategy extrait le token du header avec ExtractJwt.fromAuthHeaderAsBearerToken. C'est un helper qui cherche le préfixe Bearer et prend tout ce qui suit. Étape quatre : la JwtStrategy vérifie la signature du token. Elle décode le token, vérifie qu'il n'a pas expiré, vérifie que la signature est valide avec le secret. Puis, elle appelle notre méthode validate. Étape cinq : si tout est bon, l'utilisateur retourné par notre méthode validate est attaché à la requête, dans la propriété user. Étape six : si quelque chose ne va pas, une erreur 401 Unauthorized est renvoyée. Étape sept : si tout est bon, le contrôleur s'exécute, et il peut lire req.user pour accéder à l'utilisateur authentifié. C'est ce flux en sept étapes qui protège nos endpoints.",
    "note": "req.user est automatiquement rempli par Passport après validation. Utilisez-le dans vos contrôleurs."
  },
  {
    "titre": "Créer JwtStrategy - Partie 1",
    "contenu": "<div style='background: #f8f9fa; padding: 1rem; border-radius: 12px; border-left: 6px solid #10b981;'><p style='color: #333;'>Créons <code>src/auth/jwt.strategy.ts</code> :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.68rem; line-height: 1.6; white-space: pre;'>import { Injectable, UnauthorizedException } from '@nestjs/common';<br>import { PassportStrategy } from '@nestjs/passport';<br>import { ExtractJwt, Strategy } from 'passport-jwt';<br>import { ConfigService } from '@nestjs/config';<br>import { InjectRepository } from '@nestjs/typeorm';<br>import { Repository } from 'typeorm';<br>import { User } from '../database/entities/user.entity';<br><br>@Injectable()<br>export class JwtStrategy extends PassportStrategy(Strategy) {<br>&nbsp;&nbsp;constructor(<br>&nbsp;&nbsp;&nbsp;&nbsp;configService: ConfigService,<br>&nbsp;&nbsp;&nbsp;&nbsp;@InjectRepository(User)<br>&nbsp;&nbsp;&nbsp;&nbsp;private userRepository: Repository&lt;User&gt;,<br>&nbsp;&nbsp;) {<br>&nbsp;&nbsp;&nbsp;&nbsp;<span style='color: #6a9955;'>// ... config</span><br>&nbsp;&nbsp;}<br>}</div></div>",
    "texteParle": "Créons maintenant notre JwtStrategy dans le fichier src/auth/jwt.strategy.ts. On importe les décorateurs NestJS, PassportStrategy, ExtractJwt et Strategy depuis passport-jwt, ConfigService, InjectRepository, Repository, et l'entité User. On déclare la classe JwtStrategy qui étend PassportStrategy avec le paramètre Strategy. La classe doit être décorée avec Injectable. Dans le constructeur, on injecte ConfigService et UserRepository. Le constructeur doit appeler super avec un objet de configuration. Nous allons voir cet objet dans le slide suivant. Mais retenez l'idée principale : JwtStrategy hérite de PassportStrategy, ce qui lui donne toute la mécanique de Passport. Nous devons juste lui dire comment extraire le token et avec quel secret le vérifier. C'est un pattern très élégant : NestJS nous donne une classe de base, nous étendons, et nous configurons. Le reste est automatique. Notez que le UserRepository est injecté car nous allons en avoir besoin dans la méthode validate, pour recharger l'utilisateur depuis la base.",
    "note": "extends PassportStrategy(Strategy) : hérite de toute la logique JWT de Passport."
  },
  {
    "titre": "Créer JwtStrategy - Partie 2",
    "contenu": "<div style='background: #e9ecef; padding: 1rem; border-radius: 12px;'><p style='color: #333;'>La configuration dans <code>super()</code> :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.68rem; line-height: 1.6; white-space: pre;'>const jwtSecret = configService.get&lt;string&gt;('JWT_SECRET');<br>if (!jwtSecret) {<br>&nbsp;&nbsp;throw new Error('JWT_SECRET is not defined in configuration');<br>}<br><br>super({<br>&nbsp;&nbsp;jwtFromRequest: ExtractJwt.fromAuthHeaderAsBearerToken(),<br>&nbsp;&nbsp;ignoreExpiration: false,<br>&nbsp;&nbsp;secretOrKey: jwtSecret,<br>});</div><p style='color: #333; margin-top: 0.8rem;'><strong>Les 3 options :</strong></p><ul style='padding-left: 1.2rem; color: #333; line-height: 1.7;'><li>🔍 <code>jwtFromRequest</code> : comment extraire le token (header Bearer)</li><li>⏰ <code>ignoreExpiration</code> : à false, refuse les tokens expirés</li><li>🔐 <code>secretOrKey</code> : le secret pour vérifier la signature</li></ul><div style='background: #fff3cd; border-left: 4px solid #856404; padding: 0.8rem; border-radius: 4px; margin-top: 1rem;'><strong>⚠️ Important :</strong> on vérifie que JWT_SECRET existe AVANT d'appeler super. Sinon, l'erreur serait silencieuse et difficile à tracer.</div></div>",
    "texteParle": "Regardons la configuration dans super. On commence par lire JWT_SECRET depuis ConfigService. On vérifie qu'il existe. S'il est absent, on lève une erreur explicite. C'est crucial : sans cette vérification, si le secret était absent, Passport serait configuré avec undefined, et toutes les vérifications échoueraient silencieusement. On veut une erreur claire au démarrage, pas un bug cryptique en production. Puis on appelle super avec trois options. Première option : jwtFromRequest. C'est la fonction qui extrait le token du header HTTP. On utilise ExtractJwt.fromAuthHeaderAsBearerToken, qui cherche un header Authorization au format 'Bearer xxx' et retourne le token. Deuxième option : ignoreExpiration. À false, ce qui signifie que Passport refuse les tokens expirés. On pourrait mettre true pour les ignorer, mais ce serait un choix dangereux : un token volé pourrait être utilisé indéfiniment. Donc false, sans exception. Troisième option : secretOrKey. C'est le secret utilisé pour vérifier la signature du token. Il doit être identique à celui utilisé pour signer, évidemment. Sinon, aucun token ne sera accepté. Une fois ces trois options configurées, Passport sait comment vérifier nos tokens. Il ne reste plus qu'à définir la méthode validate.",
    "note": "Toujours vérifier que JWT_SECRET existe avant super(). Erreur claire vaut mieux que bug silencieux."
  },
  {
    "titre": "La méthode validate",
    "contenu": "<div style='background: #f8f9fa; padding: 1rem; border-radius: 12px; border-left: 6px solid #a78bfa;'><p style='color: #333;'>La méthode <code>validate</code> est le cœur de la stratégie :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.68rem; line-height: 1.6; white-space: pre;'>async validate(payload: any) {<br>&nbsp;&nbsp;<span style='color: #6a9955;'>// payload = { sub, phone, username, role, iat, exp }</span><br>&nbsp;&nbsp;const user = await this.userRepository.findOne({<br>&nbsp;&nbsp;&nbsp;&nbsp;where: { id: payload.sub },<br>&nbsp;&nbsp;&nbsp;&nbsp;relations: { profile: true },<br>&nbsp;&nbsp;});<br><br>&nbsp;&nbsp;if (!user) {<br>&nbsp;&nbsp;&nbsp;&nbsp;throw new UnauthorizedException('Utilisateur non trouvé');<br>&nbsp;&nbsp;}<br><br>&nbsp;&nbsp;if (user.is_blocked) {<br>&nbsp;&nbsp;&nbsp;&nbsp;throw new UnauthorizedException('Votre compte a été bloqué');<br>&nbsp;&nbsp;}<br><br>&nbsp;&nbsp;return user;<br>}</div></div>",
    "texteParle": "Regardons la méthode validate, qui est le cœur de notre stratégie. Cette méthode est appelée automatiquement par Passport après que la signature du token a été vérifiée. Elle reçoit en paramètre le payload du token, c'est-à-dire l'objet qu'on avait mis lors de la génération. Elle contient sub, phone, username, role, iat, exp. La méthode validate fait trois choses. Premièrement, elle recharge l'utilisateur depuis la base, en cherchant par son identifiant, qu'on trouve dans payload.sub. On charge aussi la relation profile pour avoir toutes les infos. Pourquoi recharger depuis la base au lieu de se fier au token ? Parce que le token peut être ancien : l'utilisateur a peut-être été bloqué, ou son profil a peut-être été modifié. Si on se fiait au token, on aurait des informations périmées. En rechargeant, on obtient l'état actuel de l'utilisateur. Deuxièmement, si l'utilisateur n'existe pas, on lève une UnauthorizedException. Cela peut arriver si l'utilisateur a été supprimé mais que le token est encore valide. Troisièmement, si l'utilisateur est bloqué, on lève aussi une UnauthorizedException. C'est une sécurité : même si l'utilisateur a un token valide, s'il est bloqué, il n'a plus accès. Enfin, on retourne l'utilisateur. Passport va l'attacher à la requête dans req.user. C'est ce que le contrôleur pourra lire.",
    "note": "Recharger l'utilisateur à chaque requête est une sécurité. Un token ancien ne reflète pas l'état actuel."
  },
  {
    "titre": "Le JwtAuthGuard",
    "contenu": "<div style='background: #e9ecef; padding: 1rem; border-radius: 12px;'><p style='color: #333;'>Créons <code>src/auth/jwt-auth.guard.ts</code> :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.72rem; line-height: 1.6; white-space: pre;'>import { Injectable } from '@nestjs/common';<br>import { AuthGuard } from '@nestjs/passport';<br><br>@Injectable()<br>export class JwtAuthGuard extends AuthGuard('jwt') {}</div><p style='color: #333; margin-top: 0.8rem;'><strong>C'est tout ? Oui !</strong></p><ul style='padding-left: 1.2rem; color: #333; line-height: 1.7;'><li>🎯 <code>AuthGuard('jwt')</code> lie le guard à la stratégie 'jwt'</li><li>🔄 Toute la logique est dans la stratégie</li><li>✨ Le guard ne fait que bloquer ou laisser passer</li></ul><div style='background: #d1ecf1; border-left: 4px solid #0c5460; padding: 0.8rem; border-radius: 4px; margin-top: 1rem;'><strong>💡 Astuce :</strong> la chaîne 'jwt' doit correspondre au nom par défaut de la stratégie. On peut la personnaliser avec <code>PassportStrategy(Strategy, 'mon-nom')</code>.</div></div>",
    "texteParle": "Créons maintenant notre JwtAuthGuard dans le fichier src/auth/jwt-auth.guard.ts. Il est extrêmement simple : juste trois lignes. On importe AuthGuard de @nestjs/passport. On déclare la classe JwtAuthGuard qui étend AuthGuard avec le paramètre 'jwt'. Et c'est tout. Pas de méthode, pas de logique. C'est surprenant au début, mais c'est la beauté de l'architecture NestJS plus Passport. Toute la logique est dans la stratégie. Le guard est juste une enveloppe qui déclenche la stratégie. Le paramètre 'jwt' correspond au nom par défaut de la stratégie. Si on avait nommé notre stratégie différemment avec PassportStrategy(Strategy, 'mon-nom'), on aurait mis AuthGuard('mon-nom'). Par convention, on utilise 'jwt', c'est le nom par défaut. Comment on utilise ce guard ? Sur un contrôleur ou une méthode, on ajoute le décorateur UseGuards(JwtAuthGuard). C'est tout. À partir de ce moment, toutes les requêtes sur cet endpoint seront vérifiées. Si le token est absent, invalide, ou expiré, la requête est rejetée avec une erreur 401. Si le token est valide, la requête passe, et le contrôleur peut lire req.user. C'est d'une simplicité remarquable. Une seule ligne de décorateur, et votre endpoint est protégé.",
    "note": "Un guard peut être une simple classe vide. La logique est dans la stratégie."
  },
  {
    "titre": "Utiliser le guard sur les endpoints",
    "contenu": "<div style='background: #f8f9fa; padding: 1rem; border-radius: 12px; border-left: 6px solid #2a5298;'><p style='color: #333;'>Exemples d'utilisation :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.68rem; line-height: 1.6; white-space: pre;'><span style='color: #6a9955;'>// Protéger un endpoint individuel</span><br>@Get('me')<br>@UseGuards(JwtAuthGuard)<br>async getProfile(@Request() req) {<br>&nbsp;&nbsp;return UserResponseDto.fromUser(req.user);<br>}<br><br><span style='color: #6a9955;'>// Protéger tout un contrôleur</span><br>@Controller('users')<br>@UseGuards(JwtAuthGuard)<br>export class UsersController { ... }<br><br><span style='color: #6a9955;'>// Endpoint public (pas de guard)</span><br>@Get('public-info')<br>async publicInfo() {<br>&nbsp;&nbsp;return { message: 'Accessible à tous' };<br>}</div></div>",
    "texteParle": "Voyons comment utiliser le guard. Il y a deux façons principales. La première, sur un endpoint individuel. On décore la méthode avec UseGuards plus JwtAuthGuard. Cela protège uniquement cet endpoint. La méthode peut ensuite lire req.user pour accéder à l'utilisateur. C'est ce que fait l'endpoint /auth/me par exemple. La deuxième façon, sur tout un contrôleur. On décore la classe du contrôleur avec UseGuards plus JwtAuthGuard. Cela protège tous les endpoints du contrôleur en une seule fois. Si on veut un endpoint public malgré ça, on peut le décorer avec un autre guard ou retirer le guard du contrôleur. C'est plus rare. On utilise plutôt la protection endpoint par endpoint. Notez que les endpoints publics, comme la page d'accueil ou la liste des catégories, n'ont pas besoin de guard. Un utilisateur anonyme peut les consulter. Si plus tard on veut savoir qui consulte, on peut utiliser un guard optionnel, mais ce n'est pas notre cas. Ce qu'il faut retenir : UseGuards plus JwtAuthGuard sur un endpoint, et le tour est joué. Les requêtes sans token valide seront rejetées avec un 401.",
    "note": "UseGuards(JwtAuthGuard) protège un endpoint. C'est tout ce qu'il faut."
  },
  {
    "titre": "Le décorateur @Roles()",
    "contenu": "<div style='background: #e9ecef; padding: 1rem; border-radius: 12px;'><p style='color: #333;'>Pour les rôles, on utilise un décorateur personnalisé :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.7rem; line-height: 1.6; white-space: pre;'><span style='color: #6a9955;'>// src/common/decorators/roles.decorator.ts</span><br>import { SetMetadata } from '@nestjs/common';<br>import { UserRole } from '../../database/entities/user.entity';<br><br>export const ROLES_KEY = 'roles';<br>export const Roles = (...roles: UserRole[]) =&gt; SetMetadata(ROLES_KEY, roles);</div><p style='color: #333; margin-top: 0.8rem;'><strong>Utilisation :</strong></p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.7rem; line-height: 1.6; white-space: pre;'>@Get('admin-only')<br>@UseGuards(JwtAuthGuard, RolesGuard)<br>@Roles(UserRole.ADMIN)<br>async adminOnly() { ... }</div><p style='color: #555; font-size: 0.9rem; margin-top: 0.8rem;'>💡 <code>SetMetadata</code> attache les rôles à la route. Le RolesGuard les lira.</p></div>",
    "texteParle": "Pour protéger certains endpoints par rôle, on utilise un décorateur personnalisé Roles. Ce décorateur utilise SetMetadata, une fonction NestJS qui attache des métadonnées à une route. On définit une clé ROLES_KEY, qui sera le nom de la métadonnée. Puis on déclare le décorateur Roles, qui prend en paramètre une liste de rôles autorisés, et utilise SetMetadata pour les attacher. Voilà comment on l'utilise. Sur un endpoint, on ajoute UseGuards avec JwtAuthGuard ET RolesGuard. Le JwtAuthGuard vérifie que l'utilisateur est authentifié. Le RolesGuard vérifie que son rôle est dans la liste des rôles autorisés. Puis on décore avec Roles en passant les rôles autorisés. Par exemple, Roles UserRole.ADMIN signifie que seuls les admins peuvent accéder à cet endpoint. Si un utilisateur normal essaie, il reçoit une erreur 403 Forbidden. C'est une distinction importante : 401 quand on n'est pas authentifié, 403 quand on est authentifié mais pas autorisé. On combine souvent JwtAuthGuard et RolesGuard. Le premier vérifie l'identité, le second vérifie les permissions. On verra le RolesGuard dans la prochaine leçon.",
    "note": "401 = pas authentifié. 403 = authentifié mais pas autorisé. Ne confondez pas."
  },
  {
    "titre": "Déclarer dans AuthModule",
    "contenu": "<div style='background: #f8f9fa; padding: 1rem; border-radius: 12px; border-left: 6px solid #10b981;'><p style='color: #333;'>Il faut enregistrer JwtStrategy et exporter le guard :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.68rem; line-height: 1.6; white-space: pre;'>@Module({<br>&nbsp;&nbsp;imports: [<br>&nbsp;&nbsp;&nbsp;&nbsp;TypeOrmModule.forFeature([User, UserProfile]),<br>&nbsp;&nbsp;&nbsp;&nbsp;PassportModule.register({ defaultStrategy: 'jwt' }),<br>&nbsp;&nbsp;&nbsp;&nbsp;JwtModule.registerAsync({ ... }),<br>&nbsp;&nbsp;&nbsp;&nbsp;ConfigurationModule,<br>&nbsp;&nbsp;],<br>&nbsp;&nbsp;controllers: [AuthController],<br>&nbsp;&nbsp;providers: [<br>&nbsp;&nbsp;&nbsp;&nbsp;AuthService, OtpService,<br>&nbsp;&nbsp;&nbsp;&nbsp;JwtStrategy, <span style='color: #6a9955;'>// ← enregistrer la stratégie</span><br>&nbsp;&nbsp;&nbsp;&nbsp;LoginAttemptService,<br>&nbsp;&nbsp;],<br>&nbsp;&nbsp;exports: [AuthService, JwtStrategy, PassportModule],<br>})<br>export class AuthModule {}</div><p style='color: #555; font-size: 0.9rem; margin-top: 0.8rem;'>💡 <code>PassportModule.register({ defaultStrategy: 'jwt' })</code> active Passport dans ce module.</p></div>",
    "texteParle": "Pour que tout ça fonctionne, il faut enregistrer la JwtStrategy dans le AuthModule. Regardez les trois modifications importantes. Premièrement, dans les imports, on ajoute PassportModule.register avec defaultStrategy 'jwt'. Cela active Passport dans ce module et définit la stratégie par défaut. Deuxièmement, dans les providers, on ajoute JwtStrategy. C'est crucial : sans cette ligne, NestJS ne saura pas que la stratégie existe, et elle ne sera jamais appelée. C'est une erreur classique des débutants : on écrit la stratégie, mais on oublie de l'enregistrer. Troisièmement, dans les exports, on exporte PassportModule. Cela permet à d'autres modules d'utiliser les guards et décorateurs liés à Passport. Le module AuthModule exporte aussi AuthService, ce qui permet à d'autres modules d'utiliser l'authentification. On exporte JwtStrategy également, ce qui peut être utile dans de rares cas. En général, l'important est d'enregistrer la stratégie dans les providers du module où elle est définie. Une fois ces trois modifications faites, tout est en place. Le guard peut être utilisé n'importe où dans l'application, en important JwtAuthGuard depuis le fichier où il est défini.",
    "note": "Enregistrer JwtStrategy dans les providers est obligatoire. Sans ça, elle ne sera jamais appelée."
  },
  {
    "titre": "Résumé et prochaine étape",
    "contenu": "<div style='background: linear-gradient(135deg, #1e3c72, #2a5298); color: white; padding: 2rem; border-radius: 15px; text-align: center;'><h3 style='color: #fff;'>🎉 JWT Strategy maîtrisée !</h3><p style='color: #e0e0e0;'>Vos endpoints sont maintenant protégés.</p><hr style='border-color: #4a7db0; width: 50%;'><p style='color: #f0f0f0; margin-bottom: 0.5rem;'>Ce que nous avons appris :</p><ul style='text-align: left; padding-left: 1.5rem; color: #f0f0f0; line-height: 1.8;'><li>✅ Le rôle de Passport.js</li><li>✅ Le flux complet d'une requête protégée</li><li>✅ Créer la <code>JwtStrategy</code></li><li>✅ La méthode <code>validate</code> : recharger l'utilisateur</li><li>✅ Le <code>JwtAuthGuard</code> : une classe vide</li><li>✅ Utilisation : <code>@UseGuards(JwtAuthGuard)</code></li><li>✅ Le décorateur <code>@Roles()</code></li><li>✅ Déclarer dans <code>AuthModule</code></li></ul><p style='color: #f0f0f0; margin-top: 1rem;'>👉 <strong>Prochaine leçon :</strong> RolesGuard et décorateur @Roles()</p></div>",
    "texteParle": "Résumons cette leçon. Nous avons vu le rôle de Passport.js : c'est un orchestrateur de stratégies d'authentification. Pour SawaMart, nous utilisons uniquement la stratégie JWT. Nous avons détaillé le flux d'une requête protégée en sept étapes : le guard intercepte, la stratégie extrait le token, vérifie la signature, appelle validate, attache l'utilisateur à la requête. Nous avons créé la JwtStrategy en étendant PassportStrategy. Le constructeur appelle super avec trois options : jwtFromRequest pour extraire le token du header Authorization, ignoreExpiration à false pour refuser les tokens expirés, et secretOrKey avec JWT_SECRET pour vérifier la signature. La méthode validate recharge l'utilisateur depuis la base, vérifie qu'il existe et n'est pas bloqué, puis le retourne. Nous avons créé le JwtAuthGuard en étendant AuthGuard avec 'jwt'. C'est une classe vide, toute la logique est dans la stratégie. Nous avons vu comment utiliser ce guard sur un endpoint ou un contrôleur avec UseGuards. Nous avons introduit le décorateur Roles pour l'autorisation basée sur les rôles. Et nous avons vu comment déclarer JwtStrategy dans AuthModule : c'est obligatoire, sinon elle n'est jamais appelée. Dans la prochaine leçon, nous allons voir le RolesGuard en détail : comment il lit les métadonnées Roles et refuse les utilisateurs qui n'ont pas le bon rôle. À très bientôt !",
    "note": "Le couple JwtStrategy + JwtAuthGuard est la base de la protection. Bien le maîtriser."
  }
];

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentIndex = 0;
    let isSpeaking = false;
    let isPaused = false;
    let currentUtterance = null;
    let isLoading = false;
    let loadingTimeout = null;
    let isTransitioning = false;
    let speechSupported = true;
    let userInteracted = false;
    let isPlaying = false;
    let loadingCancelled = false;

    const total = slides.length;
    const synth = window.speechSynthesis;

    // Références jQuery
    const $title = $('#slideTitle');
    const $body = $('#slideBody');
    const $counter = $('#slideCounter');
    const $statusText = $('#statusText');
    const $statusBadge = $('#statusBadge');
    const $loading = $('#loadingOverlay');
    const $loadingText = $('#loadingText');
    const $loadingSub = $('#loadingSub');
    const $loadingTimeout = $('#loadingTimeout');
    const $loadingProgressBar = $('#loadingProgressBar');
    const $autoIndicator = $('#autoIndicator');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $replay = $('#replayBtn');
    const $play = $('#playBtn');
    const $cancelLoading = $('#cancelLoadingBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function setStatus(text, type) {
        $statusText.text(text);
        $statusBadge.removeClass('idle speaking error paused waiting loading');
        if (type === 'speaking') $statusBadge.addClass('speaking');
        else if (type === 'error') $statusBadge.addClass('error');
        else if (type === 'paused') $statusBadge.addClass('paused');
        else if (type === 'waiting') $statusBadge.addClass('waiting');
        else if (type === 'loading') $statusBadge.addClass('loading');
        else $statusBadge.addClass('idle');
    }

    function updatePlayButton() {
        if (isPlaying) {
            $play.addClass('playing');
            $play.find('.btn-icon').text('⏸');
            $play.find('.btn-label').text('Pause');
        } else {
            $play.removeClass('playing');
            $play.find('.btn-icon').text('▶');
            $play.find('.btn-label').text('Play');
        }
    }

    function showLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        
        loadingCancelled = false;
        isLoading = true;
        
        // Réinitialiser la barre de progression
        $loadingProgressBar.css('animation', 'none');
        $loadingProgressBar.css('width', '0%');
        // Forcer un reflow
        $loadingProgressBar[0].offsetHeight;
        $loadingProgressBar.css('animation', 'loadingProgress 30s ease-out forwards');
        
        $loadingText.text('Préparation vocale...');
        $loadingSub.text('Synthèse en cours');
        $loadingTimeout.text('⏱️ 30 secondes maximum');
        $loading.fadeIn(300);
        setStatus("⏳ Chargement...", 'loading');
        
        // 🔥 TIMEOUT DE 30 SECONDES
        loadingTimeout = setTimeout(() => {
            if (isLoading && !loadingCancelled) {
                hideLoading();
                setStatus("⚠️ Délai dépassé (30s)", 'error');
                isPlaying = false;
                updatePlayButton();
                $loadingSub.text('La synthèse vocale a pris trop de temps');
                $loadingTimeout.text('❌ Délai dépassé');
            }
        }, 30000);
    }

    function hideLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        isLoading = false;
        loadingCancelled = false;
        $loading.fadeOut(300);
        // Ne pas changer le statut si on est en train de parler
        if (!isSpeaking && !isPlaying) {
            setStatus("⏸ Lecture arrêtée", 'paused');
        }
    }

    function cancelLoading() {
        loadingCancelled = true;
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        hideLoading();
        stopSpeaking();
        setStatus("⏸ Annulé", 'paused');
        isPlaying = false;
        updatePlayButton();
        $loadingText.text('Annulé par l\'utilisateur');
        $loadingSub.text('Vous pouvez réessayer');
        $loadingTimeout.text('✕ Annulation');
    }

    // Arrêter la parole proprement
    function stopSpeaking() {
        try {
            if (synth && (synth.speaking || synth.pending)) {
                synth.cancel();
            }
        } catch(e) {
            console.warn('Erreur stopSpeaking:', e);
        }
        if (currentUtterance) {
            try {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance.onstart = null;
            } catch(e) {}
            currentUtterance = null;
        }
        isSpeaking = false;
        isPlaying = false;
        updatePlayButton();
    }

    // Mettre en pause la parole
    function pauseSpeaking() {
        try {
            if (synth && synth.speaking) {
                synth.pause();
                isPaused = true;
                isPlaying = false;
                setStatus("⏸ Lecture en pause", 'paused');
                updatePlayButton();
            }
        } catch(e) {
            console.warn('Erreur pauseSpeaking:', e);
            stopSpeaking();
        }
    }

    // Reprendre la parole
    function resumeSpeaking() {
        try {
            if (synth && synth.paused) {
                synth.resume();
                isPaused = false;
                isPlaying = true;
                setStatus("🔊 Lecture en cours", 'speaking');
                updatePlayButton();
            } else if (!isSpeaking && !synth.speaking && !synth.pending) {
                speakSlide(currentIndex);
            }
        } catch(e) {
            console.warn('Erreur resumeSpeaking:', e);
            speakSlide(currentIndex);
        }
    }

    function renderSlide(index) {
        const slide = slides[index];
        $title.text(slide.titre);

        let html = '';
        html += `<div class="content-card">${slide.contenu}</div>`;
        if (slide.note) {
            html += `<div class="note-box">${slide.note}</div>`;
        }
        $body.html(html);
        $counter.text(`${index+1} / ${total}`);

        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
        }
    }

    // ================================================================
    // LECTURE VOCALE
    // ================================================================
    function speakSlide(index) {
        return new Promise((resolve) => {
            const slide = slides[index];
            const text = slide.texteParle;
            
            if (!text || text.trim() === '' || !speechSupported) {
                resolve();
                return;
            }

            if (!window.speechSynthesis) {
                setStatus("❌ Synthèse vocale non supportée", 'error');
                speechSupported = false;
                resolve();
                return;
            }

            // Arrêter toute lecture en cours
            stopSpeaking();
            
            // Réinitialiser l'état de pause
            isPaused = false;
            
            showLoading();
            setStatus("Initialisation...", 'loading');

            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.92;
                utterance.pitch = 1.05;
                utterance.volume = 1;

                let isFinished = false;
                let errorHandled = false;

                utterance.onstart = function() {
                    if (loadingCancelled) {
                        stopSpeaking();
                        resolve();
                        return;
                    }
                    hideLoading();
                    isSpeaking = true;
                    isPlaying = true;
                    isPaused = false;
                    setStatus("🔊 Lecture en cours", 'speaking');
                    updatePlayButton();
                };

                utterance.onend = function() {
                    if (isFinished) return;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    setStatus("✅ Terminé", 'idle');
                    hideLoading();
                    updatePlayButton();
                    resolve();
                };

                utterance.onerror = function(e) {
                    if (isFinished || errorHandled) return;
                    errorHandled = true;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    hideLoading();
                    updatePlayButton();
                    
                    if (e.error === 'not-allowed') {
                        setStatus("⚠️ Permission refusée", 'error');
                    } else if (e.error === 'synthesis-unavailable') {
                        setStatus("⚠️ Synthèse indisponible", 'error');
                    } else if (e.error === 'canceled') {
                        setStatus("⏸ Annulé", 'paused');
                    } else {
                        setStatus("❌ Erreur audio: " + (e.error || 'inconnue'), 'error');
                    }
                    
                    resolve();
                };

                // Gestion du chargement des voix
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = function() {
                        if (!loadingCancelled) {
                            try {
                                synth.speak(utterance);
                            } catch(err) {
                                // Silencieux
                            }
                        }
                        synth.onvoiceschanged = null;
                    };
                }

                currentUtterance = utterance;
                
                if (!loadingCancelled) {
                    try {
                        synth.speak(utterance);
                    } catch(err) {
                        setTimeout(() => {
                            if (!loadingCancelled) {
                                try {
                                    synth.speak(utterance);
                                } catch(e) {
                                    setStatus("❌ Erreur de lecture", 'error');
                                    isPlaying = false;
                                    updatePlayButton();
                                    hideLoading();
                                    resolve();
                                }
                            } else {
                                resolve();
                            }
                        }, 100);
                    }
                } else {
                    resolve();
                }

            } catch(err) {
                hideLoading();
                setStatus("❌ Erreur générale", 'error');
                isPlaying = false;
                updatePlayButton();
                console.error('Erreur speakSlide:', err);
                resolve();
            }
        });
    }

    // ================================================================
    // NAVIGATION
    // ================================================================
    async function goToSlide(index) {
        if (isTransitioning) return;
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        
        // Si on est en train de lire, on met en pause avant de naviguer
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        // Arrêter complètement la lecture
        stopSpeaking();
        
        await new Promise(r => setTimeout(r, 50));
        
        if (index === currentIndex) {
            setStatus("📄 Slide actuel", 'idle');
            return;
        }

        isTransitioning = true;
        currentIndex = index;
        renderSlide(index);
        
        // Réinitialiser l'état de lecture
        isPlaying = false;
        updatePlayButton();
        setStatus("⏸ Lecture arrêtée", 'paused');

        await new Promise(r => setTimeout(r, 150));
        isTransitioning = false;
    }

    async function goToNext() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex + 1 < total) {
            await goToSlide(currentIndex + 1);
        } else {
            setStatus("🏁 Dernier slide", 'idle');
        }
    }

    async function goToPrev() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex - 1 >= 0) {
            await goToSlide(currentIndex - 1);
        } else {
            setStatus("🔁 Premier slide", 'idle');
        }
    }

    // ================================================================
    // GESTION PLAY/PAUSE
    // ================================================================
    function togglePlay() {
        if (!userInteracted) {
            userInteracted = true;
        }

        // Si le chargement est en cours, on l'annule
        if (isLoading) {
            cancelLoading();
            return;
        }

        // Si le synthétiseur est en pause, on reprend
        if (synth && synth.paused) {
            resumeSpeaking();
            return;
        }

        // Si la lecture est en cours, on met en pause
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
            return;
        }

        // Sinon, on démarre la lecture du slide courant
        if (!isSpeaking && !isPlaying) {
            stopSpeaking();
            speakSlide(currentIndex);
        }
    }

    // ================================================================
    // INIT
    // ================================================================
    async function init() {
        // Vérifier la compatibilité
        if (!window.speechSynthesis) {
            setStatus("❌ Synthèse vocale non supportée", 'error');
            speechSupported = false;
        }

        // Précharger les voix
        try {
            if (synth.getVoices) {
                synth.getVoices();
                setTimeout(() => {
                    try {
                        synth.getVoices();
                    } catch(e) {}
                }, 200);
            }
        } catch(e) {
            console.warn('Erreur chargement voix:', e);
        }

        // Afficher le premier slide
        renderSlide(0);
        $counter.text(`1 / ${total}`);
        
        // État initial
        setStatus("⏸ Appuie sur Play", 'paused');
        updatePlayButton();
        $autoIndicator.text('⏸ Lecture manuelle');

        // ================================================================
        // ÉVÉNEMENTS
        // ================================================================
        
        // Bouton Play/Pause
        $play.on('click', function() {
            togglePlay();
        });

        // Bouton Annuler le chargement
        $cancelLoading.on('click', function() {
            cancelLoading();
        });

        // Navigation
        $prev.on('click', function() {
            // Si chargement en cours, on annule
            if (isLoading) cancelLoading();
            goToPrev();
        });

        $next.on('click', function() {
            if (isLoading) cancelLoading();
            goToNext();
        });

        // Replay - relire le slide courant
        $replay.on('click', function() {
            if (isLoading) cancelLoading();
            stopSpeaking();
            setTimeout(() => {
                speakSlide(currentIndex);
            }, 100);
        });

        // Support du clavier (espace pour play/pause)
        $(document).on('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });

        // Nettoyage
        $(window).on('beforeunload', function() {
            try {
                if (synth.speaking) synth.cancel();
            } catch(e) {}
            hideLoading();
        });

        // Gérer les cas où la synthèse se termine de manière inattendue
        setInterval(() => {
            if (isPlaying && !synth.speaking && !synth.pending && !isPaused && !isLoading) {
                isPlaying = false;
                updatePlayButton();
                setStatus("⏸ Lecture arrêtée", 'paused');
            }
        }, 1000);
    }

    init();
});



    // ================================================================
    // GESTION DU THÈME JOUR/NUIT
    // ================================================================
    let isDarkMode = false;

    function toggleTheme() {
        isDarkMode = !isDarkMode;
        const body = document.body;
        const appContainer = document.querySelector('.app-container');
        const header = document.querySelector('.slide-header');
        const footer = document.querySelector('.slide-footer');
        const contentCards = document.querySelectorAll('.content-card');
        const noteBoxes = document.querySelectorAll('.note-box');
        const mathBlocks = document.querySelectorAll('.math-block');
        const buttons = document.querySelectorAll('.btn');
        const statusBadge = document.querySelector('.status-badge');
        const slideCounter = document.querySelector('.slide-counter');
        const autoIndicator = document.querySelector('.auto-indicator');
        const themeBtn = document.getElementById('themeToggle');

        if (isDarkMode) {
            // Mode nuit
            body.style.background = '#0b1120';
            body.style.color = '#f1f5f9';
            appContainer.style.background = 'linear-gradient(145deg, #0f172a 0%, #1e293b 100%)';
            header.style.background = 'rgba(15, 23, 42, 0.85)';
            footer.style.background = 'rgba(15, 23, 42, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.05)';
                card.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.08)';
                note.style.color = '#cbd5e1';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.25)';
                block.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#e2e8f0';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.12)';
                statusBadge.style.color = '#93bbfc';
            }
            if (slideCounter) {
                slideCounter.style.color = '#94a3b8';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#64748b';
            }
            if (themeBtn) {
                themeBtn.textContent = '☀️';
                themeBtn.title = 'Passer en mode jour';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#e2e8f0';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#e2e8f0';
                }
            });
        } else {
            // Mode jour (par défaut)
            body.style.background = '#f0f4f8';
            body.style.color = '#1a202c';
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
            header.style.background = 'rgba(255, 255, 255, 0.85)';
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.8)';
                card.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.12)';
                note.style.color = '#2c3e50';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.05)';
                block.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#2d3748';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
                statusBadge.style.color = '#2b6cb0';
            }
            if (slideCounter) {
                slideCounter.style.color = '#4a5568';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#718096';
            }
            if (themeBtn) {
                themeBtn.textContent = '🌓';
                themeBtn.title = 'Passer en mode nuit';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#2c3e50';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#2d3748';
                }
            });
        }
    }

    // Initialiser en mode jour
    document.addEventListener('DOMContentLoaded', function() {
        // Appliquer le mode jour par défaut
        const body = document.body;
        body.style.background = '#f0f4f8';
        body.style.color = '#1a202c';
        
        const appContainer = document.querySelector('.app-container');
        if (appContainer) {
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
        }
        
        const header = document.querySelector('.slide-header');
        if (header) {
            header.style.background = 'rgba(255, 255, 255, 0.85)';
        }
        
        const footer = document.querySelector('.slide-footer');
        if (footer) {
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
        }
        
        document.querySelectorAll('.content-card').forEach(card => {
            card.style.background = 'rgba(255,255,255,0.8)';
            card.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.note-box').forEach(note => {
            note.style.background = 'rgba(96, 165, 250, 0.12)';
            note.style.color = '#2c3e50';
        });
        
        document.querySelectorAll('.math-block').forEach(block => {
            block.style.background = 'rgba(0,0,0,0.05)';
            block.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.btn').forEach(btn => {
            btn.style.color = '#2d3748';
        });
        
        const statusBadge = document.querySelector('.status-badge');
        if (statusBadge) {
            statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
            statusBadge.style.color = '#2b6cb0';
        }
        
        const slideCounter = document.querySelector('.slide-counter');
        if (slideCounter) {
            slideCounter.style.color = '#4a5568';
        }
        
        const autoIndicator = document.querySelector('.auto-indicator');
        if (autoIndicator) {
            autoIndicator.style.color = '#718096';
        }
        
        document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
            if (!el.closest('.note-box')) {
                el.style.color = '#2c3e50';
            }
        });
        
        document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
            if (!el.closest('.note-box') && !el.closest('.math-block')) {
                el.style.color = '#2d3748';
            }
        });
        
        const themeBtn = document.getElementById('themeToggle');
        if (themeBtn) {
            themeBtn.textContent = '🌓';
            themeBtn.title = 'Passer en mode nuit';
        }
    });
</script>
