<!DOCTYPE html>
<html lang="fr">
<head>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 500px;
        margin: 0 auto;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    .slide-header {
        flex-shrink: 0;
        padding: 18px 16px 10px 16px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        z-index: 10;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .slide-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
    }

    .content-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 18px 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        flex-shrink: 0;
    }

    .content-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .content-card li {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        line-height: 1.5;
    }

    .content-card li:last-child {
        border-bottom: none;
    }

    .bullet-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
    }

    .math-block {
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        overflow-x: auto;
        flex-shrink: 0;
        margin: 4px 0;
    }

    .math-block .math {
        font-size: 1.2rem;
        color: #e2e8f0;
    }

    .note-box {
        background: rgba(96, 165, 250, 0.08);
        border-left: 4px solid #60a5fa;
        padding: 12px 16px;
        border-radius: 12px;
        font-style: italic;
        font-size: 0.9rem;
        color: #cbd5e1;
        flex-shrink: 0;
    }

    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        border-radius: 0;
        flex-direction: column;
    }

    .loading-card {
        background: #1e293b;
        padding: 32px 28px;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #334155;
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px auto;
    }

    .loading-text {
        font-weight: 600;
        font-size: 1.1rem;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    .loading-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 16px;
    }
    .loading-progress {
        height: 3px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        animation: loadingProgress 30s ease-out forwards;
    }

    .loading-timeout {
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 12px;
    }

    .btn-cancel-loading {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 40px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #f87171;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }

    .btn-cancel-loading:active {
        transform: scale(0.94);
        background: rgba(239, 68, 68, 0.25);
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
    }

    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .slide-counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255,255,255,0.05);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(255,255,255,0.04);
    }

    .status-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 30px;
        background: rgba(96, 165, 250, 0.12);
        color: #93bbfc;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
    }

    .status-badge .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: pulse-dot 1.2s infinite;
        flex-shrink: 0;
    }

    .status-badge.idle .dot {
        animation: none;
        background: #64748b;
    }
    .status-badge.speaking .dot {
        background: #34d399;
        animation: pulse-dot 0.8s infinite;
    }
    .status-badge.error .dot {
        background: #f87171;
        animation: none;
    }
    .status-badge.paused .dot {
        animation: none;
        background: #fbbf24;
    }
    .status-badge.waiting .dot {
        animation: pulse-dot 1.5s infinite;
        background: #fbbf24;
    }
    .status-badge.loading .dot {
        animation: pulse-dot 0.5s infinite;
        background: #60a5fa;
    }

    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.7); }
    }

    .footer-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(255,255,255,0.1);
    }

    .btn-secondary {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-play {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
        min-width: 80px;
        justify-content: center;
    }
    .btn-play:active {
        background: rgba(52, 211, 153, 0.25);
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
    }

    .auto-indicator {
        font-size: 0.65rem;
        color: #64748b;
        text-align: center;
        letter-spacing: 0.3px;
        padding: 2px 0;
    }

    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.2rem;
        }
        .content-card li {
            font-size: 0.9rem;
            padding: 8px 0;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .btn-play {
            min-width: 60px;
        }
        .footer-buttons {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
        .loading-card {
            padding: 20px 16px;
        }
        .math-block .math {
            font-size: 1rem;
        }
    }

    @media (min-width: 600px) {
        .app-container {
            max-width: 480px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
        .loading-overlay {
            border-radius: 32px;
        }
    }

    /* Mode jour (par défaut) */
    html, body {
        background: #f0f4f8 !important;
        color: #1a202c !important;
    }
    .app-container {
        background: linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%) !important;
    }
    .slide-header {
        background: rgba(255, 255, 255, 0.85) !important;
        border-bottom: 1px solid rgba(0,0,0,0.08) !important;
    }
    .slide-header h1 {
        background: linear-gradient(135deg, #2b6cb0, #6b46c1) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        background-clip: text !important;
    }
    .slide-footer {
        background: rgba(255, 255, 255, 0.9) !important;
        border-top: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card {
        background: rgba(255,255,255,0.8) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card li {
        border-bottom: 1px solid rgba(0,0,0,0.05) !important;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.12) !important;
        border-left: 4px solid #4299e1 !important;
        color: #2c3e50 !important;
    }
    .math-block {
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .math-block .math {
        color: #2d3748 !important;
    }
    .slide-counter {
        color: #4a5568 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .status-badge {
        background: rgba(96, 165, 250, 0.15) !important;
        color: #2b6cb0 !important;
        border: 1px solid rgba(96, 165, 250, 0.15) !important;
    }
    .btn {
        color: #2d3748 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .btn-secondary {
        background: rgba(0,0,0,0.04) !important;
        border-color: rgba(0,0,0,0.08) !important;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15) !important;
        border-color: rgba(52, 211, 153, 0.2) !important;
        color: #38a169 !important;
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15) !important;
        border-color: rgba(251, 191, 36, 0.2) !important;
        color: #d69e2e !important;
    }
    .auto-indicator {
        color: #718096 !important;
    }
    .loading-card {
        background: #ffffff !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .loading-text {
        color: #1a202c !important;
    }
    .loading-sub {
        color: #4a5568 !important;
    }
</style>
</head>
<body>

<div class="app-container">

    <header class="slide-header">
        <h1 id="slideTitle">Chargement...</h1>
    </header>

    <main class="slide-body" id="slideBody"></main>

    <!-- LOADING OVERLAY AVEC BOUTON ANNULER -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Préparation vocale...</div>
            <div class="loading-sub" id="loadingSub">Synthèse en cours</div>

                <div class="loading-progress-bar" id="loadingProgressBar"></div>

            <button class="btn-cancel-loading" id="cancelLoadingBtn">

                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-secondary" id="replayBtn">
                <span class="btn-icon">🔁</span> <span class="btn-label">Relire</span>
            </button>
            <button class="btn btn-play" id="playBtn">
                <span class="btn-icon">▶</span> <span class="btn-label">Play</span>
            </button>
        </div>

        <div class="auto-indicator" id="autoIndicator">⏸ Lecture manuelle</div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // SLIDES
    // ================================================================
    const slides = [
  {
    "titre": "Hachage des mots de passe",
    "contenu": "<div style='background: linear-gradient(135deg, #1e3c72, #2a5298); color: white; padding: 2rem; border-radius: 15px; text-align: center; margin-bottom: 1.5rem;'><h2 style='color: #fff; margin-bottom: 0.5rem;'>🔒 Hachage avec bcrypt</h2><p style='color: #e0e0e0; font-size: 1.1rem;'>Ne jamais stocker un mot de passe en clair</p><hr style='border-color: #4a7db0; width: 50%;'><p style='color: #f0f0f0;'>Leçon 3.3 : Protéger les mots de passe avec bcrypt</p></div><p>Imaginez un instant que votre base de données soit <strong>volée</strong>. Un attaquant obtient la table <code>users</code> avec tous vos utilisateurs. S'il trouve leurs mots de passe en <strong>clair</strong>, c'est une catastrophe : il peut se connecter à leur compte, et surtout, il peut essayer ces mots de passe sur d'autres sites (Gmail, banque, etc.). La solution ? Le <strong>hachage</strong>. Et l'outil de référence en Node.js, c'est <strong>bcrypt</strong>.</p>",
    "texteParle": "Bonjour à toutes et à tous et bienvenue dans cette troisième leçon du chapitre trois. Aujourd'hui, nous allons parler d'un sujet critique pour la sécurité : le hachage des mots de passe. Imaginez un instant que votre base de données soit volée. Un attaquant obtient la table users avec tous vos utilisateurs. S'il trouve leurs mots de passe en clair, c'est une catastrophe. Non seulement il peut se connecter à leur compte sur votre plateforme, mais surtout, il peut essayer ces mêmes mots de passe sur d'autres sites : leur Gmail, leur compte bancaire, leurs réseaux sociaux. Parce que beaucoup de gens réutilisent le même mot de passe partout. C'est ce qu'on appelle le credential stuffing. Une fuite de votre base peut donc avoir des conséquences bien au-delà de votre plateforme. La solution, c'est le hachage. Et l'outil de référence en Node.js, c'est bcrypt. C'est ce que nous allons voir aujourd'hui. C'est parti.",
    "note": "Une fuite de base compromet vos utilisateurs, même sur d'autres sites. Le hachage est une responsabilité."
  },
  {
    "titre": "Le problème : stocker en clair",
    "contenu": "<div style='background: #f8f9fa; padding: 1.5rem; border-radius: 12px; border-left: 6px solid #dc3545;'><p style='color: #333; font-weight: bold; margin-top: 0;'>Ce qu'il ne faut JAMAIS faire :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.75rem; line-height: 1.6; white-space: pre;'><span style='color: #6a9955;'>// ❌ CATASTROPHE</span><br>INSERT INTO users (username, password)<br>VALUES ('john_doe', 'MonMotDePasse123!');</div><p style='color: #333; margin-top: 1rem;'>Si un attaquant vole la base, il voit :</p><div style='background: #fff3cd; padding: 0.8rem; border-radius: 8px; font-family: monospace; font-size: 0.8rem; color: #333;'>john_doe | MonMotDePasse123!<br>marie_dupont | Marie2024<br>admin_sys | P@ssw0rdAdmin<br>...</div><p style='color: #333; margin-top: 0.8rem;'><strong>Conséquences :</strong></p><ul style='padding-left: 1.2rem; color: #333; line-height: 1.7;'><li>💀 Toutes les connexions sont compromises</li><li>🎯 Credential stuffing sur d'autres sites</li><li>📰 Scandale médiatique et perte de confiance</li><li>⚖️ Poursuites judiciaires (RGPD, lois locales)</li></ul></div>",
    "texteParle": "Regardons ce qu'il ne faut jamais faire. Imaginez ce code : insert into users avec un username et un password en clair. C'est ce qu'on appelle le stockage en clair. Si un attaquant vole la base, il voit directement : john_doe a comme mot de passe MonMotDePasse123 avec un point d'exclamation, marie_dupont a Marie2024, admin_sys a P@ssw0rdAdmin. C'est catastrophique à plusieurs niveaux. Premièrement, toutes les connexions sont compromises immédiatement. L'attaquant peut se connecter en tant que n'importe qui, y compris l'admin. Deuxièmement, il peut faire du credential stuffing sur d'autres sites. C'est-à-dire essayer ces mêmes combinaisons identifiant-mot de passe sur Gmail, Facebook, banques, etc. Une grande partie des utilisateurs réutilisent leurs mots de passe. Troisièmement, c'est un scandale médiatique. Si la nouvelle se répand, la confiance dans la plateforme est brisée. Personne ne voudra plus s'inscrire. Quatrièmement, il y a des conséquences juridiques : au Cameroun, comme ailleurs, la protection des données personnelles est un enjeu légal. Une fuite de mots de passe en clair expose l'entreprise à des poursuites. Bref, le stockage en clair n'est pas une option. C'est une faute professionnelle grave.",
    "note": "Un développeur qui stocke des mots de passe en clair ne devrait pas toucher à un projet sérieux."
  },
  {
    "titre": "Qu'est-ce qu'un hash ?",
    "contenu": "<div style='background: #e9ecef; padding: 1.5rem; border-radius: 12px;'><p style='color: #333;'><strong>Un hash, c'est une empreinte numérique irréversible.</strong></p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.72rem; line-height: 1.7; white-space: pre;'><span style='color: #6a9955;'>// Fonction de hachage</span><br>MonMotDePasse123!<br>&nbsp;&nbsp;↓<br>$2b$10$N9qo8uLOickgx2ZMRZoMy.Mrq4tIvbGVqUJdyg4sXfDkLY0D9a1EC</div><p style='color: #333; margin-top: 1rem;'><strong>Propriétés d'un bon hash :</strong></p><ul style='padding-left: 1.2rem; color: #333; line-height: 1.8;'><li>1️⃣ <strong>Déterministe</strong> : même entrée = même sortie (utile pour vérifier)</li><li>2️⃣ <strong>Rapide à calculer</strong> mais impossible à inverser</li><li>3️⃣ <strong>Unidirectionnel</strong> : on ne peut pas retrouver le mot de passe</li><li>4️⃣ <strong>Effet avalanche</strong> : 1 caractère change = hash complètement différent</li></ul></div>",
    "texteParle": "Commençons par définir ce qu'est un hash. Un hash, c'est une empreinte numérique. On prend un texte, on le passe dans une fonction de hachage, et on obtient une chaîne de caractères longue et complexe. Regardez l'exemple : le mot de passe MonMotDePasse123 avec un point d'exclamation, une fois passé dans bcrypt, devient une longue chaîne qui commence par dollar 2b dollar 10 dollar et se termine par N9qo8u... etc. C'est le hash. Un bon hash a quatre propriétés. Premièrement, il est déterministe : si on rehash le même mot de passe, on obtient le même hash. Enfin, presque, car bcrypt ajoute du sel, on y reviendra. Mais l'idée générale est là. Deuxièmement, il est rapide à calculer, mais impossible à inverser. On peut passer de MonMotDePasse123 au hash en quelques millisecondes, mais on ne peut pas passer du hash au mot de passe, sauf en essayant toutes les combinaisons possibles. Troisièmement, il est unidirectionnel : on ne peut pas retrouver le mot de passe à partir du hash. C'est cette propriété qui fait sa force. Quatrièmement, il y a un effet avalanche : si on change un seul caractère du mot de passe, le hash change complètement. Ce ne sont pas des petites différences, c'est radicalement différent. Ces propriétés font du hash un outil parfait pour stocker des mots de passe.",
    "note": "Un hash bien fait est unidirectionnel. On ne peut pas revenir au mot de passe."
  },
  {
    "titre": "Pourquoi ne PAS utiliser MD5 ou SHA-1 ?",
    "contenu": "<div style='background: #f8f9fa; padding: 1.5rem; border-radius: 12px; border-left: 6px solid #dc3545;'><p style='color: #333;'>MD5, SHA-1, SHA-256 sont des <strong>fonctions de hachage rapides</strong>. Pour un mot de passe, c'est un piège.</p><p style='color: #333;'><strong>Pourquoi ?</strong> Parce qu'une fonction rapide peut être testée des <strong>milliards de fois par seconde</strong> par un GPU.</p><div style='background: #fff3cd; border-left: 4px solid #856404; padding: 0.8rem; border-radius: 4px; margin: 1rem 0;'><strong>Exemple concret :</strong> un GPU moderne calcule environ <strong>10 milliards de hash SHA-256 par seconde</strong>. Pour tester un dictionnaire de 100 millions de mots de passe, il faut <strong>0.01 seconde</strong>.</div><p style='color: #333;'><strong>La solution : les fonctions lentes</strong></p><ul style='padding-left: 1.2rem; color: #333; line-height: 1.8;'><li>🐢 <strong>bcrypt</strong> : conçu pour être LENT (environ 100 ms par hash)</li><li>🐢 <strong>Argon2</strong> : encore plus moderne, recommandé par l'OWASP</li><li>🐢 <strong>scrypt</strong> : alternative, consomme beaucoup de mémoire</li></ul></div>",
    "texteParle": "Une question qu'on pourrait se poser : pourquoi ne pas utiliser MD5, SHA-1, ou SHA-256 ? Ce sont des fonctions de hachage standard, rapides, bien implémentées. Utilisons SHA-256 et c'est réglé ? Non ! C'est exactement le contraire. Pour un mot de passe, une fonction rapide est un piège. Pourquoi ? Parce qu'une fonction rapide peut être testée des milliards de fois par seconde par un GPU. Prenons un exemple concret. Un GPU moderne calcule environ dix milliards de hash SHA-256 par seconde. Pour tester un dictionnaire de cent millions de mots de passe courants, il faut un centième de seconde. C'est ridicule. Un attaquant qui vole votre base peut tester tout un dictionnaire de mots de passe en quelques secondes. La solution, ce sont les fonctions lentes. bcrypt, par exemple, est conçu pour être lent. Chaque hash prend environ cent millisecondes, soit dix mille fois plus lent que SHA-256. Un attaquant ne peut tester que dix mots de passe par seconde. Pour un dictionnaire de cent millions, il lui faudrait cent jours. Ce n'est plus rentable. Les fonctions lentes comme bcrypt, Argon2 ou scrypt sont la bonne réponse pour les mots de passe. C'est un paradoxe intéressant : pour protéger des mots de passe, on veut que la fonction soit lente.",
    "note": "Pour les mots de passe, la lenteur est une qualité. C'est l'inverse des autres usages du hachage."
  },
  {
    "titre": "Le concept de sel (salt)",
    "contenu": "<div style='background: #e9ecef; padding: 1.5rem; border-radius: 12px;'><p style='color: #333;'>Sans sel, deux utilisateurs ayant le même mot de passe auraient <strong>le même hash</strong>.</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.72rem; line-height: 1.7; white-space: pre;'><span style='color: #6a9955;'>// Sans sel</span><br>john_doe | 5e884898da28047151...<br>marie    | 5e884898da28047151...<br>admin    | 5e884898da28047151...</div><p style='color: #333; margin-top: 0.8rem;'>Un attaquant voit tout de suite qu'ils ont le même mot de passe.</p><p style='color: #333; margin-top: 1rem;'><strong>Avec du sel :</strong> chaque utilisateur reçoit une chaîne aléatoire unique ajoutée au mot de passe avant hachage.</p><div style='background: #d4edda; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.72rem; color: #333; line-height: 1.7;'>john_doe | aX9kD2... | hash différent<br>marie    | pLm3Q7... | hash différent<br>admin    | zYw8N4... | hash différent</div></div>",
    "texteParle": "Intéressons-nous maintenant au sel, ou salt en anglais. C'est une notion cruciale. Sans sel, imaginez deux utilisateurs qui ont choisi le même mot de passe. Par exemple, john et marie ont tous les deux choisi le mot de passe 'password'. Sans sel, leur hash serait exactement le même : 5e884898da28047151... et ainsi de suite. Un attaquant qui voit ça comprend immédiatement deux choses. Premièrement, ces deux utilisateurs ont le même mot de passe. Deuxièmement, il peut chercher ce mot de passe dans une rainbow table, c'est-à-dire une table précalculée de hash courants. En une seconde, il sait que le mot de passe est 'password'. Pour éviter ça, on utilise du sel. Le sel, c'est une chaîne aléatoire unique, générée pour chaque utilisateur, ajoutée au mot de passe avant le hachage. Regardez la différence. Chaque utilisateur a un sel différent : aX9kD2, pLm3Q7, zYw8N4. Et avec le sel, les hash sont totalement différents, même si les mots de passe sont identiques. L'attaquant ne peut plus utiliser de rainbow table, car chaque hash est unique. Il doit attaquer chaque utilisateur individuellement. C'est un gain énorme en sécurité. Bonne nouvelle : bcrypt génère le sel automatiquement. Vous n'avez rien à faire.",
    "note": "bcrypt génère le sel automatiquement. C'est une de ses forces."
  },
  {
    "titre": "Le facteur de coût de bcrypt",
    "contenu": "<div style='background: #f8f9fa; padding: 1.5rem; border-radius: 12px; border-left: 6px solid #2a5298;'><p style='color: #333;'>bcrypt utilise un <strong>facteur de coût</strong> (cost factor), qui détermine combien de fois la fonction est appliquée.</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.72rem; line-height: 1.7; white-space: pre;'><span style='color: #6a9955;'>// Le préfixe du hash indique le coût</span><br>$2b$10$N9qo8uLOickgx2ZMRZoMy.Mrq4...</div><p style='color: #333; margin-top: 0.8rem;'>Ici, <code>10</code> = 2^10 = 1024 itérations. Chaque incrément double le temps de calcul :</p><table style='width: 100%; border-collapse: collapse; font-size: 0.85rem; color: #333;'><tr style='background: #e9ecef;'><th style='padding: 0.5rem; border: 1px solid #ddd;'>Coût</th><th style='padding: 0.5rem; border: 1px solid #ddd;'>Itérations</th><th style='padding: 0.5rem; border: 1px solid #ddd;'>Temps</th></tr><tr><td style='padding: 0.5rem; border: 1px solid #ddd; text-align: center;'>8</td><td style='padding: 0.5rem; border: 1px solid #ddd; text-align: center;'>256</td><td style='padding: 0.5rem; border: 1px solid #ddd; text-align: center;'>~25 ms</td></tr><tr><td style='padding: 0.5rem; border: 1px solid #ddd; text-align: center;'><strong>10</strong></td><td style='padding: 0.5rem; border: 1px solid #ddd; text-align: center;'><strong>1 024</strong></td><td style='padding: 0.5rem; border: 1px solid #ddd; text-align: center;'><strong>~100 ms</strong></td></tr><tr><td style='padding: 0.5rem; border: 1px solid #ddd; text-align: center;'>12</td><td style='padding: 0.5rem; border: 1px solid #ddd; text-align: center;'>4 096</td><td style='padding: 0.5rem; border: 1px solid #ddd; text-align: center;'>~400 ms</td></tr></table><p style='color: #555; font-size: 0.9rem; margin-top: 0.8rem;'>💡 Un coût de 10 est le standard actuel. À ajuster selon la puissance des serveurs.</p></div>",
    "texteParle": "Parlons maintenant du facteur de coût de bcrypt. C'est un nombre qui détermine combien de fois la fonction de hachage est appliquée. Regardez le hash : il commence par dollar 2b dollar 10 dollar. Le 10 après le deuxième dollar, c'est le facteur de coût. Cela signifie que la fonction sera appliquée deux puissance dix fois, c'est-à-dire mille vingt-quatre fois. Chaque incrément du facteur double le temps de calcul. Regardez le tableau. Avec un coût de 8, on a 256 itérations, et le hash prend environ 25 millisecondes. Avec un coût de 10, on a 1024 itérations, et environ 100 millisecondes. Avec un coût de 12, 4096 itérations, environ 400 millisecondes. Le facteur de coût est un équilibre à trouver. Trop bas, le hash est trop rapide, donc vulnérable aux attaques. Trop haut, le hash est trop lent, et la connexion devient pénible pour l'utilisateur, sans compter la charge serveur. La règle générale : viser environ 100 millisecondes sur votre matériel. Pour la plupart des serveurs actuels, c'est un coût de 10. C'est le standard actuel. Le jour où les ordinateurs seront plus rapides, il faudra augmenter à 11 ou 12. C'est un paramètre à ajuster tous les deux ou trois ans.",
    "note": "Coût 10 = environ 100 ms. C'est le standard. Ajustez tous les 2-3 ans."
  },
  {
    "titre": "Installer bcrypt",
    "contenu": "<div style='background: #e9ecef; padding: 1rem; border-radius: 12px;'><p style='color: #333;'>Installons bcrypt et ses types TypeScript :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.8rem; line-height: 1.7; white-space: pre;'>npm install bcrypt<br>npm install -D @types/bcrypt</div><p style='color: #333; margin-top: 0.8rem;'><strong>Deux paquets :</strong></p><ul style='padding-left: 1.2rem; color: #333; line-height: 1.8;'><li>📦 <strong>bcrypt</strong> : la bibliothèque elle-même (native, rapide)</li><li>📦 <strong>@types/bcrypt</strong> : les types TypeScript pour l'autocomplétion</li></ul><div style='background: #d1ecf1; border-left: 4px solid #0c5460; padding: 0.8rem; border-radius: 4px; margin-top: 1rem;'><strong>💡 Alternative :</strong> <code>bcryptjs</code> est une version pure JavaScript, plus lente mais sans compilation native. Utile si vous avez des problèmes de compilation.</div></div>",
    "texteParle": "Pour utiliser bcrypt dans notre projet, installons deux paquets. Le premier, bcrypt, c'est la bibliothèque elle-même. Elle est écrite en C pour être performante, ce qui la rend très rapide, mais nécessite une compilation native lors de l'installation. Le deuxième, @types/bcrypt, c'est pour TypeScript. C'est le paquet qui fournit les types et l'autocomplétion dans l'éditeur. On l'installe en devDependencies, car il n'est pas nécessaire en production. Une remarque importante : bcrypt natif peut parfois poser des problèmes de compilation, notamment sur Windows ou dans certains environnements Docker. Si vous rencontrez des erreurs, il existe une alternative : bcryptjs. C'est la même bibliothèque, mais écrite entièrement en JavaScript. Elle est environ trois fois plus lente, mais elle s'installe partout sans problème. Pour notre cours, nous utiliserons bcrypt natif, mais gardez bcryptjs en tête comme solution de secours. D'ailleurs, le code est compatible : vous pouvez switcher de l'un à l'autre en changeant juste le nom du paquet. Pratique.",
    "note": "bcrypt natif est plus rapide. bcryptjs s'installe partout. À vous de choisir."
  },
  {
    "titre": "La méthode hashPassword",
    "contenu": "<div style='background: #f8f9fa; padding: 1rem; border-radius: 12px; border-left: 6px solid #10b981;'><p style='color: #333;'>Dans <code>AuthService</code>, ajoutons deux méthodes :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.72rem; line-height: 1.6; white-space: pre;'>import * as bcrypt from 'bcrypt';<br><br>async hashPassword(password: string): Promise&lt;string&gt; {<br>&nbsp;&nbsp;const salt = await bcrypt.genSalt(10);<br>&nbsp;&nbsp;return bcrypt.hash(password, salt);<br>}<br><br>async comparePassword(password: string, hash: string): Promise&lt;boolean&gt; {<br>&nbsp;&nbsp;return bcrypt.compare(password, hash);<br>}</div><p style='color: #333; margin-top: 0.8rem;'><strong>Deux méthodes essentielles :</strong></p><ul style='padding-left: 1.2rem; color: #333; line-height: 1.7;'><li>🔒 <code>hashPassword</code> : génère le sel et hashe le mot de passe</li><li>🔓 <code>comparePassword</code> : compare un mot de passe en clair avec un hash</li></ul></div>",
    "texteParle": "Ajoutons maintenant deux méthodes à notre AuthService. La première, hashPassword, prend un mot de passe en clair et retourne son hash. Elle fait deux choses. D'abord, elle génère un sel aléatoire avec bcrypt.genSalt, en lui passant le facteur de coût 10. Ensuite, elle hashe le mot de passe avec ce sel, avec bcrypt.hash. Le résultat est une chaîne de soixante caractères qui commence par dollar 2b dollar 10 dollar. C'est cette chaîne qu'on stockera en base. La deuxième méthode, comparePassword, prend un mot de passe en clair et un hash, et retourne un booléen : vrai si le mot de passe correspond au hash, faux sinon. C'est cette méthode qu'on utilisera à la connexion pour vérifier le mot de passe. Notez qu'on utilise le préfixe import étoile as bcrypt, qui est une convention pour importer un module CommonJS en TypeScript avec esModuleInterop. La bibliothèque bcrypt expose ses fonctions ainsi. Ces deux méthodes sont le cœur de notre système de hachage. Elles sont courtes, mais elles font tout le travail. C'est l'élégance de bcrypt : tout est simple et robuste.",
    "note": "hashPassword pour stocker, comparePassword pour vérifier. Deux méthodes, c'est tout ce qu'il faut."
  },
  {
    "titre": "Utiliser bcrypt dans le register",
    "contenu": "<div style='background: #e9ecef; padding: 1rem; border-radius: 12px;'><p style='color: #333;'>Dans la méthode <code>register</code> :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.68rem; line-height: 1.6; white-space: pre;'>async register(createUserDto: CreateUserDto) {<br>&nbsp;&nbsp;const { phone_number, username, password } = createUserDto;<br>&nbsp;&nbsp;<br>&nbsp;&nbsp;<span style='color: #6a9955;'>// Vérifier unicité...</span><br>&nbsp;&nbsp;<br>&nbsp;&nbsp;<span style='color: #6a9955;'>// ✅ Hasher le mot de passe</span><br>&nbsp;&nbsp;const hashedPassword = await this.hashPassword(password);<br>&nbsp;&nbsp;<br>&nbsp;&nbsp;<span style='color: #6a9955;'>// Créer l'utilisateur avec le hash, PAS le mot de passe</span><br>&nbsp;&nbsp;const user = this.userRepository.create({<br>&nbsp;&nbsp;&nbsp;&nbsp;phone_number,<br>&nbsp;&nbsp;&nbsp;&nbsp;username,<br>&nbsp;&nbsp;&nbsp;&nbsp;password_hash: hashedPassword, <span style='color: #6a9955;'>// ← hash, pas password</span><br>&nbsp;&nbsp;&nbsp;&nbsp;role: UserRole.USER,<br>&nbsp;&nbsp;});<br>&nbsp;&nbsp;<br>&nbsp;&nbsp;<span style='color: #6a9955;'>// ... sauvegarde, profil, wallet</span><br>}</div><p style='color: #555; font-size: 0.9rem; margin-top: 0.8rem;'>💡 Le champ s'appelle <code>password_hash</code>, pas <code>password</code>. C'est volontaire.</p></div>",
    "texteParle": "Regardons comment utiliser bcrypt dans la méthode register. Tout d'abord, on récupère les données du DTO : phone_number, username, password. On vérifie l'unicité du téléphone et du username, comme d'habitude. Puis, on hashe le mot de passe : const hashedPassword égale await this.hashPassword avec le password en paramètre. C'est un appel asynchrone, car bcrypt prend du temps à calculer. Ensuite, on crée l'utilisateur avec les données. Notez bien : on passe hashedPassword dans le champ password_hash, pas le mot de passe original. C'est crucial. Le champ dans l'entité s'appelle password_hash, pas password. C'est un choix de nommage délibéré. Il rappelle aux développeurs qu'on y stocke un hash, pas un mot de passe en clair. C'est une bonne pratique. Si quelqu'un lit le code plus tard et voit password, il pourrait croire qu'il s'agit du mot de passe réel. Avec password_hash, il comprend immédiatement qu'on stocke la version hachée. Le reste de la méthode continue : créer le profil, créer le wallet, tout ça dans une transaction. Mais l'étape critique, c'est le hachage. Sans elle, on stockerait le mot de passe en clair, ce qui serait catastrophique. C'est une seule ligne de code, mais elle change tout.",
    "note": "Nommer le champ password_hash est une bonne pratique. Cela rappelle constamment ce qu'on y stocke."
  },
  {
    "titre": "Utiliser bcrypt dans le login",
    "contenu": "<div style='background: #f8f9fa; padding: 1rem; border-radius: 12px; border-left: 6px solid #a78bfa;'><p style='color: #333;'>Dans la méthode <code>validateUser</code> :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.68rem; line-height: 1.6; white-space: pre;'>async validateUser(phone: string, password: string) {<br>&nbsp;&nbsp;<span style='color: #6a9955;'>// 1. Chercher l'utilisateur</span><br>&nbsp;&nbsp;const user = await this.userRepository.findOne({<br>&nbsp;&nbsp;&nbsp;&nbsp;where: { phone_number: phone },<br>&nbsp;&nbsp;});<br>&nbsp;&nbsp;<br>&nbsp;&nbsp;if (!user) throw new UnauthorizedException(...);<br>&nbsp;&nbsp;<br>&nbsp;&nbsp;<span style='color: #6a9955;'>// 2. ✅ Comparer le mot de passe avec le hash</span><br>&nbsp;&nbsp;const isPasswordValid = await this.comparePassword(<br>&nbsp;&nbsp;&nbsp;&nbsp;password,<br>&nbsp;&nbsp;&nbsp;&nbsp;user.password_hash, <span style='color: #6a9955;'>// ← le hash stocké en base</span><br>&nbsp;&nbsp;);<br>&nbsp;&nbsp;<br>&nbsp;&nbsp;if (!isPasswordValid) throw new UnauthorizedException(...);<br>&nbsp;&nbsp;<br>&nbsp;&nbsp;<span style='color: #6a9955;'>// 3. Retourner l'utilisateur sans le hash</span><br>&nbsp;&nbsp;const { password_hash, ...result } = user;<br>&nbsp;&nbsp;return result;<br>}</div></div>",
    "texteParle": "Symétriquement, dans la méthode validateUser, on utilise comparePassword pour vérifier le mot de passe. Regardez la logique. Premièrement, on cherche l'utilisateur par son numéro de téléphone. Si on ne le trouve pas, on lève une exception UnauthorizedException. Message générique : 'Numéro ou mot de passe incorrect'. On ne dit jamais 'cet utilisateur n'existe pas', car ce serait une fuite d'information. Deuxièmement, si l'utilisateur existe, on compare le mot de passe fourni avec le hash stocké en base. On appelle await this.comparePassword avec le mot de passe en clair et le hash de la base. C'est bcrypt qui fait la comparaison. Comment ? Il rehash le mot de passe avec le sel contenu dans le hash stocké, puis compare les deux hash. Si les hash correspondent, alors le mot de passe est correct. C'est ça la magie de bcrypt : on n'a pas besoin de stocker le mot de passe en clair, mais on peut quand même vérifier une correspondance. Troisièmement, si tout est bon, on retourne l'utilisateur, mais on exclut le champ password_hash de la réponse. On ne veut jamais envoyer le hash au client. C'est une pratique de sécurité importante. Le hash ne doit jamais quitter le serveur, ni apparaître dans les logs. Avec la destructuration { password_hash, ...result }, on retire facilement ce champ.",
    "note": "Ne jamais retourner password_hash dans une réponse API. C'est une fuite d'information."
  },
  {
    "titre": "Les bonnes pratiques bcrypt",
    "contenu": "<div style='background: #e9ecef; padding: 1rem; border-radius: 12px;'><p style='color: #333;'><strong>Règles à respecter :</strong></p><ul style='padding-left: 1.2rem; color: #333; line-height: 1.9;'><li>✅ <strong>Jamais</strong> de mot de passe en clair, même dans les logs</li><li>✅ <strong>Jamais</strong> retourner le hash dans une réponse API</li><li>✅ Utiliser <code>await</code> : bcrypt est asynchrone et prend ~100ms</li><li>✅ Coût 10 en dev, à ajuster en prod selon la puissance</li><li>✅ Ne pas hacher côté client : le hash doit rester côté serveur</li><li>❌ Ne pas \"saler\" manuellement : bcrypt le fait déjà</li><li>❌ Ne pas utiliser <code>bcrypt.hashSync</code> en production (bloque le thread)</li></ul><div style='background: #fff3cd; border-left: 4px solid #856404; padding: 0.8rem; border-radius: 4px; margin-top: 1rem;'><strong>⚠️ Attention au DoS :</strong> hacher 1000 fois par seconde peut saturer votre CPU. Protégez avec un rate limiter.</div></div>",
    "texteParle": "Terminons avec quelques bonnes pratiques bcrypt. Premièrement, ne stockez jamais de mot de passe en clair, nulle part. Ni en base, ni dans les logs, ni dans les variables d'environnement. Le hash uniquement. Deuxièmement, ne retournez jamais le hash dans une réponse API. Le hash ne doit jamais quitter le serveur. Troisièmement, utilisez toujours await avec bcrypt. Les fonctions hash et compare sont asynchrones et prennent environ cent millisecondes. Si vous oubliez await, vous obtiendrez une Promise au lieu du résultat, et votre code ne marchera pas. Quatrièmement, ajustez le facteur de coût en production. Dix est le standard actuel, mais si vous avez des serveurs puissants, vous pouvez monter à onze. Cinquièmement, ne hashez pas côté client. Certains développeurs pensent que c'est plus sûr, mais c'est faux. Le hash doit être calculé côté serveur. Si vous hashez côté client, l'attaquant peut rejouer le hash. Sixièmement, ne salez pas manuellement. bcrypt le fait déjà automatiquement. Si vous ajoutez votre propre sel, vous allez casser le système. Septièmement, n'utilisez pas bcrypt.hashSync en production. Cette version synchrone bloque le thread principal de Node.js, ce qui est catastrophique pour les performances. Enfin, attention au déni de service : si un attaquant fait mille tentatives de connexion par seconde, votre CPU sature à hasher. Protégez avec un rate limiter. Nous en avons déjà mis un sur l'endpoint login. Ces sept règles sont votre check-list bcrypt.",
    "note": "Le hash ne doit jamais quitter le serveur. Ni dans les logs, ni dans les réponses."
  },
  {
    "titre": "Résumé et prochaine étape",

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentIndex = 0;
    let isSpeaking = false;
    let isPaused = false;
    let currentUtterance = null;
    let isLoading = false;
    let loadingTimeout = null;
    let isTransitioning = false;
    let speechSupported = true;
    let userInteracted = false;
    let isPlaying = false;
    let loadingCancelled = false;

    const total = slides.length;
    const synth = window.speechSynthesis;

    // Références jQuery
    const $title = $('#slideTitle');
    const $body = $('#slideBody');
    const $counter = $('#slideCounter');
    const $statusText = $('#statusText');
    const $statusBadge = $('#statusBadge');
    const $loading = $('#loadingOverlay');
    const $loadingText = $('#loadingText');
    const $loadingSub = $('#loadingSub');
    const $loadingTimeout = $('#loadingTimeout');
    const $loadingProgressBar = $('#loadingProgressBar');
    const $autoIndicator = $('#autoIndicator');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $replay = $('#replayBtn');
    const $play = $('#playBtn');
    const $cancelLoading = $('#cancelLoadingBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function setStatus(text, type) {
        $statusText.text(text);
        $statusBadge.removeClass('idle speaking error paused waiting loading');
        if (type === 'speaking') $statusBadge.addClass('speaking');
        else if (type === 'error') $statusBadge.addClass('error');
        else if (type === 'paused') $statusBadge.addClass('paused');
        else if (type === 'waiting') $statusBadge.addClass('waiting');
        else if (type === 'loading') $statusBadge.addClass('loading');
        else $statusBadge.addClass('idle');
    }

    function updatePlayButton() {
        if (isPlaying) {
            $play.addClass('playing');
            $play.find('.btn-icon').text('⏸');
            $play.find('.btn-label').text('Pause');
        } else {
            $play.removeClass('playing');
            $play.find('.btn-icon').text('▶');
            $play.find('.btn-label').text('Play');
        }
    }

    function showLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        
        loadingCancelled = false;
        isLoading = true;
        
        // Réinitialiser la barre de progression
        $loadingProgressBar.css('animation', 'none');
        $loadingProgressBar.css('width', '0%');
        // Forcer un reflow
        $loadingProgressBar[0].offsetHeight;
        $loadingProgressBar.css('animation', 'loadingProgress 30s ease-out forwards');
        
        $loadingText.text('Préparation vocale...');
        $loadingSub.text('Synthèse en cours');
        $loadingTimeout.text('⏱️ 30 secondes maximum');
        $loading.fadeIn(300);
        setStatus("⏳ Chargement...", 'loading');
        
        // 🔥 TIMEOUT DE 30 SECONDES
        loadingTimeout = setTimeout(() => {
            if (isLoading && !loadingCancelled) {
                hideLoading();
                setStatus("⚠️ Délai dépassé (30s)", 'error');
                isPlaying = false;
                updatePlayButton();
                $loadingSub.text('La synthèse vocale a pris trop de temps');
                $loadingTimeout.text('❌ Délai dépassé');
            }
        }, 30000);
    }

    function hideLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        isLoading = false;
        loadingCancelled = false;
        $loading.fadeOut(300);
        // Ne pas changer le statut si on est en train de parler
        if (!isSpeaking && !isPlaying) {
            setStatus("⏸ Lecture arrêtée", 'paused');
        }
    }

    function cancelLoading() {
        loadingCancelled = true;
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        hideLoading();
        stopSpeaking();
        setStatus("⏸ Annulé", 'paused');
        isPlaying = false;
        updatePlayButton();
        $loadingText.text('Annulé par l\'utilisateur');
        $loadingSub.text('Vous pouvez réessayer');
        $loadingTimeout.text('✕ Annulation');
    }

    // Arrêter la parole proprement
    function stopSpeaking() {
        try {
            if (synth && (synth.speaking || synth.pending)) {
                synth.cancel();
            }
        } catch(e) {
            console.warn('Erreur stopSpeaking:', e);
        }
        if (currentUtterance) {
            try {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance.onstart = null;
            } catch(e) {}
            currentUtterance = null;
        }
        isSpeaking = false;
        isPlaying = false;
        updatePlayButton();
    }

    // Mettre en pause la parole
    function pauseSpeaking() {
        try {
            if (synth && synth.speaking) {
                synth.pause();
                isPaused = true;
                isPlaying = false;
                setStatus("⏸ Lecture en pause", 'paused');
                updatePlayButton();
            }
        } catch(e) {
            console.warn('Erreur pauseSpeaking:', e);
            stopSpeaking();
        }
    }

    // Reprendre la parole
    function resumeSpeaking() {
        try {
            if (synth && synth.paused) {
                synth.resume();
                isPaused = false;
                isPlaying = true;
                setStatus("🔊 Lecture en cours", 'speaking');
                updatePlayButton();
            } else if (!isSpeaking && !synth.speaking && !synth.pending) {
                speakSlide(currentIndex);
            }
        } catch(e) {
            console.warn('Erreur resumeSpeaking:', e);
            speakSlide(currentIndex);
        }
    }

    function renderSlide(index) {
        const slide = slides[index];
        $title.text(slide.titre);

        let html = '';
        html += `<div class="content-card">${slide.contenu}</div>`;
        if (slide.note) {
            html += `<div class="note-box">${slide.note}</div>`;
        }
        $body.html(html);
        $counter.text(`${index+1} / ${total}`);

        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
        }
    }

    // ================================================================
    // LECTURE VOCALE
    // ================================================================
    function speakSlide(index) {
        return new Promise((resolve) => {
            const slide = slides[index];
            const text = slide.texteParle;
            
            if (!text || text.trim() === '' || !speechSupported) {
                resolve();
                return;
            }

            if (!window.speechSynthesis) {
                setStatus("❌ Synthèse vocale non supportée", 'error');
                speechSupported = false;
                resolve();
                return;
            }

            // Arrêter toute lecture en cours
            stopSpeaking();
            
            // Réinitialiser l'état de pause
            isPaused = false;
            
            showLoading();
            setStatus("Initialisation...", 'loading');

            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.92;
                utterance.pitch = 1.05;
                utterance.volume = 1;

                let isFinished = false;
                let errorHandled = false;

                utterance.onstart = function() {
                    if (loadingCancelled) {
                        stopSpeaking();
                        resolve();
                        return;
                    }
                    hideLoading();
                    isSpeaking = true;
                    isPlaying = true;
                    isPaused = false;
                    setStatus("🔊 Lecture en cours", 'speaking');
                    updatePlayButton();
                };

                utterance.onend = function() {
                    if (isFinished) return;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    setStatus("✅ Terminé", 'idle');
                    hideLoading();
                    updatePlayButton();
                    resolve();
                };

                utterance.onerror = function(e) {
                    if (isFinished || errorHandled) return;
                    errorHandled = true;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    hideLoading();
                    updatePlayButton();
                    
                    if (e.error === 'not-allowed') {
                        setStatus("⚠️ Permission refusée", 'error');
                    } else if (e.error === 'synthesis-unavailable') {
                        setStatus("⚠️ Synthèse indisponible", 'error');
                    } else if (e.error === 'canceled') {
                        setStatus("⏸ Annulé", 'paused');
                    } else {
                        setStatus("❌ Erreur audio: " + (e.error || 'inconnue'), 'error');
                    }
                    
                    resolve();
                };

                // Gestion du chargement des voix
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = function() {
                        if (!loadingCancelled) {
                            try {
                                synth.speak(utterance);
                            } catch(err) {
                                // Silencieux
                            }
                        }
                        synth.onvoiceschanged = null;
                    };
                }

                currentUtterance = utterance;
                
                if (!loadingCancelled) {
                    try {
                        synth.speak(utterance);
                    } catch(err) {
                        setTimeout(() => {
                            if (!loadingCancelled) {
                                try {
                                    synth.speak(utterance);
                                } catch(e) {
                                    setStatus("❌ Erreur de lecture", 'error');
                                    isPlaying = false;
                                    updatePlayButton();
                                    hideLoading();
                                    resolve();
                                }
                            } else {
                                resolve();
                            }
                        }, 100);
                    }
                } else {
                    resolve();
                }

            } catch(err) {
                hideLoading();
                setStatus("❌ Erreur générale", 'error');
                isPlaying = false;
                updatePlayButton();
                console.error('Erreur speakSlide:', err);
                resolve();
            }
        });
    }

    // ================================================================
    // NAVIGATION
    // ================================================================
    async function goToSlide(index) {
        if (isTransitioning) return;
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        
        // Si on est en train de lire, on met en pause avant de naviguer
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        // Arrêter complètement la lecture
        stopSpeaking();
        
        await new Promise(r => setTimeout(r, 50));
        
        if (index === currentIndex) {
            setStatus("📄 Slide actuel", 'idle');
            return;
        }

        isTransitioning = true;
        currentIndex = index;
        renderSlide(index);
        
        // Réinitialiser l'état de lecture
        isPlaying = false;
        updatePlayButton();
        setStatus("⏸ Lecture arrêtée", 'paused');

        await new Promise(r => setTimeout(r, 150));
        isTransitioning = false;
    }

    async function goToNext() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex + 1 < total) {
            await goToSlide(currentIndex + 1);
        } else {
            setStatus("🏁 Dernier slide", 'idle');
        }
    }

    async function goToPrev() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex - 1 >= 0) {
            await goToSlide(currentIndex - 1);
        } else {
            setStatus("🔁 Premier slide", 'idle');
        }
    }

    // ================================================================
    // GESTION PLAY/PAUSE
    // ================================================================
    function togglePlay() {
        if (!userInteracted) {
            userInteracted = true;
        }

        // Si le chargement est en cours, on l'annule
        if (isLoading) {
            cancelLoading();
            return;
        }

        // Si le synthétiseur est en pause, on reprend
        if (synth && synth.paused) {
            resumeSpeaking();
            return;
        }

        // Si la lecture est en cours, on met en pause
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
            return;
        }

        // Sinon, on démarre la lecture du slide courant
        if (!isSpeaking && !isPlaying) {
            stopSpeaking();
            speakSlide(currentIndex);
        }
    }

    // ================================================================
    // INIT
    // ================================================================
    async function init() {
        // Vérifier la compatibilité
        if (!window.speechSynthesis) {
            setStatus("❌ Synthèse vocale non supportée", 'error');
            speechSupported = false;
        }

        // Précharger les voix
        try {
            if (synth.getVoices) {
                synth.getVoices();
                setTimeout(() => {
                    try {
                        synth.getVoices();
                    } catch(e) {}
                }, 200);
            }
        } catch(e) {
            console.warn('Erreur chargement voix:', e);
        }

        // Afficher le premier slide
        renderSlide(0);
        $counter.text(`1 / ${total}`);
        
        // État initial
        setStatus("⏸ Appuie sur Play", 'paused');
        updatePlayButton();
        $autoIndicator.text('⏸ Lecture manuelle');

        // ================================================================
        // ÉVÉNEMENTS
        // ================================================================
        
        // Bouton Play/Pause
        $play.on('click', function() {
            togglePlay();
        });

        // Bouton Annuler le chargement
        $cancelLoading.on('click', function() {
            cancelLoading();
        });

        // Navigation
        $prev.on('click', function() {
            // Si chargement en cours, on annule
            if (isLoading) cancelLoading();
            goToPrev();
        });

        $next.on('click', function() {
            if (isLoading) cancelLoading();
            goToNext();
        });

        // Replay - relire le slide courant
        $replay.on('click', function() {
            if (isLoading) cancelLoading();
            stopSpeaking();
            setTimeout(() => {
                speakSlide(currentIndex);
            }, 100);
        });

        // Support du clavier (espace pour play/pause)
        $(document).on('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });

        // Nettoyage
        $(window).on('beforeunload', function() {
            try {
                if (synth.speaking) synth.cancel();
            } catch(e) {}
            hideLoading();
        });

        // Gérer les cas où la synthèse se termine de manière inattendue
        setInterval(() => {
            if (isPlaying && !synth.speaking && !synth.pending && !isPaused && !isLoading) {
                isPlaying = false;
                updatePlayButton();
                setStatus("⏸ Lecture arrêtée", 'paused');
            }
        }, 1000);
    }

    init();
});
