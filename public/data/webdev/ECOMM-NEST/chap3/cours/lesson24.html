<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Présentation mobile</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' },
            options: { skipHtmlTypes: 'script' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 500px;
        margin: 0 auto;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    .slide-header {
        flex-shrink: 0;
        padding: 18px 16px 10px 16px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        z-index: 10;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .slide-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
    }

    .content-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 18px 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        flex-shrink: 0;
    }

    .content-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .content-card li {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        line-height: 1.5;
    }

    .content-card li:last-child {
        border-bottom: none;
    }

    .bullet-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
    }

    .math-block {
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        overflow-x: auto;
        flex-shrink: 0;
        margin: 4px 0;
    }

    .math-block .math {
        font-size: 1.2rem;
        color: #e2e8f0;
    }

    .note-box {
        background: rgba(96, 165, 250, 0.08);
        border-left: 4px solid #60a5fa;
        padding: 12px 16px;
        border-radius: 12px;
        font-style: italic;
        font-size: 0.9rem;
        color: #cbd5e1;
        flex-shrink: 0;
    }

    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        border-radius: 0;
        flex-direction: column;
    }

    .loading-card {
        background: #1e293b;
        padding: 32px 28px;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #334155;
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px auto;
    }

    .loading-text {
        font-weight: 600;
        font-size: 1.1rem;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    .loading-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 16px;
    }
    .loading-progress {
        height: 3px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        animation: loadingProgress 30s ease-out forwards;
    }

    .loading-timeout {
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 12px;
    }

    .btn-cancel-loading {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 40px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #f87171;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }

    .btn-cancel-loading:active {
        transform: scale(0.94);
        background: rgba(239, 68, 68, 0.25);
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
    }

    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .slide-counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255,255,255,0.05);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(255,255,255,0.04);
    }

    .status-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 30px;
        background: rgba(96, 165, 250, 0.12);
        color: #93bbfc;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
    }

    .status-badge .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: pulse-dot 1.2s infinite;
        flex-shrink: 0;
    }

    .status-badge.idle .dot {
        animation: none;
        background: #64748b;
    }
    .status-badge.speaking .dot {
        background: #34d399;
        animation: pulse-dot 0.8s infinite;
    }
    .status-badge.error .dot {
        background: #f87171;
        animation: none;
    }
    .status-badge.paused .dot {
        animation: none;
        background: #fbbf24;
    }
    .status-badge.waiting .dot {
        animation: pulse-dot 1.5s infinite;
        background: #fbbf24;
    }
    .status-badge.loading .dot {
        animation: pulse-dot 0.5s infinite;
        background: #60a5fa;
    }

    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.7); }
    }

    .footer-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(255,255,255,0.1);
    }

    .btn-secondary {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-play {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
        min-width: 80px;
        justify-content: center;
    }
    .btn-play:active {
        background: rgba(52, 211, 153, 0.25);
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
    }

    .auto-indicator {
        font-size: 0.65rem;
        color: #64748b;
        text-align: center;
        letter-spacing: 0.3px;
        padding: 2px 0;
    }

    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.2rem;
        }
        .content-card li {
            font-size: 0.9rem;
            padding: 8px 0;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .btn-play {
            min-width: 60px;
        }
        .footer-buttons {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
        .loading-card {
            padding: 20px 16px;
        }
        .math-block .math {
            font-size: 1rem;
        }
    }

    @media (min-width: 600px) {
        .app-container {
            max-width: 480px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
        .loading-overlay {
            border-radius: 32px;
        }
    }

    /* Mode jour (par défaut) */
    html, body {
        background: #f0f4f8 !important;
        color: #1a202c !important;
    }
    .app-container {
        background: linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%) !important;
    }
    .slide-header {
        background: rgba(255, 255, 255, 0.85) !important;
        border-bottom: 1px solid rgba(0,0,0,0.08) !important;
    }
    .slide-header h1 {
        background: linear-gradient(135deg, #2b6cb0, #6b46c1) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        background-clip: text !important;
    }
    .slide-footer {
        background: rgba(255, 255, 255, 0.9) !important;
        border-top: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card {
        background: rgba(255,255,255,0.8) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card li {
        border-bottom: 1px solid rgba(0,0,0,0.05) !important;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.12) !important;
        border-left: 4px solid #4299e1 !important;
        color: #2c3e50 !important;
    }
    .math-block {
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .math-block .math {
        color: #2d3748 !important;
    }
    .slide-counter {
        color: #4a5568 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .status-badge {
        background: rgba(96, 165, 250, 0.15) !important;
        color: #2b6cb0 !important;
        border: 1px solid rgba(96, 165, 250, 0.15) !important;
    }
    .btn {
        color: #2d3748 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .btn-secondary {
        background: rgba(0,0,0,0.04) !important;
        border-color: rgba(0,0,0,0.08) !important;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15) !important;
        border-color: rgba(52, 211, 153, 0.2) !important;
        color: #38a169 !important;
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15) !important;
        border-color: rgba(251, 191, 36, 0.2) !important;
        color: #d69e2e !important;
    }
    .auto-indicator {
        color: #718096 !important;
    }
    .loading-card {
        background: #ffffff !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .loading-text {
        color: #1a202c !important;
    }
    .loading-sub {
        color: #4a5568 !important;
    }
</style>
</head>
<body>

<div class="app-container">

    <header class="slide-header">
        <h1 id="slideTitle">Chargement...</h1>
    </header>

    <main class="slide-body" id="slideBody"></main>

    <!-- LOADING OVERLAY AVEC BOUTON ANNULER -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Préparation vocale...</div>
            <div class="loading-sub" id="loadingSub">Synthèse en cours</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loadingProgressBar"></div>
            </div>
            <div class="loading-timeout" id="loadingTimeout">⏱️ 30 secondes maximum</div>
            <button class="btn-cancel-loading" id="cancelLoadingBtn">
                <span>✕</span> Annuler
            </button>
        </div>
    </div>

    <footer class="slide-footer">
        <div class="footer-top">
            <span class="slide-counter" id="slideCounter">1 / 3</span>
            <span class="status-badge idle" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">Prêt</span>
            </span>
        </div>

        <div class="footer-buttons">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-secondary" id="replayBtn">
                <span class="btn-icon">🔁</span> <span class="btn-label">Relire</span>
            </button>
            <button class="btn btn-play" id="playBtn">
                <span class="btn-icon">▶</span> <span class="btn-label">Play</span>
            </button>
        </div>

        <div class="auto-indicator" id="autoIndicator">⏸ Lecture manuelle</div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // SLIDES
    // ================================================================
    const slides = [
  {
    "titre": "La connexion (login)",
    "contenu": "<div style='background: linear-gradient(135deg, #1e3c72, #2a5298); color: white; padding: 2rem; border-radius: 15px; text-align: center; margin-bottom: 1.5rem;'><h2 style='color: #fff; margin-bottom: 0.5rem;'>🔑 La connexion</h2><p style='color: #e0e0e0; font-size: 1.1rem;'>Login et protection anti-brute-force</p><hr style='border-color: #4a7db0; width: 50%;'><p style='color: #f0f0f0;'>Leçon 3.7 : Valider les identifiants et bloquer les abus</p></div><p>La connexion est le moment où l'utilisateur prouve son identité. C'est un point critique : si notre système est mal conçu, un attaquant peut tester des millions de mots de passe en quelques secondes. Dans cette leçon, nous allons construire une méthode <code>login</code> robuste, avec <strong>vérification de blocage</strong>, <strong>anti-brute-force</strong>, et <strong>auto-déblocage après expiration</strong>.</p>",
    "texteParle": "Bonjour à toutes et à tous et bienvenue dans cette septième leçon du chapitre trois. Aujourd'hui, nous allons parler de la connexion, ou login. C'est le moment où l'utilisateur prouve son identité en fournissant son numéro de téléphone et son mot de passe. C'est un point critique de notre système. Si notre mécanisme est mal conçu, un attaquant peut tester des millions de mots de passe en quelques secondes grâce à un script automatisé. Une fois le bon mot de passe trouvé, il accède au compte. C'est ce qu'on appelle une attaque par force brute. Pour s'en protéger, nous allons mettre en place plusieurs mécanismes : vérification de blocage, compteur de tentatives échouées, blocage temporaire, auto-déblocage après expiration. C'est une leçon dense, mais essentielle pour la sécurité de vos utilisateurs. C'est parti.",
    "note": "Une connexion sans protection anti-brute-force est une invitation aux attaques. Ne laissez jamais ça."
  },
  {
    "titre": "Les 4 mécanismes de sécurité",
    "contenu": "<div style='background: #f8f9fa; padding: 1.5rem; border-radius: 12px; border-left: 6px solid #2a5298;'><p style='color: #1e3c72; font-weight: bold; margin-top: 0;'>Notre système de connexion repose sur 4 mécanismes :</p><div style='display: flex; flex-direction: column; gap: 0.7rem; margin-top: 1rem;'><div style='background: #d1ecf1; padding: 0.9rem; border-radius: 8px; border-left: 4px solid #0c5460;'><strong>1️⃣ Vérification de blocage permanent</strong><br><small style='color: #333;'>Si <code>is_blocked</code> est vrai → connexion refusée</small></div><div style='background: #d4edda; padding: 0.9rem; border-radius: 8px; border-left: 4px solid #155724;'><strong>2️⃣ Vérification de blocage temporaire</strong><br><small style='color: #333;'>Si <code>is_login_blocked</code> et non expiré → refus avec temps restant</small></div><div style='background: #fff3cd; padding: 0.9rem; border-radius: 8px; border-left: 4px solid #856404;'><strong>3️⃣ Compteur de tentatives échouées</strong><br><small style='color: #333;'>Incrémenté à chaque échec, remis à zéro à la réussite</small></div><div style='background: #f8d7da; padding: 0.9rem; border-radius: 8px; border-left: 4px solid #721c24;'><strong>4️⃣ Auto-déblocage après expiration</strong><br><small style='color: #333;'>Si le délai est passé, on lève le blocage automatiquement</small></div></div></div>",
    "texteParle": "Notre système de connexion repose sur quatre mécanismes de sécurité. Premier mécanisme : la vérification de blocage permanent. Si l'utilisateur a été bloqué par un admin, le champ is_blocked est vrai, et la connexion est refusée. C'est un blocage définitif, à moins qu'un admin ne le lève. Deuxième mécanisme : la vérification de blocage temporaire. Si l'utilisateur a échoué plusieurs fois de suite, son compte est bloqué temporairement. On vérifie que le délai est bien expiré. Sinon, on refuse la connexion en indiquant le temps restant. Troisième mécanisme : le compteur de tentatives échouées. À chaque échec de mot de passe, on incrémente ce compteur. À chaque réussite, on le remet à zéro. Quatrième mécanisme : l'auto-déblocage après expiration. Si le délai de blocage est passé, on lève le blocage automatiquement, sans intervention humaine. C'est un point crucial pour l'expérience utilisateur : l'utilisateur n'a pas besoin de contacter le support pour être débloqué, il attend vingt-quatre heures et peut réessayer. Ces quatre mécanismes forment une défense en profondeur. Nous allons les implémenter dans deux méthodes : checkCanLogin et recordFailedAttempt, que nous allons voir en détail.",
    "note": "Défense en profondeur : chaque mécanisme protège contre un type d'attaque différent."
  },
  {
    "titre": "Le service LoginAttemptService",
    "contenu": "<div style='background: #e9ecef; padding: 1rem; border-radius: 12px;'><p style='color: #333;'>Créons <code>src/auth/login-attempt.service.ts</code> :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.68rem; line-height: 1.6; white-space: pre;'>import { Injectable, Logger, UnauthorizedException } from '@nestjs/common';<br>import { InjectRepository } from '@nestjs/typeorm';<br>import { Repository } from 'typeorm';<br>import { User } from '../database/entities/user.entity';<br>import { ConfigurationService } from '../config/configuration.service';<br>import { ConfigurationKey } from '../database/entities/configuration.entity';<br><br>@Injectable()<br>export class LoginAttemptService {<br>&nbsp;&nbsp;private readonly logger = new Logger(LoginAttemptService.name);<br><br>&nbsp;&nbsp;constructor(<br>&nbsp;&nbsp;&nbsp;&nbsp;@InjectRepository(User)<br>&nbsp;&nbsp;&nbsp;&nbsp;private userRepository: Repository&lt;User&gt;,<br>&nbsp;&nbsp;&nbsp;&nbsp;private configService: ConfigurationService,<br>&nbsp;&nbsp;) {}<br>}</div><p style='color: #555; font-size: 0.9rem; margin-top: 0.8rem;'>💡 Ce service est dédié à la gestion des tentatives de connexion.</p></div>",
    "texteParle": "Créons un service dédié à la gestion des tentatives de connexion. On l'appelle LoginAttemptService, dans le fichier src/auth/login-attempt.service.ts. On importe les décorateurs NestJS, InjectRepository, Repository, l'entité User, ConfigurationService, et l'énumération ConfigurationKey. On déclare la classe avec le décorateur Injectable. On y met un logger pour tracer les événements importants. Dans le constructeur, on injecte deux dépendances : le UserRepository, pour accéder aux données de l'utilisateur, et le ConfigurationService, pour lire les configurations dynamiques comme le nombre maximum de tentatives. Pourquoi un service dédié plutôt que d'intégrer tout ça dans AuthService ? Pour trois raisons. Premièrement, la responsabilité unique : ce service ne fait qu'une chose, gérer les tentatives de connexion. C'est le principe de responsabilité unique. Deuxièmement, la réutilisabilité : si on veut ajouter un autre point d'authentification plus tard, on peut réutiliser ce service. Troisièmement, la testabilité : on peut tester ce service indépendamment du reste de l'authentification. C'est un bon design.",
    "note": "Un service par responsabilité. LoginAttemptService gère uniquement les tentatives de connexion."
  },
  {
    "titre": "checkCanLogin - Le point d'entrée",
    "contenu": "<div style='background: #f8f9fa; padding: 1rem; border-radius: 12px; border-left: 6px solid #2a5298;'><p style='color: #333;'>La première méthode vérifie si un utilisateur peut se connecter :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.68rem; line-height: 1.6; white-space: pre;'>async checkCanLogin(userId: string): Promise&lt;void&gt; {<br>&nbsp;&nbsp;const user = await this.userRepository.findOne({<br>&nbsp;&nbsp;&nbsp;&nbsp;where: { id: userId },<br>&nbsp;&nbsp;&nbsp;&nbsp;select: {<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;id: true, is_login_blocked: true, login_blocked_until: true,<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;failed_login_attempts: true, is_blocked: true, block_reason: true,<br>&nbsp;&nbsp;&nbsp;&nbsp;},<br>&nbsp;&nbsp;});<br><br>&nbsp;&nbsp;if (!user) throw new UnauthorizedException('Utilisateur non trouvé');<br><br>&nbsp;&nbsp;<span style='color: #6a9955;'>// 1. Blocage permanent ?</span><br>&nbsp;&nbsp;if (user.is_blocked) {<br>&nbsp;&nbsp;&nbsp;&nbsp;throw new UnauthorizedException(<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;user.block_reason || 'Votre compte a été bloqué.'<br>&nbsp;&nbsp;&nbsp;&nbsp;);<br>&nbsp;&nbsp;}<br><br>&nbsp;&nbsp;<span style='color: #6a9955;'>// 2. Blocage temporaire ?</span><br>&nbsp;&nbsp;<span style='color: #6a9955;'>// ... (voir slide suivant)</span><br>}</div></div>",
    "texteParle": "Regardons la première méthode : checkCanLogin. Elle prend l'identifiant de l'utilisateur en paramètre et retourne une Promise vide. Son rôle est de lever une exception si l'utilisateur ne peut pas se connecter, et de ne rien faire si tout va bien. C'est un pattern intéressant : la méthode communique par exception. D'abord, on cherche l'utilisateur en base avec une sélection précise des champs. On ne charge que les champs nécessaires : id, is_login_blocked, login_blocked_until, failed_login_attempts, is_blocked, block_reason. On utilise l'option select de TypeORM pour limiter la requête. C'est une optimisation : inutile de charger toutes les colonnes pour vérifier un état. Si l'utilisateur n'existe pas, on lève une UnauthorizedException. Puis, on vérifie le premier mécanisme : le blocage permanent. Si is_blocked est vrai, on lève une UnauthorizedException avec la raison du blocage. On utilise la raison stockée dans block_reason, ou un message générique si elle est vide. À ce stade, si l'utilisateur est bloqué définitivement, il reçoit un message clair. Il sait qu'il doit contacter le support.",
    "note": "select: { ... } permet de ne charger que les colonnes nécessaires. Bonne pratique pour la performance."
  },
  {
    "titre": "Vérifier le blocage temporaire",
    "contenu": "<div style='background: #e9ecef; padding: 1rem; border-radius: 12px;'><p style='color: #333;'>Suite de checkCanLogin :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.65rem; line-height: 1.6; white-space: pre;'>if (user.is_login_blocked &amp;&amp; user.login_blocked_until) {<br>&nbsp;&nbsp;const now = new Date();<br>&nbsp;&nbsp;<br>&nbsp;&nbsp;if (user.login_blocked_until &gt; now) {<br>&nbsp;&nbsp;&nbsp;&nbsp;<span style='color: #6a9955;'>// Encore bloqué : calculer le temps restant</span><br>&nbsp;&nbsp;&nbsp;&nbsp;const remainingMinutes = Math.ceil(<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;(user.login_blocked_until.getTime() - now.getTime()) / (1000 * 60)<br>&nbsp;&nbsp;&nbsp;&nbsp;);<br>&nbsp;&nbsp;&nbsp;&nbsp;const remainingHours = Math.ceil(remainingMinutes / 60);<br>&nbsp;&nbsp;&nbsp;&nbsp;<br>&nbsp;&nbsp;&nbsp;&nbsp;let timeMessage = '';<br>&nbsp;&nbsp;&nbsp;&nbsp;if (remainingHours &gt;= 24) {<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;const days = Math.ceil(remainingHours / 24);<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;timeMessage = `${days} jour${days &gt; 1 ? 's' : ''}`;<br>&nbsp;&nbsp;&nbsp;&nbsp;} else if (remainingHours &gt;= 1) {<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;timeMessage = `${remainingHours} heure${remainingHours &gt; 1 ? 's' : ''}`;<br>&nbsp;&nbsp;&nbsp;&nbsp;} else {<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;timeMessage = `${remainingMinutes} minute${remainingMinutes &gt; 1 ? 's' : ''}`;<br>&nbsp;&nbsp;&nbsp;&nbsp;}<br>&nbsp;&nbsp;&nbsp;&nbsp;<br>&nbsp;&nbsp;&nbsp;&nbsp;throw new UnauthorizedException(<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;`Trop de tentatives. Réessayez dans ${timeMessage}.`<br>&nbsp;&nbsp;&nbsp;&nbsp;);<br>&nbsp;&nbsp;} else {<br>&nbsp;&nbsp;&nbsp;&nbsp;<span style='color: #6a9955;'>// Blocage expiré : auto-débloquer</span><br>&nbsp;&nbsp;&nbsp;&nbsp;await this.resetLoginAttempts(user.id);<br>&nbsp;&nbsp;}<br>}</div></div>",
    "texteParle": "Continuons checkCanLogin avec la vérification du blocage temporaire. On teste deux conditions : is_login_blocked est vrai, et login_blocked_until est défini. Si ces deux conditions sont réunies, on entre dans le bloc. On prend la date actuelle. Si login_blocked_until est dans le futur, cela signifie que l'utilisateur est encore bloqué. On calcule le temps restant. D'abord en minutes, puis en heures, puis en jours si nécessaire. On construit un message lisible, en gérant les pluriels. Par exemple : 'Trop de tentatives. Réessayez dans 3 heures.' ou 'Réessayez dans 5 minutes.' C'est un détail important pour l'expérience utilisateur : l'utilisateur sait exactement combien de temps il doit attendre. Si login_blocked_until est dans le passé, cela signifie que le blocage a expiré. Dans ce cas, on appelle resetLoginAttempts pour lever automatiquement le blocage. C'est l'auto-déblocage. L'utilisateur n'a pas besoin de contacter le support : dès que le délai est passé, il peut se reconnecter normalement. C'est ce mécanisme qui distingue un système professionnel d'un système amateur. Notez la fonction Math.ceil : elle arrondit toujours au supérieur. Cela évite d'afficher '0 minutes' quand il reste trente secondes. On affiche '1 minute' par prudence.",
    "note": "Math.ceil arrondit au supérieur. Un délai de 30 secondes s'affiche comme '1 minute'."
  },
  {
    "titre": "recordFailedAttempt - Compter les échecs",
    "contenu": "<div style='background: #f8f9fa; padding: 1rem; border-radius: 12px; border-left: 6px solid #dc3545;'><p style='color: #333;'>Enregistrer une tentative échouée :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.65rem; line-height: 1.6; white-space: pre;'>async recordFailedAttempt(phoneNumber: string): Promise&lt;{<br>&nbsp;&nbsp;isBlocked: boolean;<br>&nbsp;&nbsp;remainingAttempts: number;<br>&nbsp;&nbsp;blockedUntil?: Date;<br>}&gt; {<br>&nbsp;&nbsp;const user = await this.userRepository.findOne({<br>&nbsp;&nbsp;&nbsp;&nbsp;where: { phone_number: phoneNumber },<br>&nbsp;&nbsp;});<br>&nbsp;&nbsp;if (!user) return { isBlocked: false, remainingAttempts: 0 };<br><br>&nbsp;&nbsp;<span style='color: #6a9955;'>// Récupérer les configurations</span><br>&nbsp;&nbsp;const maxAttempts = await this.configService.getNumber(<br>&nbsp;&nbsp;&nbsp;&nbsp;ConfigurationKey.MAX_LOGIN_ATTEMPTS, 5<br>&nbsp;&nbsp;);<br>&nbsp;&nbsp;const blockDurationMinutes = await this.configService.getNumber(<br>&nbsp;&nbsp;&nbsp;&nbsp;ConfigurationKey.LOGIN_BLOCK_DURATION_MINUTES, 1440<br>&nbsp;&nbsp;);<br><br>&nbsp;&nbsp;<span style='color: #6a9955;'>// Incrémenter le compteur</span><br>&nbsp;&nbsp;user.failed_login_attempts += 1;<br>&nbsp;&nbsp;user.last_failed_login_attempt = new Date();<br><br>&nbsp;&nbsp;<span style='color: #6a9955;'>// Vérifier si le seuil est atteint</span><br>&nbsp;&nbsp;const isBlocked = user.failed_login_attempts &gt;= maxAttempts;<br>&nbsp;&nbsp;let remainingAttempts = Math.max(0, maxAttempts - user.failed_login_attempts);<br><br>&nbsp;&nbsp;<span style='color: #6a9955;'>// ... (suite)</span><br>}</div></div>",
    "texteParle": "Passons à la méthode recordFailedAttempt. Elle prend le numéro de téléphone en paramètre, et retourne un objet avec trois propriétés : isBlocked, remainingAttempts, et blockedUntil. C'est cette méthode qui gère toute la logique d'incrémentation et de blocage. D'abord, on cherche l'utilisateur par son numéro. Si on ne le trouve pas, on retourne un objet avec isBlocked false et remainingAttempts zéro. Pourquoi ? Parce qu'un numéro inexistant ne doit pas créer de compte. C'est une protection contre les attaques qui essaient des numéros au hasard. Ensuite, on récupère deux configurations. MAX_LOGIN_ATTEMPTS : le nombre maximum de tentatives. Par défaut, 5. LOGIN_BLOCK_DURATION_MINUTES : la durée du blocage en minutes. Par défaut, 1440, c'est-à-dire vingt-quatre heures. Ces configurations sont dynamiques : un admin peut les modifier sans redéployer. Puis, on incrémente le compteur failed_login_attempts de l'utilisateur. On met à jour last_failed_login_attempt avec la date actuelle. On calcule ensuite si le seuil est atteint : isBlocked vaut vrai si le compteur atteint ou dépasse le maximum. On calcule remainingAttempts, le nombre de tentatives restantes, avec un Math.max pour ne jamais descendre en dessous de zéro. La suite de la méthode va bloquer si nécessaire.",
    "note": "Les configurations dynamiques permettent de changer le seuil sans redéployer. Très pratique en production."
  },
  {
    "titre": "Bloquer l'utilisateur",
    "contenu": "<div style='background: #e9ecef; padding: 1rem; border-radius: 12px;'><p style='color: #333;'>Suite de recordFailedAttempt :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.65rem; line-height: 1.6; white-space: pre;'>if (isBlocked) {<br>&nbsp;&nbsp;<span style='color: #6a9955;'>// Bloquer le compte</span><br>&nbsp;&nbsp;user.is_login_blocked = true;<br>&nbsp;&nbsp;const blockedUntil = new Date();<br>&nbsp;&nbsp;blockedUntil.setMinutes(blockedUntil.getMinutes() + blockDurationMinutes);<br>&nbsp;&nbsp;user.login_blocked_until = blockedUntil;<br>&nbsp;&nbsp;user.block_reason = `Trop de tentatives (${user.failed_login_attempts})`;<br><br>&nbsp;&nbsp;this.logger.warn(<br>&nbsp;&nbsp;&nbsp;&nbsp;`🔒 Compte ${user.id} bloqué pour ${blockDurationMinutes} minutes`<br>&nbsp;&nbsp;);<br>}<br><br>await this.userRepository.save(user);<br><br>return {<br>&nbsp;&nbsp;isBlocked,<br>&nbsp;&nbsp;remainingAttempts,<br>&nbsp;&nbsp;blockedUntil: user.login_blocked_until || undefined,<br>};</div><p style='color: #333; margin-top: 0.8rem;'><strong>Ce qui est retourné :</strong></p><ul style='padding-left: 1.2rem; color: #333; line-height: 1.7;'><li><code>isBlocked</code> : true si le compte vient d'être bloqué</li><li><code>remainingAttempts</code> : combien de tentatives restent</li><li><code>blockedUntil</code> : jusqu'à quand le compte est bloqué</li></ul></div>",
    "texteParle": "Voici la suite de recordFailedAttempt. Si isBlocked est vrai, on bloque le compte. On met is_login_blocked à true. On calcule la date de fin de blocage : maintenant plus blockDurationMinutes. On la stocke dans login_blocked_until. On met un block_reason avec un message clair : 'Trop de tentatives, suivi du nombre'. On logue un avertissement pour la traçabilité. Cette information est précieuse pour les administrateurs : ils peuvent voir combien d'utilisateurs sont bloqués et pourquoi. Puis, on sauvegarde l'utilisateur avec ses nouvelles valeurs. Et on retourne un objet avec trois propriétés. isBlocked : vrai si on vient de bloquer le compte. remainingAttempts : le nombre de tentatives restantes avant blocage, ou zéro si le compte est bloqué. blockedUntil : la date jusqu'à laquelle le compte est bloqué, ou undefined si on n'a pas bloqué. Ce retour est important : le service qui appelle recordFailedAttempt peut ainsi construire le bon message d'erreur. Si le compte n'est pas encore bloqué, on peut dire 'Il vous reste 3 tentatives'. Si le compte vient d'être bloqué, on dit 'Compte bloqué pour 24 heures'. C'est cette souplesse qui rend l'expérience utilisateur agréable, même en cas d'erreur.",
    "note": "Le retour de la méthode doit contenir assez d'infos pour construire un message utilisateur précis."
  },
  {
    "titre": "recordSuccessfulAttempt - Réinitialiser",
    "contenu": "<div style='background: #f8f9fa; padding: 1rem; border-radius: 12px; border-left: 6px solid #10b981;'><p style='color: #333;'>Quand l'utilisateur réussit sa connexion :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.7rem; line-height: 1.6; white-space: pre;'>async recordSuccessfulAttempt(userId: string): Promise&lt;void&gt; {<br>&nbsp;&nbsp;await this.resetLoginAttempts(userId);<br>}<br><br>async resetLoginAttempts(userId: string): Promise&lt;void&gt; {<br>&nbsp;&nbsp;await this.userRepository.update(<br>&nbsp;&nbsp;&nbsp;&nbsp;{ id: userId },<br>&nbsp;&nbsp;&nbsp;&nbsp;{<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;failed_login_attempts: 0,<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;last_failed_login_attempt: null,<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;is_login_blocked: false,<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;login_blocked_until: null,<br>&nbsp;&nbsp;&nbsp;&nbsp;},<br>&nbsp;&nbsp;);<br>&nbsp;&nbsp;this.logger.log(`✅ Tentatives réinitialisées pour ${userId}`);<br>}</div><p style='color: #333; margin-top: 0.8rem;'><strong>Que faut-il réinitialiser ?</strong></p><ul style='padding-left: 1.2rem; color: #333; line-height: 1.7;'><li>✅ <code>failed_login_attempts</code> → 0</li><li>✅ <code>last_failed_login_attempt</code> → null</li><li>✅ <code>is_login_blocked</code> → false</li><li>✅ <code>login_blocked_until</code> → null</li></ul></div>",
    "texteParle": "Passons à la méthode recordSuccessfulAttempt, qui est très simple : elle appelle simplement resetLoginAttempts. Cette séparation peut sembler superflue, mais elle a un intérêt : elle documente l'intention. Le nom recordSuccessfulAttempt dit clairement ce qu'on fait : enregistrer une connexion réussie. En interne, on appelle resetLoginAttempts qui fait le travail réel. Regardons resetLoginAttempts. Elle met à jour l'utilisateur avec quatre valeurs : failed_login_attempts à zéro, last_failed_login_attempt à null, is_login_blocked à false, login_blocked_until à null. C'est une réinitialisation complète de l'état de blocage. On utilise la méthode update de TypeORM, qui fait une requête UPDATE directe, sans charger l'entité. C'est plus efficace qu'un findOne suivi d'un save. À chaque connexion réussie, cette méthode est appelée. Cela signifie que dès qu'un utilisateur entre son bon mot de passe, son compteur est remis à zéro. Même s'il a échoué trois fois avant, sa réussite efface l'historique. C'est important pour l'expérience utilisateur : un utilisateur qui se trompe trois fois puis se rappelle de son mot de passe ne doit pas être pénalisé. On efface les échecs. Note : on ne réinitialise PAS block_reason, car il peut servir pour d'autres blocages (par un admin).",
    "note": "réinitialiser à la réussite est essentiel. Ne pénalisez pas l'utilisateur qui retrouve son mot de passe."
  },
  {
    "titre": "Utiliser dans validateUser",
    "contenu": "<div style='background: #e9ecef; padding: 1rem; border-radius: 12px;'><p style='color: #333;'>Dans <code>AuthService.validateUser</code> :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.65rem; line-height: 1.6; white-space: pre;'>async validateUser(phone: string, password: string) {<br>&nbsp;&nbsp;const user = await this.userRepository.findOne({<br>&nbsp;&nbsp;&nbsp;&nbsp;where: { phone_number: phone },<br>&nbsp;&nbsp;&nbsp;&nbsp;relations: { profile: true },<br>&nbsp;&nbsp;});<br>&nbsp;&nbsp;if (!user) throw new UnauthorizedException('Identifiants incorrects');<br><br>&nbsp;&nbsp;<span style='color: #6a9955;'>// ✅ 1. Vérifier les blocages</span><br>&nbsp;&nbsp;await this.loginAttemptService.checkCanLogin(user.id);<br><br>&nbsp;&nbsp;<span style='color: #6a9955;'>// 2. Vérifier le mot de passe</span><br>&nbsp;&nbsp;const isValid = await this.comparePassword(password, user.password_hash);<br><br>&nbsp;&nbsp;if (!isValid) {<br>&nbsp;&nbsp;&nbsp;&nbsp;<span style='color: #6a9955;'>// ✅ 3. Enregistrer l'échec</span><br>&nbsp;&nbsp;&nbsp;&nbsp;const result = await this.loginAttemptService.recordFailedAttempt(phone);<br>&nbsp;&nbsp;&nbsp;&nbsp;<br>&nbsp;&nbsp;&nbsp;&nbsp;<span style='color: #6a9955;'>// Construire le message</span><br>&nbsp;&nbsp;&nbsp;&nbsp;if (result.isBlocked) {<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;throw new UnauthorizedException('Compte bloqué temporairement');<br>&nbsp;&nbsp;&nbsp;&nbsp;}<br>&nbsp;&nbsp;&nbsp;&nbsp;throw new UnauthorizedException(`Il reste ${result.remainingAttempts} tentatives`);<br>&nbsp;&nbsp;}<br><br>&nbsp;&nbsp;<span style='color: #6a9955;'>// ✅ 4. Réinitialiser les tentatives</span><br>&nbsp;&nbsp;await this.loginAttemptService.recordSuccessfulAttempt(user.id);<br><br>&nbsp;&nbsp;const { password_hash, ...result } = user;<br>&nbsp;&nbsp;return result;<br>}</div></div>",
    "texteParle": "Voyons comment utiliser LoginAttemptService dans la méthode validateUser de AuthService. C'est cette méthode qui valide les identifiants d'un utilisateur. D'abord, on cherche l'utilisateur par son numéro de téléphone. Si on ne le trouve pas, on lève une UnauthorizedException avec un message générique : 'Identifiants incorrects'. Puis, étape un, on appelle checkCanLogin, qui vérifie les blocages. Si l'utilisateur est bloqué, cette méthode lève une exception, et validateUser s'arrête là. Étape deux : on compare le mot de passe avec comparePassword. C'est bcrypt qui fait la comparaison. Si le mot de passe est incorrect, on entre dans le bloc if. Étape trois : on appelle recordFailedAttempt, qui incrémente le compteur et éventuellement bloque. Le retour nous donne isBlocked et remainingAttempts. On peut ainsi construire un message d'erreur précis : si le compte vient d'être bloqué, on dit 'Compte bloqué temporairement'. Sinon, on dit 'Il reste 3 tentatives'. C'est cette précision qui rend notre système agréable. Étape quatre : si tout est bon, on appelle recordSuccessfulAttempt, qui réinitialise le compteur. On retire ensuite le hash du mot de passe avant de retourner l'utilisateur. L'intégration est complète : checkCanLogin, comparePassword, recordFailedAttempt, recordSuccessfulAttempt. C'est le flux normal, et c'est le flux en cas d'échec.",
    "note": "L'ordre est critique : checkCanLogin avant la comparaison de mot de passe."
  },
  {
    "titre": "Le cron de nettoyage",
    "contenu": "<div style='background: #f8f9fa; padding: 1rem; border-radius: 12px; border-left: 6px solid #a78bfa;'><p style='color: #333;'>Ajoutons une tâche planifiée pour nettoyer les vieilles tentatives :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.68rem; line-height: 1.6; white-space: pre;'>import { Cron, CronExpression } from '@nestjs/schedule';<br><br>@Cron(CronExpression.EVERY_DAY_AT_MIDNIGHT)<br>async handleCleanOldAttempts(): Promise&lt;void&gt; {<br>&nbsp;&nbsp;this.logger.log('🧹 Nettoyage des vieilles tentatives...');<br>&nbsp;&nbsp;const count = await this.cleanOldAttempts();<br>&nbsp;&nbsp;this.logger.log(`✅ ${count} tentatives nettoyées`);<br>}<br><br>async cleanOldAttempts(): Promise&lt;number&gt; {<br>&nbsp;&nbsp;const cutoffDate = new Date();<br>&nbsp;&nbsp;cutoffDate.setHours(cutoffDate.getHours() - 24);<br><br>&nbsp;&nbsp;const users = await this.userRepository.find({<br>&nbsp;&nbsp;&nbsp;&nbsp;where: { last_failed_login_attempt: MoreThan(cutoffDate) },<br>&nbsp;&nbsp;});<br><br>&nbsp;&nbsp;let cleanedCount = 0;<br>&nbsp;&nbsp;for (const user of users) {<br>&nbsp;&nbsp;&nbsp;&nbsp;if (user.last_failed_login_attempt &amp;&amp; user.last_failed_login_attempt &lt; cutoffDate) {<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;await this.resetLoginAttempts(user.id);<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;cleanedCount++;<br>&nbsp;&nbsp;&nbsp;&nbsp;}<br>&nbsp;&nbsp;}<br>&nbsp;&nbsp;return cleanedCount;<br>}</div></div>",
    "texteParle": "Ajoutons une tâche planifiée pour nettoyer les vieilles tentatives. Pourquoi ? Parce que si un utilisateur a échoué deux fois il y a six mois, et qu'il revient aujourd'hui, on ne veut pas que ces deux tentatives anciennes soient comptées. Elles doivent être oubliées. On utilise le décorateur Cron de @nestjs/schedule. La tâche s'exécute tous les jours à minuit. Elle appelle cleanOldAttempts. Cette méthode calcule la date limite : maintenant moins vingt-quatre heures. Elle cherche tous les utilisateurs dont la dernière tentative échouée est plus ancienne que cette date. Pour chacun, elle appelle resetLoginAttempts, qui remet tout à zéro. À la fin, elle retourne le nombre d'utilisateurs nettoyés. Ce cron est une sécurité supplémentaire : même si un utilisateur est bloqué pour vingt-quatre heures, le lendemain à minuit, ses tentatives sont effacées. Attention, cela ne signifie pas qu'il est débloqué avant l'heure. Le blocage a sa propre durée, indépendante. Mais dès qu'une tentative ancienne a plus de vingt-quatre heures, elle est oubliée. C'est une politique de nettoyage cohérente : les vieux échecs n'ont plus de sens et doivent être effacés.",
    "note": "Un cron à minuit pour nettoyer les vieux échecs. Évite les faux positifs après des mois."
  },
  {
    "titre": "Résumé et prochaine étape",

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentIndex = 0;
    let isSpeaking = false;
    let isPaused = false;
    let currentUtterance = null;
    let isLoading = false;
    let loadingTimeout = null;
    let isTransitioning = false;
    let speechSupported = true;
    let userInteracted = false;
    let isPlaying = false;
    let loadingCancelled = false;

    const total = slides.length;
    const synth = window.speechSynthesis;

    // Références jQuery
    const $title = $('#slideTitle');
    const $body = $('#slideBody');
    const $counter = $('#slideCounter');
    const $statusText = $('#statusText');
    const $statusBadge = $('#statusBadge');
    const $loading = $('#loadingOverlay');
    const $loadingText = $('#loadingText');
    const $loadingSub = $('#loadingSub');
    const $loadingTimeout = $('#loadingTimeout');
    const $loadingProgressBar = $('#loadingProgressBar');
    const $autoIndicator = $('#autoIndicator');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $replay = $('#replayBtn');
    const $play = $('#playBtn');
    const $cancelLoading = $('#cancelLoadingBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function setStatus(text, type) {
        $statusText.text(text);
        $statusBadge.removeClass('idle speaking error paused waiting loading');
        if (type === 'speaking') $statusBadge.addClass('speaking');
        else if (type === 'error') $statusBadge.addClass('error');
        else if (type === 'paused') $statusBadge.addClass('paused');
        else if (type === 'waiting') $statusBadge.addClass('waiting');
        else if (type === 'loading') $statusBadge.addClass('loading');
        else $statusBadge.addClass('idle');
    }

    function updatePlayButton() {
        if (isPlaying) {
            $play.addClass('playing');
            $play.find('.btn-icon').text('⏸');
            $play.find('.btn-label').text('Pause');
        } else {
            $play.removeClass('playing');
            $play.find('.btn-icon').text('▶');
            $play.find('.btn-label').text('Play');
        }
    }

    function showLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        
        loadingCancelled = false;
        isLoading = true;
        
        // Réinitialiser la barre de progression
        $loadingProgressBar.css('animation', 'none');
        $loadingProgressBar.css('width', '0%');
        // Forcer un reflow
        $loadingProgressBar[0].offsetHeight;
        $loadingProgressBar.css('animation', 'loadingProgress 30s ease-out forwards');
        
        $loadingText.text('Préparation vocale...');
        $loadingSub.text('Synthèse en cours');
        $loadingTimeout.text('⏱️ 30 secondes maximum');
        $loading.fadeIn(300);
        setStatus("⏳ Chargement...", 'loading');
        
        // 🔥 TIMEOUT DE 30 SECONDES
        loadingTimeout = setTimeout(() => {
            if (isLoading && !loadingCancelled) {
                hideLoading();
                setStatus("⚠️ Délai dépassé (30s)", 'error');
                isPlaying = false;
                updatePlayButton();
                $loadingSub.text('La synthèse vocale a pris trop de temps');
                $loadingTimeout.text('❌ Délai dépassé');
            }
        }, 30000);
    }

    function hideLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        isLoading = false;
        loadingCancelled = false;
        $loading.fadeOut(300);
        // Ne pas changer le statut si on est en train de parler
        if (!isSpeaking && !isPlaying) {
            setStatus("⏸ Lecture arrêtée", 'paused');
        }
    }

    function cancelLoading() {
        loadingCancelled = true;
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        hideLoading();
        stopSpeaking();
        setStatus("⏸ Annulé", 'paused');
        isPlaying = false;
        updatePlayButton();
        $loadingText.text('Annulé par l\'utilisateur');
        $loadingSub.text('Vous pouvez réessayer');
        $loadingTimeout.text('✕ Annulation');
    }

    // Arrêter la parole proprement
    function stopSpeaking() {
        try {
            if (synth && (synth.speaking || synth.pending)) {
                synth.cancel();
            }
        } catch(e) {
            console.warn('Erreur stopSpeaking:', e);
        }
        if (currentUtterance) {
            try {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance.onstart = null;
            } catch(e) {}
            currentUtterance = null;
        }
        isSpeaking = false;
        isPlaying = false;
        updatePlayButton();
    }

    // Mettre en pause la parole
    function pauseSpeaking() {
        try {
            if (synth && synth.speaking) {
                synth.pause();
                isPaused = true;
                isPlaying = false;
                setStatus("⏸ Lecture en pause", 'paused');
                updatePlayButton();
            }
        } catch(e) {
            console.warn('Erreur pauseSpeaking:', e);
            stopSpeaking();
        }
    }

    // Reprendre la parole
    function resumeSpeaking() {
        try {
            if (synth && synth.paused) {
                synth.resume();
                isPaused = false;
                isPlaying = true;
                setStatus("🔊 Lecture en cours", 'speaking');
                updatePlayButton();
            } else if (!isSpeaking && !synth.speaking && !synth.pending) {
                speakSlide(currentIndex);
            }
        } catch(e) {
            console.warn('Erreur resumeSpeaking:', e);
            speakSlide(currentIndex);
        }
    }

    function renderSlide(index) {
        const slide = slides[index];
        $title.text(slide.titre);

        let html = '';
        html += `<div class="content-card">${slide.contenu}</div>`;
        if (slide.note) {
            html += `<div class="note-box">${slide.note}</div>`;
        }
        $body.html(html);
        $counter.text(`${index+1} / ${total}`);

        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
        }
    }

    // ================================================================
    // LECTURE VOCALE
    // ================================================================
    function speakSlide(index) {
        return new Promise((resolve) => {
            const slide = slides[index];
            const text = slide.texteParle;
            
            if (!text || text.trim() === '' || !speechSupported) {
                resolve();
                return;
            }

            if (!window.speechSynthesis) {
                setStatus("❌ Synthèse vocale non supportée", 'error');
                speechSupported = false;
                resolve();
                return;
            }

            // Arrêter toute lecture en cours
            stopSpeaking();
            
            // Réinitialiser l'état de pause
            isPaused = false;
            
            showLoading();
            setStatus("Initialisation...", 'loading');

            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.92;
                utterance.pitch = 1.05;
                utterance.volume = 1;

                let isFinished = false;
                let errorHandled = false;

                utterance.onstart = function() {
                    if (loadingCancelled) {
                        stopSpeaking();
                        resolve();
                        return;
                    }
                    hideLoading();
                    isSpeaking = true;
                    isPlaying = true;
                    isPaused = false;
                    setStatus("🔊 Lecture en cours", 'speaking');
                    updatePlayButton();
                };

                utterance.onend = function() {
                    if (isFinished) return;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    setStatus("✅ Terminé", 'idle');
                    hideLoading();
                    updatePlayButton();
                    resolve();
                };

                utterance.onerror = function(e) {
                    if (isFinished || errorHandled) return;
                    errorHandled = true;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    hideLoading();
                    updatePlayButton();
                    
                    if (e.error === 'not-allowed') {
                        setStatus("⚠️ Permission refusée", 'error');
                    } else if (e.error === 'synthesis-unavailable') {
                        setStatus("⚠️ Synthèse indisponible", 'error');
                    } else if (e.error === 'canceled') {
                        setStatus("⏸ Annulé", 'paused');
                    } else {
                        setStatus("❌ Erreur audio: " + (e.error || 'inconnue'), 'error');
                    }
                    
                    resolve();
                };

                // Gestion du chargement des voix
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = function() {
                        if (!loadingCancelled) {
                            try {
                                synth.speak(utterance);
                            } catch(err) {
                                // Silencieux
                            }
                        }
                        synth.onvoiceschanged = null;
                    };
                }

                currentUtterance = utterance;
                
                if (!loadingCancelled) {
                    try {
                        synth.speak(utterance);
                    } catch(err) {
                        setTimeout(() => {
                            if (!loadingCancelled) {
                                try {
                                    synth.speak(utterance);
                                } catch(e) {
                                    setStatus("❌ Erreur de lecture", 'error');
                                    isPlaying = false;
                                    updatePlayButton();
                                    hideLoading();
                                    resolve();
                                }
                            } else {
                                resolve();
                            }
                        }, 100);
                    }
                } else {
                    resolve();
                }

            } catch(err) {
                hideLoading();
                setStatus("❌ Erreur générale", 'error');
                isPlaying = false;
                updatePlayButton();
                console.error('Erreur speakSlide:', err);
                resolve();
            }
        });
    }

    // ================================================================
    // NAVIGATION
    // ================================================================
    async function goToSlide(index) {
        if (isTransitioning) return;
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        
        // Si on est en train de lire, on met en pause avant de naviguer
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        // Arrêter complètement la lecture
        stopSpeaking();
        
        await new Promise(r => setTimeout(r, 50));
        
        if (index === currentIndex) {
            setStatus("📄 Slide actuel", 'idle');
            return;
        }

        isTransitioning = true;
        currentIndex = index;
        renderSlide(index);
        
        // Réinitialiser l'état de lecture
        isPlaying = false;
        updatePlayButton();
        setStatus("⏸ Lecture arrêtée", 'paused');

        await new Promise(r => setTimeout(r, 150));
        isTransitioning = false;
    }

    async function goToNext() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex + 1 < total) {
            await goToSlide(currentIndex + 1);
        } else {
            setStatus("🏁 Dernier slide", 'idle');
        }
    }

    async function goToPrev() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex - 1 >= 0) {
            await goToSlide(currentIndex - 1);
        } else {
            setStatus("🔁 Premier slide", 'idle');
        }
    }

    // ================================================================
    // GESTION PLAY/PAUSE
    // ================================================================
    function togglePlay() {
        if (!userInteracted) {
            userInteracted = true;
        }

        // Si le chargement est en cours, on l'annule
        if (isLoading) {
            cancelLoading();
            return;
        }

        // Si le synthétiseur est en pause, on reprend
        if (synth && synth.paused) {
            resumeSpeaking();
            return;
        }

        // Si la lecture est en cours, on met en pause
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
            return;
        }

        // Sinon, on démarre la lecture du slide courant
        if (!isSpeaking && !isPlaying) {
            stopSpeaking();
            speakSlide(currentIndex);
        }
    }

    // ================================================================
    // INIT
    // ================================================================
    async function init() {
        // Vérifier la compatibilité
        if (!window.speechSynthesis) {
            setStatus("❌ Synthèse vocale non supportée", 'error');
            speechSupported = false;
        }

        // Précharger les voix
        try {
            if (synth.getVoices) {
                synth.getVoices();
                setTimeout(() => {
                    try {
                        synth.getVoices();
                    } catch(e) {}
                }, 200);
            }
        } catch(e) {
            console.warn('Erreur chargement voix:', e);
        }

        // Afficher le premier slide
        renderSlide(0);
        $counter.text(`1 / ${total}`);
        
        // État initial
        setStatus("⏸ Appuie sur Play", 'paused');
        updatePlayButton();
        $autoIndicator.text('⏸ Lecture manuelle');

        // ================================================================
        // ÉVÉNEMENTS
        // ================================================================
        
        // Bouton Play/Pause
        $play.on('click', function() {
            togglePlay();
        });

        // Bouton Annuler le chargement
        $cancelLoading.on('click', function() {
            cancelLoading();
        });

        // Navigation
        $prev.on('click', function() {
            // Si chargement en cours, on annule
            if (isLoading) cancelLoading();
            goToPrev();
        });

        $next.on('click', function() {
            if (isLoading) cancelLoading();
            goToNext();
        });

        // Replay - relire le slide courant
        $replay.on('click', function() {
            if (isLoading) cancelLoading();
            stopSpeaking();
            setTimeout(() => {
                speakSlide(currentIndex);
            }, 100);
        });

        // Support du clavier (espace pour play/pause)
        $(document).on('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });

        // Nettoyage
        $(window).on('beforeunload', function() {
            try {
                if (synth.speaking) synth.cancel();
            } catch(e) {}
            hideLoading();
        });

        // Gérer les cas où la synthèse se termine de manière inattendue
        setInterval(() => {
            if (isPlaying && !synth.speaking && !synth.pending && !isPaused && !isLoading) {
                isPlaying = false;
                updatePlayButton();
                setStatus("⏸ Lecture arrêtée", 'paused');
            }
        }, 1000);
    }

    init();
});
