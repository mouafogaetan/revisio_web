<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Présentation mobile</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' },
            options: { skipHtmlTypes: 'script' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 500px;
        margin: 0 auto;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    .slide-header {
        flex-shrink: 0;
        padding: 18px 16px 10px 16px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        z-index: 10;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .slide-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
    }

    .content-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 18px 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        flex-shrink: 0;
    }

    .content-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .content-card li {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        line-height: 1.5;
    }

    .content-card li:last-child {
        border-bottom: none;
    }

    .bullet-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
    }

    .math-block {
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        overflow-x: auto;
        flex-shrink: 0;
        margin: 4px 0;
    }

    .math-block .math {
        font-size: 1.2rem;
        color: #e2e8f0;
    }

    .note-box {
        background: rgba(96, 165, 250, 0.08);
        border-left: 4px solid #60a5fa;
        padding: 12px 16px;
        border-radius: 12px;
        font-style: italic;
        font-size: 0.9rem;
        color: #cbd5e1;
        flex-shrink: 0;
    }

    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        border-radius: 0;
        flex-direction: column;
    }

    .loading-card {
        background: #1e293b;
        padding: 32px 28px;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #334155;
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px auto;
    }

    .loading-text {
        font-weight: 600;
        font-size: 1.1rem;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    .loading-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 16px;
    }
    .loading-progress {
        height: 3px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        animation: loadingProgress 30s ease-out forwards;
    }

    .loading-timeout {
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 12px;
    }

    .btn-cancel-loading {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 40px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #f87171;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }

    .btn-cancel-loading:active {
        transform: scale(0.94);
        background: rgba(239, 68, 68, 0.25);
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
    }

    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .slide-counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255,255,255,0.05);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(255,255,255,0.04);
    }

    .status-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 30px;
        background: rgba(96, 165, 250, 0.12);
        color: #93bbfc;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
    }

    .status-badge .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: pulse-dot 1.2s infinite;
        flex-shrink: 0;
    }

    .status-badge.idle .dot {
        animation: none;
        background: #64748b;
    }
    .status-badge.speaking .dot {
        background: #34d399;
        animation: pulse-dot 0.8s infinite;
    }
    .status-badge.error .dot {
        background: #f87171;
        animation: none;
    }
    .status-badge.paused .dot {
        animation: none;
        background: #fbbf24;
    }
    .status-badge.waiting .dot {
        animation: pulse-dot 1.5s infinite;
        background: #fbbf24;
    }
    .status-badge.loading .dot {
        animation: pulse-dot 0.5s infinite;
        background: #60a5fa;
    }

    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.7); }
    }

    .footer-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(255,255,255,0.1);
    }

    .btn-secondary {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-play {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
        min-width: 80px;
        justify-content: center;
    }
    .btn-play:active {
        background: rgba(52, 211, 153, 0.25);
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
    }

    .auto-indicator {
        font-size: 0.65rem;
        color: #64748b;
        text-align: center;
        letter-spacing: 0.3px;
        padding: 2px 0;
    }

    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.2rem;
        }
        .content-card li {
            font-size: 0.9rem;
            padding: 8px 0;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .btn-play {
            min-width: 60px;
        }
        .footer-buttons {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
        .loading-card {
            padding: 20px 16px;
        }
        .math-block .math {
            font-size: 1rem;
        }
    }

    @media (min-width: 600px) {
        .app-container {
            max-width: 480px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
        .loading-overlay {
            border-radius: 32px;
        }
    }

    /* Mode jour (par défaut) */
    html, body {
        background: #f0f4f8 !important;
        color: #1a202c !important;
    }
    .app-container {
        background: linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%) !important;
    }
    .slide-header {
        background: rgba(255, 255, 255, 0.85) !important;
        border-bottom: 1px solid rgba(0,0,0,0.08) !important;
    }
    .slide-header h1 {
        background: linear-gradient(135deg, #2b6cb0, #6b46c1) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        background-clip: text !important;
    }
    .slide-footer {
        background: rgba(255, 255, 255, 0.9) !important;
        border-top: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card {
        background: rgba(255,255,255,0.8) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card li {
        border-bottom: 1px solid rgba(0,0,0,0.05) !important;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.12) !important;
        border-left: 4px solid #4299e1 !important;
        color: #2c3e50 !important;
    }
    .math-block {
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .math-block .math {
        color: #2d3748 !important;
    }
    .slide-counter {
        color: #4a5568 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .status-badge {
        background: rgba(96, 165, 250, 0.15) !important;
        color: #2b6cb0 !important;
        border: 1px solid rgba(96, 165, 250, 0.15) !important;
    }
    .btn {
        color: #2d3748 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .btn-secondary {
        background: rgba(0,0,0,0.04) !important;
        border-color: rgba(0,0,0,0.08) !important;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15) !important;
        border-color: rgba(52, 211, 153, 0.2) !important;
        color: #38a169 !important;
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15) !important;
        border-color: rgba(251, 191, 36, 0.2) !important;
        color: #d69e2e !important;
    }
    .auto-indicator {
        color: #718096 !important;
    }
    .loading-card {
        background: #ffffff !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .loading-text {
        color: #1a202c !important;
    }
    .loading-sub {
        color: #4a5568 !important;
    }
</style>
</head>
<body>

<div class="app-container">

    <header class="slide-header">
        <h1 id="slideTitle">Chargement...</h1>
    </header>

    <main class="slide-body" id="slideBody"></main>

    <!-- LOADING OVERLAY AVEC BOUTON ANNULER -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Préparation vocale...</div>
            <div class="loading-sub" id="loadingSub">Synthèse en cours</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loadingProgressBar"></div>
            </div>
            <div class="loading-timeout" id="loadingTimeout">⏱️ 30 secondes maximum</div>
            <button class="btn-cancel-loading" id="cancelLoadingBtn">
                <span>✕</span> Annuler
            </button>
        </div>
    </div>

    <footer class="slide-footer">
        <div class="footer-top">
            <span class="slide-counter" id="slideCounter">1 / 3</span>
            <span class="status-badge idle" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">Prêt</span>
            </span>
        </div>

        <div class="footer-buttons">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-secondary" id="replayBtn">
                <span class="btn-icon">🔁</span> <span class="btn-label">Relire</span>
            </button>
            <button class="btn btn-play" id="playBtn">
                <span class="btn-icon">▶</span> <span class="btn-label">Play</span>
            </button>
        </div>

        <div class="auto-indicator" id="autoIndicator">⏸ Lecture manuelle</div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // SLIDES
    // ================================================================
    const slides = [
  {
    "titre": "Stratégie d'authentification",
    "contenu": "<div style='background: linear-gradient(135deg, #1e3c72, #2a5298); color: white; padding: 2rem; border-radius: 15px; text-align: center; margin-bottom: 1.5rem;'><h2 style='color: #fff; margin-bottom: 0.5rem;'>🔐 Chapitre 3 : Authentification</h2><p style='color: #e0e0e0; font-size: 1.1rem;'>Comprendre la stratégie d'auth de SawaMart</p><hr style='border-color: #4a7db0; width: 50%;'><p style='color: #f0f0f0;'>Leçon 3.1 : Téléphone + OTP + JWT + anti-brute-force</p></div><p>Bienvenue dans le <strong>Chapitre 3</strong>, probablement le plus important du cours. L'authentification, c'est la porte d'entrée de votre application. Si elle est mal conçue, tous les autres modules s'effondrent. Nous allons voir pourquoi SawaMart utilise <strong>le téléphone</strong> plutôt que l'email, comment <strong>l'OTP par SMS</strong> sécurise l'inscription, et pourquoi <strong>JWT</strong> est le bon choix pour une API mobile.</p>",
    "texteParle": "Bonjour à toutes et à tous et bienvenue dans ce nouveau chapitre, le chapitre trois, consacré à l'authentification. C'est probablement le chapitre le plus important de tout le cours, car l'authentification est la porte d'entrée de votre application. Si elle est mal conçue, tous les autres modules s'effondrent. Un utilisateur mal authentifié peut accéder à des données qui ne lui appartiennent pas. Une faille dans l'authentification peut compromettre l'ensemble de la plateforme. Nous allons donc prendre le temps de bien comprendre la stratégie que nous allons mettre en place. SawaMart utilise le téléphone comme identifiant, pas l'email. Le téléphone est vérifié par un code OTP envoyé par SMS. Une fois vérifié, l'utilisateur reçoit un token JWT pour ses futures requêtes. Et pour éviter les attaques par force brute, on bloque temporairement les comptes après plusieurs échecs. C'est cette stratégie globale que nous allons voir aujourd'hui. C'est parti.",
    "note": "Une authentification bien conçue est la fondation de toute application sérieuse. Prenez ce chapitre au sérieux."
  },
  {
    "titre": "Pourquoi le téléphone, pas l'email ?",
    "contenu": "<div style='background: #f8f9fa; padding: 1.5rem; border-radius: 12px; border-left: 6px solid #2a5298;'><p style='color: #1e3c72; font-weight: bold; margin-top: 0;'>Au Cameroun, le téléphone est plus fiable que l'email :</p><ul style='padding-left: 1.2rem; color: #333; line-height: 1.9;'><li>📱 <strong>90% des adultes</strong> ont un téléphone mobile</li><li>📧 <strong>30% seulement</strong> utilisent l'email régulièrement</li><li>💬 Le téléphone permet les <strong>SMS et WhatsApp</strong>, plus directs</li><li>🔐 Le téléphone est <strong>unique</strong> et plus difficile à usurper qu'un email</li><li>💰 Le mobile money est <strong>lié au téléphone</strong>, pas à l'email</li><li>🎯 Le téléphone permet le <strong>contact commercial direct</strong></li></ul><p style='color: #555; font-size: 0.9rem; margin-top: 1rem;'>💡 Ailleurs dans le monde, l'email reste la norme. Au Cameroun, le téléphone s'impose.</p></div>",
    "texteParle": "La première question à se poser, c'est pourquoi le téléphone et pas l'email. C'est une question très contextuelle. Au Cameroun, et plus largement en Afrique subsaharienne, le téléphone est beaucoup plus fiable que l'email. Les statistiques le montrent : quatre-vingt-dix pour cent des adultes ont un téléphone mobile, contre seulement trente pour cent qui utilisent régulièrement l'email. Le téléphone permet aussi les SMS et WhatsApp, qui sont des moyens de communication beaucoup plus directs et plus utilisés que l'email. Le téléphone est également plus unique et plus difficile à usurper qu'une adresse email, qu'on peut créer en quelques secondes. Et surtout, dans un contexte de mobile money, le compte est souvent lié au téléphone. C'est votre numéro qui identifie votre compte MTN ou Orange Money. Donc utiliser le téléphone comme identifiant principal pour SawaMart a beaucoup de sens. Cela ne veut pas dire que l'email est inutile : on pourra toujours en demander un plus tard, comme information complémentaire. Mais l'identifiant principal, c'est le numéro de téléphone. C'est un choix contextuel intelligent, adapté à la réalité du terrain.",
    "note": "Connaître son contexte, c'est la moitié du travail d'architecture. Le téléphone s'impose au Cameroun."
  },
  {
    "titre": "Le parcours d'inscription",
    "contenu": "<div style='background: #e9ecef; padding: 1rem; border-radius: 12px;'><p style='color: #333;'>L'inscription se fait en 4 étapes :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.72rem; line-height: 1.8; white-space: pre;'>1. Utilisateur saisit son <span style='color: #60a5fa;'>numéro de téléphone</span><br>   POST /auth/send-otp<br><br>2. Un code <span style='color: #fbbf24;'>OTP à 6 chiffres</span> est envoyé par SMS<br>   (Twilio, valable 5 minutes)<br><br>3. Utilisateur saisit le code + son <span style='color: #34d399;'>username</span> + son <span style='color: #34d399;'>mot de passe</span><br>   POST /auth/register<br><br>4. Le compte est créé, un <span style='color: #a78bfa;'>JWT</span> est retourné<br>   → Utilisateur connecté automatiquement</div><p style='color: #555; font-size: 0.9rem; margin-top: 0.8rem;'>💡 L'OTP vérifie que l'utilisateur possède bien le téléphone qu'il prétend avoir.</p></div>",
    "texteParle": "Voyons maintenant le parcours d'inscription, étape par étape. Étape une : l'utilisateur saisit son numéro de téléphone dans l'application mobile. Il fait un premier appel à l'API sur l'endpoint send-otp. Étape deux : le backend génère un code OTP à six chiffres, et l'envoie par SMS via Twilio. Ce code est valable cinq minutes, après quoi il expire. C'est une sécurité importante : si quelqu'un intercepte le SMS cinq minutes plus tard, le code ne fonctionne plus. Étape trois : l'utilisateur reçoit le SMS, lit le code, et le saisit dans l'application. En même temps, il choisit son nom d'utilisateur et son mot de passe. Il envoie tout à l'API sur l'endpoint register. Étape quatre : le backend vérifie l'OTP, valide les données, crée le compte, et retourne un token JWT. L'utilisateur est automatiquement connecté, il n'a pas besoin de ressaisir ses identifiants. C'est un parcours fluide, en quatre étapes, qui assure à la fois la sécurité (l'utilisateur possède le téléphone) et l'ergonomie (pas de saisie redondante). Notez bien que l'OTP est utilisé à deux moments critiques : à l'inscription, et lors de la réinitialisation du mot de passe. Ce sont les deux moments où l'on doit vérifier que l'utilisateur possède effectivement le téléphone.",
    "note": "Le code OTP est la preuve de possession du téléphone. C'est ce qui rend l'inscription sûre."
  },
  {
    "titre": "Les 4 étapes clés de l'auth",
    "contenu": "<div style='background: #f8f9fa; padding: 1.5rem; border-radius: 12px; border-left: 6px solid #2a5298;'><p style='color: #1e3c72; font-weight: bold; margin-top: 0;'>Notre système d'authentification repose sur 4 piliers :</p><div style='display: flex; flex-direction: column; gap: 0.7rem; margin-top: 1rem;'><div style='background: #d1ecf1; padding: 0.9rem; border-radius: 8px; border-left: 4px solid #0c5460;'><strong>1️⃣ Inscription (Register)</strong><br><small style='color: #333;'>Vérifier le téléphone, créer le compte, créer le wallet</small></div><div style='background: #d4edda; padding: 0.9rem; border-radius: 8px; border-left: 4px solid #155724;'><strong>2️⃣ Connexion (Login)</strong><br><small style='color: #333;'>Vérifier le mot de passe, générer un JWT, protéger contre le brute-force</small></div><div style='background: #fff3cd; padding: 0.9rem; border-radius: 8px; border-left: 4px solid #856404;'><strong>3️⃣ Vérification OTP</strong><br><small style='color: #333;'>Envoyer et valider les codes SMS à 6 chiffres</small></div><div style='background: #f8d7da; padding: 0.9rem; border-radius: 8px; border-left: 4px solid #721c24;'><strong>4️⃣ Reset Password</strong><br><small style='color: #333;'>Réinitialiser via OTP sans révéler d'informations</small></div></div></div>",
    "texteParle": "Notre système d'authentification repose sur quatre piliers. Premier pilier : l'inscription. Elle implique de vérifier que le téléphone n'est pas déjà utilisé, de valider le format du numéro, de créer l'utilisateur, de créer son profil, et de créer son wallet. Tout cela dans une transaction pour garantir la cohérence. Deuxième pilier : la connexion. Elle implique de vérifier le mot de passe avec bcrypt, de générer un token JWT, et surtout de protéger contre les attaques par force brute. On ne peut pas laisser un robot essayer des millions de mots de passe. Troisième pilier : la vérification OTP. C'est le mécanisme qui valide les codes SMS. On l'utilise à l'inscription et à la réinitialisation du mot de passe. Il faut gérer l'expiration, le rate limiting, et la sécurité du canal SMS. Quatrième pilier : la réinitialisation du mot de passe. C'est un cas délicat : l'utilisateur a oublié son mot de passe, on doit lui en donner un nouveau, mais sans révéler si son numéro existe ou non (question de confidentialité). Ces quatre piliers forment notre système d'authentification. Ils sont indépendants mais complémentaires. Nous allons les implémenter un par un dans les leçons suivantes.",
    "note": "Ces 4 piliers couvrent tous les besoins d'auth. Assurez-vous que chacun est solide."

  {
    "titre": "Pourquoi JWT ?",
    "contenu": "<div style='background: #f8f9fa; padding: 1rem; border-radius: 12px; border-left: 6px solid #10b981;'><p style='color: #333;'><strong>JWT</strong> (JSON Web Token) est un standard pour l'authentification stateless.</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.68rem; line-height: 1.6; white-space: pre;'><span style='color: #6a9955;'>// Structure d'un JWT</span><br>header.payload.signature<br><br><span style='color: #6a9955;'>// Payload de SawaMart</span><br>{<br>&nbsp;&nbsp;sub: 'uuid-utilisateur',<br>&nbsp;&nbsp;phone: '+237672345678',<br>&nbsp;&nbsp;username: 'john_doe',<br>&nbsp;&nbsp;role: 'user',<br>&nbsp;&nbsp;iat: 1234567890,<br>&nbsp;&nbsp;exp: 1234654290<br>}</div><p style='color: #333; margin-top: 0.8rem;'><strong>Les avantages :</strong></p><ul style='padding-left: 1.2rem; color: #333; line-height: 1.7;'><li>✅ <strong>Stateless</strong> : pas de session côté serveur</li><li>✅ <strong>Compatible mobile</strong> : idéal pour React Native</li><li>✅ <strong>Auto-porteur</strong> : contient déjà les infos de l'utilisateur</li><li>✅ <strong>Standard</strong> : bibliothèques dans tous les langages</li></ul></div>",
    "texteParle": "Parlons de JWT, JSON Web Token. C'est le standard d'authentification pour les API modernes. Un JWT est une chaîne de caractères composée de trois parties : un header qui décrit l'algorithme, un payload qui contient les données, et une signature qui garantit l'intégrité. Les trois sont séparés par des points. Le payload de SawaMart contient cinq informations : sub, qui est l'identifiant de l'utilisateur. phone, son numéro de téléphone. username, son nom d'utilisateur. role, son rôle (USER, ASSISTANT, ACCOUNTANT, ADMIN). Et les dates d'émission et d'expiration. C'est très utile : on n'a pas besoin d'aller en base à chaque requête pour savoir qui est l'utilisateur et quel est son rôle. Le token contient déjà l'information. Les avantages de JWT sont nombreux. C'est stateless : le serveur ne stocke pas la session. Il n'a pas besoin de maintenir une liste des sessions actives. C'est compatible avec les applications mobiles : le token est stocké côté client et envoyé dans chaque requête. Il est auto-porteur : toutes les informations nécessaires pour identifier et autoriser l'utilisateur sont dans le token. Enfin, c'est un standard : il existe des bibliothèques JWT dans tous les langages de programmation. Bref, JWT est le choix évident pour une API mobile comme SawaMart.",
    "note": "JWT n'est pas magique : si le secret est compromis, tout est compromis. Protégez JWT_SECRET comme votre vie."
  },
  {
    "titre": "Le contenu du JWT",
    "contenu": "<div style='background: #e9ecef; padding: 1rem; border-radius: 12px;'><p style='color: #333;'>Voici le payload que nous allons utiliser :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.72rem; line-height: 1.7; white-space: pre;'>{<br>&nbsp;&nbsp;sub: user.id,&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span style='color: #6a9955;'>// subject = identifiant</span><br>&nbsp;&nbsp;phone: user.phone_number,<br>&nbsp;&nbsp;username: user.username,<br>&nbsp;&nbsp;role: user.role,&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span style='color: #6a9955;'>// critique pour les permissions</span><br>&nbsp;&nbsp;iat: ...,&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span style='color: #6a9955;'>// issued at (auto)</span><br>&nbsp;&nbsp;exp: ...&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span style='color: #6a9955;'>// expiration (auto)</span><br>}</div><p style='color: #333; margin-top: 0.8rem;'><strong>Rôle de chaque champ :</strong></p><ul style='padding-left: 1.2rem; color: #333; line-height: 1.7;'><li><code>sub</code> : identifiant pour recharger l'utilisateur</li><li><code>role</code> : utilisé par RolesGuard pour l'autorisation</li><li><code>exp</code> : force la reconnexion périodique</li></ul><div style='background: #fff3cd; border-left: 4px solid #856404; padding: 0.8rem; border-radius: 4px; margin-top: 1rem;'><strong>⚠️ Ne mettez JAMAIS</strong> de données sensibles (mot de passe, carte bancaire) dans un JWT. Le payload est <strong>lisible</strong> par n'importe qui (il est juste encodé, pas chiffré).</div></div>",
    "texteParle": "Regardons le payload de notre JWT en détail. On y met cinq informations. sub : c'est l'identifiant de l'utilisateur. C'est le champ standard pour dire de qui il s'agit. C'est lui qu'on utilisera pour recharger l'utilisateur depuis la base à chaque requête. phone : le téléphone. Utile pour l'affichage. username : le nom d'utilisateur. Aussi pour l'affichage. role : c'est le champ critique pour les permissions. Quand un utilisateur fait une requête, on regarde son role dans le token pour savoir s'il a le droit d'accéder à la ressource. C'est comme ça qu'on protège les endpoints admin. iat : issued at, la date d'émission. Ajouté automatiquement par la bibliothèque JWT. exp : expiration. Ajouté automatiquement aussi, selon la durée configurée. Un mot important de mise en garde : ne mettez JAMAIS de données sensibles dans un JWT. Le payload est lisible par n'importe qui. Il est encodé en base64, ce qui est facilement décodable. Mais il n'est pas chiffré. N'importe qui peut lire le contenu d'un JWT. La signature garantit seulement qu'on ne peut pas le modifier sans le secret. Donc pas de mot de passe, pas de numéro de carte bancaire, pas de secret dans le payload. Seulement des informations publiques ou peu sensibles.",
    "note": "JWT = encodé, pas chiffré. Ne mettez rien de confidentiel dans le payload."
  },
  {
    "titre": "Le mécanisme anti-brute-force",
    "contenu": "<div style='background: #f8f9fa; padding: 1.5rem; border-radius: 12px; border-left: 6px solid #dc3545;'><p style='color: #333;'>Un robot peut essayer des milliers de mots de passe par seconde. Comment l'arrêter ?</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.72rem; line-height: 1.7; white-space: pre;'>1. Tentative 1 échouée → compteur = 1<br>2. Tentative 2 échouée → compteur = 2<br>3. Tentative 3 échouée → compteur = 3<br>4. Tentative 4 échouée → compteur = 4<br>5. Tentative 5 échouée → <span style='color: #f87171;'>compte bloqué</span><br><br>→ <span style='color: #f87171;'>is_login_blocked = true</span><br>→ <span style='color: #f87171;'>login_blocked_until = now + 24h</span></div><p style='color: #333; margin-top: 0.8rem;'><strong>Différence avec is_blocked :</strong></p><ul style='padding-left: 1.2rem; color: #333; line-height: 1.7;'><li><code>is_blocked</code> : blocage définitif par un admin (à la main)</li><li><code>is_login_blocked</code> : blocage temporaire automatique (24h)</li></ul></div>",
    "texteParle": "Un point critique de l'authentification, c'est la protection contre le brute-force. Un robot peut essayer des milliers de mots de passe par seconde. Sans protection, il finira par trouver le bon, surtout si l'utilisateur a un mot de passe faible. Notre mécanisme est simple mais efficace. À chaque tentative échouée, on incrémente un compteur. Après cinq échecs consécutifs, on bloque temporairement le compte : le drapeau is_login_blocked passe à true, et la date login_blocked_until est fixée à maintenant plus vingt-quatre heures. Pendant ces vingt-quatre heures, toute tentative de connexion sera refusée avec un message clair indiquant le temps restant. Après expiration, le compteur se réinitialise automatiquement. Un point important : distinguer is_blocked de is_login_blocked. is_blocked est un blocage définitif, décidé par un admin, souvent pour cause de comportement frauduleux. is_login_blocked est un blocage temporaire, automatique, uniquement pour protéger contre le brute-force. Les deux ont des règles et des durées différentes. Les deux apparaissent dans l'entité User, mais ce sont deux mécanismes distincts. Il ne faut pas les confondre dans le code.",
    "note": "Un compte bloqué automatiquement pour 24h n'est pas un compte banni. Les deux sont différents."
  },
  {
    "titre": "Différence entre Authentification et Autorisation",
    "contenu": "<div style='background: #e9ecef; padding: 1.5rem; border-radius: 12px;'><p style='color: #333;'>Ces deux concepts sont souvent confondus :</p><div style='display: flex; flex-direction: column; gap: 0.8rem; margin-top: 1rem;'><div style='background: #d1ecf1; padding: 0.9rem; border-radius: 8px; border-left: 4px solid #0c5460;'><strong>🔐 Authentification</strong><br><small style='color: #333;'>\"Qui es-tu ?\"</small><br><small style='color: #555;'>Vérifier l'identité (JWT valide + mot de passe)</small></div><div style='background: #fff3cd; padding: 0.9rem; border-radius: 8px; border-left: 4px solid #856404;'><strong>🛡️ Autorisation</strong><br><small style='color: #333;'>\"Qu'as-tu le droit de faire ?\"</small><br><small style='color: #555;'>Vérifier les permissions (rôle, propriétaire)</small></div></div><p style='color: #333; margin-top: 1rem;'><strong>Exemple concret :</strong></p><div style='background: #f8f9fa; padding: 0.8rem; border-radius: 8px; font-size: 0.9rem; color: #333; line-height: 1.7;'>Un utilisateur authentifié (avec un JWT valide) demande à voir la liste des utilisateurs. <br><br>→ L'<strong>authentification</strong> dit : \"OK, tu es bien l'utilisateur X.\" <br>→ L'<strong>autorisation</strong> dit : \"Mais tu es USER, tu n'as pas le droit de voir tous les users. Seul ADMIN peut.\"</div></div>",
    "texteParle": "Prenons un moment pour clarifier une distinction importante : authentification versus autorisation. Ces deux concepts sont souvent confondus, mais ils sont bien différents. L'authentification, c'est vérifier l'identité. La question est : 'Qui es-tu ?'. On vérifie que le token JWT est valide et que l'utilisateur est bien celui qu'il prétend être. L'autorisation, c'est vérifier les permissions. La question est : 'Qu'as-tu le droit de faire ?'. On vérifie que l'utilisateur a le bon rôle ou la bonne propriété pour accéder à la ressource. Prenons un exemple concret. Un utilisateur s'est connecté, il a un JWT valide. Il fait une requête pour voir la liste de tous les utilisateurs. L'authentification va dire : 'OK, tu es bien l'utilisateur X, ton token est valide'. Mais l'autorisation va dire : 'Attends, tu es USER, tu n'as pas le droit de voir tous les utilisateurs. Seul ADMIN peut faire ça'. Résultat : la requête est refusée avec une erreur 403 Forbidden. C'est cette distinction qui structure nos guards. Le JwtAuthGuard fait l'authentification. Le RolesGuard fait l'autorisation. Les deux sont complémentaires. Nous les utiliserons ensemble sur les endpoints sensibles.",
    "note": "401 Unauthorized = authentification échouée. 403 Forbidden = autorisation refusée."
  },

    let isLoading = false;

    // Références jQuery
    const $title = $('#slideTitle');
    const $body = $('#slideBody');
    const $counter = $('#slideCounter');
    const $statusText = $('#statusText');
    const $statusBadge = $('#statusBadge');
    const $loading = $('#loadingOverlay');
    const $loadingText = $('#loadingText');

    const $play = $('#playBtn');
    const $cancelLoading = $('#cancelLoadingBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function setStatus(text, type) {
        $statusText.text(text);
        $statusBadge.removeClass('idle speaking error paused waiting loading');
        if (type === 'speaking') $statusBadge.addClass('speaking');
        else if (type === 'error') $statusBadge.addClass('error');
        else if (type === 'paused') $statusBadge.addClass('paused');
        else if (type === 'waiting') $statusBadge.addClass('waiting');
        else if (type === 'loading') $statusBadge.addClass('loading');
        else $statusBadge.addClass('idle');
    }

    function updatePlayButton() {
        if (isPlaying) {
            $play.addClass('playing');
            $play.find('.btn-icon').text('⏸');
            $play.find('.btn-label').text('Pause');
        } else {
            $play.removeClass('playing');
            $play.find('.btn-icon').text('▶');
            $play.find('.btn-label').text('Play');
        }
    }

    function showLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        
        loadingCancelled = false;
        isLoading = true;
        
        // Réinitialiser la barre de progression
        $loadingProgressBar.css('animation', 'none');
        $loadingProgressBar.css('width', '0%');
        // Forcer un reflow
        $loadingProgressBar[0].offsetHeight;
        $loadingProgressBar.css('animation', 'loadingProgress 30s ease-out forwards');
        
        $loadingText.text('Préparation vocale...');
        $loadingSub.text('Synthèse en cours');
        $loadingTimeout.text('⏱️ 30 secondes maximum');
        $loading.fadeIn(300);
        setStatus("⏳ Chargement...", 'loading');
        
        // 🔥 TIMEOUT DE 30 SECONDES
        loadingTimeout = setTimeout(() => {
            if (isLoading && !loadingCancelled) {
                hideLoading();
                setStatus("⚠️ Délai dépassé (30s)", 'error');
                isPlaying = false;
                updatePlayButton();
                $loadingSub.text('La synthèse vocale a pris trop de temps');
                $loadingTimeout.text('❌ Délai dépassé');
            }
        }, 30000);
    }

    function hideLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        isLoading = false;
        loadingCancelled = false;
        $loading.fadeOut(300);
        // Ne pas changer le statut si on est en train de parler
        if (!isSpeaking && !isPlaying) {
            setStatus("⏸ Lecture arrêtée", 'paused');
        }
    }

    function cancelLoading() {
        loadingCancelled = true;
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        hideLoading();
        stopSpeaking();
        setStatus("⏸ Annulé", 'paused');
        isPlaying = false;
        updatePlayButton();
        $loadingText.text('Annulé par l\'utilisateur');
        $loadingSub.text('Vous pouvez réessayer');
        $loadingTimeout.text('✕ Annulation');
    }

    // Arrêter la parole proprement
    function stopSpeaking() {
        try {
            if (synth && (synth.speaking || synth.pending)) {
                synth.cancel();
            }
        } catch(e) {
            console.warn('Erreur stopSpeaking:', e);
        }
        if (currentUtterance) {
            try {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance.onstart = null;
            } catch(e) {}
            currentUtterance = null;
        }
        isSpeaking = false;
        isPlaying = false;
        updatePlayButton();
    }

    // Mettre en pause la parole
    function pauseSpeaking() {
        try {
            if (synth && synth.speaking) {
                synth.pause();
                isPaused = true;
                isPlaying = false;
                setStatus("⏸ Lecture en pause", 'paused');
                updatePlayButton();
            }
        } catch(e) {
            console.warn('Erreur pauseSpeaking:', e);
            stopSpeaking();
        }
    }

    // Reprendre la parole
    function resumeSpeaking() {
        try {
            if (synth && synth.paused) {
                synth.resume();
                isPaused = false;
                isPlaying = true;
                setStatus("🔊 Lecture en cours", 'speaking');
                updatePlayButton();
            } else if (!isSpeaking && !synth.speaking && !synth.pending) {
                speakSlide(currentIndex);
            }
        } catch(e) {
            console.warn('Erreur resumeSpeaking:', e);
            speakSlide(currentIndex);
        }
    }

    function renderSlide(index) {
        const slide = slides[index];
        $title.text(slide.titre);

        let html = '';
        html += `<div class="content-card">${slide.contenu}</div>`;
        if (slide.note) {
            html += `<div class="note-box">${slide.note}</div>`;
        }
        $body.html(html);
        $counter.text(`${index+1} / ${total}`);

        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
        }
    }

    // ================================================================
    // LECTURE VOCALE
    // ================================================================
    function speakSlide(index) {
        return new Promise((resolve) => {
            const slide = slides[index];
            const text = slide.texteParle;
            
            if (!text || text.trim() === '' || !speechSupported) {
                resolve();
                return;
            }

            if (!window.speechSynthesis) {
                setStatus("❌ Synthèse vocale non supportée", 'error');
                speechSupported = false;
                resolve();
                return;
            }

            // Arrêter toute lecture en cours
            stopSpeaking();
            
            // Réinitialiser l'état de pause
            isPaused = false;
            
            showLoading();
            setStatus("Initialisation...", 'loading');

            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.92;
                utterance.pitch = 1.05;
                utterance.volume = 1;

                let isFinished = false;
                let errorHandled = false;

                utterance.onstart = function() {
                    if (loadingCancelled) {
                        stopSpeaking();
                        resolve();
                        return;
                    }
                    hideLoading();
                    isSpeaking = true;
                    isPlaying = true;
                    isPaused = false;
                    setStatus("🔊 Lecture en cours", 'speaking');
                    updatePlayButton();
                };

                utterance.onend = function() {
                    if (isFinished) return;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    setStatus("✅ Terminé", 'idle');
                    hideLoading();
                    updatePlayButton();
                    resolve();
                };

                utterance.onerror = function(e) {
                    if (isFinished || errorHandled) return;
                    errorHandled = true;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    hideLoading();
                    updatePlayButton();
                    
                    if (e.error === 'not-allowed') {
                        setStatus("⚠️ Permission refusée", 'error');
                    } else if (e.error === 'synthesis-unavailable') {
                        setStatus("⚠️ Synthèse indisponible", 'error');
                    } else if (e.error === 'canceled') {
                        setStatus("⏸ Annulé", 'paused');
                    } else {
                        setStatus("❌ Erreur audio: " + (e.error || 'inconnue'), 'error');
                    }
                    
                    resolve();
                };

                // Gestion du chargement des voix
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = function() {
                        if (!loadingCancelled) {
                            try {
                                synth.speak(utterance);
                            } catch(err) {
                                // Silencieux
                            }
                        }
                        synth.onvoiceschanged = null;
                    };
                }

                currentUtterance = utterance;
                
                if (!loadingCancelled) {
                    try {
                        synth.speak(utterance);
                    } catch(err) {
                        setTimeout(() => {
                            if (!loadingCancelled) {
                                try {
                                    synth.speak(utterance);
                                } catch(e) {
                                    setStatus("❌ Erreur de lecture", 'error');
                                    isPlaying = false;
                                    updatePlayButton();
                                    hideLoading();
                                    resolve();
                                }
                            } else {
                                resolve();
                            }
                        }, 100);
                    }
                } else {
                    resolve();
                }

            } catch(err) {
                hideLoading();
                setStatus("❌ Erreur générale", 'error');
                isPlaying = false;
                updatePlayButton();
                console.error('Erreur speakSlide:', err);
                resolve();
            }
        });
    }

    // ================================================================
    // NAVIGATION
    // ================================================================
    async function goToSlide(index) {
        if (isTransitioning) return;
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        
        // Si on est en train de lire, on met en pause avant de naviguer
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        // Arrêter complètement la lecture
        stopSpeaking();
        
        await new Promise(r => setTimeout(r, 50));
        
        if (index === currentIndex) {
            setStatus("📄 Slide actuel", 'idle');
            return;
        }

        isTransitioning = true;
        currentIndex = index;
        renderSlide(index);
        
        // Réinitialiser l'état de lecture
        isPlaying = false;
        updatePlayButton();
        setStatus("⏸ Lecture arrêtée", 'paused');

        await new Promise(r => setTimeout(r, 150));
        isTransitioning = false;
    }

    async function goToNext() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex + 1 < total) {
            await goToSlide(currentIndex + 1);
        } else {
            setStatus("🏁 Dernier slide", 'idle');
        }
    }

    async function goToPrev() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex - 1 >= 0) {
            await goToSlide(currentIndex - 1);
        } else {
            setStatus("🔁 Premier slide", 'idle');
        }
    }

    // ================================================================
    // GESTION PLAY/PAUSE
    // ================================================================
    function togglePlay() {
        if (!userInteracted) {
            userInteracted = true;
        }

        // Si le chargement est en cours, on l'annule
        if (isLoading) {
            cancelLoading();
            return;
        }

        // Si le synthétiseur est en pause, on reprend
        if (synth && synth.paused) {
            resumeSpeaking();
            return;
        }

        // Si la lecture est en cours, on met en pause
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
            return;
        }

        // Sinon, on démarre la lecture du slide courant
        if (!isSpeaking && !isPlaying) {
            stopSpeaking();
            speakSlide(currentIndex);
        }
    }

    // ================================================================
    // INIT
    // ================================================================
    async function init() {
        // Vérifier la compatibilité
        if (!window.speechSynthesis) {
            setStatus("❌ Synthèse vocale non supportée", 'error');
            speechSupported = false;
        }

        // Précharger les voix
        try {
            if (synth.getVoices) {
                synth.getVoices();
                setTimeout(() => {
                    try {
                        synth.getVoices();
                    } catch(e) {}
                }, 200);
            }
        } catch(e) {
            console.warn('Erreur chargement voix:', e);
        }

        // Afficher le premier slide
        renderSlide(0);
        $counter.text(`1 / ${total}`);
        
        // État initial
        setStatus("⏸ Appuie sur Play", 'paused');
        updatePlayButton();
        $autoIndicator.text('⏸ Lecture manuelle');

        // ================================================================
        // ÉVÉNEMENTS
        // ================================================================
        
        // Bouton Play/Pause
        $play.on('click', function() {
            togglePlay();
        });

        // Bouton Annuler le chargement
        $cancelLoading.on('click', function() {
            cancelLoading();
        });

        // Navigation
        $prev.on('click', function() {
            // Si chargement en cours, on annule
            if (isLoading) cancelLoading();
            goToPrev();
        });

        $next.on('click', function() {
            if (isLoading) cancelLoading();
            goToNext();
        });

        // Replay - relire le slide courant
        $replay.on('click', function() {
            if (isLoading) cancelLoading();
            stopSpeaking();
            setTimeout(() => {
                speakSlide(currentIndex);
            }, 100);
        });

        // Support du clavier (espace pour play/pause)
        $(document).on('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });

        // Nettoyage
        $(window).on('beforeunload', function() {
            try {
                if (synth.speaking) synth.cancel();
            } catch(e) {}
            hideLoading();
        });

        // Gérer les cas où la synthèse se termine de manière inattendue
        setInterval(() => {
            if (isPlaying && !synth.speaking && !synth.pending && !isPaused && !isLoading) {
                isPlaying = false;
                updatePlayButton();
                setStatus("⏸ Lecture arrêtée", 'paused');
            }
        }, 1000);
    }

    init();
});



    // ================================================================
    // GESTION DU THÈME JOUR/NUIT
    // ================================================================
    let isDarkMode = false;

    function toggleTheme() {
        isDarkMode = !isDarkMode;
        const body = document.body;
        const appContainer = document.querySelector('.app-container');
        const header = document.querySelector('.slide-header');
        const footer = document.querySelector('.slide-footer');
        const contentCards = document.querySelectorAll('.content-card');
        const noteBoxes = document.querySelectorAll('.note-box');
        const mathBlocks = document.querySelectorAll('.math-block');
        const buttons = document.querySelectorAll('.btn');
        const statusBadge = document.querySelector('.status-badge');
        const slideCounter = document.querySelector('.slide-counter');
        const autoIndicator = document.querySelector('.auto-indicator');
        const themeBtn = document.getElementById('themeToggle');

        if (isDarkMode) {
            // Mode nuit
            body.style.background = '#0b1120';
            body.style.color = '#f1f5f9';
            appContainer.style.background = 'linear-gradient(145deg, #0f172a 0%, #1e293b 100%)';
            header.style.background = 'rgba(15, 23, 42, 0.85)';
            footer.style.background = 'rgba(15, 23, 42, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.05)';
                card.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.08)';
                note.style.color = '#cbd5e1';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.25)';
                block.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#e2e8f0';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.12)';
                statusBadge.style.color = '#93bbfc';
            }
            if (slideCounter) {
                slideCounter.style.color = '#94a3b8';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#64748b';
            }
            if (themeBtn) {
                themeBtn.textContent = '☀️';
                themeBtn.title = 'Passer en mode jour';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#e2e8f0';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#e2e8f0';
                }
            });
        } else {
            // Mode jour (par défaut)
            body.style.background = '#f0f4f8';
            body.style.color = '#1a202c';
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
            header.style.background = 'rgba(255, 255, 255, 0.85)';
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.8)';
                card.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.12)';
                note.style.color = '#2c3e50';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.05)';
                block.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#2d3748';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
                statusBadge.style.color = '#2b6cb0';
            }
            if (slideCounter) {
                slideCounter.style.color = '#4a5568';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#718096';
            }
            if (themeBtn) {
                themeBtn.textContent = '🌓';
                themeBtn.title = 'Passer en mode nuit';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#2c3e50';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#2d3748';
                }
            });
        }
    }

    // Initialiser en mode jour
    document.addEventListener('DOMContentLoaded', function() {
        // Appliquer le mode jour par défaut
        const body = document.body;
        body.style.background = '#f0f4f8';
        body.style.color = '#1a202c';
        
        const appContainer = document.querySelector('.app-container');
        if (appContainer) {
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
        }
        
        const header = document.querySelector('.slide-header');
        if (header) {
            header.style.background = 'rgba(255, 255, 255, 0.85)';
        }
        
        const footer = document.querySelector('.slide-footer');
        if (footer) {
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
        }
        
        document.querySelectorAll('.content-card').forEach(card => {
            card.style.background = 'rgba(255,255,255,0.8)';
            card.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.note-box').forEach(note => {
            note.style.background = 'rgba(96, 165, 250, 0.12)';
            note.style.color = '#2c3e50';
        });
        
        document.querySelectorAll('.math-block').forEach(block => {
            block.style.background = 'rgba(0,0,0,0.05)';
            block.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.btn').forEach(btn => {
            btn.style.color = '#2d3748';
        });
        
        const statusBadge = document.querySelector('.status-badge');
        if (statusBadge) {
            statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
            statusBadge.style.color = '#2b6cb0';
        }
        
        const slideCounter = document.querySelector('.slide-counter');
        if (slideCounter) {
            slideCounter.style.color = '#4a5568';
        }
        
        const autoIndicator = document.querySelector('.auto-indicator');
        if (autoIndicator) {
            autoIndicator.style.color = '#718096';
        }
        
        document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
            if (!el.closest('.note-box')) {
                el.style.color = '#2c3e50';
            }
        });
        
        document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
            if (!el.closest('.note-box') && !el.closest('.math-block')) {
                el.style.color = '#2d3748';
            }
        });
        
        const themeBtn = document.getElementById('themeToggle');
        if (themeBtn) {
            themeBtn.textContent = '🌓';
            themeBtn.title = 'Passer en mode nuit';
        }
    });
</script>
