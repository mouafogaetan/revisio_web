<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Présentation mobile</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' },
            options: { skipHtmlTypes: 'script' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 500px;
        margin: 0 auto;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    .slide-header {
        flex-shrink: 0;
        padding: 18px 16px 10px 16px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        z-index: 10;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .slide-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
    }

    .content-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 18px 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        flex-shrink: 0;
    }

    .content-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .content-card li {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        line-height: 1.5;
    }

    .content-card li:last-child {
        border-bottom: none;
    }

    .bullet-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
    }

    .math-block {
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        overflow-x: auto;
        flex-shrink: 0;
        margin: 4px 0;
    }

    .math-block .math {
        font-size: 1.2rem;
        color: #e2e8f0;
    }

    .note-box {
        background: rgba(96, 165, 250, 0.08);
        border-left: 4px solid #60a5fa;
        padding: 12px 16px;
        border-radius: 12px;
        font-style: italic;
        font-size: 0.9rem;
        color: #cbd5e1;
        flex-shrink: 0;
    }

    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        border-radius: 0;
        flex-direction: column;
    }

    .loading-card {
        background: #1e293b;
        padding: 32px 28px;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #334155;
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px auto;
    }

    .loading-text {
        font-weight: 600;
        font-size: 1.1rem;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    .loading-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 16px;
    }
    .loading-progress {
        height: 3px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        animation: loadingProgress 30s ease-out forwards;
    }

    .loading-timeout {
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 12px;
    }

    .btn-cancel-loading {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 40px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #f87171;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }

    .btn-cancel-loading:active {
        transform: scale(0.94);
        background: rgba(239, 68, 68, 0.25);
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
    }

    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .slide-counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255,255,255,0.05);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(255,255,255,0.04);
    }

    .status-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 30px;
        background: rgba(96, 165, 250, 0.12);
        color: #93bbfc;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
    }

    .status-badge .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: pulse-dot 1.2s infinite;
        flex-shrink: 0;
    }

    .status-badge.idle .dot {
        animation: none;
        background: #64748b;
    }
    .status-badge.speaking .dot {
        background: #34d399;
        animation: pulse-dot 0.8s infinite;
    }
    .status-badge.error .dot {
        background: #f87171;
        animation: none;
    }
    .status-badge.paused .dot {
        animation: none;
        background: #fbbf24;
    }
    .status-badge.waiting .dot {
        animation: pulse-dot 1.5s infinite;
        background: #fbbf24;
    }
    .status-badge.loading .dot {
        animation: pulse-dot 0.5s infinite;
        background: #60a5fa;
    }

    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.7); }
    }

    .footer-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(255,255,255,0.1);
    }

    .btn-secondary {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-play {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
        min-width: 80px;
        justify-content: center;
    }
    .btn-play:active {
        background: rgba(52, 211, 153, 0.25);
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
    }

    .auto-indicator {
        font-size: 0.65rem;
        color: #64748b;
        text-align: center;
        letter-spacing: 0.3px;
        padding: 2px 0;
    }

    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.2rem;
        }
        .content-card li {
            font-size: 0.9rem;
            padding: 8px 0;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .btn-play {
            min-width: 60px;
        }
        .footer-buttons {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
        .loading-card {
            padding: 20px 16px;
        }
        .math-block .math {
            font-size: 1rem;
        }
    }

    @media (min-width: 600px) {
        .app-container {
            max-width: 480px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
        .loading-overlay {
            border-radius: 32px;
        }
    }

    /* Mode jour (par défaut) */
    html, body {
        background: #f0f4f8 !important;
        color: #1a202c !important;
    }
    .app-container {
        background: linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%) !important;
    }
    .slide-header {
        background: rgba(255, 255, 255, 0.85) !important;
        border-bottom: 1px solid rgba(0,0,0,0.08) !important;
    }
    .slide-header h1 {
        background: linear-gradient(135deg, #2b6cb0, #6b46c1) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        background-clip: text !important;
    }
    .slide-footer {
        background: rgba(255, 255, 255, 0.9) !important;
        border-top: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card {
        background: rgba(255,255,255,0.8) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card li {
        border-bottom: 1px solid rgba(0,0,0,0.05) !important;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.12) !important;
        border-left: 4px solid #4299e1 !important;
        color: #2c3e50 !important;
    }
    .math-block {
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .math-block .math {
        color: #2d3748 !important;
    }
    .slide-counter {
        color: #4a5568 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .status-badge {
        background: rgba(96, 165, 250, 0.15) !important;
        color: #2b6cb0 !important;
        border: 1px solid rgba(96, 165, 250, 0.15) !important;
    }
    .btn {
        color: #2d3748 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .btn-secondary {
        background: rgba(0,0,0,0.04) !important;
        border-color: rgba(0,0,0,0.08) !important;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15) !important;
        border-color: rgba(52, 211, 153, 0.2) !important;
        color: #38a169 !important;
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15) !important;
        border-color: rgba(251, 191, 36, 0.2) !important;
        color: #d69e2e !important;
    }
    .auto-indicator {
        color: #718096 !important;
    }
    .loading-card {
        background: #ffffff !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .loading-text {
        color: #1a202c !important;
    }
    .loading-sub {
        color: #4a5568 !important;
    }
</style>
</head>
<body>

<div class="app-container">

    <header class="slide-header">
        <h1 id="slideTitle">Chargement...</h1>
    </header>

    <main class="slide-body" id="slideBody"></main>

    <!-- LOADING OVERLAY AVEC BOUTON ANNULER -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Préparation vocale...</div>
            <div class="loading-sub" id="loadingSub">Synthèse en cours</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loadingProgressBar"></div>
            </div>
            <div class="loading-timeout" id="loadingTimeout">⏱️ 30 secondes maximum</div>
            <button class="btn-cancel-loading" id="cancelLoadingBtn">
                <span>✕</span> Annuler
            </button>
        </div>
    </div>

    <footer class="slide-footer">
        <div class="footer-top">
            <span class="slide-counter" id="slideCounter">1 / 3</span>
            <span class="status-badge idle" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">Prêt</span>
            </span>
        </div>

        <div class="footer-buttons">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-secondary" id="replayBtn">
                <span class="btn-icon">🔁</span> <span class="btn-label">Relire</span>
            </button>
            <button class="btn btn-play" id="playBtn">
                <span class="btn-icon">▶</span> <span class="btn-label">Play</span>
            </button>
        </div>

        <div class="auto-indicator" id="autoIndicator">⏸ Lecture manuelle</div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // SLIDES
    // ================================================================
    const slides = [
  {
    "titre": "Reset password par OTP",
    "contenu": "<div style='background: linear-gradient(135deg, #1e3c72, #2a5298); color: white; padding: 2rem; border-radius: 15px; text-align: center; margin-bottom: 1.5rem;'><h2 style='color: #fff; margin-bottom: 0.5rem;'>🔓 Réinitialisation de mot de passe</h2><p style='color: #e0e0e0; font-size: 1.1rem;'>Quand l'utilisateur a oublié son mot de passe</p><hr style='border-color: #4a7db0; width: 50%;'><p style='color: #f0f0f0;'>Leçon 3.8 : Reset password sécurisé via OTP SMS</p></div><p>Que se passe-t-il quand un utilisateur <strong>oublie son mot de passe</strong> ? Il ne peut plus se connecter. Sans mécanisme de récupération, il perd son compte à jamais. Nous allons donc implémenter la <strong>réinitialisation par OTP</strong> : l'utilisateur reçoit un code par SMS, le saisit avec un nouveau mot de passe, et retrouve l'accès à son compte. C'est un processus critique qui doit être <strong>sécurisé</strong> et <strong>simple</strong>.</p>",
    "texteParle": "Bonjour à toutes et à tous et bienvenue dans cette huitième leçon du chapitre trois. Aujourd'hui, nous allons parler de la réinitialisation du mot de passe. C'est une fonctionnalité essentielle : tout le monde oublie son mot de passe un jour. Sans mécanisme de récupération, l'utilisateur perd définitivement son compte. Il doit en créer un nouveau, perdre son historique, ses produits, ses avis. C'est une mauvaise expérience utilisateur. Nous allons donc implémenter la réinitialisation par OTP. Le principe est simple : l'utilisateur reçoit un code à six chiffres par SMS, il saisit ce code avec un nouveau mot de passe, et il retrouve l'accès à son compte. C'est un processus critique, car il donne accès à un compte existant. Il doit donc être sécurisé. Nous allons voir comment le construire correctement, avec les bonnes protections. C'est parti.",
    "note": "Le reset password est aussi sensible que le login. Il donne accès à un compte existant. Traitez-le avec sérieux."
  },
  {
    "titre": "Le problème des mots de passe oubliés",
    "contenu": "<div style='background: #f8f9fa; padding: 1.5rem; border-radius: 12px; border-left: 6px solid #2a5298;'><p style='color: #1e3c72; font-weight: bold; margin-top: 0;'>Statistiques :</p><ul style='padding-left: 1.2rem; color: #333; line-height: 1.9;'><li>📊 <strong>30 à 50%</strong> des utilisateurs oublient leur mot de passe au moins une fois par an</li><li>📞 <strong>Sans reset</strong> : ils contactent le support (coût élevé) ou abandonnent</li><li>💀 <strong>Sans reset</strong> : perte d'utilisateurs, perte de revenus</li></ul><p style='color: #333; margin-top: 1rem;'><strong>Avec reset par OTP :</strong></p><ul style='padding-left: 1.2rem; color: #333; line-height: 1.8;'><li>✅ L'utilisateur récupère son compte en 2 minutes</li><li>✅ Aucun contact avec le support</li><li>✅ Le support se concentre sur les cas complexes</li><li>✅ Sécurité maintenue (le téléphone est vérifié)</li></ul></div>",
    "texteParle": "Le problème des mots de passe oubliés est bien réel. Les statistiques montrent que trente à cinquante pour cent des utilisateurs oublient leur mot de passe au moins une fois par an. C'est énorme. Sans mécanisme de réinitialisation, ces utilisateurs ont deux options : contacter le support, ce qui coûte cher en temps et en argent. Ou abandonner, ce qui signifie perdre un client. Avec un système de reset par OTP, la situation change complètement. L'utilisateur peut récupérer son compte en deux minutes, sans contacter personne. Il reçoit un code par SMS, saisit un nouveau mot de passe, et c'est terminé. Le support se concentre sur les cas complexes : utilisateurs bloqués, comptes frauduleux, problèmes de paiement. Et surtout, la sécurité est maintenue : le code n'est envoyé qu'au numéro de téléphone enregistré. Si un attaquant ne possède pas le téléphone, il ne peut pas réinitialiser le mot de passe. C'est une solution simple, efficace, et sécurisée. SawaMart en a absolument besoin.",
    "note": "30-50% des utilisateurs oublient leur mot de passe. Un reset mal fait = perte de clients."
  },
  {
    "titre": "Les 2 endpoints",
    "contenu": "<div style='background: #e9ecef; padding: 1.5rem; border-radius: 12px;'><p style='color: #333;'>Le reset password se fait en deux étapes :</p><div style='display: flex; flex-direction: column; gap: 0.8rem; margin-top: 1rem;'><div style='background: #d1ecf1; padding: 1rem; border-radius: 8px; border-left: 4px solid #0c5460;'><strong>1️⃣ POST /auth/send-reset-otp</strong><br><small style='color: #333;'>Entrée : <code>{ phone_number }</code></small><br><small style='color: #333;'>Action : envoie un OTP par SMS</small><br><small style='color: #555;'>⚠️ Vérifie que le compte existe</small></div><div style='background: #d4edda; padding: 1rem; border-radius: 8px; border-left: 4px solid #155724;'><strong>2️⃣ POST /auth/reset-password</strong><br><small style='color: #333;'>Entrée : <code>{ phone_number, otp, new_password }</code></small><br><small style='color: #333;'>Action : vérifie l'OTP et change le mot de passe</small><br><small style='color: #555;'>⚠️ Vérifie la robustesse du nouveau mot de passe</small></div></div><p style='color: #555; font-size: 0.9rem; margin-top: 1rem;'>💡 Séparer en 2 étapes permet à l'utilisateur de vérifier qu'il a bien reçu le SMS avant de saisir un nouveau mot de passe.</p></div>",
    "texteParle": "Le reset password se fait en deux étapes, avec deux endpoints séparés. Étape une : POST sur send-reset-otp. L'utilisateur envoie son numéro de téléphone. Le backend vérifie que ce numéro correspond bien à un compte existant. Si oui, il génère un OTP et l'envoie par SMS. Si non, il retourne... et là, il y a un choix important à faire. Étape deux : POST sur reset-password. L'utilisateur envoie son numéro, le code OTP qu'il a reçu, et son nouveau mot de passe. Le backend vérifie l'OTP, vérifie la robustesse du mot de passe, et met à jour le compte. Pourquoi deux endpoints et pas un seul ? Pour une question d'ergonomie. L'application mobile peut faire deux écrans distincts. Un premier écran où l'utilisateur saisit son numéro et reçoit le code. Un second écran où il saisit le code et son nouveau mot de passe. Cela permet aussi de gérer les cas d'erreur plus finement : si le numéro n'existe pas, on le dit à l'étape un. Si l'OTP est invalide, on le dit à l'étape deux. Séparer les deux facilite aussi les tests : on peut tester la génération d'OTP sans tester la mise à jour du mot de passe, et vice versa.",
    "note": "Deux endpoints = deux écrans mobile. Meilleure ergonomie et meilleure gestion d'erreurs."
  },
  {
    "titre": "send-reset-otp : la différence clé",
    "contenu": "<div style='background: #f8f9fa; padding: 1rem; border-radius: 12px; border-left: 6px solid #a78bfa;'><p style='color: #333;'>Souvenez-vous de notre méthode <code>sendOtp</code> :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.7rem; line-height: 1.6; white-space: pre;'>async sendOtp(<br>&nbsp;&nbsp;sendOtpDto: SendOtpDto,<br>&nbsp;&nbsp;isResetPassword: boolean = false<br>): Promise&lt;{ success: boolean; message: string; expiresIn: number }&gt; {<br>&nbsp;&nbsp;const { phone_number } = sendOtpDto;<br><br>&nbsp;&nbsp;const existingUser = await this.userRepository.findOne({<br>&nbsp;&nbsp;&nbsp;&nbsp;where: { phone_number },<br>&nbsp;&nbsp;});<br><br>&nbsp;&nbsp;<span style='color: #6a9955;'>// Reset password : user DOIT exister</span><br>&nbsp;&nbsp;if (isResetPassword &amp;&amp; !existingUser) {<br>&nbsp;&nbsp;&nbsp;&nbsp;throw new BadRequestException('Aucun compte associé à ce numéro');<br>&nbsp;&nbsp;}<br><br>&nbsp;&nbsp;<span style='color: #6a9955;'>// Inscription : user NE DOIT PAS exister</span><br>&nbsp;&nbsp;if (!isResetPassword &amp;&amp; existingUser) {<br>&nbsp;&nbsp;&nbsp;&nbsp;throw new ConflictException('Ce numéro est déjà utilisé');<br>&nbsp;&nbsp;}<br><br>&nbsp;&nbsp;return this.otpService.sendOtp(phone_number, phone_number);<br>}</div></div>",
    "texteParle": "Voici la méthode sendOtp que nous avons déjà créée dans la leçon 3.5, mais avec une subtilité importante. Regardez le paramètre isResetPassword. C'est un booléen qui par défaut vaut false. Il change la logique de la méthode selon le contexte. Dans le cas d'une inscription (isResetPassword = false), on veut que le numéro ne soit pas utilisé. Un utilisateur qui s'inscrit avec un numéro existant, c'est une erreur : il doit se connecter, pas s'inscrire. Dans le cas d'un reset password (isResetPassword = true), on veut que le numéro existe. Si l'utilisateur saisit un numéro qui n'a pas de compte, on ne peut pas réinitialiser le mot de passe. C'est un cas d'erreur. Regardez les deux if. Si isResetPassword et pas d'existingUser, on lève une BadRequestException : 'Aucun compte associé à ce numéro'. Si !isResetPassword et existingUser, on lève une ConflictException : 'Ce numéro est déjà utilisé'. C'est la même méthode qui sert les deux cas, mais avec une logique inversée. Astucieux, non ? On évite de dupliquer du code. Une seule méthode sendOtp pour deux usages différents.",
    "note": "Un paramètre booléen change la logique. Une seule méthode gère deux cas. C'est élégant."
  },
  {
    "titre": "Le controller send-reset-otp",
    "contenu": "<div style='background: #e9ecef; padding: 1rem; border-radius: 12px;'><p style='color: #333;'>Dans <code>auth.controller.ts</code> :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.68rem; line-height: 1.6; white-space: pre;'>@Post('send-reset-otp')<br>@HttpCode(HttpStatus.OK)<br>async sendResetOtp(@Body() sendOtpDto: SendOtpDto) {<br>&nbsp;&nbsp;<span style='color: #6a9955;'>// Passer isResetPassword = true</span><br>&nbsp;&nbsp;return this.authService.sendOtp(sendOtpDto, true);<br>}</div><p style='color: #333; margin-top: 0.8rem;'><strong>Ce qui se passe côté client :</strong></p><ol style='padding-left: 1.2rem; color: #333; line-height: 1.7;'><li>📱 L'utilisateur tape son numéro</li><li>➡️ L'app envoie POST /auth/send-reset-otp</li><li>📲 Le serveur envoie un SMS avec un code à 6 chiffres</li><li>✅ L'app affiche un écran de saisie du code</li></ol></div>",
    "texteParle": "Regardons l'endpoint send-reset-otp dans le contrôleur. C'est très simple. On a un POST sur send-reset-otp, avec un décorateur HttpCode qui force le statut 200 OK. La méthode sendResetOtp reçoit le DTO SendOtpDto et appelle authService.sendOtp avec deux arguments : le DTO, et true pour isResetPassword. C'est ce true qui fait toute la différence. Dans le service, on saura qu'on est dans un contexte de reset password, et on appliquera la logique correspondante. Du côté du client, le flux est le suivant. L'utilisateur tape son numéro de téléphone dans un écran 'Mot de passe oublié'. L'application envoie une requête POST à send-reset-otp. Le serveur vérifie que ce numéro existe, génère un OTP, et l'envoie par SMS. L'application affiche ensuite un écran de saisie du code. L'utilisateur attend le SMS, le lit, et le tape. On passe alors à l'étape deux : reset-password. Vous voyez que la séparation des endpoints correspond bien à une séparation des écrans dans l'app mobile. C'est cohérent et propre.",
    "note": "HttpCode(HttpStatus.OK) sur un POST est nécessaire car POST retourne 201 par défaut."
  },
  {
    "titre": "Le DTO ResetPasswordDto",
    "contenu": "<div style='background: #f8f9fa; padding: 1rem; border-radius: 12px; border-left: 6px solid #10b981;'><p style='color: #333;'>Rappelons le DTO (déjà créé en 3.2) :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.7rem; line-height: 1.6; white-space: pre;'>export class ResetPasswordDto {<br>&nbsp;&nbsp;@IsString()<br>&nbsp;&nbsp;@IsNotEmpty()<br>&nbsp;&nbsp;phone_number!: string;<br><br>&nbsp;&nbsp;@IsString()<br>&nbsp;&nbsp;@IsNotEmpty()<br>&nbsp;&nbsp;@Length(6, 6, { message: 'OTP exactement 6 chiffres' })<br>&nbsp;&nbsp;otp!: string;<br><br>&nbsp;&nbsp;@IsString()<br>&nbsp;&nbsp;@IsNotEmpty()<br>&nbsp;&nbsp;@Matches(<br>&nbsp;&nbsp;&nbsp;&nbsp;/^(?=.*[A-Z])(?=.*[0-9]).{8,}$/,<br>&nbsp;&nbsp;&nbsp;&nbsp;{ message: '8+ caractères, 1 majuscule, 1 chiffre' }<br>&nbsp;&nbsp;)<br>&nbsp;&nbsp;new_password!: string;<br>}</div><p style='color: #555; font-size: 0.9rem; margin-top: 0.8rem;'>💡 Le nouveau mot de passe respecte la même politique que l'inscription.</p></div>",
    "texteParle": "Rappelons le DTO ResetPasswordDto, que nous avons créé dans la leçon 3.2. Il contient trois champs. phone_number : une chaîne non vide. otp : une chaîne non vide, avec une longueur exacte de six caractères. C'est le code reçu par SMS. new_password : une chaîne non vide, avec des contraintes fortes. Au moins huit caractères, une majuscule, un chiffre. C'est exactement la même politique de mot de passe que pour l'inscription. Il est crucial que les deux soient cohérents. Si on acceptait un mot de passe plus faible à la réinitialisation, un utilisateur pourrait contourner la politique en réinitialisant. Ce serait une faille. Donc même politique partout : 8 caractères minimum, une majuscule, un chiffre. Ce DTO est protégé par le ValidationPipe global, donc toutes ces contraintes sont vérifiées automatiquement avant que la requête n'atteigne notre service. Si l'utilisateur envoie un code à cinq chiffres, ou un mot de passe de sept caractères, la requête est rejetée avec une erreur 400. On n'a même pas besoin de coder ces vérifications manuellement. C'est tout l'intérêt des DTOs.",
    "note": "Même politique de mot de passe partout. Sinon, on peut contourner par un autre chemin."
  },
  {
    "titre": "La méthode resetPassword",
    "contenu": "<div style='background: #e9ecef; padding: 1rem; border-radius: 12px;'><p style='color: #333;'>Dans <code>AuthService</code> :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.68rem; line-height: 1.6; white-space: pre;'>async resetPassword(resetPasswordDto: ResetPasswordDto): Promise&lt;{ message: string }&gt; {<br>&nbsp;&nbsp;const { phone_number, otp, new_password } = resetPasswordDto;<br><br>&nbsp;&nbsp;<span style='color: #6a9955;'>// 1. Vérifier l'OTP</span><br>&nbsp;&nbsp;const isValid = this.otpService.verifyOtp(phone_number, otp, phone_number);<br>&nbsp;&nbsp;if (!isValid) {<br>&nbsp;&nbsp;&nbsp;&nbsp;throw new BadRequestException('Code OTP invalide ou expiré');<br>&nbsp;&nbsp;}<br><br>&nbsp;&nbsp;<span style='color: #6a9955;'>// 2. Trouver l'utilisateur</span><br>&nbsp;&nbsp;const user = await this.userRepository.findOne({<br>&nbsp;&nbsp;&nbsp;&nbsp;where: { phone_number },<br>&nbsp;&nbsp;});<br>&nbsp;&nbsp;if (!user) {<br>&nbsp;&nbsp;&nbsp;&nbsp;throw new BadRequestException('Utilisateur non trouvé');<br>&nbsp;&nbsp;}<br><br>&nbsp;&nbsp;<span style='color: #6a9955;'>// 3. Hasher et sauvegarder</span><br>&nbsp;&nbsp;const hashedPassword = await this.hashPassword(new_password);<br>&nbsp;&nbsp;user.password_hash = hashedPassword;<br>&nbsp;&nbsp;await this.userRepository.save(user);<br><br>&nbsp;&nbsp;<span style='color: #6a9955;'>// 4. Nettoyer l'OTP</span><br>&nbsp;&nbsp;this.otpService.clearOtp(phone_number, phone_number);<br><br>&nbsp;&nbsp;return { message: 'Mot de passe réinitialisé avec succès' };<br>}</div></div>",
    "texteParle": "Voici la méthode resetPassword. Elle fait quatre choses. Étape une : vérifier l'OTP. On appelle otpService.verifyOtp avec le numéro, le code fourni, et une customKey qui est aussi le numéro. Si le code est invalide ou expiré, on lève une BadRequestException. Étape deux : trouver l'utilisateur par son numéro. On sait déjà qu'il existe, car on l'a vérifié à l'étape send-reset-otp. Mais par mesure de sécurité, on re-vérifie. Étape trois : hasher le nouveau mot de passe avec bcrypt, et le sauvegarder sur l'utilisateur. On utilise la méthode hashPassword que nous avons déjà créée. Étape quatre : nettoyer l'OTP du cache pour qu'il ne puisse pas être réutilisé. Le même code ne peut servir qu'une fois. C'est une protection importante. Enfin, on retourne un message de succès. Remarquez la customKey dans verifyOtp et clearOtp : c'est le numéro de téléphone lui-même. Pourquoi cette customKey ? Nous en reparlerons dans le slide suivant. Pour l'instant, retenez que c'est une astuce qui nous permet de distinguer les OTP d'inscription des OTP de reset, quand la même clé (le numéro) est utilisée.",
    "note": "Vérifier l'OTP AVANT de chercher l'utilisateur. On économise une requête en cas d'échec."
  },
  {
    "titre": "L'astuce de la customKey",
    "contenu": "<div style='background: #f8f9fa; padding: 1.5rem; border-radius: 12px; border-left: 6px solid #a78bfa;'><p style='color: #333;'><strong>Le problème :</strong> si on utilise le même cache pour inscription et reset, un utilisateur pourrait prendre son OTP d'inscription et l'utiliser pour reset le mot de passe d'un autre compte.</p><p style='color: #333;'><strong>La solution :</strong> la customKey. On passe une clé différente selon le contexte.</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.7rem; line-height: 1.6; white-space: pre;'><span style='color: #6a9955;'>// Inscription</span><br>otpService.sendOtp(phone, phone);&nbsp;&nbsp;<span style='color: #6a9955;'>// clé = phone</span><br><br><span style='color: #6a9955;'>// Reset</span><br>otpService.sendOtp(phone, phone);&nbsp;&nbsp;<span style='color: #6a9955;'>// clé = phone</span></div><p style='color: #333; margin-top: 1rem;'><strong>En pratique :</strong> on utilise des clés différentes pour chaque contexte :</p><div style='background: #d4edda; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.72rem; color: #333; line-height: 1.7;'>Inscription : &quot;register:&quot; + phone<br>Reset : &quot;reset:&quot; + phone<br>Changement de numéro : &quot;change-phone:&quot; + phone</div></div>",
    "texteParle": "Parlons de la customKey. Imaginez le scénario suivant. Un utilisateur s'inscrit avec son numéro. Il reçoit un OTP. Mais entre-temps, il se souvient qu'il a déjà un compte avec ce numéro. Il va sur 'mot de passe oublié' et demande un reset. Il reçoit un nouvel OTP. Mais les deux OTP sont stockés en cache avec la même clé : son numéro de téléphone. Le second OTP écrase le premier. C'est un premier problème. Il y a pire. Imaginez qu'un attaquant intercepte un OTP d'inscription destiné à quelqu'un d'autre, et l'utilise pour reset le mot de passe du même numéro. Puisque la clé est la même, ça fonctionnerait. C'est une faille de sécurité. Pour éviter ça, on utilise une customKey. L'idée : utiliser une clé différente selon le contexte. Par exemple, pour l'inscription, la clé serait 'register:' plus le numéro. Pour le reset, 'reset:' plus le numéro. Ainsi, les deux OTP sont stockés séparément. Un OTP d'inscription ne peut pas être utilisé pour un reset, et inversement. C'est une protection simple mais importante. Dans le code de SawaMart actuel, la customKey passée est juste le numéro, ce qui est simplifié. Mais dans un projet professionnel, il faut distinguer les contextes avec des préfixes. C'est une amélioration que je vous recommande d'appliquer.",
    "note": "customKey avec préfixe évite les collisions. 'register:phone' vs 'reset:phone'."
  },
  {
    "titre": "Le controller reset-password",
    "contenu": "<div style='background: #e9ecef; padding: 1rem; border-radius: 12px;'><p style='color: #333;'>L'endpoint <code>reset-password</code> :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.68rem; line-height: 1.6; white-space: pre;'>@Post('reset-password')<br>@Throttle({ default: { limit: 3, ttl: 600 } })<br>@UseGuards(CustomThrottlerGuard)<br>@HttpCode(HttpStatus.OK)<br>async resetPassword(@Body() resetPasswordDto: ResetPasswordDto) {<br>&nbsp;&nbsp;return this.authService.resetPassword(resetPasswordDto);<br>}</div><p style='color: #333; margin-top: 0.8rem;'><strong>Le rate limiting :</strong></p><ul style='padding-left: 1.2rem; color: #333; line-height: 1.7;'><li>🚫 Maximum <strong>3 tentatives</strong> de reset par 10 minutes</li><li>🛡️ Protège contre les attaques automatisées</li><li>🎯 Empêche un attaquant de tester des OTP au hasard</li></ul><div style='background: #fff3cd; border-left: 4px solid #856404; padding: 0.8rem; border-radius: 4px; margin-top: 1rem;'><strong>⚠️ Pourquoi ce rate limit est crucial :</strong> un OTP à 6 chiffres a 1 000 000 de combinaisons. Avec 3 essais par 10 min, il faudrait plus de 3 ans pour toutes les tester.</div></div>",
    "texteParle": "Regardons l'endpoint reset-password. Il y a un décorateur Throttle qui limite à trois tentatives par dix minutes. C'est crucial. Pourquoi ? Parce qu'un OTP à six chiffres a un million de combinaisons. Si on n'avait pas de rate limit, un attaquant pourrait tester toutes les combinaisons en quelques minutes, en parallèle sur plusieurs threads. Une fois qu'il trouve le bon OTP, il change le mot de passe et prend le contrôle du compte. C'est une attaque qu'on appelle brute-force OTP. Le rate limit empêche ça. Avec trois tentatives par dix minutes, un attaquant ne peut tester que dix-huit combinaisons par heure. Pour tester un million de combinaisons, il lui faudrait plus de six ans. Autant dire impossible. C'est pour ça que le Throttle sur cet endpoint est non négociable. C'est également pour ça que les OTP ont une durée de vie courte (cinq minutes). Même si un attaquant pouvait tester, le code serait expiré avant qu'il ne trouve. La combinaison de ces deux protections rend l'attaque impossible. On ajoute aussi un UseGuards pour activer le CustomThrottlerGuard. Et on force le statut 200 avec HttpCode. L'endpoint est protégé, sécurisé, prêt pour la production.",
    "note": "Rate limit + expiration courte = OTP incassable. Ne sacrifiez jamais ces deux protections."
  },
  {
    "titre": "Le flux complet côté client",
    "contenu": "<div style='background: #f8f9fa; padding: 1rem; border-radius: 12px; border-left: 6px solid #2a5298;'><p style='color: #333;'>Ce que voit l'utilisateur :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.68rem; line-height: 1.8; white-space: pre;'><span style='color: #6a9955;'>Écran 1 : Mot de passe oublié</span><br>├── Saisie du numéro de téléphone<br>└── Bouton &quot;Envoyer le code&quot;<br>&nbsp;&nbsp;&nbsp;&nbsp;→ POST /auth/send-reset-otp<br><br><span style='color: #6a9955;'>Écran 2 : Saisie du code</span><br>├── Saisie du code à 6 chiffres<br>├── Saisie du nouveau mot de passe<br>├── Confirmation du nouveau mot de passe<br>└── Bouton &quot;Valider&quot;<br>&nbsp;&nbsp;&nbsp;&nbsp;→ POST /auth/reset-password<br><br><span style='color: #6a9955;'>Écran 3 : Succès</span><br>└── Redirection vers l'écran de connexion</div></div>",
    "texteParle": "Voici le flux complet côté client, c'est-à-dire côté application mobile. L'utilisateur voit trois écrans. Écran un : Mot de passe oublié. Il saisit son numéro de téléphone et clique sur 'Envoyer le code'. L'app envoie une requête POST à send-reset-otp. Écran deux : Saisie du code. Il saisit le code à six chiffres reçu par SMS. Il saisit aussi son nouveau mot de passe, et le confirme. Il clique sur 'Valider'. L'app envoie une requête POST à reset-password avec les trois informations. Le serveur vérifie l'OTP, hash le nouveau mot de passe, et retourne un succès. Écran trois : Succès. L'app affiche un message de confirmation et redirige vers l'écran de connexion. L'utilisateur peut maintenant se connecter avec son nouveau mot de passe. Ce flux en trois écrans est fluide et intuitif. C'est ce que voit l'utilisateur. Derrière, il y a toute la logique que nous avons construite : vérification de l'existence du compte, envoi de l'OTP, vérification de l'OTP, hash du nouveau mot de passe, sauvegarde. Tout ça est invisible pour l'utilisateur, mais c'est ce qui fait que son expérience est agréable.",
    "note": "L'expérience utilisateur passe par 3 écrans. Le backend fait tout le reste invisiblement."
  },
  {
    "titre": "Résumé et prochaine étape",
    "contenu": "<div style='background: linear-gradient(135deg, #1e3c72, #2a5298); color: white; padding: 2rem; border-radius: 15px; text-align: center;'><h3 style='color: #fff;'>🎉 Reset password maîtrisé !</h3><p style='color: #e0e0e0;'>Vos utilisateurs ne perdent plus jamais leur compte.</p><hr style='border-color: #4a7db0; width: 50%;'><p style='color: #f0f0f0; margin-bottom: 0.5rem;'>Ce que nous avons appris :</p><ul style='text-align: left; padding-left: 1.5rem; color: #f0f0f0; line-height: 1.8;'><li>✅ Pourquoi le reset password est crucial</li><li>✅ Les 2 endpoints : send-reset-otp et reset-password</li><li>✅ Le paramètre <code>isResetPassword</code> qui change la logique</li><li>✅ La méthode <code>resetPassword</code> en 4 étapes</li><li>✅ L'astuce de la <code>customKey</code></li><li>✅ Le rate limiting : 3 tentatives / 10 minutes</li><li>✅ Le flux complet en 3 écrans côté mobile</li></ul><p style='color: #f0f0f0; margin-top: 1rem;'>👉 <strong>Prochaine leçon :</strong> JWT Strategy et JwtAuthGuard</p></div>",
    "texteParle": "Résumons cette leçon. Nous avons vu pourquoi la réinitialisation de mot de passe est cruciale : trente à cinquante pour cent des utilisateurs oublient leur mot de passe chaque année. Sans mécanisme de reset, ils perdent leur compte. Nous avons découpé le flux en deux endpoints : send-reset-otp, qui envoie le code, et reset-password, qui vérifie le code et met à jour le mot de passe. Nous avons vu comment la méthode sendOtp accepte un paramètre isResetPassword pour adapter sa logique : en inscription, on vérifie que le numéro n'existe pas. En reset, on vérifie qu'il existe. Nous avons créé la méthode resetPassword, qui vérifie l'OTP, hache le nouveau mot de passe, et nettoie l'OTP. Nous avons parlé de la customKey, qui permet de distinguer les OTP selon leur contexte, pour éviter les collisions et renforcer la sécurité. Nous avons ajouté un rate limiting : trois tentatives de reset par dix minutes. Et nous avons décrit le flux complet en trois écrans côté mobile. La réinitialisation de mot de passe est complète et sécurisée. Dans la prochaine leçon, nous allons passer à la partie vérification : la JwtStrategy et le JwtAuthGuard. C'est ce qui nous permet de protéger nos endpoints après la connexion. À très bientôt !",
    "note": "Un bon reset password sauve des utilisateurs. C'est un investissement rentable."
  }
];

    const $loadingProgressBar = $('#loadingProgressBar');
    const $autoIndicator = $('#autoIndicator');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $replay = $('#replayBtn');
    const $play = $('#playBtn');
    const $cancelLoading = $('#cancelLoadingBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function setStatus(text, type) {
        $statusText.text(text);
        $statusBadge.removeClass('idle speaking error paused waiting loading');
        if (type === 'speaking') $statusBadge.addClass('speaking');
        else if (type === 'error') $statusBadge.addClass('error');
        else if (type === 'paused') $statusBadge.addClass('paused');
        else if (type === 'waiting') $statusBadge.addClass('waiting');
        else if (type === 'loading') $statusBadge.addClass('loading');
        else $statusBadge.addClass('idle');
    }

    function updatePlayButton() {
        if (isPlaying) {
            $play.addClass('playing');
            $play.find('.btn-icon').text('⏸');
            $play.find('.btn-label').text('Pause');
        } else {
            $play.removeClass('playing');
            $play.find('.btn-icon').text('▶');
            $play.find('.btn-label').text('Play');
        }
    }

    function showLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        
        loadingCancelled = false;
        isLoading = true;
        
        // Réinitialiser la barre de progression
        $loadingProgressBar.css('animation', 'none');
        $loadingProgressBar.css('width', '0%');
        // Forcer un reflow
        $loadingProgressBar[0].offsetHeight;
        $loadingProgressBar.css('animation', 'loadingProgress 30s ease-out forwards');
        
        $loadingText.text('Préparation vocale...');
        $loadingSub.text('Synthèse en cours');
        $loadingTimeout.text('⏱️ 30 secondes maximum');
        $loading.fadeIn(300);
        setStatus("⏳ Chargement...", 'loading');
        
        // 🔥 TIMEOUT DE 30 SECONDES
        loadingTimeout = setTimeout(() => {
            if (isLoading && !loadingCancelled) {
                hideLoading();
                setStatus("⚠️ Délai dépassé (30s)", 'error');
                isPlaying = false;
                updatePlayButton();
                $loadingSub.text('La synthèse vocale a pris trop de temps');
                $loadingTimeout.text('❌ Délai dépassé');
            }
        }, 30000);
    }

    function hideLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        isLoading = false;
        loadingCancelled = false;
        $loading.fadeOut(300);
        // Ne pas changer le statut si on est en train de parler
        if (!isSpeaking && !isPlaying) {
            setStatus("⏸ Lecture arrêtée", 'paused');
        }
    }

    function cancelLoading() {
        loadingCancelled = true;
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        hideLoading();
        stopSpeaking();
        setStatus("⏸ Annulé", 'paused');
        isPlaying = false;
        updatePlayButton();
        $loadingText.text('Annulé par l\'utilisateur');
        $loadingSub.text('Vous pouvez réessayer');
        $loadingTimeout.text('✕ Annulation');
    }

    // Arrêter la parole proprement
    function stopSpeaking() {
        try {
            if (synth && (synth.speaking || synth.pending)) {
                synth.cancel();
            }
        } catch(e) {
            console.warn('Erreur stopSpeaking:', e);
        }
        if (currentUtterance) {
            try {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance.onstart = null;
            } catch(e) {}
            currentUtterance = null;
        }
        isSpeaking = false;
        isPlaying = false;
        updatePlayButton();
    }

    // Mettre en pause la parole
    function pauseSpeaking() {
        try {
            if (synth && synth.speaking) {
                synth.pause();
                isPaused = true;
                isPlaying = false;
                setStatus("⏸ Lecture en pause", 'paused');
                updatePlayButton();
            }
        } catch(e) {
            console.warn('Erreur pauseSpeaking:', e);
            stopSpeaking();
        }
    }

    // Reprendre la parole
    function resumeSpeaking() {
        try {
            if (synth && synth.paused) {
                synth.resume();
                isPaused = false;
                isPlaying = true;
                setStatus("🔊 Lecture en cours", 'speaking');
                updatePlayButton();
            } else if (!isSpeaking && !synth.speaking && !synth.pending) {
                speakSlide(currentIndex);
            }
        } catch(e) {
            console.warn('Erreur resumeSpeaking:', e);
            speakSlide(currentIndex);
        }
    }

    function renderSlide(index) {
        const slide = slides[index];
        $title.text(slide.titre);

        let html = '';
        html += `<div class="content-card">${slide.contenu}</div>`;
        if (slide.note) {
            html += `<div class="note-box">${slide.note}</div>`;
        }
        $body.html(html);
        $counter.text(`${index+1} / ${total}`);

        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
        }
    }

    // ================================================================
    // LECTURE VOCALE
    // ================================================================
    function speakSlide(index) {
        return new Promise((resolve) => {
            const slide = slides[index];
            const text = slide.texteParle;
            
            if (!text || text.trim() === '' || !speechSupported) {
                resolve();
                return;
            }

            if (!window.speechSynthesis) {
                setStatus("❌ Synthèse vocale non supportée", 'error');
                speechSupported = false;
                resolve();
                return;
            }

            // Arrêter toute lecture en cours
            stopSpeaking();
            
            // Réinitialiser l'état de pause
            isPaused = false;
            
            showLoading();
            setStatus("Initialisation...", 'loading');

            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.92;
                utterance.pitch = 1.05;
                utterance.volume = 1;

                let isFinished = false;
                let errorHandled = false;

                utterance.onstart = function() {
                    if (loadingCancelled) {
                        stopSpeaking();
                        resolve();
                        return;
                    }
                    hideLoading();
                    isSpeaking = true;
                    isPlaying = true;
                    isPaused = false;
                    setStatus("🔊 Lecture en cours", 'speaking');
                    updatePlayButton();
                };

                utterance.onend = function() {
                    if (isFinished) return;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    setStatus("✅ Terminé", 'idle');
                    hideLoading();
                    updatePlayButton();
                    resolve();
                };

                utterance.onerror = function(e) {
                    if (isFinished || errorHandled) return;
                    errorHandled = true;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    hideLoading();
                    updatePlayButton();
                    
                    if (e.error === 'not-allowed') {
                        setStatus("⚠️ Permission refusée", 'error');
                    } else if (e.error === 'synthesis-unavailable') {
                        setStatus("⚠️ Synthèse indisponible", 'error');
                    } else if (e.error === 'canceled') {
                        setStatus("⏸ Annulé", 'paused');
                    } else {
                        setStatus("❌ Erreur audio: " + (e.error || 'inconnue'), 'error');
                    }
                    
                    resolve();
                };

                // Gestion du chargement des voix
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = function() {
                        if (!loadingCancelled) {
                            try {
                                synth.speak(utterance);
                            } catch(err) {
                                // Silencieux
                            }
                        }
                        synth.onvoiceschanged = null;
                    };
                }

                currentUtterance = utterance;
                
                if (!loadingCancelled) {
                    try {
                        synth.speak(utterance);
                    } catch(err) {
                        setTimeout(() => {
                            if (!loadingCancelled) {
                                try {
                                    synth.speak(utterance);
                                } catch(e) {
                                    setStatus("❌ Erreur de lecture", 'error');
                                    isPlaying = false;
                                    updatePlayButton();
                                    hideLoading();
                                    resolve();
                                }
                            } else {
                                resolve();
                            }
                        }, 100);
                    }
                } else {
                    resolve();
                }

            } catch(err) {
                hideLoading();
                setStatus("❌ Erreur générale", 'error');
                isPlaying = false;
                updatePlayButton();
                console.error('Erreur speakSlide:', err);
                resolve();
            }
        });
    }

    // ================================================================
    // NAVIGATION
    // ================================================================
    async function goToSlide(index) {
        if (isTransitioning) return;
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        
        // Si on est en train de lire, on met en pause avant de naviguer
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        // Arrêter complètement la lecture
        stopSpeaking();
        
        await new Promise(r => setTimeout(r, 50));
        
        if (index === currentIndex) {
            setStatus("📄 Slide actuel", 'idle');
            return;
        }

        isTransitioning = true;
        currentIndex = index;
        renderSlide(index);
        
        // Réinitialiser l'état de lecture
        isPlaying = false;
        updatePlayButton();
        setStatus("⏸ Lecture arrêtée", 'paused');

        await new Promise(r => setTimeout(r, 150));
        isTransitioning = false;
    }

    async function goToNext() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex + 1 < total) {
            await goToSlide(currentIndex + 1);
        } else {
            setStatus("🏁 Dernier slide", 'idle');
        }
    }

    async function goToPrev() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex - 1 >= 0) {
            await goToSlide(currentIndex - 1);
        } else {
            setStatus("🔁 Premier slide", 'idle');
        }
    }

    // ================================================================
    // GESTION PLAY/PAUSE
    // ================================================================
    function togglePlay() {
        if (!userInteracted) {
            userInteracted = true;
        }

        // Si le chargement est en cours, on l'annule
        if (isLoading) {
            cancelLoading();
            return;
        }

        // Si le synthétiseur est en pause, on reprend
        if (synth && synth.paused) {
            resumeSpeaking();
            return;
        }

        // Si la lecture est en cours, on met en pause
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
            return;
        }

        // Sinon, on démarre la lecture du slide courant
        if (!isSpeaking && !isPlaying) {
            stopSpeaking();
            speakSlide(currentIndex);
        }
    }

    // ================================================================
    // INIT
    // ================================================================
    async function init() {
        // Vérifier la compatibilité
        if (!window.speechSynthesis) {
            setStatus("❌ Synthèse vocale non supportée", 'error');
            speechSupported = false;
        }

        // Précharger les voix
        try {
            if (synth.getVoices) {
                synth.getVoices();
                setTimeout(() => {
                    try {
                        synth.getVoices();
                    } catch(e) {}
                }, 200);
            }
        } catch(e) {
            console.warn('Erreur chargement voix:', e);
        }

        // Afficher le premier slide
        renderSlide(0);
        $counter.text(`1 / ${total}`);
        
        // État initial
        setStatus("⏸ Appuie sur Play", 'paused');
        updatePlayButton();
        $autoIndicator.text('⏸ Lecture manuelle');

        // ================================================================
        // ÉVÉNEMENTS
        // ================================================================
        
        // Bouton Play/Pause
        $play.on('click', function() {
            togglePlay();
        });

        // Bouton Annuler le chargement
        $cancelLoading.on('click', function() {
            cancelLoading();
        });

        // Navigation
        $prev.on('click', function() {
            // Si chargement en cours, on annule
            if (isLoading) cancelLoading();
            goToPrev();
        });

        $next.on('click', function() {
            if (isLoading) cancelLoading();
            goToNext();
        });

        // Replay - relire le slide courant
        $replay.on('click', function() {
            if (isLoading) cancelLoading();
            stopSpeaking();
            setTimeout(() => {
                speakSlide(currentIndex);
            }, 100);
        });

        // Support du clavier (espace pour play/pause)
        $(document).on('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });

        // Nettoyage
        $(window).on('beforeunload', function() {
            try {
                if (synth.speaking) synth.cancel();
            } catch(e) {}
            hideLoading();
        });

        // Gérer les cas où la synthèse se termine de manière inattendue
        setInterval(() => {
            if (isPlaying && !synth.speaking && !synth.pending && !isPaused && !isLoading) {
                isPlaying = false;
                updatePlayButton();
                setStatus("⏸ Lecture arrêtée", 'paused');
            }
        }, 1000);
    }

    init();
});



    // ================================================================
    // GESTION DU THÈME JOUR/NUIT
    // ================================================================
    let isDarkMode = false;

    function toggleTheme() {
        isDarkMode = !isDarkMode;
        const body = document.body;
        const appContainer = document.querySelector('.app-container');
        const header = document.querySelector('.slide-header');
        const footer = document.querySelector('.slide-footer');
        const contentCards = document.querySelectorAll('.content-card');
        const noteBoxes = document.querySelectorAll('.note-box');
        const mathBlocks = document.querySelectorAll('.math-block');
        const buttons = document.querySelectorAll('.btn');
        const statusBadge = document.querySelector('.status-badge');
        const slideCounter = document.querySelector('.slide-counter');
        const autoIndicator = document.querySelector('.auto-indicator');
        const themeBtn = document.getElementById('themeToggle');

        if (isDarkMode) {
            // Mode nuit
            body.style.background = '#0b1120';
            body.style.color = '#f1f5f9';
            appContainer.style.background = 'linear-gradient(145deg, #0f172a 0%, #1e293b 100%)';
            header.style.background = 'rgba(15, 23, 42, 0.85)';
            footer.style.background = 'rgba(15, 23, 42, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.05)';
                card.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.08)';
                note.style.color = '#cbd5e1';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.25)';
                block.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#e2e8f0';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.12)';
                statusBadge.style.color = '#93bbfc';
            }
            if (slideCounter) {
                slideCounter.style.color = '#94a3b8';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#64748b';
            }
            if (themeBtn) {
                themeBtn.textContent = '☀️';
                themeBtn.title = 'Passer en mode jour';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#e2e8f0';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#e2e8f0';
                }
            });
        } else {
            // Mode jour (par défaut)
            body.style.background = '#f0f4f8';
            body.style.color = '#1a202c';
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
            header.style.background = 'rgba(255, 255, 255, 0.85)';
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.8)';
                card.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.12)';
                note.style.color = '#2c3e50';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.05)';
                block.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#2d3748';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
                statusBadge.style.color = '#2b6cb0';
            }
            if (slideCounter) {
                slideCounter.style.color = '#4a5568';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#718096';
            }
            if (themeBtn) {
                themeBtn.textContent = '🌓';
                themeBtn.title = 'Passer en mode nuit';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#2c3e50';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#2d3748';
                }
            });
        }
    }

    // Initialiser en mode jour
    document.addEventListener('DOMContentLoaded', function() {
        // Appliquer le mode jour par défaut
        const body = document.body;
        body.style.background = '#f0f4f8';
        body.style.color = '#1a202c';
        
        const appContainer = document.querySelector('.app-container');
        if (appContainer) {
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
        }
        
        const header = document.querySelector('.slide-header');
        if (header) {
            header.style.background = 'rgba(255, 255, 255, 0.85)';
        }
        
        const footer = document.querySelector('.slide-footer');
        if (footer) {
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
        }
        
        document.querySelectorAll('.content-card').forEach(card => {
            card.style.background = 'rgba(255,255,255,0.8)';
            card.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.note-box').forEach(note => {
            note.style.background = 'rgba(96, 165, 250, 0.12)';
            note.style.color = '#2c3e50';
        });
        
        document.querySelectorAll('.math-block').forEach(block => {
            block.style.background = 'rgba(0,0,0,0.05)';
            block.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.btn').forEach(btn => {
            btn.style.color = '#2d3748';
        });
        
        const statusBadge = document.querySelector('.status-badge');
        if (statusBadge) {
            statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
            statusBadge.style.color = '#2b6cb0';
        }
        
        const slideCounter = document.querySelector('.slide-counter');
        if (slideCounter) {
            slideCounter.style.color = '#4a5568';
        }
        
        const autoIndicator = document.querySelector('.auto-indicator');
        if (autoIndicator) {
            autoIndicator.style.color = '#718096';
        }
        
        document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
            if (!el.closest('.note-box')) {
                el.style.color = '#2c3e50';
            }
        });
        
        document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
            if (!el.closest('.note-box') && !el.closest('.math-block')) {
                el.style.color = '#2d3748';
            }
        });
        
        const themeBtn = document.getElementById('themeToggle');
        if (themeBtn) {
            themeBtn.textContent = '🌓';
            themeBtn.title = 'Passer en mode nuit';
        }
    });
</script>
