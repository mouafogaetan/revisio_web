<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Présentation mobile</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' },
            options: { skipHtmlTypes: 'script' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 500px;
        margin: 0 auto;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    .slide-header {
        flex-shrink: 0;
        padding: 18px 16px 10px 16px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        z-index: 10;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .slide-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
    }

    .content-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 18px 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        flex-shrink: 0;
    }

    .content-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .content-card li {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        line-height: 1.5;
    }

    .content-card li:last-child {
        border-bottom: none;
    }

    .bullet-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
    }

    .math-block {
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        overflow-x: auto;
        flex-shrink: 0;
        margin: 4px 0;
    }

    .math-block .math {
        font-size: 1.2rem;
        color: #e2e8f0;
    }

    .note-box {
        background: rgba(96, 165, 250, 0.08);
        border-left: 4px solid #60a5fa;
        padding: 12px 16px;
        border-radius: 12px;
        font-style: italic;
        font-size: 0.9rem;
        color: #cbd5e1;
        flex-shrink: 0;
    }

    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        border-radius: 0;
        flex-direction: column;
    }

    .loading-card {
        background: #1e293b;
        padding: 32px 28px;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #334155;
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px auto;
    }

    .loading-text {
        font-weight: 600;
        font-size: 1.1rem;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    .loading-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 16px;
    }
    .loading-progress {
        height: 3px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        animation: loadingProgress 30s ease-out forwards;
    }

    .loading-timeout {
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 12px;
    }

    .btn-cancel-loading {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 40px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #f87171;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }

    .btn-cancel-loading:active {
        transform: scale(0.94);
        background: rgba(239, 68, 68, 0.25);
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
    }

    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .slide-counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255,255,255,0.05);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(255,255,255,0.04);
    }

    .status-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 30px;
        background: rgba(96, 165, 250, 0.12);
        color: #93bbfc;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
    }

    .status-badge .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: pulse-dot 1.2s infinite;
        flex-shrink: 0;
    }

    .status-badge.idle .dot {
        animation: none;
        background: #64748b;
    }
    .status-badge.speaking .dot {
        background: #34d399;
        animation: pulse-dot 0.8s infinite;
    }
    .status-badge.error .dot {
        background: #f87171;
        animation: none;
    }
    .status-badge.paused .dot {
        animation: none;
        background: #fbbf24;
    }
    .status-badge.waiting .dot {
        animation: pulse-dot 1.5s infinite;
        background: #fbbf24;
    }
    .status-badge.loading .dot {
        animation: pulse-dot 0.5s infinite;
        background: #60a5fa;
    }

    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.7); }
    }

    .footer-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(255,255,255,0.1);
    }

    .btn-secondary {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-play {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
        min-width: 80px;
        justify-content: center;
    }
    .btn-play:active {
        background: rgba(52, 211, 153, 0.25);
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
    }

    .auto-indicator {
        font-size: 0.65rem;
        color: #64748b;
        text-align: center;
        letter-spacing: 0.3px;
        padding: 2px 0;
    }

    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.2rem;
        }
        .content-card li {
            font-size: 0.9rem;
            padding: 8px 0;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .btn-play {
            min-width: 60px;
        }
        .footer-buttons {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
        .loading-card {
            padding: 20px 16px;
        }
        .math-block .math {
            font-size: 1rem;
        }
    }

    @media (min-width: 600px) {
        .app-container {
            max-width: 480px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
        .loading-overlay {
            border-radius: 32px;
        }
    }

    /* Mode jour (par défaut) */
    html, body {
        background: #f0f4f8 !important;
        color: #1a202c !important;
    }
    .app-container {
        background: linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%) !important;
    }
    .slide-header {
        background: rgba(255, 255, 255, 0.85) !important;
        border-bottom: 1px solid rgba(0,0,0,0.08) !important;
    }
    .slide-header h1 {
        background: linear-gradient(135deg, #2b6cb0, #6b46c1) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        background-clip: text !important;
    }
    .slide-footer {
        background: rgba(255, 255, 255, 0.9) !important;
        border-top: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card {
        background: rgba(255,255,255,0.8) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card li {
        border-bottom: 1px solid rgba(0,0,0,0.05) !important;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.12) !important;
        border-left: 4px solid #4299e1 !important;
        color: #2c3e50 !important;
    }
    .math-block {
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .math-block .math {
        color: #2d3748 !important;
    }
    .slide-counter {
        color: #4a5568 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .status-badge {
        background: rgba(96, 165, 250, 0.15) !important;
        color: #2b6cb0 !important;
        border: 1px solid rgba(96, 165, 250, 0.15) !important;
    }
    .btn {
        color: #2d3748 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .btn-secondary {
        background: rgba(0,0,0,0.04) !important;
        border-color: rgba(0,0,0,0.08) !important;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15) !important;
        border-color: rgba(52, 211, 153, 0.2) !important;
        color: #38a169 !important;
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15) !important;
        border-color: rgba(251, 191, 36, 0.2) !important;
        color: #d69e2e !important;
    }
    .auto-indicator {
        color: #718096 !important;
    }
    .loading-card {
        background: #ffffff !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .loading-text {
        color: #1a202c !important;
    }
    .loading-sub {
        color: #4a5568 !important;
    }
</style>
</head>
<body>

<div class="app-container">

    <header class="slide-header">
        <h1 id="slideTitle">Chargement...</h1>
    </header>

    <main class="slide-body" id="slideBody"></main>

    <!-- LOADING OVERLAY AVEC BOUTON ANNULER -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Préparation vocale...</div>
            <div class="loading-sub" id="loadingSub">Synthèse en cours</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loadingProgressBar"></div>
            </div>
            <div class="loading-timeout" id="loadingTimeout">⏱️ 30 secondes maximum</div>
            <button class="btn-cancel-loading" id="cancelLoadingBtn">
                <span>✕</span> Annuler
            </button>
        </div>
    </div>

    <footer class="slide-footer">
        <div class="footer-top">
            <span class="slide-counter" id="slideCounter">1 / 3</span>
            <span class="status-badge idle" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">Prêt</span>
            </span>
        </div>

        <div class="footer-buttons">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-secondary" id="replayBtn">
                <span class="btn-icon">🔁</span> <span class="btn-label">Relire</span>
            </button>
            <button class="btn btn-play" id="playBtn">
                <span class="btn-icon">▶</span> <span class="btn-label">Play</span>
            </button>
        </div>

        <div class="auto-indicator" id="autoIndicator">⏸ Lecture manuelle</div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // SLIDES
    // ================================================================
    const slides = [
  {
    "titre": "DTOs et validation",
    "contenu": "<div style='background: linear-gradient(135deg, #1e3c72, #2a5298); color: white; padding: 2rem; border-radius: 15px; text-align: center; margin-bottom: 1.5rem;'><h2 style='color: #fff; margin-bottom: 0.5rem;'>🛡️ DTOs et Validation</h2><p style='color: #e0e0e0; font-size: 1.1rem;'>La première ligne de défense</p><hr style='border-color: #4a7db0; width: 50%;'><p style='color: #f0f0f0;'>Leçon 3.2 : Sécuriser les entrées avec class-validator</p></div><p>Un client envoie une requête à notre API. Comment savoir si elle est <strong>valide</strong> ? Comment empêcher un utilisateur malveillant d'injecter du code, de casser notre base, ou de faire crasher notre serveur ? La réponse tient en trois lettres : <strong>DTO</strong>. Dans cette leçon, nous allons voir comment utiliser <strong>class-validator</strong> et <strong>class-transformer</strong> pour valider proprement toutes les entrées de notre API.</p>",
    "texteParle": "Bonjour à toutes et à tous et bienvenue dans cette deuxième leçon du chapitre trois. Aujourd'hui, nous allons parler d'un sujet fondamental pour la sécurité de notre API : la validation des entrées. Imaginez un instant qu'un utilisateur malveillant envoie à notre API un numéro de téléphone sous forme de code JavaScript, ou un mot de passe de dix mille caractères, ou un champ qui n'existe pas. Sans protection, notre serveur pourrait planter, notre base pourrait être corrompue, ou pire, notre système pourrait être compromis. La solution, ce sont les DTOs, ou Data Transfer Objects, et la validation avec class-validator. C'est une des briques les plus importantes de NestJS, et nous allons la maîtriser aujourd'hui. C'est parti.",
    "note": "La validation est la première ligne de défense d'une API. Ne la négligez jamais."
  },
  {
    "titre": "Qu'est-ce qu'un DTO ?",
    "contenu": "<div style='background: #f8f9fa; padding: 1.5rem; border-radius: 12px; border-left: 6px solid #2a5298;'><p style='color: #1e3c72; font-weight: bold; margin-top: 0;'>DTO = Data Transfer Object</p><p style='color: #333;'>Un DTO est une <strong>classe</strong> qui décrit la <strong>forme</strong> des données qui entrent ou sortent de l'API.</p><p style='color: #333;'>Il sert à trois choses :</p><ul style='padding-left: 1.2rem; color: #333; line-height: 1.9;'><li>📐 <strong>Définir la structure</strong> attendue (champs, types)</li><li>✅ <strong>Valider</strong> que les données respectent les règles</li><li>🎯 <strong>Documenter</strong> l'API automatiquement (via Swagger)</li></ul><p style='color: #333; margin-top: 1rem;'><strong>Exemple concret :</strong></p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.8rem; border-radius: 8px; font-family: monospace; font-size: 0.75rem; line-height: 1.6; white-space: pre;'>class SendOtpDto {<br>&nbsp;&nbsp;phone_number!: string;<br>}</div><p style='color: #555; font-size: 0.9rem; margin-top: 0.8rem;'>💡 Un DTO par endpoint, ou par variante d'endpoint.</p></div>",
    "texteParle": "Commençons par clarifier ce qu'est un DTO. DTO signifie Data Transfer Object, ou objet de transfert de données. C'est une classe TypeScript qui décrit la forme des données qui entrent ou sortent de l'API. Un DTO sert à trois choses. Premièrement, il définit la structure attendue : quels champs sont envoyés, de quel type, sont-ils optionnels ou obligatoires. Deuxièmement, il valide que les données respectent les règles qu'on a définies. Par exemple, qu'un numéro de téléphone a bien le format attendu, ou qu'un mot de passe fait au moins huit caractères. Troisièmement, il documente l'API. Si on utilise Swagger plus tard, il générera automatiquement la documentation à partir des DTOs. Regardons un exemple concret : SendOtpDto. C'est la forme de la requête pour envoyer un OTP. Elle contient un seul champ : phone_number, de type string. C'est tout simple, mais c'est déjà un DTO. Un DTO par endpoint, ou parfois plusieurs DTOs par endpoint si l'endpoint accepte plusieurs variantes de requête. C'est la convention dans l'écosystème NestJS.",
    "note": "Un DTO par endpoint. C'est plus clair qu'un DTO générique fourre-tout."
  },
  {
    "titre": "Pourquoi valider les entrées ?",
    "contenu": "<div style='background: #f8f9fa; padding: 1.5rem; border-radius: 12px; border-left: 6px solid #dc3545;'><p style='color: #333;'>Sans validation, que peut-il se passer ?</p><ul style='padding-left: 1.2rem; color: #333; line-height: 1.8;'><li>💥 <strong>Crash serveur</strong> : envoi de `null` là où un objet est attendu</li><li>🕳️ <strong>Injection SQL</strong> : envoi de `'; DROP TABLE users;--`</li><li>🔓 <strong>Contournement d'auth</strong> : envoi d'un `role: 'admin'` dans l'inscription</li><li>📈 <strong>DoS</strong> : envoi d'un mot de passe de 10 Mo</li><li>🐛 <strong>Bug silencieux</strong> : envoi de `price: \"abc\"` au lieu d'un nombre</li><li>🗄️ <strong>Corruption BDD</strong> : envoi d'un email vide dans un champ NOT NULL</li></ul><div style='background: #d1ecf1; border-left: 4px solid #0c5460; padding: 0.8rem; border-radius: 4px; margin-top: 1rem;'><strong>💡 Règle d'or :</strong> Ne jamais faire confiance aux données venant de l'extérieur. Jamais.</div></div>",
    "texteParle": "Prenons un moment pour comprendre pourquoi la validation est absolument critique. Sans validation, voici ce qui peut se passer. Premièrement, un crash serveur. Si votre code attend un objet et reçoit null, il plante. Une attaque triviale consiste à envoyer des données malformées pour faire tomber votre serveur. Deuxièmement, une injection SQL. Imaginez un utilisateur qui envoie comme nom d'utilisateur la chaîne suivante : point-virgule, DROP TABLE users, point-virgule, tiret-tiret. Si vous concaténez cette chaîne dans une requête SQL, votre table users disparaît. C'est une des attaques les plus anciennes mais toujours d'actualité. Heureusement, TypeORM protège contre ça, mais sans validation, vous êtes exposé. Troisièmement, le contournement d'authentification. Imaginons un endpoint register qui accepte un champ role. Si on ne valide pas, un utilisateur malveillant peut s'inscrire directement comme admin en passant role admin. C'est une faille béante. Quatrièmement, un déni de service. Un utilisateur envoie un mot de passe de dix mégaoctets. Si votre serveur tente de le hasher, il consomme toute sa CPU et devient indisponible. Cinquièmement, des bugs silencieux. Un utilisateur envoie price égal à la chaîne abc au lieu d'un nombre. Votre calcul produit NaN, et vous stockez NaN en base. Sixièmement, la corruption de base. Un utilisateur envoie un email vide dans un champ obligatoire, ce qui viole une contrainte. Bref, il y a mille façons dont les données peuvent être invalides. La règle d'or : ne jamais faire confiance aux données venant de l'extérieur. Jamais. Nous allons donc valider chaque champ.",
    "note": "Ne jamais faire confiance aux entrées. C'est la règle numéro un de la sécurité web."
  },
  {
    "titre": "Installer class-validator et class-transformer",
    "contenu": "<div style='background: #e9ecef; padding: 1rem; border-radius: 12px;'><p style='color: #333;'>Installons les deux bibliothèques :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.8rem; line-height: 1.7; white-space: pre;'>npm install class-validator class-transformer</div><p style='color: #333; margin-top: 0.8rem;'><strong>À quoi sert chaque paquet :</strong></p><ul style='padding-left: 1.2rem; color: #333; line-height: 1.8;'><li>📦 <strong>class-validator</strong> — fournit les décorateurs de validation (@IsString, @IsNotEmpty...)</li><li>📦 <strong>class-transformer</strong> — convertit les objets bruts en instances de classes</li></ul><div style='background: #d1ecf1; border-left: 4px solid #0c5460; padding: 0.8rem; border-radius: 4px; margin-top: 1rem;'><strong>💡 Astuce :</strong> NestJS utilise les deux ensemble. On ne peut pas valider sans transformer, car la validation a besoin d'instances de classes.</div></div>",
    "texteParle": "Pour utiliser la validation, il faut installer deux paquets : class-validator et class-transformer. On peut les installer en une seule commande : npm install class-validator class-transformer. À quoi sert chaque paquet ? class-validator est celui qui fournit tous les décorateurs de validation. C'est lui qui nous donne @IsString, @IsNotEmpty, @IsPhoneNumber, @Matches, @MinLength, @MaxLength, et ainsi de suite. Il y a plus de trente décorateurs disponibles. class-transformer est un peu moins connu mais tout aussi important. C'est lui qui convertit un objet JavaScript brut, reçu par HTTP, en une instance de notre classe DTO. Pourquoi c'est important ? Parce que class-validator a besoin d'instances pour fonctionner. Si on lui donne un objet brut, il ne peut pas vérifier le type réel, il ne peut pas suivre la chaîne de prototypes. Donc on utilise class-transformer en premier, puis class-validator. C'est le couple qui fait la magie. Une précision importante : ces deux paquets sont utilisés ensemble par NestJS. On ne peut pas se contenter d'un seul. Installez-les tous les deux.",
    "note": "class-transformer transforme, class-validator valide. Les deux sont nécessaires."
  },
  {
    "titre": "Le DTO SendOtpDto",
    "contenu": "<div style='background: #f8f9fa; padding: 1rem; border-radius: 12px; border-left: 6px solid #10b981;'><p style='color: #333;'>Créons <code>src/auth/dto/send-otp.dto.ts</code> :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.72rem; line-height: 1.6; white-space: pre;'>import { IsString, IsNotEmpty, Matches } from 'class-validator';<br><br>export class SendOtpDto {<br>&nbsp;&nbsp;@IsString()<br>&nbsp;&nbsp;@IsNotEmpty()<br>&nbsp;&nbsp;@Matches(/^\+?[0-9]{9,15}$/, {<br>&nbsp;&nbsp;&nbsp;&nbsp;message: 'Le numéro doit contenir entre 9 et 15 chiffres',<br>&nbsp;&nbsp;})<br>&nbsp;&nbsp;phone_number!: string;<br>}</div><p style='color: #333; margin-top: 0.8rem;'>Ce DTO valide :</p><ul style='padding-left: 1.2rem; color: #333; line-height: 1.7;'><li>✅ <code>phone_number</code> est une chaîne de caractères</li><li>✅ <code>phone_number</code> n'est pas vide</li><li>✅ <code>phone_number</code> respecte le format téléphone</li></ul></div>",
    "texteParle": "Créons notre premier DTO : SendOtpDto, dans le fichier src/auth/dto/send-otp.dto.ts. On importe trois décorateurs : IsString, IsNotEmpty, et Matches. Puis on déclare la classe avec un seul champ : phone_number. Ce champ est décoré trois fois. Le décorateur IsString vérifie que la valeur est bien une chaîne de caractères. Si un utilisateur envoie un nombre, une erreur sera levée. IsNotEmpty vérifie que la chaîne n'est pas vide. Matches applique une expression régulière. Ici, la regex accepte un numéro de téléphone : un signe plus optionnel, suivi de neuf à quinze chiffres. On peut passer un message d'erreur personnalisé à chaque décorateur, ce qui est très utile pour l'utilisateur final. Le point d'exclamation après phone_number est la notation TypeScript 'definite assignment assertion', qui indique au compilateur que cette propriété sera bien assignée. C'est nécessaire car le compilateur strict mode râlerait sinon. Voilà pour le premier DTO. Il valide trois choses : c'est une chaîne, ce n'est pas vide, ça a le format téléphone. C'est court, mais c'est déjà très protecteur.",
    "note": "Les messages d'erreur personnalisés améliorent l'expérience utilisateur. Utilisez-les."
  },
  {
    "titre": "Le DTO CreateUserDto",
    "contenu": "<div style='background: #e9ecef; padding: 1rem; border-radius: 12px;'><p style='color: #333;'>Créons <code>src/database/dto/create-user.dto.ts</code> :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.7rem; line-height: 1.6; white-space: pre;'>import { IsString, IsNotEmpty, MinLength, MaxLength, Matches, IsOptional, IsEnum } from 'class-validator';<br>import { UserRole } from '../entities/user.entity';<br><br>export class CreateUserDto {<br>&nbsp;&nbsp;@IsString()<br>&nbsp;&nbsp;@IsNotEmpty()<br>&nbsp;&nbsp;phone_number!: string;<br><br>&nbsp;&nbsp;@IsString()<br>&nbsp;&nbsp;@IsNotEmpty()<br>&nbsp;&nbsp;@MinLength(3, { message: 'username trop court' })<br>&nbsp;&nbsp;@MaxLength(50, { message: 'username trop long' })<br>&nbsp;&nbsp;username!: string;<br><br>&nbsp;&nbsp;@IsString()<br>&nbsp;&nbsp;@IsNotEmpty()<br>&nbsp;&nbsp;@MinLength(8, { message: 'Au moins 8 caractères' })<br>&nbsp;&nbsp;@Matches(/[A-Z]/, { message: 'Au moins une majuscule' })<br>&nbsp;&nbsp;@Matches(/[0-9]/, { message: 'Au moins un chiffre' })<br>&nbsp;&nbsp;password!: string;<br><br>&nbsp;&nbsp;@IsEnum(UserRole)<br>&nbsp;&nbsp;@IsOptional()<br>&nbsp;&nbsp;role?: UserRole;<br>}</div></div>",
    "texteParle": "Créons maintenant un DTO plus riche : CreateUserDto, dans le fichier src/database/dto/create-user.dto.ts. Ce DTO est utilisé pour créer un utilisateur, que ce soit à l'inscription ou par un admin. On importe sept décorateurs plus l'énumération UserRole. Regardons les champs un par un. phone_number : une chaîne non vide. On ne valide pas le format ici, car cette validation est faite par le PhoneValidationService, qui est plus intelligent : il vérifie l'opérateur. username : une chaîne non vide, entre trois et cinquante caractères. Les messages d'erreur sont personnalisés en français. password : une chaîne non vide, avec trois contraintes fortes. Au moins huit caractères. Au moins une majuscule, vérifiée par la regex A-Z. Au moins un chiffre, vérifié par la regex 0-9. On pourrait ajouter d'autres contraintes, comme un caractère spécial, mais trois c'est déjà bien. C'est la politique de mot de passe que nous avons choisie pour SawaMart. Enfin, role : c'est un UserRole, mais optionnel. Cela signifie qu'on peut créer un utilisateur sans spécifier le rôle, il sera USER par défaut. Un admin pourra spécifier un autre rôle. Notez l'utilisation d'IsOptional, qui indique que ce champ peut être absent. Ces contraintes sur le mot de passe sont strictes, mais c'est pour la sécurité de l'utilisateur lui-même. Un mot de passe faible est la porte ouverte aux attaques.",
    "note": "Les politiques de mot de passe sont un compromis entre sécurité et ergonomie. Trois règles suffisent souvent."
  },
  {
    "titre": "Le DTO VerifyOtpDto",
    "contenu": "<div style='background: #f8f9fa; padding: 1rem; border-radius: 12px; border-left: 6px solid #a78bfa;'><p style='color: #333;'>Créons <code>src/auth/dto/verify-otp.dto.ts</code> :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.72rem; line-height: 1.6; white-space: pre;'>import { IsString, IsNotEmpty, Length } from 'class-validator';<br><br>export class VerifyOtpDto {<br>&nbsp;&nbsp;@IsString()<br>&nbsp;&nbsp;@IsNotEmpty()<br>&nbsp;&nbsp;phone_number!: string;<br><br>&nbsp;&nbsp;@IsString()<br>&nbsp;&nbsp;@IsNotEmpty()<br>&nbsp;&nbsp;@Length(6, 6, { message: 'Le code OTP doit contenir exactement 6 chiffres' })<br>&nbsp;&nbsp;otp!: string;<br>}</div><p style='color: #333; margin-top: 0.8rem;'><strong>Décorateurs utilisés :</strong></p><ul style='padding-left: 1.2rem; color: #333; line-height: 1.7;'><li><code>@Length(6, 6)</code> : exactement 6 caractères</li><li><code>@IsString</code> : c'est une chaîne</li><li><code>@IsNotEmpty</code> : ce n'est pas vide</li></ul></div>",
    "texteParle": "Créons le DTO VerifyOtpDto, dans le fichier src/auth/dto/verify-otp.dto.ts. Ce DTO est utilisé quand un utilisateur soumet son code OTP pour vérification. Il contient deux champs : phone_number et otp. Le phone_number est une chaîne non vide. Le otp est une chaîne non vide, avec une contrainte supplémentaire : exactement six caractères. C'est le décorateur Length avec les arguments six et six, ce qui signifie un minimum de six et un maximum de six. Donc exactement six. On pourrait être plus stricts et vérifier que ce sont bien des chiffres, pas des lettres. On pourrait utiliser le décorateur IsNumberString, qui vérifie que c'est une chaîne composée uniquement de chiffres. C'est encore mieux. Pour l'instant, on garde Length, c'est suffisant. Le message d'erreur est explicite : 'Le code OTP doit contenir exactement 6 chiffres'. C'est important pour l'utilisateur. Voilà pour ce DTO. Rien de très complexe, mais chaque contrainte est importante. Un code OTP à cinq ou sept chiffres ne pourrait jamais correspondre à ce que notre backend a généré.",
    "note": "Un OTP fait toujours 6 chiffres chez nous. Vérifiez cette contrainte à chaque étape."
  },
  {
    "titre": "Le DTO LoginDto",
    "contenu": "<div style='background: #e9ecef; padding: 1rem; border-radius: 12px;'><p style='color: #333;'>Créons <code>src/auth/dto/login.dto.ts</code> :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.72rem; line-height: 1.6; white-space: pre;'>import { IsString, IsNotEmpty } from 'class-validator';<br><br>export class LoginDto {<br>&nbsp;&nbsp;@IsString()<br>&nbsp;&nbsp;@IsNotEmpty()<br>&nbsp;&nbsp;phone_number!: string;<br><br>&nbsp;&nbsp;@IsString()<br>&nbsp;&nbsp;@IsNotEmpty()<br>&nbsp;&nbsp;password!: string;<br>}</div><p style='color: #333; margin-top: 0.8rem;'><strong>Pourquoi si simple ?</strong></p><ul style='padding-left: 1.2rem; color: #333; line-height: 1.7;'><li>On ne vérifie PAS le format ici : c'est fait à l'inscription</li><li>On ne vérifie PAS la longueur du mot de passe : le hash est déjà stocké</li><li>On vérifie juste que ce sont des chaînes non vides</li></ul><div style='background: #d1ecf1; border-left: 4px solid #0c5460; padding: 0.8rem; border-radius: 4px; margin-top: 1rem;'><strong>💡 Logique :</strong> un vieux compte peut avoir un mot de passe de 6 caractères. Refuser sa connexion serait injuste.</div></div>",
    "texteParle": "Créons le DTO LoginDto, dans le fichier src/auth/dto/login.dto.ts. Il est volontairement très simple : deux champs, phone_number et password, tous deux des chaînes non vides. Pourquoi ne pas valider le format du téléphone ? Parce que la validation du format est faite à l'inscription. Une fois qu'un utilisateur existe, son numéro est valide, par définition. Revalider à chaque connexion serait redondant et pourrait créer des faux positifs. Pourquoi ne pas valider la longueur du mot de passe ? Pour la même raison. Un utilisateur qui s'est inscrit il y a deux ans avec un mot de passe de six caractères doit pouvoir se connecter. Si on validait une longueur minimale de huit à chaque connexion, il serait bloqué, ce qui serait injuste. Donc à la connexion, on fait une validation minimale : ce sont des chaînes, elles ne sont pas vides. Le travail réel de vérification est fait par le AuthService : comparer le mot de passe avec le hash, vérifier que l'utilisateur existe, etc. La validation de surface est minimale, la sécurité est dans la logique. C'est un principe important : validez au bon niveau, pas partout.",
    "note": "La validation d'entrée à la connexion doit être minimale. La sécurité est dans la vérification métier."
  },
  {
    "titre": "Le DTO ResetPasswordDto",
    "contenu": "<div style='background: #f8f9fa; padding: 1rem; border-radius: 12px; border-left: 6px solid #dc3545;'><p style='color: #333;'>Créons <code>src/auth/dto/reset-password.dto.ts</code> :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.7rem; line-height: 1.6; white-space: pre;'>import { IsString, IsNotEmpty, MinLength, Matches, Length } from 'class-validator';<br><br>export class ResetPasswordDto {<br>&nbsp;&nbsp;@IsString()<br>&nbsp;&nbsp;@IsNotEmpty()<br>&nbsp;&nbsp;phone_number!: string;<br><br>&nbsp;&nbsp;@IsString()<br>&nbsp;&nbsp;@IsNotEmpty()<br>&nbsp;&nbsp;@Length(6, 6, { message: 'Le code OTP doit contenir exactement 6 chiffres' })<br>&nbsp;&nbsp;otp!: string;<br><br>&nbsp;&nbsp;@IsString()<br>&nbsp;&nbsp;@IsNotEmpty()<br>&nbsp;&nbsp;@Matches(<br>&nbsp;&nbsp;&nbsp;&nbsp;/^(?=.*[A-Z])(?=.*[0-9]).{8,}$/,<br>&nbsp;&nbsp;&nbsp;&nbsp;{ message: 'Le mot de passe doit contenir au moins 8 caractères, une majuscule et un chiffre' },<br>&nbsp;&nbsp;)<br>&nbsp;&nbsp;new_password!: string;<br>}</div></div>",
    "texteParle": "Créons maintenant le DTO ResetPasswordDto, dans le fichier src/auth/dto/reset-password.dto.ts. Ce DTO est utilisé quand un utilisateur oublie son mot de passe et souhaite le réinitialiser. Il contient trois champs : phone_number, otp, et new_password. phone_number : une chaîne non vide. otp : une chaîne non vide, exactement six caractères. new_password : c'est ici que ça devient intéressant. On utilise un seul décorateur Matches, mais avec une expression régulière complexe. Regardons-la : elle utilise deux lookaheads. Le premier, point d'interrogation égale point étoile A-Z, vérifie qu'il y a au moins une majuscule quelque part dans la chaîne. Le second, point d'interrogation égale point étoile zéro-tiret-neuf, vérifie qu'il y a au moins un chiffre quelque part. Enfin, point avec accolades huit virgule, exige une longueur d'au moins huit caractères. Cette expression unique remplace trois décorateurs séparés. C'est plus compact. Le message d'erreur résume tout : 'Le mot de passe doit contenir au moins 8 caractères, une majuscule et un chiffre'. C'est explicite et utile. Cette regex est un peu ardue à lire, mais elle est très efficace. Vous la retrouverez dans beaucoup de projets.",
    "note": "Les regex à lookahead permettent de vérifier plusieurs contraintes en une seule passe."
  },
  {
    "titre": "Activer la validation globale",
    "contenu": "<div style='background: #e9ecef; padding: 1rem; border-radius: 12px;'><p style='color: #333;'>Dans <code>main.ts</code>, activons le ValidationPipe :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.72rem; line-height: 1.6; white-space: pre;'>import { ValidationPipe } from '@nestjs/common';<br><br>app.useGlobalPipes(<br>&nbsp;&nbsp;new ValidationPipe({<br>&nbsp;&nbsp;&nbsp;&nbsp;whitelist: true,<br>&nbsp;&nbsp;&nbsp;&nbsp;forbidNonWhitelisted: true,<br>&nbsp;&nbsp;&nbsp;&nbsp;transform: true,<br>&nbsp;&nbsp;&nbsp;&nbsp;disableErrorMessages: false,<br>&nbsp;&nbsp;}),<br>);</div><p style='color: #333; margin-top: 0.8rem;'><strong>Les options expliquées :</strong></p><ul style='padding-left: 1.2rem; color: #333; line-height: 1.8;'><li><code>whitelist</code> : supprime les champs non déclarés dans le DTO</li><li><code>forbidNonWhitelisted</code> : rejette la requête si des champs inconnus sont présents</li><li><code>transform</code> : convertit les données vers les types attendus</li><li><code>disableErrorMessages</code> : à false, garde les messages détaillés</li></ul></div>",
    "texteParle": "Nous avons créé nos DTOs. Mais comment NestJS sait qu'il doit les utiliser pour valider les requêtes ? Il faut activer le ValidationPipe globalement, dans le fichier main.ts. C'est une ligne de code très simple, mais qui a un impact énorme. Regardons les quatre options. La première, whitelist à true. Cela signifie que tous les champs qui ne sont pas déclarés dans le DTO seront automatiquement supprimés de l'objet. Si un utilisateur envoie un champ supplémentaire, il est ignoré. C'est une première couche de sécurité. La deuxième, forbidNonWhitelisted à true. Plus stricte : si un champ inconnu est présent, la requête est rejetée avec une erreur 400. Cela force le client à utiliser les bons champs. C'est plus sécurisé, mais aussi plus strict. Pour SawaMart, on choisit cette option. La troisième, transform à true. Cela permet à class-transformer de convertir les données. Par exemple, si un DTO déclare un champ de type number mais que le client envoie une chaîne, class-transformer convertit automatiquement. C'est très utile. La quatrième, disableErrorMessages à false. Cela garde les messages d'erreur détaillés dans la réponse. En production, on pourrait les désactiver pour ne pas révéler la structure interne, mais pour l'instant, on les garde. Ces quatre options forment la configuration standard d'un ValidationPipe. Une fois activé, tous les endpoints protégés par un DTO seront validés automatiquement.",
    "note": "forbidNonWhitelisted à true est plus strict. Assurez-vous que votre client mobile n'envoie pas de champs superflus."
  },
  {
    "titre": "Comment la validation fonctionne",
    "contenu": "<div style='background: #f8f9fa; padding: 1rem; border-radius: 12px; border-left: 6px solid #2a5298;'><p style='color: #333;'>Voici le flux d'une requête avec validation :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.7rem; line-height: 1.8; white-space: pre;'>1. Client envoie POST /auth/login<br>&nbsp;&nbsp;&nbsp;{ phone_number: '...', password: '...' }<br><br>2. NestJS reçoit la requête brute<br><br>3. ValidationPipe :<br>&nbsp;&nbsp;&nbsp;→ class-transformer crée une instance de LoginDto<br>&nbsp;&nbsp;&nbsp;→ class-validator applique les décorateurs<br>&nbsp;&nbsp;&nbsp;→ Si erreur : <span style='color: #f87171;'>400 Bad Request</span><br>&nbsp;&nbsp;&nbsp;→ Sinon : passe au contrôleur<br><br>4. Contrôleur reçoit un <span style='color: #34d399;'>LoginDto valide</span></div><p style='color: #555; font-size: 0.9rem; margin-top: 0.8rem;'>💡 Le contrôleur n'a jamais à valider manuellement. C'est automatique.</p></div>",
    "texteParle": "Comprendre comment la validation fonctionne en interne vous aidera à mieux l'utiliser. Voici le flux d'une requête avec validation. Étape une : le client envoie une requête POST sur /auth/login, avec un objet JSON contenant phone_number et password. Étape deux : NestJS reçoit la requête brute, avec le body sous forme d'objet JavaScript. Étape trois : le ValidationPipe entre en jeu. D'abord, class-transformer crée une instance de LoginDto à partir de l'objet brut. C'est crucial : la validation a besoin d'instances pour fonctionner. Puis class-validator applique chaque décorateur sur chaque champ. Si une validation échoue, par exemple phone_number manquant, une erreur 400 Bad Request est retournée avec un message détaillé. Sinon, la validation passe. Étape quatre : le contrôleur reçoit un objet LoginDto validé, avec tous les champs corrects. Il peut travailler en toute confiance, sans se soucier de la validation. C'est un gain énorme : le code du contrôleur et du service est dédié au métier, pas à la validation. C'est la séparation des responsabilités. Vous verrez souvent ce pattern dans les projets NestJS professionnels.",
    "note": "Le contrôleur ne valide jamais. Il reçoit des données garanties valides. C'est le rôle du Pipe."
  },
  {
    "titre": "Résumé et prochaine étape",
    "contenu": "<div style='background: linear-gradient(135deg, #1e3c72, #2a5298); color: white; padding: 2rem; border-radius: 15px; text-align: center;'><h3 style='color: #fff;'>🎉 Validation maîtrisée !</h3><p style='color: #e0e0e0;'>Vos endpoints sont maintenant protégés.</p><hr style='border-color: #4a7db0; width: 50%;'><p style='color: #f0f0f0; margin-bottom: 0.5rem;'>Ce que nous avons appris :</p><ul style='text-align: left; padding-left: 1.5rem; color: #f0f0f0; line-height: 1.8;'><li>✅ Concept de DTO : Data Transfer Object</li><li>✅ Pourquoi la validation est cruciale</li><li>✅ Installation de class-validator et class-transformer</li><li>✅ Création de 5 DTOs (SendOtp, CreateUser, VerifyOtp, Login, ResetPassword)</li><li>✅ Les décorateurs de validation essentiels</li><li>✅ Le ValidationPipe global avec ses options</li><li>✅ Comment la validation fonctionne en interne</li></ul><p style='color: #f0f0f0; margin-top: 1rem;'>👉 <strong>Prochaine leçon :</strong> Hachage des mots de passe avec bcrypt</p></div>",

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentIndex = 0;
    let isSpeaking = false;
    let isPaused = false;
    let currentUtterance = null;
    let isLoading = false;
    let loadingTimeout = null;
    let isTransitioning = false;
    let speechSupported = true;
    let userInteracted = false;
    let isPlaying = false;
    let loadingCancelled = false;

    const total = slides.length;
    const synth = window.speechSynthesis;

    // Références jQuery
    const $title = $('#slideTitle');
    const $body = $('#slideBody');
    const $counter = $('#slideCounter');
    const $statusText = $('#statusText');
    const $statusBadge = $('#statusBadge');
    const $loading = $('#loadingOverlay');
    const $loadingText = $('#loadingText');
    const $loadingSub = $('#loadingSub');
    const $loadingTimeout = $('#loadingTimeout');
    const $loadingProgressBar = $('#loadingProgressBar');
    const $autoIndicator = $('#autoIndicator');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $replay = $('#replayBtn');
    const $play = $('#playBtn');
    const $cancelLoading = $('#cancelLoadingBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function setStatus(text, type) {
        $statusText.text(text);
        $statusBadge.removeClass('idle speaking error paused waiting loading');
        if (type === 'speaking') $statusBadge.addClass('speaking');
        else if (type === 'error') $statusBadge.addClass('error');
        else if (type === 'paused') $statusBadge.addClass('paused');
        else if (type === 'waiting') $statusBadge.addClass('waiting');
        else if (type === 'loading') $statusBadge.addClass('loading');
        else $statusBadge.addClass('idle');
    }

    function updatePlayButton() {
        if (isPlaying) {
            $play.addClass('playing');
            $play.find('.btn-icon').text('⏸');
            $play.find('.btn-label').text('Pause');
        } else {
            $play.removeClass('playing');
            $play.find('.btn-icon').text('▶');
            $play.find('.btn-label').text('Play');
        }
    }

    function showLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        
        loadingCancelled = false;
        isLoading = true;
        
        // Réinitialiser la barre de progression
        $loadingProgressBar.css('animation', 'none');
        $loadingProgressBar.css('width', '0%');
        // Forcer un reflow
        $loadingProgressBar[0].offsetHeight;
        $loadingProgressBar.css('animation', 'loadingProgress 30s ease-out forwards');
        
        $loadingText.text('Préparation vocale...');
        $loadingSub.text('Synthèse en cours');
        $loadingTimeout.text('⏱️ 30 secondes maximum');
        $loading.fadeIn(300);
        setStatus("⏳ Chargement...", 'loading');
        
        // 🔥 TIMEOUT DE 30 SECONDES
        loadingTimeout = setTimeout(() => {
            if (isLoading && !loadingCancelled) {
                hideLoading();
                setStatus("⚠️ Délai dépassé (30s)", 'error');
                isPlaying = false;
                updatePlayButton();
                $loadingSub.text('La synthèse vocale a pris trop de temps');
                $loadingTimeout.text('❌ Délai dépassé');
            }
        }, 30000);
    }

    function hideLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        isLoading = false;
        loadingCancelled = false;
        $loading.fadeOut(300);
        // Ne pas changer le statut si on est en train de parler
        if (!isSpeaking && !isPlaying) {
            setStatus("⏸ Lecture arrêtée", 'paused');
        }
    }

    function cancelLoading() {
        loadingCancelled = true;
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        hideLoading();
        stopSpeaking();
        setStatus("⏸ Annulé", 'paused');
        isPlaying = false;
        updatePlayButton();
        $loadingText.text('Annulé par l\'utilisateur');
        $loadingSub.text('Vous pouvez réessayer');
        $loadingTimeout.text('✕ Annulation');
    }

    // Arrêter la parole proprement
    function stopSpeaking() {
        try {
            if (synth && (synth.speaking || synth.pending)) {
                synth.cancel();
            }
        } catch(e) {
            console.warn('Erreur stopSpeaking:', e);
        }
        if (currentUtterance) {
            try {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance.onstart = null;
            } catch(e) {}
            currentUtterance = null;
        }
        isSpeaking = false;
        isPlaying = false;
        updatePlayButton();
    }

    // Mettre en pause la parole
    function pauseSpeaking() {
        try {
            if (synth && synth.speaking) {
                synth.pause();
                isPaused = true;
                isPlaying = false;
                setStatus("⏸ Lecture en pause", 'paused');
                updatePlayButton();
            }
        } catch(e) {
            console.warn('Erreur pauseSpeaking:', e);
            stopSpeaking();
        }
    }

    // Reprendre la parole
    function resumeSpeaking() {
        try {
            if (synth && synth.paused) {
                synth.resume();
                isPaused = false;
                isPlaying = true;
                setStatus("🔊 Lecture en cours", 'speaking');
                updatePlayButton();
            } else if (!isSpeaking && !synth.speaking && !synth.pending) {
                speakSlide(currentIndex);
            }
        } catch(e) {
            console.warn('Erreur resumeSpeaking:', e);
            speakSlide(currentIndex);
        }
    }

    function renderSlide(index) {
        const slide = slides[index];
        $title.text(slide.titre);

        let html = '';
        html += `<div class="content-card">${slide.contenu}</div>`;
        if (slide.note) {
            html += `<div class="note-box">${slide.note}</div>`;
        }
        $body.html(html);
        $counter.text(`${index+1} / ${total}`);

        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
        }
    }

    // ================================================================
    // LECTURE VOCALE
    // ================================================================
    function speakSlide(index) {
        return new Promise((resolve) => {
            const slide = slides[index];
            const text = slide.texteParle;
            
            if (!text || text.trim() === '' || !speechSupported) {
                resolve();
                return;
            }

            if (!window.speechSynthesis) {
                setStatus("❌ Synthèse vocale non supportée", 'error');
                speechSupported = false;
                resolve();
                return;
            }

            // Arrêter toute lecture en cours
            stopSpeaking();
            
            // Réinitialiser l'état de pause
            isPaused = false;
            
            showLoading();
            setStatus("Initialisation...", 'loading');

            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.92;
                utterance.pitch = 1.05;
                utterance.volume = 1;

                let isFinished = false;
                let errorHandled = false;

                utterance.onstart = function() {
                    if (loadingCancelled) {
                        stopSpeaking();
                        resolve();
                        return;
                    }
                    hideLoading();
                    isSpeaking = true;
                    isPlaying = true;
                    isPaused = false;
                    setStatus("🔊 Lecture en cours", 'speaking');
                    updatePlayButton();
                };

                utterance.onend = function() {
                    if (isFinished) return;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    setStatus("✅ Terminé", 'idle');
                    hideLoading();
                    updatePlayButton();
                    resolve();
                };

                utterance.onerror = function(e) {
                    if (isFinished || errorHandled) return;
                    errorHandled = true;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    hideLoading();
                    updatePlayButton();
                    
                    if (e.error === 'not-allowed') {
                        setStatus("⚠️ Permission refusée", 'error');
                    } else if (e.error === 'synthesis-unavailable') {
                        setStatus("⚠️ Synthèse indisponible", 'error');
                    } else if (e.error === 'canceled') {
                        setStatus("⏸ Annulé", 'paused');
                    } else {
                        setStatus("❌ Erreur audio: " + (e.error || 'inconnue'), 'error');
                    }
                    
                    resolve();
                };

                // Gestion du chargement des voix
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = function() {
                        if (!loadingCancelled) {
                            try {
                                synth.speak(utterance);
                            } catch(err) {
                                // Silencieux
                            }
                        }
                        synth.onvoiceschanged = null;
                    };
                }

                currentUtterance = utterance;
                
                if (!loadingCancelled) {
                    try {
                        synth.speak(utterance);
                    } catch(err) {
                        setTimeout(() => {
                            if (!loadingCancelled) {
                                try {
                                    synth.speak(utterance);
                                } catch(e) {
                                    setStatus("❌ Erreur de lecture", 'error');
                                    isPlaying = false;
                                    updatePlayButton();
                                    hideLoading();
                                    resolve();
                                }
                            } else {
                                resolve();
                            }
                        }, 100);
                    }
                } else {
                    resolve();
                }

            } catch(err) {
                hideLoading();
                setStatus("❌ Erreur générale", 'error');
                isPlaying = false;
                updatePlayButton();
                console.error('Erreur speakSlide:', err);
                resolve();
            }
        });
    }

    // ================================================================
    // NAVIGATION
    // ================================================================
    async function goToSlide(index) {
        if (isTransitioning) return;
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        
        // Si on est en train de lire, on met en pause avant de naviguer
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        // Arrêter complètement la lecture
        stopSpeaking();
        
        await new Promise(r => setTimeout(r, 50));
        
        if (index === currentIndex) {
            setStatus("📄 Slide actuel", 'idle');
            return;
        }

        isTransitioning = true;
        currentIndex = index;
        renderSlide(index);
        
        // Réinitialiser l'état de lecture
        isPlaying = false;
        updatePlayButton();
        setStatus("⏸ Lecture arrêtée", 'paused');

        await new Promise(r => setTimeout(r, 150));
        isTransitioning = false;
    }

    async function goToNext() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex + 1 < total) {
            await goToSlide(currentIndex + 1);
        } else {
            setStatus("🏁 Dernier slide", 'idle');
        }
    }

    async function goToPrev() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex - 1 >= 0) {
            await goToSlide(currentIndex - 1);
        } else {
            setStatus("🔁 Premier slide", 'idle');
        }
    }

    // ================================================================
    // GESTION PLAY/PAUSE
    // ================================================================
    function togglePlay() {
        if (!userInteracted) {
            userInteracted = true;
        }

        // Si le chargement est en cours, on l'annule
        if (isLoading) {
            cancelLoading();
            return;
        }

        // Si le synthétiseur est en pause, on reprend
        if (synth && synth.paused) {
            resumeSpeaking();
            return;
        }

        // Si la lecture est en cours, on met en pause
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
            return;
        }

        // Sinon, on démarre la lecture du slide courant
        if (!isSpeaking && !isPlaying) {
            stopSpeaking();
            speakSlide(currentIndex);
        }
    }

    // ================================================================
    // INIT
    // ================================================================
    async function init() {
        // Vérifier la compatibilité
        if (!window.speechSynthesis) {
            setStatus("❌ Synthèse vocale non supportée", 'error');
            speechSupported = false;
        }

        // Précharger les voix
        try {
            if (synth.getVoices) {
                synth.getVoices();
                setTimeout(() => {
                    try {
                        synth.getVoices();
                    } catch(e) {}
                }, 200);
            }
        } catch(e) {
            console.warn('Erreur chargement voix:', e);
        }

        // Afficher le premier slide
        renderSlide(0);
        $counter.text(`1 / ${total}`);
        
        // État initial
        setStatus("⏸ Appuie sur Play", 'paused');
        updatePlayButton();
        $autoIndicator.text('⏸ Lecture manuelle');

        // ================================================================
        // ÉVÉNEMENTS
        // ================================================================
        
        // Bouton Play/Pause
        $play.on('click', function() {
            togglePlay();
        });

        // Bouton Annuler le chargement
        $cancelLoading.on('click', function() {
            cancelLoading();
        });

        // Navigation
        $prev.on('click', function() {
            // Si chargement en cours, on annule
            if (isLoading) cancelLoading();
            goToPrev();
        });

        $next.on('click', function() {
            if (isLoading) cancelLoading();
            goToNext();
        });

        // Replay - relire le slide courant
        $replay.on('click', function() {
            if (isLoading) cancelLoading();
            stopSpeaking();
            setTimeout(() => {
                speakSlide(currentIndex);
            }, 100);
        });

        // Support du clavier (espace pour play/pause)
        $(document).on('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });

        // Nettoyage
        $(window).on('beforeunload', function() {
            try {
                if (synth.speaking) synth.cancel();
            } catch(e) {}
            hideLoading();
        });

        // Gérer les cas où la synthèse se termine de manière inattendue
        setInterval(() => {
            if (isPlaying && !synth.speaking && !synth.pending && !isPaused && !isLoading) {
                isPlaying = false;
                updatePlayButton();
                setStatus("⏸ Lecture arrêtée", 'paused');
            }
        }, 1000);
    }

    init();
});
