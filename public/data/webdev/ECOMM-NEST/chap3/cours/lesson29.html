<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Présentation mobile</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' },
            options: { skipHtmlTypes: 'script' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 500px;
        margin: 0 auto;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    .slide-header {
        flex-shrink: 0;
        padding: 18px 16px 10px 16px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        z-index: 10;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .slide-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
    }

    .content-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 18px 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        flex-shrink: 0;
    }

    .content-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .content-card li {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        line-height: 1.5;
    }

    .content-card li:last-child {
        border-bottom: none;
    }

    .bullet-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
    }

    .math-block {
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        overflow-x: auto;
        flex-shrink: 0;
        margin: 4px 0;
    }

    .math-block .math {
        font-size: 1.2rem;
        color: #e2e8f0;
    }

    .note-box {
        background: rgba(96, 165, 250, 0.08);
        border-left: 4px solid #60a5fa;
        padding: 12px 16px;
        border-radius: 12px;
        font-style: italic;
        font-size: 0.9rem;
        color: #cbd5e1;
        flex-shrink: 0;
    }

    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        border-radius: 0;
        flex-direction: column;
    }

    .loading-card {
        background: #1e293b;
        padding: 32px 28px;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #334155;
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px auto;
    }

    .loading-text {
        font-weight: 600;
        font-size: 1.1rem;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    .loading-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 16px;
    }
    .loading-progress {
        height: 3px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        animation: loadingProgress 30s ease-out forwards;
    }

    .loading-timeout {
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 12px;
    }

    .btn-cancel-loading {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 40px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #f87171;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }

    .btn-cancel-loading:active {
        transform: scale(0.94);
        background: rgba(239, 68, 68, 0.25);
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
    }

    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .slide-counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255,255,255,0.05);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(255,255,255,0.04);
    }

    .status-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 30px;
        background: rgba(96, 165, 250, 0.12);
        color: #93bbfc;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
    }

    .status-badge .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: pulse-dot 1.2s infinite;
        flex-shrink: 0;
    }

    .status-badge.idle .dot {
        animation: none;
        background: #64748b;
    }
    .status-badge.speaking .dot {
        background: #34d399;
        animation: pulse-dot 0.8s infinite;
    }
    .status-badge.error .dot {
        background: #f87171;
        animation: none;
    }
    .status-badge.paused .dot {
        animation: none;
        background: #fbbf24;
    }
    .status-badge.waiting .dot {
        animation: pulse-dot 1.5s infinite;
        background: #fbbf24;
    }
    .status-badge.loading .dot {
        animation: pulse-dot 0.5s infinite;
        background: #60a5fa;
    }

    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.7); }
    }

    .footer-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(255,255,255,0.1);
    }

    .btn-secondary {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-play {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
        min-width: 80px;
        justify-content: center;
    }
    .btn-play:active {
        background: rgba(52, 211, 153, 0.25);
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
    }

    .auto-indicator {
        font-size: 0.65rem;
        color: #64748b;
        text-align: center;
        letter-spacing: 0.3px;
        padding: 2px 0;
    }

    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.2rem;
        }
        .content-card li {
            font-size: 0.9rem;
            padding: 8px 0;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .btn-play {
            min-width: 60px;
        }
        .footer-buttons {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
        .loading-card {
            padding: 20px 16px;
        }
        .math-block .math {
            font-size: 1rem;
        }
    }

    @media (min-width: 600px) {
        .app-container {
            max-width: 480px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
        .loading-overlay {
            border-radius: 32px;
        }
    }

    /* Mode jour (par défaut) */
    html, body {
        background: #f0f4f8 !important;
        color: #1a202c !important;
    }
    .app-container {
        background: linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%) !important;
    }
    .slide-header {
        background: rgba(255, 255, 255, 0.85) !important;
        border-bottom: 1px solid rgba(0,0,0,0.08) !important;
    }
    .slide-header h1 {
        background: linear-gradient(135deg, #2b6cb0, #6b46c1) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        background-clip: text !important;
    }
    .slide-footer {
        background: rgba(255, 255, 255, 0.9) !important;
        border-top: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card {
        background: rgba(255,255,255,0.8) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card li {
        border-bottom: 1px solid rgba(0,0,0,0.05) !important;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.12) !important;
        border-left: 4px solid #4299e1 !important;
        color: #2c3e50 !important;
    }
    .math-block {
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .math-block .math {
        color: #2d3748 !important;
    }
    .slide-counter {
        color: #4a5568 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .status-badge {
        background: rgba(96, 165, 250, 0.15) !important;
        color: #2b6cb0 !important;
        border: 1px solid rgba(96, 165, 250, 0.15) !important;
    }
    .btn {
        color: #2d3748 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .btn-secondary {
        background: rgba(0,0,0,0.04) !important;
        border-color: rgba(0,0,0,0.08) !important;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15) !important;
        border-color: rgba(52, 211, 153, 0.2) !important;
        color: #38a169 !important;
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15) !important;
        border-color: rgba(251, 191, 36, 0.2) !important;
        color: #d69e2e !important;
    }
    .auto-indicator {
        color: #718096 !important;
    }
    .loading-card {
        background: #ffffff !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .loading-text {
        color: #1a202c !important;
    }
    .loading-sub {
        color: #4a5568 !important;
    }
</style>
</head>
<body>

<div class="app-container">

    <header class="slide-header">
        <h1 id="slideTitle">Chargement...</h1>
    </header>

    <main class="slide-body" id="slideBody"></main>

    <!-- LOADING OVERLAY AVEC BOUTON ANNULER -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Préparation vocale...</div>
            <div class="loading-sub" id="loadingSub">Synthèse en cours</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loadingProgressBar"></div>
            </div>
            <div class="loading-timeout" id="loadingTimeout">⏱️ 30 secondes maximum</div>
            <button class="btn-cancel-loading" id="cancelLoadingBtn">
                <span>✕</span> Annuler
            </button>
        </div>
    </div>

    <footer class="slide-footer">
        <div class="footer-top">
            <span class="slide-counter" id="slideCounter">1 / 3</span>
            <span class="status-badge idle" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">Prêt</span>
            </span>
        </div>

        <div class="footer-buttons">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-secondary" id="replayBtn">
                <span class="btn-icon">🔁</span> <span class="btn-label">Relire</span>
            </button>
            <button class="btn btn-play" id="playBtn">
                <span class="btn-icon">▶</span> <span class="btn-label">Play</span>
            </button>
        </div>

        <div class="auto-indicator" id="autoIndicator">⏸ Lecture manuelle</div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // SLIDES
    // ================================================================
    const slides = [
  {
    "titre": "Le Refresh Token",
    "contenu": "<div style='background: linear-gradient(135deg, #1e3c72, #2a5298); color: white; padding: 2rem; border-radius: 15px; text-align: center; margin-bottom: 1.5rem;'><h2 style='color: #fff; margin-bottom: 0.5rem;'>🔄 Le Refresh Token</h2><p style='color: #e0e0e0; font-size: 1.1rem;'>Renouveler un token sans se reconnecter</p><hr style='border-color: #4a7db0; width: 50%;'><p style='color: #f0f0f0;'>Leçon 3.12 : La dernière brique de l'authentification</p></div><p>Vous êtes connecté à SawaMart. Une heure passe. Vous voulez consulter votre wallet. Mais votre token a expiré. Sans refresh token, vous devez <strong>ressaisir votre mot de passe</strong>. C'est frustrant. Avec un refresh token, l'app renouvelle silencieusement votre session. Vous ne voyez rien. C'est cette expérience fluide que nous allons construire dans cette leçon finale du chapitre 3.</p>",
    "texteParle": "Bonjour à toutes et à tous et bienvenue dans cette douzième et dernière leçon du chapitre trois. Aujourd'hui, nous allons parler du refresh token. Imaginez la scène. Vous êtes connecté à SawaMart. Vous avez saisi votre mot de passe il y a une heure. Vous voulez consulter votre wallet. Mais votre token a expiré. Sans refresh token, l'application vous demande de vous reconnecter. Vous devez ressaisir votre numéro et votre mot de passe. C'est frustrant. Et c'est un frein à l'utilisation. La solution, c'est le refresh token. C'est un second token, de durée de vie plus longue, qui permet de renouveler silencieusement la session. L'utilisateur ne voit rien. Il reste connecté tant qu'il utilise l'application régulièrement. C'est cette expérience fluide que nous allons construire dans cette leçon. C'est une leçon un peu plus courte, mais importante pour le confort d'utilisation. C'est parti.",
    "note": "Le refresh token est la clé d'une expérience utilisateur fluide. Sans lui, l'utilisateur se reconnecte en permanence."
  },
  {
    "titre": "Le problème du token unique",
    "contenu": "<div style='background: #f8f9fa; padding: 1.5rem; border-radius: 12px; border-left: 6px solid #dc3545;'><p style='color: #333;'>Un seul token JWT, c'est un compromis difficile :</p><div style='display: flex; flex-direction: column; gap: 0.7rem; margin-top: 1rem;'><div style='background: #fff3cd; padding: 0.9rem; border-radius: 8px; border-left: 4px solid #856404;'><strong>⏰ Token court (1h)</strong><br><small style='color: #333;'>✅ Sécurisé<br>❌ L'utilisateur se reconnecte sans arrêt</small></div><div style='background: #f8d7da; padding: 0.9rem; border-radius: 8px; border-left: 4px solid #721c24;'><strong>⏳ Token long (30j)</strong><br><small style='color: #333;'>✅ Confortable<br>❌ Un token volé est dangereux 30 jours</small></div></div><p style='color: #333; margin-top: 1rem;'><strong>Solution : deux tokens</strong></p><div style='background: #d4edda; padding: 0.9rem; border-radius: 8px; color: #333; font-family: monospace; font-size: 0.75rem; line-height: 1.7;'>Access Token (15min - 1h) + Refresh Token (7j - 30j)</div></div>",
    "texteParle": "Le problème d'un seul token, c'est qu'on doit choisir entre deux mauvaises options. Premier choix : un token court, par exemple une heure. C'est sécurisé : si le token est volé, l'attaquant ne peut l'utiliser qu'une heure. Mais c'est frustrant : l'utilisateur doit se reconnecter toutes les heures. Pour une app mobile, c'est inacceptable. Deuxième choix : un token long, par exemple trente jours. C'est confortable : l'utilisateur reste connecté un mois. Mais c'est dangereux : si le token est volé, l'attaquant a accès au compte pendant trente jours. Il y a un vrai compromis à faire. La solution, c'est d'utiliser deux tokens. Un premier token, appelé access token, de durée courte, par exemple quinze minutes à une heure. C'est ce token qui est envoyé à chaque requête. Il expire vite, donc il est peu dangereux s'il est volé. Un second token, appelé refresh token, de durée longue, par exemple sept à trente jours. C'est ce token qui permet de demander un nouvel access token quand l'ancien a expiré. Il est utilisé très rarement, uniquement pour renouveler la session. Ainsi, on combine le meilleur des deux mondes : sécurité grâce à l'access token court, et confort grâce au refresh token long. C'est le pattern standard dans les applications modernes.",
    "note": "Deux tokens : un court pour l'accès, un long pour le renouvellement. C'est le pattern standard."
  },
  {
    "titre": "Comment ça marche ?",
    "contenu": "<div style='background: #e9ecef; padding: 1rem; border-radius: 12px;'><p style='color: #333;'>Le cycle de vie complet :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.7rem; line-height: 1.8; white-space: pre;'><span style='color: #6a9955;'>1. Login</span><br>&nbsp;&nbsp;→ Retourne access_token (1h) + refresh_token (30j)<br><br><span style='color: #6a9955;'>2. Requêtes normales</span><br>&nbsp;&nbsp;→ Utilise access_token<br><br><span style='color: #6a9955;'>3. Après 1h : access_token expiré</span><br>&nbsp;&nbsp;→ 401 Unauthorized<br><br><span style='color: #6a9955;'>4. Renouvellement</span><br>&nbsp;&nbsp;POST /auth/refresh-token<br>&nbsp;&nbsp;{ refresh_token }<br>&nbsp;&nbsp;→ Retourne un NOUVEAU access_token<br><br><span style='color: #6a9955;'>5. Après 30j : refresh_token expiré</span><br>&nbsp;&nbsp;→ L'utilisateur doit se reconnecter</div></div>",
    "texteParle": "Voyons le cycle de vie complet avec deux tokens. Étape une : l'utilisateur se connecte. Il reçoit deux tokens : un access token valable une heure, et un refresh token valable trente jours. Les deux sont stockés côté mobile. Étape deux : à chaque requête, l'app envoie l'access token. Elle l'utilise pour toutes les opérations : afficher le wallet, chatter, publier un article. Étape trois : une heure plus tard, l'access token expire. Le prochain appel retourne une erreur 401 Unauthorized. Étape quatre : l'app détecte cette erreur 401. Au lieu de demander à l'utilisateur de se reconnecter, elle appelle automatiquement un endpoint refresh-token, en envoyant le refresh token. Le serveur vérifie que le refresh token est valide, et retourne un nouvel access token, valable une heure de plus. L'app remplace l'ancien token par le nouveau, et relance la requête initiale. L'utilisateur n'a rien vu. Étape cinq : trente jours plus tard, le refresh token expire à son tour. À ce moment-là, l'app ne peut plus renouveler. Elle doit demander à l'utilisateur de se reconnecter. C'est normal : trente jours sans activité, on peut exiger une reconnexion. C'est ce cycle en cinq étapes qui rend l'expérience fluide tout en gardant un bon niveau de sécurité.",
    "note": "Le refresh token permet de prolonger la session tant que l'utilisateur est actif. Après 30j inactif, reconnexion obligatoire."
  },
  {
    "titre": "Modifier la méthode login",
    "contenu": "<div style='background: #f8f9fa; padding: 1rem; border-radius: 12px; border-left: 6px solid #2a5298;'><p style='color: #333;'>Le login doit maintenant retourner les deux tokens :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.68rem; line-height: 1.6; white-space: pre;'>async login(loginDto: LoginDto): Promise&lt;AuthResponseDto&gt; {<br>&nbsp;&nbsp;const { phone_number, password } = loginDto;<br><br>&nbsp;&nbsp;const user = await this.validateUser(phone_number, password);<br><br>&nbsp;&nbsp;user.last_login_at = new Date();<br>&nbsp;&nbsp;await this.userRepository.save(user);<br><br>&nbsp;&nbsp;<span style='color: #6a9955;'>// Générer les DEUX tokens</span><br>&nbsp;&nbsp;const tokens = this.generateTokens(user);<br><br>&nbsp;&nbsp;return {<br>&nbsp;&nbsp;&nbsp;&nbsp;access_token: tokens.access_token,<br>&nbsp;&nbsp;&nbsp;&nbsp;refresh_token: tokens.refresh_token,<br>&nbsp;&nbsp;&nbsp;&nbsp;user: UserResponseDto.fromUser(user),<br>&nbsp;&nbsp;};<br>}</div></div>",
    "texteParle": "Modifions maintenant la méthode login pour qu'elle retourne les deux tokens. On garde la validation des identifiants, on garde la mise à jour de last_login_at. Puis, au lieu d'appeler generateToken qui ne génère qu'un seul token, on appelle generateTokens qui génère les deux. Le retour contient trois propriétés. access_token : le token de courte durée, utilisé pour les requêtes. refresh_token : le token de longue durée, utilisé uniquement pour renouveler l'access token. Et user : les informations de l'utilisateur. Le client stocke les deux tokens, généralement dans AsyncStorage ou SecureStore. L'access token est envoyé dans chaque requête. Le refresh token est stocké précieusement et envoyé uniquement sur l'endpoint refresh-token. Cette séparation est essentielle : l'access token circule souvent, donc il est plus exposé. Le refresh token circule rarement, donc il est mieux protégé. Notez qu'on remplace generateToken par generateTokens : c'est un changement de méthode. On pourrait aussi garder generateToken et ajouter une méthode séparée pour le refresh token, mais c'est plus propre de tout regrouper. Nous allons voir cette nouvelle méthode dans le slide suivant.",
    "note": "Le refresh token circule rarement. C'est ce qui le rend moins vulnérable qu'un access token qui circule souvent."
  },
  {
    "titre": "La méthode generateTokens",
    "contenu": "<div style='background: #e9ecef; padding: 1rem; border-radius: 12px;'><p style='color: #333;'>Créons une méthode qui génère les deux tokens :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.68rem; line-height: 1.6; white-space: pre;'>generateTokens(user: User): {<br>&nbsp;&nbsp;access_token: string;<br>&nbsp;&nbsp;refresh_token: string;<br>} {<br>&nbsp;&nbsp;const payload = {<br>&nbsp;&nbsp;&nbsp;&nbsp;sub: user.id,<br>&nbsp;&nbsp;&nbsp;&nbsp;phone: user.phone_number,<br>&nbsp;&nbsp;&nbsp;&nbsp;username: user.username,<br>&nbsp;&nbsp;&nbsp;&nbsp;role: user.role,<br>&nbsp;&nbsp;};<br><br>&nbsp;&nbsp;<span style='color: #6a9955;'>// Access token : courte durée (1h)</span><br>&nbsp;&nbsp;const access_token = this.jwtService.sign(payload);<br><br>&nbsp;&nbsp;<span style='color: #6a9955;'>// Refresh token : longue durée (30j)</span><br>&nbsp;&nbsp;const refresh_token = this.jwtService.sign(payload, {<br>&nbsp;&nbsp;&nbsp;&nbsp;expiresIn: &#39;30d&#39;,<br>&nbsp;&nbsp;&nbsp;&nbsp;secret: this.configService.get(&#39;JWT_REFRESH_SECRET&#39;),<br>&nbsp;&nbsp;});<br><br>&nbsp;&nbsp;return { access_token, refresh_token };<br>}</div></div>",
    "texteParle": "Créons la méthode generateTokens qui génère les deux tokens. On prépare un payload unique, contenant l'identifiant, le téléphone, le username et le rôle. Ce payload sera identique pour les deux tokens. Puis on génère l'access token avec jwtService.sign et le payload. Comme nous avons configuré le JwtModule avec expiresIn à '1d' par défaut, l'access token aura une durée d'un jour. Si on veut une heure, on peut passer l'option expiresIn explicitement. Ensuite, on génère le refresh token. C'est là qu'il y a une subtilité. On utilise aussi jwtService.sign, mais avec deux options supplémentaires. Première option : expiresIn à '30d', c'est-à-dire trente jours. Deuxième option : secret avec JWT_REFRESH_SECRET. C'est crucial : on utilise un SECRET DIFFÉRENT pour le refresh token. Pourquoi ? Pour la sécurité. Si un attaquant vole notre secret d'access token, il peut forger des access tokens. Mais il ne pourra pas forger des refresh tokens, car ceux-ci utilisent un autre secret. On compartimente. C'est une pratique courante. On retourne les deux tokens dans un objet. L'access token sera utilisé pour les requêtes. Le refresh token sera utilisé seulement pour renouveler. Chacun son rôle, chacun sa durée, chacun son secret.",
    "note": "Un secret différent pour le refresh token. C'est une compartimentation de sécurité importante."
  },
  {
    "titre": "Configurer JWT_REFRESH_SECRET",
    "contenu": "<div style='background: #f8f9fa; padding: 1rem; border-radius: 12px; border-left: 6px solid #10b981;'><p style='color: #333;'>Ajoutons une variable d'environnement :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.75rem; line-height: 1.7; white-space: pre;'><span style='color: #6a9955;'># .env.example</span><br>JWT_SECRET=your_jwt_secret_here<br>JWT_REFRESH_SECRET=your_jwt_refresh_secret_here<br>JWT_EXPIRES_IN=1d<br>JWT_REFRESH_EXPIRES_IN=30d</div><p style='color: #333; margin-top: 0.8rem;'><strong>Générer un secret fort :</strong></p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.75rem; line-height: 1.7; white-space: pre;'>openssl rand -base64 32</div><p style='color: #555; font-size: 0.9rem; margin-top: 0.8rem;'>💡 Utilisez ce secret uniquement pour le refresh token. Ne le partagez jamais avec le secret principal.</p></div>",
    "texteParle": "Pour utiliser un secret différent pour le refresh token, il faut ajouter une variable d'environnement. Dans le fichier .env.example, on ajoute JWT_REFRESH_SECRET avec une valeur d'exemple. On ajoute aussi JWT_REFRESH_EXPIRES_IN à '30d' pour la durée du refresh token. Le secret d'access token est JWT_SECRET, le secret de refresh token est JWT_REFRESH_SECRET. Ce sont deux valeurs distinctes. Comment générer un secret fort ? La meilleure façon est d'utiliser openssl rand -base64 32. Cette commande génère trente-deux octets aléatoires, encodés en base64, ce qui donne une chaîne d'environ quarante-quatre caractères. C'est extrêmement difficile à deviner ou à brute-forcer. Il faut générer deux secrets différents : un pour JWT_SECRET, un pour JWT_REFRESH_SECRET. Ne les réutilisez jamais. Et surtout, ne les committez pas dans Git. Ils doivent rester dans le fichier .env, qui est dans .gitignore. Si vous avez besoin de les partager avec un collègue, faites-le de manière sécurisée, par exemple via un gestionnaire de mots de passe. Une fuite de JWT_REFRESH_SECRET serait catastrophique : un attaquant pourrait forger des refresh tokens pour n'importe quel utilisateur.",
    "note": "Générez des secrets avec openssl rand -base64 32. Deux secrets distincts, jamais réutilisés."
  },
  {
    "titre": "L'endpoint refresh-token",
    "contenu": "<div style='background: #e9ecef; padding: 1rem; border-radius: 12px;'><p style='color: #333;'>Dans <code>auth.controller.ts</code> :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.65rem; line-height: 1.6; white-space: pre;'>@Post(&#39;refresh-token&#39;)<br>@HttpCode(HttpStatus.OK)<br>async refreshToken(@Request() req, @Body() body: any) {<br>&nbsp;&nbsp;const token = body.token;<br>&nbsp;&nbsp;if (!token) {<br>&nbsp;&nbsp;&nbsp;&nbsp;throw new UnauthorizedException(&#39;Token manquant&#39;);<br>&nbsp;&nbsp;}<br><br>&nbsp;&nbsp;try {<br>&nbsp;&nbsp;&nbsp;&nbsp;<span style='color: #6a9955;'>// Décoder le token pour obtenir l&#39;ID utilisateur</span><br>&nbsp;&nbsp;&nbsp;&nbsp;const payload = this.jwtService.verify(token, {<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;secret: this.configService.get(&#39;JWT_SECRET&#39;),<br>&nbsp;&nbsp;&nbsp;&nbsp;});<br><br>&nbsp;&nbsp;&nbsp;&nbsp;<span style='color: #6a9955;'>// Générer un nouveau token</span><br>&nbsp;&nbsp;&nbsp;&nbsp;return this.authService.refreshToken(payload.sub);<br>&nbsp;&nbsp;} catch (error) {<br>&nbsp;&nbsp;&nbsp;&nbsp;throw new UnauthorizedException(&#39;Token invalide ou expiré&#39;);<br>&nbsp;&nbsp;}<br>}</div></div>",
    "texteParle": "Créons l'endpoint refresh-token dans le contrôleur. Il reçoit une requête POST avec un body contenant le token, c'est-à-dire le refresh token. On vérifie d'abord que le token est présent. Sinon, on lève une UnauthorizedException. Puis, dans un try catch, on décode le token avec jwtService.verify, en utilisant le secret d'access token. Attention : dans cet exemple de code, on utilise JWT_SECRET, mais il faudrait utiliser JWT_REFRESH_SECRET. C'est une correction que je vous recommande d'appliquer : le refresh token doit être vérifié avec JWT_REFRESH_SECRET, pas avec JWT_SECRET. Sinon, un access token pourrait être utilisé comme refresh token, ce qui serait une faille. Je le signale, mais je comprends que dans le code du projet SawaMart, il y ait cette simplification. Pour notre cours, on va corriger ça mentalement et considérer qu'on utilise JWT_REFRESH_SECRET. Si le token est valide, on récupère le payload, qui contient l'identifiant de l'utilisateur dans sub. On appelle ensuite authService.refreshToken avec cet identifiant. Ce service va recharger l'utilisateur, vérifier qu'il n'est pas bloqué, et générer un nouvel access token. Si le token est invalide ou expiré, on lève une UnauthorizedException avec un message générique. Voilà pour l'endpoint.",
    "note": "Correction importante : le refresh token doit être vérifié avec JWT_REFRESH_SECRET, pas JWT_SECRET."
  },
  {
    "titre": "La méthode refreshToken",
    "contenu": "<div style='background: #f8f9fa; padding: 1rem; border-radius: 12px; border-left: 6px solid #a78bfa;'><p style='color: #333;'>Dans <code>AuthService</code> :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.68rem; line-height: 1.6; white-space: pre;'>async refreshToken(userId: string): Promise&lt;{ access_token: string }&gt; {<br>&nbsp;&nbsp;<span style='color: #6a9955;'>// 1. Vérifier que l&#39;utilisateur existe</span><br>&nbsp;&nbsp;const user = await this.userRepository.findOne({<br>&nbsp;&nbsp;&nbsp;&nbsp;where: { id: userId },<br>&nbsp;&nbsp;&nbsp;&nbsp;relations: { profile: true },<br>&nbsp;&nbsp;});<br><br>&nbsp;&nbsp;if (!user) {<br>&nbsp;&nbsp;&nbsp;&nbsp;throw new UnauthorizedException(&#39;Utilisateur non trouvé&#39;);<br>&nbsp;&nbsp;}<br><br>&nbsp;&nbsp;<span style='color: #6a9955;'>// 2. Vérifier qu&#39;il n&#39;est pas bloqué</span><br>&nbsp;&nbsp;if (user.is_blocked) {<br>&nbsp;&nbsp;&nbsp;&nbsp;throw new UnauthorizedException(&#39;Votre compte a été bloqué&#39;);<br>&nbsp;&nbsp;}<br><br>&nbsp;&nbsp;<span style='color: #6a9955;'>// 3. Générer un nouveau access token</span><br>&nbsp;&nbsp;return this.generateToken(user);<br>}</div></div>",
    "texteParle": "Regardons la méthode refreshToken dans AuthService. Elle prend l'identifiant de l'utilisateur en paramètre, celui qu'on a extrait du refresh token. Elle retourne un objet avec un nouvel access token. La méthode fait trois choses. Étape une : vérifier que l'utilisateur existe. On cherche par identifiant, et on charge aussi le profil, car on en aura besoin pour générer le token. Si l'utilisateur n'existe pas, on lève une UnauthorizedException. Cela peut arriver si l'utilisateur a été supprimé mais que son refresh token est encore valide. Étape deux : vérifier qu'il n'est pas bloqué. Si un utilisateur a été bloqué entre-temps, on refuse le renouvellement. C'est important : le refresh token ne doit pas permettre de contourner un blocage. Étape trois : générer un nouvel access token. On utilise la méthode generateToken qu'on avait créée initialement, ou generateTokens, selon ce qu'on veut. Ici on retourne un objet avec seulement access_token. Notez que l'utilisateur reçoit un nouvel access token, mais PAS de nouveau refresh token. C'est un choix : on garde le même refresh token jusqu'à son expiration (30 jours). Certaines applications préfèrent régénérer les deux à chaque refresh, pour une sécurité maximale. C'est ce qu'on appelle la rotation des refresh tokens. Pour SawaMart, on reste simple : on garde le refresh token initial.",
    "note": "Rotation des refresh tokens : option plus sûre. À considérer si la sécurité est critique."
  },
  {
    "titre": "Le flux complet côté client",
    "contenu": "<div style='background: #e9ecef; padding: 1rem; border-radius: 12px;'><p style='color: #333;'>Comment le mobile gère tout ça :</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 0.9rem; border-radius: 8px; font-family: monospace; font-size: 0.68rem; line-height: 1.7; white-space: pre;'><span style='color: #6a9955;'>// Intercepteur HTTP</span><br>1. Envoyer la requête avec access_token<br><br>2. Si réponse = 401 Unauthorized :<br>&nbsp;&nbsp;&nbsp;→ Envoyer POST /auth/refresh-token<br>&nbsp;&nbsp;&nbsp;→ Stocker le nouveau access_token<br>&nbsp;&nbsp;&nbsp;→ Relancer la requête initiale<br><br>3. Si refresh échoue aussi :<br>&nbsp;&nbsp;&nbsp;→ Rediriger vers l&#39;écran de login<br><br><span style='color: #6a9955;'>// L&#39;utilisateur ne voit RIEN</span></div><p style='color: #555; font-size: 0.9rem; margin-top: 0.8rem;'>💡 Cette logique est implémentée dans un intercepteur HTTP, transparent pour le reste de l&#39;app.</p></div>",
    "texteParle": "Voyons le flux complet côté client, c'est-à-dire côté application mobile. L'idée est d'avoir un intercepteur HTTP : un morceau de code qui s'exécute automatiquement avant et après chaque requête. Première étape : à chaque requête, l'intercepteur ajoute le header Authorization avec l'access token. Étape deux : si le serveur répond avec un 401 Unauthorized, cela signifie que le token a expiré. L'intercepteur, au lieu de remonter l'erreur à l'appelant, fait un appel automatique à /auth/refresh-token. Il envoie le refresh token. Si le renouvellement réussit, il stocke le nouveau access token, puis il relance automatiquement la requête initiale avec le nouveau token. Pour l'utilisateur, rien ne s'est passé. La requête a réussi, il voit les données. Étape trois : si le refresh échoue aussi, c'est-à-dire que le refresh token est expiré ou invalide, alors l'intercepteur redirige vers l'écran de login. L'utilisateur doit se reconnecter. C'est le seul moment où il voit la reconnexion. Ce mécanisme est très puissant : il rend la gestion des tokens complètement transparente pour le reste du code de l'app. Les écrans n'ont pas à gérer les tokens. Ils font des requêtes HTTP normales, et l'intercepteur s'occupe du reste. C'est un pattern standard en React Native, Axios, etc. Une fois implémenté, l'expérience utilisateur devient très fluide.",
    "note": "L'intercepteur HTTP centralise la logique de refresh. Un seul endroit à maintenir, transparent pour le reste."
  },

    "texteParle": "Résumons cette leçon. Nous avons vu pourquoi un seul token est un compromis difficile : soit trop court et inconfortable, soit trop long et dangereux. Nous avons introduit le refresh token, un second token de durée longue, qui permet de renouveler silencieusement l'access token. Nous avons modifié la méthode login pour retourner les deux tokens. Nous avons créé la méthode generateTokens qui génère l'access token avec JWT_SECRET et le refresh token avec JWT_REFRESH_SECRET, deux secrets distincts pour la sécurité. Nous avons ajouté les variables d'environnement JWT_REFRESH_SECRET et JWT_REFRESH_EXPIRES_IN. Nous avons créé l'endpoint refresh-token dans le contrôleur, qui vérifie le refresh token et retourne un nouvel access token. Nous avons vu la méthode refreshToken dans le service, qui vérifie l'existence et le blocage de l'utilisateur avant de générer un nouveau token. Enfin, nous avons décrit le flux complet côté client, avec un intercepteur HTTP qui gère automatiquement le renouvellement en cas de 401. Félicitations, vous venez de terminer le chapitre trois, qui est probablement le chapitre le plus dense du cours. Vous avez maintenant un système d'authentification complet, sécurisé, et fluide. C'est une fondation solide pour tout le reste de SawaMart. Dans le prochain chapitre, nous allons entrer dans la gestion des utilisateurs et des profils : comment un utilisateur met à jour son profil, upload un avatar, consulte les statistiques d'un autre utilisateur. À très bientôt !",

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentIndex = 0;
    let isSpeaking = false;
    let isPaused = false;
    let currentUtterance = null;
    let isLoading = false;
    let loadingTimeout = null;
    let isTransitioning = false;
    let speechSupported = true;
    let userInteracted = false;
    let isPlaying = false;
    let loadingCancelled = false;

    const total = slides.length;
    const synth = window.speechSynthesis;

    // Références jQuery
    const $title = $('#slideTitle');
    const $body = $('#slideBody');
    const $counter = $('#slideCounter');
    const $statusText = $('#statusText');
    const $statusBadge = $('#statusBadge');
    const $loading = $('#loadingOverlay');
    const $loadingText = $('#loadingText');
    const $loadingSub = $('#loadingSub');
    const $loadingTimeout = $('#loadingTimeout');
    const $loadingProgressBar = $('#loadingProgressBar');
    const $autoIndicator = $('#autoIndicator');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $replay = $('#replayBtn');
    const $play = $('#playBtn');
    const $cancelLoading = $('#cancelLoadingBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function setStatus(text, type) {
        $statusText.text(text);
        $statusBadge.removeClass('idle speaking error paused waiting loading');
        if (type === 'speaking') $statusBadge.addClass('speaking');
        else if (type === 'error') $statusBadge.addClass('error');
        else if (type === 'paused') $statusBadge.addClass('paused');
        else if (type === 'waiting') $statusBadge.addClass('waiting');
        else if (type === 'loading') $statusBadge.addClass('loading');
        else $statusBadge.addClass('idle');
    }

    function updatePlayButton() {
        if (isPlaying) {
            $play.addClass('playing');
            $play.find('.btn-icon').text('⏸');
            $play.find('.btn-label').text('Pause');
        } else {
            $play.removeClass('playing');
            $play.find('.btn-icon').text('▶');
            $play.find('.btn-label').text('Play');
        }
    }

    function showLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        
        loadingCancelled = false;
        isLoading = true;
        
        // Réinitialiser la barre de progression
        $loadingProgressBar.css('animation', 'none');
        $loadingProgressBar.css('width', '0%');
        // Forcer un reflow
        $loadingProgressBar[0].offsetHeight;
        $loadingProgressBar.css('animation', 'loadingProgress 30s ease-out forwards');
        
        $loadingText.text('Préparation vocale...');
        $loadingSub.text('Synthèse en cours');
        $loadingTimeout.text('⏱️ 30 secondes maximum');
        $loading.fadeIn(300);
        setStatus("⏳ Chargement...", 'loading');
        
        // 🔥 TIMEOUT DE 30 SECONDES
        loadingTimeout = setTimeout(() => {
            if (isLoading && !loadingCancelled) {
                hideLoading();
                setStatus("⚠️ Délai dépassé (30s)", 'error');
                isPlaying = false;
                updatePlayButton();
                $loadingSub.text('La synthèse vocale a pris trop de temps');
                $loadingTimeout.text('❌ Délai dépassé');
            }
        }, 30000);
    }

    function hideLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        isLoading = false;
        loadingCancelled = false;
        $loading.fadeOut(300);
        // Ne pas changer le statut si on est en train de parler
        if (!isSpeaking && !isPlaying) {
            setStatus("⏸ Lecture arrêtée", 'paused');
        }
    }

    function cancelLoading() {
        loadingCancelled = true;
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        hideLoading();
        stopSpeaking();
        setStatus("⏸ Annulé", 'paused');
        isPlaying = false;
        updatePlayButton();
        $loadingText.text('Annulé par l\'utilisateur');
        $loadingSub.text('Vous pouvez réessayer');
        $loadingTimeout.text('✕ Annulation');
    }

    // Arrêter la parole proprement
    function stopSpeaking() {
        try {
            if (synth && (synth.speaking || synth.pending)) {
                synth.cancel();
            }
        } catch(e) {
            console.warn('Erreur stopSpeaking:', e);
        }
        if (currentUtterance) {
            try {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance.onstart = null;
            } catch(e) {}
            currentUtterance = null;
        }
        isSpeaking = false;
        isPlaying = false;
        updatePlayButton();
    }

    // Mettre en pause la parole
    function pauseSpeaking() {
        try {
            if (synth && synth.speaking) {
                synth.pause();
                isPaused = true;
                isPlaying = false;
                setStatus("⏸ Lecture en pause", 'paused');
                updatePlayButton();
            }
        } catch(e) {
            console.warn('Erreur pauseSpeaking:', e);
            stopSpeaking();
        }
    }

    // Reprendre la parole
    function resumeSpeaking() {
        try {
            if (synth && synth.paused) {
                synth.resume();
                isPaused = false;
                isPlaying = true;
                setStatus("🔊 Lecture en cours", 'speaking');
                updatePlayButton();
            } else if (!isSpeaking && !synth.speaking && !synth.pending) {
                speakSlide(currentIndex);
            }
        } catch(e) {
            console.warn('Erreur resumeSpeaking:', e);
            speakSlide(currentIndex);
        }
    }

    function renderSlide(index) {
        const slide = slides[index];
        $title.text(slide.titre);

        let html = '';
        html += `<div class="content-card">${slide.contenu}</div>`;
        if (slide.note) {
            html += `<div class="note-box">${slide.note}</div>`;
        }
        $body.html(html);
        $counter.text(`${index+1} / ${total}`);

        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
        }
    }

    // ================================================================
    // LECTURE VOCALE
    // ================================================================
    function speakSlide(index) {
        return new Promise((resolve) => {
            const slide = slides[index];
            const text = slide.texteParle;
            
            if (!text || text.trim() === '' || !speechSupported) {
                resolve();
                return;
            }

            if (!window.speechSynthesis) {
                setStatus("❌ Synthèse vocale non supportée", 'error');
                speechSupported = false;
                resolve();
                return;
            }

            // Arrêter toute lecture en cours
            stopSpeaking();
            
            // Réinitialiser l'état de pause
            isPaused = false;
            
            showLoading();
            setStatus("Initialisation...", 'loading');

            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.92;
                utterance.pitch = 1.05;
                utterance.volume = 1;

                let isFinished = false;
                let errorHandled = false;

                utterance.onstart = function() {
                    if (loadingCancelled) {
                        stopSpeaking();
                        resolve();
                        return;
                    }
                    hideLoading();
                    isSpeaking = true;
                    isPlaying = true;
                    isPaused = false;
                    setStatus("🔊 Lecture en cours", 'speaking');
                    updatePlayButton();
                };

                utterance.onend = function() {
                    if (isFinished) return;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    setStatus("✅ Terminé", 'idle');
                    hideLoading();
                    updatePlayButton();
                    resolve();
                };

                utterance.onerror = function(e) {
                    if (isFinished || errorHandled) return;
                    errorHandled = true;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    hideLoading();
                    updatePlayButton();
                    
                    if (e.error === 'not-allowed') {
                        setStatus("⚠️ Permission refusée", 'error');
                    } else if (e.error === 'synthesis-unavailable') {
                        setStatus("⚠️ Synthèse indisponible", 'error');
                    } else if (e.error === 'canceled') {
                        setStatus("⏸ Annulé", 'paused');
                    } else {
                        setStatus("❌ Erreur audio: " + (e.error || 'inconnue'), 'error');
                    }
                    
                    resolve();
                };

                // Gestion du chargement des voix
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = function() {
                        if (!loadingCancelled) {
                            try {
                                synth.speak(utterance);
                            } catch(err) {
                                // Silencieux
                            }
                        }
                        synth.onvoiceschanged = null;
                    };
                }

                currentUtterance = utterance;
                
                if (!loadingCancelled) {
                    try {
                        synth.speak(utterance);
                    } catch(err) {
                        setTimeout(() => {
                            if (!loadingCancelled) {
                                try {
                                    synth.speak(utterance);
                                } catch(e) {
                                    setStatus("❌ Erreur de lecture", 'error');
                                    isPlaying = false;
                                    updatePlayButton();
                                    hideLoading();
                                    resolve();
                                }
                            } else {
                                resolve();
                            }
                        }, 100);
                    }
                } else {
                    resolve();
                }

            } catch(err) {
                hideLoading();
                setStatus("❌ Erreur générale", 'error');
                isPlaying = false;
                updatePlayButton();
                console.error('Erreur speakSlide:', err);
                resolve();
            }
        });
    }

    // ================================================================
    // NAVIGATION
    // ================================================================
    async function goToSlide(index) {
        if (isTransitioning) return;
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        
        // Si on est en train de lire, on met en pause avant de naviguer
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        // Arrêter complètement la lecture
        stopSpeaking();
        
        await new Promise(r => setTimeout(r, 50));
        
        if (index === currentIndex) {
            setStatus("📄 Slide actuel", 'idle');
            return;
        }

        isTransitioning = true;
        currentIndex = index;
        renderSlide(index);
        
        // Réinitialiser l'état de lecture
        isPlaying = false;
        updatePlayButton();
        setStatus("⏸ Lecture arrêtée", 'paused');

        await new Promise(r => setTimeout(r, 150));
        isTransitioning = false;
    }

    async function goToNext() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex + 1 < total) {
            await goToSlide(currentIndex + 1);
        } else {
            setStatus("🏁 Dernier slide", 'idle');
        }
    }

    async function goToPrev() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex - 1 >= 0) {
            await goToSlide(currentIndex - 1);
        } else {
            setStatus("🔁 Premier slide", 'idle');
        }
    }

    // ================================================================
    // GESTION PLAY/PAUSE
    // ================================================================
    function togglePlay() {
        if (!userInteracted) {
            userInteracted = true;
        }

        // Si le chargement est en cours, on l'annule
        if (isLoading) {
            cancelLoading();
            return;
        }

        // Si le synthétiseur est en pause, on reprend
        if (synth && synth.paused) {
            resumeSpeaking();
            return;
        }

        // Si la lecture est en cours, on met en pause
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
            return;
        }

        // Sinon, on démarre la lecture du slide courant
        if (!isSpeaking && !isPlaying) {
            stopSpeaking();
            speakSlide(currentIndex);
        }
    }

    // ================================================================
    // INIT
    // ================================================================
    async function init() {
        // Vérifier la compatibilité
        if (!window.speechSynthesis) {
            setStatus("❌ Synthèse vocale non supportée", 'error');
            speechSupported = false;
        }

        // Précharger les voix
        try {
            if (synth.getVoices) {
                synth.getVoices();
                setTimeout(() => {
                    try {
                        synth.getVoices();
                    } catch(e) {}
                }, 200);
            }
        } catch(e) {
            console.warn('Erreur chargement voix:', e);
        }

        // Afficher le premier slide
        renderSlide(0);
        $counter.text(`1 / ${total}`);
        
        // État initial
        setStatus("⏸ Appuie sur Play", 'paused');
        updatePlayButton();
        $autoIndicator.text('⏸ Lecture manuelle');

        // ================================================================
        // ÉVÉNEMENTS
        // ================================================================
        
        // Bouton Play/Pause
        $play.on('click', function() {
            togglePlay();
        });

        // Bouton Annuler le chargement
        $cancelLoading.on('click', function() {
            cancelLoading();
        });

        // Navigation
        $prev.on('click', function() {
            // Si chargement en cours, on annule
            if (isLoading) cancelLoading();
            goToPrev();
        });

        $next.on('click', function() {
            if (isLoading) cancelLoading();
            goToNext();
        });

        // Replay - relire le slide courant
        $replay.on('click', function() {
            if (isLoading) cancelLoading();
            stopSpeaking();
            setTimeout(() => {
                speakSlide(currentIndex);
            }, 100);
        });

        // Support du clavier (espace pour play/pause)
        $(document).on('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });

        // Nettoyage
        $(window).on('beforeunload', function() {
            try {
                if (synth.speaking) synth.cancel();
            } catch(e) {}
            hideLoading();
        });

        // Gérer les cas où la synthèse se termine de manière inattendue
        setInterval(() => {
            if (isPlaying && !synth.speaking && !synth.pending && !isPaused && !isLoading) {
                isPlaying = false;
                updatePlayButton();
                setStatus("⏸ Lecture arrêtée", 'paused');
            }
        }, 1000);
    }

    init();
});



    // ================================================================
    // GESTION DU THÈME JOUR/NUIT
    // ================================================================
    let isDarkMode = false;

    function toggleTheme() {
        isDarkMode = !isDarkMode;
        const body = document.body;
        const appContainer = document.querySelector('.app-container');
        const header = document.querySelector('.slide-header');
        const footer = document.querySelector('.slide-footer');
        const contentCards = document.querySelectorAll('.content-card');
        const noteBoxes = document.querySelectorAll('.note-box');
        const mathBlocks = document.querySelectorAll('.math-block');
        const buttons = document.querySelectorAll('.btn');
        const statusBadge = document.querySelector('.status-badge');
        const slideCounter = document.querySelector('.slide-counter');
        const autoIndicator = document.querySelector('.auto-indicator');
        const themeBtn = document.getElementById('themeToggle');

        if (isDarkMode) {
            // Mode nuit
            body.style.background = '#0b1120';
            body.style.color = '#f1f5f9';
            appContainer.style.background = 'linear-gradient(145deg, #0f172a 0%, #1e293b 100%)';
            header.style.background = 'rgba(15, 23, 42, 0.85)';
            footer.style.background = 'rgba(15, 23, 42, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.05)';
                card.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.08)';
                note.style.color = '#cbd5e1';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.25)';
                block.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#e2e8f0';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.12)';
                statusBadge.style.color = '#93bbfc';
            }
            if (slideCounter) {
                slideCounter.style.color = '#94a3b8';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#64748b';
            }
            if (themeBtn) {
                themeBtn.textContent = '☀️';
                themeBtn.title = 'Passer en mode jour';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#e2e8f0';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#e2e8f0';
                }
            });
        } else {
            // Mode jour (par défaut)
            body.style.background = '#f0f4f8';
            body.style.color = '#1a202c';
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
            header.style.background = 'rgba(255, 255, 255, 0.85)';
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.8)';
                card.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.12)';
                note.style.color = '#2c3e50';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.05)';
                block.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#2d3748';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
                statusBadge.style.color = '#2b6cb0';
            }
            if (slideCounter) {
                slideCounter.style.color = '#4a5568';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#718096';
            }
            if (themeBtn) {
                themeBtn.textContent = '🌓';
                themeBtn.title = 'Passer en mode nuit';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#2c3e50';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#2d3748';
                }
            });
        }
    }

    // Initialiser en mode jour
    document.addEventListener('DOMContentLoaded', function() {
        // Appliquer le mode jour par défaut
        const body = document.body;
        body.style.background = '#f0f4f8';
        body.style.color = '#1a202c';
        
        const appContainer = document.querySelector('.app-container');
        if (appContainer) {
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
        }
        
        const header = document.querySelector('.slide-header');
        if (header) {
            header.style.background = 'rgba(255, 255, 255, 0.85)';
        }
        
        const footer = document.querySelector('.slide-footer');
        if (footer) {
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
        }
        
        document.querySelectorAll('.content-card').forEach(card => {
            card.style.background = 'rgba(255,255,255,0.8)';
            card.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.note-box').forEach(note => {
            note.style.background = 'rgba(96, 165, 250, 0.12)';
            note.style.color = '#2c3e50';
        });
        
        document.querySelectorAll('.math-block').forEach(block => {
            block.style.background = 'rgba(0,0,0,0.05)';
            block.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.btn').forEach(btn => {
            btn.style.color = '#2d3748';
        });
        
        const statusBadge = document.querySelector('.status-badge');
        if (statusBadge) {
            statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
            statusBadge.style.color = '#2b6cb0';
        }
        
        const slideCounter = document.querySelector('.slide-counter');
        if (slideCounter) {
            slideCounter.style.color = '#4a5568';
        }
        
        const autoIndicator = document.querySelector('.auto-indicator');
        if (autoIndicator) {
            autoIndicator.style.color = '#718096';
        }
        
        document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
            if (!el.closest('.note-box')) {
                el.style.color = '#2c3e50';
            }
        });
        
        document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
            if (!el.closest('.note-box') && !el.closest('.math-block')) {
                el.style.color = '#2d3748';
            }
        });
        
        const themeBtn = document.getElementById('themeToggle');
        if (themeBtn) {
            themeBtn.textContent = '🌓';
            themeBtn.title = 'Passer en mode nuit';
        }
    });
</script>
