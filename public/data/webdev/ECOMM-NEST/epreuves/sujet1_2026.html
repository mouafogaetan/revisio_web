<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Développement d'une API complète pour plateforme e-commerce",
  "classe": "Développement Web",
  "sequence": "Séquence 1",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Installation et Configuration de l'Environnement",
      "points": "4 pts",
      "enonce": "<div style='font-family: system-ui, -apple-system, sans-serif; background-color: #f8fafc; color: #0f172a; padding: 1rem; border-radius: 8px;'><p>Vous êtes développeur backend dans une startup camerounaise et devez lancer le développement de l'API du projet <strong>Sawamart</strong>.</p><p><strong>Consignes :</strong></p><ol><li>Installez Node.js, npm et le CLI NestJS.</li><li>Créez un nouveau projet NestJS nommé <code>sawamart-backend</code>.</li><li>Mettez en place un fichier <code>.env</code> pour les variables d'environnement (port, base de données, JWT).</li></ol></div>",
      "questions": [
        {
          "question": "<div style='font-family: system-ui, -apple-system, sans-serif; color: #0f172a;'>1. a) Quelle commande utilisez-vous pour installer le CLI NestJS globalement ?</div>",
          "reponse": "<div style='font-family: system-ui, -apple-system, sans-serif; background-color: #eef2ff; padding: 0.75rem; border-radius: 6px; border-left: 4px solid #4f46e5; color: #0f172a;'><code>npm i -g @nestjs/cli</code></div>"
        },
        {
          "question": "<div style='font-family: system-ui, -apple-system, sans-serif; color: #0f172a;'>1. b) Quelle commande permet de créer le projet <code>sawamart-backend</code> ?</div>",
          "reponse": "<div style='font-family: system-ui, -apple-system, sans-serif; background-color: #eef2ff; padding: 0.75rem; border-radius: 6px; border-left: 4px solid #4f46e5; color: #0f172a;'><code>nest new sawamart-backend</code></div>"
        },
        {
          "question": "<div style='font-family: system-ui, -apple-system, sans-serif; color: #0f172a;'>1. c) Citez trois dépendances principales que vous trouvez dans le fichier <code>package.json</code> d'un projet NestJS.</div>",
          "reponse": "<div style='font-family: system-ui, -apple-system, sans-serif; background-color: #eef2ff; padding: 0.75rem; border-radius: 6px; border-left: 4px solid #4f46e5; color: #0f172a;'><p><strong>Réponse attendue :</strong></p><ul><li><code>@nestjs/core</code></li><li><code>@nestjs/common</code></li><li><code>@nestjs/platform-express</code></li></ul></div>"
        }
      ]
    },
    {
      "titre": "Architecture NestJS et Concepts Fondamentaux",
      "points": "6 pts",
      "enonce": "<div style='font-family: system-ui, -apple-system, sans-serif; background-color: #f8fafc; color: #0f172a; padding: 1rem; border-radius: 8px;'><p>L'API Sawamart doit respecter l'architecture modulaire de NestJS.</p><p><strong>Consignes :</strong> Répondez aux questions suivantes en vous basant sur les concepts de modules, contrôleurs, services, injection de dépendances et validation.</p></div>",
      "questions": [
        {
          "question": "<div style='font-family: system-ui, -apple-system, sans-serif; color: #0f172a;'>2. a) Quel est le rôle du décorateur <code>@Module()</code> dans NestJS ?</div>",
          "reponse": "<div style='font-family: system-ui, -apple-system, sans-serif; background-color: #eef2ff; padding: 0.75rem; border-radius: 6px; border-left: 4px solid #4f46e5; color: #0f172a;'><p>Le décorateur <code>@Module()</code> définit un module NestJS. Il permet d'organiser l'application en regroupant les contrôleurs, les services (providers) et les imports d'autres modules. Chaque application a un module racine (<code>AppModule</code>) et peut être découpée en modules fonctionnels.</p></div>"
        },
        {
          "question": "<div style='font-family: system-ui, -apple-system, sans-serif; color: #0f172a;'>2. b) Expliquez le mécanisme de l'injection de dépendances dans un service NestJS.</div>",
          "reponse": "<div style='font-family: system-ui, -apple-system, sans-serif; background-color: #eef2ff; padding: 0.75rem; border-radius: 6px; border-left: 4px solid #4f46e5; color: #0f172a;'><p>L'injection de dépendances (DI) est un pattern où les dépendances d'une classe (ex: un service) sont fournies par le conteneur NestJS plutôt que créées à l'intérieur de la classe. On utilise le décorateur <code>@Injectable()</code> pour déclarer un service injectable. Dans le constructeur du contrôleur ou d'un autre service, on déclare la dépendance avec son type, et NestJS l'injecte automatiquement.</p><p><strong>Exemple :</strong></p><pre style='background-color: #1e293b; color: #e2e8f0; padding: 0.75rem; border-radius: 6px;'><code>@Controller('users')\nexport class UsersController {\n  constructor(private readonly usersService: UsersService) {}\n}</code></pre></div>"
        },
        {
          "question": "<div style='font-family: system-ui, -apple-system, sans-serif; color: #0f172a;'>2. c) Comment mettez-vous en place une validation globale des DTOs avec <code>class-validator</code> ?</div>",
          "reponse": "<div style='font-family: system-ui, -apple-system, sans-serif; background-color: #eef2ff; padding: 0.75rem; border-radius: 6px; border-left: 4px solid #4f46e5; color: #0f172a;'><p>Pour activer la validation globale, on installe <code>class-validator</code> et <code>class-transformer</code>. Ensuite, dans le fichier <code>main.ts</code>, on utilise le <code>ValidationPipe</code> global avec <code>app.useGlobalPipes(new ValidationPipe())</code>. On définit les DTOs avec des décorateurs comme <code>@IsString()</code>, <code>@IsEmail()</code>, <code>@IsInt()</code>, etc.</p></div>"
        }
      ]
    },
    {
      "titre": "Mise en Place de la Base de Données",
      "points": "5 pts",
      "enonce": "<div style='font-family: system-ui, -apple-system, sans-serif; background-color: #f8fafc; color: #0f172a; padding: 1rem; border-radius: 8px;'><p>La base de données PostgreSQL doit être configurée avec TypeORM.</p><p><strong>Consignes :</strong></p><ol><li>Installez les dépendances nécessaires.</li><li>Configurez le module <code>TypeOrmModule</code> dans <code>app.module.ts</code>.</li><li>Définissez les variables d'environnement pour la connexion.</li></ol></div>",
      "questions": [
        {
          "question": "<div style='font-family: system-ui, -apple-system, sans-serif; color: #0f172a;'>3. a) Quelles sont les commandes npm pour installer les packages TypeORM et PostgreSQL ?</div>",
          "reponse": "<div style='font-family: system-ui, -apple-system, sans-serif; background-color: #eef2ff; padding: 0.75rem; border-radius: 6px; border-left: 4px solid #4f46e5; color: #0f172a;'><p><code>npm install @nestjs/typeorm typeorm pg</code></p></div>"
        },
        {
          "question": "<div style='font-family: system-ui, -apple-system, sans-serif; color: #0f172a;'>3. b) Écrivez la configuration du <code>TypeOrmModule</code> dans <code>app.module.ts</code> en utilisant <code>ConfigModule</code> pour charger les variables d'environnement.</div>",
          "reponse": "<div style='font-family: system-ui, -apple-system, sans-serif; background-color: #eef2ff; padding: 0.75rem; border-radius: 6px; border-left: 4px solid #4f46e5; color: #0f172a;'><pre style='background-color: #1e293b; color: #e2e8f0; padding: 0.75rem; border-radius: 6px;'><code>TypeOrmModule.forRootAsync({\n  imports: [ConfigModule],\n  inject: [ConfigService],\n  useFactory: (configService: ConfigService) => ({\n    type: 'postgres',\n    host: configService.get('DB_HOST'),\n    port: configService.get('DB_PORT'),\n    username: configService.get('DB_USERNAME'),\n    password: configService.get('DB_PASSWORD'),\n    database: configService.get('DB_NAME'),\n    entities: [__dirname + '/**/*.entity{.ts,.js}'],\n    synchronize: false,\n  }),\n})</code></pre></div>"
        },
        {
          "question": "<div style='font-family: system-ui, -apple-system, sans-serif; color: #0f172a;'>3. c) Donnez un exemple de fichier <code>.env</code> pour la base de données.</div>",
          "reponse": "<div style='font-family: system-ui, -apple-system, sans-serif; background-color: #eef2ff; padding: 0.75rem; border-radius: 6px; border-left: 4px solid #4f46e5; color: #0f172a;'><pre style='background-color: #1e293b; color: #e2e8f0; padding: 0.75rem; border-radius: 6px;'>DB_HOST=localhost\nDB_PORT=5432\nDB_USERNAME=postgres\nDB_PASSWORD=secret\nDB_NAME=sawamart_db</pre></div>"
        }
      ]
    },
    {
      "titre": "Authentification JWT et Gestion des Utilisateurs",
      "points": "5 pts",
      "enonce": "<div style='font-family: system-ui, -apple-system, sans-serif; background-color: #f8fafc; color: #0f172a; padding: 1rem; border-radius: 8px;'><p>L'API doit gérer l'authentification des utilisateurs avec JWT.</p><p><strong>Consignes :</strong> Décrivez les étapes d'implémentation de l'inscription, de la connexion et de la protection des routes.</p></div>",
      "questions": [
        {
          "question": "<div style='font-family: system-ui, -apple-system, sans-serif; color: #0f172a;'>4. a) Quels packages installez-vous pour l'authentification JWT ?</div>",
          "reponse": "<div style='font-family: system-ui, -apple-system, sans-serif; background-color: #eef2ff; padding: 0.75rem; border-radius: 6px; border-left: 4px solid #4f46e5; color: #0f172a;'><p><code>npm install @nestjs/jwt @nestjs/passport passport passport-jwt bcrypt</code></p></div>"
        },
        {
          "question": "<div style='font-family: system-ui, -apple-system, sans-serif; color: #0f172a;'>4. b) Expliquez le fonctionnement de l'endpoint <code>/auth/register</code>.</div>",
          "reponse": "<div style='font-family: system-ui, -apple-system, sans-serif; background-color: #eef2ff; padding: 0.75rem; border-radius: 6px; border-left: 4px solid #4f46e5; color: #0f172a;'><p>L'endpoint <code>/auth/register</code> reçoit les données de l'utilisateur (email, mot de passe, etc.). Le mot de passe est hashé avec bcrypt avant d'être stocké dans la base de données. Un nouvel utilisateur est créé et une réponse de succès est renvoyée.</p></div>"
        },
        {
          "question": "<div style='font-family: system-ui, -apple-system, sans-serif; color: #0f172a;'>4. c) Comment protégez-vous une route avec le <code>JwtAuthGuard</code> ?</div>",
          "reponse": "<div style='font-family: system-ui, -apple-system, sans-serif; background-color: #eef2ff; padding: 0.75rem; border-radius: 6px; border-left: 4px solid #4f46e5; color: #0f172a;'><p>On utilise le décorateur <code>@UseGuards(JwtAuthGuard)</code> sur le contrôleur ou la méthode à protéger. Le guard vérifie la présence et la validité du token JWT dans l'en-tête <code>Authorization</code> avant d'autoriser l'accès.</p><pre style='background-color: #1e293b; color: #e2e8f0; padding: 0.75rem; border-radius: 6px;'><code>@UseGuards(JwtAuthGuard)\n@Get('profile')\ngetProfile(@Req() req) {\n  return req.user;\n}</code></pre></div>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
