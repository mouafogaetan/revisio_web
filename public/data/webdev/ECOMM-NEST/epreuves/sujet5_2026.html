<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
 "matiere": "Développement d'une API complète pour plateforme e-commerce",
 "classe": "Développement Web",
 "sequence": "Sequence 5",
 "anneeScolaire": "2025-2026",
 "exercices": [
   {
     "titre": "Authentification et Gestion des Utilisateurs (JWT & OTP)",
     "points": "6 pts",
     "enonce": "<div style='padding: 10px;'>\n<p>Dans le cadre du développement de l’API de la plateforme <strong>SawaMart</strong>, vous devez sécuriser l’accès aux ressources. Vous avez mis en place un système d’authentification basé sur JWT et une vérification par OTP (One-Time Password).</p>\n<p>Vous êtes en charge de la gestion des utilisateurs. Répondez aux questions suivantes en vous appuyant sur les spécifications et les bonnes pratiques vues en cours.</p>\n</div>",
     "questions":[
       {
          "question": "<p><strong>1. Endpoint d'inscription (2 pts)</strong></p><p>Ecrivez le code TypeScript nécessaire dans le contrôleur (<code>AuthController</code>) pour implémenter l’endpoint <code>POST /auth/register</code>. Vous devez :<br> - Recevoir les données via un DTO.<br> - Hasher le mot de passe avec <code>bcrypt</code> (10 rounds de salage).<br> - Sauvegarder l'utilisateur (email et mot de passe hashé).<br> - Retourner une réponse JSON indiquant le succès de l’opération.</p><p><em>Rappel : Utilisez les décorateurs appropriés de NestJS.</em></p>",
          "reponse": "<div style='background: #1e1e1e; color: #d4d4d4; padding: 15px; border-radius: 8px; font-family: monospace; overflow-x: auto;'>\n<p>// auth.controller.ts</p>\n<p>@Post('register')</p>\n<p>async register(@Body() registerDto: RegisterDto) {</p>\n<p>  const hashedPassword = await bcrypt.hash(registerDto.password, 10);</p>\n<p>  const user = await this.userService.create({</p>\n<p>    email: registerDto.email,</p>\n<p>    passwordHash: hashedPassword,</p>\n<p>  });</p>\n<p>  return { message: 'Utilisateur créé avec succès', user };</p>\n<p>}</p>\n</div>"
       },
       {
          "question": "<p><strong>2. Stratégie JWT (2 pts)</strong></p><p>Détaillez le rôle de la méthode <code>validate()</code> dans la <code>JwtStrategy</code>.</p><p>Expliquez comment cette méthode interagit avec le payload du token et avec le service utilisateur pour attacher l’utilisateur à la requête (<code>req.user</code>).</p>",
          "reponse": "<p>La méthode <code>validate()</code> est appelée automatiquement par <strong>Passport</strong> après la validation cryptographique du token JWT.</p><p>Elle reçoit le <code>payload</code> décodé du token (contenant généralement <code>sub</code> pour l’ID utilisateur et <code>email</code>).</p><p>Elle utilise ce payload (ex: <code>payload.sub</code>) pour interroger la base de données via le <code>UserService</code>. Si l'utilisateur existe, elle retourne l'objet utilisateur, qui sera alors assigné à <code>req.user</code> par le framework.</p><p>Si l'utilisateur n'existe pas ou si le token est invalide, elle doit lever une exception.</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 15px; border-radius: 8px; font-family: monospace; overflow-x: auto;'>\n<p>async validate(payload: any) {</p>\n<p>  const user = await this.userService.findById(payload.sub);</p>\n<p>  if (!user) throw new UnauthorizedException();</p>\n<p>  return user;</p>\n<p>}</p>\n</div>"
       },
       {
          "question": "<p><strong>3. Vérification OTP (2 pts)</strong></p><p>Expliquez le rôle du <code>OtpService</code> et décrivez brièvement comment il doit gérer un code OTP (génération, expiration et suppression).</p><p>Proposez une structure de table PostgreSQL pour stocker les OTP de manière sécurisée.</p>",
          "reponse": "<p>Le <code>OtpService</code> est responsable de la logique métier des OTP.</p><p><strong>Rôles :</strong><br>- <strong>Génération</strong> : Créer un code aléatoire (6 chiffres) pour l'utilisateur.<br>- <strong>Expiration</strong> : Associer une date d'expiration (ex: + 5 minutes) pour limiter la validité du code.<br>- <strong>Suppression</strong> : Supprimer le code après validation réussie ou expiration pour éviter la réutilisation.</p><p><strong>Structure de table proposée :</strong></p><div style='background: #1e1e1e; color: #d4d4d4; padding: 15px; border-radius: 8px; font-family: monospace; overflow-x: auto;'>\n<p>CREATE TABLE otp_codes (</p>\n<p>  id UUID PRIMARY KEY DEFAULT gen_random_uuid(),</p>\n<p>  user_id UUID NOT NULL REFERENCES users(id) ON DELETE CASCADE,</p>\n<p>  code_hash TEXT NOT NULL, -- Hashé avec bcrypt</p>\n<p>  expires_at TIMESTAMP NOT NULL,</p>\n<p>  attempts INT DEFAULT 0, -- Suivi des tentatives</p>\n<p>  created_at TIMESTAMP DEFAULT NOW()</p>\n<p>);</p>\n</div>\n<p>Il est impératif de hasher le code OTP avant de le stocker pour éviter toute exposition en cas de fuite de la base de données.</p>"
       }
     ]
   },
   {
     "titre": "Gestion des Produits et Upload d'Images",
     "points": "6 pts",
     "enonce": "<div style='padding: 10px;'>\n<p>La plateforme SawaMart permet aux vendeurs de gérer leurs catalogues de produits.</p>\n<p>Vous devez développer les endpoints pour la gestion des produits ainsi que l'intégration d'un service d'upload d'images.</p>\n</div>",
     "questions":[
       {
          "question": "<p><strong>1. Entité Produit (2 pts)</strong></p><p>Créez l'entité <code>Product</code> et <code>ProductImage</code> en utilisant TypeORM. Précisez :</p><p>- La relation entre ces deux entités.</p><p>- Les colonnes nécessaires (nom, prix, description, etc.).</p><p>- Les types de colonnes appropriés (ex: UUID, Decimal, etc.).</p>",
          "reponse": "<div style='background: #1e1e1e; color: #d4d4d4; padding: 15px; border-radius: 8px; font-family: monospace; overflow-x: auto;'>\n<p>// product.entity.ts</p>\n<p>@Entity('products')</p>\n<p>export class Product {</p>\n<p>  @PrimaryGeneratedColumn('uuid')</p>\n<p>  id: string;</p>\n<p>  @Column()</p>\n<p>  name: string;</p>\n<p>  @Column({ type: 'decimal', precision: 10, scale: 2 })</p>\n<p>  price: number;</p>\n<p>  @Column({ type: 'text' })</p>\n<p>  description: string;</p>\n<p>  @OneToMany(() => ProductImage, (image) => image.product, { cascade: true })</p>\n<p>  images: ProductImage[];</p>\n<p>}</p>\n<br>\n<p>// product-image.entity.ts</p>\n<p>@Entity('product_images')</p>\n<p>export class ProductImage {</p>\n<p>  @PrimaryGeneratedColumn('uuid')</p>\n<p>  id: string;</p>\n<p>  @Column({ type: 'text' })</p>\n<p>  url: string;</p>\n<p>  @Column({ default: false })</p>\n<p>  isMain: boolean;</p>\n<p>  @ManyToOne(() => Product, (product) => product.images)</p>\n<p>  @JoinColumn({ name: 'product_id' })</p>\n<p>  product: Product;</p>\n<p>}</p>\n</div>\n<p>La relation est <code>OneToMany</code> (un produit a plusieurs images). La clé étrangère <code>product_id</code> est gérée via <code>@JoinColumn</code> dans l'entité <code>ProductImage</code>.</p>"
       },
       {
          "question": "<p><strong>2. Interceptor FilesInterceptor (2 pts)</strong></p><p>Expliquez comment utiliser <code>FilesInterceptor</code> dans NestJS pour gérer l'upload de plusieurs images lors de la création d'un produit.</p><p>Quels sont les paramètres que vous devez passer à cet interceptor ?</p>",
          "reponse": "<p><strong>Utilisation :</strong></p><p><code>FilesInterceptor</code> est un interceptor de la plateforme <code>express</code> (via <code>@nestjs/platform-express</code>) qui permet de traiter les fichiers envoyés via <code>multipart/form-data</code>.</p><p>On l'utilise dans un contrôleur avec <code>@UseInterceptors()</code>. Il extrait les fichiers et les rend disponibles via le décorateur <code>@UploadedFiles()</code>.</p><div style='background: #1e1e1e; color: #d4d4d4; padding: 15px; border-radius: 8px; font-family: monospace; overflow-x: auto;'>\n<p>@Post()</p>\n<p>@UseInterceptors(FilesInterceptor('images', 5, {</p>\n<p>  limits: { fileSize: 5 * 1024 * 1024 },</p>\n<p>  fileFilter: (req, file, cb) => {</p>\n<p>    if (!file.mimetype.match(/\\/(jpg|jpeg|png|gif)$/)) {</p>\n<p>      return cb(new Error('Seules les images sont autorisées'), false);</p>\n<p>    }</p>\n<p>    cb(null, true);</p>\n<p>  }</p>\n<p>}))</p>\n<p>async createProduct(</p>\n<p>  @Body() createProductDto: CreateProductDto,</p>\n<p>  @UploadedFiles() files: Array&lt;Express.Multer.File&gt;</p>\n<p>) { ... }</p>\n</div>\n<p><strong>Paramètres :</strong> <code>'images'</code> (nom du champ), <code>5</code> (nombre max de fichiers), et une configuration d'options (taille max, filtres).</p>"
       },
       {
          "question": "<p><strong>3. Service d'upload Cloudinary (2 pts)</strong></p><p>Décrivez comment intégrer le service <code>UploadService</code> pour stocker les images sur <strong>Cloudinary</strong>.</p><p>Expliquez l’intérêt d’utiliser un service Cloud plutôt qu’un stockage local.</p>",
          "reponse": "<p><strong>Intégration :</strong></p><ul><li>Installer le SDK Cloudinary (<code>npm install cloudinary</code>).</li><li>Configurer Cloudinary avec les variables d'environnement (cloud_name, api_key, api_secret).</li><li>Dans le service, utiliser la méthode <code>uploader.upload()</code> pour envoyer le fichier et obtenir l'URL sécurisée.</li></ul><div style='background: #1e1e1e; color: #d4d4d4; padding: 15px; border-radius: 8px; font-family: monospace; overflow-x: auto;'>\n<p>// upload.service.ts</p>\n<p>async uploadImage(file: Express.Multer.File): Promise&lt;string&gt; {</p>\n<p>  return new Promise((resolve, reject) => {</p>\n<p>    cloudinary.uploader.upload_stream({</p>\n<p>      folder: 'sawamart/products',</p>\n<p>    }, (error, result) => {</p>\n<p>      if (error) reject(error);</p>\n<p>      else resolve(result.secure_url);</p>\n<p>    }).end(file.buffer);</p>\n<p>  });</p>\n<p>}</p>\n</div>\n<p><strong>Avantages du Cloud :</strong></p><ul><li><strong>Scalabilité :</strong> Gère des volumes élevés sans impacter le serveur principal.</li><li><strong>CDN :</strong> Optimise la livraison des images aux utilisateurs.</li><li><strong>Haute disponibilité :</strong> Réduit le risque de perte de données en cas de panne serveur.</li></ul>"
       }
     ]
   },
   {
     "titre": "Tests Unitaires et Documentation Swagger",
     "points": "4 pts",
     "enonce": "<div style='padding: 10px;'>\n<p>Afin de garantir la qualité de votre API, vous devez mettre en place des tests et une documentation interactive.</p>\n</div>",
     "questions":[

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
