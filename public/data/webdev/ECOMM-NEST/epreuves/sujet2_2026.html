<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
 "matiere": "Développement d'une API complète pour plateforme e-commerce",
 "classe": "Développement Web",
 "sequence": "Séquence 2",
 "anneeScolaire": "2025-2026",
 "exercices": [
   {
     "titre": "Question de Cours - Architecture REST et NestJS",
     "points": "6 pts",
     "enonce": "<div style='font-family: Arial, sans-serif; line-height: 1.6;'><p>Le style architectural REST (Representational State Transfer) définit un ensemble de contraintes pour la conception d'APIs web. NestJS est un framework qui implémente cette architecture de manière structurée et modulaire.</p><p>Répondez aux questions suivantes en vous appuyant sur vos connaissances et sur le code fourni.</p><p><strong>Code extrait d'un contrôleur NestJS :</strong></p><div style='background-color: #2c3e50; color: #ecf0f1; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 14px;'><pre>import { Controller, Get, Post, Body, Param, Delete, Put, UseGuards } from '@nestjs/common';\nimport { ProductsService } from './products.service';\nimport { CreateProductDto } from './dto/create-product.dto';\nimport { JwtAuthGuard } from '../auth/jwt-auth.guard';\n\n@Controller('products')\nexport class ProductsController {\n  constructor(private readonly productsService: ProductsService) {}\n\n  @Get()\n  findAll() {\n    return this.productsService.findAll();\n  }\n\n  @Get(':id')\n  findOne(@Param('id') id: string) {\n    return this.productsService.findOne(id);\n  }\n\n  @Post()\n  @UseGuards(JwtAuthGuard)\n  create(@Body() createProductDto: CreateProductDto) {\n    return this.productsService.create(createProductDto);\n  }\n\n  @Put(':id')\n  @UseGuards(JwtAuthGuard)\n  update(@Param('id') id: string, @Body() updateProductDto: UpdateProductDto) {\n    return this.productsService.update(id, updateProductDto);\n  }\n\n  @Delete(':id')\n  @UseGuards(JwtAuthGuard)\n  remove(@Param('id') id: string) {\n    return this.productsService.remove(id);\n  }\n}</pre></div></div>",
     "questions": [
       {
         "question": "<p><strong>1.1 (2 pts)</strong> - Expliquer le rôle des décorateurs <code>@Controller('products')</code> et <code>@Get(':id')</code> dans le code ci-dessus.</p>",
         "reponse": "<p>Le décorateur <code>@Controller('products')</code> définit le préfixe de route pour toutes les méthodes du contrôleur. Toutes les requêtes vers <code>/products</code> seront routées vers ce contrôleur. Le décorateur <code>@Get(':id')</code> indique que la méthode <code>findOne</code> répond aux requêtes GET sur <code>/products/:id</code>. Le paramètre <code>:id</code> est un paramètre de route dynamique qui sera extrait par le décorateur <code>@Param('id')</code>.</p>"
       },
       {
         "question": "<p><strong>1.2 (2 pts)</strong> - Identifier et justifier les principes REST respectés par ce contrôleur. Citer au moins trois principes.</p>",
         "reponse": "<p>Le contrôleur respecte plusieurs principes REST :</p><ul><li><strong>Interface uniforme</strong> : utilisation des méthodes HTTP standard (GET, POST, PUT, DELETE) et des URI pour identifier les ressources.</li><li><strong>Sans état (stateless)</strong> : chaque requête est indépendante et contient toutes les informations nécessaires (l'ID est dans l'URL, les données dans le body).</li><li><strong>Architecture client-serveur</strong> : le contrôleur expose des ressources via des endpoints HTTP.</li><li><strong>Ressources nommées</strong> : utilisation de noms pour les ressources (<code>/products</code>) et non d'actions.</li></ul>"
       },
       {
         "question": "<p><strong>1.3 (2 pts)</strong> - Analyser l'effet du <code>@UseGuards(JwtAuthGuard)</code> sur les méthodes <code>create</code>, <code>update</code> et <code>remove</code>. Expliquer son utilité dans le contexte d'une API e-commerce.</p>",
         "reponse": "<p><code>@UseGuards(JwtAuthGuard)</code> est un garde qui protège les routes. Il vérifie la présence et la validité d'un token JWT dans l'en-tête de la requête avant d'exécuter la méthode. Dans le contexte d'une API e-commerce, cela permet de :</p><ul><li>S'assurer que seul un utilisateur authentifié peut créer, modifier ou supprimer un produit.</li><li>Associer automatiquement le produit à l'utilisateur connecté (le vendeur).</li><li>Empêcher des utilisateurs non authentifiés de modifier le catalogue.</li></ul>"
       }
     ]
   },
   {
     "titre": "Gestion des Dépôts et Retraits Mobile Money",
     "points": "7 pts",
     "enonce": "<div style='font-family: Arial, sans-serif; line-height: 1.6;'><p>Dans le cadre du développement de l'API de la plateforme e-commerce Sawamart, vous devez implémenter le module de gestion des dépôts et retraits via Mobile Money. Les utilisateurs peuvent initier des dépôts et des retraits, qui doivent être validés par un comptable.</p><p>Rappel des règles métier :</p><ul><li>Un dépôt ne peut être validé que s'il est en statut <code>PENDING</code>.</li><li>Le wallet de l'utilisateur est crédité uniquement après validation.</li><li>Un retrait ne peut être initié que si le solde du wallet est suffisant.</li><li>Les demandes de dépôt expirent après 24 heures.</li></ul></div>",
     "questions": [
       {
         "question": "<p><strong>2.1 (2 pts)</strong> - Décrire les entités nécessaires pour gérer les dépôts et les retraits. Pour chaque entité, lister les propriétés principales et leur type.</p>",
         "reponse": "<p><strong>Entité Deposit :</strong></p><ul><li><code>id</code> : string (UUID) - Identifiant unique</li><li><code>userId</code> : string - Référence à l'utilisateur</li><li><code>amount</code> : number - Montant du dépôt</li><li><code>status</code> : enum (PENDING, VALIDATED, REJECTED, EXPIRED) - Statut du dépôt</li><li><code>transactionReference</code> : string - Référence de la transaction Mobile Money</li><li><code>validatedBy</code> : string (nullable) - ID du comptable qui a validé</li><li><code>createdAt</code> : Date - Date de création</li><li><code>validatedAt</code> : Date (nullable) - Date de validation</li></ul><p><strong>Entité Withdrawal :</strong></p><ul><li><code>id</code> : string (UUID) - Identifiant unique</li><li><code>userId</code> : string - Référence à l'utilisateur</li><li><code>amount</code> : number - Montant du retrait</li><li><code>phoneNumber</code> : string - Numéro Mobile Money</li><li><code>operator</code> : string - Opérateur (Orange, MTN, etc.)</li><li><code>status</code> : enum (PENDING, VALIDATED, REJECTED) - Statut du retrait</li><li><code>createdAt</code> : Date - Date de création</li></ul>"
       },
       {
         "question": "<p><strong>2.2 (2 pts)</strong> - Écrire le code de la méthode <code>initiateDeposit</code> du <code>DepositService</code> qui crée une demande de dépôt avec le statut 'PENDING'.</p>",
         "reponse": "<div style='background-color: #2c3e50; color: #ecf0f1; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 14px;'>async initiateDeposit(userId: string, amount: number): Promise<Deposit> {\n  const deposit = this.depositRepository.create({\n    userId,\n    amount,\n    status: 'PENDING',\n    createdAt: new Date(),\n  });\n  return this.depositRepository.save(deposit);\n}</div>"
       },
       {
         "question": "<p><strong>2.3 (3 pts)</strong> - Rédiger la méthode <code>validateDeposit</code> du <code>DepositService</code>. Cette méthode doit :</p><ul><li>Vérifier que le dépôt est en statut 'PENDING'</li><li>Créditer le wallet de l'utilisateur avec le montant du dépôt</li><li>Mettre à jour le statut du dépôt à 'VALIDATED'</li><li>Utiliser une transaction SQL pour garantir l'intégrité des données</li></ul>",
         "reponse": "<div style='background-color: #2c3e50; color: #ecf0f1; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 14px;'>async validateDeposit(depositId: string, comptableId: string): Promise<Deposit> {\n  const queryRunner = this.dataSource.createQueryRunner();\n  await queryRunner.connect();\n  await queryRunner.startTransaction();\n\n  try {\n    // 1. Récupérer le dépôt avec verrouillage\n    const deposit = await queryRunner.manager.findOne(Deposit, {\n      where: { id: depositId },\n      lock: { mode: 'pessimistic_write' },\n    });\n\n    if (!deposit) {\n      throw new NotFoundException('Dépôt non trouvé');\n    }\n\n    if (deposit.status !== 'PENDING') {\n      throw new BadRequestException('Ce dépôt ne peut pas être validé');\n    }\n\n    // 2. Créditer le wallet\n    const wallet = await queryRunner.manager.findOne(Wallet, {\n      where: { userId: deposit.userId },\n      lock: { mode: 'pessimistic_write' },\n    });\n\n    if (!wallet) {\n      throw new NotFoundException('Wallet non trouvé');\n    }\n\n    wallet.balance += deposit.amount;\n    await queryRunner.manager.save(wallet);\n\n    // 3. Mettre à jour le dépôt\n    deposit.status = 'VALIDATED';\n    deposit.validatedBy = comptableId;\n    deposit.validatedAt = new Date();\n    await queryRunner.manager.save(deposit);\n\n    // 4. Créer une transaction interne\n    const transaction = queryRunner.manager.create(Transaction, {\n      userId: deposit.userId,\n      walletId: wallet.id,\n      amount: deposit.amount,\n      type: 'DEPOSIT',\n      reference: depositId,\n    });\n    await queryRunner.manager.save(transaction);\n\n    await queryRunner.commitTransaction();\n    return deposit;\n  } catch (error) {\n    await queryRunner.rollbackTransaction();\n    throw error;\n  } finally {\n    await queryRunner.release();\n  }\n}</div>"
       }
     ]
   },
   {
     "titre": "Tests d'Intégration avec Supertest",
     "points": "7 pts",
     "enonce": "<div style='font-family: Arial, sans-serif; line-height: 1.6;'><p>Vous devez écrire un test d'intégration pour l'endpoint <code>POST /products</code> de l'API. Ce test doit vérifier que :</p><ul><li>Un utilisateur authentifié peut créer un produit.</li><li>Les données sont correctement validées.</li><li>Le produit est bien associé à l'utilisateur connecté.</li></ul><p><strong>DTO de création :</strong></p><div style='background-color: #2c3e50; color: #ecf0f1; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 14px;'>export class CreateProductDto {\n  @IsString()\n  @IsNotEmpty()\n  name: string;\n\n  @IsString()\n  description: string;\n\n  @IsNumber()\n  @IsPositive()\n  price: number;\n\n  @IsUUID()\n  categoryId: string;\n}</div></div>",
     "questions": [

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
