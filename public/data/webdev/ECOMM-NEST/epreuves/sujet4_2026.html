<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Développement d'une API complète pour plateforme e-commerce",
  "classe": "Développement Web",
  "sequence": "Séquence 4",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Moteur de Recommandations et Gestion des Données",
      "points": "4 pts",
      "enonce": "<p>Votre plateforme e-commerce camerounaise souhaite mettre en place un système de recommandations personnalisées pour augmenter les ventes et améliorer l'expérience utilisateur. Vous devez concevoir le service de recommandations et la gestion des données associées.</p><p>Les résultats de recherche [citation:9] montrent que les API modernes utilisent des formats comme JSON pour les échanges de données et suivent les principes REST pour une meilleure interopérabilité.</p>",
      "questions": [
        {
          "question": "<p><strong>1. (1 pt)</strong> Expliquez en quoi l'entité <code>UserInteraction</code> est essentielle pour un moteur de recommandations. Quels types d'interactions doivent être tracés pour une plateforme e-commerce ?</p>",
          "reponse": "<p>L'entité <code>UserInteraction</code> est essentielle car elle permet de collecter les données comportementales des utilisateurs, base de tout système de recommandations. Pour une plateforme e-commerce, les interactions à tracer incluent :</p><ul><li>Les vues de produits (<code>view</code>)</li><li>Les ajouts aux favoris (<code>favorite</code>)</li><li>Les recherches effectuées (<code>search</code>)</li><li>Les ajouts au panier (<code>add_to_cart</code>)</li><li>Les achats réalisés (<code>purchase</code>)</li></ul><p>Ces données permettent de construire un profil d'utilisateur et de générer des suggestions pertinentes.</p>"
        },
        {
          "question": "<p><strong>2. (1,5 pts)</strong> Concevez l'entité <code>UserInteraction</code> en TypeORM. Vous devez inclure :</p><ul><li>Un identifiant UUID</li><li>Une relation ManyToOne avec l'utilisateur</li><li>Une relation ManyToOne optionnelle avec le produit</li><li>Un enum pour le type d'interaction</li><li>Un champ metadata de type JSON</li><li>La date de création automatique</li></ul>",
          "reponse": "<pre style='background:#2d2d2d; color:#f8f8f2; padding:12px; border-radius:6px; font-size:0.85em;'>\nimport { Entity, Column, PrimaryGeneratedColumn, ManyToOne, JoinColumn, CreateDateColumn, Index } from 'typeorm';\nimport { User } from '../../users/entities/user.entity';\nimport { Product } from '../../products/entities/product.entity';\n\nexport enum InteractionType {\n    VIEW = 'view',\n    FAVORITE = 'favorite',\n    SEARCH = 'search',\n    ADD_TO_CART = 'add_to_cart',\n    PURCHASE = 'purchase',\n}\n\n@Entity('user_interactions')\n@Index(['user', 'product', 'type'])\nexport class UserInteraction {\n    @PrimaryGeneratedColumn('uuid')\n    id: string;\n\n    @ManyToOne(() => User, { onDelete: 'CASCADE' })\n    @JoinColumn({ name: 'userId' })\n    user: User;\n\n    @Column()\n    userId: string;\n\n    @ManyToOne(() => Product, { onDelete: 'CASCADE', nullable: true })\n    @JoinColumn({ name: 'productId' })\n    product: Product;\n\n    @Column({ nullable: true })\n    productId: string;\n\n    @Column({ type: 'enum', enum: InteractionType })\n    type: InteractionType;\n\n    @Column({ type: 'jsonb', nullable: true })\n    metadata: any;\n\n    @CreateDateColumn()\n    createdAt: Date;\n}\n</pre>"
        },
        {
          "question": "<p><strong>3. (1,5 pts)</strong> Décrivez comment implémenter une tâche planifiée (<code>@Cron</code>) pour nettoyer les données de navigation conformément au RGPD. Quels délais de conservation recommandez-vous et pourquoi ?</p>",
          "reponse": "<p>La tâche planifiée doit s'exécuter quotidiennement et appliquer les règles suivantes :</p><ul><li><strong>Suppression</strong> : Supprimer les interactions de plus de 13 mois (conformité RGPD)</li><li><strong>Anonymisation</strong> : Anonymiser les interactions de 6 à 13 mois pour les utilisateurs inactifs</li></ul><p>Ces délais permettent de :</p><ul><li>Respecter le RGPD qui impose une conservation limitée des données personnelles</li><li>Conserver des données statistiques utiles pour l'analyse globale</li><li>Protéger la vie privée des utilisateurs tout en maintenant un historique suffisant</li></ul><p>Exemple de code avec <code>@Cron(CronExpression.EVERY_DAY_AT_MIDNIGHT)</code> utilisant <code>@nestjs/schedule</code>.</p>"
        }
      ]
    },
    {
      "titre": "Administration, Sécurité et Tests",
      "points": "4 pts",
      "enonce": "<p>La sécurité et la robustesse de votre API sont cruciales. Vous devez mettre en place des garde-fous pour protéger les données sensibles et garantir la fiabilité de l'application.</p><p>Selon les principes de conception d'API RESTful [citation:3], une bonne API doit utiliser les verbes HTTP standard et des URI claires, ce qui facilite également l'implémentation des tests.</p>",
      "questions": [
        {
          "question": "<p><strong>1. (1 pt)</strong> Expliquez le rôle du <code>RolesGuard</code> dans NestJS. Comment sécurise-t-il les routes d'administration (Admin, Assistant, Comptable) ?</p>",
          "reponse": "<p>Le <code>RolesGuard</code> est un mécanisme d'autorisation qui contrôle l'accès aux routes en fonction des rôles attribués aux utilisateurs. Dans NestJS, il fonctionne comme suit :</p><ul><li>Il s'utilise avec le décorateur <code>@UseGuards(RolesGuard)</code> sur les contrôleurs ou les méthodes</li><li>Il vérifie les rôles définis via <code>@Roles('admin')</code></li><li>Il compare les rôles de l'utilisateur (extraits du token JWT) avec ceux requis par la route</li><li>Si les rôles correspondent, l'accès est autorisé ; sinon, une erreur 403 est renvoyée</li></ul><p>Pour les routes d'administration :</p><ul><li>Les opérations de gestion des utilisateurs (blocage, suppression) sont réservées aux Admins</li><li>Les opérations de validation des produits peuvent être assignées aux Admins et Assistants</li><li>Les opérations financières (validation des dépôts, retraits) sont réservées aux Comptables</li></ul>"
        },
        {
          "question": "<p><strong>2. (1,5 pts)</strong> Décrivez comment mettre en place la sécurité de l'API avec :</p><ul><li><code>helmet</code> pour les en-têtes de sécurité</li><li><code>ThrottlerModule</code> pour le rate limiting</li><li>La validation des entrées avec <code>class-validator</code></li></ul>",
          "reponse": "<p><strong>1. Helmet :</strong> S'installe via <code>npm install helmet</code> et s'utilise comme middleware global dans <code>main.ts</code> : <code>app.use(helmet())</code>. Il protège contre les vulnérabilités web courantes en configurant les en-têtes HTTP de sécurité.</p><p><strong>2. ThrottlerModule :</strong> S'installe avec <code>@nestjs/throttler</code> et se configure dans <code>app.module.ts</code> :</p><pre style='background:#2d2d2d; color:#f8f8f2; padding:12px; border-radius:6px; font-size:0.85em;'>\nThrottlerModule.forRoot({\n  ttl: 60,\n  limit: 100,\n})\n</pre><p>Il limite le nombre de requêtes par adresse IP pour prévenir les attaques par déni de service.</p><p><strong>3. ValidationPipe :</strong> Se configure dans <code>main.ts</code> avec <code>app.useGlobalPipes(new ValidationPipe())</code>. Utilisé avec <code>class-validator</code> dans les DTOs, il valide automatiquement les données entrantes avant qu'elles n'atteignent les contrôleurs.</p>"
        },
        {
          "question": "<p><strong>3. (1,5 pts)</strong> Quels sont les trois types de tests essentiels dans une API NestJS ? Décrivez brièvement chacun et leur utilisation dans le cadre d'une plateforme e-commerce.</p>",
          "reponse": "<p><strong>1. Tests unitaires :</strong> <code>*.spec.ts</code> - Testent des composants isolés (services, contrôleurs). Exemple : Tester la méthode <code>debit</code> du <code>WalletService</code> avec des mocks du repository.</p><p><strong>2. Tests d'intégration :</strong> <code>*.integration-spec.ts</code> - Testent l'interaction entre plusieurs composants (modules, base de données). Exemple : Tester l'endpoint <code>/auth/register</code> avec une base de données de test pour vérifier la persistance.</p><p><strong>3. Tests E2E (end-to-end) :</strong> <code>*.e2e-spec.ts</code> - Testent l'API complète avec <code>supertest</code>. Exemple : Simuler le parcours complet d'un utilisateur : inscription → connexion → achat → vérification du wallet.</p><p>Jest est le framework de test par défaut dans NestJS.</p>"
        }
      ]
    },
    {
      "titre": "Déploiement et Bonnes Pratiques",
      "points": "2 pts",
      "enonce": "<p>Votre API est prête à être déployée en production pour votre plateforme e-commerce. Vous devez préparer le déploiement et la documentation.</p>",
      "questions": [
        {
          "question": "<p><strong>1. (1 pt)</strong> Décrivez les étapes pour compiler et déployer l'application NestJS en production avec PM2. Quelles sont les configurations indispensables à effectuer ?</p>",
          "reponse": "<p><strong>Étapes du déploiement :</strong></p><ol><li><strong>Compilation :</strong> <code>npm run build</code> ou <code>nest build</code> → génère le dossier <code>dist/</code></li><li><strong>Configuration :</strong> Définir <code>NODE_ENV=production</code> et configurer les variables d'environnement (base de données, JWT, services externes) via un fichier <code>.env</code> ou les variables système</li><li><strong>Installation PM2 :</strong> <code>npm install -g pm2</code></li><li><strong>Lancement :</strong> <code>pm2 start dist/main.js --name nom-api</code></li><li><strong>Mode cluster :</strong> <code>pm2 start dist/main.js --name nom-api -i max</code> pour utiliser tous les cœurs CPU</li></ol><p><strong>Configurations indispensables :</strong></p><ul><li>Variables d'environnement de production (ne jamais commiter le fichier <code>.env</code>)</li><li>Activer <code>helmet</code> et le rate limiting pour la sécurité</li><li>Configurer les CORS pour autoriser les domaines front-end</li><li>Vérifier que les logs sont correctement gérés</li></ul>"
        },
        {
          "question": "<p><strong>2. (1 pt)</strong> Expliquez comment configurer Swagger/OpenAPI pour documenter votre API. Quels sont les avantages de cette documentation pour une plateforme e-commerce ?</p>",
          "reponse": "<p><strong>Configuration Swagger :</strong></p><pre style='background:#2d2d2d; color:#f8f8f2; padding:12px; border-radius:6px; font-size:0.85em;'>\nnpm install @nestjs/swagger swagger-ui-express\n\nconst config = new DocumentBuilder()\n  .setTitle('Sawamart API')\n  .setDescription('API de la plateforme e-commerce')\n  .setVersion('1.0')\n  .addBearerAuth()\n  .build();\n\nconst document = SwaggerModule.createDocument(app, config);\nSwaggerModule.setup('api', app, document);\n</pre><p><strong>Avantages :</strong></p><ul><li>Documentation interactive accessible via <code>/api</code></li><li>Facilite l'intégration avec les clients front-end (React, Angular, Flutter)</li><li>Permet aux équipes de collaborer efficacement</li><li>Réduit le temps d'onboarding pour les nouveaux développeurs</li><li>Permet de générer automatiquement des SDKs clients</li><li>Favorise la maintenance et l'évolution de l'API</li></ul>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
