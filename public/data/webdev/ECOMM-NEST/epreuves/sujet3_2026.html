<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
 "matiere": "Développement d'une API complète pour plateforme e-commerce",
 "classe": "Développement Web",
 "sequence": "Séquence 3",
 "anneeScolaire": "2025-2026",
 "exercices": [
   {
     "titre": "Exercice 1 : Maîtrise des concepts fondamentaux de NestJS et de l'architecture de l'API",
     "points": "4 pts",
     "enonce": "<div style='padding: 10px;'><p>Cet exercice porte sur les concepts fondamentaux de NestJS vus dans les premiers chapitres, notamment la création de modules, l'injection de dépendances et la gestion des entités.</p><div style='background: #f0f4f8; padding: 15px; border-radius: 8px; margin: 10px 0;'><p style='color: #1a3a4a;'><strong>Contexte :</strong> Vous développez le module de gestion des produits pour la plateforme e-commerce Sawamart.</p></div></div>",
     "questions": [
       {
         "question": "1) Expliquez le rôle d'un module (<code>@Module</code>) dans NestJS et décrivez les composants qu'il peut contenir. [citation:3]",
         "reponse": "Un module est le bloc de construction principal de l'architecture NestJS. Il permet d'organiser l'application en regroupant des fonctionnalités cohérentes. Un module peut contenir des contrôleurs (gestion des requêtes), des services (logique métier) et importer d'autres modules pour réutiliser leurs fonctionnalités. [citation:3]"
       },
       {
         "question": "2) Comment se déroule l'injection de dépendances dans NestJS ? Illustrez avec l'exemple d'un service <code>ProductService</code> injecté dans un contrôleur <code>ProductController</code>. [citation:3][citation:4]",
         "reponse": "NestJS utilise l'injection de dépendances basée sur les constructeurs. On utilise le décorateur <code>@Injectable()</code> pour déclarer un service injectable. Dans le contrôleur, on déclare le service dans le constructeur et NestJS l'instancie automatiquement. Exemple : <pre style='background: #2c3e50; color: #ecf0f1; padding: 8px; border-radius: 4px;'>@Controller('products')\nexport class ProductController {\n  constructor(private readonly productService: ProductService) {}\n}</pre> [citation:3][citation:4]"
       },
       {
         "question": "3) En vous basant sur les leçons 7 et 8, décrivez les étapes pour créer l'entité <code>Category</code> avec une relation parent-enfant en utilisant TypeORM. Quels décorateurs utiliserez-vous ? [citation:4]",
         "reponse": "On crée l'entité <code>Category</code> avec les décorateurs TypeORM : <code>@Entity()</code> pour définir la classe comme entité, <code>@PrimaryGeneratedColumn('uuid')</code> pour l'identifiant, <code>@Column()</code> pour les propriétés. Pour la relation parent-enfant, on utilise <code>@ManyToOne(() => Category, category => category.children, { nullable: true })</code> pour le parent et <code>@OneToMany(() => Category, category => category.parent)</code> pour les enfants. [citation:4]"
       }
     ]
   },
   {
     "titre": "Exercice 2 : Implémentation du système d'authentification et de gestion des utilisateurs",
     "points": "6 pts",
     "enonce": "<div style='padding: 10px;'><p>Cet exercice concerne la mise en place du système d'authentification et de gestion des profils utilisateurs.</p><div style='background: #f0f4f8; padding: 15px; border-radius: 8px; margin: 10px 0;'><p style='color: #1a3a4a;'><strong>Contexte :</strong> Vous devez sécuriser l'API de Sawamart avec JWT et permettre aux utilisateurs de gérer leur profil.</p></div></div>",
     "questions": [
       {
         "question": "4) Quels packages doivent être installés pour implémenter l'authentification JWT dans NestJS ? Décrivez brièvement leur rôle. [citation:1]",
         "reponse": "Les packages nécessaires sont : <code>@nestjs/jwt</code> pour la génération et la validation des tokens JWT, <code>@nestjs/passport</code> et <code>passport</code> pour l'intégration de Passport.js, et <code>passport-jwt</code> pour la stratégie d'authentification JWT. [citation:1]"
       },
       {
         "question": "5) Expliquez le fonctionnement de l'endpoint <code>/auth/register</code> (leçon 5). Quelles sont les étapes de traitement et les mesures de sécurité à prendre ?",
         "reponse": "L'endpoint <code>/auth/register</code> permet la création d'un nouvel utilisateur. Les étapes incluent : validation des données d'entrée (email, mot de passe, etc.), hachage du mot de passe avec <code>bcrypt</code>, création de l'utilisateur en base de données, et retour d'une réponse de succès. Les mesures de sécurité incluent le hachage du mot de passe, la validation des données et l'utilisation de transactions pour l'intégrité des données."
       },
       {
         "question": "6) Quel est le rôle du <code>JwtAuthGuard</code> ? Comment protège-t-il les routes de l'API ? [citation:1]",
         "reponse": "Le <code>JwtAuthGuard</code> est un mécanisme de protection des routes (Guard) qui vérifie la présence et la validité du token JWT dans la requête entrante. Il interrompt l'exécution de la requête si le token est invalide ou absent, et renvoie une erreur 401 (Unauthorized). [citation:1]"
       }
     ]
   },
   {
     "titre": "Exercice 3 : Gestion du wallet, des transactions et des paiements",
     "points": "6 pts",
     "enonce": "<div style='padding: 10px;'><p>Cet exercice aborde la gestion du portefeuille (wallet), des transactions et l'intégration des paiements Mobile Money.</p><div style='background: #f0f4f8; padding: 15px; border-radius: 8px; margin: 10px 0;'><p style='color: #1a3a4a;'><strong>Contexte :</strong> Sawamart permet à ses utilisateurs d'effectuer des dépôts, des retraits et des paiements via Mobile Money.</p></div></div>",
     "questions": [
       {
         "question": "7) Décrivez la structure des entités <code>Wallet</code> et <code>Transaction</code> de la leçon 9. Quelles sont leurs relations et propriétés clés ?",
         "reponse": "L'entité <code>Wallet</code> est liée à un utilisateur (<code>@OneToOne</code>) et contient un solde. L'entité <code>Transaction</code> est liée à un wallet (<code>@ManyToOne</code>) et contient le type (CREDIT, DEBIT, ESCROW), le montant, le statut (PENDING, COMPLETED, FAILED) et une référence unique."
       },
       {
         "question": "8) Expliquez comment gérer l'intégrité des données lors d'une transaction de crédit ou de débit avec les <code>QueryRunner</code> de TypeORM. [citation:4]",
         "reponse": "Les <code>QueryRunner</code> permettent de gérer des transactions SQL garantissant l'atomicité des opérations. On démarre une transaction (<code>startTransaction()</code>), on effectue les opérations (mise à jour du solde, création de la transaction), puis on valide (<code>commitTransaction()</code>) si tout est réussi, ou on annule (<code>rollbackTransaction()</code>) en cas d'erreur. [citation:4]"
       },
       {
         "question": "9) D'après la leçon 10, décrivez les étapes pour initier un dépôt via Mobile Money. Quels sont les rôles du comptable et comment valide-t-il ou rejette-t-il une demande ?",
         "reponse": "L'utilisateur initie un dépôt via un endpoint. La demande est enregistrée avec un statut 'PENDING'. Le comptable via un endpoint sécurisé peut valider (<code>/deposits/:id/validate</code>) ou rejeter (<code>/deposits/:id/reject</code>) la demande. La validation déclenche le crédit du wallet, tandis que le rejet annule la demande."
       }
     ]
   },
   {
     "titre": "Exercice 4 : Système de chat en temps réel et notifications",
     "points": "4 pts",
     "enonce": "<div style='padding: 10px;'><p>Cet exercice porte sur les WebSockets pour le chat en temps réel et le système de notifications push.</p><div style='background: #f0f4f8; padding: 15px; border-radius: 8px; margin: 10px 0;'><p style='color: #1a3a4a;'><strong>Contexte :</strong> Sawamart permet aux acheteurs et vendeurs de discuter en temps réel et reçoit des notifications push.</p></div></div>",
     "questions": [
       {
         "question": "10) D'après la leçon 11, comment configurer un WebSocket Gateway dans NestJS ? Quels sont les rôles des décorateurs <code>@WebSocketGateway</code> et <code>@SubscribeMessage</code> ?",
         "reponse": "On crée un Gateway avec <code>@WebSocketGateway()</code> et on le rend injectable avec <code>@Injectable()</code>. <code>@WebSocketGateway</code> définit la classe comme un gateway WebSocket. <code>@SubscribeMessage('event_name')</code> permet de définir des méthodes pour répondre à des événements spécifiques (ex: envoi de message)."
       },
       {
         "question": "11) Expliquez comment le système de notifications FCM est intégré à Sawamart pour envoyer des alertes en temps réel suite à une action (ex: nouveau message, commande). [citation:1]",
         "reponse": "Lorsqu'un événement se produit (ex: nouveau message dans un chat), le service <code>FCMService</code> est appelé avec le contenu de la notification et le token de l'utilisateur destinataire. Ce service utilise le SDK Firebase Admin pour envoyer la notification push via Firebase Cloud Messaging. [citation:1]"
       }
     ]
   }
 ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
