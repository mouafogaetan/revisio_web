<html lang="fr">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Développement d'une API complète pour plateforme e-commerce",
  "classe": "Développement Web",
  "sequence": "Séquence 6 : Administration, Sécurité, Tests et Déploiement",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Sécurisation de l'API avec Rate Limiting et Helmet",
      "points": "4 pts",
      "enonce": "<p>Dans le cadre du développement de l'API <strong>SawaMart</strong>, vous devez mettre en place des mesures de sécurité pour protéger l'application contre les attaques courantes.</p><p>L'API expose des endpoints critiques comme <code>/auth/login</code>, <code>/deposits/initiate</code> et <code>/admin/users</code> qui sont susceptibles d'être la cible d'attaques par déni de service ou de force brute.</p><p>Rappel : <code>helmet</code> est un middleware qui sécurise les en-têtes HTTP, et <code>ThrottlerModule</code> permet de limiter le nombre de requêtes par utilisateur.</p>",
      "questions": [
        {
          "question": "1) Expliquez le rôle du middleware <code>helmet</code> dans une application NestJS et listez trois en-têtes HTTP qu'il protège.",
          "reponse": "Le middleware <code>helmet</code> est un ensemble de 14 middlewares qui sécurisent les en-têtes HTTP de l'application en définissant des valeurs par défaut pour prévenir les vulnérabilités courantes comme le cross-site scripting (XSS), le clickjacking, les attaques par sniffing MIME, etc. [citation:1]\n\nTrois en-têtes protégés par Helmet :\n<ul><li><strong>X-Frame-Options</strong> : empêche le clickjacking en interdisant l'affichage de la page dans un iframe (<code>DENY</code> ou <code>SAMEORIGIN</code>).</li><li><strong>X-XSS-Protection</strong> : active la protection contre les attaques XSS dans les navigateurs récents.</li><li><strong>X-Content-Type-Options</strong> : empêche les navigateurs de faire du MIME sniffing, ce qui évite les attaques de type <em>drive-by download</em>.</li></ul>"
        },
        {
          "question": "2) En vous basant sur l'architecture modulaire de NestJS, décrivez comment configurer le <code>ThrottlerModule</code> pour limiter les requêtes sur les routes sensibles. Quelle configuration recommanderiez-vous pour <code>/auth/login</code> ?",
          "reponse": "Pour configurer le <code>ThrottlerModule</code>, on l'importe dans le module principal (<code>AppModule</code>) avec une configuration globale. NestJS s'inspire d'Angular pour proposer une architecture modulable, et l'injection de dépendances facilite l'ajout de ce type de protection [citation:1].\n\n<pre style='background:#1a202c; color:#a0aec0; padding:15px; border-radius:8px; font-size:0.8rem;'>\n// app.module.ts\nimport { ThrottlerModule, ThrottlerGuard } from '@nestjs/throttler';\n\n@Module({\n  imports: [\n    ThrottlerModule.forRoot({\n      ttl: 60, // temps en secondes\n      limit: 100, // nombre maximum de requêtes\n    }),\n  ],\n  providers: [\n    {\n      provide: APP_GUARD,\n      useClass: ThrottlerGuard,\n    },\n  ],\n})\nexport class AppModule {}\n</pre>\n\nPour l'endpoint <code>/auth/login</code>, une configuration plus restrictive est recommandée :\n<ul><li><strong>ttl</strong> : 60 secondes</li><li><strong>limit</strong> : 10 requêtes maximum par minute</li></ul>\nOn peut utiliser le décorateur <code>@Throttle()</code> pour surcharger la configuration globale :\n<pre style='background:#1a202c; color:#a0aec0; padding:15px; border-radius:8px; font-size:0.8rem;'>\n@Throttle({ default: { limit: 10, ttl: 60 } })\n@Post('login')\nasync login(@Body() loginDto: LoginDto) { ... }\n</pre>"
        },
        {
          "question": "3) Quelles sont les bonnes pratiques pour gérer les CORS dans une API NestJS destinée à une application mobile et web ?",
          "reponse": "La gestion des CORS est essentielle pour autoriser les domaines front-end à accéder à l'API. Dans NestJS, on configure CORS dans le fichier <code>main.ts</code> :\n\n<pre style='background:#1a202c; color:#a0aec0; padding:15px; border-radius:8px; font-size:0.8rem;'>\n// main.ts\nconst app = await NestFactory.create(AppModule);\napp.enableCors({\n  origin: process.env.NODE_ENV === 'production'\n    ? ['https://sawamart.com', 'https://api.sawamart.com']\n    : true,\n  methods: ['GET', 'POST', 'PUT', 'DELETE', 'PATCH'],\n  allowedHeaders: ['Content-Type', 'Authorization'],\n  credentials: true,\n});\n</pre>\n\n<strong>Bonnes pratiques :</strong>\n<ul><li><strong>En production</strong> : spécifier explicitement les domaines autorisés (pas de <code>*</code>).</li><li><strong>En développement</strong> : autoriser <code>true</code> ou l'URL du front-end local.</li><li><strong>Utiliser les variables d'environnement</strong> pour définir les origines autorisées.</li><li>Activer <code>credentials: true</code> si l'API utilise des cookies ou des tokens dans les en-têtes d'authentification.</li></ul>\nNestJS permet également de configurer CORS via le package <code>@nestjs/platform-express</code> pour un contrôle plus fin."
        }
      ]
    },
    {
      "titre": "Exercice 2 : Tests Unitaires et d'Intégration avec Jest",
      "points": "6 pts",
      "enonce": "<p>L'équipe de développement de <strong>SawaMart</strong> a implémenté le service de gestion des transactions (<code>TransactionService</code>). Vous devez maintenant écrire des tests unitaires et d'intégration pour valider son bon fonctionnement.</p><p>Voici le service à tester :</p><pre style='background:#1a202c; color:#a0aec0; padding:15px; border-radius:8px; font-size:0.8rem;'>\n@Injectable()\nexport class TransactionService {\n  constructor(\n    @InjectRepository(Transaction)\n    private transactionRepo: Repository&lt;Transaction&gt;,\n    private walletService: WalletService,\n  ) {}\n\n  async transfer(fromUserId: string, toUserId: string, amount: number) {\n    if (amount &lt;= 0) throw new BadRequestException('Montant invalide');\n    \n    const fromWallet = await this.walletService.getWallet(fromUserId);\n    const toWallet = await this.walletService.getWallet(toUserId);\n    \n    if (fromWallet.balance &lt; amount) {\n      throw new BadRequestException('Solde insuffisant');\n    }\n    \n    await this.walletService.debit(fromUserId, amount);\n    await this.walletService.credit(toUserId, amount);\n    \n    const transaction = this.transactionRepo.create({\n      fromUserId,\n      toUserId,\n      amount,\n      status: 'completed',\n      reference: `TX-${Date.now()}`,\n    });\n    return await this.transactionRepo.save(transaction);\n  }\n}\n</pre>",
      "questions": [
        {
          "question": "1) Écrivez un test unitaire pour la méthode <code>transfer</code> en utilisant Jest. Vous devez tester le cas nominal (transfert réussi) et les cas d'erreur (montant invalide, solde insuffisant).",
          "reponse": "```typescript\nimport { Test, TestingModule } from '@nestjs/testing';\nimport { TransactionService } from './transaction.service';\nimport { WalletService } from './wallet.service';\nimport { getRepositoryToken } from '@nestjs/typeorm';\nimport { Transaction } from './entities/transaction.entity';\nimport { BadRequestException } from '@nestjs/common';\n\ndescribe('TransactionService', () => {\n  let service: TransactionService;\n  let walletService: WalletService;\n  let transactionRepo: any;\n\n  beforeEach(async () => {\n    const module: TestingModule = await Test.createTestingModule({\n      providers: [\n        TransactionService,\n        {\n          provide: WalletService,\n          useValue: {\n            getWallet: jest.fn(),\n            debit: jest.fn(),\n            credit: jest.fn(),\n          },\n        },\n        {\n          provide: getRepositoryToken(Transaction),\n          useValue: {\n            create: jest.fn(),\n            save: jest.fn(),\n          },\n        },\n      ],\n    }).compile();\n\n    service = module.get<TransactionService>(TransactionService);\n    walletService = module.get<WalletService>(WalletService);\n    transactionRepo = module.get(getRepositoryToken(Transaction));\n  });\n\n  describe('transfer', () => {\n    it('devrait réussir un transfert quand le solde est suffisant', async () => {\n      // Arrange\n      const fromUserId = 'user-1';\n      const toUserId = 'user-2';\n      const amount = 5000;\n      const fromWallet = { id: 'w1', userId: fromUserId, balance: 10000 };\n      const toWallet = { id: 'w2', userId: toUserId, balance: 2000 };\n      const expectedTransaction = {\n        id: 'tx-1',\n        fromUserId,\n        toUserId,\n        amount,\n        status: 'completed',\n        reference: 'TX-1234567890',\n      };\n\n      jest.spyOn(walletService, 'getWallet')\n        .mockResolvedValueOnce(fromWallet)\n        .mockResolvedValueOnce(toWallet);\n      jest.spyOn(walletService, 'debit').mockResolvedValue(undefined);\n      jest.spyOn(walletService, 'credit').mockResolvedValue(undefined);\n      jest.spyOn(transactionRepo, 'create').mockReturnValue(expectedTransaction);\n      jest.spyOn(transactionRepo, 'save').mockResolvedValue(expectedTransaction);\n\n      // Act\n      const result = await service.transfer(fromUserId, toUserId, amount);\n\n      // Assert\n      expect(result).toEqual(expectedTransaction);\n      expect(walletService.debit).toHaveBeenCalledWith(fromUserId, amount);\n      expect(walletService.credit).toHaveBeenCalledWith(toUserId, amount);\n      expect(transactionRepo.save).toHaveBeenCalled();\n    });\n\n    it('devrait lever une exception quand le montant est invalide', async () => {\n      // Arrange\n      const fromUserId = 'user-1';\n      const toUserId = 'user-2';\n      const amount = -1000;\n\n      // Act & Assert\n      await expect(service.transfer(fromUserId, toUserId, amount))\n        .rejects.toThrow(BadRequestException);\n      await expect(service.transfer(fromUserId, toUserId, amount))\n        .rejects.toThrow('Montant invalide');\n      \n      expect(walletService.getWallet).not.toHaveBeenCalled();\n    });\n\n    it('devrait lever une exception quand le solde est insuffisant', async () => {\n      // Arrange\n      const fromUserId = 'user-1';\n      const toUserId = 'user-2';\n      const amount = 15000;\n      const fromWallet = { id: 'w1', userId: fromUserId, balance: 10000 };\n      const toWallet = { id: 'w2', userId: toUserId, balance: 2000 };\n\n      jest.spyOn(walletService, 'getWallet')\n        .mockResolvedValueOnce(fromWallet)\n        .mockResolvedValueOnce(toWallet);\n\n      // Act & Assert\n      await expect(service.transfer(fromUserId, toUserId, amount))\n        .rejects.toThrow(BadRequestException);\n      await expect(service.transfer(fromUserId, toUserId, amount))\n        .rejects.toThrow('Solde insuffisant');\n      \n      expect(walletService.debit).not.toHaveBeenCalled();\n      expect(walletService.credit).not.toHaveBeenCalled();\n    });\n  });\n});\n```"
        },
        {
          "question": "2) Expliquez l'intérêt des mocks dans les tests unitaires. Pourquoi utilisez-vous <code>jest.spyOn</code> plutôt qu'un mock simple ?",
          "reponse": "Les mocks sont essentiels dans les tests unitaires car ils permettent d'isoler la classe à tester de ses dépendances externes. Dans l'exemple ci-dessus, on mocke <code>WalletService</code> et le repository pour :\n<ul><li>Ne pas tester indirectement le comportement de <code>WalletService</code> (c'est l'objet d'un autre test).</li><li>Éviter les appels réels à la base de données (performance et données de test).</li><li>Contrôler les valeurs de retour et vérifier les interactions.</li></ul>\n\n<strong><code>jest.spyOn</code> vs mock simple :</strong>\n<ul><li><code>jest.spyOn</code> permet de <strong>surveiller</strong> l'appel d'une méthode réelle tout en pouvant modifier son comportement (<code>mockResolvedValue</code>, <code>mockReturnValue</code>).</li><li>On peut vérifier que la méthode a bien été appelée (<code>toHaveBeenCalled</code>), avec quels paramètres (<code>toHaveBeenCalledWith</code>), et combien de fois.</li><li>Cette approche est plus proche du fonctionnement réel du code et permet de détecter des changements de signature ou de logique.</li><li>Un mock simple remplace entièrement l'objet, ce qui peut masquer des problèmes d'interface.</li></ul>"

          "reponse": "Un <code>RolesGuard</code> est un guard qui vérifie les permissions d'un utilisateur après que son identité a été validée par <code>JwtAuthGuard</code>. Il s'assure que l'utilisateur possède le rôle requis pour accéder à une route donnée.\n\n<strong>Combinaison des guards :</strong>\n<pre style='background:#1a202c; color:#a0aec0; padding:15px; border-radius:8px; font-size:0.8rem;'>\n@UseGuards(JwtAuthGuard, RolesGuard)\n@Roles('admin')\n@Delete('users/:id')\nasync deleteUser(@Param('id') id: string) {\n  return this.userService.delete(id);\n}\n</pre>\n\n<strong>Ordre d'exécution :</strong>\n<ol><li><strong>JwtAuthGuard</strong> : valide le token JWT et attache l'utilisateur à la requête.</li><li><strong>RolesGuard</strong> : vérifie que le rôle de l'utilisateur est autorisé pour la route.</li></ol>\nCette approche respecte le principe de séparation des responsabilités : l'authentification (qui est l'utilisateur) est distincte de l'autorisation (ce qu'il a le droit de faire)."

          "question": "2) Proposez une implémentation du <code>RolesGuard</code> avec un décorateur <code>@Roles()</code> personnalisé.",
          "reponse": "```typescript\n// roles.decorator.ts\nimport { SetMetadata } from '@nestjs/common';\n\nexport const ROLES_KEY = 'roles';\nexport const Roles = (...roles: string[]) => SetMetadata(ROLES_KEY, roles);\n\n// roles.guard.ts\nimport { Injectable, CanActivate, ExecutionContext } from '@nestjs/common';\nimport { Reflector } from '@nestjs/core';\nimport { ROLES_KEY } from './roles.decorator';\n\n@Injectable()\nexport class RolesGuard implements CanActivate {\n  constructor(private reflector: Reflector) {}\n\n  canActivate(context: ExecutionContext): boolean {\n    // Récupère les rôles requis via le décorateur @Roles()\n    const requiredRoles = this.reflector.getAllAndOverride&lt;string[]&gt;(\n      ROLES_KEY,\n      [context.getHandler(), context.getClass()],\n    );\n    \n    // Si aucun rôle n'est requis, la route est publique\n    if (!requiredRoles) return true;\n\n    // Récupère l'utilisateur depuis la requête (attaché par JwtAuthGuard)\n    const { user } = context.switchToHttp().getRequest();\n    \n    // Vérifie si l'utilisateur possède l'un des rôles requis\n    return requiredRoles.some(role => user?.roles?.includes(role));\n  }\n}\n\n// Exemple d'utilisation\n@Controller('admin')\n@UseGuards(JwtAuthGuard, RolesGuard)\nexport class AdminController {\n  @Roles('admin')\n  @Get('users')\n  getUsers() { ... }\n\n  @Roles('admin', 'accountant')\n  @Get('financial-stats')\n  getFinancialStats() { ... }\n}\n```\n\n<strong>Points clés :</strong>\n<ul><li>Le <code>Reflector</code> permet de lire les métadonnées attachées au contrôleur ou à la méthode via <code>@SetMetadata</code>.</li><li>La vérification se fait après l'authentification JWT, donc <code>user</code> est disponible.</li><li>On peut définir plusieurs rôles autorisés (ex: <code>@Roles('admin', 'accountant')</code>) .</li><li>Si l'utilisateur n'a aucun rôle ou un rôle insuffisant, le guard retourne <code>false</code>, déclenchant une erreur 403.</li></ul>"

ge d'un utilisateur est une mesure modératrice réservée à l'admin.</td></tr>\n<tr><td style='padding:8px;'><code>GET /disputes/assign</code></;
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
