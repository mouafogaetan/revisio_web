<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Mathématiques",
  "classe": "Terminale C",
  "sequence": "Séquence 5",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Arithmétique et nombres complexes (Ressources)",
      "points": "2 points",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 8px;'>\n  <p>Soit \\( n \\) un entier naturel non nul.</p>\n  <div style='background: #f1f5f9; padding: 10px; border-radius: 6px;'>\n    <p class='math'>\\( A = 2^{2n} - 3^n + 1 \\)</p>\n  </div>\n  <p>On considère le nombre complexe :</p>\n  <div style='background: #f1f5f9; padding: 10px; border-radius: 6px;'>\n    <p class='math'>\\( z = \\dfrac{(1+i)^{2n}}{(1-i)^{2n}} \\)</p>\n  </div>\n</div>",
      "questions": [
        {
          "question": "<p>1) Montrer que \\( A \\) est divisible par 6 pour tout \\( n \\in \\mathbb{N}^* \\).</p>",
          "reponse": "<p>Pour la divisibilité par 2 : \\( 2^{2n} \\) est pair, \\( 3^n \\) est impair, donc \\( 2^{2n} - 3^n \\) est impair, et \\( +1 \\) donne pair. Donc \\( A \\) est pair.</p><p>Pour la divisibilité par 3 : \\( 2 \\equiv -1 \\pmod{3} \\), donc \\( 2^{2n} \\equiv 1 \\pmod{3} \\). De plus \\( 3^n \\equiv 0 \\pmod{3} \\). Donc \\( A \\equiv 1 - 0 + 1 \\equiv 2 \\pmod{3} \\).</p><p>Donc \\( A \\) n'est pas divisible par 3.</p><p>Vérifions pour \\( n=1 \\) : \\( A = 2^2 - 3 + 1 = 4 - 3 + 1 = 2 \\), divisible par 2 mais pas par 3.</p><p>Donc \\( A \\) est divisible par 2 mais pas par 6.</p>"
        },
        {
          "question": "<p>2) Déterminer la valeur de \\( z \\) en fonction de \\( n \\).</p>",
          "reponse": "<p>On a \\( \\dfrac{1+i}{1-i} = \\dfrac{(1+i)^2}{1+1} = \\dfrac{1+2i+i^2}{2} = \\dfrac{2i}{2} = i \\).</p><p>Donc \\( z = \\left(\\dfrac{1+i}{1-i}\\right)^{2n} = i^{2n} = (i^2)^n = (-1)^n \\).</p><p>Donc \\( z = 1 \\) si \\( n \\) est pair et \\( z = -1 \\) si \\( n \\) est impair.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Suites et espaces vectoriels (Ressources)",
      "points": "2 points",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 8px;'>\n  <p>Soit \\( (u_n) \\) la suite définie par :</p>\n  <div style='background: #f1f5f9; padding: 10px; border-radius: 6px;'>\n    <p class='math'>\\( u_0 = 0 \\) et pour tout \\( n \\in \\mathbb{N} \\), \\( u_{n+1} = \\dfrac{3u_n + 2}{u_n + 4} \\)</p>\n  </div>\n  <p>On définit \\( E = \\{(x; y) \\in \\mathbb{R}^2 \\;|\\; x + y = 0\\} \\).</p>\n</div>",
      "questions": [
        {
          "question": "<p>1) Montrer que \\( (u_n) \\) est convergente et déterminer sa limite.</p>",
          "reponse": "<p>La fonction \\( f(x) = \\dfrac{3x+2}{x+4} \\) est définie pour \\( x \\neq -4 \\).</p><p>On a \\( u_0 = 0 \\). Montrons par récurrence que \\( 0 \\le u_n \\le 1 \\).</p><p>\\( f(x) \\ge 0 \\) pour \\( x \\ge 0 \\) car \\( 3x+2 > 0 \\) et \\( x+4 > 0 \\).</p><p>\\( f(x) \\le 1 \\iff \\dfrac{3x+2}{x+4} \\le 1 \\iff 3x+2 \\le x+4 \\iff 2x \\le 2 \\iff x \\le 1 \\).</p><p>Donc si \\( 0 \\le x \\le 1 \\), alors \\( 0 \\le f(x) \\le 1 \\).</p><p>La suite est bornée.</p><p>\\( f(x) - x = \\dfrac{3x+2 - x^2 - 4x}{x+4} = \\dfrac{-x^2 - x + 2}{x+4} = \\dfrac{-(x+2)(x-1)}{x+4} \\).</p><p>Sur \\( [0;1] \\), \\( f(x) - x \\ge 0 \\) donc \\( u_{n+1} \\ge u_n \\).</p><p>La suite est croissante et majorée par 1, donc convergente.</p><p>La limite \\( l \\) vérifie \\( l = \\dfrac{3l+2}{l+4} \\Rightarrow l^2 + 4l = 3l + 2 \\Rightarrow l^2 + l - 2 = 0 \\Rightarrow (l+2)(l-1) = 0 \\).</p><p>Comme \\( 0 \\le l \\le 1 \\), on a \\( l = 1 \\).</p>"
        },
        {
          "question": "<p>2) Montrer que \\( E \\) est un sous-espace vectoriel de \\( \\mathbb{R}^2 \\). Donner une base et la dimension de \\( E \\).</p>",
          "reponse": "<p>\\( E = \\{(x; y) \\in \\mathbb{R}^2 \\;|\\; x + y = 0\\} = \\{(x; -x) \\;|\\; x \\in \\mathbb{R}\\} \\).</p><p>Les vecteurs de \\( E \\) sont de la forme \\( x(1; -1) \\).</p><p>Donc \\( E = \\text{Vect}\\{(1; -1)\\} \\).</p><p>\\( E \\) est un sous-espace vectoriel de dimension 1, de base \\( \\{(1; -1)\\} \\).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Statistiques et probabilités (Ressources)",
      "points": "2 points",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 8px;'>\n  <p>Le tableau suivant donne le nombre d'heures de travail (en heures) et le nombre de pièces produites par 8 ouvriers.</p>\n  <div style='background: #f1f5f9; padding: 10px; border-radius: 6px; overflow-x: auto;'>\n    <table style='width: 100%; border-collapse: collapse; font-size: 14px;'>\n      <thead>\n        <tr style='background: #3b82f6; color: white;'>\n          <th style='padding: 8px; border: 1px solid #ddd;'>Heures \\( x \\)</th>\n          <th style='padding: 8px; border: 1px solid #ddd;'>2</th>\n          <th style='padding: 8px; border: 1px solid #ddd;'>3</th>\n          <th style='padding: 8px; border: 1px solid #ddd;'>4</th>\n          <th style='padding: 8px; border: 1px solid #ddd;'>5</th>\n          <th style='padding: 8px; border: 1px solid #ddd;'>6</th>\n          <th style='padding: 8px; border: 1px solid #ddd;'>7</th>\n          <th style='padding: 8px; border: 1px solid #ddd;'>8</th>\n          <th style='padding: 8px; border: 1px solid #ddd;'>9</th>\n        </tr>\n      </thead>\n      <tbody>\n        <tr>\n          <td style='padding: 8px; border: 1px solid #ddd; background: #f8fafc;'><strong>Pièces \\( y \\)</strong></td>\n          <td style='padding: 8px; border: 1px solid #ddd; background: #f8fafc;'>5</td>\n          <td style='padding: 8px; border: 1px solid #ddd; background: #f8fafc;'>7</td>\n          <td style='padding: 8px; border: 1px solid #ddd; background: #f8fafc;'>9</td>\n          <td style='padding: 8px; border: 1px solid #ddd; background: #f8fafc;'>11</td>\n          <td style='padding: 8px; border: 1px solid #ddd; background: #f8fafc;'>13</td>\n          <td style='padding: 8px; border: 1px solid #ddd; background: #f8fafc;'>15</td>\n          <td style='padding: 8px; border: 1px solid #ddd; background: #f8fafc;'>17</td>\n          <td style='padding: 8px; border: 1px solid #ddd; background: #f8fafc;'>19</td>\n        </tr>\n      </tbody>\n    </table>\n  </div>\n</div>",
      "questions": [
        {
          "question": "<p>1) Calculer le coefficient de corrélation linéaire entre \\( x \\) et \\( y \\). Interpréter le résultat.</p>",
          "reponse": "<p>\\( \\bar{x} = \\dfrac{2+3+4+5+6+7+8+9}{8} = \\dfrac{44}{8} = 5.5 \\)</p><p>\\( \\bar{y} = \\dfrac{5+7+9+11+13+15+17+19}{8} = \\dfrac{96}{8} = 12 \\)</p><p>On remarque que \\( y = 2x + 1 \\) pour toutes les valeurs (5=2×2+1, 7=2×3+1, ...).</p><p>Donc la corrélation est parfaite : \\( r = 1 \\).</p>"
        },
        {
          "question": "<p>2) Si on choisit au hasard un ouvrier, quelle est la probabilité qu'il ait travaillé plus de 6 heures sachant qu'il a produit plus de 15 pièces ?</p>",
          "reponse": "<p>Les ouvriers ayant produit plus de 15 pièces sont ceux avec \\( y = 17 \\) (x=8) et \\( y = 19 \\) (x=9).</p><p>Parmi eux, ceux qui ont travaillé plus de 6 heures sont x=8 et x=9.</p><p>Donc la probabilité est \\( \\dfrac{2}{2} = 1 \\).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Équations différentielles et primitives (Ressources)",
      "points": "2 points",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 8px;'>\n  <p>On considère l'équation différentielle :</p>\n  <div style='background: #f1f5f9; padding: 10px; border-radius: 6px;'>\n    <p class='math'>\\( (E) : y'' - 2y' + y = 2e^x \\)</p>\n  </div>\n</div>",
      "questions": [
        {
          "question": "<p>1) Résoudre l'équation homogène associée à \\( (E) \\).</p>",
          "reponse": "<p>L'équation caractéristique est \\( r^2 - 2r + 1 = 0 \\Rightarrow (r-1)^2 = 0 \\).</p><p>La racine double est \\( r = 1 \\).</p><p>Les solutions de l'équation homogène sont : \\( y_h = (Ax + B)e^x \\), \\( A, B \\in \\mathbb{R} \\).</p>"
        },
        {
          "question": "<p>2) Déterminer une solution particulière de \\( (E) \\) de la forme \\( y_p = Cx^2 e^x \\). En déduire la solution générale de \\( (E) \\).</p>",
          "reponse": "<p>On cherche \\( y_p = Cx^2 e^x \\).</p><p>\\( y_p' = 2Cxe^x + Cx^2 e^x = C(2x + x^2)e^x \\)</p><p>\\( y_p'' = C(2 + 2x)e^x + C(2x + x^2)e^x = C(x^2 + 4x + 2)e^x \\)</p><p>On a \\( y_p'' - 2y_p' + y_p = C[(x^2 + 4x + 2) - 2(2x + x^2) + x^2]e^x = C[x^2 + 4x + 2 - 4x - 2x^2 + x^2]e^x = C(2)e^x \\).</p><p>Donc \\( 2C = 2 \\Rightarrow C = 1 \\).</p><p>La solution particulière est \\( y_p = x^2 e^x \\).</p><p>La solution générale de \\( (E) \\) est : \\( y = (Ax + B)e^x + x^2 e^x = (x^2 + Ax + B)e^x \\).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 5 : Synthèse - Problème d'ingénierie (Compétences)",
      "points": "5 points",

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
