<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Mathématiques",
  "classe": "Terminale C",
  "sequence": "Séquence 4",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Coniques - Parabole et Ellipse (Ressources)",
      "points": "2.5 points",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 8px;'>\n  <p>Le plan est muni d'un repère orthonormé \\( (O; \\vec{i}; \\vec{j}) \\).</p>\n  <p>On considère la parabole \\( (P) \\) d'équation :</p>\n  <div style='background: #f1f5f9; padding: 10px; border-radius: 6px;'>\n    <p class='math'>\\( y^2 = 8x \\)</p>\n  </div>\n  <p>et l'ellipse \\( (E) \\) d'équation :</p>\n  <div style='background: #f1f5f9; padding: 10px; border-radius: 6px;'>\n    <p class='math'>\\( \\dfrac{x^2}{25} + \\dfrac{y^2}{9} = 1 \\)</p>\n  </div>\n</div>",
      "questions": [
        {
          "question": "<p>1) Déterminer le foyer et la directrice de la parabole \\( (P) \\).</p>",
          "reponse": "<p>Pour \\( y^2 = 2px \\), on a \\( 2p = 8 \\Rightarrow p = 4 \\).</p><p>Le foyer est \\( F\\left(\\dfrac{p}{2}; 0\\right) = F(2; 0) \\).</p><p>La directrice est \\( x = -\\dfrac{p}{2} \\Rightarrow x = -2 \\).</p>"
        },
        {
          "question": "<p>2) Déterminer les foyers, les sommets et l'excentricité de l'ellipse \\( (E) \\).</p>",
          "reponse": "<p>On a \\( a^2 = 25 \\Rightarrow a = 5 \\) et \\( b^2 = 9 \\Rightarrow b = 3 \\).</p><p>\\( c^2 = a^2 - b^2 = 25 - 9 = 16 \\Rightarrow c = 4 \\).</p><p>Les foyers sont \\( F_1(-4; 0) \\) et \\( F_2(4; 0) \\).</p><p>Les sommets sont \\( A_1(-5; 0) \\), \\( A_2(5; 0) \\), \\( B_1(0; -3) \\), \\( B_2(0; 3) \\).</p><p>L'excentricité est \\( e = \\dfrac{c}{a} = \\dfrac{4}{5} \\).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Géométrie de l'espace et calcul vectoriel (Ressources)",
      "points": "2.5 points",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 8px;'>\n  <p>L'espace est muni d'un repère orthonormé \\( (O; \\vec{i}; \\vec{j}; \\vec{k}) \\).</p>\n  <p>On considère les points :</p>\n  <div style='background: #f1f5f9; padding: 10px; border-radius: 6px;'>\n    <p class='math'>\\( A(1; 2; -1) \\), \\( B(3; -1; 2) \\), \\( C(0; 1; 4) \\)</p>\n  </div>\n</div>",
      "questions": [
        {
          "question": "<p>1) Calculer le produit vectoriel \\( \\overrightarrow{AB} \\wedge \\overrightarrow{AC} \\). En déduire une équation cartésienne du plan \\( (ABC) \\).</p>",
          "reponse": "<p>\\( \\overrightarrow{AB} = (2; -3; 3) \\) et \\( \\overrightarrow{AC} = (-1; -1; 5) \\).</p><p>\\( \\overrightarrow{AB} \\wedge \\overrightarrow{AC} = \\begin{vmatrix} \\vec{i} & \\vec{j} & \\vec{k} \\\\ 2 & -3 & 3 \\\\ -1 & -1 & 5 \\end{vmatrix} = \\vec{i}((-3)(5) - 3(-1)) - \\vec{j}(2(5) - 3(-1)) + \\vec{k}(2(-1) - (-3)(-1)) \\)</p><p>\\( = \\vec{i}(-15 + 3) - \\vec{j}(10 + 3) + \\vec{k}(-2 - 3) = (-12; -13; -5) \\).</p><p>Un vecteur normal au plan est \\( \\vec{n}(12; 13; 5) \\) (en multipliant par -1).</p><p>L'équation du plan est : \\( 12(x-1) + 13(y-2) + 5(z+1) = 0 \\)</p><p>\\( 12x - 12 + 13y - 26 + 5z + 5 = 0 \\Rightarrow 12x + 13y + 5z - 33 = 0 \\).</p>"
        },
        {
          "question": "<p>2) Calculer le volume du tétraèdre \\( OABC \\).</p>",
          "reponse": "<p>Le volume du tétraèdre \\( OABC \\) est \\( V = \\dfrac{1}{6}|\\det(\\overrightarrow{OA}; \\overrightarrow{OB}; \\overrightarrow{OC})| \\).</p><p>\\( \\overrightarrow{OA} = (1; 2; -1) \\), \\( \\overrightarrow{OB} = (3; -1; 2) \\), \\( \\overrightarrow{OC} = (0; 1; 4) \\).</p><p>\\( \\det = \\begin{vmatrix} 1 & 2 & -1 \\\\ 3 & -1 & 2 \\\\ 0 & 1 & 4 \\end{vmatrix} = 1((-1)(4) - 2(1)) - 2(3(4) - 2(0)) + (-1)(3(1) - (-1)(0)) \\)</p><p>\\( = 1(-4 - 2) - 2(12 - 0) - 1(3 - 0) = -6 - 24 - 3 = -33 \\).</p><p>\\( V = \\dfrac{1}{6} \\times 33 = \\dfrac{33}{6} = \\dfrac{11}{2} \\) unités de volume.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Équations différentielles (Ressources)",
      "points": "2.5 points",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 8px;'>\n  <p>On considère les équations différentielles suivantes :</p>\n  <div style='background: #f1f5f9; padding: 10px; border-radius: 6px;'>\n    <p class='math'>\\( (E_1) : y' + 3y = 6 \\)</p>\n    <p class='math'>\\( (E_2) : y'' + 4y' + 5y = 0 \\)</p>\n  </div>\n</div>",
      "questions": [
        {
          "question": "<p>1) Résoudre l'équation différentielle \\( (E_1) \\).</p>",
          "reponse": "<p>L'équation sans second membre \\( y' + 3y = 0 \\) a pour solution \\( y = Ce^{-3x} \\), \\( C \\in \\mathbb{R} \\).</p><p>Une solution particulière constante : \\( y = k \\Rightarrow 0 + 3k = 6 \\Rightarrow k = 2 \\).</p><p>Donc les solutions de \\( (E_1) \\) sont : \\( y = Ce^{-3x} + 2 \\), \\( C \\in \\mathbb{R} \\).</p>"
        },
        {
          "question": "<p>2) Résoudre l'équation différentielle \\( (E_2) \\).</p>",
          "reponse": "<p>L'équation caractéristique est \\( r^2 + 4r + 5 = 0 \\).</p><p>\\( \\Delta = 16 - 20 = -4 = (2i)^2 \\).</p><p>Les racines sont \\( r_1 = \\dfrac{-4 - 2i}{2} = -2 - i \\) et \\( r_2 = -2 + i \\).</p><p>Les solutions de \\( (E_2) \\) sont : \\( y = e^{-2x}(A\\cos x + B\\sin x) \\), \\( A, B \\in \\mathbb{R} \\).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Étude de fonction et continuité (Ressources)",
      "points": "2.5 points",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 8px;'>\n  <p>On considère la fonction \\( f \\) définie par :</p>\n  <div style='background: #f1f5f9; padding: 10px; border-radius: 6px;'>\n    <p class='math'>\\( f(x) = \\dfrac{x^2 - 3x + 2}{x - 2} \\) pour \\( x \\neq 2 \\)</p>\n  </div>\n</div>",
      "questions": [
        {
          "question": "<p>1) Déterminer le domaine de définition de \\( f \\).</p>",
          "reponse": "<p>\\( f \\) est définie pour \\( x \\neq 2 \\), donc \\( D_f = \\mathbb{R} \\setminus \\{2\\} \\).</p>"
        },
        {
          "question": "<p>2) Étudier la continuité de \\( f \\) sur son domaine de définition. Existe-t-il un prolongement par continuité en \\( x = 2 \\) ?</p>",
          "reponse": "<p>Sur \\( \\mathbb{R} \\setminus \\{2\\} \\), \\( f \\) est continue car c'est un quotient de fonctions polynômes avec dénominateur non nul.</p><p>On a \\( f(x) = \\dfrac{x^2 - 3x + 2}{x - 2} = \\dfrac{(x-1)(x-2)}{x-2} = x - 1 \\) pour \\( x \\neq 2 \\).</p><p>\\( \\lim\\limits_{x \\to 2} f(x) = \\lim\\limits_{x \\to 2} (x-1) = 1 \\).</p><p>Donc \\( f \\) admet un prolongement par continuité en \\( x=2 \\) en posant \\( f(2) = 1 \\).</p>"
        },
        {
          "question": "<p>3) Étudier les variations de \\( f \\) sur \\( ]-\\infty; 2[ \\) et sur \\( ]2; +\\infty[ \\).</p>",
          "reponse": "<p>Pour \\( x \\neq 2 \\), \\( f(x) = x - 1 \\).</p><p>La fonction \\( f \\) est strictement croissante sur \\( ]-\\infty; 2[ \\) et sur \\( ]2; +\\infty[ \\) car sa dérivée est \\( f'(x) = 1 > 0 \\).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 5 : Problème d'optimisation de réseau (Compétences)",
      "points": "4 points",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 12px;'>\n  <p>Une entreprise de télécommunications souhaite installer des antennes-relais dans une zone urbaine. La zone est représentée par un graphe non orienté dont les sommets sont les quartiers à desservir et les arêtes représentent les liaisons possibles entre les antennes.</p>\n  <p>Le graphe \\( G \\) possède 6 sommets \\( A, B, C, D, E, F \\) avec les arêtes suivantes (les poids indiquent les coûts d'installation en millions de FCFA) :</p>\n  <ul>\n    <li>\\( AB : 4 \\), \\( AC : 3 \\), \\( AD : 6 \\)</li>\n    <li>\\( BC : 5 \\), \\( BD : 2 \\), \\( BE : 4 \\)</li>\n    <li>\\( CD : 7 \\), \\( CE : 8 \\), \\( CF : 3 \\)</li>\n    <li>\\( DE : 9 \\), \\( DF : 5 \\)</li>\n    <li>\\( EF : 2 \\)</li>\n  </ul>\n  <p>L'entreprise souhaite connecter tous les quartiers avec un coût total minimal.</p>\n  <p>Par ailleurs, pour une étude de couverture, on considère la fonction \\( f(x) = \\dfrac{\\ln(x+1)}{x+2} \\) définie sur \\( [-1; +\\infty[ \\) qui modélise la qualité du signal en fonction de la distance \\( x \\) (en km) entre deux antennes.</p>\n</div>",
      "questions": [
        {
          "question": "<p>1) Déterminer l'arbre couvrant de poids minimum du graphe \\( G \\) en utilisant l'algorithme de Kruskal. Quel est le coût total minimal ?</p>",
          "reponse": "<p>On trie les arêtes par poids croissant :</p><p>EF(2), BD(2), AC(3), CF(3), AB(4), BE(4), DF(5), BC(5), AD(6), CD(7), CE(8), DE(9).</p><p>Algorithme de Kruskal :</p><ul><li>On prend EF (2) → pas de cycle</li><li>On prend BD (2) → pas de cycle</li><li>On prend AC (3) → pas de cycle</li><li>On prend CF (3) → pas de cycle</li><li>On prend AB (4) → crée un cycle A-C-F-B-D-A ? Non, A-B ajoute une connexion</li></ul><p>On a maintenant les sommets A, B, C, D, F connectés. Il manque E.</p><p>On prend BE (4) → pas de cycle</p><p>L'arbre couvrant est composé des arêtes : EF(2), BD(2), AC(3), CF(3), BE(4).</p><p>Coût total = 2 + 2 + 3 + 3 + 4 = 14 millions de FCFA.</p>"
        },
        {
          "question": "<p>2) Étudier les variations de la fonction \\( f(x) = \\dfrac{\\ln(x+1)}{x+2} \\) sur \\( [0; +\\infty[ \\).</p>",

 - 4 \\).</p><p>Donc \\( x^3 + 4x^2 + x - 4 = 0 \\Rightarrow (x-1)(x^2 + 5x + 4) + 2x = 0 \\) ?</p><p>La factorisation correcte est : \\( x^3 + 4x^2 + x - 4 = (x-1)(x^2 + 5x + 4) + 2x \\).</p><p>En testant \\( x = 1 \\) : \\( f(1) = 0.75 \\) et \\( y = 1 \\), donc \\( (1;1) \\) n'est pas sur la courbe.</p><p>L'équation \\( x^3 + 4x^2 + x - 4 = 0 \\) n'a pas de solution simple. La solution approchée est \\( x \\approx 0.82 \\).</p>"

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
