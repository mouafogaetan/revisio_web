<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Mathématiques",
  "classe": "Terminale C",
  "sequence": "Séquence 6 - Épreuve de Synthèse",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Arithmétique et nombres complexes (Ressources)",
      "points": "2 points",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 8px;'>\n  <p>Soit \\( n \\) un entier naturel.</p>\n  <div style='background: #f1f5f9; padding: 10px; border-radius: 6px;'>\n    <p class='math'>\\( A = 2^{3n} + (-1)^n \\)</p>\n  </div>\n  <p>On considère le nombre complexe :</p>\n  <div style='background: #f1f5f9; padding: 10px; border-radius: 6px;'>\n    <p class='math'>\\( z = \\dfrac{1 + i\\sqrt{3}}{1 - i\\sqrt{3}} \\)</p>\n  </div>\n</div>",
      "questions": [
        {
          "question": "<p>1) Déterminer les restes possibles de \\( A \\) modulo 7 en fonction de \\( n \\).</p>",
          "reponse": "<p>On a \\( 2^3 = 8 \\equiv 1 \\pmod{7} \\).</p><p>Donc \\( 2^{3n} = (2^3)^n \\equiv 1^n \\equiv 1 \\pmod{7} \\).</p><p>Par ailleurs, \\( (-1)^n \\) est égal à 1 si \\( n \\) est pair et -1 si \\( n \\) est impair.</p><p>Donc :</p><ul><li>Si \\( n \\) est pair : \\( A \\equiv 1 + 1 = 2 \\pmod{7} \\)</li><li>Si \\( n \\) est impair : \\( A \\equiv 1 - 1 = 0 \\pmod{7} \\)</li></ul><p>Les restes possibles sont 0 et 2.</p>"
        },
        {
          "question": "<p>2) Déterminer la forme exponentielle de \\( z \\) et en déduire \\( z^{2025} \\).</p>",
          "reponse": "<p>\\( 1 + i\\sqrt{3} = 2\\left(\\dfrac{1}{2} + i\\dfrac{\\sqrt{3}}{2}\\right) = 2e^{i\\pi/3} \\).</p><p>\\( 1 - i\\sqrt{3} = 2\\left(\\dfrac{1}{2} - i\\dfrac{\\sqrt{3}}{2}\\right) = 2e^{-i\\pi/3} \\).</p><p>Donc \\( z = \\dfrac{2e^{i\\pi/3}}{2e^{-i\\pi/3}} = e^{i\\pi/3 - (-i\\pi/3)} = e^{i2\\pi/3} \\).</p><p>Alors \\( z^{2025} = e^{i \\times 2025 \\times 2\\pi/3} = e^{i \\times 1350\\pi} = e^{i \\times 675 \\times 2\\pi} = 1 \\).</p><p>Donc \\( z^{2025} = 1 \\).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Espaces vectoriels et applications linéaires (Ressources)",
      "points": "2 points",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 8px;'>\n  <p>Soit \\( f \\) l'application linéaire de \\( \\mathbb{R}^3 \\) dans \\( \\mathbb{R}^3 \\) définie par :</p>\n  <div style='background: #f1f5f9; padding: 10px; border-radius: 6px;'>\n    <p class='math'>\\( f(x; y; z) = (x + y - z; 2x - y + z; -x + 3y - 2z) \\)</p>\n  </div>\n</div>",
      "questions": [
        {
          "question": "<p>1) Déterminer le noyau de \\( f \\). En déduire si \\( f \\) est bijective.</p>",
          "reponse": "<p>On résout \\( \\begin{cases} x + y - z = 0 \\\\ 2x - y + z = 0 \\\\ -x + 3y - 2z = 0 \\end{cases} \\)</p><p>De la première, \\( z = x + y \\).</p><p>En remplaçant dans la deuxième : \\( 2x - y + x + y = 0 \\Rightarrow 3x = 0 \\Rightarrow x = 0 \\).</p><p>Alors \\( z = y \\).</p><p>La troisième : \\( -0 + 3y - 2y = y = 0 \\Rightarrow y = 0 \\), donc \\( z = 0 \\).</p><p>Donc \\( \\ker(f) = \\{(0;0;0)\\} \\).</p><p>\\( f \\) est injective. Comme on est en dimension finie, \\( f \\) est bijective.</p>"
        },
        {
          "question": "<p>2) Déterminer l'image de \\( f \\) et donner une base.</p>",
          "reponse": "<p>Comme \\( f \\) est bijective, \\( \\text{Im}(f) = \\mathbb{R}^3 \\).</p><p>Une base de \\( \\mathbb{R}^3 \\) est \\( \\{(1;0;0), (0;1;0), (0;0;1)\\} \\).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Similitudes et isométries (Ressources)",
      "points": "2 points",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 8px;'>\n  <p>Le plan complexe est muni d'un repère orthonormé direct \\( (O; \\vec{u}; \\vec{v}) \\).</p>\n  <p>On considère l'application \\( f \\) d'écriture complexe :</p>\n  <div style='background: #f1f5f9; padding: 10px; border-radius: 6px;'>\n    <p class='math'>\\( z' = 2iz + 1 - i \\)</p>\n  </div>\n</div>",
      "questions": [
        {
          "question": "<p>1) Déterminer la nature de \\( f \\). Préciser ses éléments caractéristiques.</p>",
          "reponse": "<p>\\( f(z) = 2iz + 1 - i \\).</p><p>\\( a = 2i \\), \\( a \\neq 1 \\), donc \\( f \\) est une similitude directe.</p><p>Rapport : \\( k = |a| = |2i| = 2 \\).</p><p>Angle : \\( \\theta = \\arg(2i) = \\dfrac{\\pi}{2} \\).</p><p>Centre : \\( \\omega = \\dfrac{b}{1-a} = \\dfrac{1-i}{1-2i} = \\dfrac{(1-i)(1+2i)}{1+4} = \\dfrac{1+2i - i - 2i^2}{5} = \\dfrac{1+i+2}{5} = \\dfrac{3+i}{5} = \\dfrac{3}{5} + \\dfrac{1}{5}i \\).</p><p>Donc \\( f \\) est une similitude directe de centre \\( \\Omega\\left(\\dfrac{3}{5}; \\dfrac{1}{5}\\right) \\), de rapport 2 et d'angle \\( \\dfrac{\\pi}{2} \\).</p>"
        },
        {
          "question": "<p>2) Déterminer l'image du point \\( A \\) d'affixe \\( z_A = 2 + i \\) par \\( f \\).</p>",
          "reponse": "<p>\\( z_{A'} = 2i(2+i) + 1 - i = 4i + 2i^2 + 1 - i = 4i - 2 + 1 - i = -1 + 3i \\).</p><p>Donc \\( A'(-1; 3) \\).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Probabilités et statistiques (Ressources)",
      "points": "2 points",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 8px;'>\n  <p>Une entreprise fabrique des composants électroniques. La probabilité qu'un composant soit défectueux est de 0.03.</p>\n  <p>On prélève un échantillon de 50 composants.</p>\n</div>",
      "questions": [
        {
          "question": "<p>1) Quelle est la probabilité d'avoir exactement 2 composants défectueux ?</p>",
          "reponse": "<p>Soit \\( X \\) le nombre de composants défectueux. \\( X \\sim \\mathcal{B}(50; 0.03) \\).</p><p>\\( P(X=2) = \\binom{50}{2}(0.03)^2(0.97)^{48} \\).</p><p>\\( \\binom{50}{2} = \\dfrac{50 \\times 49}{2} = 1225 \\).</p><p>\\( (0.03)^2 = 0.0009 \\).</p><p>\\( (0.97)^{48} \\approx 0.232 \\).</p><p>\\( P(X=2) \\approx 1225 \\times 0.0009 \\times 0.232 \\approx 0.2557 \\).</p>"
        },
        {
          "question": "<p>2) Calculer l'espérance et l'écart-type de \\( X \\).</p>",
          "reponse": "<p>\\( E(X) = np = 50 \\times 0.03 = 1.5 \\).</p><p>\\( V(X) = np(1-p) = 50 \\times 0.03 \\times 0.97 = 1.455 \\).</p><p>\\( \\sigma(X) = \\sqrt{1.455} \\approx 1.206 \\).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 5 : Problème de synthèse - Modélisation économique (Compétences)",
      "points": "5 points",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 12px;'>\n  <p>Une entreprise produit et vend des ordinateurs. Le bénéfice mensuel (en millions de FCFA) est modélisé par la fonction \\( B \\) définie sur \\( [0; 10] \\) par :</p>\n  <div style='background: #f1f5f9; padding: 10px; border-radius: 6px;'>\n    <p class='math'>\\( B(x) = -x^3 + 12x^2 - 35x + 50 \\)</p>\n  </div>\n  <p>où \\( x \\) est le nombre de milliers d'ordinateurs produits.</p>\n  <p>L'entreprise doit également gérer son stock. La quantité en stock \\( S(t) \\) (en milliers d'unités) au cours du temps \\( t \\) (en mois) est donnée par l'équation différentielle :</p>\n  <div style='background: #f1f5f9; padding: 10px; border-radius: 6px;'>\n    <p class='math'>\\( S'(t) + 0.5S(t) = 10e^{-0.5t} \\)</p>\n  </div>\n  <p>avec \\( S(0) = 5 \\).</p>\n  <p>Enfin, une étude de marché a montré que le nombre de clients satisfaits suit une loi binomiale de paramètres \\( n=100 \\) et \\( p=0.85 \\).</p>\n  <p>L'entreprise souhaite estimer la probabilité d'avoir au moins 80 clients satisfaits.</p>\n</div>",
      "questions": [
        {
          "question": "<p>1) Étudier les variations de \\( B \\) sur \\( [0; 10] \\) et déterminer la production qui maximise le bénéfice.</p>",
          "reponse": "<p>\\( B'(x) = -3x^2 + 24x - 35 \\).</p><p>Racines de \\( -3x^2 + 24x - 35 = 0 \\Rightarrow 3x^2 - 24x + 35 = 0 \\).</p><p>\\( \\Delta = 576 - 420 = 156 = (2\\sqrt{39})^2 \\).</p><p>\\( x_1 = \\dfrac{24 - 2\\sqrt{39}}{6} = \\dfrac{12 - \\sqrt{39}}{3} \\approx 1.92 \\)</p><p>\\( x_2 = \\dfrac{24 + 2\\sqrt{39}}{6} = \\dfrac{12 + \\sqrt{39}}{3} \\approx 6.08 \\)</p><p>\\( B'(x) \\ge 0 \\) sur \\( [1.92; 6.08] \\) et \\( B'(x) \\le 0 \\) sur \\( [0; 1.92] \\) et \\( [6.08; 10] \\).</p><p>Donc \\( B \\) est croissante sur \\( [1.92; 6.08] \\) et décroissante sur \\( [0; 1.92] \\) et \\( [6.08; 10] \\).</p><p>Le maximum est en \\( x = \\dfrac{12 + \\sqrt{39}}{3} \\approx 6.08 \\) milliers d'ordinateurs.</p>"
        },
        {
          "question": "<p>2) Résoudre l'équation différentielle \\( S'(t) + 0.5S(t) = 10e^{-0.5t} \\) avec \\( S(0) = 5 \\).</p>",
          "reponse": "<p>L'équation sans second membre \\( S' + 0.5S = 0 \\) a pour solution \\( S_h = Ce^{-0.5t} \\).</p><p>On cherche une solution particulière de la forme \\( S_p = ate^{-0.5t} \\).</p><p>\\( S_p' = ae^{-0.5t} - 0.5ate^{-0.5t} \\).</p><p>\\( S_p' + 0.5S_p = ae^{-0.5t} - 0.5ate^{-0.5t} + 0.5ate^{-0.5t} = ae^{-0.5t} \\).</p><p>Donc \\( a = 10 \\) et \\( S_p = 10te^{-0.5t} \\).</p><p>La solution générale est \\( S(t) = (C + 10t)e^{-0.5t} \\).</p><p>\\( S(0) = C = 5 \\).</p><p>Donc \\( S(t) = (5 + 10t)e^{-0.5t} \\).</p>"
        },
        {

      "questions": [

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
