<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Mathématiques",
  "classe": "Terminale C",
  "sequence": "Séquence 2",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Espaces vectoriels et sous-espaces (Ressources)",
      "points": "3 points",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 8px;'>\n  <p>On considère l'espace vectoriel \\( \\mathbb{R}^3 \\) muni de sa structure usuelle.</p>\n  <p>Soient les sous-ensembles suivants :</p>\n  <div style='background: #f1f5f9; padding: 10px; border-radius: 6px;'>\n    <p class='math'>\\( F = \\{(x; y; z) \\in \\mathbb{R}^3 \\;|\\; x - y + z = 0\\} \\)</p>\n    <p class='math'>\\( G = \\{(x; y; z) \\in \\mathbb{R}^3 \\;|\\; 2x + y - z = 0\\} \\)</p>\n    <p class='math'>\\( H = \\{(x; y; z) \\in \\mathbb{R}^3 \\;|\\; x + 2y - z = 0 \\;\\text{et}\\; x - y + 3z = 0\\} \\)</p>\n  </div>\n</div>",
      "questions": [
        {
          "question": "<p>1) Montrer que \\( F \\) est un sous-espace vectoriel de \\( \\mathbb{R}^3 \\). Donner une base de \\( F \\) et sa dimension.</p>",
          "reponse": "<p>\\( F \\) est l'ensemble des solutions d'une équation linéaire homogène, donc c'est un sous-espace vectoriel de \\( \\mathbb{R}^3 \\).</p><p>On a \\( z = -x + y \\), donc les vecteurs de \\( F \\) s'écrivent \\( (x; y; -x+y) = x(1;0;-1) + y(0;1;1) \\).</p><p>La famille \\( \\{(1;0;-1), (0;1;1)\\} \\) est libre et génératrice de \\( F \\), donc c'est une base de \\( F \\) et \\( \\dim(F) = 2 \\).</p>"
        },
        {
          "question": "<p>2) Montrer que \\( H \\) est un sous-espace vectoriel de \\( \\mathbb{R}^3 \\) et déterminer sa dimension.</p>",
          "reponse": "<p>\\( H \\) est l'intersection de deux sous-espaces vectoriels (chacun défini par une équation linéaire homogène), donc \\( H \\) est un sous-espace vectoriel de \\( \\mathbb{R}^3 \\).</p><p>Résolvons le système : \\( \\begin{cases} x + 2y - z = 0 \\\\ x - y + 3z = 0 \\end{cases} \\)</p><p>De la première, \\( z = x + 2y \\). En remplaçant dans la seconde : \\( x - y + 3(x+2y) = 0 \\Rightarrow x - y + 3x + 6y = 0 \\Rightarrow 4x + 5y = 0 \\Rightarrow x = -\\dfrac{5}{4}y \\).</p><p>Alors \\( z = -\\dfrac{5}{4}y + 2y = \\dfrac{3}{4}y \\).</p><p>Les vecteurs de \\( H \\) sont de la forme \\( \\left(-\\dfrac{5}{4}y; y; \\dfrac{3}{4}y\\right) = y\\left(-\\dfrac{5}{4}; 1; \\dfrac{3}{4}\\right) \\).</p><p>Donc \\( \\dim(H) = 1 \\) et une base est \\( \\left\\{\\left(-\\dfrac{5}{4}; 1; \\dfrac{3}{4}\\right)\\right\\} \\).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Suites numériques (Ressources)",
      "points": "3 points",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 8px;'>\n  <p>Soit \\( (u_n) \\) la suite définie par :</p>\n  <div style='background: #f1f5f9; padding: 10px; border-radius: 6px;'>\n    <p class='math'>\\( u_0 = 1 \\) et pour tout \\( n \\in \\mathbb{N} \\), \\( u_{n+1} = \\dfrac{2u_n + 3}{u_n + 4} \\)</p>\n  </div>\n  <p>On considère également la suite \\( (v_n) \\) définie par :</p>\n  <div style='background: #f1f5f9; padding: 10px; border-radius: 6px;'>\n    <p class='math'>\\( v_n = \\dfrac{u_n - 1}{u_n + 3} \\)</p>\n  </div>\n</div>",
      "questions": [
        {
          "question": "<p>1) Montrer que la suite \\( (v_n) \\) est géométrique. Préciser sa raison et son premier terme.</p>",
          "reponse": "<p>On a \\( v_{n+1} = \\dfrac{u_{n+1} - 1}{u_{n+1} + 3} = \\dfrac{\\dfrac{2u_n+3}{u_n+4} - 1}{\\dfrac{2u_n+3}{u_n+4} + 3} = \\dfrac{2u_n+3 - u_n - 4}{2u_n+3 + 3u_n + 12} = \\dfrac{u_n - 1}{5u_n + 15} = \\dfrac{u_n - 1}{5(u_n + 3)} = \\dfrac{1}{5}v_n \\).</p><p>Donc \\( (v_n) \\) est géométrique de raison \\( \\dfrac{1}{5} \\).</p><p>\\( v_0 = \\dfrac{u_0 - 1}{u_0 + 3} = \\dfrac{1 - 1}{1 + 3} = 0 \\).</p><p>Donc \\( v_n = 0 \\) pour tout \\( n \\), ce qui donne \\( u_n = 1 \\) pour tout \\( n \\). La suite est constante.</p>"
        },
        {
          "question": "<p>2) En déduire l'expression de \\( u_n \\) en fonction de \\( n \\), puis calculer \\( \\lim\\limits_{n \\to +\\infty} u_n \\).</p>",
          "reponse": "<p>Comme \\( v_n = 0 \\) pour tout \\( n \\), on a \\( \\dfrac{u_n - 1}{u_n + 3} = 0 \\Rightarrow u_n - 1 = 0 \\Rightarrow u_n = 1 \\).</p><p>Donc \\( u_n = 1 \\) pour tout \\( n \\in \\mathbb{N} \\).</p><p>La limite est \\( \\lim\\limits_{n \\to +\\infty} u_n = 1 \\).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Statistiques à deux variables (Ressources)",
      "points": "3 points",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 8px;'>\n  <p>Le tableau ci-dessous donne le nombre d'habitants (en milliers) d'une ville en fonction de l'année.</p>\n  <div style='background: #f1f5f9; padding: 10px; border-radius: 6px; overflow-x: auto;'>\n    <table style='width: 100%; border-collapse: collapse; font-size: 14px;'>\n      <thead>\n        <tr style='background: #3b82f6; color: white;'>\n          <th style='padding: 8px; border: 1px solid #ddd;'>Année \\( x \\)</th>\n          <th style='padding: 8px; border: 1px solid #ddd;'>2010</th>\n          <th style='padding: 8px; border: 1px solid #ddd;'>2012</th>\n          <th style='padding: 8px; border: 1px solid #ddd;'>2014</th>\n          <th style='padding: 8px; border: 1px solid #ddd;'>2016</th>\n          <th style='padding: 8px; border: 1px solid #ddd;'>2018</th>\n        </tr>\n      </thead>\n      <tbody>\n        <tr>\n          <td style='padding: 8px; border: 1px solid #ddd; background: #f8fafc;'><strong>Population \\( y \\)</strong></td>\n          <td style='padding: 8px; border: 1px solid #ddd; background: #f8fafc;'>15</td>\n          <td style='padding: 8px; border: 1px solid #ddd; background: #f8fafc;'>18</td>\n          <td style='padding: 8px; border: 1px solid #ddd; background: #f8fafc;'>22</td>\n          <td style='padding: 8px; border: 1px solid #ddd; background: #f8fafc;'>27</td>\n          <td style='padding: 8px; border: 1px solid #ddd; background: #f8fafc;'>33</td>\n        </tr>\n      </tbody>\n    </table>\n  </div>\n</div>",
      "questions": [
        {
          "question": "<p>1) Calculer les coordonnées du point moyen \\( G \\).</p>",
          "reponse": "<p>\\( \\bar{x} = \\dfrac{2010+2012+2014+2016+2018}{5} = 2014 \\)</p><p>\\( \\bar{y} = \\dfrac{15+18+22+27+33}{5} = \\dfrac{115}{5} = 23 \\)</p><p>Donc \\( G(2014; 23) \\).</p>"
        },
        {
          "question": "<p>2) Déterminer l'équation de la droite de régression de \\( y \\) en \\( x \\) par la méthode des moindres carrés.</p>",
          "reponse": "<p>On pose \\( X = x - 2010 \\) pour simplifier les calculs. On obtient \\( X_i \\) : 0, 2, 4, 6, 8.</p><p>\\( \\bar{X} = 4 \\), \\( \\bar{y} = 23 \\)</p><p>\\( \\sum X_i^2 = 0 + 4 + 16 + 36 + 64 = 120 \\)</p><p>\\( \\sum X_i y_i = 0\\times15 + 2\\times18 + 4\\times22 + 6\\times27 + 8\\times33 = 0+36+88+162+264 = 550 \\)</p><p>\\( a = \\dfrac{\\sum X_i y_i - n\\bar{X}\\bar{y}}{\\sum X_i^2 - n\\bar{X}^2} = \\dfrac{550 - 5\\times4\\times23}{120 - 5\\times16} = \\dfrac{550 - 460}{120 - 80} = \\dfrac{90}{40} = 2.25 \\)</p><p>\\( b = \\bar{y} - a\\bar{X} = 23 - 2.25\\times4 = 23 - 9 = 14 \\)</p><p>Donc \\( y = 2.25X + 14 \\). En revenant à \\( x \\) : \\( y = 2.25(x-2010) + 14 = 2.25x - 4522.5 + 14 = 2.25x - 4508.5 \\).</p>"
        },
        {
          "question": "<p>3) En utilisant cette droite, estimer la population en 2022.</p>",
          "reponse": "<p>Pour \\( x = 2022 \\) : \\( y = 2.25 \\times 2022 - 4508.5 = 4549.5 - 4508.5 = 41 \\) milliers d'habitants.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Nombres complexes - géométrie (Ressources)",
      "points": "3 points",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 8px;'>\n  <p>Le plan complexe est muni d'un repère orthonormé direct \\( (O; \\vec{u}; \\vec{v}) \\).</p>\n  <p>On considère les points \\( A \\), \\( B \\) et \\( C \\) d'affixes respectives :</p>\n  <div style='background: #f1f5f9; padding: 10px; border-radius: 6px;'>\n    <p class='math'>\\( z_A = 1 + i \\), \\( z_B = 3 + 3i \\), \\( z_C = 5 - i \\)</p>\n  </div>\n  <p>On considère l'application \\( f \\) qui à tout point \\( M \\) d'affixe \\( z \\) associe le point \\( M' \\) d'affixe :</p>\n  <div style='background: #f1f5f9; padding: 10px; border-radius: 6px;'>\n    <p class='math'>\\( z' = (1 + i)z + 1 - 2i \\)</p>\n  </div>\n</div>",
      "questions": [
        {
          "question": "<p>1) Déterminer la nature de l'application \\( f \\). Préciser ses éléments caractéristiques.</p>",
          "reponse": "<p>\\( f(z) = (1+i)z + 1 - 2i \\).</p><p>On a \\( a = 1+i \\). Comme \\( a \\neq 1 \\), \\( f \\) est une similitude directe de rapport \\( |a| = |1+i| = \\sqrt{2} \\) et d'angle \\( \\arg(a) = \\arg(1+i) = \\dfrac{\\pi}{4} \\).</p><p>Le centre \\( \\omega \\) est solution de \\( \\omega = a\\omega + b \\), où \\( b = 1 - 2i \\).</p><p>\\( \\omega - a\\omega = b \\Rightarrow \\omega(1-a) = b \\Rightarrow \\omega = \\dfrac{b}{1-a} = \\dfrac{1-2i}{1-(1+i)} = \\dfrac{1-2i}{-i} = \\dfrac{1-2i}{-i} = \\dfrac{(1-2i)i}{1} = i - 2i^2 = i + 2 = 2 + i \\).</p><p>Donc \\( f \\) est une similitude directe de centre \\( \\Omega(2+i) \\), de rapport \\( \\sqrt{2} \\) et d'angle \\( \\dfrac{\\pi}{4} \\).</p>"
        },
        {

\\( D(18;48) : B = 100000(5\\times18 + 4\\times48) = 100000(90 + 192) = 100000 \\times 282 = 28 200 000 \\)</li></ul><p>Le bénéfice maximal est de 28 200 000 FCFA pour 18 tonnes de Jus A et 48 tonnes de Jus B.</p>"

    {
      "titre": "Exercice 6 : Étude démographique et géométrique (Compétences)",

      "enonce": "<div style='display: flex; flex-direction: column; gap: 12px;'>\n  <p>Une région connaît une croissance démographique. Le tableau suivant donne la population (en milliers d'habitants) en fonction du rang de l'année.</p>\n  <div style='background: #f1f5f9; padding: 10px; border-radius: 6px; overflow-x: auto;'>\n    <table style='width: 100%; border-collapse: collapse; font-size: 14px;'>\n      <thead>\n        <tr style='background: #3b82f6; color: white;'>\n          <th style='padding: 8px; border: 1px solid #ddd;'>Rang \\( x \\)</th>\n          <th style='padding: 8px; border: 1px solid #ddd;'>0</th>\n          <th style='padding: 8px; border: 1px solid #ddd;'>1</th>\n          <th style='padding: 8px; border: 1px solid #ddd;'>2</th>\n          <th style='padding: 8px; border: 1px solid #ddd;'>3</th>\n          <th style='padding: 8px; border: 1px solid #ddd;'>4</th>\n        </tr>\n      </thead>\n      <tbody>\n        <tr>\n          <td style='padding: 8px; border: 1px solid #ddd; background: #f8fafc;'><strong>Population \\( y \\)</strong></td>\n          <td style='padding: 8px; border: 1px solid #ddd; background: #f8fafc;'>20</td>\n          <td style='padding: 8px; border: 1px solid #ddd; background: #f8fafc;'>24</td>\n          <td style='padding: 8px; border: 1px solid #ddd; background: #f8fafc;'>29</td>\n          <td style='padding: 8px; border: 1px solid #ddd; background: #f8fafc;'>35</td>\n          <td style='padding: 8px; border: 1px solid #ddd; background: #f8fafc;'>42</td>\n        </tr>\n      </tbody>\n    </table>\n  </div>\n  <p>Par ailleurs, le plan complexe est muni d'un repère orthonormé direct \\( (O; \\vec{u}; \\vec{v}) \\). On considère les points \\( A \\) et \\( B \\) d'affixes respectives \\( z_A = 2 + 3i \\) et \\( z_B = -1 + 5i \\).</p>\n  <p>On souhaite déterminer, pour tout point \\( M \\) d'affixe \\( z \\), la nature de l'ensemble des points tels que \\( \\left| \\dfrac{z - z_A}{z - z_B} \\right| = 2 \\).</p>\n</div>",

          "reponse": "<p>\\( \\bar{x} = \\dfrac{0+1+2+3+4}{5} = 2 \\)</p><p>\\( \\bar{y} = \\dfrac{20+24+29+35+42}{5} = \\dfrac{150}{5} = 30 \\)</p><p>\\( \\sum x_i^2 = 0+1+4+9+16 = 30 \\)</p><p>\\( \\sum x_i y_i = 0\\times20 + 1\\times24 + 2\\times29 + 3\\times35 + 4\\times42 = 0+24+58+105+168 = 355 \\)</p><p>\\( a = \\dfrac{\\sum x_i y_i - n\\bar{x}\\bar{y}}{\\sum x_i^2 - n\\bar{x}^2} = \\dfrac{355 - 5\\times2\\times30}{30 - 5\\times4} = \\dfrac{355 - 300}{30 - 20} = \\dfrac{55}{10} = 5.5 \\)</p><p>\\( b = \\bar{y} - a\\bar{x} = 30 - 5.5\\times2 = 30 - 11 = 19 \\)</p><p>Donc \\( y = 5.5x + 19 \\).</p><p>Pour \\( x = 6 \\) : \\( y = 5.5\\times6 + 19 = 33 + 19 = 52 \\) milliers d'habitants.</p>"

          "reponse": "<p>\\( \\left| \\dfrac{z - z_A}{z - z_B} \\right| = 2 \\Rightarrow |z - z_A| = 2|z - z_B| \\Rightarrow AM = 2BM \\).</p><p>Soit \\( M(x;y) \\), \\( A(2;3) \\), \\( B(-1;5) \\).</p><p>\\( (x-2)^2 + (y-3)^2 = 4[(x+1)^2 + (y-5)^2] \\)</p><p>\\( (x-2)^2 + (y-3)^2 = 4(x+1)^2 + 4(y-5)^2 \\)</p><p>\\( x^2 - 4x + 4 + y^2 - 6y + 9 = 4(x^2 + 2x + 1) + 4(y^2 - 10y + 25) \\)</p><p>\\( x^2 - 4x + y^2 - 6y + 13 = 4x^2 + 8x + 4 + 4y^2 - 40y + 100 \\)</p><p>\\( x^2 - 4x + y^2 - 6y + 13 - 4x^2 - 8x - 4 - 4y^2 + 40y - 100 = 0 \\)</p><p>\\( -3x^2 - 12x - 3y^2 + 34y - 91 = 0 \\)</p><p>Multiplions par -1 : \\( 3x^2 + 12x + 3y^2 - 34y + 91 = 0 \\)</p><p>Divisons par 3 : \\( x^2 + 4x + y^2 - \\dfrac{34}{3}y + \\dfrac{91}{3} = 0 \\)</p><p>Forme canonique : \\( (x+2)^2 - 4 + \\left(y - \\dfrac{17}{3}\\right)^2 - \\dfrac{289}{9} + \\dfrac{91}{3} = 0 \\)</p><p>\\( (x+2)^2 + \\left(y - \\dfrac{17}{3}\\right)^2 - 4 - \\dfrac{289}{9} + \\dfrac{273}{9} = 0 \\)</p><p>\\( (x+2)^2 + \\left(y - \\dfrac{17}{3}\\right)^2 = 4 + \\dfrac{16}{9} = \\dfrac{36}{9} + \\dfrac{16}{9} = \\dfrac{52}{9} \\)</p><p>Donc \\( E \\) est un cercle de centre \\( \\Omega\\left(-2; \\dfrac{17}{3}\\right) \\) et de rayon \\( R = \\sqrt{\\dfrac{52}{9}} = \\dfrac{2\\sqrt{13}}{3} \\).</p>"

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
