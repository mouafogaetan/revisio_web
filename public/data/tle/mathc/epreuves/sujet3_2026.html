<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Mathématiques",
  "classe": "Terminale C",
  "sequence": "Séquence 3",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Similitudes directes (Ressources)",
      "points": "3 points",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 8px;'>\n  <p>Le plan complexe est muni d'un repère orthonormé direct \\( (O; \\vec{u}; \\vec{v}) \\).</p>\n  <p>On considère l'application \\( f \\) qui à tout point \\( M \\) d'affixe \\( z \\) associe le point \\( M' \\) d'affixe :</p>\n  <div style='background: #f1f5f9; padding: 10px; border-radius: 6px;'>\n    <p class='math'>\\( z' = (2 + 2i)z + 1 - 3i \\)</p>\n  </div>\n</div>",
      "questions": [
        {
          "question": "<p>1) Déterminer la nature de l'application \\( f \\). Préciser son rapport, son angle et son centre.</p>",
          "reponse": "<p>\\( f(z) = (2+2i)z + 1 - 3i \\).</p><p>On a \\( a = 2+2i \\). Comme \\( a \\neq 1 \\), \\( f \\) est une similitude directe.</p><p>Rapport : \\( k = |a| = |2+2i| = \\sqrt{4+4} = \\sqrt{8} = 2\\sqrt{2} \\).</p><p>Angle : \\( \\theta = \\arg(a) = \\arg(2+2i) = \\dfrac{\\pi}{4} \\).</p><p>Centre \\( \\omega \\) : solution de \\( \\omega = a\\omega + b \\) avec \\( b = 1-3i \\).</p><p>\\( \\omega(1-a) = b \\Rightarrow \\omega = \\dfrac{b}{1-a} = \\dfrac{1-3i}{1-(2+2i)} = \\dfrac{1-3i}{-1-2i} = \\dfrac{1-3i}{-1-2i} \\times \\dfrac{-1+2i}{-1+2i} = \\dfrac{(1-3i)(-1+2i)}{1+4} = \\dfrac{-1+2i+3i-6i^2}{5} = \\dfrac{-1+5i+6}{5} = \\dfrac{5+5i}{5} = 1+i \\).</p><p>Donc \\( f \\) est une similitude directe de centre \\( \\Omega(1+i) \\), de rapport \\( 2\\sqrt{2} \\) et d'angle \\( \\dfrac{\\pi}{4} \\).</p>"
        },
        {
          "question": "<p>2) Déterminer l'image du point \\( A \\) d'affixe \\( z_A = 2 - i \\) par \\( f \\).</p>",
          "reponse": "<p>\\( z_{A'} = (2+2i)(2-i) + 1 - 3i = 4 - 2i + 4i - 2i^2 + 1 - 3i = 4 + 2i + 2 + 1 - 3i = 7 - i \\).</p><p>Donc \\( A'(7 - i) \\).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Isométries de l'espace (Ressources)",
      "points": "3 points",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 8px;'>\n  <p>L'espace est muni d'un repère orthonormé \\( (O; \\vec{i}; \\vec{j}; \\vec{k}) \\).</p>\n  <p>On considère le plan \\( (P) \\) d'équation :</p>\n  <div style='background: #f1f5f9; padding: 10px; border-radius: 6px;'>\n    <p class='math'>\\( 2x - y + 3z - 6 = 0 \\)</p>\n  </div>\n  <p>Soit \\( s \\) la réflexion (symétrie orthogonale) par rapport au plan \\( (P) \\).</p>\n</div>",
      "questions": [
        {
          "question": "<p>1) Déterminer l'expression analytique de la réflexion \\( s \\).</p>",
          "reponse": "<p>Le plan \\( (P) \\) a pour vecteur normal \\( \\vec{n}(2; -1; 3) \\).</p><p>Soit \\( M(x; y; z) \\) et \\( M'(x'; y'; z') \\) son image par \\( s \\).</p><p>On a \\( \\overrightarrow{MM'} = 2\\dfrac{ax+by+cz+d}{a^2+b^2+c^2} \\vec{n} \\) avec \\( a=2, b=-1, c=3, d=-6 \\).</p><p>\\( \\overrightarrow{MM'} = 2\\dfrac{2x - y + 3z - 6}{4+1+9}(2; -1; 3) = \\dfrac{2x - y + 3z - 6}{7}(2; -1; 3) \\).</p><p>Donc :</p><p>\\( x' = x + \\dfrac{2(2x - y + 3z - 6)}{7} = \\dfrac{7x + 4x - 2y + 6z - 12}{7} = \\dfrac{11x - 2y + 6z - 12}{7} \\)</p><p>\\( y' = y - \\dfrac{2x - y + 3z - 6}{7} = \\dfrac{7y - 2x + y - 3z + 6}{7} = \\dfrac{-2x + 8y - 3z + 6}{7} \\)</p><p>\\( z' = z + \\dfrac{3(2x - y + 3z - 6)}{7} = \\dfrac{7z + 6x - 3y + 9z - 18}{7} = \\dfrac{6x - 3y + 16z - 18}{7} \\)</p><p>L'expression analytique est :</p><p>\\( \\begin{cases} x' = \\dfrac{11x - 2y + 6z - 12}{7} \\\\ y' = \\dfrac{-2x + 8y - 3z + 6}{7} \\\\ z' = \\dfrac{6x - 3y + 16z - 18}{7} \\end{cases} \\)</p>"
        },
        {
          "question": "<p>2) Déterminer l'image du point \\( A(1; 2; -1) \\) par la réflexion \\( s \\).</p>",
          "reponse": "<p>On calcule \\( 2x - y + 3z - 6 = 2(1) - 2 + 3(-1) - 6 = 2 - 2 - 3 - 6 = -9 \\).</p><p>\\( x' = 1 + \\dfrac{2(-9)}{7} = 1 - \\dfrac{18}{7} = -\\dfrac{11}{7} \\)</p><p>\\( y' = 2 - \\dfrac{-9}{7} = 2 + \\dfrac{9}{7} = \\dfrac{23}{7} \\)</p><p>\\( z' = -1 + \\dfrac{3(-9)}{7} = -1 - \\dfrac{27}{7} = -\\dfrac{34}{7} \\)</p><p>Donc \\( A'\\left(-\\dfrac{11}{7}; \\dfrac{23}{7}; -\\dfrac{34}{7}\\right) \\).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Primitives et calcul intégral (Ressources)",
      "points": "3 points",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 8px;'>\n  <p>On considère les fonctions suivantes :</p>\n  <div style='background: #f1f5f9; padding: 10px; border-radius: 6px;'>\n    <p class='math'>\\( f(x) = 3x^2 - 2x + 1 \\)</p>\n    <p class='math'>\\( g(x) = \\dfrac{2}{x} + \\dfrac{3}{x^2} \\) pour \\( x > 0 \\)</p>\n    <p class='math'>\\( h(x) = (2x + 1)e^{x^2 + x} \\)</p>\n  </div>\n</div>",
      "questions": [
        {
          "question": "<p>1) Déterminer une primitive de \\( f \\) sur \\( \\mathbb{R} \\).</p>",
          "reponse": "<p>Une primitive de \\( f \\) est : \\( F(x) = x^3 - x^2 + x + C \\), \\( C \\in \\mathbb{R} \\).</p>"
        },
        {
          "question": "<p>2) Déterminer une primitive de \\( g \\) sur \\( ]0; +\\infty[ \\).</p>",
          "reponse": "<p>Une primitive de \\( g \\) est : \\( G(x) = 2\\ln(x) - \\dfrac{3}{x} + C \\), \\( C \\in \\mathbb{R} \\).</p>"
        },
        {
          "question": "<p>3) Déterminer une primitive de \\( h \\) sur \\( \\mathbb{R} \\).</p>",
          "reponse": "<p>On remarque que \\( h(x) = (2x+1)e^{x^2+x} \\) et que \\( (x^2+x)' = 2x+1 \\).</p><p>Donc une primitive de \\( h \\) est : \\( H(x) = e^{x^2+x} + C \\), \\( C \\in \\mathbb{R} \\).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Probabilités et loi binomiale (Ressources)",
      "points": "3 points",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 8px;'>\n  <p>Une urne contient 5 boules blanches et 3 boules noires. On tire au hasard et avec remise 4 boules de cette urne.</p>\n  <p>Soit \\( X \\) la variable aléatoire égale au nombre de boules blanches obtenues.</p>\n</div>",
      "questions": [
        {
          "question": "<p>1) Justifier que \\( X \\) suit une loi binomiale et préciser ses paramètres.</p>",
          "reponse": "<p>On répète 4 fois de manière indépendante une épreuve de Bernoulli de paramètre \\( p = \\dfrac{5}{8} \\) (succès : \"tirer une boule blanche\").</p><p>Donc \\( X \\) suit la loi binomiale \\( \\mathcal{B}\\left(4; \\dfrac{5}{8}\\right) \\).</p>"
        },
        {
          "question": "<p>2) Calculer \\( P(X = 2) \\).</p>",
          "reponse": "<p>\\( P(X=2) = \\binom{4}{2} \\left(\\dfrac{5}{8}\\right)^2 \\left(\\dfrac{3}{8}\\right)^2 = 6 \\times \\dfrac{25}{64} \\times \\dfrac{9}{64} = 6 \\times \\dfrac{225}{4096} = \\dfrac{1350}{4096} = \\dfrac{675}{2048} \\).</p>"
        },
        {
          "question": "<p>3) Calculer l'espérance mathématique et l'écart-type de \\( X \\).</p>",
          "reponse": "<p>\\( E(X) = np = 4 \\times \\dfrac{5}{8} = \\dfrac{20}{8} = \\dfrac{5}{2} = 2.5 \\).</p><p>\\( V(X) = np(1-p) = 4 \\times \\dfrac{5}{8} \\times \\dfrac{3}{8} = \\dfrac{60}{64} = \\dfrac{15}{16} \\).</p><p>\\( \\sigma(X) = \\sqrt{\\dfrac{15}{16}} = \\dfrac{\\sqrt{15}}{4} \\).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 5 : Étude d'une fonction et calcul d'aire (Compétences)",
      "points": "4 points",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 12px;'>\n  <p>Un designer souhaite créer un logo pour une entreprise. La forme du logo est délimitée par la courbe de la fonction \\( f \\) définie sur \\( [0; 2] \\) par :</p>\n  <div style='background: #f1f5f9; padding: 10px; border-radius: 6px;'>\n    <p class='math'>\\( f(x) = (x^2 - 2x + 2)e^{-x} \\)</p>\n  </div>\n  <p>L'axe des abscisses et les droites d'équations \\( x=0 \\) et \\( x=2 \\) délimitent la zone du logo.</p>\n  <p>Le designer souhaite connaître l'aire de cette zone pour déterminer la quantité de matière première nécessaire.</p>\n</div>",
      "questions": [
        {
          "question": "<p>1) Étudier les variations de la fonction \\( f \\) sur l'intervalle \\( [0; 2] \\).</p>",
          "reponse": "<p>On a \\( f(x) = (x^2 - 2x + 2)e^{-x} \\).</p><p>Dérivée : \\( f'(x) = (2x - 2)e^{-x} - (x^2 - 2x + 2)e^{-x} = (-x^2 + 4x - 4)e^{-x} = -(x-2)^2 e^{-x} \\).</p><p>Sur \\( [0; 2] \\), \\( f'(x) \\le 0 \\) et s'annule en \\( x=2 \\).</p><p>Donc \\( f \\) est strictement décroissante sur \\( [0; 2] \\).</p><p>\\( f(0) = 2 \\) et \\( f(2) = (4-4+2)e^{-2} = 2e^{-2} \\).</p>"
        },
        {
          "question": "<p>2) Déterminer une primitive de \\( f \\) sur \\( [0; 2] \\).</p>",
          "reponse": "<p>On cherche \\( F(x) = (ax^2 + bx + c)e^{-x} \\) telle que \\( F' = f \\).</p><p>\\( F'(x) = (2ax + b)e^{-x} - (ax^2 + bx + c)e^{-x} = (-ax^2 + (2a-b)x + (b-c))e^{-x} \\).</p><p>On identifie avec \\( x^2 - 2x + 2 \\) :</p><p>\\( -a = 1 \\Rightarrow a = -1 \\)</p><p>\\( 2a - b = -2 \\Rightarrow -2 - b = -2 \\Rightarrow b = 0 \\)</p><p>\\( b - c = 2 \\Rightarrow -c = 2 \\Rightarrow c = -2 \\)</p><p>Donc \\( F(x) = (-x^2 - 2)e^{-x} \\) est une primitive de \\( f \\).</p>"
        },
        {
          "question": "<p>3) En déduire l'aire de la zone du logo en unités d'aire, puis en cm² sachant que l'unité graphique est de 2 cm sur chaque axe.</p>",
          "reponse": "<p>Aire = \\( \\int_0^2 f(x) dx = [F(x)]_0^2 = F(2) - F(0) = (-4 - 2)e^{-2} - (0 - 2)e^0 = -6e^{-2} + 2 = 2 - 6e^{-2} \\).</p><p>Donc \\( \\mathcal{A} = 2 - \\dfrac{6}{e^2} \\) unités d'aire.</p><p>En cm² : chaque unité sur l'axe des abscisses vaut 2 cm, chaque unité sur l'axe des ordonnées vaut 2 cm, donc l'unité d'aire vaut \\( 2 \\times 2 = 4 \\) cm².</p><p>\\( \\mathcal{A}_{cm^2} = 4\\left(2 - \\dfrac{6}{e^2}\\right) = 8 - \\dfrac{24}{e^2} \\) cm².</p>"
        }
      ]
    },
    {
      "titre": "Exercice 6 : Problème de sécurité - similitudes et probabilités (Compétences)",
      "points": "4 points",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 12px;'>\n  <p>Un système de surveillance utilise des caméras placées aux sommets d'un triangle équilatéral \\( ABC \\) pour couvrir une zone circulaire.</p>\n  <p>Le triangle \\( ABC \\) est tel que \\( A(0;0) \\), \\( B(4;0) \\) et \\( C(2;2\\sqrt{3}) \\) dans le plan complexe.</p>\n  <p>Une caméra située en \\( A \\) effectue une rotation de \\( 60^\\circ \\) dans le sens direct autour de \\( A \\) pour surveiller la zone.</p>\n  <p>Par ailleurs, des tests de fiabilité ont montré que la probabilité qu'une caméra tombe en panne au cours d'une journée est de 0.05. Les pannes des différentes caméras sont indépendantes.</p>\n  <p>L'entreprise souhaite évaluer la probabilité qu'au moins deux caméras fonctionnent correctement sur les trois pendant une journée donnée.</p>\n</div>",
      "questions": [
        {
          "question": "<p>1) Déterminer l'écriture complexe de la rotation de centre \\( A \\) et d'angle \\( \\dfrac{\\pi}{3} \\).</p>",
          "reponse": "<p>La rotation de centre \\( A \\) d'affixe \\( z_A = 0 \\) et d'angle \\( \\theta = \\dfrac{\\pi}{3} \\) a pour écriture complexe :</p><p>\\( z' - z_A = e^{i\\theta}(z - z_A) \\)</p><p>Donc \\( z' = e^{i\\pi/3} z = \\left(\\dfrac{1}{2} + i\\dfrac{\\sqrt{3}}{2}\\right)z \\).</p>"
        },
        {
          "question": "<p>2) Déterminer les images des points \\( B \\) et \\( C \\) par cette rotation.</p>",
          "reponse": "<p>\\( z_{B'} = \\left(\\dfrac{1}{2} + i\\dfrac{\\sqrt{3}}{2}\\right) \\times 4 = 2 + 2i\\sqrt{3} \\).</p><p>\\( z_{C'} = \\left(\\dfrac{1}{2} + i\\dfrac{\\sqrt{3}}{2}\\right) \\times (2 + 2i\\sqrt{3}) = \\dfrac{1}{2}(2 + 2i\\sqrt{3}) + i\\dfrac{\\sqrt{3}}{2}(2 + 2i\\sqrt{3}) = (1 + i\\sqrt{3}) + (i\\sqrt{3} - 3) = -2 + 2i\\sqrt{3} \\).</p>"
        },
        {
          "question": "<p>3) Calculer la probabilité qu'au moins deux caméras fonctionnent correctement pendant une journée.</p>",
          "reponse": "<p>Soit \\( Y \\) le nombre de caméras qui tombent en panne. \\( Y \\) suit la loi binomiale \\( \\mathcal{B}(3; 0.05) \\).</p><p>La probabilité qu'au moins deux caméras fonctionnent correctement est la probabilité qu'au plus une caméra tombe en panne :</p><p>\\( P(Y \\le 1) = P(Y=0) + P(Y=1) \\)</p><p>\\( P(Y=0) = \\binom{3}{0}(0.05)^0(0.95)^3 = 0.95^3 = 0.857375 \\)</p><p>\\( P(Y=1) = \\binom{3}{1}(0.05)^1(0.95)^2 = 3 \\times 0.05 \\times 0.9025 = 0.135375 \\)</p><p>\\( P(Y \\le 1) = 0.857375 + 0.135375 = 0.99275 \\).</p><p>Donc la probabilité qu'au moins deux caméras fonctionnent correctement est de 0.99275, soit 99.275%.</p>"

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
