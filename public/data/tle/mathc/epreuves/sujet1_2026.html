<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Mathématiques",
  "classe": "Terminale C",
  "sequence": "Séquence 1",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Divisibilité et congruences (Ressources)",
      "points": "2.5 points",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 8px;'>\n  <p>Soit \\( n \\) un entier naturel.</p>\n  <div style='background: #f1f5f9; padding: 10px; border-radius: 6px;'>\n    <p class='math'>\\( A = n(n^2 - 1)(3n + 2) \\)</p>\n  </div>\n  <p>On considère également l'expression :</p>\n  <div style='background: #f1f5f9; padding: 10px; border-radius: 6px;'>\n    <p class='math'>\\( B = 2^n + n^2 \\)</p>\n  </div>\n</div>",
      "questions": [
        {
          "question": "<p>1) Démontrer que \\( A \\) est divisible par 24 pour tout \\( n \\in \\mathbb{N} \\).</p>",
          "reponse": "<p>On a \\( n(n^2-1) = (n-1)n(n+1) \\) qui est le produit de trois entiers consécutifs, donc divisible par 6.</p><p>Il reste à montrer que l'expression est divisible par 4. Étudions les cas :</p><ul><li>Si \\( n \\) est pair, \\( n \\) est divisible par 2. Si \\( n \\) est multiple de 4, c'est bon. Sinon \\( n = 4k+2 \\), alors \\( n-1 \\) et \\( n+1 \\) sont impairs, mais \\( 3n+2 = 3(4k+2)+2 = 12k+8 = 4(3k+2) \\).</li><li>Si \\( n \\) est impair, \\( n-1 \\) et \\( n+1 \\) sont pairs et l'un d'eux est multiple de 4.</li></ul><p>L'expression est donc divisible par 6 et par 4, or pgcd(6;4)=2, donc elle est divisible par \\( \\text{ppcm}(6;4)=12 \\). Il faut affiner la divisibilité par 8.</p><p>Correction plus rigoureuse : On vérifie pour les classes modulo 8. Pour \\( n \\in \\{0,1,...,7\\} \\), \\( n(n^2-1)(3n+2) \\equiv 0 \\pmod{8} \\) et comme le produit est toujours divisible par 3, il l'est par \\( 3 \\times 8 = 24 \\).</p>"
        },
        {
          "question": "<p>2) Déterminer suivant les valeurs de \\( n \\), le reste de la division euclidienne de \\( B \\) par 5.</p>",
          "reponse": "<p>On étudie les puissances de 2 modulo 5 : \\( 2^0 \\equiv 1 \\), \\( 2^1 \\equiv 2 \\), \\( 2^2 \\equiv 4 \\), \\( 2^3 \\equiv 3 \\), puis cycle de période 4.</p><p>On étudie \\( n^2 \\mod 5 \\).</p><p>En testant les 5 classes de \\( n \\) modulo 5, on obtient les restes suivants :</p><ul><li>Si \\( n \\equiv 0 \\pmod{5} \\) : reste = 1 + 0 = 1</li><li>Si \\( n \\equiv 1 \\pmod{5} \\) : reste = 2 + 1 = 3</li><li>Si \\( n \\equiv 2 \\pmod{5} \\) : reste = 4 + 4 = 8 ≡ 3</li><li>Si \\( n \\equiv 3 \\pmod{5} \\) : reste = 3 + 9 = 12 ≡ 2</li><li>Si \\( n \\equiv 4 \\pmod{5} \\) : reste = 1 + 16 = 17 ≡ 2</li></ul>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : PGCD, PPCM et équations diophantiennes (Ressources)",
      "points": "2.5 points",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 8px;'>\n  <p>Soit \\( n \\) un entier naturel non nul.</p>\n  <div style='background: #f1f5f9; padding: 10px; border-radius: 6px;'>\n    <p class='math'>\\( a = 3n + 2 \\) et \\( b = 5n + 3 \\)</p>\n  </div>\n  <p>On considère également l'équation :</p>\n  <div style='background: #f1f5f9; padding: 10px; border-radius: 6px;'>\n    <p class='math'>\\( 3x + 5y = 7 \\), \\( (x; y) \\in \\mathbb{Z}^2 \\)</p>\n  </div>\n</div>",
      "questions": [
        {
          "question": "<p>1) Calculer le PGCD de \\( a \\) et \\( b \\).</p>",
          "reponse": "<p>Soit \\( d = \\text{PGCD}(a; b) \\). Alors \\( d \\) divise \\( 5a - 3b = 5(3n+2) - 3(5n+3) = 15n+10 - 15n - 9 = 1 \\).</p><p>Donc \\( d \\) divise 1, d'où \\( d = 1 \\).</p><p>Les deux nombres sont premiers entre eux pour tout \\( n \\).</p>"
        },
        {
          "question": "<p>2) Résoudre l'équation \\( 3x + 5y = 7 \\) dans \\( \\mathbb{Z}^2 \\).</p>",
          "reponse": "<p>On cherche une solution particulière. \\( x = -1 \\) et \\( y = 2 \\) donnent \\( 3(-1) + 5(2) = -3 + 10 = 7 \\).</p><p>La solution générale est :</p><p>\\( x = -1 + 5k \\) et \\( y = 2 - 3k \\), avec \\( k \\in \\mathbb{Z} \\).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Nombres complexes - forme algébrique (Ressources)",
      "points": "2.5 points",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 8px;'>\n  <p>Le plan complexe est muni d'un repère orthonormé direct \\( (O; \\vec{u}; \\vec{v}) \\).</p>\n  <p>On considère l'équation :</p>\n  <div style='background: #f1f5f9; padding: 10px; border-radius: 6px;'>\n    <p class='math'>\\( z^2 - 4z + 13 = 0 \\)</p>\n  </div>\n  <p>Soient \\( A \\), \\( B \\) et \\( C \\) les points d'affixes respectives :</p>\n  <div style='background: #f1f5f9; padding: 10px; border-radius: 6px;'>\n    <p class='math'>\\( z_A = 2 + 3i \\), \\( z_B = 2 - 3i \\), \\( z_C = 4 + i \\)</p>\n  </div>\n</div>",
      "questions": [
        {
          "question": "<p>1) Résoudre dans \\( \\mathbb{C} \\) l'équation \\( z^2 - 4z + 13 = 0 \\).</p>",
          "reponse": "<p>On a \\( \\Delta = (-4)^2 - 4(1)(13) = 16 - 52 = -36 = (6i)^2 \\).</p><p>Les solutions sont : \\( z_1 = \\dfrac{4 + 6i}{2} = 2 + 3i \\) et \\( z_2 = \\dfrac{4 - 6i}{2} = 2 - 3i \\).</p>"
        },
        {
          "question": "<p>2) Déterminer la nature du triangle \\( ABC \\).</p>",
          "reponse": "<p>\\( AB = |z_B - z_A| = |(2-3i) - (2+3i)| = |-6i| = 6 \\).</p><p>\\( AC = |z_C - z_A| = |(4+i) - (2+3i)| = |2 - 2i| = \\sqrt{8} = 2\\sqrt{2} \\).</p><p>\\( BC = |z_C - z_B| = |(4+i) - (2-3i)| = |2 + 4i| = \\sqrt{20} = 2\\sqrt{5} \\).</p><p>On a \\( AB^2 = 36 \\) et \\( AC^2 + BC^2 = 8 + 20 = 28 \\). Le triangle n'est pas rectangle.</p><p>Le triangle est quelconque.</p>"
        },
        {
          "question": "<p>3) Déterminer l'affixe du point \\( D \\) tel que \\( ABCD \\) soit un parallélogramme.</p>",
          "reponse": "<p>Dans un parallélogramme, les diagonales se coupent en leur milieu. On a \\( z_A + z_C = z_B + z_D \\).</p><p>Donc \\( z_D = z_A + z_C - z_B = (2+3i) + (4+i) - (2-3i) = 4 + 7i \\).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Nombres complexes - module et conjugué (Ressources)",
      "points": "2.5 points",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 8px;'>\n  <p>Le plan complexe est muni d'un repère orthonormé direct \\( (O; \\vec{u}; \\vec{v}) \\).</p>\n  <p>On considère les points \\( A \\), \\( B \\) et \\( C \\) d'affixes respectives :</p>\n  <div style='background: #f1f5f9; padding: 10px; border-radius: 6px;'>\n    <p class='math'>\\( z_A = 1 + 2i \\), \\( z_B = -3 + i \\), \\( z_C = 5 - 4i \\)</p>\n  </div>\n  <p>On cherche l'ensemble des points \\( M \\) d'affixe \\( z \\) tels que :</p>\n  <div style='background: #f1f5f9; padding: 10px; border-radius: 6px;'>\n    <p class='math'>\\( |z - 1 - 2i| = |z + 3 - i| \\)</p>\n  </div>\n</div>",
      "questions": [
        {
          "question": "<p>1) Calculer le module de \\( z_A \\), \\( z_B \\) et \\( z_C \\).</p>",
          "reponse": "<p>\\( |z_A| = |1+2i| = \\sqrt{1^2 + 2^2} = \\sqrt{5} \\)</p><p>\\( |z_B| = |-3+i| = \\sqrt{(-3)^2 + 1^2} = \\sqrt{10} \\)</p><p>\\( |z_C| = |5-4i| = \\sqrt{5^2 + (-4)^2} = \\sqrt{41} \\)</p>"
        },
        {
          "question": "<p>2) Déterminer le conjugué de \\( z_A \\times z_B \\) et de \\( \\dfrac{z_A}{z_C} \\).</p>",
          "reponse": "<p>\\( z_A \\times z_B = (1+2i)(-3+i) = -3 + i - 6i + 2i^2 = -3 - 5i - 2 = -5 - 5i \\)</p><p>Son conjugué est \\( \\overline{z_A \\times z_B} = -5 + 5i \\).</p><p>\\( \\dfrac{z_A}{z_C} = \\dfrac{1+2i}{5-4i} = \\dfrac{(1+2i)(5+4i)}{(5-4i)(5+4i)} = \\dfrac{5+4i+10i+8i^2}{25+16} = \\dfrac{5+14i-8}{41} = \\dfrac{-3+14i}{41} = -\\dfrac{3}{41} + \\dfrac{14}{41}i \\)</p><p>Son conjugué est \\( \\overline{\\dfrac{z_A}{z_C}} = -\\dfrac{3}{41} - \\dfrac{14}{41}i \\).</p>"
        },
        {
          "question": "<p>3) Déterminer l'ensemble \\( E \\) des points \\( M \\) tels que \\( |z - 1 - 2i| = |z + 3 - i| \\).</p>",
          "reponse": "<p>On a \\( |z - (1+2i)| = |z - (-3+i)| \\).</p><p>C'est l'ensemble des points \\( M \\) équidistants des points \\( A(1+2i) \\) et \\( B(-3+i) \\).</p><p>L'ensemble \\( E \\) est la médiatrice du segment \\( [AB] \\).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 5 : Problème de répartition de ressources (Compétences)",
      "points": "4 points",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 12px;'>\n  <p>Une commune souhaite organiser un festival culturel. Elle dispose d'un budget total de 12 000 000 FCFA pour financer trois types d'activités : concerts, expositions et ateliers.</p>\n  <p>Le coût d'un concert est de 500 000 FCFA, celui d'une exposition est de 300 000 FCFA et celui d'un atelier est de 200 000 FCFA.</p>\n  <p>Le nombre total d'activités organisées doit être compris entre 30 et 40.</p>\n  <p>Le nombre d'ateliers doit être le double du nombre de concerts.</p>\n  <p>De plus, le nombre d'expositions doit être un nombre premier.</p>\n</div>",
      "questions": [
        {
          "question": "<p>1) Déterminer toutes les répartitions possibles du nombre de concerts, d'expositions et d'ateliers qui respectent les contraintes budgétaires et de programmation.</p>",

=7 \\) premier impair ok → \\( z = 4 + 3i \\)</p><p>Cas 3 : \\( a^2 \\equiv 4 \\) et \\( b^2 \\equiv 1 \\pmod{5} \\) : symétrique du cas 2.</p><p>\\( a \\in \\{\\pm2, \\pm3\\} \\), \\( b \\in \\{\\pm1, \\pm4\\} \\)</p><p>\\( a=-3 \\) :\n- avec \\( b=-4 : a+b=-7 \\) non\n- avec \\( b=-1 : a+b=-4 \\) non\n- avec \\( b=1 : a+b=-2 \\) non\n- avec \\( b=4 : a+b=1 \\) non</p><p>\\( a=-2 \\) :\n- avec \\( b=-4 : a+b=-6 \\) non\n- avec \\( b=-1 : a+b=-3 \\) non\n- avec \\( b=1 : a+b=-1 \\) non\n- avec \\( b=4 : a+b=2 \\) premier pair exclu</p><p>\\( a=2 \\) :\n- avec \\( b=-4 : a+b=-2 \\) non\n- avec \\( b=-1 : a+b=1 \\) non\n- avec \\( b=1 : a+b=3 \\) premier impair ok → \\( z = 2 + i \\)\n- avec \\( b=4 : a+b=6 \\) non</p><p>\\( a=3 \\) :\n- avec \\( b=-4 : a+b=-1 \\) non\n- avec \\( b=-1 : a+b=2 \\) premier pair exclu\n- avec \\( b=1 : a+b=4 \\) non\n- avec \\( b=4 : a+b=7 \\) premier impair ok → \\( z = 3 + 4i \\)</p><p>Les codes valides sont : \\( z = 0 + 5i \\), \\( z = 1 + 2i \\), \\( z = 4 + 3i \\), \\( z = 2 + i \\), \\( z = 3 + 4i \\).</p>"

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
