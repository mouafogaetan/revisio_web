<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>
    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }
    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }
    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }
    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }
    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }
    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }
    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }
    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }
    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }
    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }
    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }
    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }
    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }
    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }
    .exercise-statement .math {
        color: #1e40af;
    }
    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }
    .question-block.revealed {
        border-left-color: #059669;
    }
    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }
    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }
    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }
    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }
    .question-answer .math {
        color: #065f46;
    }
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }
    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }
    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }
    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }
    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }
    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }
    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }
    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }
    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }
    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }
    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }
    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }
    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }
    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }
    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }
    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>
<div class="app-container">
    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>
    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>
    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>
        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>
<script>
$(function() {
    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Chimie",
  "classe": "Terminale C",
  "sequence": "Séquence 3",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Partie A : Evaluation des ressources",
      "points": "10 points",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 8px;'>\n  <p><strong>Exercice 1 : Vérification des savoirs (4 pts)</strong></p>\n</div>",
      "questions": [
        {
          "question": "<p>1) Définir : acide carboxylique ; ester. (1pt)</p>",
          "reponse": "<p>Un <strong>acide carboxylique</strong> est un composé organique contenant le groupe fonctionnel carboxyle \\( -COOH \\). Sa formule générale est \\( R-COOH \\).</p><p>Un <strong>ester</strong> est un composé organique dérivé d'un acide carboxylique par substitution du proton du groupe \\( -OH \\) par un groupe alkyle. Sa formule générale est \\( R-COO-R' \\).</p>"
        },
        {
          "question": "<p>2) Donner la définition de la réaction d'estérification. (0.5pt)</p>",
          "reponse": "<p>L'estérification est une réaction lente, limitée et athermique entre un acide carboxylique et un alcool, conduisant à la formation d'un ester et d'eau.</p><p>\\( R-COOH + R'-OH \\rightleftharpoons R-COO-R' + H_2O \\)</p>"
        },
        {
          "question": "<p>3) Définir la saponification. (0.5pt)</p>",
          "reponse": "<p>La saponification est la réaction d'hydrolyse basique totale et rapide d'un ester. Elle conduit à la formation d'un sel d'acide carboxylique (savon) et d'un alcool.</p><p>\\( R-COO-R' + NaOH \\rightarrow R-COO^-Na^+ + R'-OH \\)</p>"
        },
        {
          "question": "<p>4) Citer deux méthodes pouvant améliorer le rendement d'une réaction d'estérification. (1pt)</p>",
          "reponse": "<p>Deux méthodes pour améliorer le rendement d'une estérification :</p><ul><li><strong>Ajouter un excès de l'un des réactifs</strong> (acide ou alcool) pour déplacer l'équilibre vers la formation de l'ester (loi de Le Chatelier).</li><li><strong>Éliminer l'eau</strong> au fur et à mesure qu'elle se forme (par distillation ou par l'utilisation d'un agent déshydratant).</li></ul>"
        },
        {
          "question": "<p>5) Donner la définition d'une amine. (0.5pt)</p>",
          "reponse": "<p>Une amine est un composé organique dérivé de l'ammoniac \\( NH_3 \\) par substitution d'un ou plusieurs atomes d'hydrogène par des groupes alkyles ou aryles.</p>"
        },
        {
          "question": "<p>6) Définir un acide α-aminé. (0.5pt)</p>",
          "reponse": "<p>Un acide α-aminé est un composé organique qui possède à la fois un groupe amine \\( -NH_2 \\) et un groupe acide carboxylique \\( -COOH \\) portés par le même atome de carbone (le carbone α, adjacent au groupe carboxyle).</p>"
        }
      ]
    },
    {
      "titre": "Partie A : Evaluation des ressources (suite)",
      "points": "",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 8px;'>\n  <p><strong>Exercice 2 : Application des savoirs (6 pts)</strong></p>\n</div>",
      "questions": [
        {
          "question": "<p>1) Soit l'acide carboxylique A de formule : \\( CH_3-CH(CH_3)-CH_2-COOH \\)</p><p>1-1) Donner le nom de A. (0.5pt)</p>",
          "reponse": "<p>La chaîne principale contient 4 carbones (acide butanoïque) avec un groupement méthyle en position 3.</p><p>Nom : <strong>acide 3-méthylbutanoïque</strong></p>"
        },
        {
          "question": "<p>1-2) Écrire l'équation de la réaction de A avec l'éthanol. (0.5pt)</p>",
          "reponse": "<p>\\( CH_3-CH(CH_3)-CH_2-COOH + HO-CH_2-CH_3 \\rightleftharpoons CH_3-CH(CH_3)-CH_2-COO-CH_2-CH_3 + H_2O \\)</p><p>Le produit formé est le <strong>3-méthylbutanoate d'éthyle</strong>.</p>"
        },
        {
          "question": "<p>1-3) Écrire l'équation de la réaction de saponification de l'ester obtenu. (1pt)</p>",
          "reponse": "<p>\\( CH_3-CH(CH_3)-CH_2-COO-CH_2-CH_3 + NaOH \\rightarrow CH_3-CH(CH_3)-CH_2-COO^-Na^+ + HO-CH_2-CH_3 \\)</p>"
        },
        {
          "question": "<p>2) Soit l'amine B de formule : \\( CH_3-CH_2-NH-CH_2-CH_3 \\)</p><p>2-1) Déterminer la classe de B. (0.5pt)</p>",
          "reponse": "<p>L'atome d'azote est lié à deux groupes alkyles et un atome d'hydrogène, donc c'est une <strong>amine secondaire</strong>.</p>"
        },
        {
          "question": "<p>2-2) Donner le nom de B. (0.5pt)</p>",
          "reponse": "<p>Nom : <strong>N-éthyléthanamine</strong> (ou diéthylamine).</p>"
        },
        {
          "question": "<p>2-3) Écrire l'équation de la réaction de B avec l'acide chlorhydrique \\( HCl \\). (0.5pt)</p>",
          "reponse": "<p>\\( CH_3-CH_2-NH-CH_2-CH_3 + HCl \\rightarrow CH_3-CH_2-NH_2^+-CH_2-CH_3 + Cl^- \\)</p><p>L'amine se protonne pour former l'ion <strong>éthylammonium</strong>.</p>"
        },
        {
          "question": "<p>3) Soit l'acide α-aminé C de formule : \\( HOOC-CH(NH_2)-CH_2-CH_3 \\)</p><p>3-1) Donner le nom de C. (0.5pt)</p>",
          "reponse": "<p>Nom : <strong>acide 2-aminobutanoïque</strong></p>"
        },
        {
          "question": "<p>3-2) C possède-t-il un carbone asymétrique ? Justifier. (0.5pt)</p>",
          "reponse": "<p>Le carbone α (carbone n°2) est lié à quatre groupements différents :</p><ul><li>\\( -COOH \\)</li><li>\\( -NH_2 \\)</li><li>\\( -H \\)</li><li>\\( -CH_2-CH_3 \\)</li></ul><p>Il s'agit donc d'un <strong>carbone asymétrique</strong> (ou chiral).</p>"
        },
        {
          "question": "<p>3-3) Représenter en perspective (Fischer) les deux énantiomères de C. (1pt)</p>",
          "reponse": "<div style='background: #f1f5f9; padding: 10px; border-radius: 6px; font-family: monospace;'>\n      COOH                COOH\n      |                   |\n  H — C — NH₂        H₂N — C — H\n      |                   |\n      CH₂-CH₃            CH₂-CH₃\n   \n   Énantiomère L       Énantiomère D\n</div>"
        },
        {
          "question": "<p>3-4) Écrire la formation du zwitterion de C. (0.5pt)</p>",
          "reponse": "<p>Le zwitterion est la forme où le groupe \\( -COOH \\) est déprotoné et le groupe \\( -NH_2 \\) est protoné :</p><p>\\( HOOC-CH(NH_2)-CH_2-CH_3 \\rightleftharpoons ^-OOC-CH(NH_3^+)-CH_2-CH_3 \\)</p>"
        },
        {
          "question": "<p>3-5) Écrire la réaction de formation d'un dipeptide entre deux molécules de C. (0.5pt)</p>",
          "reponse": "<p>\\( 2 \\, HOOC-CH(NH_2)-CH_2-CH_3 \\rightarrow HOOC-CH(NH_2)-CH_2-CH_3-CO-NH-CH(COOH)-CH_2-CH_3 + H_2O \\)</p>"
        }
      ]
    },
    {
      "titre": "Partie B : Evaluation des compétences",
      "points": "10 points",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 12px;'>\n  <p>Un laboratoire de recherche souhaite synthétiser un ester à partir d'un acide carboxylique A et d'un alcool B.</p>\n  <p><strong>Informations disponibles :</strong></p>\n  <ul>\n    <li>L'acide A a pour formule brute \\( C_4H_8O_2 \\).</li>\n    <li>L'alcool B est un alcool primaire de formule brute \\( C_2H_6O \\).</li>\n    <li>La réaction d'estérification est réalisée à reflux avec un catalyseur acide.</li>\n    <li>Au bout de 10 heures, le rendement de la réaction est de 70%.</li>\n  </ul>\n  <p>Les élèves doivent identifier l'acide A, l'alcool B et l'ester formé, puis déterminer la masse d'ester obtenue si on utilise initialement 0.10 mol de chaque réactif.</p>\n</div>",
      "questions": [
        {
          "question": "<p>1) Identifier l'acide A et l'alcool B en justifiant. (2pts)</p>",
          "reponse": "<p>L'acide A a pour formule brute \\( C_4H_8O_2 \\). C'est un acide carboxylique saturé acyclique.</p><p>Les acides carboxyliques de formule \\( C_4H_8O_2 \\) sont :</p><ul><li><strong>Acide butanoïque</strong> : \\( CH_3-CH_2-CH_2-COOH \\)</li><li><strong>Acide 2-méthylpropanoïque</strong> : \\( CH_3-CH(CH_3)-COOH \\)</li></ul><p>L'alcool B a pour formule brute \\( C_2H_6O \\). C'est un alcool primaire.</p><p>L'alcool de formule \\( C_2H_6O \\) est l'<strong>éthanol</strong> : \\( CH_3-CH_2-OH \\).</p><p>On ne peut pas distinguer les deux acides sans informations supplémentaires. Les deux esters possibles sont :</p><ul><li>butanoate d'éthyle</li><li>2-méthylpropanoate d'éthyle</li></ul>"
        },
        {
          "question": "<p>2) Écrire l'équation-bilan de la réaction d'estérification avec l'acide butanoïque. (2pts)</p>",
          "reponse": "<p>\\( CH_3-CH_2-CH_2-COOH + CH_3-CH_2-OH \\rightleftharpoons CH_3-CH_2-CH_2-COO-CH_2-CH_3 + H_2O \\)</p><p>L'ester formé est le <strong>butanoate d'éthyle</strong>.</p>"
        },
        {
          "question": "<p>3) Calculer la quantité d'ester formé si le rendement est de 70% et qu'on utilise initialement 0.10 mol de chaque réactif. (3pts)</p>",
          "reponse": "<p>La réaction est équimolaire : \\( n_{acide} = n_{alcool} = 0.10 \\, mol \\).</p><p>Le réactif limitant est l'un ou l'autre (ils sont en quantités égales).</p><p>Quantité maximale d'ester que l'on pourrait obtenir : \\( n_{max} = 0.10 \\, mol \\).</p><p>Quantité réelle d'ester obtenue :</p><p>\\( n_{ester} = rendement \\times n_{max} = 0.70 \\times 0.10 = 7.0 \\times 10^{-2} \\, mol \\)</p>"
        },
        {
          "question": "<p>4) Calculer la masse d'ester obtenue. (3pts)</p>",
          "reponse": "<p>Masse molaire du butanoate d'éthyle \\( C_6H_{12}O_2 \\) :</p><p>\\( M = 6 \\times 12 + 12 \\times 1 + 2 \\times 16 = 72 + 12 + 32 = 116 \\, g \\cdot mol^{-1} \\)</p><p>Masse d'ester obtenue :</p><p>\\( m = n_{ester} \\times M = 7.0 \\times 10^{-2} \\times 116 = 8.12 \\, g \\)</p>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};
    const totalExercises = examData.exercices.length;
    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');
    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;
        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);
        // Construire le contenu
        let html = '';
        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;
        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;
            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });
        html += `</div>`;
        $body.html(html);
        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);
        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }
        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }
    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }
        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;
        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);
        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }
    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }
    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }
    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }
    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }
    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }
    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });
        // Afficher le premier exercice
        renderExercise(0);
        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);
        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }
    init();
});
</script>
</body>
</html>
