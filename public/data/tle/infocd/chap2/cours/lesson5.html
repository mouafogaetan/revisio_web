<!DOCTYPE html>
<html lang="fr">
<head>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }
    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
    }
    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 500px;
        margin: 0 auto;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }
    .slide-header {
        flex-shrink: 0;
        padding: 18px 16px 10px 16px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        z-index: 10;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }
    .slide-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }
    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
    }
    .content-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 18px 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        flex-shrink: 0;
    }
    .content-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }
    .content-card li {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        line-height: 1.5;
    }
    .content-card li:last-child {
        border-bottom: none;
    }
    .bullet-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
    }
    .math-block {
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        overflow-x: auto;
        flex-shrink: 0;
        margin: 4px 0;
    }
    .math-block .math {
        font-size: 1.2rem;
        color: #e2e8f0;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.08);
        border-left: 4px solid #60a5fa;
        padding: 12px 16px;
        border-radius: 12px;
        font-style: italic;
        font-size: 0.9rem;
        color: #cbd5e1;
        flex-shrink: 0;
    }
    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        border-radius: 0;
        flex-direction: column;
    }
    .loading-card {
        background: #1e293b;
        padding: 32px 28px;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #334155;
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px auto;
    }
    .loading-text {
        font-weight: 600;
        font-size: 1.1rem;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    .loading-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 16px;
    }
    .loading-progress {
        height: 3px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        animation: loadingProgress 30s ease-out forwards;
    }
    .loading-timeout {
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 12px;
    }
    .btn-cancel-loading {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 40px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #f87171;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }
    .btn-cancel-loading:active {
        transform: scale(0.94);
        background: rgba(239, 68, 68, 0.25);
    }
    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
    }
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }
    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }
    .slide-counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255,255,255,0.05);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(255,255,255,0.04);
    }
    .status-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 30px;
        background: rgba(96, 165, 250, 0.12);
        color: #93bbfc;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
    }
    .status-badge .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: pulse-dot 1.2s infinite;
        flex-shrink: 0;
    }
    .status-badge.idle .dot {
        animation: none;
        background: #64748b;
    }
    .status-badge.speaking .dot {
        background: #34d399;
        animation: pulse-dot 0.8s infinite;
    }
    .status-badge.error .dot {
        background: #f87171;
        animation: none;
    }
    .status-badge.paused .dot {
        animation: none;
        background: #fbbf24;
    }
    .status-badge.waiting .dot {
        animation: pulse-dot 1.5s infinite;
        background: #fbbf24;
    }
    .status-badge.loading .dot {
        animation: pulse-dot 0.5s infinite;
        background: #60a5fa;
    }
    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.7); }
    }
    .footer-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }
    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }
    .btn:active {
        transform: scale(0.94);
        background: rgba(255,255,255,0.1);
    }
    .btn-secondary {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.06);
    }
    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
        min-width: 80px;
        justify-content: center;
    }
    .btn-play:active {
        background: rgba(52, 211, 153, 0.25);
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
    }
    .auto-indicator {
        font-size: 0.65rem;
        color: #64748b;
        text-align: center;
        letter-spacing: 0.3px;
        padding: 2px 0;
    }
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.2rem;
        }
        .content-card li {
            font-size: 0.9rem;
            padding: 8px 0;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .btn-play {
            min-width: 60px;
        }
        .footer-buttons {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
        .loading-card {
            padding: 20px 16px;
        }
        .math-block .math {
            font-size: 1rem;
        }
    }
    @media (min-width: 600px) {
        .app-container {
            max-width: 480px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
        .loading-overlay {
            border-radius: 32px;
        }
    }
    /* Mode jour (par défaut) - ajouté par le script de thème */
    html, body {
        background: #f0f4f8 !important;

    }
    .app-container {

    }
    .slide-header {
        background: rgba(255, 255, 255, 0.85) !important;
        border-bottom: 1px solid rgba(0,0,0,0.08) !important;
    }
    .slide-header h1 {
        background: linear-gradient(135deg, #2b6cb0, #6b46c1) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        background-clip: text !important;
    }
    .slide-footer {
        background: rgba(255, 255, 255, 0.9) !important;
        border-top: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card {
        background: rgba(255,255,255,0.8) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card li {
        border-bottom: 1px solid rgba(0,0,0,0.05) !important;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.12) !important;
        border-left: 4px solid #4299e1 !important;
        color: #2c3e50 !important;
    }
    .math-block {
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .math-block .math {
        color: #2d3748 !important;
    }
    .slide-counter {
        color: #4a5568 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .status-badge {
        background: rgba(96, 165, 250, 0.15) !important;
        color: #2b6cb0 !important;
        border: 1px solid rgba(96, 165, 250, 0.15) !important;
    }
    .btn {
        color: #2d3748 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .btn-secondary {
        background: rgba(0,0,0,0.04) !important;
        border-color: rgba(0,0,0,0.08) !important;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15) !important;
        border-color: rgba(52, 211, 153, 0.2) !important;
        color: #38a169 !important;
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15) !important;

        color: #d69e2e !important;
    }
    .auto-indicator {

    }
    .loading-card {
        background: #ffffff !important;
        border: 1px solid rgba(0,0,0,0.08) !important;

    }

        color: #4a5568 !important;
    }
</style>
</head>
<body>
<div class="app-container">
    <header class="slide-header">
        <h1 id="slideTitle">Chargement...</h1>
    </header>
    <main class="slide-body" id="slideBody"></main>
    <!-- LOADING OVERLAY AVEC BOUTON ANNULER -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Préparation vocale...</div>
            <div class="loading-sub" id="loadingSub">Synthèse en cours</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loadingProgressBar"></div>
            </div>
            <div class="loading-timeout" id="loadingTimeout">⏱️ 30 secondes maximum</div>
            <button class="btn-cancel-loading" id="cancelLoadingBtn">
                <span>✕</span> Annuler
            </button>
        </div>
    </div>
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="slide-counter" id="slideCounter">1 / 3</span>
            <span class="status-badge idle" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">Prêt</span>
            </span>
        </div>
        <div class="footer-buttons">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-secondary" id="replayBtn">
                <span class="btn-icon">🔁</span> <span class="btn-label">Relire</span>
            </button>
            <button class="btn btn-play" id="playBtn">
                <span class="btn-icon">▶</span> <span class="btn-label">Play</span>
            </button>
        </div>
    </footer>
</div>
<script>
$(function() {
    // ================================================================
    // SLIDES
    // ================================================================
    const slides = [
  {
    "titre": "Introduction aux Recherches",
    "contenu": "<div style='font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, Oxygen, Ubuntu, Cantarell, \"Helvetica Neue\", sans-serif; line-height: 1.6; color: #333; padding: 10px;'><h2 style='color: #1565c0; text-align: center;'>🔍 Recherche dans un Tableau</h2><p style='text-align: center; font-size: 1.1em;'>Trouver un élément, un maximum, un minimum ou compter les occurrences</p><div style='background-color: #e3f2fd; padding: 15px; border-radius: 10px; border-left: 5px solid #1565c0; margin: 20px 0;'><p style='margin: 0;'><strong>Objectif de la leçon :</strong> Comprendre et implémenter les algorithmes de recherche dans un tableau : recherche séquentielle, recherche dichotomique, recherche du maximum/minimum, et comptage d'occurrences.</p></div></div>",
    "texteParle": "Bonjour à toutes et à tous. Aujourd'hui, nous allons étudier un ensemble d'algorithmes très importants en informatique : les algorithmes de recherche dans un tableau. Nous allons voir comment trouver un élément dans un tableau, comment trouver le maximum ou le minimum, et comment compter le nombre de fois qu'un élément apparaît. Nous comparerons également deux méthodes de recherche : la recherche séquentielle et la recherche dichotomique. Pour chaque algorithme, nous ferons une trace complète pour bien comprendre son fonctionnement.",
    "note": "Introduction aux algorithmes de recherche dans un tableau."
  },
  {
    "titre": "La Recherche Séquentielle : Principe",
    "contenu": "<div style='font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, Oxygen, Ubuntu, Cantarell, \"Helvetica Neue\", sans-serif; line-height: 1.6; color: #333; padding: 10px;'><div style='background-color: #f5f5f5; padding: 15px; border-radius: 10px;'><p><strong>Définition :</strong> La recherche séquentielle (ou linéaire) consiste à parcourir les éléments d'un tableau un par un, du premier au dernier, jusqu'à trouver l'élément recherché ou arriver à la fin du tableau.</p></div><div style='background-color: #e3f2fd; padding: 15px; border-radius: 10px; margin: 10px 0; border-left: 4px solid #1565c0;'><p><strong>Principe :</strong></p><ul><li>On examine chaque élément du tableau dans l'ordre.</li><li>Si l'élément correspond à la valeur recherchée, on s'arrête et on indique sa position.</li><li>Si on arrive à la fin du tableau sans avoir trouvé, l'élément n'existe pas.</li></ul></div><div style='background-color: #fff3e0; padding: 12px; border-radius: 8px; margin: 10px 0; border-left: 4px solid #e65100;'><p><strong>Cas d'utilisation :</strong> Tableaux non triés, petites listes.</p></div></div>",
    "texteParle": "Commençons par la recherche séquentielle, aussi appelée recherche linéaire. Le principe est simple : on parcourt le tableau élément par élément, du début à la fin. Pour chaque élément, on le compare avec la valeur recherchée. Si on trouve une correspondance, on s'arrête et on note la position. Si on arrive à la fin du tableau sans avoir trouvé, on conclut que l'élément n'est pas présent. Cette méthode fonctionne sur n'importe quel tableau, qu'il soit trié ou non. C'est la méthode la plus simple mais aussi la plus lente pour les grands tableaux.",
    "note": "La recherche séquentielle parcourt le tableau élément par élément."
  },
  {
    "titre": "Algorithme : Recherche Séquentielle",
    "contenu": "<div style='font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, Oxygen, Ubuntu, Cantarell, \"Helvetica Neue\", sans-serif; line-height: 1.6; color: #333; padding: 10px;'><div style='background-color: #e8f5e9; padding: 15px; border-radius: 10px; border-left: 5px solid #2e7d32;'><p><strong>Algorithme :</strong></p><pre style='background-color: #263238; color: #ffffff; padding: 15px; border-radius: 8px; overflow-x: auto; font-size: 13px; line-height: 1.4;'><code>Algorithme recherche_sequentielle\nVariables\n    T : Tableau[100] d'Entier\n    N, X, i : Entier\n    trouve : Booléen\nDébut\n    Ecrire(\"Entrer la valeur à rechercher : \")\n    Lire(X)\n    trouve ← Faux\n    i ← 0\n    Tant que (i < N) et (trouve = Faux) Faire\n        Si T[i] = X Alors\n            trouve ← Vrai\n        Sinon\n            i ← i + 1\n        FinSi\n    FinTantQue\n    Si trouve = Vrai Alors\n        Ecrire(\"L'élément \", X, \" est trouvé à la position \", i)\n    Sinon\n        Ecrire(\"L'élément \", X, \" n'existe pas dans le tableau\")\n    FinSi\nFin</code></pre></div><div style='background-color: #e3f2fd; padding: 12px; border-radius: 8px; margin-top: 10px; border-left: 4px solid #1565c0;'><p><strong>📝 Comment procéder pour rédiger cet algorithme :</strong></p><ol><li>Déclarer le tableau, sa taille N, la valeur X à rechercher, l'indice i et un booléen <code>trouve</code>.</li><li>Lire la valeur X.</li><li>Initialiser <code>trouve</code> à Faux et <code>i</code> à 0.</li><li>Parcourir le tableau avec une boucle <code>Tant que</code> qui s'arrête si on a trouvé ou si on a atteint la fin.</li><li>Si <code>T[i] = X</code>, mettre <code>trouve</code> à Vrai, sinon incrémenter <code>i</code>.</li><li>Afficher le résultat selon la valeur de <code>trouve</code>.</li></ol></div></div>",
    "texteParle": "Voici l'algorithme de recherche séquentielle. Pour le rédiger, on commence par déclarer les variables : le tableau T, sa taille N, la valeur X à rechercher, l'indice i et un booléen trouve. On lit la valeur X. On initialise trouve à Faux et i à 0. Ensuite, on utilise une boucle Tant que qui continue tant que i est inférieur à N et que trouve est Faux. Dans la boucle, on compare T[i] avec X. Si c'est égal, on met trouve à Vrai. Sinon, on incrémente i. À la fin, on affiche le résultat. Cet algorithme s'arrête dès qu'il trouve l'élément, ce qui le rend efficace dans le meilleur cas.",
    "note": "Rédaction de l'algorithme de recherche séquentielle."
  },
  {
    "titre": "Trace : Recherche Séquentielle",
    "contenu": "<div style='font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, Oxygen, Ubuntu, Cantarell, \"Helvetica Neue\", sans-serif; line-height: 1.6; color: #333; padding: 10px;'><div style='background-color: #f5f5f5; padding: 15px; border-radius: 10px;'><p><strong>Exemple :</strong> T = [5, 12, 7, 3, 9, 15, 8, 11, 6, 4], N = 10</p><p>Recherche de X = 9</p></div><table style='width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 10px;'><tr style='background-color: #2980b9; color: white;'><th style='padding: 5px; border: 1px solid #ddd;'>i</th><th style='padding: 5px; border: 1px solid #ddd;'>T[i]</th><th style='padding: 5px; border: 1px solid #ddd;'>T[i] = 9 ?</th><th style='padding: 5px; border: 1px solid #ddd;'>trouve</th><th style='padding: 5px; border: 1px solid #ddd;'>Action</th></tr><tr><td style='padding: 5px; border: 1px solid #ddd; text-align: center;'>0</td><td style='padding: 5px; border: 1px solid #ddd; text-align: center;'>5</td><td style='padding: 5px; border: 1px solid #ddd; text-align: center;'>NON</td><td style='padding: 5px; border: 1px solid #ddd; text-align: center;'>Faux</td><td style='padding: 5px; border: 1px solid #ddd; text-align: center;'>i ← 1</td></tr><tr style='background-color: #f9f9f9;'><td style='padding: 5px; border: 1px solid #ddd; text-align: center;'>1</td><td style='padding: 5px; border: 1px solid #ddd; text-align: center;'>12</td><td style='padding: 5px; border: 1px solid #ddd; text-align: center;'>NON</td><td style='padding: 5px; border: 1px solid #ddd; text-align: center;'>Faux</td><td style='padding: 5px; border: 1px solid #ddd; text-align: center;'>i ← 2</td></tr><tr><td style='padding: 5px; border: 1px solid #ddd; text-align: center;'>2</td><td style='padding: 5px; border: 1px solid #ddd; text-align: center;'>7</td><td style='padding: 5px; border: 1px solid #ddd; text-align: center;'>NON</td><td style='padding: 5px; border: 1px solid #ddd; text-align: center;'>Faux</td><td style='padding: 5px; border: 1px solid #ddd; text-align: center;'>i ← 3</td></tr><tr style='background-color: #f9f9f9;'><td style='padding: 5px; border: 1px solid #ddd; text-align: center;'>3</td><td style='padding: 5px; border: 1px solid #ddd; text-align: center;'>3</td><td style='padding: 5px; border: 1px solid #ddd; text-align: center;'>NON</td><td style='padding: 5px; border: 1px solid #ddd; text-align: center;'>Faux</td><td style='padding: 5px; border: 1px solid #ddd; text-align: center;'>i ← 4</td></tr><tr><td style='padding: 5px; border: 1px solid #ddd; text-align: center;'>4</td><td style='padding: 5px; border: 1px solid #ddd; text-align: center;'>9</td><td style='padding: 5px; border: 1px solid #ddd; text-align: center;'>OUI</td><td style='padding: 5px; border: 1px solid #ddd; text-align: center;'>Vrai</td><td style='padding: 5px; border: 1px solid #ddd; text-align: center;'>STOP</td></tr></table><div style='background-color: #e8f5e9; padding: 12px; border-radius: 8px; margin-top: 10px; border-left: 4px solid #2e7d32;'><p><strong>Résultat :</strong> L'élément 9 est trouvé à la position 4 (5 comparaisons).</p></div><div style='background-color: #ffebee; padding: 12px; border-radius: 8px; margin-top: 10px; border-left: 4px solid #c62828;'><p><strong>Recherche de X = 20 :</strong> On parcourt tout le tableau (i=0 à 9) sans trouver 20. Résultat : \"L'élément 20 n'existe pas\".</p></div></div>",
    "texteParle": "Faisons la trace de l'algorithme de recherche séquentielle avec le tableau T = [5, 12, 7, 3, 9, 15, 8, 11, 6, 4] et la valeur X = 9. On commence avec i = 0. T[0] = 5, ce n'est pas 9, donc on incrémente i. T[1] = 12, non. T[2] = 7, non. T[3] = 3, non. T[4] = 9, oui ! On met trouve à Vrai et on s'arrête. L'élément est trouvé à la position 4, après 5 comparaisons. Si on cherchait 20, on parcourrait tout le tableau sans le trouver. La recherche séquentielle est simple mais peut être lente si l'élément est à la fin ou absent.",
    "note": "Trace complète de la recherche séquentielle."
  },
  {
    "titre": "La Recherche Dichotomique : Principe",
    "contenu": "<div style='font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, Oxygen, Ubuntu, Cantarell, \"Helvetica Neue\", sans-serif; line-height: 1.6; color: #333; padding: 10px;'><div style='background-color: #f5f5f5; padding: 15px; border-radius: 10px;'><p><strong>Définition :</strong> La recherche dichotomique (ou recherche binaire) est une méthode qui consiste à diviser le tableau en deux parties à chaque étape, en comparant l'élément recherché avec l'élément du milieu.</p></div><div style='background-color: #e3f2fd; padding: 15px; border-radius: 10px; margin: 10px 0; border-left: 4px solid #1565c0;'><p><strong>Principe :</strong></p><ul><li><strong>Condition :</strong> Le tableau doit être <strong>trié</strong>.</li><li>On compare X avec l'élément du milieu.</li><li>Si X = milieu, on a trouvé.</li><li>Si X < milieu, on cherche dans la moitié gauche.</li><li>Si X > milieu, on cherche dans la moitié droite.</li><li>On répète jusqu'à trouver ou réduire la zone à zéro.</li></ul></div><div style='background-color: #fff3e0; padding: 12px; border-radius: 8px; margin: 10px 0; border-left: 4px solid #e65100;'><p><strong>⚠️ Important :</strong> La recherche dichotomique ne fonctionne que sur un tableau <strong>trié</strong>.</p></div></div>",
    "texteParle": "Passons maintenant à la recherche dichotomique, aussi appelée recherche binaire. C'est une méthode beaucoup plus efficace, mais elle a une condition : le tableau doit être trié. Le principe est de diviser le tableau en deux à chaque étape. On compare la valeur recherchée avec l'élément du milieu. Si c'est égal, on a trouvé. Si la valeur est plus petite, on cherche dans la moitié gauche. Si elle est plus grande, on cherche dans la moitié droite. On répète jusqu'à trouver ou jusqu'à ce que la zone de recherche soit vide. Cette méthode est très rapide car on divise le problème par deux à chaque étape.",
    "note": "La recherche dichotomique divise le tableau en deux à chaque étape. Tableau trié obligatoire."
  },
  {
    "titre": "Algorithme : Recherche Dichotomique",
    "contenu": "<div style='font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, Oxygen, Ubuntu, Cantarell, \"Helvetica Neue\", sans-serif; line-height: 1.6; color: #333; padding: 10px;'><div style='background-color: #e8f5e9; padding: 15px; border-radius: 10px; border-left: 5px solid #2e7d32;'><p><strong>Algorithme :</strong></p><pre style='background-color: #263238; color: #ffffff; padding: 15px; border-radius: 8px; overflow-x: auto; font-size: 13px; line-height: 1.4;'><code>Algorithme recherche_dichotomique\nVariables\n    T : Tableau[100] d'Entier\n    N, X, debut, fin, milieu : Entier\n    trouve : Booléen\nDébut\n    Ecrire(\"Entrer la valeur à rechercher : \")\n    Lire(X)\n    debut ← 0\n    fin ← N - 1\n    trouve ← Faux\n    Tant que (debut <= fin) et (trouve = Faux) Faire\n        milieu ← (debut + fin) / 2\n        Si T[milieu] = X Alors\n            trouve ← Vrai\n        Sinon\n            Si T[milieu] < X Alors\n                debut ← milieu + 1\n            Sinon\n                fin ← milieu - 1\n            FinSi\n        FinSi\n    FinTantQue\n    Si trouve = Vrai Alors\n        Ecrire(\"L'élément \", X, \" est trouvé à la position \", milieu)\n    Sinon\n        Ecrire(\"L'élément \", X, \" n'existe pas dans le tableau\")\n    FinSi\nFin</code></pre></div><div style='background-color: #e3f2fd; padding: 12px; border-radius: 8px; margin-top: 10px; border-left: 4px solid #1565c0;'><p><strong>📝 Comment procéder pour rédiger cet algorithme :</strong></p><ol><li>Déclarer le tableau, N, X, les indices debut, fin, milieu, et le booléen trouve.</li><li>Initialiser debut à 0 et fin à N-1.</li><li>Boucler tant que debut <= fin et que trouve est Faux.</li><li>Calculer le milieu : <code>milieu ← (debut + fin) / 2</code>.</li><li>Comparer T[milieu] avec X : si égal, trouve = Vrai ; si T[milieu] < X, chercher à droite (debut ← milieu + 1) ; sinon chercher à gauche (fin ← milieu - 1).</li><li>Afficher le résultat.</li></ol></div></div>",
    "texteParle": "Voici l'algorithme de recherche dichotomique. Pour le rédiger, on déclare le tableau, la taille N, la valeur X, les indices debut, fin et milieu, et un booléen trouve. On initialise debut à 0 et fin à N moins 1. Ensuite, on boucle tant que debut est inférieur ou égal à fin et que trouve est Faux. À chaque tour, on calcule le milieu. Si T[milieu] est égal à X, on a trouvé. Si T[milieu] est inférieur à X, cela signifie que X est dans la partie droite, donc on déplace debut à milieu plus 1. Sinon, X est dans la partie gauche, donc on déplace fin à milieu moins 1. On répète jusqu'à trouver ou épuiser la zone de recherche. Cet algorithme est beaucoup plus rapide que la recherche séquentielle.",
    "note": "Rédaction de l'algorithme de recherche dichotomique."
  },
  {
    "titre": "Trace : Recherche Dichotomique",
    "contenu": "<div style='font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, Oxygen, Ubuntu, Cantarell, \"Helvetica Neue\", sans-serif; line-height: 1.6; color: #333; padding: 10px;'><div style='background-color: #f5f5f5; padding: 15px; border-radius: 10px;'><p><strong>Exemple :</strong> T = [3, 4, 5, 6, 7, 8, 9, 11, 12, 15], N = 10 (tableau trié)</p><p>Recherche de X = 9</p></div><table style='width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 10px;'><tr style='background-color: #2980b9; color: white;'><th style='padding: 5px; border: 1px solid #ddd;'>Tour</th><th style='padding: 5px; border: 1px solid #ddd;'>debut</th><th style='padding: 5px; border: 1px solid #ddd;'>fin</th><th style='padding: 5px; border: 1px solid #ddd;'>milieu</th><th style='padding: 5px; border: 1px solid #ddd;'>T[milieu]</th><th style='padding: 5px; border: 1px solid #ddd;'>Comparaison</th><th style='padding: 5px; border: 1px solid #ddd;'>Action</th></tr><tr><td style='padding: 5px; border: 1px solid #ddd; text-align: center;'>1</td><td style='padding: 5px; border: 1px solid #ddd; text-align: center;'>0</td><td style='padding: 5px; border: 1px solid #ddd; text-align: center;'>9</td><td style='padding: 5px; border: 1px solid #ddd; text-align: center;'>4</td><td style='padding: 5px; border: 1px solid #ddd; text-align: center;'>7</td><td style='padding: 5px; border: 1px solid #ddd; text-align: center;'>7 < 9</td><td style='padding: 5px; border: 1px solid #ddd; text-align: center;'>debut ← 5</td></tr><tr style='background-color: #f9f9f9;'><td style='padding: 5px; border: 1px solid #ddd; text-align: center;'>2</td><td style='padding: 5px; border: 1px solid #ddd; text-align: center;'>5</td><td style='padding: 5px; border: 1px solid #ddd; text-align: center;'>9</td><td style='padding: 5px; border: 1px solid #ddd; text-align: center;'>7</td><td style='padding: 5px; border: 1px solid #ddd; text-align: center;'>9</td><td style='padding: 5px; border: 1px solid #ddd; text-align: center;'>9 = 9</td><td style='padding: 5px; border: 1px solid #ddd; text-align: center;'>trouve ← Vrai</td></tr></table><div style='background-color: #e8f5e9; padding: 12px; border-radius: 8px; margin-top: 10px; border-left: 4px solid #2e7d32;'><p><strong>Résultat :</strong> L'élément 9 est trouvé à la position 7 (2 comparaisons seulement !).</p></div><div style='background-color: #fff3e0; padding: 12px; border-radius: 8px; margin-top: 10px; border-left: 4px solid #e65100;'><p><strong>Comparaison :</strong> La recherche séquentielle aurait nécessité 7 comparaisons pour trouver 9. La recherche dichotomique n'en a nécessité que 2 !</p></div></div>",
    "texteParle": "Faisons la trace de la recherche dichotomique. Le tableau est trié : [3, 4, 5, 6, 7, 8, 9, 11, 12, 15]. On cherche 9. On initialise debut à 0 et fin à 9. Premier tour : on calcule le milieu, qui est 4. T[4] = 7. 7 est inférieur à 9, donc on cherche à droite : debut devient 5. Deuxième tour : debut = 5, fin = 9. Le milieu est 7. T[7] = 9. C'est égal ! On a trouvé en seulement 2 comparaisons. La recherche séquentielle aurait pris 7 comparaisons. C'est la grande force de la recherche dichotomique : elle est beaucoup plus rapide sur les grands tableaux triés.",
    "note": "Trace complète de la recherche dichotomique."
  },
  {
    "titre": "Comparaison : Séquentielle vs Dichotomique",
    "contenu": "<div style='font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, Oxygen, Ubuntu, Cantarell, \"Helvetica Neue\", sans-serif; line-height: 1.6; color: #333; padding: 10px;'><h2 style='color: #1565c0; font-size: 18px;'>📊 Comparaison des deux recherches</h2><table style='width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 10px;'><tr style='background-color: #2980b9; color: white;'><th style='padding: 6px; border: 1px solid #ddd;'>Critère</th><th style='padding: 6px; border: 1px solid #ddd;'>Recherche Séquentielle</th><th style='padding: 6px; border: 1px solid #ddd;'>Recherche Dichotomique</th></tr><tr><td style='padding: 6px; border: 1px solid #ddd;'><strong>Condition</strong></td><td style='padding: 6px; border: 1px solid #ddd;'>Aucune (tableau non trié accepté)</td><td style='padding: 6px; border: 1px solid #ddd;'>Tableau <strong>trié</strong> obligatoire</td></tr><tr style='background-color: #f9f9f9;'><td style='padding: 6px; border: 1px solid #ddd;'><strong>Complexité (pire cas)</strong></td><td style='padding: 6px; border: 1px solid #ddd;'>O(n)</td><td style='padding: 6px; border: 1px solid #ddd;'>O(log n)</td></tr><tr><td style='padding: 6px; border: 1px solid #ddd;'><strong>Efficacité</strong></td><td style='padding: 6px; border: 1px solid #ddd;'>Lente pour grands tableaux</td><td style='padding: 6px; border: 1px solid #ddd;'>Très rapide</td></tr><tr style='background-color: #f9f9f9;'><td style='padding: 6px; border: 1px solid #ddd;'><strong>Simplicité</strong></td><td style='padding: 6px; border: 1px solid #ddd;'>Très simple</td><td style='padding: 6px; border: 1px solid #ddd;'>Plus complexe</td></tr><tr><td style='padding: 6px; border: 1px solid #ddd;'><strong>Avantage</strong></td><td style='padding: 6px; border: 1px solid #ddd;'>Fonctionne partout</td><td style='padding: 6px; border: 1px solid #ddd;'>Très performante</td></tr><tr style='background-color: #f9f9f9;'><td style='padding: 6px; border: 1px solid #ddd;'><strong>Inconvénient</strong></td><td style='padding: 6px; border: 1px solid #ddd;'>Lente</td><td style='padding: 6px; border: 1px solid #ddd;'>Nécessite un tri préalable</td></tr></table><div style='background-color: #e8f5e9; padding: 12px; border-radius: 8px; margin-top: 10px; border-left: 4px solid #2e7d32;'><p><strong>💡 Conseil :</strong> Si le tableau est trié, utilisez la recherche dichotomique. Sinon, utilisez la recherche séquentielle.</p></div></div>",
    "texteParle": "Comparons maintenant les deux méthodes de recherche. La recherche séquentielle ne nécessite aucune condition : elle fonctionne sur n'importe quel tableau. Sa complexité est O(n) dans le pire des cas. Elle est simple à implémenter mais lente pour les grands tableaux. La recherche dichotomique, quant à elle, nécessite un tableau trié. Sa complexité est O(log n), ce qui est beaucoup plus rapide. Par exemple, pour un tableau de 1000 éléments, la recherche séquentielle fera jusqu'à 1000 comparaisons, tandis que la recherche dichotomique n'en fera qu'une dizaine. Le conseil est simple : si le tableau est trié, utilisez la recherche dichotomique. Sinon, utilisez la recherche séquentielle.",
    "note": "Tableau comparatif des deux méthodes de recherche."
  },
  {
    "titre": "Algorithme : Recherche du Maximum",
    "contenu": "<div style='font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, Oxygen, Ubuntu, Cantarell, \"Helvetica Neue\", sans-serif; line-height: 1.6; color: #333; padding: 10px;'><div style='background-color: #e8f5e9; padding: 15px; border-radius: 10px; border-left: 5px solid #2e7d32;'><p><strong>Algorithme :</strong></p><pre style='background-color: #263238; color: #ffffff; padding: 15px; border-radius: 8px; overflow-x: auto; font-size: 13px; line-height: 1.4;'><code>Algorithme recherche_maximum\nVariables\n    T : Tableau[100] d'Entier\n    N, i, max : Entier\nDébut\n    max ← T[0]\n    Pour i ← 1 à N-1 Faire\n        Si T[i] > max Alors\n            max ← T[i]\n        FinSi\n    FinPour\n    Ecrire(\"Le maximum est : \", max)\nFin</code></pre></div><div style='background-color: #e3f2fd; padding: 12px; border-radius: 8px; margin-top: 10px; border-left: 4px solid #1565c0;'><p><strong>📝 Comment procéder pour rédiger cet algorithme :</strong></p><ol><li>Initialiser <code>max</code> avec le premier élément du tableau (<code>T[0]</code>).</li><li>Parcourir le tableau du deuxième élément au dernier.</li><li>À chaque étape, comparer <code>T[i]</code> avec <code>max</code>.</li><li>Si <code>T[i] > max</code>, mettre à jour <code>max</code> avec <code>T[i]</code>.</li><li>À la fin, <code>max</code> contient le maximum du tableau.</li></ol></div></div>",
    "texteParle": "Voyons maintenant comment trouver le maximum d'un tableau. Pour rédiger cet algorithme, on initialise une variable max avec le premier élément du tableau. Ensuite, on parcourt le tableau du deuxième élément au dernier. À chaque étape, on compare l'élément courant avec max. Si l'élément est plus grand, on met à jour max. À la fin de la boucle, max contient le plus grand élément du tableau. C'est un algorithme très simple mais très utile. Pour trouver le minimum, il suffit de changer la comparaison : si T[i] est inférieur à min, on met à jour min.",
    "note": "Recherche du maximum (ou minimum) dans un tableau."
  },
  {
    "titre": "Trace : Recherche du Maximum",

    // ================================================================

    function setStatus(text, type) {
        $statusText.text(text);
        $statusBadge.removeClass('idle speaking error paused waiting loading');
        if (type === 'speaking') $statusBadge.addClass('speaking');
        else if (type === 'error') $statusBadge.addClass('error');
        else if (type === 'paused') $statusBadge.addClass('paused');
        else if (type === 'waiting') $statusBadge.addClass('waiting');
        else if (type === 'loading') $statusBadge.addClass('loading');
        else $statusBadge.addClass('idle');
    }
    function updatePlayButton() {
        if (isPlaying) {
            $play.addClass('playing');
            $play.find('.btn-icon').text('⏸');
            $play.find('.btn-label').text('Pause');
        } else {
            $play.removeClass('playing');
            $play.find('.btn-icon').text('▶');
            $play.find('.btn-label').text('Play');
        }
    }
    function showLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        loadingCancelled = false;
        isLoading = true;
        // Réinitialiser la barre de progression
        $loadingProgressBar.css('animation', 'none');
        $loadingProgressBar.css('width', '0%');
        // Forcer un reflow
        $loadingProgressBar[0].offsetHeight;
        $loadingProgressBar.css('animation', 'loadingProgress 30s ease-out forwards');
        $loadingText.text('Préparation vocale...');
        $loadingSub.text('Synthèse en cours');
        $loadingTimeout.text('⏱️ 30 secondes maximum');
        $loading.fadeIn(300);
        setStatus("⏳ Chargement...", 'loading');
        // 🔥 TIMEOUT DE 30 SECONDES
        loadingTimeout = setTimeout(() => {
            if (isLoading && !loadingCancelled) {
                hideLoading();
                setStatus("⚠️ Délai dépassé (30s)", 'error');
                isPlaying = false;
                updatePlayButton();
                $loadingSub.text('La synthèse vocale a pris trop de temps');
                $loadingTimeout.text('❌ Délai dépassé');
            }
        }, 30000);
    }
    function hideLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        isLoading = false;

        // Ne pas changer le statut si on est en train de parler

            setStatus("⏸ Lecture arrêtée", 'paused');

        loadingCancelled = true;

    // Arrêter la parole proprement

        try {

                let errorHandled = false;
                utterance.onstart = function() {
                    if (loadingCancelled) {
                        stopSpeaking();
                        resolve();
                        return;
                    }
                    hideLoading();
                    isSpeaking = true;
                    isPlaying = true;
                    isPaused = false;
                    setStatus("🔊 Lecture en cours", 'speaking');
                    updatePlayButton();
                };
                utterance.onend = function() {
                    if (isFinished) return;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    setStatus("✅ Terminé", 'idle');
                    hideLoading();
                    updatePlayButton();
                    resolve();
                };
                utterance.onerror = function(e) {
                    if (isFinished || errorHandled) return;
                    errorHandled = true;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    hideLoading();
                    updatePlayButton();
                    if (e.error === 'not-allowed') {
                        setStatus("⚠️ Permission refusée", 'error');
                    } else if (e.error === 'synthesis-unavailable') {
                        setStatus("⚠️ Synthèse indisponible", 'error');
                    } else if (e.error === 'canceled') {
                        setStatus("⏸ Annulé", 'paused');
                    } else {
                        setStatus("❌ Erreur audio: " + (e.error || 'inconnue'), 'error');
                    }
                    resolve();
                };
                // Gestion du chargement des voix
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = function() {
                        if (!loadingCancelled) {
                            try {
                                synth.speak(utterance);
                            } catch(err) {
                                // Silencieux
                            }
                        }
                        synth.onvoiceschanged = null;
                    };
                }
                currentUtterance = utterance;
                if (!loadingCancelled) {
                    try {
                        synth.speak(utterance);
                    } catch(err) {
                        setTimeout(() => {
                            if (!loadingCancelled) {
                                try {
                                    synth.speak(utterance);
                                } catch(e) {
                                    setStatus("❌ Erreur de lecture", 'error');
                                    isPlaying = false;
                                    updatePlayButton();
                                    hideLoading();
                                    resolve();
                                }
                            } else {
                                resolve();
                            }
                        }, 100);
                    }
                } else {
                    resolve();
                }
            } catch(err) {
                hideLoading();
                setStatus("❌ Erreur générale", 'error');
                isPlaying = false;
                updatePlayButton();
                console.error('Erreur speakSlide:', err);
                resolve();
            }
        });
    }
    // ================================================================
    // NAVIGATION
    // ================================================================
    async function goToSlide(index) {
        if (isTransitioning) return;
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        // Si on est en train de lire, on met en pause avant de naviguer
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        // Arrêter complètement la lecture
        stopSpeaking();
        await new Promise(r => setTimeout(r, 50));
        if (index === currentIndex) {
            setStatus("📄 Slide actuel", 'idle');
            return;
        }
        isTransitioning = true;
        currentIndex = index;
        renderSlide(index);
        // Réinitialiser l'état de lecture
        isPlaying = false;
        updatePlayButton();
        setStatus("⏸ Lecture arrêtée", 'paused');
        await new Promise(r => setTimeout(r, 150));
        isTransitioning = false;
    }
    async function goToNext() {
        if (isTransitioning) return;
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        if (currentIndex + 1 < total) {
            await goToSlide(currentIndex + 1);
        } else {
            setStatus("🏁 Dernier slide", 'idle');
        }
    }
    async function goToPrev() {
        if (isTransitioning) return;
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        if (currentIndex - 1 >= 0) {
            await goToSlide(currentIndex - 1);
        } else {
            setStatus("🔁 Premier slide", 'idle');
        }
    }
    // ================================================================
    // GESTION PLAY/PAUSE
    // ================================================================
    function togglePlay() {
        if (!userInteracted) {
            userInteracted = true;
        }
        // Si le chargement est en cours, on l'annule
        if (isLoading) {
            cancelLoading();
            return;
        }
        // Si le synthétiseur est en pause, on reprend
        if (synth && synth.paused) {
            resumeSpeaking();
            return;
        }
        // Si la lecture est en cours, on met en pause
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
            return;
        }
        // Sinon, on démarre la lecture du slide courant
        if (!isSpeaking && !isPlaying) {
            stopSpeaking();
            speakSlide(currentIndex);
        }
    }
    // ================================================================
    // INIT
    // ================================================================
    async function init() {
        // Vérifier la compatibilité
        if (!window.speechSynthesis) {
            setStatus("❌ Synthèse vocale non supportée", 'error');
            speechSupported = false;
        }
        // Précharger les voix
        try {
            if (synth.getVoices) {
                synth.getVoices();
                setTimeout(() => {
                    try {
                        synth.getVoices();
                    } catch(e) {}
                }, 200);
            }
        } catch(e) {
            console.warn('Erreur chargement voix:', e);
        }
        // Afficher le premier slide
        renderSlide(0);
        $counter.text(`1 / ${total}`);
        // État initial
        setStatus("⏸ Appuie sur Play", 'paused');
        updatePlayButton();
        $autoIndicator.text('⏸ Lecture manuelle');
        // ================================================================
        // ÉVÉNEMENTS
        // ================================================================
        // Bouton Play/Pause
        $play.on('click', function() {
            togglePlay();
        });
        // Bouton Annuler le chargement
        $cancelLoading.on('click', function() {
            cancelLoading();
        });
        // Navigation
        $prev.on('click', function() {
            // Si chargement en cours, on annule
            if (isLoading) cancelLoading();
            goToPrev();
        });
        $next.on('click', function() {
            if (isLoading) cancelLoading();
            goToNext();
        });
        // Replay - relire le slide courant
        $replay.on('click', function() {
            if (isLoading) cancelLoading();
            stopSpeaking();
            setTimeout(() => {
                speakSlide(currentIndex);
            }, 100);
        });
        // Support du clavier (espace pour play/pause)
        $(document).on('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });
        // Nettoyage
        $(window).on('beforeunload', function() {
            try {
                if (synth.speaking) synth.cancel();
            } catch(e) {}
            hideLoading();
        });
        // Gérer les cas où la synthèse se termine de manière inattendue
        setInterval(() => {
            if (isPlaying && !synth.speaking && !synth.pending && !isPaused && !isLoading) {
                isPlaying = false;
                updatePlayButton();
                setStatus("⏸ Lecture arrêtée", 'paused');
            }
        }, 1000);
    }
    init();
});
    // ================================================================
    // GESTION DU THÈME JOUR/NUIT
    // ================================================================
    let isDarkMode = false;
    function toggleTheme() {
        isDarkMode = !isDarkMode;
        const body = document.body;
        const appContainer = document.querySelector('.app-container');
        const header = document.querySelector('.slide-header');
        const footer = document.querySelector('.slide-footer');
        const contentCards = document.querySelectorAll('.content-card');
        const noteBoxes = document.querySelectorAll('.note-box');
        const mathBlocks = document.querySelectorAll('.math-block');
        const buttons = document.querySelectorAll('.btn');
        const statusBadge = document.querySelector('.status-badge');
        const slideCounter = document.querySelector('.slide-counter');
        const autoIndicator = document.querySelector('.auto-indicator');
        const themeBtn = document.getElementById('themeToggle');
        if (isDarkMode) {
            // Mode nuit
            body.style.background = '#0b1120';
            body.style.color = '#f1f5f9';
            if (appContainer) appContainer.style.background = 'linear-gradient(145deg, #0f172a 0%, #1e293b 100%)';
            if (header) header.style.background = 'rgba(15, 23, 42, 0.85)';
            if (footer) footer.style.background = 'rgba(15, 23, 42, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.05)';
                card.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.08)';
                note.style.color = '#cbd5e1';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.25)';
                block.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#e2e8f0';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.12)';
                statusBadge.style.color = '#93bbfc';
            }
            if (slideCounter) {
                slideCounter.style.color = '#94a3b8';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#64748b';
            }
            if (themeBtn) {
                themeBtn.textContent = '☀️';
                themeBtn.title = 'Passer en mode jour';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#e2e8f0';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#e2e8f0';
                }
            });
        } else {
            // Mode jour (par défaut)
            body.style.background = '#f0f4f8';
            body.style.color = '#1a202c';
            if (appContainer) appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
            if (header) header.style.background = 'rgba(255, 255, 255, 0.85)';
            if (footer) footer.style.background = 'rgba(255, 255, 255, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.8)';
                card.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.12)';
                note.style.color = '#2c3e50';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.05)';
                block.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#2d3748';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
                statusBadge.style.color = '#2b6cb0';
            }
            if (slideCounter) {
                slideCounter.style.color = '#4a5568';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#718096';
            }
            if (themeBtn) {
                themeBtn.textContent = '🌓';
                themeBtn.title = 'Passer en mode nuit';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#2c3e50';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#2d3748';
                }
            });
        }
    }
    // Initialiser en mode jour
    document.addEventListener('DOMContentLoaded', function() {
        // Appliquer le mode jour par défaut
        const body = document.body;
        body.style.background = '#f0f4f8';
        body.style.color = '#1a202c';
        const appContainer = document.querySelector('.app-container');
        if (appContainer) {
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
        }
        const header = document.querySelector('.slide-header');
        if (header) {
            header.style.background = 'rgba(255, 255, 255, 0.85)';
        }
        const footer = document.querySelector('.slide-footer');
        if (footer) {
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
        }
        document.querySelectorAll('.content-card').forEach(card => {
            card.style.background = 'rgba(255,255,255,0.8)';
            card.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        document.querySelectorAll('.note-box').forEach(note => {
            note.style.background = 'rgba(96, 165, 250, 0.12)';
            note.style.color = '#2c3e50';
        });
        document.querySelectorAll('.math-block').forEach(block => {
            block.style.background = 'rgba(0,0,0,0.05)';
            block.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        document.querySelectorAll('.btn').forEach(btn => {
            btn.style.color = '#2d3748';
        });
        const statusBadge = document.querySelector('.status-badge');
        if (statusBadge) {
            statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
            statusBadge.style.color = '#2b6cb0';
        }
        const slideCounter = document.querySelector('.slide-counter');
        if (slideCounter) {
            slideCounter.style.color = '#4a5568';
        }
        const autoIndicator = document.querySelector('.auto-indicator');
        if (autoIndicator) {
            autoIndicator.style.color = '#718096';
        }
        document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
            if (!el.closest('.note-box')) {
                el.style.color = '#2c3e50';
            }
        });
        document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
            if (!el.closest('.note-box') && !el.closest('.math-block')) {
                el.style.color = '#2d3748';
            }
        });
        const themeBtn = document.getElementById('themeToggle');
        if (themeBtn) {
            themeBtn.textContent = '🌓';
            themeBtn.title = 'Passer en mode nuit';
            // Ajouter l'écouteur d'événement click
            themeBtn.addEventListener('click', toggleTheme);
        }
    });
