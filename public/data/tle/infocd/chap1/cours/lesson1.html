<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Présentation mobile</title>
    <!-- MathJax -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' },
            options: { skipHtmlTypes: 'script' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }
    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
    }
    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 500px;
        margin: 0 auto;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }
    .slide-header {
        flex-shrink: 0;
        padding: 18px 16px 10px 16px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        z-index: 10;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }
    .slide-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }
    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
    }
    .content-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 18px 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        flex-shrink: 0;
    }
    .content-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }
    .content-card li {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        line-height: 1.5;
    }
    .content-card li:last-child {
        border-bottom: none;
    }
    .bullet-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
    }
    .math-block {
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        overflow-x: auto;
        flex-shrink: 0;
        margin: 4px 0;
    }
    .math-block .math {
        font-size: 1.2rem;
        color: #e2e8f0;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.08);
        border-left: 4px solid #60a5fa;
        padding: 12px 16px;
        border-radius: 12px;
        font-style: italic;
        font-size: 0.9rem;
        color: #cbd5e1;
        flex-shrink: 0;
    }
    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        border-radius: 0;
        flex-direction: column;
    }
    .loading-card {
        background: #1e293b;
        padding: 32px 28px;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #334155;
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px auto;
    }
    .loading-text {
        font-weight: 600;
        font-size: 1.1rem;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    .loading-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 16px;
    }
    .loading-progress {
        height: 3px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        animation: loadingProgress 30s ease-out forwards;
    }
    .loading-timeout {
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 12px;
    }
    .btn-cancel-loading {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 40px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #f87171;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }
    .btn-cancel-loading:active {
        transform: scale(0.94);
        background: rgba(239, 68, 68, 0.25);
    }
    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
    }
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }
    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }
    .slide-counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255,255,255,0.05);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(255,255,255,0.04);
    }
    .status-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 30px;
        background: rgba(96, 165, 250, 0.12);
        color: #93bbfc;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
    }
    .status-badge .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: pulse-dot 1.2s infinite;
        flex-shrink: 0;
    }
    .status-badge.idle .dot {
        animation: none;
        background: #64748b;
    }
    .status-badge.speaking .dot {
        background: #34d399;
        animation: pulse-dot 0.8s infinite;
    }
    .status-badge.error .dot {
        background: #f87171;
        animation: none;
    }
    .status-badge.paused .dot {
        animation: none;
        background: #fbbf24;
    }
    .status-badge.waiting .dot {
        animation: pulse-dot 1.5s infinite;
        background: #fbbf24;
    }
    .status-badge.loading .dot {
        animation: pulse-dot 0.5s infinite;
        background: #60a5fa;
    }
    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.7); }
    }
    .footer-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }
    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }
    .btn:active {
        transform: scale(0.94);
        background: rgba(255,255,255,0.1);
    }
    .btn-secondary {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.06);
    }
    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
        min-width: 80px;
        justify-content: center;
    }
    .btn-play:active {
        background: rgba(52, 211, 153, 0.25);
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
    }
    .auto-indicator {
        font-size: 0.65rem;
        color: #64748b;
        text-align: center;
        letter-spacing: 0.3px;
        padding: 2px 0;
    }
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.2rem;
        }
        .content-card li {
            font-size: 0.9rem;
            padding: 8px 0;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .btn-play {
            min-width: 60px;
        }
        .footer-buttons {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
        .loading-card {
            padding: 20px 16px;
        }
        .math-block .math {
            font-size: 1rem;
        }
    }
    @media (min-width: 600px) {
        .app-container {
            max-width: 480px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
        .loading-overlay {
            border-radius: 32px;
        }
    }
    /* Mode jour (par défaut) - ajouté par le script de thème */
    html, body {
        background: #f0f4f8 !important;
        color: #1a202c !important;
    }
    .app-container {
        background: linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%) !important;
    }
    .slide-header {
        background: rgba(255, 255, 255, 0.85) !important;
        border-bottom: 1px solid rgba(0,0,0,0.08) !important;
    }
    .slide-header h1 {
        background: linear-gradient(135deg, #2b6cb0, #6b46c1) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        background-clip: text !important;
    }
    .slide-footer {
        background: rgba(255, 255, 255, 0.9) !important;
        border-top: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card {
        background: rgba(255,255,255,0.8) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card li {
        border-bottom: 1px solid rgba(0,0,0,0.05) !important;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.12) !important;
        border-left: 4px solid #4299e1 !important;
        color: #2c3e50 !important;
    }
    .math-block {
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .math-block .math {
        color: #2d3748 !important;
    }
    .slide-counter {
        color: #4a5568 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .status-badge {
        background: rgba(96, 165, 250, 0.15) !important;
        color: #2b6cb0 !important;
        border: 1px solid rgba(96, 165, 250, 0.15) !important;
    }
    .btn {
        color: #2d3748 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .btn-secondary {
        background: rgba(0,0,0,0.04) !important;
        border-color: rgba(0,0,0,0.08) !important;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15) !important;
        border-color: rgba(52, 211, 153, 0.2) !important;
        color: #38a169 !important;
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15) !important;
        border-color: rgba(251, 191, 36, 0.2) !important;
        color: #d69e2e !important;
    }
    .auto-indicator {
        color: #718096 !important;
    }
    .loading-card {
        background: #ffffff !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .loading-text {
        color: #1a202c !important;
    }
    .loading-sub {
        color: #4a5568 !important;
    }
</style>
</head>
<body>
<div class="app-container">
    <header class="slide-header">
        <h1 id="slideTitle">Chargement...</h1>
    </header>
    <main class="slide-body" id="slideBody"></main>
    <!-- LOADING OVERLAY AVEC BOUTON ANNULER -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Préparation vocale...</div>
            <div class="loading-sub" id="loadingSub">Synthèse en cours</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loadingProgressBar"></div>
            </div>
            <div class="loading-timeout" id="loadingTimeout">⏱️ 30 secondes maximum</div>
            <button class="btn-cancel-loading" id="cancelLoadingBtn">
                <span>✕</span> Annuler
            </button>
        </div>
    </div>
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="slide-counter" id="slideCounter">1 / 3</span>
            <span class="status-badge idle" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">Prêt</span>
            </span>
        </div>
        <div class="footer-buttons">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-secondary" id="replayBtn">
                <span class="btn-icon">🔁</span> <span class="btn-label">Relire</span>
            </button>
            <button class="btn btn-play" id="playBtn">
                <span class="btn-icon">▶</span> <span class="btn-label">Play</span>
            </button>
        </div>
    </footer>
</div>
<script>
$(function() {
    // ================================================================
    // SLIDES
    // ================================================================
   const slides = [
  {
    "titre": "Définition : Algorithme et Algorithmique",
    "contenu": "<div style='background: #eaf2f8; padding: 15px; border-radius: 10px; border-left: 5px solid #2980b9; color: #000000'><h3 style='color: #1a5276;'>🔍 Qu'est-ce que l'algorithmique ?</h3><p style='font-size: 1.1em;'><strong>L'algorithmique</strong> est la science qui étudie les méthodes de résolution de problèmes par des suites d'opérations formelles et précises. C'est l'art de concevoir des algorithmes.</p></div><div style='background: #fef9e7; padding: 15px; border-radius: 10px; border-left: 5px solid #f39c12; margin-top: 15px; color: #000000'><h3 style='color: #b9770e;'>🧠 Qu'est-ce qu'un algorithme ?</h3><p style='font-size: 1.1em;'><strong>Définition :</strong> Un algorithme est une <span style='color: #d35400; font-weight: bold;'>suite finie et ordonnée d'instructions</span> qui, exécutées correctement, permettent de résoudre un problème ou d'obtenir un résultat.</p></div><div style='background: #e8f8f5; padding: 15px; border-radius: 10px; border-left: 5px solid #1abc9c; margin-top: 15px; color: #000000'><h4 style='color: #0e6655;'>📌 À retenir :</h4><ul style='padding-left: 20px;'><li><strong>Algorithmique</strong> = la science / la discipline.</li><li><strong>Algorithme</strong> = le produit / la recette concrète.</li></ul></div>",
    "texteParle": "Commençons par définir deux termes fondamentaux. L'algorithmique est la science qui étudie les méthodes de résolution de problèmes. C'est la discipline, l'art de concevoir des algorithmes. Un algorithme, quant à lui, est le produit de cette science : c'est une suite finie et ordonnée d'instructions qui, exécutées correctement, permettent de résoudre un problème ou d'obtenir un résultat. En résumé, l'algorithmique est la science, et l'algorithme est la recette.",
    "note": "L'algorithmique est la science ; l'algorithme est le produit de cette science."
  },
  {
    "titre": "Les Parties d'un Algorithme",
    "contenu": "<div style='background: #f4f6f7; padding: 15px; border-radius: 10px; border: 1px solid #bdc3c7; color: #000000'><h3 style='color: #2c3e50;'>⚙️ Structure générale d'un algorithme</h3><p>Un algorithme se compose de trois parties principales :</p></div><div style='display: grid; grid-template-columns: 1fr; gap: 12px; margin-top: 15px;'><div style='background: #d6eaf8; padding: 12px; border-radius: 8px; border-left: 4px solid #2980b9; color: #000000'><h4 style='margin: 0; color: #1a5276;'>1️⃣ L'En-tête</h4><p style='margin: 5px 0 0 0;'>Contient le mot clé <code>Algorithme</code> suivi du nom de l'algorithme.</p></div><div style='background: #fdebd0; padding: 12px; border-radius: 8px; border-left: 4px solid #e67e22; color: #000000'><h4 style='margin: 0; color: #a04000;'>2️⃣ La Partie Déclarative</h4><p style='margin: 5px 0 0 0;'>Contient les variables, constantes, structures de données, fonctions et procédures.</p></div><div style='background: #d5f5e3; padding: 12px; border-radius: 8px; border-left: 4px solid #27ae60; color: #000000'><h4 style='margin: 0; color: #1e8449;'>3️⃣ Le Corps de l'Algorithme</h4><p style='margin: 5px 0 0 0;'>Contient les instructions (saisie, traitement, sortie) entre <code>Début</code> et <code>Fin</code>.</p></div></div>",
    "texteParle": "Un algorithme est structuré en trois parties principales. Premièrement, l'en-tête, qui contient le mot clé Algorithme suivi du nom de l'algorithme. Deuxièmement, la partie déclarative, où l'on définit les variables, les constantes, les structures de données, les fonctions et les procédures. Troisièmement, le corps de l'algorithme, qui contient les instructions proprement dites, encadrées par les mots Début et Fin. Nous allons détailler chacune de ces parties.",
    "note": "En-tête → Déclarations → Corps (Début ... Fin)."
  },
  {
    "titre": "L'En-tête",
    "contenu": "<div style='background: #eaf2f8; padding: 15px; border-radius: 10px; border-left: 5px solid #2980b9; color: #000000'><h3 style='color: #1a5276;'>📋 Définition de l'en-tête</h3><p>L'en-tête est la première partie de l'algorithme. Elle permet de <strong>nommer</strong> l'algorithme.</p></div><div style='background: #1c2833; color: #fdfefe; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 1em; margin-top: 15px;'><span style='color: #f1c40f;'>Algorithme</span> Nom_Algorithme</div><div style='background: #fef9e7; padding: 15px; border-radius: 10px; border-left: 5px solid #f39c12; margin-top: 15px; color: #000000'><h4 style='color: #b9770e;'>📌 Règles à respecter :</h4><ul style='padding-left: 20px;'><li>Le mot clé peut être <code>Algorithme</code> ou <code>Algo</code>.</li><li>Le nom de l'algorithme doit être <strong>un seul mot</strong> (pas d'espace).</li><li>Le nom doit être significatif et commencer par une lettre.</li><li>Pas de caractères spéciaux ni d'accents.</li></ul></div><div style='background: #e8f8f5; padding: 15px; border-radius: 10px; border-left: 5px solid #1abc9c; margin-top: 15px; color: #000000'><h4 style='color: #0e6655;'>✅ Exemples valides :</h4><p><code>Algorithme Calcul_Somme</code><br><code>Algo Conversion</code><br><code>Algorithme Moyenne_Classe</code></p></div>",
    "texteParle": "L'en-tête est la toute première partie d'un algorithme. Elle sert à nommer l'algorithme. On écrit le mot clé Algorithme, ou Algo en abrégé, suivi du nom de l'algorithme. Le nom doit être un seul mot, sans espace. Il doit être significatif, commencer par une lettre, et ne pas contenir de caractères spéciaux ni d'accents. Par exemple : Algorithme Calcul_Somme, ou Algo Conversion. C'est simple mais essentiel pour identifier clairement ce que fait l'algorithme.",
    "note": "Le nom de l'algorithme s'écrit en un seul mot, sans espace."
  },
  {
    "titre": "La Partie Déclarative",
    "contenu": "<div style='background: #fdebd0; padding: 15px; border-radius: 10px; border-left: 5px solid #e67e22; color: #000000'><h3 style='color: #a04000;'>📦 Rôle de la partie déclarative</h3><p>La partie déclarative permet de <strong>déclarer et définir</strong> tous les objets que l'algorithme va utiliser avant de commencer les instructions.</p></div><div style='background: #f4f6f7; padding: 15px; border-radius: 10px; margin-top: 15px; color: #000000'><h4>Elle contient :</h4><ul style='padding-left: 20px;'><li><strong>Les variables</strong> : valeurs modifiables en cours d'exécution.</li><li><strong>Les constantes</strong> : valeurs fixes qui ne changent pas.</li><li><strong>Les structures de données</strong> : ensembles organisés de données (tableaux, piles, files...).</li><li><strong>Les fonctions</strong> : sous-programmes qui retournent une valeur.</li><li><strong>Les procédures</strong> : sous-programmes qui ne retournent rien.</li></ul></div><div style='background: #eaf2f8; padding: 12px; border-radius: 8px; margin-top: 15px; color: #000000'><p style='margin: 0;'>💡 <em>On déclare tout ce dont on a besoin avant d'écrire les instructions.</em></p></div>",
    "texteParle": "La partie déclarative est la deuxième partie de l'algorithme. Elle permet de déclarer et de définir tous les objets que l'algorithme va utiliser, avant de commencer les instructions. Elle contient les variables, qui sont des valeurs modifiables ; les constantes, qui sont des valeurs fixes ; les structures de données, comme les tableaux ou les piles ; les fonctions, qui retournent une valeur ; et les procédures, qui ne retournent rien. On déclare tout ce dont on a besoin avant d'écrire les instructions. C'est comme préparer ses ingrédients avant de cuisiner.",
    "note": "Toujours déclarer avant d'utiliser."
  },
  {
    "titre": "Les Variables",
    "contenu": "<div style='background: #e8f8f5; padding: 15px; border-radius: 10px; border-left: 5px solid #1abc9c; color: #000000'><h3 style='color: #0e6655;'>📝 Définition d'une variable</h3><p>Une <strong>variable</strong> est un emplacement mémoire nommé qui contient une valeur pouvant <strong>changer</strong> au cours de l'exécution de l'algorithme.</p></div><div style='background: #1c2833; color: #fdfefe; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 1em; margin-top: 15px;'><span style='color: #f1c40f;'>Var</span> nomVariable : <span style='color: #3498db;'>type</span></div><div style='background: #fef9e7; padding: 15px; border-radius: 10px; border-left: 5px solid #f39c12; margin-top: 15px; color: #000000'><h4 style='color: #b9770e;'>📌 Les 5 types de variables :</h4><ul style='padding-left: 20px;'><li><strong>Entier</strong> : nombres entiers (ex : 5, -3, 0).</li><li><strong>Réel</strong> : nombres à virgule (ex : 3.14, -0.5).</li><li><strong>Caractère</strong> : un seul caractère (ex : 'A', '7').</li><li><strong>Chaîne de caractères</strong> : suite de caractères (ex : \"Bonjour\").</li><li><strong>Booléen</strong> : vrai ou faux (VRAI / FAUX).</li></ul></div><div style='background: #eaf2f8; padding: 15px; border-radius: 10px; border-left: 5px solid #2980b9; margin-top: 15px; color: #000000'><h4 style='color: #1a5276;'>✅ Exemples :</h4><div style='background: #2c3e50; color: #ecf0f1; padding: 10px; border-radius: 5px; font-family: monospace;'>Var age : Entier<br>Var prix : Réel<br>Var lettre : Caractère<br>Var nom : Chaîne de caractères<br>Var estMajeur : Booléen</div></div>",
    "texteParle": "Une variable est un emplacement mémoire nommé qui contient une valeur pouvant changer au cours de l'exécution. Sa syntaxe de déclaration est : le mot clé Var, suivi du nom de la variable, deux points, puis le type. Il existe cinq types principaux de variables : le type Entier, pour les nombres entiers ; le type Réel, pour les nombres à virgule ; le type Caractère, pour un seul caractère ; le type Chaîne de caractères, pour une suite de caractères ; et le type Booléen, pour vrai ou faux. Par exemple : Var age : Entier, ou Var prix : Réel.",
    "note": "Syntaxe : Var nomVariable : type"
  },
  {
    "titre": "Les Constantes",
    "contenu": "<div style='background: #fdebd0; padding: 15px; border-radius: 10px; border-left: 5px solid #e67e22; color: #000000'><h3 style='color: #a04000;'>🔒 Définition d'une constante</h3><p>Une <strong>constante</strong> est un emplacement mémoire nommé qui contient une valeur <strong>fixe</strong> qui ne change pas durant l'exécution de l'algorithme.</p></div><div style='background: #1c2833; color: #fdfefe; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 1em; margin-top: 15px;'><span style='color: #f1c40f;'>Const</span> nomConstante <span style='color: #e74c3c;'>=</span> valeur</div><div style='background: #fef9e7; padding: 15px; border-radius: 10px; border-left: 5px solid #f39c12; margin-top: 15px; color: #000000'><h4 style='color: #b9770e;'>📌 Différence avec une variable :</h4><ul style='padding-left: 20px;'><li>Une <strong>variable</strong> peut changer de valeur.</li><li>Une <strong>constante</strong> garde toujours la même valeur.</li><li>On utilise <code>=</code> pour affecter une constante, et <code>←</code> pour une variable.</li></ul></div><div style='background: #eaf2f8; padding: 15px; border-radius: 10px; border-left: 5px solid #2980b9; margin-top: 15px; color: #000000'><h4 style='color: #1a5276;'>✅ Exemples :</h4><div style='background: #2c3e50; color: #ecf0f1; padding: 10px; border-radius: 5px; font-family: monospace;'>Const PI = 3.14159<br>Const TVA = 0.18<br>Const MAX = 100</div></div>",
    "texteParle": "Une constante est un emplacement mémoire nommé qui contient une valeur fixe, qui ne change pas durant l'exécution de l'algorithme. Sa syntaxe de déclaration est : le mot clé Const, suivi du nom de la constante, le signe égal, puis la valeur. La différence avec une variable est simple : une variable peut changer de valeur, tandis qu'une constante garde toujours la même valeur. Par exemple : Const PI = 3.14159, ou Const TVA = 0.18. On utilise le signe égal pour affecter une constante, et la flèche pour une variable.",
    "note": "Syntaxe : Const nomConstante = valeur"
  },
  {
    "titre": "Les Structures de Données",
    "contenu": "<div style='background: #e8f8f5; padding: 15px; border-radius: 10px; border-left: 5px solid #1abc9c; color: #000000'><h3 style='color: #0e6655;'>🗂️ Définition</h3><p>Une <strong>structure de données</strong> est un ensemble organisé de données, souvent de même type, regroupées sous un même nom pour être manipulées efficacement.</p></div><div style='background: #f4f6f7; padding: 15px; border-radius: 10px; margin-top: 15px; color: #000000'><h4>📌 Quelques exemples :</h4><div style='display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px;'><div style='background: #d6eaf8; padding: 10px; border-radius: 8px; text-align: center;'><strong>📚 Tableaux</strong><br><small>Suite d'éléments de même type</small></div><div style='background: #fdebd0; padding: 10px; border-radius: 8px; text-align: center;'><strong>🥞 Piles</strong><br><small>Dernier entré, premier sorti</small></div><div style='background: #d5f5e3; padding: 10px; border-radius: 8px; text-align: center;'><strong>🚶 Files</strong><br><small>Premier entré, premier sorti</small></div><div style='background: #fadbd8; padding: 10px; border-radius: 8px; text-align: center;'><strong>🗃️ Enregistrements</strong><br><small>Données de types différents</small></div><div style='background: #e8daef; padding: 10px; border-radius: 8px; text-align: center;'><strong>🔗 Listes</strong><br><small>Éléments chaînés</small></div></div></div>",
    "texteParle": "Une structure de données est un ensemble organisé de données, souvent de même type, regroupées sous un même nom pour être manipulées efficacement. Il en existe plusieurs. Les tableaux, qui sont des suites d'éléments de même type. Les piles, où le dernier élément entré est le premier à sortir. Les files, où le premier entré est le premier à sortir. Les enregistrements, qui peuvent contenir des données de types différents. Et les listes, dont les éléments sont chaînés les uns aux autres. Nous en verrons d'autres plus tard.",
    "note": "Les structures de données permettent d'organiser plusieurs valeurs."
  },
  {
    "titre": "Les Fonctions",
    "contenu": "<div style='background: #eaf2f8; padding: 15px; border-radius: 10px; border-left: 5px solid #2980b9; color: #000000'><h3 style='color: #1a5276;'>🔧 Définition d'une fonction</h3><p>Une <strong>fonction</strong> est un sous-programme qui effectue un traitement et <strong>retourne une valeur</strong> au programme appelant.</p></div><div style='background: #1c2833; color: #fdfefe; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 0.95em; margin-top: 15px;'><span style='color: #f1c40f;'>Fonction</span> NomFonction(arg1:type, ..., argN:type) : <span style='color: #3498db;'>typeRetour</span><br>&nbsp;&nbsp;// Déclaration des variables locales<br><span style='color: #f1c40f;'>Début</span><br>&nbsp;&nbsp;// Instructions<br>&nbsp;&nbsp;<span style='color: #e74c3c;'>Retourner</span> résultat<br><span style='color: #f1c40f;'>Fin</span></div><div style='background: #e8f8f5; padding: 15px; border-radius: 10px; border-left: 5px solid #1abc9c; margin-top: 15px; color: #000000'><h4 style='color: #0e6655;'>✅ Exemple :</h4><div style='background: #2c3e50; color: #ecf0f1; padding: 10px; border-radius: 5px; font-family: monospace; font-size: 0.9em;'>Fonction Carre(x : Entier) : Entier<br>Début<br>&nbsp;&nbsp;Retourner x * x<br>Fin</div></div>",
    "texteParle": "Une fonction est un sous-programme qui effectue un traitement et retourne une valeur au programme appelant. Sa syntaxe de déclaration est : le mot clé Fonction, suivi du nom de la fonction, puis entre parenthèses les arguments avec leurs types, ensuite deux points et le type de retour. Vient ensuite la déclaration des variables locales, puis le bloc Début Fin contenant les instructions, et enfin l'instruction Retourner suivie du résultat. Par exemple, une fonction Carre qui prend un entier x et retourne x multiplié par x.",
    "note": "Une fonction retourne toujours une valeur."
  },
  {
    "titre": "Les Procédures",
    "contenu": "<div style='background: #fdebd0; padding: 15px; border-radius: 10px; border-left: 5px solid #e67e22; color: #000000'><h3 style='color: #a04000;'>🔨 Définition d'une procédure</h3><p>Une <strong>procédure</strong> est un sous-programme qui effectue un traitement mais <strong>ne retourne aucune valeur</strong>.</p></div><div style='background: #1c2833; color: #fdfefe; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 0.95em; margin-top: 15px;'><span style='color: #f1c40f;'>Procédure</span> NomProcedure(arg1:type, ..., argN:type)<br>&nbsp;&nbsp;// Déclaration des variables locales<br><span style='color: #f1c40f;'>Début</span><br>&nbsp;&nbsp;// Instructions<br><span style='color: #f1c40f;'>Fin</span></div><div style='background: #fef9e7; padding: 15px; border-radius: 10px; border-left: 5px solid #f39c12; margin-top: 15px; color: #000000'><h4 style='color: #b9770e;'>📌 Différence avec une fonction :</h4><ul style='padding-left: 20px;'><li><strong>Fonction</strong> : mot clé <code>Fonction</code> + type de retour + <code>Retourner</code>.</li><li><strong>Procédure</strong> : mot clé <code>Procédure</code>, pas de type de retour, pas de <code>Retourner</code>.</li></ul></div><div style='background: #eaf2f8; padding: 15px; border-radius: 10px; border-left: 5px solid #2980b9; margin-top: 15px; color: #000000'><h4 style='color: #1a5276;'>✅ Exemple :</h4><div style='background: #2c3e50; color: #ecf0f1; padding: 10px; border-radius: 5px; font-family: monospace; font-size: 0.9em;'>Procédure AfficherMessage(msg : Chaîne)<br>Début<br>&nbsp;&nbsp;Ecrire(msg)<br>Fin</div></div>",
    "texteParle": "Une procédure est un sous-programme qui effectue un traitement mais ne retourne aucune valeur. Sa syntaxe est presque identique à celle d'une fonction, sauf qu'on utilise le mot clé Procédure, qu'il n'y a pas de type de retour après les deux points, et qu'il n'y a pas d'instruction Retourner. Par exemple, une procédure AfficherMessage qui prend un message en paramètre et l'affiche à l'écran. La différence essentielle : une fonction retourne une valeur, une procédure non.",
    "note": "Une procédure ne retourne aucune valeur."
  },
  {
    "titre": "Le Corps de l'Algorithme",
    "contenu": "<div style='background: #d5f5e3; padding: 15px; border-radius: 10px; border-left: 5px solid #27ae60; color: #000000'><h3 style='color: #1e8449;'>⚡ Définition du corps</h3><p>Le <strong>corps de l'algorithme</strong> est la partie qui contient les <strong>instructions</strong> à exécuter. Il est encadré par les mots clés <code>Début</code> et <code>Fin</code>.</p></div><div style='background: #eaf2f8; padding: 15px; border-radius: 10px; border-left: 5px solid #2980b9; margin-top: 15px; color: #000000'><h4 style='color: #1a5276;'>📌 Qu'est-ce qu'une instruction ?</h4><p>Une <strong>instruction</strong> est un ordre donné à l'ordinateur pour effectuer une opération précise. Les instructions s'exécutent les unes après les autres, dans l'ordre où elles sont écrites.</p></div><div style='background: #1c2833; color: #fdfefe; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 0.95em; margin-top: 15px;'><span style='color: #f1c40f;'>Début</span><br>&nbsp;&nbsp;// Instructions de saisie<br>&nbsp;&nbsp;// Instructions de traitement<br>&nbsp;&nbsp;// Instructions de sortie<br><span style='color: #f1c40f;'>Fin</span></div>",
    "texteParle": "Le corps de l'algorithme est la partie qui contient les instructions à exécuter. Il est encadré par les mots clés Début et Fin. Une instruction est un ordre donné à l'ordinateur pour effectuer une opération précise. Les instructions s'exécutent les unes après les autres, dans l'ordre où elles sont écrites. Dans le corps, on trouve généralement des instructions de saisie, de traitement et de sortie. C'est le cœur de l'algorithme, là où tout se passe.",
    "note": "Le corps est encadré par Début et Fin."
  },
  {
    "titre": "Instruction d'Affichage",
    "contenu": "<div style='background: #d6eaf8; padding: 15px; border-radius: 10px; border-left: 5px solid #2980b9; color: #000000'><h3 style='color: #1a5276;'>🖥️ L'instruction d'affichage</h3><p><strong>But :</strong> Afficher un message ou une valeur à l'écran.</p><p><strong>Verbes :</strong> <code>Afficher</code> ou <code>Ecrire</code>.</p></div><div style='background: #f4f6f7; padding: 15px; border-radius: 10px; margin-top: 15px; color: #000000'><h4>📌 Syntaxes possibles :</h4><div style='background: #2c3e50; color: #ecf0f1; padding: 10px; border-radius: 5px; font-family: monospace; font-size: 0.9em; margin-top: 8px;'>Afficher(\"texte à afficher\")<br>Afficher(variable)<br>Afficher(\"texte à afficher\", variable)</div></div><div style='background: #e8f8f5; padding: 15px; border-radius: 10px; border-left: 5px solid #1abc9c; margin-top: 15px; color: #000000'><h4 style='color: #0e6655;'>✅ Exemples :</h4><div style='background: #2c3e50; color: #ecf0f1; padding: 10px; border-radius: 5px; font-family: monospace; font-size: 0.9em;'>Ecrire(\"Bonjour !\")<br>Ecrire(somme)<br>Ecrire(\"La somme est : \", somme)</div></div>",
    "texteParle": "L'instruction d'affichage a pour but d'afficher un message ou une valeur à l'écran. Elle s'utilise avec les verbes Afficher ou Ecrire. Il existe trois syntaxes possibles : Afficher avec un texte entre guillemets ; Afficher avec une variable ; ou Afficher avec un texte et une variable séparés par une virgule. Par exemple : Ecrire Bonjour !, ou Ecrire somme, ou encore Ecrire La somme est :, somme. C'est l'instruction de sortie par excellence.",
    "note": "Verbes : Afficher ou Ecrire."
  },
  {
    "titre": "Instruction de Lecture",
    "contenu": "<div style='background: #fdebd0; padding: 15px; border-radius: 10px; border-left: 5px solid #e67e22; color: #000000'><h3 style='color: #a04000;'>⌨️ L'instruction de lecture</h3><p><strong>But :</strong> Lire une valeur saisie au clavier par l'utilisateur et la stocker dans une variable.</p><p><strong>Verbes :</strong> <code>Lire</code> ou <code>Saisir</code>.</p></div><div style='background: #f4f6f7; padding: 15px; border-radius: 10px; margin-top: 15px; color: #000000'><h4>📌 Syntaxes possibles :</h4><div style='background: #2c3e50; color: #ecf0f1; padding: 10px; border-radius: 5px; font-family: monospace; font-size: 0.9em; margin-top: 8px;'>Lire(variable)<br>Saisir(variable1, variable2)</div></div><div style='background: #e8f8f5; padding: 15px; border-radius: 10px; border-left: 5px solid #1abc9c; margin-top: 15px; color: #000000'><h4 style='color: #0e6655;'>✅ Exemples :</h4><div style='background: #2c3e50; color: #ecf0f1; padding: 10px; border-radius: 5px; font-family: monospace; font-size: 0.9em;'>Lire(age)<br>Saisir(nom, prenom)</div></div><div style='background: #eaf2f8; padding: 12px; border-radius: 8px; margin-top: 15px; color: #000000'><p style='margin: 0;'>💡 <em>On combine souvent une instruction d'affichage et une instruction de lecture.</em></p></div>",
    "texteParle": "L'instruction de lecture a pour but de lire une valeur saisie au clavier par l'utilisateur et de la stocker dans une variable. Elle s'utilise avec les verbes Lire ou Saisir. On peut lire une seule variable : Lire de variable, ou plusieurs variables en une fois : Saisir de variable1, variable2. Par exemple : Lire age, ou Saisir nom, prenom. En pratique, on combine souvent une instruction d'affichage pour demander la valeur, suivie d'une instruction de lecture pour la récupérer.",
    "note": "Verbes : Lire ou Saisir."
  },
  {
    "titre": "Instruction d'Affectation",
    "contenu": "<div style='background: #e8f8f5; padding: 15px; border-radius: 10px; border-left: 5px solid #1abc9c; color: #000000'><h3 style='color: #0e6655;'>⚡ L'instruction d'affectation</h3><p><strong>But :</strong> Affecter une valeur à une variable.</p><p><strong>Opérateur :</strong> <code>←</code> (se lit « prend la valeur de »).</p></div><div style='background: #1c2833; color: #fdfefe; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 1em; margin-top: 15px;'>variable <span style='color: #e74c3c;'>←</span> expression</div><div style='background: #fef9e7; padding: 15px; border-radius: 10px; border-left: 5px solid #f39c12; margin-top: 15px; color: #000000'><h4 style='color: #b9770e;'>📌 Exemples de base :</h4><div style='background: #2c3e50; color: #ecf0f1; padding: 10px; border-radius: 5px; font-family: monospace; font-size: 0.9em;'>s ← 0<br>s ← s + 1<br>x ← a + b</div></div><div style='background: #d6eaf8; padding: 15px; border-radius: 10px; border-left: 5px solid #2980b9; margin-top: 15px; color: #000000'><h4 style='color: #1a5276;'>📌 Affectations particulières :</h4><ul style='padding-left: 20px;'><li><strong>Initialisation</strong> : première affectation d'une variable. <code>s ← 0</code></li><li><strong>Incrémentation</strong> : augmenter de 1. <code>s ← s + 1</code></li><li><strong>Décrémentation</strong> : diminuer de 1. <code>s ← s - 1</code></li></ul></div>",
    "texteParle": "L'instruction d'affectation a pour but d'affecter une valeur à une variable. Elle s'utilise avec l'opérateur flèche, qui se lit prend la valeur de. Par exemple : s prend la valeur 0, ou s prend la valeur s plus 1. Il existe des affectations particulières. L'initialisation, qui est la première affectation d'une variable, par exemple s prend la valeur 0. L'incrémentation, qui augmente la valeur de 1 : s prend la valeur s plus 1. Et la décrémentation, qui diminue la valeur de 1 : s prend la valeur s moins 1. Ces opérations sont très courantes en programmation.",
    "note": "← se lit « prend la valeur de », pas « est égal à »."
  },
  {
    "titre": "Exemple 1 : Aire d'une Figure",
    "contenu": "<div style='background: #f4f6f7; padding: 15px; border-radius: 10px; text-align: center; color: #000000'><h3>📐 Calcul de l'aire d'un rectangle</h3><p><strong>Problème :</strong> Calculer l'aire d'un rectangle connaissant sa longueur et sa largeur.</p></div><div style='background: #1c2833; color: #fdfefe; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 0.9em; margin-top: 15px;'>Algorithme Aire_Rectangle<br>Var longueur, largeur, aire : Réel<br>Début<br>&nbsp;&nbsp;Ecrire(\"Entrez la longueur : \")<br>&nbsp;&nbsp;Lire(longueur)<br>&nbsp;&nbsp;Ecrire(\"Entrez la largeur : \")<br>&nbsp;&nbsp;Lire(largeur)<br>&nbsp;&nbsp;aire ← longueur * largeur<br>&nbsp;&nbsp;Ecrire(\"L'aire est : \", aire)<br>Fin</div><div style='background: #eaf2f8; padding: 10px; border-radius: 8px; margin-top: 15px; color: #000000'><p style='margin: 0;'>🔎 <strong>Analyse :</strong> Saisie (longueur, largeur) → Traitement (aire = longueur × largeur) → Sortie (aire).</p></div>",
    "texteParle": "Prenons un premier exemple concret : le calcul de l'aire d'un rectangle. On déclare trois variables réelles : longueur, largeur et aire. Dans le corps, on demande à l'utilisateur d'entrer la longueur, on la lit. On demande la largeur, on la lit. Ensuite, on affecte à aire le produit de longueur par largeur. Enfin, on affiche le résultat. Vous voyez clairement les trois phases : saisie, traitement, sortie.",
    "note": "Aire = longueur × largeur."
  },
  {
    "titre": "Exemple 2 : Prix Total",
    "contenu": "<div style='background: #f4f6f7; padding: 15px; border-radius: 10px; text-align: center; color: #000000'><h3>💰 Calcul du prix total d'un article</h3><p><strong>Problème :</strong> Calculer le prix total connaissant le prix unitaire et la quantité.</p></div><div style='background: #1c2833; color: #fdfefe; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 0.9em; margin-top: 15px;'>Algorithme Prix_Total<br>Var prixUnit, quantite, total : Réel<br>Début<br>&nbsp;&nbsp;Ecrire(\"Entrez le prix unitaire : \")<br>&nbsp;&nbsp;Lire(prixUnit)<br>&nbsp;&nbsp;Ecrire(\"Entrez la quantité : \")<br>&nbsp;&nbsp;Lire(quantite)<br>&nbsp;&nbsp;total ← prixUnit * quantite<br>&nbsp;&nbsp;Ecrire(\"Le prix total est : \", total)<br>Fin</div><div style='background: #eaf2f8; padding: 10px; border-radius: 8px; margin-top: 15px; color: #000000'><p style='margin: 0;'>🔎 <strong>Analyse :</strong> Saisie (prixUnit, quantite) → Traitement (total = prixUnit × quantite) → Sortie (total).</p></div>",

    function setStatus(text, type) {
        $statusText.text(text);
        $statusBadge.removeClass('idle speaking error paused waiting loading');
        if (type === 'speaking') $statusBadge.addClass('speaking');
        else if (type === 'error') $statusBadge.addClass('error');
        else if (type === 'paused') $statusBadge.addClass('paused');
        else if (type === 'waiting') $statusBadge.addClass('waiting');
        else if (type === 'loading') $statusBadge.addClass('loading');

    function updatePlayButton() {
        if (isPlaying) {

    function showLoading() {

        $loadingTimeout.text('⏱️ 30 secondes maximum');
        $loading.fadeIn(300);
        setStatus("⏳ Chargement...", 'loading');
        // 🔥 TIMEOUT DE 30 SECONDES
        loadingTimeout = setTimeout(() => {
            if (isLoading && !loadingCancelled) {
                hideLoading();

                isPlaying = false;

    function stopSpeaking() {

                currentUtterance.onerror = null;

    // Reprendre la parole

                isPaused = false;
                isPlaying = true;

                updatePlayButton();
            } else if (!isSpeaking && !synth.speaking && !synth.pending) {

    function renderSlide(index) {
        const slide = slides[index];
        $title.text(slide.titre);

        html += `<div class="content-card">${slide.contenu}</div>`;

    // ================================================================
    // LECTURE VOCALE
    // ================================================================
    function speakSlide(index) {
        return new Promise((resolve) => {
            const slide = slides[index];
            const text = slide.texteParle;
            if (!text || text.trim() === '' || !speechSupported) {
                resolve();
                return;
            }
            if (!window.speechSynthesis) {
                setStatus("❌ Synthèse vocale non supportée", 'error');
                speechSupported = false;
                resolve();
                return;
            }
            // Arrêter toute lecture en cours
            stopSpeaking();
            // Réinitialiser l'état de pause
            isPaused = false;
            showLoading();
            setStatus("Initialisation...", 'loading');
            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.92;
                utterance.pitch = 1.05;
                utterance.volume = 1;
                let isFinished = false;
                let errorHandled = false;
                utterance.onstart = function() {
                    if (loadingCancelled) {
                        stopSpeaking();
                        resolve();
                        return;
                    }
                    hideLoading();
                    isSpeaking = true;
                    isPlaying = true;
                    isPaused = false;
                    setStatus("🔊 Lecture en cours", 'speaking');
                    updatePlayButton();
                };
                utterance.onend = function() {
                    if (isFinished) return;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    setStatus("✅ Terminé", 'idle');
                    hideLoading();
                    updatePlayButton();
                    resolve();
                };
                utterance.onerror = function(e) {
                    if (isFinished || errorHandled) return;
                    errorHandled = true;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    hideLoading();
                    updatePlayButton();
                    if (e.error === 'not-allowed') {
                        setStatus("⚠️ Permission refusée", 'error');
                    } else if (e.error === 'synthesis-unavailable') {
                        setStatus("⚠️ Synthèse indisponible", 'error');
                    } else if (e.error === 'canceled') {
                        setStatus("⏸ Annulé", 'paused');
                    } else {
                        setStatus("❌ Erreur audio: " + (e.error || 'inconnue'), 'error');
                    }
                    resolve();
                };
                // Gestion du chargement des voix
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = function() {
                        if (!loadingCancelled) {
                            try {
                                synth.speak(utterance);
                            } catch(err) {
                                // Silencieux
                            }
                        }
                        synth.onvoiceschanged = null;
                    };
                }
                currentUtterance = utterance;
                if (!loadingCancelled) {
                    try {
                        synth.speak(utterance);
                    } catch(err) {
                        setTimeout(() => {
                            if (!loadingCancelled) {
                                try {
                                    synth.speak(utterance);
                                } catch(e) {
                                    setStatus("❌ Erreur de lecture", 'error');
                                    isPlaying = false;
                                    updatePlayButton();
                                    hideLoading();
                                    resolve();
                                }
                            } else {
                                resolve();
                            }
                        }, 100);
                    }
                } else {
                    resolve();
                }
            } catch(err) {
                hideLoading();
                setStatus("❌ Erreur générale", 'error');
                isPlaying = false;
                updatePlayButton();
                console.error('Erreur speakSlide:', err);
                resolve();
            }
        });
    }
    // ================================================================
    // NAVIGATION
    // ================================================================
    async function goToSlide(index) {
        if (isTransitioning) return;
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        // Si on est en train de lire, on met en pause avant de naviguer
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        // Arrêter complètement la lecture
        stopSpeaking();
        await new Promise(r => setTimeout(r, 50));
        if (index === currentIndex) {
            setStatus("📄 Slide actuel", 'idle');
            return;
        }
        isTransitioning = true;
        currentIndex = index;
        renderSlide(index);
        // Réinitialiser l'état de lecture
        isPlaying = false;
        updatePlayButton();
        setStatus("⏸ Lecture arrêtée", 'paused');
        await new Promise(r => setTimeout(r, 150));
        isTransitioning = false;
    }
    async function goToNext() {
        if (isTransitioning) return;
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        if (currentIndex + 1 < total) {
            await goToSlide(currentIndex + 1);
        } else {
            setStatus("🏁 Dernier slide", 'idle');
        }
    }
    async function goToPrev() {
        if (isTransitioning) return;
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        if (currentIndex - 1 >= 0) {
            await goToSlide(currentIndex - 1);
        } else {
            setStatus("🔁 Premier slide", 'idle');
        }
    }

    // GESTION PLAY/PAUSE

    function togglePlay() {
        if (!userInteracted) {
            userInteracted = true;
        }
        // Si le chargement est en cours, on l'annule
        if (isLoading) {
            cancelLoading();
            return;
        }
        // Si le synthétiseur est en pause, on reprend
        if (synth && synth.paused) {
            resumeSpeaking();
            return;
        }
        // Si la lecture est en cours, on met en pause
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
            return;
        }
        // Sinon, on démarre la lecture du slide courant
        if (!isSpeaking && !isPlaying) {
            stopSpeaking();
            speakSlide(currentIndex);
        }
    }

    // ================================================================
    async function init() {
        // Vérifier la compatibilité
        if (!window.speechSynthesis) {
            setStatus("❌ Synthèse vocale non supportée", 'error');
            speechSupported = false;
        }
        // Précharger les voix
        try {
            if (synth.getVoices) {
                synth.getVoices();
                setTimeout(() => {
                    try {
                        synth.getVoices();
                    } catch(e) {}
                }, 200);
            }
        } catch(e) {
            console.warn('Erreur chargement voix:', e);
        }
        // Afficher le premier slide
        renderSlide(0);
        $counter.text(`1 / ${total}`);
        // État initial
        setStatus("⏸ Appuie sur Play", 'paused');
        updatePlayButton();
        $autoIndicator.text('⏸ Lecture manuelle');
        // ================================================================
        // ÉVÉNEMENTS
        // ================================================================
        // Bouton Play/Pause
        $play.on('click', function() {
            togglePlay();
        });
        // Bouton Annuler le chargement
        $cancelLoading.on('click', function() {
            cancelLoading();
        });
        // Navigation
        $prev.on('click', function() {
            // Si chargement en cours, on annule
            if (isLoading) cancelLoading();
            goToPrev();
        });
        $next.on('click', function() {
            if (isLoading) cancelLoading();
            goToNext();
        });
        // Replay - relire le slide courant
        $replay.on('click', function() {
            if (isLoading) cancelLoading();
            stopSpeaking();
            setTimeout(() => {
                speakSlide(currentIndex);
            }, 100);
        });
        // Support du clavier (espace pour play/pause)
        $(document).on('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });
        // Nettoyage
        $(window).on('beforeunload', function() {
            try {
                if (synth.speaking) synth.cancel();
            } catch(e) {}
            hideLoading();
        });
        // Gérer les cas où la synthèse se termine de manière inattendue
        setInterval(() => {
            if (isPlaying && !synth.speaking && !synth.pending && !isPaused && !isLoading) {
                isPlaying = false;
                updatePlayButton();
                setStatus("⏸ Lecture arrêtée", 'paused');
            }
        }, 1000);
    }

        });
        document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
            if (!el.closest('.note-box') && !el.closest('.math-block')) {
                el.style.color = '#2d3748';
            }
        });
        const themeBtn = document.getElementById('themeToggle');
        if (themeBtn) {
            themeBtn.textContent = '🌓';
            themeBtn.title = 'Passer en mode nuit';
            // Ajouter l'écouteur d'événement click
            themeBtn.addEventListener('click', toggleTheme);
        }
    });
</script>
</body>
</html>
