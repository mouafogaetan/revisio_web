<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Présentation mobile</title>
    <!-- MathJax -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' },
            options: { skipHtmlTypes: 'script' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }
    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
    }
    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 500px;
        margin: 0 auto;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }
    .slide-header {
        flex-shrink: 0;
        padding: 18px 16px 10px 16px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        z-index: 10;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }
    .slide-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }
    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
    }
    .content-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 18px 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        flex-shrink: 0;
    }
    .content-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }
    .content-card li {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        line-height: 1.5;
    }
    .content-card li:last-child {
        border-bottom: none;
    }
    .bullet-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
    }
    .math-block {
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        overflow-x: auto;
        flex-shrink: 0;
        margin: 4px 0;
    }
    .math-block .math {
        font-size: 1.2rem;
        color: #e2e8f0;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.08);
        border-left: 4px solid #60a5fa;
        padding: 12px 16px;
        border-radius: 12px;
        font-style: italic;
        font-size: 0.9rem;
        color: #cbd5e1;
        flex-shrink: 0;
    }
    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        border-radius: 0;
        flex-direction: column;
    }
    .loading-card {
        background: #1e293b;
        padding: 32px 28px;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #334155;
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px auto;
    }
    .loading-text {
        font-weight: 600;
        font-size: 1.1rem;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    .loading-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 16px;
    }
    .loading-progress {
        height: 3px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        animation: loadingProgress 30s ease-out forwards;
    }
    .loading-timeout {
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 12px;
    }
    .btn-cancel-loading {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 40px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #f87171;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }
    .btn-cancel-loading:active {
        transform: scale(0.94);
        background: rgba(239, 68, 68, 0.25);
    }
    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
    }
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }
    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }
    .slide-counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255,255,255,0.05);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(255,255,255,0.04);
    }
    .status-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 30px;
        background: rgba(96, 165, 250, 0.12);
        color: #93bbfc;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
    }
    .status-badge .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: pulse-dot 1.2s infinite;
        flex-shrink: 0;
    }
    .status-badge.idle .dot {
        animation: none;
        background: #64748b;
    }
    .status-badge.speaking .dot {
        background: #34d399;
        animation: pulse-dot 0.8s infinite;
    }
    .status-badge.error .dot {
        background: #f87171;
        animation: none;
    }
    .status-badge.paused .dot {
        animation: none;
        background: #fbbf24;
    }
    .status-badge.waiting .dot {
        animation: pulse-dot 1.5s infinite;
        background: #fbbf24;
    }
    .status-badge.loading .dot {
        animation: pulse-dot 0.5s infinite;
        background: #60a5fa;
    }
    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.7); }
    }
    .footer-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }
    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }
    .btn:active {
        transform: scale(0.94);
        background: rgba(255,255,255,0.1);
    }
    .btn-secondary {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.06);
    }
    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
        min-width: 80px;
        justify-content: center;
    }
    .btn-play:active {
        background: rgba(52, 211, 153, 0.25);
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
    }
    .auto-indicator {
        font-size: 0.65rem;
        color: #64748b;
        text-align: center;
        letter-spacing: 0.3px;
        padding: 2px 0;
    }
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.2rem;
        }
        .content-card li {
            font-size: 0.9rem;
            padding: 8px 0;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .btn-play {
            min-width: 60px;
        }
        .footer-buttons {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
        .loading-card {
            padding: 20px 16px;
        }
        .math-block .math {
            font-size: 1rem;
        }
    }
    @media (min-width: 600px) {
        .app-container {
            max-width: 480px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
        .loading-overlay {
            border-radius: 32px;
        }
    }
    /* Mode jour (par défaut) - ajouté par le script de thème */
    html, body {
        background: #f0f4f8 !important;
        color: #1a202c !important;
    }
    .app-container {
        background: linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%) !important;
    }
    .slide-header {
        background: rgba(255, 255, 255, 0.85) !important;
        border-bottom: 1px solid rgba(0,0,0,0.08) !important;
    }
    .slide-header h1 {
        background: linear-gradient(135deg, #2b6cb0, #6b46c1) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        background-clip: text !important;
    }
    .slide-footer {
        background: rgba(255, 255, 255, 0.9) !important;
        border-top: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card {
        background: rgba(255,255,255,0.8) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card li {
        border-bottom: 1px solid rgba(0,0,0,0.05) !important;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.12) !important;
        border-left: 4px solid #4299e1 !important;
        color: #2c3e50 !important;
    }
    .math-block {
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .math-block .math {
        color: #2d3748 !important;
    }
    .slide-counter {
        color: #4a5568 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .status-badge {
        background: rgba(96, 165, 250, 0.15) !important;
        color: #2b6cb0 !important;
        border: 1px solid rgba(96, 165, 250, 0.15) !important;
    }
    .btn {
        color: #2d3748 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .btn-secondary {
        background: rgba(0,0,0,0.04) !important;
        border-color: rgba(0,0,0,0.08) !important;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15) !important;
        border-color: rgba(52, 211, 153, 0.2) !important;
        color: #38a169 !important;
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15) !important;
        border-color: rgba(251, 191, 36, 0.2) !important;
        color: #d69e2e !important;
    }
    .auto-indicator {
        color: #718096 !important;
    }
    .loading-card {
        background: #ffffff !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .loading-text {
        color: #1a202c !important;
    }
    .loading-sub {
        color: #4a5568 !important;
    }
</style>
</head>
<body>
<div class="app-container">
    <header class="slide-header">
        <h1 id="slideTitle">Chargement...</h1>
    </header>
    <main class="slide-body" id="slideBody"></main>
    <!-- LOADING OVERLAY AVEC BOUTON ANNULER -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Préparation vocale...</div>
            <div class="loading-sub" id="loadingSub">Synthèse en cours</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loadingProgressBar"></div>
            </div>
            <div class="loading-timeout" id="loadingTimeout">⏱️ 30 secondes maximum</div>
            <button class="btn-cancel-loading" id="cancelLoadingBtn">
                <span>✕</span> Annuler
            </button>
        </div>
    </div>
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="slide-counter" id="slideCounter">1 / 3</span>
            <span class="status-badge idle" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">Prêt</span>
            </span>
        </div>
        <div class="footer-buttons">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-secondary" id="replayBtn">
                <span class="btn-icon">🔁</span> <span class="btn-label">Relire</span>
            </button>
            <button class="btn btn-play" id="playBtn">
                <span class="btn-icon">▶</span> <span class="btn-label">Play</span>
            </button>
        </div>
    </footer>
</div>
<script>
$(function() {
    // ================================================================
    // SLIDES
    // ================================================================
  const slides = [
  {
    "titre": "Introduction aux Boucles",
    "contenu": "<div style='font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, Helvetica, Arial, sans-serif; line-height: 1.6; color: #2c3e50; padding: 16px;'><h2 style='color: #2980b9; font-size: 20px; margin-bottom: 12px;'>🔄 Les Structures Itératives (Boucles)</h2><p style='font-size: 16px; margin-bottom: 12px;'>Une <strong>structure itérative</strong> (ou boucle) permet d'exécuter un bloc d'instructions plusieurs fois de suite.</p><div style='background-color: #eaf2f8; padding: 12px; border-radius: 8px; margin-bottom: 12px;'><p style='font-size: 16px; font-weight: bold; color: #1a5276;'>📌 Pourquoi utiliser des boucles ?</p><ul style='font-size: 15px; padding-left: 20px; color: #333;'><li>Éviter la répétition de code</li><li>Traiter des listes ou des séries de données</li><li>Répéter une action jusqu'à ce qu'une condition soit remplie</li></ul></div><div style='background-color: #fef9e7; padding: 12px; border-radius: 8px;'><p style='font-size: 15px; color: #7d6608;'><strong>💡 Astuce :</strong> Il existe trois types de boucles principales : <strong>POUR</strong>, <strong>TANT QUE</strong> et <strong>RÉPÉTER JUSQU'À</strong>.</p></div></div>",
    "texteParle": "Bonjour à tous. Aujourd'hui, nous allons aborder un concept fondamental en algorithmique : les boucles. Une boucle permet de répéter un ensemble d'instructions plusieurs fois. C'est très utile quand on veut éviter de répéter le même code plusieurs fois, quand on doit traiter des listes de données, ou quand on veut répéter une action jusqu'à ce qu'une condition particulière soit remplie. Il existe trois types de boucles principales que nous allons découvrir. Pour chacune d'elles, nous allons faire une trace complète dans un tableau pour bien comprendre son fonctionnement.",
    "note": "Les boucles permettent d'automatiser les répétitions dans un algorithme."
  },
  {
    "titre": "La Boucle POUR : Syntaxe",
    "contenu": "<div style='font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, Helvetica, Arial, sans-serif; line-height: 1.6; color: #2c3e50; padding: 16px;'><h2 style='color: #2980b9; font-size: 20px; margin-bottom: 12px;'>La Boucle <span style='background-color: #d4e6f1; padding: 2px 8px; border-radius: 4px;'>POUR</span></h2><p style='font-size: 16px; margin-bottom: 12px;'>La boucle <strong>POUR</strong> est utilisée quand on connaît à l'avance le nombre d'itérations.</p><div style='background-color: #f4f6f7; padding: 12px; border-radius: 8px; font-family: monospace; font-size: 14px;'><p style='margin: 4px 0; color: #1a5276;'>Pour (compteur ← valeur_initiale à valeur_finale) Faire</p><p style='margin: 4px 0 4px 20px; color: #1a5276;'>Instructions</p><p style='margin: 4px 0; color: #1a5276;'>FinPour</p></div><div style='background-color: #d5f5e3; padding: 12px; border-radius: 8px; margin-top: 12px;'><p style='font-size: 15px; color: #1e8449;'><strong>✅ À retenir :</strong> On utilise POUR quand le nombre de répétitions est connu à l'avance. Le compteur est automatiquement incrémenté à chaque tour.</p></div></div>",
    "texteParle": "Commençons par la boucle POUR. On l'utilise quand on sait exactement combien de fois on veut répéter une action. La syntaxe est simple : on définit un compteur qui va de la valeur initiale à la valeur finale, et à chaque tour, on exécute les instructions à l'intérieur de la boucle. Le compteur est automatiquement incrémenté à chaque itération. Voyons maintenant un exemple complet avec une trace détaillée.",
    "note": "La boucle POUR est idéale pour les itérations dont le nombre est connu."
  },
  {
    "titre": "Exemple POUR : Trace complète",
    "contenu": "<div style='font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, Helvetica, Arial, sans-serif; line-height: 1.6; color: #2c3e50; padding: 16px;'><h2 style='color: #2980b9; font-size: 18px; margin-bottom: 12px;'>Exemple : Trace d'une boucle POUR</h2><div style='background-color: #f4f6f7; padding: 12px; border-radius: 8px; font-family: monospace; font-size: 13px;'><p style='margin: 3px 0; color: #1a5276;'>Algorithme TracePour</p><p style='margin: 3px 0; color: #1a5276;'>Variables i, s : Entier</p><p style='margin: 3px 0; color: #1a5276;'>Début</p><p style='margin: 3px 0 3px 15px; color: #1a5276;'>s ← 0</p><p style='margin: 3px 0 3px 15px; color: #1a5276;'>Pour (i ← 1 à 4) Faire</p><p style='margin: 3px 0 3px 30px; color: #1a5276;'>s ← s + i</p><p style='margin: 3px 0 3px 15px; color: #1a5276;'>FinPour</p><p style='margin: 3px 0 3px 15px; color: #1a5276;'>Ecrire(s)</p><p style='margin: 3px 0; color: #1a5276;'>Fin</p></div><p style='font-size: 15px; font-weight: bold; margin-top: 12px; color: #1a5276;'>📊 Trace de la boucle :</p><table style='width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 6px;'><tr style='background-color: #2980b9; color: white;'><th style='padding: 6px; border: 1px solid #ddd;'>Tour</th><th style='padding: 6px; border: 1px solid #ddd;'>i</th><th style='padding: 6px; border: 1px solid #ddd;'>s avant</th><th style='padding: 6px; border: 1px solid #ddd;'>s ← s + i</th><th style='padding: 6px; border: 1px solid #ddd;'>s après</th></tr><tr><td style='padding: 6px; border: 1px solid #ddd; text-align: center;'>1</td><td style='padding: 6px; border: 1px solid #ddd; text-align: center;'>1</td><td style='padding: 6px; border: 1px solid #ddd; text-align: center;'>0</td><td style='padding: 6px; border: 1px solid #ddd; text-align: center;'>0 + 1</td><td style='padding: 6px; border: 1px solid #ddd; text-align: center;'>1</td></tr><tr style='background-color: #f9f9f9;'><td style='padding: 6px; border: 1px solid #d     "texteParle": "Prenons un exemple concret pour bien comprendre la boucle POUR. Voici un algorithme qui initialise une variable s à zéro, puis qui parcourt les valeurs de 1 à 4 avec une boucle POUR. À chaque tour, on ajoute la valeur du compteur i à la variable s. Faisons la trace. Au premier tour, i vaut 1, s vaut 0, donc s devient 0 plus 1, soit 1. Au deuxième tour, i vaut 2, s vaut 1, donc s devient 1 plus 2, soit 3. Au troisième tour, i vaut 3, s vaut 3, donc s devient 3 plus 3, soit 6. Au quatrième tour, i vaut 4, s vaut 6, donc s devient 6 plus 4, soit 10. La boucle s'arrête car i a dépassé 4. Conclusion : cet algorithme calcule la somme des entiers de 1 à 4, et le résultat est 10.",
    "note": "La trace permet de suivre l'évolution des variables à chaque itération."

    "texteParle": "La deuxième boucle est la boucle TANT QUE. Contrairement à la boucle POUR, on ne connaît pas forcément le nombre d'itérations à l'avance. On va répéter les instructions tant qu'une condition est vraie. La condition est testée avant chaque exécution du bloc. Si elle est fausse dès le départ, le bloc n'est jamais exécuté. Il est très important de s'assurer que la condition devienne fausse à un moment, sinon la boucle ne s'arrêtera jamais. Voyons maintenant un exemple avec une trace complète.",
    "note": "TANT QUE vérifie la condition AVANT d'exécuter le bloc."

    "contenu": "<div style='font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, Helvetica, Arial, sans-serif; line-height: 1.6; color: #2c3e50; padding: 16px;'><h2 style='color: #2980b9; font-size: 18px; margin-bottom: 12px;'>Transformer RÉPÉTER JUSQU'À en TANT QUE</h2><p style='font-size: 15px; margin-bottom: 10px;'>Pour transformer une boucle RÉPÉTER JUSQU'À en TANT QUE, il faut :</p><ol style='font-size: 14px; padding-left: 20px;'><li>Exécuter le bloc une première fois <strong>avant</strong> la boucle.</li><li>Utiliser la condition <strong>négative</strong> dans le TANT QUE.</li><li>Répéter le bloc dans la boucle.</li></ol><div style='background-color: #f4f6f7; padding: 12px; border-radius: 8px; font-family: monospace; font-size: 12px; margin-top: 10px;'><p style='margin: 3px 0; color: #1a5276;'>// Version RÉPÉTER JUSQU'À</p><p style='margin: 3px 0; color: #1a5276;'>Répéter</p><p style='margin: 3px 0 3px 15px; color: #1a5276;'>i ← i + 1</p><p style='margin: 3px 0 3px 15px; color: #1a5276;'>Ecrire(i)</p><p style='margin: 3px 0; color: #1a5276;'>Jusqu'À (i = 3)</p><br><p style='margin: 3px 0; color: #1a5276;'>// Version TANT QUE équivalente</p><p style='margin: 3px 0; color: #1a5276;'>i ← i + 1</p><p style='margin: 3px 0; color: #1a5276;'>Ecrire(i)</p><p style='margin: 3px 0; color: #1a5276;'>TantQue (i != 3) Faire</p><p style='margin: 3px 0 3px 15px; color: #1a5276;'>i ← i + 1</p><p style='margin: 3px 0 3px 15px; color: #1a5276;'>Ecrire(i)</p><p style='margin: 3px 0; color: #1a5276;'>FinTantQue</p></div><div style='background-color: #fef9e7; padding: 12px; border-radius: 8px; margin-top: 10px;'><p style='font-size: 14px; color: #7d6608;'><strong>⚠️ Attention :</strong> La condition du TANT QUE est la <strong>négation</strong> de celle du JUSQU'À. Si JUSQU'À (i = 3), alors TANT QUE (i != 3).</p></div></div>",

    "note": "RÉPÉTER JUSQU'À → TANT QUE : condition négative + exécution initiale."

ext-align: center;'>Manuelle</td><td style='padding: 6px; border: 1px solid #ddd; text-align: center;'>Manuelle</td></tr><tr><td style='padding: 6px; border: 1px solid #ddd;'><strong>Risque de boucle infinie</strong></td><td style='padding: 6px; border: 1px solid #ddd; text-align: center;'>Non</td><td style='padding: 6px; border: 1px solid #ddd; text-align: center;'>Oui</td><td style='padding: 6px; border: 1px solid #ddd; text-align: center;'>Oui</td></tr></table><div style='background-color: #eaf2f8; padding: 12px; border-radius: 8px; margin-top: 12px;'><p style='font-size: 14px; color: #1a5276;'><strong>💡 Conseil :</strong> Utilisez POUR quand c'est possible. Sinon, utilisez TANT QUE ou RÉPÉTER JUSQU'À selon que le bloc doit être exécuté au moins une fois ou non.</p></div></div>",
    "texteParle": "Voici un tableau comparatif des trois boucles. La boucle POUR est utilisée quand le nombre d'itérations est connu, le test se fait à chaque tour, le bloc peut ne pas être exécuté du tout, et l'incrémentation est automatique. La boucle TANT QUE est utilisée quand le nombre d'itérations est inconnu, le test se fait avant le bloc, donc le bloc peut ne pas être exécuté, et l'incrémentation est manuelle. La boucle RÉPÉTER JUSQU'À est aussi utilisée quand le nombre d'itérations est inconnu, mais le test se fait après le bloc, donc le bloc est exécuté au moins une fois. Le conseil est simple : utilisez POUR quand c'est possible, sinon TANT QUE ou RÉPÉTER JUSQU'À selon vos besoins.",

 5px; border: 1px solid #ddd;'>somme après</th><th style='padding: 5px; border: 1px solid #ddd;'>Saisie suivante</th></tr><tr><td style='padding: 5px; border: 1px solid #ddd; text-align: center;'>5 != 0 ? VRAI</td><td style='padding: 5px; border: 1px solid #ddd; text-align: center;'>5</td><td style='padding: 5px; border: 1px solid #ddd; text-align: center;'>0</td><td style='padding: 5px; border: 1px solid #ddd; text-align: center;'>5</td><td style='padding: 5px; border: 1px solid #ddd; text-align: center;'>3</td></tr><tr style='background-color: #f9f9f9;'><td style='padding: 5px; border: 1px solid #ddd; text-align: center;'>3 != 0 ? VRAI</td><td style='padding: 5px; border: 1px solid #ddd; text-align: center;'>3</td><td style='padding: 5px; border: 1px solid #ddd; text-align: center;'>5</td><td style='padding: 5px; border: 1px solid #ddd; text-align: center;'>8</td><td style='padding: 5px; border: 1px solid #ddd; text-align: center;'>2</td></tr><tr><td style='padding: 5px; border: 1px solid #ddd; text-align: center;'>2 != 0 ? VRAI</td><td style='padding: 5px; border: 1px solid #ddd; text-align: center;'>2</td><td style='padding: 5px; border: 1px solid #ddd; text-align: center;'>8</td><td style='padding: 5px; border: 1px solid #ddd; text-align: center;'>10</td><td style='padding: 5px; border: 1px solid #ddd; text-align: center;'>0</td></tr><tr style='background-color: #f9f9f9;'><td style='padding: 5px; border: 1px solid #ddd; text-align: center;'>0 != 0 ? FAUX</td><td style='padding: 5px; border: 1px solid #ddd; text-align: center;'>0</td><td style='padding: 5px; border: 1px solid #ddd; text-align: center;'>10</td><td style='padding: 5px; border: 1px solid #ddd; text-align: center;'>—</td><td style='padding: 5px; border: 1px solid #ddd; text-align: center;'>—</td></tr></table><div style='background-color: #d5f5e3; padding: 12px; border-radius: 8px; margin-top: 12px;'><p style='font-size: 15px; color: #1e8449;'><strong>✅ Conclusion :</strong> L'algorithme calcule la <strong>somme des nombres saisis</strong> jusqu'à ce que l'utilisateur entre 0. Ici, 5 + 3 + 2 = <strong>10</strong>.</p></div></div>",
    "texteParle": "Voici un exemple avec TANT QUE. On demande des nombres à l'utilisateur et on calcule leur somme. On s'arrête quand il entre zéro. Imaginons que l'utilisateur entre 5, puis 3, puis 2, puis 0. Faisons la trace. Au premier test, nombre vaut 5, 5 différent de 0, c'est vrai. On ajoute 5 à somme qui devient 5. On redemande un nombre, l'utilisateur entre 3. Deuxième test : 3 différent de 0, vrai. Somme devient 5 plus 3, soit 8. L'utilisateur entre 2. Troisième test : 2 différent de 0, vrai. Somme devient 8 plus 2, soit 10. L'utilisateur entre 0. Quatrième test : 0 différent de 0, faux. La boucle s'arrête. Conclusion : la somme est 10.",
    "note": "TANT QUE est idéal quand on ne connaît pas le nombre d'itérations à l'avance."

d><td style='padding: 5px; border: 1px solid #ddd; text-align: center;'>2 x 1 = 2</td></tr><tr style='background-color: #f9f9f9;'><td style='padding: 5px; border: 1px solid #ddd; text-align: center;'>2</td><td style='padding: 5px; border: 1px solid #ddd; text-align: center;'>2</td><td style='padding: 5px; border: 1px solid #ddd; text-align: center;'>2 x 2 = 4</td></tr></table><div style='background-color: #d5f5e3; padding: 12px; border-radius: 8px; margin-top: 12px;'><p style='font-size: 15px; color: #1e8449;'><strong>✅ Conclusion :</strong> L'algorithme affiche toutes les combinaisons de multiplication de 1 à 2. Il y a 2 × 2 = 4 itérations au total.</p></div><div style='background-color: #fef9e7; padding: 12px; border-radius: 8px; margin-top: 10px;'><p style='font-size: 14px; color: #7d6608;'><strong>⚠️ Attention :</strong> L'imbrication de boucles augmente la complexité. Une boucle de n itérations dans une autre de m itérations fait n × m itérations.</p></div></div>",
    "texteParle": "Il est possible de placer une boucle à l'intérieur d'une autre. On parle alors de boucles imbriquées. Regardez cet exemple : une boucle POUR i de 1 à 2, et à l'intérieur, une boucle POUR j de 1 à 2. Faisons la trace. Quand i vaut 1, j prend successivement les valeurs 1 et 2, on affiche 1 x 1 = 1 et 1 x 2 = 2. Puis i passe à 2, et j reprend les valeurs 1 et 2, on affiche 2 x 1 = 2 et 2 x 2 = 4. Conclusion : l'algorithme affiche toutes les combinaisons de multiplication de 1 à 2. Il y a 2 fois 2, soit 4 itérations au total. Attention, l'imbrication augmente la complexité.",

    function setStatus(text, type) {
        $statusText.text(text);
        $statusBadge.removeClass('idle speaking error paused waiting loading');
        if (type === 'speaking') $statusBadge.addClass('speaking');
        else if (type === 'error') $statusBadge.addClass('error');
        else if (type === 'paused') $statusBadge.addClass('paused');
        else if (type === 'waiting') $statusBadge.addClass('waiting');
        else if (type === 'loading') $statusBadge.addClass('loading');
        else $statusBadge.addClass('idle');
    }
    function updatePlayButton() {
        if (isPlaying) {
            $play.addClass('playing');
            $play.find('.btn-icon').text('⏸');
            $play.find('.btn-label').text('Pause');
        } else {
            $play.removeClass('playing');
            $play.find('.btn-icon').text('▶');
            $play.find('.btn-label').text('Play');
        }
    }
    function showLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        loadingCancelled = false;
        isLoading = true;
        // Réinitialiser la barre de progression
        $loadingProgressBar.css('animation', 'none');
        $loadingProgressBar.css('width', '0%');
        // Forcer un reflow
        $loadingProgressBar[0].offsetHeight;
        $loadingProgressBar.css('animation', 'loadingProgress 30s ease-out forwards');
        $loadingText.text('Préparation vocale...');
        $loadingSub.text('Synthèse en cours');
        $loadingTimeout.text('⏱️ 30 secondes maximum');
        $loading.fadeIn(300);
        setStatus("⏳ Chargement...", 'loading');
        // 🔥 TIMEOUT DE 30 SECONDES
        loadingTimeout = setTimeout(() => {
            if (isLoading && !loadingCancelled) {
                hideLoading();
                setStatus("⚠️ Délai dépassé (30s)", 'error');
                isPlaying = false;
                updatePlayButton();
                $loadingSub.text('La synthèse vocale a pris trop de temps');
                $loadingTimeout.text('❌ Délai dépassé');
            }
        }, 30000);
    }
    function hideLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        isLoading = false;
        loadingCancelled = false;
        $loading.fadeOut(300);
        // Ne pas changer le statut si on est en train de parler
        if (!isSpeaking && !isPlaying) {
            setStatus("⏸ Lecture arrêtée", 'paused');
        }
    }
    function cancelLoading() {
        loadingCancelled = true;
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        hideLoading();
        stopSpeaking();
        setStatus("⏸ Annulé", 'paused');
        isPlaying = false;
        updatePlayButton();
        $loadingText.text('Annulé par l\'utilisateur');
        $loadingSub.text('Vous pouvez réessayer');
        $loadingTimeout.text('✕ Annulation');
    }
    // Arrêter la parole proprement
    function stopSpeaking() {
        try {
            if (synth && (synth.speaking || synth.pending)) {
                synth.cancel();
            }
        } catch(e) {
            console.warn('Erreur stopSpeaking:', e);
        }
        if (currentUtterance) {
            try {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance.onstart = null;
            } catch(e) {}
            currentUtterance = null;
        }
        isSpeaking = false;
        isPlaying = false;
        updatePlayButton();
    }
    // Mettre en pause la parole
    function pauseSpeaking() {
        try {
            if (synth && synth.speaking) {
                synth.pause();
                isPaused = true;
                isPlaying = false;
                setStatus("⏸ Lecture en pause", 'paused');
                updatePlayButton();
            }
        } catch(e) {
            console.warn('Erreur pauseSpeaking:', e);
            stopSpeaking();
        }
    }
    // Reprendre la parole
    function resumeSpeaking() {
        try {
            if (synth && synth.paused) {
                synth.resume();
                isPaused = false;
                isPlaying = true;
                setStatus("🔊 Lecture en cours", 'speaking');
                updatePlayButton();
            } else if (!isSpeaking && !synth.speaking && !synth.pending) {
                speakSlide(currentIndex);
            }
        } catch(e) {
            console.warn('Erreur resumeSpeaking:', e);
            speakSlide(currentIndex);
        }
    }
    function renderSlide(index) {
        const slide = slides[index];
        $title.text(slide.titre);
        let html = '';
        html += `<div class="content-card">${slide.contenu}</div>`;
        if (slide.note) {
            html += `<div class="note-box">${slide.note}</div>`;
        }
        $body.html(html);
        $counter.text(`${index+1} / ${total}`);
        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
        }
    }
    // ================================================================
    // LECTURE VOCALE
    // ================================================================
    function speakSlide(index) {
        return new Promise((resolve) => {
            const slide = slides[index];
            const text = slide.texteParle;
            if (!text || text.trim() === '' || !speechSupported) {
                resolve();
                return;
            }
            if (!window.speechSynthesis) {
                setStatus("❌ Synthèse vocale non supportée", 'error');
                speechSupported = false;
                resolve();
                return;
            }
            // Arrêter toute lecture en cours
            stopSpeaking();
            // Réinitialiser l'état de pause
            isPaused = false;
            showLoading();
            setStatus("Initialisation...", 'loading');
            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.92;
                utterance.pitch = 1.05;
                utterance.volume = 1;
                let isFinished = false;
                let errorHandled = false;
                utterance.onstart = function() {
                    if (loadingCancelled) {
                        stopSpeaking();
                        resolve();
                        return;
                    }
                    hideLoading();
                    isSpeaking = true;
                    isPlaying = true;
                    isPaused = false;
                    setStatus("🔊 Lecture en cours", 'speaking');
                    updatePlayButton();
                };
                utterance.onend = function() {
                    if (isFinished) return;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    setStatus("✅ Terminé", 'idle');
                    hideLoading();
                    updatePlayButton();
                    resolve();
                };
                utterance.onerror = function(e) {
                    if (isFinished || errorHandled) return;
                    errorHandled = true;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    hideLoading();
                    updatePlayButton();
                    if (e.error === 'not-allowed') {
                        setStatus("⚠️ Permission refusée", 'error');
                    } else if (e.error === 'synthesis-unavailable') {
                        setStatus("⚠️ Synthèse indisponible", 'error');
                    } else if (e.error === 'canceled') {
                        setStatus("⏸ Annulé", 'paused');
                    } else {
                        setStatus("❌ Erreur audio: " + (e.error || 'inconnue'), 'error');
                    }
                    resolve();
                };
                // Gestion du chargement des voix
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = function() {
                        if (!loadingCancelled) {
                            try {
                                synth.speak(utterance);
                            } catch(err) {
                                // Silencieux
                            }
                        }
                        synth.onvoiceschanged = null;
                    };
                }
                currentUtterance = utterance;
                if (!loadingCancelled) {
                    try {
                        synth.speak(utterance);
                    } catch(err) {
                        setTimeout(() => {
                            if (!loadingCancelled) {
                                try {
                                    synth.speak(utterance);
                                } catch(e) {
                                    setStatus("❌ Erreur de lecture", 'error');
                                    isPlaying = false;
                                    updatePlayButton();
                                    hideLoading();
                                    resolve();
                                }
                            } else {
                                resolve();
                            }
                        }, 100);
                    }
                } else {
                    resolve();
                }
            } catch(err) {
                hideLoading();
                setStatus("❌ Erreur générale", 'error');
                isPlaying = false;
                updatePlayButton();
                console.error('Erreur speakSlide:', err);
                resolve();
            }
        });
    }
    // ================================================================
    // NAVIGATION
    // ================================================================
    async function goToSlide(index) {
        if (isTransitioning) return;
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        // Si on est en train de lire, on met en pause avant de naviguer
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        // Arrêter complètement la lecture
        stopSpeaking();
        await new Promise(r => setTimeout(r, 50));
        if (index === currentIndex) {
            setStatus("📄 Slide actuel", 'idle');
            return;
        }
        isTransitioning = true;
        currentIndex = index;
        renderSlide(index);
        // Réinitialiser l'état de lecture
        isPlaying = false;
        updatePlayButton();
        setStatus("⏸ Lecture arrêtée", 'paused');
        await new Promise(r => setTimeout(r, 150));
        isTransitioning = false;
    }
    async function goToNext() {
        if (isTransitioning) return;
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        if (currentIndex + 1 < total) {
            await goToSlide(currentIndex + 1);
        } else {
            setStatus("🏁 Dernier slide", 'idle');
        }
    }
    async function goToPrev() {
        if (isTransitioning) return;
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        if (currentIndex - 1 >= 0) {
            await goToSlide(currentIndex - 1);
        } else {
            setStatus("🔁 Premier slide", 'idle');
        }
    }
    // ================================================================
    // GESTION PLAY/PAUSE
    // ================================================================
    function togglePlay() {
        if (!userInteracted) {
            userInteracted = true;
        }
        // Si le chargement est en cours, on l'annule
        if (isLoading) {
            cancelLoading();
            return;
        }
        // Si le synthétiseur est en pause, on reprend
        if (synth && synth.paused) {
            resumeSpeaking();
            return;
        }
        // Si la lecture est en cours, on met en pause
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
            return;
        }
        // Sinon, on démarre la lecture du slide courant
        if (!isSpeaking && !isPlaying) {
            stopSpeaking();
            speakSlide(currentIndex);
        }
    }
    // ================================================================
    // INIT
    // ================================================================
    async function init() {
        // Vérifier la compatibilité
        if (!window.speechSynthesis) {
            setStatus("❌ Synthèse vocale non supportée", 'error');
            speechSupported = false;
        }
        // Précharger les voix
        try {
            if (synth.getVoices) {
                synth.getVoices();
                setTimeout(() => {
                    try {
                        synth.getVoices();
                    } catch(e) {}
                }, 200);
            }
        } catch(e) {
            console.warn('Erreur chargement voix:', e);
        }
        // Afficher le premier slide
        renderSlide(0);
        $counter.text(`1 / ${total}`);
        // État initial
        setStatus("⏸ Appuie sur Play", 'paused');
        updatePlayButton();
        $autoIndicator.text('⏸ Lecture manuelle');
        // ================================================================
        // ÉVÉNEMENTS
        // ================================================================
        // Bouton Play/Pause
        $play.on('click', function() {
            togglePlay();
        });
        // Bouton Annuler le chargement
        $cancelLoading.on('click', function() {
            cancelLoading();
        });
        // Navigation
        $prev.on('click', function() {
            // Si chargement en cours, on annule
            if (isLoading) cancelLoading();
            goToPrev();
        });
        $next.on('click', function() {
            if (isLoading) cancelLoading();
            goToNext();
        });
        // Replay - relire le slide courant
        $replay.on('click', function() {
            if (isLoading) cancelLoading();
            stopSpeaking();
            setTimeout(() => {
                speakSlide(currentIndex);
            }, 100);
        });
        // Support du clavier (espace pour play/pause)
        $(document).on('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });
        // Nettoyage
        $(window).on('beforeunload', function() {
            try {
                if (synth.speaking) synth.cancel();
            } catch(e) {}
            hideLoading();
        });
        // Gérer les cas où la synthèse se termine de manière inattendue
        setInterval(() => {
            if (isPlaying && !synth.speaking && !synth.pending && !isPaused && !isLoading) {
                isPlaying = false;
                updatePlayButton();
                setStatus("⏸ Lecture arrêtée", 'paused');
            }
        }, 1000);
    }
    init();
});
    // ================================================================
    // GESTION DU THÈME JOUR/NUIT
    // ================================================================
    let isDarkMode = false;
    function toggleTheme() {
        isDarkMode = !isDarkMode;
        const body = document.body;
        const appContainer = document.querySelector('.app-container');
        const header = document.querySelector('.slide-header');
        const footer = document.querySelector('.slide-footer');
        const contentCards = document.querySelectorAll('.content-card');
        const noteBoxes = document.querySelectorAll('.note-box');
        const mathBlocks = document.querySelectorAll('.math-block');
        const buttons = document.querySelectorAll('.btn');
        const statusBadge = document.querySelector('.status-badge');
        const slideCounter = document.querySelector('.slide-counter');
        const autoIndicator = document.querySelector('.auto-indicator');
        const themeBtn = document.getElementById('themeToggle');
        if (isDarkMode) {
            // Mode nuit
            body.style.background = '#0b1120';
            body.style.color = '#f1f5f9';
            if (appContainer) appContainer.style.background = 'linear-gradient(145deg, #0f172a 0%, #1e293b 100%)';
            if (header) header.style.background = 'rgba(15, 23, 42, 0.85)';
            if (footer) footer.style.background = 'rgba(15, 23, 42, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.05)';
                card.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.08)';
                note.style.color = '#cbd5e1';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.25)';
                block.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#e2e8f0';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.12)';
                statusBadge.style.color = '#93bbfc';
            }
            if (slideCounter) {
                slideCounter.style.color = '#94a3b8';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#64748b';
            }
            if (themeBtn) {
                themeBtn.textContent = '☀️';
                themeBtn.title = 'Passer en mode jour';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#e2e8f0';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#e2e8f0';
                }
            });
        } else {
            // Mode jour (par défaut)
            body.style.background = '#f0f4f8';
            body.style.color = '#1a202c';
            if (appContainer) appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
            if (header) header.style.background = 'rgba(255, 255, 255, 0.85)';
            if (footer) footer.style.background = 'rgba(255, 255, 255, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.8)';
                card.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.12)';
                note.style.color = '#2c3e50';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.05)';
                block.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#2d3748';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
                statusBadge.style.color = '#2b6cb0';
            }
            if (slideCounter) {
                slideCounter.style.color = '#4a5568';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#718096';
            }
            if (themeBtn) {
                themeBtn.textContent = '🌓';
                themeBtn.title = 'Passer en mode nuit';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#2c3e50';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#2d3748';
                }
            });
        }
    }
    // Initialiser en mode jour
    document.addEventListener('DOMContentLoaded', function() {
        // Appliquer le mode jour par défaut
        const body = document.body;
        body.style.background = '#f0f4f8';
        body.style.color = '#1a202c';
        const appContainer = document.querySelector('.app-container');
        if (appContainer) {
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
        }
        const header = document.querySelector('.slide-header');
        if (header) {
            header.style.background = 'rgba(255, 255, 255, 0.85)';
        }
        const footer = document.querySelector('.slide-footer');
        if (footer) {
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
        }
        document.querySelectorAll('.content-card').forEach(card => {
            card.style.background = 'rgba(255,255,255,0.8)';
            card.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        document.querySelectorAll('.note-box').forEach(note => {
            note.style.background = 'rgba(96, 165, 250, 0.12)';
            note.style.color = '#2c3e50';
        });
        document.querySelectorAll('.math-block').forEach(block => {
            block.style.background = 'rgba(0,0,0,0.05)';
            block.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        document.querySelectorAll('.btn').forEach(btn => {
            btn.style.color = '#2d3748';
        });
        const statusBadge = document.querySelector('.status-badge');
        if (statusBadge) {
            statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
            statusBadge.style.color = '#2b6cb0';
        }
        const slideCounter = document.querySelector('.slide-counter');
        if (slideCounter) {
            slideCounter.style.color = '#4a5568';
        }
        const autoIndicator = document.querySelector('.auto-indicator');
        if (autoIndicator) {
            autoIndicator.style.color = '#718096';
        }
        document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
            if (!el.closest('.note-box')) {
                el.style.color = '#2c3e50';
            }
        });
        document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
            if (!el.closest('.note-box') && !el.closest('.math-block')) {
                el.style.color = '#2d3748';
            }
        });
        const themeBtn = document.getElementById('themeToggle');
        if (themeBtn) {
            themeBtn.textContent = '🌓';
            themeBtn.title = 'Passer en mode nuit';
            // Ajouter l'écouteur d'événement click
            themeBtn.addEventListener('click', toggleTheme);
        }
    });
</script>
