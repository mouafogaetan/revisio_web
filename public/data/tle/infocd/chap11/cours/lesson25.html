<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Présentation mobile</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' },
            options: { skipHtmlTypes: 'script' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 500px;
        margin: 0 auto;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    .slide-header {
        flex-shrink: 0;
        padding: 18px 16px 10px 16px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        z-index: 10;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .slide-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
    }

    .content-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 18px 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        flex-shrink: 0;
    }

    .content-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .content-card li {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        line-height: 1.5;
    }

    .content-card li:last-child {
        border-bottom: none;
    }

    .bullet-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
    }

    .math-block {
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        overflow-x: auto;
        flex-shrink: 0;
        margin: 4px 0;
    }

    .math-block .math {
        font-size: 1.2rem;
        color: #e2e8f0;
    }

    .note-box {
        background: rgba(96, 165, 250, 0.08);
        border-left: 4px solid #60a5fa;
        padding: 12px 16px;
        border-radius: 12px;
        font-style: italic;
        font-size: 0.9rem;
        color: #cbd5e1;
        flex-shrink: 0;
    }

    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        border-radius: 0;
        flex-direction: column;
    }

    .loading-card {
        background: #1e293b;
        padding: 32px 28px;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #334155;
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px auto;
    }

    .loading-text {
        font-weight: 600;
        font-size: 1.1rem;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    .loading-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 16px;
    }
    .loading-progress {
        height: 3px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        animation: loadingProgress 30s ease-out forwards;
    }

    .loading-timeout {
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 12px;
    }

    .btn-cancel-loading {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 40px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #f87171;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }

    .btn-cancel-loading:active {
        transform: scale(0.94);
        background: rgba(239, 68, 68, 0.25);
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
    }

    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .slide-counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255,255,255,0.05);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(255,255,255,0.04);
    }

    .status-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 30px;
        background: rgba(96, 165, 250, 0.12);
        color: #93bbfc;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
    }

    .status-badge .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: pulse-dot 1.2s infinite;
        flex-shrink: 0;
    }

    .status-badge.idle .dot {
        animation: none;
        background: #64748b;
    }
    .status-badge.speaking .dot {
        background: #34d399;
        animation: pulse-dot 0.8s infinite;
    }
    .status-badge.error .dot {
        background: #f87171;
        animation: none;
    }
    .status-badge.paused .dot {
        animation: none;
        background: #fbbf24;
    }
    .status-badge.waiting .dot {
        animation: pulse-dot 1.5s infinite;
        background: #fbbf24;
    }
    .status-badge.loading .dot {
        animation: pulse-dot 0.5s infinite;
        background: #60a5fa;
    }

    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.7); }
    }

    .footer-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(255,255,255,0.1);
    }

    .btn-secondary {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-play {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
        min-width: 80px;
        justify-content: center;
    }
    .btn-play:active {
        background: rgba(52, 211, 153, 0.25);
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
    }

    .auto-indicator {
        font-size: 0.65rem;
        color: #64748b;
        text-align: center;
        letter-spacing: 0.3px;
        padding: 2px 0;
    }

    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.2rem;
        }
        .content-card li {
            font-size: 0.9rem;
            padding: 8px 0;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .btn-play {
            min-width: 60px;
        }
        .footer-buttons {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
        .loading-card {
            padding: 20px 16px;
        }
        .math-block .math {
            font-size: 1rem;
        }
    }

    @media (min-width: 600px) {
        .app-container {
            max-width: 480px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
        .loading-overlay {
            border-radius: 32px;
        }
    }

    /* Mode jour (par défaut) */
    html, body {
        background: #f0f4f8 !important;
        color: #1a202c !important;
    }
    .app-container {
        background: linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%) !important;
    }
    .slide-header {
        background: rgba(255, 255, 255, 0.85) !important;
        border-bottom: 1px solid rgba(0,0,0,0.08) !important;
    }
    .slide-header h1 {
        background: linear-gradient(135deg, #2b6cb0, #6b46c1) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        background-clip: text !important;
    }
    .slide-footer {
        background: rgba(255, 255, 255, 0.9) !important;
        border-top: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card {
        background: rgba(255,255,255,0.8) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card li {
        border-bottom: 1px solid rgba(0,0,0,0.05) !important;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.12) !important;
        border-left: 4px solid #4299e1 !important;
        color: #2c3e50 !important;
    }
    .math-block {
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .math-block .math {
        color: #2d3748 !important;
    }
    .slide-counter {
        color: #4a5568 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .status-badge {
        background: rgba(96, 165, 250, 0.15) !important;
        color: #2b6cb0 !important;
        border: 1px solid rgba(96, 165, 250, 0.15) !important;
    }
    .btn {
        color: #2d3748 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .btn-secondary {
        background: rgba(0,0,0,0.04) !important;
        border-color: rgba(0,0,0,0.08) !important;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15) !important;
        border-color: rgba(52, 211, 153, 0.2) !important;
        color: #38a169 !important;
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15) !important;
        border-color: rgba(251, 191, 36, 0.2) !important;
        color: #d69e2e !important;
    }
    .auto-indicator {
        color: #718096 !important;
    }
    .loading-card {
        background: #ffffff !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .loading-text {
        color: #1a202c !important;
    }
    .loading-sub {
        color: #4a5568 !important;
    }
</style>
</head>
<body>

<div class="app-container">

    <header class="slide-header">
        <h1 id="slideTitle">Chargement...</h1>
    </header>

    <main class="slide-body" id="slideBody"></main>

    <!-- LOADING OVERLAY AVEC BOUTON ANNULER -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Préparation vocale...</div>
            <div class="loading-sub" id="loadingSub">Synthèse en cours</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loadingProgressBar"></div>
            </div>
            <div class="loading-timeout" id="loadingTimeout">⏱️ 30 secondes maximum</div>
            <button class="btn-cancel-loading" id="cancelLoadingBtn">
                <span>✕</span> Annuler
            </button>
        </div>
    </div>

    <footer class="slide-footer">
        <div class="footer-top">
            <span class="slide-counter" id="slideCounter">1 / 3</span>
            <span class="status-badge idle" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">Prêt</span>
            </span>
        </div>

        <div class="footer-buttons">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-secondary" id="replayBtn">
                <span class="btn-icon">🔁</span> <span class="btn-label">Relire</span>
            </button>
            <button class="btn btn-play" id="playBtn">
                <span class="btn-icon">▶</span> <span class="btn-label">Play</span>
            </button>
        </div>

        <div class="auto-indicator" id="autoIndicator">⏸ Lecture manuelle</div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // SLIDES
    // ================================================================
    const slides = [
  {
    "titre": "Adressage IP et sous-réseaux",
    "contenu": "<div style='background: linear-gradient(135deg, #0b3d2e, #1e8449); padding: 20px; border-radius: 12px; color: #ffffff; text-align: center; margin-bottom: 16px;'><h2 style='margin: 0 0 10px 0; font-size: 1.4em;'>🌐 Leçon 25</h2><p style='margin: 0; font-size: 1em; opacity: 0.95;'>Adressage IP et sous-réseaux</p></div><div style='background: #eafaf1; padding: 14px; border-radius: 10px; color: #0b3d2e; margin-bottom: 12px;'><p style='margin: 0; font-size: 1em;'><strong>🎯 Objectif :</strong> Comprendre la structure d'une adresse IPv4, déterminer la classe d'une adresse et distinguer l'adressage statique de l'adressage dynamique.</p></div><div style='background: #fef9e7; padding: 14px; border-radius: 10px; color: #7d6608; border-left: 4px solid #f1c40f;'><p style='margin: 0; font-size: 0.95em;'><strong>💡 À retenir :</strong> Une adresse IP est comme l'adresse postale d'un appareil sur un réseau. Sans elle, impossible de communiquer.</p></div>",
    "texteParle": "Bienvenue dans la leçon vingt-cinq du chapitre onze : adressage IP et sous-réseaux. Dans cette leçon, nous allons apprendre ce qu'est une adresse IP, comment elle est structurée, comment déterminer sa classe et comment distinguer l'adressage statique de l'adressage dynamique. À la fin de cette leçon, vous serez capable de lire une adresse IP et de comprendre son rôle dans un réseau informatique. Retenez bien cette comparaison : une adresse IP est comme l'adresse postale d'un appareil sur un réseau. Sans elle, il est impossible de communiquer avec les autres appareils.",
    "note": "Une adresse IP est l'adresse postale d'un appareil sur un réseau."
  },
  {
    "titre": "Qu'est-ce qu'une adresse IP ?",
    "contenu": "<div style='background: #ebf5fb; padding: 14px; border-radius: 10px; color: #1a5276; margin-bottom: 12px; border-left: 4px solid #2980b9;'><h3 style='margin-top: 0; font-size: 1.1em;'>🔍 Définition</h3><p style='font-size: 0.95em; line-height: 1.6;'>Une <strong>adresse IP</strong> (Internet Protocol) est un identifiant unique attribué à chaque appareil connecté à un réseau. Elle permet d'identifier et de localiser cet appareil pour lui envoyer des données.</p></div><div style='background: #ffffff; padding: 14px; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); color: #2c3e50; margin-bottom: 12px;'><h4 style='margin-top: 0; color: #1a5276; font-size: 1em;'>📌 Rôle de l'adresse IP</h4><ul style='margin: 0; padding-left: 20px; font-size: 0.9em; line-height: 1.8; color: #2c3e50;'><li><strong>Identifier</strong> un appareil sur le réseau</li><li><strong>Localiser</strong> cet appareil pour acheminer les données</li><li><strong>Communiquer</strong> avec d'autres appareils (ordinateurs, téléphones, serveurs)</li></ul></div><div style='background: #e8f8f5; padding: 14px; border-radius: 10px; color: #0e6251; margin-bottom: 12px; border-left: 4px solid #1abc9c;'><h4 style='margin-top: 0; font-size: 1em;'>🇨🇲 Exemple concret</h4><p style='margin: 0; font-size: 0.9em; line-height: 1.6;'>Lorsque tu envoies un message WhatsApp à un ami à Douala, ton téléphone utilise l'adresse IP de ton ami pour que le message arrive au bon destinataire, comme une lettre qui doit porter l'adresse du destinataire.</p></div>",
    "texteParle": "Qu'est-ce qu'une adresse IP ? Une adresse IP, pour Internet Protocol, est un identifiant unique attribué à chaque appareil connecté à un réseau. Elle permet d'identifier et de localiser cet appareil pour lui envoyer des données. L'adresse IP a trois rôles principaux. Premièrement, identifier un appareil sur le réseau. Deuxièmement, localiser cet appareil pour acheminer les données. Troisièmement, communiquer avec d'autres appareils comme les ordinateurs, les téléphones ou les serveurs. Voici un exemple concret : lorsque tu envoies un message WhatsApp à un ami à Douala, ton téléphone utilise l'adresse IP de ton ami pour que le message arrive au bon destinataire. C'est comme une lettre qui doit porter l'adresse du destinataire.",
    "note": "L'adresse IP identifie, localise et permet la communication entre appareils."
  },
  {
    "titre": "Structure d'une adresse IPv4",
    "contenu": "<div style='background: #f4ecf7; padding: 14px; border-radius: 10px; color: #6c3483; margin-bottom: 12px; border-left: 4px solid #8e44ad;'><h3 style='margin-top: 0; font-size: 1.1em;'>🧩 Composition d'une adresse IPv4</h3><p style='font-size: 0.95em; line-height: 1.6;'>Une adresse IPv4 est composée de <strong>4 nombres</strong> séparés par des points. Chaque nombre est compris entre <strong>0 et 255</strong>.</p></div><div style='background: #ffffff; padding: 14px; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); color: #2c3e50; margin-bottom: 12px; text-align: center;'><h4 style='margin-top: 0; color: #6c3483; font-size: 1em;'>📌 Exemple d'adresse IPv4</h4><div style='background: #f4f6f7; padding: 14px; border-radius: 8px; font-family: monospace; font-size: 1.1em; color: #6c3483; margin: 10px 0;'>192.168.1.10</div><div style='display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; font-size: 0.85em; color: #2c3e50;'><span style='background: #eaf2f8; padding: 6px 10px; border-radius: 6px;'>192</span><span style='background: #e8f8f5; padding: 6px 10px; border-radius: 6px;'>168</span><span style='background: #fef9e7; padding: 6px 10px; border-radius: 6px;'>1</span><span style='background: #fdedec; padding: 6px 10px; border-radius: 6px;'>10</span></div></div><div style='background: #ebf5fb; padding: 14px; border-radius: 10px; color: #1a5276; margin-bottom: 12px;'><h4 style='margin-top: 0; font-size: 1em;'>📐 Structure en 4 octets</h4><p style='font-size: 0.9em; line-height: 1.6;'>Une adresse IPv4 est constituée de <strong>32 bits</strong>, soit <strong>4 octets</strong>. Chaque octet peut prendre une valeur de 0 à 255.</p><div class='math-block'><div class='math'>$$ \\text{IPv4} = \\text{octet}_1 . \\text{octet}_2 . \\text{octet}_3 . \\text{octet}_4 $$</div></div></div><div style='background: #fef9e7; padding: 12px; border-radius: 10px; color: #7d6608; border-left: 4px solid #f1c40f;'><p style='margin: 0; font-size: 0.9em;'><strong>⚠️ Attention :</strong> Chaque nombre doit être compris entre 0 et 255. Une adresse comme 192.300.1.1 est invalide.</p></div>",
    "texteParle": "Maintenant, voyons la structure d'une adresse IPv4. Une adresse IPv4 est composée de quatre nombres séparés par des points. Chaque nombre est compris entre zéro et deux cent cinquante-cinq. Par exemple, l'adresse 192.168.1.10 est une adresse IPv4 valide. Elle est composée des nombres 192, 168, 1 et 10. Techniquement, une adresse IPv4 est constituée de trente-deux bits, soit quatre octets. Chaque octet peut prendre une valeur de zéro à deux cent cinquante-cinq. Attention, chaque nombre doit être compris entre zéro et deux cent cinquante-cinq. Une adresse comme 192.300.1.1 est invalide car 300 dépasse 255.",
    "note": "Une adresse IPv4 = 4 nombres entre 0 et 255 séparés par des points."

    "titre": "Les classes d'adresses IPv4",
    "contenu": "<div style='background: #e8f8f5; padding: 14px; border-radius: 10px; color: #0e6251; margin-bottom: 12px; border-left: 4px solid #1abc9c;'><h3 style='margin-top: 0; font-size: 1.1em;'>📊 Classification des adresses IPv4</h3><p style='font-size: 0.95em; line-height: 1.6;'>Les adresses IPv4 sont classées en <strong>5 classes</strong> (A, B, C, D, E) selon la valeur du premier octet.</p></div><div style='background: #ffffff; padding: 14px; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); color: #2c3e50; margin-bottom: 12px; overflow-x: auto;'><table style='width: 100%; border-collapse: collapse; font-size: 0.8em; color: #2c3e50;'><tr style='background: #1abc9c; color: #ffffff;'><th style='padding: 8px; text-align: left;'>Classe</th><th style='padding: 8px; text-align: left;'>1er octet</th><th style='padding: 8px; text-align: left;'>Masque par défaut</th><th style='padding: 8px; text-align: left;'>Usage</th></tr><tr style='background: #f9f5fc;'><td style='padding: 8px;'><strong>A</strong></td><td style='padding: 8px;'>1 à 126</td><td style='padding: 8px;'>255.0.0.0</td><td style='padding: 8px;'>Très grands réseaux</td></tr><tr style='background: #ffffff;'><td style='padding: 8px;'><strong>B</strong></td><td style='padding: 8px;'>128 à 191</td><td style='padding: 8px;'>255.255.0.0</td><td style='padding: 8px;'>Réseaux moyens</td></tr><tr style='background: #f9f5fc;'><td style='padding: 8px;'><strong>C</strong></td><td style='padding: 8px;'>192 à 223</td><td style='padding: 8px;'>255.255.255.0</td><td style='padding: 8px;'>Petits réseaux</td></tr><tr style='background: #ffffff;'><td style='padding: 8px;'><strong>D</strong></td><td style='padding: 8px;'>224 à 239</td><td style='padding: 8px;'>—</td><td style='padding: 8px;'>Multicast</td></tr><tr style='background: #f9f5fc;'><td style='padding: 8px;'><strong>E</strong></td><td style='padding: 8px;'>240 à 255</td><td style='padding: 8px;'>—</td><td style='padding: 8px;'>Expérimental</td></tr></table></div><div style='background: #ebf5fb; padding: 14px; border-radius: 10px; color: #1a5276; margin-bottom: 12px;'><h4 style='margin-top: 0; font-size: 1em;'>📝 Exemples</h4><ul style='margin: 0; padding-left: 20px; font-size: 0.9em; line-height: 1.8;'><li><strong>10.0.0.1</strong> → Classe A (1er octet = 10)</li><li><strong>172.16.0.1</strong> → Classe B (1er octet = 172)</li><li><strong>192.168.1.1</strong> → Classe C (1er octet = 192)</li></ul></div><div style='background: #fef9e7; padding: 12px; border-radius: 10px; color: #7d6608; border-left: 4px solid #f1c40f;'><p style='margin: 0; font-size: 0.9em;'><strong>💡 Astuce :</strong> Pour trouver la classe, regarde uniquement le <strong>premier octet</strong> de l'adresse.</p></div>",
    "texteParle": "Les adresses IPv4 sont classées en cinq classes : A, B, C, D et E. Cette classification dépend de la valeur du premier octet. La classe A va de 1 à 126 et est utilisée pour les très grands réseaux. La classe B va de 128 à 191 et est utilisée pour les réseaux moyens. La classe C va de 192 à 223 et est utilisée pour les petits réseaux. La classe D va de 224 à 239 et est réservée au multicast. La classe E va de 240 à 255 et est réservée à l'expérimentation. Voici quelques exemples. L'adresse 10.0.0.1 appartient à la classe A car son premier octet est 10. L'adresse 172.16.0.1 appartient à la classe B car son premier octet est 172. L'adresse 192.168.1.1 appartient à la classe C car son premier octet est 192. Astuce : pour trouver la classe d'une adresse, regarde uniquement le premier octet.",

    "contenu": "<div style='background: #fdedec; padding: 14px; border-radius: 10px; color: #922b21; margin-bottom: 12px; border-left: 4px solid #e74c3c;'><h3 style='margin-top: 0; font-size: 1.1em;'>⚙️ Deux modes d'attribution d'adresse IP</h3></div><div style='display: flex; flex-direction: column; gap: 10px;'><div style='background: #ffffff; padding: 14px; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); color: #2c3e50;'><h4 style='margin: 0 0 8px 0; color: #1a5276; font-size: 1em;'>📌 Adressage statique</h4><p style='margin: 0 0 8px 0; font-size: 0.9em; line-height: 1.5;'>L'adresse IP est <strong>configurée manuellement</strong> par l'administrateur réseau. Elle ne change pas.</p><ul style='margin: 0; padding-left: 20px; font-size: 0.85em; line-height: 1.7;'><li>✅ Avantage : adresse stable et prévisible</li><li>❌ Inconvénient : configuration manuelle fastidieuse</li><li>🏢 Usage : serveurs, imprimantes réseau, routeurs</li></ul></div><div style='background: #ffffff; padding: 14px; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); color: #2c3e50;'><h4 style='margin: 0 0 8px 0; color: #1a5276; font-size: 1em;'>🔄 Adressage dynamique</h4><p style='margin: 0 0 8px 0; font-size: 0.9em; line-height: 1.5;'>L'adresse IP est <strong>attribuée automatiquement</strong> par un serveur DHCP. Elle peut changer à chaque connexion.</p><ul style='margin: 0; padding-left: 20px; font-size: 0.85em; line-height: 1.7;'><li>✅ Avantage : configuration automatique, pas de conflit d'adresses</li><li>❌ Inconvénient : l'adresse peut changer</li><li>📱 Usage : téléphones, ordinateurs personnels, tablettes</li></ul></div></div><div style='background: #ebf5fb; padding: 14px; border-radius: 10px; color: #1a5276; margin-top: 12px;'><h4 style='margin-top: 0; font-size: 1em;'>🇨🇲 Exemple au Cameroun</h4><p style='margin: 0; font-size: 0.9em; line-height: 1.6;'>Chez toi, ta box Internet (Camtel, Orange, MTN) attribue automatiquement une adresse IP à ton téléphone quand il se connecte au Wi-Fi. C'est de l'adressage dynamique. Par contre, le serveur du site web de ta banque a une adresse IP fixe pour être toujours joignable. C'est de l'adressage statique.</p></div>",
    "texteParle": "Il existe deux modes d'attribution d'une adresse IP : l'adressage statique et l'adressage dynamique. Dans l'adressage statique, l'adresse IP est configurée manuellement par l'administrateur réseau. Elle ne change pas. L'avantage est que l'adresse est stable et prévisible. L'inconvénient est que la configuration manuelle est fastidieuse. On utilise l'adressage statique pour les serveurs, les imprimantes réseau et les routeurs. Dans l'adressage dynamique, l'adresse IP est attribuée automatiquement par un serveur DHCP. Elle peut changer à chaque connexion. L'avantage est la configuration automatique et l'absence de conflit d'adresses. L'inconvénient est que l'adresse peut changer. On utilise l'adressage dynamique pour les téléphones, les ordinateurs personnels et les tablettes. Voici un exemple au Cameroun. Chez toi, ta box Internet Camtel, Orange ou MTN attribue automatiquement une adresse IP à ton téléphone quand il se connecte au Wi-Fi. C'est de l'adressage dynamique. Par contre, le serveur du site web de ta banque a une adresse IP fixe pour être toujours joignable. C'est de l'adressage statique.",

    "titre": "Le masque de sous-réseau",
    "contenu": "<div style='background: #f4ecf7; padding: 14px; border-radius: 10px; color: #6c3483; margin-bottom: 12px; border-left: 4px solid #8e44ad;'><h3 style='margin-top: 0; font-size: 1.1em;'>🎭 Qu'est-ce qu'un masque de sous-réseau ?</h3><p style='font-size: 0.95em; line-height: 1.6;'>Le <strong>masque de sous-réseau</strong> permet de distinguer la partie <strong>réseau</strong> de la partie <strong>hôte</strong> dans une adresse IP.</p></div><div style='background: #ffffff; padding: 14px; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); color: #2c3e50; margin-bottom: 12px;'><h4 style='margin-top: 0; color: #6c3483; font-size: 1em;'>📐 Structure</h4><p style='font-size: 0.9em; line-height: 1.6;'>Le masque est composé de bits à 1 pour la partie réseau et de bits à 0 pour la partie hôte.</p><div class='math-block'><div class='math'>$$ \\text{Adresse IP} = \\underbrace{\\text{Partie réseau}}_{\\text{bits à 1}} + \\underbrace{\\text{Partie hôte}}_{\\text{bits à 0}} $$</div></div></div><div style='background: #e8f8f5; padding: 14px; border-radius: 10px; color: #0e6251; margin-bottom: 12px;'><h4 style='margin-top: 0; font-size: 1em;'>📝 Exemple avec la classe C</h4><div style='background: #ffffff; padding: 12px; border-radius: 8px; font-size: 0.9em; color: #2c3e50; line-height: 1.8;'><p style='margin: 0 0 6px 0;'><strong>Adresse IP :</strong> 192.168.1.10</p><p style='margin: 0 0 6px 0;'><strong>Masque :</strong> 255.255.255.0</p><p style='margin: 0;'><strong>Partie réseau :</strong> 192.168.1 &nbsp;|&nbsp; <strong>Partie hôte :</strong> 10</p></div></div><div style='background: #fef9e7; padding: 12px; border-radius: 10px; color: #7d6608; border-left: 4px solid #f1c40f;'><p style='margin: 0; font-size: 0.9em;'><strong>💡 À retenir :</strong> Deux appareils sont dans le même sous-réseau s'ils ont la même partie réseau.</p></div>",

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentIndex = 0;
    let isSpeaking = false;
    let isPaused = false;
    let currentUtterance = null;
    let isLoading = false;
    let loadingTimeout = null;
    let isTransitioning = false;
    let speechSupported = true;
    let userInteracted = false;
    let isPlaying = false;
    let loadingCancelled = false;

    const total = slides.length;
    const synth = window.speechSynthesis;

    // Références jQuery
    const $title = $('#slideTitle');
    const $body = $('#slideBody');
    const $counter = $('#slideCounter');
    const $statusText = $('#statusText');
    const $statusBadge = $('#statusBadge');
    const $loading = $('#loadingOverlay');
    const $loadingText = $('#loadingText');
    const $loadingSub = $('#loadingSub');
    const $loadingTimeout = $('#loadingTimeout');
    const $loadingProgressBar = $('#loadingProgressBar');
    const $autoIndicator = $('#autoIndicator');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $replay = $('#replayBtn');
    const $play = $('#playBtn');
    const $cancelLoading = $('#cancelLoadingBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function setStatus(text, type) {
        $statusText.text(text);
        $statusBadge.removeClass('idle speaking error paused waiting loading');
        if (type === 'speaking') $statusBadge.addClass('speaking');
        else if (type === 'error') $statusBadge.addClass('error');
        else if (type === 'paused') $statusBadge.addClass('paused');
        else if (type === 'waiting') $statusBadge.addClass('waiting');
        else if (type === 'loading') $statusBadge.addClass('loading');
        else $statusBadge.addClass('idle');
    }

    function updatePlayButton() {
        if (isPlaying) {
            $play.addClass('playing');
            $play.find('.btn-icon').text('⏸');
            $play.find('.btn-label').text('Pause');
        } else {
            $play.removeClass('playing');
            $play.find('.btn-icon').text('▶');
            $play.find('.btn-label').text('Play');
        }
    }

    function showLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        
        loadingCancelled = false;
        isLoading = true;
        
        // Réinitialiser la barre de progression
        $loadingProgressBar.css('animation', 'none');
        $loadingProgressBar.css('width', '0%');
        // Forcer un reflow
        $loadingProgressBar[0].offsetHeight;
        $loadingProgressBar.css('animation', 'loadingProgress 30s ease-out forwards');
        
        $loadingText.text('Préparation vocale...');
        $loadingSub.text('Synthèse en cours');
        $loadingTimeout.text('⏱️ 30 secondes maximum');
        $loading.fadeIn(300);
        setStatus("⏳ Chargement...", 'loading');
        
        // 🔥 TIMEOUT DE 30 SECONDES
        loadingTimeout = setTimeout(() => {
            if (isLoading && !loadingCancelled) {
                hideLoading();
                setStatus("⚠️ Délai dépassé (30s)", 'error');
                isPlaying = false;
                updatePlayButton();
                $loadingSub.text('La synthèse vocale a pris trop de temps');
                $loadingTimeout.text('❌ Délai dépassé');
            }
        }, 30000);
    }

    function hideLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        isLoading = false;
        loadingCancelled = false;
        $loading.fadeOut(300);
        // Ne pas changer le statut si on est en train de parler
        if (!isSpeaking && !isPlaying) {
            setStatus("⏸ Lecture arrêtée", 'paused');
        }
    }

    function cancelLoading() {
        loadingCancelled = true;
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        hideLoading();
        stopSpeaking();
        setStatus("⏸ Annulé", 'paused');
        isPlaying = false;
        updatePlayButton();
        $loadingText.text('Annulé par l\'utilisateur');
        $loadingSub.text('Vous pouvez réessayer');
        $loadingTimeout.text('✕ Annulation');
    }

    // Arrêter la parole proprement
    function stopSpeaking() {
        try {
            if (synth && (synth.speaking || synth.pending)) {
                synth.cancel();
            }
        } catch(e) {
            console.warn('Erreur stopSpeaking:', e);
        }
        if (currentUtterance) {
            try {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance.onstart = null;
            } catch(e) {}
            currentUtterance = null;
        }
        isSpeaking = false;
        isPlaying = false;
        updatePlayButton();
    }

    // Mettre en pause la parole
    function pauseSpeaking() {
        try {
            if (synth && synth.speaking) {
                synth.pause();
                isPaused = true;
                isPlaying = false;
                setStatus("⏸ Lecture en pause", 'paused');
                updatePlayButton();
            }
        } catch(e) {
            console.warn('Erreur pauseSpeaking:', e);
            stopSpeaking();
        }
    }

    // Reprendre la parole
    function resumeSpeaking() {
        try {
            if (synth && synth.paused) {
                synth.resume();
                isPaused = false;
                isPlaying = true;
                setStatus("🔊 Lecture en cours", 'speaking');
                updatePlayButton();
            } else if (!isSpeaking && !synth.speaking && !synth.pending) {
                speakSlide(currentIndex);
            }
        } catch(e) {
            console.warn('Erreur resumeSpeaking:', e);
            speakSlide(currentIndex);
        }
    }

    function renderSlide(index) {
        const slide = slides[index];
        $title.text(slide.titre);

        let html = '';
        html += `<div class="content-card">${slide.contenu}</div>`;
        if (slide.note) {
            html += `<div class="note-box">${slide.note}</div>`;
        }
        $body.html(html);
        $counter.text(`${index+1} / ${total}`);

        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
        }
    }

    // ================================================================
    // LECTURE VOCALE
    // ================================================================
    function speakSlide(index) {
        return new Promise((resolve) => {
            const slide = slides[index];
            const text = slide.texteParle;
            
            if (!text || text.trim() === '' || !speechSupported) {
                resolve();
                return;
            }

            if (!window.speechSynthesis) {
                setStatus("❌ Synthèse vocale non supportée", 'error');
                speechSupported = false;
                resolve();
                return;
            }

            // Arrêter toute lecture en cours
            stopSpeaking();
            
            // Réinitialiser l'état de pause
            isPaused = false;
            
            showLoading();
            setStatus("Initialisation...", 'loading');

            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.92;
                utterance.pitch = 1.05;
                utterance.volume = 1;

                let isFinished = false;
                let errorHandled = false;

                utterance.onstart = function() {
                    if (loadingCancelled) {
                        stopSpeaking();
                        resolve();
                        return;
                    }
                    hideLoading();
                    isSpeaking = true;
                    isPlaying = true;
                    isPaused = false;
                    setStatus("🔊 Lecture en cours", 'speaking');
                    updatePlayButton();
                };

                utterance.onend = function() {
                    if (isFinished) return;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    setStatus("✅ Terminé", 'idle');
                    hideLoading();
                    updatePlayButton();
                    resolve();
                };

                utterance.onerror = function(e) {
                    if (isFinished || errorHandled) return;
                    errorHandled = true;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    hideLoading();
                    updatePlayButton();
                    
                    if (e.error === 'not-allowed') {
                        setStatus("⚠️ Permission refusée", 'error');
                    } else if (e.error === 'synthesis-unavailable') {
                        setStatus("⚠️ Synthèse indisponible", 'error');
                    } else if (e.error === 'canceled') {
                        setStatus("⏸ Annulé", 'paused');
                    } else {
                        setStatus("❌ Erreur audio: " + (e.error || 'inconnue'), 'error');
                    }
                    
                    resolve();
                };

                // Gestion du chargement des voix
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = function() {
                        if (!loadingCancelled) {
                            try {
                                synth.speak(utterance);
                            } catch(err) {
                                // Silencieux
                            }
                        }
                        synth.onvoiceschanged = null;
                    };
                }

                currentUtterance = utterance;
                
                if (!loadingCancelled) {
                    try {
                        synth.speak(utterance);
                    } catch(err) {
                        setTimeout(() => {
                            if (!loadingCancelled) {
                                try {
                                    synth.speak(utterance);
                                } catch(e) {
                                    setStatus("❌ Erreur de lecture", 'error');
                                    isPlaying = false;
                                    updatePlayButton();
                                    hideLoading();
                                    resolve();
                                }
                            } else {
                                resolve();
                            }
                        }, 100);
                    }
                } else {
                    resolve();
                }

            } catch(err) {
                hideLoading();
                setStatus("❌ Erreur générale", 'error');
                isPlaying = false;
                updatePlayButton();
                console.error('Erreur speakSlide:', err);
                resolve();
            }
        });
    }

    // ================================================================
    // NAVIGATION
    // ================================================================
    async function goToSlide(index) {
        if (isTransitioning) return;
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        
        // Si on est en train de lire, on met en pause avant de naviguer
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        // Arrêter complètement la lecture
        stopSpeaking();
        
        await new Promise(r => setTimeout(r, 50));
        
        if (index === currentIndex) {
            setStatus("📄 Slide actuel", 'idle');
            return;
        }

        isTransitioning = true;
        currentIndex = index;
        renderSlide(index);
        
        // Réinitialiser l'état de lecture
        isPlaying = false;
        updatePlayButton();
        setStatus("⏸ Lecture arrêtée", 'paused');

        await new Promise(r => setTimeout(r, 150));
        isTransitioning = false;
    }

    async function goToNext() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex + 1 < total) {
            await goToSlide(currentIndex + 1);
        } else {
            setStatus("🏁 Dernier slide", 'idle');
        }
    }

    async function goToPrev() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex - 1 >= 0) {
            await goToSlide(currentIndex - 1);
        } else {
            setStatus("🔁 Premier slide", 'idle');
        }
    }

    // ================================================================
    // GESTION PLAY/PAUSE
    // ================================================================
    function togglePlay() {
        if (!userInteracted) {
            userInteracted = true;
        }

        // Si le chargement est en cours, on l'annule
        if (isLoading) {
            cancelLoading();
            return;
        }

        // Si le synthétiseur est en pause, on reprend
        if (synth && synth.paused) {
            resumeSpeaking();
            return;
        }

        // Si la lecture est en cours, on met en pause
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
            return;
        }

        // Sinon, on démarre la lecture du slide courant
        if (!isSpeaking && !isPlaying) {
            stopSpeaking();
            speakSlide(currentIndex);
        }
    }

    // ================================================================
    // INIT
    // ================================================================
    async function init() {
        // Vérifier la compatibilité
        if (!window.speechSynthesis) {
            setStatus("❌ Synthèse vocale non supportée", 'error');
            speechSupported = false;
        }

        // Précharger les voix
        try {
            if (synth.getVoices) {
                synth.getVoices();
                setTimeout(() => {
                    try {
                        synth.getVoices();
                    } catch(e) {}
                }, 200);
            }
        } catch(e) {
            console.warn('Erreur chargement voix:', e);
        }

        // Afficher le premier slide
        renderSlide(0);
        $counter.text(`1 / ${total}`);
        
        // État initial
        setStatus("⏸ Appuie sur Play", 'paused');
        updatePlayButton();
        $autoIndicator.text('⏸ Lecture manuelle');

        // ================================================================
        // ÉVÉNEMENTS
        // ================================================================
        
        // Bouton Play/Pause
        $play.on('click', function() {
            togglePlay();
        });

        // Bouton Annuler le chargement
        $cancelLoading.on('click', function() {
            cancelLoading();
        });

        // Navigation
        $prev.on('click', function() {
            // Si chargement en cours, on annule
            if (isLoading) cancelLoading();
            goToPrev();
        });

        $next.on('click', function() {
            if (isLoading) cancelLoading();
            goToNext();
        });

        // Replay - relire le slide courant
        $replay.on('click', function() {
            if (isLoading) cancelLoading();
            stopSpeaking();
            setTimeout(() => {
                speakSlide(currentIndex);
            }, 100);
        });

        // Support du clavier (espace pour play/pause)
        $(document).on('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });

        // Nettoyage
        $(window).on('beforeunload', function() {
            try {
                if (synth.speaking) synth.cancel();
            } catch(e) {}
            hideLoading();
        });

        // Gérer les cas où la synthèse se termine de manière inattendue
        setInterval(() => {
            if (isPlaying && !synth.speaking && !synth.pending && !isPaused && !isLoading) {
                isPlaying = false;
                updatePlayButton();
                setStatus("⏸ Lecture arrêtée", 'paused');
            }
        }, 1000);
    }

    init();
});



    // ================================================================
    // GESTION DU THÈME JOUR/NUIT
    // ================================================================
    let isDarkMode = false;

    function toggleTheme() {
        isDarkMode = !isDarkMode;
        const body = document.body;
        const appContainer = document.querySelector('.app-container');
        const header = document.querySelector('.slide-header');
        const footer = document.querySelector('.slide-footer');
        const contentCards = document.querySelectorAll('.content-card');
        const noteBoxes = document.querySelectorAll('.note-box');
        const mathBlocks = document.querySelectorAll('.math-block');
        const buttons = document.querySelectorAll('.btn');
        const statusBadge = document.querySelector('.status-badge');
        const slideCounter = document.querySelector('.slide-counter');
        const autoIndicator = document.querySelector('.auto-indicator');
        const themeBtn = document.getElementById('themeToggle');

        if (isDarkMode) {
            // Mode nuit
            body.style.background = '#0b1120';
            body.style.color = '#f1f5f9';
            appContainer.style.background = 'linear-gradient(145deg, #0f172a 0%, #1e293b 100%)';
            header.style.background = 'rgba(15, 23, 42, 0.85)';
            footer.style.background = 'rgba(15, 23, 42, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.05)';
                card.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.08)';
                note.style.color = '#cbd5e1';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.25)';
                block.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#e2e8f0';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.12)';
                statusBadge.style.color = '#93bbfc';
            }
            if (slideCounter) {
                slideCounter.style.color = '#94a3b8';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#64748b';
            }
            if (themeBtn) {
                themeBtn.textContent = '☀️';
                themeBtn.title = 'Passer en mode jour';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#e2e8f0';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#e2e8f0';
                }
            });
        } else {
            // Mode jour (par défaut)
            body.style.background = '#f0f4f8';
            body.style.color = '#1a202c';
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
            header.style.background = 'rgba(255, 255, 255, 0.85)';
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.8)';
                card.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.12)';
                note.style.color = '#2c3e50';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.05)';
                block.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#2d3748';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
                statusBadge.style.color = '#2b6cb0';
            }
            if (slideCounter) {
                slideCounter.style.color = '#4a5568';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#718096';
            }
            if (themeBtn) {
                themeBtn.textContent = '🌓';
                themeBtn.title = 'Passer en mode nuit';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#2c3e50';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#2d3748';
                }
            });
        }
    }

    // Initialiser en mode jour
    document.addEventListener('DOMContentLoaded', function() {
        // Appliquer le mode jour par défaut
        const body = document.body;
        body.style.background = '#f0f4f8';
        body.style.color = '#1a202c';
        
        const appContainer = document.querySelector('.app-container');
        if (appContainer) {
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
        }
        
        const header = document.querySelector('.slide-header');
        if (header) {
            header.style.background = 'rgba(255, 255, 255, 0.85)';
        }
        
        const footer = document.querySelector('.slide-footer');
        if (footer) {
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
        }
        
        document.querySelectorAll('.content-card').forEach(card => {
            card.style.background = 'rgba(255,255,255,0.8)';
            card.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.note-box').forEach(note => {
            note.style.background = 'rgba(96, 165, 250, 0.12)';
            note.style.color = '#2c3e50';
        });
        
        document.querySelectorAll('.math-block').forEach(block => {
            block.style.background = 'rgba(0,0,0,0.05)';
            block.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.btn').forEach(btn => {
            btn.style.color = '#2d3748';
        });
        
        const statusBadge = document.querySelector('.status-badge');
        if (statusBadge) {
            statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
            statusBadge.style.color = '#2b6cb0';
        }
        
        const slideCounter = document.querySelector('.slide-counter');
        if (slideCounter) {
            slideCounter.style.color = '#4a5568';
        }
        
        const autoIndicator = document.querySelector('.auto-indicator');
        if (autoIndicator) {
            autoIndicator.style.color = '#718096';
        }
        
        document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
            if (!el.closest('.note-box')) {
                el.style.color = '#2c3e50';
            }
        });
        
        document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
            if (!el.closest('.note-box') && !el.closest('.math-block')) {
                el.style.color = '#2d3748';
            }
        });
        
        const themeBtn = document.getElementById('themeToggle');
        if (themeBtn) {
            themeBtn.textContent = '🌓';
            themeBtn.title = 'Passer en mode nuit';
        }
    });
</script>
