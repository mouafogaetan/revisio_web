<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>
    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],

                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }
    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }
    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }
    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }
    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }
    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }
    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }
    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }
    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }
    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }
    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }
    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }
    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }
    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }
    .exercise-statement .math {
        color: #1e40af;
    }
    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }
    .question-block.revealed {
        border-left-color: #059669;
    }
    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }
    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }
    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }
    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }
    .question-answer .math {
        color: #065f46;
    }
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }
    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }
    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }
    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }
    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }
    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }
    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }
    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }
    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }
    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }
    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }
    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }
    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }
    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }
    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }
    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>
<div class="app-container">
    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>
    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>
    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>
        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>
<script>
$(function() {
    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Informatique",
  "classe": "Terminale D",
  "sequence": "Séquence 3",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "PARTIE A : ARCHITECTURE MATÉRIELLE ET MAINTENANCE",
      "points": "10 points",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 8px;'>\n  <p><strong>Exercice A1 : Évaluation des ressources - Architecture matérielle et maintenance (5 pts)</strong></p>\n</div>",
      "questions": [
        {
          "question": "<p>1) Définir un système informatique. (0.5pt)</p>",
          "reponse": "<p>Un système informatique est un ensemble de composants matériels et logiciels interconnectés qui permettent de collecter, traiter, stocker et diffuser des informations de manière automatique.</p>"
        },
        {
          "question": "<p>2) Citer les composants principaux d'un ordinateur et leurs rôles. (1.5pts)</p>",
          "reponse": "<ul><li><strong>Processeur (CPU)</strong> : unité centrale de traitement qui exécute les instructions.</li><li><strong>Mémoire vive (RAM)</strong> : mémoire de travail où sont stockées temporairement les données et programmes en cours d'exécution.</li><li><strong>Disque dur (HDD/SSD)</strong> : mémoire de masse permettant le stockage permanent des données.</li><li><strong>Carte mère</strong> : support physique qui relie tous les composants.</li></ul>"
        },
        {
          "question": "<p>3) Distinguer la mémoire RAM de la mémoire ROM. (0.5pt)</p>",
          "reponse": "<p>La <strong>RAM</strong> (Random Access Memory) est une mémoire volatile : les données sont perdues à l'extinction de l'ordinateur. Elle est utilisée pour le stockage temporaire des données en cours de traitement.</p><p>La <strong>ROM</strong> (Read Only Memory) est une mémoire non volatile : les données sont conservées même hors tension. Elle contient les instructions de démarrage (BIOS/UEFI).</p>"
        },
        {
          "question": "<p>4) Définir la maintenance préventive et la maintenance corrective. (1pt)</p>",
          "reponse": "<p>La <strong>maintenance préventive</strong> consiste à effectuer des opérations de contrôle et d'entretien régulières pour prévenir les pannes et prolonger la durée de vie du système (nettoyage, vérification des câbles, mise à jour des logiciels, etc.).</p><p>La <strong>maintenance corrective</strong> consiste à intervenir après une panne pour réparer ou remplacer le composant défaillant.</p>"
        },
        {
          "question": "<p>5) Nommer les équipements de protection d'un ordinateur. (0.5pt)</p>",
          "reponse": "<ul><li><strong>Onduleur (UPS)</strong> : protège contre les coupures et les variations de tension, permet de maintenir l'alimentation le temps de sauvegarder les données.</li><li><strong>Régulateur de tension</strong> : stabilise la tension électrique pour protéger les composants des surtensions et sous-tensions.</li></ul>"
        },
        {
          "question": "<p>6) Citer des logiciels de sécurité et leur rôle. (1pt)</p>",
          "reponse": "<ul><li><strong>Antivirus</strong> : détecte, bloque et supprime les programmes malveillants (virus, chevaux de Troie, ransomwares).</li><li><strong>Pare-feu (firewall)</strong> : contrôle les communications réseau entrantes et sortantes pour bloquer les accès non autorisés.</li><li><strong>Antispyware</strong> : détecte et supprime les logiciels espions qui collectent des données à l'insu de l'utilisateur.</li></ul>"
        }
      ]
    },
    {
      "titre": "PARTIE A : ARCHITECTURE MATÉRIELLE ET MAINTENANCE (suite)",
      "points": "",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 8px;'>\n  <p><strong>Exercice A2 : Étude de cas - Diagnostic et maintenance (5 pts)</strong></p>\n  <p>Un utilisateur signale que son ordinateur présente les symptômes suivants :</p>\n  <ul>\n    <li>L'ordinateur s'éteint brutalement sans raison apparente.</li>\n    <li>Les ventilateurs tournent très rapidement.</li>\n    <li>Certains logiciels mettent beaucoup de temps à s'ouvrir.</li>\n  </ul>\n</div>",
      "questions": [
        {
          "question": "<p>1) Identifier les causes probables de ces symptômes. (1pt)</p>",
          "reponse": "<ul><li>Surchauffe du processeur (ventilateur qui tourne vite, extinction brutale).</li><li>Poussière accumulée dans le boîtier ou sur les ventilateurs (entrave la circulation de l'air).</li><li>Pâte thermique du processeur desséchée (mauvaise dissipation de la chaleur).</li><li>Mémoire vive insuffisante ou défectueuse.</li><li>Disque dur fragmenté ou en fin de vie.</li></ul>"
        },
        {
          "question": "<p>2) Proposer un plan de maintenance préventive pour résoudre ces problèmes. (2pts)</p>",
          "reponse": "<ol><li><strong>Nettoyage interne</strong> : ouvrir le boîtier et dépoussiérer à l'aide d'une bombe à air comprimé (ventilateurs, dissipateur, carte mère).</li><li><strong>Vérification de la pâte thermique</strong> : remplacer la pâte thermique entre le processeur et le dissipateur si elle est sèche.</li><li><strong>Contrôle des températures</strong> : vérifier les températures via le BIOS ou un logiciel de monitoring.</li><li><strong>Défragmentation du disque dur</strong> (si HDD) ou optimisation du SSD.</li><li><strong>Augmentation de la RAM</strong> si la mémoire est insuffisante.</li><li><strong>Mise à jour des pilotes (drivers)</strong> et du système d'exploitation.</li></ol>"
        },
        {
          "question": "<p>3) Quels sont les risques si l'utilisateur ignore ces symptômes ? (1pt)</p>",
          "reponse": "<ul><li><strong>Endommagement irréversible du processeur</strong> (surchauffe prolongée).</li><li><strong>Perte de données</strong> (disque dur défaillant).</li><li><strong>Réduction de la durée de vie</strong> de tous les composants.</li><li><strong>Risque d'incendie</strong> dans les cas extrêmes.</li></ul>"

        {
          "question": "<p>4) Citer les équipements de protection que l'utilisateur devrait utiliser pour éviter de futures pannes. (1pt)</p>",

      "questions": [
        {
          "question": "<p>1) Définir un réseau informatique. (0.5pt)</p>",
          "reponse": "<p>Un réseau informatique est un ensemble d'ordinateurs et d'équipements interconnectés qui permettent le partage de ressources et d'informations entre les utilisateurs.</p>"
        },
        {
          "question": "<p>2) Définir Internet. (0.5pt)</p>",
          "reponse": "<p>Internet est un réseau mondial de réseaux informatiques interconnectés utilisant le protocole TCP/IP pour communiquer et échanger des données.</p>"
        },
        {
          "question": "<p>3) Distinguer les types de réseaux suivants : LAN, MAN, WAN. (1pt)</p>",
          "reponse": "<ul><li><strong>LAN</strong> (Local Area Network) : réseau local couvrant une zone restreinte (bâtiment, école, entreprise).</li><li><strong>MAN</strong> (Metropolitan Area Network) : réseau métropolitain couvrant une ville ou une région.</li><li><strong>WAN</strong> (Wide Area Network) : réseau étendu couvrant un pays, un continent ou le monde entier (ex: Internet).</li></ul>"
        },
        {
          "question": "<p>4) Citer et décrire les équipements réseau suivants : switch, routeur, modem. (1pt)</p>",
          "reponse": "<ul><li><strong>Switch (commutateur)</strong> : équipement qui relie plusieurs équipements dans un réseau LAN en utilisant les adresses MAC pour acheminer les données.</li><li><strong>Routeur</strong> : équipement qui relie différents réseaux et achemine les données en utilisant les adresses IP.</li><li><strong>Modem</strong> : équipement qui convertit les signaux numériques en signaux analogiques (et inversement) pour la transmission sur les lignes téléphoniques ou fibre optique.</li></ul>"
        },
        {
          "question": "<p>5) Décrire les topologies physiques suivantes : topologie en étoile et topologie en bus. (1pt)</p>",

    },
    {
      "titre": "PARTIE B : RÉSEAUX INFORMATIQUES ET SYSTÈMES D'INFORMATION (suite)",

      "questions": [
        {
          "question": "<p>1) Qu'est-ce qu'une adresse IPv4 ? Donner sa structure. (0.5pt)</p>",
          "reponse": "<p>Une adresse IPv4 est un numéro unique qui identifie une interface réseau sur Internet. Elle est composée de 32 bits (4 octets) écrits sous forme de 4 nombres décimaux séparés par des points (ex: 192.168.1.1).</p><p>Structure : <code>X.X.X.X</code> où chaque X est un nombre entre 0 et 255.</p>"
        },
        {
          "question": "<p>2) Déterminer la classe des adresses IP suivantes : (1pt)</p><p>a) 10.0.0.1 &nbsp;&nbsp; b) 172.16.0.1 &nbsp;&nbsp; c) 192.168.1.1 &nbsp;&nbsp; d) 8.8.8.8</p>",
          "reponse": "<ul><li>10.0.0.1 → <strong>Classe A</strong> (réseau privé)</li><li>172.16.0.1 → <strong>Classe B</strong> (réseau privé)</li><li>192.168.1.1 → <strong>Classe C</strong> (réseau privé)</li><li>8.8.8.8 → <strong>Classe A</strong> (adresse publique de Google)</li></ul>"
        },
        {
          "question": "<p>3) Distinguer l'adressage statique de l'adressage dynamique. (0.5pt)</p>",
          "reponse": "<ul><li><strong>Adressage statique</strong> : les adresses IP sont attribuées manuellement et restent fixes. Utilisé pour les serveurs.</li><li><strong>Adressage dynamique</strong> : les adresses IP sont attribuées automatiquement par un serveur DHCP à chaque connexion. Utilisé pour les postes clients.</li></ul>"
        },
        {
          "question": "<p>4) Expliquer le rôle des commandes réseau <code>ipconfig</code> et <code>ping</code>. (1pt)</p>",
          "reponse": "<ul><li><code>ipconfig</code> (sur Windows) / <code>ifconfig</code> (sur Linux) : permet d'afficher et de configurer les paramètres réseau d'une machine (adresse IP, masque de sous-réseau, passerelle).</li><li><code>ping</code> : permet de tester la connectivité entre deux machines en envoyant des paquets ICMP et en mesurant le temps de réponse. Utile pour diagnostiquer les problèmes de réseau.</li></ul>"
        }
      ]
    },
    {

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};
    const totalExercises = examData.exercices.length;
    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');
    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;
        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);
        // Construire le contenu
        let html = '';
        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;
        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;
            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });
        html += `</div>`;
        $body.html(html);
        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);
        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }
        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }
    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }
        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;
        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);
        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }
    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }
    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }
    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }
    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }
    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }
    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });
        // Afficher le premier exercice
        renderExercise(0);
        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);
        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }
    init();
});
</script>
</body>
</html>
