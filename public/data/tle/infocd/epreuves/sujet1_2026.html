<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>
    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }
    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }
    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }
    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }
    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }
    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }
    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }
    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }
    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }
    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }
    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }
    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }
    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }
    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }
    .exercise-statement .math {
        color: #1e40af;
    }
    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }
    .question-block.revealed {
        border-left-color: #059669;
    }
    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }
    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }
    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }
    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }
    .question-answer .math {
        color: #065f46;
    }
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }
    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }
    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }
    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }
    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }
    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }
    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }
    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }
    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }
    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }
    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }
    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }
    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }
    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }
    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }
    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>
<div class="app-container">
    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>
    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>
    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>
        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>
<script>
$(function() {
    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Informatique",
  "classe": "Terminale D",
  "sequence": "Séquence 1",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Évaluation des ressources - Algorithmique (Ressources)",
      "points": "5 points",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 8px;'>\n  <p>Répondre aux questions suivantes :</p>\n</div>",
      "questions": [
        {
          "question": "<p>1) Définir un algorithme. (0.5pt)</p>",
          "reponse": "<p>Un algorithme est une suite finie et ordonnée d'instructions permettant de résoudre un problème donné.</p>"
        },
        {
          "question": "<p>2) Citer les différentes parties qui composent un algorithme. (1pt)</p>",
          "reponse": "<p>Un algorithme est composé de :</p><ul><li><strong>En-tête</strong> : nom de l'algorithme</li><li><strong>Section des déclarations</strong> : variables, constantes, types</li><li><strong>Corps</strong> : instructions (saisie, affectation, test, boucle, sortie)</li></ul>"
        },
        {
          "question": "<p>3) Donner le rôle des structures conditionnelles (Si...Alors...Sinon) et des structures itératives (boucles). (1pt)</p>",
          "reponse": "<p>Les <strong>structures conditionnelles</strong> permettent d'orienter le flux d'exécution en fonction d'une condition (choix binaire ou multiple).</p><p>Les <strong>structures itératives</strong> (boucles) permettent d'exécuter un bloc d'instructions de manière répétitive tant qu'une condition est vérifiée.</p>"
        },
        {
          "question": "<p>4) Donner la différence entre la boucle <code>Pour</code> et la boucle <code>Tant que</code>. (1pt)</p>",
          "reponse": "<ul><li>La boucle <strong>Pour</strong> est utilisée lorsqu'on connaît à l'avance le nombre d'itérations (compteur).</li><li>La boucle <strong>Tant que</strong> est utilisée lorsqu'on ne connaît pas le nombre d'itérations et qu'on s'arrête lorsque la condition devient fausse (arrêt sur condition).</li></ul>"
        },
        {
          "question": "<p>5) Déclarer un tableau d'entiers de taille 8 en langage naturel. (0.5pt)</p>",
          "reponse": "<p><code>var tab : tableau[8] d'entiers</code></p><p>ou</p><p><code>var tab[8] : entiers</code></p>"
        },
        {
          "question": "<p>6) Déclarer un enregistrement <code>Etudiant</code> avec les attributs : nom, prenom, age, moyenne. (1pt)</p>",
          "reponse": "<div style='background: #f1f5f9; padding: 10px; border-radius: 6px; font-family: monospace;'>\n  Type Etudiant = enregistrement<br>\n  &nbsp;&nbsp;nom : chaine<br>\n  &nbsp;&nbsp;prenom : chaine<br>\n  &nbsp;&nbsp;age : entier<br>\n  &nbsp;&nbsp;moyenne : réel<br>\n  FinEnregistrement<br>\n</div>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Évaluation des ressources - Langage C (Ressources)",
      "points": "3 points",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 8px;'>\n  <p>Répondre aux questions suivantes sur le langage C :</p>\n</div>",
      "questions": [
        {
          "question": "<p>1) Définir un langage de programmation et un programme. (1pt)</p>",
          "reponse": "<p>Un <strong>langage de programmation</strong> est un ensemble de règles et de conventions permettant d'écrire des instructions compréhensibles par un ordinateur.</p><p>Un <strong>programme</strong> est un ensemble d'instructions écrites dans un langage de programmation, destiné à être exécuté par un ordinateur pour réaliser une tâche spécifique.</p>"
        },
        {
          "question": "<p>2) Citer 04 langages de programmation. (1pt)</p>",
          "reponse": "<p>Quatre langages de programmation :</p><ul><li>C</li><li>Python</li><li>Java</li><li>PHP</li></ul>"
        },
        {
          "question": "<p>3) Donner le type correspondant en langage C pour : entier, réel, caractère, chaîne de caractères. (1pt)</p>",
          "reponse": "<ul><li><strong>entier</strong> : <code>int</code></li><li><strong>réel</strong> : <code>float</code> (ou <code>double</code>)</li><li><strong>caractère</strong> : <code>char</code></li><li><strong>chaîne de caractères</strong> : <code>char[]</code> ou <code>char*</code></li></ul>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Exécution d'algorithme (Ressources)",
      "points": "2 points",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 8px;'>\n  <p>On considère l'algorithme suivant :</p>\n  <div style='background: #f1f5f9; padding: 10px; border-radius: 6px; font-family: monospace;'>\n    Algorithme test<br>\n    Variables : a, b, c : entiers<br>\n    Début<br>\n    &nbsp;&nbsp;Lire(a)<br>\n    &nbsp;&nbsp;Lire(b)<br>\n    &nbsp;&nbsp;c ← 0<br>\n    &nbsp;&nbsp;Si (a > b) Alors<br>\n    &nbsp;&nbsp;&nbsp;&nbsp;c ← a + b<br>\n    &nbsp;&nbsp;&nbsp;&nbsp;Si (c > 10) Alors<br>\n    &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;c ← c * 2<br>\n    &nbsp;&nbsp;&nbsp;&nbsp;FinSi<br>\n    &nbsp;&nbsp;Sinon<br>\n    &nbsp;&nbsp;&nbsp;&nbsp;c ← a * b<br>\n    &nbsp;&nbsp;FinSi<br>\n    &nbsp;&nbsp;Afficher(c)<br>\n    Fin<br>\n  </div>\n</div>",
      "questions": [
        {
          "question": "<p>1) Exécuter cet algorithme pour les valeurs a = 12 et b = 5. Qu'affiche-t-il ?</p>",
          "reponse": "<p>a = 12, b = 5</p><p>Condition a > b ? 12 > 5 Vrai</p><p>c = a + b = 12 + 5 = 17</p><p>Condition c > 10 ? 17 > 10 Vrai</p><p>c = 17 * 2 = 34</p><p>L'algorithme affiche 34.</p>"
        },
        {
          "question": "<p>2) Exécuter cet algorithme pour a = 4 et b = 7. Qu'affiche-t-il ?</p>",
          "reponse": "<p>a = 4, b = 7</p><p>Condition a > b ? 4 > 7 Faux</p><p>c = a * b = 4 * 7 = 28</p><p>L'algorithme affiche 28.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Exécution d'algorithme avec tableau (Ressources)",
      "points": "3 points",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 8px;'>\n  <p>On considère l'algorithme suivant qui travaille sur un tableau :</p>\n  <div style='background: #f1f5f9; padding: 10px; border-radius: 6px; font-family: monospace;'>\n    Algorithme recherche_nom<br>\n    Variables : tab[5] : chaines, i : entier, nom : chaine, trouve : booléen<br>\n    Début<br>\n    &nbsp;&nbsp;tab[1] ← 'Diallo'<br>\n    &nbsp;&nbsp;tab[2] ← 'Kone'<br>\n    &nbsp;&nbsp;tab[3] ← 'Traore'<br>\n    &nbsp;&nbsp;tab[4] ← 'Coulibaly'<br>\n    &nbsp;&nbsp;tab[5] ← 'Bamba'<br>\n    &nbsp;&nbsp;Lire(nom)<br>\n    &nbsp;&nbsp;trouve ← faux<br>\n    &nbsp;&nbsp;Pour i de 1 à 5 faire<br>\n    &nbsp;&nbsp;&nbsp;&nbsp;Si (tab[i] = nom) Alors<br>\n    &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;trouve ← vrai<br>\n    &nbsp;&nbsp;&nbsp;&nbsp;FinSi<br>\n    &nbsp;&nbsp;FinPour<br>\n    &nbsp;&nbsp;Si (trouve = vrai) Alors<br>\n    &nbsp;&nbsp;&nbsp;&nbsp;Afficher(nom + ' existe dans le tableau')<br>\n    &nbsp;&nbsp;Sinon<br>\n    &nbsp;&nbsp;&nbsp;&nbsp;Afficher(nom + ' n'existe pas dans le tableau')<br>\n    &nbsp;&nbsp;FinSi<br>\n    Fin<br>\n  </div>\n</div>",
      "questions": [
        {
          "question": "<p>1) Exécuter cet algorithme pour les valeurs saisies : nom = 'Traore'. Qu'affiche-t-il ?</p>",
          "reponse": "<p>Le tableau contient : Diallo, Kone, Traore, Coulibaly, Bamba.</p><p>On recherche 'Traore'.</p><p>Parcours :</p><ul><li>i=1 : tab[1]='Diallo' ≠ 'Traore'</li><li>i=2 : tab[2]='Kone' ≠ 'Traore'</li><li>i=3 : tab[3]='Traore' = 'Traore' → trouve = vrai</li><li>i=4 : tab[4]='Coulibaly' ≠ 'Traore'</li><li>i=5 : tab[5]='Bamba' ≠ 'Traore'</li></ul><p>trouve = vrai, donc l'algorithme affiche : 'Traore existe dans le tableau'</p>"
        },
        {
          "question": "<p>2) Exécuter cet algorithme pour nom = 'Soro'. Qu'affiche-t-il ?</p>",
          "reponse": "<p>On recherche 'Soro'.</p><p>Parcours : 'Soro' n'est présent dans aucune case du tableau.</p><p>trouve reste faux, donc l'algorithme affiche : 'Soro n'existe pas dans le tableau'</p>"
        },
        {
          "question": "<p>3) Que fait cet algorithme en général ?</p>",
          "reponse": "<p>Cet algorithme réalise une recherche séquentielle (ou linéaire) d'un nom dans un tableau de 5 noms et affiche si le nom est présent ou non.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 5 : Synthèse - Algorithme et traduction en C (Compétences)",
      "points": "5 points",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 12px;'>\n  <p>Un professeur souhaite créer un programme qui lit les notes de 5 élèves, calcule la moyenne de la classe, détermine la note maximale et minimale, et affiche le nombre d'élèves ayant une note supérieure ou égale à 10.</p>\n  <p>L'algorithme suivant a été proposé :</p>\n  <div style='background: #f1f5f9; padding: 10px; border-radius: 6px; font-family: monospace;'>\n    Algorithme statistiques<br>\n    Variables : notes[5], i, somme, max, min, nb_sup : entiers<br>\n    Variables : moyenne : réel<br>\n    Début<br>\n    &nbsp;&nbsp;Pour i de 0 à 4 faire<br>\n    &nbsp;&nbsp;&nbsp;&nbsp;Lire(notes[i])<br>\n    &nbsp;&nbsp;FinPour<br>\n    &nbsp;&nbsp;somme ← 0<br>\n    &nbsp;&nbsp;nb_sup ← 0<br>\n    &nbsp;&nbsp;max ← notes[0]<br>\n    &nbsp;&nbsp;min ← notes[0]<br>\n    &nbsp;&nbsp;Pour i de 0 à 4 faire<br>\n    &nbsp;&nbsp;&nbsp;&nbsp;somme ← somme + notes[i]<br>\n    &nbsp;&nbsp;&nbsp;&nbsp;Si (notes[i] > max) Alors<br>\n    &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;max ← notes[i]<br>\n    &nbsp;&nbsp;&nbsp;&nbsp;FinSi<br>\n    &nbsp;&nbsp;&nbsp;&nbsp;Si (notes[i] < min) Alors<br>\n    &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;min ← notes[i]<br>\n    &nbsp;&nbsp;&nbsp;&nbsp;FinSi<br>\n    &nbsp;&nbsp;&nbsp;&nbsp;Si (notes[i] >= 10) Alors<br>\n    &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;nb_sup ← nb_sup + 1<br>\n    &nbsp;&nbsp;&nbsp;&nbsp;FinSi<br>\n    &nbsp;&nbsp;FinPour<br>\n    &nbsp;&nbsp;moyenne ← somme / 5<br>\n    &nbsp;&nbsp;Afficher(moyenne)<br>\n    &nbsp;&nbsp;Afficher(max)<br>\n    &nbsp;&nbsp;Afficher(min)<br>\n    &nbsp;&nbsp;Afficher(nb_sup)<br>\n    Fin<br>\n  </div>\n</div>",
      "questions": [

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};
    const totalExercises = examData.exercices.length;
    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');
    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;
        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);
        // Construire le contenu
        let html = '';
        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;
        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;
            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });
        html += `</div>`;
        $body.html(html);
        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);
        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }
        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }
    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }
        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;
        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);
        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }
    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }
    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }
    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }
    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }
    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }
    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });
        // Afficher le premier exercice
        renderExercise(0);
        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);
        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }
    init();
});
</script>
