<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>
    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }
    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }
    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }
    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }
    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }
    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }
    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }
    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }
    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }
    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }
    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }
    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }
    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }
    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }
    .exercise-statement .math {
        color: #1e40af;
    }
    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }
    .question-block.revealed {
        border-left-color: #059669;
    }
    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }
    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }
    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }
    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }
    .question-answer .math {
        color: #065f46;
    }
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }
    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }
    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }
    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }
    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }
    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }
    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }
    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }
    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }
    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }
    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }
    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }
    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }
    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }
    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }
    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>
<div class="app-container">
    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>
    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>
    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>
        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>
<script>
$(function() {
    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Mathématiques",
  "classe": "Terminale D",
  "sequence": "Séquence 2",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Fonctions numériques - Continuité et dérivabilité (Ressources)",
      "points": "3.75 points",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 8px;'>\n  <p>On considère la fonction \\( f \\) définie sur \\( \\mathbb{R} \\) par :</p>\n  <div style='background: #f1f5f9; padding: 10px; border-radius: 6px;'>\n    <p class='math'>\\( f(x) = \\begin{cases} \\dfrac{x^2 - 1}{x - 1} & \\text{si } x \\neq 1 \\\\ a & \\text{si } x = 1 \\end{cases} \\)</p>\n  </div>\n</div>",
      "questions": [
        {
          "question": "<p>1) Déterminer la valeur de \\( a \\) pour que \\( f \\) soit continue en \\( x = 1 \\). (0.5pt)</p>",
          "reponse": "<p>Pour que \\( f \\) soit continue en 1, il faut que \\( \\lim\\limits_{x \\to 1} f(x) = f(1) = a \\).</p><p>\\( \\lim\\limits_{x \\to 1} \\dfrac{x^2 - 1}{x - 1} = \\lim\\limits_{x \\to 1} \\dfrac{(x-1)(x+1)}{x-1} = \\lim\\limits_{x \\to 1} (x+1) = 2 \\)</p><p>Donc \\( a = 2 \\).</p>"
        },
        {
          "question": "<p>2) Étudier la dérivabilité de \\( f \\) en \\( x = 1 \\). (0.75pt)</p>",
          "reponse": "<p>On a \\( f(1) = 2 \\).</p><p>\\( \\lim\\limits_{x \\to 1} \\dfrac{f(x) - f(1)}{x - 1} = \\lim\\limits_{x \\to 1} \\dfrac{x+1 - 2}{x-1} = \\lim\\limits_{x \\to 1} \\dfrac{x-1}{x-1} = 1 \\)</p><p>Donc \\( f \\) est dérivable en 1 et \\( f'(1) = 1 \\).</p>"
        },
        {
          "question": "<p>3) Montrer que l'équation \\( f(x) = 0 \\) admet une solution unique dans \\( [0; 2] \\). (1pt)</p>",
          "reponse": "<p>Pour \\( x \\neq 1 \\), \\( f(x) = x+1 \\).</p><p>\\( f(x) = 0 \\Rightarrow x+1 = 0 \\Rightarrow x = -1 \\notin [0; 2] \\).</p><p>Donc l'équation n'a pas de solution dans \\( [0; 2] \\).</p><p><strong>Correction :</strong> Sur \\( [0; 2] \\), \\( f(x) = x+1 > 0 \\), donc \\( f(x) = 0 \\) n'a pas de solution.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Fonctions logarithmes et exponentielles - Étude complète (Ressources)",
      "points": "3.75 points",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 8px;'>\n  <p>On considère la fonction \\( g \\) définie sur \\( ]0; +\\infty[ \\) par :</p>\n  <div style='background: #f1f5f9; padding: 10px; border-radius: 6px;'>\n    <p class='math'>\\( g(x) = x \\ln x - x \\)</p>\n  </div>\n</div>",
      "questions": [
        {
          "question": "<p>1) Calculer les limites de \\( g \\) en 0 et en \\( +\\infty \\). (0.5pt)</p>",
          "reponse": "<p>En 0 : \\( \\lim\\limits_{x \\to 0^+} x \\ln x = 0 \\) (limite de référence), donc \\( \\lim\\limits_{x \\to 0^+} g(x) = 0 - 0 = 0 \\).</p><p>En \\( +\\infty \\) : \\( \\lim\\limits_{x \\to +\\infty} g(x) = \\lim\\limits_{x \\to +\\infty} x(\\ln x - 1) = +\\infty \\) car \\( \\ln x - 1 \\to +\\infty \\).</p>"
        },
        {
          "question": "<p>2) Déterminer \\( g'(x) \\) et dresser le tableau des variations de \\( g \\). (1pt)</p>",
          "reponse": "<p>\\( g'(x) = \\ln x + 1 - 1 = \\ln x \\)</p><p>\\( g'(x) > 0 \\iff \\ln x > 0 \\iff x > 1 \\)</p><p>Tableau de variations :</p><div style='background: #f1f5f9; padding: 10px; border-radius: 6px;'>\n  <table style='width: 80%; border-collapse: collapse; margin: auto;'>\n    <tr><td style='padding: 4px; border: 1px solid #ddd;'><span class='math'>x</span></td><td style='padding: 4px; border: 1px solid #ddd;'>0</td><td style='padding: 4px; border: 1px solid #ddd;'></td><td style='padding: 4px; border: 1px solid #ddd;'>1</td><td style='padding: 4px; border: 1px solid #ddd;'></td><td style='padding: 4px; border: 1px solid #ddd;'><span class='math'>+∞</span></td></tr>\n    <tr><td style='padding: 4px; border: 1px solid #ddd;'><span class='math'>g'(x)</span></td><td style='padding: 4px; border: 1px solid #ddd;'></td><td style='padding: 4px; border: 1px solid #ddd;'>-</td><td style='padding: 4px; border: 1px solid #ddd;'>0</td><td style='padding: 4px; border: 1px solid #ddd;'>+</td><td style='padding: 4px; border: 1px solid #ddd;'></td></tr>\n    <tr><td style='padding: 4px; border: 1px solid #ddd;'><span class='math'>g</span></td><td style='padding: 4px; border: 1px solid #ddd;'>0</td><td style='padding: 4px; border: 1px solid #ddd;'>↘</td><td style='padding: 4px; border: 1px solid #ddd;'>-1</td><td style='padding: 4px; border: 1px solid #ddd;'>↗</td><td style='padding: 4px; border: 1px solid #ddd;'><span class='math'>+∞</span></td></tr>\n  </table>\n</div>"
        },
        {
          "question": "<p>3) Montrer que l'équation \\( g(x) = 0 \\) admet une solution unique \\( x_0 \\) dans \\( [2; 3] \\). (0.5pt)</p>",
          "reponse": "<p>Sur \\( [1; +\\infty[ \\), \\( g \\) est continue et strictement croissante.</p><p>\\( g(2) = 2\\ln 2 - 2 = 2(\\ln 2 - 1) \\approx 2(0.69 - 1) = -0.62 < 0 \\)</p><p>\\( g(3) = 3\\ln 3 - 3 = 3(\\ln 3 - 1) \\approx 3(1.10 - 1) = 0.30 > 0 \\)</p><p>D'après le théorème des valeurs intermédiaires, l'équation \\( g(x) = 0 \\) admet une solution unique \\( x_0 \\in [2; 3] \\).</p>"
        },
        {
          "question": "<p>4) Déterminer une primitive de \\( g \\) sur \\( ]0; +\\infty[ \\). (0.75pt)</p>",
          "reponse": "<p>\\( G(x) = \\int (x\\ln x - x) dx = \\int x\\ln x \\, dx - \\int x \\, dx \\)</p><p>Pour \\( \\int x\\ln x \\, dx \\), on utilise une intégration par parties :</p><p>\\( u = \\ln x \\), \\( v' = x \\Rightarrow u' = \\dfrac{1}{x} \\), \\( v = \\dfrac{x^2}{2} \\)</p><p>\\( \\int x\\ln x \\, dx = \\dfrac{x^2}{2}\\ln x - \\int \\dfrac{x^2}{2} \\times \\dfrac{1}{x} dx = \\dfrac{x^2}{2}\\ln x - \\dfrac{1}{2}\\int x \\, dx = \\dfrac{x^2}{2}\\ln x - \\dfrac{x^2}{4} \\)</p><p>Donc \\( G(x) = \\dfrac{x^2}{2}\\ln x - \\dfrac{x^2}{4} - \\dfrac{x^2}{2} + C = \\dfrac{x^2}{2}\\ln x - \\dfrac{3x^2}{4} + C \\)</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Suites numériques - Suites définies par récurrence (Ressources)",
      "points": "2.5 points",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 8px;'>\n  <p>On considère la suite \\( (u_n) \\) définie par :</p>\n  <div style='background: #f1f5f9; padding: 10px; border-radius: 6px;'>\n    <p class='math'>\\( u_0 = 2 \\) et pour tout \\( n \\in \\mathbb{N} \\), \\( u_{n+1} = \\dfrac{3u_n + 2}{u_n + 4} \\)</p>\n  </div>\n</div>",
      "questions": [
        {
          "question": "<p>1) Montrer par récurrence que pour tout \\( n \\in \\mathbb{N} \\), \\( 1 \\le u_n \\le 2 \\). (1pt)</p>",
          "reponse": "<p>Initialisation : \\( u_0 = 2 \\), donc \\( 1 \\le u_0 \\le 2 \\).</p><p>Hérédité : Supposons que \\( 1 \\le u_n \\le 2 \\).</p><p>La fonction \\( f(x) = \\dfrac{3x+2}{x+4} \\) est définie et continue sur \\( [1; 2] \\).</p><p>\\( f(1) = \\dfrac{3+2}{1+4} = 1 \\) et \\( f(2) = \\dfrac{6+2}{2+4} = \\dfrac{8}{6} = \\dfrac{4}{3} \\le 2 \\)</p><p>Comme \\( f \\) est croissante sur \\( [1; 2] \\) (car \\( f'(x) = \\dfrac{10}{(x+4)^2} > 0 \\)), on a \\( 1 \\le u_{n+1} = f(u_n) \\le \\dfrac{4}{3} \\le 2 \\).</p><p>Donc \\( 1 \\le u_{n+1} \\le 2 \\).</p><p>La propriété est vraie pour tout \\( n \\in \\mathbb{N} \\).</p>"
        },
        {
          "question": "<p>2) Étudier le sens de variation de la suite \\( (u_n) \\). (0.75pt)</p>",
          "reponse": "<p>\\( u_{n+1} - u_n = \\dfrac{3u_n + 2}{u_n + 4} - u_n = \\dfrac{3u_n + 2 - u_n(u_n + 4)}{u_n + 4} = \\dfrac{3u_n + 2 - u_n^2 - 4u_n}{u_n + 4} = \\dfrac{-u_n^2 - u_n + 2}{u_n + 4} = \\dfrac{-(u_n + 2)(u_n - 1)}{u_n + 4} \\)</p><p>Sur \\( [1; 2] \\), \\( u_n + 2 > 0 \\) et \\( u_n - 1 \\ge 0 \\), donc \\( u_{n+1} - u_n \\le 0 \\).</p><p>La suite \\( (u_n) \\) est <strong>décroissante</strong>.</p>"
        },
        {
          "question": "<p>3) En déduire que la suite \\( (u_n) \\) converge et déterminer sa limite. (0.75pt)</p>",
          "reponse": "<p>La suite \\( (u_n) \\) est décroissante et minorée par 1, donc elle converge vers une limite \\( l \\).</p><p>Comme \\( u_{n+1} = f(u_n) \\) avec \\( f \\) continue, la limite \\( l \\) vérifie \\( l = f(l) \\) :</p><p>\\( l = \\dfrac{3l + 2}{l + 4} \\Rightarrow l(l+4) = 3l + 2 \\Rightarrow l^2 + 4l = 3l + 2 \\Rightarrow l^2 + l - 2 = 0 \\Rightarrow (l+2)(l-1) = 0 \\)</p><p>Les solutions sont \\( l = -2 \\) ou \\( l = 1 \\).</p><p>Comme \\( 1 \\le u_n \\le 2 \\), on a \\( l \\ge 1 \\), donc \\( l = 1 \\).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Synthèse - Fonctions, suites et logarithmes (Compétences)",
      "points": "5 points",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 12px;'>\n  <p>Une entreprise de production de café souhaite modéliser l'évolution de sa production annuelle. La production (en tonnes) est modélisée par la fonction \\( P \\) définie sur \\( [0; +\\infty[ \\) par :</p>\n  <div style='background: #f1f5f9; padding: 10px; border-radius: 6px;'>\n    <p class='math'>\\( P(x) = 2x e^{-x/2} \\)</p>\n  </div>\n  <p>où \\( x \\) est le temps écoulé en années depuis le début de l'exploitation.</p>\n  <p>Par ailleurs, les recettes annuelles (en millions de FCFA) sont données par \\( R(x) = 100P(x) \\).</p>\n  <p>Le gérant souhaite connaître l'évolution de sa production et le moment où celle-ci atteint son maximum.</p>\n</div>",
      "questions": [

          "question": "<p>1) Étudier les variations de la fonction \\( P \\) sur \\( [0; +\\infty[ \\). Déterminer la production maximale. (2pts)</p>",
          "reponse": "<p>\\( P(x) = 2x e^{-x/2} \\)</p><p>\\( P'(x) = 2e^{-x/2} + 2x \\times \\left(-\\dfrac{1}{2}\\right)e^{-x/2} = 2e^{-x/2} - x e^{-x/2} = (2 - x)e^{-x/2} \\)</p><p>\\( P'(x) > 0 \\iff 2 - x > 0 \\iff x < 2 \\)</p><p>\\( P'(x) < 0 \\iff x > 2 \\)</p><p>Tableau de variations :</p><div style='background: #f1f5f9; padding: 10px; border-radius: 6px;'>\n  <table style='width: 80%; border-collapse: collapse; margin: auto;'>\n    <tr><td style='padding: 4px; border: 1px solid #ddd;'><span class='math'>x</span></td><td style='padding: 4px; border: 1px solid #ddd;'>0</td><td style='padding: 4px; border: 1px solid #ddd;'></td><td style='padding: 4px; border: 1px solid #ddd;'>2</td><td style='padding: 4px; border: 1px solid #ddd;'></td><td style='padding: 4px; border: 1px solid #ddd;'><span class='math'>+∞</span></td></tr>\n    <tr><td style='padding: 4px; border: 1px solid #ddd;'><span class='math'>P'(x)</span></td><td style='padding: 4px; border: 1px solid #ddd;'></td><td style='padding: 4px; border: 1px solid #ddd;'>+</td><td style='padding: 4px; border: 1px solid #ddd;'>0</td><td style='padding: 4px; border: 1px solid #ddd;'>-</td><td style='padding: 4px; border: 1px solid #ddd;'></td></tr>\n    <tr><td style='padding: 4px; border: 1px solid #ddd;'><span class='math'>P</span></td><td style='padding: 4px; border: 1px solid #ddd;'>0</td><td style='padding: 4px; border: 1px solid #ddd;'>↗</td><td style='padding: 4px; border: 1px solid #ddd;'><span class='math'>\\dfrac{4}{e}</span></td><td style='padding: 4px; border: 1px solid #ddd;'>↘</td><td style='padding: 4px; border: 1px solid #ddd;'>0</td></tr>\n  </table>\n</div>\n<p>Production maximale : \\( P_{max} = P(2) = 4e^{-1} = \\dfrac{4}{e} \\approx 1.47 \\) tonnes.</p>"
        },
        {
          "question": "<p>2) Déterminer la limite de \\( P(x) \\) en \\( +\\infty \\). Interpréter le résultat. (0.5pt)</p>",
          "reponse": "<p>\\( \\lim\\limits_{x \\to +\\infty} P(x) = \\lim\\limits_{x \\to +\\infty} 2x e^{-x/2} = 0 \\) (croissance comparée de l'exponentielle par rapport aux puissances).</p><p>La production tend vers 0, ce qui signifie que l'exploitation n'est plus rentable à long terme.</p>"
        },
        {
          "question": "<p>3) Justifier que l'équation \\( P(x) = 1 \\) admet deux solutions dans \\( [0; +\\infty[ \\). (1.5pts)</p>",
          "reponse": "<p>Sur \\( [0; 2] \\), \\( P \\) est continue et strictement croissante, avec \\( P(0) = 0 \\) et \\( P(2) = \\dfrac{4}{e} \\approx 1.47 \\).</p><p>Comme \\( 1 \\in \\left[0; \\dfrac{4}{e}\\right] \\), l'équation \\( P(x) = 1 \\) admet une solution unique \\( x_1 \\in [0; 2] \\).</p><p>Sur \\( [2; +\\infty[ \\), \\( P \\) est continue et strictement décroissante, avec \\( P(2) = \\dfrac{4}{e} \\approx 1.47 \\) et \\( \\lim\\limits_{x \\to +\\infty} P(x) = 0 \\).</p><p>Comme \\( 1 \\in \\left[0; \\dfrac{4}{e}\\right] \\), l'équation \\( P(x) = 1 \\) admet une solution unique \\( x_2 \\in [2; +\\infty[ \\).</p><p>Donc l'équation \\( P(x) = 1 \\) admet deux solutions positives.</p>"

        {
          "question": "<p>4) Déterminer la recette maximale. (1pt)</p>",
          "reponse": "<p>\\( R(x) = 100P(x) \\) atteint son maximum lorsque \\( P \\) atteint son maximum, soit en \\( x = 2 \\).</p><p>\\( R_{max} = 100 \\times P(2) = 100 \\times \\dfrac{4}{e} = \\dfrac{400}{e} \\approx 147.2 \\) millions de FCFA.</p>"

};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};
    const totalExercises = examData.exercices.length;
    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');
    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;
        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);
        // Construire le contenu
        let html = '';
        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;
        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;
            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });
        html += `</div>`;
        $body.html(html);
        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);
        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }
        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }
    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }
        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;
        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);
        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }
    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }
    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }
    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }
    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }
    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }
    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });
        // Afficher le premier exercice
        renderExercise(0);
        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);
        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }
    init();
});
</script>
</body>
</html>
