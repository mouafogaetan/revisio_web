<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>
    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }
    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }
    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }
    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }
    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }
    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }
    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }
    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }
    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }
    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }
    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }
    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }
    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }
    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }
    .exercise-statement .math {
        color: #1e40af;
    }
    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }
    .question-block.revealed {
        border-left-color: #059669;
    }
    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }
    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }
    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }
    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }
    .question-answer .math {
        color: #065f46;
    }
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }
    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }
    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }
    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }
    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }
    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }
    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }
    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }
    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }
    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }
    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }
    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }
    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }
    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }
    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }
    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>
<div class="app-container">
    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>
    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>
    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>
        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>
<script>
$(function() {
    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Mathématiques",
  "classe": "Terminale D",
  "sequence": "Séquence 1",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Nombres complexes - Forme algébrique et équations (Ressources)",
      "points": "3.75 points",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 8px;'>\n  <p>Le plan complexe est muni d'un repère orthonormé \\( (O; \\vec{u}; \\vec{v}) \\).</p>\n  <p>On considère les nombres complexes suivants :</p>\n  <div style='background: #f1f5f9; padding: 10px; border-radius: 6px;'>\n    <p class='math'>\\( z_1 = 2 + 3i \\quad ; \\quad z_2 = 1 - i \\quad ; \\quad z_3 = \\dfrac{z_1}{z_2} \\)</p>\n  </div>\n</div>",
      "questions": [
        {
          "question": "<p>1) Déterminer la partie réelle et la partie imaginaire de \\( z_1 \\), \\( z_2 \\) et \\( z_3 \\). (0.5pt)</p>",
          "reponse": "<p>\\( z_1 = 2 + 3i \\) : \\( Re(z_1) = 2 \\), \\( Im(z_1) = 3 \\)</p><p>\\( z_2 = 1 - i \\) : \\( Re(z_2) = 1 \\), \\( Im(z_2) = -1 \\)</p><p>\\( z_3 = \\dfrac{2+3i}{1-i} = \\dfrac{(2+3i)(1+i)}{(1-i)(1+i)} = \\dfrac{2+2i+3i+3i^2}{1+1} = \\dfrac{2+5i-3}{2} = \\dfrac{-1+5i}{2} = -\\dfrac{1}{2} + \\dfrac{5}{2}i \\)</p><p>\\( Re(z_3) = -\\dfrac{1}{2} \\), \\( Im(z_3) = \\dfrac{5}{2} \\)</p>"
        },
        {
          "question": "<p>2) Calculer le module et le conjugué de \\( z_2 \\). (0.5pt)</p>",
          "reponse": "<p>\\( |z_2| = |1-i| = \\sqrt{1^2+(-1)^2} = \\sqrt{2} \\)</p><p>\\( \\overline{z_2} = 1 + i \\)</p>"
        },
        {
          "question": "<p>3) Résoudre dans \\( \\mathbb{C} \\) l'équation : \\( z^2 - 4z + 13 = 0 \\). (1pt)</p>",
          "reponse": "<p>\\( \\Delta = (-4)^2 - 4(1)(13) = 16 - 52 = -36 = (6i)^2 \\)</p><p>Les solutions sont : \\( z_1 = \\dfrac{4 + 6i}{2} = 2 + 3i \\) et \\( z_2 = \\dfrac{4 - 6i}{2} = 2 - 3i \\).</p>"
        },
        {
          "question": "<p>4) Déterminer les racines carrées complexes du nombre \\( z = -5 + 12i \\). (1pt)</p>",
          "reponse": "<p>On cherche \\( a \\) et \\( b \\) réels tels que \\( (a+ib)^2 = -5 + 12i \\).</p><p>\\( \\begin{cases} a^2 - b^2 = -5 \\\\ 2ab = 12 \\end{cases} \\)</p><p>On a \\( a^2 + b^2 = |z| = \\sqrt{(-5)^2+12^2} = \\sqrt{25+144} = \\sqrt{169} = 13 \\)</p><p>Donc \\( a^2 = \\dfrac{13 + (-5)}{2} = 4 \\Rightarrow a = \\pm 2 \\)</p><p>et \\( b^2 = \\dfrac{13 - (-5)}{2} = 9 \\Rightarrow b = \\pm 3 \\)</p><p>Comme \\( 2ab = 12 > 0 \\), \\( a \\) et \\( b \\) sont de même signe.</p><p>Les racines sont : \\( 2 + 3i \\) et \\( -2 - 3i \\).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Nombres complexes - Approche géométrique (Ressources)",
      "points": "3.75 points",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 8px;'>\n  <p>Le plan complexe est muni d'un repère orthonormé \\( (O; \\vec{u}; \\vec{v}) \\).</p>\n  <p>On considère les points \\( A \\), \\( B \\) et \\( C \\) d'affixes respectives :</p>\n  <div style='background: #f1f5f9; padding: 10px; border-radius: 6px;'>\n    <p class='math'>\\( z_A = 1 + i \\), \\( z_B = 3 + 3i \\), \\( z_C = 5 - i \\)</p>\n  </div>\n  <p>On considère l'application \\( S \\) du plan dans lui-même qui à tout point \\( M \\) d'affixe \\( z \\) associe le point \\( M' \\) d'affixe :</p>\n  <div style='background: #f1f5f9; padding: 10px; border-radius: 6px;'>\n    <p class='math'>\\( z' = (1 + i)z + 1 - 2i \\)</p>\n  </div>\n</div>",
      "questions": [
        {
          "question": "<p>1) Déterminer la nature de l'application \\( S \\). Préciser ses éléments caractéristiques (rapport, angle, centre). (1pt)</p>",
          "reponse": "<p>\\( S(z) = (1+i)z + 1 - 2i \\).</p><p>\\( a = 1+i \\). Comme \\( a \\neq 1 \\), \\( S \\) est une similitude directe.</p><p>Rapport : \\( k = |a| = |1+i| = \\sqrt{2} \\)</p><p>Angle : \\( \\theta = \\arg(1+i) = \\dfrac{\\pi}{4} \\)</p><p>Centre : \\( \\omega = \\dfrac{b}{1-a} = \\dfrac{1-2i}{1-(1+i)} = \\dfrac{1-2i}{-i} = \\dfrac{(1-2i)i}{1} = i - 2i^2 = i + 2 = 2 + i \\)</p><p>Donc \\( S \\) est une similitude directe de centre \\( \\Omega(2+i) \\), de rapport \\( \\sqrt{2} \\) et d'angle \\( \\dfrac{\\pi}{4} \\).</p>"
        },
        {
          "question": "<p>2) Déterminer les images des points \\( A \\), \\( B \\) et \\( C \\) par \\( S \\). (1pt)</p>",
          "reponse": "<p>\\( z_{A'} = (1+i)(1+i) + 1 - 2i = (1+2i+i^2) + 1 - 2i = (1+2i-1) + 1 - 2i = 2i + 1 - 2i = 1 \\)</p><p>\\( z_{B'} = (1+i)(3+3i) + 1 - 2i = (3+3i+3i+3i^2) + 1 - 2i = (3+6i-3) + 1 - 2i = 6i + 1 - 2i = 1 + 4i \\)</p><p>\\( z_{C'} = (1+i)(5-i) + 1 - 2i = (5 - i + 5i - i^2) + 1 - 2i = (5 + 4i + 1) + 1 - 2i = 7 + 2i \\)</p>"
        },
        {
          "question": "<p>3) Soit H le milieu du segment [AC]. Déterminer l'affixe de H. (0.5pt)</p>",
          "reponse": "<p>\\( z_H = \\dfrac{z_A + z_C}{2} = \\dfrac{(1+i) + (5-i)}{2} = \\dfrac{6}{2} = 3 \\)</p><p>Donc \\( H(3; 0) \\).</p>"
        },
        {
          "question": "<p>4) Déterminer l'écriture complexe de la similitude directe \\( S^{-1} \\), réciproque de \\( S \\). (1.25pt)</p>",
          "reponse": "<p>\\( z' = (1+i)z + 1 - 2i \\)</p><p>\\( z' - (1-2i) = (1+i)z \\)</p><p>\\( z = \\dfrac{1}{1+i}(z' - 1 + 2i) \\)</p><p>\\( \\dfrac{1}{1+i} = \\dfrac{1-i}{1+1} = \\dfrac{1-i}{2} \\)</p><p>Donc \\( S^{-1}(z') = \\dfrac{1-i}{2}(z' - 1 + 2i) = \\dfrac{1-i}{2}z' + \\dfrac{1-i}{2}(-1 + 2i) \\)</p><p>\\( = \\dfrac{1-i}{2}z' + \\dfrac{-1 + 2i + i - 2i^2}{2} = \\dfrac{1-i}{2}z' + \\dfrac{-1 + 3i + 2}{2} = \\dfrac{1-i}{2}z' + \\dfrac{1+3i}{2} \\)</p><p>Donc \\( S^{-1}(z) = \\dfrac{1-i}{2}z + \\dfrac{1+3i}{2} \\).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Similitudes et lieux géométriques (Ressources)",
      "points": "2.5 points",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 8px;'>\n  <p>Le plan complexe est muni d'un repère orthonormé \\( (O; \\vec{u}; \\vec{v}) \\).</p>\n  <p>On considère les points \\( A(2; -1) \\) et \\( B(-1; 3) \\).</p>\n  <p>On considère l'ensemble \\( E \\) des points \\( M \\) d'affixe \\( z \\) tels que :</p>\n  <div style='background: #f1f5f9; padding: 10px; border-radius: 6px;'>\n    <p class='math'>\\( |z - 2 + i| = |z + 1 - 3i| \\)</p>\n  </div>\n</div>",
      "questions": [
        {
          "question": "<p>1) Déterminer la nature de l'ensemble \\( E \\). (0.75pt)</p>",
          "reponse": "<p>\\( |z - (2 - i)| = |z - (-1 + 3i)| \\)</p><p>C'est l'ensemble des points \\( M \\) équidistants des points d'affixes \\( 2-i \\) (point A) et \\( -1+3i \\) (point B).</p><p>Donc \\( E \\) est la <strong>médiatrice</strong> du segment [AB].</p>"
        },
        {
          "question": "<p>2) Déterminer l'équation cartésienne de \\( E \\). (1pt)</p>",
          "reponse": "<p>Soit \\( M(x; y) \\), \\( A(2; -1) \\), \\( B(-1; 3) \\).</p><p>\\( AM = BM \\Rightarrow (x-2)^2 + (y+1)^2 = (x+1)^2 + (y-3)^2 \\)</p><p>\\( x^2 - 4x + 4 + y^2 + 2y + 1 = x^2 + 2x + 1 + y^2 - 6y + 9 \\)</p><p>\\( -4x + 2y + 5 = 2x - 6y + 10 \\)</p><p>\\( -6x + 8y - 5 = 0 \\)</p><p>Donc l'équation de \\( E \\) est : \\( 6x - 8y + 5 = 0 \\).</p>"
        },
        {
          "question": "<p>3) Déterminer l'ensemble des points \\( M \\) d'affixe \\( z \\) tels que \\( \\arg(z - 2 + i) = \\dfrac{\\pi}{4} \\). (0.75pt)</p>",
          "reponse": "<p>\\( \\arg(z - (2 - i)) = \\dfrac{\\pi}{4} \\)</p><p>C'est la demi-droite d'origine \\( A(2; -1) \\) formant un angle de \\( 45^\\circ \\) avec l'axe des abscisses.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Synthèse - Nombres complexes et géométrie (Compétences)",
      "points": "5 points",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 12px;'>\n  <p>Le plan complexe est muni d'un repère orthonormé \\( (O; \\vec{u}; \\vec{v}) \\).</p>\n  <p>On considère les points \\( A \\), \\( B \\) et \\( C \\) d'affixes respectives :</p>\n  <div style='background: #f1f5f9; padding: 10px; border-radius: 6px;'>\n    <p class='math'>\\( z_A = 1 + i \\), \\( z_B = 3 - i \\), \\( z_C = -2 + 4i \\)</p>\n  </div>\n  <p>Soit \\( S \\) la similitude directe de centre \\( A \\) qui transforme \\( B \\) en \\( C \\).</p>\n  <p>Soit \\( \\Gamma \\) l'ensemble des points \\( M \\) d'affixe \\( z \\) tels que :</p>\n  <div style='background: #f1f5f9; padding: 10px; border-radius: 6px;'>\n    <p class='math'>\\( \\left| \\dfrac{z - z_A}{z - z_B} \\right| = 2 \\)</p>\n  </div>\n</div>",
      "questions": [
        {
          "question": "<p>1) Déterminer l'écriture complexe de la similitude \\( S \\). (1.5pts)</p>",
          "reponse": "<p>\\( S \\) est une similitude directe de centre \\( A \\) d'affixe \\( z_A = 1+i \\). Son écriture est : \\( z' - z_A = a(z - z_A) \\), où \\( a \\in \\mathbb{C}^* \\).</p><p>On a \\( z_C - z_A = a(z_B - z_A) \\)</p><p>\\( z_C - z_A = (-2+4i) - (1+i) = -3 + 3i \\)</p><p>\\( z_B - z_A = (3-i) - (1+i) = 2 - 2i \\)</p><p>\\( a = \\dfrac{-3+3i}{2-2i} = \\dfrac{3(-1+i)}{2(1-i)} = \\dfrac{3}{2} \\times \\dfrac{-1+i}{1-i} \\)</p><p>\\( \\dfrac{-1+i}{1-i} = \\dfrac{-(1-i)}{1-i} = -1 \\)</p><p>Donc \\( a = -\\dfrac{3}{2} \\).</p><p>L'écriture complexe de \\( S \\) est : \\( z' - (1+i) = -\\dfrac{3}{2}(z - (1+i)) \\)</p><p>\\( z' = -\\dfrac{3}{2}z + \\dfrac{3}{2}(1+i) + 1+i = -\\dfrac{3}{2}z + \\dfrac{5}{2}(1+i) \\)</p>"
        },
        {
          "question": "<p>2) Préciser la nature, le rapport et l'angle de \\( S \\). (1pt)</p>",
          "reponse": "<p>\\( a = -\\dfrac{3}{2} \\) est un nombre réel négatif.</p><p>\\( |a| = \\dfrac{3}{2} \\) et \\( \\arg(a) = \\pi \\) (mod \\( 2\\pi \\)).</p><p>Donc \\( S \\) est une similitude directe de centre \\( A(1+i) \\), de rapport \\( \\dfrac{3}{2} \\) et d'angle \\( \\pi \\).</p><p>C'est une <strong>homothétie de rapport \\( -\\dfrac{3}{2} \\)</strong> (homothétie de rapport \\( \\dfrac{3}{2} \\) suivie d'une rotation de \\( \\pi \\)).</p>"
        },
        {
          "question": "<p>3) Déterminer la nature de l'ensemble \\( \\Gamma \\). (2.5pts)</p>",
          "reponse": "<p>\\( \\left| \\dfrac{z - z_A}{z - z_B} \\right| = 2 \\Rightarrow |z - z_A| = 2|z - z_B| \\Rightarrow AM = 2BM \\)</p><p>Soit \\( M(x; y) \\), \\( A(1; 1) \\), \\( B(3; -1) \\).</p><p>\\( (x-1)^2 + (y-1)^2 = 4[(x-3)^2 + (y+1)^2] \\)</p><p>\\( (x-1)^2 + (y-1)^2 = 4(x-3)^2 + 4(y+1)^2 \\)</p><p>\\( x^2 - 2x + 1 + y^2 - 2y + 1 = 4(x^2 - 6x + 9) + 4(y^2 + 2y + 1) \\)</p><p>\\( x^2 - 2x + y^2 - 2y + 2 = 4x^2 - 24x + 36 + 4y^2 + 8y + 4 \\)</p><p>\\( x^2 - 2x + y^2 - 2y + 2 - 4x^2 + 24x - 36 - 4y^2 - 8y - 4 = 0 \\)</p><p>\\( -3x^2 + 22x - 3y^2 - 10y - 38 = 0 \\)</p><p>Multiplions par -1 : \\( 3x^2 - 22x + 3y^2 + 10y + 38 = 0 \\)</p><p>Forme canonique : \\( 3\\left(x - \\dfrac{11}{3}\\right)^2 + 3\\left(y + \\dfrac{5}{3}\\right)^2 = \\dfrac{121}{3} + \\dfrac{25}{3} - 38 = \\dfrac{146}{3} - \\dfrac{114}{3} = \\dfrac{32}{3} \\)</p><p>\\( \\left(x - \\dfrac{11}{3}\\right)^2 + \\left(y + \\dfrac{5}{3}\\right)^2 = \\dfrac{32}{9} \\)</p><p>Donc \\( \\Gamma \\) est un <strong>cercle</strong> de centre \\( \\Omega\\left(\\dfrac{11}{3}; -\\dfrac{5}{3}\\right) \\) et de rayon \\( R = \\dfrac{4\\sqrt{2}}{3} \\).</p>"

};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};
    const totalExercises = examData.exercices.length;
    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');
    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;
        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);
        // Construire le contenu
        let html = '';
        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;
        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;
            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });
        html += `</div>`;
        $body.html(html);
        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);
        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }
        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }
    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }
        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;
        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);
        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }
    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }
    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }
    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }
    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }
    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }
    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });
        // Afficher le premier exercice
        renderExercise(0);
        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);
        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }
    init();
});
</script>
</body>
</html>
