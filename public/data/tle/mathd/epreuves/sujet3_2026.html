<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>
    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }
    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }
    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }
    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }
    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }
    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }
    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }
    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }
    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }
    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }
    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }
    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }
    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }
    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }
    .exercise-statement .math {
        color: #1e40af;
    }
    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }
    .question-block.revealed {
        border-left-color: #059669;
    }
    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }
    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }
    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }
    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }
    .question-answer .math {
        color: #065f46;
    }
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }
    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }
    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }
    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }
    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }
    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }
    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }
    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }
    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }
    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }
    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }
    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }
    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }
    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }
    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }
    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>
<div class="app-container">
    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>
    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>
    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>
        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>
<script>
$(function() {
    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Mathématiques",
  "classe": "Terminale D",
  "sequence": "Séquence 3",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Primitives et calcul intégral (Ressources)",
      "points": "3.75 points",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 8px;'>\n  <p>On considère les fonctions suivantes :</p>\n  <div style='background: #f1f5f9; padding: 10px; border-radius: 6px;'>\n    <p class='math'>\\( f(x) = 3x^2 - 2x + 1 \\)</p>\n    <p class='math'>\\( g(x) = \\dfrac{2}{x} + \\dfrac{3}{x^2} \\) pour \\( x > 0 \\)</p>\n    <p class='math'>\\( h(x) = (2x + 1)e^{x^2 + x} \\)</p>\n  </div>\n</div>",
      "questions": [
        {
          "question": "<p>1) Déterminer une primitive de \\( f \\) sur \\( \\mathbb{R} \\). (0.75pt)</p>",
          "reponse": "<p>Une primitive de \\( f \\) est : \\( F(x) = x^3 - x^2 + x + C \\), \\( C \\in \\mathbb{R} \\).</p>"
        },
        {
          "question": "<p>2) Déterminer une primitive de \\( g \\) sur \\( ]0; +\\infty[ \\). (0.75pt)</p>",
          "reponse": "<p>Une primitive de \\( g \\) est : \\( G(x) = 2\\ln(x) - \\dfrac{3}{x} + C \\), \\( C \\in \\mathbb{R} \\).</p>"
        },
        {
          "question": "<p>3) Déterminer une primitive de \\( h \\) sur \\( \\mathbb{R} \\). (0.75pt)</p>",
          "reponse": "<p>On remarque que \\( h(x) = (2x+1)e^{x^2+x} \\) et que \\( (x^2+x)' = 2x+1 \\).</p><p>Donc une primitive de \\( h \\) est : \\( H(x) = e^{x^2+x} + C \\), \\( C \\in \\mathbb{R} \\).</p>"
        },
        {
          "question": "<p>4) Calculer \\( \\int_1^4 \\left(2x - \\dfrac{1}{x}\\right) dx \\). (1.5pt)</p>",
          "reponse": "<p>\\( \\int_1^4 \\left(2x - \\dfrac{1}{x}\\right) dx = \\left[ x^2 - \\ln x \\right]_1^4 = (16 - \\ln 4) - (1 - \\ln 1) = 16 - \\ln 4 - 1 = 15 - \\ln 4 \\).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Équations différentielles et intégration (Ressources)",
      "points": "3.75 points",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 8px;'>\n  <p>On considère l'équation différentielle :</p>\n  <div style='background: #f1f5f9; padding: 10px; border-radius: 6px;'>\n    <p class='math'>\\( (E) : y' + 2y = 4 \\)</p>\n  </div>\n  <p>On considère également l'équation différentielle :</p>\n  <div style='background: #f1f5f9; padding: 10px; border-radius: 6px;'>\n    <p class='math'>\\( (E_2) : y'' - 2y' + y = 2e^x \\)</p>\n  </div>\n</div>",
      "questions": [
        {
          "question": "<p>1) Résoudre l'équation différentielle \\( (E) \\). (1pt)</p>",
          "reponse": "<p>L'équation sans second membre \\( y' + 2y = 0 \\) a pour solution \\( y = Ce^{-2x} \\), \\( C \\in \\mathbb{R} \\).</p><p>Une solution particulière constante : \\( y = k \\Rightarrow 0 + 2k = 4 \\Rightarrow k = 2 \\).</p><p>Donc les solutions de \\( (E) \\) sont : \\( y = Ce^{-2x} + 2 \\), \\( C \\in \\mathbb{R} \\).</p>"
        },
        {
          "question": "<p>2) Déterminer la solution de \\( (E) \\) vérifiant la condition initiale \\( y(0) = 1 \\). (0.5pt)</p>",
          "reponse": "<p>\\( y(0) = C e^0 + 2 = C + 2 = 1 \\Rightarrow C = -1 \\)</p><p>La solution est : \\( y = -e^{-2x} + 2 = 2 - e^{-2x} \\).</p>"
        },
        {
          "question": "<p>3) Résoudre l'équation différentielle \\( (E_2) : y'' - 2y' + y = 2e^x \\). (1.5pt)</p>",
          "reponse": "<p>L'équation caractéristique est \\( r^2 - 2r + 1 = 0 \\Rightarrow (r-1)^2 = 0 \\).</p><p>La racine double est \\( r = 1 \\).</p><p>Les solutions de l'équation homogène sont : \\( y_h = (Ax + B)e^x \\), \\( A, B \\in \\mathbb{R} \\).</p><p>On cherche une solution particulière de la forme \\( y_p = Cx^2 e^x \\).</p><p>\\( y_p' = C(2x + x^2)e^x \\)</p><p>\\( y_p'' = C(x^2 + 4x + 2)e^x \\)</p><p>On a \\( y_p'' - 2y_p' + y_p = C[(x^2 + 4x + 2) - 2(2x + x^2) + x^2]e^x = C(2)e^x \\).</p><p>Donc \\( 2C = 2 \\Rightarrow C = 1 \\).</p><p>La solution particulière est \\( y_p = x^2 e^x \\).</p><p>La solution générale de \\( (E_2) \\) est : \\( y = (x^2 + Ax + B)e^x \\), \\( A, B \\in \\mathbb{R} \\).</p>"
        },
        {
          "question": "<p>4) Déterminer la solution de \\( (E_2) \\) vérifiant \\( y(0) = 0 \\) et \\( y'(0) = 1 \\). (0.75pt)</p>",
          "reponse": "<p>\\( y(x) = (x^2 + Ax + B)e^x \\)</p><p>\\( y(0) = B = 0 \\)</p><p>\\( y'(x) = (x^2 + Ax + B)'e^x + (x^2 + Ax + B)e^x = (2x + A)e^x + (x^2 + Ax + B)e^x = (x^2 + (A+2)x + A + B)e^x \\)</p><p>\\( y'(0) = A + B = 1 \\Rightarrow A = 1 \\)</p><p>La solution est : \\( y(x) = (x^2 + x)e^x \\).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Suites numériques et intégrales (Ressources)",
      "points": "2.5 points",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 8px;'>\n  <p>On considère la suite \\( (u_n) \\) définie pour tout \\( n \\in \\mathbb{N}^* \\) par :</p>\n  <div style='background: #f1f5f9; padding: 10px; border-radius: 6px;'>\n    <p class='math'>\\( u_n = \\int_0^1 x^n e^x dx \\)</p>\n  </div>\n</div>",
      "questions": [
        {
          "question": "<p>1) Montrer que \\( (u_n) \\) est décroissante. (0.75pt)</p>",
          "reponse": "<p>Sur \\( [0; 1] \\), pour tout \\( x \\in [0; 1] \\), on a \\( 0 \\le x \\le 1 \\), donc \\( x^{n+1} \\le x^n \\).</p><p>Comme \\( e^x > 0 \\), on a \\( x^{n+1} e^x \\le x^n e^x \\).</p><p>Par intégration sur \\( [0; 1] \\), on obtient \\( u_{n+1} \\le u_n \\).</p><p>La suite \\( (u_n) \\) est décroissante.</p>"
        },
        {
          "question": "<p>2) Montrer que pour tout \\( n \\in \\mathbb{N}^* \\), \\( u_n \\le \\dfrac{e}{n+1} \\). En déduire la limite de \\( (u_n) \\). (1pt)</p>",
          "reponse": "<p>Sur \\( [0; 1] \\), on a \\( e^x \\le e \\) (car \\( e^x \\) est croissante).</p><p>Donc \\( u_n = \\int_0^1 x^n e^x dx \\le \\int_0^1 x^n e \\, dx = e \\int_0^1 x^n dx = e \\times \\dfrac{1}{n+1} = \\dfrac{e}{n+1} \\).</p><p>Comme \\( \\lim\\limits_{n \\to +\\infty} \\dfrac{e}{n+1} = 0 \\) et \\( u_n \\ge 0 \\), on a \\( \\lim\\limits_{n \\to +\\infty} u_n = 0 \\).</p>"
        },
        {
          "question": "<p>3) Établir une relation de récurrence entre \\( u_{n+1} \\) et \\( u_n \\) à l'aide d'une intégration par parties. (0.75pt)</p>",
          "reponse": "<p>On intègre par parties : \\( u_n = \\int_0^1 x^n e^x dx \\)</p><p>Posons \\( u = x^n \\), \\( v' = e^x \\Rightarrow u' = n x^{n-1} \\), \\( v = e^x \\)</p><p>\\( u_n = \\left[ x^n e^x \\right]_0^1 - \\int_0^1 n x^{n-1} e^x dx = e - n u_{n-1} \\)</p><p>Donc \\( u_n + n u_{n-1} = e \\) ou \\( u_{n+1} + (n+1) u_n = e \\).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Synthèse - Primitives, équations différentielles et suites (Compétences)",
      "points": "5 points",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 12px;'>\n  <p>Un laboratoire pharmaceutique étudie l'évolution d'une substance dans l'organisme. La quantité \\( Q(t) \\) de substance (en mg) au temps \\( t \\) (en heures) est modélisée par l'équation différentielle :</p>\n  <div style='background: #f1f5f9; padding: 10px; border-radius: 6px;'>\n    <p class='math'>\\( Q'(t) = 0.5Q(t) + 2e^{0.5t} \\)</p>\n  </div>\n  <p>avec \\( Q(0) = 1 \\).</p>\n  <p>Par ailleurs, la quantité de substance absorbée entre les instants \\( t = 0 \\) et \\( t = 2 \\) est donnée par l'intégrale \\( \\int_0^2 Q(t) dt \\).</p>\n</div>",
      "questions": [
        {
          "question": "<p>1) Résoudre l'équation différentielle \\( Q'(t) = 0.5Q(t) + 2e^{0.5t} \\). (2pts)</p>",
          "reponse": "<p>L'équation sans second membre \\( Q' - 0.5Q = 0 \\) a pour solution \\( Q_h = Ce^{0.5t} \\).</p><p>On cherche une solution particulière de la forme \\( Q_p = at e^{0.5t} \\).</p><p>\\( Q_p' = a e^{0.5t} + 0.5a t e^{0.5t} \\)</p><p>\\( Q_p' - 0.5Q_p = a e^{0.5t} \\)</p><p>Donc \\( a = 2 \\) et \\( Q_p = 2t e^{0.5t} \\).</p><p>La solution générale est : \\( Q(t) = (C + 2t)e^{0.5t} \\).</p><p>Condition initiale : \\( Q(0) = C = 1 \\).</p><p>Donc \\( Q(t) = (1 + 2t)e^{0.5t} \\).</p>"
        },
        {
          "question": "<p>2) Calculer l'intégrale \\( \\int_0^2 Q(t) dt \\). (1.5pts)</p>",
          "reponse": "<p>\\( \\int_0^2 (1 + 2t)e^{0.5t} dt = \\int_0^2 e^{0.5t} dt + 2\\int_0^2 t e^{0.5t} dt \\)</p><p>\\( \\int_0^2 e^{0.5t} dt = \\left[ 2e^{0.5t} \\right]_0^2 = 2e - 2 \\)</p><p>Pour \\( \\int_0^2 t e^{0.5t} dt \\), on intègre par parties :</p><p>\\( u = t \\), \\( v' = e^{0.5t} \\Rightarrow u' = 1 \\), \\( v = 2e^{0.5t} \\)</p><p>\\( \\int t e^{0.5t} dt = 2t e^{0.5t} - \\int 2e^{0.5t} dt = 2t e^{0.5t} - 4e^{0.5t} \\)</p><p>\\( \\int_0^2 t e^{0.5t} dt = \\left[ 2t e^{0.5t} - 4e^{0.5t} \\right]_0^2 = (4e - 4e) - (0 - 4) = 4 \\)</p><p>Donc \\( \\int_0^2 Q(t) dt = (2e - 2) + 2 \\times 4 = 2e - 2 + 8 = 2e + 6 \\).</p>"
        },
        {
          "question": "<p>3) Déterminer la limite de \\( Q(t) \\) en \\( +\\infty \\). (0.5pt)</p>",
          "reponse": "<p>\\( Q(t) = (1 + 2t)e^{0.5t} \\)</p><p>\\( \\lim\\limits_{t \\to +\\infty} Q(t) = +\\infty \\) (croissance exponentielle).</p>"
        },
        {
          "question": "<p>4) Soit \\( (u_n) \\) la suite définie par \\( u_n = Q(n) \\) pour \\( n \\in \\mathbb{N} \\). Montrer que \\( (u_n) \\) est croissante. (1pt)</p>",
          "reponse": "<p>\\( u_n = (1 + 2n)e^{0.5n} \\)</p><p>Pour \\( n \\in \\mathbb{N} \\), \\( 1 + 2n > 0 \\) et \\( e^{0.5n} > 0 \\).</p><p>La fonction \\( t \\mapsto (1+2t)e^{0.5t} \\) est croissante sur \\( \\mathbb{R}^+ \\) car sa dérivée est positive :</p><p>\\( Q'(t) = 0.5(1+2t)e^{0.5t} + 2e^{0.5t} = (0.5 + t + 2)e^{0.5t} = (t + 2.5)e^{0.5t} > 0 \\)</p><p>Donc \\( (u_n) \\) est croissante.</p>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};
    const totalExercises = examData.exercices.length;
    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');
    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;
        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);
        // Construire le contenu
        let html = '';
        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;
        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;
            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });
        html += `</div>`;
        $body.html(html);
        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);
        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }
        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }
    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }
        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;
        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);
        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }
    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }
    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }
    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }
    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }
    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }
    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });
        // Afficher le premier exercice
        renderExercise(0);
        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);
        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }
    init();
});
</script>
</body>
</html>
