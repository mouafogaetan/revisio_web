<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>
    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }
    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }
    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }
    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }
    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }
    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }
    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }
    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }
    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }
    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }
    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }
    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }
    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }
    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }
    .exercise-statement .math {
        color: #1e40af;
    }
    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }
    .question-block.revealed {
        border-left-color: #059669;
    }
    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }
    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }
    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }
    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }
    .question-answer .math {
        color: #065f46;
    }
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }
    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }
    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }
    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }
    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }
    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }
    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }
    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }
    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }
    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }
    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }
    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }
    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }
    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }
    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }
    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>
<div class="app-container">
    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>
    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>
    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>
        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>
<script>
$(function() {
    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Mathématiques",
  "classe": "Terminale D",
  "sequence": "Séquence 5",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Nombres complexes et similitudes (Ressources)",
      "points": "3.75 points",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 8px;'>\n  <p>Le plan complexe est muni d'un repère orthonormé \\( (O; \\vec{u}; \\vec{v}) \\).</p>\n  <p>On considère le point \\( A \\) d'affixe \\( z_A = 1 + i \\).</p>\n  <p>On considère l'application \\( f \\) du plan dans lui-même qui à tout point \\( M \\) d'affixe \\( z \\) associe le point \\( M' \\) d'affixe :</p>\n  <div style='background: #f1f5f9; padding: 10px; border-radius: 6px;'>\n    <p class='math'>\\( z' = 2iz + 1 - i \\)</p>\n  </div>\n</div>",
      "questions": [
        {
          "question": "<p>1) Déterminer la nature de \\( f \\). Préciser ses éléments caractéristiques. (1pt)</p>",
          "reponse": "<p>\\( f(z) = 2iz + 1 - i \\).</p><p>\\( a = 2i \\), \\( a \\neq 1 \\), donc \\( f \\) est une similitude directe.</p><p>Rapport : \\( k = |a| = |2i| = 2 \\)</p><p>Angle : \\( \\theta = \\arg(2i) = \\dfrac{\\pi}{2} \\)</p><p>Centre : \\( \\omega = \\dfrac{b}{1-a} = \\dfrac{1-i}{1-2i} = \\dfrac{(1-i)(1+2i)}{1+4} = \\dfrac{1+2i - i - 2i^2}{5} = \\dfrac{1+i+2}{5} = \\dfrac{3+i}{5} = \\dfrac{3}{5} + \\dfrac{1}{5}i \\)</p><p>Donc \\( f \\) est une similitude directe de centre \\( \\Omega\\left(\\dfrac{3}{5}; \\dfrac{1}{5}\\right) \\), de rapport 2 et d'angle \\( \\dfrac{\\pi}{2} \\).</p>"
        },
        {
          "question": "<p>2) Déterminer l'image du point \\( A \\) par \\( f \\). (0.5pt)</p>",
          "reponse": "<p>\\( z_{A'} = 2i(1+i) + 1 - i = 2i + 2i^2 + 1 - i = 2i - 2 + 1 - i = -1 + i \\)</p><p>Donc \\( A'(-1 + i) \\).</p>"
        },
        {
          "question": "<p>3) Déterminer l'écriture complexe de \\( f^{-1} \\), réciproque de \\( f \\). (1.25pt)</p>",
          "reponse": "<p>\\( z' = 2iz + 1 - i \\Rightarrow z' - 1 + i = 2iz \\)</p><p>\\( z = \\dfrac{z' - 1 + i}{2i} = \\dfrac{z'}{2i} + \\dfrac{-1 + i}{2i} = -\\dfrac{i}{2}z' + \\dfrac{1 - i}{2i} \\)</p><p>\\( \\dfrac{1 - i}{2i} = \\dfrac{1 - i}{2i} \\times \\dfrac{-i}{-i} = \\dfrac{-i + i^2}{2} = \\dfrac{-i - 1}{2} = -\\dfrac{1}{2} - \\dfrac{i}{2} \\)</p><p>Donc \\( f^{-1}(z) = -\\dfrac{i}{2}z - \\dfrac{1}{2} - \\dfrac{i}{2} = -\\dfrac{1}{2} - \\dfrac{i}{2}(z + 1) \\).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Étude de fonction et intégration (Ressources)",
      "points": "3.75 points",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 8px;'>\n  <p>On considère la fonction \\( f \\) définie sur \\( ]0; +\\infty[ \\) par :</p>\n  <div style='background: #f1f5f9; padding: 10px; border-radius: 6px;'>\n    <p class='math'>\\( f(x) = \\ln x - \\dfrac{1}{x} \\)</p>\n  </div>\n</div>",
      "questions": [
        {
          "question": "<p>1) Calculer les limites de \\( f \\) en 0 et en \\( +\\infty \\). (0.5pt)</p>",
          "reponse": "<p>En 0 : \\( \\lim\\limits_{x \\to 0^+} \\ln x = -\\infty \\) et \\( \\lim\\limits_{x \\to 0^+} \\dfrac{1}{x} = +\\infty \\), donc \\( \\lim\\limits_{x \\to 0^+} f(x) = -\\infty \\).</p><p>En \\( +\\infty \\) : \\( \\lim\\limits_{x \\to +\\infty} \\ln x = +\\infty \\) et \\( \\lim\\limits_{x \\to +\\infty} \\dfrac{1}{x} = 0 \\), donc \\( \\lim\\limits_{x \\to +\\infty} f(x) = +\\infty \\).</p>"
        },
        {
          "question": "<p>2) Déterminer \\( f'(x) \\) et dresser le tableau des variations de \\( f \\). (0.75pt)</p>",
          "reponse": "<p>\\( f'(x) = \\dfrac{1}{x} + \\dfrac{1}{x^2} = \\dfrac{x+1}{x^2} \\)</p><p>Sur \\( ]0; +\\infty[ \\), \\( x+1 > 0 \\) et \\( x^2 > 0 \\), donc \\( f'(x) > 0 \\).</p><p>\\( f \\) est strictement croissante sur \\( ]0; +\\infty[ \\).</p>"
        },
        {
          "question": "<p>3) Montrer que l'équation \\( f(x) = 0 \\) admet une solution unique \\( \\alpha \\) dans \\( [1; 2] \\). (0.5pt)</p>",
          "reponse": "<p>Sur \\( [1; 2] \\), \\( f \\) est continue et strictement croissante.</p><p>\\( f(1) = \\ln 1 - 1 = -1 < 0 \\)</p><p>\\( f(2) = \\ln 2 - \\dfrac{1}{2} \\approx 0.69 - 0.5 = 0.19 > 0 \\)</p><p>D'après le théorème des valeurs intermédiaires, l'équation \\( f(x) = 0 \\) admet une solution unique \\( \\alpha \\in [1; 2] \\).</p>"
        },
        {
          "question": "<p>4) Déterminer une primitive de \\( f \\). (1pt)</p>",
          "reponse": "<p>\\( F(x) = \\int \\left(\\ln x - \\dfrac{1}{x}\\right) dx = \\int \\ln x \\, dx - \\int \\dfrac{1}{x} dx \\)</p><p>Pour \\( \\int \\ln x \\, dx \\), on intègre par parties : \\( u = \\ln x \\), \\( v' = 1 \\Rightarrow u' = \\dfrac{1}{x} \\), \\( v = x \\)</p><p>\\( \\int \\ln x \\, dx = x\\ln x - \\int x \\times \\dfrac{1}{x} dx = x\\ln x - x \\)</p><p>Donc \\( F(x) = x\\ln x - x - \\ln x + C = x\\ln x - \\ln x - x + C \\)</p><p>Soit \\( F(x) = (x-1)\\ln x - x + C \\).</p>"
        },
        {
          "question": "<p>5) Calculer \\( \\int_1^e f(x) dx \\). (1pt)</p>",
          "reponse": "<p>\\( \\int_1^e f(x) dx = [F(x)]_1^e = F(e) - F(1) \\)</p><p>\\( F(e) = (e-1)\\ln e - e = (e-1) - e = -1 \\)</p><p>\\( F(1) = (1-1)\\ln 1 - 1 = -1 \\)</p><p>Donc \\( \\int_1^e f(x) dx = -1 - (-1) = 0 \\).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Suites, équations différentielles et probabilités (Ressources)",
      "points": "2.5 points",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 8px;'>\n  <p>On considère la suite \\( (u_n) \\) définie pour tout \\( n \\in \\mathbb{N} \\) par :</p>\n  <div style='background: #f1f5f9; padding: 10px; border-radius: 6px;'>\n    <p class='math'>\\( u_0 = 1 \\) et \\( u_{n+1} = \\dfrac{3u_n + 2}{u_n + 4} \\)</p>\n  </div>\n  <p>On considère également une urne contenant 3 boules blanches et 2 boules noires. On tire au hasard et avec remise 4 boules.</p>\n</div>",
      "questions": [
        {
          "question": "<p>1) Montrer que \\( (u_n) \\) est convergente et déterminer sa limite. (1pt)</p>",
          "reponse": "<p>La fonction \\( f(x) = \\dfrac{3x+2}{x+4} \\) est croissante sur \\( [0; 1] \\) car \\( f'(x) = \\dfrac{10}{(x+4)^2} > 0 \\).</p><p>On montre par récurrence que \\( 0 \\le u_n \\le 1 \\).</p><p>\\( f(x) - x = \\dfrac{3x+2 - x^2 - 4x}{x+4} = \\dfrac{-x^2 - x + 2}{x+4} = \\dfrac{-(x+2)(x-1)}{x+4} \\)</p><p>Sur \\( [0; 1] \\), \\( f(x) - x \\ge 0 \\), donc \\( u_{n+1} \\ge u_n \\).</p><p>La suite est croissante et majorée par 1, donc convergente vers \\( l \\).</p><p>\\( l = \\dfrac{3l+2}{l+4} \\Rightarrow l^2 + 4l = 3l + 2 \\Rightarrow l^2 + l - 2 = 0 \\Rightarrow (l+2)(l-1) = 0 \\)</p><p>Comme \\( 0 \\le l \\le 1 \\), on a \\( l = 1 \\).</p>"
        },
        {
          "question": "<p>2) Soit \\( X \\) le nombre de boules blanches obtenues. Quelle est la loi de \\( X \\) ? Calculer \\( P(X = 2) \\). (1.5pts)</p>",
          "reponse": "<p>\\( X \\) suit la loi binomiale \\( \\mathcal{B}(4; 0.6) \\).</p><p>\\( P(X = 2) = \\binom{4}{2} (0.6)^2 (0.4)^2 = 6 \\times 0.36 \\times 0.16 = 0.3456 \\)</p>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Synthèse - Problème d'optimisation (Compétences)",
      "points": "5 points",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 12px;'>\n  <p>Un agriculteur souhaite maximiser ses revenus annuels. Il cultive deux produits : le maïs et le manioc. La production annuelle de maïs (en tonnes) est modélisée par la fonction \\( M(x) = x e^{-x/5} \\) où \\( x \\) est le nombre d'hectares consacrés au maïs. La production annuelle de manioc (en tonnes) est modélisée par la fonction \\( K(x) = (10 - x) \\ln(10 - x) \\) pour \\( x \\in [0; 10] \\).</p>\n  <p>Le prix de vente est de 100 000 FCFA par tonne de maïs et de 80 000 FCFA par tonne de manioc.</p>\n</div>",
      "questions": [
        {
          "question": "<p>1) Étudier les variations de \\( M \\) sur \\( [0; 10] \\) et déterminer la production maximale de maïs. (1.5pts)</p>",
          "reponse": "<p>\\( M(x) = x e^{-x/5} \\)</p><p>\\( M'(x) = e^{-x/5} - \\dfrac{x}{5}e^{-x/5} = \\left(1 - \\dfrac{x}{5}\\right)e^{-x/5} \\)</p><p>\\( M'(x) > 0 \\iff 1 - \\dfrac{x}{5} > 0 \\iff x < 5 \\)</p><p>\\( M'(x) < 0 \\iff x > 5 \\)</p><p>\\( M \\) est croissante sur \\( [0; 5] \\) et décroissante sur \\( [5; 10] \\).</p><p>Production maximale : \\( M(5) = 5e^{-1} = \\dfrac{5}{e} \\approx 1.84 \\) tonnes.</p>"
        },
        {
          "question": "<p>2) Étudier les variations de \\( K \\) sur \\( [0; 10] \\) et déterminer la production maximale de manioc. (1.5pts)</p>",
          "reponse": "<p>\\( K(x) = (10 - x)\\ln(10 - x) \\)</p><p>Posons \\( t = 10 - x \\), alors \\( K(x) = t\\ln t \\), avec \\( t \\in [0; 10] \\).</p><p>\\( K'(x) = -\\ln(10 - x) - 1 \\)</p><p>\\( K'(x) > 0 \\iff -\\ln(10 - x) - 1 > 0 \\iff \\ln(10 - x) < -1 \\iff 10 - x < e^{-1} \\iff x > 10 - \\dfrac{1}{e} \\)</p><p>\\( K \\) est décroissante sur \\( [0; 10 - 1/e] \\) et croissante sur \\( [10 - 1/e; 10] \\).</p><p>Production maximale : \\( K(10) = 0 \\) et \\( K(0) = 10\\ln 10 \\approx 23.0 \\).</p><p>Donc \\( K \\) est maximale pour \\( x = 0 \\) avec \\( K(0) = 10\\ln 10 \\) tonnes.</p>"
        },
        {
          "question": "<p>3) Déterminer la répartition des cultures qui maximise le revenu total \\( R(x) = 100000M(x) + 80000K(x) \\). (2pts)</p>",
          "reponse": "<p>\\( R(x) = 100000x e^{-x/5} + 80000(10 - x)\\ln(10 - x) \\)</p><p>On cherche \\( R'(x) = 0 \\) :</p><p>\\( R'(x) = 100000\\left(1 - \\dfrac{x}{5}\\right)e^{-x/5} - 80000\\ln(10 - x) - 80000 \\)</p><p>Résolution numérique :</p><ul><li>Pour x = 0 : R(0) = 0 + 80000×10×ln(10) ≈ 800000×2.302 ≈ 1 841 600 FCFA</li><li>Pour x = 5 : R(5) = 100000×5/e + 80000×5×ln(5) ≈ 183 939 + 400000×1.609 ≈ 183 939 + 643 775 ≈ 827 714 FCFA</li></ul><p>Le maximum est atteint pour \\( x = 0 \\) (tout en manioc).</p>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};
    const totalExercises = examData.exercices.length;
    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');
    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;
        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);
        // Construire le contenu
        let html = '';
        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;
        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;
            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });
        html += `</div>`;
        $body.html(html);
        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);
        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }
        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }
    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }
        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;
        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);
        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }
    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }
    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }
    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }
    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }
    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }
    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });
        // Afficher le premier exercice
        renderExercise(0);
        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);
        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }
    init();
});
</script>
</body>
</html>
