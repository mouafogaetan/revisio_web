<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>
    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }
    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }
    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }
    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }
    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }
    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }
    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }
    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }
    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }
    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }
    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }
    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }
    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }
    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }
    .exercise-statement .math {
        color: #1e40af;
    }
    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }
    .question-block.revealed {
        border-left-color: #059669;
    }
    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }
    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }
    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }
    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }
    .question-answer .math {
        color: #065f46;
    }
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }
    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }
    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }
    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }
    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }
    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }
    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }
    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }
    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }
    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }
    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }
    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }
    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }
    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }
    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }
    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>
<div class="app-container">
    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>
    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>
    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>
        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>
<script>
$(function() {
    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Physique",
  "classe": "Terminale D",
  "sequence": "Séquence 6",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Mesures, incertitudes et champ magnétique (Ressources)",
      "points": "2 points",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 8px;'>\n  <p>Un élève mesure l'intensité du champ magnétique créé par un aimant à l'aide d'un teslamètre.</p>\n  <p>Les mesures (en mT) sont : 12.2 ; 12.0 ; 12.3 ; 12.1 ; 12.2.</p>\n  <p>La classe de précision du teslamètre est de \\( \\pm 1\\% \\) de la valeur lue.</p>\n</div>",
      "questions": [
        {
          "question": "<p>1) Calculer la valeur moyenne \\( \\bar{B} \\) des mesures.</p>",
          "reponse": "<p>\\( \\bar{B} = \\dfrac{12.2 + 12.0 + 12.3 + 12.1 + 12.2}{5} = \\dfrac{60.8}{5} = 12.16 \\, mT \\).</p>"
        },
        {
          "question": "<p>2) Calculer l'incertitude absolue due à la classe de précision.</p>",
          "reponse": "<p>\\( \\Delta B_{app} = 1\\% \\times 12.16 = 0.01 \\times 12.16 = 0.1216 \\, mT \\).</p>"
        },
        {
          "question": "<p>3) Écrire le résultat de la mesure sous la forme \\( B = \\bar{B} \\pm \\Delta B \\).</p>",
          "reponse": "<p>\\( B = 12.16 \\pm 0.12 \\, mT \\).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Équations aux dimensions et forces (Ressources)",
      "points": "2 points",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 8px;'>\n  <p>On considère l'expression de la force de Lorentz :</p>\n  <div style='background: #f1f5f9; padding: 10px; border-radius: 6px;'>\n    <p class='math'>\\( \\vec{F} = q(\\vec{E} + \\vec{v} \\wedge \\vec{B}) \\)</p>\n  </div>\n  <p>On considère également l'expression de la force d'interaction entre deux charges :</p>\n  <div style='background: #f1f5f9; padding: 10px; border-radius: 6px;'>\n    <p class='math'>\\( \\vec{F} = \\dfrac{1}{4\\pi\\varepsilon_0} \\dfrac{q_1 q_2}{r^2} \\vec{u} \\)</p>\n  </div>\n</div>",
      "questions": [
        {
          "question": "<p>1) Déterminer la dimension du champ magnétique \\( B \\) à partir de la force de Lorentz.</p>",
          "reponse": "<p>\\( F = qvB \\Rightarrow [B] = \\dfrac{[F]}{[q][v]} = \\dfrac{M L T^{-2}}{I T \\times L T^{-1}} = \\dfrac{M L T^{-2}}{I L T^2} = M T^{-2} I^{-1} \\).</p><p>Le tesla (T) a pour dimension \\( M T^{-2} I^{-1} \\).</p>"
        },
        {
          "question": "<p>2) Vérifier l'homogénéité de la loi de Coulomb.</p>",
          "reponse": "<p>\\( F = \\dfrac{1}{4\\pi\\varepsilon_0} \\dfrac{q_1 q_2}{r^2} \\).</p><p>\\( [F] = \\dfrac{[q]^2}{[\\varepsilon_0][r]^2} = \\dfrac{I^2 T^2}{M^{-1} L^{-3} T^4 I^2 \\times L^2} = \\dfrac{I^2 T^2}{M^{-1} L^{-1} T^4 I^2} = M L T^{-2} \\).</p><p>La relation est homogène.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Condensateur et circuit RC (Ressources)",
      "points": "2 points",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 8px;'>\n  <p>Un condensateur de capacité \\( C = 200 \\, \\mu F \\) est chargé sous une tension \\( U_0 = 15 \\, V \\).</p>\n  <p>On le décharge à travers une résistance \\( R = 500 \\, \\Omega \\).</p>\n</div>",
      "questions": [
        {
          "question": "<p>1) Calculer la constante de temps \\( \\tau \\) du circuit.</p>",
          "reponse": "<p>\\( \\tau = RC = 500 \\times 200 \\times 10^{-6} = 0.1 \\, s \\).</p>"
        },
        {
          "question": "<p>2) Établir l'expression de la tension \\( u_C(t) \\) lors de la décharge.</p>",
          "reponse": "<p>\\( u_C(t) = U_0 e^{-t/\\tau} = 15 e^{-10t} \\, V \\).</p>"
        },
        {
          "question": "<p>3) Calculer la tension aux bornes du condensateur à \\( t = 0.05 \\, s \\).</p>",
          "reponse": "<p>\\( u_C(0.05) = 15 e^{-0.5} = 15 \\times 0.607 = 9.10 \\, V \\).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Ondes et diffraction (Ressources)",
      "points": "2 points",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 8px;'>\n  <p>Une onde lumineuse de longueur d'onde \\( \\lambda = 500 \\, nm \\) est diffractée par une fente de largeur \\( a = 0.05 \\, mm \\).</p>\n  <p>L'écran est placé à une distance \\( D = 1.5 \\, m \\) de la fente.</p>\n</div>",
      "questions": [
        {
          "question": "<p>1) Calculer l'angle de diffraction \\( \\theta \\) pour la première extinction.</p>",
          "reponse": "<p>\\( \\sin \\theta = \\dfrac{\\lambda}{a} = \\dfrac{500 \\times 10^{-9}}{0.05 \\times 10^{-3}} = \\dfrac{5 \\times 10^{-7}}{5 \\times 10^{-5}} = 10^{-2} \\).</p><p>\\( \\theta \\approx 10^{-2} \\, rad \\).</p>"
        },
        {
          "question": "<p>2) Calculer la largeur de la tache centrale de diffraction sur l'écran.</p>",
          "reponse": "<p>\\( \\Delta x = 2D \\tan \\theta \\approx 2D \\theta = 2 \\times 1.5 \\times 10^{-2} = 3 \\times 10^{-2} \\, m = 3 \\, cm \\).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 5 : Problème de synthèse - Accélérateur de particules (Compétences)",
      "points": "5 points",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 12px;'>\n  <p>Un accélérateur de particules produit des protons de haute énergie. Les protons sont accélérés par une différence de potentiel \\( U = 10 \\, MV \\) (10 millions de volts).</p>\n  <p>Les protons pénètrent ensuite dans une chambre où règne un champ magnétique uniforme \\( B = 1 \\, T \\) perpendiculaire à leur vitesse.</p>\n  <p>On donne : \\( m_p = 1.67 \\times 10^{-27} \\, kg \\), \\( q_p = 1.6 \\times 10^{-19} \\, C \\), \\( c = 3 \\times 10^8 \\, m \\cdot s^{-1} \\).</p>\n  <p>Par ailleurs, un détecteur mesure le rayonnement émis par les protons dans le champ magnétique (rayonnement synchrotron). La puissance rayonnée est donnée par \\( P = \\dfrac{q^2 a^2}{6\\pi\\varepsilon_0 c^3} \\) où \\( a \\) est l'accélération centripète.</p>\n  <p>On donne \\( \\dfrac{1}{4\\pi\\varepsilon_0} = 9 \\times 10^9 \\, N \\cdot m^2 \\cdot C^{-2} \\).</p>\n</div>",
      "questions": [
        {
          "question": "<p>1) Calculer l'énergie cinétique acquise par un proton après accélération sous \\( U = 10 \\, MV \\).</p>",
          "reponse": "<p>\\( E_c = qU = 1.6 \\times 10^{-19} \\times 10 \\times 10^6 = 1.6 \\times 10^{-12} \\, J \\).</p><p>En MeV : \\( E_c = 10 \\, MeV \\).</p>"
        },
        {
          "question": "<p>2) Calculer la vitesse du proton après accélération (on négligera les effets relativistes).</p>",
          "reponse": "<p>\\( E_c = \\dfrac{1}{2} m v^2 \\Rightarrow v = \\sqrt{\\dfrac{2E_c}{m}} = \\sqrt{\\dfrac{2 \\times 1.6 \\times 10^{-12}}{1.67 \\times 10^{-27}}} = \\sqrt{\\dfrac{3.2 \\times 10^{-12}}{1.67 \\times 10^{-27}}} = \\sqrt{1.916 \\times 10^{15}} = 4.38 \\times 10^7 \\, m \\cdot s^{-1} \\).</p><p>Soit environ 14.6% de la vitesse de la lumière.</p>"
        },
        {
          "question": "<p>3) Calculer le rayon de la trajectoire circulaire du proton dans le champ magnétique.</p>",
          "reponse": "<p>\\( R = \\dfrac{mv}{qB} = \\dfrac{1.67 \\times 10^{-27} \\times 4.38 \\times 10^7}{1.6 \\times 10^{-19} \\times 1} = \\dfrac{7.31 \\times 10^{-20}}{1.6 \\times 10^{-19}} = 0.457 \\, m \\).</p><p>Le rayon est \\( R \\approx 45.7 \\, cm \\).</p>"
        },
        {
          "question": "<p>4) Calculer l'accélération centripète du proton.</p>",
          "reponse": "<p>\\( a = \\dfrac{v^2}{R} = \\dfrac{(4.38 \\times 10^7)^2}{0.457} = \\dfrac{1.918 \\times 10^{15}}{0.457} = 4.20 \\times 10^{15} \\, m \\cdot s^{-2} \\).</p>"
        },
        {
          "question": "<p>5) Calculer la puissance du rayonnement synchrotron émis par le proton.</p>",
          "reponse": "<p>\\( P = \\dfrac{q^2 a^2}{6\\pi\\varepsilon_0 c^3} = \\dfrac{(1.6 \\times 10^{-19})^2 \\times (4.20 \\times 10^{15})^2}{6 \\times \\pi \\times 8.85 \\times 10^{-12} \\times (3 \\times 10^8)^3} \\)</p><p>Numérateur : \\( 2.56 \\times 10^{-38} \\times 1.764 \\times 10^{31} = 4.515 \\times 10^{-7} \\)</p><p>Dénominateur : \\( 6 \\times 3.14 \\times 8.85 \\times 10^{-12} \\times 27 \\times 10^{24} = 166.7 \\times 8.85 \\times 10^{-12} \\times 27 \\times 10^{24} = 4.50 \\times 10^{15} \\)</p><p>\\( P = \\dfrac{4.515 \\times 10^{-7}}{4.50 \\times 10^{15}} = 1.00 \\times 10^{-22} \\, W \\).</p><p>La puissance rayonnée est très faible, environ \\( 10^{-22} \\, W \\).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 6 : Problème de synthèse - Centrale nucléaire et dosimétrie (Compétences)",
      "points": "5 points",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 12px;'>\n  <p>Une centrale nucléaire utilise l'uranium 235 comme combustible. La réaction de fission est :</p>\n  <div style='background: #f1f5f9; padding: 10px; border-radius: 6px;'>\n    <p class='math'>\\( ^{235}_{92}U + ^{1}_{0}n \\rightarrow ^{144}_{56}Ba + ^{89}_{36}Kr + 3^{1}_{0}n + \\text{énergie} \\)</p>\n  </div>\n  <p>Le rendement thermique de la centrale est de 33% (33% de l'énergie libérée est convertie en électricité).</p>\n  <p>La centrale a une puissance électrique de \\( P = 900 \\, MW \\).</p>\n  <p>On donne les masses (en u) : \\( m(^{235}_{92}U) = 234.9934 \\), \\( m(^{144}_{56}Ba) = 143.9229 \\), \\( m(^{89}_{36}Kr) = 88.9176 \\), \\( m(^{1}_{0}n) = 1.0087 \\).</p>\n  <p>\\( 1 \\, u = 1.66 \\times 10^{-27} \\, kg \\).</p>\n  <p>Par ailleurs, un travailleur de la centrale est exposé à une source radioactive de césium 137 d'activité \\( A = 10 \\, \\mu Ci \\) (1 Ci = \\( 3.7 \\times 10^{10} \\, Bq \\)).</p>\n  <p>La demi-vie du césium 137 est de 30 ans.</p>\n</div>",
      "questions": [
        {
          "question": "<p>1) Calculer le défaut de masse de la réaction de fission.</p>",
          "reponse": "<p>\\( \\Delta m = [m(^{235}_{92}U) + m(^{1}_{0}n)] - [m(^{144}_{56}Ba) + m(^{89}_{36}Kr) + 3m(^{1}_{0}n)] \\)</p><p>\\( \\Delta m = (234.9934 + 1.0087) - (143.9229 + 88.9176 + 3 \\times 1.0087) \\)</p><p>\\( \\Delta m = 236.0021 - (143.9229 + 88.9176 + 3.0261) = 236.0021 - 235.8666 = 0.1355 \\, u \\)</p>"
        },
        {
          "question": "<p>2) Calculer l'énergie libérée par une fission en joules et en MeV.</p>",
          "reponse": "<p>\\( \\Delta m = 0.1355 \\times 1.66 \\times 10^{-27} = 2.25 \\times 10^{-28} \\, kg \\)</p><p>\\( E = \\Delta m \\times c^2 = 2.25 \\times 10^{-28} \\times (3 \\times 10^8)^2 = 2.25 \\times 10^{-28} \\times 9 \\times 10^{16} = 2.025 \\times 10^{-11} \\, J \\)</p><p>En MeV : \\( E = \\dfrac{2.025 \\times 10^{-11}}{1.6 \\times 10^{-13}} = 126.6 \\, MeV \\).</p>"
        },
        {
          "question": "<p>3) Calculer le nombre de fissions par seconde nécessaire pour obtenir la puissance électrique de 900 MW.</p>",
          "reponse": "<p>La puissance thermique nécessaire est \\( P_{th} = \\dfrac{P}{0.33} = \\dfrac{900 \\times 10^6}{0.33} = 2.727 \\times 10^9 \\, W \\).</p><p>Nombre de fissions par seconde : \\( N = \\dfrac{P_{th}}{E} = \\dfrac{2.727 \\times 10^9}{2.025 \\times 10^{-11}} = 1.347 \\times 10^{20} \\) fissions/s.</p>"
        },
        {
          "question": "<p>4) Calculer la masse d'uranium 235 consommée par jour.</p>",
          "reponse": "<p>Nombre de fissions par jour : \\( N_{jour} = 1.347 \\times 10^{20} \\times 86400 = 1.164 \\times 10^{25} \\) fissions.</p><p>Masse d'uranium consommée : \\( m = N_{jour} \\times \\dfrac{235 \\times 1.66 \\times 10^{-27}}{6.02 \\times 10^{23}} = 1.164 \\times 10^{25} \\times 3.90 \\times 10^{-25} = 4.54 \\, kg \\).</p><p>La centrale consomme environ 4.54 kg d'uranium 235 par jour.</p>"
        },
        {
          "question": "<p>5) Calculer l'activité de la source de césium 137 en becquerels.</p>",
          "reponse": "<p>\\( A = 10 \\times 10^{-6} \\times 3.7 \\times 10^{10} = 3.7 \\times 10^5 \\, Bq \\).</p>"
        },
        {
          "question": "<p>6) Déterminer la constante radioactive du césium 137 et son activité après 60 ans.</p>",
          "reponse": "<p>\\( \\lambda = \\dfrac{\\ln 2}{30} = 0.0231 \\, an^{-1} \\).</p><p>\\( A(60) = A_0 e^{-\\lambda t} = 3.7 \\times 10^5 \\times e^{-0.0231 \\times 60} = 3.7 \\times 10^5 \\times e^{-1.386} = 3.7 \\times 10^5 \\times 0.25 = 9.25 \\times 10^4 \\, Bq \\).</p>"
        }

  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};
    const totalExercises = examData.exercices.length;
    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');
    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;
        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);
        // Construire le contenu
        let html = '';
        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;
        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;
            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });
        html += `</div>`;
        $body.html(html);
        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);
        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }
        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }
    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }
        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;
        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);
        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }
    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }
    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }
    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }
    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }
    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }
    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });
        // Afficher le premier exercice
        renderExercise(0);
        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);
        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }
    init();
});
</script>
</body>
</html>
