<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>
    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }
    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }
    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }
    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }
    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }
    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }
    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }
    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }
    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }
    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }
    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }
    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }
    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }
    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }
    .exercise-statement .math {
        color: #1e40af;
    }
    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }
    .question-block.revealed {
        border-left-color: #059669;
    }
    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }
    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }
    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }
    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }
    .question-answer .math {
        color: #065f46;
    }
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }
    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }
    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }
    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }
    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }
    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }
    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }
    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }
    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }
    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }
    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }
    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }
    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }
    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }
    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }
    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>
<div class="app-container">
    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>
    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>
    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>
        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>
<script>
$(function() {
    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Physique",
  "classe": "Terminale D",
  "sequence": "Séquence 3",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Condensateur - Charge et décharge (Ressources)",
      "points": "2.5 points",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 8px;'>\n  <p>Un condensateur de capacité \\( C = 100 \\, \\mu F \\) est initialement déchargé.</p>\n  <p>On le charge à travers un résistor de résistance \\( R = 1000 \\, \\Omega \\) sous une tension constante \\( E = 12 \\, V \\).</p>\n</div>",
      "questions": [
        {
          "question": "<p>1) Déterminer la constante de temps \\( \\tau \\) du circuit.</p>",
          "reponse": "<p>\\( \\tau = RC = 1000 \\times 100 \\times 10^{-6} = 0.1 \\, s \\).</p><p>La constante de temps est \\( \\tau = 0.1 \\, s \\).</p>"
        },
        {
          "question": "<p>2) Établir l'expression de la tension \\( u_C(t) \\) aux bornes du condensateur au cours de la charge.</p>",
          "reponse": "<p>Lors de la charge, \\( u_C(t) = E(1 - e^{-t/\\tau}) = 12(1 - e^{-10t}) \\).</p>"
        },
        {
          "question": "<p>3) Calculer la tension aux bornes du condensateur à \\( t = \\tau \\), \\( t = 2\\tau \\) et \\( t = 3\\tau \\).</p>",
          "reponse": "<p>\\( u_C(\\tau) = 12(1 - e^{-1}) = 12(1 - 0.368) = 12 \\times 0.632 = 7.58 \\, V \\).</p><p>\\( u_C(2\\tau) = 12(1 - e^{-2}) = 12(1 - 0.135) = 12 \\times 0.865 = 10.38 \\, V \\).</p><p>\\( u_C(3\\tau) = 12(1 - e^{-3}) = 12(1 - 0.0498) = 12 \\times 0.9502 = 11.40 \\, V \\).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Circuits RC et RL (Ressources)",
      "points": "2.5 points",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 8px;'>\n  <p>Un circuit RL est composé d'une résistance \\( R = 20 \\, \\Omega \\) et d'une bobine d'inductance \\( L = 2 \\, H \\) en série.</p>\n  <p>On applique un échelon de tension \\( E = 10 \\, V \\) à ce circuit.</p>\n</div>",
      "questions": [
        {
          "question": "<p>1) Déterminer la constante de temps \\( \\tau \\) du circuit RL.</p>",
          "reponse": "<p>\\( \\tau = \\dfrac{L}{R} = \\dfrac{2}{20} = 0.1 \\, s \\).</p><p>La constante de temps est \\( \\tau = 0.1 \\, s \\).</p>"
        },
        {
          "question": "<p>2) Établir l'expression de l'intensité \\( i(t) \\) dans le circuit.</p>",
          "reponse": "<p>Lors de l'établissement du courant dans un circuit RL, \\( i(t) = \\dfrac{E}{R}(1 - e^{-t/\\tau}) = \\dfrac{10}{20}(1 - e^{-10t}) = 0.5(1 - e^{-10t}) \\, A \\).</p>"
        },
        {
          "question": "<p>3) Calculer l'intensité à \\( t = 0.05 \\, s \\) et \\( t = 0.2 \\, s \\).</p>",
          "reponse": "<p>\\( i(0.05) = 0.5(1 - e^{-0.5}) = 0.5(1 - 0.607) = 0.5 \\times 0.393 = 0.1965 \\, A \\).</p><p>\\( i(0.2) = 0.5(1 - e^{-2}) = 0.5(1 - 0.135) = 0.5 \\times 0.865 = 0.4325 \\, A \\).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Circuit LC et oscillations libres (Ressources)",
      "points": "2.5 points",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 8px;'>\n  <p>Un circuit LC est composé d'une bobine d'inductance \\( L = 0.5 \\, H \\) et d'un condensateur de capacité \\( C = 20 \\, \\mu F \\).</p>\n  <p>Le condensateur est initialement chargé sous une tension \\( U_0 = 10 \\, V \\).</p>\n</div>",
      "questions": [
        {
          "question": "<p>1) Établir l'équation différentielle du circuit LC.</p>",
          "reponse": "<p>Pour un circuit LC, on a : \\( \\dfrac{d^2 u_C}{dt^2} + \\dfrac{1}{LC} u_C = 0 \\).</p><p>Avec \\( LC = 0.5 \\times 20 \\times 10^{-6} = 10^{-5} \\, s^2 \\), on a :</p><p>\\( \\dfrac{d^2 u_C}{dt^2} + 10^5 u_C = 0 \\).</p>"
        },
        {
          "question": "<p>2) Déterminer la période propre \\( T_0 \\) des oscillations.</p>",
          "reponse": "<p>\\( T_0 = 2\\pi \\sqrt{LC} = 2\\pi \\sqrt{0.5 \\times 20 \\times 10^{-6}} = 2\\pi \\sqrt{10^{-5}} = 2\\pi \\times 3.16 \\times 10^{-3} = 1.99 \\times 10^{-2} \\, s \\).</p><p>La période propre est \\( T_0 \\approx 0.02 \\, s \\) (soit 20 ms).</p>"
        },
        {
          "question": "<p>3) Établir l'expression de la tension \\( u_C(t) \\) aux bornes du condensateur.</p>",
          "reponse": "<p>La solution de l'équation différentielle est de la forme \\( u_C(t) = U_0 \\cos(\\omega_0 t) \\) avec \\( \\omega_0 = \\dfrac{1}{\\sqrt{LC}} = \\sqrt{10^5} = 316.2 \\, rad \\cdot s^{-1} \\).</p><p>Donc \\( u_C(t) = 10 \\cos(316.2t) \\, V \\).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Phénomènes ondulatoires (Ressources)",
      "points": "2.5 points",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 8px;'>\n  <p>Une onde mécanique progressive se propage le long d'une corde avec une célérité \\( v = 20 \\, m \\cdot s^{-1} \\).</p>\n  <p>La fréquence de l'onde est \\( f = 50 \\, Hz \\).</p>\n</div>",
      "questions": [
        {
          "question": "<p>1) Calculer la longueur d'onde \\( \\lambda \\) de cette onde.</p>",
          "reponse": "<p>\\( \\lambda = \\dfrac{v}{f} = \\dfrac{20}{50} = 0.4 \\, m \\).</p><p>La longueur d'onde est \\( \\lambda = 0.4 \\, m \\).</p>"
        },
        {
          "question": "<p>2) Déterminer la période \\( T \\) de l'onde.</p>",
          "reponse": "<p>\\( T = \\dfrac{1}{f} = \\dfrac{1}{50} = 0.02 \\, s \\).</p><p>La période est \\( T = 20 \\, ms \\).</p>"
        },
        {
          "question": "<p>3) Écrire l'équation de l'onde progressive sous la forme \\( y(x,t) = A \\cos(\\omega t - kx) \\) avec \\( A = 0.02 \\, m \\).</p>",
          "reponse": "<p>\\( \\omega = 2\\pi f = 2\\pi \\times 50 = 100\\pi \\, rad \\cdot s^{-1} \\).</p><p>\\( k = \\dfrac{2\\pi}{\\lambda} = \\dfrac{2\\pi}{0.4} = 5\\pi \\, rad \\cdot m^{-1} \\).</p><p>L'équation est \\( y(x,t) = 0.02 \\cos(100\\pi t - 5\\pi x) \\) (en mètres).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 5 : Problème de synthèse - Circuit RLC et phénomènes ondulatoires (Compétences)",
      "points": "4 points",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 12px;'>\n  <p>Un circuit RLC série est composé d'une résistance \\( R = 100 \\, \\Omega \\), d'une bobine d'inductance \\( L = 1 \\, H \\) et d'un condensateur de capacité \\( C = 10 \\, \\mu F \\).</p>\n  <p>Il est soumis à une tension sinusoïdale \\( u(t) = U_m \\cos(\\omega t) \\) avec \\( U_m = 10 \\, V \\).</p>\n  <p>Par ailleurs, une onde lumineuse monochromatique de longueur d'onde \\( \\lambda = 600 \\, nm \\) est diffractée par une fente de largeur \\( a = 0.1 \\, mm \\).</p>\n  <p>L'écran de diffraction est placé à une distance \\( D = 2 \\, m \\) de la fente.</p>\n</div>",
      "questions": [
        {
          "question": "<p>1) Déterminer la pulsation propre \\( \\omega_0 \\) et la fréquence propre \\( f_0 \\) du circuit RLC.</p>",
          "reponse": "<p>\\( \\omega_0 = \\dfrac{1}{\\sqrt{LC}} = \\dfrac{1}{\\sqrt{1 \\times 10 \\times 10^{-6}}} = \\dfrac{1}{\\sqrt{10^{-5}}} = \\sqrt{10^5} = 316.2 \\, rad \\cdot s^{-1} \\).</p><p>\\( f_0 = \\dfrac{\\omega_0}{2\\pi} = \\dfrac{316.2}{2\\pi} = 50.3 \\, Hz \\).</p>"
        },
        {
          "question": "<p>2) Déterminer le facteur de qualité \\( Q \\) du circuit.</p>",
          "reponse": "<p>\\( Q = \\dfrac{1}{R} \\sqrt{\\dfrac{L}{C}} = \\dfrac{1}{100} \\sqrt{\\dfrac{1}{10^{-5}}} = \\dfrac{1}{100} \\times 316.2 = 3.162 \\).</p><p>Le facteur de qualité est \\( Q \\approx 3.16 \\).</p>"
        },
        {
          "question": "<p>3) Calculer la largeur de la tache centrale de diffraction (angle \\( \\theta \\) et largeur \\( \\Delta x \\) sur l'écran).</p>",
          "reponse": "<p>Pour la diffraction par une fente, \\( \\sin \\theta = \\dfrac{\\lambda}{a} = \\dfrac{600 \\times 10^{-9}}{0.1 \\times 10^{-3}} = \\dfrac{6 \\times 10^{-7}}{10^{-4}} = 6 \\times 10^{-3} \\).</p><p>Comme l'angle est petit, \\( \\theta \\approx \\sin \\theta = 6 \\times 10^{-3} \\, rad \\).</p><p>La largeur de la tache centrale est \\( \\Delta x = 2D \\tan \\theta \\approx 2D \\theta = 2 \\times 2 \\times 6 \\times 10^{-3} = 2.4 \\times 10^{-2} \\, m = 2.4 \\, cm \\).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 6 : Problème de synthèse - Énergie et ondes (Compétences)",
      "points": "4 points",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 12px;'>\n  <p>Un condensateur de capacité \\( C = 50 \\, \\mu F \\) chargé sous une tension \\( U = 20 \\, V \\) est déchargé dans une bobine d'inductance \\( L = 0.2 \\, H \\) de résistance négligeable.</p>\n  <p>Par ailleurs, un dispositif à ultrasons émet des ondes sonores de fréquence \\( f = 40 \\, kHz \\) qui se propagent dans l'air avec une célérité \\( v = 340 \\, m \\cdot s^{-1} \\).</p>\n  <p>On place un obstacle à une distance \\( d = 1.7 \\, m \\) de l'émetteur. L'onde réfléchie interfère avec l'onde incidente.</p>\n  <p>On donne : \\( \\pi^2 \\approx 10 \\).</p>\n</div>",
      "questions": [
        {
          "question": "<p>1) Calculer l'énergie stockée initialement dans le condensateur.</p>",
          "reponse": "<p>\\( E_C = \\dfrac{1}{2} C U^2 = \\dfrac{1}{2} \\times 50 \\times 10^{-6} \\times 20^2 = \\dfrac{1}{2} \\times 50 \\times 10^{-6} \\times 400 = \\dfrac{1}{2} \\times 0.02 = 0.01 \\, J \\).</p><p>L'énergie stockée est \\( E_C = 10 \\, mJ \\).</p>"
        },
        {
          "question": "<p>2) Calculer l'énergie maximale stockée dans la bobine lors de la décharge.</p>",
          "reponse": "<p>L'énergie maximale dans la bobine est égale à l'énergie initiale du condensateur (conservation de l'énergie) :</p><p>\\( E_L = \\dfrac{1}{2} L I_{max}^2 = E_C = 0.01 \\, J \\).</p><p>L'énergie maximale dans la bobine est \\( E_L = 10 \\, mJ \\).</p>"
        },
        {
          "question": "<p>3) Déterminer l'intensité maximale du courant dans le circuit LC.</p>",
          "reponse": "<p>\\( \\dfrac{1}{2} L I_{max}^2 = \\dfrac{1}{2} C U^2 \\Rightarrow I_{max} = U \\sqrt{\\dfrac{C}{L}} = 20 \\times \\sqrt{\\dfrac{50 \\times 10^{-6}}{0.2}} = 20 \\times \\sqrt{2.5 \\times 10^{-4}} = 20 \\times 1.58 \\times 10^{-2} = 0.316 \\, A \\).</p><p>L'intensité maximale est \\( I_{max} \\approx 0.316 \\, A \\).</p>"
        },
        {
          "question": "<p>4) Déterminer si les interférences entre l'onde incidente et l'onde réfléchie sont constructives ou destructives à l'endroit de l'émetteur.</p>",
          "reponse": "<p>Longueur d'onde : \\( \\lambda = \\dfrac{v}{f} = \\dfrac{340}{40 \\times 10^3} = 8.5 \\times 10^{-3} \\, m = 8.5 \\, mm \\).</p><p>La distance aller-retour est \\( 2d = 3.4 \\, m \\).</p><p>Le nombre de longueurs d'onde sur ce trajet est \\( \\dfrac{2d}{\\lambda} = \\dfrac{3.4}{8.5 \\times 10^{-3}} = 400 \\).</p><p>400 est un nombre entier, donc les interférences sont constructives à l'endroit de l'émetteur.</p>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};
    const totalExercises = examData.exercices.length;
    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');
    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;
        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);
        // Construire le contenu
        let html = '';
        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;
        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;
            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });
        html += `</div>`;
        $body.html(html);
        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);
        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }
        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }
    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }
        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;
        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);
        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }
    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }
    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }
    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }
    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }
    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }
    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });
        // Afficher le premier exercice
        renderExercise(0);
        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);
        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }
    init();
});
</script>
</body>
</html>
