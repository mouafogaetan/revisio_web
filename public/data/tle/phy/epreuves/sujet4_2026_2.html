<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>
    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }
    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }
    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }
    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }
    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }
    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }
    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }
    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }
    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }
    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }
    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }
    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }
    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }
    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }
    .exercise-statement .math {
        color: #1e40af;
    }
    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }
    .question-block.revealed {
        border-left-color: #059669;
    }
    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }
    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }
    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }
    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }
    .question-answer .math {
        color: #065f46;
    }
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }
    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }
    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }
    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }
    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }
    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }
    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }
    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }
    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }
    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }
    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }
    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }
    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }
    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }
    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }
    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>
<div class="app-container">
    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>
    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>
    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>
        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>
<script>
$(function() {
    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Physique",
  "classe": "Terminale D",
  "sequence": "Séquence 4",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Physique nucléaire - Noyau et radioactivité (Ressources)",
      "points": "2.5 points",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 8px;'>\n  <p>Le noyau de l'isotope \\( ^{235}_{92}U \\) se désintègre en émettant une particule \\( \\alpha \\).</p>\n  <p>On donne : \\( m(^{235}_{92}U) = 234.9934 \\, u \\), \\( m(^{231}_{90}Th) = 230.9810 \\, u \\), \\( m(\\alpha) = 4.0015 \\, u \\).</p>\n  <p>\\( 1 \\, u = 1.66 \\times 10^{-27} \\, kg \\).</p>\n</div>",
      "questions": [
        {
          "question": "<p>1) Écrire l'équation de la désintégration \\( \\alpha \\) de l'uranium 235.</p>",
          "reponse": "<p>\\( ^{235}_{92}U \\rightarrow ^{231}_{90}Th + ^{4}_{2}He \\)</p><p>La particule \\( \\alpha \\) est un noyau d'hélium \\( ^{4}_{2}He \\).</p>"
        },
        {
          "question": "<p>2) Calculer le défaut de masse de cette désintégration.</p>",
          "reponse": "<p>\\( \\Delta m = m(^{235}_{92}U) - [m(^{231}_{90}Th) + m(\\alpha)] \\)</p><p>\\( \\Delta m = 234.9934 - (230.9810 + 4.0015) = 234.9934 - 234.9825 = 0.0109 \\, u \\)</p><p>Le défaut de masse est \\( \\Delta m = 0.0109 \\, u \\).</p>"
        },
        {
          "question": "<p>3) Calculer l'énergie libérée par cette désintégration en joules et en MeV.</p>",
          "reponse": "<p>\\( \\Delta m = 0.0109 \\times 1.66 \\times 10^{-27} = 1.81 \\times 10^{-29} \\, kg \\)</p><p>\\( E = \\Delta m \\times c^2 = 1.81 \\times 10^{-29} \\times (3 \\times 10^8)^2 = 1.81 \\times 10^{-29} \\times 9 \\times 10^{16} = 1.63 \\times 10^{-12} \\, J \\)</p><p>En MeV : \\( E = \\dfrac{1.63 \\times 10^{-12}}{1.6 \\times 10^{-13}} = 10.19 \\, MeV \\)</p><p>L'énergie libérée est \\( E \\approx 1.63 \\times 10^{-12} \\, J \\) soit \\( 10.19 \\, MeV \\).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Loi de décroissance radioactive (Ressources)",
      "points": "2.5 points",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 8px;'>\n  <p>Un échantillon contient initialement \\( N_0 = 10^{20} \\) noyaux radioactifs de césium \\( ^{137}_{55}Cs \\).</p>\n  <p>La demi-vie du césium 137 est \\( t_{1/2} = 30 \\, ans \\).</p>\n</div>",
      "questions": [
        {
          "question": "<p>1) Déterminer la constante radioactive \\( \\lambda \\) du césium 137.</p>",
          "reponse": "<p>\\( \\lambda = \\dfrac{\\ln 2}{t_{1/2}} = \\dfrac{0.693}{30} = 2.31 \\times 10^{-2} \\, an^{-1} \\)</p><p>La constante radioactive est \\( \\lambda = 2.31 \\times 10^{-2} \\, an^{-1} \\).</p>"
        },
        {
          "question": "<p>2) Calculer le nombre de noyaux restants après 60 ans.</p>",
          "reponse": "<p>\\( N(t) = N_0 e^{-\\lambda t} \\)</p><p>\\( N(60) = 10^{20} \\times e^{-2.31 \\times 10^{-2} \\times 60} = 10^{20} \\times e^{-1.386} = 10^{20} \\times 0.25 = 2.5 \\times 10^{19} \\)</p><p>Après 60 ans (soit 2 demi-vies), il reste \\( N(60) = 2.5 \\times 10^{19} \\) noyaux.</p>"
        },
        {
          "question": "<p>3) Calculer l'activité de l'échantillon après 30 ans.</p>",
          "reponse": "<p>\\( A(t) = \\lambda N(t) \\)</p><p>\\( N(30) = 10^{20} \\times e^{-0.693} = 10^{20} \\times 0.5 = 5 \\times 10^{19} \\)</p><p>\\( A(30) = 2.31 \\times 10^{-2} \\times 5 \\times 10^{19} = 1.155 \\times 10^{18} \\, Bq \\)</p><p>L'activité est \\( A(30) \\approx 1.16 \\times 10^{18} \\, Bq \\).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Effet photoélectrique et effet Compton (Ressources)",
      "points": "2.5 points",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 8px;'>\n  <p>On éclaire une surface métallique avec une radiation de longueur d'onde \\( \\lambda = 200 \\, nm \\).</p>\n  <p>Le travail d'extraction du métal est \\( W = 2.5 \\, eV \\).</p>\n  <p>On donne : \\( h = 6.63 \\times 10^{-34} \\, J \\cdot s \\), \\( c = 3 \\times 10^8 \\, m \\cdot s^{-1} \\), \\( 1 \\, eV = 1.6 \\times 10^{-19} \\, J \\).</p>\n</div>",
      "questions": [
        {
          "question": "<p>1) Calculer l'énergie d'un photon incident en joules et en eV.</p>",
          "reponse": "<p>\\( E = \\dfrac{hc}{\\lambda} = \\dfrac{6.63 \\times 10^{-34} \\times 3 \\times 10^8}{200 \\times 10^{-9}} = \\dfrac{1.989 \\times 10^{-25}}{2 \\times 10^{-7}} = 9.945 \\times 10^{-19} \\, J \\)</p><p>En eV : \\( E = \\dfrac{9.945 \\times 10^{-19}}{1.6 \\times 10^{-19}} = 6.216 \\, eV \\)</p><p>L'énergie du photon est \\( E \\approx 6.22 \\, eV \\).</p>"
        },
        {
          "question": "<p>2) Déterminer l'énergie cinétique maximale des photoélectrons émis.</p>",
          "reponse": "<p>\\( E_c = E - W = 6.216 - 2.5 = 3.716 \\, eV \\)</p><p>En joules : \\( E_c = 3.716 \\times 1.6 \\times 10^{-19} = 5.95 \\times 10^{-19} \\, J \\)</p><p>L'énergie cinétique maximale est \\( E_c \\approx 3.72 \\, eV \\) (soit \\( 5.95 \\times 10^{-19} \\, J \\)).</p>"
        },
        {
          "question": "<p>3) Calculer le potentiel d'arrêt nécessaire pour stopper les photoélectrons.</p>",
          "reponse": "<p>\\( E_c = eV_0 \\Rightarrow V_0 = \\dfrac{E_c}{e} = 3.716 \\, V \\)</p><p>Le potentiel d'arrêt est \\( V_0 \\approx 3.72 \\, V \\).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Réactions nucléaires - Fission et fusion (Ressources)",
      "points": "2.5 points",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 8px;'>\n  <p>On considère la réaction de fission suivante :</p>\n  <div style='background: #f1f5f9; padding: 10px; border-radius: 6px;'>\n    <p class='math'>\\( ^{235}_{92}U + ^{1}_{0}n \\rightarrow ^{141}_{56}Ba + ^{92}_{36}Kr + 3^{1}_{0}n \\)</p>\n  </div>\n  <p>On donne les masses atomiques (en u) :</p>\n  <ul>\n    <li>\\( m(^{235}_{92}U) = 234.9934 \\, u \\)</li>\n    <li>\\( m(^{1}_{0}n) = 1.0087 \\, u \\)</li>\n    <li>\\( m(^{141}_{56}Ba) = 140.9144 \\, u \\)</li>\n    <li>\\( m(^{92}_{36}Kr) = 91.9262 \\, u \\)</li>\n  </ul>\n</div>",
      "questions": [
        {
          "question": "<p>1) Calculer le défaut de masse de cette réaction de fission.</p>",
          "reponse": "<p>\\( \\Delta m = [m(^{235}_{92}U) + m(^{1}_{0}n)] - [m(^{141}_{56}Ba) + m(^{92}_{36}Kr) + 3m(^{1}_{0}n)] \\)</p><p>\\( \\Delta m = (234.9934 + 1.0087) - (140.9144 + 91.9262 + 3 \\times 1.0087) \\)</p><p>\\( \\Delta m = 236.0021 - (140.9144 + 91.9262 + 3.0261) = 236.0021 - 235.8667 = 0.1354 \\, u \\)</p><p>Le défaut de masse est \\( \\Delta m = 0.1354 \\, u \\).</p>"
        },
        {
          "question": "<p>2) Calculer l'énergie libérée par cette fission en MeV.</p>",
          "reponse": "<p>\\( E = \\Delta m \\times 931.5 \\, MeV \\cdot u^{-1} = 0.1354 \\times 931.5 = 126.1 \\, MeV \\)</p><p>L'énergie libérée est \\( E \\approx 126.1 \\, MeV \\).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 5 : Problème de synthèse - Radioactivité et électronique (Compétences)",
      "points": "4 points",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 12px;'>\n  <p>Un laboratoire utilise une source radioactive de technétium \\( ^{99m}_{43}Tc \\) pour des examens médicaux.</p>\n  <p>La demi-vie du technétium 99m est \\( t_{1/2} = 6 \\, heures \\).</p>\n  <p>La source émet des photons \\( \\gamma \\) d'énergie \\( E = 140 \\, keV \\).</p>\n  <p>Un détecteur placé à distance \\( d = 1 \\, m \\) de la source reçoit les photons.</p>\n  <p>Le détecteur est constitué d'un condensateur de capacité \\( C = 1 \\, \\mu F \\) chargé sous une tension \\( U = 100 \\, V \\) et qui se décharge à travers une résistance \\( R = 10^6 \\, \\Omega \\) lorsqu'un photon est détecté.</p>\n</div>",
      "questions": [
        {
          "question": "<p>1) Quelle est l'activité initiale de la source si elle contient initialement \\( N_0 = 10^{12} \\) noyaux ?</p>",
          "reponse": "<p>\\( \\lambda = \\dfrac{\\ln 2}{t_{1/2}} = \\dfrac{0.693}{6} = 0.1155 \\, h^{-1} = 3.21 \\times 10^{-5} \\, s^{-1} \\)</p><p>\\( A_0 = \\lambda N_0 = 3.21 \\times 10^{-5} \\times 10^{12} = 3.21 \\times 10^7 \\, Bq \\)</p><p>L'activité initiale est \\( A_0 \\approx 3.21 \\times 10^7 \\, Bq \\).</p>"
        },
        {
          "question": "<p>2) Calculer l'activité de la source après 18 heures.</p>",
          "reponse": "<p>18 heures correspond à 3 demi-vies.</p><p>\\( A(18) = A_0 \\times \\left(\\dfrac{1}{2}\\right)^3 = 3.21 \\times 10^7 \\times \\dfrac{1}{8} = 4.01 \\times 10^6 \\, Bq \\)</p><p>L'activité après 18 heures est \\( A \\approx 4.01 \\times 10^6 \\, Bq \\).</p>"
        },
        {
          "question": "<p>3) Calculer la constante de temps du circuit RC du détecteur.</p>",
          "reponse": "<p>\\( \\tau = RC = 10^6 \\times 10^{-6} = 1 \\, s \\)</p><p>La constante de temps est \\( \\tau = 1 \\, s \\).</p>"
        },
        {
          "question": "<p>4) Si le détecteur reçoit en moyenne 100 photons par seconde, déterminer la tension moyenne aux bornes du condensateur après chaque décharge.</p>",
          "reponse": "<p>Chaque photon décharge le condensateur. La tension chute de \\( \\Delta U = \\dfrac{Q}{C} \\).</p><p>La charge initiale est \\( Q_0 = CU = 10^{-6} \\times 100 = 10^{-4} \\, C \\).</p><p>Après 100 décharges par seconde, la charge moyenne perdue est très faible car la constante de temps est grande.</p><p>La tension moyenne est proche de la tension de charge initiale.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 6 : Problème de synthèse - Ondes et physique nucléaire (Compétences)",
      "points": "4 points",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 12px;'>\n  <p>Un hôpital utilise un appareil de radiographie qui produit des rayons X par freinage d'électrons accélérés sous une tension \\( U = 50 \\, kV \\).</p>\n  <p>Les rayons X sont des photons de haute énergie.</p>\n  <p>Par ailleurs, un patient reçoit une injection d'iode 131 \\( (^{131}_{53}I) \\) pour un examen scintigraphique. L'iode 131 se désintègre par émission \\( \\beta^- \\) avec une demi-vie de 8 jours.</p>\n  <p>On donne : \\( h = 6.63 \\times 10^{-34} \\, J \\cdot s \\), \\( c = 3 \\times 10^8 \\, m \\cdot s^{-1} \\), \\( e = 1.6 \\times 10^{-19} \\, C \\).</p>\n</div>",
      "questions": [
        {
          "question": "<p>1) Calculer l'énergie maximale des rayons X produits (en joules et en eV).</p>",
          "reponse": "<p>L'énergie maximale des rayons X est \\( E = eU = 1.6 \\times 10^{-19} \\times 50 \\times 10^3 = 8 \\times 10^{-15} \\, J \\)</p><p>En eV : \\( E = 50 \\, keV \\).</p>"
        },
        {
          "question": "<p>2) Calculer la longueur d'onde minimale des rayons X produits.</p>",
          "reponse": "<p>\\( \\lambda_{min} = \\dfrac{hc}{E} = \\dfrac{6.63 \\times 10^{-34} \\times 3 \\times 10^8}{8 \\times 10^{-15}} = \\dfrac{1.989 \\times 10^{-25}}{8 \\times 10^{-15}} = 2.49 \\times 10^{-11} \\, m \\)</p><p>La longueur d'onde minimale est \\( \\lambda_{min} \\approx 2.49 \\times 10^{-11} \\, m \\) (soit 0.0249 nm).</p>"
        },
        {
          "question": "<p>3) Écrire l'équation de désintégration \\( \\beta^- \\) de l'iode 131.</p>",
          "reponse": "<p>\\( ^{131}_{53}I \\rightarrow ^{131}_{54}Xe + e^- + \\bar{\\nu}_e \\)</p><p>Le xénon 131 est le noyau fils, un électron et un antineutrino sont émis.</p>"
        },
        {
          "question": "<p>4) Quelle fraction de noyaux d'iode 131 reste-t-il après 24 jours ?</p>",
          "reponse": "<p>24 jours correspond à \\( \\dfrac{24}{8} = 3 \\) demi-vies.</p><p>La fraction restante est \\( \\left(\\dfrac{1}{2}\\right)^3 = \\dfrac{1}{8} \\).</p><p>Il reste 12.5% des noyaux initiaux.</p>"

};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};
    const totalExercises = examData.exercices.length;
    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');
    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;
        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);
        // Construire le contenu
        let html = '';
        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;
        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;
            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });
        html += `</div>`;
        $body.html(html);
        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);
        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }
        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }
    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }
        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;
        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);
        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }
    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }
    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }
    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }
    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }
    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }
    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });
        // Afficher le premier exercice
        renderExercise(0);
        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);
        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }
    init();
});
</script>
</body>
</html>
