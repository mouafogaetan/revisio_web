<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>
    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }
    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }
    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }
    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }
    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }
    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }
    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }
    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }
    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }
    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }
    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }
    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }
    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }
    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }
    .exercise-statement .math {
        color: #1e40af;
    }
    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }
    .question-block.revealed {
        border-left-color: #059669;
    }
    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }
    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }
    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }
    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }
    .question-answer .math {
        color: #065f46;
    }
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }
    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }
    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }
    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }
    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }
    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }
    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }
    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }
    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }
    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }
    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }
    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }
    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }
    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }
    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }
    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>
<div class="app-container">
    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>
    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>
    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>
        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>
<script>
$(function() {
    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Physique",
  "classe": "Terminale D",
  "sequence": "Séquence 2",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Champ magnétique et force de Laplace (Ressources)",
      "points": "2.5 points",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 8px;'>\n  <p>Un conducteur rectiligne de longueur \\( L = 20 \\, cm \\) est placé dans un champ magnétique uniforme \\( \\vec{B} \\) d'intensité \\( B = 0.5 \\, T \\).</p>\n  <p>Le conducteur est parcouru par un courant d'intensité \\( I = 3 \\, A \\).</p>\n  <p>L'angle entre le conducteur et le champ magnétique est \\( \\theta = 30^\\circ \\).</p>\n</div>",
      "questions": [
        {
          "question": "<p>1) Calculer l'intensité de la force de Laplace qui s'exerce sur le conducteur.</p>",
          "reponse": "<p>\\( F = B I L \\sin \\theta = 0.5 \\times 3 \\times 0.20 \\times \\sin 30^\\circ = 0.5 \\times 3 \\times 0.20 \\times 0.5 = 0.15 \\, N \\).</p><p>La force de Laplace est \\( F = 0.15 \\, N \\).</p>"
        },
        {
          "question": "<p>2) Déterminer la direction et le sens de cette force en utilisant la règle de la main droite.</p>",
          "reponse": "<p>La direction de la force est perpendiculaire au plan formé par le conducteur et le champ magnétique.</p><p>Le sens est donné par la règle de la main droite : pouce dans le sens du courant, index dans le sens du champ magnétique, le majeur indique le sens de la force.</p><p>La force est perpendiculaire à la fois à \\( \\vec{I} \\) et à \\( \\vec{B} \\).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Force de Lorentz (Ressources)",
      "points": "2.5 points",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 8px;'>\n  <p>Une particule de charge \\( q = +1.6 \\times 10^{-19} \\, C \\) et de masse \\( m = 1.67 \\times 10^{-27} \\, kg \\) (proton) pénètre dans une région où règne un champ magnétique uniforme \\( \\vec{B} \\) d'intensité \\( B = 2 \\, T \\).</p>\n  <p>La vitesse de la particule est \\( v = 10^6 \\, m \\cdot s^{-1} \\) et est perpendiculaire au champ magnétique.</p>\n</div>",
      "questions": [
        {
          "question": "<p>1) Calculer l'intensité de la force de Lorentz qui s'exerce sur la particule.</p>",
          "reponse": "<p>\\( F = q v B \\sin \\theta \\) avec \\( \\theta = 90^\\circ \\) car \\( \\vec{v} \\perp \\vec{B} \\).</p><p>\\( F = 1.6 \\times 10^{-19} \\times 10^6 \\times 2 = 3.2 \\times 10^{-13} \\, N \\).</p><p>La force de Lorentz est \\( F = 3.2 \\times 10^{-13} \\, N \\).</p>"
        },
        {
          "question": "<p>2) Déterminer la nature du mouvement de la particule. Calculer le rayon de sa trajectoire.</p>",
          "reponse": "<p>La force de Lorentz est perpendiculaire à la vitesse, elle ne travaille pas. Le mouvement est circulaire uniforme.</p><p>Le rayon de la trajectoire est \\( R = \\dfrac{m v}{q B} = \\dfrac{1.67 \\times 10^{-27} \\times 10^6}{1.6 \\times 10^{-19} \\times 2} = \\dfrac{1.67 \\times 10^{-21}}{3.2 \\times 10^{-19}} = 5.22 \\times 10^{-3} \\, m = 5.22 \\, mm \\).</p><p>Le rayon est \\( R = 5.22 \\, mm \\).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Cinématique et lois de Newton (Ressources)",
      "points": "2.5 points",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 8px;'>\n  <p>Un solide de masse \\( m = 2 \\, kg \\) est lancé verticalement vers le haut avec une vitesse initiale \\( v_0 = 20 \\, m \\cdot s^{-1} \\).</p>\n  <p>On néglige les frottements de l'air.</p>\n  <p>On prend \\( g = 10 \\, m \\cdot s^{-2} \\).</p>\n</div>",
      "questions": [
        {
          "question": "<p>1) Établir l'équation horaire du mouvement \\( y(t) \\) du solide.</p>",
          "reponse": "<p>Le solide est soumis à son poids \\( \\vec{P} = m\\vec{g} \\). D'après le PFD : \\( m\\vec{a} = m\\vec{g} \\Rightarrow \\vec{a} = \\vec{g} \\).</p><p>En projection sur l'axe vertical ascendant : \\( a = -g = -10 \\, m \\cdot s^{-2} \\).</p><p>\\( v(t) = -gt + v_0 = -10t + 20 \\).</p><p>\\( y(t) = -\\dfrac{1}{2}gt^2 + v_0 t = -5t^2 + 20t \\).</p>"
        },
        {
          "question": "<p>2) Déterminer la hauteur maximale atteinte par le solide et le temps de montée.</p>",
          "reponse": "<p>Au sommet, \\( v(t) = 0 \\Rightarrow -10t + 20 = 0 \\Rightarrow t = 2 \\, s \\).</p><p>La hauteur maximale est \\( y_{max} = -5(2)^2 + 20(2) = -20 + 40 = 20 \\, m \\).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Mouvements dans un champ de pesanteur (Ressources)",
      "points": "2.5 points",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 8px;'>\n  <p>Un projectile est lancé depuis le sol avec une vitesse initiale \\( v_0 = 50 \\, m \\cdot s^{-1} \\) faisant un angle \\( \\alpha = 45^\\circ \\) avec l'horizontale.</p>\n  <p>On prend \\( g = 10 \\, m \\cdot s^{-2} \\).</p>\n</div>",
      "questions": [
        {
          "question": "<p>1) Établir les équations horaires du mouvement \\( x(t) \\) et \\( y(t) \\).</p>",
          "reponse": "<p>Les composantes de la vitesse initiale : \\( v_{0x} = v_0 \\cos \\alpha = 50 \\times \\dfrac{\\sqrt{2}}{2} = 25\\sqrt{2} \\, m \\cdot s^{-1} \\).</p><p>\\( v_{0y} = v_0 \\sin \\alpha = 50 \\times \\dfrac{\\sqrt{2}}{2} = 25\\sqrt{2} \\, m \\cdot s^{-1} \\).</p><p>Les équations horaires :</p><p>\\( x(t) = v_{0x} t = 25\\sqrt{2} \\, t \\)</p><p>\\( y(t) = -\\dfrac{1}{2}gt^2 + v_{0y} t = -5t^2 + 25\\sqrt{2} \\, t \\).</p>"
        },
        {
          "question": "<p>2) Déterminer l'équation de la trajectoire \\( y(x) \\).</p>",
          "reponse": "<p>De \\( x = 25\\sqrt{2} \\, t \\), on a \\( t = \\dfrac{x}{25\\sqrt{2}} \\).</p><p>En remplaçant dans \\( y(t) \\) :</p><p>\\( y = -5 \\left( \\dfrac{x}{25\\sqrt{2}} \\right)^2 + 25\\sqrt{2} \\times \\dfrac{x}{25\\sqrt{2}} = -5 \\times \\dfrac{x^2}{1250} + x = -\\dfrac{x^2}{250} + x \\).</p><p>L'équation de la trajectoire est \\( y = x - \\dfrac{x^2}{250} \\).</p>"
        },
        {
          "question": "<p>3) Calculer la portée du projectile (distance horizontale parcourue avant de retomber au sol).</p>",
          "reponse": "<p>Au sol, \\( y = 0 \\Rightarrow x - \\dfrac{x^2}{250} = 0 \\Rightarrow x \\left( 1 - \\dfrac{x}{250} \\right) = 0 \\).</p><p>Les solutions sont \\( x = 0 \\) (point de départ) et \\( x = 250 \\, m \\) (portée).</p><p>La portée est \\( D = 250 \\, m \\).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 5 : Problème de synthèse - Particule chargée dans un champ électrique et magnétique (Compétences)",
      "points": "4 points",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 12px;'>\n  <p>Un électron de charge \\( q = -1.6 \\times 10^{-19} \\, C \\) et de masse \\( m = 9.1 \\times 10^{-31} \\, kg \\) pénètre dans une région où règne un champ électrique uniforme \\( \\vec{E} \\) d'intensité \\( E = 10^4 \\, V \\cdot m^{-1} \\) dirigé suivant l'axe \\( Oy \\) et un champ magnétique uniforme \\( \\vec{B} \\) d'intensité \\( B = 0.1 \\, T \\) dirigé suivant l'axe \\( Oz \\).</p>\n  <p>La vitesse initiale de l'électron est \\( \\vec{v}_0 = v_0 \\vec{i} \\) avec \\( v_0 = 10^5 \\, m \\cdot s^{-1} \\).</p>\n  <p>Les champs sont appliqués dans une zone de longueur \\( L = 10 \\, cm \\) selon l'axe \\( Ox \\).</p>\n</div>",
      "questions": [
        {
          "question": "<p>1) Déterminer l'accélération de l'électron dans la zone où les champs sont appliqués.</p>",
          "reponse": "<p>La force de Lorentz est \\( \\vec{F} = q(\\vec{E} + \\vec{v} \\wedge \\vec{B}) \\).</p><p>\\( \\vec{E} = E \\vec{j} = 10^4 \\vec{j} \\).</p><p>\\( \\vec{v} \\wedge \\vec{B} = (v_x \\vec{i} + v_y \\vec{j}) \\wedge (B \\vec{k}) = v_x B (\\vec{i} \\wedge \\vec{k}) + v_y B (\\vec{j} \\wedge \\vec{k}) = -v_x B \\vec{j} + v_y B \\vec{i} \\).</p><p>Donc \\( \\vec{v} \\wedge \\vec{B} = v_y B \\vec{i} - v_x B \\vec{j} \\).</p><p>\\( \\vec{F} = q(E \\vec{j} + v_y B \\vec{i} - v_x B \\vec{j}) = q(v_y B \\vec{i} + (E - v_x B) \\vec{j}) \\).</p><p>L'accélération est \\( \\vec{a} = \\dfrac{q}{m} (v_y B \\vec{i} + (E - v_x B) \\vec{j}) \\).</p>"
        },
        {
          "question": "<p>2) Établir les équations différentielles du mouvement de l'électron.</p>",
          "reponse": "<p>On a \\( \\begin{cases} \\dfrac{dv_x}{dt} = \\dfrac{q}{m} v_y B \\\\ \\dfrac{dv_y}{dt} = \\dfrac{q}{m} (E - v_x B) \\end{cases} \\)</p><p>Soit \\( \\omega = \\dfrac{|q|B}{m} = \\dfrac{1.6 \\times 10^{-19} \\times 0.1}{9.1 \\times 10^{-31}} = 1.76 \\times 10^{10} \\, s^{-1} \\).</p><p>\\( \\begin{cases} \\dfrac{dv_x}{dt} = -\\omega v_y \\\\ \\dfrac{dv_y}{dt} = -\\omega v_x + \\dfrac{qE}{m} \\end{cases} \\) car \\( q = -e \\).</p><p>Dérivons la première : \\( \\dfrac{d^2 v_x}{dt^2} = -\\omega \\dfrac{dv_y}{dt} = -\\omega(-\\omega v_x + \\dfrac{qE}{m}) = \\omega^2 v_x - \\omega \\dfrac{qE}{m} \\).</p><p>Donc \\( \\dfrac{d^2 v_x}{dt^2} + \\omega^2 v_x = -\\omega \\dfrac{qE}{m} \\).</p><p>De même pour \\( v_y \\).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 6 : Problème de synthèse - Pendule et satellite (Compétences)",
      "points": "4 points",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 12px;'>\n  <p>Un pendule simple est constitué d'une masse \\( m = 100 \\, g \\) suspendue à un fil de longueur \\( L = 1 \\, m \\).</p>\n  <p>On écarte le pendule d'un angle \\( \\theta_0 = 10^\\circ \\) par rapport à la verticale et on le lâche sans vitesse initiale.</p>\n  <p>Par ailleurs, un satellite artificiel de masse \\( m_s = 500 \\, kg \\) décrit une orbite circulaire autour de la Terre à une altitude \\( h = 400 \\, km \\).</p>\n  <p>On donne : \\( g = 10 \\, m \\cdot s^{-2} \\), \\( R_T = 6400 \\, km \\), \\( G = 6.67 \\times 10^{-11} \\, N \\cdot m^2 \\cdot kg^{-2} \\), \\( M_T = 6 \\times 10^{24} \\, kg \\).</p>\n</div>",
      "questions": [
        {
          "question": "<p>1) Établir l'équation différentielle du mouvement du pendule simple pour de petites oscillations.</p>",
          "reponse": "<p>Pour un pendule simple, l'équation différentielle est :</p><p>\\( \\ddot{\\theta} + \\dfrac{g}{L} \\sin \\theta = 0 \\).</p><p>Pour de petites oscillations, \\( \\sin \\theta \\approx \\theta \\), donc :</p><p>\\( \\ddot{\\theta} + \\dfrac{g}{L} \\theta = 0 \\).</p><p>Avec \\( g = 10 \\, m \\cdot s^{-2} \\) et \\( L = 1 \\, m \\), on a \\( \\ddot{\\theta} + 10\\theta = 0 \\).</p>"
        },
        {
          "question": "<p>2) Déterminer la période des petites oscillations du pendule.</p>",
          "reponse": "<p>\\( T = 2\\pi \\sqrt{\\dfrac{L}{g}} = 2\\pi \\sqrt{\\dfrac{1}{10}} = 2\\pi \\times 0.316 = 1.99 \\, s \\).</p><p>La période est \\( T \\approx 2 \\, s \\).</p>"
        },
        {
          "question": "<p>3) Calculer la vitesse du satellite sur son orbite.</p>",
          "reponse": "<p>La force gravitationnelle est centripète : \\( G \\dfrac{M_T m_s}{r^2} = m_s \\dfrac{v^2}{r} \\).</p><p>\\( v = \\sqrt{\\dfrac{G M_T}{r}} \\) avec \\( r = R_T + h = 6400 + 400 = 6800 \\, km = 6.8 \\times 10^6 \\, m \\).</p><p>\\( v = \\sqrt{\\dfrac{6.67 \\times 10^{-11} \\times 6 \\times 10^{24}}{6.8 \\times 10^6}} = \\sqrt{\\dfrac{4.002 \\times 10^{14}}{6.8 \\times 10^6}} = \\sqrt{5.885 \\times 10^7} = 7.67 \\times 10^3 \\, m \\cdot s^{-1} \\).</p><p>La vitesse du satellite est \\( v \\approx 7.67 \\, km \\cdot s^{-1} \\).</p>"
        },
        {
          "question": "<p>4) Calculer la période de révolution du satellite.</p>",
          "reponse": "<p>\\( T_s = 2\\pi \\sqrt{\\dfrac{r^3}{G M_T}} = 2\\pi \\sqrt{\\dfrac{(6.8 \\times 10^6)^3}{6.67 \\times 10^{-11} \\times 6 \\times 10^{24}}} = 2\\pi \\sqrt{\\dfrac{3.144 \\times 10^{20}}{4.002 \\times 10^{14}}} = 2\\pi \\sqrt{7.857 \\times 10^5} \\)</p><p>\\( T_s = 2\\pi \\times 886.4 = 5570 \\, s \\approx 92.8 \\, min \\).</p><p>La période est d'environ 93 minutes.</p>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};
    const totalExercises = examData.exercices.length;
    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');
    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;
        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);
        // Construire le contenu
        let html = '';
        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;
        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;
            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });
        html += `</div>`;
        $body.html(html);
        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);
        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }
        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }
    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }
        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;
        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);
        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }
    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }
    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }
    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }
    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }
    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }
    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });
        // Afficher le premier exercice
        renderExercise(0);
        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);
        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }
    init();
});
</script>
</body>
</html>
