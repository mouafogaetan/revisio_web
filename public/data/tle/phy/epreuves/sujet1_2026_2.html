<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>
    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }
    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }
    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }
    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }
    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }
    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }
    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }
    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }
    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }
    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }
    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }
    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }
    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }
    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }
    .exercise-statement .math {
        color: #1e40af;
    }
    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }
    .question-block.revealed {
        border-left-color: #059669;
    }
    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }
    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }
    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }
    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }
    .question-answer .math {
        color: #065f46;
    }
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }
    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }
    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }
    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }
    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }
    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }
    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }
    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }
    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }
    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }
    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }
    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }
    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }
    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }
    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }
    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>
<div class="app-container">
    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>
    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>
    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>
        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>
<script>
$(function() {
    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Physique",
  "classe": "Terminale D",
  "sequence": "Séquence 1",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Mesures et incertitudes (Ressources)",
      "points": "2.5 points",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 8px;'>\n  <p>Un élève réalise une série de mesures de la résistance \\( R \\) d'un conducteur ohmique à l'aide d'un ohmmètre.</p>\n  <p>Les mesures obtenues (en ohms) sont : 47.2 ; 47.5 ; 46.8 ; 47.0 ; 47.3 ; 47.1.</p>\n  <p>La classe de précision de l'ohmmètre est de \\( \\pm 0.5 \\% \\) de la valeur lue.</p>\n</div>",
      "questions": [
        {
          "question": "<p>1) Calculer la valeur moyenne \\( \\bar{R} \\) des mesures.</p>",
          "reponse": "<p>\\( \\bar{R} = \\dfrac{47.2 + 47.5 + 46.8 + 47.0 + 47.3 + 47.1}{6} = \\dfrac{282.9}{6} = 47.15 \\, \\Omega \\).</p>"
        },
        {
          "question": "<p>2) Calculer l'incertitude absolue due à la classe de précision de l'appareil. En déduire l'incertitude absolue totale sachant que l'incertitude de lecture est de \\( \\pm 0.1 \\, \\Omega \\).</p>",
          "reponse": "<p>Incertitude due à la classe de précision : \\( \\Delta R_{app} = 0.5\\% \\times 47.15 = 0.005 \\times 47.15 = 0.23575 \\, \\Omega \\).</p><p>Incertitude absolue totale : \\( \\Delta R = \\Delta R_{lecture} + \\Delta R_{app} = 0.1 + 0.23575 = 0.33575 \\, \\Omega \\).</p><p>On peut arrondir à \\( \\Delta R \\approx 0.34 \\, \\Omega \\).</p>"
        },
        {
          "question": "<p>3) Écrire le résultat de la mesure sous la forme \\( R = \\bar{R} \\pm \\Delta R \\).</p>",
          "reponse": "<p>\\( R = 47.15 \\pm 0.34 \\, \\Omega \\).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Équations aux dimensions et analyse dimensionnelle (Ressources)",
      "points": "2.5 points",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 8px;'>\n  <p>On considère l'expression de la force gravitationnelle entre deux masses ponctuelles :</p>\n  <div style='background: #f1f5f9; padding: 10px; border-radius: 6px;'>\n    <p class='math'>\\( F = G \\dfrac{m_1 m_2}{r^2} \\)</p>\n  </div>\n  <p>où \\( G \\) est la constante de gravitation universelle.</p>\n  <p>On considère également l'expression du champ électrostatique créé par une charge ponctuelle :</p>\n  <div style='background: #f1f5f9; padding: 10px; border-radius: 6px;'>\n    <p class='math'>\\( E = \\dfrac{1}{4\\pi\\varepsilon_0} \\dfrac{q}{r^2} \\)</p>\n  </div>\n</div>",
      "questions": [
        {
          "question": "<p>1) Déterminer la dimension de la constante \\( G \\) en utilisant l'analyse dimensionnelle.</p>",
          "reponse": "<p>\\( F = G \\dfrac{m_1 m_2}{r^2} \\Rightarrow G = \\dfrac{F r^2}{m_1 m_2} \\).</p><p>\\( [F] = M L T^{-2} \\), \\( [r^2] = L^2 \\), \\( [m_1 m_2] = M^2 \\).</p><p>Donc \\( [G] = \\dfrac{M L T^{-2} \\times L^2}{M^2} = M^{-1} L^3 T^{-2} \\).</p>"
        },
        {
          "question": "<p>2) Déterminer la dimension de la permittivité diélectrique du vide \\( \\varepsilon_0 \\).</p>",
          "reponse": "<p>\\( E = \\dfrac{1}{4\\pi\\varepsilon_0} \\dfrac{q}{r^2} \\Rightarrow \\varepsilon_0 = \\dfrac{q}{4\\pi E r^2} \\).</p><p>\\( [q] = I T \\) (car \\( q = I t \\)).</p><p>\\( [E] = \\dfrac{[F]}{[q]} = \\dfrac{M L T^{-2}}{I T} = M L T^{-3} I^{-1} \\).</p><p>Donc \\( [\\varepsilon_0] = \\dfrac{I T}{M L T^{-3} I^{-1} \\times L^2} = M^{-1} L^{-3} T^4 I^2 \\).</p>"
        },
        {
          "question": "<p>3) Vérifier l'homogénéité de la relation \\( F = \\dfrac{1}{4\\pi\\varepsilon_0} \\dfrac{q_1 q_2}{r^2} \\) (loi de Coulomb).</p>",
          "reponse": "<p>La force électrostatique est \\( F = \\dfrac{1}{4\\pi\\varepsilon_0} \\dfrac{q_1 q_2}{r^2} \\).</p><p>\\( [F] = \\dfrac{[q_1 q_2]}{[\\varepsilon_0] [r^2]} = \\dfrac{(I T)^2}{M^{-1} L^{-3} T^4 I^2 \\times L^2} = \\dfrac{I^2 T^2}{M^{-1} L^{-1} T^4 I^2} = M L T^{-2} \\).</p><p>On retrouve bien la dimension d'une force : \\( [F] = M L T^{-2} \\). La relation est homogène.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Interactions gravitationnelle et électrique (Ressources)",
      "points": "3 points",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 8px;'>\n  <p>Une planète de masse \\( M = 6 \\times 10^{24} \\, kg \\) et de rayon \\( R = 6400 \\, km \\) est entourée d'une atmosphère.</p>\n  <p>On place à sa surface un corps de masse \\( m = 10 \\, kg \\).</p>\n  <p>On considère également deux charges électriques ponctuelles \\( q_1 = +2 \\, \\mu C \\) et \\( q_2 = -5 \\, \\mu C \\) placées à une distance \\( d = 3 \\, cm \\) l'une de l'autre.</p>\n</div>",
      "questions": [
        {
          "question": "<p>1) Calculer la force gravitationnelle exercée par la planète sur le corps de masse \\( m \\) à la surface de la planète.</p>",
          "reponse": "<p>\\( F_g = G \\dfrac{M m}{R^2} \\) avec \\( G = 6.67 \\times 10^{-11} \\, N \\cdot m^2 \\cdot kg^{-2} \\).</p><p>\\( R = 6400 \\, km = 6.4 \\times 10^6 \\, m \\).</p><p>\\( F_g = 6.67 \\times 10^{-11} \\times \\dfrac{6 \\times 10^{24} \\times 10}{(6.4 \\times 10^6)^2} = 6.67 \\times 10^{-11} \\times \\dfrac{6 \\times 10^{25}}{4.096 \\times 10^{13}} \\)</p><p>\\( F_g = 6.67 \\times 10^{-11} \\times 1.4648 \\times 10^{12} = 6.67 \\times 1.4648 \\times 10 = 97.7 \\, N \\).</p><p>La force gravitationnelle est d'environ \\( 98 \\, N \\).</p>"
        },
        {
          "question": "<p>2) Calculer la force électrostatique entre les deux charges \\( q_1 \\) et \\( q_2 \\).</p>",
          "reponse": "<p>\\( F_e = \\dfrac{1}{4\\pi\\varepsilon_0} \\dfrac{|q_1 q_2|}{d^2} \\) avec \\( \\dfrac{1}{4\\pi\\varepsilon_0} = 9 \\times 10^9 \\, N \\cdot m^2 \\cdot C^{-2} \\).</p><p>\\( q_1 = 2 \\, \\mu C = 2 \\times 10^{-6} \\, C \\), \\( q_2 = -5 \\, \\mu C = -5 \\times 10^{-6} \\, C \\).</p><p>\\( d = 3 \\, cm = 3 \\times 10^{-2} \\, m \\).</p><p>\\( F_e = 9 \\times 10^9 \\times \\dfrac{10 \\times 10^{-12}}{9 \\times 10^{-4}} = 9 \\times 10^9 \\times \\dfrac{10^{-11}}{9 \\times 10^{-4}} = 10^9 \\times \\dfrac{10^{-11}}{10^{-4}} = 10^9 \\times 10^{-7} = 100 \\, N \\).</p><p>La force électrostatique est de \\( 100 \\, N \\).</p>"
        },
        {
          "question": "<p>3) Comparer les ordres de grandeur de ces deux forces. Que peut-on en conclure sur la prédominance des interactions ?</p>",
          "reponse": "<p>La force gravitationnelle est d'environ \\( 98 \\, N \\) et la force électrostatique est de \\( 100 \\, N \\).</p><p>Les deux forces sont du même ordre de grandeur dans cet exemple. Cependant, pour des particules élémentaires (comme des électrons), la force électrostatique est beaucoup plus intense que la force gravitationnelle. L'interaction électrique est prédominante à l'échelle atomique, tandis que l'interaction gravitationnelle prédomine à l'échelle astronomique.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Champ de gravitation et champ électrostatique (Ressources)",
      "points": "2 points",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 8px;'>\n  <p>On considère une masse ponctuelle \\( M = 2 \\times 10^{30} \\, kg \\) (simulant une étoile) placée à l'origine d'un repère.</p>\n  <p>On considère également une charge ponctuelle \\( q = +3 \\, \\mu C \\) placée à l'origine d'un repère.</p>\n</div>",
      "questions": [
        {
          "question": "<p>1) Calculer l'intensité du champ de gravitation créé par la masse \\( M \\) à une distance \\( r = 10^7 \\, m \\) de celle-ci.</p>",
          "reponse": "<p>\\( g = G \\dfrac{M}{r^2} = 6.67 \\times 10^{-11} \\times \\dfrac{2 \\times 10^{30}}{(10^7)^2} = 6.67 \\times 10^{-11} \\times 2 \\times 10^{16} = 1.334 \\times 10^6 \\, N \\cdot kg^{-1} \\).</p><p>Le champ de gravitation est \\( g = 1.334 \\times 10^6 \\, N \\cdot kg^{-1} \\).</p>"
        },
        {
          "question": "<p>2) Calculer l'intensité du champ électrostatique créé par la charge \\( q \\) à une distance \\( r = 2 \\, cm \\) de celle-ci.</p>",
          "reponse": "<p>\\( E = \\dfrac{1}{4\\pi\\varepsilon_0} \\dfrac{q}{r^2} = 9 \\times 10^9 \\times \\dfrac{3 \\times 10^{-6}}{(2 \\times 10^{-2})^2} = 9 \\times 10^9 \\times \\dfrac{3 \\times 10^{-6}}{4 \\times 10^{-4}} = 9 \\times 10^9 \\times 7.5 \\times 10^{-3} = 6.75 \\times 10^7 \\, V \\cdot m^{-1} \\).</p><p>Le champ électrostatique est \\( E = 6.75 \\times 10^7 \\, V \\cdot m^{-1} \\).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 5 : Problème de synthèse - Comparaison des interactions (Compétences)",
      "points": "4 points",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 12px;'>\n  <p>Un atome d'hydrogène est constitué d'un proton (charge \\( q_p = +1.6 \\times 10^{-19} \\, C \\), masse \\( m_p = 1.67 \\times 10^{-27} \\, kg \\)) et d'un électron (charge \\( q_e = -1.6 \\times 10^{-19} \\, C \\), masse \\( m_e = 9.1 \\times 10^{-31} \\, kg \\)).</p>\n  <p>La distance moyenne entre le proton et l'électron est \\( r = 5.3 \\times 10^{-11} \\, m \\).</p>\n  <p>La constante de gravitation universelle est \\( G = 6.67 \\times 10^{-11} \\, N \\cdot m^2 \\cdot kg^{-2} \\).</p>\n  <p>La constante de Coulomb est \\( k = 9 \\times 10^9 \\, N \\cdot m^2 \\cdot C^{-2} \\).</p>\n</div>",
      "questions": [
        {
          "question": "<p>1) Calculer la force gravitationnelle \\( F_g \\) entre le proton et l'électron.</p>",
          "reponse": "<p>\\( F_g = G \\dfrac{m_p m_e}{r^2} = 6.67 \\times 10^{-11} \\times \\dfrac{1.67 \\times 10^{-27} \\times 9.1 \\times 10^{-31}}{(5.3 \\times 10^{-11})^2} \\)</p><p>\\( F_g = 6.67 \\times 10^{-11} \\times \\dfrac{1.5197 \\times 10^{-57}}{2.809 \\times 10^{-21}} = 6.67 \\times 10^{-11} \\times 5.41 \\times 10^{-37} = 3.61 \\times 10^{-47} \\, N \\).</p><p>La force gravitationnelle est \\( F_g \\approx 3.61 \\times 10^{-47} \\, N \\).</p>"
        },
        {
          "question": "<p>2) Calculer la force électrostatique \\( F_e \\) entre le proton et l'électron.</p>",
          "reponse": "<p>\\( F_e = k \\dfrac{|q_p q_e|}{r^2} = 9 \\times 10^9 \\times \\dfrac{(1.6 \\times 10^{-19})^2}{(5.3 \\times 10^{-11})^2} = 9 \\times 10^9 \\times \\dfrac{2.56 \\times 10^{-38}}{2.809 \\times 10^{-21}} \\)</p><p>\\( F_e = 9 \\times 10^9 \\times 9.11 \\times 10^{-18} = 8.20 \\times 10^{-8} \\, N \\).</p><p>La force électrostatique est \\( F_e \\approx 8.20 \\times 10^{-8} \\, N \\).</p>"
        },
        {
          "question": "<p>3) Calculer le rapport \\( \\dfrac{F_e}{F_g} \\). Que peut-on en conclure ?</p>",
          "reponse": "<p>\\( \\dfrac{F_e}{F_g} = \\dfrac{8.20 \\times 10^{-8}}{3.61 \\times 10^{-47}} = 2.27 \\times 10^{39} \\).</p><p>La force électrostatique est environ \\( 2.27 \\times 10^{39} \\) fois plus grande que la force gravitationnelle.</p><p>On en conclut qu'à l'échelle atomique, l'interaction électrique prédomine largement sur l'interaction gravitationnelle. La gravitation est négligeable dans l'atome.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 6 : Problème de synthèse - Mesures et champs (Compétences)",
      "points": "4 points",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 12px;'>\n  <p>Un laboratoire souhaite déterminer expérimentalement la valeur de la constante de gravitation universelle \\( G \\) à l'aide de l'expérience de Cavendish.</p>\n  <p>Deux sphères de masse \\( M = 10 \\, kg \\) chacune sont placées à une distance \\( d = 20 \\, cm \\) l'une de l'autre.</p>\n  <p>La force d'attraction mesurée entre les deux sphères est \\( F = 1.67 \\times 10^{-8} \\, N \\).</p>\n  <p>Par ailleurs, le laboratoire souhaite également vérifier la loi de Coulomb en mesurant la force électrostatique entre deux charges \\( q_1 = +2 \\, \\mu C \\) et \\( q_2 = -3 \\, \\mu C \\) placées à une distance \\( r = 4 \\, cm \\).</p>\n</div>",
      "questions": [
        {
          "question": "<p>1) Déterminer expérimentalement la valeur de \\( G \\) à partir des mesures du laboratoire. Comparer avec la valeur théorique \\( G_0 = 6.67 \\times 10^{-11} \\, N \\cdot m^2 \\cdot kg^{-2} \\).</p>",
          "reponse": "<p>\\( F = G \\dfrac{M^2}{d^2} \\Rightarrow G = \\dfrac{F d^2}{M^2} \\).</p><p>\\( d = 20 \\, cm = 0.20 \\, m \\).</p><p>\\( G = \\dfrac{1.67 \\times 10^{-8} \\times (0.20)^2}{10^2} = \\dfrac{1.67 \\times 10^{-8} \\times 0.04}{100} = \\dfrac{6.68 \\times 10^{-10}}{100} = 6.68 \\times 10^{-12} \\, N \\cdot m^2 \\cdot kg^{-2} \\).</p><p>La valeur expérimentale \\( G = 6.68 \\times 10^{-12} \\, N \\cdot m^2 \\cdot kg^{-2} \\) est très différente de la valeur théorique \\( G_0 = 6.67 \\times 10^{-11} \\).</p><p>L'écart est dû à la difficulté de mesurer des forces aussi faibles (la force est très petite).</p>"
        },
        {
          "question": "<p>2) Calculer la force électrostatique théorique entre les deux charges. En déduire l'incertitude relative sur cette force sachant que l'incertitude sur la distance est de \\( \\Delta r = 0.5 \\, mm \\) et sur les charges de \\( \\Delta q = 0.1 \\, \\mu C \\).</p>",
          "reponse": "<p>\\( F_e = k \\dfrac{|q_1 q_2|}{r^2} = 9 \\times 10^9 \\times \\dfrac{2 \\times 10^{-6} \\times 3 \\times 10^{-6}}{(4 \\times 10^{-2})^2} = 9 \\times 10^9 \\times \\dfrac{6 \\times 10^{-12}}{16 \\times 10^{-4}} = 9 \\times 10^9 \\times 3.75 \\times 10^{-9} = 33.75 \\, N \\).</p><p>Incertitude relative sur \\( F_e \\) : \\( \\dfrac{\\Delta F_e}{F_e} = \\sqrt{\\left( \\dfrac{\\Delta q_1}{q_1} \\right)^2 + \\left( \\dfrac{\\Delta q_2}{q_2} \\right)^2 + \\left( 2\\dfrac{\\Delta r}{r} \\right)^2 } \\).</p><p>\\( \\dfrac{\\Delta q_1}{q_1} = \\dfrac{0.1 \\times 10^{-6}}{2 \\times 10^{-6}} = 0.05 \\)</p><p>\\( \\dfrac{\\Delta q_2}{q_2} = \\dfrac{0.1 \\times 10^{-6}}{3 \\times 10^{-6}} = 0.0333 \\)</p><p>\\( \\dfrac{\\Delta r}{r} = \\dfrac{0.5 \\times 10^{-3}}{4 \\times 10^{-2}} = 0.0125 \\)</p><p>\\( \\dfrac{\\Delta F_e}{F_e} = \\sqrt{0.05^2 + 0.0333^2 + (2 \\times 0.0125)^2} = \\sqrt{0.0025 + 0.00111 + 0.000625} = \\sqrt{0.004235} = 0.0651 \\).</p><p>L'incertitude relative est d'environ 6.5%.</p>"

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};
    const totalExercises = examData.exercices.length;
    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');
    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;
        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);
        // Construire le contenu
        let html = '';
        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;
        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;
            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });
        html += `</div>`;
        $body.html(html);
        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);
        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }
        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }
    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }
        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;
        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);
        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }
    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }
    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }
    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }
    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }
    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }
    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });
        // Afficher le premier exercice
        renderExercise(0);
        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);
        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }
    init();
});
</script>
</body>
</html>
