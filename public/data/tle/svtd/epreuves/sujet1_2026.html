<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>
    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }
    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }
    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }
    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }
    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }
    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }
    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }
    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }
    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }
    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }
    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }
    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }
    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }
    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }
    .exercise-statement .math {
        color: #1e40af;
    }
    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }
    .question-block.revealed {
        border-left-color: #059669;
    }
    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }
    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }
    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }
    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }
    .question-answer .math {
        color: #065f46;
    }
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }
    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }
    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }
    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }
    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }
    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }
    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }
    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }
    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }
    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }
    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }
    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }
    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }
    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }
    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }
    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>
<div class="app-container">
    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>
    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>
    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>
        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>
<script>
$(function() {
    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "SVT",
  "classe": "Terminale D",
  "sequence": "Séquence 1",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Partie A : Evaluation des ressources",
      "points": "10 points",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 8px;'>\n  <p><strong>Exercice 1 : Vérification des savoirs (4 pts)</strong></p>\n</div>",
      "questions": [
        {
          "question": "<p>1) Définir : osmose ; plasmolyse. (1pt)</p>",
          "reponse": "<p>L'<strong>osmose</strong> est un phénomène de diffusion de l'eau à travers une membrane semi-perméable, de la solution la moins concentrée en solutés vers la solution la plus concentrée.</p><p>La <strong>plasmolyse</strong> est le phénomène de déplasmolyse d'une cellule végétale placée dans une solution hypertonique : la membrane se décolle de la paroi, la cellule perd de l'eau et se contracte.</p>"
        },
        {
          "question": "<p>2) Distinguer transport passif et transport actif. (0.5pt)</p>",
          "reponse": "<p>Le <strong>transport passif</strong> s'effectue sans consommation d'énergie, selon le gradient de concentration (du plus concentré vers le moins concentré).</p><p>Le <strong>transport actif</strong> nécessite de l'énergie (ATP) et s'effectue contre le gradient de concentration.</p>"
        },
        {
          "question": "<p>3) Définir le potentiel de repos d'un neurone. (0.5pt)</p>",
          "reponse": "<p>Le potentiel de repos est la différence de potentiel électrique mesurée entre l'intérieur et l'extérieur d'un neurone au repos, en l'absence de stimulation. Chez l'homme, il est d'environ -70 mV (intérieur négatif par rapport à l'extérieur).</p>"
        },
        {
          "question": "<p>4) Donner la loi du tout-ou-rien. (0.5pt)</p>",
          "reponse": "<p>La loi du tout-ou-rien stipule qu'un stimulus, s'il est inférieur au seuil d'excitabilité, ne déclenche pas de potentiel d'action ; s'il est supérieur ou égal au seuil, il déclenche un potentiel d'action dont l'amplitude est toujours maximale, indépendante de l'intensité du stimulus.</p>"
        },
        {
          "question": "<p>5) Définir une maladie auto-immune et donner un exemple. (0.5pt)</p>",
          "reponse": "<p>Une <strong>maladie auto-immune</strong> est une maladie dans laquelle le système immunitaire de l'individu attaque ses propres tissus ou cellules, ne faisant plus la distinction entre le soi et le non-soi.</p><p>Exemples : diabète de type 1, sclérose en plaques, myasthénie.</p>"
        },
        {
          "question": "<p>6) Qu'est-ce que la méiose ? (0.5pt)</p>",
          "reponse": "<p>La méiose est un type de division cellulaire qui permet de produire des gamètes (cellules haploïdes) à partir de cellules diploïdes. Elle comporte deux divisions successives (méiose I et méiose II) et aboutit à 4 cellules-filles haploïdes génétiquement différentes.</p>"
        },
        {
          "question": "<p>7) Quelle est la différence entre une mutation génique et une mutation chromosomique ? (0.5pt)</p>",
          "reponse": "<p>Une <strong>mutation génique</strong> est une modification de la séquence des nucléotides d'un gène (substitution, délétion, insertion).</p><p>Une <strong>mutation chromosomique</strong> est une modification de la structure ou du nombre de chromosomes (translocation, inversion, duplication, délétion de fragments).</p>"
        }
      ]
    },
    {
      "titre": "Partie A : Evaluation des ressources (suite)",
      "points": "",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 8px;'>\n  <p><strong>Exercice 2 : Application des savoirs (6 pts)</strong></p>\n</div>",
      "questions": [
        {
          "question": "<p>1) On place une cellule végétale dans une solution de concentration \\( C_1 \\) et une autre dans une solution de concentration \\( C_2 \\). Après observation au microscope, on constate une plasmolyse dans le premier cas et une turgescence dans le second.</p><p>1-1) Comparer les concentrations \\( C_1 \\) et \\( C_2 \\) à la concentration intracellulaire. (0.5pt)</p>",
          "reponse": "<p><strong>Cas 1 (plasmolyse)</strong> : la solution extérieure est hypertonique par rapport au milieu intracellulaire, donc \\( C_1 > C_{int} \\).</p><p><strong>Cas 2 (turgescence)</strong> : la solution extérieure est hypotonique par rapport au milieu intracellulaire, donc \\( C_2 < C_{int} \\).</p>"
        },
        {
          "question": "<p>1-2) Expliquer les phénomènes observés. (0.5pt)</p>",
          "reponse": "<p><strong>Plasmolyse</strong> : l'eau sort de la cellule (osmose) vers la solution plus concentrée, la membrane se décolle de la paroi, le volume cellulaire diminue.</p><p><strong>Turgescence</strong> : l'eau entre dans la cellule (osmose) depuis la solution moins concentrée, le volume cellulaire augmente, la membrane est plaquée contre la paroi.</p>"
        },
        {
          "question": "<p>2) Un neurone au repos présente un potentiel de repos de -70 mV. On stimule ce neurone avec un stimulus de seuil.</p><p>2-1) Décrire les modifications ioniques qui conduisent à la genèse d'un potentiel d'action. (1pt)</p>",
          "reponse": "<p>Lors de la dépolarisation : ouverture des canaux sodiques voltage-dépendants, entrée massive de \\( Na^+ \\) dans la cellule, le potentiel devient positif (+30 mV).</p><p>Puis la repolarisation : fermeture des canaux sodiques, ouverture des canaux potassiques, sortie de \\( K^+ \\) de la cellule, retour au potentiel de repos.</p><p>On observe une hyperpolarisation passagère avant le retour au potentiel de repos.</p>"
        },
        {
          "question": "<p>2-2) Le potentiel d'action est-il identique si l'on applique un stimulus très fort ? Justifier. (0.5pt)</p>",
          "reponse": "<p>Le potentiel d'action est identique (même amplitude) quelle que soit l'intensité du stimulus, conformément à la loi du tout-ou-rien, à condition que le stimulus soit supérieur au seuil.</p>"
        },
        {
          "question": "<p>3) On croise deux souches pures de drosophiles : une à corps gris et ailes longues (dominants) et une à corps noir et ailes vestigiales (récessifs).</p><p>3-1) Définir les notions de dominance et de récessivité. (0.5pt)</p>",
          "reponse": "<p>Un allèle est <strong>dominant</strong> lorsqu'il s'exprime phénotypiquement même à l'état hétérozygote (présence d'un seul exemplaire suffit).</p><p>Un allèle est <strong>récessif</strong> lorsqu'il ne s'exprime phénotypiquement qu'à l'état homozygote (deux exemplaires sont nécessaires).</p>"
        },
        {
          "question": "<p>3-2) Quels sont les génotypes et phénotypes de la première génération (F1) ? (0.5pt)</p>",
          "reponse": "<p>Parents : corps gris/ailes longues × corps noir/ailes vestigiales</p><p>F1 : tous les individus ont le phénotype [corps gris, ailes longues] car les allèles dominants s'expriment.</p><p>Génotype F1 : hétérozygotes pour les deux gènes.</p>"
        },
        {
          "question": "<p>4) On considère une famille dont les parents sont non atteints de la mucoviscidose (maladie autosomique récessive). Ils ont deux enfants atteints et un enfant non atteint.</p><p>4-1) Déterminer le génotype des parents. (0.5pt)</p>",
          "reponse": "<p>La mucoviscidose est une maladie autosomique récessive. Les parents sont sains mais ont des enfants malades, donc ils sont tous les deux <strong>hétérozygotes</strong> (porteurs sains). Génotype : \\( A//a \\) (où \\( A \\) est l'allèle normal et \\( a \\) l'allèle muté).</p>"
        },
        {
          "question": "<p>4-2) Calculer la probabilité pour que le troisième enfant non atteint soit porteur sain. (0.5pt)</p>",
          "reponse": "<p>Lorsque deux hétérozygotes \\( A//a \\) × \\( A//a \\) se croisent :</p><ul><li>25% \\( A//A \\) (sain non porteur)</li><li>50% \\( A//a \\) (sain porteur)</li><li>25% \\( a//a \\) (malade)</li></ul><p>L'enfant non atteint peut être soit \\( A//A \\), soit \\( A//a \\). Parmi les non atteints (75%), 2/3 sont porteurs sains.</p><p>Probabilité = \\( \\dfrac{2}{3} \\approx 66.7\\% \\).</p>"
        },
        {
          "question": "<p>5) Citer deux anomalies chromosomiques et expliquer leur conséquence. (0.5pt)</p>",
          "reponse": "<ul><li><strong>Translocation</strong> : échange de fragments entre chromosomes non homologues, peut entraîner des anomalies du développement ou des cancers.</li><li><strong>Délétion</strong> : perte d'un fragment de chromosome, entraînant la perte de gènes et des malformations (exemple : syndrome du cri du chat).</li></ul>"
        },
        {
          "question": "<p>6) Donner une méthode de lutte biologique contre les insectes ravageurs en expliquant son avantage. (1pt)</p>",
          "reponse": "<p>La lutte biologique consiste à utiliser des ennemis naturels des ravageurs pour contrôler leurs populations.</p><p>Exemple : introduction de <strong>prédateurs</strong> (coccinelles contre les pucerons) ou de <strong>parasitoïdes</strong> (guêpes parasitoïdes contre les chenilles).</p><p>Avantage : méthode écologique, spécifique, sans risque pour les pollinisateurs (abeilles) et sans pollution chimique.</p>"
        }
      ]
    },
    {
      "titre": "Partie B : Evaluation des compétences",
      "points": "10 points",
      "enonce": "<div style='display: flex; flex-direction: column; gap: 12px;'>\n  <p><strong>Exercice 1 : La contraction musculaire (4 pts)</strong></p>\n  <p>Le mécanisme de la contraction musculaire s'observe mieux au niveau d'une unité contractile d'une fibre musculaire, le sarcomère.</p>\n</div>",
      "questions": [
        {
          "question": "<p>1) Réaliser le schéma d'interprétation d'une unité contractile de la fibre musculaire au repos. (1pt)</p>",
          "reponse": "<div style='background: #f1f5f9; padding: 10px; border-radius: 6px; text-align: center;'>\n  <p><strong>Sarcomère au repos</strong></p>\n  <p style='font-family: monospace;'>\n    ---[=====]---<br>\n    Ligne Z &nbsp; Bande I &nbsp; Bande A &nbsp; Bande I &nbsp; Ligne Z\n  </p>\n  <p style='font-size: 0.85rem;'>\n    - Ligne Z : limites du sarcomère<br>\n    - Bande I : zone claire (filaments fins seuls)<br>\n    - Bande A : zone sombre (filaments épais chevauchant les fins)<br>\n    - Bande H : zone centrale de la bande A (filaments épais seuls)\n  </p>\n</div>"
        },
        {
          "question": "<p>2) Réaliser le schéma d'interprétation d'une unité contractile de la fibre musculaire en activité (contraction). (1pt)</p>",
          "reponse": "<div style='background: #f1f5f9; padding: 10px; border-radius: 6px; text-align: center;'>\n  <p><strong>Sarcomère en contraction</strong></p>\n  <p style='font-family: monospace;'>\n    --[===]--<br>\n    Ligne Z &nbsp; Bande I &nbsp; Bande A &nbsp; Bande I &nbsp; Ligne Z\n  </p>\n  <p style='font-size: 0.85rem;'>\n    - Raccourcissement du sarcomère<br>\n    - Disparition de la bande H<br>\n    - Réduction de la bande I<br>\n    - La bande A reste constante\n  </p>\n</div>"
        },

h: 60%; border-collapse: collapse; margin: auto;'><tr><td style='padding: 4px; border: 1px solid #ddd;'></td><td style='padding: 4px; border: 1px solid #ddd; font-weight: bold;'>s</td><td style='padding: 4px; border: 1px solid #ddd; font-weight: bold;'>s</td></tr>\n  <tr><td style='padding: 4px; border: 1px solid #ddd; font-weight: bold;'>s</td><td style='padding: 4px; border: 1px solid #ddd;'>ss (100%)</td><td style='padding: 4px; border: 1px solid #ddd;'>ss (100%)</td></tr>\n  <tr><td style='padding: 4px; border: 1px solid #ddd; font-weight: bold;'>s</td><td style='padding: 4px; border: 1px solid #ddd;'>ss (100%)</td><td style='padding: 4px; border: 1px solid #ddd;'>ss (100%)</td></tr></table>\n  <p style='font-size: 0.85rem;'>Risque : 100% d'enfants atteints</p>\n</div>"

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};
    const totalExercises = examData.exercices.length;
    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');
    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;
        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);
        // Construire le contenu
        let html = '';
        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;
        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;
            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });
        html += `</div>`;
        $body.html(html);
        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);
        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }
        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }
    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }
        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;
        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);
        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }
    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }
    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }
    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }
    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }
    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }
    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });
        // Afficher le premier exercice
        renderExercise(0);
        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);
        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }
    init();
});
</script>
