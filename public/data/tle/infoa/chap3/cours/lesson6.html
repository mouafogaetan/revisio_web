<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Présentation mobile</title>
    <!-- MathJax -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' },
            options: { skipHtmlTypes: 'script' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }
    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
    }
    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 500px;
        margin: 0 auto;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }
    .slide-header {
        flex-shrink: 0;
        padding: 18px 16px 10px 16px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        z-index: 10;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }
    .slide-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }
    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
    }
    .content-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 18px 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        flex-shrink: 0;
    }
    .content-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }
    .content-card li {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        line-height: 1.5;
    }
    .content-card li:last-child {
        border-bottom: none;
    }
    .bullet-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
    }
    .math-block {
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        overflow-x: auto;
        flex-shrink: 0;
        margin: 4px 0;
    }
    .math-block .math {
        font-size: 1.2rem;
        color: #e2e8f0;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.08);
        border-left: 4px solid #60a5fa;
        padding: 12px 16px;
        border-radius: 12px;
        font-style: italic;
        font-size: 0.9rem;
        color: #cbd5e1;
        flex-shrink: 0;
    }
    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        border-radius: 0;
        flex-direction: column;
    }
    .loading-card {
        background: #1e293b;
        padding: 32px 28px;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #334155;
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px auto;
    }
    .loading-text {
        font-weight: 600;
        font-size: 1.1rem;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    .loading-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 16px;
    }
    .loading-progress {
        height: 3px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        animation: loadingProgress 30s ease-out forwards;
    }
    .loading-timeout {
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 12px;
    }
    .btn-cancel-loading {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 40px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #f87171;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }
    .btn-cancel-loading:active {
        transform: scale(0.94);
        background: rgba(239, 68, 68, 0.25);
    }
    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
    }
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }
    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }
    .slide-counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255,255,255,0.05);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(255,255,255,0.04);
    }
    .status-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 30px;
        background: rgba(96, 165, 250, 0.12);
        color: #93bbfc;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
    }
    .status-badge .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: pulse-dot 1.2s infinite;
        flex-shrink: 0;
    }
    .status-badge.idle .dot {
        animation: none;
        background: #64748b;
    }
    .status-badge.speaking .dot {
        background: #34d399;
        animation: pulse-dot 0.8s infinite;
    }
    .status-badge.error .dot {
        background: #f87171;
        animation: none;
    }
    .status-badge.paused .dot {
        animation: none;
        background: #fbbf24;
    }
    .status-badge.waiting .dot {
        animation: pulse-dot 1.5s infinite;
        background: #fbbf24;
    }
    .status-badge.loading .dot {
        animation: pulse-dot 0.5s infinite;
        background: #60a5fa;
    }
    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.7); }
    }
    .footer-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }
    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }
    .btn:active {
        transform: scale(0.94);
        background: rgba(255,255,255,0.1);
    }
    .btn-secondary {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.06);
    }
    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
        min-width: 80px;
        justify-content: center;
    }
    .btn-play:active {
        background: rgba(52, 211, 153, 0.25);
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
    }
    .auto-indicator {
        font-size: 0.65rem;
        color: #64748b;
        text-align: center;
        letter-spacing: 0.3px;
        padding: 2px 0;
    }
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.2rem;
        }
        .content-card li {
            font-size: 0.9rem;
            padding: 8px 0;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .btn-play {
            min-width: 60px;
        }
        .footer-buttons {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
        .loading-card {
            padding: 20px 16px;
        }
        .math-block .math {
            font-size: 1rem;
        }
    }
    @media (min-width: 600px) {
        .app-container {
            max-width: 480px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
        .loading-overlay {
            border-radius: 32px;
        }
    }
    /* Mode jour (par défaut) - ajouté par le script de thème */
    html, body {
        background: #f0f4f8 !important;
        color: #1a202c !important;
    }
    .app-container {
        background: linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%) !important;
    }
    .slide-header {
        background: rgba(255, 255, 255, 0.85) !important;
        border-bottom: 1px solid rgba(0,0,0,0.08) !important;
    }
    .slide-header h1 {
        background: linear-gradient(135deg, #2b6cb0, #6b46c1) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        background-clip: text !important;
    }
    .slide-footer {
        background: rgba(255, 255, 255, 0.9) !important;
        border-top: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card {
        background: rgba(255,255,255,0.8) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card li {
        border-bottom: 1px solid rgba(0,0,0,0.05) !important;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.12) !important;
        border-left: 4px solid #4299e1 !important;
        color: #2c3e50 !important;
    }
    .math-block {
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .math-block .math {
        color: #2d3748 !important;
    }
    .slide-counter {
        color: #4a5568 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .status-badge {
        background: rgba(96, 165, 250, 0.15) !important;
        color: #2b6cb0 !important;
        border: 1px solid rgba(96, 165, 250, 0.15) !important;
    }
    .btn {
        color: #2d3748 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .btn-secondary {
        background: rgba(0,0,0,0.04) !important;
        border-color: rgba(0,0,0,0.08) !important;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15) !important;
        border-color: rgba(52, 211, 153, 0.2) !important;
        color: #38a169 !important;
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15) !important;
        border-color: rgba(251, 191, 36, 0.2) !important;
        color: #d69e2e !important;
    }
    .auto-indicator {
        color: #718096 !important;
    }
    .loading-card {
        background: #ffffff !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .loading-text {
        color: #1a202c !important;
    }
    .loading-sub {
        color: #4a5568 !important;
    }
</style>
</head>
<body>
<div class="app-container">
    <header class="slide-header">
        <h1 id="slideTitle">Chargement...</h1>
    </header>
    <main class="slide-body" id="slideBody"></main>
    <!-- LOADING OVERLAY AVEC BOUTON ANNULER -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Préparation vocale...</div>
            <div class="loading-sub" id="loadingSub">Synthèse en cours</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loadingProgressBar"></div>
            </div>
            <div class="loading-timeout" id="loadingTimeout">⏱️ 30 secondes maximum</div>
            <button class="btn-cancel-loading" id="cancelLoadingBtn">
                <span>✕</span> Annuler
            </button>
        </div>
    </div>
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="slide-counter" id="slideCounter">1 / 3</span>
            <span class="status-badge idle" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">Prêt</span>
            </span>
        </div>
        <div class="footer-buttons">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-secondary" id="replayBtn">
                <span class="btn-icon">🔁</span> <span class="btn-label">Relire</span>
            </button>
            <button class="btn btn-play" id="playBtn">
                <span class="btn-icon">▶</span> <span class="btn-label">Play</span>
            </button>
        </div>
    </footer>
</div>
<script>
$(function() {
    // ================================================================
    // SLIDES
    // ================================================================
    const slides = [
  {
    "titre": "Introduction aux réseaux",
    "contenu": "<div style='padding: 10px; background: linear-gradient(135deg, #1e3a5f 0%, #2d6da8 100%); border-radius: 15px; color: white;'><h2 style='color: white; text-align: center;'>🌐 Les Réseaux Informatiques</h2><p style='color: white; text-align: center; font-size: 1.1em;'>Classe de Terminale A - Informatique</p><p style='color: white; text-align: center;'><strong>Leçon 6 : Définition, classification, topologies et équipements</strong></p><hr style='border-color: rgba(255,255,255,0.3);'><p style='color: white; text-align: center;'>Découvrons comment les ordinateurs communiquent entre eux à travers les réseaux informatiques !</p></div>",
    "texteParle": "Bienvenue à tous ! Aujourd'hui, nous allons découvrir les réseaux informatiques. De nos jours, l'informatique ne se limite plus à un seul ordinateur isolé. Les ordinateurs communiquent entre eux pour partager des informations, des fichiers et des services. Nous allons voir ensemble ce qu'est un réseau informatique, ses avantages et inconvénients, les différents types de réseaux, les topologies, les architectures et les équipements réseau.",
    "note": "Un réseau informatique est un ensemble d'ordinateurs reliés entre eux pour échanger des données."
  },
  {
    "titre": "Définition d'un réseau",
    "contenu": "<div style='padding: 10px;'><h3 style='color: #1e3a5f;'>🔗 Qu'est-ce qu'un réseau informatique ?</h3><div style='background: #e8f4fd; padding: 15px; border-radius: 10px; border-left: 5px solid #2d6da8; color: #000000'><p><strong>Définition :</strong> Un <strong>réseau informatique</strong> est un ensemble d'ordinateurs, de périphériques et de systèmes connectés entre eux à l'aide de <strong>supports de transmission</strong> (câbles, fibres optiques, ondes radio) pour <strong>échanger des données</strong> et <strong>partager des ressources</strong>.</p></div><div style='margin-top: 15px; background: #f0fdf4; padding: 12px; border-radius: 8px; border: 2px solid #22c55e; color: #000000'><p><strong>📌 Objectifs d'un réseau :</strong></p><ul><li><strong>Partage de données</strong> : échanger des fichiers, des messages</li><li><strong>Partage de ressources</strong> : imprimante, scanner, connexion Internet</li><li><strong>Communication</strong> : messagerie, visioconférence</li><li><strong>Centralisation</strong> : stockage des données sur un serveur</li></ul></div></div>",
    "texteParle": "Un réseau informatique est un ensemble d'ordinateurs, de périphériques et de systèmes connectés entre eux pour échanger des données et partager des ressources. Les ordinateurs peuvent être reliés par des câbles, des fibres optiques ou par des ondes radio comme le Wi-Fi. Les objectifs d'un réseau sont multiples : partager des données et des fichiers, partager des ressources comme une imprimante, permettre la communication entre les utilisateurs, et centraliser les données sur des serveurs.",
    "note": "Un réseau permet de mutualiser les ressources et de faciliter la communication."
  },
  {
    "titre": "Avantages et inconvénients",
    "contenu": "<div style='padding: 10px;'><h3 style='color: #1e3a5f;'>⚖️ Avantages et inconvénients des réseaux</h3><div style='background: #f0fdf4; padding: 15px; border-radius: 10px; border: 2px solid #22c55e; color: #000000; margin-bottom: 12px;'><p><strong>✅ Avantages :</strong></p><ul><li><strong>Partage de fichiers</strong> : échange rapide de documents entre utilisateurs</li><li><strong>Partage de ressources</strong> : imprimante, scanner, connexion Internet</li><li><strong>Communication</strong> : email, messagerie instantanée, visioconférence</li><li><strong>Centralisation</strong> : données stockées sur un serveur, sauvegarde facilitée</li><li><strong>Collaboration</strong> : travail en équipe sur des projets communs</li><li><strong>Économie</strong> : réduction des coûts (licences, matériel partagé)</li></ul></div><div style='background: #fef2f2; padding: 15px; border-radius: 10px; border: 2px solid #ef4444; color: #000000;'><p><strong>❌ Inconvénients :</strong></p><ul><li><strong>Sécurité</strong> : risque de piratage, de virus, d'intrusion</li><li><strong>Coût d'installation</strong> : câblage, équipements, maintenance</li><li><strong>Complexité</strong> : gestion technique nécessaire (administrateur réseau)</li><li><strong>Dépendance</strong> : panne du réseau = paralysie du travail</li><li><strong>Confidentialité</strong> : risque d'interception des données</li></ul></div></div>",
    "texteParle": "Les réseaux informatiques offrent de nombreux avantages. Ils permettent le partage de fichiers et de ressources comme les imprimantes, facilitent la communication entre utilisateurs, permettent la centralisation des données et favorisent la collaboration. Ils permettent aussi de réaliser des économies. Cependant, ils présentent des inconvénients : la sécurité est un enjeu majeur car les données peuvent être piratées, l'installation et la maintenance coûtent cher, la gestion est complexe et nécessite un administrateur réseau, et une panne du réseau peut paralyser toute l'entreprise.",
    "note": "Les avantages des réseaux sont nombreux mais la sécurité reste le principal défi."
  },
  {
    "titre": "Classification selon l'étendue",
    "contenu": "<div style='padding: 10px;'><h3 style='color: #1e3a5f;'>📊 Classification selon l'étendue géographique</h3><div style='display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px;'><div style='background: #dbeafe; padding: 12px; border-radius: 8px; color: #000000'><strong>🏠 PAN</strong><br><span style='font-size: 0.9em;'>Personal Area Network<br>Réseau personnel<br><em>Ex: Bluetooth, NFC</em></span></div><div style='background: #d1fae5; padding: 12px; border-radius: 8px; color: #000000'><strong>🏢 LAN</strong><br><span style='font-size: 0.9em;'>Local Area Network<br>Réseau local<br><em>Ex: réseau d'école, maison</em></span></div><div style='background: #fef3c7; padding: 12px; border-radius: 8px; color: #000000'><strong>🏙️ MAN</strong><br><span style='font-size: 0.9em;'>Metropolitan Area Network<br>Réseau métropolitain<br><em>Ex: réseau d'une ville</em></span></div><div style='background: #fce7f3; padding: 12px; border-radius: 8px; color: #000000'><strong>🌍 WAN</strong><br><span style='font-size: 0.9em;'>Wide Area Network<br>Réseau étendu<br><em>Ex: Internet, réseau d'entreprise</em></span></div></div><div style='background: #f8f9fa; padding: 12px; border-radius: 8px; margin-top: 10px; color: #000000'><p><strong>📌 Comparaison :</strong></p><ul><li><strong>PAN</strong> : quelques mètres (Bluetooth, NFC)</li><li><strong>LAN</strong> : bâtiment, école (Ethernet, Wi-Fi)</li><li><strong>MAN</strong> : ville (fibre optique métropolitaine)</li><li><strong>WAN</strong> : pays, monde (Internet)</li></ul></div></div>",
    "texteParle": "Les réseaux informatiques peuvent être classés selon leur taille géographique. On distingue quatre types principaux. Le réseau personnel ou PAN, comme le Bluetooth, qui couvre une zone de quelques mètres. Le réseau local ou LAN, qui couvre un bâtiment ou une école, comme le réseau d'une salle informatique. Le réseau métropolitain ou MAN, qui couvre une ville. Et le réseau étendu ou WAN, qui couvre un pays ou le monde entier. Le plus connu des réseaux WAN est bien sûr Internet.",
    "note": "Plus la zone est grande, plus le réseau est complexe à gérer."
  },
  {
    "titre": "Classification selon la connectique",
    "contenu": "<div style='padding: 10px;'><h3 style='color: #1e3a5f;'>🔌 Classification selon le type de connectique</h3><div style='display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px;'><div style='background: #f0fdf4; padding: 12px; border-radius: 8px; border: 2px solid #22c55e; color: #000000;'><strong>🔌 Réseaux filaires</strong><br><span style='font-size: 0.9em;'>Utilisent des câbles (Ethernet, fibre optique)</span></div><div style='background: #ebf8ff; padding: 12px; border-radius: 8px; border: 2px solid #4299e1; color: #000000;'><strong>📡 Réseaux sans-fil</strong><br><span style='font-size: 0.9em;'>Utilisent des ondes radio (Wi-Fi, Bluetooth)</span></div></div><div style='background: #f0fdf4; padding: 12px; border-radius: 8px; margin-top: 10px; border: 2px solid #22c55e; color: #000000'><p><strong>✅ Avantages du filaire :</strong></p><ul><li>🔒 Sécurité renforcée (moins d'interceptions)</li><li>⚡ Performance stable et débits élevés</li><li>📶 Fiabilité (moins d'interférences)</li></ul><p><strong>❌ Inconvénients :</strong> portée limitée, installation complexe, coût élevé.</p></div><div style='background: #ebf8ff; padding: 12px; border-radius: 8px; margin-top: 10px; border: 2px solid #4299e1; color: #000000'><p><strong>✅ Avantages du sans-fil :</strong></p><ul><li>🔄 Mobilité (liberté de déplacement)</li><li>🔧 Installation facile (pas de câbles)</li><li>📱 Connectivité avec tous les appareils</li></ul><p><strong>❌ Inconvénients :</strong> sécurité moindre, interférences, débit variable.</p></div></div>",
    "texteParle": "Les réseaux peuvent aussi être classés selon le type de connectique utilisée. Les réseaux filaires utilisent des câbles comme Ethernet ou la fibre optique. Ils sont plus sécurisés, plus rapides et plus fiables, mais leur portée est limitée, l'installation est complexe et le coût est élevé. Les réseaux sans-fil utilisent des ondes radio comme le Wi-Fi ou le Bluetooth. Ils offrent plus de mobilité, une installation facile et une bonne connectivité, mais leur sécurité est moindre, ils sont sensibles aux interférences et leur débit varie selon la distance.",
    "note": "Le choix entre filaire et sans-fil dépend des besoins en mobilité et en sécurité."
  },
  {
    "titre": "Topologies : définition",
    "contenu": "<div style='padding: 10px;'><h3 style='color: #1e3a5f;'>🔀 Qu'est-ce qu'une topologie réseau ?</h3><div style='background: #e8f4fd; padding: 15px; border-radius: 10px; border-left: 5px solid #2d6da8; color: #000000'><p><strong>Définition :</strong> La <strong>topologie réseau</strong> décrit la <strong>manière dont les ordinateurs sont connectés</strong> entre eux dans un réseau. Elle définit la disposition des équipements et le cheminement des données.</p></div><div style='display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px;'><div style='background: #dbeafe; padding: 12px; border-radius: 8px; color: #000000'><strong>🏗️ Topologie physique</strong><br><span style='font-size: 0.9em;'>Disposition réelle des câbles et équipements</span></div><div style='background: #d1fae5; padding: 12px; border-radius: 8px; color: #000000'><strong>🧠 Topologie logique</strong><br><span style='font-size: 0.9em;'>Cheminement des données dans le réseau</span></div></div><div style='background: #fef3c7; padding: 12px; border-radius: 8px; margin-top: 12px; color: #000000'><p><strong>📌 À retenir :</strong> La topologie physique est ce que l'on voit, la topologie logique est la façon dont les données circulent.</p></div></div>",
    "texteParle": "La topologie réseau décrit la manière dont les ordinateurs sont connectés entre eux. On distingue deux types de topologies. La topologie physique, qui est la disposition réelle des câbles et des équipements, ce que l'on peut voir. Et la topologie logique, qui décrit le cheminement des données dans le réseau, c'est-à-dire la façon dont les informations circulent entre les machines.",
    "note": "La topologie physique est visible, la topologie logique est conceptuelle."
  },

    "texteParle": "Commençons par les topologies physiques. La topologie en bus utilise un seul câble qui relie tous les ordinateurs. C'est simple et économique, mais si le câble principal casse, tout le réseau tombe en panne. La topologie en anneau, où les ordinateurs forment un cercle. Les données circulent dans un sens, avec un jeton. L'avantage est qu'il n'y a pas de collision, mais si un ordinateur tombe en panne, tout le réseau est interrompu.",

    "texteParle": "Continuons avec la topologie en étoile, la plus utilisée aujourd'hui. Tous les ordinateurs sont reliés à un switch central. C'est facile à gérer, et une panne locale n'affecte pas tout le réseau. Mais si le switch central tombe en panne, tout le réseau est paralysé. Enfin, la topologie en maille, où chaque ordinateur est connecté à plusieurs autres. C'est très fiable car il y a plusieurs chemins possibles, mais c'est très coûteux et complexe à installer.",
    "note": "La topologie en étoile est la plus répandue dans les réseaux locaux modernes."
  },
  {
    "titre": "Topologies logiques",
    "contenu": "<div style='padding: 10px;'><h3 style='color: #1e3a5f;'>🧠 Topologies logiques</h3><div style='background: #e8f4fd; padding: 15px; border-radius: 10px; border-left: 5px solid #2d6da8; color: #000000'><p><strong>Définition :</strong> La <strong>topologie logique</strong> décrit la façon dont les données circulent dans le réseau, indépendamment de la disposition physique des câbles.</p></div><div style='display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 12px;'><div style='background: #dbeafe; padding: 12px; border-radius: 8px; color: #000000'><strong>📡 Ethernet</strong><br><span style='font-size: 0.9em;'>Topologie logique en bus. Les données sont diffusées à tous les ordinateurs, chacun vérifie si le message lui est destiné. Utilisé dans la plupart des réseaux locaux modernes.</span></div><div style='background: #d1fae5; padding: 12px; border-radius: 8px; color: #000000'><strong>🔑 Token Ring</strong><br><span style='font-size: 0.9em;'>Topologie logique en anneau. Un jeton circule, seul l'ordinateur qui possède le jeton peut émettre. Développé par IBM.</span></div><div style='background: #fef3c7; padding: 12px; border-radius: 8px; color: #000000'><strong>🍎 AppleTalk</strong><br><span style='font-size: 0.9em;'>Protocole réseau d'Apple. Utilisé dans les réseaux Apple. Remplacé aujourd'hui par TCP/IP.</span></div></div></div>",
    "texteParle": "Les topologies logiques décrivent la façon dont les données circulent, indépendamment de la disposition physique. Il existe trois principales topologies logiques. Ethernet, qui utilise une topologie logique en bus : les données sont diffusées à tous les ordinateurs, et chacun vérifie si le message lui est destiné. C'est la plus utilisée aujourd'hui. Token Ring, développé par IBM, utilise une topologie logique en anneau : un jeton circule, et seul l'ordinateur qui possède le jeton peut émettre. Enfin, AppleTalk, le protocole réseau d'Apple, aujourd'hui remplacé par TCP/IP.",
    "note": "Ethernet est la topologie logique la plus utilisée dans les réseaux modernes."
  },
  {
    "titre": "Architectures réseau",
    "contenu": "<div style='padding: 10px;'><h3 style='color: #1e3a5f;'>🏗️ Architectures réseau</h3><div style='background: #e8f4fd; padding: 15px; border-radius: 10px; border-left: 5px solid #2d6da8; color: #000000'><p><strong>Définition :</strong> L'<strong>architecture réseau</strong> décrit la façon dont les ordinateurs sont organisés et interagissent entre eux dans un réseau. Elle définit les rôles des machines et la répartition des ressources.</p></div><div style='display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px;'><div style='background: #d1fae5; padding: 12px; border-radius: 8px; color: #000000'><strong>👥 Client-Serveur</strong><br><span style='font-size: 0.9em;'>Un ou plusieurs serveurs centraux fournissent des services aux clients. Les clients font des requêtes, les serveurs répondent.</span></div><div style='background: #fef3c7; padding: 12px; border-radius: 8px; color: #000000'><strong>🤝 Peer to Peer (P2P)</strong><br><span style='font-size: 0.9em;'>Tous les ordinateurs sont égaux. Chacun peut être à la fois client et serveur. Pas de serveur central.</span></div></div><div style='background: #f8f9fa; padding: 12px; border-radius: 8px; margin-top: 12px; color: #000000'><p><strong>📌 Comparaison :</strong></p><ul><li><strong>Client-Serveur :</strong> centralisé, sécurisé, mais coûteux et dépendant du serveur.</li><li><strong>Peer to Peer :</strong> décentralisé, économique, mais moins sécurisé et difficile à gérer.</li></ul></div></div>",
    "texteParle": "L'architecture réseau décrit la façon dont les ordinateurs sont organisés et interagissent. Il existe deux architectures principales. L'architecture client-serveur, où un ou plusieurs serveurs centraux fournissent des services aux clients. Les clients font des requêtes et les serveurs répondent. C'est centralisé, sécurisé, mais coûteux et dépendant du serveur. Et l'architecture peer to peer, où tous les ordinateurs sont égaux. Chacun peut être à la fois client et serveur. Pas de serveur central. C'est décentralisé, économique, mais moins sécurisé et plus difficile à gérer.",
    "note": "Le choix de l'architecture dépend de la taille et des besoins du réseau."
  },

    "texteParle": "Commençons par le câble à paire torsadée. C'est le câble le plus utilisé dans les réseaux locaux, avec un débit pouvant atteindre 10 Gbit/s. Il est peu coûteux et facile à installer. Son connecteur est le RJ45, un connecteur à 8 broches, aussi appelé 8P8C. Il relie le câble aux ordinateurs et aux switchs. Il existe deux normes de câblage : T568A et T568B.",

    "texteParle": "Enfin, la fibre optique est utilisée dans les réseaux métropolitains et étendus, comme Internet. Elle offre des débits très élevés, jusqu'à 100 Gbit/s et plus, et est insensible aux interférences électromagnétiques. Mais elle est coûteuse, fragile et son installation est délicate. Il existe plusieurs types de connecteurs optiques. Le connecteur SC, de type push-pull, utilisé dans les réseaux FTTH. Le connecteur LC, de petite taille, utilisé dans les centres de données. Et le connecteur ST, à baïonnette, utilisé dans les anciens réseaux optiques.",
    "note": "Les connecteurs optiques les plus courants sont SC, LC et ST."

    "texteParle": "Les équipements d'interconnexion permettent de relier les ordinateurs et les réseaux entre eux. Le switch relie les ordinateurs dans un réseau local et dirige les données vers le bon destinataire. Le hub est un ancien équipement qui diffuse les données à tous les ordinateurs, il est obsolète et remplacé par le switch. Le routeur relie différents réseaux, par exemple le réseau local et Internet, et gère le routage des données. Le modem convertit le signal pour l'accès Internet. Enfin, la passerelle relie deux réseaux de protocoles différents en traduisant les protocoles.",
    "note": "Le switch et le routeur sont les équipements les plus utilisés dans les réseaux modernes."

  {
    "titre": "À retenir",
    "contenu": "<div style='padding: 10px;'><h3 style='color: #1e3a5f;'>📌 Points clés de la leçon</h3><div style='background: #f0fdf4; padding: 15px; border-radius: 10px; border: 2px solid #22c55e; color: #000000'><ul style='list-style-type: none; padding: 0;'><li style='padding: 8px; border-bottom: 1px solid #dcfce7;'>✅ Un <strong>réseau</strong> est un ensemble d'ordinateurs connectés pour échanger des données</li><li style='padding: 8px; border-bottom: 1px solid #dcfce7;'>✅ Avantages : partage, communication, centralisation. Inconvénients : sécurité, coût, complexité</li><li style='padding: 8px; border-bottom: 1px solid #dcfce7;'>✅ Types selon l'étendue : <strong>PAN</strong>, <strong>LAN</strong>, <strong>MAN</strong>, <strong>WAN</strong></li><li style='padding: 8px; border-bottom: 1px solid #dcfce7;'>✅ Types selon la connectique : <strong>filaire</strong> vs <strong>sans-fil</strong></li><li style='padding: 8px; border-bottom: 1px solid #dcfce7;'>✅ Topologies physiques : <strong>bus</strong>, <strong>anneau</strong>, <strong>étoile</strong>, <strong>maille</strong></li><li style='padding: 8px; border-bottom: 1px solid #dcfce7;'>✅ Topologies logiques : <strong>Ethernet</strong>, <strong>Token Ring</strong>, <strong>AppleTalk</strong></li><li style='padding: 8px; border-bottom: 1px solid #dcfce7;'>✅ Architectures : <strong>client-serveur</strong> et <strong>peer to peer</strong></li><li style='padding: 8px; border-bottom: 1px solid #dcfce7;'>✅ Câbles : <strong>paire torsadée</strong> (RJ45), <strong>coaxial</strong> (BNC), <strong>fibre optique</strong> (SC, LC, ST)</li><li style='padding: 8px;'>✅ Équipements : <strong>switch</strong>, <strong>hub</strong>, <strong>routeur</strong>, <strong>modem</strong>, <strong>passerelle</strong></li></ul></div></div>",
    "texteParle": "Pour conclure cette leçon, retenons les points essentiels. Un réseau est un ensemble d'ordinateurs connectés pour échanger des données et partager des ressources. Ses avantages sont le partage, la communication et la centralisation ; ses inconvénients sont la sécurité, le coût et la complexité. On distingue les réseaux selon leur étendue : PAN, LAN, MAN et WAN. Selon la connectique : filaire ou sans-fil. Les topologies physiques sont le bus, l'anneau, l'étoile et la maille. Les topologies logiques sont Ethernet, Token Ring et AppleTalk. Les architectures sont client-serveur et peer to peer. Les câbles sont la paire torsadée avec connecteur RJ45, le coaxial avec connecteur BNC, et la fibre optique avec les connecteurs SC, LC et ST. Enfin, les équipements sont le switch, le hub, le routeur, le modem et la passerelle.",
    "note": "Les réseaux sont devenus indispensables dans notre vie quotidienne et professionnelle."
  }
];
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentIndex = 0;
    let isSpeaking = false;
    let isPaused = false;
    let currentUtterance = null;
    let isLoading = false;
    let loadingTimeout = null;
    let isTransitioning = false;
    let speechSupported = true;
    let userInteracted = false;
    let isPlaying = false;
    let loadingCancelled = false;
    const total = slides.length;
    const synth = window.speechSynthesis;
    // Références jQuery
    const $title = $('#slideTitle');
    const $body = $('#slideBody');
    const $counter = $('#slideCounter');
    const $statusText = $('#statusText');
    const $statusBadge = $('#statusBadge');
    const $loading = $('#loadingOverlay');
    const $loadingText = $('#loadingText');
    const $loadingSub = $('#loadingSub');
    const $loadingTimeout = $('#loadingTimeout');
    const $loadingProgressBar = $('#loadingProgressBar');
    const $autoIndicator = $('#autoIndicator');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $replay = $('#replayBtn');
    const $play = $('#playBtn');
    const $cancelLoading = $('#cancelLoadingBtn');
    // ================================================================
    // FONCTIONS
    // ================================================================
    function setStatus(text, type) {
        $statusText.text(text);
        $statusBadge.removeClass('idle speaking error paused waiting loading');
        if (type === 'speaking') $statusBadge.addClass('speaking');
        else if (type === 'error') $statusBadge.addClass('error');
        else if (type === 'paused') $statusBadge.addClass('paused');
        else if (type === 'waiting') $statusBadge.addClass('waiting');
        else if (type === 'loading') $statusBadge.addClass('loading');
        else $statusBadge.addClass('idle');
    }
    function updatePlayButton() {
        if (isPlaying) {
            $play.addClass('playing');
            $play.find('.btn-icon').text('⏸');
            $play.find('.btn-label').text('Pause');
        } else {
            $play.removeClass('playing');
            $play.find('.btn-icon').text('▶');
            $play.find('.btn-label').text('Play');
        }
    }
    function showLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        loadingCancelled = false;
        isLoading = true;
        // Réinitialiser la barre de progression
        $loadingProgressBar.css('animation', 'none');
        $loadingProgressBar.css('width', '0%');
        // Forcer un reflow
        $loadingProgressBar[0].offsetHeight;
        $loadingProgressBar.css('animation', 'loadingProgress 30s ease-out forwards');
        $loadingText.text('Préparation vocale...');
        $loadingSub.text('Synthèse en cours');
        $loadingTimeout.text('⏱️ 30 secondes maximum');
        $loading.fadeIn(300);
        setStatus("⏳ Chargement...", 'loading');
        // 🔥 TIMEOUT DE 30 SECONDES
        loadingTimeout = setTimeout(() => {
            if (isLoading && !loadingCancelled) {
                hideLoading();
                setStatus("⚠️ Délai dépassé (30s)", 'error');
                isPlaying = false;
                updatePlayButton();
                $loadingSub.text('La synthèse vocale a pris trop de temps');
                $loadingTimeout.text('❌ Délai dépassé');
            }
        }, 30000);
    }
    function hideLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        isLoading = false;
        loadingCancelled = false;
        $loading.fadeOut(300);
        // Ne pas changer le statut si on est en train de parler
        if (!isSpeaking && !isPlaying) {
            setStatus("⏸ Lecture arrêtée", 'paused');
        }
    }
    function cancelLoading() {
        loadingCancelled = true;
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        hideLoading();
        stopSpeaking();
        setStatus("⏸ Annulé", 'paused');
        isPlaying = false;
        updatePlayButton();
        $loadingText.text('Annulé par l\'utilisateur');
        $loadingSub.text('Vous pouvez réessayer');
        $loadingTimeout.text('✕ Annulation');
    }
    // Arrêter la parole proprement
    function stopSpeaking() {
        try {
            if (synth && (synth.speaking || synth.pending)) {
                synth.cancel();
            }
        } catch(e) {
            console.warn('Erreur stopSpeaking:', e);
        }
        if (currentUtterance) {
            try {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance.onstart = null;
            } catch(e) {}
            currentUtterance = null;
        }
        isSpeaking = false;
        isPlaying = false;
        updatePlayButton();
    }
    // Mettre en pause la parole
    function pauseSpeaking() {
        try {
            if (synth && synth.speaking) {
                synth.pause();
                isPaused = true;
                isPlaying = false;
                setStatus("⏸ Lecture en pause", 'paused');
                updatePlayButton();
            }
        } catch(e) {
            console.warn('Erreur pauseSpeaking:', e);
            stopSpeaking();
        }
    }
    // Reprendre la parole
    function resumeSpeaking() {
        try {
            if (synth && synth.paused) {
                synth.resume();
                isPaused = false;
                isPlaying = true;
                setStatus("🔊 Lecture en cours", 'speaking');
                updatePlayButton();
            } else if (!isSpeaking && !synth.speaking && !synth.pending) {
                speakSlide(currentIndex);
            }
        } catch(e) {
            console.warn('Erreur resumeSpeaking:', e);
            speakSlide(currentIndex);
        }
    }
    function renderSlide(index) {
        const slide = slides[index];
        $title.text(slide.titre);
        let html = '';
        html += `<div class="content-card">${slide.contenu}</div>`;
        if (slide.note) {
            html += `<div class="note-box">${slide.note}</div>`;
        }
        $body.html(html);
        $counter.text(`${index+1} / ${total}`);
        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
        }
    }
    // ================================================================
    // LECTURE VOCALE
    // ================================================================
    function speakSlide(index) {
        return new Promise((resolve) => {
            const slide = slides[index];
            const text = slide.texteParle;
            if (!text || text.trim() === '' || !speechSupported) {
                resolve();
                return;
            }
            if (!window.speechSynthesis) {
                setStatus("❌ Synthèse vocale non supportée", 'error');
                speechSupported = false;
                resolve();
                return;
            }
            // Arrêter toute lecture en cours
            stopSpeaking();
            // Réinitialiser l'état de pause
            isPaused = false;
            showLoading();
            setStatus("Initialisation...", 'loading');
            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.92;
                utterance.pitch = 1.05;
                utterance.volume = 1;
                let isFinished = false;
                let errorHandled = false;
                utterance.onstart = function() {
                    if (loadingCancelled) {
                        stopSpeaking();
                        resolve();
                        return;
                    }
                    hideLoading();
                    isSpeaking = true;
                    isPlaying = true;
                    isPaused = false;
                    setStatus("🔊 Lecture en cours", 'speaking');
                    updatePlayButton();
                };
                utterance.onend = function() {
                    if (isFinished) return;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    setStatus("✅ Terminé", 'idle');
                    hideLoading();
                    updatePlayButton();
                    resolve();
                };
                utterance.onerror = function(e) {
                    if (isFinished || errorHandled) return;
                    errorHandled = true;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    hideLoading();
                    updatePlayButton();
                    if (e.error === 'not-allowed') {
                        setStatus("⚠️ Permission refusée", 'error');
                    } else if (e.error === 'synthesis-unavailable') {
                        setStatus("⚠️ Synthèse indisponible", 'error');
                    } else if (e.error === 'canceled') {
                        setStatus("⏸ Annulé", 'paused');
                    } else {
                        setStatus("❌ Erreur audio: " + (e.error || 'inconnue'), 'error');
                    }
                    resolve();
                };
                // Gestion du chargement des voix
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = function() {
                        if (!loadingCancelled) {
                            try {
                                synth.speak(utterance);
                            } catch(err) {
                                // Silencieux
                            }
                        }
                        synth.onvoiceschanged = null;
                    };
                }
                currentUtterance = utterance;
                if (!loadingCancelled) {
                    try {
                        synth.speak(utterance);
                    } catch(err) {
                        setTimeout(() => {
                            if (!loadingCancelled) {
                                try {
                                    synth.speak(utterance);
                                } catch(e) {
                                    setStatus("❌ Erreur de lecture", 'error');
                                    isPlaying = false;
                                    updatePlayButton();
                                    hideLoading();
                                    resolve();
                                }
                            } else {
                                resolve();
                            }
                        }, 100);
                    }
                } else {
                    resolve();
                }
            } catch(err) {
                hideLoading();
                setStatus("❌ Erreur générale", 'error');
                isPlaying = false;
                updatePlayButton();
                console.error('Erreur speakSlide:', err);
                resolve();
            }
        });
    }
    // ================================================================
    // NAVIGATION
    // ================================================================
    async function goToSlide(index) {
        if (isTransitioning) return;
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        // Si on est en train de lire, on met en pause avant de naviguer
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        // Arrêter complètement la lecture
        stopSpeaking();
        await new Promise(r => setTimeout(r, 50));
        if (index === currentIndex) {
            setStatus("📄 Slide actuel", 'idle');
            return;
        }
        isTransitioning = true;
        currentIndex = index;
        renderSlide(index);
        // Réinitialiser l'état de lecture
        isPlaying = false;
        updatePlayButton();
        setStatus("⏸ Lecture arrêtée", 'paused');
        await new Promise(r => setTimeout(r, 150));
        isTransitioning = false;
    }
    async function goToNext() {
        if (isTransitioning) return;
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        if (currentIndex + 1 < total) {
            await goToSlide(currentIndex + 1);
        } else {
            setStatus("🏁 Dernier slide", 'idle');
        }
    }
    async function goToPrev() {
        if (isTransitioning) return;
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        if (currentIndex - 1 >= 0) {
            await goToSlide(currentIndex - 1);
        } else {
            setStatus("🔁 Premier slide", 'idle');
        }
    }
    // ================================================================
    // GESTION PLAY/PAUSE
    // ================================================================
    function togglePlay() {
        if (!userInteracted) {
            userInteracted = true;
        }
        // Si le chargement est en cours, on l'annule
        if (isLoading) {
            cancelLoading();
            return;
        }
        // Si le synthétiseur est en pause, on reprend
        if (synth && synth.paused) {
            resumeSpeaking();
            return;
        }
        // Si la lecture est en cours, on met en pause
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
            return;
        }
        // Sinon, on démarre la lecture du slide courant
        if (!isSpeaking && !isPlaying) {
            stopSpeaking();
            speakSlide(currentIndex);
        }
    }
    // ================================================================
    // INIT
    // ================================================================
    async function init() {
        // Vérifier la compatibilité
        if (!window.speechSynthesis) {
            setStatus("❌ Synthèse vocale non supportée", 'error');
            speechSupported = false;
        }
        // Précharger les voix
        try {
            if (synth.getVoices) {
                synth.getVoices();
                setTimeout(() => {
                    try {
                        synth.getVoices();
                    } catch(e) {}
                }, 200);
            }
        } catch(e) {
            console.warn('Erreur chargement voix:', e);
        }
        // Afficher le premier slide
        renderSlide(0);
        $counter.text(`1 / ${total}`);
        // État initial
        setStatus("⏸ Appuie sur Play", 'paused');
        updatePlayButton();
        $autoIndicator.text('⏸ Lecture manuelle');
        // ================================================================
        // ÉVÉNEMENTS
        // ================================================================
        // Bouton Play/Pause
        $play.on('click', function() {
            togglePlay();
        });
        // Bouton Annuler le chargement
        $cancelLoading.on('click', function() {
            cancelLoading();
        });
        // Navigation
        $prev.on('click', function() {
            // Si chargement en cours, on annule
            if (isLoading) cancelLoading();
            goToPrev();
        });
        $next.on('click', function() {
            if (isLoading) cancelLoading();
            goToNext();
        });
        // Replay - relire le slide courant
        $replay.on('click', function() {
            if (isLoading) cancelLoading();
            stopSpeaking();
            setTimeout(() => {
                speakSlide(currentIndex);
            }, 100);
        });
        // Support du clavier (espace pour play/pause)
        $(document).on('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });
        // Nettoyage
        $(window).on('beforeunload', function() {
            try {
                if (synth.speaking) synth.cancel();
            } catch(e) {}
            hideLoading();
        });
        // Gérer les cas où la synthèse se termine de manière inattendue
        setInterval(() => {
            if (isPlaying && !synth.speaking && !synth.pending && !isPaused && !isLoading) {
                isPlaying = false;
                updatePlayButton();
                setStatus("⏸ Lecture arrêtée", 'paused');
            }
        }, 1000);
    }
    init();
});
    // ================================================================
    // GESTION DU THÈME JOUR/NUIT
    // ================================================================
    let isDarkMode = false;
    function toggleTheme() {
        isDarkMode = !isDarkMode;
        const body = document.body;
        const appContainer = document.querySelector('.app-container');
        const header = document.querySelector('.slide-header');
        const footer = document.querySelector('.slide-footer');
        const contentCards = document.querySelectorAll('.content-card');
        const noteBoxes = document.querySelectorAll('.note-box');
        const mathBlocks = document.querySelectorAll('.math-block');
        const buttons = document.querySelectorAll('.btn');
        const statusBadge = document.querySelector('.status-badge');
        const slideCounter = document.querySelector('.slide-counter');
        const autoIndicator = document.querySelector('.auto-indicator');
        const themeBtn = document.getElementById('themeToggle');
        if (isDarkMode) {
            // Mode nuit
            body.style.background = '#0b1120';
            body.style.color = '#f1f5f9';
            if (appContainer) appContainer.style.background = 'linear-gradient(145deg, #0f172a 0%, #1e293b 100%)';
            if (header) header.style.background = 'rgba(15, 23, 42, 0.85)';
            if (footer) footer.style.background = 'rgba(15, 23, 42, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.05)';
                card.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.08)';
                note.style.color = '#cbd5e1';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.25)';
                block.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#e2e8f0';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.12)';
                statusBadge.style.color = '#93bbfc';
            }
            if (slideCounter) {
                slideCounter.style.color = '#94a3b8';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#64748b';
            }
            if (themeBtn) {
                themeBtn.textContent = '☀️';
                themeBtn.title = 'Passer en mode jour';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#e2e8f0';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#e2e8f0';
                }
            });
        } else {
            // Mode jour (par défaut)
            body.style.background = '#f0f4f8';
            body.style.color = '#1a202c';
            if (appContainer) appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
            if (header) header.style.background = 'rgba(255, 255, 255, 0.85)';
            if (footer) footer.style.background = 'rgba(255, 255, 255, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.8)';
                card.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.12)';
                note.style.color = '#2c3e50';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.05)';
                block.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#2d3748';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
                statusBadge.style.color = '#2b6cb0';
            }
            if (slideCounter) {
                slideCounter.style.color = '#4a5568';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#718096';
            }
            if (themeBtn) {
                themeBtn.textContent = '🌓';
                themeBtn.title = 'Passer en mode nuit';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#2c3e50';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#2d3748';
                }
            });
        }
    }
    // Initialiser en mode jour
    document.addEventListener('DOMContentLoaded', function() {
        // Appliquer le mode jour par défaut
        const body = document.body;
        body.style.background = '#f0f4f8';
        body.style.color = '#1a202c';
        const appContainer = document.querySelector('.app-container');
        if (appContainer) {
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
        }
        const header = document.querySelector('.slide-header');
        if (header) {
            header.style.background = 'rgba(255, 255, 255, 0.85)';
        }
        const footer = document.querySelector('.slide-footer');
        if (footer) {
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
        }
        document.querySelectorAll('.content-card').forEach(card => {
            card.style.background = 'rgba(255,255,255,0.8)';
            card.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        document.querySelectorAll('.note-box').forEach(note => {
            note.style.background = 'rgba(96, 165, 250, 0.12)';
            note.style.color = '#2c3e50';
        });
        document.querySelectorAll('.math-block').forEach(block => {
            block.style.background = 'rgba(0,0,0,0.05)';
            block.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        document.querySelectorAll('.btn').forEach(btn => {
            btn.style.color = '#2d3748';
        });
        const statusBadge = document.querySelector('.status-badge');
        if (statusBadge) {
            statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
            statusBadge.style.color = '#2b6cb0';
        }
        const slideCounter = document.querySelector('.slide-counter');
        if (slideCounter) {
            slideCounter.style.color = '#4a5568';
        }
        const autoIndicator = document.querySelector('.auto-indicator');
        if (autoIndicator) {
            autoIndicator.style.color = '#718096';
        }
        document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
            if (!el.closest('.note-box')) {
                el.style.color = '#2c3e50';
            }
        });
        document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
            if (!el.closest('.note-box') && !el.closest('.math-block')) {
                el.style.color = '#2d3748';
            }
        });
        const themeBtn = document.getElementById('themeToggle');
        if (themeBtn) {
            themeBtn.textContent = '🌓';
            themeBtn.title = 'Passer en mode nuit';
            // Ajouter l'écouteur d'événement click
            themeBtn.addEventListener('click', toggleTheme);
        }
    });
