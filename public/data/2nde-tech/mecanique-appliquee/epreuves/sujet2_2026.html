<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Mécanique Appliquée",
  "classe": "2nde Technique",
  "sequence": "Séquence 2",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Opérations vectorielles",
      "points": "4 pts",
      "enonce": "<div style='font-size:1em; line-height:1.6;'><p>Cet exercice porte sur les opérations vectorielles fondamentales.</p></div>",
      "questions": [
        {
          "question": "<div><p><strong>1. (1,5 pts)</strong> Soient deux vecteurs \\( \\vec{A} = (4, 3) \\) et \\( \\vec{B} = (-2, 5) \\).</p><ul><li>a) Calcule la norme de chaque vecteur.</li><li>b) Calcule le produit scalaire \\( \\vec{A} \\cdot \\vec{B} \\).</li><li>c) Détermine l'angle entre les deux vecteurs.</li></ul></div>",
          "reponse": "<div><p><strong>a) Normes :</strong></p><div class='math-block'><div class='math'>$$ ||\\vec{A}|| = \\sqrt{4^2 + 3^2} = \\sqrt{16 + 9} = 5 $$</div></div><div class='math-block'><div class='math'>$$ ||\\vec{B}|| = \\sqrt{(-2)^2 + 5^2} = \\sqrt{4 + 25} = \\sqrt{29} \\approx 5,39 $$</div></div><p><strong>b) Produit scalaire :</strong></p><div class='math-block'><div class='math'>$$ \\vec{A} \\cdot \\vec{B} = 4 \\times (-2) + 3 \\times 5 = -8 + 15 = 7 $$</div></div><p><strong>c) Angle :</strong></p><div class='math-block'><div class='math'>$$ \\cos(\\theta) = \\frac{\\vec{A} \\cdot \\vec{B}}{||\\vec{A}|| \\times ||\\vec{B}||} = \\frac{7}{5 \\times 5,39} = \\frac{7}{26,95} \\approx 0,260 $$</div></div><div class='math-block'><div class='math'>$$ \\theta = \\arccos(0,260) \\approx 74,93° $$</div></div></div>"
        },
        {
          "question": "<div><p><strong>2. (1,5 pts)</strong> Décompose le vecteur \\( \\vec{F} = 100 \\, N \\) faisant un angle de 40° avec l'horizontale en ses composantes horizontale et verticale.</p></div>",
          "reponse": "<div><p><strong>Composante horizontale :</strong></p><div class='math-block'><div class='math'>$$ F_x = F \\times \\cos(40°) = 100 \\times 0,766 = 76,6 \\, N $$</div></div><p><strong>Composante verticale :</strong></p><div class='math-block'><div class='math'>$$ F_y = F \\times \\sin(40°) = 100 \\times 0,643 = 64,3 \\, N $$</div></div></div>"
        },
        {
          "question": "<div><p><strong>3. (1 pt)</strong> Calcule le produit vectoriel \\( \\vec{A} \\wedge \\vec{B} \\) des vecteurs \\( \\vec{A} = (4, 3) \\) et \\( \\vec{B} = (-2, 5) \\).</p></div>",
          "reponse": "<div><p>Le produit vectoriel en 2D est un scalaire :</p><div class='math-block'><div class='math'>$$ \\vec{A} \\wedge \\vec{B} = A_x B_y - A_y B_x = 4 \\times 5 - 3 \\times (-2) = 20 + 6 = 26 $$</div></div></div>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : PFS et équilibre d'un solide",
      "points": "5 pts",
      "enonce": "<div style='font-size:1em; line-height:1.6;'><p>Cet exercice évalue la maîtrise du Principe Fondamental de la Statique.</p></div>",
      "questions": [
        {
          "question": "<div><p><strong>1. (1 pt)</strong> Énonce le Principe Fondamental de la Statique (PFS) pour un solide soumis à un système de forces extérieures.</p></div>",
          "reponse": "<div><p>Un solide est en équilibre sous l'action d'un système de forces extérieures si et seulement si :</p><ul><li>La somme vectorielle de toutes les forces extérieures est nulle : <span class='math'>\\( \\sum \\vec{F}_{ext} = \\vec{0} \\)</span>.</li><li>La somme des moments de toutes les forces extérieures par rapport à un point quelconque est nulle : <span class='math'>\\( \\sum \\vec{M}_{ext}(O) = \\vec{0} \\)</span>.</li></ul></div>"
        },
        {
          "question": "<div><p><strong>2. (2 pts)</strong> Une poutre homogène de masse 100 kg et de longueur 6 m est posée sur deux supports A et B. Les supports sont situés à 1 m des extrémités de la poutre.</p><ul><li>a) Définis le système et fais le bilan des actions mécaniques extérieures.</li><li>b) Calcule les réactions aux supports A et B.</li></ul></div>",
          "reponse": "<div><p><strong>a) Système :</strong> La poutre.</p><p><strong>BAME :</strong></p><ul><li>Poids de la poutre : <span class='math'>\\( P = 100 \\times 9,81 = 981 \\, N \\)</span>, appliqué au centre de la poutre.</li><li>Réaction en A : <span class='math'>\\( R_A \\)</span>, verticale vers le haut.</li><li>Réaction en B : <span class='math'>\\( R_B \\)</span>, verticale vers le haut.</li></ul><p><strong>b) Calcul des réactions :</strong></p><p>Les supports sont à 1 m des extrémités, donc la distance entre A et B est de 4 m.</p><p>Équilibre des forces :</p><div class='math-block'><div class='math'>$$ R_A + R_B = P = 981 \\, N $$</div></div><p>Équilibre des moments par rapport à A :</p><p>Moment du poids : <span class='math'>\\( -981 \\times 2 = -1962 \\, N.m \\)</span> (bras de levier : 3 - 1 = 2 m).</p><p>Moment de <span class='math'>\\( R_B \\)</span> : <span class='math'>\\( R_B \\times 4 \\)</span>.</p><div class='math-block'><div class='math'>$$ -1962 + 4R_B = 0 \\Rightarrow R_B = 490,5 \\, N $$</div></div><div class='math-block'><div class='math'>$$ R_A = 981 - 490,5 = 490,5 \\, N $$</div></div></div>"
        },
        {
          "question": "<div><p><strong>3. (1 pt)</strong> Applique le principe d'action/réaction pour expliquer pourquoi les réactions aux supports sont dirigées vers le haut.</p></div>",
          "reponse": "<div><p>Le principe d'action/réaction stipule que si la poutre exerce une force vers le bas sur les supports (son poids), les supports exercent une force de même intensité, de même direction mais de sens opposé sur la poutre. C'est pourquoi les réactions sont dirigées vers le haut.</p></div>"
        },
        {
          "question": "<div><p><strong>4. (1 pt)</strong> Si on place une charge de 50 kg au centre de la poutre, quelles sont les nouvelles réactions aux supports ?</p></div>",
          "reponse": "<div><p>Poids de la charge : <span class='math'>\\( P_c = 50 \\times 9,81 = 490,5 \\, N \\)</span>.</p><p>Poids total : <span class='math'>\\( P_T = 981 + 490,5 = 1471,5 \\, N \\)</span>.</p><p>Par symétrie (charge au centre) :</p><div class='math-block'><div class='math'>$$ R_A = R_B = \\frac{1471,5}{2} = 735,75 \\, N $$</div></div></div>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Référentiel et mouvement",
      "points": "4 pts",
      "enonce": "<div style='font-size:1em; line-height:1.6;'><p>Cet exercice porte sur les notions de référentiel, de mouvement absolu et relatif.</p></div>",
      "questions": [
        {
          "question": "<div><p><strong>1. (1 pt)</strong> Définis la notion de référentiel en cinématique. Donne un exemple de référentiel terrestre et de référentiel mobile.</p></div>",
          "reponse": "<div><p>Un <strong>référentiel</strong> est un solide de référence par rapport auquel on étudie le mouvement d'un système. C'est le corps par rapport auquel les positions sont repérées.</p><ul><li><strong>Référentiel terrestre :</strong> La Terre (ou un repère fixe lié au sol).</li><li><strong>Référentiel mobile :</strong> Un train en mouvement, un bateau, etc.</li></ul></div>"
        },
        {
          "question": "<div><p><strong>2. (1,5 pts)</strong> Un passager marche dans un train à 5 km/h vers l'avant. Le train roule à 80 km/h.</p><ul><li>a) Calcule la vitesse du passager par rapport au sol.</li><li>b) Si le passager marche en sens inverse, quelle est sa vitesse par rapport au sol ?</li></ul></div>",
          "reponse": "<div><p><strong>a) Dans le sens du train :</strong></p><div class='math-block'><div class='math'>$$ v = v_{train} + v_{passager} = 80 + 5 = 85 \\, km/h $$</div></div><p><strong>b) En sens inverse :</strong></p><div class='math-block'><div class='math'>$$ v = v_{train} - v_{passager} = 80 - 5 = 75 \\, km/h $$</div></div></div>"
        },
        {
          "question": "<div><p><strong>3. (1,5 pts)</strong> Un bateau traverse une rivière de 100 m de large à la vitesse de 4 m/s perpendiculairement à la rive. Le courant a une vitesse de 2 m/s.</p><ul><li>a) Calcule la vitesse du bateau par rapport à la rive.</li><li>b) Calcule le temps nécessaire pour traverser.</li></ul></div>",
          "reponse": "<div><p><strong>a) Vitesse par rapport à la rive :</strong></p><div class='math-block'><div class='math'>$$ v = \\sqrt{4^2 + 2^2} = \\sqrt{16 + 4} = \\sqrt{20} \\approx 4,47 \\, m/s $$</div></div><p><strong>b) Temps de traversée :</strong></p><p>La composante perpendiculaire est de 4 m/s.</p><div class='math-block'><div class='math'>$$ t = \\frac{100}{4} = 25 \\, s $$</div></div></div>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : CIR et mouvement plan",
      "points": "4 pts",
      "enonce": "<div style='font-size:1em; line-height:1.6;'><p>Cet exercice porte sur le Centre Instantané de Rotation (CIR) et le mouvement plan des solides.</p></div>",
      "questions": [
        {
          "question": "<div><p><strong>1. (1 pt)</strong> Définis le Centre Instantané de Rotation (CIR) d'un solide en mouvement plan.</p></div>",
          "reponse": "<div><p>Le <strong>Centre Instantané de Rotation (CIR)</strong> est le point du plan de mouvement dont la vitesse est nulle à un instant donné. C'est le point par rapport auquel le solide est en rotation pure à cet instant.</p></div>"
        },
        {
          "question": "<div><p><strong>2. (1,5 pts)</strong> Explique comment déterminer graphiquement le CIR à partir des vitesses de deux points A et B d'un solide.</p></div>",
          "reponse": "<div><p>Pour déterminer graphiquement le CIR :</p><ol><li>On connaît la direction de la vitesse de deux points A et B.</li><li>On trace les perpendiculaires aux vecteurs vitesse en A et en B.</li><li>Le CIR est à l'intersection de ces deux perpendiculaires.</li></ol></div>"
        },
        {
          "question": "<div><p><strong>3. (1,5 pts)</strong> Une roue de rayon 0,3 m roule sans glisser sur un sol horizontal. Le centre O de la roue a une vitesse de 6 m/s.</p><ul><li>a) Où se trouve le CIR ? Justifie.</li><li>b) Calcule la vitesse angulaire de la roue.</li><li>c) Quelle est la vitesse du point le plus haut de la roue ?</li></ul></div>",
          "reponse": "<div><p><strong>a) CIR :</strong> Pour une roue qui roule sans glisser, le point de contact I avec le sol a une vitesse nulle. Le CIR est donc le point I.</p><p><strong>b) Vitesse angulaire :</strong></p><div class='math-block'><div class='math'>$$ \\omega = \\frac{v_O}{R} = \\frac{6}{0,3} = 20 \\, rad/s $$</div></div><p><strong>c) Vitesse du point le plus haut :</strong></p><p>Le point le plus haut est à une distance 2R du CIR.</p><div class='math-block'><div class='math'>$$ v_{haut} = \\omega \\times 2R = 20 \\times 0,6 = 12 \\, m/s $$</div></div></div>"
        }
      ]
    },
    {
      "titre": "Exercice 5 : Composition de mouvements",
      "points": "3 pts",
      "enonce": "<div style='font-size:1em; line-height:1.6;'><p>Cet exercice porte sur la composition des vitesses et la loi de glissement.</p></div>",
      "questions": [
        {
          "question": "<div><p><strong>1. (1 pt)</strong> Écris la relation fondamentale de la composition des vitesses. Identifie chaque terme.</p></div>",
          "reponse": "<div><div class='math-block'><div class='math'>$$ \\vec{V}_a = \\vec{V}_r + \\vec{V}_e $$</div></div><p>où :</p><ul><li><span class='math'>\\( \\vec{V}_a \\)</span> : vitesse absolue (par rapport au référentiel fixe).</li><li><span class='math'>\\( \\vec{V}_r \\)</span> : vitesse relative (par rapport au référentiel mobile).</li><li><span class='math'>\\( \\vec{V}_e \\)</span> : vitesse d'entraînement (du référentiel mobile par rapport au référentiel fixe).</li></ul></div>"
        },
        {
          "question": "<div><p><strong>2. (1 pt)</strong> Un avion vole à 600 km/h vers le nord. Le vent souffle à 150 km/h vers l'est. Calcule la vitesse de l'avion par rapport au sol.</p></div>",
          "reponse": "<div><p>Les vitesses sont perpendiculaires :</p><div class='math-block'><div class='math'>$$ v = \\sqrt{600^2 + 150^2} = \\sqrt{360000 + 22500} = \\sqrt{382500} \\approx 618,47 \\, km/h $$</div></div></div>"
        },
        {
          "question": "<div><p><strong>3. (1 pt)</strong> Définis les trois états de contact entre solides : glissement, roulement et pivotement.</p></div>",
          "reponse": "<div><ul><li><strong>Glissement :</strong> Les points en contact ont des vitesses relatives tangentielles non nulles.</li><li><strong>Roulement :</strong> Les points en contact ont la même vitesse tangentielle (pas de glissement).</li><li><strong>Pivotement :</strong> Les points en contact ont des vitesses relatives normales non nulles.</li></ul></div>"
        }

    }

};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
