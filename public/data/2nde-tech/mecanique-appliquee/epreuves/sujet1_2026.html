<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Mécanique Appliquée",
  "classe": "2nde Technique",
  "sequence": "Séquence 1",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Vecteurs et Trigonométrie",
      "points": "4 pts",
      "enonce": "<p>Un technicien doit déterminer la résultante de deux forces agissant sur un point d'une structure métallique. Les forces sont :</p><ul><li><strong>\\(\\vec{F_1}\\)</strong> d'intensité \\(F_1 = 60 \\, \\text{N}\\) dirigée selon l'axe \\(x\\) positif.</li><li><strong>\\(\\vec{F_2}\\)</strong> d'intensité \\(F_2 = 80 \\, \\text{N}\\) faisant un angle \\(\\theta = 60^\\circ\\) avec l'axe \\(x\\) positif.</li></ul><div style='background-color: #e9ecef; padding: 10px; border-radius: 5px; margin-top: 10px;'><p><strong>Schéma :</strong> Les deux forces partent d'un même point O. \\(\\vec{F_1}\\) est horizontale vers la droite, \\(\\vec{F_2}\\) est orientée vers le haut et la droite.</p></div>",
      "questions": [
        {
          "question": "1) Déterminer les composantes \\(F_{2x}\\) et \\(F_{2y}\\) de la force \\(\\vec{F_2}\\).",
          "reponse": "<p>\\(F_{2x} = F_2 \\times \\cos(60^\\circ) = 80 \\times 0,5 = 40 \\, \\text{N}\\)</p><p>\\(F_{2y} = F_2 \\times \\sin(60^\\circ) = 80 \\times \\dfrac{\\sqrt{3}}{2} = 40\\sqrt{3} \\, \\text{N} \\approx 69,3 \\, \\text{N}\\)</p>"
        },
        {
          "question": "2) Calculer les composantes de la résultante \\(\\vec{R} = \\vec{F_1} + \\vec{F_2}\\).",
          "reponse": "<p>\\(R_x = F_{1x} + F_{2x} = 60 + 40 = 100 \\, \\text{N}\\)</p><p>\\(R_y = F_{1y} + F_{2y} = 0 + 40\\sqrt{3} = 40\\sqrt{3} \\, \\text{N} \\approx 69,3 \\, \\text{N}\\)</p>"
        },
        {
          "question": "3) En déduire l'intensité de la résultante \\(R\\) et l'angle \\(\\alpha\\) qu'elle fait avec l'axe \\(x\\) positif.",
          "reponse": "<p>\\(R = \\sqrt{R_x^2 + R_y^2} = \\sqrt{100^2 + (40\\sqrt{3})^2} = \\sqrt{10000 + 4800} = \\sqrt{14800} \\approx 121,7 \\, \\text{N}\\)</p><p>\\(\\tan(\\alpha) = \\dfrac{R_y}{R_x} = \\dfrac{40\\sqrt{3}}{100} = \\dfrac{2\\sqrt{3}}{5} \\Rightarrow \\alpha = \\arctan\\left(\\dfrac{2\\sqrt{3}}{5}\\right) \\approx 34,7^\\circ\\)</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Moment d'une Force",
      "points": "4 pts",
      "enonce": "<p>Pour serrer un boulon, un mécanicien utilise une clé plate de longueur \\(L = 0,25 \\, \\text{m}\\). Il exerce une force \\(F = 40 \\, \\text{N}\\) à l'extrémité de la clé, perpendiculairement à celle-ci.</p><div style='background-color: #e9ecef; padding: 10px; border-radius: 5px; margin-top: 10px;'><p><strong>Schéma :</strong> Une clé horizontale, le boulon à gauche (point A), la force verticale vers le bas à l'extrémité droite.</p></div>",
      "questions": [
        {
          "question": "1) Calculer le moment de la force \\(\\vec{F}\\) par rapport à l'axe du boulon (point A).",
          "reponse": "<p>Le moment d'une force par rapport à un point est : \\(M_A(\\vec{F}) = F \\times d\\) où \\(d\\) est la distance perpendiculaire entre la droite d'action de la force et le point A.</p><p>Ici, \\(d = L = 0,25 \\, \\text{m}\\).</p><p>\\(M_A(\\vec{F}) = 40 \\times 0,25 = 10 \\, \\text{N.m}\\)</p>"
        },
        {
          "question": "2) Préciser le sens de rotation de la clé.",
          "reponse": "<p>La force étant exercée vers le bas à l'extrémité droite, la clé tourne dans le <strong>sens horaire</strong> (sens des aiguilles d'une montre).</p>"
        },
        {
          "question": "3) Si le mécanicien exerce la même force mais perpendiculairement à une clé deux fois plus longue, quel serait le nouveau moment ?",
          "reponse": "<p>Nouvelle longueur : \\(L' = 2 \\times L = 0,50 \\, \\text{m}\\)</p><p>Nouveau moment : \\(M' = F \\times L' = 40 \\times 0,50 = 20 \\, \\text{N.m}\\)</p><p>En doublant la longueur de la clé, le moment est doublé.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Statique et Principe Fondamental",
      "points": "6 pts",
      "enonce": "<p>Un panneau publicitaire de poids \\(P = 200 \\, \\text{N}\\) est maintenu en équilibre par une tige \\(AB\\) articulée en \\(A\\) et un câble \\(BC\\). Le panneau est fixé à la tige en son centre de gravité G. On donne : \\(\\alpha = 30^\\circ\\).</p><div style='background-color: #e9ecef; padding: 10px; border-radius: 5px; margin-top: 10px;'><p><strong>Schéma :</strong> La tige \\(AB\\) est inclinée, le point A est un pivot au mur. Le câble \\(BC\\) part du point B et va au mur en C. Le panneau pend à l'extrémité B de la tige. L'angle entre la tige et l'horizontale est \\(\\alpha\\).</p></div>",
      "questions": [
        {
          "question": "1) Faire le bilan des actions mécaniques extérieures (BAM) s'exerçant sur le système {tige + panneau}.",
          "reponse": "<p>Les actions extérieures sont :</p><ul><li>Le poids \\(\\vec{P}\\) du panneau, vertical vers le bas, appliqué en G.</li><li>L'action de la liaison pivot en A : \\(\\vec{R_A}\\) (une force dont la direction est inconnue a priori).</li><li>La tension du câble \\(\\vec{T}\\) en B, dirigée vers le point C.</li></ul>"
        },
        {
          "question": "2) Énoncer le Principe Fondamental de la Statique (PFS) pour ce système.",
          "reponse": "<p>Le PFS pour un solide en équilibre s'écrit :</p><div class='math-block'><div class='math'>$$ \\sum \\vec{F}_{ext} = \\vec{0} \\quad \\text{et} \\quad \\sum M_A(\\vec{F}_{ext}) = \\vec{0} $$</div></div><p>Soit :</p><div class='math-block'><div class='math'>$$ \\vec{P} + \\vec{R_A} + \\vec{T} = \\vec{0} $$</div></div><p>et la somme des moments des trois forces par rapport à A est nulle.</p>"
        },
        {
          "question": "3) Déterminer graphiquement (ou analytiquement) la tension \\(\\vec{T}\\) du câble. On rappelle que les trois forces sont concourantes.",
          "reponse": "<p>Les trois forces \\(\\vec{P}\\), \\(\\vec{R_A}\\) et \\(\\vec{T}\\) sont en équilibre. Le triangle des forces est fermé.</p><p>Par projection sur les axes :</p><p>En prenant A comme origine, le moment de \\(\\vec{R_A}\\) est nul. On a : \\(\\sum M_A = \\vec{0}\\)</p><p>Soit \\(\\vec{M}_A(\\vec{P}) + \\vec{M}_A(\\vec{T}) = \\vec{0}\\)</p><p>Avec les distances appropriées, on trouve \\(T\\) en fonction de \\(P\\), de \\(\\alpha\\) et des longueurs. La résolution complète nécessite les données géométriques du schéma.</p>"
        },
        {
          "question": "4) Dans le cas où l'angle \\(\\alpha\\) serait plus grand, comment évoluerait la tension \\(\\vec{T}\\) ? Justifier.",
          "reponse": "<p>Si l'angle \\(\\alpha\\) augmente, la composante verticale de la tension diminue pour une même intensité. Pour compenser le poids \\(P\\) qui est constant, la tension \\(T\\) doit donc augmenter.</p><p>Mathématiquement, en projection verticale : \\(T \\, \\sin(\\alpha) = P \\Rightarrow T = \\dfrac{P}{\\sin(\\alpha)}\\). Si \\(\\alpha\\) augmente, \\(\\sin(\\alpha)\\) augmente, donc \\(T\\) diminue.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Cinématique du Point",
      "points": "6 pts",
      "enonce": "<p>Un point matériel \\(M\\) se déplace sur un axe \\(Ox\\). Son équation horaire est : \\(x(t) = 2t^3 - 9t^2 + 12t + 5\\) (avec \\(x\\) en mètres et \\(t\\) en secondes).</p>",
      "questions": [
        {
          "question": "1) Déterminer l'expression de la vitesse \\(v(t)\\) du point \\(M\\) en fonction du temps.",
          "reponse": "<p>La vitesse est la dérivée de la position par rapport au temps :</p><div class='math-block'><div class='math'>$$ v(t) = \\dfrac{dx}{dt} = 6t^2 - 18t + 12 $$</div></div>"
        },
        {
          "question": "2) Déterminer l'expression de l'accélération \\(a(t)\\) du point \\(M\\) en fonction du temps.",
          "reponse": "<p>L'accélération est la dérivée de la vitesse par rapport au temps :</p><div class='math-block'><div class='math'>$$ a(t) = \\dfrac{dv}{dt} = 12t - 18 $$</div></div>"
        },
        {
          "question": "3) Calculer la position, la vitesse et l'accélération du point \\(M\\) à l'instant \\(t = 2 \\, \\text{s}\\).",
          "reponse": "<p><strong>Position :</strong> \\(x(2) = 2 \\times 2^3 - 9 \\times 2^2 + 12 \\times 2 + 5 = 16 - 36 + 24 + 5 = 9 \\, \\text{m}\\)</p><p><strong>Vitesse :</strong> \\(v(2) = 6 \\times 2^2 - 18 \\times 2 + 12 = 24 - 36 + 12 = 0 \\, \\text{m/s}\\)</p><p><strong>Accélération :</strong> \\(a(2) = 12 \\times 2 - 18 = 24 - 18 = 6 \\, \\text{m/s}^2\\)</p>"
        },
        {
          "question": "4) Que peut-on dire du mouvement du point à cet instant ?",
          "reponse": "<p>À \\(t = 2 \\, \\text{s}\\), la vitesse est nulle et l'accélération est positive. Le point est donc à un <strong>point d'arrêt</strong> et son mouvement repart dans le sens positif de l'axe (car \\(a > 0\\)).</p>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
