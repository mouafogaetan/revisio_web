<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Mécanique Appliquée",
  "classe": "2nde Technique",
  "sequence": "Séquence 5",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Composition de vitesses (Application directe)",
      "points": "4 pts",
      "enonce": "<div style='font-size: 1em; line-height: 1.6;'>Un bateau traverse une rivière de largeur \( L = 150 \, m \). La vitesse du courant par rapport à la rive est \( v_c = 4 \, m.s^{-1} \). Le bateau se déplace à une vitesse \( v_b = 5 \, m.s^{-1} \) par rapport à l'eau, perpendiculairement à la rive.</div>",
      "questions": [
        {
          "question": "<div style='margin-bottom: 10px;'><strong>1)</strong> Déterminer la vitesse absolue du bateau par rapport à la rive.</div>",
          "reponse": "<div>La vitesse absolue est la somme vectorielle de la vitesse du bateau par rapport à l'eau et de la vitesse du courant : \( \vec{v}_a = \vec{v}_b + \vec{v}_c \).</div><div>Comme les deux vitesses sont perpendiculaires, \( v_a = \sqrt{v_b^2 + v_c^2} = \sqrt{5^2 + 4^2} = \sqrt{41} \approx 6,40 \, m.s^{-1} \).</div>"
        },
        {
          "question": "<div style='margin-bottom: 10px;'><strong>2)</strong> Calculer la durée de la traversée.</div>",
          "reponse": "<div>La composante de la vitesse perpendiculaire à la rive est \( v_b = 5 \, m.s^{-1} \). La durée est \( t = \frac{L}{v_b} = \frac{150}{5} = 30 \, s \).</div>"
        },
        {
          "question": "<div style='margin-bottom: 10px;'><strong>3)</strong> Calculer la dérive du bateau (distance parcourue le long de la rive) pendant la traversée.</div>",
          "reponse": "<div>La dérive est \( d = v_c \times t = 4 \times 30 = 120 \, m \).</div>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Mouvement plan et CIR",
      "points": "6 pts",
      "enonce": "<div style='font-size: 1em; line-height: 1.6;'>Une échelle de longueur \( L = 5 \, m \) est posée contre un mur vertical. Le pied de l'échelle glisse sur le sol horizontal à la vitesse constante \( v_A = 2 \, m.s^{-1} \) vers la droite. À un instant donné, l'échelle fait un angle \( \alpha = 60^\circ \) avec le sol.</div>",
      "questions": [
        {
          "question": "<div style='margin-bottom: 10px;'><strong>1)</strong> Déterminer la position du Centre Instantané de Rotation (CIR) de l'échelle.</div>",
          "reponse": "<div>Le point A (pied de l'échelle) a une vitesse horizontale vers la droite. Le point B (sommet de l'échelle) a une vitesse verticale vers le bas (car il glisse le long du mur).</div><div>Le CIR est à l'intersection de la perpendiculaire à \( \vec{v}_A \) en A (donc une verticale) et de la perpendiculaire à \( \vec{v}_B \) en B (donc une horizontale).</div><div>Le CIR est donc le point d'intersection de la verticale passant par A et de l'horizontale passant par B. Dans un repère d'origine A, les coordonnées du CIR sont \( I(0, L \sin \alpha) = (0, 5 \times 0,866) = (0, 4,33) \, m \).</div>"
        },
        {
          "question": "<div style='margin-bottom: 10px;'><strong>2)</strong> Calculer la vitesse angulaire de l'échelle.</div>",
          "reponse": "<div>La vitesse de A est \( v_A = \omega \times IA \), où \( IA = L \sin \alpha = 4,33 \, m \).</div><div>Donc \( \omega = \frac{v_A}{IA} = \frac{2}{4,33} \approx 0,462 \, rad.s^{-1} \).</div>"
        },
        {
          "question": "<div style='margin-bottom: 10px;'><strong>3)</strong> Déterminer la vitesse du sommet B de l'échelle.</div>",
          "reponse": "<div>La distance \( IB = L \cos \alpha = 5 \times 0,5 = 2,5 \, m \).</div><div>La vitesse de B est \( v_B = \omega \times IB = 0,462 \times 2,5 \approx 1,155 \, m.s^{-1} \), dirigée vers le bas.</div>"
        },
        {
          "question": "<div style='margin-bottom: 10px;'><strong>4)</strong> Déterminer la vitesse du milieu G de l'échelle.</div>",
          "reponse": "<div>La distance \( IG = \frac{L}{2} = 2,5 \, m \) car G est à mi-chemin de I et B.</div><div>La vitesse de G est \( v_G = \omega \times IG = 0,462 \times 2,5 \approx 1,155 \, m.s^{-1} \).</div><div>La direction de \( \vec{v}_G \) est perpendiculaire à IG.</div>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Statique - PFS et Équilibre d'un solide sous 3 forces",
      "points": "6 pts",
      "enonce": "<div style='font-size: 1em; line-height: 1.6;'>Une poutre homogène de longueur \( L = 4 \, m \) et de poids \( P = 200 \, N \) est maintenue en équilibre par un câble et une articulation comme le montre la figure ci-contre.</div><div>On donne : \( \alpha = 30^\circ \), \( \beta = 45^\circ \). L'articulation est en A.</div>",
      "questions": [
        {
          "question": "<div style='margin-bottom: 10px;'><strong>1)</strong> Faire le bilan des forces extérieures agissant sur la poutre.</div>",
          "reponse": "<div>Les forces extérieures sont :</div><ul style='margin-left: 20px;'><li>Le poids \( \vec{P} \) appliqué en G (milieu de la poutre), vertical vers le bas.</li><li>La réaction de l'articulation en A \( \vec{R}_A \), dont la direction est inconnue.</li><li>La tension du câble en B \( \vec{T} \), dirigée selon le câble.</li></ul>"
        },
        {
          "question": "<div style='margin-bottom: 10px;'><strong>2)</strong> Appliquer le théorème des 3 forces et déterminer graphiquement la direction de la réaction en A.</div>",
          "reponse": "<div>Le poids est vertical, la tension est dirigée selon le câble. Les trois forces sont concourantes en un point I.</div><div>La direction de \( \vec{R}_A \) est la droite passant par A et I.</div>"
        },
        {
          "question": "<div style='margin-bottom: 10px;'><strong>3)</strong> Écrire les équations d'équilibre (projection sur les axes et moments) et calculer les intensités de \( \vec{T} \) et \( \vec{R}_A \).</div>",
          "reponse": "<div>Soit \( \theta \) l'angle que fait \( \vec{R}_A \) avec l'horizontale. Le théorème des 3 forces donne le point de concours I.</div><div>On utilise les équations d'équilibre :</div><div>\( \sum F_x = 0 \Rightarrow -R_A \cos \theta + T \cos 45^\circ = 0 \)</div><div>\( \sum F_y = 0 \Rightarrow R_A \sin \theta + T \sin 45^\circ - P = 0 \)</div><div>\( \sum M_A = 0 \Rightarrow T \sin 45^\circ \times L - P \times \frac{L}{2} = 0 \)</div><div>De la dernière équation : \( T \times 0,707 \times 4 = 200 \times 2 \Rightarrow T = \frac{400}{2,828} \approx 141,4 \, N \).</div><div>De \( \sum F_x \) : \( R_A \cos \theta = T \cos 45^\circ = 141,4 \times 0,707 = 100 \, N \).</div><div>De \( \sum F_y \) : \( R_A \sin \theta = P - T \sin 45^\circ = 200 - 100 = 100 \, N \).</div><div>Donc \( \tan \theta = \frac{100}{100} = 1 \Rightarrow \theta = 45^\circ \).</div><div>\( R_A = \frac{100}{\cos 45^\circ} = \frac{100}{0,707} \approx 141,4 \, N \).</div>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Glissement ou non-glissement ?",
      "points": "4 pts",
      "enonce": "<div style='font-size: 1em; line-height: 1.6;'>Un bloc de masse \( m = 10 \, kg \) est posé sur un plan incliné d'angle \( \alpha = 20^\circ \) par rapport à l'horizontale. Le coefficient de frottement entre le bloc et le plan est \( f = 0,3 \). On prendra \( g = 10 \, m.s^{-2} \).</div>",
      "questions": [
        {
          "question": "<div style='margin-bottom: 10px;'><strong>1)</strong> Faire le bilan des forces agissant sur le bloc.</div>",
          "reponse": "<div>Les forces sont :</div><ul style='margin-left: 20px;'><li>Le poids \( \vec{P} = m \vec{g} \) vertical vers le bas.</li><li>La réaction normale \( \vec{N} \) perpendiculaire au plan incliné.</li><li>La force de frottement \( \vec{T} \) parallèle au plan incliné, s'opposant au mouvement.</li></ul>"
        },
        {
          "question": "<div style='margin-bottom: 10px;'><strong>2)</strong> Déterminer si le bloc est en équilibre ou s'il glisse.</div>",
          "reponse": "<div>La composante du poids parallèle au plan est \( P_\parallel = mg \sin \alpha = 10 \times 10 \times \sin 20^\circ = 100 \times 0,342 = 34,2 \, N \).</div><div>La réaction normale est \( N = mg \cos \alpha = 100 \times \cos 20^\circ = 100 \times 0,940 = 94,0 \, N \).</div><div>La force de frottement maximale est \( T_{max} = f \times N = 0,3 \times 94,0 = 28,2 \, N \).</div><div>Comme \( P_\parallel = 34,2 \, N > T_{max} = 28,2 \, N \), le bloc glisse.</div>"
        },
        {
          "question": "<div style='margin-bottom: 10px;'><strong>3)</strong> Calculer l'accélération du bloc.</div>",
          "reponse": "<div>La force résultante parallèle au plan est \( F = P_\parallel - T_{max} = 34,2 - 28,2 = 6,0 \, N \).</div><div>L'accélération est \( a = \frac{F}{m} = \frac{6,0}{10} = 0,6 \, m.s^{-2} \).</div>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
