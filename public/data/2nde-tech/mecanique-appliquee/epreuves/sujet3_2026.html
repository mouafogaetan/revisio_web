<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Mécanique Appliquée",
  "classe": "2nde Technique",
  "sequence": "Séquence 3",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : QCM - Cinématique du point",
      "points": "4 pts",
      "enonce": "<div style='font-size:1.1em; line-height:1.8;'>Pour chaque question, choisis la bonne réponse.</div>",
      "questions": [
        {
          "question": "<div style='margin-bottom:15px;'><strong>1)</strong> Le vecteur vitesse \\(\\vec{v}\\) d'un point est :<br><span style='display:block; margin-top:5px;'>A - La dérivée du vecteur position par rapport au temps.<br>B - La dérivée du vecteur accélération par rapport au temps.<br>C - La primitive du vecteur position.<br>D - Le quotient de la position par le temps.</span></div>",
          "reponse": "<div style='background-color:#e8f5e9; padding:12px; border-radius:8px;'><strong>Réponse : A</strong><br>Le vecteur vitesse est la dérivée du vecteur position par rapport au temps : \\(\\vec{v} = \\frac{d\\vec{OM}}{dt}\\).</div>"
        },
        {
          "question": "<div style='margin-bottom:15px;'><strong>2)</strong> L'accélération \\(\\vec{a}\\) d'un point est :<br><span style='display:block; margin-top:5px;'>A - La dérivée du vecteur position par rapport au temps.<br>B - La dérivée du vecteur vitesse par rapport au temps.<br>C - La primitive du vecteur vitesse.<br>D - Le quotient de la vitesse par le temps.</span></div>",
          "reponse": "<div style='background-color:#e8f5e9; padding:12px; border-radius:8px;'><strong>Réponse : B</strong><br>L'accélération est la dérivée du vecteur vitesse par rapport au temps : \\(\\vec{a} = \\frac{d\\vec{v}}{dt} = \\frac{d^2\\vec{OM}}{dt^2}\\).</div>"
        },
        {
          "question": "<div style='margin-bottom:15px;'><strong>3)</strong> Un mouvement est uniformément varié lorsque :<br><span style='display:block; margin-top:5px;'>A - La vitesse est constante.<br>B - L'accélération est constante.<br>C - La position est constante.<br>D - La trajectoire est circulaire.</span></div>",
          "reponse": "<div style='background-color:#e8f5e9; padding:12px; border-radius:8px;'><strong>Réponse : B</strong><br>Un mouvement est uniformément varié lorsque l'accélération est constante (en norme et en direction).</div>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Mouvement de translation rectiligne",
      "points": "6 pts",
      "enonce": "<div style='font-size:1.1em; line-height:1.8;'>Un mobile se déplace sur une droite. Son équation horaire est : <div class='math-block' style='background-color:#f5f5f5; padding:10px; border-radius:8px; text-align:center; margin:10px 0;'><div class='math'>$$ x(t) = 3t^2 - 6t + 2 $$</div></div> où \\(x\\) est en mètres et \\(t\\) en secondes.</div>",
      "questions": [
        {
          "question": "<div style='margin-bottom:15px;'><strong>1)</strong> Déterminer l'expression de la vitesse \\(v(t)\\) du mobile.</div>",
          "reponse": "<div style='background-color:#e8f5e9; padding:12px; border-radius:8px;'>La vitesse est la dérivée de la position : <div class='math-block' style='background-color:#f5f5f5; padding:10px; border-radius:8px; text-align:center; margin:10px 0;'><div class='math'>$$ v(t) = \\frac{dx}{dt} = 6t - 6 $$</div></div></div>"
        },
        {
          "question": "<div style='margin-bottom:15px;'><strong>2)</strong> Déterminer l'expression de l'accélération \\(a(t)\\) du mobile.</div>",
          "reponse": "<div style='background-color:#e8f5e9; padding:12px; border-radius:8px;'>L'accélération est la dérivée de la vitesse : <div class='math-block' style='background-color:#f5f5f5; padding:10px; border-radius:8px; text-align:center; margin:10px 0;'><div class='math'>$$ a(t) = \\frac{dv}{dt} = 6 $$</div></div>L'accélération est constante (mouvement uniformément varié).</div>"
        },
        {
          "question": "<div style='margin-bottom:15px;'><strong>3)</strong> À quelle date \\(t\\) le mobile s'arrête-t-il ?</div>",
          "reponse": "<div style='background-color:#e8f5e9; padding:12px; border-radius:8px;'>Le mobile s'arrête lorsque \\(v(t) = 0\\) :<br>\\(6t - 6 = 0\\) → \\(t = 1\\, s\\)</div>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Mouvement de rotation",
      "points": "6 pts",
      "enonce": "<div style='font-size:1.1em; line-height:1.8;'>Un disque de rayon \\(R = 0,2\\, m\\) tourne autour de son axe central. Sa vitesse angulaire est \\(\\omega = 30\\, rad/s\\).</div>",
      "questions": [
        {
          "question": "<div style='margin-bottom:15px;'><strong>1)</strong> Calculer la vitesse linéaire d'un point situé à la périphérie du disque.</div>",
          "reponse": "<div style='background-color:#e8f5e9; padding:12px; border-radius:8px;'>La vitesse linéaire est donnée par : \\(v = \\omega \\times R\\)<br>\\(v = 30 \\times 0,2 = 6\\, m/s\\)</div>"
        },
        {
          "question": "<div style='margin-bottom:15px;'><strong>2)</strong> Calculer l'accélération normale (centripète) de ce point.</div>",
          "reponse": "<div style='background-color:#e8f5e9; padding:12px; border-radius:8px;'>L'accélération normale est : \\(a_n = \\omega^2 \\times R\\)<br>\\(a_n = 30^2 \\times 0,2 = 900 \\times 0,2 = 180\\, m/s^2\\)</div>"
        },
        {
          "question": "<div style='margin-bottom:15px;'><strong>3)</strong> Le mouvement étant uniforme, que vaut l'accélération tangentielle ?</div>",
          "reponse": "<div style='background-color:#e8f5e9; padding:12px; border-radius:8px;'>Pour un mouvement de rotation uniforme, \\(\\omega\\) est constante, donc \\(\\alpha = \\frac{d\\omega}{dt} = 0\\).<br>L'accélération tangentielle est donc nulle : \\(a_t = R \\times \\alpha = 0\\).</div>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Mouvement plan sur plan",
      "points": "4 pts",
      "enonce": "<div style='font-size:1.1em; line-height:1.8;'>Une barre de longueur \\(L = 2\\, m\\) est en mouvement plan sur plan. On connaît les vitesses de ses extrémités A et B :<br>\\(\\vec{v_A} = 2\\vec{i}\\) et \\(\\vec{v_B} = -4\\vec{i} + 3\\vec{j}\\).</div>",
      "questions": [
        {
          "question": "<div style='margin-bottom:15px;'><strong>1)</strong> Vérifier que le champ des vitesses satisfait à la propriété d'équiprojectivité.</div>",
          "reponse": "<div style='background-color:#e8f5e9; padding:12px; border-radius:8px;'>On vérifie que \\(\\vec{v_A} \\cdot \\vec{u}_{AB} = \\vec{v_B} \\cdot \\vec{u}_{AB}\\).<br><br>\\(\\vec{AB} = \\vec{OB} - \\vec{OA}\\). On suppose que A et B sont les extrémités de la barre.<br>Si \\(\\vec{AB} = L\\vec{u}\\), alors cette propriété est vérifiée pour un solide indéformable.<br><br>Pour vérifier, on a besoin des positions de A et B. Dans un mouvement plan sur plan, cette propriété est toujours vérifiée pour un solide indéformable.</div>"
        },
        {
          "question": "<div style='margin-bottom:15px;'><strong>2)</strong> Déterminer le vecteur rotation \\(\\vec{\\omega}\\) de la barre.</div>",
          "reponse": "<div style='background-color:#e8f5e9; padding:12px; border-radius:8px;'>On utilise la relation : \\(\\vec{v_B} = \\vec{v_A} + \\vec{\\omega} \\wedge \\vec{AB}\\).<br><br>Avec \\(\\vec{\\omega} = \\omega \\vec{k}\\), on obtient :<br>\\(-4\\vec{i} + 3\\vec{j} = 2\\vec{i} + \\omega \\vec{k} \\wedge \\vec{AB}\\)<br><br>En identifiant les composantes, on peut déterminer \\(\\omega\\) et la position des points.</div>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
