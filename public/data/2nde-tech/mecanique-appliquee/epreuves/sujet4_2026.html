<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Mécanique Appliquée",
  "classe": "2nde Technique",
  "sequence": "Séquence 4",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Questions de Cours",
      "points": "4 pts",
      "enonce": "<div style='background-color: #f8f9fa; padding: 15px; border-radius: 10px; color: #212529; font-size: 1em;'><p style='font-weight: bold;'>Répondez aux questions suivantes de manière claire et précise :</p></div>",
      "questions": [
        {
          "question": "1) Énoncer le Principe Fondamental de la Statique (PFS) pour un solide en équilibre soumis à un système de forces coplanaires.",
          "reponse": "Un solide est en équilibre si et seulement si la somme vectorielle de toutes les forces extérieures qui s'exercent sur lui est nulle et la somme vectorielle des moments de ces forces par rapport à un point quelconque est nulle. Mathématiquement : \\(\\sum \\vec{F}_{ext} = \\vec{0}\\) et \\(\\sum \\vec{M}_{A}(\\vec{F}_{ext}) = \\vec{0}\\)."
        },
        {
          "question": "2) Rappeler la relation de composition des vitesses. Donner la signification de chaque terme.",
          "reponse": "La relation de composition des vitesses est : \\(\\vec{V}_a = \\vec{V}_r + \\vec{V}_e\\) [citation:2].<br>• \\(\\vec{V}_a\\) : vitesse absolue (par rapport à un référentiel fixe).<br>• \\(\\vec{V}_r\\) : vitesse relative (par rapport à un référentiel mobile).<br>• \\(\\vec{V}_e\\) : vitesse d'entraînement (vitesse du référentiel mobile par rapport au référentiel fixe)."
        },
        {
          "question": "3) Qu'appelle-t-on méthode de Culmann ? Dans quel cas l'utilise-t-on ?",
          "reponse": "La méthode de Culmann est une méthode graphique utilisée pour résoudre les problèmes de statique plane où un solide est soumis à l'action de quatre forces coplanaires. Elle permet de déterminer les directions et les intensités des forces inconnues en utilisant des résultantes partielles."
        },
        {
          "question": "4) Définir la condition de non-glissement entre deux solides en contact.",
          "reponse": "La condition de non-glissement entre deux solides en contact s'écrit : \\(\\vec{V}_{A \\in 1/2} = \\vec{0}\\). Cela signifie que la vitesse du point de contact de l'un des solides par rapport à l'autre est nulle. C'est la condition qui caractérise le roulement sans glissement."
        }
      ]
    },
    {
      "titre": "Exercice 2 : Application du PFS",
      "points": "5 pts",
      "enonce": "<div style='background-color: #f8f9fa; padding: 15px; border-radius: 10px; color: #212529;'><p>Un bloc de poids \\( \\vec{P} = 500\\,\\text{N} \\) est maintenu en équilibre sur un plan incliné par un câble, comme le montre la figure ci-contre. Le plan incliné fait un angle \\( \\alpha = 30^\\circ \\) avec l'horizontale. Le câble est parallèle au plan incliné.</p><div style='background: #e9ecef; margin: 10px 0; padding: 10px; border-radius: 10px; text-align: center; color: #212529;'><svg width='200' height='150' viewBox='0 0 200 150' style='max-width: 100%; height: auto;'><polygon points='10,140 190,140 150,30 10,30' fill='#c0e0c0' stroke='black' stroke-width='2'/><rect x='70' y='70' width='60' height='50' fill='#8ccfe' stroke='black' stroke-width='2'/><line x1='130' y1='70' x2='170' y2='40' stroke='black' stroke-width='2'/><circle cx='170' cy='40' r='5' fill='red'/><text x='20' y='130' font-size='12' font-family='Arial' fill='black'>α</text></svg></div></div>",
      "questions": [
        {
          "question": "1) Faire le bilan des actions mécaniques extérieures (BAME) qui s'exercent sur le bloc.",
          "reponse": "Les actions mécaniques extérieures sont :<br>- Le poids \\( \\vec{P} \\) : appliqué au centre de gravité G, vertical vers le bas.<br>- La réaction du plan incliné \\( \\vec{R} \\) : appliquée au point de contact, normale au plan (on néglige les frottements).<br>- La tension du câble \\( \\vec{T} \\) : appliquée au point d'attache, dirigée le long du câble (parallèle au plan incliné)."
        },
        {
          "question": "2) En appliquant le PFS, écrire les équations de projection des forces sur les axes du repère (Ox parallèle au plan incliné, Oy perpendiculaire au plan incliné).",
          "reponse": "Projection sur Ox (parallèle au plan) : <br>\\( \\sum F_x = 0 \\Rightarrow T - P \\cdot \\sin(\\alpha) = 0 \\)<br><br>Projection sur Oy (perpendiculaire au plan) : <br>\\( \\sum F_y = 0 \\Rightarrow R - P \\cdot \\cos(\\alpha) = 0 \\)"
        },
        {
          "question": "3) Calculer l'intensité de la tension du câble \\( \\vec{T} \\) et de la réaction \\( \\vec{R} \\).",
          "reponse": "\\( T = P \\cdot \\sin(\\alpha) = 500 \\times \\sin(30^\\circ) = 500 \\times 0,5 = 250\\,\\text{N} \\)<br><br>\\( R = P \\cdot \\cos(\\alpha) = 500 \\times \\cos(30^\\circ) = 500 \\times 0,866 \\approx 433\\,\\text{N} \\)"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Composition des Vitesses",
      "points": "6 pts",
      "enonce": "<div style='background-color: #f8f9fa; padding: 15px; border-radius: 10px; color: #212529;'><p>Un bateau traverse une rivière de largeur \\( L = 100\\,\\text{m} \\). La vitesse du bateau par rapport à l'eau est \\( \\vec{V}_r = 5\\,\\text{m/s} \\) perpendiculaire à la rive. La vitesse du courant est \\( \\vec{V}_e = 3\\,\\text{m/s} \\) parallèle à la rive.</p><div style='background: #e9ecef; margin: 10px 0; padding: 10px; border-radius: 10px; text-align: center; color: #212529;'><svg width='200' height='120' viewBox='0 0 200 120' style='max-width: 100%; height: auto;'><rect x='10' y='20' width='180' height='80' fill='#d4edda' stroke='black' stroke-width='2'/><text x='90' y='15' font-size='10' font-family='Arial' fill='black'>Rive</text><text x='90' y='115' font-size='10' font-family='Arial' fill='black'>Rive</text><line x1='50' y1='60' x2='150' y2='60' stroke='blue' stroke-width='2'/><polygon points='150,60 140,55 140,65' fill='blue'/><text x='90' y='55' font-size='10' font-family='Arial' fill='blue'>Courant</text><line x1='80' y1='80' x2='80' y2='40' stroke='red' stroke-width='2'/><polygon points='80,40 75,50 85,50' fill='red'/><text x='85' y='70' font-size='10' font-family='Arial' fill='red'>Bateau</text></svg></div></div>",
      "questions": [
        {
          "question": "1) Quel est le référentiel fixe ? le référentiel mobile ?",
          "reponse": "Le référentiel fixe est la rive (le sol). Le référentiel mobile est l'eau (le courant)."
        },
        {
          "question": "2) Déterminer graphiquement ou par calcul la vitesse absolue du bateau par rapport à la rive. On donnera sa direction par rapport à la perpendiculaire à la rive.",
          "reponse": "La vitesse absolue \\( \\vec{V}_a \\) est la somme vectorielle de \\( \\vec{V}_r \\) et \\( \\vec{V}_e \\) : <br>\\( \\vec{V}_a = \\vec{V}_r + \\vec{V}_e \\). <br>Sa norme est : <br>\\( V_a = \\sqrt{V_r^2 + V_e^2} = \\sqrt{5^2 + 3^2} = \\sqrt{25 + 9} = \\sqrt{34} \\approx 5,83\\,\\text{m/s} \\). <br>L'angle \\( \\theta \\) par rapport à la perpendiculaire à la rive est donné par : <br>\\( \\tan(\\theta) = \\frac{V_e}{V_r} = \\frac{3}{5} = 0,6 \\Rightarrow \\theta = \\arctan(0,6) \\approx 31^\\circ \\)"
        },
        {
          "question": "3) Calculer le temps mis par le bateau pour traverser la rivière et la distance de dérive (déplacement parallèle à la rive).",
          "reponse": "Le temps de traversée est déterminé par la composante perpendiculaire de la vitesse : <br>\\( t = \\frac{L}{V_r} = \\frac{100}{5} = 20\\,\\text{s} \\). <br>La dérive est la distance parcourue parallèlement à la rive : <br>\\( d = V_e \\times t = 3 \\times 20 = 60\\,\\text{m} \\)."
        }
      ]
    },
    {
      "titre": "Exercice 4 : Loi de Glissement",
      "points": "5 pts",
      "enonce": "<div style='background-color: #f8f9fa; padding: 15px; border-radius: 10px; color: #212529;'><p>Une roue de rayon \\( R = 0,3\\,\\text{m} \\) roule sans glisser sur un sol horizontal. La vitesse du centre de la roue est \\( V_C = 6\\,\\text{m/s} \\).</p></div>",
      "questions": [
        {
          "question": "1) Rappeler la condition de non-glissement pour une roue qui roule sans glisser.",
          "reponse": "La condition de non-glissement pour une roue est : <br>\\( V_C = R \\cdot \\omega \\) où \\( \\omega \\) est la vitesse angulaire de la roue."
        },
        {
          "question": "2) Calculer la vitesse angulaire \\( \\omega \\) de la roue.",
          "reponse": "\\( \\omega = \\frac{V_C}{R} = \\frac{6}{0,3} = 20\\,\\text{rad/s} \\)"
        },
        {
          "question": "3) Déterminer la vitesse du point de contact de la roue avec le sol et la vitesse du point le plus haut de la roue.",
          "reponse": "La vitesse du point de contact avec le sol est nulle (condition de non-glissement) : <br>\\( V_{contact} = 0\\,\\text{m/s} \\). <br>La vitesse du point le plus haut de la roue est : <br>\\( V_{haut} = V_C + R\\cdot\\omega = 6 + 0,3 \\times 20 = 6 + 6 = 12\\,\\text{m/s} \\). Ce point a une vitesse deux fois supérieure à celle du centre."
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
