<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Mécanique Appliquée",
  "classe": "2nde Technique",
  "sequence": "Séquence 6",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Composition de Mouvements et Vitesses",
      "points": "6 pts",
      "enonce": "<p>Un technicien observe un mécanisme de levage. Un moteur fait tourner un tambour de rayon \\(R = 0,20\\,\\text{m}\\) à la vitesse angulaire constante \\(\\omega = 10\\,\\text{rad/s}\\). Un câble enroulé sur le tambour soulève une charge \\(M\\).</p><div style='background-color: #e9ecef; padding: 10px; border-radius: 5px; margin-top: 10px;'><p><strong>Schéma :</strong> Un tambour circulaire de rayon R tourne autour de son axe central. Un câble vertical est fixé à la périphérie et descend pour soulever une charge \\(M\\).</p></div>",
      "questions": [
        {
          "question": "1) Rappeler la relation entre la vitesse linéaire \\(v\\) d'un point à la périphérie du tambour et sa vitesse angulaire \\(\\omega\\).",
          "reponse": "<p>La relation entre la vitesse linéaire \\(v\\) et la vitesse angulaire \\(\\omega\\) pour un point situé à une distance \\(R\\) de l'axe de rotation est :</p><div class='math-block'><div class='math'>$$ v = R \\times \\omega $$</div></div><p>C'est la formule fondamentale de la cinématique de rotation.</p>"
        },
        {
          "question": "2) Calculer la vitesse linéaire du point d'accrochage du câble sur le tambour.",
          "reponse": "<p>En appliquant la formule :</p><p>\\(v = R \\times \\omega = 0,20 \\times 10 = 2\\,\\text{m/s}\\)</p><p>La vitesse linéaire est de \\(2\\,\\text{m/s}\\).</p>"
        },
        {
          "question": "3) En déduire la vitesse de montée de la charge \\(M\\). Justifier.",
          "reponse": "<p>La charge est soulevée par le câble. Comme le câble est inextensible, la vitesse de la charge est égale à la vitesse linéaire du point d'accrochage du câble sur le tambour.</p><p>Ainsi, la vitesse de montée de la charge est : \\(v_M = 2\\,\\text{m/s}\\).</p>"
        },
        {
          "question": "4) Si le tambour tourne 20 fois en 10 secondes, quelle est sa vitesse angulaire en rad/s ?",
          "reponse": "<p>20 tours en 10 secondes correspondent à :</p><p>\\(N = \\dfrac{20}{10} = 2\\,\\text{tr/s}\\)</p><p>Sachant qu'1 tour correspond à \\(2\\pi\\) radians, la vitesse angulaire est :</p><p>\\(\\omega = 2 \\times 2\\pi = 4\\pi \\approx 12,57\\,\\text{rad/s}\\)</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Champ des Vitesses et CIR",
      "points": "7 pts",
      "enonce": "<p>Un solide indéformable est en mouvement plan. On connaît les vecteurs vitesses de deux de ses points \\(A\\) et \\(B\\) :</p><ul><li>Le point \\(A\\) a une vitesse \\(\\vec{V}_A\\) de norme \\(V_A = 3\\,\\text{m/s}\\) dirigée vers la droite.</li><li>Le point \\(B\\) a une vitesse \\(\\vec{V}_B\\) de norme \\(V_B = 4\\,\\text{m/s}\\) dirigée vers le haut.</li></ul><div style='background-color: #e9ecef; padding: 10px; border-radius: 5px; margin-top: 10px;'><p><strong>Schéma :</strong> Le point A est à gauche et sa vitesse est horizontale vers la droite. Le point B est à droite de A et sa vitesse est verticale vers le haut. La distance AB = 0,5 m.</p></div>",
      "questions": [
        {
          "question": "1) Définir la propriété d'équiprojectivité du champ des vitesses d'un solide indéformable.",
          "reponse": "<p>La propriété d'équiprojectivité stipule que pour deux points \\(A\\) et \\(B\\) d'un solide indéformable, la projection du vecteur vitesse de \\(A\\) sur la droite \\(AB\\) est égale à la projection du vecteur vitesse de \\(B\\) sur cette même droite.</p><div class='math-block'><div class='math'>$$ \\vec{V}_A \\cdot \\vec{AB} = \\vec{V}_B \\cdot \\vec{AB} $$</div></div>"
        },
        {
          "question": "2) Vérifier si la propriété d'équiprojectivité est respectée ici sachant que \\(AB = 0,5\\,\\text{m}\\).",
          "reponse": "<p>Le vecteur \\(\\vec{AB}\\) est horizontal (de A vers B).</p><p>Projection de \\(\\vec{V}_A\\) sur \\(AB\\) : \\(\\vec{V}_A \\cdot \\vec{AB} = 3 \\times 0,5 = 1,5\\,\\text{m}^2/\\text{s}\\)</p><p>Projection de \\(\\vec{V}_B\\) sur \\(AB\\) : \\(\\vec{V}_B \\cdot \\vec{AB} = 0\\) (car \\(\\vec{V}_B\\) est vertical, donc perpendiculaire à \\(AB\\)).</p><p>Les projections ne sont pas égales. La propriété d'équiprojectivité n'est donc pas respectée. Cela signifie que les vitesses données ne peuvent pas être celles d'un même solide indéformable.</p>"
        },
        {
          "question": "3) Définir la notion de Centre Instantané de Rotation (CIR).",
          "reponse": "<p>Le Centre Instantané de Rotation (CIR) est le point d'un solide en mouvement plan dont la vitesse est nulle à un instant donné. C'est le point autour duquel le solide semble tourner à cet instant précis.</p><p>Le CIR se trouve à l'intersection des droites perpendiculaires aux vecteurs vitesses de deux points du solide.</p>"
        },
        {
          "question": "4) Proposer une représentation graphique pour déterminer le CIR à partir des directions des vitesses données à la question 1.",
          "reponse": "<p>La méthode graphique pour trouver le CIR est la suivante :</p><ul><li>On trace une droite passant par \\(A\\) perpendiculaire à \\(\\vec{V}_A\\).</li><li>On trace une droite passant par \\(B\\) perpendiculaire à \\(\\vec{V}_B\\).</li><li>L'intersection de ces deux droites donne le CIR.</li></ul><p>Dans le cas présent, la droite en A est verticale (perpendiculaire à \\(\\vec{V}_A\\) horizontale), et la droite en B est horizontale (perpendiculaire à \\(\\vec{V}_B\\) verticale). Le CIR est donc à l'intersection de la verticale passant par A et de l'horizontale passant par B.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Composition des Vitesses",
      "points": "7 pts",
      "enonce": "<p>Un bateau traverse une rivière de largeur \\(L = 100\\,\\text{m}\\). La vitesse du bateau par rapport à l'eau est \\(\\vec{V}_{r} = 4\\,\\text{m/s}\\) perpendiculairement à la rive. Le courant de la rivière a une vitesse \\(\\vec{V}_{e} = 3\\,\\text{m/s}\\) parallèle à la rive.</p><div style='background-color: #e9ecef; padding: 10px; border-radius: 5px; margin-top: 10px;'><p><strong>Schéma :</strong> Rivière vue de dessus. Les rives sont verticales. Le bateau pointe vers la rive opposée (vers la droite). Le courant est dirigé vers le bas.</p></div>",
      "questions": [
        {
          "question": "1) Identifier, pour le mouvement du bateau, le mouvement absolu, le mouvement relatif et le mouvement d'entraînement.",
          "reponse": "<ul><li><strong>Mouvement relatif :</strong> Mouvement du bateau par rapport à l'eau. Sa vitesse est \\(\\vec{V}_r = 4\\,\\text{m/s}\\) vers la rive opposée.</li><li><strong>Mouvement d'entraînement :</strong> Mouvement de l'eau (le référentiel mobile) par rapport au sol. Sa vitesse est \\(\\vec{V}_e = 3\\,\\text{m/s}\\) parallèle à la rive.</li><li><strong>Mouvement absolu :</strong> Mouvement du bateau par rapport au sol. C'est la composition des deux précédents.</li></ul>"
        },
        {
          "question": "2) Écrire la relation de composition des vitesses pour le bateau.",
          "reponse": "<p>La relation de composition des vitesses s'écrit :</p><div class='math-block'><div class='math'>$$ \\vec{V}_{a} = \\vec{V}_{r} + \\vec{V}_{e} $$</div></div><p>Où :</p><ul><li>\\(\\vec{V}_{a}\\) est la vitesse absolue du bateau (par rapport au sol).</li><li>\\(\\vec{V}_{r}\\) est la vitesse relative du bateau (par rapport à l'eau).</li><li>\\(\\vec{V}_{e}\\) est la vitesse d'entraînement (du courant).</li></ul>"
        },
        {
          "question": "3) Calculer la norme de la vitesse absolue \\(V_a\\) du bateau.",
          "reponse": "<p>Les vecteurs \\(\\vec{V}_r\\) et \\(\\vec{V}_e\\) sont perpendiculaires. La norme de la vitesse absolue est donc :</p><div class='math-block'><div class='math'>$$ V_a = \\sqrt{V_r^2 + V_e^2} = \\sqrt{4^2 + 3^2} = \\sqrt{16 + 9} = \\sqrt{25} = 5\\,\\text{m/s} $$</div></div>"
        },
        {
          "question": "4) Déterminer l'angle \\(\\alpha\\) que fait la trajectoire du bateau par rapport à la direction perpendiculaire à la rive.",
          "reponse": "<p>L'angle \\(\\alpha\\) est l'angle entre la direction perpendiculaire à la rive et la trajectoire réelle du bateau. On a :</p><div class='math-block'><div class='math'>$$ \\tan(\\alpha) = \\dfrac{V_e}{V_r} = \\dfrac{3}{4} $$</div></div><p>Ainsi : \\(\\alpha = \\arctan\\left(\\dfrac{3}{4}\\right) \\approx 36,87^\\circ\\).</p><p>La trajectoire du bateau est inclinée d'environ \\(36,9^\\circ\\) par rapport à la perpendiculaire à la rive.</p>"
        },
        {
          "question": "5) Calculer le temps \\(t\\) mis par le bateau pour traverser la rivière.",
          "reponse": "<p>La traversée s'effectue selon la direction perpendiculaire à la rive. La composante de la vitesse absolue selon cette direction est \\(V_r = 4\\,\\text{m/s}\\) (la vitesse du courant n'affecte pas la traversée).</p><p>Le temps de traversée est donc :</p><div class='math-block'><div class='math'>$$ t = \\dfrac{L}{V_r} = \\dfrac{100}{4} = 25\\,\\text{s} $$</div></div>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
