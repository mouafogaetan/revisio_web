<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Présentation mobile</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' },
            options: { skipHtmlTypes: 'script' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 500px;
        margin: 0 auto;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    .slide-header {
        flex-shrink: 0;
        padding: 18px 16px 10px 16px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        z-index: 10;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .slide-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
    }

    .content-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 18px 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        flex-shrink: 0;
    }

    .content-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .content-card li {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        line-height: 1.5;
    }

    .content-card li:last-child {
        border-bottom: none;
    }

    .bullet-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
    }

    .math-block {
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        overflow-x: auto;
        flex-shrink: 0;
        margin: 4px 0;
    }

    .math-block .math {
        font-size: 1.2rem;
        color: #e2e8f0;
    }

    .note-box {
        background: rgba(96, 165, 250, 0.08);
        border-left: 4px solid #60a5fa;
        padding: 12px 16px;
        border-radius: 12px;
        font-style: italic;
        font-size: 0.9rem;
        color: #cbd5e1;
        flex-shrink: 0;
    }

    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        border-radius: 0;
        flex-direction: column;
    }

    .loading-card {
        background: #1e293b;
        padding: 32px 28px;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #334155;
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px auto;
    }

    .loading-text {
        font-weight: 600;
        font-size: 1.1rem;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    .loading-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 16px;
    }
    .loading-progress {
        height: 3px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        animation: loadingProgress 30s ease-out forwards;
    }

    .loading-timeout {
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 12px;
    }

    .btn-cancel-loading {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 40px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #f87171;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }

    .btn-cancel-loading:active {
        transform: scale(0.94);
        background: rgba(239, 68, 68, 0.25);
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
    }

    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .slide-counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255,255,255,0.05);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(255,255,255,0.04);
    }

    .status-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 30px;
        background: rgba(96, 165, 250, 0.12);
        color: #93bbfc;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
    }

    .status-badge .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: pulse-dot 1.2s infinite;
        flex-shrink: 0;
    }

    .status-badge.idle .dot {
        animation: none;
        background: #64748b;
    }
    .status-badge.speaking .dot {
        background: #34d399;
        animation: pulse-dot 0.8s infinite;
    }
    .status-badge.error .dot {
        background: #f87171;
        animation: none;
    }
    .status-badge.paused .dot {
        animation: none;
        background: #fbbf24;
    }
    .status-badge.waiting .dot {
        animation: pulse-dot 1.5s infinite;
        background: #fbbf24;
    }
    .status-badge.loading .dot {
        animation: pulse-dot 0.5s infinite;
        background: #60a5fa;
    }

    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.7); }
    }

    .footer-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(255,255,255,0.1);
    }

    .btn-secondary {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-play {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
        min-width: 80px;
        justify-content: center;
    }
    .btn-play:active {
        background: rgba(52, 211, 153, 0.25);
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
    }

    .auto-indicator {
        font-size: 0.65rem;
        color: #64748b;
        text-align: center;
        letter-spacing: 0.3px;
        padding: 2px 0;
    }

    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.2rem;
        }
        .content-card li {
            font-size: 0.9rem;
            padding: 8px 0;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .btn-play {
            min-width: 60px;
        }
        .footer-buttons {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
        .loading-card {
            padding: 20px 16px;
        }
        .math-block .math {
            font-size: 1rem;
        }
    }

    @media (min-width: 600px) {
        .app-container {
            max-width: 480px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
        .loading-overlay {
            border-radius: 32px;
        }
    }

    /* Mode jour (par défaut) */
    html, body {
        background: #f0f4f8 !important;
        color: #1a202c !important;
    }
    .app-container {
        background: linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%) !important;
    }
    .slide-header {
        background: rgba(255, 255, 255, 0.85) !important;
        border-bottom: 1px solid rgba(0,0,0,0.08) !important;
    }
    .slide-header h1 {
        background: linear-gradient(135deg, #2b6cb0, #6b46c1) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        background-clip: text !important;
    }
    .slide-footer {
        background: rgba(255, 255, 255, 0.9) !important;
        border-top: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card {
        background: rgba(255,255,255,0.8) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card li {
        border-bottom: 1px solid rgba(0,0,0,0.05) !important;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.12) !important;
        border-left: 4px solid #4299e1 !important;
        color: #2c3e50 !important;
    }
    .math-block {
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .math-block .math {
        color: #2d3748 !important;
    }
    .slide-counter {
        color: #4a5568 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .status-badge {
        background: rgba(96, 165, 250, 0.15) !important;
        color: #2b6cb0 !important;
        border: 1px solid rgba(96, 165, 250, 0.15) !important;
    }
    .btn {
        color: #2d3748 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .btn-secondary {
        background: rgba(0,0,0,0.04) !important;
        border-color: rgba(0,0,0,0.08) !important;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15) !important;
        border-color: rgba(52, 211, 153, 0.2) !important;
        color: #38a169 !important;
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15) !important;
        border-color: rgba(251, 191, 36, 0.2) !important;
        color: #d69e2e !important;
    }
    .auto-indicator {
        color: #718096 !important;
    }
    .loading-card {
        background: #ffffff !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .loading-text {
        color: #1a202c !important;
    }
    .loading-sub {
        color: #4a5568 !important;
    }
</style>
</head>
<body>

<div class="app-container">

    <header class="slide-header">
        <h1 id="slideTitle">Chargement...</h1>
    </header>

    <main class="slide-body" id="slideBody"></main>

    <!-- LOADING OVERLAY AVEC BOUTON ANNULER -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Préparation vocale...</div>
            <div class="loading-sub" id="loadingSub">Synthèse en cours</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loadingProgressBar"></div>
            </div>
            <div class="loading-timeout" id="loadingTimeout">⏱️ 30 secondes maximum</div>
            <button class="btn-cancel-loading" id="cancelLoadingBtn">
                <span>✕</span> Annuler
            </button>
        </div>
    </div>

    <footer class="slide-footer">
        <div class="footer-top">
            <span class="slide-counter" id="slideCounter">1 / 3</span>
            <span class="status-badge idle" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">Prêt</span>
            </span>
        </div>

        <div class="footer-buttons">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-secondary" id="replayBtn">
                <span class="btn-icon">🔁</span> <span class="btn-label">Relire</span>
            </button>
            <button class="btn btn-play" id="playBtn">
                <span class="btn-icon">▶</span> <span class="btn-label">Play</span>
            </button>
        </div>

        <div class="auto-indicator" id="autoIndicator">⏸ Lecture manuelle</div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // SLIDES
    // ================================================================
    const slides = [
  {
    "titre": "Équilibre d'un solide sous l'action de n forces",
    "contenu": "<div style='font-family: \"Segoe UI\", Roboto, sans-serif; padding: 8px;'><div style='background: #1a237e; color: #ffffff; padding: 15px; border-radius: 12px;'><h3 style='margin: 0 0 10px 0; color: #ffd54f;'>📐 Introduction</h3><p style='margin: 0; font-size: 1.05rem;'>Dans la vie courante, les solides sont rarement soumis à seulement 2 ou 3 forces. Un <strong>pont</strong> supporte de nombreuses charges, une <strong>grue</strong> subit plusieurs efforts, un <strong>moteur</strong> est soumis à des forces multiples.</p><p style='margin-top: 10px 0 0 0;'>La leçon d'aujourd'hui vous apprendra à <span style='color: #ffd54f;'>résoudre l'équilibre</span> des solides soumis à <span style='color: #ffd54f;'>n forces</span> coplanaires.</p></div><div style='background: #e8eaf6; color: #1a237e; padding: 12px; border-radius: 8px; margin-top: 10px;'><p style='margin: 0;'><strong>Objectifs :</strong> Appliquer le PFS, maîtriser la méthode de Culmann, déterminer les réactions aux appuis.</p></div></div>",
    "texteParle": "Bonjour à tous. Dans les leçons précédentes, nous avons appris à étudier l'équilibre d'un solide soumis à deux ou trois forces. Aujourd'hui, nous allons voir comment traiter le cas général où un solide est soumis à plusieurs forces, c'est-à-dire n forces. C'est le cas par exemple d'un pont qui supporte le poids des véhicules, d'une grue qui soulève des charges, ou d'un moteur qui subit plusieurs efforts. Nous allons apprendre à appliquer le Principe Fondamental de la Statique dans le cas général et découvrir la méthode de Culmann pour la résolution graphique.",
    "note": "Le cas général (n forces) est le plus fréquent en pratique dans les structures et les mécanismes."
  },
  {
    "titre": "Rappel du Principe Fondamental de la Statique (PFS)",
    "contenu": "<div style='font-family: \"Segoe UI\", Roboto, sans-serif; padding: 8px;'><div style='background: #004d40; color: #ffffff; padding: 15px; border-radius: 12px;'><h4 style='margin: 0 0 10px 0; color: #80cbc4;'>⚖️ Les deux conditions d'équilibre</h4><div style='background: #00695c; padding: 12px; border-radius: 8px; margin-bottom: 10px;'><p style='margin: 0;'><strong>1ère condition :</strong> La somme vectorielle des forces extérieures doit être nulle.</p><div class='math-block'><div class='math'>$$ \\sum \\vec{F}_{ext} = \\vec{0} $$</div></div></div><div style='background: #00695c; padding: 12px; border-radius: 8px;'><p style='margin: 0;'><strong>2ème condition :</strong> La somme des moments des forces extérieures par rapport à un point quelconque doit être nulle.</p><div class='math-block'><div class='math'>$$ \\sum \\vec{M}_P(\\vec{F}_{ext}) = \\vec{0} $$</div></div></div></div><div style='background: #e0f2f1; color: #004d40; padding: 12px; border-radius: 8px; margin-top: 10px;'><p style='margin: 0;'><strong>💡 À retenir :</strong> Ces deux conditions sont nécessaires et suffisantes pour qu'un solide soit en équilibre statique.</p></div></div>",
    "texteParle": "Avant d'aborder le cas général, rappelons le Principe Fondamental de la Statique. Pour qu'un solide soit en équilibre, deux conditions doivent être satisfaites. Premièrement, la somme de toutes les forces extérieures appliquées au solide doit être nulle. Cela signifie que les forces s'annulent deux à deux. Deuxièmement, la somme des moments de toutes ces forces par rapport à n'importe quel point doit également être nulle. Cela garantit qu'il n'y a pas de rotation. Ces deux conditions sont essentielles et doivent toujours être vérifiées.",
    "note": "Le PFS s'applique à un solide au repos dans un référentiel galiléen."
  },
  {
    "titre": "Généralisation du PFS à n forces",
    "contenu": "<div style='font-family: \"Segoe UI\", Roboto, sans-serif; padding: 8px;'><div style='background: #311b92; color: #ffffff; padding: 15px; border-radius: 12px;'><h4 style='margin: 0 0 10px 0; color: #b39ddb;'>📊 Cas général : n forces coplanaires</h4><p style='margin: 0 0 10px 0;'>Pour un système soumis à <span style='color: #b39ddb;'>n forces</span> coplanaires, les équations d'équilibre s'écrivent :</p><div style='background: #4527a0; padding: 12px; border-radius: 8px; margin-bottom: 8px;'><div class='math-block'><div class='math'>$$ \\sum_{i=1}^{n} \\vec{F}_i = \\vec{0} $$</div></div></div><div style='background: #4527a0; padding: 12px; border-radius: 8px;'><div class='math-block'><div class='math'>$$ \\sum_{i=1}^{n} \\vec{M}_P(\\vec{F}_i) = \\vec{0} $$</div></div></div></div><div style='background: #ede7f6; color: #311b92; padding: 12px; border-radius: 8px; margin-top: 10px;'><p style='margin: 0;'><strong>📌 Cas particulier :</strong> Pour des forces coplanaires, les équations se réduisent à <strong>3 équations scalaires</strong> (2 pour les forces, 1 pour les moments).</p></div></div>",
    "texteParle": "Dans le cas général où nous avons plusieurs forces, c'est-à-dire n forces, le Principe Fondamental de la Statique s'applique toujours. Les deux équations vectorielles restent valables. Pour des forces coplanaires, c'est-à-dire toutes dans un même plan, ces équations se réduisent à trois équations scalaires : deux équations de projection des forces et une équation de moments. Ces trois équations nous permettent de déterminer jusqu'à trois inconnues. C'est ce que nous allons utiliser pour résoudre nos problèmes.",
    "note": "Dans le plan, les forces ont deux composantes (x, y) et les moments sont selon l'axe z."
  },
  {
    "titre": "La méthode de Culmann",
    "contenu": "<div style='font-family: \"Segoe UI\", Roboto, sans-serif; padding: 8px;'><div style='background: #bf360c; color: #ffffff; padding: 15px; border-radius: 12px;'><h4 style='margin: 0 0 10px 0; color: #ffab91;'>📐 Méthode graphique pour 4 forces</h4><p style='margin: 0 0 10px 0;'>La <span style='color: #ffab91;'>méthode de Culmann</span> permet de résoudre graphiquement l'équilibre d'un solide soumis à <strong>4 forces coplanaires</strong>.</p><div style='background: #d84315; padding: 10px; border-radius: 8px;'><p style='margin: 0;'><strong>Principe :</strong> On remplace deux forces par leur résultante pour se ramener à un problème à 3 forces.</p></div><div style='background: #e64a19; padding: 10px; border-radius: 8px; margin-top: 8px;'><p style='margin: 0;'><strong>Étapes :</strong></p><ol style='margin: 5px 0 0 0; padding-left: 20px;'><li>Choisir deux forces et déterminer leur résultante.</li><li>Le problème devient un problème à 3 forces.</li><li>Appliquer le théorème des 3 forces.</li></ol></div></div></div>",
    "texteParle": "Quand un solide est soumis à quatre forces coplanaires, nous pouvons utiliser la méthode de Culmann pour résoudre le problème graphiquement. Le principe de cette méthode est simple : on remplace deux des forces par leur résultante. Ainsi, on se retrouve avec un problème à trois forces que nous savons déjà résoudre grâce au théorème des trois forces. Les étapes sont donc : d'abord choisir deux forces et calculer leur résultante, puis appliquer le théorème des trois forces pour déterminer les inconnues. C'est une méthode très pratique en dessin industriel.",
    "note": "La méthode de Culmann est particulièrement utile lorsqu'on travaille avec des épures et des tracés graphiques."
  },
  {
    "titre": "Résolution analytique : projection sur les axes",
    "contenu": "<div style='font-family: \"Segoe UI\", Roboto, sans-serif; padding: 8px;'><div style='background: #0d47a1; color: #ffffff; padding: 15px; border-radius: 12px;'><h4 style='margin: 0 0 10px 0; color: #64b5f6;'>🧮 Méthode analytique</h4><p style='margin: 0 0 10px 0;'>Pour résoudre analytiquement, on <span style='color: #64b5f6;'>projette</span> les forces sur les axes et on écrit les équations.</p><div style='background: #1565c0; padding: 10px; border-radius: 8px; margin-bottom: 8px;'><p style='margin: 0;'><strong>Projection sur Ox :</strong></p><div class='math-block'><div class='math'>$$ \\sum F_{ix} = 0 $$</div></div></div><div style='background: #1565c0; padding: 10px; border-radius: 8px; margin-bottom: 8px;'><p style='margin: 0;'><strong>Projection sur Oy :</strong></p><div class='math-block'><div class='math'>$$ \\sum F_{iy} = 0 $$</div></div></div><div style='background: #1565c0; padding: 10px; border-radius: 8px;'><p style='margin: 0;'><strong>Équation des moments en A :</strong></p><div class='math-block'><div class='math'>$$ \\sum M_A(\\vec{F}_i) = 0 $$</div></div></div></div><div style='background: #e3f2fd; color: #0d47a1; padding: 12px; border-radius: 8px; margin-top: 10px;'><p style='margin: 0;'><strong>💡 Astuce :</strong> Choisir le point de calcul des moments pour éliminer le maximum d'inconnues.</p></div></div>",
    "texteParle": "La méthode analytique consiste à écrire les équations d'équilibre en projetant les forces sur les axes de coordonnées. Pour un problème dans le plan, nous avons trois équations scalaires : la projection sur l'axe des x, la projection sur l'axe des y, et l'équation des moments. L'astuce pour simplifier les calculs est de choisir le point de calcul des moments de manière à éliminer le plus possible d'inconnues. Par exemple, si on calcule les moments au point d'application d'une force inconnue, cette force ne génère pas de moment et disparaît de l'équation.",
    "note": "Le choix du point de calcul des moments est crucial pour simplifier la résolution."
  },
  {
    "titre": "Application : Pont roulant",

    "texteParle": "Prenons un exemple concret : un pont roulant utilisé dans un atelier pour soulever des charges. La poutre du pont pèse 200 kilogrammes et mesure 10 mètres. Elle supporte une charge de 500 kilogrammes située à 4 mètres de l'appui de gauche. Les forces qui agissent sont le poids du pont, le poids de la charge, et les réactions des deux appuis. En appliquant les équations d'équilibre, on trouve que la réaction de l'appui de gauche est de 3924 Newtons et celle de droite est de 2943 Newtons. Remarquez que la réaction de gauche est plus grande car la charge est plus proche de cet appui.",

  {
    "titre": "Les réactions aux appuis",
    "contenu": "<div style='font-family: \"Segoe UI\", Roboto, sans-serif; padding: 8px;'><div style='background: #004d40; color: #ffffff; padding: 15px; border-radius: 12px;'><h4 style='margin: 0 0 10px 0; color: #80cbc4;'>🔧 Types d'appuis et leurs réactions</h4><div style='background: #00695c; padding: 10px; border-radius: 8px; margin-bottom: 8px;'><p style='margin: 0;'><strong>Appui simple :</strong> Réaction verticale uniquement (<span style='color: #80cbc4;'>1 inconnue</span>)</p></div><div style='background: #00695c; padding: 10px; border-radius: 8px; margin-bottom: 8px;'><p style='margin: 0;'><strong>Appui double (articulation) :</strong> Réaction verticale et horizontale (<span style='color: #80cbc4;'>2 inconnues</span>)</p></div><div style='background: #00695c; padding: 10px; border-radius: 8px;'><p style='margin: 0;'><strong>Encastrement :</strong> Réaction verticale, horizontale et moment (<span style='color: #80cbc4;'>3 inconnues</span>)</p></div></div><div style='background: #e0f2f1; color: #004d40; padding: 12px; border-radius: 8px; margin-top: 10px;'><p style='margin: 0;'><strong>📌 Important :</strong> Le nombre d'inconnues ne doit pas dépasser le nombre d'équations disponibles (3 dans le plan).</p></div></div>",
    "texteParle": "Dans un problème de statique, les appuis ou les liaisons sont des éléments qui maintiennent le solide en place. Chaque type d'appui donne lieu à des réactions différentes. Un appui simple, comme un rouleau, ne peut fournir qu'une réaction verticale : c'est une seule inconnue. Un appui double, ou articulation, peut fournir une réaction verticale et une réaction horizontale : c'est deux inconnues. Enfin, un encastrement peut fournir une réaction verticale, une réaction horizontale et un moment : c'est trois inconnues. Il est important de savoir que le nombre total d'inconnues ne doit pas dépasser le nombre d'équations disponibles, qui est de trois dans le plan.",
    "note": "Un problème est isostatique si le nombre d'inconnues est égal au nombre d'équations."
  },
  {
    "titre": "Détermination des efforts internes",
    "contenu": "<div style='font-family: \"Segoe UI\", Roboto, sans-serif; padding: 8px;'><div style='background: #bf360c; color: #ffffff; padding: 15px; border-radius: 12px;'><h4 style='margin: 0 0 10px 0; color: #ffab91;'>🔍 Efforts internes dans les poutres</h4><p style='margin: 0 0 10px 0;'>Les <span style='color: #ffab91;'>efforts internes</span> sont les forces qui agissent à l'intérieur du solide (efforts tranchants, moments fléchissants).</p><div style='background: #d84315; padding: 10px; border-radius: 8px;'><p style='margin: 0;'><strong>Méthode :</strong> On coupe le solide par une section virtuelle et on applique le PFS à chaque partie.</p></div></div><div style='background: #fbe9e7; color: #bf360c; padding: 12px; border-radius: 8px; margin-top: 10px;'><p style='margin: 0;'><strong>💡 Utilité :</strong> Permet de dimensionner correctement les structures (poutres, piliers, etc.)</p></div></div>",
    "texteParle": "Une fois que nous avons déterminé les réactions aux appuis, nous pouvons aussi calculer les efforts internes qui agissent à l'intérieur du solide, comme les efforts tranchants et les moments fléchissants. Pour cela, on utilise une méthode simple : on coupe virtuellement le solide par une section, et on applique le Principe Fondamental de la Statique à chaque partie. Ces efforts internes sont très importants car ils permettent de dimensionner correctement les structures. Par exemple, un ingénieur doit savoir quelles sont les contraintes maximales dans une poutre pour choisir le bon matériau et la bonne section.",
    "note": "Les efforts internes sont maximaux aux points où les charges sont les plus importantes."

  {
    "titre": "Problème isostatique et hyperstatique",

  {

    "texteParle": "Pour résoudre un problème de statique avec n forces, voici une méthode en six étapes. Premièrement, isolez le système que vous étudiez. Deuxièmement, faites le bilan des actions mécaniques en listant toutes les forces extérieures. Troisièmement, choisissez un repère et projetez les forces sur les axes. Quatrièmement, écrivez les équations d'équilibre pour les forces et les moments. Cinquièmement, résolvez le système d'équations pour trouver les inconnues. Enfin, interprétez les résultats et vérifiez qu'ils sont cohérents. N'oubliez pas de toujours vérifier vos résultats en les réinjectant dans les équations initiales pour éviter les erreurs.",

  {

    "texteParle": "Pour conclure cette leçon, retenons les points essentiels. Le Principe Fondamental de la Statique s'applique à n forces, avec les deux conditions d'équilibre : somme des forces nulle et somme des moments nulle. Dans le plan, nous avons trois équations scalaires. Pour les problèmes à quatre forces, la méthode de Culmann est très utile. Les réactions aux appuis dépendent du type de liaison, et le nombre maximum d'inconnues dans le plan est de trois pour un problème isostatique. Maintenant, c'est à vous de vous entraîner avec les exercices pour maîtriser toutes ces notions. Bonne chance !",

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentIndex = 0;
    let isSpeaking = false;
    let isPaused = false;
    let currentUtterance = null;
    let isLoading = false;
    let loadingTimeout = null;
    let isTransitioning = false;
    let speechSupported = true;
    let userInteracted = false;
    let isPlaying = false;
    let loadingCancelled = false;

    const total = slides.length;
    const synth = window.speechSynthesis;

    // Références jQuery
    const $title = $('#slideTitle');
    const $body = $('#slideBody');
    const $counter = $('#slideCounter');
    const $statusText = $('#statusText');
    const $statusBadge = $('#statusBadge');
    const $loading = $('#loadingOverlay');
    const $loadingText = $('#loadingText');
    const $loadingSub = $('#loadingSub');
    const $loadingTimeout = $('#loadingTimeout');
    const $loadingProgressBar = $('#loadingProgressBar');
    const $autoIndicator = $('#autoIndicator');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $replay = $('#replayBtn');
    const $play = $('#playBtn');
    const $cancelLoading = $('#cancelLoadingBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function setStatus(text, type) {
        $statusText.text(text);
        $statusBadge.removeClass('idle speaking error paused waiting loading');
        if (type === 'speaking') $statusBadge.addClass('speaking');
        else if (type === 'error') $statusBadge.addClass('error');
        else if (type === 'paused') $statusBadge.addClass('paused');
        else if (type === 'waiting') $statusBadge.addClass('waiting');
        else if (type === 'loading') $statusBadge.addClass('loading');
        else $statusBadge.addClass('idle');
    }

    function updatePlayButton() {
        if (isPlaying) {
            $play.addClass('playing');
            $play.find('.btn-icon').text('⏸');
            $play.find('.btn-label').text('Pause');
        } else {
            $play.removeClass('playing');
            $play.find('.btn-icon').text('▶');
            $play.find('.btn-label').text('Play');
        }
    }

    function showLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        
        loadingCancelled = false;
        isLoading = true;
        
        // Réinitialiser la barre de progression
        $loadingProgressBar.css('animation', 'none');
        $loadingProgressBar.css('width', '0%');
        // Forcer un reflow
        $loadingProgressBar[0].offsetHeight;
        $loadingProgressBar.css('animation', 'loadingProgress 30s ease-out forwards');
        
        $loadingText.text('Préparation vocale...');
        $loadingSub.text('Synthèse en cours');
        $loadingTimeout.text('⏱️ 30 secondes maximum');
        $loading.fadeIn(300);
        setStatus("⏳ Chargement...", 'loading');
        
        // 🔥 TIMEOUT DE 30 SECONDES
        loadingTimeout = setTimeout(() => {
            if (isLoading && !loadingCancelled) {
                hideLoading();
                setStatus("⚠️ Délai dépassé (30s)", 'error');
                isPlaying = false;
                updatePlayButton();
                $loadingSub.text('La synthèse vocale a pris trop de temps');
                $loadingTimeout.text('❌ Délai dépassé');
            }
        }, 30000);
    }

    function hideLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        isLoading = false;
        loadingCancelled = false;
        $loading.fadeOut(300);
        // Ne pas changer le statut si on est en train de parler
        if (!isSpeaking && !isPlaying) {
            setStatus("⏸ Lecture arrêtée", 'paused');
        }
    }

    function cancelLoading() {
        loadingCancelled = true;
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        hideLoading();
        stopSpeaking();
        setStatus("⏸ Annulé", 'paused');
        isPlaying = false;
        updatePlayButton();
        $loadingText.text('Annulé par l\'utilisateur');
        $loadingSub.text('Vous pouvez réessayer');
        $loadingTimeout.text('✕ Annulation');
    }

    // Arrêter la parole proprement
    function stopSpeaking() {
        try {
            if (synth && (synth.speaking || synth.pending)) {
                synth.cancel();
            }
        } catch(e) {
            console.warn('Erreur stopSpeaking:', e);
        }
        if (currentUtterance) {
            try {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance.onstart = null;
            } catch(e) {}
            currentUtterance = null;
        }
        isSpeaking = false;
        isPlaying = false;
        updatePlayButton();
    }

    // Mettre en pause la parole
    function pauseSpeaking() {
        try {
            if (synth && synth.speaking) {
                synth.pause();
                isPaused = true;
                isPlaying = false;
                setStatus("⏸ Lecture en pause", 'paused');
                updatePlayButton();
            }
        } catch(e) {
            console.warn('Erreur pauseSpeaking:', e);
            stopSpeaking();
        }
    }

    // Reprendre la parole
    function resumeSpeaking() {
        try {
            if (synth && synth.paused) {
                synth.resume();
                isPaused = false;
                isPlaying = true;
                setStatus("🔊 Lecture en cours", 'speaking');
                updatePlayButton();
            } else if (!isSpeaking && !synth.speaking && !synth.pending) {
                speakSlide(currentIndex);
            }
        } catch(e) {
            console.warn('Erreur resumeSpeaking:', e);
            speakSlide(currentIndex);
        }
    }

    function renderSlide(index) {
        const slide = slides[index];
        $title.text(slide.titre);

        let html = '';
        html += `<div class="content-card">${slide.contenu}</div>`;
        if (slide.note) {
            html += `<div class="note-box">${slide.note}</div>`;
        }
        $body.html(html);
        $counter.text(`${index+1} / ${total}`);

        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
        }
    }

    // ================================================================
    // LECTURE VOCALE
    // ================================================================
    function speakSlide(index) {
        return new Promise((resolve) => {
            const slide = slides[index];
            const text = slide.texteParle;
            
            if (!text || text.trim() === '' || !speechSupported) {
                resolve();
                return;
            }

            if (!window.speechSynthesis) {
                setStatus("❌ Synthèse vocale non supportée", 'error');
                speechSupported = false;
                resolve();
                return;
            }

            // Arrêter toute lecture en cours
            stopSpeaking();
            
            // Réinitialiser l'état de pause
            isPaused = false;
            
            showLoading();
            setStatus("Initialisation...", 'loading');

            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.92;
                utterance.pitch = 1.05;
                utterance.volume = 1;

                let isFinished = false;
                let errorHandled = false;

                utterance.onstart = function() {
                    if (loadingCancelled) {
                        stopSpeaking();
                        resolve();
                        return;
                    }
                    hideLoading();
                    isSpeaking = true;
                    isPlaying = true;
                    isPaused = false;
                    setStatus("🔊 Lecture en cours", 'speaking');
                    updatePlayButton();
                };

                utterance.onend = function() {
                    if (isFinished) return;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    setStatus("✅ Terminé", 'idle');
                    hideLoading();
                    updatePlayButton();
                    resolve();
                };

                utterance.onerror = function(e) {
                    if (isFinished || errorHandled) return;
                    errorHandled = true;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    hideLoading();
                    updatePlayButton();
                    
                    if (e.error === 'not-allowed') {
                        setStatus("⚠️ Permission refusée", 'error');
                    } else if (e.error === 'synthesis-unavailable') {
                        setStatus("⚠️ Synthèse indisponible", 'error');
                    } else if (e.error === 'canceled') {
                        setStatus("⏸ Annulé", 'paused');
                    } else {
                        setStatus("❌ Erreur audio: " + (e.error || 'inconnue'), 'error');
                    }
                    
                    resolve();
                };

                // Gestion du chargement des voix
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = function() {
                        if (!loadingCancelled) {
                            try {
                                synth.speak(utterance);
                            } catch(err) {
                                // Silencieux
                            }
                        }
                        synth.onvoiceschanged = null;
                    };
                }

                currentUtterance = utterance;
                
                if (!loadingCancelled) {
                    try {
                        synth.speak(utterance);
                    } catch(err) {
                        setTimeout(() => {
                            if (!loadingCancelled) {
                                try {
                                    synth.speak(utterance);
                                } catch(e) {
                                    setStatus("❌ Erreur de lecture", 'error');
                                    isPlaying = false;
                                    updatePlayButton();
                                    hideLoading();
                                    resolve();
                                }
                            } else {
                                resolve();
                            }
                        }, 100);
                    }
                } else {
                    resolve();
                }

            } catch(err) {
                hideLoading();
                setStatus("❌ Erreur générale", 'error');
                isPlaying = false;
                updatePlayButton();
                console.error('Erreur speakSlide:', err);
                resolve();
            }
        });
    }

    // ================================================================
    // NAVIGATION
    // ================================================================
    async function goToSlide(index) {
        if (isTransitioning) return;
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        
        // Si on est en train de lire, on met en pause avant de naviguer
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        // Arrêter complètement la lecture
        stopSpeaking();
        
        await new Promise(r => setTimeout(r, 50));
        
        if (index === currentIndex) {
            setStatus("📄 Slide actuel", 'idle');
            return;
        }

        isTransitioning = true;
        currentIndex = index;
        renderSlide(index);
        
        // Réinitialiser l'état de lecture
        isPlaying = false;
        updatePlayButton();
        setStatus("⏸ Lecture arrêtée", 'paused');

        await new Promise(r => setTimeout(r, 150));
        isTransitioning = false;
    }

    async function goToNext() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex + 1 < total) {
            await goToSlide(currentIndex + 1);
        } else {
            setStatus("🏁 Dernier slide", 'idle');
        }
    }

    async function goToPrev() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex - 1 >= 0) {
            await goToSlide(currentIndex - 1);
        } else {
            setStatus("🔁 Premier slide", 'idle');
        }
    }

    // ================================================================
    // GESTION PLAY/PAUSE
    // ================================================================
    function togglePlay() {
        if (!userInteracted) {
            userInteracted = true;
        }

        // Si le chargement est en cours, on l'annule
        if (isLoading) {
            cancelLoading();
            return;
        }

        // Si le synthétiseur est en pause, on reprend
        if (synth && synth.paused) {
            resumeSpeaking();
            return;
        }

        // Si la lecture est en cours, on met en pause
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
            return;
        }

        // Sinon, on démarre la lecture du slide courant
        if (!isSpeaking && !isPlaying) {
            stopSpeaking();
            speakSlide(currentIndex);
        }
    }

    // ================================================================
    // INIT
    // ================================================================
    async function init() {
        // Vérifier la compatibilité
        if (!window.speechSynthesis) {
            setStatus("❌ Synthèse vocale non supportée", 'error');
            speechSupported = false;
        }

        // Précharger les voix
        try {
            if (synth.getVoices) {
                synth.getVoices();
                setTimeout(() => {
                    try {
                        synth.getVoices();
                    } catch(e) {}
                }, 200);
            }
        } catch(e) {
            console.warn('Erreur chargement voix:', e);
        }

        // Afficher le premier slide
        renderSlide(0);
        $counter.text(`1 / ${total}`);
        
        // État initial
        setStatus("⏸ Appuie sur Play", 'paused');
        updatePlayButton();
        $autoIndicator.text('⏸ Lecture manuelle');

        // ================================================================
        // ÉVÉNEMENTS
        // ================================================================
        
        // Bouton Play/Pause
        $play.on('click', function() {
            togglePlay();
        });

        // Bouton Annuler le chargement
        $cancelLoading.on('click', function() {
            cancelLoading();
        });

        // Navigation
        $prev.on('click', function() {
            // Si chargement en cours, on annule
            if (isLoading) cancelLoading();
            goToPrev();
        });

        $next.on('click', function() {
            if (isLoading) cancelLoading();
            goToNext();
        });

        // Replay - relire le slide courant
        $replay.on('click', function() {
            if (isLoading) cancelLoading();
            stopSpeaking();
            setTimeout(() => {
                speakSlide(currentIndex);
            }, 100);
        });

        // Support du clavier (espace pour play/pause)
        $(document).on('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });

        // Nettoyage
        $(window).on('beforeunload', function() {
            try {
                if (synth.speaking) synth.cancel();
            } catch(e) {}
            hideLoading();
        });

        // Gérer les cas où la synthèse se termine de manière inattendue
        setInterval(() => {
            if (isPlaying && !synth.speaking && !synth.pending && !isPaused && !isLoading) {
                isPlaying = false;
                updatePlayButton();
                setStatus("⏸ Lecture arrêtée", 'paused');
            }
        }, 1000);
    }

    init();
});



    // ================================================================
    // GESTION DU THÈME JOUR/NUIT
    // ================================================================
    let isDarkMode = false;

    function toggleTheme() {
        isDarkMode = !isDarkMode;
        const body = document.body;
        const appContainer = document.querySelector('.app-container');
        const header = document.querySelector('.slide-header');
        const footer = document.querySelector('.slide-footer');
        const contentCards = document.querySelectorAll('.content-card');
        const noteBoxes = document.querySelectorAll('.note-box');
        const mathBlocks = document.querySelectorAll('.math-block');
        const buttons = document.querySelectorAll('.btn');
        const statusBadge = document.querySelector('.status-badge');
        const slideCounter = document.querySelector('.slide-counter');
        const autoIndicator = document.querySelector('.auto-indicator');
        const themeBtn = document.getElementById('themeToggle');

        if (isDarkMode) {
            // Mode nuit
            body.style.background = '#0b1120';
            body.style.color = '#f1f5f9';
            appContainer.style.background = 'linear-gradient(145deg, #0f172a 0%, #1e293b 100%)';
            header.style.background = 'rgba(15, 23, 42, 0.85)';
            footer.style.background = 'rgba(15, 23, 42, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.05)';
                card.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.08)';
                note.style.color = '#cbd5e1';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.25)';
                block.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#e2e8f0';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.12)';
                statusBadge.style.color = '#93bbfc';
            }
            if (slideCounter) {
                slideCounter.style.color = '#94a3b8';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#64748b';
            }
            if (themeBtn) {
                themeBtn.textContent = '☀️';
                themeBtn.title = 'Passer en mode jour';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#e2e8f0';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#e2e8f0';
                }
            });
        } else {
            // Mode jour (par défaut)
            body.style.background = '#f0f4f8';
            body.style.color = '#1a202c';
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
            header.style.background = 'rgba(255, 255, 255, 0.85)';
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.8)';
                card.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.12)';
                note.style.color = '#2c3e50';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.05)';
                block.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#2d3748';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
                statusBadge.style.color = '#2b6cb0';
            }
            if (slideCounter) {
                slideCounter.style.color = '#4a5568';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#718096';
            }
            if (themeBtn) {
                themeBtn.textContent = '🌓';
                themeBtn.title = 'Passer en mode nuit';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#2c3e50';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#2d3748';
                }
            });
        }
    }

    // Initialiser en mode jour
    document.addEventListener('DOMContentLoaded', function() {
        // Appliquer le mode jour par défaut
        const body = document.body;
        body.style.background = '#f0f4f8';
        body.style.color = '#1a202c';
        
        const appContainer = document.querySelector('.app-container');
        if (appContainer) {
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
        }
        
        const header = document.querySelector('.slide-header');

        }

            note.style.background = 'rgba(96, 165, 250, 0.12)';
            note.style.color = '#2c3e50';
        });
        
        document.querySelectorAll('.math-block').forEach(block => {
            block.style.background = 'rgba(0,0,0,0.05)';
            block.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.btn').forEach(btn => {

        });
        
        const statusBadge = document.querySelector('.status-badge');
        if (statusBadge) {
            statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
            statusBadge.style.color = '#2b6cb0';
        }
        
        const slideCounter = document.querySelector('.slide-counter');
        if (slideCounter) {
            slideCounter.style.color = '#4a5568';
        }
        
        const autoIndicator = document.querySelector('.auto-indicator');
        if (autoIndicator) {
            autoIndicator.style.color = '#718096';
        }
        
        document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
            if (!el.closest('.note-box')) {
                el.style.color = '#2c3e50';
            }
        });
        
        document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
            if (!el.closest('.note-box') && !el.closest('.math-block')) {
                el.style.color = '#2d3748';
            }
        });
        
        const themeBtn = document.getElementById('themeToggle');
        if (themeBtn) {
            themeBtn.textContent = '🌓';
            themeBtn.title = 'Passer en mode nuit';
        }
    });
</script>
