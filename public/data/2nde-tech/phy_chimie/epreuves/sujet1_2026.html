<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Physique-Chimie",
  "classe": "2nde technique",
  "sequence": "Séquence 1",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Relativité du mouvement",
      "points": "4 pts",
      "enonce": "<div style='padding: 10px; font-size: 16px; line-height: 1.6;'>Un passager est assis dans un bus en mouvement sur une route droite. Il tient un téléphone dans la main.<br><br>On considère trois référentiels :<br>- Le référentiel du bus<br>- Le référentiel terrestre<br>- Le référentiel lié au passager</div>",
      "questions": [
        {
          "question": "1) Dans quel(s) référentiel(s) le passager est-il immobile ? Justifier votre réponse.",
          "reponse": "Le passager est immobile dans le référentiel du bus et dans le référentiel lié au passager lui-même. En effet, dans ces référentiels, sa position ne change pas au cours du temps."
        },
        {
          "question": "2) Dans quel(s) référentiel(s) le passager est-il en mouvement ? Justifier votre réponse.",
          "reponse": "Le passager est en mouvement dans le référentiel terrestre car sa position par rapport au sol change lorsque le bus avance."
        },
        {
          "question": "3) Que peut-on conclure sur le caractère relatif du mouvement ?",
          "reponse": "Le mouvement d'un corps dépend du référentiel choisi. Un même corps peut être à la fois immobile (dans un référentiel lié au bus) et en mouvement (dans le référentiel terrestre). Le mouvement est donc relatif."
        }
      ]
    },
    {
      "titre": "Exercice 2 : Structure de l'atome",
      "points": "4 pts",
      "enonce": "<div style='padding: 10px; font-size: 16px; line-height: 1.6;'>L'atome d'oxygène a pour numéro atomique \\( Z = 8 \\) et pour nombre de masse \\( A = 16 \\).</div>",
      "questions": [
        {
          "question": "1) Donner la composition complète de l'atome d'oxygène (nombre de protons, de neutrons et d'électrons).",
          "reponse": "L'atome d'oxygène contient :<br>- 8 protons (Z = 8)<br>- 8 neutrons (A - Z = 16 - 8 = 8)<br>- 8 électrons (l'atome est électriquement neutre : nombre de protons = nombre d'électrons)"
        },
        {
          "question": "2) Écrire la structure électronique de l'atome d'oxygène en indiquant la répartition des électrons sur les différentes couches.",
          "reponse": "La structure électronique de l'oxygène est : (K)<sup>2</sup>(L)<sup>6</sup>. Cela signifie qu'il y a 2 électrons sur la couche K et 6 électrons sur la couche L."
        },
        {
          "question": "3) L'atome d'oxygène possède-t-il des isotopes ? Donner un exemple.",
          "reponse": "Oui, l'oxygène possède des isotopes. Par exemple, l'oxygène 17 <sup>17</sup>O qui a 9 neutrons (17 - 8 = 9), et l'oxygène 18 <sup>18</sup>O qui a 10 neutrons (18 - 8 = 10)."
        }
      ]
    },
    {
      "titre": "Exercice 3 : Classification périodique",
      "points": "3 pts",
      "enonce": "<div style='padding: 10px; font-size: 16px; line-height: 1.6;'>On donne les atomes suivants :<br>- Aluminium (Al) : Z = 13<br>- Chlore (Cl) : Z = 17</div>",
      "questions": [
        {
          "question": "1) Écrire la structure électronique de chaque atome.",
          "reponse": "Aluminium (Z = 13) : (K)<sup>2</sup>(L)<sup>8</sup>(M)<sup>3</sup><br>Chlore (Z = 17) : (K)<sup>2</sup>(L)<sup>8</sup>(M)<sup>7</sup>"
        },
        {
          "question": "2) Déterminer la période et la famille (colonne) de chaque élément dans la classification périodique.",
          "reponse": "Aluminium :<br>- Période 3 (3 couches électroniques)<br>- Famille IIIA (3 électrons sur la couche externe)<br><br>Chlore :<br>- Période 3 (3 couches électroniques)<br>- Famille VIIA (7 électrons sur la couche externe)"
        },
        {
          "question": "3) Écrire la représentation de Lewis de chaque atome.",
          "reponse": "Aluminium (Al) : ● Al ● ● ● (3 électrons de valence)<br>Chlore (Cl) : ● Cl ● ● ● ● ● ● ● (7 électrons de valence, 1 doublet non liant et 3 doublets liants)"
        }
      ]
    },
    {
      "titre": "Exercice 4 : La force",
      "points": "4 pts",
      "enonce": "<div style='padding: 10px; font-size: 16px; line-height: 1.6;'>Un solide de masse \\( m = 2 \\, \\text{kg} \\) est posé sur une table horizontale. On prendra \\( g = 10 \\, \\text{N/kg} \\).</div>",
      "questions": [
        {
          "question": "1) Quelles sont les forces qui s'exercent sur le solide ? Donner leurs caractéristiques (direction, sens, point d'application, intensité).",
          "reponse": "Les forces qui s'exercent sur le solide sont :<br>- Le poids \\( \\vec{P} \\) : direction verticale, sens vers le bas, point d'application le centre de gravité G, intensité \\( P = m \\times g = 2 \\times 10 = 20 \\, \\text{N} \\).<br>- La réaction normale \\( \\vec{R} \\) : direction verticale, sens vers le haut, point d'application le point de contact entre le solide et la table, intensité \\( R = 20 \\, \\text{N} \\) (car le solide est en équilibre)."
        },
        {
          "question": "2) Enoncer le principe des actions réciproques et l'appliquer à ce solide.",
          "reponse": "Le principe des actions réciproques (3e loi de Newton) énonce que lorsque deux corps A et B interagissent, la force exercée par A sur B est opposée à la force exercée par B sur A.<br>Application : Le solide exerce sur la table une force \\( \\vec{R'} \\) (pression) verticale vers le bas de même intensité que la réaction \\( \\vec{R} \\), soit 20 N."
        },
        {
          "question": "3) Que vaut la résultante des forces ? Justifier votre réponse.",
          "reponse": "La résultante des forces est nulle \\( \\sum \\vec{F} = \\vec{0} \\) car le solide est en équilibre (immobile sur la table). Le poids et la réaction se compensent."
        }
      ]
    },
    {
      "titre": "Exercice 5 : Poids et tension",
      "points": "5 pts",
      "enonce": "<div style='padding: 10px; font-size: 16px; line-height: 1.6;'>Un solide de masse \\( m = 5 \\, \\text{kg} \\) est suspendu par un câble à un support fixe. Le solide est immobile. On prendra \\( g = 10 \\, \\text{N/kg} \\).</div>",
      "questions": [
        {
          "question": "1) Définir le poids d'un corps.",
          "reponse": "Le poids est la force d'attraction gravitationnelle exercée par la Terre sur un corps. C'est une force à distance, verticale, dirigée vers le centre de la Terre."
        },
        {
          "question": "2) Calculer l'intensité du poids du solide.",
          "reponse": "\\( P = m \\times g = 5 \\times 10 = 50 \\, \\text{N} \\)"
        },
        {
          "question": "3) Quelles forces s'exercent sur le solide ?",
          "reponse": "Deux forces s'exercent sur le solide :<br>- Le poids \\( \\vec{P} \\), vertical vers le bas, d'intensité 50 N.<br>- La tension \\( \\vec{T} \\) du câble, verticale vers le haut, d'intensité inconnue."
        },
        {
          "question": "4) En appliquant le principe d'inertie, déterminer l'intensité de la tension du câble.",
          "reponse": "Le solide est immobile, donc il est en équilibre. D'après le principe d'inertie, la résultante des forces est nulle : \\( \\vec{P} + \\vec{T} = \\vec{0} \\). On a donc \\( T = P = 50 \\, \\text{N} \\)."
        },
        {
          "question": "5) Si le solide est maintenant suspendu à un ressort de raideur \\( k = 200 \\, \\text{N/m} \\), quel est l'allongement du ressort ?",
          "reponse": "À l'équilibre, la force de rappel du ressort compense le poids : \\( F_{ressort} = k \\times \\Delta l = P \\).<br>Donc \\( \\Delta l = \\dfrac{P}{k} = \\dfrac{50}{200} = 0,25 \\, \\text{m} = 25 \\, \\text{cm} \\)."
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
