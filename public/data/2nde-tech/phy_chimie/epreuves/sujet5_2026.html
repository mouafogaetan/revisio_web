<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Physique-Chimie",
  "classe": "2nde technique",
  "sequence": "Séquence 5",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Structure de l'atome et configuration électronique (4 pts)",
      "points": "4 pts",
      "enonce": "<p>On considère un atome de phosphore (<span style='font-family:monospace;font-weight:bold;'>P</span>) dont le noyau contient 15 protons et 16 neutrons.</p><ol style='list-style-type:lower-roman;'><li>Donner la composition de cet atome.</li><li>Écrire sa formule électronique.</li><li>Déterminer sa position dans la classification périodique (période et famille).</li><li>Représenter l'atome de phosphore selon la notation symbolique <span style='font-family:monospace;'>$^A_Z X$</span>.</li></ol>",
      "questions": [
        {
          "question": "<strong>i)</strong> Donner la composition de l'atome de phosphore.",
          "reponse": "L'atome de phosphore est composé de :<br>- 15 protons (Z = 15)<br>- 16 neutrons (A - Z = 31 - 15 = 16)<br>- 15 électrons (atome électriquement neutre)."
        },
        {
          "question": "<strong>ii)</strong> Écrire sa formule électronique.",
          "reponse": "La structure électronique du phosphore est : $(K)^2(L)^8(M)^5$ soit $1s^2\\,2s^2\\,2p^6\\,3s^2\\,3p^3$."
        },
        {
          "question": "<strong>iii)</strong> Déterminer sa position dans la classification périodique.",
          "reponse": "Le phosphore (Z = 15) est situé :<br>- <strong>Période 3</strong> car il possède 3 couches électroniques (K, L, M).<br>- <strong>Famille 15 (ou VA)</strong> car il possède 5 électrons de valence (couche M)."
        },
        {
          "question": "<strong>iv)</strong> Représenter l'atome de phosphore selon la notation symbolique.",
          "reponse": "$^{31}_{15}P$"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Classification périodique et représentation de Lewis (3 pts)",
      "points": "3 pts",
      "enonce": "<p>Le tableau ci-dessous donne les numéros atomiques de quelques éléments :</p><div style='background:#f5f5f5; padding:12px; border-radius:8px; margin:10px 0; text-align:center;'><table style='width:100%; border-collapse:collapse;'><tr style='background:#1565c0; color:white;'><th style='padding:8px; border:1px solid #ddd;'>Élément</th><th style='padding:8px; border:1px solid #ddd;'>Na</th><th style='padding:8px; border:1px solid #ddd;'>Mg</th><th style='padding:8px; border:1px solid #ddd;'>Cl</th><th style='padding:8px; border:1px solid #ddd;'>Ar</th></tr><tr><td style='padding:8px; border:1px solid #ddd;'>Z</td><td style='padding:8px; border:1px solid #ddd;'>11</td><td style='padding:8px; border:1px solid #ddd;'>12</td><td style='padding:8px; border:1px solid #ddd;'>17</td><td style='padding:8px; border:1px solid #ddd;'>18</td></tr></table></div><ol style='list-style-type:lower-roman;'><li>Donner la formule électronique de chacun de ces éléments.</li><li>Écrire la représentation de Lewis de chaque atome.</li><li>Identifier les éléments qui respectent la règle de l'octet. Justifier.</li></ol>",
      "questions": [
        {
          "question": "<strong>i)</strong> Donner la formule électronique de chacun des éléments.",
          "reponse": "Na (Z=11) : (K)²(L)⁸(M)¹<br>Mg (Z=12) : (K)²(L)⁸(M)²<br>Cl (Z=17) : (K)²(L)⁸(M)⁷<br>Ar (Z=18) : (K)²(L)⁸(M)⁸"
        },
        {
          "question": "<strong>ii)</strong> Écrire la représentation de Lewis de chaque atome.",
          "reponse": "Na : Na avec 1 point autour<br>Mg : Mg avec 2 points autour<br>Cl : Cl avec 7 points autour<br>Ar : Ar avec 8 points autour"
        },
        {
          "question": "<strong>iii)</strong> Identifier les éléments qui respectent la règle de l'octet.",
          "reponse": "L'argon (Ar) respecte la règle de l'octet car il possède 8 électrons sur sa couche externe (M). Il est chimiquement stable. Les autres éléments ont moins de 8 électrons de valence."
        }
      ]
    },
    {
      "titre": "Exercice 3 : Ions et électroneutralité d'une solution (3 pts)",
      "points": "3 pts",
      "enonce": "<p>On dissout du chlorure de calcium <span style='font-family:monospace;font-weight:bold;'>CaCl₂</span> dans de l'eau distillée. La solution obtenue contient des ions <span style='font-family:monospace;'>Ca²⁺</span> et <span style='font-family:monospace;'>Cl⁻</span>.</p><ol style='list-style-type:lower-roman;'><li>Écrire l'équation de dissolution du chlorure de calcium.</li><li>Identifier les cations et les anions présents dans la solution.</li><li>La concentration en ions <span style='font-family:monospace;'>Ca²⁺</span> est de <span style='font-family:monospace;'>$0,2\\,mol\\cdot L^{-1}$</span>. Déterminer la concentration en ions <span style='font-family:monospace;'>Cl⁻</span> en appliquant l'équation d'électroneutralité.</li></ol>",
      "questions": [
        {
          "question": "<strong>i)</strong> Écrire l'équation de dissolution du chlorure de calcium.",
          "reponse": "$CaCl_{2(s)} \\rightarrow Ca^{2+}_{(aq)} + 2Cl^{-}_{(aq)}$"
        },
        {
          "question": "<strong>ii)</strong> Identifier les cations et les anions présents.",
          "reponse": "Cation : $Ca^{2+}$<br>Anion : $Cl^-$"
        },
        {
          "question": "<strong>iii)</strong> Déterminer la concentration en ions Cl⁻.",
          "reponse": "L'équation d'électroneutralité : $2[Ca^{2+}] = [Cl^-]$<br>Donc $[Cl^-] = 2 \\times 0,2 = 0,4\\,mol\\cdot L^{-1}$"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Poids d'un corps et forces (3 pts)",
      "points": "3 pts",
      "enonce": "<p>Un objet de masse <span style='font-family:monospace;'>$m = 50\\,kg$</span> est posé sur une table horizontale. On donne <span style='font-family:monospace;'>$g = 9,8\\,N\\cdot kg^{-1}$</span>.</p><ol style='list-style-type:lower-roman;'><li>Calculer le poids de l'objet.</li><li>Représenter qualitativement les forces qui s'appliquent sur l'objet.</li><li>Enoncer le principe des actions réciproques et identifier le couple d'actions réciproques correspondant.</li></ol>",
      "questions": [
        {
          "question": "<strong>i)</strong> Calculer le poids de l'objet.",
          "reponse": "$P = m \\times g = 50 \\times 9,8 = 490\\,N$"
        },
        {
          "question": "<strong>ii)</strong> Représenter qualitativement les forces.",
          "reponse": "L'objet est soumis à deux forces :<br>- Son poids $\\vec{P}$ vertical vers le bas (490 N).<br>- La réaction normale du support $\\vec{R}$ verticale vers le haut, de même intensité (principe d'inertie car l'objet est en équilibre)."
        },
        {
          "question": "<strong>iii)</strong> Énoncer le principe des actions réciproques.",
          "reponse": "Le principe des actions réciproques (3ème loi de Newton) s'énonce : <em>Si un corps A exerce une force sur un corps B, alors le corps B exerce sur le corps A une force de même direction, de même intensité mais de sens opposé.</em><br>Couple d'actions réciproques : l'objet exerce sur la table une force (son poids) et la table exerce sur l'objet la réaction normale $\\vec{R}$."
        }
      ]
    },
    {
      "titre": "Exercice 5 : Équilibre d'un solide - Théorème des moments (4 pts)",
      "points": "4 pts",
      "enonce": "<p>Une barre homogène de masse négligeable, de longueur <span style='font-family:monospace;'>$L = 1,2\\,m$</span>, est articulée en un point <span style='font-family:monospace;'>O</span>. On suspend à l'extrémité A une masse <span style='font-family:monospace;'>$m_1 = 2\\,kg$</span>. On veut équilibrer la barre en suspendant une masse <span style='font-family:monospace;'>$m_2$</span> à l'extrémité B. On donne <span style='font-family:monospace;'>$g = 9,8\\,N\\cdot kg^{-1}$</span>.</p><div style='text-align:center; padding:10px; background:#f5f5f5; border-radius:8px; margin:15px 0;'><p style='font-family:monospace;'>O -------- A (m₁)<br/>|<br/>B (m₂)</p></div><ol style='list-style-type:lower-roman;'><li>Faire le bilan des forces qui s'appliquent sur la barre.</li><li>Appliquer le théorème des moments par rapport au point O pour déterminer la masse <span style='font-family:monospace;'>$m_2$</span>.</li><li>Préciser la condition d'équilibre de la barre.</li></ol>",
      "questions": [
        {
          "question": "<strong>i)</strong> Faire le bilan des forces.",
          "reponse": "Forces appliquées sur la barre :<br>- Le poids de la masse m₁ en A : $\\vec{P_1}$ vertical vers le bas<br>- Le poids de la masse m₂ en B : $\\vec{P_2}$ vertical vers le bas<br>- La réaction de l'articulation en O : $\\vec{R}$"
        },
        {
          "question": "<strong>ii)</strong> Appliquer le théorème des moments.",
          "reponse": "Théorème des moments par rapport à O :<br>La barre est en équilibre, donc la somme des moments est nulle.<br>$\\sum \\mathcal{M}_O(\\vec{F}) = 0$<br>$\\mathcal{M}_O(\\vec{P_1}) + \\mathcal{M}_O(\\vec{P_2}) = 0$<br>$P_1 \\times OA - P_2 \\times OB = 0$<br>On suppose OA = OB = L/2.<br>$m_1 \\times g \\times \\dfrac{L}{2} = m_2 \\times g \\times \\dfrac{L}{2}$<br>$m_1 = m_2$<br>Donc $m_2 = 2\\,kg$."
        },
        {
          "question": "<strong>iii)</strong> Préciser la condition d'équilibre.",
          "reponse": "Pour que la barre soit en équilibre, il faut que :<br>- La somme vectorielle des forces soit nulle (principe d'inertie).<br>- La somme des moments des forces par rapport à un point quelconque soit nulle.<br>Dans ce cas : $\\vec{P_1} + \\vec{P_2} + \\vec{R} = \\vec{0}$ et $\\sum \\mathcal{M}_O(\\vec{F}) = 0$."
        }
      ]
    },
    {
      "titre": "Exercice 6 : Pression et forces pressantes (3 pts)",
      "points": "3 pts",
      "enonce": "<p>Un bloc de béton de masse <span style='font-family:monospace;'>$m = 120\\,kg$</span> repose sur le sol. Sa base est un rectangle de dimensions <span style='font-family:monospace;'>$0,8\\,m \\times 1,2\\,m$</span>. On donne <span style='font-family:monospace;'>$g = 9,8\\,N\\cdot kg^{-1}$</span>.</p><ol style='list-style-type:lower-roman;'><li>Calculer la pression exercée par le bloc sur le sol.</li><li>Si le bloc est retourné sur une face plus petite (<span style='font-family:monospace;'>$0,5\\,m \\times 0,8\\,m$</span>), la pression augmente-t-elle ou diminue-t-elle ? Justifier.</li><li>Donner l'unité de la pression dans le Système International.</li></ol>",
      "questions": [
        {
          "question": "<strong>i)</strong> Calculer la pression exercée par le bloc sur le sol.",
          "reponse": "Poids du bloc : $P = m \\times g = 120 \\times 9,8 = 1176\\,N$<br>Surface de contact : $S = 0,8 \\times 1,2 = 0,96\\,m^2$<br>Pression : $p = \\dfrac{F}{S} = \\dfrac{1176}{0,96} = 1225\\,Pa$"
        },
        {
          "question": "<strong>ii)</strong> Effet d'un retournement du bloc.",
          "reponse": "Nouvelle surface : $S' = 0,5 \\times 0,8 = 0,4\\,m^2$<br>Pression : $p' = \\dfrac{1176}{0,4} = 2940\\,Pa$<br>La pression augmente car la surface de contact diminue (la force reste la même)."
        },
        {
          "question": "<strong>iii)</strong> Unité de la pression dans le SI.",
          "reponse": "L'unité de la pression dans le Système International est le <strong>pascal (Pa)</strong>. $1\\,Pa = 1\\,N\\cdot m^{-2}$."
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
