<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Physique-Chimie",
  "classe": "2nde technique",
  "sequence": "Évaluation Séquentielle n°3",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Structure de l'atome et classification périodique",
      "points": "5 pts",
      "enonce": "<div style='font-size: 1em; line-height: 1.6; color: #1a1a2e;'>Cet exercice explore la structure de l'atome, les isotopes, la configuration électronique et l'utilisation de la classification périodique.</div>",
      "questions": [
        {
          "question": "<div style='margin: 10px 0;'><strong>1.1 (1 pt)</strong> L'atome de carbone a pour numéro atomique Z = 6 et nombre de masse A = 14. Donnez la représentation symbolique de ce noyau et précisez le nombre de protons, de neutrons et d'électrons qu'il contient.</div>",
          "reponse": "<div style='padding: 12px; background-color: #eef2f7; border-radius: 8px; color: #1a2b4c;'>Représentation : \\( ^{14}_{6}C \\)<br>Composition :<br>- 6 protons<br>- 14 − 6 = 8 neutrons<br>- 6 électrons (atome neutre)</div>"
        },
        {
          "question": "<div style='margin: 10px 0;'><strong>1.2 (1 pt)</strong> Le carbone existe sous trois formes : \\( ^{12}_{6}C \\), \\( ^{13}_{6}C \\) et \\( ^{14}_{6}C \\). De quel phénomène s'agit-il ? Justifiez votre réponse.</div>",
          "reponse": "<div style='padding: 12px; background-color: #eef2f7; border-radius: 8px; color: #1a2b4c;'>Il s'agit d'isotopes. Les trois atomes ont le même nombre de protons (Z = 6, donc même élément chimique) mais des nombres de masse A différents (12, 13, 14). Leur nombre de neutrons (A − Z) est donc différent : 6, 7 et 8 neutrons respectivement.</div>"
        },
        {
          "question": "<div style='margin: 10px 0;'><strong>1.3 (1 pt)</strong> Établissez la configuration électronique de l'atome d'oxygène (Z = 8).</div>",
          "reponse": "<div style='padding: 12px; background-color: #eef2f7; border-radius: 8px; color: #1a2b4c;'>Configuration électronique de l'oxygène (Z = 8) : <br>(K)<sup>2</sup> (L)<sup>6</sup></div>"
        },
        {
          "question": "<div style='margin: 10px 0;'><strong>1.4 (1 pt)</strong> Le soufre (S) a pour configuration électronique (K)<sup>2</sup>(L)<sup>8</sup>(M)<sup>6</sup>. Utilisez la règle de l'octet pour expliquer comment l'atome de soufre devient stable.</div>",
          "reponse": "<div style='padding: 12px; background-color: #eef2f7; border-radius: 8px; color: #1a2b4c;'>L'atome de soufre possède 6 électrons sur sa couche externe (M). Pour respecter la règle de l'octet, il doit atteindre 8 électrons sur cette couche. Il doit donc gagner 2 électrons pour devenir l'ion sulfure S<sup>2−</sup>.</div>"
        },
        {
          "question": "<div style='margin: 10px 0;'><strong>1.5 (1 pt)</strong> Un atome possède 17 électrons. À quelle famille appartient-il ? Justifiez votre réponse.</div>",
          "reponse": "<div style='padding: 12px; background-color: #eef2f7; border-radius: 8px; color: #1a2b4c;'>L'atome avec 17 électrons est le chlore (Cl). Sa configuration est (K)<sup>2</sup>(L)<sup>8</sup>(M)<sup>7</sup>. Il possède 7 électrons de valence, il appartient donc à la famille des halogènes (groupe 17 ou VIIA).</div>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Les forces et leurs applications",
      "points": "4 pts",
      "enonce": "<div style='font-size: 1em; line-height: 1.6; color: #1a1a2e;'>Cet exercice traite des forces, de leurs caractéristiques et de leurs effets.</div>",
      "questions": [
        {
          "question": "<div style='margin: 10px 0;'><strong>2.1 (1 pt)</strong> Définissez une force et donnez ses trois caractéristiques.</div>",
          "reponse": "<div style='padding: 12px; background-color: #eef2f7; border-radius: 8px; color: #1a2b4c;'>Une force est une action mécanique capable de déformer un corps, de modifier son mouvement ou de le mettre en équilibre.<br>Les trois caractéristiques d'une force sont :<br>- Sa direction (ligne d'action)<br>- Son sens<br>- Son intensité (valeur en Newton)</div>"
        },
        {
          "question": "<div style='margin: 10px 0;'><strong>2.2 (1 pt)</strong> Distinguez une force de contact d'une force de champ en donnant un exemple pour chacune.</div>",
          "reponse": "<div style='padding: 12px; background-color: #eef2f7; border-radius: 8px; color: #1a2b4c;'>- Force de contact : s'exerce lorsqu'il y a contact physique entre deux objets. Exemple : la force de frottement d'un pneu sur la route.<br>- Force de champ : s'exerce à distance, sans contact matériel. Exemple : le poids (force gravitationnelle) ou la force magnétique.</div>"
        },
        {
          "question": "<div style='margin: 10px 0;'><strong>2.3 (1 pt)</strong> Un objet de masse m = 2,0 kg est posé sur une table horizontale. Calculez la valeur de son poids. Donnée : g = 10 N/kg.</div>",
          "reponse": "<div style='padding: 12px; background-color: #eef2f7; border-radius: 8px; color: #1a2b4c;'>P = m × g = 2,0 × 10 = 20 N. Le poids a une direction verticale et est dirigé vers le bas.</div>"
        },
        {
          "question": "<div style='margin: 10px 0;'><strong>2.4 (1 pt)</strong> Un enfant tire un traîneau de masse 5 kg sur une surface horizontale. La force de frottement est de 10 N. Si l'enfant exerce une force de traction horizontale de 25 N, calculez la résultante des forces horizontales.</div>",
          "reponse": "<div style='padding: 12px; background-color: #eef2f7; border-radius: 8px; color: #1a2b4c;'>Les forces horizontales sont : la force de traction (25 N vers l'avant) et la force de frottement (10 N vers l'arrière).<br>Résultante horizontale : F<sub>r</sub> = 25 − 10 = 15 N vers l'avant.</div>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : La quantité de matière et les édifices chimiques",
      "points": "4 pts",
      "enonce": "<div style='font-size: 1em; line-height: 1.6; color: #1a1a2e;'>Les questions suivantes portent sur la mole, la masse molaire et la loi d'Avogadro.</div>",
      "questions": [
        {
          "question": "<div style='margin: 10px 0;'><strong>3.1 (1 pt)</strong> Énoncez la loi d'Avogadro.</div>",
          "reponse": "<div style='padding: 12px; background-color: #eef2f7; border-radius: 8px; color: #1a2b4c;'>La loi d'Avogadro stipule que des volumes égaux de gaz différents, dans les mêmes conditions de température et de pression, contiennent le même nombre de molécules.</div>"
        },
        {
          "question": "<div style='margin: 10px 0;'><strong>3.2 (1 pt)</strong> Calculez la masse molaire moléculaire de l'éthanol C<sub>2</sub>H<sub>6</sub>O. Données : M(C) = 12 g/mol, M(H) = 1 g/mol, M(O) = 16 g/mol.</div>",
          "reponse": "<div style='padding: 12px; background-color: #eef2f7; border-radius: 8px; color: #1a2b4c;'>M(C<sub>2</sub>H<sub>6</sub>O) = 2 × 12 + 6 × 1 + 1 × 16 = 24 + 6 + 16 = 46 g/mol.</div>"
        },
        {
          "question": "<div style='margin: 10px 0;'><strong>3.3 (1 pt)</strong> Combien de moles y a-t-il dans 23 g d'éthanol ?</div>",
          "reponse": "<div style='padding: 12px; background-color: #eef2f7; border-radius: 8px; color: #1a2b4c;'>n = m / M = 23 / 46 = 0,5 mol.</div>"
        },
        {
          "question": "<div style='margin: 10px 0;'><strong>3.4 (1 pt)</strong> Un échantillon contient 0,5 mol d'éthanol. Calculez le nombre de molécules d'éthanol présentes. Donnée : N<sub>A</sub> = 6,02 × 10<sup>23</sup> mol<sup>−1</sup>.</div>",
          "reponse": "<div style='padding: 12px; background-color: #eef2f7; border-radius: 8px; color: #1a2b4c;'>N = n × N<sub>A</sub> = 0,5 × 6,02 × 10<sup>23</sup> = 3,01 × 10<sup>23</sup> molécules.</div>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Intensité et tension électrique",
      "points": "4 pts",
      "enonce": "<div style='font-size: 1em; line-height: 1.6; color: #1a1a2e;'>Cet exercice porte sur les tensions, l'utilisation de l'oscilloscope et les types de tensions.</div>",
      "questions": [
        {
          "question": "<div style='margin: 10px 0;'><strong>4.1 (1 pt)</strong> Un oscilloscope est réglé sur les calibres suivants :<br>- Calibre vertical : 2 V/div<br>- Calibre horizontal (balayage) : 5 ms/div<br>Un signal sinusoïdal occupe 4 divisions verticales (crête à crête) et une période s'étend sur 5 divisions horizontales.<br>Calculez :<br>a) La tension maximale U<sub>max</sub><br>b) La période T et la fréquence f.</div>",
          "reponse": "<div style='padding: 12px; background-color: #eef2f7; border-radius: 8px; color: #1a2b4c;'>a) Tension crête à crête : U<sub>cc</sub> = 4 × 2 = 8 V. U<sub>max</sub> = U<sub>cc</sub>/2 = 4 V.<br>b) T = 5 × 5 = 25 ms = 0,025 s. f = 1/T = 1/0,025 = 40 Hz.</div>"
        },
        {
          "question": "<div style='margin: 10px 0;'><strong>4.2 (1 pt)</strong> Quelle est la différence entre une tension continue constante et une tension continue variable ?</div>",
          "reponse": "<div style='padding: 12px; background-color: #eef2f7; border-radius: 8px; color: #1a2b4c;'>- Une tension continue constante garde la même valeur au cours du temps (ex: pile).<br>- Une tension continue variable change d'amplitude au cours du temps mais garde le même signe (elle ne s'annule pas et ne change pas de signe).</div>"
        },
        {
          "question": "<div style='margin: 10px 0;'><strong>4.3 (1 pt)</strong> La tension du secteur au Cameroun est de 220 V (valeur efficace) et de fréquence 50 Hz.<br>Calculez la tension maximale U<sub>max</sub> de cette tension. (Rappel : U<sub>eff</sub> = U<sub>max</sub>/√2)</div>",
          "reponse": "<div style='padding: 12px; background-color: #eef2f7; border-radius: 8px; color: #1a2b4c;'>U<sub>max</sub> = U<sub>eff</sub> × √2 = 220 × √2 ≈ 311 V.</div>"
        },
        {
          "question": "<div style='margin: 10px 0;'><strong>4.4 (1 pt)</strong> Quelle est l'unité de la fréquence dans le Système International ?</div>",
          "reponse": "<div style='padding: 12px; background-color: #eef2f7; border-radius: 8px; color: #1a2b4c;'>L'unité de la fréquence est le hertz (Hz).</div>"
        }
      ]
    },
    {
      "titre": "Exercice 5 : Les réactions chimiques",
      "points": "3 pts",
      "enonce": "<div style='font-size: 1em; line-height: 1.6; color: #1a1a2e;'>Cet exercice porte sur les réactions chimiques, l'équation bilan et la loi de Lavoisier.</div>",
      "questions": [
        {
          "question": "<div style='margin: 10px 0;'><strong>5.1 (1 pt)</strong> Équilibrez l'équation-bilan suivante :<br>C<sub>3</sub>H<sub>8</sub> + O<sub>2</sub> → CO<sub>2</sub> + H<sub>2</sub>O</div>",
          "reponse": "<div style='padding: 12px; background-color: #eef2f7; border-radius: 8px; color: #1a2b4c;'>C<sub>3</sub>H<sub>8</sub> + 5 O<sub>2</sub> → 3 CO<sub>2</sub> + 4 H<sub>2</sub>O</div>"
        },
        {
          "question": "<div style='margin: 10px 0;'><strong>5.2 (1 pt)</strong> Énoncez la loi de Lavoisier (loi de conservation de la masse).</div>",
          "reponse": "<div style='padding: 12px; background-color: #eef2f7; border-radius: 8px; color: #1a2b4c;'>La loi de Lavoisier énonce que lors d'une réaction chimique, la masse totale des réactifs est égale à la masse totale des produits. La matière se conserve : les atomes sont réorganisés mais pas créés ni détruits.</div>"
        },
        {
          "question": "<div style='margin: 10px 0;'><strong>5.3 (1 pt)</strong> On fait brûler 2 mol de propane (C<sub>3</sub>H<sub>8</sub>) dans le dioxygène.<br>D'après l'équation équilibrée, quelle quantité de matière de dioxygène est consommée ?</div>",
          "reponse": "<div style='padding: 12px; background-color: #eef2f7; border-radius: 8px; color: #1a2b4c;'>D'après l'équation équilibrée, 1 mol de C<sub>3</sub>H<sub>8</sub> consomme 5 mol de O<sub>2</sub>.<br>Donc pour 2 mol de C<sub>3</sub>H<sub>8</sub> : n(O<sub>2</sub>) = 2 × 5 = 10 mol.</div>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
