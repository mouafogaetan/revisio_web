<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Biologie",
  "classe": "2nde technique",
  "sequence": "Séquence 6",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "EXERCICE 1 : MAÎTRISE DES CONNAISSANCES (8 pts)",
      "points": "8 pts",
      "enonce": "<p style='font-size: 1em; line-height: 1.6; color: #333;'>Cet exercice évalue vos connaissances fondamentales sur le monde vivant, la nutrition et l'environnement.</p>",
      "questions": [
        {
          "question": "<p><strong>1. (2 pts)</strong> L'eau et les sels minéraux sont essentiels au bon fonctionnement de l'organisme. Explique brièvement deux rôles majeurs de l'eau dans le corps humain et citez un exemple de sel minéral en précisant son rôle.</p>",
          "reponse": "<p><strong>Rôle de l'eau :</strong> L'eau est un solvant universel permettant le transport des nutriments et l'élimination des déchets (urine, sueur). Elle intervient également dans la régulation de la température corporelle via la transpiration [citation:1].</p><p><strong>Exemple de sel minéral :</strong> Le calcium est indispensable à la minéralisation des os et des dents, et participe à la coagulation sanguine [citation:1].</p>"
        },
        {
          "question": "<p><strong>2. (2 pts)</strong> Distingue une maladie nutritionnelle par carence d'une maladie par excès. Donne un exemple pour chaque catégorie et précise la ou les carence(s) ou excès responsable(s).</p>",
          "reponse": "<p><strong>Maladie par carence :</strong> Résulte d'une insuffisance d'apport en nutriments essentiels.</p><ul><li><strong>Exemple :</strong> Le rachitisme est dû à une carence en vitamine D et/ou en calcium, entraînant un défaut de minéralisation osseuse chez l'enfant [citation:1].</li></ul><p><strong>Maladie par excès :</strong> Résulte d'une consommation excessive de certains nutriments.</p><ul><li><strong>Exemple :</strong> L'obésité est due à un apport énergétique supérieur aux dépenses, souvent lié à une consommation excessive de lipides et de glucides [citation:1].</li></ul>"
        },
        {
          "question": "<p><strong>3. (2 pts)</strong> La pollution de l'air par les déchets ménagers a des conséquences graves sur la santé et l'environnement. Cite deux polluants issus des ordures ménagères et décris une conséquence sanitaire majeure de l'inhalation de ces polluants.</p>",
          "reponse": "<p><strong>Polluants :</strong></p><ul><li>Le <strong>dioxyde de soufre (SO2)</strong>, souvent issu de la combustion de déchets contenant du soufre.</li><li>Les <strong>particules fines (PM2.5)</strong>, produites par l'incinération incomplète des déchets.</li></ul><p><strong>Conséquence sanitaire :</strong> L'inhalation de ces polluants provoque des irritations des voies respiratoires et peut aggraver des pathologies telles que l'asthme ou d'autres maladies cardio-vasculaires [citation:1].</p>"
        },
        {
          "question": "<p><strong>4. (2 pts)</strong> La puberté marque le début de la capacité à se reproduire. Distingue les caractères sexuels primaires et secondaires en donnant un exemple pour chacun.</p>",
          "reponse": "<p><strong>Caractères sexuels primaires :</strong> Ce sont les organes reproducteurs directement liés à la fonction de reproduction, présents dès la naissance. <em>Exemple :</em> Les ovaires chez la fille, les testicules chez le garçon [citation:1].</p><p><strong>Caractères sexuels secondaires :</strong> Ils apparaissent à la puberté, sous l'effet des hormones, mais ne sont pas directement impliqués dans la reproduction. <em>Exemple :</em> La pousse des seins et l'élargissement du bassin chez la fille, la mue de la voix et la pilosité chez le garçon [citation:1].</p>"
        }
      ]
    },
    {
      "titre": "EXERCICE 2 : COMPÉTENCES MÉTHODOLOGIQUES (6 pts)",
      "points": "6 pts",
      "enonce": "<p style='font-size: 1em; line-height: 1.6; color: #333;'>Cet exercice teste votre capacité à analyser des données scientifiques, à réaliser des classifications et à résoudre un problème concret.</p>",
      "questions": [
        {
          "question": "<p><strong>1. Classification des glucides (2 pts)</strong></p><p>Complète le tableau suivant en classifiant les glucides selon leur origine et leur rôle, en t'aidant des exemples donnés : <em>Amidon, Glucose, Fructose, Cellulose</em>.</p><table style='width:100%; border-collapse: collapse; background-color: #f9f9f9; color: #000;'><thead><tr style='background-color: #ddd;'><th style='border: 1px solid #999; padding: 8px;'>Origine</th><th style='border: 1px solid #999; padding: 8px;'>Glucides (Exemples)</th><th style='border: 1px solid #999; padding: 8px;'>Rôle principal</th></tr></thead><tbody><tr><td style='border: 1px solid #999; padding: 8px;'>Végétale (réserve)</td><td style='border: 1px solid #999; padding: 8px;'>...</td><td style='border: 1px solid #999; padding: 8px;'>...</td></tr><tr><td style='border: 1px solid #999; padding: 8px;'>Végétale (structure)</td><td style='border: 1px solid #999; padding: 8px;'>...</td><td style='border: 1px solid #999; padding: 8px;'>...</td></tr><tr><td style='border: 1px solid #999; padding: 8px;'>Animale (sucre rapide)</td><td style='border: 1px solid #999; padding: 8px;'>...</td><td style='border: 1px solid #999; padding: 8px;'>...</td></tr></tbody></table>",
          "reponse": "<table style='width:100%; border-collapse: collapse; background-color: #f9f9f9; color: #000;'><thead><tr style='background-color: #ddd;'><th style='border: 1px solid #999; padding: 8px;'>Origine</th><th style='border: 1px solid #999; padding: 8px;'>Glucides (Exemples)</th><th style='border: 1px solid #999; padding: 8px;'>Rôle principal</th></tr></thead><tbody><tr><td style='border: 1px solid #999; padding: 8px;'>Végétale (réserve)</td><td style='border: 1px solid #999; padding: 8px;'>Amidon</td><td style='border: 1px solid #999; padding: 8px;'>Réserve énergétique chez les plantes</td></tr><tr><td style='border: 1px solid #999; padding: 8px;'>Végétale (structure)</td><td style='border: 1px solid #999; padding: 8px;'>Cellulose</td><td style='border: 1px solid #999; padding: 8px;'>Rôle structural (paroi des cellules végétales)</td></tr><tr><td style='border: 1px solid #999; padding: 8px;'>Animale (sucre rapide)</td><td style='border: 1px solid #999; padding: 8px;'>Glucose</td><td style='border: 1px solid #999; padding: 8px;'>Source d'énergie rapide pour les cellules</td></tr></tbody></table><p><em>NB : Le fructose est un glucide d'origine végétale (sucre des fruits).</em></p>"
        },
        {
          "question": "<p><strong>2. Cycle de multiplication bactérienne et facteurs d'influence (2 pts)</strong></p><p>Une souche bactérienne est mise en culture en laboratoire. Le graphique ci-dessous représente l'évolution du nombre de bactéries en fonction du temps.</p><div style='background-color: #eef2f5; padding: 15px; border-radius: 8px;'><div class='math-block'><div class='math'>$$ \\text{Nombre de bactéries} \\uparrow $$</div></div><div style='text-align: center;'><span style='background-color: #ccc; padding: 5px 15px; display: inline-block;'>Phase de latence</span> <span style='background-color: #aaa; padding: 5px 15px; display: inline-block;'>Phase exponentielle</span> <span style='background-color: #999; padding: 5px 15px; display: inline-block;'>Phase stationnaire</span> <span style='background-color: #888; padding: 5px 15px; display: inline-block;'>Phase de déclin</span></div><div style='text-align: right;'>Temps →</div></div><p>a) Cite trois facteurs physico-chimiques qui influencent la prolifération des bactéries.</p><p>b) Le maintien d'une chaîne du froid est crucial dans la conservation des aliments. Explique en quoi cette méthode agit sur l'un de ces facteurs pour limiter le développement bactérien.</p>",
          "reponse": "<p><strong>a) Facteurs influençant la prolifération :</strong></p><ul><li>La <strong>température</strong> : chaque bactérie a une température optimale de croissance.</li><li>Le <strong>pH</strong> (acidité ou alcalinité) du milieu.</li><li>La <strong>présence d'eau</strong> et la disponibilité des nutriments.</li></ul><p><strong>b) Rôle de la chaîne du froid :</strong></p><p>La réfrigération abaisse la température du milieu. Cela ralentit considérablement le métabolisme bactérien et leur cycle de multiplication. En passant de la température ambiante (favorable) à une température basse (4°C), la phase exponentielle est retardée, ce qui permet de conserver les aliments plus longtemps sans détérioration majeure.</p>"
        },
        {
          "question": "<p><strong>3. Situation de l'éducation à l'environnement (2 pts)</strong></p><p>Dans le cadre d'un projet de développement durable, ta classe doit organiser une campagne de sensibilisation sur le recyclage des déchets alimentaires. Propose un slogan et explique en deux arguments l'importance du compostage des déchets organiques pour l'environnement.</p>",
          "reponse": "<p><strong>Slogan proposé :</strong> « Un déchet bien trié est une ressource pour demain ! »</p><p><strong>Importance du compostage :</strong></p><ol><li><strong>Réduction des déchets enfouis :</strong> En compostant les déchets alimentaires (épluchures, marc de café), on diminue le volume d'ordures ménagères envoyées aux décharges, ce qui limite la production de gaz à effet de serre (méthane) [citation:1].</li><li><strong>Valorisation en engrais naturel :</strong> Le compost est un fertilisant riche en éléments minéraux qui améliore la structure et la fertilité des sols, réduisant ainsi le besoin d'engrais chimiques [citation:1].</li></ol>"
        }
      ]
    },
    {
      "titre": "EXERCICE 3 : SITUATION-PROBLÈME (6 pts)",
      "points": "6 pts",
      "enonce": "<p style='font-size: 1em; line-height: 1.6; color: #333;'>Lisez attentivement la situation suivante et répondez aux questions. L'exercice évalue votre capacité à mobiliser plusieurs chapitres pour analyser une problématique sanitaire et environnementale.</p>",
      "questions": [
        {
          "question": "<p><strong>Situation :</strong> Un adolescent de 15 ans, se plaignant de fatigue chronique et de difficultés de concentration, consulte son médecin. L'examen révèle une <strong>anémie</strong> (faible taux d'hémoglobine) et un début d'<strong>obésité</strong>. Par ailleurs, il vit dans un quartier où l'incinération sauvage des ordures ménagères est fréquente, ce qui provoque des épisodes de toux et de gêne respiratoire chez ses voisins.</p><p><strong>1. (1.5 pt)</strong> Explique quel(s) problème(s) nutritionnel(s) peut être à l'origine de son anémie. Propose un apport alimentaire conseillé pour y remédier.</p><p><strong>2. (1.5 pt)</strong> En quoi son mode de vie a-t-il pu favoriser l'apparition de l'obésité ? Propose une mesure hygiéno-diététique pour l'aider à retrouver un poids de santé.</p><p><strong>3. (1.5 pt)</strong> Identifie la (ou les) maladie(s) de carence ou d'excès pouvant être associée(s) à sa fatigue et à sa prise de poids.</p><p><strong>4. (1.5 pt)</strong> Relie cette situation à la pollution de l'air. Indique un polluant issu des déchets qui peut être responsable des symptômes respiratoires évoqués et un conseil pour réduire cette pollution.</p>",
          "reponse": "<p><strong>1. Origine de l'anémie et conseil alimentaire :</strong> L'anémie chez un adolescent peut être due à une <strong>carence en fer</strong> ou en <strong>vitamine B12</strong> [citation:1]. Pour y remédier, il est conseillé d'augmenter la consommation d'aliments riches en fer, comme la viande rouge, les légumineuses (lentilles, haricots) ou les épinards, associés à un apport en vitamine C pour favoriser l'absorption.</p><p><strong>2. Favorisation de l'obésité et mesure :</strong> L'obésité est favorisée par une alimentation déséquilibrée (excès de sucres rapides et de graisses saturées) et un manque d'activité physique. <strong>Mesure hygiéno-diététique :</strong> Opter pour une alimentation variée riche en fibres (légumes, fruits), limiter les aliments transformés et pratiquer une activité physique régulière (au moins 30 min par jour).</p><p><strong>3. Maladies associées :</strong></p><ul><li><strong>Fatigue et anémie :</strong> Souvent liée à une hypovitaminose (carence en vitamine B9 ou B12) ou à une carence martiale (fer).</li><li><strong>Prise de poids :</strong> Liée à une malnutrition par excès, précurseur du diabète de type 2 et des maladies cardio-vasculaires.</li></ul><p><strong>4. Lien avec la pollution de l'air :</strong> Les symptômes respiratoires sont aggravés par l'inhalation de <strong>particules fines (PM2.5)</strong> et de gaz toxiques (comme le SO2) émis lors de l'incinération sauvage des déchets. <strong>Conseil :</strong> Promouvoir le compostage des déchets organiques et le recyclage des déchets non organiques, et interdir l'incinération à l'air libre [citation:1].</p>"

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
