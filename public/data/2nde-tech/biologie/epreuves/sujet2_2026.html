<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Biologie",
  "classe": "2nde technique",
  "sequence": "Séquence 2",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Les maladies nutritionnelles et leurs causes",
      "points": "4 pts",
      "enonce": "<div style='padding: 10px; font-size: 16px; line-height: 1.6;'><p>L'alimentation joue un rôle fondamental dans le maintien de la santé. Un déséquilibre nutritionnel, qu'il s'agisse d'une carence ou d'un excès, peut être à l'origine de maladies graves.</p><p>Le document ci-dessous présente quelques pathologies liées à des troubles alimentaires.</p><div style='background-color: #f5f5f5; padding: 15px; border-radius: 8px; margin: 15px 0;'><p><strong>Document :</strong></p><ul style='list-style-type: disc; padding-left: 20px;'><li>Le rachitisme : maladie caractérisée par une fragilité osseuse et des déformations squelettiques.</li><li>Le goitre : hypertrophie de la glande thyroïde se manifestant par un gonflement au niveau du cou.</li><li>L'obésité : accumulation excessive de graisse dans le corps, avec un IMC supérieur à 30.</li><li>L'anémie : diminution du taux d'hémoglobine dans le sang, entraînant fatigue et pâleur.</li></ul></div></div>",
      "questions": [
        {
          "question": "1) Classer les quatre maladies présentées dans le document en deux catégories : <strong>maladies nutritionnelles de carence</strong> et <strong>maladies nutritionnelles par excès</strong>.",
          "reponse": "<div><strong>Maladies de carence :</strong> Rachitisme, Goitre, Anémie.<br><strong>Maladies par excès :</strong> Obésité.</div>"
        },
        {
          "question": "2) Pour chaque maladie de carence identifiée, préciser le nutriment ou l'élément qui manque dans l'organisme.",
          "reponse": "<div><strong>Rachitisme :</strong> Carence en vitamine D ou en calcium.<br><strong>Goitre :</strong> Carence en iode.<br><strong>Anémie :</strong> Carence en fer.</div>"
        },
        {
          "question": "3) Nommer une autre maladie nutritionnelle de l'excès en dehors de l'obésité, puis décrire succinctement ses manifestations.",
          "reponse": "<div><strong>Exemple :</strong> Le diabète de type 2.<br><strong>Manifestations :</strong> Soif excessive, envie fréquente d'uriner, fatigue, perte de poids inexpliquée, troubles de la vision.</div>"
        },
        {
          "question": "4) Expliquer pourquoi le tabagisme est considéré comme une maladie nutritionnelle de l'excès, alors qu'il ne s'agit pas d'un aliment.",
          "reponse": "<div>Le tabac n'est pas un aliment, mais il est classé parmi les maladies nutritionnelles de l'excès car il s'agit d'une substance toxique dont la consommation excessive a des effets néfastes sur l'organisme. Le tabac perturbe les mécanismes nutritionnels, il diminue l'appétit et provoque des carences en vitamines (notamment en vitamine C). Il peut également entraîner une perte de poids excessive. Par ailleurs, le tabac est un facteur de risque majeur pour le cancer.</div>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : La pollution de l'air par les déchets ménagers",
      "points": "4 pts",
      "enonce": "<div style='padding: 10px; font-size: 16px; line-height: 1.6;'><p>Dans la ville de Bafoussam, l'incinération des ordures ménagères à ciel ouvert est une pratique courante. Les habitants brûlent les déchets dans leurs cours ou dans des décharges improvisées. Cette pratique libère dans l'atmosphère divers polluants nocifs pour la santé.</p><div style='background-color: #f5f5f5; padding: 15px; border-radius: 8px; margin: 15px 0;'><p><strong>Document :</strong></p><p><em>\"La fumée qui s'échappe des déchets en feu contient plus de 100 substances différentes, dont des gaz toxiques comme le monoxyde de carbone, des particules fines et des composés organiques volatils (COV).\"</em></p></div></div>",
      "questions": [
        {
          "question": "1) Identifier trois polluants atmosphériques provenant du brûlage des ordures ménagères.",
          "reponse": "<div>1) Le monoxyde de carbone (CO)<br>2) Les particules fines (PM2.5, PM10)<br>3) Les composés organiques volatils (COV).</div>"
        },
        {
          "question": "2) Le monoxyde de carbone est un gaz particulièrement dangereux. Expliquer en quoi consiste sa toxicité pour le corps humain.",
          "reponse": "<div>Le monoxyde de carbone (CO) est toxique car il se fixe sur l'hémoglobine du sang à la place de l'oxygène, avec une affinité 250 fois plus élevée. Cela empêche le transport de l'oxygène vers les organes, provoquant une hypoxie (manque d'oxygène). Les symptômes incluent des maux de tête, des nausées et, dans les cas graves, le coma et la mort.</div>"
        },
        {
          "question": "3) Analyser une conséquence directe sur la santé des enfants exposés à ces fumées.",
          "reponse": "<div>Les enfants sont particulièrement vulnérables car leurs poumons sont encore en développement. L'inhalation des particules fines peut provoquer ou aggraver des maladies respiratoires comme l'asthme, les bronchites chroniques, les infections pulmonaires et, à long terme, réduire la capacité respiratoire. De plus, les particules peuvent traverser la barrière pulmonaire et affecter d'autres organes, augmentant le risque de pathologies cardiovasculaires à l'âge adulte.</div>"
        },
        {
          "question": "4) Proposer deux alternatives au brûlage des déchets pour réduire la pollution de l'air à Bafoussam.",
          "reponse": "<div><strong>Alternative 1 :</strong> Mettre en place une collecte sélective et des points de recyclage pour séparer les déchets organiques (compostage) et non organiques (plastiques, métaux).<br><strong>Alternative 2 :</strong> Promouvoir des décharges contrôlées avec enfouissement des déchets, pour éviter les émissions polluantes dans l'air.</div>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Multiplication bactérienne et facteurs de prolifération",
      "points": "4 pts",
      "enonce": "<div style='padding: 10px; font-size: 16px; line-height: 1.6;'><p>Les bactéries sont des micro-organismes présents partout dans notre environnement. Leur capacité à se multiplier rapidement est influencée par plusieurs facteurs.</p><div style='background-color: #f5f5f5; padding: 15px; border-radius: 8px; margin: 15px 0;'><p><strong>Document :</strong> La courbe de croissance bactérienne en milieu liquide présente quatre phases successives :</p><ul style='list-style-type: disc; padding-left: 20px;'><li>Phase de latence (adaptation au milieu)</li><li>Phase exponentielle (multiplication rapide)</li><li>Phase stationnaire (équilibre entre division et mort)</li><li>Phase de déclin (mort massive des bactéries)</li></ul></div></div>",
      "questions": [
        {
          "question": "1) Citer trois facteurs physico-chimiques qui influencent la prolifération des bactéries.",
          "reponse": "<div>1) La température<br>2) Le pH (acidité ou basicité du milieu)<br>3) L'humidité (ou la disponibilité en eau).</div>"
        },
        {
          "question": "2) La plupart des bactéries pathogènes pour l'homme se développent autour de 37°C. Comment appelle-t-on ces bactéries, selon leur température optimale de croissance ?",
          "reponse": "<div>Les bactéries qui se développent à des températures comprises entre 20°C et 45°C sont appelées <strong>mésophiles</strong>.</div>"
        },
        {
          "question": "3) Décrire l'événement qui se produit pendant la phase exponentielle de la courbe de croissance bactérienne.",
          "reponse": "<div>Pendant la phase exponentielle, les bactéries se divisent de manière rapide et régulière. Chaque bactérie se divise en deux, et la population double à intervalles réguliers (temps de génération). C'est la phase de multiplication active, où les conditions du milieu sont favorables : nutriments abondants, espace disponible, absence de déchets toxiques.</div>"
        },
        {
          "question": "4) Une souche bactérienne a un temps de génération de 20 minutes en conditions idéales. Partant d'une seule bactérie, calculer le nombre de bactéries obtenues après 2 heures de culture.",
          "reponse": "<div>2 heures = 120 minutes.<br>Nombre de générations = 120 min / 20 min = 6 générations.<br>Nombre final = 1 × 2<sup>6</sup> = 1 × 64 = <strong>64 bactéries</strong>.</div>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Rôle des micro-organismes en alimentation",
      "points": "4 pts",
      "enonce": "<div style='padding: 10px; font-size: 16px; line-height: 1.6;'><p>Les micro-organismes ne sont pas toujours nuisibles. Certains sont utilisés dans la préparation d'aliments consommés quotidiennement.</p><div style='background-color: #f5f5f5; padding: 15px; border-radius: 8px; margin: 15px 0;'><p><strong>Document :</strong></p><ul style='list-style-type: disc; padding-left: 20px;'><li>Le pain au levain : obtenu par fermentation de la farine par des levures.</li><li>Le yaourt : produit par fermentation du lait grâce à des bactéries (ferments lactiques).</li><li>Le vin : résulte de la fermentation du jus de raisin par des levures.</li></ul></div></div>",
      "questions": [
        {
          "question": "1) Dans le document, quel est le point commun entre la fabrication du pain et celle du vin ?",
          "reponse": "<div>Dans les deux cas, il s'agit d'une fermentation réalisée par des levures, qui sont des champignons microscopiques (micro-organismes eucaryotes). Les levures transforment les sucres en alcool et en dioxyde de carbone.</div>"
        },
        {
          "question": "2) Nommer les micro-organismes responsables de la transformation du lait en yaourt.",
          "reponse": "<div>Il s'agit de bactéries lactiques, principalement <em>Lactobacillus bulgaricus</em> et <em>Streptococcus thermophilus</em>.</div>"
        },
        {
          "question": "3) Expliquer le rôle des micro-organismes dans la conservation de certains aliments.",
          "reponse": "<div>Les micro-organismes peuvent jouer un rôle dans la conservation en créant un environnement défavorable aux bactéries pathogènes. Par exemple, dans la fermentation lactique du yaourt, les bactéries produisent de l'acide lactique qui acidifie le milieu et empêche la prolifération de germes indésirables. De même, la fermentation alcoolique du vin produit de l'alcool qui a un effet antiseptique et conserve la boisson.</div>"
        },
        {
          "question": "4) Classer les micro-organismes rencontrés dans cet exercice dans un tableau selon leur nature (bactérie, champignon, etc.).",
          "reponse": "<div><table style='width: 100%; border-collapse: collapse;'><tr style='background-color: #4CAF50; color: white;'><th style='padding: 8px; border: 1px solid #ddd;'>Micro-organisme</th><th style='padding: 8px; border: 1px solid #ddd;'>Nature</th></tr><tr><td style='padding: 8px; border: 1px solid #ddd;'>Levures (pain, vin)</td><td style='padding: 8px; border: 1px solid #ddd;'>Champignons microscopiques (eucaryotes)</td></tr><tr><td style='padding: 8px; border: 1px solid #ddd;'><em>Lactobacillus bulgaricus</em></td><td style='padding: 8px; border: 1px solid #ddd;'>Bactéries (procaryotes)</td></tr><tr><td style='padding: 8px; border: 1px solid #ddd;'><em>Streptococcus thermophilus</em></td><td style='padding: 8px; border: 1px solid #ddd;'>Bactéries (procaryotes)</td></tr></table></div>"
        }
      ]
    },
    {
      "titre": "Exercice 5 : L'eau et les sels minéraux dans l'organisme",
      "points": "4 pts",
      "enonce": "<div style='padding: 10px; font-size: 16px; line-height: 1.6;'><p>L'eau et les sels minéraux sont des éléments essentiels au bon fonctionnement de l'organisme. Leur carence ou leur excès peut entraîner divers troubles.</p></div>",
      "questions": [
        {
          "question": "1) Citer trois rôles de l'eau dans l'organisme humain.",
          "reponse": "<div>1) L'eau est le constituant principal du corps humain (environ 60% du poids).<br>2) Elle est un solvant universel qui permet le transport des nutriments et des déchets.<br>3) Elle intervient dans la régulation de la température corporelle (sudation).<br>4) Elle est un milieu de réaction pour les réactions métaboliques.</div>"
        },
        {
          "question": "2) Identifier les sels minéraux suivants à partir de leur rôle : <br>a) Indispensable à la formation des os et des dents. <br>b) Indispensable à la fabrication des globules rouges et à la lutte contre l'anémie.",
          "reponse": "<div>a) Calcium<br>b) Fer</div>"
        },
        {
          "question": "3) Quels sont les besoins hydriques quotidiens recommandés pour un adolescent ?",
          "reponse": "<div>Un adolescent a besoin d'environ 1,5 à 2 litres d'eau par jour, en fonction de l'activité physique et de la température ambiante.</div>"
        },
        {
          "question": "4) Le sel de table (chlorure de sodium) contient deux sels minéraux essentiels. Lesquels ? Donner un exemple de leur rôle.",
          "reponse": "<div>Le sel de table est composé d'ions sodium (Na⁺) et de chlorure (Cl⁻).<br><strong>Rôle du sodium :</strong> il assure l'équilibre hydrique de l'organisme et permet la transmission de l'influx nerveux.<br><strong>Rôle du chlorure :</strong> il participe à la digestion en formant l'acide chlorhydrique dans l'estomac.</div>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
