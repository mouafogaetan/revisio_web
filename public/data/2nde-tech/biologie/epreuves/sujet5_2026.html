<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Biologie",
  "classe": "2nde technique",
  "sequence": "Séquence 5",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : La puberté et les caractères sexuels",
      "points": "5 pts",
      "enonce": "<div style='padding: 10px; font-size: 16px; line-height: 1.8;'><p>La puberté est une période de transition entre l'enfance et l'âge adulte, marquée par des transformations physiques et physiologiques importantes.</p><div style='background-color: #e3f2fd; padding: 15px; border-radius: 8px; margin: 15px 0;'><p><strong>Document :</strong></p><ul style='list-style-type: disc; padding-left: 20px;'><li>Chez le garçon : développement des testicules et du pénis, apparition de la pilosité pubienne et faciale, mue de la voix, développement musculaire.</li><li>Chez la fille : développement des seins, apparition de la pilosité pubienne, élargissement du bassin, apparition des premières règles (ménarche).</li></ul></div></div>",
      "questions": [
        {
          "question": "1) Distinguer les caractères sexuels primaires des caractères sexuels secondaires.",
          "reponse": "<div><strong>Caractères sexuels primaires :</strong> Ils sont présents dès la naissance et sont directement liés à la reproduction. Chez le garçon, il s'agit des testicules et du pénis. Chez la fille, il s'agit des ovaires, des trompes, de l'utérus et du vagin.<br><br><strong>Caractères sexuels secondaires :</strong> Ils apparaissent à la puberté sous l'influence des hormones sexuelles. Ils ne sont pas directement impliqués dans la reproduction mais marquent la différence entre les sexes. Chez le garçon : pilosité, mue de la voix, développement musculaire. Chez la fille : développement des seins, pilosité, élargissement du bassin.</div>"
        },
        {
          "question": "2) Classer les transformations listées dans le document en deux catégories : caractères sexuels primaires et caractères sexuels secondaires.",
          "reponse": "<div><strong>Caractères sexuels primaires :</strong> Développement des testicules et du pénis (garçon).<br><br><strong>Caractères sexuels secondaires :</strong> Pilosité pubienne et faciale, mue de la voix, développement musculaire (garçon) ; développement des seins, pilosité pubienne, élargissement du bassin, apparition des règles (fille).</div>"
        },
        {
          "question": "3) Expliquer le rôle des hormones sexuelles dans l'apparition des caractères sexuels secondaires.",
          "reponse": "<div>Les caractères sexuels secondaires apparaissent sous l'action des hormones sexuelles. Chez le garçon, la testostérone produite par les testicules est responsable de la pilosité, de la mue de la voix et du développement musculaire. Chez la fille, les œstrogènes et la progestérone produits par les ovaires provoquent le développement des seins, l'élargissement du bassin et la régulation du cycle menstruel.</div>"
        },
        {
          "question": "4) Citer un trouble de la puberté et décrire ses manifestations.",
          "reponse": "<div><strong>Exemple :</strong> La puberté précoce se caractérise par l'apparition des caractères sexuels secondaires avant l'âge de 8 ans chez la fille et 9 ans chez le garçon. Elle peut être due à une production excessive d'hormones et entraîner une maturation osseuse accélérée, une taille adulte réduite et des difficultés psychologiques.<br><br><strong>Autre exemple :</strong> La puberté tardive se caractérise par l'absence de développement des caractères sexuels secondaires à l'âge de 13-14 ans chez la fille et 14-15 ans chez le garçon.</div>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Le SIDA et le VIH",
      "points": "5 pts",
      "enonce": "<div style='padding: 10px; font-size: 16px; line-height: 1.8;'><p>Le SIDA (Syndrome d'Immunodéficience Acquise) est une maladie infectieuse causée par le virus VIH (Virus de l'Immunodéficience Humaine).</p><div style='background-color: #ffebee; padding: 15px; border-radius: 8px; margin: 15px 0;'><p><strong>Document :</strong></p><p><em>\"Le VIH est un rétrovirus qui infecte et détruit les lymphocytes T CD4, cellules clés du système immunitaire. La destruction progressive de ces cellules entraîne une immunodéficience, rendant l'organisme vulnérable aux infections opportunistes.\"</em></p></div></div>",
      "questions": [
        {
          "question": "1) Définir le SIDA et préciser sa cause.",
          "reponse": "<div>Le SIDA (Syndrome d'Immunodéficience Acquise) est le stade avancé de l'infection par le VIH. Il se caractérise par un effondrement du système immunitaire, rendant l'organisme incapable de lutter contre les infections et certains cancers. La cause est le virus VIH qui détruit les lymphocytes T CD4.</div>"
        },
        {
          "question": "2) Énumérer les trois principaux modes de transmission du VIH.",
          "reponse": "<div>1) Transmission sexuelle (rapports non protégés).<br>2) Transmission sanguine (partage de seringues, transfusion de sang contaminé).<br>3) Transmission mère-enfant (pendant la grossesse, l'accouchement ou l'allaitement).</div>"
        },
        {
          "question": "3) Identifier deux comportements à risque pouvant favoriser la contamination par le VIH.",
          "reponse": "<div>1) Les rapports sexuels non protégés, notamment avec des partenaires multiples.<br>2) Le partage de matériel d'injection (seringues, aiguilles) entre usagers de drogues.</div>"
        },
        {
          "question": "4) Analyser les conséquences de la destruction des lymphocytes T CD4 sur l'organisme.",
          "reponse": "<div>La destruction des lymphocytes T CD4 affaiblit progressivement le système immunitaire. L'organisme devient alors incapable de se défendre contre les infections courantes (infections opportunistes) comme la tuberculose, les pneumonies ou certains cancers. Cette immunodéficience peut conduire au décès si l'infection n'est pas traitée.</div>"
        },
        {
          "question": "5) Décrire une manifestation du SIDA.",
          "reponse": "<div>Les manifestations du SIDA incluent :<br>- Une perte de poids importante (>10% du poids corporel).<br>- Des infections opportunistes récurrentes (pneumocystose, candidose, tuberculose).<br>- Des fièvres prolongées et des sueurs nocturnes.<br>- Une fatigue chronique et des diarrhées persistantes.</div>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Microbiologie et utilisation des micro-organismes",
      "points": "6 pts",
      "enonce": "<div style='padding: 10px; font-size: 16px; line-height: 1.8;'><p>Les micro-organismes sont des êtres vivants microscopiques présents dans notre environnement. Certains sont nuisibles, d'autres sont bénéfiques et utilisés en alimentation.</p><div style='background-color: #e8f5e9; padding: 15px; border-radius: 8px; margin: 15px 0;'><p><strong>Document 1 :</strong> Classification simplifiée des micro-organismes :</p><ul style='list-style-type: disc; padding-left: 20px;'><li><strong>Bactéries :</strong> procaryotes, unicellulaires.</li><li><strong>Champignons microscopiques (levures, moisissures) :</strong> eucaryotes, unicellulaires ou pluricellulaires.</li><li><strong>Virus :</strong> parasites intracellulaires obligatoires, non cellulaires.</li></ul><p><strong>Document 2 :</strong> Utilisation des micro-organismes en alimentation :</p><ul style='list-style-type: disc; padding-left: 20px;'><li>Fermentation lactique : yaourt, fromage.</li><li>Fermentation alcoolique : pain, vin, bière.</li><li>Fermentation acétique : vinaigre.</li></ul></div></div>",
      "questions": [
        {
          "question": "1) Classifier les micro-organismes suivants dans le tableau ci-dessous : <em>Escherichia coli</em>, <em>Saccharomyces cerevisiae</em>, VIH, <em>Penicillium</em>, <em>Lactobacillus bulgaricus</em>.",
          "reponse": "<div><table style='width: 100%; border-collapse: collapse; font-size: 15px;'><tr style='background-color: #4CAF50; color: white;'><th style='padding: 8px; border: 1px solid #ddd;'>Micro-organisme</th><th style='padding: 8px; border: 1px solid #ddd;'>Nature</th></tr><tr><td style='padding: 8px; border: 1px solid #ddd;'><em>Escherichia coli</em></td><td style='padding: 8px; border: 1px solid #ddd;'>Bactérie</td></tr><tr><td style='padding: 8px; border: 1px solid #ddd;'><em>Saccharomyces cerevisiae</em></td><td style='padding: 8px; border: 1px solid #ddd;'>Champignon microscopique (levure)</td></tr><tr><td style='padding: 8px; border: 1px solid #ddd;'>VIH</td><td style='padding: 8px; border: 1px solid #ddd;'>Virus</td></tr><tr><td style='padding: 8px; border: 1px solid #ddd;'><em>Penicillium</em></td><td style='padding: 8px; border: 1px solid #ddd;'>Champignon microscopique (moisissure)</td></tr><tr><td style='padding: 8px; border: 1px solid #ddd;'><em>Lactobacillus bulgaricus</em></td><td style='padding: 8px; border: 1px solid #ddd;'>Bactérie</td></tr></table></div>"
        },
        {
          "question": "2) Décrire la structure d'une bactérie (en citant au moins trois éléments).",
          "reponse": "<div>La bactérie est une cellule procaryote. Sa structure comprend :<br>1) Une paroi rigide qui protège la cellule.<br>2) Une membrane plasmique qui contrôle les échanges.<br>3) Un cytoplasme contenant le matériel génétique (ADN circulaire).<br>4) Parfois, des flagelles pour la locomotion.<br>5) Absence de noyau et d'organites membranaires.</div>"
        },
        {
          "question": "3) Expliquer le principe de la fermentation lactique en utilisant l'exemple du yaourt.",
          "reponse": "<div>La fermentation lactique est un processus métabolique par lequel des bactéries (comme <em>Lactobacillus bulgaricus</em> et <em>Streptococcus thermophilus</em>) transforment le lactose (sucre du lait) en acide lactique. Cet acide provoque la coagulation des protéines du lait, donnant au yaourt sa texture épaisse et son goût acidulé.</div>"
        },
        {
          "question": "4) Identifier le micro-organisme responsable de la fabrication du pain et préciser son rôle.",
          "reponse": "<div>Le micro-organisme responsable de la fabrication du pain est la levure <em>Saccharomyces cerevisiae</em>. Elle réalise la fermentation alcoolique en transformant les sucres de la farine en éthanol et en dioxyde de carbone (CO₂). Le CO₂ produit fait gonfler la pâte, ce qui donne au pain son aspect aéré.</div>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Les maladies nutritionnelles",
      "points": "4 pts",
      "enonce": "<div style='padding: 10px; font-size: 16px; line-height: 1.8;'><p>Les déséquilibres nutritionnels, qu'il s'agisse de carences ou d'excès, sont à l'origine de nombreuses maladies.</p><div style='background-color: #fff3e0; padding: 15px; border-radius: 8px; margin: 15px 0;'><p><strong>Document :</strong></p><ul style='list-style-type: disc; padding-left: 20px;'><li><strong>Hypovitaminoses :</strong> carences en vitamines.</li><li><strong>Rachitisme :</strong> déformation osseuse chez l'enfant.</li><li><strong>Anémie :</strong> fatigue, pâleur, essoufflement.</li><li><strong>Obésité :</strong> IMC > 30, risque cardiovasculaire.</li><li><strong>Diabète de type 2 :</strong> hyperglycémie chronique.</li><li><strong>Goitre :</strong> hypertrophie de la thyroïde.</li></ul></div></div>",
      "questions": [
        {
          "question": "1) Distinguer les maladies nutritionnelles de carence des maladies nutritionnelles par excès.",
          "reponse": "<div><strong>Maladies de carence :</strong> Résultent d'une insuffisance en nutriments essentiels. Exemples : hypovitaminoses, rachitisme, anémie, goitre.<br><br><strong>Maladies par excès :</strong> Résultent d'une consommation excessive de nutriments ou de substances toxiques. Exemples : obésité, diabète de type 2, tabac, alcoolisme.</div>"
        },
        {
          "question": "2) Associer chaque maladie du document à sa cause (carence ou excès).",
          "reponse": "<div><strong>Carence :</strong> Hypovitaminoses, Rachitisme, Anémie, Goitre.<br><strong>Excès :</strong> Obésité, Diabète de type 2.</div>"
        },
        {
          "question": "3) Expliquer le lien entre l'obésité et les maladies cardiovasculaires.",
          "reponse": "<div>L'obésité est un facteur de risque majeur des maladies cardiovasculaires. L'excès de graisse (notamment au niveau abdominal) est associé à une augmentation du cholestérol et des triglycérides dans le sang, à une hypertension artérielle et à une résistance à l'insuline. Ces troubles favorisent l'athérosclérose, l'hypertension et augmentent le risque d'infarctus et d'accident vasculaire cérébral.</div>"
        },
        {
          "question": "4) Décrire une maladie nutritionnelle de l'excès (autre que l'obésité et le diabète).",
          "reponse": "<div><strong>Exemple 1 : Alcoolisme</strong> - Maladie liée à une consommation excessive et chronique d'alcool. Elle provoque des lésions du foie (cirrhose), des troubles neurologiques, des carences nutritionnelles et des problèmes sociaux.<br><br><strong>Exemple 2 : Cancer</strong> - Certains cancers (comme ceux du tube digestif) sont liés à une alimentation déséquilibrée et à l'excès de substances cancérigènes.</div>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
