<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Présentation mobile</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' },
            options: { skipHtmlTypes: 'script' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 500px;
        margin: 0 auto;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    .slide-header {
        flex-shrink: 0;
        padding: 18px 16px 10px 16px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        z-index: 10;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .slide-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
    }

    .content-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 18px 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        flex-shrink: 0;
    }

    .content-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .content-card li {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        line-height: 1.5;
    }

    .content-card li:last-child {
        border-bottom: none;
    }

    .bullet-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
    }

    .math-block {
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        overflow-x: auto;
        flex-shrink: 0;
        margin: 4px 0;
    }

    .math-block .math {
        font-size: 1.2rem;
        color: #e2e8f0;
    }

    .note-box {
        background: rgba(96, 165, 250, 0.08);
        border-left: 4px solid #60a5fa;
        padding: 12px 16px;
        border-radius: 12px;
        font-style: italic;
        font-size: 0.9rem;
        color: #cbd5e1;
        flex-shrink: 0;
    }

    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        border-radius: 0;
        flex-direction: column;
    }

    .loading-card {
        background: #1e293b;
        padding: 32px 28px;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #334155;
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px auto;
    }

    .loading-text {
        font-weight: 600;
        font-size: 1.1rem;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    .loading-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 16px;
    }
    .loading-progress {
        height: 3px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        animation: loadingProgress 30s ease-out forwards;
    }

    .loading-timeout {
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 12px;
    }

    .btn-cancel-loading {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 40px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #f87171;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }

    .btn-cancel-loading:active {
        transform: scale(0.94);
        background: rgba(239, 68, 68, 0.25);
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
    }

    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .slide-counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255,255,255,0.05);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(255,255,255,0.04);
    }

    .status-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 30px;
        background: rgba(96, 165, 250, 0.12);
        color: #93bbfc;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
    }

    .status-badge .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: pulse-dot 1.2s infinite;
        flex-shrink: 0;
    }

    .status-badge.idle .dot {
        animation: none;
        background: #64748b;
    }
    .status-badge.speaking .dot {
        background: #34d399;
        animation: pulse-dot 0.8s infinite;
    }
    .status-badge.error .dot {
        background: #f87171;
        animation: none;
    }
    .status-badge.paused .dot {
        animation: none;
        background: #fbbf24;
    }
    .status-badge.waiting .dot {
        animation: pulse-dot 1.5s infinite;
        background: #fbbf24;
    }
    .status-badge.loading .dot {
        animation: pulse-dot 0.5s infinite;
        background: #60a5fa;
    }

    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.7); }
    }

    .footer-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(255,255,255,0.1);
    }

    .btn-secondary {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-play {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
        min-width: 80px;
        justify-content: center;
    }
    .btn-play:active {
        background: rgba(52, 211, 153, 0.25);
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
    }

    .auto-indicator {
        font-size: 0.65rem;
        color: #64748b;
        text-align: center;
        letter-spacing: 0.3px;
        padding: 2px 0;
    }

    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.2rem;
        }
        .content-card li {
            font-size: 0.9rem;
            padding: 8px 0;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .btn-play {
            min-width: 60px;
        }
        .footer-buttons {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
        .loading-card {
            padding: 20px 16px;
        }
        .math-block .math {
            font-size: 1rem;
        }
    }

    @media (min-width: 600px) {
        .app-container {
            max-width: 480px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
        .loading-overlay {
            border-radius: 32px;
        }
    }

    /* Mode jour (par défaut) */
    html, body {
        background: #f0f4f8 !important;
        color: #1a202c !important;
    }
    .app-container {
        background: linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%) !important;
    }
    .slide-header {
        background: rgba(255, 255, 255, 0.85) !important;
        border-bottom: 1px solid rgba(0,0,0,0.08) !important;
    }
    .slide-header h1 {
        background: linear-gradient(135deg, #2b6cb0, #6b46c1) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        background-clip: text !important;
    }
    .slide-footer {
        background: rgba(255, 255, 255, 0.9) !important;
        border-top: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card {
        background: rgba(255,255,255,0.8) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card li {
        border-bottom: 1px solid rgba(0,0,0,0.05) !important;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.12) !important;
        border-left: 4px solid #4299e1 !important;
        color: #2c3e50 !important;
    }
    .math-block {
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .math-block .math {
        color: #2d3748 !important;
    }
    .slide-counter {
        color: #4a5568 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .status-badge {
        background: rgba(96, 165, 250, 0.15) !important;
        color: #2b6cb0 !important;
        border: 1px solid rgba(96, 165, 250, 0.15) !important;
    }
    .btn {
        color: #2d3748 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .btn-secondary {
        background: rgba(0,0,0,0.04) !important;
        border-color: rgba(0,0,0,0.08) !important;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15) !important;
        border-color: rgba(52, 211, 153, 0.2) !important;
        color: #38a169 !important;
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15) !important;
        border-color: rgba(251, 191, 36, 0.2) !important;
        color: #d69e2e !important;
    }
    .auto-indicator {
        color: #718096 !important;
    }
    .loading-card {
        background: #ffffff !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .loading-text {
        color: #1a202c !important;
    }
    .loading-sub {
        color: #4a5568 !important;
    }
</style>
</head>
<body>

<div class="app-container">

    <header class="slide-header">
        <h1 id="slideTitle">Chargement...</h1>
    </header>

    <main class="slide-body" id="slideBody"></main>

    <!-- LOADING OVERLAY AVEC BOUTON ANNULER -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Préparation vocale...</div>
            <div class="loading-sub" id="loadingSub">Synthèse en cours</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loadingProgressBar"></div>
            </div>
            <div class="loading-timeout" id="loadingTimeout">⏱️ 30 secondes maximum</div>
            <button class="btn-cancel-loading" id="cancelLoadingBtn">
                <span>✕</span> Annuler
            </button>
        </div>
    </div>

    <footer class="slide-footer">
        <div class="footer-top">
            <span class="slide-counter" id="slideCounter">1 / 3</span>
            <span class="status-badge idle" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">Prêt</span>
            </span>
        </div>

        <div class="footer-buttons">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-secondary" id="replayBtn">
                <span class="btn-icon">🔁</span> <span class="btn-label">Relire</span>
            </button>
            <button class="btn btn-play" id="playBtn">
                <span class="btn-icon">▶</span> <span class="btn-label">Play</span>
            </button>
        </div>

        <div class="auto-indicator" id="autoIndicator">⏸ Lecture manuelle</div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // SLIDES
    // ================================================================
    const slides = [
  {
    "titre": "Équations et inéquations du premier degré",
    "contenu": "<div style='background-color: #E8EAF6; padding: 20px; border-radius: 10px; color: #1A237E;'><h3 style='margin-top: 0;'>Introduction</h3><p>Une <strong>équation du premier degré</strong> à une inconnue x est une équation de la forme :</p><div class='math-block'><div class='math'>$$ ax + b = 0 \\quad (a \\neq 0) $$</div></div><p>Une <strong>inéquation du premier degré</strong> est une inégalité de la forme :</p><div class='math-block'><div class='math'>$$ ax + b > 0 \\quad \\text{ou} \\quad ax + b < 0 \\quad (a \\neq 0) $$</div></div><ul style='text-align: left; list-style-type: disc; padding-left: 20px; font-size: 1rem;'><li><strong>Résoudre une équation</strong> : trouver toutes les valeurs de x qui rendent l'égalité vraie.</li><li><strong>Résoudre une inéquation</strong> : trouver toutes les valeurs de x qui rendent l'inégalité vraie (un intervalle).</li></ul></div><div style='background-color: #FFF3E0; padding: 15px; border-radius: 8px; margin-top: 10px; color: #E65100;'><h4 style='margin-top: 0;'>Objectifs</h4><p>Maîtriser les techniques de résolution, comprendre la notion d'équation équivalente, et savoir représenter les solutions sur une droite graduée.</p></div>",
    "texteParle": "Dans cette leçon, nous allons étudier les équations et inéquations du premier degré dans R. Une équation du premier degré à une inconnue x est une équation de la forme a x plus b égale 0, avec a différent de zéro. Une inéquation du premier degré est une inégalité de la forme a x plus b supérieur à 0, ou a x plus b inférieur à 0. Résoudre une équation, c'est trouver toutes les valeurs de x qui rendent l'égalité vraie. Résoudre une inéquation, c'est trouver toutes les valeurs de x qui rendent l'inégalité vraie, ce qui donne généralement un intervalle de solutions. L'objectif est de maîtriser les techniques de résolution, de comprendre la notion d'équation équivalente, et de savoir représenter les solutions sur une droite graduée.",
    "note": "Équation : ax + b = 0. Inéquation : ax + b > 0 ou ax + b < 0."
  },
  {
    "titre": "Rappels : équations équivalentes",
    "contenu": "<div style='background-color: #E3F2FD; padding: 20px; border-radius: 10px; color: #0D47A1;'><h3 style='margin-top: 0;'>Équations équivalentes</h3><p>Deux équations sont <strong>équivalentes</strong> si elles ont les mêmes solutions.</p><p>On peut transformer une équation en une équation équivalente en :</p><ul style='text-align: left; list-style-type: disc; padding-left: 20px; font-size: 1rem;'><li><strong>Ajoutant ou soustrayant</strong> le même nombre aux deux membres.</li><li><strong>Multipliant ou divisant</strong> les deux membres par le même nombre <strong>non nul</strong>.</li></ul></div><div style='background-color: #FFF3E0; padding: 15px; border-radius: 8px; margin-top: 10px; color: #E65100;'><h4 style='margin-top: 0;'>Exemples</h4><p><span class='math'>\\( x + 3 = 7 \\iff x + 3 - 3 = 7 - 3 \\iff x = 4 \\)</span></p><p><span class='math'>\\( 2x = 10 \\iff \\frac{2x}{2} = \\frac{10}{2} \\iff x = 5 \\)</span></p><p><span class='math'>\\( 3x - 5 = 7 \\iff 3x - 5 + 5 = 7 + 5 \\iff 3x = 12 \\iff x = 4 \\)</span></p></div><div style='background-color: #E8F5E9; padding: 15px; border-radius: 8px; margin-top: 10px; color: #1B5E20;'><h4 style='margin-top: 0;'>Attention</h4><p>Pour les inéquations, la multiplication ou division par un nombre <strong>négatif</strong> change le sens de l'inégalité.</p></div>",
    "texteParle": "Avant de résoudre des équations, rappelons la notion d'équations équivalentes. Deux équations sont équivalentes si elles ont les mêmes solutions. On peut transformer une équation en une équation équivalente en ajoutant ou soustrayant le même nombre aux deux membres, ou en multipliant ou divisant les deux membres par le même nombre non nul. Par exemple, x plus 3 égale 7 est équivalent à x plus 3 moins 3 égale 7 moins 3, soit x égale 4. De même, 2x égale 10 est équivalent à 2x sur 2 égale 10 sur 2, soit x égale 5. Attention : pour les inéquations, la multiplication ou la division par un nombre négatif change le sens de l'inégalité. C'est un point crucial à retenir.",
    "note": "On peut ajouter, soustraire, multiplier ou diviser par un même nombre non nul."
  },
  {
    "titre": "Résolution d'une équation du premier degré",
    "contenu": "<div style='background-color: #F3E5F5; padding: 20px; border-radius: 10px; color: #4A148C;'><h3 style='margin-top: 0;'>Méthode de résolution</h3><p>Pour résoudre <span class='math'>\\( ax + b = 0 \\)</span> :</p><ol style='text-align: left; padding-left: 20px; font-size: 1rem;'><li>Regrouper les termes en x d'un côté et les constantes de l'autre.</li><li>Simplifier chaque membre.</li><li>Diviser par le coefficient de x.</li></ol><div class='math-block'><div class='math'>$$ ax + b = 0 \\iff ax = -b \\iff x = -\\frac{b}{a} $$</div></div></div><div style='background-color: #FFF3E0; padding: 15px; border-radius: 8px; margin-top: 10px; color: #E65100;'><h4 style='margin-top: 0;'>Exemple 1</h4><p>Résoudre <span class='math'>\\( 3x - 5 = 7 \\)</span></p><p><span class='math'>\\( 3x - 5 + 5 = 7 + 5 \\)</span></p><p><span class='math'>\\( 3x = 12 \\)</span></p><p><span class='math'>\\( x = \\frac{12}{3} = 4 \\)</span></p><p><strong>Solution :</strong> <span class='math'>\\( S = \\{4\\} \\)</span></p></div><div style='background-color: #E8F5E9; padding: 15px; border-radius: 8px; margin-top: 10px; color: #1B5E20;'><h4 style='margin-top: 0;'>Exemple 2 (avec fractions)</h4><p>Résoudre <span class='math'>\\( \\frac{2x}{3} + 1 = \\frac{x}{2} - 2 \\)</span></p><p>On multiplie par 6 : <span class='math'>\\( 4x + 6 = 3x - 12 \\)</span></p><p><span class='math'>\\( 4x - 3x = -12 - 6 \\)</span></p><p><span class='math'>\\( x = -18 \\)</span></p><p><strong>Solution :</strong> <span class='math'>\\( S = \\{-18\\} \\)</span></p></div>",
    "texteParle": "Voyons maintenant la méthode de résolution d'une équation du premier degré. Pour résoudre a x plus b égale 0, on regroupe les termes en x d'un côté et les constantes de l'autre, on simplifie, puis on divise par le coefficient de x. La solution est x égale moins b sur a. Par exemple, pour résoudre 3x moins 5 égale 7, on ajoute 5 des deux côtés : 3x égale 12. Puis on divise par 3 : x égale 4. La solution est l'ensemble contenant 4. Autre exemple avec des fractions : 2x sur 3 plus 1 égale x sur 2 moins 2. On multiplie tout par 6 pour éliminer les dénominateurs : 4x plus 6 égale 3x moins 12. En regroupant, on obtient 4x moins 3x égale moins 12 moins 6, soit x égale moins 18. La solution est moins 18.",
    "note": "Toujours vérifier la solution en la remplaçant dans l'équation initiale."
  },

    "titre": "Cas particuliers des équations",
    "contenu": "<div style='background-color: #E0F7FA; padding: 20px; border-radius: 10px; color: #006064;'><h3 style='margin-top: 0;'>Équations sans solution ou avec une infinité de solutions</h3><p><strong>Cas 1 :</strong> <span class='math'>\\( 0x = b \\)</span> avec <span class='math'>\\( b \\neq 0 \\)</span></p><p>L'équation n'a <strong>pas de solution</strong> : <span class='math'>\\( S = \\varnothing \\)</span></p><p><strong>Cas 2 :</strong> <span class='math'>\\( 0x = 0 \\)</span></p><p>Tous les réels sont solutions : <span class='math'>\\( S = \\mathbb{R} \\)</span></p></div><div style='background-color: #FFF3E0; padding: 15px; border-radius: 8px; margin-top: 10px; color: #E65100;'><h4 style='margin-top: 0;'>Exemples</h4><p><strong>Exemple 1 :</strong> <span class='math'>\\( 2x + 3 = 2x + 5 \\)</span></p><p><span class='math'>\\( 2x - 2x = 5 - 3 \\iff 0 = 2 \\)</span> → impossible</p><p>Donc <span class='math'>\\( S = \\varnothing \\)</span></p><p><strong>Exemple 2 :</strong> <span class='math'>\\( 3(x + 1) = 3x + 3 \\)</span></p><p><span class='math'>\\( 3x + 3 = 3x + 3 \\iff 0 = 0 \\)</span> → toujours vrai</p><p>Donc <span class='math'>\\( S = \\mathbb{R} \\)</span></p></div><div style='background-color: #E8F5E9; padding: 15px; border-radius: 8px; margin-top: 10px; color: #1B5E20;'><h4 style='margin-top: 0;'>À retenir</h4><p>Une équation du premier degré a généralement une seule solution, mais peut aussi n'en avoir aucune ou une infinité.</p></div>",
    "texteParle": "Il existe des cas particuliers dans les équations du premier degré. Premier cas : si après simplification on obtient 0x égale b avec b non nul, alors l'équation n'a pas de solution. L'ensemble des solutions est vide. Par exemple, 2x plus 3 égale 2x plus 5 donne 0 égale 2, ce qui est impossible. Deuxième cas : si on obtient 0x égale 0, alors tous les réels sont solutions. L'ensemble des solutions est R tout entier. Par exemple, 3 fois x plus 1 égale 3x plus 3 donne 0 égale 0, ce qui est toujours vrai. En général, une équation du premier degré a une seule solution, mais elle peut aussi n'en avoir aucune ou une infinité.",
    "note": "0x = b (b ≠ 0) → pas de solution. 0x = 0 → infinité de solutions."

    "titre": "Résolution d'une inéquation du premier degré",
    "contenu": "<div style='background-color: #E3F2FD; padding: 20px; border-radius: 10px; color: #0D47A1;'><h3 style='margin-top: 0;'>Méthode de résolution</h3><p>Pour résoudre <span class='math'>\\( ax + b > 0 \\)</span> (ou <, ≥, ≤) :</p><ol style='text-align: left; padding-left: 20px; font-size: 1rem;'><li>Regrouper les termes en x d'un côté et les constantes de l'autre.</li><li>Simplifier.</li><li><strong>Diviser par le coefficient de x</strong> en faisant attention au signe.</li></ol><p><strong>Règle cruciale :</strong> si on multiplie ou divise par un nombre <strong>négatif</strong>, le sens de l'inégalité <strong>change</strong>.</p></div><div style='background-color: #FFF3E0; padding: 15px; border-radius: 8px; margin-top: 10px; color: #E65100;'><h4 style='margin-top: 0;'>Exemple 1 (coefficient positif)</h4><p>Résoudre <span class='math'>\\( 3x - 5 > 7 \\)</span></p><p><span class='math'>\\( 3x > 12 \\iff x > 4 \\)</span></p><p><strong>Solution :</strong> <span class='math'>\\( S = ]4, +\\infty[ \\)</span></p></div><div style='background-color: #FCE4EC; padding: 15px; border-radius: 8px; margin-top: 10px; color: #880E4F;'><h4 style='margin-top: 0;'>Exemple 2 (coefficient négatif)</h4><p>Résoudre <span class='math'>\\( -2x + 3 \\le 7 \\)</span></p><p><span class='math'>\\( -2x \\le 4 \\)</span></p><p>On divise par −2 : <span class='math'>\\( x \\ge -2 \\)</span> (changement de sens !)</p><p><strong>Solution :</strong> <span class='math'>\\( S = [-2, +\\infty[ \\)</span></p></div>",
    "texteParle": "Passons aux inéquations du premier degré. La méthode est similaire à celle des équations : on regroupe les termes en x d'un côté et les constantes de l'autre, on simplifie, puis on divise par le coefficient de x. Mais attention : si on multiplie ou divise par un nombre négatif, le sens de l'inégalité change. Par exemple, pour résoudre 3x moins 5 supérieur à 7, on ajoute 5 : 3x supérieur à 12. On divise par 3, qui est positif, donc le sens ne change pas : x supérieur à 4. La solution est l'intervalle ouvert de 4 à plus l'infini. Autre exemple : moins 2x plus 3 inférieur ou égal à 7. On soustrait 3 : moins 2x inférieur ou égal à 4. On divise par moins 2, qui est négatif, donc le sens change : x supérieur ou égal à moins 2. La solution est l'intervalle fermé de moins 2 à plus l'infini.",

    "contenu": "<div style='background-color: #F3E5F5; padding: 20px; border-radius: 10px; color: #4A148C;'><h3 style='margin-top: 0;'>Représentation graphique</h3><p>On représente les solutions sur une droite graduée :</p><ul style='text-align: left; list-style-type: disc; padding-left: 20px; font-size: 1rem;'><li><strong>Crochet fermé</strong> [ ou ] : la borne est incluse (≤ ou ≥).</li><li><strong>Crochet ouvert</strong> ] ou [ : la borne est exclue (< ou >).</li><li><strong>Hachures</strong> : on hachure la partie qui ne convient pas.</li></ul></div><div style='background-color: #FFF3E0; padding: 15px; border-radius: 8px; margin-top: 10px; color: #E65100;'><h4 style='margin-top: 0;'>Exemples</h4><p><span class='math'>\\( x > 4 \\)</span> → <span class='math'>\\( ]4, +\\infty[ \\)</span> : crochet ouvert en 4, vers la droite</p><p><span class='math'>\\( x \\ge -2 \\)</span> → <span class='math'>\\( [-2, +\\infty[ \\)</span> : crochet fermé en −2, vers la droite</p><p><span class='math'>\\( x < 3 \\)</span> → <span class='math'>\\( ]-\\infty, 3[ \\)</span> : crochet ouvert en 3, vers la gauche</p><p><span class='math'>\\( x \\le 1 \\)</span> → <span class='math'>\\( ]-\\infty, 1] \\)</span> : crochet fermé en 1, vers la gauche</p></div><div style='background-color: #E8F5E9; padding: 15px; border-radius: 8px; margin-top: 10px; color: #1B5E20;'><h4 style='margin-top: 0;'>Intervalle borné</h4><p><span class='math'>\\( -1 < x \\le 3 \\)</span> → <span class='math'>\\( ]-1, 3] \\)</span> : crochet ouvert en −1, fermé en 3</p></div>",
    "texteParle": "Les solutions d'une inéquation se représentent sur une droite graduée. On utilise des crochets : un crochet fermé signifie que la borne est incluse, ce qui correspond à inférieur ou égal ou supérieur ou égal. Un crochet ouvert signifie que la borne est exclue, ce qui correspond à strictement inférieur ou strictement supérieur. Par exemple, x supérieur à 4 se représente par l'intervalle ouvert de 4 à plus l'infini, avec un crochet ouvert en 4. x supérieur ou égal à moins 2 se représente par l'intervalle fermé de moins 2 à plus l'infini, avec un crochet fermé en moins 2. x inférieur à 3 se représente par l'intervalle ouvert de moins l'infini à 3. x inférieur ou égal à 1 se représente par l'intervalle de moins l'infini à 1, avec un crochet fermé en 1. Pour un intervalle borné comme moins 1 inférieur à x inférieur ou égal à 3, on a un crochet ouvert en moins 1 et un crochet fermé en 3.",

    "texteParle": "Voyons comment résoudre des inéquations avec des fractions. La méthode consiste à multiplier les deux membres par le PPCM des dénominateurs, qui est un nombre positif, donc le sens de l'inégalité ne change pas à cette étape. Par exemple, pour résoudre 2x sur 3 plus 1 supérieur à x sur 2 moins 2. Le PPCM de 3 et 2 est 6. On multiplie tout par 6 : 4x plus 6 supérieur à 3x moins 12. En regroupant, on obtient x supérieur à moins 18. La solution est l'intervalle ouvert de moins 18 à plus l'infini. Autre exemple : x moins 1 sur 2 moins 2x plus 1 sur 3 inférieur ou égal à 1. Le PPCM de 2 et 3 est 6. On multiplie par 6 : 3 fois x moins 1 moins 2 fois 2x plus 1 inférieur ou égal à 6. En développant, on obtient 3x moins 3 moins 4x moins 2 inférieur ou égal à 6, soit moins x moins 5 inférieur ou égal à 6. Donc moins x inférieur ou égal à 11. En divisant par moins 1, le sens change : x supérieur ou égal à moins 11. La solution est l'intervalle fermé de moins 11 à plus l'infini.",

    "texteParle": "Pour les inéquations produit et quotient, on utilise un tableau de signes. Par exemple, pour résoudre x moins 2 fois x plus 3 supérieur à 0, on cherche les valeurs qui annulent chaque facteur : x égale 2 et x égale moins 3. On construit un tableau de signes avec ces valeurs. Le facteur x moins 2 est négatif avant 2 et positif après. Le facteur x plus 3 est négatif avant moins 3 et positif après. Le produit est positif quand les deux facteurs sont de même signe, c'est-à-dire sur les intervalles moins l'infini à moins 3 et 2 à plus l'infini. La solution est la réunion de ces deux intervalles. Pour les inéquations quotient, la méthode est similaire, mais il faut exclure les valeurs qui annulent le dénominateur.",

    "titre": "Problèmes concrets",
    "contenu": "<div style='background-color: #E3F2FD; padding: 20px; border-radius: 10px; color: #0D47A1;'><h3 style='margin-top: 0;'>Mise en équation ou en inéquation</h3><p><strong>Méthode :</strong></p><ol style='text-align: left; padding-left: 20px; font-size: 1rem;'><li>Choisir l'inconnue x et préciser ce qu'elle représente.</li><li>Traduire l'énoncé en équation ou inéquation.</li><li>Résoudre.</li><li>Vérifier la cohérence du résultat avec le contexte.</li></ol></div><div style='background-color: #FFF3E0; padding: 15px; border-radius: 8px; margin-top: 10px; color: #E65100;'><h4 style='margin-top: 0;'>Exemple 1</h4><p>Un rectangle a un périmètre de 36 cm. Sa longueur mesure 4 cm de plus que sa largeur. Quelles sont ses dimensions ?</p><p>Soit x la largeur. La longueur est x + 4.</p><p>Périmètre : <span class='math'>\\( 2(x + x + 4) = 36 \\)</span></p><p><span class='math'>\\( 2(2x + 4) = 36 \\iff 4x + 8 = 36 \\iff 4x = 28 \\iff x = 7 \\)</span></p><p>Largeur = 7 cm, longueur = 11 cm.</p></div><div style='background-color: #E8F5E9; padding: 15px; border-radius: 8px; margin-top: 10px; color: #1B5E20;'><h4 style='margin-top: 0;'>Exemple 2 (inéquation)</h4><p>Un abonnement coûte 15 € par mois plus 0,50 € par film. Un autre coûte 25 € par mois sans limite. À partir de combien de films le second est-il plus avantageux ?</p><p><span class='math'>\\( 15 + 0,5x > 25 \\iff 0,5x > 10 \\iff x > 20 \\)</span></p><p>À partir de 21 films, le second abonnement est plus avantageux.</p></div>",
    "texteParle": "Terminons par des problèmes concrets. La méthode consiste à choisir l'inconnue x, traduire l'énoncé en équation ou inéquation, résoudre, puis vérifier la cohérence du résultat. Premier exemple : un rectangle a un périmètre de 36 cm. Sa longueur mesure 4 cm de plus que sa largeur. Soit x la largeur. La longueur est x plus 4. Le périmètre est 2 fois x plus x plus 4, soit 36. On résout : 2 fois 2x plus 4 égale 36, donc 4x plus 8 égale 36, donc 4x égale 28, donc x égale 7. La largeur est 7 cm et la longueur est 11 cm. Deuxième exemple avec une inéquation : un abonnement coûte 15 euros par mois plus 0,50 euro par film. Un autre coûte 25 euros par mois sans limite. On cherche à partir de combien de films le second est plus avantageux. On résout 15 plus 0,5x supérieur à 25, ce qui donne 0,5x supérieur à 10, donc x supérieur à 20. À partir de 21 films, le second abonnement est plus avantageux.",

    "texteParle": "Pour conclure cette leçon sur les équations et inéquations du premier degré, retenons les points essentiels. Une équation a x plus b égale 0 a pour solution x égale moins b sur a, avec a différent de zéro. Les cas particuliers sont : pas de solution si 0x égale b avec b non nul, et une infinité de solutions si 0x égale 0. Pour les inéquations, la méthode est similaire, mais attention : la division par un nombre négatif change le sens de l'inégalité. La représentation des solutions utilise des crochets fermés pour les bornes incluses et des crochets ouverts pour les bornes exclues. Pour les fractions, on multiplie par le PPCM, qui est positif. Pour les inéquations produit ou quotient, on utilise un tableau de signes. Enfin, pour les problèmes concrets, on choisit l'inconnue, on traduit l'énoncé, on résout et on vérifie la cohérence du résultat. Ces techniques sont fondamentales en algèbre et en sciences.",

    let currentIndex = 0;
    let isSpeaking = false;
    let isPaused = false;
    let currentUtterance = null;
    let isLoading = false;

    // Références jQuery
    const $title = $('#slideTitle');
    const $body = $('#slideBody');
    const $counter = $('#slideCounter');
    const $statusText = $('#statusText');
    const $statusBadge = $('#statusBadge');
    const $loading = $('#loadingOverlay');
    const $loadingText = $('#loadingText');
    const $loadingSub = $('#loadingSub');
    const $loadingTimeout = $('#loadingTimeout');
    const $loadingProgressBar = $('#loadingProgressBar');

    const $replay = $('#replayBtn');
    const $play = $('#playBtn');
    const $cancelLoading = $('#cancelLoadingBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function setStatus(text, type) {
        $statusText.text(text);
        $statusBadge.removeClass('idle speaking error paused waiting loading');
        if (type === 'speaking') $statusBadge.addClass('speaking');
        else if (type === 'error') $statusBadge.addClass('error');
        else if (type === 'paused') $statusBadge.addClass('paused');
        else if (type === 'waiting') $statusBadge.addClass('waiting');
        else if (type === 'loading') $statusBadge.addClass('loading');
        else $statusBadge.addClass('idle');
    }

    function updatePlayButton() {
        if (isPlaying) {
            $play.addClass('playing');
            $play.find('.btn-icon').text('⏸');
            $play.find('.btn-label').text('Pause');
        } else {
            $play.removeClass('playing');
            $play.find('.btn-icon').text('▶');
            $play.find('.btn-label').text('Play');
        }
    }

    function showLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        
        loadingCancelled = false;
        isLoading = true;
        
        // Réinitialiser la barre de progression
        $loadingProgressBar.css('animation', 'none');
        $loadingProgressBar.css('width', '0%');
        // Forcer un reflow
        $loadingProgressBar[0].offsetHeight;
        $loadingProgressBar.css('animation', 'loadingProgress 30s ease-out forwards');
        
        $loadingText.text('Préparation vocale...');
        $loadingSub.text('Synthèse en cours');
        $loadingTimeout.text('⏱️ 30 secondes maximum');
        $loading.fadeIn(300);
        setStatus("⏳ Chargement...", 'loading');
        
        // 🔥 TIMEOUT DE 30 SECONDES
        loadingTimeout = setTimeout(() => {
            if (isLoading && !loadingCancelled) {
                hideLoading();
                setStatus("⚠️ Délai dépassé (30s)", 'error');
                isPlaying = false;
                updatePlayButton();
                $loadingSub.text('La synthèse vocale a pris trop de temps');
                $loadingTimeout.text('❌ Délai dépassé');
            }
        }, 30000);
    }

    function hideLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        isLoading = false;
        loadingCancelled = false;
        $loading.fadeOut(300);
        // Ne pas changer le statut si on est en train de parler
        if (!isSpeaking && !isPlaying) {
            setStatus("⏸ Lecture arrêtée", 'paused');
        }
    }

    function cancelLoading() {
        loadingCancelled = true;
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        hideLoading();
        stopSpeaking();
        setStatus("⏸ Annulé", 'paused');
        isPlaying = false;
        updatePlayButton();
        $loadingText.text('Annulé par l\'utilisateur');
        $loadingSub.text('Vous pouvez réessayer');
        $loadingTimeout.text('✕ Annulation');
    }

    // Arrêter la parole proprement
    function stopSpeaking() {
        try {
            if (synth && (synth.speaking || synth.pending)) {
                synth.cancel();
            }
        } catch(e) {
            console.warn('Erreur stopSpeaking:', e);
        }
        if (currentUtterance) {
            try {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance.onstart = null;
            } catch(e) {}
            currentUtterance = null;
        }
        isSpeaking = false;
        isPlaying = false;
        updatePlayButton();
    }

    // Mettre en pause la parole
    function pauseSpeaking() {
        try {
            if (synth && synth.speaking) {
                synth.pause();
                isPaused = true;
                isPlaying = false;
                setStatus("⏸ Lecture en pause", 'paused');
                updatePlayButton();
            }
        } catch(e) {
            console.warn('Erreur pauseSpeaking:', e);
            stopSpeaking();
        }
    }

    // Reprendre la parole
    function resumeSpeaking() {
        try {
            if (synth && synth.paused) {
                synth.resume();
                isPaused = false;
                isPlaying = true;
                setStatus("🔊 Lecture en cours", 'speaking');
                updatePlayButton();
            } else if (!isSpeaking && !synth.speaking && !synth.pending) {
                speakSlide(currentIndex);
            }
        } catch(e) {
            console.warn('Erreur resumeSpeaking:', e);
            speakSlide(currentIndex);
        }
    }

    function renderSlide(index) {
        const slide = slides[index];
        $title.text(slide.titre);

        let html = '';
        html += `<div class="content-card">${slide.contenu}</div>`;
        if (slide.note) {
            html += `<div class="note-box">${slide.note}</div>`;
        }
        $body.html(html);
        $counter.text(`${index+1} / ${total}`);

        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
        }
    }

    // ================================================================
    // LECTURE VOCALE
    // ================================================================
    function speakSlide(index) {
        return new Promise((resolve) => {
            const slide = slides[index];
            const text = slide.texteParle;
            
            if (!text || text.trim() === '' || !speechSupported) {
                resolve();
                return;
            }

            if (!window.speechSynthesis) {
                setStatus("❌ Synthèse vocale non supportée", 'error');
                speechSupported = false;
                resolve();
                return;
            }

            // Arrêter toute lecture en cours
            stopSpeaking();
            
            // Réinitialiser l'état de pause
            isPaused = false;
            
            showLoading();
            setStatus("Initialisation...", 'loading');

            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.92;
                utterance.pitch = 1.05;
                utterance.volume = 1;

                let isFinished = false;
                let errorHandled = false;

                utterance.onstart = function() {
                    if (loadingCancelled) {
                        stopSpeaking();
                        resolve();
                        return;
                    }
                    hideLoading();
                    isSpeaking = true;
                    isPlaying = true;
                    isPaused = false;
                    setStatus("🔊 Lecture en cours", 'speaking');
                    updatePlayButton();
                };

                utterance.onend = function() {
                    if (isFinished) return;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    setStatus("✅ Terminé", 'idle');
                    hideLoading();
                    updatePlayButton();
                    resolve();
                };

                utterance.onerror = function(e) {
                    if (isFinished || errorHandled) return;
                    errorHandled = true;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    hideLoading();
                    updatePlayButton();
                    
                    if (e.error === 'not-allowed') {
                        setStatus("⚠️ Permission refusée", 'error');
                    } else if (e.error === 'synthesis-unavailable') {
                        setStatus("⚠️ Synthèse indisponible", 'error');
                    } else if (e.error === 'canceled') {
                        setStatus("⏸ Annulé", 'paused');
                    } else {
                        setStatus("❌ Erreur audio: " + (e.error || 'inconnue'), 'error');
                    }
                    
                    resolve();
                };

                // Gestion du chargement des voix
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = function() {
                        if (!loadingCancelled) {
                            try {
                                synth.speak(utterance);
                            } catch(err) {
                                // Silencieux
                            }
                        }
                        synth.onvoiceschanged = null;
                    };
                }

                currentUtterance = utterance;
                
                if (!loadingCancelled) {
                    try {
                        synth.speak(utterance);
                    } catch(err) {
                        setTimeout(() => {
                            if (!loadingCancelled) {
                                try {
                                    synth.speak(utterance);
                                } catch(e) {
                                    setStatus("❌ Erreur de lecture", 'error');
                                    isPlaying = false;
                                    updatePlayButton();
                                    hideLoading();
                                    resolve();
                                }
                            } else {
                                resolve();
                            }
                        }, 100);
                    }
                } else {
                    resolve();
                }

            } catch(err) {
                hideLoading();
                setStatus("❌ Erreur générale", 'error');
                isPlaying = false;
                updatePlayButton();
                console.error('Erreur speakSlide:', err);
                resolve();
            }
        });
    }

    // ================================================================
    // NAVIGATION
    // ================================================================
    async function goToSlide(index) {
        if (isTransitioning) return;
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        
        // Si on est en train de lire, on met en pause avant de naviguer
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        // Arrêter complètement la lecture
        stopSpeaking();
        
        await new Promise(r => setTimeout(r, 50));
        
        if (index === currentIndex) {
            setStatus("📄 Slide actuel", 'idle');
            return;
        }

        isTransitioning = true;
        currentIndex = index;
        renderSlide(index);
        
        // Réinitialiser l'état de lecture
        isPlaying = false;
        updatePlayButton();
        setStatus("⏸ Lecture arrêtée", 'paused');

        await new Promise(r => setTimeout(r, 150));
        isTransitioning = false;
    }

    async function goToNext() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex + 1 < total) {
            await goToSlide(currentIndex + 1);
        } else {
            setStatus("🏁 Dernier slide", 'idle');
        }
    }

    async function goToPrev() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex - 1 >= 0) {
            await goToSlide(currentIndex - 1);
        } else {
            setStatus("🔁 Premier slide", 'idle');
        }
    }

    // ================================================================
    // GESTION PLAY/PAUSE
    // ================================================================
    function togglePlay() {
        if (!userInteracted) {
            userInteracted = true;
        }

        // Si le chargement est en cours, on l'annule
        if (isLoading) {
            cancelLoading();
            return;
        }

        // Si le synthétiseur est en pause, on reprend
        if (synth && synth.paused) {
            resumeSpeaking();
            return;
        }

        // Si la lecture est en cours, on met en pause
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
            return;
        }

        // Sinon, on démarre la lecture du slide courant
        if (!isSpeaking && !isPlaying) {
            stopSpeaking();
            speakSlide(currentIndex);
        }
    }

    // ================================================================
    // INIT
    // ================================================================
    async function init() {
        // Vérifier la compatibilité
        if (!window.speechSynthesis) {
            setStatus("❌ Synthèse vocale non supportée", 'error');
            speechSupported = false;
        }

        // Précharger les voix
        try {
            if (synth.getVoices) {
                synth.getVoices();
                setTimeout(() => {
                    try {
                        synth.getVoices();
                    } catch(e) {}
                }, 200);
            }
        } catch(e) {
            console.warn('Erreur chargement voix:', e);
        }

        // Afficher le premier slide
        renderSlide(0);
        $counter.text(`1 / ${total}`);
        
        // État initial
        setStatus("⏸ Appuie sur Play", 'paused');
        updatePlayButton();
        $autoIndicator.text('⏸ Lecture manuelle');

        // ================================================================
        // ÉVÉNEMENTS
        // ================================================================
        
        // Bouton Play/Pause
        $play.on('click', function() {
            togglePlay();
        });

        // Bouton Annuler le chargement
        $cancelLoading.on('click', function() {
            cancelLoading();
        });

        // Navigation
        $prev.on('click', function() {
            // Si chargement en cours, on annule
            if (isLoading) cancelLoading();
            goToPrev();
        });

        $next.on('click', function() {
            if (isLoading) cancelLoading();
            goToNext();
        });

        // Replay - relire le slide courant
        $replay.on('click', function() {
            if (isLoading) cancelLoading();
            stopSpeaking();
            setTimeout(() => {
                speakSlide(currentIndex);
            }, 100);
        });

        // Support du clavier (espace pour play/pause)
        $(document).on('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });

        // Nettoyage
        $(window).on('beforeunload', function() {
            try {
                if (synth.speaking) synth.cancel();
            } catch(e) {}
            hideLoading();
        });

        // Gérer les cas où la synthèse se termine de manière inattendue
        setInterval(() => {
            if (isPlaying && !synth.speaking && !synth.pending && !isPaused && !isLoading) {
                isPlaying = false;
                updatePlayButton();
                setStatus("⏸ Lecture arrêtée", 'paused');
            }
        }, 1000);
    }

    init();
});



    // ================================================================
    // GESTION DU THÈME JOUR/NUIT
    // ================================================================
    let isDarkMode = false;

    function toggleTheme() {
        isDarkMode = !isDarkMode;
        const body = document.body;
        const appContainer = document.querySelector('.app-container');
        const header = document.querySelector('.slide-header');
        const footer = document.querySelector('.slide-footer');
        const contentCards = document.querySelectorAll('.content-card');
        const noteBoxes = document.querySelectorAll('.note-box');
        const mathBlocks = document.querySelectorAll('.math-block');
        const buttons = document.querySelectorAll('.btn');
        const statusBadge = document.querySelector('.status-badge');
        const slideCounter = document.querySelector('.slide-counter');
        const autoIndicator = document.querySelector('.auto-indicator');
        const themeBtn = document.getElementById('themeToggle');

        if (isDarkMode) {
            // Mode nuit
            body.style.background = '#0b1120';
            body.style.color = '#f1f5f9';
            appContainer.style.background = 'linear-gradient(145deg, #0f172a 0%, #1e293b 100%)';
            header.style.background = 'rgba(15, 23, 42, 0.85)';
            footer.style.background = 'rgba(15, 23, 42, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.05)';
                card.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.08)';
                note.style.color = '#cbd5e1';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.25)';
                block.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#e2e8f0';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.12)';
                statusBadge.style.color = '#93bbfc';
            }
            if (slideCounter) {
                slideCounter.style.color = '#94a3b8';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#64748b';
            }
            if (themeBtn) {
                themeBtn.textContent = '☀️';
                themeBtn.title = 'Passer en mode jour';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#e2e8f0';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#e2e8f0';
                }
            });
        } else {
            // Mode jour (par défaut)
            body.style.background = '#f0f4f8';
            body.style.color = '#1a202c';
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
            header.style.background = 'rgba(255, 255, 255, 0.85)';
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.8)';
                card.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.12)';
                note.style.color = '#2c3e50';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.05)';
                block.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#2d3748';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
                statusBadge.style.color = '#2b6cb0';
            }
            if (slideCounter) {
                slideCounter.style.color = '#4a5568';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#718096';
            }
            if (themeBtn) {
                themeBtn.textContent = '🌓';
                themeBtn.title = 'Passer en mode nuit';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#2c3e50';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#2d3748';
                }
            });
        }
    }

    // Initialiser en mode jour
    document.addEventListener('DOMContentLoaded', function() {
        // Appliquer le mode jour par défaut
        const body = document.body;
        body.style.background = '#f0f4f8';
        body.style.color = '#1a202c';
        
        const appContainer = document.querySelector('.app-container');
        if (appContainer) {
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
        }
        
        const header = document.querySelector('.slide-header');
        if (header) {
            header.style.background = 'rgba(255, 255, 255, 0.85)';
        }
        
        const footer = document.querySelector('.slide-footer');
        if (footer) {
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
        }
        
        document.querySelectorAll('.content-card').forEach(card => {
            card.style.background = 'rgba(255,255,255,0.8)';
            card.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.note-box').forEach(note => {
            note.style.background = 'rgba(96, 165, 250, 0.12)';
            note.style.color = '#2c3e50';
        });
        
        document.querySelectorAll('.math-block').forEach(block => {
            block.style.background = 'rgba(0,0,0,0.05)';
            block.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.btn').forEach(btn => {
            btn.style.color = '#2d3748';
        });
        
        const statusBadge = document.querySelector('.status-badge');
        if (statusBadge) {
            statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
            statusBadge.style.color = '#2b6cb0';
        }
        
        const slideCounter = document.querySelector('.slide-counter');
        if (slideCounter) {
            slideCounter.style.color = '#4a5568';
        }
        
        const autoIndicator = document.querySelector('.auto-indicator');
        if (autoIndicator) {
            autoIndicator.style.color = '#718096';
        }
        
        document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
            if (!el.closest('.note-box')) {
                el.style.color = '#2c3e50';
            }
        });
        
        document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
            if (!el.closest('.note-box') && !el.closest('.math-block')) {
                el.style.color = '#2d3748';
            }
        });
        
        const themeBtn = document.getElementById('themeToggle');
        if (themeBtn) {
            themeBtn.textContent = '🌓';
            themeBtn.title = 'Passer en mode nuit';
        }
    });
</script>
