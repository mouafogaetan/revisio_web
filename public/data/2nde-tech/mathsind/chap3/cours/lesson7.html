<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Présentation mobile</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' },
            options: { skipHtmlTypes: 'script' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 500px;
        margin: 0 auto;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    .slide-header {
        flex-shrink: 0;
        padding: 18px 16px 10px 16px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        z-index: 10;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .slide-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
    }

    .content-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 18px 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        flex-shrink: 0;
    }

    .content-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .content-card li {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        line-height: 1.5;
    }

    .content-card li:last-child {
        border-bottom: none;
    }

    .bullet-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
    }

    .math-block {
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        overflow-x: auto;
        flex-shrink: 0;
        margin: 4px 0;
    }

    .math-block .math {
        font-size: 1.2rem;
        color: #e2e8f0;
    }

    .note-box {
        background: rgba(96, 165, 250, 0.08);
        border-left: 4px solid #60a5fa;
        padding: 12px 16px;
        border-radius: 12px;
        font-style: italic;
        font-size: 0.9rem;
        color: #cbd5e1;
        flex-shrink: 0;
    }

    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        border-radius: 0;
        flex-direction: column;
    }

    .loading-card {
        background: #1e293b;
        padding: 32px 28px;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #334155;
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px auto;
    }

    .loading-text {
        font-weight: 600;
        font-size: 1.1rem;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    .loading-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 16px;
    }
    .loading-progress {
        height: 3px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        animation: loadingProgress 30s ease-out forwards;
    }

    .loading-timeout {
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 12px;
    }

    .btn-cancel-loading {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 40px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #f87171;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }

    .btn-cancel-loading:active {
        transform: scale(0.94);
        background: rgba(239, 68, 68, 0.25);
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
    }

    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .slide-counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255,255,255,0.05);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(255,255,255,0.04);
    }

    .status-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 30px;
        background: rgba(96, 165, 250, 0.12);
        color: #93bbfc;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
    }

    .status-badge .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: pulse-dot 1.2s infinite;
        flex-shrink: 0;
    }

    .status-badge.idle .dot {
        animation: none;
        background: #64748b;
    }
    .status-badge.speaking .dot {
        background: #34d399;
        animation: pulse-dot 0.8s infinite;
    }
    .status-badge.error .dot {
        background: #f87171;
        animation: none;
    }
    .status-badge.paused .dot {
        animation: none;
        background: #fbbf24;
    }
    .status-badge.waiting .dot {
        animation: pulse-dot 1.5s infinite;
        background: #fbbf24;
    }
    .status-badge.loading .dot {
        animation: pulse-dot 0.5s infinite;
        background: #60a5fa;
    }

    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.7); }
    }

    .footer-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(255,255,255,0.1);
    }

    .btn-secondary {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-play {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
        min-width: 80px;
        justify-content: center;
    }
    .btn-play:active {
        background: rgba(52, 211, 153, 0.25);
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
    }

    .auto-indicator {
        font-size: 0.65rem;
        color: #64748b;
        text-align: center;
        letter-spacing: 0.3px;
        padding: 2px 0;
    }

    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.2rem;
        }
        .content-card li {
            font-size: 0.9rem;
            padding: 8px 0;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .btn-play {
            min-width: 60px;
        }
        .footer-buttons {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
        .loading-card {
            padding: 20px 16px;
        }
        .math-block .math {
            font-size: 1rem;
        }
    }

    @media (min-width: 600px) {
        .app-container {
            max-width: 480px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
        .loading-overlay {
            border-radius: 32px;
        }
    }

    /* Mode jour (par défaut) */
    html, body {
        background: #f0f4f8 !important;
        color: #1a202c !important;
    }
    .app-container {
        background: linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%) !important;
    }
    .slide-header {
        background: rgba(255, 255, 255, 0.85) !important;
        border-bottom: 1px solid rgba(0,0,0,0.08) !important;
    }
    .slide-header h1 {
        background: linear-gradient(135deg, #2b6cb0, #6b46c1) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        background-clip: text !important;
    }
    .slide-footer {
        background: rgba(255, 255, 255, 0.9) !important;
        border-top: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card {
        background: rgba(255,255,255,0.8) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card li {
        border-bottom: 1px solid rgba(0,0,0,0.05) !important;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.12) !important;
        border-left: 4px solid #4299e1 !important;
        color: #2c3e50 !important;
    }
    .math-block {
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .math-block .math {
        color: #2d3748 !important;
    }
    .slide-counter {
        color: #4a5568 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .status-badge {
        background: rgba(96, 165, 250, 0.15) !important;
        color: #2b6cb0 !important;
        border: 1px solid rgba(96, 165, 250, 0.15) !important;
    }
    .btn {
        color: #2d3748 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .btn-secondary {
        background: rgba(0,0,0,0.04) !important;
        border-color: rgba(0,0,0,0.08) !important;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15) !important;
        border-color: rgba(52, 211, 153, 0.2) !important;
        color: #38a169 !important;
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15) !important;
        border-color: rgba(251, 191, 36, 0.2) !important;
        color: #d69e2e !important;
    }
    .auto-indicator {
        color: #718096 !important;
    }
    .loading-card {
        background: #ffffff !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .loading-text {
        color: #1a202c !important;
    }
    .loading-sub {
        color: #4a5568 !important;
    }
</style>
</head>
<body>

<div class="app-container">

    <header class="slide-header">
        <h1 id="slideTitle">Chargement...</h1>
    </header>

    <main class="slide-body" id="slideBody"></main>

    <!-- LOADING OVERLAY AVEC BOUTON ANNULER -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Préparation vocale...</div>
            <div class="loading-sub" id="loadingSub">Synthèse en cours</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loadingProgressBar"></div>
            </div>
            <div class="loading-timeout" id="loadingTimeout">⏱️ 30 secondes maximum</div>
            <button class="btn-cancel-loading" id="cancelLoadingBtn">
                <span>✕</span> Annuler
            </button>
        </div>
    </div>

    <footer class="slide-footer">
        <div class="footer-top">
            <span class="slide-counter" id="slideCounter">1 / 3</span>
            <span class="status-badge idle" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">Prêt</span>
            </span>
        </div>

        <div class="footer-buttons">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-secondary" id="replayBtn">
                <span class="btn-icon">🔁</span> <span class="btn-label">Relire</span>
            </button>
            <button class="btn btn-play" id="playBtn">
                <span class="btn-icon">▶</span> <span class="btn-label">Play</span>
            </button>
        </div>

        <div class="auto-indicator" id="autoIndicator">⏸ Lecture manuelle</div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // SLIDES
    // ================================================================
    const slides = [
  {
    "titre": "Équations et inéquations du second degré",
    "contenu": "<div style='background-color: #E8EAF6; padding: 20px; border-radius: 10px; color: #1A237E;'><h3 style='margin-top: 0;'>Introduction</h3><p>Une <strong>équation du second degré</strong> à une inconnue x est une équation de la forme :</p><div class='math-block'><div class='math'>$$ ax^2 + bx + c = 0 \\quad (a \\neq 0) $$</div></div><p>Une <strong>inéquation du second degré</strong> est une inégalité de la forme :</p><div class='math-block'><div class='math'>$$ ax^2 + bx + c > 0 \\quad \\text{ou} \\quad ax^2 + bx + c < 0 \\quad (a \\neq 0) $$</div></div><ul style='text-align: left; list-style-type: disc; padding-left: 20px; font-size: 1rem;'><li><strong>a</strong>, <strong>b</strong>, <strong>c</strong> sont des réels, avec <span class='math'>\\( a \\neq 0 \\)</span>.</li><li>On cherche les valeurs de x qui vérifient l'équation ou l'inéquation.</li></ul></div><div style='background-color: #FFF3E0; padding: 15px; border-radius: 8px; margin-top: 10px; color: #E65100;'><h4 style='margin-top: 0;'>Objectifs</h4><p>Dans cette leçon, nous allons apprendre à résoudre ces équations et inéquations en utilisant la <strong>forme canonique</strong> et la <strong>factorisation</strong>, sans utiliser le discriminant.</p></div>",
    "texteParle": "Dans cette leçon, nous allons étudier les équations et inéquations du second degré dans R. Une équation du second degré à une inconnue x est une équation de la forme a x carré plus b x plus c égale 0, avec a différent de zéro. Une inéquation du second degré est une inégalité de la forme a x carré plus b x plus c supérieur à 0, ou inférieur à 0. Les coefficients a, b et c sont des réels, avec a non nul. L'objectif de cette leçon est d'apprendre à résoudre ces équations et inéquations en utilisant la forme canonique et la factorisation, sans utiliser le discriminant. Cette méthode est plus intuitive et permet de comprendre la structure des solutions.",
    "note": "Équation : ax² + bx + c = 0. Inéquation : ax² + bx + c > 0 ou < 0."
  },
  {
    "titre": "Rappel : identités remarquables",
    "contenu": "<div style='background-color: #E3F2FD; padding: 20px; border-radius: 10px; color: #0D47A1;'><h3 style='margin-top: 0;'>Les trois identités fondamentales</h3><p>Pour transformer un trinôme en forme canonique, on utilise les identités remarquables :</p><div class='math-block'><div class='math'>$$ (a+b)^2 = a^2 + 2ab + b^2 $$</div></div><div class='math-block'><div class='math'>$$ (a-b)^2 = a^2 - 2ab + b^2 $$</div></div><div class='math-block'><div class='math'>$$ (a-b)(a+b) = a^2 - b^2 $$</div></div></div><div style='background-color: #FFF3E0; padding: 15px; border-radius: 8px; margin-top: 10px; color: #E65100;'><h4 style='margin-top: 0;'>Exemples</h4><p><span class='math'>\\( (x+3)^2 = x^2 + 6x + 9 \\)</span></p><p><span class='math'>\\( (x-4)^2 = x^2 - 8x + 16 \\)</span></p><p><span class='math'>\\( (x-5)(x+5) = x^2 - 25 \\)</span></p></div><div style='background-color: #E8F5E9; padding: 15px; border-radius: 8px; margin-top: 10px; color: #1B5E20;'><h4 style='margin-top: 0;'>À retenir</h4><p>Ces identités sont la base de la forme canonique. Il faut les connaître par cœur.</p></div>",
    "texteParle": "Avant de commencer, rappelons les trois identités remarquables fondamentales. La première est le carré d'une somme : a plus b au carré égale a au carré plus deux ab plus b au carré. La deuxième est le carré d'une différence : a moins b au carré égale a au carré moins deux ab plus b au carré. La troisième est la différence de deux carrés : a moins b fois a plus b égale a au carré moins b au carré. Par exemple, x plus 3 au carré égale x au carré plus 6x plus 9. x moins 4 au carré égale x au carré moins 8x plus 16. Et x moins 5 fois x plus 5 égale x au carré moins 25. Ces identités sont la base de la forme canonique. Il faut les connaître par cœur.",
    "note": "(a±b)² = a² ± 2ab + b² et (a−b)(a+b) = a² − b²."
  },
  {
    "titre": "Forme canonique d'un trinôme",
    "contenu": "<div style='background-color: #F3E5F5; padding: 20px; border-radius: 10px; color: #4A148C;'><h3 style='margin-top: 0;'>Définition de la forme canonique</h3><p>La <strong>forme canonique</strong> d'un trinôme <span class='math'>\\( ax^2 + bx + c \\)</span> est une écriture de la forme :</p><div class='math-block'><div class='math'>$$ a(x - \\alpha)^2 + \\beta $$</div></div><p>où <span class='math'>\\( \\alpha = -\\frac{b}{2a} \\)</span> et <span class='math'>\\( \\beta = c - \\frac{b^2}{4a} \\)</span>.</p></div><div style='background-color: #FFF3E0; padding: 15px; border-radius: 8px; margin-top: 10px; color: #E65100;'><h4 style='margin-top: 0;'>Méthode de mise sous forme canonique</h4><ol style='text-align: left; padding-left: 20px; font-size: 1rem;'><li>Mettre a en facteur dans les deux premiers termes : <span class='math'>\\( a\\left(x^2 + \\frac{b}{a}x\\right) + c \\)</span></li><li>Faire apparaître un carré parfait : <span class='math'>\\( a\\left[\\left(x + \\frac{b}{2a}\\right)^2 - \\frac{b^2}{4a^2}\\right] + c \\)</span></li><li>Développer et simplifier : <span class='math'>\\( a\\left(x + \\frac{b}{2a}\\right)^2 - \\frac{b^2}{4a} + c \\)</span></li></ol></div><div style='background-color: #E8F5E9; padding: 15px; border-radius: 8px; margin-top: 10px; color: #1B5E20;'><h4 style='margin-top: 0;'>Formule finale</h4><div class='math-block'><div class='math'>$$ ax^2 + bx + c = a\\left(x + \\frac{b}{2a}\\right)^2 - \\frac{b^2 - 4ac}{4a} $$</div></div></div>",
    "texteParle": "La forme canonique d'un trinôme a x carré plus b x plus c est une écriture de la forme a fois x moins alpha au carré plus bêta, où alpha égale moins b sur 2a, et bêta égale c moins b au carré sur 4a. Pour obtenir cette forme, on suit trois étapes. Première étape : on met a en facteur dans les deux premiers termes, ce qui donne a fois x carré plus b sur a fois x, plus c. Deuxième étape : on fait apparaître un carré parfait à l'intérieur de la parenthèse. On écrit x carré plus b sur a fois x comme x plus b sur 2a le tout au carré, moins b au carré sur 4a au carré. Troisième étape : on développe et on simplifie. On obtient finalement a fois x plus b sur 2a le tout au carré, moins b au carré moins 4ac sur 4a. Cette écriture est très utile pour factoriser et résoudre les équations.",
    "note": "Forme canonique : a(x − α)² + β avec α = −b/(2a)."
  },
  {
    "titre": "Exemple de mise sous forme canonique",
    "contenu": "<div style='background-color: #E0F7FA; padding: 20px; border-radius: 10px; color: #006064;'><h3 style='margin-top: 0;'>Exemple détaillé</h3><p>Mettre <span class='math'>\\( x^2 + 6x + 5 \\)</span> sous forme canonique.</p><p><strong>Étape 1 :</strong> Ici a = 1, donc pas besoin de factoriser.</p><p><strong>Étape 2 :</strong> On fait apparaître un carré parfait :</p><p><span class='math'>\\( x^2 + 6x = (x + 3)^2 - 9 \\)</span></p><p><strong>Étape 3 :</strong> On remplace :</p><p><span class='math'>\\( x^2 + 6x + 5 = (x + 3)^2 - 9 + 5 = (x + 3)^2 - 4 \\)</span></p><p><strong>Forme canonique :</strong> <span class='math'>\\( (x + 3)^2 - 4 \\)</span></p></div><div style='background-color: #FFF3E0; padding: 15px; border-radius: 8px; margin-top: 10px; color: #E65100;'><h4 style='margin-top: 0;'>Exemple avec a ≠ 1</h4><p>Mettre <span class='math'>\\( 2x^2 - 8x + 3 \\)</span> sous forme canonique.</p><p><span class='math'>\\( 2x^2 - 8x + 3 = 2(x^2 - 4x) + 3 \\)</span></p><p><span class='math'>\\( = 2[(x - 2)^2 - 4] + 3 \\)</span></p><p><span class='math'>\\( = 2(x - 2)^2 - 8 + 3 = 2(x - 2)^2 - 5 \\)</span></p><p><strong>Forme canonique :</strong> <span class='math'>\\( 2(x - 2)^2 - 5 \\)</span></p></div><div style='background-color: #E8F5E9; padding: 15px; border-radius: 8px; margin-top: 10px; color: #1B5E20;'><h4 style='margin-top: 0;'>Vérification</h4><p>On peut développer pour vérifier : <span class='math'>\\( 2(x - 2)^2 - 5 = 2(x^2 - 4x + 4) - 5 = 2x^2 - 8x + 8 - 5 = 2x^2 - 8x + 3 \\)</span> ✓</p></div>",
    "texteParle": "Voyons un exemple détaillé de mise sous forme canonique. Prenons x carré plus 6x plus 5. Ici, a égale 1, donc on n'a pas besoin de factoriser. On fait apparaître un carré parfait : x carré plus 6x égale x plus 3 au carré moins 9. En remplaçant, on obtient x plus 3 au carré moins 9 plus 5, soit x plus 3 au carré moins 4. La forme canonique est x plus 3 au carré moins 4. Prenons maintenant un exemple avec a différent de 1 : 2x carré moins 8x plus 3. On met 2 en facteur : 2 fois x carré moins 4x, plus 3. À l'intérieur, x carré moins 4x égale x moins 2 au carré moins 4. Donc on a 2 fois x moins 2 au carré moins 4, plus 3, ce qui donne 2 fois x moins 2 au carré moins 8 plus 3, soit 2 fois x moins 2 au carré moins 5. La forme canonique est 2 fois x moins 2 au carré moins 5. On peut vérifier en développant : 2 fois x moins 2 au carré moins 5 égale 2 fois x carré moins 4x plus 4 moins 5, soit 2x carré moins 8x plus 8 moins 5, soit 2x carré moins 8x plus 3. C'est bien correct.",
    "note": "Toujours vérifier en développant la forme canonique."
  },
  {
    "titre": "Factorisation à partir de la forme canonique",
    "contenu": "<div style='background-color: #E3F2FD; padding: 20px; border-radius: 10px; color: #0D47A1;'><h3 style='margin-top: 0;'>Factoriser un trinôme</h3><p>Une fois la forme canonique obtenue, on peut factoriser en utilisant la <strong>différence de deux carrés</strong> :</p><div class='math-block'><div class='math'>$$ A^2 - B^2 = (A - B)(A + B) $$</div></div><p><strong>Méthode :</strong></p><ol style='text-align: left; padding-left: 20px; font-size: 1rem;'><li>Écrire la forme canonique : <span class='math'>\\( a(x - \\alpha)^2 + \\beta \\)</span>.</li><li>Si <span class='math'>\\( \\beta \\)</span> et <span class='math'>\\( a \\)</span> sont de signes contraires, on peut factoriser.</li><li>Écrire <span class='math'>\\( a(x - \\alpha)^2 - (-\\beta) = a\\left[(x - \\alpha)^2 - \\frac{-\\beta}{a}\\right] \\)</span>.</li><li>Appliquer la différence de carrés.</li></ol></div><div style='background-color: #FFF3E0; padding: 15px; border-radius: 8px; margin-top: 10px; color: #E65100;'><h4 style='margin-top: 0;'>Exemple</h4><p>Factoriser <span class='math'>\\( x^2 + 6x + 5 \\)</span>.</p><p>Forme canonique : <span class='math'>\\( (x + 3)^2 - 4 \\)</span></p><p><span class='math'>\\( = (x + 3)^2 - 2^2 = (x + 3 - 2)(x + 3 + 2) \\)</span></p><p><span class='math'>\\( = (x + 1)(x + 5) \\)</span></p></div><div style='background-color: #E8F5E9; padding: 15px; border-radius: 8px; margin-top: 10px; color: #1B5E20;'><h4 style='margin-top: 0;'>Vérification</h4><p><span class='math'>\\( (x + 1)(x + 5) = x^2 + 5x + x + 5 = x^2 + 6x + 5 \\)</span> ✓</p></div>",
    "texteParle": "Une fois que l'on a la forme canonique, on peut factoriser le trinôme en utilisant la différence de deux carrés : A au carré moins B au carré égale A moins B fois A plus B. La méthode est la suivante. On écrit la forme canonique : a fois x moins alpha au carré plus bêta. Si bêta et a sont de signes contraires, on peut factoriser. On écrit alors a fois x moins alpha au carré moins moins bêta, ce qui donne a fois x moins alpha au carré moins moins bêta sur a. Puis on applique la différence de carrés. Par exemple, pour factoriser x carré plus 6x plus 5. La forme canonique est x plus 3 au carré moins 4. On reconnaît une différence de deux carrés : x plus 3 au carré moins 2 au carré. Donc on obtient x plus 3 moins 2 fois x plus 3 plus 2, soit x plus 1 fois x plus 5. On peut vérifier en développant : x plus 1 fois x plus 5 égale x carré plus 5x plus x plus 5, soit x carré plus 6x plus 5. C'est correct.",
    "note": "A² − B² = (A − B)(A + B) — la clé de la factorisation."
  },
  {
    "titre": "Résolution d'une équation du second degré",
    "contenu": "<div style='background-color: #F3E5F5; padding: 20px; border-radius: 10px; color: #4A148C;'><h3 style='margin-top: 0;'>Résoudre ax² + bx + c = 0</h3><p><strong>Méthode :</strong></p><ol style='text-align: left; padding-left: 20px; font-size: 1rem;'><li>Mettre le trinôme sous forme canonique.</li><li>Factoriser si possible.</li><li>Appliquer la règle du produit nul : <span class='math'>\\( AB = 0 \\iff A = 0 \\text{ ou } B = 0 \\)</span>.</li></ol></div><div style='background-color: #FFF3E0; padding: 15px; border-radius: 8px; margin-top: 10px; color: #E65100;'><h4 style='margin-top: 0;'>Exemple 1</h4><p>Résoudre <span class='math'>\\( x^2 + 6x + 5 = 0 \\)</span>.</p><p>Forme canonique : <span class='math'>\\( (x + 3)^2 - 4 = 0 \\)</span></p><p>Factorisation : <span class='math'>\\( (x + 1)(x + 5) = 0 \\)</span></p><p><span class='math'>\\( x + 1 = 0 \\iff x = -1 \\)</span></p><p><span class='math'>\\( x + 5 = 0 \\iff x = -5 \\)</span></p><p><strong>Solutions :</strong> <span class='math'>\\( S = \\{-5, -1\\} \\)</span></p></div><div style='background-color: #E8F5E9; padding: 15px; border-radius: 8px; margin-top: 10px; color: #1B5E20;'><h4 style='margin-top: 0;'>Exemple 2</h4><p>Résoudre <span class='math'>\\( 2x^2 - 8x + 3 = 0 \\)</span>.</p><p>Forme canonique : <span class='math'>\\( 2(x - 2)^2 - 5 = 0 \\)</span></p><p><span class='math'>\\( 2(x - 2)^2 = 5 \\iff (x - 2)^2 = \\frac{5}{2} \\)</span></p><p><span class='math'>\\( x - 2 = \\sqrt{\\frac{5}{2}} \\text{ ou } x - 2 = -\\sqrt{\\frac{5}{2}} \\)</span></p><p><span class='math'>\\( x = 2 + \\sqrt{\\frac{5}{2}} \\text{ ou } x = 2 - \\sqrt{\\frac{5}{2}} \\)</span></p></div>",
    "texteParle": "Pour résoudre une équation du second degré, on suit trois étapes. Première étape : mettre le trinôme sous forme canonique. Deuxième étape : factoriser si possible. Troisième étape : appliquer la règle du produit nul : un produit est nul si et seulement si l'un des facteurs est nul. Par exemple, pour résoudre x carré plus 6x plus 5 égale 0. La forme canonique est x plus 3 au carré moins 4. On factorise : x plus 1 fois x plus 5 égale 0. Donc x plus 1 égale 0, ce qui donne x égale moins 1, ou x plus 5 égale 0, ce qui donne x égale moins 5. Les solutions sont moins 5 et moins 1. Autre exemple : 2x carré moins 8x plus 3 égale 0. La forme canonique est 2 fois x moins 2 au carré moins 5. On isole le carré : 2 fois x moins 2 au carré égale 5, donc x moins 2 au carré égale 5 demis. Donc x moins 2 égale racine de 5 demis ou x moins 2 égale moins racine de 5 demis. Les solutions sont x égale 2 plus racine de 5 demis ou x égale 2 moins racine de 5 demis.",
    "note": "AB = 0 ⇔ A = 0 ou B = 0 — la règle du produit nul."
  },
  {
    "titre": "Cas particuliers des équations du second degré",
    "contenu": "<div style='background-color: #E0F7FA; padding: 20px; border-radius: 10px; color: #006064;'><h3 style='margin-top: 0;'>Trois cas possibles</h3><p>Après mise sous forme canonique <span class='math'>\\( a(x - \\alpha)^2 + \\beta = 0 \\)</span> :</p><ul style='text-align: left; list-style-type: disc; padding-left: 20px; font-size: 1rem;'><li><strong>Cas 1 :</strong> <span class='math'>\\( -\\frac{\\beta}{a} > 0 \\)</span> → deux solutions distinctes.</li><li><strong>Cas 2 :</strong> <span class='math'>\\( -\\frac{\\beta}{a} = 0 \\)</span> → une solution double <span class='math'>\\( x = \\alpha \\)</span>.</li><li><strong>Cas 3 :</strong> <span class='math'>\\( -\\frac{\\beta}{a} < 0 \\)</span> → pas de solution réelle.</li></ul></div><div style='background-color: #FFF3E0; padding: 15px; border-radius: 8px; margin-top: 10px; color: #E65100;'><h4 style='margin-top: 0;'>Exemples</h4><p><strong>Deux solutions :</strong> <span class='math'>\\( (x - 2)^2 - 9 = 0 \\iff (x - 2)^2 = 9 \\iff x = 5 \\text{ ou } x = -1 \\)</span></p><p><strong>Solution double :</strong> <span class='math'>\\( (x - 3)^2 = 0 \\iff x = 3 \\)</span></p><p><strong>Pas de solution :</strong> <span class='math'>\\( (x - 1)^2 + 4 = 0 \\iff (x - 1)^2 = -4 \\)</span> → impossible car un carré est toujours positif.</p></div><div style='background-color: #E8F5E9; padding: 15px; border-radius: 8px; margin-top: 10px; color: #1B5E20;'><h4 style='margin-top: 0;'>À retenir</h4><p>Un carré est toujours <strong>positif ou nul</strong>. C'est pourquoi certaines équations n'ont pas de solution réelle.</p></div>",
    "texteParle": "Après avoir mis l'équation sous forme canonique, on obtient a fois x moins alpha au carré plus bêta égale 0. Il y a trois cas possibles. Premier cas : si moins bêta sur a est supérieur à 0, alors l'équation a deux solutions distinctes. Par exemple, x moins 2 au carré moins 9 égale 0 donne x moins 2 au carré égale 9, donc x égale 5 ou x égale moins 1. Deuxième cas : si moins bêta sur a est égal à 0, alors l'équation a une solution double, x égale alpha. Par exemple, x moins 3 au carré égale 0 donne x égale 3. Troisième cas : si moins bêta sur a est inférieur à 0, alors l'équation n'a pas de solution réelle. Par exemple, x moins 1 au carré plus 4 égale 0 donne x moins 1 au carré égale moins 4, ce qui est impossible car un carré est toujours positif ou nul. C'est pourquoi certaines équations n'ont pas de solution réelle.",
    "note": "Un carré est toujours ≥ 0. Si on obtient un carré égal à un nombre négatif, pas de solution."
  },
  {
    "titre": "Résolution d'une inéquation du second degré",
    "contenu": "<div style='background-color: #E3F2FD; padding: 20px; border-radius: 10px; color: #0D47A1;'><h3 style='margin-top: 0;'>Résoudre ax² + bx + c > 0 (ou < 0)</h3><p><strong>Méthode :</strong></p><ol style='text-align: left; padding-left: 20px; font-size: 1rem;'><li>Mettre le trinôme sous forme canonique.</li><li>Factoriser si possible.</li><li>Étudier le signe du produit de facteurs.</li><li>Conclure sur l'ensemble des solutions.</li></ol></div><div style='background-color: #FFF3E0; padding: 15px; border-radius: 8px; margin-top: 10px; color: #E65100;'><h4 style='margin-top: 0;'>Exemple 1</h4><p>Résoudre <span class='math'>\\( x^2 + 6x + 5 > 0 \\)</span>.</p><p>Factorisation : <span class='math'>\\( (x + 1)(x + 5) > 0 \\)</span></p><p>Tableau de signes :</p><table style='width: 100%; text-align: center; border-collapse: collapse; font-size: 0.9rem;'><tr><th>x</th><th>−∞</th><th>−5</th><th>−1</th><th>+∞</th></tr><tr><td>x + 1</td><td>−</td><td>−</td><td>0</td><td>+</td></tr><tr><td>x + 5</td><td>−</td><td>0</td><td>+</td><td>+</td></tr><tr><td>Produit</td><td>+</td><td>0</td><td>−</td><td>0</td><td>+</td></tr></table><p><strong>Solution :</strong> <span class='math'>\\( S = ]-\\infty, -5[ \\cup ]-1, +\\infty[ \\)</span></p></div><div style='background-color: #E8F5E9; padding: 15px; border-radius: 8px; margin-top: 10px; color: #1B5E20;'><h4 style='margin-top: 0;'>Exemple 2</h4><p>Résoudre <span class='math'>\\( x^2 + 6x + 5 < 0 \\)</span>.</p><p><span class='math'>\\( (x + 1)(x + 5) < 0 \\)</span></p><p><strong>Solution :</strong> <span class='math'>\\( S = ]-5, -1[ \\)</span></p></div>",
    "texteParle": "Pour résoudre une inéquation du second degré, on suit la même méthode que pour les équations, mais on termine par une étude de signe. Première étape : mettre le trinôme sous forme canonique. Deuxième étape : factoriser si possible. Troisième étape : étudier le signe du produit de facteurs à l'aide d'un tableau de signes. Quatrième étape : conclure sur l'ensemble des solutions. Par exemple, pour résoudre x carré plus 6x plus 5 supérieur à 0. On factorise : x plus 1 fois x plus 5 supérieur à 0. On construit le tableau de signes. Le facteur x plus 1 est négatif avant moins 1 et positif après. Le facteur x plus 5 est négatif avant moins 5 et positif après. Le produit est positif quand les deux facteurs sont de même signe, c'est-à-dire sur les intervalles moins l'infini à moins 5 et moins 1 à plus l'infini. La solution est la réunion de ces deux intervalles. Pour l'inéquation x carré plus 6x plus 5 inférieur à 0, le produit est négatif quand les facteurs sont de signes contraires, c'est-à-dire sur l'intervalle moins 5 à moins 1. La solution est cet intervalle.",
    "note": "Étudier le signe du produit de facteurs pour conclure."
  },
  {
    "titre": "Inéquations avec forme canonique non factorisable",
    "contenu": "<div style='background-color: #F3E5F5; padding: 20px; border-radius: 10px; color: #4A148C;'><h3 style='margin-top: 0;'>Cas où la factorisation n'est pas possible</h3><p>Si la forme canonique est <span class='math'>\\( a(x - \\alpha)^2 + \\beta \\)</span> avec <span class='math'>\\( \\beta \\)</span> et <span class='math'>\\( a \\)</span> de même signe, on ne peut pas factoriser.</p><p>On utilise alors le signe de <span class='math'>\\( a(x - \\alpha)^2 + \\beta \\)</span> :</p><ul style='text-align: left; list-style-type: disc; padding-left: 20px; font-size: 1rem;'><li><span class='math'>\\( (x - \\alpha)^2 \\ge 0 \\)</span> toujours.</li><li>Si <span class='math'>\\( a > 0 \\)</span> et <span class='math'>\\( \\beta > 0 \\)</span> : l'expression est toujours <strong>positive</strong>.</li><li>Si <span class='math'>\\( a < 0 \\)</span> et <span class='math'>\\( \\beta < 0 \\)</span> : l'expression est toujours <strong>négative</strong>.</li></ul></div><div style='background-color: #FFF3E0; padding: 15px; border-radius: 8px; margin-top: 10px; color: #E65100;'><h4 style='margin-top: 0;'>Exemples</h4><p><strong>Exemple 1 :</strong> <span class='math'>\\( x^2 + 2x + 5 > 0 \\)</span></p><p>Forme canonique : <span class='math'>\\( (x + 1)^2 + 4 > 0 \\)</span></p><p>Or <span class='math'>\\( (x + 1)^2 \\ge 0 \\)</span> et <span class='math'>\\( 4 > 0 \\)</span>, donc l'expression est toujours positive.</p><p><strong>Solution :</strong> <span class='math'>\\( S = \\mathbb{R} \\)</span></p><p><strong>Exemple 2 :</strong> <span class='math'>\\( -x^2 + 2x - 5 > 0 \\)</span></p><p>Forme canonique : <span class='math'>\\( -(x - 1)^2 - 4 > 0 \\)</span></p><p>Or <span class='math'>\\( -(x - 1)^2 \\le 0 \\)</span> et <span class='math'>\\( -4 < 0 \\)</span>, donc l'expression est toujours négative.</p><p><strong>Solution :</strong> <span class='math'>\\( S = \\varnothing \\)</span></p></div>",
    "texteParle": "Il existe des cas où la factorisation n'est pas possible. Si la forme canonique est a fois x moins alpha au carré plus bêta, avec bêta et a de même signe, on ne peut pas factoriser. On utilise alors le signe de l'expression. Rappelons que x moins alpha au carré est toujours positif ou nul. Donc si a est positif et bêta est positif, l'expression est toujours positive. Si a est négatif et bêta est négatif, l'expression est toujours négative. Par exemple, pour résoudre x carré plus 2x plus 5 supérieur à 0. La forme canonique est x plus 1 au carré plus 4. Comme x plus 1 au carré est positif ou nul, et 4 est positif, l'expression est toujours positive. La solution est R tout entier. Autre exemple : moins x carré plus 2x moins 5 supérieur à 0. La forme canonique est moins x moins 1 au carré moins 4. Comme moins x moins 1 au carré est négatif ou nul, et moins 4 est négatif, l'expression est toujours négative. Elle ne peut jamais être supérieure à 0. La solution est l'ensemble vide.",
    "note": "Un carré est toujours ≥ 0. Le signe de a et β détermine le signe de l'expression."
  },
  {
    "titre": "Tableau de signes d'un trinôme",
    "contenu": "<div style='background-color: #E0F7FA; padding: 20px; border-radius: 10px; color: #006064;'><h3 style='margin-top: 0;'>Signe d'un trinôme du second degré</h3><p>Après factorisation <span class='math'>\\( a(x - x_1)(x - x_2) \\)</span>, on étudie le signe :</p><ul style='text-align: left; list-style-type: disc; padding-left: 20px; font-size: 1rem;'><li>Le trinôme est du signe de <span class='math'>\\( a \\)</span> à l'extérieur des racines.</li><li>Le trinôme est du signe de <span class='math'>\\( -a \\)</span> entre les racines.</li></ul></div><div style='background-color: #FFF3E0; padding: 15px; border-radius: 8px; margin-top: 10px; color: #E65100;'><h4 style='margin-top: 0;'>Exemple avec a > 0</h4><p><span class='math'>\\( x^2 + 6x + 5 = (x + 1)(x + 5) \\)</span></p><table style='width: 100%; text-align: center; border-collapse: collapse; font-size: 0.9rem;'><tr><th>x</th><th>−∞</th><th>−5</th><th>−1</th><th>+∞</th></tr><tr><td>Trinôme</td><td>+</td><td>0</td><td>−</td><td>0</td><td>+</td></tr></table><p>Le trinôme est positif à l'extérieur des racines et négatif entre.</p></div><div style='background-color: #E8F5E9; padding: 15px; border-radius: 8px; margin-top: 10px; color: #1B5E20;'><h4 style='margin-top: 0;'>Exemple avec a < 0</h4><p><span class='math'>\\( -x^2 + 4x - 3 = -(x - 1)(x - 3) \\)</span></p><table style='width: 100%; text-align: center; border-collapse: collapse; font-size: 0.9rem;'><tr><th>x</th><th>−∞</th><th>1</th><th>3</th><th>+∞</th></tr><tr><td>Trinôme</td><td>−</td><td>0</td><td>+</td><td>0</td><td>−</td></tr></table><p>Le trinôme est négatif à l'extérieur des racines et positif entre.</p></div>",

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentIndex = 0;
    let isSpeaking = false;
    let isPaused = false;
    let currentUtterance = null;
    let isLoading = false;
    let loadingTimeout = null;
    let isTransitioning = false;
    let speechSupported = true;
    let userInteracted = false;
    let isPlaying = false;
    let loadingCancelled = false;

    const total = slides.length;
    const synth = window.speechSynthesis;

    // Références jQuery
    const $title = $('#slideTitle');
    const $body = $('#slideBody');
    const $counter = $('#slideCounter');
    const $statusText = $('#statusText');
    const $statusBadge = $('#statusBadge');
    const $loading = $('#loadingOverlay');
    const $loadingText = $('#loadingText');
    const $loadingSub = $('#loadingSub');
    const $loadingTimeout = $('#loadingTimeout');
    const $loadingProgressBar = $('#loadingProgressBar');
    const $autoIndicator = $('#autoIndicator');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $replay = $('#replayBtn');
    const $play = $('#playBtn');
    const $cancelLoading = $('#cancelLoadingBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function setStatus(text, type) {
        $statusText.text(text);
        $statusBadge.removeClass('idle speaking error paused waiting loading');
        if (type === 'speaking') $statusBadge.addClass('speaking');
        else if (type === 'error') $statusBadge.addClass('error');
        else if (type === 'paused') $statusBadge.addClass('paused');
        else if (type === 'waiting') $statusBadge.addClass('waiting');
        else if (type === 'loading') $statusBadge.addClass('loading');
        else $statusBadge.addClass('idle');
    }

    function updatePlayButton() {
        if (isPlaying) {
            $play.addClass('playing');
            $play.find('.btn-icon').text('⏸');
            $play.find('.btn-label').text('Pause');
        } else {
            $play.removeClass('playing');
            $play.find('.btn-icon').text('▶');
            $play.find('.btn-label').text('Play');
        }
    }

    function showLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        
        loadingCancelled = false;
        isLoading = true;
        
        // Réinitialiser la barre de progression
        $loadingProgressBar.css('animation', 'none');
        $loadingProgressBar.css('width', '0%');
        // Forcer un reflow
        $loadingProgressBar[0].offsetHeight;
        $loadingProgressBar.css('animation', 'loadingProgress 30s ease-out forwards');
        
        $loadingText.text('Préparation vocale...');
        $loadingSub.text('Synthèse en cours');
        $loadingTimeout.text('⏱️ 30 secondes maximum');
        $loading.fadeIn(300);
        setStatus("⏳ Chargement...", 'loading');
        
        // 🔥 TIMEOUT DE 30 SECONDES
        loadingTimeout = setTimeout(() => {
            if (isLoading && !loadingCancelled) {
                hideLoading();
                setStatus("⚠️ Délai dépassé (30s)", 'error');
                isPlaying = false;
                updatePlayButton();
                $loadingSub.text('La synthèse vocale a pris trop de temps');
                $loadingTimeout.text('❌ Délai dépassé');
            }
        }, 30000);
    }

    function hideLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        isLoading = false;
        loadingCancelled = false;
        $loading.fadeOut(300);
        // Ne pas changer le statut si on est en train de parler
        if (!isSpeaking && !isPlaying) {
            setStatus("⏸ Lecture arrêtée", 'paused');
        }
    }

    function cancelLoading() {
        loadingCancelled = true;
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        hideLoading();
        stopSpeaking();
        setStatus("⏸ Annulé", 'paused');
        isPlaying = false;
        updatePlayButton();
        $loadingText.text('Annulé par l\'utilisateur');
        $loadingSub.text('Vous pouvez réessayer');
        $loadingTimeout.text('✕ Annulation');
    }

    // Arrêter la parole proprement
    function stopSpeaking() {
        try {
            if (synth && (synth.speaking || synth.pending)) {
                synth.cancel();
            }
        } catch(e) {
            console.warn('Erreur stopSpeaking:', e);
        }
        if (currentUtterance) {
            try {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance.onstart = null;
            } catch(e) {}
            currentUtterance = null;
        }
        isSpeaking = false;
        isPlaying = false;
        updatePlayButton();
    }

    // Mettre en pause la parole
    function pauseSpeaking() {
        try {
            if (synth && synth.speaking) {
                synth.pause();
                isPaused = true;
                isPlaying = false;
                setStatus("⏸ Lecture en pause", 'paused');
                updatePlayButton();
            }
        } catch(e) {
            console.warn('Erreur pauseSpeaking:', e);
            stopSpeaking();
        }
    }

    // Reprendre la parole
    function resumeSpeaking() {
        try {
            if (synth && synth.paused) {
                synth.resume();
                isPaused = false;
                isPlaying = true;
                setStatus("🔊 Lecture en cours", 'speaking');
                updatePlayButton();
            } else if (!isSpeaking && !synth.speaking && !synth.pending) {
                speakSlide(currentIndex);
            }
        } catch(e) {
            console.warn('Erreur resumeSpeaking:', e);
            speakSlide(currentIndex);
        }
    }

    function renderSlide(index) {
        const slide = slides[index];
        $title.text(slide.titre);

        let html = '';
        html += `<div class="content-card">${slide.contenu}</div>`;
        if (slide.note) {
            html += `<div class="note-box">${slide.note}</div>`;
        }
        $body.html(html);
        $counter.text(`${index+1} / ${total}`);

        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
        }
    }

    // ================================================================
    // LECTURE VOCALE
    // ================================================================
    function speakSlide(index) {
        return new Promise((resolve) => {
            const slide = slides[index];
            const text = slide.texteParle;
            
            if (!text || text.trim() === '' || !speechSupported) {
                resolve();
                return;
            }

            if (!window.speechSynthesis) {
                setStatus("❌ Synthèse vocale non supportée", 'error');
                speechSupported = false;
                resolve();
                return;
            }

            // Arrêter toute lecture en cours
            stopSpeaking();
            
            // Réinitialiser l'état de pause
            isPaused = false;
            
            showLoading();
            setStatus("Initialisation...", 'loading');

            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.92;
                utterance.pitch = 1.05;
                utterance.volume = 1;

                let isFinished = false;
                let errorHandled = false;

                utterance.onstart = function() {
                    if (loadingCancelled) {
                        stopSpeaking();
                        resolve();
                        return;
                    }
                    hideLoading();
                    isSpeaking = true;
                    isPlaying = true;
                    isPaused = false;
                    setStatus("🔊 Lecture en cours", 'speaking');
                    updatePlayButton();
                };

                utterance.onend = function() {
                    if (isFinished) return;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    setStatus("✅ Terminé", 'idle');
                    hideLoading();
                    updatePlayButton();
                    resolve();
                };

                utterance.onerror = function(e) {
                    if (isFinished || errorHandled) return;
                    errorHandled = true;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    hideLoading();
                    updatePlayButton();
                    
                    if (e.error === 'not-allowed') {
                        setStatus("⚠️ Permission refusée", 'error');
                    } else if (e.error === 'synthesis-unavailable') {
                        setStatus("⚠️ Synthèse indisponible", 'error');
                    } else if (e.error === 'canceled') {
                        setStatus("⏸ Annulé", 'paused');
                    } else {
                        setStatus("❌ Erreur audio: " + (e.error || 'inconnue'), 'error');
                    }
                    
                    resolve();
                };

                // Gestion du chargement des voix
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = function() {
                        if (!loadingCancelled) {
                            try {
                                synth.speak(utterance);
                            } catch(err) {
                                // Silencieux
                            }
                        }
                        synth.onvoiceschanged = null;
                    };
                }

                currentUtterance = utterance;
                
                if (!loadingCancelled) {
                    try {
                        synth.speak(utterance);
                    } catch(err) {
                        setTimeout(() => {
                            if (!loadingCancelled) {
                                try {
                                    synth.speak(utterance);
                                } catch(e) {
                                    setStatus("❌ Erreur de lecture", 'error');
                                    isPlaying = false;
                                    updatePlayButton();
                                    hideLoading();
                                    resolve();
                                }
                            } else {
                                resolve();
                            }
                        }, 100);
                    }
                } else {
                    resolve();
                }

            } catch(err) {
                hideLoading();
                setStatus("❌ Erreur générale", 'error');
                isPlaying = false;
                updatePlayButton();
                console.error('Erreur speakSlide:', err);
                resolve();
            }
        });
    }

    // ================================================================
    // NAVIGATION
    // ================================================================
    async function goToSlide(index) {
        if (isTransitioning) return;
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        
        // Si on est en train de lire, on met en pause avant de naviguer
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        // Arrêter complètement la lecture
        stopSpeaking();
        
        await new Promise(r => setTimeout(r, 50));
        
        if (index === currentIndex) {
            setStatus("📄 Slide actuel", 'idle');
            return;
        }

        isTransitioning = true;
        currentIndex = index;
        renderSlide(index);
        
        // Réinitialiser l'état de lecture
        isPlaying = false;
        updatePlayButton();
        setStatus("⏸ Lecture arrêtée", 'paused');

        await new Promise(r => setTimeout(r, 150));
        isTransitioning = false;
    }

    async function goToNext() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex + 1 < total) {
            await goToSlide(currentIndex + 1);
        } else {
            setStatus("🏁 Dernier slide", 'idle');
        }
    }

    async function goToPrev() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex - 1 >= 0) {
            await goToSlide(currentIndex - 1);
        } else {
            setStatus("🔁 Premier slide", 'idle');
        }
    }

    // ================================================================
    // GESTION PLAY/PAUSE
    // ================================================================
    function togglePlay() {
        if (!userInteracted) {
            userInteracted = true;
        }

        // Si le chargement est en cours, on l'annule
        if (isLoading) {
            cancelLoading();
            return;
        }

        // Si le synthétiseur est en pause, on reprend
        if (synth && synth.paused) {
            resumeSpeaking();
            return;
        }

        // Si la lecture est en cours, on met en pause
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
            return;
        }

        // Sinon, on démarre la lecture du slide courant
        if (!isSpeaking && !isPlaying) {
            stopSpeaking();
            speakSlide(currentIndex);
        }
    }

    // ================================================================
    // INIT
    // ================================================================
    async function init() {
        // Vérifier la compatibilité
        if (!window.speechSynthesis) {
            setStatus("❌ Synthèse vocale non supportée", 'error');
            speechSupported = false;
        }

        // Précharger les voix
        try {
            if (synth.getVoices) {
                synth.getVoices();
                setTimeout(() => {
                    try {
                        synth.getVoices();
                    } catch(e) {}
                }, 200);
            }
        } catch(e) {
            console.warn('Erreur chargement voix:', e);
        }

        // Afficher le premier slide
        renderSlide(0);
        $counter.text(`1 / ${total}`);
        
        // État initial
        setStatus("⏸ Appuie sur Play", 'paused');
        updatePlayButton();
        $autoIndicator.text('⏸ Lecture manuelle');

        // ================================================================
        // ÉVÉNEMENTS
        // ================================================================
        
        // Bouton Play/Pause
        $play.on('click', function() {
            togglePlay();
        });

        // Bouton Annuler le chargement
        $cancelLoading.on('click', function() {
            cancelLoading();
        });

        // Navigation
        $prev.on('click', function() {
            // Si chargement en cours, on annule
            if (isLoading) cancelLoading();
            goToPrev();
        });

        $next.on('click', function() {
            if (isLoading) cancelLoading();
            goToNext();
        });

        // Replay - relire le slide courant
        $replay.on('click', function() {
            if (isLoading) cancelLoading();
            stopSpeaking();
            setTimeout(() => {
                speakSlide(currentIndex);
            }, 100);
        });

        // Support du clavier (espace pour play/pause)
        $(document).on('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });

        // Nettoyage
        $(window).on('beforeunload', function() {
            try {
                if (synth.speaking) synth.cancel();
            } catch(e) {}
            hideLoading();
        });

        // Gérer les cas où la synthèse se termine de manière inattendue
        setInterval(() => {
            if (isPlaying && !synth.speaking && !synth.pending && !isPaused && !isLoading) {
                isPlaying = false;
                updatePlayButton();
                setStatus("⏸ Lecture arrêtée", 'paused');
            }
        }, 1000);
    }

    init();
});



    // ================================================================
    // GESTION DU THÈME JOUR/NUIT
    // ================================================================

            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.12)';
                statusBadge.style.color = '#93bbfc';
            }
            if (slideCounter) {
                slideCounter.style.color = '#94a3b8';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#64748b';
            }
            if (themeBtn) {
                themeBtn.textContent = '☀️';
                themeBtn.title = 'Passer en mode jour';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#e2e8f0';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#e2e8f0';
                }
            });
        } else {
            // Mode jour (par défaut)
            body.style.background = '#f0f4f8';
            body.style.color = '#1a202c';
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
            header.style.background = 'rgba(255, 255, 255, 0.85)';
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.8)';
                card.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.12)';
                note.style.color = '#2c3e50';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.05)';
                block.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#2d3748';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
                statusBadge.style.color = '#2b6cb0';
            }
            if (slideCounter) {
                slideCounter.style.color = '#4a5568';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#718096';
            }
            if (themeBtn) {
                themeBtn.textContent = '🌓';
                themeBtn.title = 'Passer en mode nuit';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#2c3e50';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#2d3748';
                }
            });
        }
    }

    // Initialiser en mode jour
    document.addEventListener('DOMContentLoaded', function() {
        // Appliquer le mode jour par défaut
        const body = document.body;
        body.style.background = '#f0f4f8';
        body.style.color = '#1a202c';
        
        const appContainer = document.querySelector('.app-container');
        if (appContainer) {
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
        }
        
        const header = document.querySelector('.slide-header');
        if (header) {
            header.style.background = 'rgba(255, 255, 255, 0.85)';
        }
        
        const footer = document.querySelector('.slide-footer');
        if (footer) {
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
        }
        
        document.querySelectorAll('.content-card').forEach(card => {
            card.style.background = 'rgba(255,255,255,0.8)';
            card.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.note-box').forEach(note => {
            note.style.background = 'rgba(96, 165, 250, 0.12)';
            note.style.color = '#2c3e50';
        });
        
        document.querySelectorAll('.math-block').forEach(block => {
            block.style.background = 'rgba(0,0,0,0.05)';
            block.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.btn').forEach(btn => {
            btn.style.color = '#2d3748';
        });
        
        const statusBadge = document.querySelector('.status-badge');
        if (statusBadge) {
            statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
            statusBadge.style.color = '#2b6cb0';
        }
        
        const slideCounter = document.querySelector('.slide-counter');
        if (slideCounter) {
            slideCounter.style.color = '#4a5568';
        }
        
        const autoIndicator = document.querySelector('.auto-indicator');
        if (autoIndicator) {
            autoIndicator.style.color = '#718096';
        }
        
        document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
            if (!el.closest('.note-box')) {
                el.style.color = '#2c3e50';
            }
        });
        
        document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
            if (!el.closest('.note-box') && !el.closest('.math-block')) {
                el.style.color = '#2d3748';
            }
        });
        
        const themeBtn = document.getElementById('themeToggle');
        if (themeBtn) {
            themeBtn.textContent = '🌓';
            themeBtn.title = 'Passer en mode nuit';
        }
    });
</script>
</body>
</html>
