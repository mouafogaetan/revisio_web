<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Présentation mobile</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' },
            options: { skipHtmlTypes: 'script' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 500px;
        margin: 0 auto;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    .slide-header {
        flex-shrink: 0;
        padding: 18px 16px 10px 16px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        z-index: 10;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .slide-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
    }

    .content-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 18px 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        flex-shrink: 0;
    }

    .content-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .content-card li {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        line-height: 1.5;
    }

    .content-card li:last-child {
        border-bottom: none;
    }

    .bullet-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
    }

    .math-block {
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        overflow-x: auto;
        flex-shrink: 0;
        margin: 4px 0;
    }

    .math-block .math {
        font-size: 1.2rem;
        color: #e2e8f0;
    }

    .note-box {
        background: rgba(96, 165, 250, 0.08);
        border-left: 4px solid #60a5fa;
        padding: 12px 16px;
        border-radius: 12px;
        font-style: italic;
        font-size: 0.9rem;
        color: #cbd5e1;
        flex-shrink: 0;
    }

    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        border-radius: 0;
        flex-direction: column;
    }

    .loading-card {
        background: #1e293b;
        padding: 32px 28px;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #334155;
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px auto;
    }

    .loading-text {
        font-weight: 600;
        font-size: 1.1rem;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    .loading-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 16px;
    }
    .loading-progress {
        height: 3px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        animation: loadingProgress 30s ease-out forwards;
    }

    .loading-timeout {
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 12px;
    }

    .btn-cancel-loading {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 40px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #f87171;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }

    .btn-cancel-loading:active {
        transform: scale(0.94);
        background: rgba(239, 68, 68, 0.25);
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
    }

    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .slide-counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255,255,255,0.05);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(255,255,255,0.04);
    }

    .status-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 30px;
        background: rgba(96, 165, 250, 0.12);
        color: #93bbfc;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
    }

    .status-badge .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: pulse-dot 1.2s infinite;
        flex-shrink: 0;
    }

    .status-badge.idle .dot {
        animation: none;
        background: #64748b;
    }
    .status-badge.speaking .dot {
        background: #34d399;
        animation: pulse-dot 0.8s infinite;
    }
    .status-badge.error .dot {
        background: #f87171;
        animation: none;
    }
    .status-badge.paused .dot {
        animation: none;
        background: #fbbf24;
    }
    .status-badge.waiting .dot {
        animation: pulse-dot 1.5s infinite;
        background: #fbbf24;
    }
    .status-badge.loading .dot {
        animation: pulse-dot 0.5s infinite;
        background: #60a5fa;
    }

    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.7); }
    }

    .footer-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(255,255,255,0.1);
    }

    .btn-secondary {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-play {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
        min-width: 80px;
        justify-content: center;
    }
    .btn-play:active {
        background: rgba(52, 211, 153, 0.25);
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
    }

    .auto-indicator {
        font-size: 0.65rem;
        color: #64748b;
        text-align: center;
        letter-spacing: 0.3px;
        padding: 2px 0;
    }

    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.2rem;
        }
        .content-card li {
            font-size: 0.9rem;
            padding: 8px 0;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .btn-play {
            min-width: 60px;
        }
        .footer-buttons {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
        .loading-card {
            padding: 20px 16px;
        }
        .math-block .math {
            font-size: 1rem;
        }
    }

    @media (min-width: 600px) {
        .app-container {
            max-width: 480px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
        .loading-overlay {
            border-radius: 32px;
        }
    }

    /* Mode jour (par défaut) */
    html, body {
        background: #f0f4f8 !important;
        color: #1a202c !important;
    }
    .app-container {
        background: linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%) !important;
    }
    .slide-header {
        background: rgba(255, 255, 255, 0.85) !important;
        border-bottom: 1px solid rgba(0,0,0,0.08) !important;
    }
    .slide-header h1 {
        background: linear-gradient(135deg, #2b6cb0, #6b46c1) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        background-clip: text !important;
    }
    .slide-footer {
        background: rgba(255, 255, 255, 0.9) !important;
        border-top: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card {
        background: rgba(255,255,255,0.8) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card li {
        border-bottom: 1px solid rgba(0,0,0,0.05) !important;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.12) !important;
        border-left: 4px solid #4299e1 !important;
        color: #2c3e50 !important;
    }
    .math-block {
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .math-block .math {
        color: #2d3748 !important;
    }
    .slide-counter {
        color: #4a5568 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .status-badge {
        background: rgba(96, 165, 250, 0.15) !important;
        color: #2b6cb0 !important;
        border: 1px solid rgba(96, 165, 250, 0.15) !important;
    }
    .btn {
        color: #2d3748 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .btn-secondary {
        background: rgba(0,0,0,0.04) !important;
        border-color: rgba(0,0,0,0.08) !important;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15) !important;
        border-color: rgba(52, 211, 153, 0.2) !important;
        color: #38a169 !important;
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15) !important;
        border-color: rgba(251, 191, 36, 0.2) !important;
        color: #d69e2e !important;
    }
    .auto-indicator {
        color: #718096 !important;
    }
    .loading-card {
        background: #ffffff !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .loading-text {
        color: #1a202c !important;
    }
    .loading-sub {
        color: #4a5568 !important;
    }
</style>
</head>
<body>

<div class="app-container">

    <header class="slide-header">
        <h1 id="slideTitle">Chargement...</h1>
    </header>

    <main class="slide-body" id="slideBody"></main>

    <!-- LOADING OVERLAY AVEC BOUTON ANNULER -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Préparation vocale...</div>
            <div class="loading-sub" id="loadingSub">Synthèse en cours</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loadingProgressBar"></div>
            </div>
            <div class="loading-timeout" id="loadingTimeout">⏱️ 30 secondes maximum</div>
            <button class="btn-cancel-loading" id="cancelLoadingBtn">
                <span>✕</span> Annuler
            </button>
        </div>
    </div>

    <footer class="slide-footer">
        <div class="footer-top">
            <span class="slide-counter" id="slideCounter">1 / 3</span>
            <span class="status-badge idle" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">Prêt</span>
            </span>
        </div>

        <div class="footer-buttons">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-secondary" id="replayBtn">
                <span class="btn-icon">🔁</span> <span class="btn-label">Relire</span>
            </button>
            <button class="btn btn-play" id="playBtn">
                <span class="btn-icon">▶</span> <span class="btn-label">Play</span>
            </button>
        </div>

        <div class="auto-indicator" id="autoIndicator">⏸ Lecture manuelle</div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // SLIDES
    // ================================================================
   const slides = [
  {
    "titre": "La valeur absolue : introduction",
    "contenu": "<div style='background-color: #E8EAF6; padding: 20px; border-radius: 10px; color: #1A237E;'><h3 style='margin-top: 0;'>Qu'est-ce que la valeur absolue ?</h3><p>La <strong>valeur absolue</strong> d'un nombre réel x, notée <span class='math'>\\( |x| \\)</span>, est sa <strong>distance à zéro</strong> sur la droite des réels.</p><p>Une distance est toujours <strong>positive ou nulle</strong>.</p><ul style='text-align: left; list-style-type: disc; padding-left: 20px; font-size: 1rem;'><li><span class='math'>\\( |x| \\)</span> représente la distance entre x et 0.</li><li><span class='math'>\\( |x - y| \\)</span> représente la distance entre x et y.</li><li>La valeur absolue ne peut jamais être négative.</li></ul></div><div style='background-color: #FFF3E0; padding: 15px; border-radius: 8px; margin-top: 10px; color: #E65100;'><h4 style='margin-top: 0;'>Exemples simples</h4><p><span class='math'>\\( |5| = 5 \\)</span> (5 est à 5 unités de 0)</p><p><span class='math'>\\( |-3| = 3 \\)</span> (-3 est à 3 unités de 0)</p><p><span class='math'>\\( |0| = 0 \\)</span></p></div>",
    "texteParle": "Commençons par définir la valeur absolue. La valeur absolue d'un nombre réel x, notée avec deux barres verticales autour de x, est sa distance à zéro sur la droite des réels. Une distance est toujours positive ou nulle. Par exemple, la valeur absolue de 5 est 5, car 5 est à 5 unités de zéro. La valeur absolue de moins 3 est 3, car moins 3 est à 3 unités de zéro. La valeur absolue de 0 est 0. Plus généralement, la valeur absolue de x moins y représente la distance entre x et y sur la droite des réels. La valeur absolue ne peut jamais être négative.",
    "note": "|x| = distance entre x et 0 sur la droite des réels."
  },
  {
    "titre": "Définition formelle de la valeur absolue",
    "contenu": "<div style='background-color: #E3F2FD; padding: 20px; border-radius: 10px; color: #0D47A1;'><h3 style='margin-top: 0;'>Définition par cas</h3><p>La valeur absolue se définit de la manière suivante :</p><div class='math-block'><div class='math'>$$ |x| = \\begin{cases} x & \\text{si } x \\ge 0 \\\\ -x & \\text{si } x < 0 \\end{cases} $$</div></div><ul style='text-align: left; list-style-type: disc; padding-left: 20px; font-size: 1rem;'><li>Si x est <strong>positif ou nul</strong>, sa valeur absolue est x lui-même.</li><li>Si x est <strong>strictement négatif</strong>, sa valeur absolue est son opposé −x.</li></ul></div><div style='background-color: #FFF3E0; padding: 15px; border-radius: 8px; margin-top: 10px; color: #E65100;'><h4 style='margin-top: 0;'>Exemples détaillés</h4><p><span class='math'>\\( |7| = 7 \\)</span> car 7 ≥ 0</p><p><span class='math'>\\( |-7| = -(-7) = 7 \\)</span> car −7 < 0</p><p><span class='math'>\\( |0| = 0 \\)</span></p><p><span class='math'>\\( \\left|-\\frac{3}{4}\\right| = \\frac{3}{4} \\)</span></p></div><div style='background-color: #E8F5E9; padding: 15px; border-radius: 8px; margin-top: 10px; color: #1B5E20;'><h4 style='margin-top: 0;'>À retenir</h4><p>La valeur absolue <strong>enlève le signe négatif</strong> mais ne change pas un nombre positif.</p><p><span class='math'>\\( |x| \\ge 0 \\)</span> pour tout réel x.</p></div>",
    "texteParle": "Voici la définition formelle de la valeur absolue. Elle se définit par cas. Si x est positif ou nul, alors la valeur absolue de x est x lui-même. Si x est strictement négatif, alors la valeur absolue de x est son opposé, c'est-à-dire moins x. Par exemple, la valeur absolue de 7 est 7, car 7 est positif. La valeur absolue de moins 7 est moins moins 7, soit 7, car moins 7 est négatif. La valeur absolue de 0 est 0. La valeur absolue de moins 3 quarts est 3 quarts. En résumé, la valeur absolue enlève le signe négatif, mais ne change pas un nombre positif. Et pour tout réel x, la valeur absolue de x est toujours positive ou nulle.",
    "note": "|x| = x si x ≥ 0, et |x| = −x si x < 0."
  },
  {
    "titre": "Propriétés de la valeur absolue",
    "contenu": "<div style='background-color: #F3E5F5; padding: 20px; border-radius: 10px; color: #4A148C;'><h3 style='margin-top: 0;'>Propriétés fondamentales</h3><ul style='text-align: left; list-style-type: disc; padding-left: 20px; font-size: 1rem;'><li><span class='math'>\\( |x| \\ge 0 \\)</span> pour tout réel x</li><li><span class='math'>\\( |x| = 0 \\iff x = 0 \\)</span></li><li><span class='math'>\\( |-x| = |x| \\)</span></li><li><span class='math'>\\( |xy| = |x| \\times |y| \\)</span></li><li><span class='math'>\\( \\left|\\frac{x}{y}\\right| = \\frac{|x|}{|y|} \\)</span> (si y ≠ 0)</li><li><span class='math'>\\( |x| = |y| \\iff x = y \\text{ ou } x = -y \\)</span></li></ul></div><div style='background-color: #FFF3E0; padding: 15px; border-radius: 8px; margin-top: 10px; color: #E65100;'><h4 style='margin-top: 0;'>Exemples</h4><p><span class='math'>\\( |-5| = |5| = 5 \\)</span></p><p><span class='math'>\\( |(-3) \\times 4| = |-12| = 12 = 3 \\times 4 = |-3| \\times |4| \\)</span></p><p><span class='math'>\\( |x| = 3 \\iff x = 3 \\text{ ou } x = -3 \\)</span></p></div>",
    "texteParle": "Voici les propriétés fondamentales de la valeur absolue. Premièrement, la valeur absolue de x est toujours positive ou nulle. Deuxièmement, la valeur absolue de x est nulle si et seulement si x est nul. Troisièmement, la valeur absolue de moins x est égale à la valeur absolue de x. Quatrièmement, la valeur absolue d'un produit est égale au produit des valeurs absolues. Cinquièmement, la valeur absolue d'un quotient est égale au quotient des valeurs absolues, à condition que le dénominateur soit non nul. Enfin, la valeur absolue de x est égale à la valeur absolue de y si et seulement si x égale y ou x égale moins y. Par exemple, la valeur absolue de moins 5 est égale à la valeur absolue de 5, soit 5. La valeur absolue de moins 3 fois 4 est la valeur absolue de moins 12, soit 12, qui est aussi égale à 3 fois 4. Et si la valeur absolue de x est égale à 3, alors x vaut 3 ou x vaut moins 3.",
    "note": "|xy| = |x|·|y| et |x/y| = |x|/|y|."
  },
  {
    "titre": "Inégalité triangulaire",
    "contenu": "<div style='background-color: #E0F7FA; padding: 20px; border-radius: 10px; color: #006064;'><h3 style='margin-top: 0;'>Inégalité triangulaire</h3><p>Pour tous réels a et b :</p><div class='math-block'><div class='math'>$$ |a + b| \\le |a| + |b| $$</div></div><p>Cette inégalité est fondamentale en mathématiques.</p><p>De plus :</p><div class='math-block'><div class='math'>$$ |a| - |b| \\le |a + b| \\le |a| + |b| $$</div></div></div><div style='background-color: #FFF3E0; padding: 15px; border-radius: 8px; margin-top: 10px; color: #E65100;'><h4 style='margin-top: 0;'>Exemples</h4><p><span class='math'>\\( |3 + 4| = |7| = 7 \\)</span> et <span class='math'>\\( |3| + |4| = 3 + 4 = 7 \\)</span> → égalité</p><p><span class='math'>\\( |3 + (-5)| = |-2| = 2 \\)</span> et <span class='math'>\\( |3| + |-5| = 3 + 5 = 8 \\)</span> → 2 < 8</p><p><span class='math'>\\( |(-3) + (-4)| = |-7| = 7 \\)</span> et <span class='math'>\\( |-3| + |-4| = 3 + 4 = 7 \\)</span> → égalité</p></div><div style='background-color: #E8F5E9; padding: 15px; border-radius: 8px; margin-top: 10px; color: #1B5E20;'><h4 style='margin-top: 0;'>Cas d'égalité</h4><p>L'égalité <span class='math'>\\( |a + b| = |a| + |b| \\)</span> a lieu si et seulement si a et b sont de <strong>même signe</strong> (ou l'un des deux est nul).</p></div>",
    "texteParle": "Parmi les propriétés de la valeur absolue, l'inégalité triangulaire est fondamentale. Pour tous réels a et b, la valeur absolue de a plus b est inférieure ou égale à la valeur absolue de a plus la valeur absolue de b. Plus précisément, on a : valeur absolue de a moins valeur absolue de b, inférieure ou égale à valeur absolue de a plus b, inférieure ou égale à valeur absolue de a plus valeur absolue de b. Par exemple, la valeur absolue de 3 plus 4 est 7, et la valeur absolue de 3 plus la valeur absolue de 4 est aussi 7. Il y a égalité. Mais la valeur absolue de 3 plus moins 5 est la valeur absolue de moins 2, soit 2, alors que la valeur absolue de 3 plus la valeur absolue de moins 5 est 3 plus 5, soit 8. Donc 2 est bien inférieur à 8. L'égalité a lieu si et seulement si a et b sont de même signe, ou si l'un des deux est nul.",
    "note": "|a + b| ≤ |a| + |b| — l'égalité si a et b sont de même signe."
  },
  {
    "titre": "Valeur absolue et distance",
    "contenu": "<div style='background-color: #E8F5E9; padding: 20px; border-radius: 10px; color: #1B5E20;'><h3 style='margin-top: 0;'>Interprétation en termes de distance</h3><p>Sur la droite des réels :</p><ul style='text-align: left; list-style-type: disc; padding-left: 20px; font-size: 1rem;'><li><span class='math'>\\( |x| \\)</span> = distance entre x et 0</li><li><span class='math'>\\( |x - a| \\)</span> = distance entre x et a</li><li><span class='math'>\\( |x - a| = r \\)</span> signifie que x est à une distance r de a</li><li><span class='math'>\\( |x - a| < r \\)</span> signifie que x est à une distance inférieure à r de a</li></ul></div><div style='background-color: #FFF3E0; padding: 15px; border-radius: 8px; margin-top: 10px; color: #E65100;'><h4 style='margin-top: 0;'>Exemples</h4><p><span class='math'>\\( |x - 3| = 2 \\)</span> : x est à une distance 2 de 3, donc x = 1 ou x = 5.</p><p><span class='math'>\\( |x - 3| < 2 \\)</span> : x est à une distance inférieure à 2 de 3, donc <span class='math'>\\( 1 < x < 5 \\)</span>.</p><p><span class='math'>\\( |x + 1| \\le 4 \\)</span> : x est à une distance inférieure ou égale à 4 de −1, donc <span class='math'>\\( -5 \\le x \\le 3 \\)</span>.</p></div><div style='background-color: #E3F2FD; padding: 15px; border-radius: 8px; margin-top: 10px; color: #0D47A1;'><h4 style='margin-top: 0;'>Représentation sur la droite</h4><p>L'ensemble des x tels que <span class='math'>\\( |x - a| \\le r \\)</span> est un <strong>intervalle centré en a</strong> de rayon r : <span class='math'>\\( [a - r, a + r] \\)</span>.</p></div>",
    "texteParle": "La valeur absolue a une interprétation géométrique très utile en termes de distance. Sur la droite des réels, la valeur absolue de x est la distance entre x et 0. Plus généralement, la valeur absolue de x moins a est la distance entre x et a. Ainsi, l'équation valeur absolue de x moins a égale r signifie que x est à une distance r de a. Par exemple, valeur absolue de x moins 3 égale 2 signifie que x est à une distance 2 de 3, donc x vaut 1 ou x vaut 5. L'inéquation valeur absolue de x moins 3 inférieure à 2 signifie que x est à une distance inférieure à 2 de 3, donc x est compris entre 1 et 5. De même, valeur absolue de x plus 1 inférieure ou égale à 4 signifie que x est à une distance inférieure ou égale à 4 de moins 1, donc x est compris entre moins 5 et 3. L'ensemble des x tels que valeur absolue de x moins a inférieure ou égale à r est un intervalle centré en a de rayon r.",
    "note": "|x − a| = distance entre x et a sur la droite des réels."
  },
  {
    "titre": "Équations avec valeur absolue",
    "contenu": "<div style='background-color: #FCE4EC; padding: 20px; border-radius: 10px; color: #880E4F;'><h3 style='margin-top: 0;'>Résoudre des équations avec valeur absolue</h3><p><strong>Type 1 :</strong> <span class='math'>\\( |x| = a \\)</span> avec <span class='math'>\\( a > 0 \\)</span></p><p><span class='math'>\\( |x| = a \\iff x = a \\text{ ou } x = -a \\)</span></p><p><strong>Type 2 :</strong> <span class='math'>\\( |x| = a \\)</span> avec <span class='math'>\\( a < 0 \\)</span></p><p>Pas de solution, car <span class='math'>\\( |x| \\ge 0 \\)</span>.</p><p><strong>Type 3 :</strong> <span class='math'>\\( |x - b| = a \\)</span> avec <span class='math'>\\( a > 0 \\)</span></p><p><span class='math'>\\( |x - b| = a \\iff x - b = a \\text{ ou } x - b = -a \\)</span></p><p>Donc <span class='math'>\\( x = b + a \\)</span> ou <span class='math'>\\( x = b - a \\)</span>.</p></div><div style='background-color: #FFF3E0; padding: 15px; border-radius: 8px; margin-top: 10px; color: #E65100;'><h4 style='margin-top: 0;'>Exemples</h4><p><span class='math'>\\( |x| = 5 \\iff x = 5 \\text{ ou } x = -5 \\)</span></p><p><span class='math'>\\( |x - 2| = 3 \\iff x - 2 = 3 \\text{ ou } x - 2 = -3 \\)</span></p><p>Donc <span class='math'>\\( x = 5 \\)</span> ou <span class='math'>\\( x = -1 \\)</span>.</p><p><span class='math'>\\( |2x + 1| = 7 \\iff 2x + 1 = 7 \\text{ ou } 2x + 1 = -7 \\)</span></p><p>Donc <span class='math'>\\( x = 3 \\)</span> ou <span class='math'>\\( x = -4 \\)</span>.</p></div>",
    "texteParle": "Voyons comment résoudre des équations avec valeur absolue. Premier type : valeur absolue de x égale a, avec a positif. Alors x égale a ou x égale moins a. Par exemple, valeur absolue de x égale 5 donne x égale 5 ou x égale moins 5. Deuxième type : valeur absolue de x égale a, avec a négatif. Il n'y a pas de solution, car la valeur absolue est toujours positive ou nulle. Troisième type : valeur absolue de x moins b égale a, avec a positif. Alors x moins b égale a ou x moins b égale moins a, ce qui donne x égale b plus a ou x égale b moins a. Par exemple, valeur absolue de x moins 2 égale 3 donne x moins 2 égale 3 ou x moins 2 égale moins 3, donc x égale 5 ou x égale moins 1. Autre exemple : valeur absolue de 2x plus 1 égale 7 donne 2x plus 1 égale 7 ou 2x plus 1 égale moins 7, donc x égale 3 ou x égale moins 4.",
    "note": "|x| = a (a > 0) ⇔ x = a ou x = −a."
  },
  {
    "titre": "Inéquations avec valeur absolue",
    "contenu": "<div style='background-color: #E3F2FD; padding: 20px; border-radius: 10px; color: #0D47A1;'><h3 style='margin-top: 0;'>Résoudre des inéquations avec valeur absolue</h3><p><strong>Type 1 :</strong> <span class='math'>\\( |x| \\le a \\)</span> avec <span class='math'>\\( a > 0 \\)</span></p><p><span class='math'>\\( |x| \\le a \\iff -a \\le x \\le a \\)</span></p><p><strong>Type 2 :</strong> <span class='math'>\\( |x| \\ge a \\)</span> avec <span class='math'>\\( a > 0 \\)</span></p><p><span class='math'>\\( |x| \\ge a \\iff x \\le -a \\text{ ou } x \\ge a \\)</span></p><p><strong>Type 3 :</strong> <span class='math'>\\( |x - b| \\le a \\)</span> avec <span class='math'>\\( a > 0 \\)</span></p><p><span class='math'>\\( |x - b| \\le a \\iff b - a \\le x \\le b + a \\)</span></p></div><div style='background-color: #FFF3E0; padding: 15px; border-radius: 8px; margin-top: 10px; color: #E65100;'><h4 style='margin-top: 0;'>Exemples</h4><p><span class='math'>\\( |x| \\le 3 \\iff -3 \\le x \\le 3 \\)</span></p><p><span class='math'>\\( |x| \\ge 3 \\iff x \\le -3 \\text{ ou } x \\ge 3 \\)</span></p><p><span class='math'>\\( |x - 2| \\le 5 \\iff -5 \\le x - 2 \\le 5 \\iff -3 \\le x \\le 7 \\)</span></p><p><span class='math'>\\( |2x + 1| < 7 \\iff -7 < 2x + 1 < 7 \\iff -8 < 2x < 6 \\iff -4 < x < 3 \\)</span></p></div><div style='background-color: #E8F5E9; padding: 15px; border-radius: 8px; margin-top: 10px; color: #1B5E20;'><h4 style='margin-top: 0;'>Représentation</h4><p>L'ensemble des solutions est un <strong>intervalle</strong> (pour ≤) ou une <strong>réunion d'intervalles</strong> (pour ≥).</p></div>",
    "texteParle": "Passons aux inéquations avec valeur absolue. Premier type : valeur absolue de x inférieure ou égale à a, avec a positif. Cela signifie que x est compris entre moins a et a. Par exemple, valeur absolue de x inférieure ou égale à 3 donne x compris entre moins 3 et 3. Deuxième type : valeur absolue de x supérieure ou égale à a, avec a positif. Cela signifie que x est inférieur ou égal à moins a, ou supérieur ou égal à a. Par exemple, valeur absolue de x supérieure ou égale à 3 donne x inférieur ou égal à moins 3 ou x supérieur ou égal à 3. Troisième type : valeur absolue de x moins b inférieure ou égale à a. Cela donne x compris entre b moins a et b plus a. Par exemple, valeur absolue de x moins 2 inférieure ou égale à 5 donne x compris entre moins 3 et 7. Autre exemple : valeur absolue de 2x plus 1 inférieure à 7 donne 2x plus 1 compris entre moins 7 et 7, ce qui donne x compris entre moins 4 et 3. L'ensemble des solutions est un intervalle pour les inéquations de type inférieur ou égal, et une réunion d'intervalles pour les inéquations de type supérieur ou égal.",
    "note": "|x| ≤ a ⇔ −a ≤ x ≤ a ; |x| ≥ a ⇔ x ≤ −a ou x ≥ a."
  },
  {
    "titre": "Valeur absolue et expressions algébriques",
    "contenu": "<div style='background-color: #F3E5F5; padding: 20px; border-radius: 10px; color: #4A148C;'><h3 style='margin-top: 0;'>Simplifier des expressions avec valeur absolue</h3><p>Pour simplifier une expression contenant <span class='math'>\\( |A(x)| \\)</span>, il faut étudier le <strong>signe de A(x)</strong>.</p><p><strong>Exemple :</strong> Simplifier <span class='math'>\\( |x - 3| \\)</span> selon les valeurs de x.</p><ul style='text-align: left; list-style-type: disc; padding-left: 20px; font-size: 1rem;'><li>Si <span class='math'>\\( x \\ge 3 \\)</span> : <span class='math'>\\( x - 3 \\ge 0 \\)</span>, donc <span class='math'>\\( |x - 3| = x - 3 \\)</span></li><li>Si <span class='math'>\\( x < 3 \\)</span> : <span class='math'>\\( x - 3 < 0 \\)</span>, donc <span class='math'>\\( |x - 3| = -(x - 3) = 3 - x \\)</span></li></ul></div><div style='background-color: #FFF3E0; padding: 15px; border-radius: 8px; margin-top: 10px; color: #E65100;'><h4 style='margin-top: 0;'>Exemple plus complexe</h4><p>Simplifier <span class='math'>\\( |2x + 1| \\)</span> :</p><ul style='text-align: left; list-style-type: disc; padding-left: 20px; font-size: 1rem;'><li>Si <span class='math'>\\( 2x + 1 \\ge 0 \\)</span>, c'est-à-dire <span class='math'>\\( x \\ge -\\frac{1}{2} \\)</span> : <span class='math'>\\( |2x + 1| = 2x + 1 \\)</span></li><li>Si <span class='math'>\\( 2x + 1 < 0 \\)</span>, c'est-à-dire <span class='math'>\\( x < -\\frac{1}{2} \\)</span> : <span class='math'>\\( |2x + 1| = -2x - 1 \\)</span></li></ul></div><div style='background-color: #E8F5E9; padding: 15px; border-radius: 8px; margin-top: 10px; color: #1B5E20;'><h4 style='margin-top: 0;'>Méthode</h4><p>Toujours étudier le signe de l'expression à l'intérieur de la valeur absolue, puis utiliser la définition par cas.</p></div>",
    "texteParle": "Pour simplifier des expressions contenant une valeur absolue, il faut étudier le signe de l'expression à l'intérieur. Par exemple, pour simplifier valeur absolue de x moins 3, on étudie le signe de x moins 3. Si x est supérieur ou égal à 3, alors x moins 3 est positif, donc la valeur absolue de x moins 3 est x moins 3. Si x est inférieur à 3, alors x moins 3 est négatif, donc la valeur absolue de x moins 3 est moins x moins 3, ce qui donne 3 moins x. Pour une expression plus complexe comme valeur absolue de 2x plus 1, on cherche la valeur qui annule 2x plus 1, c'est-à-dire x égale moins 1 demi. Si x est supérieur ou égal à moins 1 demi, alors 2x plus 1 est positif, donc la valeur absolue est 2x plus 1. Si x est inférieur à moins 1 demi, alors 2x plus 1 est négatif, donc la valeur absolue est moins 2x moins 1. La méthode est toujours la même : étudier le signe de l'expression à l'intérieur de la valeur absolue, puis utiliser la définition par cas.",
    "note": "Étudier le signe de l'expression à l'intérieur de la valeur absolue."
  },
  {
    "titre": "Exemples d'applications complexes",
    "contenu": "<div style='background-color: #E0F7FA; padding: 20px; border-radius: 10px; color: #006064;'><h3 style='margin-top: 0;'>Application : résoudre une équation avec valeur absolue</h3><p><strong>Exemple :</strong> Résoudre <span class='math'>\\( |x - 2| + |x + 1| = 5 \\)</span>.</p><p><strong>Méthode :</strong> on étudie le signe de chaque expression et on résout par intervalles.</p><ul style='text-align: left; list-style-type: disc; padding-left: 20px; font-size: 1rem;'><li>Si <span class='math'>\\( x \\ge 2 \\)</span> : <span class='math'>\\( (x - 2) + (x + 1) = 5 \\iff 2x - 1 = 5 \\iff x = 3 \\)</span></li><li>Si <span class='math'>\\( -1 \\le x < 2 \\)</span> : <span class='math'>\\( -(x - 2) + (x + 1) = 5 \\iff -x + 2 + x + 1 = 5 \\iff 3 = 5 \\)</span> → impossible</li><li>Si <span class='math'>\\( x < -1 \\)</span> : <span class='math'>\\( -(x - 2) - (x + 1) = 5 \\iff -x + 2 - x - 1 = 5 \\iff -2x + 1 = 5 \\iff x = -2 \\)</span></li></ul><p><strong>Solutions :</strong> <span class='math'>\\( x = 3 \\)</span> ou <span class='math'>\\( x = -2 \\)</span>.</p></div><div style='background-color: #FFF3E0; padding: 15px; border-radius: 8px; margin-top: 10px; color: #E65100;'><h4 style='margin-top: 0;'>Vérification</h4><p><span class='math'>\\( |3 - 2| + |3 + 1| = 1 + 4 = 5 \\)</span> ✓</p><p><span class='math'>\\( |-2 - 2| + |-2 + 1| = 4 + 1 = 5 \\)</span> ✓</p></div>",
    "texteParle": "Voyons un exemple d'application complexe : résoudre l'équation valeur absolue de x moins 2 plus valeur absolue de x plus 1 égale 5. On étudie le signe de chaque expression et on résout par intervalles. Premier cas : x supérieur ou égal à 2. Alors x moins 2 est positif et x plus 1 est positif. L'équation devient x moins 2 plus x plus 1 égale 5, soit 2x moins 1 égale 5, donc x égale 3. Deuxième cas : x compris entre moins 1 et 2. Alors x moins 2 est négatif et x plus 1 est positif. L'équation devient moins x moins 2 plus x plus 1 égale 5, ce qui donne moins x plus 2 plus x plus 1 égale 5, soit 3 égale 5, ce qui est impossible. Troisième cas : x inférieur à moins 1. Alors x moins 2 est négatif et x plus 1 est négatif. L'équation devient moins x moins 2 moins x plus 1 égale 5, ce qui donne moins x plus 2 moins x moins 1 égale 5, soit moins 2x plus 1 égale 5, donc x égale moins 2. Les solutions sont x égale 3 et x égale moins 2. On vérifie : pour x égale 3, valeur absolue de 1 plus valeur absolue de 4 égale 1 plus 4 égale 5. Pour x égale moins 2, valeur absolue de moins 4 plus valeur absolue de moins 1 égale 4 plus 1 égale 5. Les deux solutions sont correctes.",
    "note": "Résoudre par intervalles en étudiant le signe de chaque expression."
  },
  {
    "titre": "En résumé : la valeur absolue",
    "contenu": "<div style='background-color: #BBDEFB; padding: 20px; border-radius: 10px; text-align: center; color: #0D47A1;'><h3 style='margin-top: 0;'>Ce qu'il faut retenir</h3><ul style='text-align: left; list-style-type: disc; padding-left: 20px; font-size: 1rem;'><li><strong>Définition :</strong> <span class='math'>\\( |x| = x \\)</span> si <span class='math'>\\( x \\ge 0 \\)</span>, et <span class='math'>\\( |x| = -x \\)</span> si <span class='math'>\\( x < 0 \\)</span>.</li><li><strong>Distance :</strong> <span class='math'>\\( |x - a| \\)</span> = distance entre x et a.</li><li><strong>Propriétés :</strong> <span class='math'>\\( |xy| = |x| \\cdot |y| \\)</span> ; <span class='math'>\\( |x| = |y| \\iff x = y \\text{ ou } x = -y \\)</span>.</li><li><strong>Inégalité triangulaire :</strong> <span class='math'>\\( |a + b| \\le |a| + |b| \\)</span>.</li><li><strong>Équations :</strong> <span class='math'>\\( |x| = a \\iff x = a \\text{ ou } x = -a \\)</span> (a > 0).</li><li><strong>Inéquations :</strong> <span class='math'>\\( |x| \\le a \\iff -a \\le x \\le a \\)</span> ; <span class='math'>\\( |x| \\ge a \\iff x \\le -a \\text{ ou } x \\ge a \\)</span>.</li><li><strong>Simplification :</strong> étudier le signe de l'expression à l'intérieur.</li></ul></div>",
    "texteParle": "Pour conclure cette leçon sur la valeur absolue, retenons les points essentiels. La valeur absolue de x est égale à x si x est positif ou nul, et à moins x si x est négatif. Géométriquement, la valeur absolue de x moins a est la distance entre x et a. Les propriétés importantes sont : la valeur absolue d'un produit est le produit des valeurs absolues, et la valeur absolue de x égale la valeur absolue de y si et seulement si x égale y ou x égale moins y. L'inégalité triangulaire dit que la valeur absolue de a plus b est inférieure ou égale à la valeur absolue de a plus la valeur absolue de b. Pour les équations, valeur absolue de x égale a donne x égale a ou x égale moins a, avec a positif. Pour les inéquations, valeur absolue de x inférieure ou égale à a donne x compris entre moins a et a, et valeur absolue de x supérieure ou égale à a donne x inférieur ou égal à moins a ou x supérieur ou égal à a. Enfin, pour simplifier une expression avec valeur absolue, il faut étudier le signe de l'expression à l'intérieur. Ces notions sont essentielles pour la suite du cours.",
    "note": "La valeur absolue est une distance, toujours positive ou nulle."
  }
];

    // ================================================================

    function setStatus(text, type) {
        $statusText.text(text);
        $statusBadge.removeClass('idle speaking error paused waiting loading');
        if (type === 'speaking') $statusBadge.addClass('speaking');
        else if (type === 'error') $statusBadge.addClass('error');
        else if (type === 'paused') $statusBadge.addClass('paused');
        else if (type === 'waiting') $statusBadge.addClass('waiting');
        else if (type === 'loading') $statusBadge.addClass('loading');
        else $statusBadge.addClass('idle');
    }

    function updatePlayButton() {
        if (isPlaying) {
            $play.addClass('playing');
            $play.find('.btn-icon').text('⏸');
            $play.find('.btn-label').text('Pause');
        } else {
            $play.removeClass('playing');
            $play.find('.btn-icon').text('▶');
            $play.find('.btn-label').text('Play');
        }
    }

    function showLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        
        loadingCancelled = false;
        isLoading = true;
        
        // Réinitialiser la barre de progression
        $loadingProgressBar.css('animation', 'none');
        $loadingProgressBar.css('width', '0%');
        // Forcer un reflow
        $loadingProgressBar[0].offsetHeight;
        $loadingProgressBar.css('animation', 'loadingProgress 30s ease-out forwards');
        
        $loadingText.text('Préparation vocale...');
        $loadingSub.text('Synthèse en cours');
        $loadingTimeout.text('⏱️ 30 secondes maximum');
        $loading.fadeIn(300);
        setStatus("⏳ Chargement...", 'loading');
        
        // 🔥 TIMEOUT DE 30 SECONDES
        loadingTimeout = setTimeout(() => {
            if (isLoading && !loadingCancelled) {
                hideLoading();
                setStatus("⚠️ Délai dépassé (30s)", 'error');
                isPlaying = false;
                updatePlayButton();
                $loadingSub.text('La synthèse vocale a pris trop de temps');
                $loadingTimeout.text('❌ Délai dépassé');
            }
        }, 30000);
    }

    function hideLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        isLoading = false;
        loadingCancelled = false;
        $loading.fadeOut(300);
        // Ne pas changer le statut si on est en train de parler
        if (!isSpeaking && !isPlaying) {
            setStatus("⏸ Lecture arrêtée", 'paused');
        }
    }

    function cancelLoading() {
        loadingCancelled = true;
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        hideLoading();
        stopSpeaking();
        setStatus("⏸ Annulé", 'paused');
        isPlaying = false;
        updatePlayButton();
        $loadingText.text('Annulé par l\'utilisateur');
        $loadingSub.text('Vous pouvez réessayer');
        $loadingTimeout.text('✕ Annulation');
    }

    // Arrêter la parole proprement
    function stopSpeaking() {
        try {
            if (synth && (synth.speaking || synth.pending)) {
                synth.cancel();
            }
        } catch(e) {
            console.warn('Erreur stopSpeaking:', e);
        }
        if (currentUtterance) {
            try {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance.onstart = null;
            } catch(e) {}
            currentUtterance = null;
        }
        isSpeaking = false;
        isPlaying = false;
        updatePlayButton();
    }

    // Mettre en pause la parole
    function pauseSpeaking() {
        try {
            if (synth && synth.speaking) {
                synth.pause();
                isPaused = true;
                isPlaying = false;
                setStatus("⏸ Lecture en pause", 'paused');
                updatePlayButton();
            }
        } catch(e) {
            console.warn('Erreur pauseSpeaking:', e);
            stopSpeaking();
        }
    }

    // Reprendre la parole
    function resumeSpeaking() {
        try {
            if (synth && synth.paused) {
                synth.resume();
                isPaused = false;
                isPlaying = true;
                setStatus("🔊 Lecture en cours", 'speaking');
                updatePlayButton();
            } else if (!isSpeaking && !synth.speaking && !synth.pending) {
                speakSlide(currentIndex);
            }
        } catch(e) {
            console.warn('Erreur resumeSpeaking:', e);
            speakSlide(currentIndex);
        }
    }

    function renderSlide(index) {
        const slide = slides[index];
        $title.text(slide.titre);

        let html = '';
        html += `<div class="content-card">${slide.contenu}</div>`;
        if (slide.note) {
            html += `<div class="note-box">${slide.note}</div>`;
        }
        $body.html(html);
        $counter.text(`${index+1} / ${total}`);

        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
        }
    }

    // ================================================================
    // LECTURE VOCALE
    // ================================================================
    function speakSlide(index) {
        return new Promise((resolve) => {
            const slide = slides[index];
            const text = slide.texteParle;
            
            if (!text || text.trim() === '' || !speechSupported) {
                resolve();
                return;
            }

            if (!window.speechSynthesis) {
                setStatus("❌ Synthèse vocale non supportée", 'error');
                speechSupported = false;
                resolve();
                return;
            }

            // Arrêter toute lecture en cours
            stopSpeaking();
            
            // Réinitialiser l'état de pause
            isPaused = false;
            
            showLoading();
            setStatus("Initialisation...", 'loading');

            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.92;
                utterance.pitch = 1.05;
                utterance.volume = 1;

                let isFinished = false;
                let errorHandled = false;

                utterance.onstart = function() {
                    if (loadingCancelled) {
                        stopSpeaking();
                        resolve();
                        return;
                    }
                    hideLoading();
                    isSpeaking = true;
                    isPlaying = true;
                    isPaused = false;
                    setStatus("🔊 Lecture en cours", 'speaking');
                    updatePlayButton();
                };

                utterance.onend = function() {
                    if (isFinished) return;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    setStatus("✅ Terminé", 'idle');
                    hideLoading();
                    updatePlayButton();
                    resolve();
                };

                utterance.onerror = function(e) {
                    if (isFinished || errorHandled) return;
                    errorHandled = true;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    hideLoading();
                    updatePlayButton();
                    
                    if (e.error === 'not-allowed') {
                        setStatus("⚠️ Permission refusée", 'error');
                    } else if (e.error === 'synthesis-unavailable') {
                        setStatus("⚠️ Synthèse indisponible", 'error');
                    } else if (e.error === 'canceled') {
                        setStatus("⏸ Annulé", 'paused');
                    } else {
                        setStatus("❌ Erreur audio: " + (e.error || 'inconnue'), 'error');
                    }
                    
                    resolve();
                };

                // Gestion du chargement des voix
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = function() {
                        if (!loadingCancelled) {
                            try {
                                synth.speak(utterance);
                            } catch(err) {
                                // Silencieux
                            }
                        }
                        synth.onvoiceschanged = null;
                    };
                }

                currentUtterance = utterance;
                
                if (!loadingCancelled) {
                    try {
                        synth.speak(utterance);
                    } catch(err) {
                        setTimeout(() => {
                            if (!loadingCancelled) {
                                try {
                                    synth.speak(utterance);
                                } catch(e) {
                                    setStatus("❌ Erreur de lecture", 'error');
                                    isPlaying = false;
                                    updatePlayButton();
                                    hideLoading();
                                    resolve();
                                }
                            } else {
                                resolve();
                            }
                        }, 100);
                    }
                } else {
                    resolve();
                }

            } catch(err) {
                hideLoading();
                setStatus("❌ Erreur générale", 'error');
                isPlaying = false;
                updatePlayButton();
                console.error('Erreur speakSlide:', err);
                resolve();
            }
        });
    }

    // ================================================================
    // NAVIGATION
    // ================================================================
    async function goToSlide(index) {
        if (isTransitioning) return;
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        
        // Si on est en train de lire, on met en pause avant de naviguer
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        // Arrêter complètement la lecture
        stopSpeaking();
        
        await new Promise(r => setTimeout(r, 50));
        
        if (index === currentIndex) {
            setStatus("📄 Slide actuel", 'idle');
            return;
        }

        isTransitioning = true;
        currentIndex = index;
        renderSlide(index);
        
        // Réinitialiser l'état de lecture
        isPlaying = false;
        updatePlayButton();
        setStatus("⏸ Lecture arrêtée", 'paused');

        await new Promise(r => setTimeout(r, 150));
        isTransitioning = false;
    }

    async function goToNext() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex + 1 < total) {
            await goToSlide(currentIndex + 1);
        } else {
            setStatus("🏁 Dernier slide", 'idle');
        }
    }

    async function goToPrev() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex - 1 >= 0) {
            await goToSlide(currentIndex - 1);
        } else {
            setStatus("🔁 Premier slide", 'idle');
        }
    }

    // ================================================================
    // GESTION PLAY/PAUSE
    // ================================================================
    function togglePlay() {
        if (!userInteracted) {
            userInteracted = true;
        }

        // Si le chargement est en cours, on l'annule
        if (isLoading) {
            cancelLoading();
            return;
        }

        // Si le synthétiseur est en pause, on reprend
        if (synth && synth.paused) {
            resumeSpeaking();
            return;
        }

        // Si la lecture est en cours, on met en pause
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
            return;
        }

        // Sinon, on démarre la lecture du slide courant
        if (!isSpeaking && !isPlaying) {
            stopSpeaking();
            speakSlide(currentIndex);
        }
    }

    // ================================================================
    // INIT
    // ================================================================
    async function init() {
        // Vérifier la compatibilité
        if (!window.speechSynthesis) {
            setStatus("❌ Synthèse vocale non supportée", 'error');
            speechSupported = false;
        }

        // Précharger les voix
        try {
            if (synth.getVoices) {
                synth.getVoices();
                setTimeout(() => {
                    try {
                        synth.getVoices();
                    } catch(e) {}
                }, 200);
            }
        } catch(e) {
            console.warn('Erreur chargement voix:', e);
        }

        // Afficher le premier slide
        renderSlide(0);
        $counter.text(`1 / ${total}`);
        
        // État initial
        setStatus("⏸ Appuie sur Play", 'paused');
        updatePlayButton();
        $autoIndicator.text('⏸ Lecture manuelle');

        // ================================================================
        // ÉVÉNEMENTS
        // ================================================================
        
        // Bouton Play/Pause
        $play.on('click', function() {
            togglePlay();
        });

        // Bouton Annuler le chargement
        $cancelLoading.on('click', function() {
            cancelLoading();
        });

        // Navigation
        $prev.on('click', function() {
            // Si chargement en cours, on annule
            if (isLoading) cancelLoading();
            goToPrev();
        });

        $next.on('click', function() {
            if (isLoading) cancelLoading();
            goToNext();
        });

        // Replay - relire le slide courant
        $replay.on('click', function() {
            if (isLoading) cancelLoading();
            stopSpeaking();
            setTimeout(() => {
                speakSlide(currentIndex);
            }, 100);
        });

        // Support du clavier (espace pour play/pause)
        $(document).on('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });

        // Nettoyage
        $(window).on('beforeunload', function() {
            try {
                if (synth.speaking) synth.cancel();
            } catch(e) {}
            hideLoading();
        });

        // Gérer les cas où la synthèse se termine de manière inattendue
        setInterval(() => {
            if (isPlaying && !synth.speaking && !synth.pending && !isPaused && !isLoading) {
                isPlaying = false;
                updatePlayButton();
                setStatus("⏸ Lecture arrêtée", 'paused');
            }
        }, 1000);
    }

    init();
});



    // ================================================================
    // GESTION DU THÈME JOUR/NUIT
    // ================================================================
    let isDarkMode = false;

    function toggleTheme() {
        isDarkMode = !isDarkMode;
        const body = document.body;
        const appContainer = document.querySelector('.app-container');
        const header = document.querySelector('.slide-header');
        const footer = document.querySelector('.slide-footer');
        const contentCards = document.querySelectorAll('.content-card');
        const noteBoxes = document.querySelectorAll('.note-box');
        const mathBlocks = document.querySelectorAll('.math-block');
        const buttons = document.querySelectorAll('.btn');
        const statusBadge = document.querySelector('.status-badge');
        const slideCounter = document.querySelector('.slide-counter');
        const autoIndicator = document.querySelector('.auto-indicator');
        const themeBtn = document.getElementById('themeToggle');

        if (isDarkMode) {
            // Mode nuit
            body.style.background = '#0b1120';
            body.style.color = '#f1f5f9';
            appContainer.style.background = 'linear-gradient(145deg, #0f172a 0%, #1e293b 100%)';
            header.style.background = 'rgba(15, 23, 42, 0.85)';
            footer.style.background = 'rgba(15, 23, 42, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.05)';
                card.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.08)';
                note.style.color = '#cbd5e1';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.25)';
                block.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#e2e8f0';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.12)';
                statusBadge.style.color = '#93bbfc';
            }
            if (slideCounter) {
                slideCounter.style.color = '#94a3b8';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#64748b';
            }
            if (themeBtn) {
                themeBtn.textContent = '☀️';
                themeBtn.title = 'Passer en mode jour';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#e2e8f0';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#e2e8f0';
                }
            });
        } else {
            // Mode jour (par défaut)
            body.style.background = '#f0f4f8';
            body.style.color = '#1a202c';
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
            header.style.background = 'rgba(255, 255, 255, 0.85)';
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.8)';
                card.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.12)';
                note.style.color = '#2c3e50';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.05)';
                block.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#2d3748';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
                statusBadge.style.color = '#2b6cb0';
            }
            if (slideCounter) {
                slideCounter.style.color = '#4a5568';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#718096';
            }
            if (themeBtn) {
                themeBtn.textContent = '🌓';
                themeBtn.title = 'Passer en mode nuit';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#2c3e50';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#2d3748';
                }
            });
        }
    }

    // Initialiser en mode jour
    document.addEventListener('DOMContentLoaded', function() {
        // Appliquer le mode jour par défaut
        const body = document.body;
        body.style.background = '#f0f4f8';
        body.style.color = '#1a202c';
        
        const appContainer = document.querySelector('.app-container');
        if (appContainer) {
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
        }
        
        const header = document.querySelector('.slide-header');
        if (header) {
            header.style.background = 'rgba(255, 255, 255, 0.85)';
        }
        
        const footer = document.querySelector('.slide-footer');
        if (footer) {
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
        }
        
        document.querySelectorAll('.content-card').forEach(card => {
            card.style.background = 'rgba(255,255,255,0.8)';
            card.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.note-box').forEach(note => {
            note.style.background = 'rgba(96, 165, 250, 0.12)';
            note.style.color = '#2c3e50';
        });
        
        document.querySelectorAll('.math-block').forEach(block => {
            block.style.background = 'rgba(0,0,0,0.05)';
            block.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.btn').forEach(btn => {
            btn.style.color = '#2d3748';
        });
        
        const statusBadge = document.querySelector('.status-badge');
        if (statusBadge) {
            statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
            statusBadge.style.color = '#2b6cb0';
        }
        
        const slideCounter = document.querySelector('.slide-counter');
        if (slideCounter) {
            slideCounter.style.color = '#4a5568';
        }
        
        const autoIndicator = document.querySelector('.auto-indicator');
        if (autoIndicator) {
            autoIndicator.style.color = '#718096';
        }
        
        document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {

            }
        });
        
        document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
            if (!el.closest('.note-box') && !el.closest('.math-block')) {
                el.style.color = '#2d3748';

        });
        
        const themeBtn = document.getElementById('themeToggle');
        if (themeBtn) {
            themeBtn.textContent = '🌓';
            themeBtn.title = 'Passer en mode nuit';
        }
    });
</script>
