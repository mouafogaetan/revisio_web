<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Présentation mobile</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' },
            options: { skipHtmlTypes: 'script' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 500px;
        margin: 0 auto;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    .slide-header {
        flex-shrink: 0;
        padding: 18px 16px 10px 16px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        z-index: 10;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .slide-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
    }

    .content-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 18px 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        flex-shrink: 0;
    }

    .content-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .content-card li {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        line-height: 1.5;
    }

    .content-card li:last-child {
        border-bottom: none;
    }

    .bullet-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
    }

    .math-block {
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        overflow-x: auto;
        flex-shrink: 0;
        margin: 4px 0;
    }

    .math-block .math {
        font-size: 1.2rem;
        color: #e2e8f0;
    }

    .note-box {
        background: rgba(96, 165, 250, 0.08);
        border-left: 4px solid #60a5fa;
        padding: 12px 16px;
        border-radius: 12px;
        font-style: italic;
        font-size: 0.9rem;
        color: #cbd5e1;
        flex-shrink: 0;
    }

    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        border-radius: 0;
        flex-direction: column;
    }

    .loading-card {
        background: #1e293b;
        padding: 32px 28px;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #334155;
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px auto;
    }

    .loading-text {
        font-weight: 600;
        font-size: 1.1rem;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    .loading-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 16px;
    }
    .loading-progress {
        height: 3px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        animation: loadingProgress 30s ease-out forwards;
    }

    .loading-timeout {
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 12px;
    }

    .btn-cancel-loading {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 40px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #f87171;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }

    .btn-cancel-loading:active {
        transform: scale(0.94);
        background: rgba(239, 68, 68, 0.25);
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
    }

    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .slide-counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255,255,255,0.05);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(255,255,255,0.04);
    }

    .status-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 30px;
        background: rgba(96, 165, 250, 0.12);
        color: #93bbfc;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
    }

    .status-badge .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: pulse-dot 1.2s infinite;
        flex-shrink: 0;
    }

    .status-badge.idle .dot {
        animation: none;
        background: #64748b;
    }
    .status-badge.speaking .dot {
        background: #34d399;
        animation: pulse-dot 0.8s infinite;
    }
    .status-badge.error .dot {
        background: #f87171;
        animation: none;
    }
    .status-badge.paused .dot {
        animation: none;
        background: #fbbf24;
    }
    .status-badge.waiting .dot {
        animation: pulse-dot 1.5s infinite;
        background: #fbbf24;
    }
    .status-badge.loading .dot {
        animation: pulse-dot 0.5s infinite;
        background: #60a5fa;
    }

    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.7); }
    }

    .footer-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(255,255,255,0.1);
    }

    .btn-secondary {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-play {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
        min-width: 80px;
        justify-content: center;
    }
    .btn-play:active {
        background: rgba(52, 211, 153, 0.25);
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
    }

    .auto-indicator {
        font-size: 0.65rem;
        color: #64748b;
        text-align: center;
        letter-spacing: 0.3px;
        padding: 2px 0;
    }

    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.2rem;
        }
        .content-card li {
            font-size: 0.9rem;
            padding: 8px 0;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .btn-play {
            min-width: 60px;
        }
        .footer-buttons {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
        .loading-card {
            padding: 20px 16px;
        }
        .math-block .math {
            font-size: 1rem;
        }
    }

    @media (min-width: 600px) {
        .app-container {
            max-width: 480px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
        .loading-overlay {
            border-radius: 32px;
        }
    }

    /* Mode jour (par défaut) */
    html, body {
        background: #f0f4f8 !important;
        color: #1a202c !important;
    }
    .app-container {
        background: linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%) !important;
    }
    .slide-header {
        background: rgba(255, 255, 255, 0.85) !important;
        border-bottom: 1px solid rgba(0,0,0,0.08) !important;
    }
    .slide-header h1 {
        background: linear-gradient(135deg, #2b6cb0, #6b46c1) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        background-clip: text !important;
    }
    .slide-footer {
        background: rgba(255, 255, 255, 0.9) !important;
        border-top: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card {
        background: rgba(255,255,255,0.8) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card li {
        border-bottom: 1px solid rgba(0,0,0,0.05) !important;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.12) !important;
        border-left: 4px solid #4299e1 !important;
        color: #2c3e50 !important;
    }
    .math-block {
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .math-block .math {
        color: #2d3748 !important;
    }
    .slide-counter {
        color: #4a5568 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .status-badge {
        background: rgba(96, 165, 250, 0.15) !important;
        color: #2b6cb0 !important;
        border: 1px solid rgba(96, 165, 250, 0.15) !important;
    }
    .btn {
        color: #2d3748 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .btn-secondary {
        background: rgba(0,0,0,0.04) !important;
        border-color: rgba(0,0,0,0.08) !important;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15) !important;
        border-color: rgba(52, 211, 153, 0.2) !important;
        color: #38a169 !important;
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15) !important;
        border-color: rgba(251, 191, 36, 0.2) !important;
        color: #d69e2e !important;
    }
    .auto-indicator {
        color: #718096 !important;
    }
    .loading-card {
        background: #ffffff !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .loading-text {
        color: #1a202c !important;
    }
    .loading-sub {
        color: #4a5568 !important;
    }
</style>
</head>
<body>

<div class="app-container">

    <header class="slide-header">
        <h1 id="slideTitle">Chargement...</h1>
    </header>

    <main class="slide-body" id="slideBody"></main>

    <!-- LOADING OVERLAY AVEC BOUTON ANNULER -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Préparation vocale...</div>
            <div class="loading-sub" id="loadingSub">Synthèse en cours</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loadingProgressBar"></div>
            </div>
            <div class="loading-timeout" id="loadingTimeout">⏱️ 30 secondes maximum</div>
            <button class="btn-cancel-loading" id="cancelLoadingBtn">
                <span>✕</span> Annuler
            </button>
        </div>
    </div>

    <footer class="slide-footer">
        <div class="footer-top">
            <span class="slide-counter" id="slideCounter">1 / 3</span>
            <span class="status-badge idle" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">Prêt</span>
            </span>
        </div>

        <div class="footer-buttons">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-secondary" id="replayBtn">
                <span class="btn-icon">🔁</span> <span class="btn-label">Relire</span>
            </button>
            <button class="btn btn-play" id="playBtn">
                <span class="btn-icon">▶</span> <span class="btn-label">Play</span>
            </button>
        </div>

        <div class="auto-indicator" id="autoIndicator">⏸ Lecture manuelle</div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // SLIDES
    // ================================================================
    const slides = [
  {
    "titre": "R et ses sous-ensembles",
    "contenu": "<div style='background-color: #E8EAF6; padding: 20px; border-radius: 10px; color: #1A237E;'><h3 style='margin-top: 0;'>L'ensemble des nombres réels</h3><p style='font-size: 1.1rem;'>L'ensemble <strong>R</strong> regroupe tous les nombres que nous utilisons.</p><ul style='text-align: left; list-style-type: disc; padding-left: 20px; font-size: 1rem;'><li><strong>N</strong> : Entiers naturels (0, 1, 2, 3, ...)</li><li><strong>Z</strong> : Entiers relatifs (..., -2, -1, 0, 1, 2, ...)</li><li><strong>D</strong> : Décimaux (nombres à virgule finie)</li><li><strong>Q</strong> : Rationnels (fractions <span class='math'>\\( \\frac{p}{q} \\)</span> avec q ≠ 0)</li><li><strong>R</strong> : Réels (tous les nombres)</li></ul></div><div style='background-color: #FFF3E0; padding: 15px; border-radius: 8px; margin-top: 10px; color: #E65100;'><h4 style='margin-top: 0;'>Hiérarchie</h4><p style='text-align: center; font-size: 1.2rem; font-weight: bold;'>N ⊂ Z ⊂ D ⊂ Q ⊂ R</p><p>Exemples : 5 ∈ N, Z, D, Q, R ; -3 ∈ Z, D, Q, R (mais pas N) ; <span class='math'>\\( \\frac{1}{3} \\)</span> ∈ Q, R (mais pas D) ; <span class='math'>\\( \\sqrt{2} \\)</span> ∈ R (mais pas Q).</p></div>",
    "texteParle": "Nous allons commencer par l'ensemble des nombres réels et ses sous-ensembles. L'ensemble R contient tous les nombres. Il est organisé hiérarchiquement : N, l'ensemble des entiers naturels, est inclus dans Z, l'ensemble des entiers relatifs, qui est inclus dans D, l'ensemble des nombres décimaux, qui est inclus dans Q, l'ensemble des nombres rationnels, qui est enfin inclus dans R. Par exemple, 5 appartient à tous ces ensembles. Moins 3 appartient à tous sauf N. Un tiers appartient à Q et R mais pas à D. La racine carrée de 2 appartient uniquement à R.",
    "note": "La hiérarchie est : N ⊂ Z ⊂ D ⊂ Q ⊂ R."
  },
  {
    "titre": "Calcul littéral dans R : addition et multiplication",
    "contenu": "<div style='background-color: #E3F2FD; padding: 15px; border-radius: 8px; color: #0D47A1;'><h4 style='margin-top: 0;'>Addition de nombres relatifs</h4><ul style='list-style-type: disc; padding-left: 20px; font-size: 1rem;'><li><strong>Mêmes signes :</strong> on additionne les distances et on garde le signe commun.</li><li><strong>Signes contraires :</strong> on soustrait les distances et on garde le signe du plus grand.</li></ul><p><strong>Exemples :</strong> (-5) + (-3) = -8 ; (+7) + (-4) = +3</p></div><div style='background-color: #E8F5E9; padding: 15px; border-radius: 8px; margin-top: 10px; color: #1B5E20;'><h4 style='margin-top: 0;'>Multiplication de nombres relatifs</h4><ul style='list-style-type: disc; padding-left: 20px; font-size: 1rem;'><li><strong>Règle des signes :</strong> (+)×(+) = + ; (-)×(-) = + ; (+)×(-) = - ; (-)×(+) = -</li></ul><p><strong>Exemples :</strong> (-4) × (-3) = +12 ; (-5) × (+2) = -10</p></div><div style='background-color: #FFF3E0; padding: 15px; border-radius: 8px; margin-top: 10px; color: #E65100;'><h4 style='margin-top: 0;'>Priorités opératoires</h4><p>1. Parenthèses — 2. Puissances — 3. Multiplication et division — 4. Addition et soustraction.</p><p><strong>Exemple :</strong> 3 + 4 × 2 = 3 + 8 = 11 (et non 14)</p></div>",
    "texteParle": "Passons maintenant au calcul littéral dans R. Commençons par l'addition et la multiplication des nombres relatifs. Pour l'addition, si les deux nombres ont le même signe, on additionne leurs distances et on garde le signe commun. Si les signes sont contraires, on soustrait les distances et on garde le signe du plus grand. Pour la multiplication, il faut retenir la règle des signes : plus fois plus donne plus, moins fois moins donne plus, plus fois moins donne moins. Enfin, n'oubliez jamais les priorités opératoires : d'abord les parenthèses, puis les puissances, ensuite les multiplications et divisions, et enfin les additions et soustractions.",
    "note": "La règle des signes est fondamentale pour tout le calcul dans R."
  },
  {
    "titre": "Calcul des fractions",
    "contenu": "<div style='background-color: #F3E5F5; padding: 15px; border-radius: 8px; color: #4A148C;'><h4 style='margin-top: 0;'>Addition et soustraction</h4><p>Il faut un <strong>dénominateur commun</strong> :</p><div class='math-block'><div class='math'>$$ \\frac{a}{b} + \\frac{c}{d} = \\frac{ad + bc}{bd} $$</div></div></div><div style='background-color: #E0F7FA; padding: 15px; border-radius: 8px; margin-top: 10px; color: #006064;'><h4 style='margin-top: 0;'>Multiplication et division</h4><div class='math-block'><div class='math'>$$ \\frac{a}{b} \\times \\frac{c}{d} = \\frac{ac}{bd} \\quad ; \\quad \\frac{a}{b} \\div \\frac{c}{d} = \\frac{a}{b} \\times \\frac{d}{c} $$</div></div></div><div style='background-color: #FFF3E0; padding: 15px; border-radius: 8px; margin-top: 10px; color: #E65100;'><h4 style='margin-top: 0;'>Simplification</h4><p>On divise le numérateur et le dénominateur par un même facteur commun.</p><p><strong>Exemple :</strong> <span class='math'>\\( \\frac{12}{18} = \\frac{2}{3} \\)</span></p></div>",
    "texteParle": "Abordons maintenant le calcul des fractions. Pour additionner ou soustraire deux fractions, il faut les mettre au même dénominateur. La formule générale est a sur b plus c sur d égale ad plus bc sur bd. Pour multiplier deux fractions, on multiplie les numérateurs entre eux et les dénominateurs entre eux. Pour diviser par une fraction, on multiplie par son inverse. Enfin, pour simplifier une fraction, on divise le numérateur et le dénominateur par un même facteur commun. Par exemple, 12 sur 18 se simplifie en 2 sur 3 en divisant par 6.",
    "note": "Toujours simplifier une fraction en fin de calcul."
  },
  {
    "titre": "Calcul des racines carrées",
    "contenu": "<div style='background-color: #E8F5E9; padding: 15px; border-radius: 8px; color: #1B5E20;'><h4 style='margin-top: 0;'>Définition et propriétés</h4><p>Pour <span class='math'>\\( a \\ge 0 \\)</span>, <span class='math'>\\( \\sqrt{a} \\)</span> est le nombre positif dont le carré est a.</p><ul style='list-style-type: disc; padding-left: 20px; font-size: 1rem;'><li><span class='math'>\\( \\sqrt{a \\times b} = \\sqrt{a} \\times \\sqrt{b} \\)</span></li><li><span class='math'>\\( \\sqrt{\\frac{a}{b}} = \\frac{\\sqrt{a}}{\\sqrt{b}} \\)</span> (b ≠ 0)</li><li><span class='math'>\\( \\sqrt{a^2} = |a| \\)</span></li></ul></div><div style='background-color: #FFF8E1; padding: 15px; border-radius: 8px; margin-top: 10px; color: #E65100;'><h4 style='margin-top: 0;'>Simplification</h4><p>On extrait les carrés parfaits :</p><p><span class='math'>\\( \\sqrt{50} = \\sqrt{25 \\times 2} = 5\\sqrt{2} \\)</span></p><p><span class='math'>\\( \\sqrt{72} = \\sqrt{36 \\times 2} = 6\\sqrt{2} \\)</span></p></div><div style='background-color: #E3F2FD; padding: 15px; border-radius: 8px; margin-top: 10px; color: #0D47A1;'><h4 style='margin-top: 0;'>Attention</h4><p><span class='math'>\\( \\sqrt{a + b} \\ne \\sqrt{a} + \\sqrt{b} \\)</span></p><p>Exemple : <span class='math'>\\( \\sqrt{9 + 16} = \\sqrt{25} = 5 \\)</span> mais <span class='math'>\\( \\sqrt{9} + \\sqrt{16} = 3 + 4 = 7 \\)</span></p></div>",
    "texteParle": "Étudions maintenant le calcul des racines carrées. La racine carrée d'un nombre positif a est le nombre positif dont le carré est a. Les propriétés importantes sont : la racine carrée d'un produit est égale au produit des racines carrées, et la racine carrée d'un quotient est égale au quotient des racines carrées. Pour simplifier une racine carrée, on extrait les carrés parfaits. Par exemple, racine de 50 égale racine de 25 fois 2, ce qui donne 5 racine de 2. Attention, la racine carrée d'une somme n'est pas égale à la somme des racines carrées. Par exemple, racine de 9 plus 16 égale racine de 25 égale 5, alors que racine de 9 plus racine de 16 égale 3 plus 4 égale 7.",
    "note": "Ne jamais confondre √(a+b) et √a + √b."
  },
  {
    "titre": "Produits remarquables",
    "contenu": "<div style='background-color: #FCE4EC; padding: 15px; border-radius: 8px; color: #880E4F;'><h4 style='margin-top: 0;'>Les trois identités fondamentales</h4><div class='math-block'><div class='math'>$$ (a+b)^2 = a^2 + 2ab + b^2 $$</div></div><div class='math-block'><div class='math'>$$ (a-b)^2 = a^2 - 2ab + b^2 $$</div></div><div class='math-block'><div class='math'>$$ (a-b)(a+b) = a^2 - b^2 $$</div></div></div><div style='background-color: #E8F5E9; padding: 15px; border-radius: 8px; margin-top: 10px; color: #1B5E20;'><h4 style='margin-top: 0;'>Exemples</h4><ul style='list-style-type: disc; padding-left: 20px; font-size: 1rem;'><li><span class='math'>\\( (x+3)^2 = x^2 + 6x + 9 \\)</span></li><li><span class='math'>\\( (2x-5)^2 = 4x^2 - 20x + 25 \\)</span></li><li><span class='math'>\\( (x-4)(x+4) = x^2 - 16 \\)</span></li></ul></div>",
    "texteParle": "Les produits remarquables sont trois identités qu'il faut absolument connaître. La première est le carré d'une somme : a plus b au carré égale a au carré plus deux ab plus b au carré. La deuxième est le carré d'une différence : a moins b au carré égale a au carré moins deux ab plus b au carré. La troisième est la différence de deux carrés : a moins b fois a plus b égale a au carré moins b au carré. Par exemple, x plus 3 au carré égale x au carré plus 6x plus 9. Ces identités servent à développer, factoriser et simplifier des expressions.",
    "note": "Ces trois identités sont à connaître par cœur."
  },
  {
    "titre": "Application des produits remarquables",
    "contenu": "<div style='background-color: #E3F2FD; padding: 15px; border-radius: 8px; color: #0D47A1;'><h4 style='margin-top: 0;'>Calcul de racines carrées</h4><p>On utilise <span class='math'>\\( (a+b)^2 = a^2 + 2ab + b^2 \\)</span> pour simplifier.</p><p><strong>Exemple :</strong> <span class='math'>\\( (\\sqrt{3} + 1)^2 = 3 + 2\\sqrt{3} + 1 = 4 + 2\\sqrt{3} \\)</span></p></div><div style='background-color: #FFF8E1; padding: 15px; border-radius: 8px; margin-top: 10px; color: #E65100;'><h4 style='margin-top: 0;'>Écrire sans radical au dénominateur</h4><p>On multiplie par le <strong>conjugué</strong> :</p><div class='math-block'><div class='math'>$$ \\frac{1}{\\sqrt{a} + \\sqrt{b}} = \\frac{\\sqrt{a} - \\sqrt{b}}{a - b} $$</div></div><p><strong>Exemple :</strong> <span class='math'>\\( \\frac{1}{\\sqrt{2} + 1} = \\frac{\\sqrt{2} - 1}{(\\sqrt{2})^2 - 1^2} = \\sqrt{2} - 1 \\)</span></p></div><div style='background-color: #E8F5E9; padding: 15px; border-radius: 8px; margin-top: 10px; color: #1B5E20;'><h4 style='margin-top: 0;'>Autre exemple</h4><p><span class='math'>\\( \\frac{3}{\\sqrt{5} - 2} = \\frac{3(\\sqrt{5} + 2)}{5 - 4} = 3(\\sqrt{5} + 2) = 3\\sqrt{5} + 6 \\)</span></p></div>",
    "texteParle": "Les produits remarquables ont deux applications importantes. D'abord, ils permettent de calculer ou simplifier des expressions contenant des racines carrées. Par exemple, racine de 3 plus 1 au carré donne 3 plus 2 racine de 3 plus 1, soit 4 plus 2 racine de 3. Ensuite, ils permettent d'écrire une expression sans radical au dénominateur. Pour cela, on multiplie le numérateur et le dénominateur par le conjugué du dénominateur. Par exemple, 1 sur racine de 2 plus 1 se transforme en racine de 2 moins 1. Cette technique est très utile pour simplifier des expressions.",
    "note": "Le conjugué de √a + √b est √a - √b."

    "texteParle": "Passons au calcul des puissances. Les propriétés fondamentales sont les suivantes : quand on multiplie deux puissances de même base, on additionne les exposants. Quand on divise, on soustrait les exposants. Quand on élève une puissance à une puissance, on multiplie les exposants. Un nombre à la puissance zéro vaut toujours 1. Un exposant négatif signifie l'inverse du nombre à l'exposant positif. Ces propriétés permettent de réduire des fractions contenant des puissances. Par exemple, 2 puissance 5 fois 3 puissance 3 sur 2 puissance 3 fois 3 puissance 2 se simplifie en 2 au carré fois 3, soit 12.",

    "texteParle": "La valeur absolue d'un nombre est sa distance à zéro sur la droite numérique. Par définition, la valeur absolue d'un nombre positif est ce nombre lui-même, et la valeur absolue d'un nombre négatif est son opposé. La valeur absolue est toujours positive ou nulle. Les propriétés importantes sont : la valeur absolue d'un produit est le produit des valeurs absolues, et l'inégalité triangulaire qui dit que la valeur absolue d'une somme est comprise entre la différence et la somme des valeurs absolues. Par exemple, la valeur absolue de 5 est 5, la valeur absolue de moins 3 est 3.",

    "texteParle": "Pour comparer deux nombres réels, il existe plusieurs méthodes. La première consiste à étudier le signe de leur différence. Si a moins b est positif, alors a est plus grand que b. Si a moins b est négatif, alors a est plus petit que b. La deuxième méthode, valable pour les nombres positifs, consiste à comparer leurs carrés. Si a au carré est plus grand que b au carré et que a et b sont positifs, alors a est plus grand que b. La troisième méthode consiste à calculer le quotient a sur b et à le comparer à 1. Si ce quotient est supérieur à 1, alors a est plus grand que b.",

    "texteParle": "Terminons par le calcul approché. La troncature à n décimales consiste à couper le nombre après la n-ième décimale. L'arrondi à n décimales consiste à regarder la décimale suivante : si elle est supérieure ou égale à 5, on arrondit au-dessus, sinon on arrondit en dessous. Par exemple, pour pi qui vaut 3,14159, la troncature à 10 puissance moins 3 est 3,141 et l'arrondi est 3,142. La notation scientifique consiste à écrire un nombre sous la forme a fois 10 puissance n, avec a compris entre 1 et 10. Par exemple, 0,00045 s'écrit 4,5 fois 10 puissance moins 4. L'ordre de grandeur est la puissance de 10 la plus proche.",

    "texteParle": "Pour conclure cette leçon sur le calcul dans R, retenons les points essentiels. L'ensemble R contient N, Z, D et Q. Le calcul des nombres relatifs repose sur la règle des signes et les priorités opératoires. Les fractions nécessitent un dénominateur commun pour l'addition et la simplification. Les racines carrées ont des propriétés spécifiques. Les produits remarquables sont trois identités fondamentales. Les puissances suivent des règles précises. La valeur absolue est une distance. La comparaison des nombres se fait par l'étude du signe de la différence. Enfin, le calcul approché utilise l'arrondi, la troncature et la notation scientifique. Ces notions sont la base de tous vos calculs en mathématiques et en sciences techniques.",

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentIndex = 0;
    let isSpeaking = false;
    let isPaused = false;
    let currentUtterance = null;
    let isLoading = false;
    let loadingTimeout = null;
    let isTransitioning = false;
    let speechSupported = true;
    let userInteracted = false;
    let isPlaying = false;
    let loadingCancelled = false;

    const total = slides.length;
    const synth = window.speechSynthesis;

    // Références jQuery
    const $title = $('#slideTitle');
    const $body = $('#slideBody');
    const $counter = $('#slideCounter');
    const $statusText = $('#statusText');
    const $statusBadge = $('#statusBadge');
    const $loading = $('#loadingOverlay');
    const $loadingText = $('#loadingText');
    const $loadingSub = $('#loadingSub');
    const $loadingTimeout = $('#loadingTimeout');
    const $loadingProgressBar = $('#loadingProgressBar');
    const $autoIndicator = $('#autoIndicator');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $replay = $('#replayBtn');
    const $play = $('#playBtn');
    const $cancelLoading = $('#cancelLoadingBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function setStatus(text, type) {
        $statusText.text(text);
        $statusBadge.removeClass('idle speaking error paused waiting loading');
        if (type === 'speaking') $statusBadge.addClass('speaking');
        else if (type === 'error') $statusBadge.addClass('error');
        else if (type === 'paused') $statusBadge.addClass('paused');
        else if (type === 'waiting') $statusBadge.addClass('waiting');
        else if (type === 'loading') $statusBadge.addClass('loading');
        else $statusBadge.addClass('idle');
    }

    function updatePlayButton() {
        if (isPlaying) {
            $play.addClass('playing');
            $play.find('.btn-icon').text('⏸');
            $play.find('.btn-label').text('Pause');
        } else {
            $play.removeClass('playing');
            $play.find('.btn-icon').text('▶');
            $play.find('.btn-label').text('Play');
        }
    }

    function showLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        
        loadingCancelled = false;
        isLoading = true;
        
        // Réinitialiser la barre de progression
        $loadingProgressBar.css('animation', 'none');
        $loadingProgressBar.css('width', '0%');
        // Forcer un reflow
        $loadingProgressBar[0].offsetHeight;
        $loadingProgressBar.css('animation', 'loadingProgress 30s ease-out forwards');
        
        $loadingText.text('Préparation vocale...');
        $loadingSub.text('Synthèse en cours');
        $loadingTimeout.text('⏱️ 30 secondes maximum');
        $loading.fadeIn(300);
        setStatus("⏳ Chargement...", 'loading');
        
        // 🔥 TIMEOUT DE 30 SECONDES
        loadingTimeout = setTimeout(() => {
            if (isLoading && !loadingCancelled) {
                hideLoading();
                setStatus("⚠️ Délai dépassé (30s)", 'error');
                isPlaying = false;
                updatePlayButton();
                $loadingSub.text('La synthèse vocale a pris trop de temps');
                $loadingTimeout.text('❌ Délai dépassé');
            }
        }, 30000);
    }

    function hideLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        isLoading = false;
        loadingCancelled = false;
        $loading.fadeOut(300);
        // Ne pas changer le statut si on est en train de parler
        if (!isSpeaking && !isPlaying) {
            setStatus("⏸ Lecture arrêtée", 'paused');
        }
    }

    function cancelLoading() {
        loadingCancelled = true;
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        hideLoading();
        stopSpeaking();
        setStatus("⏸ Annulé", 'paused');
        isPlaying = false;
        updatePlayButton();
        $loadingText.text('Annulé par l\'utilisateur');
        $loadingSub.text('Vous pouvez réessayer');
        $loadingTimeout.text('✕ Annulation');
    }

    // Arrêter la parole proprement
    function stopSpeaking() {
        try {
            if (synth && (synth.speaking || synth.pending)) {
                synth.cancel();
            }
        } catch(e) {
            console.warn('Erreur stopSpeaking:', e);
        }
        if (currentUtterance) {
            try {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance.onstart = null;
            } catch(e) {}
            currentUtterance = null;
        }
        isSpeaking = false;
        isPlaying = false;
        updatePlayButton();
    }

    // Mettre en pause la parole
    function pauseSpeaking() {
        try {
            if (synth && synth.speaking) {
                synth.pause();
                isPaused = true;
                isPlaying = false;
                setStatus("⏸ Lecture en pause", 'paused');
                updatePlayButton();
            }
        } catch(e) {
            console.warn('Erreur pauseSpeaking:', e);
            stopSpeaking();
        }
    }

    // Reprendre la parole
    function resumeSpeaking() {
        try {
            if (synth && synth.paused) {
                synth.resume();
                isPaused = false;
                isPlaying = true;
                setStatus("🔊 Lecture en cours", 'speaking');
                updatePlayButton();
            } else if (!isSpeaking && !synth.speaking && !synth.pending) {
                speakSlide(currentIndex);
            }
        } catch(e) {
            console.warn('Erreur resumeSpeaking:', e);
            speakSlide(currentIndex);
        }
    }

    function renderSlide(index) {
        const slide = slides[index];
        $title.text(slide.titre);

        let html = '';
        html += `<div class="content-card">${slide.contenu}</div>`;
        if (slide.note) {
            html += `<div class="note-box">${slide.note}</div>`;
        }
        $body.html(html);
        $counter.text(`${index+1} / ${total}`);

        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
        }
    }

    // ================================================================
    // LECTURE VOCALE
    // ================================================================
    function speakSlide(index) {
        return new Promise((resolve) => {
            const slide = slides[index];
            const text = slide.texteParle;
            
            if (!text || text.trim() === '' || !speechSupported) {
                resolve();
                return;
            }

            if (!window.speechSynthesis) {
                setStatus("❌ Synthèse vocale non supportée", 'error');
                speechSupported = false;
                resolve();
                return;
            }

            // Arrêter toute lecture en cours
            stopSpeaking();
            
            // Réinitialiser l'état de pause
            isPaused = false;
            
            showLoading();
            setStatus("Initialisation...", 'loading');

            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.92;
                utterance.pitch = 1.05;
                utterance.volume = 1;

                let isFinished = false;
                let errorHandled = false;

                utterance.onstart = function() {
                    if (loadingCancelled) {
                        stopSpeaking();
                        resolve();
                        return;
                    }
                    hideLoading();
                    isSpeaking = true;
                    isPlaying = true;
                    isPaused = false;
                    setStatus("🔊 Lecture en cours", 'speaking');
                    updatePlayButton();
                };

                utterance.onend = function() {
                    if (isFinished) return;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    setStatus("✅ Terminé", 'idle');
                    hideLoading();
                    updatePlayButton();
                    resolve();
                };

                utterance.onerror = function(e) {
                    if (isFinished || errorHandled) return;
                    errorHandled = true;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    hideLoading();
                    updatePlayButton();
                    
                    if (e.error === 'not-allowed') {
                        setStatus("⚠️ Permission refusée", 'error');
                    } else if (e.error === 'synthesis-unavailable') {
                        setStatus("⚠️ Synthèse indisponible", 'error');
                    } else if (e.error === 'canceled') {
                        setStatus("⏸ Annulé", 'paused');
                    } else {
                        setStatus("❌ Erreur audio: " + (e.error || 'inconnue'), 'error');
                    }
                    
                    resolve();
                };

                // Gestion du chargement des voix
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = function() {
                        if (!loadingCancelled) {
                            try {
                                synth.speak(utterance);
                            } catch(err) {
                                // Silencieux
                            }
                        }
                        synth.onvoiceschanged = null;
                    };
                }

                currentUtterance = utterance;
                
                if (!loadingCancelled) {
                    try {
                        synth.speak(utterance);
                    } catch(err) {
                        setTimeout(() => {
                            if (!loadingCancelled) {
                                try {
                                    synth.speak(utterance);
                                } catch(e) {
                                    setStatus("❌ Erreur de lecture", 'error');
                                    isPlaying = false;
                                    updatePlayButton();
                                    hideLoading();
                                    resolve();
                                }
                            } else {
                                resolve();
                            }
                        }, 100);
                    }
                } else {
                    resolve();
                }

            } catch(err) {
                hideLoading();
                setStatus("❌ Erreur générale", 'error');
                isPlaying = false;
                updatePlayButton();
                console.error('Erreur speakSlide:', err);
                resolve();
            }
        });
    }

    // ================================================================
    // NAVIGATION
    // ================================================================
    async function goToSlide(index) {
        if (isTransitioning) return;
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        
        // Si on est en train de lire, on met en pause avant de naviguer
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        // Arrêter complètement la lecture
        stopSpeaking();
        
        await new Promise(r => setTimeout(r, 50));
        
        if (index === currentIndex) {
            setStatus("📄 Slide actuel", 'idle');
            return;
        }

        isTransitioning = true;
        currentIndex = index;
        renderSlide(index);
        
        // Réinitialiser l'état de lecture
        isPlaying = false;
        updatePlayButton();
        setStatus("⏸ Lecture arrêtée", 'paused');

        await new Promise(r => setTimeout(r, 150));
        isTransitioning = false;
    }

    async function goToNext() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex + 1 < total) {
            await goToSlide(currentIndex + 1);
        } else {
            setStatus("🏁 Dernier slide", 'idle');
        }
    }

    async function goToPrev() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex - 1 >= 0) {
            await goToSlide(currentIndex - 1);
        } else {
            setStatus("🔁 Premier slide", 'idle');
        }
    }

    // ================================================================
    // GESTION PLAY/PAUSE
    // ================================================================
    function togglePlay() {
        if (!userInteracted) {
            userInteracted = true;
        }

        // Si le chargement est en cours, on l'annule
        if (isLoading) {
            cancelLoading();
            return;
        }

        // Si le synthétiseur est en pause, on reprend
        if (synth && synth.paused) {
            resumeSpeaking();
            return;
        }

        // Si la lecture est en cours, on met en pause
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
            return;
        }

        // Sinon, on démarre la lecture du slide courant
        if (!isSpeaking && !isPlaying) {
            stopSpeaking();
            speakSlide(currentIndex);
        }
    }

    // ================================================================
    // INIT
    // ================================================================
    async function init() {
        // Vérifier la compatibilité
        if (!window.speechSynthesis) {
            setStatus("❌ Synthèse vocale non supportée", 'error');
            speechSupported = false;
        }

        // Précharger les voix
        try {
            if (synth.getVoices) {
                synth.getVoices();
                setTimeout(() => {
                    try {
                        synth.getVoices();
                    } catch(e) {}
                }, 200);
            }
        } catch(e) {
            console.warn('Erreur chargement voix:', e);
        }

        // Afficher le premier slide
        renderSlide(0);
        $counter.text(`1 / ${total}`);
        
        // État initial
        setStatus("⏸ Appuie sur Play", 'paused');
        updatePlayButton();
        $autoIndicator.text('⏸ Lecture manuelle');

        // ================================================================
        // ÉVÉNEMENTS
        // ================================================================
        
        // Bouton Play/Pause
        $play.on('click', function() {
            togglePlay();
        });

        // Bouton Annuler le chargement
        $cancelLoading.on('click', function() {
            cancelLoading();
        });

        // Navigation
        $prev.on('click', function() {
            // Si chargement en cours, on annule
            if (isLoading) cancelLoading();
            goToPrev();
        });

        $next.on('click', function() {
            if (isLoading) cancelLoading();
            goToNext();
        });

        // Replay - relire le slide courant
        $replay.on('click', function() {
            if (isLoading) cancelLoading();
            stopSpeaking();
            setTimeout(() => {
                speakSlide(currentIndex);
            }, 100);
        });

        // Support du clavier (espace pour play/pause)
        $(document).on('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });

        // Nettoyage
        $(window).on('beforeunload', function() {
            try {
                if (synth.speaking) synth.cancel();
            } catch(e) {}
            hideLoading();
        });

        // Gérer les cas où la synthèse se termine de manière inattendue
        setInterval(() => {
            if (isPlaying && !synth.speaking && !synth.pending && !isPaused && !isLoading) {
                isPlaying = false;
                updatePlayButton();
                setStatus("⏸ Lecture arrêtée", 'paused');
            }
        }, 1000);
    }

    init();
});



    // ================================================================
    // GESTION DU THÈME JOUR/NUIT
    // ================================================================
    let isDarkMode = false;

    function toggleTheme() {
        isDarkMode = !isDarkMode;
        const body = document.body;
        const appContainer = document.querySelector('.app-container');
        const header = document.querySelector('.slide-header');
        const footer = document.querySelector('.slide-footer');
        const contentCards = document.querySelectorAll('.content-card');
        const noteBoxes = document.querySelectorAll('.note-box');
        const mathBlocks = document.querySelectorAll('.math-block');
        const buttons = document.querySelectorAll('.btn');
        const statusBadge = document.querySelector('.status-badge');
        const slideCounter = document.querySelector('.slide-counter');
        const autoIndicator = document.querySelector('.auto-indicator');
        const themeBtn = document.getElementById('themeToggle');

        if (isDarkMode) {
            // Mode nuit
            body.style.background = '#0b1120';
            body.style.color = '#f1f5f9';
            appContainer.style.background = 'linear-gradient(145deg, #0f172a 0%, #1e293b 100%)';
            header.style.background = 'rgba(15, 23, 42, 0.85)';
            footer.style.background = 'rgba(15, 23, 42, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.05)';
                card.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.08)';
                note.style.color = '#cbd5e1';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.25)';
                block.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#e2e8f0';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.12)';
                statusBadge.style.color = '#93bbfc';
            }
            if (slideCounter) {
                slideCounter.style.color = '#94a3b8';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#64748b';
            }
            if (themeBtn) {
                themeBtn.textContent = '☀️';
                themeBtn.title = 'Passer en mode jour';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#e2e8f0';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#e2e8f0';
                }
            });
        } else {
            // Mode jour (par défaut)
            body.style.background = '#f0f4f8';
            body.style.color = '#1a202c';
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
            header.style.background = 'rgba(255, 255, 255, 0.85)';
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.8)';
                card.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.12)';
                note.style.color = '#2c3e50';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.05)';
                block.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#2d3748';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
                statusBadge.style.color = '#2b6cb0';
            }
            if (slideCounter) {
                slideCounter.style.color = '#4a5568';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#718096';
            }
            if (themeBtn) {
                themeBtn.textContent = '🌓';
                themeBtn.title = 'Passer en mode nuit';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#2c3e50';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#2d3748';
                }
            });
        }
    }

    // Initialiser en mode jour
    document.addEventListener('DOMContentLoaded', function() {
        // Appliquer le mode jour par défaut
        const body = document.body;
        body.style.background = '#f0f4f8';
        body.style.color = '#1a202c';
        
        const appContainer = document.querySelector('.app-container');

            note.style.color = '#2c3e50';

        if (statusBadge) {

        const slideCounter = document.querySelector('.slide-counter');

        const autoIndicator = document.querySelector('.auto-indicator');
        if (autoIndicator) {

        }
        
        document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
            if (!el.closest('.note-box')) {

            }
        });
        
        document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {

        const themeBtn = document.getElementById('themeToggle');
