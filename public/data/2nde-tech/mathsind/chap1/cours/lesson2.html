<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Présentation mobile</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' },
            options: { skipHtmlTypes: 'script' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 500px;
        margin: 0 auto;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    .slide-header {
        flex-shrink: 0;
        padding: 18px 16px 10px 16px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        z-index: 10;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .slide-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
    }

    .content-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 18px 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        flex-shrink: 0;
    }

    .content-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .content-card li {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        line-height: 1.5;
    }

    .content-card li:last-child {
        border-bottom: none;
    }

    .bullet-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
    }

    .math-block {
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        overflow-x: auto;
        flex-shrink: 0;
        margin: 4px 0;
    }

    .math-block .math {
        font-size: 1.2rem;
        color: #e2e8f0;
    }

    .note-box {
        background: rgba(96, 165, 250, 0.08);
        border-left: 4px solid #60a5fa;
        padding: 12px 16px;
        border-radius: 12px;
        font-style: italic;
        font-size: 0.9rem;
        color: #cbd5e1;
        flex-shrink: 0;
    }

    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        border-radius: 0;
        flex-direction: column;
    }

    .loading-card {
        background: #1e293b;
        padding: 32px 28px;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #334155;
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px auto;
    }

    .loading-text {
        font-weight: 600;
        font-size: 1.1rem;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    .loading-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 16px;
    }
    .loading-progress {
        height: 3px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        animation: loadingProgress 30s ease-out forwards;
    }

    .loading-timeout {
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 12px;
    }

    .btn-cancel-loading {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 40px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #f87171;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }

    .btn-cancel-loading:active {
        transform: scale(0.94);
        background: rgba(239, 68, 68, 0.25);
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
    }

    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .slide-counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255,255,255,0.05);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(255,255,255,0.04);
    }

    .status-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 30px;
        background: rgba(96, 165, 250, 0.12);
        color: #93bbfc;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
    }

    .status-badge .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: pulse-dot 1.2s infinite;
        flex-shrink: 0;
    }

    .status-badge.idle .dot {
        animation: none;
        background: #64748b;
    }
    .status-badge.speaking .dot {
        background: #34d399;
        animation: pulse-dot 0.8s infinite;
    }
    .status-badge.error .dot {
        background: #f87171;
        animation: none;
    }
    .status-badge.paused .dot {
        animation: none;
        background: #fbbf24;
    }
    .status-badge.waiting .dot {
        animation: pulse-dot 1.5s infinite;
        background: #fbbf24;
    }
    .status-badge.loading .dot {
        animation: pulse-dot 0.5s infinite;
        background: #60a5fa;
    }

    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.7); }
    }

    .footer-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(255,255,255,0.1);
    }

    .btn-secondary {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-play {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
        min-width: 80px;
        justify-content: center;
    }
    .btn-play:active {
        background: rgba(52, 211, 153, 0.25);
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
    }

    .auto-indicator {
        font-size: 0.65rem;
        color: #64748b;
        text-align: center;
        letter-spacing: 0.3px;
        padding: 2px 0;
    }

    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.2rem;
        }
        .content-card li {
            font-size: 0.9rem;
            padding: 8px 0;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .btn-play {
            min-width: 60px;
        }
        .footer-buttons {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
        .loading-card {
            padding: 20px 16px;
        }
        .math-block .math {
            font-size: 1rem;
        }
    }

    @media (min-width: 600px) {
        .app-container {
            max-width: 480px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
        .loading-overlay {
            border-radius: 32px;
        }
    }

    /* Mode jour (par défaut) */
    html, body {
        background: #f0f4f8 !important;
        color: #1a202c !important;
    }
    .app-container {
        background: linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%) !important;
    }
    .slide-header {
        background: rgba(255, 255, 255, 0.85) !important;
        border-bottom: 1px solid rgba(0,0,0,0.08) !important;
    }
    .slide-header h1 {
        background: linear-gradient(135deg, #2b6cb0, #6b46c1) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        background-clip: text !important;
    }
    .slide-footer {
        background: rgba(255, 255, 255, 0.9) !important;
        border-top: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card {
        background: rgba(255,255,255,0.8) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card li {
        border-bottom: 1px solid rgba(0,0,0,0.05) !important;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.12) !important;
        border-left: 4px solid #4299e1 !important;
        color: #2c3e50 !important;
    }
    .math-block {
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .math-block .math {
        color: #2d3748 !important;
    }
    .slide-counter {
        color: #4a5568 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .status-badge {
        background: rgba(96, 165, 250, 0.15) !important;
        color: #2b6cb0 !important;
        border: 1px solid rgba(96, 165, 250, 0.15) !important;
    }
    .btn {
        color: #2d3748 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .btn-secondary {
        background: rgba(0,0,0,0.04) !important;
        border-color: rgba(0,0,0,0.08) !important;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15) !important;
        border-color: rgba(52, 211, 153, 0.2) !important;
        color: #38a169 !important;
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15) !important;
        border-color: rgba(251, 191, 36, 0.2) !important;
        color: #d69e2e !important;
    }
    .auto-indicator {
        color: #718096 !important;
    }
    .loading-card {
        background: #ffffff !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .loading-text {
        color: #1a202c !important;
    }
    .loading-sub {
        color: #4a5568 !important;
    }
</style>
</head>
<body>

<div class="app-container">

    <header class="slide-header">
        <h1 id="slideTitle">Chargement...</h1>
    </header>

    <main class="slide-body" id="slideBody"></main>

    <!-- LOADING OVERLAY AVEC BOUTON ANNULER -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Préparation vocale...</div>
            <div class="loading-sub" id="loadingSub">Synthèse en cours</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loadingProgressBar"></div>
            </div>
            <div class="loading-timeout" id="loadingTimeout">⏱️ 30 secondes maximum</div>
            <button class="btn-cancel-loading" id="cancelLoadingBtn">
                <span>✕</span> Annuler
            </button>
        </div>
    </div>

    <footer class="slide-footer">
        <div class="footer-top">
            <span class="slide-counter" id="slideCounter">1 / 3</span>
            <span class="status-badge idle" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">Prêt</span>
            </span>
        </div>

        <div class="footer-buttons">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-secondary" id="replayBtn">
                <span class="btn-icon">🔁</span> <span class="btn-label">Relire</span>
            </button>
            <button class="btn btn-play" id="playBtn">
                <span class="btn-icon">▶</span> <span class="btn-label">Play</span>
            </button>
        </div>

        <div class="auto-indicator" id="autoIndicator">⏸ Lecture manuelle</div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // SLIDES
    // ================================================================
   const slides = [
  {
    "titre": "Opérations dans R : vue d'ensemble",
    "contenu": "<div style='background-color: #E8EAF6; padding: 20px; border-radius: 10px; color: #1A237E;'><h3 style='margin-top: 0;'>Objectifs de cette leçon</h3><p>Dans cette leçon, nous allons revoir les opérations fondamentales dans R :</p><ul style='text-align: left; list-style-type: disc; padding-left: 20px; font-size: 1rem;'><li><strong>Addition et multiplication</strong> des nombres entiers relatifs : maîtriser la règle des signes et les priorités opératoires.</li><li><strong>Calcul des fractions</strong> : réduire au même dénominateur, simplifier, et gérer des fractions complexes (fractions de fractions).</li><li><strong>Opérations avec les radicaux</strong> : addition, multiplication, développement, réduction, produits remarquables et rationalisation du dénominateur.</li></ul></div><div style='background-color: #FFF3E0; padding: 15px; border-radius: 8px; margin-top: 10px; color: #E65100;'><h4 style='margin-top: 0;'>Pourquoi ces révisions ?</h4><p>Ces techniques sont la base de tous les calculs en mathématiques et en sciences techniques. Les maîtriser permet d'éviter les erreurs et de gagner du temps.</p></div>",
    "texteParle": "Dans cette leçon, nous allons revoir les opérations fondamentales dans R. Nous commencerons par l'addition et la multiplication des nombres entiers relatifs, avec un objectif précis : maîtriser la règle des signes et les règles de priorité. Ensuite, nous verrons le calcul des fractions, en développant des techniques pour réduire rapidement au même dénominateur. Nous traiterons aussi des cas plus complexes, comme les grandes fractions avec des opérations de fractions en haut et en bas. Enfin, nous aborderons les opérations avec les radicaux : addition, multiplication, les pièges à éviter, le développement et la réduction, l'utilisation des produits remarquables, et l'écriture sans radical au dénominateur.",
    "note": "Cette leçon est divisée en trois grandes parties : relatifs, fractions, radicaux."
  },
  {
    "titre": "Addition des nombres relatifs",
    "contenu": "<div style='background-color: #E3F2FD; padding: 20px; border-radius: 10px; color: #0D47A1;'><h3 style='margin-top: 0;'>Règle d'addition des relatifs</h3><ul style='text-align: left; list-style-type: disc; padding-left: 20px; font-size: 1rem;'><li><strong>Mêmes signes :</strong> on additionne les distances à zéro et on garde le signe commun.</li><li><strong>Signes contraires :</strong> on soustrait les distances à zéro et on garde le signe du nombre qui a la plus grande distance.</li></ul></div><div style='background-color: #FFF3E0; padding: 15px; border-radius: 8px; margin-top: 10px; color: #E65100;'><h4 style='margin-top: 0;'>Exemples</h4><p><strong>Mêmes signes :</strong></p><p><span class='math'>\\( (-5) + (-3) = -8 \\)</span></p><p><span class='math'>\\( (+7) + (+2) = +9 \\)</span></p><p><strong>Signes contraires :</strong></p><p><span class='math'>\\( (+7) + (-4) = +3 \\)</span> (car 7 > 4, donc signe +)</p><p><span class='math'>\\( (-9) + (+3) = -6 \\)</span> (car 9 > 3, donc signe −)</p></div><div style='background-color: #E8F5E9; padding: 15px; border-radius: 8px; margin-top: 10px; color: #1B5E20;'><h4 style='margin-top: 0;'>Astuce</h4><p>Imaginez une bataille : le plus fort gagne et impose son signe. La distance finale est la différence des forces.</p></div>",
    "texteParle": "Commençons par l'addition des nombres relatifs. Il y a deux cas. Premier cas : les deux nombres ont le même signe. On additionne alors leurs distances à zéro et on garde le signe commun. Par exemple, moins 5 plus moins 3 égale moins 8. Plus 7 plus plus 2 égale plus 9. Deuxième cas : les deux nombres ont des signes contraires. On soustrait leurs distances à zéro et on garde le signe du nombre qui a la plus grande distance à zéro. Par exemple, plus 7 plus moins 4 égale plus 3, car 7 est plus grand que 4, donc le signe est positif. Moins 9 plus plus 3 égale moins 6, car 9 est plus grand que 3, donc le signe est négatif. Une astuce : imaginez une bataille entre le positif et le négatif. Le plus fort gagne et impose son signe.",
    "note": "Mêmes signes : on additionne. Signes contraires : on soustrait."
  },
  {
    "titre": "Multiplication des nombres relatifs",
    "contenu": "<div style='background-color: #F3E5F5; padding: 20px; border-radius: 10px; color: #4A148C;'><h3 style='margin-top: 0;'>Règle des signes pour la multiplication</h3><p style='text-align: center; font-size: 1.1rem; font-weight: bold;'>(+) × (+) = (+) &nbsp;&nbsp; (−) × (−) = (+) &nbsp;&nbsp; (+) × (−) = (−) &nbsp;&nbsp; (−) × (+) = (−)</p><ul style='text-align: left; list-style-type: disc; padding-left: 20px; font-size: 1rem;'><li>Le produit de <strong>deux nombres de même signe</strong> est <strong>positif</strong>.</li><li>Le produit de <strong>deux nombres de signes contraires</strong> est <strong>négatif</strong>.</li></ul></div><div style='background-color: #FFF3E0; padding: 15px; border-radius: 8px; margin-top: 10px; color: #E65100;'><h4 style='margin-top: 0;'>Exemples</h4><p><span class='math'>\\( (-4) \\times (-3) = +12 \\)</span></p><p><span class='math'>\\( (+5) \\times (+2) = +10 \\)</span></p><p><span class='math'>\\( (-5) \\times (+2) = -10 \\)</span></p><p><span class='math'>\\( (+6) \\times (-3) = -18 \\)</span></p></div><div style='background-color: #E8F5E9; padding: 15px; border-radius: 8px; margin-top: 10px; color: #1B5E20;'><h4 style='margin-top: 0;'>Extension à plusieurs facteurs</h4><p>On compte le nombre de facteurs négatifs :</p><ul style='text-align: left; list-style-type: disc; padding-left: 20px; font-size: 1rem;'><li>Nombre <strong>pair</strong> de facteurs négatifs → résultat <strong>positif</strong></li><li>Nombre <strong>impair</strong> de facteurs négatifs → résultat <strong>négatif</strong></li></ul><p><strong>Exemple :</strong> <span class='math'>\\( (-2) \\times (-3) \\times (-1) = -6 \\)</span> (3 facteurs négatifs, impair)</p></div>",
    "texteParle": "Passons à la multiplication des nombres relatifs. La règle des signes est fondamentale. Plus fois plus donne plus. Moins fois moins donne plus. Plus fois moins donne moins. Moins fois plus donne moins. En résumé : le produit de deux nombres de même signe est positif, et le produit de deux nombres de signes contraires est négatif. Par exemple, moins 4 fois moins 3 égale plus 12. Plus 5 fois plus 2 égale plus 10. Moins 5 fois plus 2 égale moins 10. Cette règle s'étend à plusieurs facteurs : on compte le nombre de facteurs négatifs. Si ce nombre est pair, le résultat est positif. S'il est impair, le résultat est négatif. Par exemple, moins 2 fois moins 3 fois moins 1 égale moins 6, car il y a trois facteurs négatifs, donc un nombre impair.",
    "note": "Même signe → positif. Signes contraires → négatif."
  },
  {
    "titre": "Priorités opératoires",
    "contenu": "<div style='background-color: #E8F5E9; padding: 20px; border-radius: 10px; color: #1B5E20;'><h3 style='margin-top: 0;'>Ordre des opérations</h3><p>Dans un calcul, on effectue les opérations dans cet ordre :</p><ol style='text-align: left; padding-left: 20px; font-size: 1rem;'><li><strong>Parenthèses</strong> (et crochets, accolades) — en commençant par les plus internes.</li><li><strong>Puissances</strong> (et racines carrées).</li><li><strong>Multiplications et divisions</strong> — de gauche à droite.</li><li><strong>Additions et soustractions</strong> — de gauche à droite.</li></ol></div><div style='background-color: #FFF3E0; padding: 15px; border-radius: 8px; margin-top: 10px; color: #E65100;'><h4 style='margin-top: 0;'>Exemples</h4><p><span class='math'>\\( 3 + 4 \\times 2 = 3 + 8 = 11 \\)</span> (et non 14)</p><p><span class='math'>\\( (3 + 4) \\times 2 = 7 \\times 2 = 14 \\)</span></p><p><span class='math'>\\( 5 - 3 + 2 = 2 + 2 = 4 \\)</span> (de gauche à droite)</p><p><span class='math'>\\( 12 \\div 3 \\times 2 = 4 \\times 2 = 8 \\)</span> (de gauche à droite)</p></div><div style='background-color: #E3F2FD; padding: 15px; border-radius: 8px; margin-top: 10px; color: #0D47A1;'><h4 style='margin-top: 0;'>Attention aux pièges</h4><p><span class='math'>\\( -3^2 = -(3^2) = -9 \\)</span> mais <span class='math'>\\( (-3)^2 = +9 \\)</span></p><p>La puissance est prioritaire sur le signe moins.</p></div>",
    "texteParle": "Les priorités opératoires sont essentielles pour ne pas se tromper. L'ordre est le suivant : d'abord les parenthèses, en commençant par les plus internes. Ensuite les puissances et les racines carrées. Puis les multiplications et divisions, de gauche à droite. Enfin les additions et soustractions, de gauche à droite. Par exemple, 3 plus 4 fois 2 égale 3 plus 8 égale 11, et non 14. Attention au piège classique : moins 3 au carré égale moins 9, car la puissance est prioritaire sur le signe moins. Tandis que moins 3 entre parenthèses au carré égale plus 9.",
    "note": "PEMDAS : Parenthèses, Exposants, Multiplications/Divisions, Additions/Soustractions."
  },
  {
    "titre": "Addition et soustraction de fractions",
    "contenu": "<div style='background-color: #E3F2FD; padding: 20px; border-radius: 10px; color: #0D47A1;'><h3 style='margin-top: 0;'>Réduire au même dénominateur</h3><p>Pour additionner ou soustraire des fractions, il faut un <strong>dénominateur commun</strong> :</p><div class='math-block'><div class='math'>$$ \\frac{a}{b} + \\frac{c}{d} = \\frac{ad + bc}{bd} $$</div></div><p><strong>Technique rapide :</strong> multiplier les dénominateurs entre eux.</p></div><div style='background-color: #FFF3E0; padding: 15px; border-radius: 8px; margin-top: 10px; color: #E65100;'><h4 style='margin-top: 0;'>Exemple simple</h4><p><span class='math'>\\( \\frac{2}{3} + \\frac{1}{4} = \\frac{2 \\times 4 + 1 \\times 3}{3 \\times 4} = \\frac{8 + 3}{12} = \\frac{11}{12} \\)</span></p></div><div style='background-color: #E8F5E9; padding: 15px; border-radius: 8px; margin-top: 10px; color: #1B5E20;'><h4 style='margin-top: 0;'>Méthode du PPCM (plus rapide)</h4><p>On cherche le plus petit commun multiple des dénominateurs.</p><p><strong>Exemple :</strong> <span class='math'>\\( \\frac{5}{6} + \\frac{7}{8} \\)</span> — PPCM(6,8) = 24</p><p><span class='math'>\\( \\frac{5}{6} = \\frac{20}{24} \\)</span> et <span class='math'>\\( \\frac{7}{8} = \\frac{21}{24} \\)</span></p><p><span class='math'>\\( \\frac{20}{24} + \\frac{21}{24} = \\frac{41}{24} \\)</span></p></div>",
    "texteParle": "Abordons maintenant les fractions. Pour additionner ou soustraire deux fractions, il faut les mettre au même dénominateur. La formule générale est a sur b plus c sur d égale ad plus bc sur bd. C'est la technique rapide : on multiplie les dénominateurs entre eux. Par exemple, 2 tiers plus 1 quart égale 2 fois 4 plus 1 fois 3 sur 3 fois 4, ce qui donne 8 plus 3 sur 12, soit 11 sur 12. Pour être plus rapide, on peut utiliser le PPCM, le plus petit commun multiple des dénominateurs. Par exemple, pour 5 sixièmes plus 7 huitièmes, le PPCM de 6 et 8 est 24. On convertit : 5 sixièmes égale 20 vingt-quatrièmes, et 7 huitièmes égale 21 vingt-quatrièmes. La somme est 41 vingt-quatrièmes.",
    "note": "Toujours simplifier le résultat final."
  },
  {
    "titre": "Multiplication et division de fractions",
    "contenu": "<div style='background-color: #F3E5F5; padding: 20px; border-radius: 10px; color: #4A148C;'><h3 style='margin-top: 0;'>Multiplication</h3><p>On multiplie les numérateurs entre eux et les dénominateurs entre eux :</p><div class='math-block'><div class='math'>$$ \\frac{a}{b} \\times \\frac{c}{d} = \\frac{a \\times c}{b \\times d} $$</div></div><p><strong>Astuce :</strong> simplifier avant de multiplier !</p><p><span class='math'>\\( \\frac{4}{9} \\times \\frac{3}{8} = \\frac{4 \\times 3}{9 \\times 8} = \\frac{12}{72} = \\frac{1}{6} \\)</span></p><p>Ou plus rapide : <span class='math'>\\( \\frac{4}{8} \\times \\frac{3}{9} = \\frac{1}{2} \\times \\frac{1}{3} = \\frac{1}{6} \\)</span></p></div><div style='background-color: #E0F7FA; padding: 15px; border-radius: 8px; margin-top: 10px; color: #006064;'><h4 style='margin-top: 0;'>Division</h4><p>Diviser par une fraction, c'est multiplier par son <strong>inverse</strong> :</p><div class='math-block'><div class='math'>$$ \\frac{a}{b} \\div \\frac{c}{d} = \\frac{a}{b} \\times \\frac{d}{c} $$</div></div><p><strong>Exemple :</strong> <span class='math'>\\( \\frac{3}{4} \\div \\frac{2}{5} = \\frac{3}{4} \\times \\frac{5}{2} = \\frac{15}{8} \\)</span></p></div>",
    "texteParle": "Pour multiplier deux fractions, on multiplie les numérateurs entre eux et les dénominateurs entre eux. Mais l'astuce est de simplifier avant de multiplier. Par exemple, 4 neuvièmes fois 3 huitièmes. On peut simplifier 4 avec 8 et 3 avec 9, ce qui donne 1 demi fois 1 tiers, soit 1 sixième. Pour diviser par une fraction, on multiplie par son inverse. Par exemple, 3 quarts divisé par 2 cinquièmes égale 3 quarts fois 5 demis, soit 15 huitièmes.",
    "note": "Diviser par c/d revient à multiplier par d/c."
  },
  {
    "titre": "Fractions complexes (fractions de fractions)",
    "contenu": "<div style='background-color: #FCE4EC; padding: 20px; border-radius: 10px; color: #880E4F;'><h3 style='margin-top: 0;'>Grande fraction avec opérations en haut et en bas</h3><p>On a une fraction de la forme :</p><div class='math-block'><div class='math'>$$ \\frac{\\frac{a}{b} + \\frac{c}{d}}{\\frac{e}{f} - \\frac{g}{h}} $$</div></div><p><strong>Méthode :</strong></p><ol style='text-align: left; padding-left: 20px; font-size: 1rem;'><li>Calculer le numérateur (haut) séparément.</li><li>Calculer le dénominateur (bas) séparément.</li><li>Diviser le résultat du haut par le résultat du bas.</li></ol></div><div style='background-color: #FFF3E0; padding: 15px; border-radius: 8px; margin-top: 10px; color: #E65100;'><h4 style='margin-top: 0;'>Exemple complexe</h4><p><span class='math'>\\( \\frac{\\frac{1}{2} + \\frac{1}{3}}{\\frac{1}{4} - \\frac{1}{6}} \\)</span></p><p><strong>Haut :</strong> <span class='math'>\\( \\frac{1}{2} + \\frac{1}{3} = \\frac{3}{6} + \\frac{2}{6} = \\frac{5}{6} \\)</span></p><p><strong>Bas :</strong> <span class='math'>\\( \\frac{1}{4} - \\frac{1}{6} = \\frac{3}{12} - \\frac{2}{12} = \\frac{1}{12} \\)</span></p><p><strong>Résultat :</strong> <span class='math'>\\( \\frac{5}{6} \\div \\frac{1}{12} = \\frac{5}{6} \\times \\frac{12}{1} = \\frac{60}{6} = 10 \\)</span></p></div>",
    "texteParle": "Voici maintenant un cas plus complexe : les fractions de fractions. On a une grande fraction avec des opérations en haut et en bas. La méthode est simple : on calcule d'abord le numérateur, c'est-à-dire le haut, séparément. Ensuite on calcule le dénominateur, c'est-à-dire le bas, séparément. Enfin, on divise le résultat du haut par le résultat du bas. Par exemple, prenons la fraction : un demi plus un tiers, sur un quart moins un sixième. En haut, un demi plus un tiers égale trois sixièmes plus deux sixièmes, soit cinq sixièmes. En bas, un quart moins un sixième égale trois douzièmes moins deux douzièmes, soit un douzième. Le résultat final est cinq sixièmes divisé par un douzième, ce qui équivaut à cinq sixièmes fois douze, soit dix.",
    "note": "Toujours calculer le haut et le bas séparément avant de diviser."
  },
  {
    "titre": "Opérations avec les radicaux : multiplication",
    "contenu": "<div style='background-color: #E8F5E9; padding: 20px; border-radius: 10px; color: #1B5E20;'><h3 style='margin-top: 0;'>Multiplication de radicaux</h3><p>Pour <span class='math'>\\( a \\ge 0 \\)</span> et <span class='math'>\\( b \\ge 0 \\)</span> :</p><div class='math-block'><div class='math'>$$ \\sqrt{a} \\times \\sqrt{b} = \\sqrt{a \\times b} $$</div></div><p><strong>Exemple :</strong> <span class='math'>\\( \\sqrt{2} \\times \\sqrt{8} = \\sqrt{16} = 4 \\)</span></p><p><strong>Exemple :</strong> <span class='math'>\\( \\sqrt{3} \\times \\sqrt{12} = \\sqrt{36} = 6 \\)</span></p></div><div style='background-color: #FFF8E1; padding: 15px; border-radius: 8px; margin-top: 10px; color: #E65100;'><h4 style='margin-top: 0;'>Simplification par extraction de carrés parfaits</h4><p><span class='math'>\\( \\sqrt{50} = \\sqrt{25 \\times 2} = \\sqrt{25} \\times \\sqrt{2} = 5\\sqrt{2} \\)</span></p><p><span class='math'>\\( \\sqrt{72} = \\sqrt{36 \\times 2} = 6\\sqrt{2} \\)</span></p><p><span class='math'>\\( \\sqrt{18} = \\sqrt{9 \\times 2} = 3\\sqrt{2} \\)</span></p></div><div style='background-color: #E3F2FD; padding: 15px; border-radius: 8px; margin-top: 10px; color: #0D47A1;'><h4 style='margin-top: 0;'>Multiplication de coefficients</h4><p><span class='math'>\\( 2\\sqrt{3} \\times 5\\sqrt{7} = 10\\sqrt{21} \\)</span></p><p>On multiplie les coefficients entre eux et les radicandes entre eux.</p></div>",
    "texteParle": "Passons aux opérations avec les radicaux. Commençons par la multiplication. La propriété fondamentale est : racine de a fois racine de b égale racine de a fois b, à condition que a et b soient positifs. Par exemple, racine de 2 fois racine de 8 égale racine de 16, soit 4. Pour simplifier un radical, on extrait les carrés parfaits. Par exemple, racine de 50 égale racine de 25 fois 2, ce qui donne 5 racine de 2. De même, racine de 72 égale 6 racine de 2. Quand on multiplie des radicaux avec des coefficients, on multiplie les coefficients entre eux et les radicandes entre eux. Par exemple, 2 racine de 3 fois 5 racine de 7 égale 10 racine de 21.",
    "note": "√a × √b = √(ab) pour a, b ≥ 0."
  },
  {
    "titre": "Opérations avec les radicaux : addition",
    "contenu": "<div style='background-color: #FFF3E0; padding: 20px; border-radius: 10px; color: #E65100;'><h3 style='margin-top: 0;'>Addition de radicaux</h3><p><strong>Attention :</strong> <span class='math'>\\( \\sqrt{a} + \\sqrt{b} \\ne \\sqrt{a + b} \\)</span></p><p>On ne peut additionner que des radicaux <strong>semblables</strong> (même radicande).</p><div class='math-block'><div class='math'>$$ m\\sqrt{a} + n\\sqrt{a} = (m + n)\\sqrt{a} $$</div></div></div><div style='background-color: #FCE4EC; padding: 15px; border-radius: 8px; margin-top: 10px; color: #880E4F;'><h4 style='margin-top: 0;'>Piège classique</h4><p><span class='math'>\\( \\sqrt{9 + 16} = \\sqrt{25} = 5 \\)</span></p><p>mais <span class='math'>\\( \\sqrt{9} + \\sqrt{16} = 3 + 4 = 7 \\)</span></p><p>Donc <span class='math'>\\( \\sqrt{9 + 16} \\ne \\sqrt{9} + \\sqrt{16} \\)</span></p></div><div style='background-color: #E8F5E9; padding: 15px; border-radius: 8px; margin-top: 10px; color: #1B5E20;'><h4 style='margin-top: 0;'>Réduire des radicaux avant d'additionner</h4><p><span class='math'>\\( \\sqrt{50} + \\sqrt{18} = 5\\sqrt{2} + 3\\sqrt{2} = 8\\sqrt{2} \\)</span></p><p><span class='math'>\\( \\sqrt{12} + \\sqrt{75} = 2\\sqrt{3} + 5\\sqrt{3} = 7\\sqrt{3} \\)</span></p></div>",
    "texteParle": "Pour l'addition des radicaux, il y a un piège à éviter absolument : racine de a plus racine de b n'est pas égale à racine de a plus b. Par exemple, racine de 9 plus 16 égale racine de 25 égale 5, alors que racine de 9 plus racine de 16 égale 3 plus 4 égale 7. On ne peut additionner que des radicaux semblables, c'est-à-dire qui ont le même radicande. Par exemple, racine de 50 plus racine de 18. On simplifie d'abord : racine de 50 égale 5 racine de 2, et racine de 18 égale 3 racine de 2. La somme est 8 racine de 2. De même, racine de 12 plus racine de 75 égale 2 racine de 3 plus 5 racine de 3, soit 7 racine de 3.",
    "note": "√a + √b ≠ √(a+b). Toujours simplifier avant d'additionner."
  },
  {
    "titre": "Développer et réduire avec les radicaux",
    "contenu": "<div style='background-color: #E3F2FD; padding: 20px; border-radius: 10px; color: #0D47A1;'><h3 style='margin-top: 0;'>Développement d'expressions avec radicaux</h3><p>On utilise la distributivité :</p><div class='math-block'><div class='math'>$$ (\\sqrt{a} + \\sqrt{b})(\\sqrt{c} + \\sqrt{d}) = \\sqrt{ac} + \\sqrt{ad} + \\sqrt{bc} + \\sqrt{bd} $$</div></div><p><strong>Exemple :</strong></p><p><span class='math'>\\( (\\sqrt{3} + \\sqrt{2})(\\sqrt{3} - \\sqrt{2}) = 3 - \\sqrt{6} + \\sqrt{6} - 2 = 1 \\)</span></p></div><div style='background-color: #FFF8E1; padding: 15px; border-radius: 8px; margin-top: 10px; color: #E65100;'><h4 style='margin-top: 0;'>Exemple plus complexe</h4><p><span class='math'>\\( (2\\sqrt{5} + 3)(\\sqrt{5} - 2) \\)</span></p><p><span class='math'>\\( = 2\\sqrt{5} \\times \\sqrt{5} - 2\\sqrt{5} \\times 2 + 3\\sqrt{5} - 6 \\)</span></p><p><span class='math'>\\( = 2 \\times 5 - 4\\sqrt{5} + 3\\sqrt{5} - 6 \\)</span></p><p><span class='math'>\\( = 10 - \\sqrt{5} - 6 = 4 - \\sqrt{5} \\)</span></p></div><div style='background-color: #E8F5E9; padding: 15px; border-radius: 8px; margin-top: 10px; color: #1B5E20;'><h4 style='margin-top: 0;'>Réduire</h4><p>On regroupe les termes semblables (mêmes radicandes).</p></div>",
    "texteParle": "Pour développer des expressions avec des radicaux, on utilise la distributivité, comme pour les expressions algébriques. Par exemple, racine de 3 plus racine de 2 fois racine de 3 moins racine de 2. On développe : racine de 3 fois racine de 3 égale 3. Moins racine de 3 fois racine de 2 égale moins racine de 6. Plus racine de 2 fois racine de 3 égale plus racine de 6. Moins racine de 2 fois racine de 2 égale moins 2. Les termes en racine de 6 s'annulent, et il reste 3 moins 2 égale 1. Prenons un exemple plus complexe : 2 racine de 5 plus 3 fois racine de 5 moins 2. On développe terme à terme, puis on regroupe les termes semblables. Le résultat est 4 moins racine de 5.",
    "note": "Développer puis regrouper les termes semblables."
  },
  {
    "titre": "Produits remarquables avec radicaux",
    "contenu": "<div style='background-color: #F3E5F5; padding: 20px; border-radius: 10px; color: #4A148C;'><h3 style='margin-top: 0;'>Les trois identités avec radicaux</h3><div class='math-block'><div class='math'>$$ (\\sqrt{a} + \\sqrt{b})^2 = a + 2\\sqrt{ab} + b $$</div></div><div class='math-block'><div class='math'>$$ (\\sqrt{a} - \\sqrt{b})^2 = a - 2\\sqrt{ab} + b $$</div></div><div class='math-block'><div class='math'>$$ (\\sqrt{a} - \\sqrt{b})(\\sqrt{a} + \\sqrt{b}) = a - b $$</div></div></div><div style='background-color: #FFF3E0; padding: 15px; border-radius: 8px; margin-top: 10px; color: #E65100;'><h4 style='margin-top: 0;'>Exemples</h4><p><span class='math'>\\( (\\sqrt{3} + 1)^2 = 3 + 2\\sqrt{3} + 1 = 4 + 2\\sqrt{3} \\)</span></p><p><span class='math'>\\( (\\sqrt{5} - 2)^2 = 5 - 4\\sqrt{5} + 4 = 9 - 4\\sqrt{5} \\)</span></p><p><span class='math'>\\( (\\sqrt{7} - \\sqrt{3})(\\sqrt{7} + \\sqrt{3}) = 7 - 3 = 4 \\)</span></p></div><div style='background-color: #E8F5E9; padding: 15px; border-radius: 8px; margin-top: 10px; color: #1B5E20;'><h4 style='margin-top: 0;'>Application</h4><p>Ces identités servent à développer, factoriser et simplifier des expressions avec radicaux.</p></div>",
    "texteParle": "Les produits remarquables s'appliquent aussi aux radicaux. La première identité : racine de a plus racine de b au carré égale a plus 2 racine de ab plus b. La deuxième : racine de a moins racine de b au carré égale a moins 2 racine de ab plus b. La troisième : racine de a moins racine de b fois racine de a plus racine de b égale a moins b. Par exemple, racine de 3 plus 1 au carré égale 3 plus 2 racine de 3 plus 1, soit 4 plus 2 racine de 3. Racine de 7 moins racine de 3 fois racine de 7 plus racine de 3 égale 7 moins 3, soit 4. Ces identités sont très utiles pour simplifier des expressions.",
    "note": "Ces trois identités sont à connaître par cœur."
  },
  {
    "titre": "Écrire sans radical au dénominateur",
    "contenu": "<div style='background-color: #E0F7FA; padding: 20px; border-radius: 10px; color: #006064;'><h3 style='margin-top: 0;'>Rationalisation du dénominateur</h3><p>Pour éliminer un radical au dénominateur, on multiplie par le <strong>conjugué</strong>.</p><div class='math-block'><div class='math'>$$ \\frac{1}{\\sqrt{a} + \\sqrt{b}} = \\frac{\\sqrt{a} - \\sqrt{b}}{a - b} $$</div></div><div class='math-block'><div class='math'>$$ \\frac{1}{\\sqrt{a} - \\sqrt{b}} = \\frac{\\sqrt{a} + \\sqrt{b}}{a - b} $$</div></div></div><div style='background-color: #FFF3E0; padding: 15px; border-radius: 8px; margin-top: 10px; color: #E65100;'><h4 style='margin-top: 0;'>Exemples</h4><p><span class='math'>\\( \\frac{1}{\\sqrt{2} + 1} = \\frac{\\sqrt{2} - 1}{(\\sqrt{2})^2 - 1^2} = \\frac{\\sqrt{2} - 1}{2 - 1} = \\sqrt{2} - 1 \\)</span></p><p><span class='math'>\\( \\frac{3}{\\sqrt{5} - 2} = \\frac{3(\\sqrt{5} + 2)}{5 - 4} = 3(\\sqrt{5} + 2) = 3\\sqrt{5} + 6 \\)</span></p></div><div style='background-color: #E8F5E9; padding: 15px; border-radius: 8px; margin-top: 10px; color: #1B5E20;'><h4 style='margin-top: 0;'>Cas plus complexe</h4><p><span class='math'>\\( \\frac{2}{\\sqrt{7} + \\sqrt{3}} = \\frac{2(\\sqrt{7} - \\sqrt{3})}{7 - 3} = \\frac{2(\\sqrt{7} - \\sqrt{3})}{4} = \\frac{\\sqrt{7} - \\sqrt{3}}{2} \\)</span></p></div>",
    "texteParle": "Pour écrire une expression sans radical au dénominateur, on utilise la technique du conjugué. Le conjugué de racine de a plus racine de b est racine de a moins racine de b. En multipliant le numérateur et le dénominateur par le conjugué, on fait apparaître une différence de carrés au dénominateur, ce qui élimine les radicaux. Par exemple, 1 sur racine de 2 plus 1. On multiplie en haut et en bas par racine de 2 moins 1. Le dénominateur devient 2 moins 1, soit 1. Le résultat est racine de 2 moins 1. Autre exemple : 3 sur racine de 5 moins 2. On multiplie par racine de 5 plus 2. Le dénominateur devient 5 moins 4, soit 1. Le résultat est 3 racine de 5 plus 6.",
    "note": "Le conjugué de √a + √b est √a − √b."
  },
  {
    "titre": "Exemple complexe avec radicaux",

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentIndex = 0;
    let isSpeaking = false;
    let isPaused = false;
    let currentUtterance = null;
    let isLoading = false;
    let loadingTimeout = null;
    let isTransitioning = false;
    let speechSupported = true;
    let userInteracted = false;
    let isPlaying = false;
    let loadingCancelled = false;

    const total = slides.length;
    const synth = window.speechSynthesis;

    // Références jQuery
    const $title = $('#slideTitle');
    const $body = $('#slideBody');
    const $counter = $('#slideCounter');
    const $statusText = $('#statusText');
    const $statusBadge = $('#statusBadge');
    const $loading = $('#loadingOverlay');
    const $loadingText = $('#loadingText');
    const $loadingSub = $('#loadingSub');
    const $loadingTimeout = $('#loadingTimeout');
    const $loadingProgressBar = $('#loadingProgressBar');
    const $autoIndicator = $('#autoIndicator');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $replay = $('#replayBtn');
    const $play = $('#playBtn');
    const $cancelLoading = $('#cancelLoadingBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function setStatus(text, type) {
        $statusText.text(text);
        $statusBadge.removeClass('idle speaking error paused waiting loading');
        if (type === 'speaking') $statusBadge.addClass('speaking');
        else if (type === 'error') $statusBadge.addClass('error');
        else if (type === 'paused') $statusBadge.addClass('paused');
        else if (type === 'waiting') $statusBadge.addClass('waiting');
        else if (type === 'loading') $statusBadge.addClass('loading');
        else $statusBadge.addClass('idle');
    }

    function updatePlayButton() {
        if (isPlaying) {
            $play.addClass('playing');
            $play.find('.btn-icon').text('⏸');
            $play.find('.btn-label').text('Pause');
        } else {
            $play.removeClass('playing');
            $play.find('.btn-icon').text('▶');
            $play.find('.btn-label').text('Play');
        }
    }

    function showLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        
        loadingCancelled = false;
        isLoading = true;
        
        // Réinitialiser la barre de progression
        $loadingProgressBar.css('animation', 'none');
        $loadingProgressBar.css('width', '0%');
        // Forcer un reflow
        $loadingProgressBar[0].offsetHeight;
        $loadingProgressBar.css('animation', 'loadingProgress 30s ease-out forwards');
        
        $loadingText.text('Préparation vocale...');
        $loadingSub.text('Synthèse en cours');
        $loadingTimeout.text('⏱️ 30 secondes maximum');
        $loading.fadeIn(300);
        setStatus("⏳ Chargement...", 'loading');
        
        // 🔥 TIMEOUT DE 30 SECONDES
        loadingTimeout = setTimeout(() => {
            if (isLoading && !loadingCancelled) {
                hideLoading();
                setStatus("⚠️ Délai dépassé (30s)", 'error');
                isPlaying = false;
                updatePlayButton();
                $loadingSub.text('La synthèse vocale a pris trop de temps');
                $loadingTimeout.text('❌ Délai dépassé');
            }
        }, 30000);
    }

    function hideLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        isLoading = false;
        loadingCancelled = false;
        $loading.fadeOut(300);
        // Ne pas changer le statut si on est en train de parler
        if (!isSpeaking && !isPlaying) {
            setStatus("⏸ Lecture arrêtée", 'paused');
        }
    }

    function cancelLoading() {
        loadingCancelled = true;
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        hideLoading();
        stopSpeaking();
        setStatus("⏸ Annulé", 'paused');
        isPlaying = false;
        updatePlayButton();
        $loadingText.text('Annulé par l\'utilisateur');
        $loadingSub.text('Vous pouvez réessayer');
        $loadingTimeout.text('✕ Annulation');
    }

    // Arrêter la parole proprement
    function stopSpeaking() {
        try {
            if (synth && (synth.speaking || synth.pending)) {
                synth.cancel();
            }
        } catch(e) {
            console.warn('Erreur stopSpeaking:', e);
        }
        if (currentUtterance) {
            try {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance.onstart = null;
            } catch(e) {}
            currentUtterance = null;
        }
        isSpeaking = false;
        isPlaying = false;
        updatePlayButton();
    }

    // Mettre en pause la parole
    function pauseSpeaking() {
        try {
            if (synth && synth.speaking) {
                synth.pause();
                isPaused = true;
                isPlaying = false;
                setStatus("⏸ Lecture en pause", 'paused');
                updatePlayButton();
            }
        } catch(e) {
            console.warn('Erreur pauseSpeaking:', e);
            stopSpeaking();
        }
    }

    // Reprendre la parole
    function resumeSpeaking() {
        try {
            if (synth && synth.paused) {
                synth.resume();
                isPaused = false;
                isPlaying = true;
                setStatus("🔊 Lecture en cours", 'speaking');
                updatePlayButton();
            } else if (!isSpeaking && !synth.speaking && !synth.pending) {
                speakSlide(currentIndex);
            }
        } catch(e) {
            console.warn('Erreur resumeSpeaking:', e);
            speakSlide(currentIndex);
        }
    }

    function renderSlide(index) {
        const slide = slides[index];
        $title.text(slide.titre);

        let html = '';
        html += `<div class="content-card">${slide.contenu}</div>`;
        if (slide.note) {
            html += `<div class="note-box">${slide.note}</div>`;
        }
        $body.html(html);
        $counter.text(`${index+1} / ${total}`);

        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
        }
    }

    // ================================================================
    // LECTURE VOCALE
    // ================================================================
    function speakSlide(index) {
        return new Promise((resolve) => {
            const slide = slides[index];
            const text = slide.texteParle;
            
            if (!text || text.trim() === '' || !speechSupported) {
                resolve();
                return;
            }

            if (!window.speechSynthesis) {
                setStatus("❌ Synthèse vocale non supportée", 'error');
                speechSupported = false;
                resolve();
                return;
            }

            // Arrêter toute lecture en cours
            stopSpeaking();
            
            // Réinitialiser l'état de pause
            isPaused = false;
            
            showLoading();
            setStatus("Initialisation...", 'loading');

            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.92;
                utterance.pitch = 1.05;
                utterance.volume = 1;

                let isFinished = false;
                let errorHandled = false;

                utterance.onstart = function() {
                    if (loadingCancelled) {
                        stopSpeaking();
                        resolve();
                        return;
                    }
                    hideLoading();
                    isSpeaking = true;
                    isPlaying = true;
                    isPaused = false;
                    setStatus("🔊 Lecture en cours", 'speaking');
                    updatePlayButton();
                };

                utterance.onend = function() {
                    if (isFinished) return;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    setStatus("✅ Terminé", 'idle');
                    hideLoading();
                    updatePlayButton();
                    resolve();
                };

                utterance.onerror = function(e) {
                    if (isFinished || errorHandled) return;
                    errorHandled = true;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    hideLoading();
                    updatePlayButton();
                    
                    if (e.error === 'not-allowed') {
                        setStatus("⚠️ Permission refusée", 'error');
                    } else if (e.error === 'synthesis-unavailable') {
                        setStatus("⚠️ Synthèse indisponible", 'error');
                    } else if (e.error === 'canceled') {
                        setStatus("⏸ Annulé", 'paused');
                    } else {
                        setStatus("❌ Erreur audio: " + (e.error || 'inconnue'), 'error');
                    }
                    
                    resolve();
                };

                // Gestion du chargement des voix
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = function() {
                        if (!loadingCancelled) {
                            try {
                                synth.speak(utterance);
                            } catch(err) {
                                // Silencieux
                            }
                        }
                        synth.onvoiceschanged = null;
                    };
                }

                currentUtterance = utterance;
                
                if (!loadingCancelled) {
                    try {
                        synth.speak(utterance);
                    } catch(err) {
                        setTimeout(() => {
                            if (!loadingCancelled) {
                                try {
                                    synth.speak(utterance);
                                } catch(e) {
                                    setStatus("❌ Erreur de lecture", 'error');
                                    isPlaying = false;
                                    updatePlayButton();
                                    hideLoading();
                                    resolve();
                                }
                            } else {
                                resolve();
                            }
                        }, 100);
                    }
                } else {
                    resolve();
                }

            } catch(err) {
                hideLoading();
                setStatus("❌ Erreur générale", 'error');
                isPlaying = false;
                updatePlayButton();
                console.error('Erreur speakSlide:', err);
                resolve();
            }
        });
    }

    // ================================================================
    // NAVIGATION
    // ================================================================
    async function goToSlide(index) {
        if (isTransitioning) return;
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        
        // Si on est en train de lire, on met en pause avant de naviguer
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        // Arrêter complètement la lecture
        stopSpeaking();
        
        await new Promise(r => setTimeout(r, 50));
        
        if (index === currentIndex) {
            setStatus("📄 Slide actuel", 'idle');
            return;
        }

        isTransitioning = true;
        currentIndex = index;
        renderSlide(index);
        
        // Réinitialiser l'état de lecture
        isPlaying = false;
        updatePlayButton();
        setStatus("⏸ Lecture arrêtée", 'paused');

        await new Promise(r => setTimeout(r, 150));
        isTransitioning = false;
    }

    async function goToNext() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex + 1 < total) {
            await goToSlide(currentIndex + 1);
        } else {
            setStatus("🏁 Dernier slide", 'idle');
        }
    }

    async function goToPrev() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex - 1 >= 0) {
            await goToSlide(currentIndex - 1);
        } else {
            setStatus("🔁 Premier slide", 'idle');
        }
    }

    // ================================================================
    // GESTION PLAY/PAUSE
    // ================================================================
    function togglePlay() {
        if (!userInteracted) {
            userInteracted = true;
        }

        // Si le chargement est en cours, on l'annule
        if (isLoading) {
            cancelLoading();
            return;
        }

        // Si le synthétiseur est en pause, on reprend
        if (synth && synth.paused) {
            resumeSpeaking();
            return;
        }

        // Si la lecture est en cours, on met en pause
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
            return;
        }

        // Sinon, on démarre la lecture du slide courant
        if (!isSpeaking && !isPlaying) {
            stopSpeaking();
            speakSlide(currentIndex);
        }
    }

    // ================================================================
    // INIT
    // ================================================================
    async function init() {
        // Vérifier la compatibilité
        if (!window.speechSynthesis) {
            setStatus("❌ Synthèse vocale non supportée", 'error');
            speechSupported = false;
        }

        // Précharger les voix
        try {
            if (synth.getVoices) {
                synth.getVoices();
                setTimeout(() => {
                    try {
                        synth.getVoices();
                    } catch(e) {}
                }, 200);
            }
        } catch(e) {
            console.warn('Erreur chargement voix:', e);
        }

        // Afficher le premier slide
        renderSlide(0);
        $counter.text(`1 / ${total}`);
        
        // État initial
        setStatus("⏸ Appuie sur Play", 'paused');
        updatePlayButton();
        $autoIndicator.text('⏸ Lecture manuelle');

        // ================================================================
        // ÉVÉNEMENTS
        // ================================================================
        
        // Bouton Play/Pause
        $play.on('click', function() {
            togglePlay();
        });

        // Bouton Annuler le chargement
        $cancelLoading.on('click', function() {
            cancelLoading();
        });

        // Navigation
        $prev.on('click', function() {
            // Si chargement en cours, on annule
            if (isLoading) cancelLoading();
            goToPrev();
        });

        $next.on('click', function() {
            if (isLoading) cancelLoading();
            goToNext();
        });

        // Replay - relire le slide courant
        $replay.on('click', function() {
            if (isLoading) cancelLoading();
            stopSpeaking();
            setTimeout(() => {
                speakSlide(currentIndex);
            }, 100);
        });

        // Support du clavier (espace pour play/pause)
        $(document).on('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });

        // Nettoyage
        $(window).on('beforeunload', function() {
            try {
                if (synth.speaking) synth.cancel();
            } catch(e) {}
            hideLoading();
        });

        // Gérer les cas où la synthèse se termine de manière inattendue
        setInterval(() => {
            if (isPlaying && !synth.speaking && !synth.pending && !isPaused && !isLoading) {
                isPlaying = false;
                updatePlayButton();
                setStatus("⏸ Lecture arrêtée", 'paused');
            }
        }, 1000);
    }

    init();
});

        });
        
        document.querySelectorAll('.math-block').forEach(block => {
            block.style.background = 'rgba(0,0,0,0.05)';
            block.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.btn').forEach(btn => {
            btn.style.color = '#2d3748';
        });
        
        const statusBadge = document.querySelector('.status-badge');
        if (statusBadge) {
            statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
            statusBadge.style.color = '#2b6cb0';
        }
        
        const slideCounter = document.querySelector('.slide-counter');
        if (slideCounter) {
            slideCounter.style.color = '#4a5568';
        }
        
        const autoIndicator = document.querySelector('.auto-indicator');
        if (autoIndicator) {
            autoIndicator.style.color = '#718096';
        }
        
        document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
            if (!el.closest('.note-box')) {
                el.style.color = '#2c3e50';
            }
        });
        
        document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
            if (!el.closest('.note-box') && !el.closest('.math-block')) {
                el.style.color = '#2d3748';
            }
        });
        
        const themeBtn = document.getElementById('themeToggle');
        if (themeBtn) {
            themeBtn.textContent = '🌓';
            themeBtn.title = 'Passer en mode nuit';
        }
    });
</script>
</body>
</html>
