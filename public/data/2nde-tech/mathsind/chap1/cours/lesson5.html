<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Présentation mobile</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' },
            options: { skipHtmlTypes: 'script' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 500px;
        margin: 0 auto;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    .slide-header {
        flex-shrink: 0;
        padding: 18px 16px 10px 16px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        z-index: 10;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .slide-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
    }

    .content-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 18px 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        flex-shrink: 0;
    }

    .content-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .content-card li {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        line-height: 1.5;
    }

    .content-card li:last-child {
        border-bottom: none;
    }

    .bullet-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
    }

    .math-block {
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        overflow-x: auto;
        flex-shrink: 0;
        margin: 4px 0;
    }

    .math-block .math {
        font-size: 1.2rem;
        color: #e2e8f0;
    }

    .note-box {
        background: rgba(96, 165, 250, 0.08);
        border-left: 4px solid #60a5fa;
        padding: 12px 16px;
        border-radius: 12px;
        font-style: italic;
        font-size: 0.9rem;
        color: #cbd5e1;
        flex-shrink: 0;
    }

    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        border-radius: 0;
        flex-direction: column;
    }

    .loading-card {
        background: #1e293b;
        padding: 32px 28px;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #334155;
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px auto;
    }

    .loading-text {
        font-weight: 600;
        font-size: 1.1rem;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    .loading-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 16px;
    }
    .loading-progress {
        height: 3px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        animation: loadingProgress 30s ease-out forwards;
    }

    .loading-timeout {
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 12px;
    }

    .btn-cancel-loading {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 40px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #f87171;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }

    .btn-cancel-loading:active {
        transform: scale(0.94);
        background: rgba(239, 68, 68, 0.25);
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
    }

    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .slide-counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255,255,255,0.05);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(255,255,255,0.04);
    }

    .status-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 30px;
        background: rgba(96, 165, 250, 0.12);
        color: #93bbfc;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
    }

    .status-badge .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: pulse-dot 1.2s infinite;
        flex-shrink: 0;
    }

    .status-badge.idle .dot {
        animation: none;
        background: #64748b;
    }
    .status-badge.speaking .dot {
        background: #34d399;
        animation: pulse-dot 0.8s infinite;
    }
    .status-badge.error .dot {
        background: #f87171;
        animation: none;
    }
    .status-badge.paused .dot {
        animation: none;
        background: #fbbf24;
    }
    .status-badge.waiting .dot {
        animation: pulse-dot 1.5s infinite;
        background: #fbbf24;
    }
    .status-badge.loading .dot {
        animation: pulse-dot 0.5s infinite;
        background: #60a5fa;
    }

    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.7); }
    }

    .footer-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(255,255,255,0.1);
    }

    .btn-secondary {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-play {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
        min-width: 80px;
        justify-content: center;
    }
    .btn-play:active {
        background: rgba(52, 211, 153, 0.25);
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
    }

    .auto-indicator {
        font-size: 0.65rem;
        color: #64748b;
        text-align: center;
        letter-spacing: 0.3px;
        padding: 2px 0;
    }

    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.2rem;
        }
        .content-card li {
            font-size: 0.9rem;
            padding: 8px 0;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .btn-play {
            min-width: 60px;
        }
        .footer-buttons {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
        .loading-card {
            padding: 20px 16px;
        }
        .math-block .math {
            font-size: 1rem;
        }
    }

    @media (min-width: 600px) {
        .app-container {
            max-width: 480px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
        .loading-overlay {
            border-radius: 32px;
        }
    }

    /* Mode jour (par défaut) */
    html, body {
        background: #f0f4f8 !important;
        color: #1a202c !important;
    }
    .app-container {
        background: linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%) !important;
    }
    .slide-header {
        background: rgba(255, 255, 255, 0.85) !important;
        border-bottom: 1px solid rgba(0,0,0,0.08) !important;
    }
    .slide-header h1 {
        background: linear-gradient(135deg, #2b6cb0, #6b46c1) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        background-clip: text !important;
    }
    .slide-footer {
        background: rgba(255, 255, 255, 0.9) !important;
        border-top: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card {
        background: rgba(255,255,255,0.8) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card li {
        border-bottom: 1px solid rgba(0,0,0,0.05) !important;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.12) !important;
        border-left: 4px solid #4299e1 !important;
        color: #2c3e50 !important;
    }
    .math-block {
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .math-block .math {
        color: #2d3748 !important;
    }
    .slide-counter {
        color: #4a5568 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .status-badge {
        background: rgba(96, 165, 250, 0.15) !important;
        color: #2b6cb0 !important;
        border: 1px solid rgba(96, 165, 250, 0.15) !important;
    }
    .btn {
        color: #2d3748 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .btn-secondary {
        background: rgba(0,0,0,0.04) !important;
        border-color: rgba(0,0,0,0.08) !important;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15) !important;
        border-color: rgba(52, 211, 153, 0.2) !important;
        color: #38a169 !important;
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15) !important;
        border-color: rgba(251, 191, 36, 0.2) !important;
        color: #d69e2e !important;
    }
    .auto-indicator {
        color: #718096 !important;
    }
    .loading-card {
        background: #ffffff !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .loading-text {
        color: #1a202c !important;
    }
    .loading-sub {
        color: #4a5568 !important;
    }
</style>
</head>
<body>

<div class="app-container">

    <header class="slide-header">
        <h1 id="slideTitle">Chargement...</h1>
    </header>

    <main class="slide-body" id="slideBody"></main>

    <!-- LOADING OVERLAY AVEC BOUTON ANNULER -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Préparation vocale...</div>
            <div class="loading-sub" id="loadingSub">Synthèse en cours</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loadingProgressBar"></div>
            </div>
            <div class="loading-timeout" id="loadingTimeout">⏱️ 30 secondes maximum</div>
            <button class="btn-cancel-loading" id="cancelLoadingBtn">
                <span>✕</span> Annuler
            </button>
        </div>
    </div>

    <footer class="slide-footer">
        <div class="footer-top">
            <span class="slide-counter" id="slideCounter">1 / 3</span>
            <span class="status-badge idle" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">Prêt</span>
            </span>
        </div>

        <div class="footer-buttons">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-secondary" id="replayBtn">
                <span class="btn-icon">🔁</span> <span class="btn-label">Relire</span>
            </button>
            <button class="btn btn-play" id="playBtn">
                <span class="btn-icon">▶</span> <span class="btn-label">Play</span>
            </button>
        </div>

        <div class="auto-indicator" id="autoIndicator">⏸ Lecture manuelle</div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // SLIDES
    // ================================================================
   const slides = [
  {
    "titre": "Les puissances : introduction",
    "contenu": "<div style='background-color: #E8EAF6; padding: 20px; border-radius: 10px; color: #1A237E;'><h3 style='margin-top: 0;'>Qu'est-ce qu'une puissance ?</h3><p>Une <strong>puissance</strong> est une écriture qui permet de représenter une multiplication répétée d'un même nombre par lui-même.</p><div class='math-block'><div class='math'>$$ a^n = \\underbrace{a \\times a \\times a \\times \\cdots \\times a}_{n \\text{ facteurs}} $$</div></div><ul style='text-align: left; list-style-type: disc; padding-left: 20px; font-size: 1rem;'><li><strong>a</strong> est appelé la <strong>base</strong>.</li><li><strong>n</strong> est appelé l'<strong>exposant</strong>.</li><li><span class='math'>\\( a^n \\)</span> se lit « a puissance n » ou « a exposant n ».</li></ul></div><div style='background-color: #FFF3E0; padding: 15px; border-radius: 8px; margin-top: 10px; color: #E65100;'><h4 style='margin-top: 0;'>Exemples</h4><p><span class='math'>\\( 2^3 = 2 \\times 2 \\times 2 = 8 \\)</span></p><p><span class='math'>\\( 5^2 = 5 \\times 5 = 25 \\)</span></p><p><span class='math'>\\( 10^4 = 10 \\times 10 \\times 10 \\times 10 = 10000 \\)</span></p><p><span class='math'>\\( (-3)^2 = (-3) \\times (-3) = 9 \\)</span></p></div>",
    "texteParle": "Commençons par définir ce qu'est une puissance. Une puissance est une écriture qui permet de représenter une multiplication répétée d'un même nombre par lui-même. Par exemple, a puissance n signifie qu'on multiplie a par lui-même n fois. Dans cette écriture, a est appelé la base et n est appelé l'exposant. On lit a puissance n ou a exposant n. Par exemple, 2 puissance 3 égale 2 fois 2 fois 2, soit 8. 5 au carré égale 5 fois 5, soit 25. 10 puissance 4 égale 10 fois 10 fois 10 fois 10, soit 10000. Et moins 3 au carré égale moins 3 fois moins 3, soit 9.",
    "note": "a^n = a × a × ... × a (n facteurs)."
  },
  {
    "titre": "Exposant positif et exposant nul",
    "contenu": "<div style='background-color: #E3F2FD; padding: 20px; border-radius: 10px; color: #0D47A1;'><h3 style='margin-top: 0;'>Exposant positif</h3><p>Pour <span class='math'>\\( n \\in \\mathbb{N}^* \\)</span> :</p><div class='math-block'><div class='math'>$$ a^n = \\underbrace{a \\times a \\times \\cdots \\times a}_{n \\text{ facteurs}} $$</div></div><h3 style='margin-top: 15px;'>Exposant nul</h3><p>Pour tout réel <span class='math'>\\( a \\ne 0 \\)</span> :</p><div class='math-block'><div class='math'>$$ a^0 = 1 $$</div></div><p><strong>Attention :</strong> <span class='math'>\\( 0^0 \\)</span> n'est pas défini.</p></div><div style='background-color: #FFF3E0; padding: 15px; border-radius: 8px; margin-top: 10px; color: #E65100;'><h4 style='margin-top: 0;'>Exemples</h4><p><span class='math'>\\( 3^4 = 3 \\times 3 \\times 3 \\times 3 = 81 \\)</span></p><p><span class='math'>\\( 7^0 = 1 \\)</span></p><p><span class='math'>\\( (-5)^0 = 1 \\)</span></p><p><span class='math'>\\( \\left(\\frac{2}{3}\\right)^0 = 1 \\)</span></p></div><div style='background-color: #E8F5E9; padding: 15px; border-radius: 8px; margin-top: 10px; color: #1B5E20;'><h4 style='margin-top: 0;'>À retenir</h4><p>Tout nombre non nul élevé à la puissance 0 vaut 1.</p></div>",
    "texteParle": "Pour un exposant positif, a puissance n est le produit de n facteurs égaux à a. Par exemple, 3 puissance 4 égale 3 fois 3 fois 3 fois 3, soit 81. Pour un exposant nul, tout nombre non nul élevé à la puissance 0 vaut 1. Par exemple, 7 puissance 0 égale 1, moins 5 puissance 0 égale 1, et 2 tiers puissance 0 égale 1. Attention, 0 puissance 0 n'est pas défini. C'est une convention mathématique.",
    "note": "a^0 = 1 pour tout a ≠ 0. 0^0 n'est pas défini."
  },
  {
    "titre": "Exposant négatif",
    "contenu": "<div style='background-color: #F3E5F5; padding: 20px; border-radius: 10px; color: #4A148C;'><h3 style='margin-top: 0;'>Exposant négatif</h3><p>Pour tout réel <span class='math'>\\( a \\ne 0 \\)</span> et tout entier <span class='math'>\\( n > 0 \\)</span> :</p><div class='math-block'><div class='math'>$$ a^{-n} = \\frac{1}{a^n} $$</div></div><p>Un exposant négatif signifie donc l'<strong>inverse</strong> de la puissance positive.</p></div><div style='background-color: #FFF3E0; padding: 15px; border-radius: 8px; margin-top: 10px; color: #E65100;'><h4 style='margin-top: 0;'>Exemples</h4><p><span class='math'>\\( 2^{-3} = \\frac{1}{2^3} = \\frac{1}{8} \\)</span></p><p><span class='math'>\\( 5^{-2} = \\frac{1}{5^2} = \\frac{1}{25} \\)</span></p><p><span class='math'>\\( 10^{-3} = \\frac{1}{10^3} = \\frac{1}{1000} = 0,001 \\)</span></p><p><span class='math'>\\( \\left(\\frac{2}{3}\\right)^{-2} = \\left(\\frac{3}{2}\\right)^2 = \\frac{9}{4} \\)</span></p></div><div style='background-color: #E8F5E9; padding: 15px; border-radius: 8px; margin-top: 10px; color: #1B5E20;'><h4 style='margin-top: 0;'>À retenir</h4><p>Un exposant négatif ne rend pas le résultat négatif : il donne l'inverse.</p></div>",
    "texteParle": "Passons aux exposants négatifs. Pour tout réel a non nul et tout entier n positif, a puissance moins n égale 1 sur a puissance n. Un exposant négatif signifie donc l'inverse de la puissance positive. Par exemple, 2 puissance moins 3 égale 1 sur 2 puissance 3, soit 1 huitième. 5 puissance moins 2 égale 1 sur 25. 10 puissance moins 3 égale 1 sur 1000, soit 0,001. Pour une fraction, 2 tiers puissance moins 2 égale 3 demis au carré, soit 9 quarts. Attention, un exposant négatif ne rend pas le résultat négatif : il donne l'inverse.",
    "note": "a^(−n) = 1/a^n. L'exposant négatif donne l'inverse."
  },
  {
    "titre": "Produit de puissances de même base",
    "contenu": "<div style='background-color: #E0F7FA; padding: 20px; border-radius: 10px; color: #006064;'><h3 style='margin-top: 0;'>Produit de puissances de même base</h3><p>Pour tout réel <span class='math'>\\( a \\)</span> et tous entiers <span class='math'>\\( m \\)</span> et <span class='math'>\\( n \\)</span> :</p><div class='math-block'><div class='math'>$$ a^m \\times a^n = a^{m+n} $$</div></div><p>On <strong>additionne</strong> les exposants.</p></div><div style='background-color: #FFF3E0; padding: 15px; border-radius: 8px; margin-top: 10px; color: #E65100;'><h4 style='margin-top: 0;'>Exemples</h4><p><span class='math'>\\( 2^3 \\times 2^4 = 2^{3+4} = 2^7 = 128 \\)</span></p><p><span class='math'>\\( 5^2 \\times 5^{-3} = 5^{2-3} = 5^{-1} = \\frac{1}{5} \\)</span></p><p><span class='math'>\\( x^3 \\times x^5 = x^8 \\)</span></p><p><span class='math'>\\( 3^2 \\times 3^0 = 3^{2+0} = 3^2 = 9 \\)</span></p></div><div style='background-color: #E8F5E9; padding: 15px; border-radius: 8px; margin-top: 10px; color: #1B5E20;'><h4 style='margin-top: 0;'>Vérification</h4><p><span class='math'>\\( 2^3 \\times 2^4 = 8 \\times 16 = 128 = 2^7 \\)</span> ✓</p></div>",
    "texteParle": "Voici la première propriété des puissances : le produit de deux puissances de même base. Pour tout réel a et tous entiers m et n, a puissance m fois a puissance n égale a puissance m plus n. On additionne les exposants. Par exemple, 2 puissance 3 fois 2 puissance 4 égale 2 puissance 7, soit 128. 5 puissance 2 fois 5 puissance moins 3 égale 5 puissance moins 1, soit 1 cinquième. De même, x puissance 3 fois x puissance 5 égale x puissance 8. On peut vérifier : 2 puissance 3 vaut 8, 2 puissance 4 vaut 16, et 8 fois 16 vaut 128, ce qui est bien 2 puissance 7.",
    "note": "a^m × a^n = a^(m+n) — on additionne les exposants."
  },
  {
    "titre": "Quotient de puissances de même base",
    "contenu": "<div style='background-color: #E3F2FD; padding: 20px; border-radius: 10px; color: #0D47A1;'><h3 style='margin-top: 0;'>Quotient de puissances de même base</h3><p>Pour tout réel <span class='math'>\\( a \\ne 0 \\)</span> et tous entiers <span class='math'>\\( m \\)</span> et <span class='math'>\\( n \\)</span> :</p><div class='math-block'><div class='math'>$$ \\frac{a^m}{a^n} = a^{m-n} $$</div></div><p>On <strong>soustrait</strong> les exposants.</p></div><div style='background-color: #FFF3E0; padding: 15px; border-radius: 8px; margin-top: 10px; color: #E65100;'><h4 style='margin-top: 0;'>Exemples</h4><p><span class='math'>\\( \\frac{2^5}{2^3} = 2^{5-3} = 2^2 = 4 \\)</span></p><p><span class='math'>\\( \\frac{3^4}{3^6} = 3^{4-6} = 3^{-2} = \\frac{1}{9} \\)</span></p><p><span class='math'>\\( \\frac{x^7}{x^2} = x^{7-2} = x^5 \\)</span></p><p><span class='math'>\\( \\frac{5^3}{5^3} = 5^{3-3} = 5^0 = 1 \\)</span></p></div><div style='background-color: #E8F5E9; padding: 15px; border-radius: 8px; margin-top: 10px; color: #1B5E20;'><h4 style='margin-top: 0;'>Vérification</h4><p><span class='math'>\\( \\frac{2^5}{2^3} = \\frac{32}{8} = 4 = 2^2 \\)</span> ✓</p></div>",
    "texteParle": "Deuxième propriété : le quotient de deux puissances de même base. Pour tout réel a non nul et tous entiers m et n, a puissance m sur a puissance n égale a puissance m moins n. On soustrait les exposants. Par exemple, 2 puissance 5 sur 2 puissance 3 égale 2 puissance 2, soit 4. 3 puissance 4 sur 3 puissance 6 égale 3 puissance moins 2, soit 1 neuvième. x puissance 7 sur x puissance 2 égale x puissance 5. Et 5 puissance 3 sur 5 puissance 3 égale 5 puissance 0, soit 1. On peut vérifier : 2 puissance 5 vaut 32, 2 puissance 3 vaut 8, et 32 divisé par 8 vaut 4, ce qui est bien 2 au carré.",
    "note": "a^m / a^n = a^(m−n) — on soustrait les exposants."
  },
  {
    "titre": "Puissance d'une puissance",
    "contenu": "<div style='background-color: #F3E5F5; padding: 20px; border-radius: 10px; color: #4A148C;'><h3 style='margin-top: 0;'>Puissance d'une puissance</h3><p>Pour tout réel <span class='math'>\\( a \\)</span> et tous entiers <span class='math'>\\( m \\)</span> et <span class='math'>\\( n \\)</span> :</p><div class='math-block'><div class='math'>$$ (a^m)^n = a^{m \\times n} $$</div></div><p>On <strong>multiplie</strong> les exposants.</p></div><div style='background-color: #FFF3E0; padding: 15px; border-radius: 8px; margin-top: 10px; color: #E65100;'><h4 style='margin-top: 0;'>Exemples</h4><p><span class='math'>\\( (2^3)^2 = 2^{3 \\times 2} = 2^6 = 64 \\)</span></p><p><span class='math'>\\( (5^{-2})^3 = 5^{-2 \\times 3} = 5^{-6} = \\frac{1}{5^6} \\)</span></p><p><span class='math'>\\( (x^4)^3 = x^{4 \\times 3} = x^{12} \\)</span></p><p><span class='math'>\\( ((2^2)^3)^2 = 2^{2 \\times 3 \\times 2} = 2^{12} = 4096 \\)</span></p></div><div style='background-color: #E8F5E9; padding: 15px; border-radius: 8px; margin-top: 10px; color: #1B5E20;'><h4 style='margin-top: 0;'>Vérification</h4><p><span class='math'>\\( (2^3)^2 = 8^2 = 64 = 2^6 \\)</span> ✓</p></div>",
    "texteParle": "Troisième propriété : la puissance d'une puissance. Pour tout réel a et tous entiers m et n, a puissance m le tout puissance n égale a puissance m fois n. On multiplie les exposants. Par exemple, 2 puissance 3 le tout au carré égale 2 puissance 6, soit 64. 5 puissance moins 2 le tout au cube égale 5 puissance moins 6, soit 1 sur 5 puissance 6. x puissance 4 le tout au cube égale x puissance 12. On peut vérifier : 2 puissance 3 vaut 8, et 8 au carré vaut 64, ce qui est bien 2 puissance 6.",
    "note": "(a^m)^n = a^(m×n) — on multiplie les exposants."
  },
  {
    "titre": "Puissance d'un produit et d'un quotient",
    "contenu": "<div style='background-color: #E0F7FA; padding: 20px; border-radius: 10px; color: #006064;'><h3 style='margin-top: 0;'>Puissance d'un produit</h3><p>Pour tous réels <span class='math'>\\( a \\)</span> et <span class='math'>\\( b \\)</span> et tout entier <span class='math'>\\( n \\)</span> :</p><div class='math-block'><div class='math'>$$ (ab)^n = a^n \\times b^n $$</div></div><h3 style='margin-top: 15px;'>Puissance d'un quotient</h3><p>Pour tous réels <span class='math'>\\( a \\)</span> et <span class='math'>\\( b \\ne 0 \\)</span> et tout entier <span class='math'>\\( n \\)</span> :</p><div class='math-block'><div class='math'>$$ \\left(\\frac{a}{b}\\right)^n = \\frac{a^n}{b^n} $$</div></div></div><div style='background-color: #FFF3E0; padding: 15px; border-radius: 8px; margin-top: 10px; color: #E65100;'><h4 style='margin-top: 0;'>Exemples</h4><p><span class='math'>\\( (2 \\times 3)^2 = 2^2 \\times 3^2 = 4 \\times 9 = 36 \\)</span></p><p><span class='math'>\\( (2x)^3 = 2^3 \\times x^3 = 8x^3 \\)</span></p><p><span class='math'>\\( \\left(\\frac{3}{4}\\right)^2 = \\frac{3^2}{4^2} = \\frac{9}{16} \\)</span></p><p><span class='math'>\\( \\left(\\frac{x}{2}\\right)^3 = \\frac{x^3}{2^3} = \\frac{x^3}{8} \\)</span></p></div>",
    "texteParle": "Quatrième et cinquième propriétés : la puissance d'un produit et la puissance d'un quotient. Pour tous réels a et b et tout entier n, a fois b le tout puissance n égale a puissance n fois b puissance n. De même, a sur b le tout puissance n égale a puissance n sur b puissance n, à condition que b soit non nul. Par exemple, 2 fois 3 le tout au carré égale 2 au carré fois 3 au carré, soit 4 fois 9, soit 36. 2x le tout au cube égale 2 au cube fois x au cube, soit 8 x cube. 3 quarts au carré égale 3 au carré sur 4 au carré, soit 9 seizièmes. Et x sur 2 le tout au cube égale x cube sur 8.",
    "note": "(ab)^n = a^n × b^n et (a/b)^n = a^n / b^n."

  {
    "titre": "Puissances de 10 et notation scientifique",
    "contenu": "<div style='background-color: #FFF8E1; padding: 20px; border-radius: 10px; color: #E65100;'><h3 style='margin-top: 0;'>Puissances de 10</h3><p>Les puissances de 10 sont très utilisées en sciences :</p><ul style='text-align: left; list-style-type: disc; padding-left: 20px; font-size: 1rem;'><li><span class='math'>\\( 10^0 = 1 \\)</span></li><li><span class='math'>\\( 10^1 = 10 \\)</span></li><li><span class='math'>\\( 10^2 = 100 \\)</span></li><li><span class='math'>\\( 10^3 = 1000 \\)</span></li><li><span class='math'>\\( 10^{-1} = 0,1 \\)</span></li><li><span class='math'>\\( 10^{-2} = 0,01 \\)</span></li><li><span class='math'>\\( 10^{-3} = 0,001 \\)</span></li></ul></div><div style='background-color: #E3F2FD; padding: 15px; border-radius: 8px; margin-top: 10px; color: #0D47A1;'><h4 style='margin-top: 0;'>Notation scientifique</h4><p>Un nombre est écrit en notation scientifique sous la forme :</p><div class='math-block'><div class='math'>$$ a \\times 10^n \\quad \\text{avec } 1 \\le a < 10 \\text{ et } n \\in \\mathbb{Z} $$</div></div><p><strong>Exemples :</strong></p><p><span class='math'>\\( 0,00045 = 4,5 \\times 10^{-4} \\)</span></p><p><span class='math'>\\( 320000 = 3,2 \\times 10^5 \\)</span></p><p><span class='math'>\\( 0,00000012 = 1,2 \\times 10^{-7} \\)</span></p></div>",
    "texteParle": "Les puissances de 10 sont très utilisées en sciences. Retenons quelques valeurs : 10 puissance 0 égale 1, 10 puissance 1 égale 10, 10 puissance 2 égale 100, 10 puissance 3 égale 1000. Pour les exposants négatifs : 10 puissance moins 1 égale 0,1, 10 puissance moins 2 égale 0,01, 10 puissance moins 3 égale 0,001. La notation scientifique consiste à écrire un nombre sous la forme a fois 10 puissance n, avec a compris entre 1 et 10, et n un entier relatif. Par exemple, 0,00045 s'écrit 4,5 fois 10 puissance moins 4. 320000 s'écrit 3,2 fois 10 puissance 5. Et 0,00000012 s'écrit 1,2 fois 10 puissance moins 7.",
    "note": "Notation scientifique : a × 10^n avec 1 ≤ a < 10."

  {
    "titre": "Simplification de fractions avec puissances",
    "contenu": "<div style='background-color: #FCE4EC; padding: 20px; border-radius: 10px; color: #880E4F;'><h3 style='margin-top: 0;'>Réduire des fractions avec puissances</h3><p>On utilise les propriétés des puissances pour simplifier.</p><p><strong>Méthode :</strong></p><ol style='text-align: left; padding-left: 20px; font-size: 1rem;'><li>Regrouper les puissances de même base.</li><li>Appliquer <span class='math'>\\( \\frac{a^m}{a^n} = a^{m-n} \\)</span>.</li><li>Simplifier les coefficients numériques.</li></ol></div><div style='background-color: #FFF3E0; padding: 15px; border-radius: 8px; margin-top: 10px; color: #E65100;'><h4 style='margin-top: 0;'>Exemple 1</h4><p><span class='math'>\\( \\frac{2^5 \\times 3^3}{2^3 \\times 3^2} = 2^{5-3} \\times 3^{3-2} = 2^2 \\times 3^1 = 4 \\times 3 = 12 \\)</span></p></div><div style='background-color: #E8F5E9; padding: 15px; border-radius: 8px; margin-top: 10px; color: #1B5E20;'><h4 style='margin-top: 0;'>Exemple 2</h4><p><span class='math'>\\( \\frac{6^4 \\times 2^3}{3^2 \\times 2^5} = \\frac{(2 \\times 3)^4 \\times 2^3}{3^2 \\times 2^5} = \\frac{2^4 \\times 3^4 \\times 2^3}{3^2 \\times 2^5} \\)</span></p><p><span class='math'>\\( = 2^{4+3-5} \\times 3^{4-2} = 2^2 \\times 3^2 = 4 \\times 9 = 36 \\)</span></p></div><div style='background-color: #E3F2FD; padding: 15px; border-radius: 8px; margin-top: 10px; color: #0D47A1;'><h4 style='margin-top: 0;'>Exemple 3</h4><p><span class='math'>\\( \\frac{10^5 \\times 10^{-2}}{10^4} = 10^{5-2-4} = 10^{-1} = 0,1 \\)</span></p></div>",
    "texteParle": "Voyons comment simplifier des fractions contenant des puissances. La méthode consiste à regrouper les puissances de même base, puis à appliquer la propriété de quotient : a puissance m sur a puissance n égale a puissance m moins n. Enfin, on simplifie les coefficients numériques. Par exemple, 2 puissance 5 fois 3 puissance 3 sur 2 puissance 3 fois 3 puissance 2. On regroupe les 2 : 2 puissance 5 moins 3 égale 2 puissance 2. Et les 3 : 3 puissance 3 moins 2 égale 3 puissance 1. Donc le résultat est 2 au carré fois 3, soit 4 fois 3, soit 12. Autre exemple : 6 puissance 4 fois 2 puissance 3 sur 3 puissance 2 fois 2 puissance 5. On écrit 6 comme 2 fois 3, donc 6 puissance 4 égale 2 puissance 4 fois 3 puissance 4. En regroupant, on obtient 2 puissance 4 plus 3 moins 5, soit 2 au carré, et 3 puissance 4 moins 2, soit 3 au carré. Le résultat est 4 fois 9, soit 36. Dernier exemple : 10 puissance 5 fois 10 puissance moins 2 sur 10 puissance 4 égale 10 puissance 5 moins 2 moins 4, soit 10 puissance moins 1, soit 0,1.",
    "note": "Regrouper les puissances de même base puis soustraire les exposants."
  },

    "titre": "Puissances et racines carrées",
    "contenu": "<div style='background-color: #E8F5E9; padding: 20px; border-radius: 10px; color: #1B5E20;'><h3 style='margin-top: 0;'>Lien entre puissances et racines</h3><p>La racine carrée peut s'écrire comme une puissance d'exposant 1/2 :</p><div class='math-block'><div class='math'>$$ \\sqrt{a} = a^{1/2} $$</div></div><p>De manière générale :</p><div class='math-block'><div class='math'>$$ \\sqrt[n]{a} = a^{1/n} $$</div></div><p>Cela permet d'utiliser les propriétés des puissances avec les racines.</p></div><div style='background-color: #FFF3E0; padding: 15px; border-radius: 8px; margin-top: 10px; color: #E65100;'><h4 style='margin-top: 0;'>Exemples</h4><p><span class='math'>\\( \\sqrt{2} \\times \\sqrt{2} = 2^{1/2} \\times 2^{1/2} = 2^{1/2 + 1/2} = 2^1 = 2 \\)</span></p><p><span class='math'>\\( \\sqrt{a} \\times \\sqrt{b} = a^{1/2} \\times b^{1/2} = (ab)^{1/2} = \\sqrt{ab} \\)</span></p><p><span class='math'>\\( (\\sqrt{a})^2 = (a^{1/2})^2 = a^{1} = a \\)</span></p></div><div style='background-color: #E3F2FD; padding: 15px; border-radius: 8px; margin-top: 10px; color: #0D47A1;'><h4 style='margin-top: 0;'>Attention</h4><p><span class='math'>\\( \\sqrt{a + b} \\ne \\sqrt{a} + \\sqrt{b} \\)</span></p><p>La racine d'une somme n'est pas la somme des racines.</p></div>",
    "texteParle": "Il existe un lien étroit entre les puissances et les racines carrées. La racine carrée de a peut s'écrire comme a puissance 1 demi. De manière générale, la racine n-ième de a égale a puissance 1 sur n. Cela permet d'utiliser les propriétés des puissances avec les racines. Par exemple, racine de 2 fois racine de 2 égale 2 puissance 1 demi fois 2 puissance 1 demi, soit 2 puissance 1, soit 2. De même, racine de a fois racine de b égale a puissance 1 demi fois b puissance 1 demi, soit a fois b le tout puissance 1 demi, soit racine de ab. Et racine de a au carré égale a puissance 1 demi le tout au carré, soit a puissance 1, soit a. Attention : racine de a plus b n'est pas égale à racine de a plus racine de b. La racine d'une somme n'est pas la somme des racines.",

    "titre": "Exemples de calculs avec puissances",
    "contenu": "<div style='background-color: #F3E5F5; padding: 20px; border-radius: 10px; color: #4A148C;'><h3 style='margin-top: 0;'>Calculs combinés</h3><p><strong>Exemple 1 :</strong> Calculer <span class='math'>\\( \\frac{2^3 \\times 2^{-1}}{2^4} \\)</span></p><p><span class='math'>\\( = \\frac{2^{3-1}}{2^4} = \\frac{2^2}{2^4} = 2^{2-4} = 2^{-2} = \\frac{1}{4} \\)</span></p><p><strong>Exemple 2 :</strong> Calculer <span class='math'>\\( (3^2 \\times 3^{-3})^2 \\)</span></p><p><span class='math'>\\( = (3^{2-3})^2 = (3^{-1})^2 = 3^{-2} = \\frac{1}{9} \\)</span></p><p><strong>Exemple 3 :</strong> Calculer <span class='math'>\\( \\frac{5^2 \\times 5^3}{5^4 \\times 5^{-1}} \\)</span></p><p><span class='math'>\\( = \\frac{5^{2+3}}{5^{4-1}} = \\frac{5^5}{5^3} = 5^{5-3} = 5^2 = 25 \\)</span></p></div><div style='background-color: #FFF3E0; padding: 15px; border-radius: 8px; margin-top: 10px; color: #E65100;'><h4 style='margin-top: 0;'>Exemple 4 : avec des inconnues</h4><p>Simplifier <span class='math'>\\( \\frac{x^3 \\times x^4}{x^2 \\times x} \\)</span></p><p><span class='math'>\\( = \\frac{x^{3+4}}{x^{2+1}} = \\frac{x^7}{x^3} = x^{7-3} = x^4 \\)</span></p></div>",
    "texteParle": "Voyons quelques exemples de calculs combinés avec les puissances. Premier exemple : 2 puissance 3 fois 2 puissance moins 1 sur 2 puissance 4. Au numérateur, on additionne les exposants : 2 puissance 3 moins 1 égale 2 puissance 2. Puis on divise par 2 puissance 4 : 2 puissance 2 moins 4 égale 2 puissance moins 2, soit 1 quart. Deuxième exemple : 3 puissance 2 fois 3 puissance moins 3, le tout au carré. D'abord, à l'intérieur : 3 puissance 2 moins 3 égale 3 puissance moins 1. Puis on élève au carré : 3 puissance moins 2, soit 1 neuvième. Troisième exemple : 5 puissance 2 fois 5 puissance 3 sur 5 puissance 4 fois 5 puissance moins 1. Au numérateur : 5 puissance 5. Au dénominateur : 5 puissance 3. Donc 5 puissance 5 moins 3 égale 5 puissance 2, soit 25. Quatrième exemple avec des inconnues : x puissance 3 fois x puissance 4 sur x puissance 2 fois x. Au numérateur : x puissance 7. Au dénominateur : x puissance 3. Donc x puissance 7 moins 3 égale x puissance 4.",
    "note": "Appliquer les propriétés dans l'ordre : parenthèses, puis produit/quotient."

  {
    "titre": "En résumé : les puissances",
    "contenu": "<div style='background-color: #BBDEFB; padding: 20px; border-radius: 10px; text-align: center; color: #0D47A1;'><h3 style='margin-top: 0;'>Ce qu'il faut retenir</h3><ul style='text-align: left; list-style-type: disc; padding-left: 20px; font-size: 1rem;'><li><strong>Définition :</strong> <span class='math'>\\( a^n = a \\times a \\times \\cdots \\times a \\)</span> (n facteurs).</li><li><strong>Exposant nul :</strong> <span class='math'>\\( a^0 = 1 \\)</span> (a ≠ 0).</li><li><strong>Exposant négatif :</strong> <span class='math'>\\( a^{-n} = \\frac{1}{a^n} \\)</span>.</li><li><strong>Produit :</strong> <span class='math'>\\( a^m \\times a^n = a^{m+n} \\)</span>.</li><li><strong>Quotient :</strong> <span class='math'>\\( \\frac{a^m}{a^n} = a^{m-n} \\)</span>.</li><li><strong>Puissance de puissance :</strong> <span class='math'>\\( (a^m)^n = a^{m \\times n} \\)</span>.</li><li><strong>Produit :</strong> <span class='math'>\\( (ab)^n = a^n \\times b^n \\)</span>.</li><li><strong>Quotient :</strong> <span class='math'>\\( \\left(\\frac{a}{b}\\right)^n = \\frac{a^n}{b^n} \\)</span>.</li><li><strong>Notation scientifique :</strong> <span class='math'>\\( a \\times 10^n \\)</span> avec <span class='math'>\\( 1 \\le a < 10 \\)</span>.</li><li><strong>Lien avec racines :</strong> <span class='math'>\\( \\sqrt{a} = a^{1/2} \\)</span>.</li></ul></div>",
    "texteParle": "Pour conclure cette leçon sur les puissances, retenons les points essentiels. La définition : a puissance n est le produit de n facteurs égaux à a. Tout nombre non nul à la puissance 0 vaut 1. Un exposant négatif donne l'inverse : a puissance moins n égale 1 sur a puissance n. Les propriétés fondamentales sont : pour le produit de même base, on additionne les exposants. Pour le quotient de même base, on soustrait les exposants. Pour la puissance d'une puissance, on multiplie les exposants. Pour la puissance d'un produit, on distribue l'exposant sur chaque facteur. Pour la puissance d'un quotient, on distribue l'exposant sur le numérateur et le dénominateur. La notation scientifique permet d'écrire les grands et petits nombres sous la forme a fois 10 puissance n. Enfin, la racine carrée est une puissance d'exposant 1 demi. Ces propriétés sont essentielles pour tous les calculs en mathématiques et en sciences.",

    // ================================================================

    function setStatus(text, type) {
        $statusText.text(text);
        $statusBadge.removeClass('idle speaking error paused waiting loading');
        if (type === 'speaking') $statusBadge.addClass('speaking');
        else if (type === 'error') $statusBadge.addClass('error');
        else if (type === 'paused') $statusBadge.addClass('paused');
        else if (type === 'waiting') $statusBadge.addClass('waiting');
        else if (type === 'loading') $statusBadge.addClass('loading');
        else $statusBadge.addClass('idle');
    }

    function updatePlayButton() {
        if (isPlaying) {
            $play.addClass('playing');
            $play.find('.btn-icon').text('⏸');
            $play.find('.btn-label').text('Pause');
        } else {
            $play.removeClass('playing');
            $play.find('.btn-icon').text('▶');
            $play.find('.btn-label').text('Play');
        }
    }

            loadingTimeout = null;
        }

        isLoading = true;

        $loadingProgressBar.css('width', '0%');
        // Forcer un reflow
        $loadingProgressBar[0].offsetHeight;
        $loadingProgressBar.css('animation', 'loadingProgress 30s ease-out forwards');
        
        $loadingText.text('Préparation vocale...');
        $loadingSub.text('Synthèse en cours');
        $loadingTimeout.text('⏱️ 30 secondes maximum');
        $loading.fadeIn(300);
        setStatus("⏳ Chargement...", 'loading');
        
        // 🔥 TIMEOUT DE 30 SECONDES
        loadingTimeout = setTimeout(() => {
            if (isLoading && !loadingCancelled) {
                hideLoading();
                setStatus("⚠️ Délai dépassé (30s)", 'error');
                isPlaying = false;
                updatePlayButton();
                $loadingSub.text('La synthèse vocale a pris trop de temps');
                $loadingTimeout.text('❌ Délai dépassé');
            }
        }, 30000);
    }

    function hideLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        isLoading = false;
        loadingCancelled = false;
        $loading.fadeOut(300);
        // Ne pas changer le statut si on est en train de parler
        if (!isSpeaking && !isPlaying) {
            setStatus("⏸ Lecture arrêtée", 'paused');
        }
    }

    function cancelLoading() {
        loadingCancelled = true;
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        hideLoading();
        stopSpeaking();
        setStatus("⏸ Annulé", 'paused');
        isPlaying = false;
        updatePlayButton();
        $loadingText.text('Annulé par l\'utilisateur');
        $loadingSub.text('Vous pouvez réessayer');
        $loadingTimeout.text('✕ Annulation');
    }

    // Arrêter la parole proprement
    function stopSpeaking() {
        try {
            if (synth && (synth.speaking || synth.pending)) {
                synth.cancel();
            }
        } catch(e) {
            console.warn('Erreur stopSpeaking:', e);
        }
        if (currentUtterance) {
            try {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance.onstart = null;
            } catch(e) {}
            currentUtterance = null;
        }
        isSpeaking = false;
        isPlaying = false;
        updatePlayButton();
    }

    // Mettre en pause la parole
    function pauseSpeaking() {
        try {
            if (synth && synth.speaking) {
                synth.pause();
                isPaused = true;
                isPlaying = false;
                setStatus("⏸ Lecture en pause", 'paused');
                updatePlayButton();
            }
        } catch(e) {
            console.warn('Erreur pauseSpeaking:', e);
            stopSpeaking();
        }
    }

    // Reprendre la parole
    function resumeSpeaking() {
        try {
            if (synth && synth.paused) {
                synth.resume();
                isPaused = false;
                isPlaying = true;
                setStatus("🔊 Lecture en cours", 'speaking');
                updatePlayButton();
            } else if (!isSpeaking && !synth.speaking && !synth.pending) {
                speakSlide(currentIndex);
            }
        } catch(e) {
            console.warn('Erreur resumeSpeaking:', e);
            speakSlide(currentIndex);
        }
    }

    function renderSlide(index) {
        const slide = slides[index];
        $title.text(slide.titre);

        let html = '';
        html += `<div class="content-card">${slide.contenu}</div>`;
        if (slide.note) {
            html += `<div class="note-box">${slide.note}</div>`;
        }
        $body.html(html);
        $counter.text(`${index+1} / ${total}`);

        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
        }
    }

    // ================================================================
    // LECTURE VOCALE
    // ================================================================
    function speakSlide(index) {
        return new Promise((resolve) => {
            const slide = slides[index];
            const text = slide.texteParle;
            
            if (!text || text.trim() === '' || !speechSupported) {
                resolve();
                return;
            }

            if (!window.speechSynthesis) {
                setStatus("❌ Synthèse vocale non supportée", 'error');
                speechSupported = false;
                resolve();
                return;
            }

            // Arrêter toute lecture en cours
            stopSpeaking();
            
            // Réinitialiser l'état de pause
            isPaused = false;
            
            showLoading();
            setStatus("Initialisation...", 'loading');

            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.92;
                utterance.pitch = 1.05;
                utterance.volume = 1;

                let isFinished = false;
                let errorHandled = false;

                utterance.onstart = function() {
                    if (loadingCancelled) {
                        stopSpeaking();
                        resolve();
                        return;
                    }
                    hideLoading();
                    isSpeaking = true;
                    isPlaying = true;
                    isPaused = false;
                    setStatus("🔊 Lecture en cours", 'speaking');
                    updatePlayButton();
                };

                utterance.onend = function() {
                    if (isFinished) return;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    setStatus("✅ Terminé", 'idle');
                    hideLoading();
                    updatePlayButton();
                    resolve();
                };

                utterance.onerror = function(e) {
                    if (isFinished || errorHandled) return;
                    errorHandled = true;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    hideLoading();
                    updatePlayButton();
                    
                    if (e.error === 'not-allowed') {
                        setStatus("⚠️ Permission refusée", 'error');
                    } else if (e.error === 'synthesis-unavailable') {
                        setStatus("⚠️ Synthèse indisponible", 'error');
                    } else if (e.error === 'canceled') {
                        setStatus("⏸ Annulé", 'paused');
                    } else {
                        setStatus("❌ Erreur audio: " + (e.error || 'inconnue'), 'error');
                    }
                    
                    resolve();
                };

                // Gestion du chargement des voix
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = function() {
                        if (!loadingCancelled) {
                            try {
                                synth.speak(utterance);
                            } catch(err) {
                                // Silencieux
                            }
                        }
                        synth.onvoiceschanged = null;
                    };
                }

                currentUtterance = utterance;
                
                if (!loadingCancelled) {
                    try {
                        synth.speak(utterance);
                    } catch(err) {
                        setTimeout(() => {
                            if (!loadingCancelled) {
                                try {
                                    synth.speak(utterance);
                                } catch(e) {
                                    setStatus("❌ Erreur de lecture", 'error');
                                    isPlaying = false;
                                    updatePlayButton();
                                    hideLoading();
                                    resolve();
                                }
                            } else {
                                resolve();
                            }
                        }, 100);
                    }
                } else {
                    resolve();
                }

            } catch(err) {
                hideLoading();
                setStatus("❌ Erreur générale", 'error');
                isPlaying = false;
                updatePlayButton();
                console.error('Erreur speakSlide:', err);
                resolve();
            }
        });
    }

    // ================================================================
    // NAVIGATION
    // ================================================================
    async function goToSlide(index) {
        if (isTransitioning) return;
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        
        // Si on est en train de lire, on met en pause avant de naviguer
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        // Arrêter complètement la lecture
        stopSpeaking();
        
        await new Promise(r => setTimeout(r, 50));
        
        if (index === currentIndex) {
            setStatus("📄 Slide actuel", 'idle');
            return;
        }

        isTransitioning = true;
        currentIndex = index;
        renderSlide(index);
        
        // Réinitialiser l'état de lecture
        isPlaying = false;
        updatePlayButton();
        setStatus("⏸ Lecture arrêtée", 'paused');

        await new Promise(r => setTimeout(r, 150));
        isTransitioning = false;
    }

    async function goToNext() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex + 1 < total) {
            await goToSlide(currentIndex + 1);
        } else {
            setStatus("🏁 Dernier slide", 'idle');
        }
    }

    async function goToPrev() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex - 1 >= 0) {
            await goToSlide(currentIndex - 1);
        } else {
            setStatus("🔁 Premier slide", 'idle');
        }
    }

    // ================================================================
    // GESTION PLAY/PAUSE
    // ================================================================
    function togglePlay() {
        if (!userInteracted) {
            userInteracted = true;
        }

        // Si le chargement est en cours, on l'annule
        if (isLoading) {
            cancelLoading();
            return;
        }

        // Si le synthétiseur est en pause, on reprend
        if (synth && synth.paused) {
            resumeSpeaking();
            return;
        }

        // Si la lecture est en cours, on met en pause
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
            return;
        }

        // Sinon, on démarre la lecture du slide courant
        if (!isSpeaking && !isPlaying) {
            stopSpeaking();
            speakSlide(currentIndex);
        }
    }

    // ================================================================
    // INIT
    // ================================================================
    async function init() {
        // Vérifier la compatibilité
        if (!window.speechSynthesis) {
            setStatus("❌ Synthèse vocale non supportée", 'error');
            speechSupported = false;
        }

        // Précharger les voix
        try {
            if (synth.getVoices) {
                synth.getVoices();
                setTimeout(() => {
                    try {
                        synth.getVoices();
                    } catch(e) {}
                }, 200);
            }
        } catch(e) {
            console.warn('Erreur chargement voix:', e);
        }

        // Afficher le premier slide
        renderSlide(0);
        $counter.text(`1 / ${total}`);
        
        // État initial
        setStatus("⏸ Appuie sur Play", 'paused');
        updatePlayButton();
        $autoIndicator.text('⏸ Lecture manuelle');

        // ================================================================
        // ÉVÉNEMENTS
        // ================================================================
        
        // Bouton Play/Pause
        $play.on('click', function() {
            togglePlay();
        });

        // Bouton Annuler le chargement
        $cancelLoading.on('click', function() {
            cancelLoading();
        });

        // Navigation
        $prev.on('click', function() {
            // Si chargement en cours, on annule
            if (isLoading) cancelLoading();
            goToPrev();
        });

        $next.on('click', function() {
            if (isLoading) cancelLoading();
            goToNext();
        });

        // Replay - relire le slide courant
        $replay.on('click', function() {
            if (isLoading) cancelLoading();
            stopSpeaking();
            setTimeout(() => {
                speakSlide(currentIndex);
            }, 100);
        });

        // Support du clavier (espace pour play/pause)
        $(document).on('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });

        // Nettoyage
        $(window).on('beforeunload', function() {
            try {
                if (synth.speaking) synth.cancel();
            } catch(e) {}
            hideLoading();
        });

        // Gérer les cas où la synthèse se termine de manière inattendue
        setInterval(() => {
            if (isPlaying && !synth.speaking && !synth.pending && !isPaused && !isLoading) {
                isPlaying = false;
                updatePlayButton();
                setStatus("⏸ Lecture arrêtée", 'paused');
            }
        }, 1000);
    }

    init();
});



    // ================================================================
    // GESTION DU THÈME JOUR/NUIT
    // ================================================================
    let isDarkMode = false;

    function toggleTheme() {
        isDarkMode = !isDarkMode;
        const body = document.body;
        const appContainer = document.querySelector('.app-container');
        const header = document.querySelector('.slide-header');
        const footer = document.querySelector('.slide-footer');
        const contentCards = document.querySelectorAll('.content-card');
        const noteBoxes = document.querySelectorAll('.note-box');
        const mathBlocks = document.querySelectorAll('.math-block');
        const buttons = document.querySelectorAll('.btn');
        const statusBadge = document.querySelector('.status-badge');
        const slideCounter = document.querySelector('.slide-counter');
        const autoIndicator = document.querySelector('.auto-indicator');
        const themeBtn = document.getElementById('themeToggle');

        if (isDarkMode) {
            // Mode nuit
            body.style.background = '#0b1120';
            body.style.color = '#f1f5f9';
            appContainer.style.background = 'linear-gradient(145deg, #0f172a 0%, #1e293b 100%)';
            header.style.background = 'rgba(15, 23, 42, 0.85)';
            footer.style.background = 'rgba(15, 23, 42, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.05)';
                card.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.08)';
                note.style.color = '#cbd5e1';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.25)';
                block.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#e2e8f0';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.12)';
                statusBadge.style.color = '#93bbfc';
            }
            if (slideCounter) {
                slideCounter.style.color = '#94a3b8';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#64748b';
            }
            if (themeBtn) {
                themeBtn.textContent = '☀️';
                themeBtn.title = 'Passer en mode jour';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#e2e8f0';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#e2e8f0';
                }
            });
        } else {
            // Mode jour (par défaut)
            body.style.background = '#f0f4f8';
            body.style.color = '#1a202c';
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
            header.style.background = 'rgba(255, 255, 255, 0.85)';
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.8)';
                card.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.12)';
                note.style.color = '#2c3e50';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.05)';
                block.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#2d3748';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
                statusBadge.style.color = '#2b6cb0';
            }
            if (slideCounter) {
                slideCounter.style.color = '#4a5568';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#718096';
            }
            if (themeBtn) {
                themeBtn.textContent = '🌓';
                themeBtn.title = 'Passer en mode nuit';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#2c3e50';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#2d3748';
                }
            });
        }
    }

    // Initialiser en mode jour
    document.addEventListener('DOMContentLoaded', function() {
        // Appliquer le mode jour par défaut
        const body = document.body;
        body.style.background = '#f0f4f8';
        body.style.color = '#1a202c';
        
        const appContainer = document.querySelector('.app-container');
        if (appContainer) {
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
        }
        
        const header = document.querySelector('.slide-header');
        if (header) {
            header.style.background = 'rgba(255, 255, 255, 0.85)';
        }
        
        const footer = document.querySelector('.slide-footer');
        if (footer) {
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
        }
        
        document.querySelectorAll('.content-card').forEach(card => {
            card.style.background = 'rgba(255,255,255,0.8)';
            card.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.note-box').forEach(note => {
            note.style.background = 'rgba(96, 165, 250, 0.12)';
            note.style.color = '#2c3e50';
        });
        
        document.querySelectorAll('.math-block').forEach(block => {
            block.style.background = 'rgba(0,0,0,0.05)';
            block.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.btn').forEach(btn => {
            btn.style.color = '#2d3748';
        });
        
        const statusBadge = document.querySelector('.status-badge');
        if (statusBadge) {
            statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
            statusBadge.style.color = '#2b6cb0';
        }
        
        const slideCounter = document.querySelector('.slide-counter');
        if (slideCounter) {
            slideCounter.style.color = '#4a5568';
        }
        
        const autoIndicator = document.querySelector('.auto-indicator');
        if (autoIndicator) {
            autoIndicator.style.color = '#718096';
        }
        
        document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
            if (!el.closest('.note-box')) {
                el.style.color = '#2c3e50';
            }
        });
        
        document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
            if (!el.closest('.note-box') && !el.closest('.math-block')) {
                el.style.color = '#2d3748';
            }
        });
        
        const themeBtn = document.getElementById('themeToggle');
        if (themeBtn) {
            themeBtn.textContent = '🌓';
            themeBtn.title = 'Passer en mode nuit';
        }
    });
</script>
