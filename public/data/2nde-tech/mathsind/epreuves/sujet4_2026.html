<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Maths Industriel",
  "classe": "2nde technique",
  "sequence": "Séquence 4",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Statistiques descriptives (8 pts)",
      "points": "8 pts",
      "enonce": "<p>Un atelier de mécanique industrielle a effectué un contrôle de qualité sur 20 pièces usinées. On a mesuré leur longueur (en mm) et obtenu la série suivante :</p><div style='background-color:#f5f5f5; padding:10px; border-radius:5px; text-align:center;'><p><strong>101 - 103 - 102 - 104 - 101 - 102 - 103 - 105 - 102 - 101 - 104 - 102 - 103 - 102 - 101 - 103 - 104 - 102 - 103 - 102</strong></p></div>",
      "questions": [
        {
          "question": "<p><strong>1.</strong> Organisez ces données dans un tableau statistique. Vous y ferez apparaître : les valeurs, les effectifs, les fréquences (en %), les effectifs cumulés croissants et les fréquences cumulées croissantes (en %).</p>",
          "reponse": "<div style='background-color:#e8f5e9; padding:10px; border-radius:5px;'><h4 style='margin-top:0; color:#2e7d32;'>Tableau statistique</h4><table style='width:100%; border-collapse:collapse; font-size:0.9em;'><tr style='background-color:#a5d6a7;'><th style='border:1px solid #333; padding:5px;'>Valeurs (en mm)</th><th style='border:1px solid #333; padding:5px;'>Effectifs</th><th style='border:1px solid #333; padding:5px;'>Fréquences (en %)</th><th style='border:1px solid #333; padding:5px;'>Effectifs cumulés croissants</th><th style='border:1px solid #333; padding:5px;'>Fréquences cumulées croissantes (en %)</th></tr><tr><td style='border:1px solid #333; padding:5px; text-align:center;'>101</td><td style='border:1px solid #333; padding:5px; text-align:center;'>4</td><td style='border:1px solid #333; padding:5px; text-align:center;'>20 %</td><td style='border:1px solid #333; padding:5px; text-align:center;'>4</td><td style='border:1px solid #333; padding:5px; text-align:center;'>20 %</td></tr><tr><td style='border:1px solid #333; padding:5px; text-align:center;'>102</td><td style='border:1px solid #333; padding:5px; text-align:center;'>6</td><td style='border:1px solid #333; padding:5px; text-align:center;'>30 %</td><td style='border:1px solid #333; padding:5px; text-align:center;'>10</td><td style='border:1px solid #333; padding:5px; text-align:center;'>50 %</td></tr><tr><td style='border:1px solid #333; padding:5px; text-align:center;'>103</td><td style='border:1px solid #333; padding:5px; text-align:center;'>5</td><td style='border:1px solid #333; padding:5px; text-align:center;'>25 %</td><td style='border:1px solid #333; padding:5px; text-align:center;'>15</td><td style='border:1px solid #333; padding:5px; text-align:center;'>75 %</td></tr><tr><td style='border:1px solid #333; padding:5px; text-align:center;'>104</td><td style='border:1px solid #333; padding:5px; text-align:center;'>3</td><td style='border:1px solid #333; padding:5px; text-align:center;'>15 %</td><td style='border:1px solid #333; padding:5px; text-align:center;'>18</td><td style='border:1px solid #333; padding:5px; text-align:center;'>90 %</td></tr><tr><td style='border:1px solid #333; padding:5px; text-align:center;'>105</td><td style='border:1px solid #333; padding:5px; text-align:center;'>2</td><td style='border:1px solid #333; padding:5px; text-align:center;'>10 %</td><td style='border:1px solid #333; padding:5px; text-align:center;'>20</td><td style='border:1px solid #333; padding:5px; text-align:center;'>100 %</td></tr><tr style='background-color:#c8e6c9;'><td style='border:1px solid #333; padding:5px; text-align:center;'><strong>Total</strong></td><td style='border:1px solid #333; padding:5px; text-align:center;'><strong>20</strong></td><td style='border:1px solid #333; padding:5px; text-align:center;'><strong>100 %</strong></td><td style='border:1px solid #333; padding:5px; text-align:center;'><strong>-</strong></td><td style='border:1px solid #333; padding:5px; text-align:center;'><strong>-</strong></td></tr></table></div>"
        },
        {
          "question": "<p><strong>2.</strong> Calculez la longueur moyenne de ces pièces.</p>",
          "reponse": "<p><div class='math-block'><div class='math'>$$ \\bar{x} = \\dfrac{101\\times4 + 102\\times6 + 103\\times5 + 104\\times3 + 105\\times2}{20} = \\dfrac{404 + 612 + 515 + 312 + 210}{20} = \\dfrac{2053}{20} = 102,65 \\text{ mm} $$</div></div>La longueur moyenne des pièces est de <strong>102,65 mm</strong>.</p>"
        },
        {
          "question": "<p><strong>3.</strong> Déterminez la médiane de cette série.</p>",
          "reponse": "<p>L'effectif total est pair (n=20). La médiane est la moyenne des 10<sup>e</sup> et 11<sup>e</sup> valeurs de la série ordonnée. D'après le tableau des effectifs cumulés croissants, les valeurs du 10<sup>e</sup> et 11<sup>e</sup> rangs sont 102 et 102. Donc :</p><div class='math-block'><div class='math'>$$ M_e = \\dfrac{102 + 102}{2} = 102 \\text{ mm} $$</div></div><p>La médiane est <strong>102 mm</strong>.</p>"
        },
        {
          "question": "<p><strong>4.</strong> Quelle est l'étendue de cette série ?</p>",
          "reponse": "<p>L'étendue est la différence entre la valeur maximale et la valeur minimale :</p><div class='math-block'><div class='math'>$$ E = 105 - 101 = 4 \\text{ mm} $$</div></div><p>L'étendue est de <strong>4 mm</strong>.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Représentations graphiques (4 pts)",
      "points": "4 pts",
      "enonce": "<p>On reprend les données de l'exercice 1 sur les longueurs des pièces usinées.</p>",
      "questions": [
        {
          "question": "<p><strong>1.</strong> Construisez un diagramme en barres représentant la répartition des effectifs.</p>",
          "reponse": "<p><strong>Diagramme en barres :</strong></p><ul><li>Axe des abscisses : les différentes longueurs (101, 102, 103, 104, 105 mm)</li><li>Axe des ordonnées : les effectifs</li><li>Barres de hauteurs respectives : 4, 6, 5, 3, 2</li><li>Chaque barre est séparée des autres (caractère quantitatif discret)</li><li>Titre : <em>Répartition des effectifs des longueurs de pièces</em></li></ul><p><em>Remarque : Le tracé se fait sur une feuille de papier millimétré.</em></p>"
        },
        {
          "question": "<p><strong>2.</strong> Représentez le polygone des effectifs cumulés croissants.</p>",
          "reponse": "<p><strong>Polygone des effectifs cumulés croissants :</strong></p><ul><li>Axe des abscisses : les longueurs (101, 102, 103, 104, 105 mm)</li><li>Axe des ordonnées : les effectifs cumulés croissants</li><li>Points à placer : (101, 4), (102, 10), (103, 15), (104, 18), (105, 20)</li><li>On relie ces points par des segments de droite</li><li>Titre : <em>Polygone des effectifs cumulés croissants</em></li></ul><p><em>Remarque : Le tracé se fait sur une feuille de papier millimétré.</em></p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Analyse et interprétation (5 pts)",
      "points": "5 pts",
      "enonce": "<p>L'atelier de mécanique produit des pièces dont la longueur théorique est fixée à 102 mm. La tolérance est de ±2 mm. Une pièce est jugée conforme si sa longueur est comprise entre 100 mm et 104 mm.</p>",
      "questions": [
        {
          "question": "<p><strong>1.</strong> Combien de pièces sont conformes dans l'échantillon ? Justifiez votre réponse.</p>",
          "reponse": "<p>Les pièces conformes ont une longueur comprise entre 100 et 104 mm inclus. Cela correspond aux valeurs 101, 102, 103 et 104 mm.</p><p>Effectif des pièces conformes = 4 + 6 + 5 + 3 = <strong>18 pièces</strong>.</p><p>Les 2 pièces de 105 mm ne sont pas conformes car elles dépassent la tolérance maximale de 104 mm.</p>"
        },
        {
          "question": "<p><strong>2.</strong> Quel est le pourcentage de pièces conformes ?</p>",
          "reponse": "<div class='math-block'><div class='math'>$$ \\text{Pourcentage de conformité} = \\dfrac{18}{20} \\times 100 = 90\\% $$</div></div><p>Le pourcentage de pièces conformes est de <strong>90 %</strong>.</p>"
        },
        {
          "question": "<p><strong>3.</strong> Le chef d'atelier affirme que la production est de bonne qualité car plus de 80 % des pièces sont conformes. Êtes-vous d'accord avec cette affirmation ? Argumentez.</p>",
          "reponse": "<p>Oui, je suis d'accord avec le chef d'atelier. Avec un taux de conformité de 90 %, la production dépasse largement le seuil de 80 % fixé. Cela indique que le processus d'usinage est bien maîtrisé et que la majorité des pièces produites répondent aux normes de qualité exigées. Cependant, il serait intéressant de surveiller les pièces de 105 mm pour éviter des dérives futures.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Synthèse et prise de décision (3 pts)",
      "points": "3 pts",
      "enonce": "<p>Suite au contrôle qualité, l'atelier décide d'ajuster la machine. On prélève un nouveau lot de 10 pièces et on obtient les longueurs suivantes :</p><div style='background-color:#f5f5f5; padding:10px; border-radius:5px; text-align:center;'><p><strong>101 - 102 - 102 - 103 - 102 - 101 - 102 - 103 - 102 - 102</strong></p></div>",
      "questions": [
        {
          "question": "<p><strong>1.</strong> Calculez la moyenne de ce nouveau lot. Que constatez-vous par rapport à la moyenne du premier lot (102,65 mm) ?</p>",
          "reponse": "<div class='math-block'><div class='math'>$$ \\bar{x}_{\\text{lot2}} = \\dfrac{101\\times2 + 102\\times6 + 103\\times2}{10} = \\dfrac{202 + 612 + 206}{10} = \\dfrac{1020}{10} = 102 \\text{ mm} $$</div></div><p>La moyenne du nouveau lot est de <strong>102 mm</strong>. On constate qu'elle est plus proche de la longueur théorique de 102 mm que celle du premier lot qui était de 102,65 mm. L'ajustement de la machine semble avoir amélioré la précision de la production.</p>"
        },
        {
          "question": "<p><strong>2.</strong> Le chef d'atelier souhaite que 100 % des pièces soient conformes. Ce nouveau lot atteint-il cet objectif ?</p>",
          "reponse": "<p>Les pièces conformes doivent avoir une longueur comprise entre 100 et 104 mm inclus. Toutes les pièces de ce nouveau lot mesurent 101, 102 ou 103 mm. <strong>Toutes les pièces sont donc conformes</strong>.</p><p>Le pourcentage de conformité est de :</p><div class='math-block'><div class='math'>$$ \\dfrac{10}{10} \\times 100 = 100\\% $$</div></div><p>L'objectif du chef d'atelier est <strong>atteint</strong> avec ce nouveau lot.</p>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
