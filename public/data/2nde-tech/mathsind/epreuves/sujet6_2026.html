<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Mathématiques Industrielles",
  "classe": "2nde Technique",
  "sequence": "Séquence 6",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Trigonométrie et angles orientés",
      "points": "4 pts",
      "enonce": "<div style='background-color: #f0f4f8; padding: 15px; border-radius: 10px; color: #1e293b; font-size: 1em;'>Cet exercice porte sur les angles orientés, le cercle trigonométrique et les relations entre les lignes trigonométriques. Les réponses devront être justifiées.<br><br>On considère un angle orienté <span class='math'>\\(\\theta\\)</span> dont la mesure principale est <span class='math'>\\(\\dfrac{5\\pi}{6}\\)</span>.</div>",
      "questions": [
        {
          "question": "1) <span style='font-weight:500;'>Déterminer la mesure principale de l'angle <span class='math'>\\(-\\theta\\)</span>.</span>",
          "reponse": "La mesure principale de <span class='math'>\\(-\\theta\\)</span> est <span class='math'>\\(-\\dfrac{5\\pi}{6}\\)</span>. Comme <span class='math'>\\(-\\dfrac{5\\pi}{6}\\)</span> est déjà dans l'intervalle <span class='math'>\\(]-\\pi; \\pi]\\)</span>, c'est la mesure principale. <br>On peut aussi l'écrire <span class='math'>\\(\\dfrac{7\\pi}{6}\\)</span> mais cela n'est pas la mesure principale car elle est supérieure à <span class='math'>\\(\\pi\\)</span>."
        },
        {
          "question": "2) <span style='font-weight:500;'>Calculer <span class='math'>\\(\\cos\\left(\\dfrac{5\\pi}{6}\\right)\\)</span> et <span class='math'>\\(\\sin\\left(\\dfrac{5\\pi}{6}\\right)\\)</span>.</span>",
          "reponse": "On sait que <span class='math'>\\(\\dfrac{5\\pi}{6} = \\pi - \\dfrac{\\pi}{6}\\)</span>.<br>Donc <span class='math'>\\(\\cos\\left(\\dfrac{5\\pi}{6}\\right) = \\cos\\left(\\pi - \\dfrac{\\pi}{6}\\right) = -\\cos\\left(\\dfrac{\\pi}{6}\\right) = -\\dfrac{\\sqrt{3}}{2}\\)</span>.<br>Et <span class='math'>\\(\\sin\\left(\\dfrac{5\\pi}{6}\\right) = \\sin\\left(\\pi - \\dfrac{\\pi}{6}\\right) = \\sin\\left(\\dfrac{\\pi}{6}\\right) = \\dfrac{1}{2}\\)</span>."
        },
        {
          "question": "3) <span style='font-weight:500;'>En déduire la valeur de <span class='math'>\\(\\tan\\left(\\dfrac{5\\pi}{6}\\right)\\)</span>.</span>",
          "reponse": "La tangente est le rapport du sinus sur le cosinus : <br><span class='math'>\\(\\tan\\left(\\dfrac{5\\pi}{6}\\right) = \\dfrac{\\sin\\left(\\dfrac{5\\pi}{6}\\right)}{\\cos\\left(\\dfrac{5\\pi}{6}\\right)} = \\dfrac{\\dfrac{1}{2}}{-\\dfrac{\\sqrt{3}}{2}} = -\\dfrac{1}{\\sqrt{3}} = -\\dfrac{\\sqrt{3}}{3}\\)</span>."
        },
        {
          "question": "4) <span style='font-weight:500;'>Donner la mesure principale de l'angle <span class='math'>\\(\\theta + 2\\pi\\)</span>.</span>",
          "reponse": "Ajouter <span class='math'>\\(2\\pi\\)</span> à un angle correspond à un tour complet. La mesure principale reste donc inchangée : <span class='math'>\\(\\dfrac{5\\pi}{6}\\)</span>."
        }
      ]
    },
    {
      "titre": "Exercice 2 : Vecteurs de l'espace",
      "points": "5 pts",
      "enonce": "<div style='background-color: #f0f4f8; padding: 15px; border-radius: 10px; color: #1e293b; font-size: 1em;'>Dans un repère orthonormé de l'espace <span class='math'>\\((O; \\vec{i}, \\vec{j}, \\vec{k})\\)</span>, on considère les vecteurs : <br><div class='math-block'><div class='math'>$$ \\vec{u} = (2; -1; 3), \\quad \\vec{v} = (1; 0; -2), \\quad \\vec{w} = (0; 2; 1) $$</div></div></div>",
      "questions": [
        {
          "question": "1) <span style='font-weight:500;'>Calculer le vecteur <span class='math'>\\(\\vec{s} = 2\\vec{u} - \\vec{v} + 3\\vec{w}\\)</span>.</span>",
          "reponse": "<span class='math'>\\(\\vec{s} = 2(2; -1; 3) - (1; 0; -2) + 3(0; 2; 1) = (4; -2; 6) - (1; 0; -2) + (0; 6; 3)\\)</span>.<br><span class='math'>\\(\\vec{s} = (4 - 1 + 0; -2 - 0 + 6; 6 - (-2) + 3) = (3; 4; 11)\\)</span>."
        },
        {
          "question": "2) <span style='font-weight:500;'>Calculer le produit scalaire <span class='math'>\\(\\vec{u} \\cdot \\vec{v}\\)</span>.</span>",
          "reponse": "Le produit scalaire est la somme des produits des coordonnées correspondantes : <br><span class='math'>\\(\\vec{u} \\cdot \\vec{v} = 2 \\times 1 + (-1) \\times 0 + 3 \\times (-2) = 2 + 0 - 6 = -4\\)</span>."
        },
        {
          "question": "3) <span style='font-weight:500;'>Calculer la norme du vecteur <span class='math'>\\(\\vec{u}\\)</span>.</span>",
          "reponse": "La norme de <span class='math'>\\(\\vec{u}\\)</span> est <span class='math'>\\(\\|\\vec{u}\\| = \\sqrt{2^2 + (-1)^2 + 3^2} = \\sqrt{4 + 1 + 9} = \\sqrt{14}\\)</span>."
        },
        {
          "question": "4) <span style='font-weight:500;'>Calculer le produit vectoriel <span class='math'>\\(\\vec{u} \\wedge \\vec{v}\\)</span>.</span>",
          "reponse": "Le produit vectoriel est donné par : <br><span class='math'>\\(\\vec{u} \\wedge \\vec{v} = \\begin{vmatrix} \\vec{i} & \\vec{j} & \\vec{k} \\\\ 2 & -1 & 3 \\\\ 1 & 0 & -2 \\end{vmatrix}\\)</span><br><span class='math'>\\(= \\vec{i}((-1)(-2) - 3(0)) - \\vec{j}(2(-2) - 3(1)) + \\vec{k}(2(0) - (-1)(1))\\)</span><br><span class='math'>\\(= \\vec{i}(2) - \\vec{j}(-4 - 3) + \\vec{k}(0 + 1) = 2\\vec{i} + 7\\vec{j} + \\vec{k}\\)</span>.<br>Soit <span class='math'>\\(\\vec{u} \\wedge \\vec{v} = (2; 7; 1)\\)</span>."
        }
      ]
    },
    {
      "titre": "Exercice 3 : Géométrie plane",
      "points": "5 pts",
      "enonce": "<div style='background-color: #f0f4f8; padding: 15px; border-radius: 10px; color: #1e293b; font-size: 1em;'>Le plan est muni d'un repère orthonormé <span class='math'>\\((O; \\vec{i}, \\vec{j})\\)</span>.<br><br>On considère les points <span class='math'>\\(A(-1; 3)\\)</span>, <span class='math'>\\(B(2; 1)\\)</span> et <span class='math'>\\(C(4; 5)\\)</span>.</div>",
      "questions": [
        {
          "question": "1) <span style='font-weight:500;'>Déterminer une équation cartésienne de la droite <span class='math'>\\((AB)\\)</span>.</span>",
          "reponse": "Le vecteur directeur de <span class='math'>\\((AB)\\)</span> est <span class='math'>\\(\\overrightarrow{AB} = (2 - (-1); 1 - 3) = (3; -2)\\)</span>. Un vecteur normal est <span class='math'>\\(\\vec{n} = (2; 3)\\)</span>.<br>L'équation est de la forme <span class='math'>\\(2x + 3y + c = 0\\)</span>. En utilisant <span class='math'>\\(A\\)</span>, on a <span class='math'>\\(2(-1) + 3(3) + c = 0\\)</span> soit <span class='math'>\\(-2 + 9 + c = 0\\)</span>, donc <span class='math'>\\(c = -7\\)</span>.<br>Une équation cartésienne de <span class='math'>\\((AB)\\)</span> est <span class='math'>\\(2x + 3y - 7 = 0\\)</span>."
        },
        {
          "question": "2) <span style='font-weight:500;'>Déterminer une équation du cercle de centre <span class='math'>\\(C\\)</span> et de rayon <span class='math'>\\(R = \\sqrt{5}\\)</span>.</span>",
          "reponse": "L'équation d'un cercle de centre <span class='math'>\\((a; b)\\)</span> et de rayon <span class='math'>\\(R\\)</span> est <span class='math'>\\((x - a)^2 + (y - b)^2 = R^2\\)</span>.<br>Ici, le centre est <span class='math'>\\(C(4; 5)\\)</span> et <span class='math'>\\(R^2 = 5\\)</span>. L'équation est donc <span class='math'>\\((x - 4)^2 + (y - 5)^2 = 5\\)</span>."
        },
        {
          "question": "3) <span style='font-weight:500;'>Le point <span class='math'>\\(A\\)</span> appartient-il à ce cercle ? Justifier.</span>",
          "reponse": "Pour vérifier l'appartenance de <span class='math'>\\(A\\)</span> au cercle, on calcule la distance <span class='math'>\\(CA\\)</span> : <br><span class='math'>\\(CA = \\sqrt{(-1 - 4)^2 + (3 - 5)^2} = \\sqrt{(-5)^2 + (-2)^2} = \\sqrt{25 + 4} = \\sqrt{29}\\)</span>.<br>Comme <span class='math'>\\(\\sqrt{29} \\neq \\sqrt{5}\\)</span>, le point <span class='math'>\\(A\\)</span> n'appartient pas au cercle."
        },
        {
          "question": "4) <span style='font-weight:500;'>Déterminer les coordonnées du barycentre <span class='math'>\\(G\\)</span> du système <span class='math'>\\(\\{(A, 2); (B, 1); (C, -1)\\}\\)</span>.</span>",
          "reponse": "Les coordonnées du barycentre sont données par : <br><span class='math'>\\(x_G = \\dfrac{2x_A + 1x_B - 1x_C}{2 + 1 - 1} = \\dfrac{2(-1) + 1(2) - 1(4)}{2} = \\dfrac{-2 + 2 - 4}{2} = -2\\)</span>.<br><span class='math'>\\(y_G = \\dfrac{2y_A + 1y_B - 1y_C}{2} = \\dfrac{2(3) + 1(1) - 1(5)}{2} = \\dfrac{6 + 1 - 5}{2} = 1\\)</span>.<br>Le barycentre est <span class='math'>\\(G(-2; 1)\\)</span>."
        }
      ]
    },
    {
      "titre": "Exercice 4 : Transformations du plan",
      "points": "3 pts",
      "enonce": "<div style='background-color: #f0f4f8; padding: 15px; border-radius: 10px; color: #1e293b; font-size: 1em;'>Dans le plan muni d'un repère orthonormé, on considère les points <span class='math'>\\(A(1; 2)\\)</span>, <span class='math'>\\(B(4; 5)\\)</span> et <span class='math'>\\(C(-1; 3)\\)</span>.</div>",
      "questions": [
        {
          "question": "1) <span style='font-weight:500;'>Déterminer les coordonnées du point <span class='math'>\\(A'\\)</span>, image de <span class='math'>\\(A\\)</span> par la translation de vecteur <span class='math'>\\(\\vec{v} = (2; -1)\\)</span>.</span>",
          "reponse": "L'image d'un point par une translation est obtenue en ajoutant les coordonnées du vecteur à celles du point : <br><span class='math'>\\(A'(x_A + 2; y_A - 1) = (1 + 2; 2 - 1) = (3; 1)\\)</span>."
        },
        {
          "question": "2) <span style='font-weight:500;'>Déterminer les coordonnées du point <span class='math'>\\(B'\\)</span>, image de <span class='math'>\\(B\\)</span> par la symétrie centrale de centre <span class='math'>\\(C\\)</span>.</span>",

border: 1px solid #cbd5e0; text-align: center;'>0,10</td></tr>\n    <tr><td style='padding: 8px; border: 1px solid #cbd5e0; text-align: center;'>13</td><td style='padding: 8px; border: 1px solid #cbd5e0; text-align: center;'>2</td><td style='padding: 8px; border: 1px solid #cbd5e0; text-align: center;'>0,10</td></tr>\n    <tr style='background: #f7fafc;'><td style='padding: 8px; border: 1px solid #cbd5e0; text-align: center;'>14</td><td style='padding: 8px; border: 1px solid #cbd5e0; text-align: center;'>2</td><td style='padding: 8px; border: 1px solid #cbd5e0; text-align: center;'>0,10</td></tr>\n    <tr><td style='padding: 8px; border: 1px solid #cbd5e0; text-align: center;'>15</td><td style='padding: 8px; border: 1px solid #cbd5e0; text-align: center;'>2</td><td style='padding: 8px; border: 1px solid #cbd5e0; text-align: center;'>0,10</td></tr>\n    <tr style='background: #f7fafc;'><td style='padding: 8px; border: 1px solid #cbd5e0; text-align: center;'>16</td><td style='padding: 8px; border: 1px solid #cbd5e0; text-align: center;'>1</td><td style='padding: 8px; border: 1px solid #cbd5e0; text-align: center;'>0,05</td></tr>\n    <tr style='font-weight: bold; background: #e2e8f0;'><td style='padding: 8px; border: 1px solid #cbd5e0; text-align: center;'>Total</td><td style='padding: 8px; border: 1px solid #cbd5e0; text-align: center;'>20</td><td style='padding: 8px; border: 1px solid #cbd5e0; text-align: center;'>1</td></tr>\n  </tbody>\n</table></div>"

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
