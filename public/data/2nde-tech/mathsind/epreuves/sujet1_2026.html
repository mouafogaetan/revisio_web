<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "maths Industriel",
  "classe": "2nde technique",
  "sequence": "Sequence 1",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Calculs dans R et ensembles de nombres",
      "points": "4 pts",
      "enonce": "<div style='padding: 10px;'><p style='font-weight: bold;'>L'entreprise <strong>MECA-CAM</strong> produit des pièces de rechange pour véhicules. Pour optimiser sa production, elle doit résoudre des problèmes mathématiques faisant intervenir des ensembles de nombres et des valeurs absolues.</p></div>",
      "questions": [
        {
          "question": "<p><strong>1) Reconnaissance des ensembles (1 pt)</strong></p><p>Classer les nombres suivants dans les ensembles $\\mathbb{N}$, $\\mathbb{Z}$, $\\mathbb{Q}$ et $\\mathbb{R}$ :</p><ul><li>$a = 5$</li><li>$b = -3$</li><li>$c = \\dfrac{2}{3}$</li><li>$d = \\sqrt{2}$</li></ul>",
          "reponse": "<ul><li>$a = 5 \\in \\mathbb{N} \\subset \\mathbb{Z} \\subset \\mathbb{Q} \\subset \\mathbb{R}$</li><li>$b = -3 \\in \\mathbb{Z} \\subset \\mathbb{Q} \\subset \\mathbb{R}$</li><li>$c = \\dfrac{2}{3} \\in \\mathbb{Q} \\subset \\mathbb{R}$</li><li>$d = \\sqrt{2} \\in \\mathbb{R} \\setminus \\mathbb{Q}$ (nombre irrationnel)</li></ul>"
        },
        {
          "question": "<p><strong>2) Valeur absolue et distance (1 pt)</strong></p><p>Résoudre l'inéquation $|x - 3| \\leq 5$ dans $\\mathbb{R}$.</p>",
          "reponse": "<p>$|x - 3| \\leq 5 \\iff -5 \\leq x - 3 \\leq 5 \\iff -2 \\leq x \\leq 8$.</p><p>L'ensemble des solutions est $S = [-2; 8]$.</p>"
        },
        {
          "question": "<p><strong>3) Propriétés de la valeur absolue (1 pt)</strong></p><p>Calculer :</p><ul><li>$|(-3) \\times 4|$</li><li>Vérifier que $|a+b| \\leq |a| + |b|$ pour $a = -2$ et $b = 5$</li></ul>",
          "reponse": "<ul><li>$|(-3) \\times 4| = |-12| = 12$</li><li>$|a+b| = |-2+5| = |3| = 3$ ; $|a| + |b| = 2 + 5 = 7$. On a bien $3 \\leq 7$.</li></ul>"
        },
        {
          "question": "<p><strong>4) Approximation décimale (1 pt)</strong></p><p>Donner un encadrement d'ordre 2 (au centième près) de $\\sqrt{7}$.</p>",
          "reponse": "<p>$\\sqrt{7} \\approx 2,64575...$</p><p>Encadrement d'ordre 2 : $2,64 \\leq \\sqrt{7} \\leq 2,65$.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Étude d'une fonction numérique",
      "points": "4 pts",
      "enonce": "<div style='padding: 10px;'><p>Une entreprise de transport utilise la fonction $f$ définie sur $\\mathbb{R}$ par :</p><div class='math-block'><div class='math'>$$ f(x) = -2x^2 + 4x + 1 $$</div></div><p>pour modéliser le bénéfice (en milliers de FCFA) en fonction de la quantité $x$ (en centaines de colis transportés).</p></div>",
      "questions": [
        {
          "question": "<p><strong>1) Calcul d'image (1 pt)</strong></p><p>Calculer $f(1)$ et interpréter le résultat dans le contexte de l'entreprise.</p>",
          "reponse": "<p>$f(1) = -2(1)^2 + 4(1) + 1 = -2 + 4 + 1 = 3$.</p><p>Pour 100 colis transportés, le bénéfice est de 3 000 FCFA.</p>"
        },
        {
          "question": "<p><strong>2) Extremum (1,5 pts)</strong></p><p>Déterminer le maximum de la fonction $f$ sur $\\mathbb{R}$ et la valeur de $x$ pour laquelle il est atteint.</p>",
          "reponse": "<p>$f(x) = -2x^2 + 4x + 1$ est une fonction polynôme du second degré avec $a = -2 &lt; 0$.</p><p>Le sommet de la parabole est en $x = -\\dfrac{b}{2a} = -\\dfrac{4}{2(-2)} = 1$.</p><p>$f(1) = 3$. Le maximum est de 3 000 FCFA, atteint pour 100 colis transportés.</p>"
        },
        {
          "question": "<p><strong>3) Forme canonique (1,5 pts)</strong></p><p>Écrire $f(x)$ sous forme canonique $f(x) = a(x - \\alpha)^2 + \\beta$.</p>",
          "reponse": "<p>$f(x) = -2x^2 + 4x + 1 = -2(x^2 - 2x) + 1 = -2[(x-1)^2 - 1] + 1$</p><p>$f(x) = -2(x-1)^2 + 2 + 1 = -2(x-1)^2 + 3$.</p><p>On retrouve $\\alpha = 1$ et $\\beta = 3$.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Fonctions usuelles et rationnelles",
      "points": "4 pts",
      "enonce": "<div style='padding: 10px;'><p>Le technicien d'une usine agroalimentaire étudie le rendement d'une machine en fonction du temps $x$ (en heures) :</p><p>Pour $x \\in [0; +\\infty[$, il utilise la fonction $g(x) = \\dfrac{2x + 1}{x + 1}$.</p></div>",
      "questions": [
        {
          "question": "<p><strong>1) Domaine de définition (1 pt)</strong></p><p>Déterminer l'ensemble de définition de la fonction $g$.</p>",
          "reponse": "<p>$g(x)$ est une fonction rationnelle. Le dénominateur $x + 1$ s'annule en $x = -1$.</p><p>Comme $x \\in [0; +\\infty[$, $x + 1 > 0$ et la fonction est définie sur $[0; +\\infty[$.</p><p>$D_g = [0; +\\infty[$.</p>"
        },
        {
          "question": "<p><strong>2) Zéro de la fonction (1 pt)</strong></p><p>Déterminer le zéro de la fonction $g$.</p>",
          "reponse": "<p>On résout $g(x) = 0 \\iff \\dfrac{2x + 1}{x + 1} = 0 \\iff 2x + 1 = 0 \\iff x = -\\dfrac{1}{2}$.</p><p>Comme $-\\dfrac{1}{2} \\notin [0; +\\infty[$, la fonction $g$ n'a pas de zéro sur son domaine de définition.</p>"
        },
        {
          "question": "<p><strong>3) Signe de la fonction (1 pt)</strong></p><p>Déterminer le signe de $g(x)$ sur $[0; +\\infty[$.</p>",
          "reponse": "<p>Pour $x \\in [0; +\\infty[$, $x + 1 > 0$ et $2x + 1 > 0$.</p><p>Donc $g(x) = \\dfrac{2x + 1}{x + 1} > 0$ sur $[0; +\\infty[$.</p><p>La fonction $g$ est strictement positive sur son domaine.</p>"
        },
        {
          "question": "<p><strong>4) Simplification (1 pt)</strong></p><p>Exprimer $g(x)$ sous la forme $g(x) = a + \\dfrac{b}{x + 1}$ où $a$ et $b$ sont des réels.</p>",
          "reponse": "<p>$\\dfrac{2x + 1}{x + 1} = 2 - \\dfrac{1}{x + 1}$.</p><p>En effet : $2 - \\dfrac{1}{x+1} = \\dfrac{2(x+1)-1}{x+1} = \\dfrac{2x+2-1}{x+1} = \\dfrac{2x+1}{x+1}$.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Équations et inéquations du second degré",
      "points": "4 pts",
      "enonce": "<div style='padding: 10px;'><p>Un responsable de maintenance doit optimiser la consommation d'énergie d'une machine. La fonction $h(x) = x^2 - 6x + 8$ modélise la consommation (en kWh) en fonction de la vitesse $x$ (en tours/min).</p></div>",
      "questions": [
        {
          "question": "<p><strong>1) Résolution d'équation (1 pt)</strong></p><p>Résoudre l'équation $x^2 - 6x + 8 = 0$ dans $\\mathbb{R}$.</p>",
          "reponse": "<p>$\\Delta = (-6)^2 - 4 \\times 1 \\times 8 = 36 - 32 = 4$.</p><p>$x_1 = \\dfrac{6 - \\sqrt{4}}{2} = \\dfrac{6 - 2}{2} = 2$.</p><p>$x_2 = \\dfrac{6 + \\sqrt{4}}{2} = \\dfrac{6 + 2}{2} = 4$.</p><p>Les solutions sont $S = \\{2; 4\\}$.</p>"
        },
        {
          "question": "<p><strong>2) Résolution d'inéquation (1,5 pts)</strong></p><p>Résoudre l'inéquation $x^2 - 6x + 8 \\leq 0$ dans $\\mathbb{R}$.</p>",
          "reponse": "<p>Le polynôme est du signe de $a = 1 > 0$ à l'extérieur des racines, et négatif entre les racines.</p><p>L'inéquation $x^2 - 6x + 8 \\leq 0$ est donc vérifiée pour $x \\in [2; 4]$.</p><p>$S = [2; 4]$.</p>"
        },
        {
          "question": "<p><strong>3) Interprétation graphique (1,5 pts)</strong></p><p>Déterminer les valeurs de $x$ pour lesquelles la consommation est inférieure ou égale à 0 kWh.</p>",
          "reponse": "<p>D'après la question précédente, la consommation est inférieure ou égale à 0 kWh pour $x \\in [2; 4]$.</p><p>Cela signifie que pour des vitesses comprises entre 2 et 4 tours/min, la machine ne consomme pas d'énergie (ou consomme une quantité négligeable). En réalité, cela correspond à un fonctionnement optimal.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 5 : Problème concret de gestion",
      "points": "4 pts",
      "enonce": "<div style='padding: 10px;'><p>Un atelier de menuiserie produit des tables. Le bénéfice $B(x)$ (en milliers de FCFA) en fonction du nombre $x$ de tables produites est donné par :</p><div class='math-block'><div class='math'>$$ B(x) = -x^2 + 40x - 300 $$</div></div><p>pour $x \\in [0; 40]$.</p></div>",
      "questions": [
        {
          "question": "<p><strong>1) Calcul du bénéfice (1 pt)</strong></p><p>Calculer le bénéfice pour 10 tables produites.</p>",
          "reponse": "<p>$B(10) = -10^2 + 40(10) - 300 = -100 + 400 - 300 = 0$.</p><p>Pour 10 tables, le bénéfice est de 0 FCFA (seuil de rentabilité).</p>"
        },
        {
          "question": "<p><strong>2) Recherche du bénéfice maximal (2 pts)</strong></p><p>Déterminer le nombre de tables à produire pour réaliser un bénéfice maximal. Quel est ce bénéfice ?</p>",
          "reponse": "<p>$B(x) = -x^2 + 40x - 300$ est une fonction polynôme du second degré avec $a = -1 &lt; 0$.</p><p>Le sommet de la parabole est en $x = -\\dfrac{b}{2a} = -\\dfrac{40}{2(-1)} = 20$.</p><p>$B(20) = -20^2 + 40(20) - 300 = -400 + 800 - 300 = 100$.</p><p>Il faut produire 20 tables pour un bénéfice maximal de 100 000 FCFA.</p>"
        },
        {
          "question": "<p><strong>3) Seuil de rentabilité (1 pt)</strong></p><p>Déterminer les quantités pour lesquelles l'entreprise réalise un bénéfice positif.</p>",
          "reponse": "<p>On résout $B(x) > 0 \\iff -x^2 + 40x - 300 > 0 \\iff x^2 - 40x + 300 < 0$.</p><p>$\\Delta = (-40)^2 - 4 \\times 1 \\times 300 = 1600 - 1200 = 400$.</p><p>$x_1 = \\dfrac{40 - 20}{2} = 10$ ; $x_2 = \\dfrac{40 + 20}{2} = 30$.</p><p>Le polynôme est négatif entre les racines, donc $x \\in ]10; 30[$.</p><p>L'entreprise réalise un bénéfice pour une production comprise entre 11 et 29 tables.</p>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
