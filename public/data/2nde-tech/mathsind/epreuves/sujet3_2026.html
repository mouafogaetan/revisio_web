<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "maths Industriel",
  "classe": "2nde technique",
  "sequence": "Séquence 3",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Étude d'une fonction rationnelle et équation du second degré",
      "points": "5 pts",
      "enonce": "<p>Dans une entreprise de fabrication, le coût total de production en milliers de francs CFA pour \\( x \\) centaines de pièces produites est donné par : </p><div class='math-block'><div class='math'>$$ C(x) = \\dfrac{2x^2 + 3x + 1}{x + 1} $$</div></div><p>où \\( x \\in [0; 10] \\).</p>",
      "questions": [
        {
          "question": "<p>1. (1 pt) Montre que pour tout \\( x \\in [0; 10] \\), on peut écrire : </p><div class='math-block'><div class='math'>$$ C(x) = 2x + 1 + \\dfrac{1}{x + 1} $$</div></div>",
          "reponse": "<p>On effectue la division : \\( 2x^2 + 3x + 1 = (x+1)(2x+1) \\). En effet, \\( (x+1)(2x+1) = 2x^2 + x + 2x + 1 = 2x^2 + 3x + 1 \\).<br>Donc \\( C(x) = \\dfrac{(x+1)(2x+1)}{x+1} + \\dfrac{1}{x+1} = 2x + 1 + \\dfrac{1}{x+1} \\).</p>"
        },
        {
          "question": "<p>2. (1,5 pt) Résoudre dans \\( \\mathbb{R} \\) l'équation \\( C(x) = 0 \\).</p>",
          "reponse": "<p>\\( C(x) = 0 \\Rightarrow 2x^2 + 3x + 1 = 0 \\) et \\( x \\neq -1 \\).<br>Calcul du discriminant : \\( \\Delta = 3^2 - 4(2)(1) = 9 - 8 = 1 \\).<br>\\( x_1 = \\dfrac{-3 - 1}{4} = -1 \\) (valeur interdite) ; \\( x_2 = \\dfrac{-3 + 1}{4} = -\\dfrac{1}{2} \\).<br>Donc \\( S = \\left\\{-\\dfrac{1}{2}\\right\\} \\).</p>"
        },
        {
          "question": "<p>3. (1,5 pt) Détermine le signe de \\( C(x) \\) pour \\( x \\in [0; 10] \\). Interprète le résultat.</p>",
          "reponse": "<p>Pour \\( x \\in [0; 10] \\), \\( 2x^2 + 3x + 1 > 0 \\) et \\( x + 1 > 0 \\). Donc \\( C(x) > 0 \\) sur \\( [0; 10] \\).<br>Interprétation : Sur l'intervalle de production considéré, le coût total de production est toujours strictement positif.</p>"
        },
        {
          "question": "<p>4. (1 pt) Calcule le coût de production pour 200 pièces (\\( x = 2 \\)).</p>",
          "reponse": "<p>\\( C(2) = \\dfrac{2(2)^2 + 3(2) + 1}{2 + 1} = \\dfrac{8 + 6 + 1}{3} = \\dfrac{15}{3} = 5 \\) milliers de FCFA, soit 5 000 FCFA.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Vecteurs de l'espace et trigonométrie",
      "points": "5 pts",
      "enonce": "<p>Dans l'espace muni d'un repère orthonormé direct, on considère les vecteurs \\( \\vec{u}(1; -2; 3) \\), \\( \\vec{v}(2; 1; -1) \\) et \\( \\vec{w}(-1; 0; 2) \\).<br>Un ouvrier doit déterminer l'angle entre deux vecteurs pour un calcul de force.</p>",
      "questions": [
        {
          "question": "<p>1. (1 pt) Calcule le produit scalaire \\( \\vec{u} \\cdot \\vec{v} \\).</p>",
          "reponse": "<p>\\( \\vec{u} \\cdot \\vec{v} = 1(2) + (-2)(1) + 3(-1) = 2 - 2 - 3 = -3 \\)</p>"
        },
        {
          "question": "<p>2. (1,5 pt) Calcule les normes \\( ||\\vec{u}|| \\) et \\( ||\\vec{v}|| \\).</p>",
          "reponse": "<p>\\( ||\\vec{u}|| = \\sqrt{1^2 + (-2)^2 + 3^2} = \\sqrt{1 + 4 + 9} = \\sqrt{14} \\)<br>\\( ||\\vec{v}|| = \\sqrt{2^2 + 1^2 + (-1)^2} = \\sqrt{4 + 1 + 1} = \\sqrt{6} \\)</p>"
        },
        {
          "question": "<p>3. (1,5 pt) Déduis-en la mesure en radians de l'angle \\( \\theta = (\\widehat{\\vec{u};\\vec{v}}) \\).</p>",
          "reponse": "<p>\\( \\cos \\theta = \\dfrac{\\vec{u} \\cdot \\vec{v}}{||\\vec{u}|| \\times ||\\vec{v}||} = \\dfrac{-3}{\\sqrt{14} \\times \\sqrt{6}} = \\dfrac{-3}{\\sqrt{84}} = \\dfrac{-3}{2\\sqrt{21}} \\approx -0,3273 \\).<br>\\( \\theta = \\arccos(-0,3273) \\approx 1,904 \\, \\text{rad} \\).</p>"
        },
        {
          "question": "<p>4. (1 pt) Effectue une conversion en degrés de \\( \\theta \\) (arrondi au dixième).</p>",
          "reponse": "<p>\\( \\theta = 1,904 \\times \\dfrac{180}{\\pi} \\approx 1,904 \\times 57,2958 \\approx 109,1^\\circ \\).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Géométrie plane et barycentre",
      "points": "6 pts",
      "enonce": "<p>Une plaque métallique de forme triangulaire doit être équilibrée en son centre de gravité. Les sommets du triangle sont les points \\( A(2; -1) \\), \\( B(5; 3) \\) et \\( C(-1; 4) \\) dans un repère orthonormé du plan.</p>",
      "questions": [
        {
          "question": "<p>1. (1 pt) Détermine les coordonnées du milieu I de [AB] et J de [BC].</p>",
          "reponse": "<p>\\( I\\left(\\dfrac{2 + 5}{2}; \\dfrac{-1 + 3}{2}\\right) = I\\left(\\dfrac{7}{2}; 1\\right) \\)<br>\\( J\\left(\\dfrac{5 + (-1)}{2}; \\dfrac{3 + 4}{2}\\right) = J(2; \\dfrac{7}{2}) \\)</p>"
        },
        {
          "question": "<p>2. (2 pts) Calcule les coordonnées du barycentre G du système de points pondérés \\( \\{(A; 1), (B; 1), (C; 1)\\} \\).</p>",
          "reponse": "<p>G est le centre de gravité du triangle ABC.<br>\\( x_G = \\dfrac{x_A + x_B + x_C}{3} = \\dfrac{2 + 5 + (-1)}{3} = \\dfrac{6}{3} = 2 \\)<br>\\( y_G = \\dfrac{y_A + y_B + y_C}{3} = \\dfrac{-1 + 3 + 4}{3} = \\dfrac{6}{3} = 2 \\)<br>G(2; 2).</p>"
        },
        {
          "question": "<p>3. (2 pts) Vérifie que G est aligné avec I et C. Quelle est la propriété géométrique utilisée ?</p>",
          "reponse": "<p>Vecteur \\( \\overrightarrow{IG} = \\left(2 - \\dfrac{7}{2}; 2 - 1\\right) = \\left(-\\dfrac{3}{2}; 1\\right) \\).<br>Vecteur \\( \\overrightarrow{IC} = \\left(-1 - \\dfrac{7}{2}; 4 - 1\\right) = \\left(-\\dfrac{9}{2}; 3\\right) = 3 \\times \\left(-\\dfrac{3}{2}; 1\\right) = 3\\overrightarrow{IG} \\).<br>Donc I, G et C sont alignés. C'est la propriété des médianes : le centre de gravité est situé aux 2/3 de chaque médiane à partir du sommet.</p>"
        },
        {
          "question": "<p>4. (1 pt) Calcule la longueur AG.</p>",
          "reponse": "<p>\\( \\overrightarrow{AG} = (2 - 2; 2 - (-1)) = (0; 3) \\)<br>\\( AG = \\sqrt{0^2 + 3^2} = 3 \\) unités.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Transformations du plan",
      "points": "4 pts",
      "enonce": "<p>Dans le plan, on considère la translation de vecteur \\( \\vec{t}(3; -2) \\) et l'homothétie de centre O(0;0) et de rapport \\( k = 2 \\).</p>",
      "questions": [
        {
          "question": "<p>1. (1 pt) Soit A(1; 3). Détermine l'image de A par la translation \\( \\vec{t} \\).</p>",
          "reponse": "<p>A'(1 + 3; 3 + (-2)) = A'(4; 1).</p>"
        },
        {
          "question": "<p>2. (1,5 pt) Détermine l'image de A par l'homothétie de centre O et de rapport 2.</p>",
          "reponse": "<p>A''(2×1; 2×3) = A''(2; 6).</p>"
        },
        {
          "question": "<p>3. (1,5 pt) On applique d'abord la translation, puis l'homothétie au point A. Détermine les coordonnées du point final.</p>",
          "reponse": "<p>On applique d'abord la translation : A(1;3) → A'(4;1).<br>Puis l'homothétie : A'(4;1) → A'''(2×4; 2×1) = A'''(8; 2).</p>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
