<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Maths Industriel",
  "classe": "2nde technique",
  "sequence": "Séquence 5",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Fonctions polynômes et applications industrielles (7 pts)",
      "points": "7 pts",
      "enonce": "<p>Dans une usine de production, le coût de fabrication d'un produit, en milliers de francs CFA, pour une production de <span class='math inline'><i>x</i></span> centaines d'unités, est modélisé par la fonction <span class='math inline'><i>C</i>(<i>x</i>) = <i>x</i><sup>2</sup> − 6<i>x</i> + 15</span> sur l'intervalle [0 ; 8].</p><p>Le prix de vente unitaire est fixé à 5 000 FCFA. Ainsi, la recette pour <span class='math inline'><i>x</i></span> centaines d'unités vendues est <span class='math inline'><i>R</i>(<i>x</i>) = 5<i>x</i></span> (en milliers de FCFA).</p>",
      "questions": [
        {
          "question": "<p><strong>1.</strong> Déterminez le zéro de la fonction polynôme <span class='math inline'><i>C</i></span>. Quelle est la signification concrète de ce résultat pour l'entreprise ?</p>",
          "reponse": "<div class='math-block'><div class='math'>$$ C(x) = 0 \\Rightarrow x^2 - 6x + 15 = 0 $$</div></div><p>Calcul du discriminant : <span class='math inline'>Δ = (−6)<sup>2</sup> − 4×1×15 = 36 − 60 = −24</span>.</p><p>Δ < 0, donc la fonction <span class='math inline'><i>C</i></span> n'a pas de zéro réel. Cela signifie que le coût de fabrication n'est jamais nul. L'entreprise ne peut pas produire gratuitement, ce qui est logique économiquement.</p>"
        },
        {
          "question": "<p><strong>2.</strong> Factorisez le polynôme <span class='math inline'><i>C</i>(<i>x</i>)</span> sous la forme <span class='math inline'>(<i>x</i> − 3)<sup>2</sup> + 6</span>.</p>",
          "reponse": "<div class='math-block'><div class='math'>$$ C(x) = x^2 - 6x + 15 = (x^2 - 6x + 9) + 6 = (x - 3)^2 + 6 $$</div></div><p>Cette forme canonique est très utile car elle montre que le coût est toujours supérieur ou égal à 6 (en milliers de FCFA).</p>"
        },
        {
          "question": "<p><strong>3.</strong> Déterminez le signe de <span class='math inline'><i>C</i>(<i>x</i>)</span> pour <span class='math inline'><i>x</i> ∈ [0 ; 8]</span>. Justifiez votre réponse.</p>",
          "reponse": "<p>D'après la forme canonique <span class='math inline'><i>C</i>(<i>x</i>) = (<i>x</i> − 3)<sup>2</sup> + 6</span>.</p><p>Comme <span class='math inline'>(<i>x</i> − 3)<sup>2</sup> ≥ 0</span> pour tout <span class='math inline'><i>x</i></span>, alors <span class='math inline'><i>C</i>(<i>x</i>) ≥ 6 > 0</span>.</p><p>Donc <span class='math inline'><i>C</i>(<i>x</i>)</span> est <strong>strictement positive</strong> sur l'intervalle [0 ; 8].</p>"
        },
        {
          "question": "<p><strong>4.</strong> Le bénéfice est défini par <span class='math inline'><i>B</i>(<i>x</i>) = <i>R</i>(<i>x</i>) − <i>C</i>(<i>x</i>)</span>. Exprimez <span class='math inline'><i>B</i>(<i>x</i>)</span> et déterminez sa forme factorisée. Pour quelle quantité produite le bénéfice est-il maximum ?</p>",
          "reponse": "<div class='math-block'><div class='math'>$$ B(x) = 5x - (x^2 - 6x + 15) = -x^2 + 11x - 15 $$</div></div><p>Forme factorisée : <span class='math inline'><i>B</i>(<i>x</i>) = −(<i>x</i> − 5,5)<sup>2</sup> + 15,25</span>.</p><p>Le bénéfice est maximum pour <span class='math inline'><i>x</i> = 5,5</span> centaines d'unités, soit <strong>550 unités</strong>. Le bénéfice maximal est de 15 250 FCFA.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Fonctions rationnelles en mécanique (6 pts)",
      "points": "6 pts",
      "enonce": "<p>En mécanique, la force d'attraction entre deux aimants est modélisée par la fonction <span class='math inline'><i>f</i>(<i>x</i>) = 1/<i>x</i><sup>2</sup></span>, où <span class='math inline'><i>x</i></span> est la distance en cm entre les aimants et <span class='math inline'><i>f</i>(<i>x</i>)</span> est la force en Newtons.</p><p>On s'intéresse à la fonction <span class='math inline'><i>g</i>(<i>x</i>) = 1/(<i>x</i> − 2)<sup>2</sup></span>, qui modélise une situation où un aimant est décalé de 2 cm.</p>",
      "questions": [
        {
          "question": "<p><strong>1.</strong> Déterminez l'ensemble de définition de la fonction <span class='math inline'><i>g</i></span>.</p>",
          "reponse": "<p>La fonction <span class='math inline'><i>g</i>(<i>x</i>) = 1/(<i>x</i> − 2)<sup>2</sup></span> est définie pour tout <span class='math inline'><i>x</i></span> tel que le dénominateur soit non nul, c'est-à-dire <span class='math inline'>(<i>x</i> − 2)<sup>2</sup> ≠ 0</span>.</p><p>Donc <span class='math inline'><i>x</i> − 2 ≠ 0</span>, soit <span class='math inline'><i>x</i> ≠ 2</span>.</p><p>L'ensemble de définition est <span class='math inline'>D<sub>g</sub> = ℝ \\ {2}</span>.</p>"
        },
        {
          "question": "<p><strong>2.</strong> Déterminez le(s) zéro(s) de la fonction <span class='math inline'><i>g</i></span>.</p>",
          "reponse": "<p>La fonction <span class='math inline'><i>g</i></span> n'a pas de zéro. En effet, <span class='math inline'>1/(<i>x</i> − 2)<sup>2</sup> = 0</span> n'a pas de solution, car le numérateur est toujours non nul et le dénominateur est toujours strictement positif.</p><p>Le zéro d'une fonction rationnelle est la valeur qui annule le numérateur. Ici le numérateur est 1, qui ne s'annule jamais.</p>"
        },
        {
          "question": "<p><strong>3.</strong> Étudiez le signe de <span class='math inline'><i>g</i>(<i>x</i>)</span> sur son ensemble de définition.</p>",
          "reponse": "<p>Pour tout <span class='math inline'><i>x</i> ≠ 2</span>, <span class='math inline'>(<i>x</i> − 2)<sup>2</sup> > 0</span>. Donc <span class='math inline'>1/(<i>x</i> − 2)<sup>2</sup> > 0</span>.</p><p>Ainsi, <span class='math inline'><i>g</i>(<i>x</i>)</span> est <strong>strictement positive</strong> sur <span class='math inline'>ℝ \\ {2}</span>.</p><p>La fonction n'est pas définie en 2, donc il n'y a pas de changement de signe.</p>"
        },
        {
          "question": "<p><strong>4.</strong> Que se passe-t-il pour la force lorsque la distance <span class='math inline'><i>x</i></span> se rapproche de 2 cm ? Interprétez physiquement ce résultat.</p>",
          "reponse": "<p>Lorsque <span class='math inline'><i>x</i></span> se rapproche de 2, <span class='math inline'>(<i>x</i> − 2)<sup>2</sup></span> tend vers 0. La valeur de <span class='math inline'><i>g</i>(<i>x</i>)</span> tend alors vers l'infini.</p><p>En réalité, lorsque les aimants sont très proches (distance tendant vers 0), la force d'attraction devient extrêmement grande, voire infinie. C'est pourquoi les aimants s'attirent très fortement lorsqu'ils sont proches l'un de l'autre.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Équations et systèmes en électricité (5 pts)",
      "points": "5 pts",
      "enonce": "<p>Un technicien doit déterminer la valeur de trois résistances <span class='math inline'><i>R</i><sub>1</sub></span>, <span class='math inline'><i>R</i><sub>2</sub></span> et <span class='math inline'><i>R</i><sub>3</sub></span> (en ohms) d'un circuit électrique. Il sait que :</p><ul><li>La résistance totale en série est : <span class='math inline'><i>R</i><sub>1</sub> + <i>R</i><sub>2</sub> + <i>R</i><sub>3</sub> = 12</span></li><li>La première résistance est égale à la somme des deux autres : <span class='math inline'><i>R</i><sub>1</sub> = <i>R</i><sub>2</sub> + <i>R</i><sub>3</sub></span></li><li>Le double de la troisième est égal à la somme de la première et de la deuxième : <span class='math inline'>2<i>R</i><sub>3</sub> = <i>R</i><sub>1</sub> + <i>R</i><sub>2</sub></span></li></ul>",
      "questions": [
        {
          "question": "<p><strong>1.</strong> Traduisez ce problème en un système de trois équations à trois inconnues <span class='math inline'><i>R</i><sub>1</sub></span>, <span class='math inline'><i>R</i><sub>2</sub></span> et <span class='math inline'><i>R</i><sub>3</sub></span>.</p>",
          "reponse": "<div class='math-block'><div class='math'>$$ \\begin{cases} R_1 + R_2 + R_3 = 12 \\\\ R_1 = R_2 + R_3 \\\\ 2R_3 = R_1 + R_2 \\end{cases} $$</div></div><p>Ce système peut être réécrit sous forme standard :</p><div class='math-block'><div class='math'>$$ \\begin{cases} R_1 + R_2 + R_3 = 12 \\\\ R_1 - R_2 - R_3 = 0 \\\\ -R_1 - R_2 + 2R_3 = 0 \\end{cases} $$</div></div>"
        },
        {
          "question": "<p><strong>2.</strong> Résolvez ce système. Utilisez la méthode de votre choix (substitution, combinaison, etc.).</p>",
          "reponse": "<p><strong>Par substitution :</strong></p><ul><li>De la 2<sup>e</sup> équation : <span class='math inline'><i>R</i><sub>1</sub> = <i>R</i><sub>2</sub> + <i>R</i><sub>3</sub></span></li><li>Dans la 1<sup>re</sup> : <span class='math inline'>(<i>R</i><sub>2</sub> + <i>R</i><sub>3</sub>) + <i>R</i><sub>2</sub> + <i>R</i><sub>3</sub> = 12</span> ⇒ <span class='math inline'>2<i>R</i><sub>2</sub> + 2<i>R</i><sub>3</sub> = 12</span> ⇒ <span class='math inline'><i>R</i><sub>2</sub> + <i>R</i><sub>3</sub> = 6</span></li><li>Dans la 3<sup>e</sup> : <span class='math inline'>2<i>R</i><sub>3</sub> = (<i>R</i><sub>2</sub> + <i>R</i><sub>3</sub>) + <i>R</i><sub>2</sub> = <i>R</i><sub>2</sub> + <i>R</i><sub>3</sub> + <i>R</i><sub>2</sub></span> ⇒ <span class='math inline'>2<i>R</i><sub>3</sub> = 2<i>R</i><sub>2</sub> + <i>R</i><sub>3</sub></span> ⇒ <span class='math inline'><i>R</i><sub>3</sub> = 2<i>R</i><sub>2</sub></span></li><li>On remplace dans <span class='math inline'><i>R</i><sub>2</sub> + <i>R</i><sub>3</sub> = 6</span> : <span class='math inline'><i>R</i><sub>2</sub> + 2<i>R</i><sub>2</sub> = 6</span> ⇒ <span class='math inline'>3<i>R</i><sub>2</sub> = 6</span> ⇒ <span class='math inline'><i>R</i><sub>2</sub> = 2</span></li><li>Alors <span class='math inline'><i>R</i><sub>3</sub> = 2×2 = 4</span> et <span class='math inline'><i>R</i><sub>1</sub> = 2 + 4 = 6</span></li></ul><p><strong>Solution :</strong> <span class='math inline'><i>R</i><sub>1</sub> = 6 Ω</span>, <span class='math inline'><i>R</i><sub>2</sub> = 2 Ω</span>, <span class='math inline'><i>R</i><sub>3</sub> = 4 Ω</span></p>"

        {

          "reponse": "<ul><li><span class='math inline'>6 + 2 + 4 = 12</span> ✓</li><li><span class='math inline'>6 = 2 + 4 = 6</span> ✓</li><li><span class='math inline'>2×4 = 8</span> et <span class='math inline'>6 + 2 = 8</span> ✓</li></ul><p>Les trois équations sont bien vérifiées.</p>"

        {

          "reponse": "<p>Les trois résistances mesurent respectivement 6 Ω, 2 Ω et 4 Ω. Le technicien peut donc identifier les composants de son circuit électrique.</p><p>On vérifie que la résistance totale en série est bien de 12 Ω, ce qui confirme la cohérence du résultat.</p>"

    },
    {

      "questions": [
        {

          "reponse": "<p><strong>Coût total :</strong> <span class='math inline'><i>C</i>(<i>n</i>) = 10 000 + 2<i>n</i></span></p><p><strong>Recette :</strong> <span class='math inline'><i>R</i>(<i>n</i>) = 50<i>n</i></span></p><p><strong>Bénéfice :</strong> <span class='math inline'><i>B</i>(<i>n</i>) = <i>R</i>(<i>n</i>) − <i>C</i>(<i>n</i>) = 50<i>n</i> − (10 000 + 2<i>n</i>) = 48<i>n</i> − 10 000</span></p>"
        },
        {
          "question": "<p><strong>2.</strong> Résolvez l'inéquation <span class='math inline'><i>B</i>(<i>n</i>) ≥ 0</span>. À partir de combien de pièces l'entreprise commence-t-elle à faire des bénéfices ?</p>",
          "reponse": "<div class='math-block'><div class='math'>$$ B(n) \\ge 0 \\Rightarrow 48n - 10 000 \\ge 0 \\Rightarrow 48n \\ge 10 000 \\Rightarrow n \\ge \\dfrac{10 000}{48} \\approx 208,33 $$</div></div><p>L'entreprise doit produire au moins <strong>209 pièces</strong> par jour pour commencer à faire des bénéfices (le seuil de rentabilité).</p>"

        {
          "question": "<p><strong>3.</strong> Si l'entreprise souhaite réaliser un bénéfice d'au moins 5 000 FCFA par jour, combien de pièces doit-elle vendre au minimum ?</p>",
          "reponse": "<div class='math-block'><div class='math'>$$ B(n) \\ge 5 000 \\Rightarrow 48n - 10 000 \\ge 5 000 \\Rightarrow 48n \\ge 15 000 \\Rightarrow n \\ge \\dfrac{15 000}{48} = 312,5 $$</div></div><p>L'entreprise doit vendre au moins <strong>313 pièces</strong> par jour pour atteindre un bénéfice d'au moins 5 000 FCFA.</p>"

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
