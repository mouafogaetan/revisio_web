<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "maths Industriel",
  "classe": "2nde technique",
  "sequence": "Sequence 2",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Trigonométrie et conversion d'angles",
      "points": "4 pts",
      "enonce": "<div style='padding: 10px;'><p>Dans le cadre de la maintenance d'une machine-outil, un technicien doit régler l'angle d'une came. L'angle de rotation $\\theta$ est donné en radians : $\\theta = \\dfrac{5\\pi}{6}$.</p></div>",
      "questions": [
        {
          "question": "<p><strong>1) Détermination de la mesure principale (1 pt)</strong></p><p>Déterminer la mesure principale de l'angle $\\theta$.</p>",
          "reponse": "<p>La mesure principale doit être dans l'intervalle $]-\\pi; \\pi]$.</p><p>$\\dfrac{5\\pi}{6} \\approx 2,618$ rad, cette valeur est déjà dans l'intervalle $]-\\pi; \\pi]$.</p><p>Donc la mesure principale est $\\dfrac{5\\pi}{6}$.</p>"
        },
        {
          "question": "<p><strong>2) Conversion en degrés (1 pt)</strong></p><p>Convertir $\\theta = \\dfrac{5\\pi}{6}$ radians en degrés.</p>",
          "reponse": "<p>$\\dfrac{5\\pi}{6} \\times \\dfrac{180}{\\pi} = \\dfrac{5 \\times 180}{6} = 150^\\circ$.</p>"
        },
        {
          "question": "<p><strong>3) Conversion en grades (1 pt)</strong></p><p>Convertir $\\theta = \\dfrac{5\\pi}{6}$ radians en grades.</p>",
          "reponse": "<p>$\\dfrac{5\\pi}{6} \\times \\dfrac{200}{\\pi} = \\dfrac{5 \\times 200}{6} = \\dfrac{1000}{6} = 166,67$ grades.</p>"
        },
        {
          "question": "<p><strong>4) Lignes trigonométriques (1 pt)</strong></p><p>Calculer $\\cos(\\theta)$ et $\\sin(\\theta)$.</p>",
          "reponse": "<p>$\\cos\\left(\\dfrac{5\\pi}{6}\\right) = -\\cos\\left(\\dfrac{\\pi}{6}\\right) = -\\dfrac{\\sqrt{3}}{2}$.</p><p>$\\sin\\left(\\dfrac{5\\pi}{6}\\right) = \\sin\\left(\\dfrac{\\pi}{6}\\right) = \\dfrac{1}{2}$.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Vecteurs de l'espace",
      "points": "4 pts",
      "enonce": "<div style='padding: 10px;'><p>Un ingénieur en mécanique doit calculer les composantes d'une force. On considère les vecteurs $\\vec{u} = (2, -1, 3)$ et $\\vec{v} = (1, 4, -2)$.</p></div>",
      "questions": [
        {
          "question": "<p><strong>1) Combinaison linéaire (1 pt)</strong></p><p>Calculer le vecteur $\\vec{w} = 2\\vec{u} - 3\\vec{v}$.</p>",
          "reponse": "<p>$2\\vec{u} = (4, -2, 6)$ et $3\\vec{v} = (3, 12, -6)$.</p><p>$\\vec{w} = (4-3, -2-12, 6-(-6)) = (1, -14, 12)$.</p>"
        },
        {
          "question": "<p><strong>2) Produit scalaire (1 pt)</strong></p><p>Calculer le produit scalaire $\\vec{u} \\cdot \\vec{v}$.</p>",
          "reponse": "<p>$\\vec{u} \\cdot \\vec{v} = 2 \\times 1 + (-1) \\times 4 + 3 \\times (-2) = 2 - 4 - 6 = -8$.</p>"
        },
        {
          "question": "<p><strong>3) Norme (1 pt)</strong></p><p>Calculer la norme du vecteur $\\vec{u}$.</p>",
          "reponse": "<p>$\\|\\vec{u}\\| = \\sqrt{2^2 + (-1)^2 + 3^2} = \\sqrt{4 + 1 + 9} = \\sqrt{14}$.</p>"
        },
        {
          "question": "<p><strong>4) Produit vectoriel (1 pt)</strong></p><p>Calculer le produit vectoriel $\\vec{u} \\times \\vec{v}$.</p>",
          "reponse": "<p>$\\vec{u} \\times \\vec{v} = \\begin{pmatrix} (-1)(-2) - 3(4) \\\\ 3(1) - 2(-2) \\\\ 2(4) - (-1)(1) \\end{pmatrix} = \\begin{pmatrix} 2 - 12 \\\\ 3 + 4 \\\\ 8 + 1 \\end{pmatrix} = (-10, 7, 9)$.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Géométrie plane",
      "points": "4 pts",
      "enonce": "<div style='padding: 10px;'><p>Un architecte doit déterminer les coordonnées de points sur un plan de construction. Dans un repère orthonormé $(O; \\vec{i}, \\vec{j})$, on donne les points $A(1, 2)$, $B(3, -1)$ et $C(0, 3)$.</p></div>",
      "questions": [
        {
          "question": "<p><strong>1) Équation d'une droite (1,5 pts)</strong></p><p>Déterminer l'équation cartésienne de la droite $(AB)$.</p>",
          "reponse": "<p>Le vecteur directeur de $(AB)$ est $\\overrightarrow{AB} = (2, -3)$.</p><p>Un vecteur normal est $\\vec{n} = (3, 2)$ (produit scalaire nul : $3\\times2 + 2\\times(-3) = 6 - 6 = 0$).</p><p>L'équation est de la forme $3x + 2y + c = 0$.</p><p>En remplaçant $A(1,2)$ : $3(1) + 2(2) + c = 0 \\Rightarrow 3 + 4 + c = 0 \\Rightarrow c = -7$.</p><p>L'équation est $3x + 2y - 7 = 0$.</p>"
        },
        {
          "question": "<p><strong>2) Équation d'un cercle (1,5 pts)</strong></p><p>Déterminer l'équation du cercle de centre $A$ passant par $B$.</p>",
          "reponse": "<p>Le rayon $r = AB = \\sqrt{(3-1)^2 + (-1-2)^2} = \\sqrt{4 + 9} = \\sqrt{13}$.</p><p>L'équation du cercle est $(x - 1)^2 + (y - 2)^2 = 13$.</p>"
        },
        {
          "question": "<p><strong>3) Barycentre (1 pt)</strong></p><p>Déterminer les coordonnées du barycentre $G$ des points $A$, $B$ et $C$ affectés des coefficients respectifs $2$, $1$ et $3$.</p>",
          "reponse": "<p>$x_G = \\dfrac{2(1) + 1(3) + 3(0)}{2+1+3} = \\dfrac{2 + 3 + 0}{6} = \\dfrac{5}{6}$.</p><p>$y_G = \\dfrac{2(2) + 1(-1) + 3(3)}{6} = \\dfrac{4 - 1 + 9}{6} = \\dfrac{12}{6} = 2$.</p><p>$G\\left(\\dfrac{5}{6}, 2\\right)$.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Transformations du plan",
      "points": "4 pts",
      "enonce": "<div style='padding: 10px;'><p>Un dessinateur industriel doit appliquer des transformations à une pièce mécanique représentée par le point $A(3, 1)$ dans un repère orthonormé.</p></div>",
      "questions": [
        {
          "question": "<p><strong>1) Symétrie centrale (1 pt)</strong></p><p>Déterminer l'image de $A$ par la symétrie centrale de centre $O(0,0)$.</p>",
          "reponse": "<p>L'image de $A(3,1)$ par la symétrie centrale de centre $O$ est $A'(-3, -1)$.</p>"
        },
        {
          "question": "<p><strong>2) Translation (1 pt)</strong></p><p>Déterminer l'image de $A$ par la translation de vecteur $\\vec{v}(-2, 3)$.</p>",
          "reponse": "<p>$A'' = A + \\vec{v} = (3-2, 1+3) = (1, 4)$.</p>"
        },
        {
          "question": "<p><strong>3) Rotation (1 pt)</strong></p><p>Déterminer l'image de $A$ par la rotation de centre $O$ et d'angle $\\dfrac{\\pi}{2}$ (sens direct).</p>",
          "reponse": "<p>La rotation d'angle $\\pi/2$ transforme $(x, y)$ en $(-y, x)$.</p><p>$A''' = (-1, 3)$.</p>"
        },
        {
          "question": "<p><strong>4) Homothétie (1 pt)</strong></p><p>Déterminer l'image de $A$ par l'homothétie de centre $O$ et de rapport $k = -2$.</p>",
          "reponse": "<p>L'homothétie de rapport $k$ transforme $(x, y)$ en $(kx, ky)$.</p><p>$A'''' = (-2 \\times 3, -2 \\times 1) = (-6, -2)$.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 5 : Géométrie dans l'espace",
      "points": "4 pts",
      "enonce": "<div style='padding: 10px;'><p>Un technicien en génie civil doit étudier la position relative d'une poutre et d'un mur. On considère la droite $d$ passant par $A(1, 0, 2)$ de vecteur directeur $\\vec{u}(2, -1, 3)$ et le plan $\\mathcal{P}$ d'équation $x + 2y - z + 1 = 0$.</p></div>",
      "questions": [
        {
          "question": "<p><strong>1) Position relative de la droite et du plan (2 pts)</strong></p><p>Déterminer la position relative de la droite $d$ et du plan $\\mathcal{P}$.</p>",
          "reponse": "<p>Un vecteur normal au plan est $\\vec{n}(1, 2, -1)$.</p><p>On calcule $\\vec{u} \\cdot \\vec{n} = 2(1) + (-1)(2) + 3(-1) = 2 - 2 - 3 = -3 \\neq 0$.</p><p>Le vecteur directeur de la droite n'est pas orthogonal au vecteur normal du plan, donc la droite et le plan sont sécants.</p><p>On résout le système pour trouver le point d'intersection.</p><p>Paramétrisation de $d$ : $\\begin{cases} x = 1 + 2t \\\\ y = -t \\\\ z = 2 + 3t \\end{cases}$.</p><p>On remplace dans l'équation du plan : $(1+2t) + 2(-t) - (2+3t) + 1 = 0$.</p><p>$1 + 2t - 2t - 2 - 3t + 1 = 0 \\Rightarrow (1-2+1) + (2t-2t-3t) = 0 \\Rightarrow -3t = 0 \\Rightarrow t = 0$.</p><p>Le point d'intersection est $A(1, 0, 2)$.</p>"
        },
        {
          "question": "<p><strong>2) Positions relatives de deux droites (2 pts)</strong></p><p>On considère la droite $d'$ passant par $B(3, -1, 5)$ de vecteur directeur $\\vec{v}(4, -2, 6)$. Déterminer la position relative de $d$ et $d'$.</p>",
          "reponse": "<p>On remarque que $\\vec{v} = 2\\vec{u}$, donc les droites sont parallèles ou confondues.</p><p>Vérifions si $A$ appartient à $d'$ : Il existe $t$ tel que $\\begin{cases} 1 = 3 + 4t \\\\ 0 = -1 - 2t \\\\ 2 = 5 + 6t \\end{cases}$.</p><p>De la première : $4t = -2 \\Rightarrow t = -\\dfrac{1}{2}$.</p><p>De la deuxième : $-2t = 1 \\Rightarrow t = -\\dfrac{1}{2}$.</p><p>De la troisième : $6t = -3 \\Rightarrow t = -\\dfrac{1}{2}$.</p><p>$t = -\\dfrac{1}{2}$ vérifie les trois équations, donc $A \\in d'$.</p><p>Les deux droites sont confondues.</p>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
