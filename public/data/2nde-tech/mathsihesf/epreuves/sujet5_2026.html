<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Mathématiques - IH/ESF",
  "classe": "2nde Technique",
  "sequence": "Séquence 5",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Fonctions et études de variations",
      "points": "5 pts",
      "enonce": "<p style='font-size: 1rem;'>Dans une entreprise de confection, le bénéfice (en milliers de FCFA) réalisé pour la production de \\( x \\) dizaines de vêtements est modélisé par la fonction \\( f \\) définie sur [0 ; 10] par :</p><div style='background-color: #f4f4f4; padding: 10px; border-radius: 8px; text-align: center;'><span class='math'>\\( f(x) = -2x^2 + 12x - 10 \\)</span></div><p style='font-size: 1rem; margin-top: 10px;'>Le bénéfice est positif lorsque \\( f(x) > 0 \\).</p>",
      "questions": [
        {
          "question": "<p><strong>1.</strong> Déterminer l'ensemble de définition de la fonction \\( f \\).</p>",
          "reponse": "<p>La fonction \\( f \\) est définie sur l'intervalle [0 ; 10] d'après l'énoncé, car \\( x \\) représente un nombre de dizaines de vêtements.</p>"
        },
        {
          "question": "<p><strong>2.</strong> Mettre \\( f(x) \\) sous forme canonique.</p>",
          "reponse": "<p>\\( f(x) = -2x^2 + 12x - 10 = -2(x^2 - 6x) - 10 = -2[(x - 3)^2 - 9] - 10 = -2(x - 3)^2 + 18 - 10 = -2(x - 3)^2 + 8 \\).</p>"
        },
        {
          "question": "<p><strong>3.</strong> En déduire le bénéfice maximal et la production correspondante.</p>",
          "reponse": "<p>La forme canonique montre que le maximum est atteint pour \\( x = 3 \\) et vaut \\( f(3) = 8 \\).<br>Le bénéfice maximal est de 8 000 FCFA pour une production de 30 vêtements.</p>"
        },
        {
          "question": "<p><strong>4.</strong> Étudier le sens de variation de \\( f \\) sur [0 ; 10].</p>",
          "reponse": "<p>Comme \\( a = -2 < 0 \\), la parabole est tournée vers le bas.<br>\\( f \\) est <strong>croissante</strong> sur [0 ; 3] et <strong>décroissante</strong> sur [3 ; 10].</p>"
        },
        {
          "question": "<p><strong>5.</strong> Déterminer les quantités de vêtements pour lesquelles l'entreprise réalise un bénéfice positif.</p>",
          "reponse": "<p>On résout \\( f(x) > 0 \\). Factorisation : \\( -2x^2 + 12x - 10 = -2(x^2 - 6x + 5) = -2(x - 1)(x - 5) \\).<br>\\( f(x) > 0 \\Leftrightarrow -2(x - 1)(x - 5) > 0 \\Leftrightarrow (x - 1)(x - 5) < 0 \\).<br>Le bénéfice est positif pour \\( x \\in ]1 ; 5[ \\), soit pour une production comprise entre 10 et 50 vêtements.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Transformations du plan - Applications pratiques",
      "points": "4 pts",
      "enonce": "<p style='font-size: 1rem;'>En modélisme, une modéliste doit créer un motif décoratif pour un vêtement. Elle utilise un carré ABCD de centre O et de côté 8 cm.</p>",
      "questions": [
        {
          "question": "<p><strong>1.</strong> Déterminer l'image du carré par une homothétie de centre O et de rapport \\( k = 1.5 \\).</p>",
          "reponse": "<p>L'homothétie de centre O et de rapport 1.5 agrandit le carré. Chaque côté est multiplié par 1.5.<br>Le nouveau côté mesure \\( 8 \\times 1.5 = 12 \\) cm.<br>Le nouveau périmètre est \\( 12 \\times 4 = 48 \\) cm.</p>"
        },
        {
          "question": "<p><strong>2.</strong> Calculer l'aire du carré initial et celle du carré image.</p>",
          "reponse": "<p>Aire initiale : \\( A_1 = 8^2 = 64 \\) cm².<br>Aire image : \\( A_2 = 12^2 = 144 \\) cm².<br>On constate que \\( A_2 = k^2 \\times A_1 = (1.5)^2 \\times 64 = 2.25 \\times 64 = 144 \\) cm².</p>"
        },
        {
          "question": "<p><strong>3.</strong> Si on applique une rotation de 90° dans le sens direct au carré initial, quelle est la nature de la figure obtenue ?</p>",
          "reponse": "<p>Une rotation est une isométrie : elle conserve les longueurs et les angles.<br>La figure obtenue est donc un carré de même côté (8 cm).</p>"
        },
        {
          "question": "<p><strong>4.</strong> Quelle transformation permet de réduire le carré initial d'un facteur 0.5 ?</p>",
          "reponse": "<p>Pour réduire le carré d'un facteur 0.5, on applique une <strong>homothétie</strong> de centre O et de rapport \\( k = 0.5 \\).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Équations de droites et de cercles",
      "points": "6 pts",
      "enonce": "<p style='font-size: 1rem;'>Dans un repère orthonormé \\( (O; \\vec{i}, \\vec{j}) \\), on considère les points :</p><div style='background-color: #f4f4f4; padding: 10px; border-radius: 8px; text-align: center;'>A(-3 ; 1), B(5 ; 5) et C(1 ; -2)</div><p style='font-size: 1rem; margin-top: 10px;'>Le cercle \\( \\mathcal{C} \\) a pour centre A et passe par B.</p>",
      "questions": [
        {
          "question": "<p><strong>1.</strong> Calculer le rayon du cercle \\( \\mathcal{C} \\).</p>",
          "reponse": "<p>Le rayon est la distance AB : \\( R = AB = \\sqrt{(5 - (-3))^2 + (5 - 1)^2} = \\sqrt{8^2 + 4^2} = \\sqrt{64 + 16} = \\sqrt{80} = 4\\sqrt{5} \\) cm.</p>"
        },
        {
          "question": "<p><strong>2.</strong> Déterminer l'équation cartésienne du cercle \\( \\mathcal{C} \\).</p>",
          "reponse": "<p>Le cercle a pour centre A(-3 ; 1) et rayon \\( R = 4\\sqrt{5} \\).<br>L'équation est : \\( (x + 3)^2 + (y - 1)^2 = 80 \\).<br>Forme développée : \\( x^2 + y^2 + 6x - 2y - 70 = 0 \\).</p>"
        },
        {
          "question": "<p><strong>3.</strong> Déterminer l'équation de la droite (AB).</p>",
          "reponse": "<p>Le coefficient directeur est \\( m = \\frac{5 - 1}{5 - (-3)} = \\frac{4}{8} = 0.5 \\).<br>L'équation réduite est \\( y - 1 = 0.5(x + 3) \\Rightarrow y = 0.5x + 2.5 \\).<br>Forme cartésienne : \\( -x + 2y - 5 = 0 \\) ou \\( x - 2y + 5 = 0 \\).</p>"
        },
        {
          "question": "<p><strong>4.</strong> Le point C(1 ; -2) appartient-il au cercle \\( \\mathcal{C} \\) ?</p>",
          "reponse": "<p>On vérifie : \\( (1 + 3)^2 + (-2 - 1)^2 = 4^2 + (-3)^2 = 16 + 9 = 25 \\neq 80 \\).<br>Donc C n'appartient pas au cercle \\( \\mathcal{C} \\).</p>"
        },
        {
          "question": "<p><strong>5.</strong> Déterminer l'équation de la tangente au cercle au point B.</p>",
          "reponse": "<p>Le rayon \\( \\overrightarrow{AB} = (8; 4) \\) est normal à la tangente.<br>La tangente a pour équation : \\( 8(x - 5) + 4(y - 5) = 0 \\), soit \\( 8x + 4y - 60 = 0 \\) ou \\( 2x + y - 15 = 0 \\).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Statistiques et analyse de données",
      "points": "5 pts",
      "enonce": "<p style='font-size: 1rem;'>Un atelier de couture a relevé le nombre de pièces produites par jour sur 25 jours :</p><div style='background-color: #f4f4f4; padding: 10px; border-radius: 8px; text-align: center;'>15, 18, 20, 22, 18, 25, 28, 30, 32, 28, 20, 22, 25, 28, 30, 32, 28, 25, 20, 18, 15, 22, 25, 28, 30</div>",
      "questions": [
        {
          "question": "<p><strong>1.</strong> Construire le tableau statistique des effectifs, effectifs cumulés croissants et fréquences.</p>",
          "reponse": "<p><table style='border-collapse: collapse; width: 100%; font-size: 0.85rem;'><tr style='background-color: #3498db; color: white;'><th>Valeur</th><th>Effectif</th><th>Effectif cumulé croissant</th><th>Fréquence</th></tr><tr><td>15</td><td>2</td><td>2</td><td>0.08</td></tr><tr><td>18</td><td>3</td><td>5</td><td>0.12</td></tr><tr><td>20</td><td>3</td><td>8</td><td>0.12</td></tr><tr><td>22</td><td>3</td><td>11</td><td>0.12</td></tr><tr><td>25</td><td>4</td><td>15</td><td>0.16</td></tr><tr><td>28</td><td>5</td><td>20</td><td>0.20</td></tr><tr><td>30</td><td>3</td><td>23</td><td>0.12</td></tr><tr><td>32</td><td>2</td><td>25</td><td>0.08</td></tr></table></p>"
        },
        {
          "question": "<p><strong>2.</strong> Calculer la moyenne, le mode et la médiane de cette série.</p>",
          "reponse": "<p><strong>Moyenne :</strong> \\( \\bar{x} = \\frac{15\\times2 + 18\\times3 + 20\\times3 + 22\\times3 + 25\\times4 + 28\\times5 + 30\\times3 + 32\\times2}{25} = \\frac{605}{25} = 24.2 \\) pièces.<br><strong>Mode :</strong> 28 (effectif 5).<br><strong>Médiane :</strong> La médiane est la 13e valeur (25 valeurs, impair). La 13e valeur est 25.</p>"
        },
        {
          "question": "<p><strong>3.</strong> Calculer la variance et l'écart-type de cette série.</p>",
          "reponse": "<p><strong>Variance :</strong> \\( V = \\frac{1}{25} \\sum n_i (x_i - 24.2)^2 = \\frac{1}{25} \\times 626 = 25.04 \\).<br><strong>Écart-type :</strong> \\( \\sigma = \\sqrt{25.04} \\approx 5.00 \\) pièces.</p>"
        },
        {
          "question": "<p><strong>4.</strong> Construire un histogramme représentant cette série.</p>",
          "reponse": "<p>L'histogramme est un graphique avec les valeurs en abscisse (15, 18, 20, 22, 25, 28, 30, 32) et les effectifs en ordonnée. Chaque valeur est représentée par un rectangle de hauteur égale à l'effectif.</p>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
