<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
 "matiere": "Mathématiques IH/ESF",
 "classe": "2nde Technique",
 "sequence": "Séquence 4",
 "anneeScolaire": "2025-2026",
 "exercices": [
   {
     "titre": "Exercice 1 : Calculs dans R et manipulations algébriques",
     "points": "4 pts",
     "enonce": "<div style='font-size: 1em; line-height: 1.6;'>Cet exercice porte sur les ensembles de nombres, les puissances, les racines carrées, les factorisations et les fractions rationnelles. Toutes les réponses devront être justifiées par des calculs clairs.</div>",
     "questions": [
       {
         "question": "<div style='margin-bottom: 10px;'><strong>1)</strong> Simplifier les expressions suivantes en les écrivant sous la forme <span style='font-style: italic;'>a</span>√<span style='font-style: italic;'>b</span> avec <span style='font-style: italic;'>a</span> et <span style='font-style: italic;'>b</span> des entiers, <span style='font-style: italic;'>b</span> étant le plus petit possible.</div><div style='margin-left: 20px;'><span style='font-weight: bold;'>a)</span> \\( A = 3\\sqrt{12} + 2\\sqrt{27} - 5\\sqrt{48} \\)</div><div style='margin-left: 20px;'><span style='font-weight: bold;'>b)</span> \\( B = \\sqrt{50} \\times \\sqrt{8} \\)</div><div style='margin-left: 20px;'><span style='font-weight: bold;'>c)</span> \\( C = \\frac{2 - \\sqrt{3}}{2 + \\sqrt{3}} \\) (On rendra le dénominateur rationnel).</div>",
         "reponse": "<div><strong>a)</strong> \\( A = 3 \\times 2\\sqrt{3} + 2 \\times 3\\sqrt{3} - 5 \\times 4\\sqrt{3} = 6\\sqrt{3} + 6\\sqrt{3} - 20\\sqrt{3} = -8\\sqrt{3} \\)</div><div><strong>b)</strong> \\( B = \\sqrt{50 \\times 8} = \\sqrt{400} = 20 \\)</div><div><strong>c)</strong> \\( C = \\frac{(2 - \\sqrt{3})^2}{(2 + \\sqrt{3})(2 - \\sqrt{3})} = \\frac{4 - 4\\sqrt{3} + 3}{4 - 3} = 7 - 4\\sqrt{3} \\)</div>"
       },
       {
         "question": "<div style='margin-bottom: 10px;'><strong>2)</strong> Factoriser les expressions suivantes :</div><div style='margin-left: 20px;'><span style='font-weight: bold;'>a)</span> \\( D = 4x^2 - 12x + 9 \\)</div><div style='margin-left: 20px;'><span style='font-weight: bold;'>b)</span> \\( E = 25x^2 - 16 \\)</div><div style='margin-left: 20px;'><span style='font-weight: bold;'>c)</span> \\( F = (2x+1)^2 - (x-3)^2 \\)</div>",
         "reponse": "<div><strong>a)</strong> \\( D = (2x-3)^2 \\) (Identité remarquable)</div><div><strong>b)</strong> \\( E = (5x - 4)(5x + 4) \\) (Identité remarquable)</div><div><strong>c)</strong> \\( F = [(2x+1)-(x-3)] \\times [(2x+1)+(x-3)] = (x+4)(3x-2) \\)</div>"
       },
       {
         "question": "<div style='margin-bottom: 10px;'><strong>3)</strong> Soit la fraction rationnelle \\( G(x) = \\frac{4x^2 - 9}{2x^2 + 3x} \\). Déterminer son ensemble de définition, puis la simplifier au maximum.</div>",
         "reponse": "<div>Les valeurs interdites sont celles qui annulent le dénominateur : \\( 2x^2+3x = x(2x+3) = 0 \\), soit \\( x=0 \\) et \\( x=-\\frac{3}{2} \\).</div><div>L'ensemble de définition est \\( \\mathbb{R} \\setminus \\{ -\\frac{3}{2} ; 0 \\} \\).</div><div>Simplification : \\( G(x) = \\frac{(2x-3)(2x+3)}{x(2x+3)} = \\frac{2x-3}{x} \\), pour \\( x \\neq -\\frac{3}{2} \\) et \\( x \\neq 0 \\).</div>"
       }
     ]
   },
   {
     "titre": "Exercice 2 : Étude de fonctions numériques",
     "points": "4 pts",
     "enonce": "<div style='font-size: 1em; line-height: 1.6;'>Le but de cet exercice est d'étudier une fonction définie par un programme de calcul, de déterminer ses variations et de la représenter.</div>",
     "questions": [
       {
         "question": "<div style='margin-bottom: 10px;'><strong>1)</strong> On considère le programme de calcul suivant : <span style='display: inline-block; border: 1px solid #ccc; padding: 8px; background: #f9f9f9; border-radius: 5px; margin: 5px 0;'>« Prendre un nombre <span style='font-style: italic;'>x</span>, lui retrancher 1, élever le résultat au carré, puis ajouter 3 ».</span></div><div style='margin-left: 20px;'>a) Traduire ce programme par une expression littérale. On notera <span style='font-style: italic;'>f(x)</span> cette expression.</div><div style='margin-left: 20px;'>b) Déterminer l'image de 2 et de -1 par <span style='font-style: italic;'>f</span>.</div>",
         "reponse": "<div>a) \\( f(x) = (x-1)^2 + 3 \\)</div><div>b) \\( f(2) = (2-1)^2 + 3 = 1 + 3 = 4 \\)</div><div>\\( f(-1) = (-1-1)^2 + 3 = 4 + 3 = 7 \\)</div>"
       },
       {
         "question": "<div style='margin-bottom: 10px;'><strong>2)</strong> Dresser le tableau de variations de la fonction <span style='font-style: italic;'>f</span> définie sur <span style='font-style: italic;'>R</span> par \\( f(x) = (x-1)^2 + 3 \\). Justifier la réponse.</div>",
         "reponse": "<div>La fonction \\( f \\), de la forme \\( a(x-\\alpha)^2 + \\beta \\), a pour sommet le point \\( (\\alpha; \\beta) = (1; 3) \\).</div><div>Comme \\( a=1>0 \\), la fonction est décroissante sur \\( ]-\\infty; 1] \\) et croissante sur \\( [1; +\\infty[ \\).</div><div>Son minimum est \\( f(1)=3 \\), atteint en \\( x=1 \\).</div><div>Tableau de variations :</div><div style='display: flex; justify-content: center;'><table style='border-collapse: collapse; margin: 10px 0;'><tr><td style='padding: 5px 15px; border: 1px solid black;'>x</td><td style='padding: 5px 15px; border: 1px solid black;'>-∞</td><td style='padding: 5px 15px; border: 1px solid black;'></td><td style='padding: 5px 15px; border: 1px solid black;'>1</td><td style='padding: 5px 15px; border: 1px solid black;'></td><td style='padding: 5px 15px; border: 1px solid black;'>+∞</td></tr><tr><td style='padding: 5px 15px; border: 1px solid black;'>f(x)</td><td style='padding: 5px 15px; border: 1px solid black;'>↘</td><td style='padding: 5px 15px; border: 1px solid black;'></td><td style='padding: 5px 15px; border: 1px solid black;'>3</td><td style='padding: 5px 15px; border: 1px solid black;'>↗</td><td style='padding: 5px 15px; border: 1px solid black;'></td></tr></table></div>"
       },
       {
         "question": "<div style='margin-bottom: 10px;'><strong>3)</strong> Compléter le tableau de valeurs ci-dessous, puis tracer la courbe représentative de la fonction <span style='font-style: italic;'>f</span> dans un repère orthonormé d'unité 1 cm (ou 1 carreau).</div><div style='display: flex; justify-content: center;'><table style='border-collapse: collapse; width: 80%; text-align: center;'><tr><td style='padding: 5px; border: 1px solid black;'>x</td><td style='padding: 5px; border: 1px solid black;'>-2</td><td style='padding: 5px; border: 1px solid black;'>-1</td><td style='padding: 5px; border: 1px solid black;'>0</td><td style='padding: 5px; border: 1px solid black;'>1</td><td style='padding: 5px; border: 1px solid black;'>2</td><td style='padding: 5px; border: 1px solid black;'>3</td><td style='padding: 5px; border: 1px solid black;'>4</td></tr><tr><td style='padding: 5px; border: 1px solid black;'>f(x)</td><td style='padding: 5px; border: 1px solid black;'>12</td><td style='padding: 5px; border: 1px solid black;'>7</td><td style='padding: 5px; border: 1px solid black;'>4</td><td style='padding: 5px; border: 1px solid black;'>3</td><td style='padding: 5px; border: 1px solid black;'>4</td><td style='padding: 5px; border: 1px solid black;'>7</td><td style='padding: 5px; border: 1px solid black;'>12</td></tr></table></div><div style='margin-top: 10px;'>(Le tracé de la courbe est attendu sur la copie.)</div>",
         "reponse": "<div>Le tracé est une parabole de sommet (1;3), passant par les points du tableau.</div>"
       }
     ]
   },
   {
     "titre": "Exercice 3 : Géométrie plane (Équations et transformations)",
     "points": "6 pts",
     "enonce": "<div style='font-size: 1em; line-height: 1.6;'>Cet exercice aborde les équations de droites et de cercles, ainsi que les propriétés des transformations du plan (homothétie et théorème de Thalès).</div>",
     "questions": [
       {
         "question": "<div style='margin-bottom: 10px;'>Dans un repère orthonormé <span style='font-style: italic;'>(O, i, j)</span>, on donne les points <span style='font-style: italic;'>A(2; 1)</span>, <span style='font-style: italic;'>B(-1; 3)</span> et <span style='font-style: italic;'>C(4; -2)</span>.</div><div style='margin-left: 20px;'>a) Déterminer l'équation réduite de la droite <span style='font-style: italic;'>(AB)</span>.</div><div style='margin-left: 20px;'>b) Le point <span style='font-style: italic;'>C</span> appartient-il à cette droite ? Justifier.</div>",
         "reponse": "<div>a) Le coefficient directeur est \\( m = \\frac{3 - 1}{-1 - 2} = \\frac{2}{-3} = -\\frac{2}{3} \\).</div><div>L'équation est de la forme \\( y = -\\frac{2}{3}x + p \\). En utilisant A(2;1), on a \\( 1 = -\\frac{4}{3} + p \\), donc \\( p = \\frac{7}{3} \\).</div><div>L'équation réduite de (AB) est donc \\( y = -\\frac{2}{3}x + \\frac{7}{3} \\).</div><div>b) On vérifie pour C(4;-2) : \\( -\\frac{2}{3} \\times 4 + \\frac{7}{3} = -\\frac{8}{3} + \\frac{7}{3} = -\\frac{1}{3} \\neq -2 \\). Donc C n'est pas sur la droite (AB).</div>"
       },
       {
         "question": "<div style='margin-bottom: 10px;'><strong>2)</strong> Déterminer l'équation du cercle <span style='font-style: italic;'>(Γ)</span> de centre <span style='font-style: italic;'>A</span> et de rayon <span style='font-style: italic;'>AB</span>.</div>",
         "reponse": "<div>Le rayon est \\( AB = \\sqrt{(-1 - 2)^2 + (3 - 1)^2} = \\sqrt{9 + 4} = \\sqrt{13} \\).</div><div>L'équation du cercle de centre A(2;1) et de rayon \\( \\sqrt{13} \\) est :</div><div>\\( (x - 2)^2 + (y - 1)^2 = 13 \\)</div>"
       },
       {
         "question": "<div style='margin-bottom: 10px;'><strong>3)</strong> Soit <span style='font-style: italic;'>h</span> l'homothétie de centre <span style='font-style: italic;'>B</span> et de rapport <span style='font-style: italic;'>k = 2</span>.</div><div style='margin-left: 20px;'>a) Calculer les coordonnées de <span style='font-style: italic;'>A'</span>, l'image de <span style='font-style: italic;'>A</span> par <span style='font-style: italic;'>h</span>.</div><div style='margin-left: 20px;'>b) Que peut-on dire des points <span style='font-style: italic;'>B</span>, <span style='font-style: italic;'>A</span> et <span style='font-style: italic;'>A'</span> ? Justifier en utilisant la relation vectorielle de l'homothétie.</div>",

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
