<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Mathématiques IH/ESF",
  "classe": "2nde Technique",
  "sequence": "Séquence 3",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Calculs et ensembles dans R",
      "points": "3 pts",
      "enonce": "<div style='background-color: #f0f4f8; padding: 15px; border-radius: 10px; color: #1e293b; font-size: 1em;'>Cet exercice porte sur la maîtrise des nombres réels, des racines carrées, des puissances et des proportions. Un soin particulier sera apporté à la justification des réponses.<br><br><strong>Les quatre questions sont indépendantes.</strong></div>",
      "questions": [
        {
          "question": "1) <span style='font-weight:500;'>Reconnaître un ensemble :</span> On considère le nombre <span class='math'>\\(x = \\dfrac{\\sqrt{2}}{2}\\)</span>.<br>À quel(s) ensemble(s) parmi <span class='math'>\\(\\mathbb{N}\\)</span>, <span class='math'>\\(\\mathbb{Z}\\)</span>, <span class='math'>\\(\\mathbb{Q}\\)</span> et <span class='math'>\\(\\mathbb{R}\\)</span> appartient <span class='math'>\\(x\\)</span> ? Justifier la réponse.",
          "reponse": "Le nombre <span class='math'>\\(x = \\dfrac{\\sqrt{2}}{2}\\)</span> n'est pas un entier naturel, ni un entier relatif car il n'est pas entier. Il n'est pas non plus un nombre décimal (rationnel) car <span class='math'>\\(\\sqrt{2}\\)</span> est irrationnel. Il s'écrit comme le quotient de deux nombres réels, il est donc un nombre réel. Ainsi, <span class='math'>\\(x \\in \\mathbb{R}\\)</span> et <span class='math'>\\(x \\notin \\mathbb{N} \\cup \\mathbb{Z} \\cup \\mathbb{Q}\\)</span>."
        },
        {
          "question": "2) <span style='font-weight:500;'>Calculs avec les racines carrées :</span> Simplifier l'expression suivante et donner le résultat sous la forme <span class='math'>\\(a\\sqrt{b}\\)</span> avec <span class='math'>\\(a\\)</span> et <span class='math'>\\(b\\)</span> des entiers et <span class='math'>\\(b\\)</span> le plus petit possible. <br><div class='math-block'><div class='math'>$$ A = \\sqrt{75} - 2\\sqrt{12} + \\sqrt{27} $$</div></div>",
          "reponse": "On décompose chaque racine :<br><span class='math'>\\(\\sqrt{75} = \\sqrt{25 \\times 3} = 5\\sqrt{3}\\)</span><br><span class='math'>\\(\\sqrt{12} = \\sqrt{4 \\times 3} = 2\\sqrt{3}\\)</span><br><span class='math'>\\(\\sqrt{27} = \\sqrt{9 \\times 3} = 3\\sqrt{3}\\)</span><br><br>On remplace : <span class='math'>\\(A = 5\\sqrt{3} - 2(2\\sqrt{3}) + 3\\sqrt{3} = 5\\sqrt{3} - 4\\sqrt{3} + 3\\sqrt{3} = (5-4+3)\\sqrt{3} = 4\\sqrt{3}\\)</span>.<br>Le résultat simplifié est <span class='math'>\\(A = 4\\sqrt{3}\\)</span>."
        },
        {
          "question": "3) <span style='font-weight:500;'>Utiliser les proportions :</span> Dans une classe de 2nde technique, le nombre de filles est 12 et le nombre de garçons est 18.<br>Quelle est la proportion de filles dans cette classe ? Exprimer le résultat en pourcentage.",
          "reponse": "L'effectif total de la classe est <span class='math'>\\(12 + 18 = 30\\)</span> élèves. La proportion de filles est le rapport du nombre de filles sur l'effectif total : <span class='math'>\\(\\dfrac{12}{30} = \\dfrac{2}{5} = 0,4\\)</span>. En pourcentage, cela représente <span class='math'>\\(0,4 \\times 100 = 40\\%\\)</span>.<br>La proportion de filles est donc de 40 %."
        },
        {
          "question": "4) <span style='font-weight:500;'>Utiliser la valeur absolue :</span> Résoudre dans <span class='math'>\\(\\mathbb{R}\\)</span> l'équation suivante : <span class='math'>\\(|x - 3| = 5\\)</span>.",
          "reponse": "L'équation <span class='math'>\\(|x - 3| = 5\\)</span> signifie que la distance entre le nombre <span class='math'>\\(x\\)</span> et 3 est égale à 5. Les deux solutions sont : <span class='math'>\\(x - 3 = 5\\)</span> ou <span class='math'>\\(x - 3 = -5\\)</span>.<br>Donc <span class='math'>\\(x = 8\\)</span> ou <span class='math'>\\(x = -2\\)</span>.<br>L'ensemble des solutions est <span class='math'>\\(S = \\{-2 ; 8\\}\\)</span>."
        }
      ]
    },
    {
      "titre": "Exercice 2 : Généralités sur les fonctions",
      "points": "3 pts",
      "enonce": "<div style='background-color: #f0f4f8; padding: 15px; border-radius: 10px; color: #1e293b; font-size: 1em;'>Cet exercice évalue la maîtrise des concepts fondamentaux relatifs aux fonctions numériques : ensemble de définition, calcul d'images et d'antécédents.</div>",
      "questions": [
        {
          "question": "On considère la fonction <span class='math'>\\(f\\)</span> définie par l'expression <span class='math'>\\(f(x) = \\dfrac{2x + 1}{x - 4}\\)</span>.<br>1) <span style='font-weight:500;'>Déterminer l'ensemble de définition <span class='math'>\\(D_f\\)</span> de la fonction <span class='math'>\\(f\\)</span>.</span>",
          "reponse": "La fonction <span class='math'>\\(f\\)</span> est un quotient. Un quotient est défini si et seulement si son dénominateur est non nul. Il faut donc que <span class='math'>\\(x - 4 \\neq 0\\)</span>, soit <span class='math'>\\(x \\neq 4\\)</span>.<br>L'ensemble de définition est donc <span class='math'>\\(D_f = \\mathbb{R} \\setminus \\{4\\}\\)</span>."
        },
        {
          "question": "2) <span style='font-weight:500;'>Déterminer l'image de <span class='math'>\\(-1\\)</span> par la fonction <span class='math'>\\(f\\)</span>.</span>",
          "reponse": "L'image de <span class='math'>\\(-1\\)</span> par <span class='math'>\\(f\\)</span> est <span class='math'>\\(f(-1)\\)</span>. On remplace <span class='math'>\\(x\\)</span> par <span class='math'>\\(-1\\)</span> dans l'expression de <span class='math'>\\(f\\)</span> :<br><span class='math'>\\(f(-1) = \\dfrac{2(-1) + 1}{(-1) - 4} = \\dfrac{-2 + 1}{-5} = \\dfrac{-1}{-5} = \\dfrac{1}{5}\\)</span>.<br>L'image de <span class='math'>\\(-1\\)</span> est <span class='math'>\\(\\dfrac{1}{5}\\)</span>."
        },
        {
          "question": "3) <span style='font-weight:500;'>Calculer l'antécédent de <span class='math'>\\(3\\)</span> par la fonction <span class='math'>\\(f\\)</span>.</span>",
          "reponse": "Un antécédent de 3 est un nombre <span class='math'>\\(x\\)</span> tel que <span class='math'>\\(f(x) = 3\\)</span>. On résout l'équation : <span class='math'>\\(\\dfrac{2x + 1}{x - 4} = 3\\)</span>. On multiplie les deux membres par <span class='math'>\\(x - 4\\)</span> (avec <span class='math'>\\(x \\neq 4\\)</span>) : <span class='math'>\\(2x + 1 = 3(x - 4)\\)</span>. On développe : <span class='math'>\\(2x + 1 = 3x - 12\\)</span>. On résout : <span class='math'>\\(1 + 12 = 3x - 2x\\)</span>, donc <span class='math'>\\(x = 13\\)</span>. La solution est bien différente de 4.<br>L'antécédent de 3 est 13."
        }
      ]
    },
    {
      "titre": "Exercice 3 : Fonctions usuelles et leurs représentations graphiques",
      "points": "5 pts",
      "enonce": "<div style='background-color: #f0f4f8; padding: 15px; border-radius: 10px; color: #1e293b; font-size: 1em;'>On considère la fonction affine par intervalles <span class='math'>\\(g\\)</span> définie sur <span class='math'>\\(\\mathbb{R}\\)</span> par : <br><div class='math-block'><div class='math'>$$ g(x) = \\begin{cases} -2x + 1 & \\text{si } x < 1 \\\\ x - 2 & \\text{si } x \\geq 1 \\end{cases} $$</div></div></div>",
      "questions": [
        {
          "question": "1) <span style='font-weight:500;'>Tracer la courbe représentative de <span class='math'>\\(g\\)</span> dans un repère orthonormé <span class='math'>\\((O; \\vec{i}, \\vec{j})\\)</span> en prenant pour unité graphique 1 cm.</span><br><span style='font-size:0.9em; color:#475569;'>(Le soin et la précision du tracé seront pris en compte dans la notation)</span>",
          "reponse": "Pour <span class='math'>\\(x < 1\\)</span>, <span class='math'>\\(g(x) = -2x + 1\\)</span> est une fonction affine de pente -2 et d'ordonnée à l'origine 1. On trace la droite correspondante sur l'intervalle <span class='math'>\\(]-\\infty; 1[\\)</span>. Par exemple, pour <span class='math'>\\(x = -1\\)</span>, <span class='math'>\\(g(-1) = 3\\)</span> ; pour <span class='math'>\\(x = 0\\)</span>, <span class='math'>\\(g(0) = 1\\)</span>. Le point <span class='math'>\\((1; -1)\\)</span> n'appartient pas à cette partie (strictement inférieur à 1).<br>Pour <span class='math'>\\(x \\geq 1\\)</span>, <span class='math'>\\(g(x) = x - 2\\)</span> est une fonction affine de pente 1 et d'ordonnée à l'origine -2. On trace la droite sur l'intervalle <span class='math'>\\([1; +\\infty[\\)</span>. Par exemple, pour <span class='math'>\\(x = 1\\)</span>, <span class='math'>\\(g(1) = -1\\)</span> ; pour <span class='math'>\\(x = 2\\)</span>, <span class='math'>\\(g(2) = 0\\)</span>. Le point <span class='math'>\\((1; -1)\\)</span> est bien présent sur cette partie (inclus).<br><div><img alt='Courbe représentative de la fonction g' src='https://i.imgur.com/yR2U7N3.png' style='max-width: 100%; height: auto; border-radius: 8px; margin-top: 10px;'></div>"
        },
        {
          "question": "2) <span style='font-weight:500;'>Déterminer graphiquement puis par le calcul les solutions de l'équation <span class='math'>\\(g(x) = 0\\)</span>.</span>",
          "reponse": "Résolution par le calcul :<br>Il faut résoudre l'équation dans chaque intervalle. <br><strong>Cas 1 :</strong> <span class='math'>\\(x < 1\\)</span>. L'équation est <span class='math'>\\(-2x + 1 = 0\\)</span>, soit <span class='math'>\\(-2x = -1\\)</span>, donc <span class='math'>\\(x = \\dfrac{1}{2}\\)</span>. Cette valeur est bien dans l'intervalle <span class='math'>\\(]-\\infty; 1[\\)</span>, c'est une solution.<br><strong>Cas 2 :</strong> <span class='math'>\\(x \\geq 1\\)</span>. L'équation est <span class='math'>\\(x - 2 = 0\\)</span>, soit <span class='math'>\\(x = 2\\)</span>. Cette valeur est bien dans l'intervalle <span class='math'>\\([1; +\\infty[\\)</span>, c'est une solution.<br>L'ensemble des solutions est <span class='math'>\\(S = \\{\\dfrac{1}{2}; 2\\}\\)</span>.<br>Graphiquement, ce sont les abscisses des points d'intersection de la courbe de <span class='math'>\\(g\\)</span> avec l'axe des abscisses."
        }
      ]
    },
    {
      "titre": "Exercice 4 : Problème ouvert - Application des fonctions",
      "points": "4 pts",
      "enonce": "<div style='background-color: #f0f4f8; padding: 15px; border-radius: 10px; color: #1e293b; font-size: 1em;'>Un artisan fabrique des objets en bois. Pour une production de <span class='math'>\\(x\\)</span> objets (<span class='math'>\\(x\\)</span> est un nombre entier positif), le coût total de fabrication, en milliers de francs CFA, est modélisé par la fonction <span class='math'>\\(C\\)</span> définie sur <span class='math'>\\([0; +\\infty[\\)</span> par : <div class='math-block'><div class='math'>$$ C(x) = x^2 + 2x + 5 $$</div></div></div>",
      "questions": [
        {

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
