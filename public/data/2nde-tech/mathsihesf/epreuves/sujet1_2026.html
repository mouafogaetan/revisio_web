<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Maths IH/ESF",
  "classe": "2nde technique",
  "sequence": "Séquence 1",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Calculs dans R et ensembles de nombres",
      "points": "3 pts",
      "enonce": "<div style='background-color: #f0f8ff; padding: 15px; border-radius: 8px; color: #0d47a1;'><p>On considère les nombres suivants :</p><ul style='list-style-type: none; padding-left: 0;'><li><span class='math'>\\( A = \\sqrt{16} \\)</span></li><li><span class='math'>\\( B = \\frac{3}{4} \\)</span></li><li><span class='math'>\\( C = -5 \\)</span></li><li><span class='math'>\\( D = \\sqrt{2} \\)</span></li><li><span class='math'>\\( E = 0 \\)</span></li></ul></div>",
      "questions": [
        {
          "question": "<p>1) Classer ces nombres dans les ensembles <span class='math'>\\( \\mathbb{N} \\)</span>, <span class='math'>\\( \\mathbb{Z} \\)</span>, <span class='math'>\\( \\mathbb{Q} \\)</span> et <span class='math'>\\( \\mathbb{R} \\)</span>.</p>",
          "reponse": "<p><span class='math'>\\( A = \\sqrt{16} = 4 \\)</span> : <span class='math'>\\( \\mathbb{N} \\subset \\mathbb{Z} \\subset \\mathbb{Q} \\subset \\mathbb{R} \\)</span><br><span class='math'>\\( B = \\frac{3}{4} \\)</span> : <span class='math'>\\( \\mathbb{Q} \\subset \\mathbb{R} \\)</span><br><span class='math'>\\( C = -5 \\)</span> : <span class='math'>\\( \\mathbb{Z} \\subset \\mathbb{Q} \\subset \\mathbb{R} \\)</span><br><span class='math'>\\( D = \\sqrt{2} \\)</span> : <span class='math'>\\( \\mathbb{R} \\)</span> (irrationnel)<br><span class='math'>\\( E = 0 \\)</span> : <span class='math'>\\( \\mathbb{N} \\subset \\mathbb{Z} \\subset \\mathbb{Q} \\subset \\mathbb{R} \\)</span></p>"
        },
        {
          "question": "<p>2) Calculer <span class='math'>\\( |A - C| \\)</span> et <span class='math'>\\( |E - B| \\)</span>.</p>",
          "reponse": "<p><span class='math'>\\( |A - C| = |4 - (-5)| = |4 + 5| = 9 \\)</span><br><span class='math'>\\( |E - B| = |0 - \\frac{3}{4}| = \\frac{3}{4} \\)</span></p>"
        },
        {
          "question": "<p>3) Simplifier <span class='math'>\\( \\sqrt{A^2 + D^2} \\)</span>.</p>",
          "reponse": "<p><span class='math'>\\( \\sqrt{4^2 + (\\sqrt{2})^2} = \\sqrt{16 + 2} = \\sqrt{18} = 3\\sqrt{2} \\)</span></p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Développement, factorisation et fractions",
      "points": "4 pts",
      "enonce": "<div style='background-color: #f5f5dc; padding: 15px; border-radius: 8px; color: #4e342e;'><p>On donne les expressions suivantes :</p><ul style='list-style-type: none; padding-left: 0;'><li><span class='math'>\\( P(x) = (3x - 2)^2 - (x + 1)^2 \\)</span></li><li><span class='math'>\\( Q(x) = \\frac{x^2 - 4}{x - 2} \\)</span></li></ul></div>",
      "questions": [
        {
          "question": "<p>1) Développer et réduire <span class='math'>\\( P(x) \\)</span>.</p>",
          "reponse": "<p><span class='math'>\\( P(x) = (9x^2 - 12x + 4) - (x^2 + 2x + 1) = 8x^2 - 14x + 3 \\)</span></p>"
        },
        {
          "question": "<p>2) Factoriser <span class='math'>\\( P(x) \\)</span> en utilisant l'identité <span class='math'>\\( a^2 - b^2 \\)</span>.</p>",
          "reponse": "<p><span class='math'>\\( P(x) = (3x - 2 - (x + 1))(3x - 2 + (x + 1)) = (2x - 3)(4x - 1) \\)</span></p>"
        },
        {
          "question": "<p>3) Simplifier <span class='math'>\\( Q(x) \\)</span> et préciser son ensemble de définition.</p>",
          "reponse": "<p><span class='math'>\\( Q(x) = \\frac{(x-2)(x+2)}{x-2} = x + 2 \\)</span> pour <span class='math'>\\( x \\neq 2 \\)</span>.<br><span class='math'>\\( D_Q = \\mathbb{R} \\setminus \\{2\\} \\)</span></p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Fonctions et lectures graphiques",
      "points": "4 pts",
      "enonce": "<div style='background-color: #f0fff0; padding: 15px; border-radius: 8px; color: #1b5e20;'><p>On considère la fonction <span class='math'>\\( f \\)</span> dont la courbe est donnée ci-dessous.</p><p><img alt='Graphique d'une fonction passant par les points (-3, -1), (-1, 3), (0, 5), (2, 3), (4, -1). La courbe a la forme d'une parabole inversée avec un maximum en (0, 5).' src='' style='max-width: 100%; height: auto; border: 1px solid #ccc;'></p></div>",
      "questions": [
        {
          "question": "<p>1) Déterminer graphiquement l'image de <span class='math'>\\( -1 \\)</span> par <span class='math'>\\( f \\)</span>.</p>",
          "reponse": "<p><span class='math'>\\( f(-1) = 3 \\)</span></p>"
        },
        {
          "question": "<p>2) Déterminer les antécédents de <span class='math'>\\( 3 \\)</span> par <span class='math'>\\( f \\)</span>.</p>",
          "reponse": "<p>Les antécédents de 3 sont <span class='math'>\\( -1 \\)</span> et <span class='math'>\\( 2 \\)</span>.</p>"
        },
        {
          "question": "<p>3) Donner le tableau de variation de <span class='math'>\\( f \\)</span>.</p>",
          "reponse": "<p>La fonction est croissante sur <span class='math'>\\( [-3, 0] \\)</span> et décroissante sur <span class='math'>\\( [0, 4] \\)</span>.</p>"
        },
        {
          "question": "<p>4) Déterminer le maximum de <span class='math'>\\( f \\)</span> sur <span class='math'>\\( [-3, 4] \\)</span>.</p>",
          "reponse": "<p>Le maximum est 5, atteint en <span class='math'>\\( x = 0 \\)</span>.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Équation de droite",
      "points": "3 pts",
      "enonce": "<div style='background-color: #fff5f5; padding: 15px; border-radius: 8px; color: #880e4f;'><p>Dans un repère orthonormé, on donne les points A(1, 2) et B(3, 4).</p></div>",
      "questions": [
        {
          "question": "<p>1) Calculer le coefficient directeur de la droite (AB).</p>",
          "reponse": "<p><span class='math'>\\( m = \\frac{4-2}{3-1} = \\frac{2}{2} = 1 \\)</span></p>"
        },
        {
          "question": "<p>2) Déterminer l'équation réduite de la droite (AB).</p>",
          "reponse": "<p><span class='math'>\\( y = x + b \\)</span><br>En A : <span class='math'>\\( 2 = 1 + b \\)</span> donc <span class='math'>\\( b = 1 \\)</span><br>L'équation est <span class='math'>\\( y = x + 1 \\)</span>.</p>"
        },
        {
          "question": "<p>3) Le point C(5, 6) appartient-il à cette droite ? Justifier.</p>",
          "reponse": "<p><span class='math'>\\( 6 = 5 + 1 \\)</span> est vrai.<br>Donc C appartient à la droite (AB).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 5 : Statistiques",
      "points": "4 pts",
      "enonce": "<div style='background-color: #fef9e7; padding: 15px; border-radius: 8px; color: #7d6608;'><p>On a relevé les notes des élèves d'une classe de 2nde technique à un contrôle de maths :</p><table style='width:100%; border-collapse: collapse; margin:10px 0;'><tr style='background-color: #f1c40f;'><th style='padding:8px; border:1px solid #ddd;'>Notes</th><th style='padding:8px; border:1px solid #ddd;'>[0, 4[</th><th style='padding:8px; border:1px solid #ddd;'>[4, 8[</th><th style='padding:8px; border:1px solid #ddd;'>[8, 12[</th><th style='padding:8px; border:1px solid #ddd;'>[12, 16[</th><th style='padding:8px; border:1px solid #ddd;'>[16, 20]</th></tr><tr><td style='padding:8px; border:1px solid #ddd;'>Effectifs</td><td style='padding:8px; border:1px solid #ddd;'>2</td><td style='padding:8px; border:1px solid #ddd;'>5</td><td style='padding:8px; border:1px solid #ddd;'>8</td><td style='padding:8px; border:1px solid #ddd;'>4</td><td style='padding:8px; border:1px solid #ddd;'>1</td></tr></table></div>",
      "questions": [
        {
          "question": "<p>1) Quelle est la population étudiée ? Le caractère est-il quantitatif ou qualitatif ?</p>",
          "reponse": "<p>Population : les élèves d'une classe de 2nde technique.<br>Le caractère (les notes) est quantitatif.</p>"
        },
        {
          "question": "<p>2) Calculer l'effectif total.</p>",
          "reponse": "<p><span class='math'>\\( N = 2 + 5 + 8 + 4 + 1 = 20 \\)</span></p>"
        },
        {
          "question": "<p>3) Calculer la moyenne de cette série.</p>",
          "reponse": "<p>Centres des classes : 2, 6, 10, 14, 18.<br><span class='math'>\\( \\bar{x} = \\frac{2\\times2 + 5\\times6 + 8\\times10 + 4\\times14 + 1\\times18}{20} \\)</span><br><span class='math'>\\( \\bar{x} = \\frac{4 + 30 + 80 + 56 + 18}{20} = \\frac{188}{20} = 9.4 \\)</span></p>"
        },
        {
          "question": "<p>4) Déterminer la classe médiane.</p>",
          "reponse": "<p>L'effectif total est 20. La médiane est la moyenne entre la 10<sup>ème</sup> et la 11<sup>ème</sup> valeur.<br>Les effectifs cumulés sont : 2, 7, 15, 19, 20.<br>La 10<sup>ème</sup> et la 11<sup>ème</sup> valeur se trouvent dans la classe [8, 12[.<br>Donc la classe médiane est [8, 12[.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 6 : Application concrète",
      "points": "2 pts",
      "enonce": "<div style='background-color: #e8f5e9; padding: 15px; border-radius: 8px; color: #1b5e20;'><p>Une entreprise vend des produits. Le prix de vente d'un article est de 5000 FCFA. Pour une commande de plus de 10 articles, une réduction de 5% est appliquée sur le prix total.</p></div>",
      "questions": [
        {
          "question": "<p>1) Exprimer le prix à payer <span class='math'>\\( P(x) \\)</span> en fonction du nombre <span class='math'>\\( x \\)</span> d'articles achetés.</p>",
          "reponse": "<p>Si <span class='math'>\\( x \\le 10 \\)</span> : <span class='math'>\\( P(x) = 5000x \\)</span><br>Si <span class='math'>\\( x > 10 \\)</span> : <span class='math'>\\( P(x) = 5000x \\times 0.95 = 4750x \\)</span></p>"
        },
        {
          "question": "<p>2) Calculer le prix à payer pour une commande de 15 articles.</p>",
          "reponse": "<p>Pour <span class='math'>\\( x = 15 \\)</span>, on utilise la deuxième formule :<br><span class='math'>\\( P(15) = 4750 \\times 15 = 71250 \\)</span> FCFA.</p>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
