<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Maths IH/ESF",
  "classe": "2nde technique",
  "sequence": "Séquence 6",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Équations de droites et de cercles",
      "points": "4 pts",
      "enonce": "<div style='background-color: #f0f8ff; padding: 15px; border-radius: 8px; color: #0d47a1;'><p>Dans un repère orthonormé, on donne les points A(2, 1), B(4, 3) et le cercle C d'équation :</p><div class='math-block'><div class='math'>$$ x^2 + y^2 - 4x - 6y + 9 = 0 $$</div></div></div>",
      "questions": [
        {
          "question": "<p>1) Déterminer l'équation réduite de la droite (AB).</p>",
          "reponse": "<p>Le coefficient directeur est <span class='math'>\\( m = \\frac{3-1}{4-2} = \\frac{2}{2} = 1 \\)</span>.<br>L'équation est de la forme <span class='math'>\\( y = x + b \\)</span>.<br>En A : <span class='math'>\\( 1 = 2 + b \\)</span> donc <span class='math'>\\( b = -1 \\)</span>.<br>Donc <span class='math'>\\( y = x - 1 \\)</span>.</p>"
        },
        {
          "question": "<p>2) Déterminer le centre et le rayon du cercle C.</p>",
          "reponse": "<p>On met l'équation sous forme canonique :<br><span class='math'>\\( (x^2 - 4x) + (y^2 - 6y) + 9 = 0 \\)</span><br><span class='math'>\\( (x-2)^2 - 4 + (y-3)^2 - 9 + 9 = 0 \\)</span><br><span class='math'>\\( (x-2)^2 + (y-3)^2 = 4 \\)</span><br>Le centre est <span class='math'>\\( \\Omega(2, 3) \\)</span> et le rayon est <span class='math'>\\( R = 2 \\)</span>.</p>"
        },
        {
          "question": "<p>3) Le point A appartient-il au cercle C ? Justifier.</p>",
          "reponse": "<p><span class='math'>\\( (2-2)^2 + (1-3)^2 = 0 + 4 = 4 \\)</span>.<br>Donc A appartient au cercle C.</p>"
        },
        {
          "question": "<p>4) Déterminer l'équation de la tangente au cercle C au point A.</p>",
          "reponse": "<p>Le rayon <span class='math'>\\( \\overrightarrow{\\Omega A} = (0, -2) \\)</span> est normal à la tangente.<br>L'équation de la tangente est : <span class='math'>\\( 0(x-2) - 2(y-1) = 0 \\)</span>.<br><span class='math'>\\( -2y + 2 = 0 \\)</span> donc <span class='math'>\\( y = 1 \\)</span>.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Polygones réguliers et angles",
      "points": "4 pts",
      "enonce": "<div style='background-color: #f5f5dc; padding: 15px; border-radius: 8px; color: #4e342e;'><p>On considère un octogone régulier ABCDEFGH inscrit dans un cercle de centre O.</p></div>",
      "questions": [
        {
          "question": "<p>1) Déterminer la mesure de l'angle au centre <span class='math'>\\( \\widehat{AOB} \\)</span>.</p>",
          "reponse": "<p>Un octogone a 8 côtés.<br><span class='math'>\\( \\widehat{AOB} = \\frac{360°}{8} = 45° \\)</span>.</p>"
        },
        {
          "question": "<p>2) Déterminer la mesure de l'angle intérieur de l'octogone.</p>",
          "reponse": "<p><span class='math'>\\( \\text{Angle intérieur} = \\frac{(8-2) \\times 180°}{8} = \\frac{1080°}{8} = 135° \\)</span>.</p>"
        },
        {
          "question": "<p>3) Calculer la mesure de l'angle inscrit <span class='math'>\\( \\widehat{ACB} \\)</span> qui intercepte l'arc AB.</p>",
          "reponse": "<p>L'angle inscrit <span class='math'>\\( \\widehat{ACB} \\)</span> intercepte l'arc AB.<br>Donc <span class='math'>\\( \\widehat{ACB} = \\frac{1}{2} \\times \\widehat{AOB} = \\frac{45°}{2} = 22.5° \\)</span>.</p>"
        },
        {
          "question": "<p>4) Construire un hexagone régulier à partir d'un cercle de rayon 3 cm.</p>",
          "reponse": "<p>Pour construire un hexagone régulier :<br>1) Tracer un cercle de centre O et de rayon 3 cm.<br>2) Placer un point A sur le cercle.<br>3) Reporter l'angle de 60° (360°/6) cinq fois pour obtenir les points B, C, D, E, F.<br>4) Relier les points A, B, C, D, E, F.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Transformations du plan",
      "points": "4 pts",
      "enonce": "<div style='background-color: #f0fff0; padding: 15px; border-radius: 8px; color: #1b5e20;'><p>Dans un repère orthonormé, on considère les points A(2, 1), B(5, 3) et C(3, 4).</p></div>",
      "questions": [
        {
          "question": "<p>1) Déterminer l'image du point A par la translation de vecteur <span class='math'>\\( \\vec{u} = (3, -1) \\)</span>.</p>",
          "reponse": "<p><span class='math'>\\( A' = A + \\vec{u} = (2+3, 1+(-1)) = (5, 0) \\)</span>.</p>"
        },
        {
          "question": "<p>2) Déterminer l'image du point B par la symétrie centrale de centre O(0, 0).</p>",
          "reponse": "<p>La symétrie centrale de centre O transforme <span class='math'>\\( (x, y) \\)</span> en <span class='math'>\\( (-x, -y) \\)</span>.<br>Donc <span class='math'>\\( B'(-5, -3) \\)</span>.</p>"
        },
        {
          "question": "<p>3) Déterminer l'image du point C par l'homothétie de centre O et de rapport <span class='math'>\\( k = 2 \\)</span>.</p>",
          "reponse": "<p>L'homothétie de rapport 2 transforme <span class='math'>\\( (x, y) \\)</span> en <span class='math'>\\( (2x, 2y) \\)</span>.<br>Donc <span class='math'>\\( C'(6, 8) \\)</span>.</p>"
        },
        {
          "question": "<p>4) Quelle est la nature de la transformation qui envoie C sur C''(-3, -4) ?</p>",
          "reponse": "<p>C(3, 4) a pour image C''(-3, -4).<br>Les coordonnées sont opposées.<br>Il s'agit d'une symétrie centrale de centre O(0, 0) ou d'une rotation de 180°.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Théorèmes de Thalès et Pythagore",
      "points": "3 pts",
      "enonce": "<div style='background-color: #fff5f5; padding: 15px; border-radius: 8px; color: #880e4f;'><p>On considère un triangle ABC rectangle en A avec AB = 6 cm et AC = 8 cm. Soit M un point sur [AB] tel que AM = 4 cm. La droite passant par M et parallèle à (BC) coupe (AC) en N.</p></div>",
      "questions": [
        {
          "question": "<p>1) Calculer BC.</p>",
          "reponse": "<p>D'après le théorème de Pythagore :<br><span class='math'>\\( BC^2 = AB^2 + AC^2 = 6^2 + 8^2 = 36 + 64 = 100 \\)</span><br><span class='math'>\\( BC = 10 \\)</span> cm.</p>"
        },
        {
          "question": "<p>2) Calculer AN.</p>",
          "reponse": "<p>D'après le théorème de Thalès :<br><span class='math'>\\( \\frac{AM}{AB} = \\frac{AN}{AC} \\)</span><br><span class='math'>\\( \\frac{4}{6} = \\frac{AN}{8} \\)</span><br><span class='math'>\\( AN = \\frac{4 \\times 8}{6} = \\frac{32}{6} = \\frac{16}{3} \\)</span> cm.</p>"
        },
        {
          "question": "<p>3) Calculer MN.</p>",
          "reponse": "<p>D'après le théorème de Thalès :<br><span class='math'>\\( \\frac{MN}{BC} = \\frac{AM}{AB} = \\frac{4}{6} = \\frac{2}{3} \\)</span><br><span class='math'>\\( MN = \\frac{2}{3} \\times 10 = \\frac{20}{3} \\)</span> cm.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 5 : Trigonométrie dans un triangle",
      "points": "3 pts",
      "enonce": "<div style='background-color: #fef9e7; padding: 15px; border-radius: 8px; color: #7d6608;'><p>Dans un triangle ABC, on a AB = 5 cm, AC = 6 cm et l'angle <span class='math'>\\( \\widehat{BAC} = 60° \\)</span>.</p></div>",
      "questions": [
        {
          "question": "<p>1) Calculer la longueur BC en utilisant la loi des cosinus.</p>",
          "reponse": "<p><span class='math'>\\( BC^2 = AB^2 + AC^2 - 2 \\times AB \\times AC \\times \\cos A \\)</span><br><span class='math'>\\( BC^2 = 5^2 + 6^2 - 2 \\times 5 \\times 6 \\times \\cos 60° \\)</span><br><span class='math'>\\( BC^2 = 25 + 36 - 60 \\times \\frac{1}{2} = 61 - 30 = 31 \\)</span><br><span class='math'>\\( BC = \\sqrt{31} \\)</span> cm.</p>"
        },
        {
          "question": "<p>2) Calculer l'aire du triangle ABC.</p>",
          "reponse": "<p><span class='math'>\\( \\text{Aire} = \\frac{1}{2} \\times AB \\times AC \\times \\sin A \\)</span><br><span class='math'>\\( \\text{Aire} = \\frac{1}{2} \\times 5 \\times 6 \\times \\sin 60° \\)</span><br><span class='math'>\\( \\text{Aire} = 15 \\times \\frac{\\sqrt{3}}{2} = \\frac{15\\sqrt{3}}{2} \\)</span> cm².</p>"
        },
        {
          "question": "<p>3) Déterminer l'angle <span class='math'>\\( \\widehat{ABC} \\)</span>.</p>",
          "reponse": "<p>D'après la loi des sinus :<br><span class='math'>\\( \\frac{AC}{\\sin B} = \\frac{BC}{\\sin A} \\)</span><br><span class='math'>\\( \\frac{6}{\\sin B} = \\frac{\\sqrt{31}}{\\sin 60°} \\)</span><br><span class='math'>\\( \\sin B = \\frac{6 \\times \\sin 60°}{\\sqrt{31}} = \\frac{6 \\times \\frac{\\sqrt{3}}{2}}{\\sqrt{31}} = \\frac{3\\sqrt{3}}{\\sqrt{31}} \\)</span><br><span class='math'>\\( \\sin B \\approx \\frac{5.196}{5.568} \\approx 0.933 \\)</span><br><span class='math'>\\( \\widehat{ABC} \\approx 68.9° \\)</span>.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 6 : Statistiques",
      "points": "2 pts",
      "enonce": "<div style='background-color: #e8f5e9; padding: 15px; border-radius: 8px; color: #1b5e20;'><p>On a relevé les tailles (en cm) des élèves d'une classe : 155, 160, 162, 165, 168, 170, 172, 175, 178, 180.</p></div>",
      "questions": [
        {
          "question": "<p>1) Calculer la taille moyenne.</p>",
          "reponse": "<p><span class='math'>\\( \\bar{x} = \\frac{155+160+162+165+168+170+172+175+178+180}{10} \\)</span><br><span class='math'>\\( \\bar{x} = \\frac{1685}{10} = 168.5 \\)</span> cm.</p>"
        },
        {
          "question": "<p>2) Déterminer la médiane.</p>",
          "reponse": "<p>La série est ordonnée. L'effectif est 10 (pair).<br>La médiane est la moyenne des 5<sup>ème</sup> et 6<sup>ème</sup> valeurs :<br><span class='math'>\\( \\frac{168 + 170}{2} = 169 \\)</span> cm.</p>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
