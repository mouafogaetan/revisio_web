<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Mathématiques CG",
  "classe": "2nde Technique",
  "sequence": "Séquence 3",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Calcul dans ℝ - Les nombres et leurs propriétés",
      "points": "4 pts",
      "enonce": "<div style='padding: 10px;'><p>On considère les nombres suivants :</p><div class='math-block' style='background: #eaf2f8; padding: 15px; border-radius: 8px; margin: 10px 0; text-align: center;'><div class='math'>$$A = \\sqrt{25} \\quad B = -\\frac{4}{3} \\quad C = \\pi \\quad D = 0,1212... \\quad E = \\sqrt{2}$$</div></div><p>Répondre aux questions suivantes en justifiant clairement.</p></div>",
      "questions": [
        {
          "question": "1) Classer ces nombres dans les ensembles ℕ, ℤ, ℚ et ℝ. (Cite l'ensemble le plus petit possible pour chaque nombre).",
          "reponse": "<p><strong>A = √25 = 5</strong> → <span style='color: #c0392b;'>A ∈ ℕ</span> (et donc aussi ∈ ℤ ⊂ ℚ ⊂ ℝ)</p><p><strong>B = -4/3</strong> → <span style='color: #c0392b;'>B ∈ ℚ</span> (c'est une fraction d'entiers, mais pas un entier)</p><p><strong>C = π</strong> → <span style='color: #c0392b;'>C ∈ ℝ</span> (π est un nombre irrationnel, donc réel mais pas rationnel)</p><p><strong>D = 0,1212...</strong> → <span style='color: #c0392b;'>D ∈ ℚ</span> (car c'est un nombre décimal périodique, donc rationnel)</p><p><strong>E = √2</strong> → <span style='color: #c0392b;'>E ∈ ℝ</span> (√2 est irrationnel, donc réel mais pas rationnel)</p>"
        },
        {
          "question": "2) Calculer la valeur absolue de chacun de ces nombres.",
          "reponse": "<p><span style='color: #c0392b;'>|A| = |5| = 5</span></p><p><span style='color: #c0392b;'>|B| = |-4/3| = 4/3</span></p><p><span style='color: #c0392b;'>|C| = |π| = π</span> (car π > 0)</p><p><span style='color: #c0392b;'>|D| = |0,1212...| = 0,1212...</span></p><p><span style='color: #c0392b;'>|E| = |√2| = √2</span></p>"
        },
        {
          "question": "3) Calculer la distance entre A et B sur la droite numérique.",
          "reponse": "<p>La distance entre deux nombres a et b est <span style='color: #c0392b;'>|a - b|</span>.</p><p>On a <span style='color: #c0392b;'>A = 5</span> et <span style='color: #c0392b;'>B = -4/3</span>.</p><p><span style='color: #c0392b;'>|A - B| = |5 - (-4/3)| = |5 + 4/3| = |15/3 + 4/3| = |19/3| = 19/3</span>.</p><p>La distance entre 5 et -4/3 est de <strong>19/3 ≈ 6,33</strong> unités.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Fonctions numériques - Étude et calculs",
      "points": "5 pts",
      "enonce": "<div style='padding: 10px;'><p>On considère la fonction f définie sur ℝ par :</p><div class='math-block' style='background: #eaf2f8; padding: 15px; border-radius: 8px; margin: 10px 0; text-align: center;'><div class='math'>$$f(x) = (x - 2)^2 - 9$$</div></div></div>",
      "questions": [
        {
          "question": "1) Développer, réduire et ordonner l'expression de f(x).",
          "reponse": "<p><span style='color: #c0392b;'>f(x) = (x - 2)² - 9</span></p><p>On développe : <span style='color: #c0392b;'>(x - 2)² = x² - 4x + 4</span></p><p>Donc : <span style='color: #c0392b;'>f(x) = x² - 4x + 4 - 9 = x² - 4x - 5</span></p><p>La forme développée et ordonnée est : <span style='color: #c0392b;'>f(x) = x² - 4x - 5</span></p>"
        },
        {
          "question": "2) Factoriser l'expression de f(x) en utilisant une identité remarquable.",
          "reponse": "<p><span style='color: #c0392b;'>f(x) = (x - 2)² - 9 = (x - 2)² - 3²</span></p><p>On utilise l'identité <span style='color: #c0392b;'>a² - b² = (a - b)(a + b)</span>.</p><p><span style='color: #c0392b;'>f(x) = (x - 2 - 3)(x - 2 + 3) = (x - 5)(x + 1)</span></p><p>La forme factorisée est : <span style='color: #c0392b;'>f(x) = (x - 5)(x + 1)</span></p>"
        },
        {
          "question": "3) Déterminer le(s) antécédent(s) de 0 par la fonction f.",
          "reponse": "<p>Résoudre <span style='color: #c0392b;'>f(x) = 0</span> revient à résoudre <span style='color: #c0392b;'>(x - 5)(x + 1) = 0</span>.</p><p>Un produit de facteurs est nul si et seulement si l'un des facteurs est nul.</p><p><span style='color: #c0392b;'>x - 5 = 0</span> → <span style='color: #c0392b;'>x = 5</span></p><p><span style='color: #c0392b;'>x + 1 = 0</span> → <span style='color: #c0392b;'>x = -1</span></p><p>Les antécédents de 0 sont <strong>-1 et 5</strong>.</p>"
        },
        {
          "question": "4) Dresser le tableau de signes de f(x) sur ℝ.",
          "reponse": "<p>On a <span style='color: #c0392b;'>f(x) = (x - 5)(x + 1)</span>.</p><p>Les racines sont <span style='color: #c0392b;'>x = -1</span> et <span style='color: #c0392b;'>x = 5</span>.</p><p>Le coefficient de x² est 1 > 0, donc f(x) est positive à l'extérieur des racines et négative entre les racines.</p><div style='background: #f8f9fa; padding: 10px; border-radius: 5px; font-family: monospace;'>x:        -∞      -1      5      +∞<br>f(x):     +   0    -   0    +</div><p>Tableau de signes :</p><ul style='text-align: left;'><li><span style='color: #c0392b;'>f(x) > 0</span> sur <span style='color: #c0392b;'>]-∞; -1[ ∪ ]5; +∞[</span></li><li><span style='color: #c0392b;'>f(x) = 0</span> en <span style='color: #c0392b;'>x = -1</span> et <span style='color: #c0392b;'>x = 5</span></li><li><span style='color: #c0392b;'>f(x) < 0</span> sur <span style='color: #c0392b;'>]-1; 5[</span></li></ul>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Suites numériques - Gestion d'un stock",
      "points": "5 pts",
      "enonce": "<div style='padding: 10px;'><p>Une entreprise de comptabilité souhaite suivre l'évolution de son stock de fournitures. Le premier mois, le stock est de 200 unités. Chaque mois, le stock augmente de 15 unités.</p></div>",
      "questions": [
        {
          "question": "1) Reconnaître et justifier la nature de la suite représentant le stock mensuel.",
          "reponse": "<p>Le stock augmente chaque mois de 15 unités, donc la différence entre deux termes consécutifs est constante.</p><p>La suite est <strong>arithmétique</strong> de premier terme <span style='color: #c0392b;'>u₁ = 200</span> et de raison <span style='color: #c0392b;'>r = 15</span>.</p>"
        },
        {
          "question": "2) Déterminer l'expression du terme général <span style='color: #c0392b;'>u_n</span> de cette suite (en fonction de n).",
          "reponse": "<p>Pour une suite arithmétique : <span style='color: #c0392b;'>u_n = u₁ + (n-1) × r</span></p><p><span style='color: #c0392b;'>u_n = 200 + (n-1) × 15 = 200 + 15n - 15</span></p><p>Donc <span style='color: #c0392b;'>u_n = 185 + 15n</span></p>"
        },
        {
          "question": "3) Calculer le stock au 6ème mois.",
          "reponse": "<p>On a <span style='color: #c0392b;'>u_n = 185 + 15n</span>.</p><p>Pour le 6ème mois, <span style='color: #c0392b;'>n = 6</span>.</p><p><span style='color: #c0392b;'>u₆ = 185 + 15 × 6 = 185 + 90 = 275</span></p><p>Le stock au 6ème mois sera de <strong>275 unités</strong>.</p>"
        },
        {
          "question": "4) Calculer le stock total cumulé sur les 6 premiers mois.",
          "reponse": "<p>La somme des n premiers termes d'une suite arithmétique est :</p><div class='math-block' style='text-align: center; background: white; padding: 10px; border-radius: 5px;'><div class='math'>$$S_n = \\dfrac{n(u_1 + u_n)}{2}$$</div></div><p><span style='color: #c0392b;'>S₆ = 6 × (200 + 275) / 2 = 3 × 475 = 1425</span></p><p>Le stock total cumulé sur les 6 premiers mois est de <strong>1425 unités</strong>.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Géométrie analytique - Équation de droites",
      "points": "6 pts",
      "enonce": "<div style='padding: 10px;'><p>Dans un repère orthonormé, on considère les points <span style='color: #c0392b;'>A(1; 2)</span>, <span style='color: #c0392b;'>B(4; 5)</span> et la droite (d) d'équation <span style='color: #c0392b;'>y = 2x - 1</span>.</p></div>",
      "questions": [
        {
          "question": "1) Calculer les coordonnées du vecteur <span style='color: #c0392b;'>\\vec{AB}</span>.",
          "reponse": "<p>Les coordonnées de <span style='color: #c0392b;'>\\vec{AB}</span> sont :</p><p><span style='color: #c0392b;'>\\vec{AB} = (x_B - x_A; y_B - y_A) = (4 - 1; 5 - 2) = (3; 3)</span></p>"
        },
        {
          "question": "2) Déterminer un vecteur directeur de la droite (d).",
          "reponse": "<p>La droite (d) a pour équation <span style='color: #c0392b;'>y = 2x - 1</span>, donc son coefficient directeur est <span style='color: #c0392b;'>m = 2</span>.</p><p>Un vecteur directeur est <span style='color: #c0392b;'>\\vec{v}(1; m) = (1; 2)</span>.</p>"
        },
        {
          "question": "3) Déterminer l'équation cartésienne de la droite (AB).",
          "reponse": "<p>On a <span style='color: #c0392b;'>\\vec{AB}(3; 3)</span> qui est un vecteur directeur de (AB).</p><p>Un vecteur directeur simplifié est <span style='color: #c0392b;'>\\vec{v}(1; 1)</span>.</p><p>Un vecteur normal est <span style='color: #c0392b;'>\\vec{n}(1; -1)</span> (on permute et on change un signe).</p><p>L'équation de (AB) est de la forme <span style='color: #c0392b;'>x - y + c = 0</span>.</p><p>On remplace par A(1; 2) : <span style='color: #c0392b;'>1 - 2 + c = 0</span> → <span style='color: #c0392b;'>c = 1</span>.</p><p>L'équation cartésienne de (AB) est <span style='color: #c0392b;'>x - y + 1 = 0</span>.</p>"
        },
        {
          "question": "4) Les droites (AB) et (d) sont-elles parallèles ? Justifier.",
          "reponse": "<p>Le coefficient directeur de (AB) est <span style='color: #c0392b;'>m = 1</span> (car y = x + 1).</p><p>Le coefficient directeur de (d) est <span style='color: #c0392b;'>m = 2</span>.</p><p>Comme 1 ≠ 2, les droites ne sont pas parallèles. Elles sont donc sécantes en un point.</p>"
        },
        {
          "question": "5) Déterminer les coordonnées du point d'intersection de (AB) et (d).",
          "reponse": "<p>On résout le système :</p><p><span style='color: #c0392b;'>y = x + 1</span> (équation de AB) et <span style='color: #c0392b;'>y = 2x - 1</span> (équation de d).</p><p>On égalise : <span style='color: #c0392b;'>x + 1 = 2x - 1</span> → <span style='color: #c0392b;'>x = 2</span>.</p><p>On remplace dans y = x + 1 : <span style='color: #c0392b;'>y = 2 + 1 = 3</span>.</p><p>Le point d'intersection est <span style='color: #c0392b;'>I(2; 3)</span>.</p>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
