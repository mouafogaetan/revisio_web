<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Mathématiques CG",
  "classe": "2nde Technique",
  "sequence": "Séquence 2",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : QCM - Fonctions et Statistiques",
      "points": "4 pts",
      "enonce": "<p>Pour chacune des questions suivantes, une seule réponse est correcte. Recopiez sur votre copie le numéro de la question et la lettre correspondant à la réponse choisie. <strong>Aucune justification n'est demandée.</strong></p>",
      "questions": [
        {
          "question": "<p><strong>1. (1 pt)</strong> L'ensemble de définition de la fonction \\( f(x) = \\sqrt{x-3} \\) est :</p><ul><li>A) \\( ]-\\infty; 3] \\)</li><li>B) \\( [3; +\\infty[ \\)</li><li>C) \\( ]-\\infty; 3[ \\)</li><li>D) \\( \\mathbb{R} \\)</li></ul>",
          "reponse": "<p><strong>Réponse : B) [3; +∞[</strong></p><p>Explication : La fonction racine carrée est définie pour \\( x-3 \\geq 0 \\), donc \\( x \\geq 3 \\).</p>"
        },
        {
          "question": "<p><strong>2. (1 pt)</strong> Une suite \\( (u_n) \\) est définie par \\( u_n = 5n + 2 \\). Cette suite est :</p><ul><li>A) Arithmétique de raison 5</li><li>B) Arithmétique de raison 2</li><li>C) Géométrique de raison 5</li><li>D) Ni arithmétique ni géométrique</li></ul>",
          "reponse": "<p><strong>Réponse : A) Arithmétique de raison 5</strong></p><p>Explication : \\( u_{n+1} - u_n = 5(n+1) + 2 - (5n + 2) = 5 \\), donc la suite est arithmétique de raison 5.</p>"
        },
        {
          "question": "<p><strong>3. (1 pt)</strong> La somme des 5 premiers termes de la suite arithmétique de premier terme 2 et de raison 3 est :</p><ul><li>A) 40</li><li>B) 35</li><li>C) 45</li><li>D) 50</li></ul>",
          "reponse": "<p><strong>Réponse : A) 40</strong></p><p>Explication : \\( S_5 = \\dfrac{5}{2} \\times (2 \\times 2 + 4 \\times 3) = \\dfrac{5}{2} \\times 16 = 40 \\).</p>"
        },
        {
          "question": "<p><strong>4. (1 pt)</strong> La médiane de la série suivante : 4, 7, 8, 10, 12, 15 est :</p><ul><li>A) 8</li><li>B) 9</li><li>C) 10</li><li>D) 12</li></ul>",
          "reponse": "<p><strong>Réponse : B) 9</strong></p><p>Explication : La médiane est la moyenne des 3e et 4e valeurs : (8+10)/2 = 9.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Fonctions et Statistiques",
      "points": "6 pts",
      "enonce": "<p>On considère la fonction \\( f(x) = 2x^2 - 8x + 5 \\).</p><p>1. Déterminer l'ensemble de définition de \\( f \\).</p><p>2. Calculer les images de -1, 2 et 5.</p><p>3. Déterminer le minimum de la fonction en utilisant la forme canonique.</p><p>4. Un relevé statistique a donné les notes suivantes : 10, 12, 8, 14, 11, 9, 13, 10, 15, 12. Calculer la moyenne et la médiane.</p>",
      "questions": [
        {
          "question": "<p><strong>1. (1 pt)</strong> Déterminer l'ensemble de définition de \\( f \\).</p>",
          "reponse": "<p>La fonction \\( f(x) = 2x^2 - 8x + 5 \\) est un polynôme, donc elle est définie pour tout \\( x \\in \\mathbb{R} \\).</p><p>\\( D_f = \\mathbb{R} \\).</p>"
        },
        {
          "question": "<p><strong>2. (1,5 pt)</strong> Calculer les images de -1, 2 et 5.</p>",
          "reponse": "<p>\\( f(-1) = 2(-1)^2 - 8(-1) + 5 = 2 + 8 + 5 = 15 \\)</p><p>\\( f(2) = 2(2)^2 - 8(2) + 5 = 8 - 16 + 5 = -3 \\)</p><p>\\( f(5) = 2(5)^2 - 8(5) + 5 = 50 - 40 + 5 = 15 \\)</p>"
        },
        {
          "question": "<p><strong>3. (1,5 pt)</strong> Déterminer le minimum de la fonction en utilisant la forme canonique.</p>",
          "reponse": "<p>Forme canonique : \\( f(x) = 2(x-2)^2 - 3 \\)</p><p>Comme \\( 2(x-2)^2 \\geq 0 \\), le minimum est \\( f(2) = -3 \\).</p>"
        },
        {
          "question": "<p><strong>4. (2 pts)</strong> Calculer la moyenne et la médiane des notes suivantes : 10, 12, 8, 14, 11, 9, 13, 10, 15, 12.</p>",
          "reponse": "<p>Moyenne = (10+12+8+14+11+9+13+10+15+12)/10 = 114/10 = 11,4</p><p>On ordonne la série : 8, 9, 10, 10, 11, 12, 12, 13, 14, 15</p><p>Médiane = (11+12)/2 = 11,5</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Suites numériques",
      "points": "5 pts",
      "enonce": "<p>Un vendeur de téléphones portables à Yaoundé a vendu 500 téléphones en janvier 2025. Il prévoit une augmentation de 8% de ses ventes chaque mois.</p><p>1. Calculer le nombre de téléphones vendus en février et en mars 2025.</p><p>2. Exprimer le nombre de téléphones vendus \\( u_n \\) au bout de \\( n \\) mois en fonction de \\( n \\) (avec \\( u_0 = 500 \\)).</p><p>3. Calculer le nombre de téléphones vendus en décembre 2025.</p><p>4. Calculer le nombre total de téléphones vendus sur l'année 2025.</p>",
      "questions": [
        {
          "question": "<p><strong>1. (1 pt)</strong> Calculer les ventes de février et mars 2025.</p>",
          "reponse": "<p>Février : \\( u_1 = 500 \\times 1,08 = 540 \\) téléphones</p><p>Mars : \\( u_2 = 500 \\times (1,08)^2 = 583,2 \\) soit environ 583 téléphones</p>"
        },
        {
          "question": "<p><strong>2. (1 pt)</strong> Exprimer \\( u_n \\) en fonction de \\( n \\).</p>",
          "reponse": "<p>\\( u_n = 500 \\times (1,08)^n \\)</p><p>La suite est géométrique de raison \\( q = 1,08 \\) et de premier terme \\( u_0 = 500 \\).</p>"
        },
        {
          "question": "<p><strong>3. (1,5 pt)</strong> Calculer les ventes de décembre 2025.</p>",
          "reponse": "<p>Décembre correspond à \\( n = 11 \\) (janvier \\( n=0 \\))</p><p>\\( u_{11} = 500 \\times (1,08)^{11} \\approx 500 \\times 2,3316 \\approx 1165,8 \\)</p><p>Soit environ 1166 téléphones.</p>"
        },
        {
          "question": "<p><strong>4. (1,5 pt)</strong> Calculer le total des ventes sur l'année 2025.</p>",
          "reponse": "<p>Total = \\( S_{12} = u_0 + u_1 + ... + u_{11} \\)</p><p>\\( S_{12} = 500 \\times \\dfrac{1 - (1,08)^{12}}{1 - 1,08} = 500 \\times \\dfrac{(1,08)^{12} - 1}{0,08} \\)</p><p>\\( (1,08)^{12} \\approx 2,518 \\)</p><p>\\( S_{12} \\approx 500 \\times \\dfrac{1,518}{0,08} \\approx 500 \\times 18,975 \\approx 9487,5 \\)</p><p>Soit environ 9488 téléphones sur l'année.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Statistiques - Analyse de données",
      "points": "5 pts",
      "enonce": "<p>Dans une enquête menée auprès de 40 familles d'un quartier de Douala, on a relevé le nombre d'enfants par famille :</p><table border='1' style='border-collapse: collapse; width: 100%;'><thead><tr><th>Nombre d'enfants</th><th>0</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr></thead><tbody><tr><td>Effectif</td><td>2</td><td>8</td><td>12</td><td>10</td><td>6</td><td>2</td></tr></tbody></table><p>1. Calculer le nombre moyen d'enfants par famille.</p><p>2. Déterminer la médiane et le mode de cette série.</p><p>3. Représenter cette série par un diagramme en bâtons.</p><p>4. Calculer l'écart-type de cette série (arrondi à 2 décimales).</p>",
      "questions": [
        {
          "question": "<p><strong>1. (1,5 pt)</strong> Calculer le nombre moyen d'enfants par famille.</p>",
          "reponse": "<p>Moyenne = (0×2 + 1×8 + 2×12 + 3×10 + 4×6 + 5×2) / 40</p><p>= (0 + 8 + 24 + 30 + 24 + 10) / 40 = 96/40 = 2,4</p><p>Le nombre moyen d'enfants par famille est de 2,4.</p>"
        },
        {
          "question": "<p><strong>2. (1,5 pt)</strong> Déterminer la médiane et le mode.</p>",
          "reponse": "<p>Effectifs cumulés : 2, 10, 22, 32, 38, 40</p><p>La 20e valeur est 2, la 21e est aussi 2. Donc la médiane est 2.</p><p>Le mode est la valeur avec le plus grand effectif : 2 (effectif 12).</p>"
        },
        {
          "question": "<p><strong>3. (1 pt)</strong> Représenter cette série par un diagramme en bâtons.</p>",
          "reponse": "<p>Le diagramme en bâtons a en abscisse les nombres d'enfants (0 à 5) et en ordonnée les effectifs correspondants.</p><p>On place des bâtons de hauteurs : 2, 8, 12, 10, 6, 2.</p>"
        },
        {
          "question": "<p><strong>4. (1 pt)</strong> Calculer l'écart-type (arrondi à 2 décimales).</p>",
          "reponse": "<p>Variance = Σ f_i × (x_i - moyenne)² / 40</p><p>= (2×(-2,4)² + 8×(-1,4)² + 12×(-0,4)² + 10×(0,6)² + 6×(1,6)² + 2×(2,6)²) / 40</p><p>= (2×5,76 + 8×1,96 + 12×0,16 + 10×0,36 + 6×2,56 + 2×6,76) / 40</p><p>= (11,52 + 15,68 + 1,92 + 3,6 + 15,36 + 13,52) / 40 = 61,6/40 = 1,54</p><p>Écart-type = √1,54 ≈ 1,24</p>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
