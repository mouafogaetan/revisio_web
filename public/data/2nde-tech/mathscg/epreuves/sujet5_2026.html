<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Mathématiques CG",
  "classe": "2nde Technique",
  "sequence": "Séquence 5",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : QCM - Géométrie analytique et Statistiques",
      "points": "4 pts",
      "enonce": "<p>Pour chacune des questions suivantes, une seule réponse est correcte. Recopiez sur votre copie le numéro de la question et la lettre correspondant à la réponse choisie. <strong>Aucune justification n'est demandée.</strong></p>",
      "questions": [
        {
          "question": "<p><strong>1. (1 pt)</strong> Le coefficient directeur de la droite passant par les points A(1; 3) et B(4; 9) est :</p><ul><li>A) 1</li><li>B) 2</li><li>C) 3</li><li>D) 4</li></ul>",
          "reponse": "<p><strong>Réponse : B) 2</strong></p><p>Explication : \\( m = \\dfrac{9-3}{4-1} = \\dfrac{6}{3} = 2 \\).</p>"
        },
        {
          "question": "<p><strong>2. (1 pt)</strong> Un vecteur directeur de la droite d'équation \\( 2x - 3y + 5 = 0 \\) est :</p><ul><li>A) \\( \\vec{u}(2; -3) \\)</li><li>B) \\( \\vec{u}(3; 2) \\)</li><li>C) \\( \\vec{u}(-3; 2) \\)</li><li>D) \\( \\vec{u}(-2; 3) \\)</li></ul>",
          "reponse": "<p><strong>Réponse : B) (3; 2)</strong></p><p>Explication : Pour \\( ax + by + c = 0 \\), un vecteur directeur est \\( \\vec{u}(-b; a) = \\vec{u}(3; 2) \\).</p>"
        },
        {
          "question": "<p><strong>3. (1 pt)</strong> La médiane de la série 5, 8, 12, 15, 18 est :</p><ul><li>A) 10</li><li>B) 12</li><li>C) 11</li><li>D) 15</li></ul>",
          "reponse": "<p><strong>Réponse : B) 12</strong></p><p>Explication : La médiane est la 3e valeur (5 valeurs donc la 3e est au centre) : 12.</p>"
        },
        {
          "question": "<p><strong>4. (1 pt)</strong> La fréquence cumulée croissante de la valeur 12 dans la série 8, 10, 12, 12, 14 est :</p><ul><li>A) 0,4</li><li>B) 0,6</li><li>C) 0,8</li><li>D) 1</li></ul>",
          "reponse": "<p><strong>Réponse : B) 0,6</strong></p><p>Explication : 3 valeurs sur 5 sont inférieures ou égales à 12, soit 3/5 = 0,6.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Vecteurs et équations de droites",
      "points": "6 pts",
      "enonce": "<p>Dans un repère orthonormé, on donne les points A(2; 3), B(5; 7) et C(0; 4).</p><p>1. Calculer les coordonnées du vecteur \\( \\overrightarrow{AB} \\).</p><p>2. Déterminer le coefficient directeur de la droite (AB).</p><p>3. Déterminer une équation cartésienne de la droite (AB).</p><p>4. Le point C appartient-il à la droite (AB) ? Justifier.</p>",
      "questions": [
        {
          "question": "<p><strong>1. (1 pt)</strong> Calculer les coordonnées du vecteur \\( \\overrightarrow{AB} \\).</p>",
          "reponse": "<p>\\( \\overrightarrow{AB} = (x_B - x_A; y_B - y_A) = (5-2; 7-3) = (3; 4) \\)</p>"
        },
        {
          "question": "<p><strong>2. (1,5 pt)</strong> Déterminer le coefficient directeur de la droite (AB).</p>",
          "reponse": "<p>\\( m = \\dfrac{y_B - y_A}{x_B - x_A} = \\dfrac{7 - 3}{5 - 2} = \\dfrac{4}{3} \\)</p>"
        },
        {
          "question": "<p><strong>3. (2 pts)</strong> Déterminer une équation cartésienne de la droite (AB).</p>",
          "reponse": "<p>La droite a pour coefficient directeur \\( m = \\dfrac{4}{3} \\) et passe par A(2; 3).</p><p>Forme réduite : \\( y = \\dfrac{4}{3}x + p \\)</p><p>En remplaçant A : \\( 3 = \\dfrac{4}{3} \\times 2 + p \\Rightarrow 3 = \\dfrac{8}{3} + p \\Rightarrow p = 3 - \\dfrac{8}{3} = \\dfrac{1}{3} \\)</p><p>Donc \\( y = \\dfrac{4}{3}x + \\dfrac{1}{3} \\)</p><p>Équation cartésienne : \\( 4x - 3y + 1 = 0 \\) (en multipliant par 3)</p>"
        },
        {
          "question": "<p><strong>4. (1,5 pt)</strong> Le point C(0; 4) appartient-il à la droite (AB) ?</p>",
          "reponse": "<p>On vérifie si C vérifie l'équation : \\( 4 \\times 0 - 3 \\times 4 + 1 = 0 - 12 + 1 = -11 \\neq 0 \\)</p><p>Donc C n'appartient pas à la droite (AB).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Statistiques - Analyse des salaires",
      "points": "5 pts",
      "enonce": "<p>Une entreprise de services à Douala a relevé les salaires mensuels (en milliers de FCFA) de 50 employés :</p><table border='1' style='border-collapse: collapse; width: 100%;'><thead><tr><th>Salaire (en milliers de FCFA)</th><th>[100; 150[</th><th>[150; 200[</th><th>[200; 250[</th><th>[250; 300[</th><th>[300; 350[</th></tr></thead><tbody><tr><td>Effectif</td><td>8</td><td>15</td><td>12</td><td>10</td><td>5</td></tr></tbody></table><p>1. Calculer le salaire moyen des employés.</p><p>2. Déterminer la classe médiane.</p><p>3. Représenter cette série par un histogramme.</p><p>4. Calculer le pourcentage d'employés gagnant moins de 200 000 FCFA.</p>",
      "questions": [
        {
          "question": "<p><strong>1. (1,5 pt)</strong> Calculer le salaire moyen des employés.</p>",
          "reponse": "<p>Centres des classes : 125, 175, 225, 275, 325</p><p>Moyenne = (125×8 + 175×15 + 225×12 + 275×10 + 325×5) / 50</p><p>= (1000 + 2625 + 2700 + 2750 + 1625) / 50 = 10700/50 = 214 milliers de FCFA</p>"
        },
        {
          "question": "<p><strong>2. (1,5 pt)</strong> Déterminer la classe médiane.</p>",
          "reponse": "<p>Effectifs cumulés : 8, 23, 35, 45, 50</p><p>La médiane est la 25e valeur (50/2 = 25). La 25e valeur se trouve dans la classe [200; 250[.</p><p>Donc la classe médiane est [200; 250[.</p>"
        },
        {
          "question": "<p><strong>3. (1 pt)</strong> Représenter cette série par un histogramme.</p>",
          "reponse": "<p>L'histogramme est un graphique avec des barres dont les hauteurs sont proportionnelles aux effectifs des classes.</p><p>En abscisse : les classes de salaires, en ordonnée : les effectifs.</p>"
        },
        {
          "question": "<p><strong>4. (1 pt)</strong> Calculer le pourcentage d'employés gagnant moins de 200 000 FCFA.</p>",
          "reponse": "<p>Effectif total = 50</p><p>Nombre d'employés gagnant moins de 200 000 FCFA = 8 + 15 = 23</p><p>Pourcentage = 23/50 × 100 = 46%</p>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Synthèse - Géométrie et Statistiques",
      "points": "5 pts",
      "enonce": "<p>Une étude statistique sur les notes d'une classe de 2nde Technique a donné les résultats suivants :</p><table border='1' style='border-collapse: collapse; width: 100%;'><thead><tr><th>Notes</th><th>[0; 5[</th><th>[5; 10[</th><th>[10; 15[</th><th>[15; 20[</th></tr></thead><tbody><tr><td>Effectif</td><td>4</td><td>8</td><td>12</td><td>6</td></tr></tbody></table><p>1. Déterminer la population et le caractère étudié.</p><p>2. Calculer la moyenne des notes.</p><p>3. Déterminer la classe modale.</p><p>4. Dans un repère orthonormé, placer les points A(2; 3) et B(8; 9). Déterminer l'équation de la droite (AB).</p>",
      "questions": [
        {
          "question": "<p><strong>1. (1 pt)</strong> Déterminer la population et le caractère étudié.</p>",
          "reponse": "<p>Population : les élèves de la classe de 2nde Technique.</p><p>Caractère étudié : les notes (quantitatif continu).</p>"
        },
        {
          "question": "<p><strong>2. (1,5 pt)</strong> Calculer la moyenne des notes.</p>",
          "reponse": "<p>Centres des classes : 2,5; 7,5; 12,5; 17,5</p><p>Moyenne = (2,5×4 + 7,5×8 + 12,5×12 + 17,5×6) / 30</p><p>= (10 + 60 + 150 + 105) / 30 = 325/30 ≈ 10,83</p>"
        },
        {
          "question": "<p><strong>3. (1 pt)</strong> Déterminer la classe modale.</p>",
          "reponse": "<p>La classe avec le plus grand effectif est [10; 15[ avec 12 élèves.</p><p>Donc la classe modale est [10; 15[.</p>"
        },
        {
          "question": "<p><strong>4. (1,5 pt)</strong> Déterminer l'équation de la droite (AB) avec A(2; 3) et B(8; 9).</p>",
          "reponse": "<p>Coefficient directeur : \\( m = \\dfrac{9-3}{8-2} = \\dfrac{6}{6} = 1 \\)</p><p>La droite a pour équation \\( y = x + p \\)</p><p>En remplaçant A : \\( 3 = 2 + p \\Rightarrow p = 1 \\)</p><p>Donc \\( y = x + 1 \\) ou \\( -x + y - 1 = 0 \\)</p>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
