<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Mathématiques CG",
  "classe": "2nde Technique",
  "sequence": "Séquence 6",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Calcul dans R",
      "points": "3 pts",
      "enonce": "<p>1. Calculer et donner le résultat sous forme simplifiée :</p><div class='math-block'><div class='math'>$$ A = \\sqrt{27} - 2\\sqrt{12} + \\sqrt{3} $$</div></div><p>2. Simplifier l'expression suivante :</p><div class='math-block'><div class='math'>$$ B = \\frac{x^2 - 4}{x - 2} $$</div></div><p>3. Développer, réduire et ordonner : \\( C = (2x - 3)^2 - (x + 1)(2x - 5) \\)</p>",
      "questions": [
        {
          "question": "1) Calculer \\( A = \\sqrt{27} - 2\\sqrt{12} + \\sqrt{3} \\) et donner le résultat sous forme \\( a\\sqrt{3} \\).",
          "reponse": "<p>On simplifie chaque terme :</p><div class='math-block'><div class='math'>$$ \\sqrt{27} = \\sqrt{9 \\times 3} = 3\\sqrt{3} $$</div></div><div class='math-block'><div class='math'>$$ 2\\sqrt{12} = 2\\sqrt{4 \\times 3} = 2 \\times 2\\sqrt{3} = 4\\sqrt{3} $$</div></div><p>Donc :</p><div class='math-block'><div class='math'>$$ A = 3\\sqrt{3} - 4\\sqrt{3} + \\sqrt{3} = 0 $$</div></div><p>La valeur de \\( A \\) est \\( 0 \\).</p>"
        },
        {
          "question": "2) Simplifier \\( B = \\frac{x^2 - 4}{x - 2} \\).",
          "reponse": "<p>On factorise le numérateur : \\( x^2 - 4 = (x - 2)(x + 2) \\).</p><div class='math-block'><div class='math'>$$ B = \\frac{(x - 2)(x + 2)}{x - 2} = x + 2 \\; \\text{pour} \\; x \\neq 2 $$</div></div><p>Donc \\( B = x + 2 \\) avec \\( x \\neq 2 \\).</p>"
        },
        {
          "question": "3) Développer, réduire et ordonner \\( C = (2x - 3)^2 - (x + 1)(2x - 5) \\).",
          "reponse": "<p>On développe :</p><div class='math-block'><div class='math'>$$ (2x - 3)^2 = 4x^2 - 12x + 9 $$</div></div><div class='math-block'><div class='math'>$$ (x + 1)(2x - 5) = 2x^2 - 5x + 2x - 5 = 2x^2 - 3x - 5 $$</div></div><p>Donc :</p><div class='math-block'><div class='math'>$$ C = (4x^2 - 12x + 9) - (2x^2 - 3x - 5) = 4x^2 - 12x + 9 - 2x^2 + 3x + 5 $$</div></div><div class='math-block'><div class='math'>$$ C = 2x^2 - 9x + 14 $$</div></div>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Fonctions numériques",
      "points": "4 pts",
      "enonce": "<p>On considère la fonction \\( f(x) = x^2 - 4x + 3 \\).</p><p>1. Déterminer l'ensemble de définition de \\( f \\).</p><p>2. Calculer les images de \\( -1 \\) et \\( 3 \\) par \\( f \\).</p><p>3. Étudier le sens de variation de \\( f \\) sur \\( [-\\infty, 2] \\) et sur \\( [2, +\\infty[ \\).</p><p>4. Déterminer les extremums de \\( f \\) sur \\( \\mathbb{R} \\).</p>",
      "questions": [
        {
          "question": "1) Déterminer l'ensemble de définition de \\( f(x) = x^2 - 4x + 3 \\).",
          "reponse": "<p>La fonction \\( f \\) est une fonction polynôme du second degré.</p><p>Elle est définie pour tout \\( x \\in \\mathbb{R} \\).</p><p>Donc \\( D_f = \\mathbb{R} \\).</p>"
        },
        {
          "question": "2) Calculer \\( f(-1) \\) et \\( f(3) \\).",
          "reponse": "<p>\\( f(-1) = (-1)^2 - 4(-1) + 3 = 1 + 4 + 3 = 8 \\)</p><p>\\( f(3) = 3^2 - 4(3) + 3 = 9 - 12 + 3 = 0 \\)</p>"
        },
        {
          "question": "3) Étudier le sens de variation de \\( f \\) sur \\( ]-\\infty, 2] \\) et sur \\( [2, +\\infty[ \\).",
          "reponse": "<p>La fonction \\( f(x) = x^2 - 4x + 3 \\) est une parabole avec \\( a = 1 > 0 \\), donc elle admet un minimum.</p><p>La forme canonique est :</p><div class='math-block'><div class='math'>$$ f(x) = (x - 2)^2 - 1 $$</div></div><p>Le sommet de la parabole est \\( (2, -1) \\).</p><ul><li>Sur \\( ]-\\infty, 2] \\) : \\( f \\) est <strong>décroissante</strong>.</li><li>Sur \\( [2, +\\infty[ \\) : \\( f \\) est <strong>croissante</strong>.</li></ul>"
        },
        {
          "question": "4) Déterminer les extremums de \\( f \\) sur \\( \\mathbb{R} \\).",
          "reponse": "<p>La fonction \\( f \\) admet un <strong>minimum</strong> en \\( x = 2 \\).</p><p>La valeur de ce minimum est :</p><div class='math-block'><div class='math'>$$ f(2) = 2^2 - 4(2) + 3 = 4 - 8 + 3 = -1 $$</div></div><p>Donc le minimum de \\( f \\) sur \\( \\mathbb{R} \\) est \\( -1 \\), atteint en \\( x = 2 \\).</p><p>La fonction n'admet pas de maximum sur \\( \\mathbb{R} \\) car elle tend vers \\( +\\infty \\) quand \\( x \\) tend vers \\( \\pm\\infty \\).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Vecteurs",
      "points": "3 pts",
      "enonce": "<p>Dans un repère orthonormé \\( (O, \\vec{i}, \\vec{j}) \\), on donne les points :</p><ul><li>\\( A(1, -2) \\)</li><li>\\( B(4, 2) \\)</li><li>\\( C(-1, 3) \\)</li></ul><p>1. Calculer les coordonnées des vecteurs \\( \\overrightarrow{AB} \\) et \\( \\overrightarrow{AC} \\).</p><p>2. Calculer les coordonnées du vecteur \\( \\vec{u} = 2\\overrightarrow{AB} - \\overrightarrow{AC} \\).</p><p>3. Les points \\( A, B, C \\) sont-ils alignés ? Justifier.</p>",
      "questions": [
        {
          "question": "1) Calculer les coordonnées de \\( \\overrightarrow{AB} \\) et \\( \\overrightarrow{AC} \\).",
          "reponse": "<div class='math-block'><div class='math'>$$ \\overrightarrow{AB} = (x_B - x_A, y_B - y_A) = (4 - 1, 2 - (-2)) = (3, 4) $$</div></div><div class='math-block'><div class='math'>$$ \\overrightarrow{AC} = (x_C - x_A, y_C - y_A) = (-1 - 1, 3 - (-2)) = (-2, 5) $$</div></div>"
        },
        {
          "question": "2) Calculer les coordonnées de \\( \\vec{u} = 2\\overrightarrow{AB} - \\overrightarrow{AC} \\).",
          "reponse": "<div class='math-block'><div class='math'>$$ \\vec{u} = 2(3, 4) - (-2, 5) = (6, 8) - (-2, 5) = (6 + 2, 8 - 5) = (8, 3) $$</div></div>"
        },
        {
          "question": "3) Les points \\( A, B, C \\) sont-ils alignés ? Justifier.",
          "reponse": "<p>Pour que les points \\( A, B, C \\) soient alignés, il faut que les vecteurs \\( \\overrightarrow{AB} \\) et \\( \\overrightarrow{AC} \\) soient colinéaires.</p><p>On a \\( \\overrightarrow{AB} = (3, 4) \\) et \\( \\overrightarrow{AC} = (-2, 5) \\).</p><p>On vérifie la colinéarité : \\( 3 \\times 5 - 4 \\times (-2) = 15 + 8 = 23 \\neq 0 \\).</p><p>Les vecteurs ne sont pas colinéaires, donc les points \\( A, B, C \\) <strong>ne sont pas alignés</strong>.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Équation cartésienne de droite",
      "points": "4 pts",
      "enonce": "<p>Dans un repère orthonormé, on considère la droite \\( \\mathcal{D} \\) d'équation \\( 3x - 2y + 6 = 0 \\).</p><p>1. Déterminer un vecteur directeur de \\( \\mathcal{D} \\).</p><p>2. Déterminer le coefficient directeur de \\( \\mathcal{D} \\).</p><p>3. Le point \\( M(2, 6) \\) appartient-il à \\( \\mathcal{D} \\) ? Justifier.</p><p>4. Déterminer une équation de la droite \\( \\mathcal{D}' \\) passant par \\( A(1, -1) \\) et parallèle à \\( \\mathcal{D} \\).</p>",
      "questions": [
        {
          "question": "1) Déterminer un vecteur directeur de \\( \\mathcal{D} : 3x - 2y + 6 = 0 \\).",
          "reponse": "<p>Pour une droite d'équation \\( ax + by + c = 0 \\), un vecteur directeur est \\( \\vec{u}(-b, a) \\).</p><p>Ici \\( a = 3 \\) et \\( b = -2 \\), donc :</p><div class='math-block'><div class='math'>$$ \\vec{u}(-(-2), 3) = (2, 3) $$</div></div>"
        },
        {
          "question": "2) Déterminer le coefficient directeur de \\( \\mathcal{D} \\).",
          "reponse": "<p>L'équation \\( 3x - 2y + 6 = 0 \\) s'écrit :</p><div class='math-block'><div class='math'>$$ -2y = -3x - 6 \\Rightarrow y = \\frac{3}{2}x + 3 $$</div></div><p>Le coefficient directeur est \\( m = \\frac{3}{2} \\).</p>"
        },
        {
          "question": "3) Le point \\( M(2, 6) \\) appartient-il à \\( \\mathcal{D} \\) ?",
          "reponse": "<p>On vérifie si \\( M(2, 6) \\) satisfait l'équation :</p><div class='math-block'><div class='math'>$$ 3(2) - 2(6) + 6 = 6 - 12 + 6 = 0 $$</div></div><p>L'équation est vérifiée, donc \\( M(2, 6) \\) appartient à \\( \\mathcal{D} \\).</p>"
        },
        {
          "question": "4) Déterminer l'équation de \\( \\mathcal{D}' \\) passant par \\( A(1, -1) \\) et parallèle à \\( \\mathcal{D} \\).",
          "reponse": "<p>Une droite parallèle à \\( \\mathcal{D} \\) a le même coefficient directeur \\( m = \\frac{3}{2} \\).</p><p>L'équation est de la forme \\( y = \\frac{3}{2}x + p \\).</p><p>En utilisant \\( A(1, -1) \\) :</p><div class='math-block'><div class='math'>$$ -1 = \\frac{3}{2}(1) + p \\Rightarrow p = -1 - \\frac{3}{2} = -\\frac{5}{2} $$</div></div><p>Donc \\( \\mathcal{D}' : y = \\frac{3}{2}x - \\frac{5}{2} \\) ou \\( 3x - 2y - 5 = 0 \\).</p>"
        }
      ]
    },
    {
      "titre": "Exercice 5 : Statistiques",
      "points": "4 pts",

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
