<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Présentation mobile</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' },
            options: { skipHtmlTypes: 'script' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 500px;
        margin: 0 auto;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    .slide-header {
        flex-shrink: 0;
        padding: 18px 16px 10px 16px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        z-index: 10;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .slide-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
    }

    .content-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 18px 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        flex-shrink: 0;
    }

    .content-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .content-card li {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        line-height: 1.5;
    }

    .content-card li:last-child {
        border-bottom: none;
    }

    .bullet-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
    }

    .math-block {
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        overflow-x: auto;
        flex-shrink: 0;
        margin: 4px 0;
    }

    .math-block .math {
        font-size: 1.2rem;
        color: #e2e8f0;
    }

    .note-box {
        background: rgba(96, 165, 250, 0.08);
        border-left: 4px solid #60a5fa;
        padding: 12px 16px;
        border-radius: 12px;
        font-style: italic;
        font-size: 0.9rem;
        color: #cbd5e1;
        flex-shrink: 0;
    }

    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        border-radius: 0;
        flex-direction: column;
    }

    .loading-card {
        background: #1e293b;
        padding: 32px 28px;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #334155;
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px auto;
    }

    .loading-text {
        font-weight: 600;
        font-size: 1.1rem;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    .loading-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 16px;
    }
    .loading-progress {
        height: 3px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        animation: loadingProgress 30s ease-out forwards;
    }

    .loading-timeout {
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 12px;
    }

    .btn-cancel-loading {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 40px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #f87171;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }

    .btn-cancel-loading:active {
        transform: scale(0.94);
        background: rgba(239, 68, 68, 0.25);
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
    }

    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .slide-counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255,255,255,0.05);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(255,255,255,0.04);
    }

    .status-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 30px;
        background: rgba(96, 165, 250, 0.12);
        color: #93bbfc;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
    }

    .status-badge .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: pulse-dot 1.2s infinite;
        flex-shrink: 0;
    }

    .status-badge.idle .dot {
        animation: none;
        background: #64748b;
    }
    .status-badge.speaking .dot {
        background: #34d399;
        animation: pulse-dot 0.8s infinite;
    }
    .status-badge.error .dot {
        background: #f87171;
        animation: none;
    }
    .status-badge.paused .dot {
        animation: none;
        background: #fbbf24;
    }
    .status-badge.waiting .dot {
        animation: pulse-dot 1.5s infinite;
        background: #fbbf24;
    }
    .status-badge.loading .dot {
        animation: pulse-dot 0.5s infinite;
        background: #60a5fa;
    }

    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.7); }
    }

    .footer-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(255,255,255,0.1);
    }

    .btn-secondary {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-play {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
        min-width: 80px;
        justify-content: center;
    }
    .btn-play:active {
        background: rgba(52, 211, 153, 0.25);
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
    }

    .auto-indicator {
        font-size: 0.65rem;
        color: #64748b;
        text-align: center;
        letter-spacing: 0.3px;
        padding: 2px 0;
    }

    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.2rem;
        }
        .content-card li {
            font-size: 0.9rem;
            padding: 8px 0;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .btn-play {
            min-width: 60px;
        }
        .footer-buttons {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
        .loading-card {
            padding: 20px 16px;
        }
        .math-block .math {
            font-size: 1rem;
        }
    }

    @media (min-width: 600px) {
        .app-container {
            max-width: 480px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
        .loading-overlay {
            border-radius: 32px;
        }
    }

    /* Mode jour (par défaut) */
    html, body {
        background: #f0f4f8 !important;
        color: #1a202c !important;
    }
    .app-container {
        background: linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%) !important;
    }
    .slide-header {
        background: rgba(255, 255, 255, 0.85) !important;
        border-bottom: 1px solid rgba(0,0,0,0.08) !important;
    }
    .slide-header h1 {
        background: linear-gradient(135deg, #2b6cb0, #6b46c1) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        background-clip: text !important;
    }
    .slide-footer {
        background: rgba(255, 255, 255, 0.9) !important;
        border-top: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card {
        background: rgba(255,255,255,0.8) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card li {
        border-bottom: 1px solid rgba(0,0,0,0.05) !important;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.12) !important;
        border-left: 4px solid #4299e1 !important;
        color: #2c3e50 !important;
    }
    .math-block {
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .math-block .math {
        color: #2d3748 !important;
    }
    .slide-counter {
        color: #4a5568 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .status-badge {
        background: rgba(96, 165, 250, 0.15) !important;
        color: #2b6cb0 !important;
        border: 1px solid rgba(96, 165, 250, 0.15) !important;
    }
    .btn {
        color: #2d3748 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .btn-secondary {
        background: rgba(0,0,0,0.04) !important;
        border-color: rgba(0,0,0,0.08) !important;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15) !important;
        border-color: rgba(52, 211, 153, 0.2) !important;
        color: #38a169 !important;
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15) !important;
        border-color: rgba(251, 191, 36, 0.2) !important;
        color: #d69e2e !important;
    }
    .auto-indicator {
        color: #718096 !important;
    }
    .loading-card {
        background: #ffffff !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .loading-text {
        color: #1a202c !important;
    }
    .loading-sub {
        color: #4a5568 !important;
    }
</style>
</head>
<body>

<div class="app-container">

    <header class="slide-header">
        <h1 id="slideTitle">Chargement...</h1>
    </header>

    <main class="slide-body" id="slideBody"></main>

    <!-- LOADING OVERLAY AVEC BOUTON ANNULER -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Préparation vocale...</div>
            <div class="loading-sub" id="loadingSub">Synthèse en cours</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loadingProgressBar"></div>
            </div>
            <div class="loading-timeout" id="loadingTimeout">⏱️ 30 secondes maximum</div>
            <button class="btn-cancel-loading" id="cancelLoadingBtn">
                <span>✕</span> Annuler
            </button>
        </div>
    </div>

    <footer class="slide-footer">
        <div class="footer-top">
            <span class="slide-counter" id="slideCounter">1 / 3</span>
            <span class="status-badge idle" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">Prêt</span>
            </span>
        </div>

        <div class="footer-buttons">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-secondary" id="replayBtn">
                <span class="btn-icon">🔁</span> <span class="btn-label">Relire</span>
            </button>
            <button class="btn btn-play" id="playBtn">
                <span class="btn-icon">▶</span> <span class="btn-label">Play</span>
            </button>
        </div>

        <div class="auto-indicator" id="autoIndicator">⏸ Lecture manuelle</div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // SLIDES
    // ================================================================
    const slides = [
  {
    "titre": "Bienvenue en Maths CG",
    "contenu": "<div style='text-align: center; padding: 15px;'><h2 style='color: #1a5276;'>📐 Mathématiques CG</h2><h3 style='color: #2e86c1;'>Classe : 2<sup>nde</sup> Technique</h3><div style='background: linear-gradient(135deg, #1a5276, #2e86c1); color: white; padding: 20px; border-radius: 10px; margin: 15px 0;'><h4 style='color: white;'>Chapitre 1 : Calcul dans ℝ</h4><h2 style='color: white;'>Leçon 1 : ℝ et ses sous-ensembles</h2></div><div style='background: #eaf2f8; padding: 15px; border-radius: 8px; margin: 15px 0;'><p style='font-size: 1.1em;'><strong>Objectifs de la leçon :</strong></p><ul style='text-align: left; list-style-type: none; padding: 0;'><li style='background: #d4e6f1; margin: 5px 0; padding: 10px; border-radius: 5px;'>🔢 Reconnaître les ensembles ℕ, ℤ, ℚ et ℝ</li><li style='background: #eaf2f8; margin: 5px 0; padding: 10px; border-radius: 5px;'>📏 Utiliser la valeur absolue et la notion de distance</li><li style='background: #d4e6f1; margin: 5px 0; padding: 10px; border-radius: 5px;'>🧮 Effectuer des calculs avec les racines carrées et les puissances</li><li style='background: #eaf2f8; margin: 5px 0; padding: 10px; border-radius: 5px;'>📊 Utiliser les rapports et les proportions</li></ul></div></div>",
    "texteParle": "Bonjour à tous et bienvenue en cours de mathématiques CG, spécialité comptabilité et gestion. Aujourd'hui, nous allons débuter le chapitre 1 sur le calcul dans R avec la leçon 1 intitulée R et ses sous-ensembles. Nous allons découvrir les différents ensembles de nombres, apprendre à utiliser la valeur absolue et la notion de distance, et maîtriser les calculs avec les racines carrées, les puissances, les rapports et les proportions. Ces notions sont essentielles pour la suite de votre formation en comptabilité et gestion.",
    "note": "Chapitre 1 - Leçon 1 : ℝ et ses sous-ensembles"
  },
  {
    "titre": "Les ensembles de nombres",
    "contenu": "<div style='padding: 10px;'><h3 style='color: #1a5276;'>Les ensembles ℕ, ℤ, ℚ et ℝ</h3><div style='background: #eaf2f8; padding: 15px; border-radius: 8px; margin: 10px 0;'><p><strong>📌 ℕ = Ensemble des entiers naturels</strong></p><p>Ce sont les nombres qui servent à compter : <span style='color: #c0392b;'>0, 1, 2, 3, 4, 5, ...</span></p></div><div style='background: #d4e6f1; padding: 15px; border-radius: 8px; margin: 10px 0;'><p><strong>📌 ℤ = Ensemble des entiers relatifs</strong></p><p>Ce sont les entiers naturels et leurs opposés : <span style='color: #c0392b;'>..., -3, -2, -1, 0, 1, 2, 3, ...</span></p></div><div style='background: #eaf2f8; padding: 15px; border-radius: 8px; margin: 10px 0;'><p><strong>📌 ℚ = Ensemble des nombres rationnels</strong></p><p>Ce sont les nombres qui peuvent s'écrire sous forme de fraction <span style='color: #c0392b;'>a/b</span> avec <span style='color: #c0392b;'>a ∈ ℤ</span> et <span style='color: #c0392b;'>b ∈ ℤ*</span>.</p><p>Exemples : <span style='color: #c0392b;'>1/2, -3/4, 0, 5, 2/3</span></p></div><div style='background: #d4e6f1; padding: 15px; border-radius: 8px; margin: 10px 0;'><p><strong>📌 ℝ = Ensemble des nombres réels</strong></p><p>Ce sont tous les nombres, y compris les nombres irrationnels comme <span style='color: #c0392b;'>√2, π, e</span>.</p></div></div>",
    "texteParle": "Commençons par les ensembles de nombres qui sont la base de tous les calculs en mathématiques. Les entiers naturels, notés N, sont les nombres qui servent à compter comme 0, 1, 2, 3. Les entiers relatifs, notés Z, incluent les entiers naturels et leurs opposés négatifs. Les nombres rationnels, notés Q, sont tous les nombres qui peuvent s'écrire comme une fraction de deux entiers. Enfin, les nombres réels, notés R, représentent tous les nombres possibles, y compris les nombres irrationnels comme la racine carrée de 2. Vous devez retenir que ces ensembles s'emboîtent : N est inclus dans Z, Z est inclus dans Q, et Q est inclus dans R.",
    "note": "ℕ ⊂ ℤ ⊂ ℚ ⊂ ℝ : les ensembles s'emboîtent"
  },
  {
    "titre": "Valeur absolue et distance",
    "contenu": "<div style='padding: 10px;'><h3 style='color: #1a5276;'>La valeur absolue</h3><div style='background: #eaf2f8; padding: 15px; border-radius: 8px; margin: 10px 0;'><p><strong>Définition :</strong></p><p>La <strong>valeur absolue</strong> d'un nombre réel <span style='color: #c0392b;'>x</span>, notée <span style='color: #c0392b;'>|x|</span>, est la distance qui sépare <span style='color: #c0392b;'>x</span> de 0 sur la droite numérique.</p><div class='math-block' style='text-align: center; background: white; padding: 10px; border-radius: 5px; margin: 10px 0;'><div class='math'>$$|x| = \\begin{cases} x & \\text{si } x \\geq 0 \\\\ -x & \\text{si } x < 0 \\end{cases}$$</div></div></div><div style='background: #d4e6f1; padding: 15px; border-radius: 8px; margin: 10px 0;'><p><strong>Exemples :</strong></p><ul style='text-align: left;'><li><span style='color: #c0392b;'>|5| = 5</span> (la distance de 5 à 0 est 5)</li><li><span style='color: #c0392b;'>|-3| = 3</span> (la distance de -3 à 0 est 3)</li><li><span style='color: #c0392b;'>|0| = 0</span></li></ul></div><div style='background: #fdf2e9; padding: 15px; border-radius: 8px; margin: 10px 0; border-left: 4px solid #e67e22;'><p style='margin: 0;'><strong>💡 Propriété :</strong> La valeur absolue est toujours positive ou nulle.</p></div><div style='background: #eaf2f8; padding: 15px; border-radius: 8px; margin: 10px 0;'><p><strong>📏 Distance entre deux nombres :</strong></p><p>La distance entre deux nombres <span style='color: #c0392b;'>a</span> et <span style='color: #c0392b;'>b</span> est : <span style='color: #c0392b;'>|a - b|</span></p><p>Exemple : la distance entre 3 et 7 est <span style='color: #c0392b;'>|3 - 7| = |-4| = 4</span></p></div></div>",
    "texteParle": "La valeur absolue est un outil fondamental en mathématiques. Elle représente la distance d'un nombre par rapport à zéro sur la droite numérique. Concrètement, la valeur absolue d'un nombre est toujours positive ou nulle. Par exemple, la valeur absolue de 5 est 5, et la valeur absolue de moins 3 est 3. La valeur absolue permet aussi de calculer la distance entre deux nombres. Par exemple, la distance entre 3 et 7 est la valeur absolue de 3 moins 7, ce qui donne 4. Cette notion de distance sera très utile dans de nombreux calculs en comptabilité et gestion.",
    "note": "|x| = distance de x à 0 sur la droite numérique"
  },
  {
    "titre": "Les racines carrées",
    "contenu": "<div style='padding: 10px;'><h3 style='color: #1a5276;'>Les racines carrées</h3><div style='background: #eaf2f8; padding: 15px; border-radius: 8px; margin: 10px 0;'><p><strong>Définition :</strong></p><p>La <strong>racine carrée</strong> d'un nombre positif <span style='color: #c0392b;'>a</span>, notée <span style='color: #c0392b;'>√a</span>, est l'unique nombre positif <span style='color: #c0392b;'>b</span> tel que <span style='color: #c0392b;'>b² = a</span>.</p><div class='math-block' style='text-align: center; background: white; padding: 10px; border-radius: 5px; margin: 10px 0;'><div class='math'>$$\\sqrt{a} = b \\iff b^2 = a \\text{ et } b \\geq 0$$</div></div></div><div style='background: #d4e6f1; padding: 15px; border-radius: 8px; margin: 10px 0;'><p><strong>Exemples :</strong></p><ul style='text-align: left;'><li><span style='color: #c0392b;'>√9 = 3</span> car <span style='color: #c0392b;'>3² = 9</span></li><li><span style='color: #c0392b;'>√16 = 4</span> car <span style='color: #c0392b;'>4² = 16</span></li><li><span style='color: #c0392b;'>√2 ≈ 1,414</span> (nombre irrationnel)</li></ul></div><div style='background: #fdf2e9; padding: 15px; border-radius: 8px; margin: 10px 0; border-left: 4px solid #e67e22;'><p style='margin: 0;'><strong>⚠️ Attention :</strong> La racine carrée d'un nombre négatif n'existe pas dans ℝ.</p></div><div style='background: #eaf2f8; padding: 15px; border-radius: 8px; margin: 10px 0;'><p><strong>📌 Propriétés :</strong></p><ul style='text-align: left;'><li><span style='color: #c0392b;'>√(a × b) = √a × √b</span> pour <span style='color: #c0392b;'>a ≥ 0</span> et <span style='color: #c0392b;'>b ≥ 0</span></li><li><span style='color: #c0392b;'>√(a/b) = √a / √b</span> pour <span style='color: #c0392b;'>a ≥ 0</span> et <span style='color: #c0392b;'>b > 0</span></li><li><span style='color: #c0392b;'>(√a)² = a</span> pour <span style='color: #c0392b;'>a ≥ 0</span></li></ul></div></div>",
    "texteParle": "La racine carrée est une opération qui permet de trouver le nombre qui, multiplié par lui-même, donne le nombre initial. Par exemple, la racine carrée de 9 est 3 car 3 fois 3 fait 9. Il est important de retenir que la racine carrée n'existe que pour les nombres positifs ou nuls. Les racines carrées ont des propriétés utiles : la racine carrée d'un produit est le produit des racines carrées, et la racine carrée d'un quotient est le quotient des racines carrées. Ces propriétés vous seront très utiles pour simplifier vos calculs.",
    "note": "√a = b ⇔ b² = a avec b ≥ 0"
  },
  {
    "titre": "Les puissances entières",
    "contenu": "<div style='padding: 10px;'><h3 style='color: #1a5276;'>Les puissances entières</h3><div style='background: #eaf2f8; padding: 15px; border-radius: 8px; margin: 10px 0;'><p><strong>Définition :</strong></p><p>Pour <span style='color: #c0392b;'>n</span> entier positif et <span style='color: #c0392b;'>a</span> réel, la <strong>puissance n-ième</strong> de <span style='color: #c0392b;'>a</span> est :</p><div class='math-block' style='text-align: center; background: white; padding: 10px; border-radius: 5px; margin: 10px 0;'><div class='math'>$$a^n = \\underbrace{a \\times a \\times ... \\times a}_{n \\text{ facteurs}}$$</div></div></div><div style='background: #d4e6f1; padding: 15px; border-radius: 8px; margin: 10px 0;'><p><strong>Cas particuliers :</strong></p><ul style='text-align: left;'><li><span style='color: #c0392b;'>a¹ = a</span></li><li><span style='color: #c0392b;'>a⁰ = 1</span> (pour <span style='color: #c0392b;'>a ≠ 0</span>)</li><li><span style='color: #c0392b;'>a⁻ⁿ = 1/aⁿ</span> (puissance négative)</li></ul></div><div style='background: #fdf2e9; padding: 15px; border-radius: 8px; margin: 10px 0; border-left: 4px solid #2ecc71;'><p style='margin: 0;'><strong>📌 Propriétés :</strong> Pour <span style='color: #c0392b;'>a, b > 0</span> et <span style='color: #c0392b;'>m, n ∈ ℤ</span> :</p><div class='math-block' style='text-align: center; background: white; padding: 10px; border-radius: 5px;'><div class='math'>$$a^m \\times a^n = a^{m+n}$$</div></div><div class='math-block' style='text-align: center; background: white; padding: 10px; border-radius: 5px;'><div class='math'>$$\\dfrac{a^m}{a^n} = a^{m-n}$$</div></div><div class='math-block' style='text-align: center; background: white; padding: 10px; border-radius: 5px;'><div class='math'>$$(a^m)^n = a^{m \\times n}$$</div></div></div></div>",
    "texteParle": "Les puissances permettent d'écrire de manière concise des multiplications répétées. Par exemple, a puissance n signifie qu'on multiplie a par lui-même n fois. Il y a quelques cas particuliers à connaître : a puissance 1 est égal à a, a puissance 0 est égal à 1, et a puissance moins n est égal à 1 divisé par a puissance n. Les propriétés des puissances sont très importantes : pour multiplier deux puissances d'un même nombre, on additionne les exposants. Pour diviser deux puissances d'un même nombre, on soustrait les exposants. Et pour élever une puissance à une autre puissance, on multiplie les exposants. Ces règles vous serviront dans de nombreux calculs.",
    "note": "aⁿ = a × a × ... × a (n facteurs)"
  },
  {
    "titre": "Rapports et proportions",
    "contenu": "<div style='padding: 10px;'><h3 style='color: #1a5276;'>Les rapports et proportions</h3><div style='background: #eaf2f8; padding: 15px; border-radius: 8px; margin: 10px 0;'><p><strong>📊 Rapport :</strong></p><p>Le <strong>rapport</strong> de deux nombres <span style='color: #c0392b;'>a</span> et <span style='color: #c0392b;'>b</span> (avec <span style='color: #c0392b;'>b ≠ 0</span>) est le quotient <span style='color: #c0392b;'>a/b</span>.</p><p>Exemple : Le rapport de 6 à 3 est <span style='color: #c0392b;'>6/3 = 2</span>.</p></div><div style='background: #d4e6f1; padding: 15px; border-radius: 8px; margin: 10px 0;'><p><strong>⚖️ Proportion :</strong></p><p>Une <strong>proportion</strong> est l'égalité de deux rapports :</p><div class='math-block' style='text-align: center; background: white; padding: 10px; border-radius: 5px; margin: 10px 0;'><div class='math'>$$\\dfrac{a}{b} = \\dfrac{c}{d}$$</div></div><p>On dit que <span style='color: #c0392b;'>a</span> est à <span style='color: #c0392b;'>b</span> ce que <span style='color: #c0392b;'>c</span> est à <span style='color: #c0392b;'>d</span>.</p></div><div style='background: #fdf2e9; padding: 15px; border-radius: 8px; margin: 10px 0; border-left: 4px solid #2ecc71;'><p style='margin: 0;'><strong>💡 Application en comptabilité :</strong> Les rapports et proportions sont utilisés pour calculer des pourcentages, des taux de variation, et dans l'analyse financière.</p></div><div style='background: #eaf2f8; padding: 15px; border-radius: 8px; margin: 10px 0;'><p><strong>📝 Exemple :</strong></p><p>Si 3 pommes coûtent 150 FCFA, combien coûtent 5 pommes ?</p><p><span style='color: #c0392b;'>3/150 = 5/x</span> → <span style='color: #c0392b;'>x = (150 × 5)/3 = 250</span> FCFA</p></div></div>",
    "texteParle": "Les rapports et les proportions sont des outils mathématiques très utilisés en comptabilité et en gestion. Un rapport est simplement le quotient de deux nombres. Par exemple, le rapport de 6 à 3 est 2. Une proportion est l'égalité de deux rapports. Par exemple, 2 sur 3 est égal à 4 sur 6. Les proportions permettent de résoudre des problèmes de proportionnalité. En comptabilité, vous utiliserez les rapports et proportions pour calculer des pourcentages, des taux de variation, et pour analyser les états financiers. La règle de trois est une application directe des proportions. Retenez que pour résoudre une proportion, on utilise le produit en croix.",
    "note": "Une proportion est l'égalité de deux rapports : a/b = c/d"
  },
  {
    "titre": "Factorisation simple",
    "contenu": "<div style='padding: 10px;'><h3 style='color: #1a5276;'>La factorisation simple</h3><div style='background: #eaf2f8; padding: 15px; border-radius: 8px; margin: 10px 0;'><p><strong>Définition :</strong></p><p><strong>Factoriser</strong> une expression, c'est l'écrire sous la forme d'un <strong>produit</strong> de facteurs.</p></div><div style='background: #d4e6f1; padding: 15px; border-radius: 8px; margin: 10px 0;'><p><strong>📌 Le facteur commun :</strong></p><p>La factorisation la plus simple consiste à trouver un <strong>facteur commun</strong> à tous les termes.</p><div class='math-block' style='text-align: center; background: white; padding: 10px; border-radius: 5px; margin: 10px 0;'><div class='math'>$$ka + kb = k(a + b)$$</div></div></div><div style='background: #eaf2f8; padding: 15px; border-radius: 8px; margin: 10px 0;'><p><strong>Exemples :</strong></p><ul style='text-align: left;'><li><span style='color: #c0392b;'>3x + 6 = 3(x + 2)</span> (facteur commun 3)</li><li><span style='color: #c0392b;'>2a² - 4a = 2a(a - 2)</span> (facteur commun 2a)</li><li><span style='color: #c0392b;'>15x + 10y = 5(3x + 2y)</span> (facteur commun 5)</li></ul></div><div style='background: #fdf2e9; padding: 15px; border-radius: 8px; margin: 10px 0; border-left: 4px solid #e67e22;'><p style='margin: 0;'><strong>💡 À retenir :</strong> La factorisation est l'opération inverse du développement.</p></div></div>",
    "texteParle": "La factorisation est une technique qui consiste à transformer une somme en un produit. L'idée est de trouver un facteur commun à tous les termes de l'expression. Par exemple, dans l'expression 3x plus 6, le facteur commun est 3, donc on peut factoriser en 3 fois la somme de x plus 2. Cette technique est très utile en mathématiques pour simplifier des expressions, résoudre des équations, ou encore réduire des fractions. En comptabilité, vous pourrez utiliser la factorisation pour simplifier des formules de calcul. Retenez que la factorisation est l'opération inverse du développement.",
    "note": "Factoriser = transformer une somme en produit"
  },
  {
    "titre": "Simplification de fractions rationnelles",
    "contenu": "<div style='padding: 10px;'><h3 style='color: #1a5276;'>Simplification des fractions rationnelles</h3><div style='background: #eaf2f8; padding: 15px; border-radius: 8px; margin: 10px 0;'><p><strong>Définition :</strong></p><p>Une <strong>fraction rationnelle</strong> est un quotient de deux polynômes.</p></div><div style='background: #d4e6f1; padding: 15px; border-radius: 8px; margin: 10px 0;'><p><strong>📌 Méthode de simplification :</strong></p><p>Pour simplifier une fraction rationnelle, on factorise le numérateur et le dénominateur, puis on supprime les facteurs communs.</p></div><div style='background: #eaf2f8; padding: 15px; border-radius: 8px; margin: 10px 0;'><p><strong>Exemples :</strong></p><div class='math-block' style='text-align: center; background: white; padding: 10px; border-radius: 5px; margin: 10px 0;'><div class='math'>$$\\dfrac{6x}{3x} = \\dfrac{3x \\times 2}{3x \\times 1} = 2$$</div></div><div class='math-block' style='text-align: center; background: white; padding: 10px; border-radius: 5px; margin: 10px 0;'><div class='math'>$$\\dfrac{x^2 - 4}{x - 2} = \\dfrac{(x-2)(x+2)}{x-2} = x+2$$</div></div></div><div style='background: #fdf2e9; padding: 15px; border-radius: 8px; margin: 10px 0; border-left: 4px solid #e67e22;'><p style='margin: 0;'><strong>⚠️ Attention :</strong> On ne peut simplifier que des <strong>facteurs</strong> (produits), jamais des <strong>termes</strong> (sommes).</p></div></div>",
    "texteParle": "Une fraction rationnelle est une fraction dont le numérateur et le dénominateur sont des polynômes. Pour la simplifier, on factorise le numérateur et le dénominateur, puis on supprime les facteurs communs. Par exemple, dans la fraction 6x sur 3x, on peut simplifier par 3x pour obtenir 2. De même, x au carré moins 4 divisé par x moins 2 se simplifie en x plus 2. Il faut faire attention à ne simplifier que des facteurs, c'est-à-dire des produits, et jamais des termes, c'est-à-dire des sommes. Cette simplification est essentielle pour réduire des expressions complexes.",
    "note": "Simplifier = factoriser puis supprimer les facteurs communs"

  {
    "titre": "Développement d'un polynôme",
    "contenu": "<div style='padding: 10px;'><h3 style='color: #1a5276;'>Développement d'un polynôme</h3><div style='background: #eaf2f8; padding: 15px; border-radius: 8px; margin: 10px 0;'><p><strong>Définition :</strong></p><p><strong>Développer</strong> une expression, c'est l'écrire sous forme d'une <strong>somme</strong> de termes.</p></div><div style='background: #d4e6f1; padding: 15px; border-radius: 8px; margin: 10px 0;'><p><strong>📌 Règles de développement :</strong></p><div class='math-block' style='text-align: center; background: white; padding: 10px; border-radius: 5px; margin: 10px 0;'><div class='math'>$$k(a + b) = ka + kb$$</div></div><div class='math-block' style='text-align: center; background: white; padding: 10px; border-radius: 5px; margin: 10px 0;'><div class='math'>$$(a + b)(c + d) = ac + ad + bc + bd$$</div></div></div><div style='background: #eaf2f8; padding: 15px; border-radius: 8px; margin: 10px 0;'><p><strong>Exemples :</strong></p><ul style='text-align: left;'><li><span style='color: #c0392b;'>3(x + 2) = 3x + 6</span></li><li><span style='color: #c0392b;'>(x + 1)(x + 3) = x² + 4x + 3</span></li><li><span style='color: #c0392b;'>(x - 2)² = x² - 4x + 4</span></li></ul></div><div style='background: #fdf2e9; padding: 15px; border-radius: 8px; margin: 10px 0; border-left: 4px solid #2ecc71;'><p style='margin: 0;'><strong>✅ Après développement :</strong> On <strong>réduit</strong> (on regroupe les termes de même nature) et on <strong>ordonne</strong> (on écrit les termes par ordre décroissant des puissances).</p></div></div>",
    "texteParle": "Le développement est l'opération inverse de la factorisation. Développer une expression, c'est transformer un produit en une somme de termes. Par exemple, 3 fois la somme de x plus 2 se développe en 3x plus 6. La règle de base est la distributivité : on multiplie chaque terme de l'intérieur par le facteur extérieur. Pour le produit de deux parenthèses, on multiplie chaque terme de la première parenthèse par chaque terme de la seconde parenthèse. Après avoir développé, on réduit les termes de même nature et on ordonne le polynôme par puissances décroissantes. C'est la présentation standard d'un polynôme.",

  {

    "contenu": "<div style='padding: 10px;'><h3 style='color: #1a5276;'>Ce qu'il faut retenir</h3><div style='background: #eaf2f8; padding: 15px; border-radius: 8px; margin: 10px 0;'><p><strong>📌 Les ensembles :</strong> ℕ ⊂ ℤ ⊂ ℚ ⊂ ℝ</p></div><div style='background: #d4e6f1; padding: 15px; border-radius: 8px; margin: 10px 0;'><p><strong>📌 La valeur absolue :</strong> |x| = distance de x à 0</p></div><div style='background: #eaf2f8; padding: 15px; border-radius: 8px; margin: 10px 0;'><p><strong>📌 Les racines carrées :</strong> √a = b ⇔ b² = a avec b ≥ 0</p></div><div style='background: #d4e6f1; padding: 15px; border-radius: 8px; margin: 10px 0;'><p><strong>📌 Les puissances :</strong> aⁿ = a × ... × a (n facteurs)</p></div><div style='background: #eaf2f8; padding: 15px; border-radius: 8px; margin: 10px 0;'><p><strong>📌 Les rapports :</strong> a/b et proportions : a/b = c/d</p></div><div style='background: #d4e6f1; padding: 15px; border-radius: 8px; margin: 10px 0;'><p><strong>📌 Factorisation :</strong> ka + kb = k(a + b)</p></div><div style='background: #eaf2f8; padding: 15px; border-radius: 8px; margin: 10px 0;'><p><strong>📌 Développement :</strong> k(a + b) = ka + kb</p></div></div>",
    "texteParle": "Pour conclure cette leçon sur R et ses sous-ensembles, retenez les points essentiels. Les ensembles de nombres s'emboîtent : les entiers naturels sont inclus dans les entiers relatifs, qui sont inclus dans les nombres rationnels, qui sont inclus dans les nombres réels. La valeur absolue représente la distance à zéro. La racine carrée est l'opération inverse du carré, mais elle n'existe que pour les nombres positifs. Les puissances permettent d'écrire des multiplications répétées. Les rapports et proportions sont des outils fondamentaux en comptabilité et en gestion. Enfin, la factorisation et le développement sont deux opérations inverses qui vous serviront tout au long de votre formation. Je vous invite à bien revoir ces notions et à faire des exercices pour les maîtriser.",

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentIndex = 0;
    let isSpeaking = false;
    let isPaused = false;
    let currentUtterance = null;
    let isLoading = false;
    let loadingTimeout = null;
    let isTransitioning = false;
    let speechSupported = true;
    let userInteracted = false;
    let isPlaying = false;
    let loadingCancelled = false;

    const total = slides.length;
    const synth = window.speechSynthesis;

    // Références jQuery
    const $title = $('#slideTitle');
    const $body = $('#slideBody');
    const $counter = $('#slideCounter');
    const $statusText = $('#statusText');
    const $statusBadge = $('#statusBadge');
    const $loading = $('#loadingOverlay');
    const $loadingText = $('#loadingText');
    const $loadingSub = $('#loadingSub');
    const $loadingTimeout = $('#loadingTimeout');
    const $loadingProgressBar = $('#loadingProgressBar');
    const $autoIndicator = $('#autoIndicator');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $replay = $('#replayBtn');
    const $play = $('#playBtn');
    const $cancelLoading = $('#cancelLoadingBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function setStatus(text, type) {
        $statusText.text(text);
        $statusBadge.removeClass('idle speaking error paused waiting loading');
        if (type === 'speaking') $statusBadge.addClass('speaking');
        else if (type === 'error') $statusBadge.addClass('error');
        else if (type === 'paused') $statusBadge.addClass('paused');
        else if (type === 'waiting') $statusBadge.addClass('waiting');
        else if (type === 'loading') $statusBadge.addClass('loading');
        else $statusBadge.addClass('idle');
    }

    function updatePlayButton() {
        if (isPlaying) {
            $play.addClass('playing');
            $play.find('.btn-icon').text('⏸');
            $play.find('.btn-label').text('Pause');
        } else {
            $play.removeClass('playing');
            $play.find('.btn-icon').text('▶');
            $play.find('.btn-label').text('Play');
        }
    }

    function showLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        
        loadingCancelled = false;
        isLoading = true;
        
        // Réinitialiser la barre de progression
        $loadingProgressBar.css('animation', 'none');
        $loadingProgressBar.css('width', '0%');
        // Forcer un reflow
        $loadingProgressBar[0].offsetHeight;
        $loadingProgressBar.css('animation', 'loadingProgress 30s ease-out forwards');
        
        $loadingText.text('Préparation vocale...');
        $loadingSub.text('Synthèse en cours');
        $loadingTimeout.text('⏱️ 30 secondes maximum');
        $loading.fadeIn(300);
        setStatus("⏳ Chargement...", 'loading');
        
        // 🔥 TIMEOUT DE 30 SECONDES
        loadingTimeout = setTimeout(() => {
            if (isLoading && !loadingCancelled) {
                hideLoading();
                setStatus("⚠️ Délai dépassé (30s)", 'error');
                isPlaying = false;
                updatePlayButton();
                $loadingSub.text('La synthèse vocale a pris trop de temps');
                $loadingTimeout.text('❌ Délai dépassé');
            }
        }, 30000);
    }

    function hideLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        isLoading = false;
        loadingCancelled = false;
        $loading.fadeOut(300);
        // Ne pas changer le statut si on est en train de parler
        if (!isSpeaking && !isPlaying) {
            setStatus("⏸ Lecture arrêtée", 'paused');
        }
    }

    function cancelLoading() {
        loadingCancelled = true;
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        hideLoading();
        stopSpeaking();
        setStatus("⏸ Annulé", 'paused');
        isPlaying = false;
        updatePlayButton();
        $loadingText.text('Annulé par l\'utilisateur');
        $loadingSub.text('Vous pouvez réessayer');
        $loadingTimeout.text('✕ Annulation');
    }

    // Arrêter la parole proprement
    function stopSpeaking() {
        try {
            if (synth && (synth.speaking || synth.pending)) {
                synth.cancel();
            }
        } catch(e) {
            console.warn('Erreur stopSpeaking:', e);
        }
        if (currentUtterance) {
            try {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance.onstart = null;
            } catch(e) {}
            currentUtterance = null;
        }
        isSpeaking = false;
        isPlaying = false;
        updatePlayButton();
    }

    // Mettre en pause la parole
    function pauseSpeaking() {
        try {
            if (synth && synth.speaking) {
                synth.pause();
                isPaused = true;
                isPlaying = false;
                setStatus("⏸ Lecture en pause", 'paused');
                updatePlayButton();
            }
        } catch(e) {
            console.warn('Erreur pauseSpeaking:', e);
            stopSpeaking();
        }
    }

    // Reprendre la parole
    function resumeSpeaking() {
        try {
            if (synth && synth.paused) {
                synth.resume();
                isPaused = false;
                isPlaying = true;
                setStatus("🔊 Lecture en cours", 'speaking');
                updatePlayButton();
            } else if (!isSpeaking && !synth.speaking && !synth.pending) {
                speakSlide(currentIndex);
            }
        } catch(e) {
            console.warn('Erreur resumeSpeaking:', e);
            speakSlide(currentIndex);
        }
    }

    function renderSlide(index) {
        const slide = slides[index];
        $title.text(slide.titre);

        let html = '';
        html += `<div class="content-card">${slide.contenu}</div>`;
        if (slide.note) {
            html += `<div class="note-box">${slide.note}</div>`;
        }
        $body.html(html);
        $counter.text(`${index+1} / ${total}`);

        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
        }
    }

    // ================================================================
    // LECTURE VOCALE
    // ================================================================
    function speakSlide(index) {
        return new Promise((resolve) => {
            const slide = slides[index];
            const text = slide.texteParle;
            
            if (!text || text.trim() === '' || !speechSupported) {
                resolve();
                return;
            }

            if (!window.speechSynthesis) {
                setStatus("❌ Synthèse vocale non supportée", 'error');
                speechSupported = false;
                resolve();
                return;
            }

            // Arrêter toute lecture en cours
            stopSpeaking();
            
            // Réinitialiser l'état de pause
            isPaused = false;
            
            showLoading();
            setStatus("Initialisation...", 'loading');

            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.92;
                utterance.pitch = 1.05;
                utterance.volume = 1;

                let isFinished = false;
                let errorHandled = false;

                utterance.onstart = function() {
                    if (loadingCancelled) {
                        stopSpeaking();
                        resolve();
                        return;
                    }
                    hideLoading();
                    isSpeaking = true;
                    isPlaying = true;
                    isPaused = false;
                    setStatus("🔊 Lecture en cours", 'speaking');
                    updatePlayButton();
                };

                utterance.onend = function() {
                    if (isFinished) return;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    setStatus("✅ Terminé", 'idle');
                    hideLoading();
                    updatePlayButton();
                    resolve();
                };

                utterance.onerror = function(e) {
                    if (isFinished || errorHandled) return;
                    errorHandled = true;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    hideLoading();
                    updatePlayButton();
                    
                    if (e.error === 'not-allowed') {
                        setStatus("⚠️ Permission refusée", 'error');
                    } else if (e.error === 'synthesis-unavailable') {
                        setStatus("⚠️ Synthèse indisponible", 'error');
                    } else if (e.error === 'canceled') {
                        setStatus("⏸ Annulé", 'paused');
                    } else {
                        setStatus("❌ Erreur audio: " + (e.error || 'inconnue'), 'error');
                    }
                    
                    resolve();
                };

                // Gestion du chargement des voix
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = function() {
                        if (!loadingCancelled) {
                            try {
                                synth.speak(utterance);
                            } catch(err) {
                                // Silencieux
                            }
                        }
                        synth.onvoiceschanged = null;
                    };
                }

                currentUtterance = utterance;
                
                if (!loadingCancelled) {
                    try {
                        synth.speak(utterance);
                    } catch(err) {
                        setTimeout(() => {
                            if (!loadingCancelled) {
                                try {
                                    synth.speak(utterance);
                                } catch(e) {
                                    setStatus("❌ Erreur de lecture", 'error');
                                    isPlaying = false;
                                    updatePlayButton();
                                    hideLoading();
                                    resolve();
                                }
                            } else {
                                resolve();
                            }
                        }, 100);
                    }
                } else {
                    resolve();
                }

            } catch(err) {
                hideLoading();
                setStatus("❌ Erreur générale", 'error');
                isPlaying = false;
                updatePlayButton();
                console.error('Erreur speakSlide:', err);
                resolve();
            }
        });
    }

    // ================================================================
    // NAVIGATION
    // ================================================================
    async function goToSlide(index) {
        if (isTransitioning) return;
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        
        // Si on est en train de lire, on met en pause avant de naviguer
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        // Arrêter complètement la lecture
        stopSpeaking();
        
        await new Promise(r => setTimeout(r, 50));
        
        if (index === currentIndex) {
            setStatus("📄 Slide actuel", 'idle');
            return;
        }

        isTransitioning = true;
        currentIndex = index;
        renderSlide(index);
        
        // Réinitialiser l'état de lecture
        isPlaying = false;
        updatePlayButton();
        setStatus("⏸ Lecture arrêtée", 'paused');

        await new Promise(r => setTimeout(r, 150));
        isTransitioning = false;
    }

    async function goToNext() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex + 1 < total) {
            await goToSlide(currentIndex + 1);
        } else {
            setStatus("🏁 Dernier slide", 'idle');
        }
    }

    async function goToPrev() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex - 1 >= 0) {
            await goToSlide(currentIndex - 1);
        } else {
            setStatus("🔁 Premier slide", 'idle');
        }
    }

    // ================================================================
    // GESTION PLAY/PAUSE
    // ================================================================
    function togglePlay() {
        if (!userInteracted) {
            userInteracted = true;
        }

        // Si le chargement est en cours, on l'annule
        if (isLoading) {
            cancelLoading();
            return;
        }

        // Si le synthétiseur est en pause, on reprend
        if (synth && synth.paused) {
            resumeSpeaking();
            return;
        }

        // Si la lecture est en cours, on met en pause
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
            return;
        }

        // Sinon, on démarre la lecture du slide courant
        if (!isSpeaking && !isPlaying) {
            stopSpeaking();
            speakSlide(currentIndex);
        }
    }

    // ================================================================
    // INIT
    // ================================================================
    async function init() {
        // Vérifier la compatibilité
        if (!window.speechSynthesis) {
            setStatus("❌ Synthèse vocale non supportée", 'error');
            speechSupported = false;
        }

        // Précharger les voix
        try {
            if (synth.getVoices) {
                synth.getVoices();
                setTimeout(() => {
                    try {
                        synth.getVoices();
                    } catch(e) {}
                }, 200);
            }
        } catch(e) {
            console.warn('Erreur chargement voix:', e);
        }

        // Afficher le premier slide
        renderSlide(0);
        $counter.text(`1 / ${total}`);
        
        // État initial
        setStatus("⏸ Appuie sur Play", 'paused');
        updatePlayButton();
        $autoIndicator.text('⏸ Lecture manuelle');

        // ================================================================
        // ÉVÉNEMENTS
        // ================================================================
        
        // Bouton Play/Pause
        $play.on('click', function() {
            togglePlay();
        });

        // Bouton Annuler le chargement
        $cancelLoading.on('click', function() {
            cancelLoading();
        });

        // Navigation
        $prev.on('click', function() {
            // Si chargement en cours, on annule
            if (isLoading) cancelLoading();
            goToPrev();
        });

        $next.on('click', function() {
            if (isLoading) cancelLoading();
            goToNext();
        });

        // Replay - relire le slide courant
        $replay.on('click', function() {
            if (isLoading) cancelLoading();
            stopSpeaking();
            setTimeout(() => {
                speakSlide(currentIndex);
            }, 100);
        });

        // Support du clavier (espace pour play/pause)
        $(document).on('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });

        // Nettoyage
        $(window).on('beforeunload', function() {
            try {
                if (synth.speaking) synth.cancel();
            } catch(e) {}
            hideLoading();
        });

        // Gérer les cas où la synthèse se termine de manière inattendue
        setInterval(() => {
            if (isPlaying && !synth.speaking && !synth.pending && !isPaused && !isLoading) {
                isPlaying = false;
                updatePlayButton();
                setStatus("⏸ Lecture arrêtée", 'paused');
            }
        }, 1000);
    }

    init();
});



    // ================================================================
    // GESTION DU THÈME JOUR/NUIT
    // ================================================================
    let isDarkMode = false;

    function toggleTheme() {
        isDarkMode = !isDarkMode;
        const body = document.body;
        const appContainer = document.querySelector('.app-container');
        const header = document.querySelector('.slide-header');
        const footer = document.querySelector('.slide-footer');
        const contentCards = document.querySelectorAll('.content-card');
        const noteBoxes = document.querySelectorAll('.note-box');
        const mathBlocks = document.querySelectorAll('.math-block');
        const buttons = document.querySelectorAll('.btn');
        const statusBadge = document.querySelector('.status-badge');
        const slideCounter = document.querySelector('.slide-counter');
        const autoIndicator = document.querySelector('.auto-indicator');
        const themeBtn = document.getElementById('themeToggle');

        if (isDarkMode) {
            // Mode nuit
            body.style.background = '#0b1120';
            body.style.color = '#f1f5f9';
            appContainer.style.background = 'linear-gradient(145deg, #0f172a 0%, #1e293b 100%)';
            header.style.background = 'rgba(15, 23, 42, 0.85)';
            footer.style.background = 'rgba(15, 23, 42, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.05)';
                card.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.08)';
                note.style.color = '#cbd5e1';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.25)';
                block.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#e2e8f0';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.12)';
                statusBadge.style.color = '#93bbfc';
            }
            if (slideCounter) {
                slideCounter.style.color = '#94a3b8';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#64748b';
            }
            if (themeBtn) {
                themeBtn.textContent = '☀️';
                themeBtn.title = 'Passer en mode jour';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#e2e8f0';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#e2e8f0';
                }
            });
        } else {
            // Mode jour (par défaut)
            body.style.background = '#f0f4f8';
            body.style.color = '#1a202c';
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
            header.style.background = 'rgba(255, 255, 255, 0.85)';
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.8)';
                card.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.12)';
                note.style.color = '#2c3e50';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.05)';
                block.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#2d3748';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
                statusBadge.style.color = '#2b6cb0';
            }
            if (slideCounter) {
                slideCounter.style.color = '#4a5568';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#718096';
            }
            if (themeBtn) {
                themeBtn.textContent = '🌓';
                themeBtn.title = 'Passer en mode nuit';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#2c3e50';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#2d3748';
                }
            });
        }
    }

    // Initialiser en mode jour
    document.addEventListener('DOMContentLoaded', function() {
        // Appliquer le mode jour par défaut
        const body = document.body;
        body.style.background = '#f0f4f8';
        body.style.color = '#1a202c';
        
        const appContainer = document.querySelector('.app-container');
        if (appContainer) {
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
        }
        
        const header = document.querySelector('.slide-header');
        if (header) {
            header.style.background = 'rgba(255, 255, 255, 0.85)';
        }
        
        const footer = document.querySelector('.slide-footer');
        if (footer) {
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
        }
        
        document.querySelectorAll('.content-card').forEach(card => {
            card.style.background = 'rgba(255,255,255,0.8)';
            card.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.note-box').forEach(note => {
            note.style.background = 'rgba(96, 165, 250, 0.12)';
            note.style.color = '#2c3e50';
        });
        
        document.querySelectorAll('.math-block').forEach(block => {
            block.style.background = 'rgba(0,0,0,0.05)';
            block.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.btn').forEach(btn => {
            btn.style.color = '#2d3748';
        });
        
        const statusBadge = document.querySelector('.status-badge');
        if (statusBadge) {
            statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
            statusBadge.style.color = '#2b6cb0';
        }
        
        const slideCounter = document.querySelector('.slide-counter');
        if (slideCounter) {
            slideCounter.style.color = '#4a5568';
        }
        
        const autoIndicator = document.querySelector('.auto-indicator');
        if (autoIndicator) {
            autoIndicator.style.color = '#718096';
        }
        
        document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
            if (!el.closest('.note-box')) {
                el.style.color = '#2c3e50';
            }
        });
        
        document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
            if (!el.closest('.note-box') && !el.closest('.math-block')) {
                el.style.color = '#2d3748';
            }
        });
        
        const themeBtn = document.getElementById('themeToggle');
        if (themeBtn) {
            themeBtn.textContent = '🌓';
            themeBtn.title = 'Passer en mode nuit';
        }
    });
</script>
