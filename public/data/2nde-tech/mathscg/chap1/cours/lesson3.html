<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Présentation mobile</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' },
            options: { skipHtmlTypes: 'script' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 500px;
        margin: 0 auto;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    .slide-header {
        flex-shrink: 0;
        padding: 18px 16px 10px 16px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        z-index: 10;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .slide-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
    }

    .content-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 18px 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        flex-shrink: 0;
    }

    .content-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .content-card li {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        line-height: 1.5;
    }

    .content-card li:last-child {
        border-bottom: none;
    }

    .bullet-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
    }

    .math-block {
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        overflow-x: auto;
        flex-shrink: 0;
        margin: 4px 0;
    }

    .math-block .math {
        font-size: 1.2rem;
        color: #e2e8f0;
    }

    .note-box {
        background: rgba(96, 165, 250, 0.08);
        border-left: 4px solid #60a5fa;
        padding: 12px 16px;
        border-radius: 12px;
        font-style: italic;
        font-size: 0.9rem;
        color: #cbd5e1;
        flex-shrink: 0;
    }

    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        border-radius: 0;
        flex-direction: column;
    }

    .loading-card {
        background: #1e293b;
        padding: 32px 28px;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #334155;
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px auto;
    }

    .loading-text {
        font-weight: 600;
        font-size: 1.1rem;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    .loading-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 16px;
    }
    .loading-progress {
        height: 3px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        animation: loadingProgress 30s ease-out forwards;
    }

    .loading-timeout {
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 12px;
    }

    .btn-cancel-loading {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 40px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #f87171;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }

    .btn-cancel-loading:active {
        transform: scale(0.94);
        background: rgba(239, 68, 68, 0.25);
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
    }

    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .slide-counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255,255,255,0.05);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(255,255,255,0.04);
    }

    .status-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 30px;
        background: rgba(96, 165, 250, 0.12);
        color: #93bbfc;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
    }

    .status-badge .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: pulse-dot 1.2s infinite;
        flex-shrink: 0;
    }

    .status-badge.idle .dot {
        animation: none;
        background: #64748b;
    }
    .status-badge.speaking .dot {
        background: #34d399;
        animation: pulse-dot 0.8s infinite;
    }
    .status-badge.error .dot {
        background: #f87171;
        animation: none;
    }
    .status-badge.paused .dot {
        animation: none;
        background: #fbbf24;
    }
    .status-badge.waiting .dot {
        animation: pulse-dot 1.5s infinite;
        background: #fbbf24;
    }
    .status-badge.loading .dot {
        animation: pulse-dot 0.5s infinite;
        background: #60a5fa;
    }

    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.7); }
    }

    .footer-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(255,255,255,0.1);
    }

    .btn-secondary {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-play {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
        min-width: 80px;
        justify-content: center;
    }
    .btn-play:active {
        background: rgba(52, 211, 153, 0.25);
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
    }

    .auto-indicator {
        font-size: 0.65rem;
        color: #64748b;
        text-align: center;
        letter-spacing: 0.3px;
        padding: 2px 0;
    }

    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.2rem;
        }
        .content-card li {
            font-size: 0.9rem;
            padding: 8px 0;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .btn-play {
            min-width: 60px;
        }
        .footer-buttons {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
        .loading-card {
            padding: 20px 16px;
        }
        .math-block .math {
            font-size: 1rem;
        }
    }

    @media (min-width: 600px) {
        .app-container {
            max-width: 480px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
        .loading-overlay {
            border-radius: 32px;
        }
    }

    /* Mode jour (par défaut) */
    html, body {
        background: #f0f4f8 !important;
        color: #1a202c !important;
    }
    .app-container {
        background: linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%) !important;
    }
    .slide-header {
        background: rgba(255, 255, 255, 0.85) !important;
        border-bottom: 1px solid rgba(0,0,0,0.08) !important;
    }
    .slide-header h1 {
        background: linear-gradient(135deg, #2b6cb0, #6b46c1) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        background-clip: text !important;
    }
    .slide-footer {
        background: rgba(255, 255, 255, 0.9) !important;
        border-top: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card {
        background: rgba(255,255,255,0.8) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card li {
        border-bottom: 1px solid rgba(0,0,0,0.05) !important;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.12) !important;
        border-left: 4px solid #4299e1 !important;
        color: #2c3e50 !important;
    }
    .math-block {
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .math-block .math {
        color: #2d3748 !important;
    }
    .slide-counter {
        color: #4a5568 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .status-badge {
        background: rgba(96, 165, 250, 0.15) !important;
        color: #2b6cb0 !important;
        border: 1px solid rgba(96, 165, 250, 0.15) !important;
    }
    .btn {
        color: #2d3748 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .btn-secondary {
        background: rgba(0,0,0,0.04) !important;
        border-color: rgba(0,0,0,0.08) !important;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15) !important;
        border-color: rgba(52, 211, 153, 0.2) !important;
        color: #38a169 !important;
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15) !important;
        border-color: rgba(251, 191, 36, 0.2) !important;
        color: #d69e2e !important;
    }
    .auto-indicator {
        color: #718096 !important;
    }
    .loading-card {
        background: #ffffff !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .loading-text {
        color: #1a202c !important;
    }
    .loading-sub {
        color: #4a5568 !important;
    }
</style>
</head>
<body>

<div class="app-container">

    <header class="slide-header">
        <h1 id="slideTitle">Chargement...</h1>
    </header>

    <main class="slide-body" id="slideBody"></main>

    <!-- LOADING OVERLAY AVEC BOUTON ANNULER -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Préparation vocale...</div>
            <div class="loading-sub" id="loadingSub">Synthèse en cours</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loadingProgressBar"></div>
            </div>
            <div class="loading-timeout" id="loadingTimeout">⏱️ 30 secondes maximum</div>
            <button class="btn-cancel-loading" id="cancelLoadingBtn">
                <span>✕</span> Annuler
            </button>
        </div>
    </div>

    <footer class="slide-footer">
        <div class="footer-top">
            <span class="slide-counter" id="slideCounter">1 / 3</span>
            <span class="status-badge idle" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">Prêt</span>
            </span>
        </div>

        <div class="footer-buttons">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-secondary" id="replayBtn">
                <span class="btn-icon">🔁</span> <span class="btn-label">Relire</span>
            </button>
            <button class="btn btn-play" id="playBtn">
                <span class="btn-icon">▶</span> <span class="btn-label">Play</span>
            </button>
        </div>

        <div class="auto-indicator" id="autoIndicator">⏸ Lecture manuelle</div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // SLIDES
    // ================================================================
   const slides = [
  {
    "titre": "Comparaison des nombres réels : vue d'ensemble",
    "contenu": "<div style='background-color: #E8EAF6; padding: 20px; border-radius: 10px; color: #1A237E;'><h3 style='margin-top: 0;'>Comment comparer deux nombres réels ?</h3><p>Pour comparer deux nombres réels a et b, on dispose de <strong>trois méthodes</strong> principales :</p><ul style='text-align: left; list-style-type: disc; padding-left: 20px; font-size: 1rem;'><li><strong>Étude du signe de la différence</strong> : on étudie le signe de a − b.</li><li><strong>Différence des carrés</strong> : pour des nombres positifs, on compare a² et b².</li><li><strong>Comparaison du quotient à 1</strong> : pour des nombres positifs, on compare a/b à 1.</li></ul></div><div style='background-color: #FFF3E0; padding: 15px; border-radius: 8px; margin-top: 10px; color: #E65100;'><h4 style='margin-top: 0;'>Pourquoi plusieurs méthodes ?</h4><p>Selon la forme des nombres (fractions, radicaux, expressions avec inconnues), une méthode peut être plus simple qu'une autre. Il faut choisir la plus adaptée.</p></div>",
    "texteParle": "Dans cette leçon, nous allons voir comment comparer deux nombres réels. Il existe trois méthodes principales. La première consiste à étudier le signe de la différence : on calcule a moins b et on regarde si le résultat est positif, négatif ou nul. La deuxième méthode utilise la différence des carrés : pour des nombres positifs, comparer a et b revient à comparer leurs carrés. La troisième méthode consiste à calculer le quotient a sur b et à le comparer à 1. Selon la forme des nombres, une méthode sera plus simple qu'une autre. Nous allons voir comment choisir la méthode adaptée.",
    "note": "Trois méthodes : différence, carrés, quotient."
  },
  {
    "titre": "Méthode 1 : signe de la différence",
    "contenu": "<div style='background-color: #E3F2FD; padding: 20px; border-radius: 10px; color: #0D47A1;'><h3 style='margin-top: 0;'>Étude du signe de a − b</h3><p>Pour comparer a et b, on étudie le signe de <span class='math'>\\( a - b \\)</span> :</p><ul style='text-align: left; list-style-type: disc; padding-left: 20px; font-size: 1rem;'><li>Si <span class='math'>\\( a - b > 0 \\)</span> alors <span class='math'>\\( a > b \\)</span></li><li>Si <span class='math'>\\( a - b < 0 \\)</span> alors <span class='math'>\\( a < b \\)</span></li><li>Si <span class='math'>\\( a - b = 0 \\)</span> alors <span class='math'>\\( a = b \\)</span></li></ul></div><div style='background-color: #FFF3E0; padding: 15px; border-radius: 8px; margin-top: 10px; color: #E65100;'><h4 style='margin-top: 0;'>Exemple simple</h4><p>Comparer <span class='math'>\\( \\frac{3}{4} \\)</span> et <span class='math'>\\( \\frac{2}{3} \\)</span></p><p><span class='math'>\\( \\frac{3}{4} - \\frac{2}{3} = \\frac{9 - 8}{12} = \\frac{1}{12} > 0 \\)</span></p><p>Donc <span class='math'>\\( \\frac{3}{4} > \\frac{2}{3} \\)</span></p></div><div style='background-color: #E8F5E9; padding: 15px; border-radius: 8px; margin-top: 10px; color: #1B5E20;'><h4 style='margin-top: 0;'>Exemple avec radicaux</h4><p>Comparer <span class='math'>\\( \\sqrt{5} - 1 \\)</span> et <span class='math'>\\( \\sqrt{3} \\)</span></p><p><span class='math'>\\( (\\sqrt{5} - 1) - \\sqrt{3} = \\sqrt{5} - \\sqrt{3} - 1 \\)</span></p><p>Or <span class='math'>\\( \\sqrt{5} - \\sqrt{3} \\approx 2,236 - 1,732 = 0,504 \\)</span></p><p>Donc <span class='math'>\\( \\sqrt{5} - \\sqrt{3} - 1 \\approx -0,496 < 0 \\)</span></p><p>Donc <span class='math'>\\( \\sqrt{5} - 1 < \\sqrt{3} \\)</span></p></div>",
    "texteParle": "La première méthode est l'étude du signe de la différence. Pour comparer a et b, on calcule a moins b. Si le résultat est positif, alors a est plus grand que b. Si le résultat est négatif, alors a est plus petit que b. Si le résultat est nul, alors a égale b. Par exemple, pour comparer 3 quarts et 2 tiers, on calcule 3 quarts moins 2 tiers, ce qui donne 9 douzièmes moins 8 douzièmes, soit 1 douzième, qui est positif. Donc 3 quarts est plus grand que 2 tiers. Pour des radicaux, c'est parfois moins évident. Par exemple, pour comparer racine de 5 moins 1 et racine de 3, on calcule la différence. On peut estimer que racine de 5 moins racine de 3 vaut environ 0,504, donc la différence vaut environ moins 0,496, ce qui est négatif. Donc racine de 5 moins 1 est plus petit que racine de 3.",
    "note": "La méthode la plus générale : étudier le signe de a − b."
  },
  {
    "titre": "Méthode 2 : différence des carrés",
    "contenu": "<div style='background-color: #F3E5F5; padding: 20px; border-radius: 10px; color: #4A148C;'><h3 style='margin-top: 0;'>Comparaison par les carrés</h3><p>Pour <span class='math'>\\( a > 0 \\)</span> et <span class='math'>\\( b > 0 \\)</span> :</p><div class='math-block'><div class='math'>$$ a > b \\iff a^2 > b^2 $$</div></div><p><strong>Condition :</strong> les deux nombres doivent être <strong>positifs</strong>.</p></div><div style='background-color: #FFF3E0; padding: 15px; border-radius: 8px; margin-top: 10px; color: #E65100;'><h4 style='margin-top: 0;'>Exemple avec radicaux</h4><p>Comparer <span class='math'>\\( \\sqrt{7} \\)</span> et <span class='math'>\\( \\sqrt{5} + 1 \\)</span></p><p>Les deux nombres sont positifs. On compare leurs carrés :</p><p><span class='math'>\\( (\\sqrt{7})^2 = 7 \\)</span></p><p><span class='math'>\\( (\\sqrt{5} + 1)^2 = 5 + 2\\sqrt{5} + 1 = 6 + 2\\sqrt{5} \\)</span></p><p>Or <span class='math'>\\( 2\\sqrt{5} \\approx 4,47 \\)</span>, donc <span class='math'>\\( 6 + 2\\sqrt{5} \\approx 10,47 > 7 \\)</span></p><p>Donc <span class='math'>\\( \\sqrt{7} < \\sqrt{5} + 1 \\)</span></p></div><div style='background-color: #E8F5E9; padding: 15px; border-radius: 8px; margin-top: 10px; color: #1B5E20;'><h4 style='margin-top: 0;'>Exemple avec fractions</h4><p>Comparer <span class='math'>\\( \\frac{2}{3} \\)</span> et <span class='math'>\\( \\frac{3}{5} \\)</span></p><p><span class='math'>\\( \\left(\\frac{2}{3}\\right)^2 = \\frac{4}{9} \\)</span> et <span class='math'>\\( \\left(\\frac{3}{5}\\right)^2 = \\frac{9}{25} \\)</span></p><p><span class='math'>\\( \\frac{4}{9} = \\frac{100}{225} \\)</span> et <span class='math'>\\( \\frac{9}{25} = \\frac{81}{225} \\)</span></p><p>Donc <span class='math'>\\( \\frac{4}{9} > \\frac{9}{25} \\)</span>, donc <span class='math'>\\( \\frac{2}{3} > \\frac{3}{5} \\)</span></p></div>",
    "texteParle": "La deuxième méthode est la différence des carrés. Elle est valable pour des nombres positifs. Si a et b sont positifs, alors a est plus grand que b si et seulement si a au carré est plus grand que b au carré. Par exemple, pour comparer racine de 7 et racine de 5 plus 1, les deux nombres sont positifs. On compare leurs carrés. Le carré de racine de 7 est 7. Le carré de racine de 5 plus 1 est 5 plus 2 racine de 5 plus 1, soit 6 plus 2 racine de 5. Comme 2 racine de 5 vaut environ 4,47, le carré vaut environ 10,47, ce qui est plus grand que 7. Donc racine de 7 est plus petit que racine de 5 plus 1. Cette méthode fonctionne aussi avec les fractions. Par exemple, pour comparer 2 tiers et 3 cinquièmes, on compare leurs carrés : 4 neuvièmes et 9 vingt-cinquièmes. En mettant au même dénominateur, 4 neuvièmes égale 100 sur 225, et 9 vingt-cinquièmes égale 81 sur 225. Donc 2 tiers est plus grand que 3 cinquièmes.",
    "note": "Valable uniquement pour des nombres positifs."
  },
  {
    "titre": "Méthode 3 : comparaison du quotient à 1",
    "contenu": "<div style='background-color: #E0F7FA; padding: 20px; border-radius: 10px; color: #006064;'><h3 style='margin-top: 0;'>Comparaison du quotient a/b à 1</h3><p>Pour <span class='math'>\\( b > 0 \\)</span> :</p><div class='math-block'><div class='math'>$$ \\frac{a}{b} > 1 \\iff a > b $$</div></div><p><strong>Condition :</strong> le dénominateur b doit être <strong>positif</strong>.</p></div><div style='background-color: #FFF3E0; padding: 15px; border-radius: 8px; margin-top: 10px; color: #E65100;'><h4 style='margin-top: 0;'>Exemple avec fractions</h4><p>Comparer <span class='math'>\\( \\frac{7}{5} \\)</span> et <span class='math'>\\( \\frac{4}{3} \\)</span></p><p><span class='math'>\\( \\frac{7/5}{4/3} = \\frac{7}{5} \\times \\frac{3}{4} = \\frac{21}{20} > 1 \\)</span></p><p>Donc <span class='math'>\\( \\frac{7}{5} > \\frac{4}{3} \\)</span></p></div><div style='background-color: #E8F5E9; padding: 15px; border-radius: 8px; margin-top: 10px; color: #1B5E20;'><h4 style='margin-top: 0;'>Exemple avec radicaux</h4><p>Comparer <span class='math'>\\( \\frac{\\sqrt{5}}{2} \\)</span> et <span class='math'>\\( \\frac{\\sqrt{3}}{1} \\)</span> (ou <span class='math'>\\( \\sqrt{3} \\)</span>)</p><p>On compare <span class='math'>\\( \\frac{\\sqrt{5}/2}{\\sqrt{3}} = \\frac{\\sqrt{5}}{2\\sqrt{3}} = \\frac{\\sqrt{5}}{\\sqrt{12}} = \\sqrt{\\frac{5}{12}} \\)</span></p><p>Or <span class='math'>\\( \\frac{5}{12} < 1 \\)</span>, donc <span class='math'>\\( \\sqrt{\\frac{5}{12}} < 1 \\)</span></p><p>Donc <span class='math'>\\( \\frac{\\sqrt{5}}{2} < \\sqrt{3} \\)</span></p></div>",
    "texteParle": "La troisième méthode consiste à comparer le quotient a sur b à 1. Si b est positif, alors a sur b est plus grand que 1 si et seulement si a est plus grand que b. Par exemple, pour comparer 7 cinquièmes et 4 tiers, on calcule le quotient : 7 cinquièmes divisé par 4 tiers égale 7 cinquièmes fois 3 quarts, soit 21 vingtièmes, qui est plus grand que 1. Donc 7 cinquièmes est plus grand que 4 tiers. Cette méthode fonctionne aussi avec les radicaux. Par exemple, pour comparer racine de 5 sur 2 et racine de 3, on calcule le quotient : racine de 5 sur 2 divisé par racine de 3 égale racine de 5 sur 2 racine de 3, ce qui égale racine de 5 douzièmes. Comme 5 douzièmes est plus petit que 1, le quotient est plus petit que 1. Donc racine de 5 sur 2 est plus petit que racine de 3.",
    "note": "Valable si le dénominateur est positif."
  },
  {
    "titre": "Comparaison avec des inconnues (entiers naturels)",
    "contenu": "<div style='background-color: #E8F5E9; padding: 20px; border-radius: 10px; color: #1B5E20;'><h3 style='margin-top: 0;'>Comparer des expressions avec n ∈ N</h3><p><strong>Exemple :</strong> Comparer <span class='math'>\\( 2n + 1 \\)</span> et <span class='math'>\\( n + 10 \\)</span> pour <span class='math'>\\( n \\in \\mathbb{N} \\)</span>.</p><p><strong>Méthode :</strong> on étudie le signe de la différence.</p><div class='math-block'><div class='math'>$$ (2n + 1) - (n + 10) = 2n + 1 - n - 10 = n - 9 $$</div></div><p>On étudie le signe de <span class='math'>\\( n - 9 \\)</span> :</p><ul style='text-align: left; list-style-type: disc; padding-left: 20px; font-size: 1rem;'><li>Si <span class='math'>\\( n > 9 \\)</span> : <span class='math'>\\( n - 9 > 0 \\)</span>, donc <span class='math'>\\( 2n + 1 > n + 10 \\)</span></li><li>Si <span class='math'>\\( n = 9 \\)</span> : <span class='math'>\\( n - 9 = 0 \\)</span>, donc <span class='math'>\\( 2n + 1 = n + 10 \\)</span></li><li>Si <span class='math'>\\( n < 9 \\)</span> : <span class='math'>\\( n - 9 < 0 \\)</span>, donc <span class='math'>\\( 2n + 1 < n + 10 \\)</span></li></ul></div><div style='background-color: #FFF3E0; padding: 15px; border-radius: 8px; margin-top: 10px; color: #E65100;'><h4 style='margin-top: 0;'>Conclusion</h4><p>La comparaison dépend de la valeur de n. Il faut donc discuter selon les cas.</p></div>",
    "texteParle": "Voyons maintenant comment comparer des expressions contenant une inconnue. Par exemple, sachant que n est un entier naturel, on veut comparer 2n plus 1 et n plus 10. On étudie le signe de la différence : 2n plus 1 moins n plus 10 égale n moins 9. On étudie le signe de n moins 9. Si n est plus grand que 9, alors n moins 9 est positif, donc 2n plus 1 est plus grand que n plus 10. Si n égale 9, les deux expressions sont égales. Si n est plus petit que 9, alors n moins 9 est négatif, donc 2n plus 1 est plus petit que n plus 10. La comparaison dépend donc de la valeur de n. Il faut discuter selon les cas.",
    "note": "Toujours discuter selon les valeurs possibles de l'inconnue."
  },
  {
    "titre": "Comparaison avec radicaux et inconnues",
    "contenu": "<div style='background-color: #E3F2FD; padding: 20px; border-radius: 10px; color: #0D47A1;'><h3 style='margin-top: 0;'>Comparer des expressions avec radicaux et inconnues</h3><p><strong>Exemple :</strong> Sachant que <span class='math'>\\( x > y > 0 \\)</span>, comparer <span class='math'>\\( \\sqrt{x} \\)</span> et <span class='math'>\\( \\sqrt{y} \\)</span>.</p><p><strong>Méthode :</strong> on utilise la différence des carrés.</p><p>Les deux nombres sont positifs. On compare leurs carrés :</p><div class='math-block'><div class='math'>$$ (\\sqrt{x})^2 = x \\quad \\text{et} \\quad (\\sqrt{y})^2 = y $$</div></div><p>Or <span class='math'>\\( x > y \\)</span>, donc <span class='math'>\\( (\\sqrt{x})^2 > (\\sqrt{y})^2 \\)</span>.</p><p>Comme les deux nombres sont positifs, on en déduit :</p><div class='math-block'><div class='math'>$$ \\sqrt{x} > \\sqrt{y} $$</div></div></div><div style='background-color: #FFF8E1; padding: 15px; border-radius: 8px; margin-top: 10px; color: #E65100;'><h4 style='margin-top: 0;'>Propriété importante</h4><p>La fonction racine carrée est <strong>croissante</strong> sur <span class='math'>\\( [0, +\\infty[ \\)</span> :</p><p><span class='math'>\\( 0 \\le a \\le b \\iff \\sqrt{a} \\le \\sqrt{b} \\)</span></p></div><div style='background-color: #E8F5E9; padding: 15px; border-radius: 8px; margin-top: 10px; color: #1B5E20;'><h4 style='margin-top: 0;'>Autre exemple</h4><p>Sachant que <span class='math'>\\( x > 1 \\)</span>, comparer <span class='math'>\\( \\sqrt{x} \\)</span> et <span class='math'>\\( 1 \\)</span>.</p><p><span class='math'>\\( (\\sqrt{x})^2 = x > 1 = 1^2 \\)</span>, donc <span class='math'>\\( \\sqrt{x} > 1 \\)</span>.</p></div>",
    "texteParle": "Voyons maintenant comment comparer des expressions avec des radicaux et des inconnues. Par exemple, sachant que x est plus grand que y, et que y est positif, on veut comparer racine de x et racine de y. Les deux nombres sont positifs. On compare leurs carrés : le carré de racine de x est x, et le carré de racine de y est y. Comme x est plus grand que y, on a x plus grand que y, donc racine de x est plus grand que racine de y. C'est une propriété importante : la fonction racine carrée est croissante sur les nombres positifs. Autre exemple : sachant que x est plus grand que 1, on veut comparer racine de x et 1. Le carré de racine de x est x, qui est plus grand que 1, qui est le carré de 1. Donc racine de x est plus grand que 1.",
    "note": "La fonction racine carrée est croissante sur [0, +∞[."
  },
  {
    "titre": "Comparaison de fractions complexes",
    "contenu": "<div style='background-color: #FCE4EC; padding: 20px; border-radius: 10px; color: #880E4F;'><h3 style='margin-top: 0;'>Comparer deux fractions complexes</h3><p><strong>Exemple :</strong> Comparer <span class='math'>\\( \\frac{2n+1}{n+3} \\)</span> et <span class='math'>\\( \\frac{2n+5}{n+4} \\)</span> pour <span class='math'>\\( n \\in \\mathbb{N} \\)</span>.</p><p><strong>Méthode :</strong> on étudie le signe de la différence.</p><div class='math-block'><div class='math'>$$ \\frac{2n+1}{n+3} - \\frac{2n+5}{n+4} = \\frac{(2n+1)(n+4) - (2n+5)(n+3)}{(n+3)(n+4)} $$</div></div><p>Calculons le numérateur :</p><p><span class='math'>\\( (2n+1)(n+4) = 2n^2 + 8n + n + 4 = 2n^2 + 9n + 4 \\)</span></p><p><span class='math'>\\( (2n+5)(n+3) = 2n^2 + 6n + 5n + 15 = 2n^2 + 11n + 15 \\)</span></p><p>Différence : <span class='math'>\\( (2n^2 + 9n + 4) - (2n^2 + 11n + 15) = -2n - 11 \\)</span></p><p>Le dénominateur <span class='math'>\\( (n+3)(n+4) > 0 \\)</span> pour <span class='math'>\\( n \\in \\mathbb{N} \\)</span>.</p><p>Or <span class='math'>\\( -2n - 11 < 0 \\)</span> pour tout <span class='math'>\\( n \\in \\mathbb{N} \\)</span>.</p><p>Donc <span class='math'>\\( \\frac{2n+1}{n+3} < \\frac{2n+5}{n+4} \\)</span>.</p></div><div style='background-color: #E8F5E9; padding: 15px; border-radius: 8px; margin-top: 10px; color: #1B5E20;'><h4 style='margin-top: 0;'>Astuce</h4><p>Pour comparer deux fractions, on peut aussi comparer les produits en croix (si les dénominateurs sont positifs) :</p><p><span class='math'>\\( \\frac{a}{b} < \\frac{c}{d} \\iff ad < bc \\)</span> (pour b, d > 0)</p></div>",
    "texteParle": "Voyons maintenant comment comparer deux fractions complexes. Par exemple, comparer 2n plus 1 sur n plus 3 et 2n plus 5 sur n plus 4, pour n un entier naturel. On étudie le signe de la différence. On met au même dénominateur : le dénominateur commun est n plus 3 fois n plus 4, qui est positif pour n entier naturel. Le numérateur est 2n plus 1 fois n plus 4 moins 2n plus 5 fois n plus 3. En développant, on obtient 2n au carré plus 9n plus 4 moins 2n au carré plus 11n plus 15, ce qui donne moins 2n moins 11. Ce numérateur est toujours négatif pour n entier naturel. Donc la première fraction est plus petite que la seconde. Une astuce : pour comparer deux fractions, on peut aussi comparer les produits en croix, à condition que les dénominateurs soient positifs.",
    "note": "Comparer les produits en croix si les dénominateurs sont positifs."
  },
  {
    "titre": "Comparaison avec racines et inconnues (cas avancé)",
    "contenu": "<div style='background-color: #F3E5F5; padding: 20px; border-radius: 10px; color: #4A148C;'><h3 style='margin-top: 0;'>Comparer des expressions avec racines et inconnues</h3><p><strong>Exemple :</strong> Sachant que <span class='math'>\\( x > y > 0 \\)</span>, comparer <span class='math'>\\( \\sqrt{x} - \\sqrt{y} \\)</span> et <span class='math'>\\( \\sqrt{x - y} \\)</span>.</p><p><strong>Méthode :</strong> on compare leurs carrés (les deux expressions sont positives).</p><div class='math-block'><div class='math'>$$ (\\sqrt{x} - \\sqrt{y})^2 = x - 2\\sqrt{xy} + y $$</div></div><div class='math-block'><div class='math'>$$ (\\sqrt{x - y})^2 = x - y $$</div></div><p>On compare :</p><p><span class='math'>\\( (x - 2\\sqrt{xy} + y) - (x - y) = -2\\sqrt{xy} + 2y = 2y - 2\\sqrt{xy} = 2\\sqrt{y}(\\sqrt{y} - \\sqrt{x}) \\)</span></p><p>Or <span class='math'>\\( x > y \\)</span>, donc <span class='math'>\\( \\sqrt{x} > \\sqrt{y} \\)</span>, donc <span class='math'>\\( \\sqrt{y} - \\sqrt{x} < 0 \\)</span>.</p><p>Donc <span class='math'>\\( (\\sqrt{x} - \\sqrt{y})^2 < (\\sqrt{x - y})^2 \\)</span>.</p><p>Comme les deux expressions sont positives :</p><div class='math-block'><div class='math'>$$ \\sqrt{x} - \\sqrt{y} < \\sqrt{x - y} $$</div></div></div><div style='background-color: #FFF3E0; padding: 15px; border-radius: 8px; margin-top: 10px; color: #E65100;'><h4 style='margin-top: 0;'>Conclusion</h4><p>Pour <span class='math'>\\( x > y > 0 \\)</span> : <span class='math'>\\( \\sqrt{x} - \\sqrt{y} < \\sqrt{x - y} \\)</span>.</p><p>Ce résultat est contre-intuitif mais important.</p></div>",
    "texteParle": "Terminons par un cas avancé de comparaison avec des racines et des inconnues. Sachant que x est plus grand que y, et que y est positif, on veut comparer racine de x moins racine de y et racine de x moins y. Les deux expressions sont positives, donc on peut comparer leurs carrés. Le carré de racine de x moins racine de y est x moins 2 racine de xy plus y. Le carré de racine de x moins y est x moins y. On calcule la différence : x moins 2 racine de xy plus y moins x moins y égale moins 2 racine de xy plus 2y, ce qui égale 2 racine de y fois racine de y moins racine de x. Comme x est plus grand que y, racine de x est plus grand que racine de y, donc racine de y moins racine de x est négatif. Donc le premier carré est plus petit que le second. Comme les deux expressions sont positives, on en déduit que racine de x moins racine de y est plus petit que racine de x moins y. Ce résultat est contre-intuitif mais important à retenir.",
    "note": "√x − √y < √(x−y) pour x > y > 0."
  },
  {
    "titre": "En résumé : comparaison des réels",
    "contenu": "<div style='background-color: #BBDEFB; padding: 20px; border-radius: 10px; text-align: center; color: #0D47A1;'><h3 style='margin-top: 0;'>Ce qu'il faut retenir</h3><ul style='text-align: left; list-style-type: disc; padding-left: 20px; font-size: 1rem;'><li><strong>Méthode 1 :</strong> signe de la différence <span class='math'>\\( a - b \\)</span> — la plus générale.</li><li><strong>Méthode 2 :</strong> différence des carrés — pour des nombres <strong>positifs</strong>.</li><li><strong>Méthode 3 :</strong> quotient à 1 — pour des nombres <strong>positifs</strong> avec dénominateur positif.</li><li><strong>Avec inconnues :</strong> discuter selon les valeurs (cas n > 9, n = 9, n < 9).</li><li><strong>Avec radicaux :</strong> la fonction racine est croissante sur <span class='math'>\\( [0, +\\infty[ \\)</span>.</li><li><strong>Fractions :</strong> produits en croix si dénominateurs positifs.</li><li><strong>Résultat clé :</strong> <span class='math'>\\( \\sqrt{x} - \\sqrt{y} < \\sqrt{x - y} \\)</span> pour <span class='math'>\\( x > y > 0 \\)</span>.</li></ul></div>",
    "texteParle": "Pour conclure cette leçon sur la comparaison des nombres réels, retenons les points essentiels. Il existe trois méthodes : l'étude du signe de la différence, qui est la plus générale ; la différence des carrés, valable pour des nombres positifs ; et la comparaison du quotient à 1, valable pour des nombres positifs avec un dénominateur positif. Lorsqu'il y a des inconnues, il faut discuter selon les valeurs, comme dans l'exemple n plus grand que 9, n égale 9, ou n plus petit que 9. Avec les radicaux, on utilise la croissance de la fonction racine carrée sur les nombres positifs. Pour les fractions, on peut comparer les produits en croix si les dénominateurs sont positifs. Enfin, retenez le résultat clé : racine de x moins racine de y est plus petit que racine de x moins y, pour x plus grand que y plus grand que zéro. Ces techniques vous permettront de comparer n'importe quels nombres réels.",
    "note": "Choisir la méthode adaptée à la forme des nombres."
  }
];
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentIndex = 0;
    let isSpeaking = false;
    let isPaused = false;
    let currentUtterance = null;
    let isLoading = false;
    let loadingTimeout = null;
    let isTransitioning = false;
    let speechSupported = true;
    let userInteracted = false;
    let isPlaying = false;
    let loadingCancelled = false;

    const total = slides.length;
    const synth = window.speechSynthesis;

    // Références jQuery
    const $title = $('#slideTitle');
    const $body = $('#slideBody');
    const $counter = $('#slideCounter');
    const $statusText = $('#statusText');
    const $statusBadge = $('#statusBadge');
    const $loading = $('#loadingOverlay');
    const $loadingText = $('#loadingText');
    const $loadingSub = $('#loadingSub');
    const $loadingTimeout = $('#loadingTimeout');
    const $loadingProgressBar = $('#loadingProgressBar');
    const $autoIndicator = $('#autoIndicator');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $replay = $('#replayBtn');
    const $play = $('#playBtn');
    const $cancelLoading = $('#cancelLoadingBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function setStatus(text, type) {
        $statusText.text(text);
        $statusBadge.removeClass('idle speaking error paused waiting loading');
        if (type === 'speaking') $statusBadge.addClass('speaking');
        else if (type === 'error') $statusBadge.addClass('error');
        else if (type === 'paused') $statusBadge.addClass('paused');
        else if (type === 'waiting') $statusBadge.addClass('waiting');
        else if (type === 'loading') $statusBadge.addClass('loading');
        else $statusBadge.addClass('idle');
    }

    function updatePlayButton() {
        if (isPlaying) {
            $play.addClass('playing');
            $play.find('.btn-icon').text('⏸');
            $play.find('.btn-label').text('Pause');
        } else {
            $play.removeClass('playing');
            $play.find('.btn-icon').text('▶');
            $play.find('.btn-label').text('Play');
        }
    }

    function showLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        
        loadingCancelled = false;
        isLoading = true;
        
        // Réinitialiser la barre de progression
        $loadingProgressBar.css('animation', 'none');
        $loadingProgressBar.css('width', '0%');
        // Forcer un reflow
        $loadingProgressBar[0].offsetHeight;
        $loadingProgressBar.css('animation', 'loadingProgress 30s ease-out forwards');
        
        $loadingText.text('Préparation vocale...');
        $loadingSub.text('Synthèse en cours');
        $loadingTimeout.text('⏱️ 30 secondes maximum');
        $loading.fadeIn(300);
        setStatus("⏳ Chargement...", 'loading');
        
        // 🔥 TIMEOUT DE 30 SECONDES
        loadingTimeout = setTimeout(() => {
            if (isLoading && !loadingCancelled) {
                hideLoading();
                setStatus("⚠️ Délai dépassé (30s)", 'error');
                isPlaying = false;
                updatePlayButton();
                $loadingSub.text('La synthèse vocale a pris trop de temps');
                $loadingTimeout.text('❌ Délai dépassé');
            }
        }, 30000);
    }

    function hideLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        isLoading = false;
        loadingCancelled = false;
        $loading.fadeOut(300);
        // Ne pas changer le statut si on est en train de parler
        if (!isSpeaking && !isPlaying) {
            setStatus("⏸ Lecture arrêtée", 'paused');
        }
    }

    function cancelLoading() {
        loadingCancelled = true;
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        hideLoading();
        stopSpeaking();
        setStatus("⏸ Annulé", 'paused');
        isPlaying = false;
        updatePlayButton();
        $loadingText.text('Annulé par l\'utilisateur');
        $loadingSub.text('Vous pouvez réessayer');
        $loadingTimeout.text('✕ Annulation');
    }

    // Arrêter la parole proprement
    function stopSpeaking() {
        try {
            if (synth && (synth.speaking || synth.pending)) {
                synth.cancel();
            }
        } catch(e) {
            console.warn('Erreur stopSpeaking:', e);
        }
        if (currentUtterance) {
            try {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance.onstart = null;
            } catch(e) {}
            currentUtterance = null;
        }
        isSpeaking = false;
        isPlaying = false;
        updatePlayButton();
    }

    // Mettre en pause la parole
    function pauseSpeaking() {
        try {
            if (synth && synth.speaking) {
                synth.pause();
                isPaused = true;
                isPlaying = false;
                setStatus("⏸ Lecture en pause", 'paused');
                updatePlayButton();
            }
        } catch(e) {
            console.warn('Erreur pauseSpeaking:', e);
            stopSpeaking();
        }
    }

    // Reprendre la parole
    function resumeSpeaking() {
        try {
            if (synth && synth.paused) {
                synth.resume();
                isPaused = false;
                isPlaying = true;
                setStatus("🔊 Lecture en cours", 'speaking');
                updatePlayButton();
            } else if (!isSpeaking && !synth.speaking && !synth.pending) {
                speakSlide(currentIndex);
            }
        } catch(e) {
            console.warn('Erreur resumeSpeaking:', e);
            speakSlide(currentIndex);
        }
    }

    function renderSlide(index) {
        const slide = slides[index];
        $title.text(slide.titre);

        let html = '';
        html += `<div class="content-card">${slide.contenu}</div>`;
        if (slide.note) {
            html += `<div class="note-box">${slide.note}</div>`;
        }
        $body.html(html);
        $counter.text(`${index+1} / ${total}`);

        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
        }
    }

    // ================================================================
    // LECTURE VOCALE
    // ================================================================
    function speakSlide(index) {
        return new Promise((resolve) => {
            const slide = slides[index];
            const text = slide.texteParle;
            
            if (!text || text.trim() === '' || !speechSupported) {
                resolve();
                return;
            }

            if (!window.speechSynthesis) {
                setStatus("❌ Synthèse vocale non supportée", 'error');
                speechSupported = false;
                resolve();
                return;
            }

            // Arrêter toute lecture en cours
            stopSpeaking();
            
            // Réinitialiser l'état de pause
            isPaused = false;
            
            showLoading();
            setStatus("Initialisation...", 'loading');

            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.92;
                utterance.pitch = 1.05;
                utterance.volume = 1;

                let isFinished = false;
                let errorHandled = false;

                utterance.onstart = function() {
                    if (loadingCancelled) {
                        stopSpeaking();
                        resolve();
                        return;
                    }
                    hideLoading();
                    isSpeaking = true;
                    isPlaying = true;
                    isPaused = false;
                    setStatus("🔊 Lecture en cours", 'speaking');
                    updatePlayButton();
                };

                utterance.onend = function() {
                    if (isFinished) return;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    setStatus("✅ Terminé", 'idle');
                    hideLoading();
                    updatePlayButton();
                    resolve();
                };

                utterance.onerror = function(e) {
                    if (isFinished || errorHandled) return;
                    errorHandled = true;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    hideLoading();
                    updatePlayButton();
                    
                    if (e.error === 'not-allowed') {
                        setStatus("⚠️ Permission refusée", 'error');
                    } else if (e.error === 'synthesis-unavailable') {
                        setStatus("⚠️ Synthèse indisponible", 'error');
                    } else if (e.error === 'canceled') {
                        setStatus("⏸ Annulé", 'paused');
                    } else {
                        setStatus("❌ Erreur audio: " + (e.error || 'inconnue'), 'error');
                    }
                    
                    resolve();
                };

                // Gestion du chargement des voix
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = function() {
                        if (!loadingCancelled) {
                            try {
                                synth.speak(utterance);
                            } catch(err) {
                                // Silencieux
                            }
                        }
                        synth.onvoiceschanged = null;
                    };
                }

                currentUtterance = utterance;
                
                if (!loadingCancelled) {
                    try {
                        synth.speak(utterance);
                    } catch(err) {
                        setTimeout(() => {
                            if (!loadingCancelled) {
                                try {
                                    synth.speak(utterance);
                                } catch(e) {
                                    setStatus("❌ Erreur de lecture", 'error');
                                    isPlaying = false;
                                    updatePlayButton();
                                    hideLoading();
                                    resolve();
                                }
                            } else {
                                resolve();
                            }
                        }, 100);
                    }
                } else {
                    resolve();
                }

            } catch(err) {
                hideLoading();
                setStatus("❌ Erreur générale", 'error');
                isPlaying = false;
                updatePlayButton();
                console.error('Erreur speakSlide:', err);
                resolve();
            }
        });
    }

    // ================================================================
    // NAVIGATION
    // ================================================================
    async function goToSlide(index) {
        if (isTransitioning) return;
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        
        // Si on est en train de lire, on met en pause avant de naviguer
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        // Arrêter complètement la lecture
        stopSpeaking();
        
        await new Promise(r => setTimeout(r, 50));
        
        if (index === currentIndex) {
            setStatus("📄 Slide actuel", 'idle');
            return;
        }

        isTransitioning = true;
        currentIndex = index;
        renderSlide(index);
        
        // Réinitialiser l'état de lecture
        isPlaying = false;
        updatePlayButton();
        setStatus("⏸ Lecture arrêtée", 'paused');

        await new Promise(r => setTimeout(r, 150));
        isTransitioning = false;
    }

    async function goToNext() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex + 1 < total) {
            await goToSlide(currentIndex + 1);
        } else {
            setStatus("🏁 Dernier slide", 'idle');
        }
    }

    async function goToPrev() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex - 1 >= 0) {
            await goToSlide(currentIndex - 1);
        } else {
            setStatus("🔁 Premier slide", 'idle');
        }
    }

    // ================================================================
    // GESTION PLAY/PAUSE
    // ================================================================
    function togglePlay() {
        if (!userInteracted) {
            userInteracted = true;
        }

        // Si le chargement est en cours, on l'annule
        if (isLoading) {
            cancelLoading();
            return;
        }

        // Si le synthétiseur est en pause, on reprend
        if (synth && synth.paused) {
            resumeSpeaking();
            return;
        }

        // Si la lecture est en cours, on met en pause
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
            return;
        }

        // Sinon, on démarre la lecture du slide courant
        if (!isSpeaking && !isPlaying) {
            stopSpeaking();
            speakSlide(currentIndex);
        }
    }

    // ================================================================
    // INIT
    // ================================================================
    async function init() {
        // Vérifier la compatibilité
        if (!window.speechSynthesis) {
            setStatus("❌ Synthèse vocale non supportée", 'error');
            speechSupported = false;
        }

        // Précharger les voix
        try {
            if (synth.getVoices) {
                synth.getVoices();
                setTimeout(() => {
                    try {
                        synth.getVoices();
                    } catch(e) {}
                }, 200);
            }
        } catch(e) {
            console.warn('Erreur chargement voix:', e);
        }

        // Afficher le premier slide
        renderSlide(0);
        $counter.text(`1 / ${total}`);
        
        // État initial
        setStatus("⏸ Appuie sur Play", 'paused');
        updatePlayButton();
        $autoIndicator.text('⏸ Lecture manuelle');

        // ================================================================
        // ÉVÉNEMENTS
        // ================================================================
        
        // Bouton Play/Pause
        $play.on('click', function() {
            togglePlay();
        });

        // Bouton Annuler le chargement
        $cancelLoading.on('click', function() {
            cancelLoading();
        });

        // Navigation
        $prev.on('click', function() {
            // Si chargement en cours, on annule
            if (isLoading) cancelLoading();
            goToPrev();
        });

        $next.on('click', function() {
            if (isLoading) cancelLoading();
            goToNext();
        });

        // Replay - relire le slide courant
        $replay.on('click', function() {
            if (isLoading) cancelLoading();
            stopSpeaking();
            setTimeout(() => {
                speakSlide(currentIndex);
            }, 100);
        });

        // Support du clavier (espace pour play/pause)
        $(document).on('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });

        // Nettoyage
        $(window).on('beforeunload', function() {
            try {
                if (synth.speaking) synth.cancel();
            } catch(e) {}
            hideLoading();
        });

        // Gérer les cas où la synthèse se termine de manière inattendue
        setInterval(() => {
            if (isPlaying && !synth.speaking && !synth.pending && !isPaused && !isLoading) {
                isPlaying = false;
                updatePlayButton();
                setStatus("⏸ Lecture arrêtée", 'paused');
            }
        }, 1000);
    }

    init();
});



    // ================================================================
    // GESTION DU THÈME JOUR/NUIT
    // ================================================================
    let isDarkMode = false;

    function toggleTheme() {
        isDarkMode = !isDarkMode;
        const body = document.body;
        const appContainer = document.querySelector('.app-container');
        const header = document.querySelector('.slide-header');
        const footer = document.querySelector('.slide-footer');
        const contentCards = document.querySelectorAll('.content-card');
        const noteBoxes = document.querySelectorAll('.note-box');
        const mathBlocks = document.querySelectorAll('.math-block');
        const buttons = document.querySelectorAll('.btn');
        const statusBadge = document.querySelector('.status-badge');
        const slideCounter = document.querySelector('.slide-counter');
        const autoIndicator = document.querySelector('.auto-indicator');
        const themeBtn = document.getElementById('themeToggle');

        if (isDarkMode) {
            // Mode nuit
            body.style.background = '#0b1120';
            body.style.color = '#f1f5f9';
            appContainer.style.background = 'linear-gradient(145deg, #0f172a 0%, #1e293b 100%)';
            header.style.background = 'rgba(15, 23, 42, 0.85)';
            footer.style.background = 'rgba(15, 23, 42, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.05)';
                card.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.08)';
                note.style.color = '#cbd5e1';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.25)';
                block.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#e2e8f0';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.12)';
                statusBadge.style.color = '#93bbfc';
            }
            if (slideCounter) {
                slideCounter.style.color = '#94a3b8';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#64748b';
            }
            if (themeBtn) {
                themeBtn.textContent = '☀️';
                themeBtn.title = 'Passer en mode jour';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#e2e8f0';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#e2e8f0';
                }
            });
        } else {
            // Mode jour (par défaut)
            body.style.background = '#f0f4f8';
            body.style.color = '#1a202c';
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
            header.style.background = 'rgba(255, 255, 255, 0.85)';
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.8)';
                card.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.12)';
                note.style.color = '#2c3e50';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.05)';
                block.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#2d3748';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
                statusBadge.style.color = '#2b6cb0';
            }
            if (slideCounter) {
                slideCounter.style.color = '#4a5568';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#718096';
            }
            if (themeBtn) {
                themeBtn.textContent = '🌓';
                themeBtn.title = 'Passer en mode nuit';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#2c3e50';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#2d3748';
                }
            });
        }
    }

    // Initialiser en mode jour
    document.addEventListener('DOMContentLoaded', function() {
        // Appliquer le mode jour par défaut
        const body = document.body;
        body.style.background = '#f0f4f8';
        body.style.color = '#1a202c';
        
        const appContainer = document.querySelector('.app-container');
        if (appContainer) {
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
        }
        
        const header = document.querySelector('.slide-header');
        if (header) {
            header.style.background = 'rgba(255, 255, 255, 0.85)';
        }
        
        const footer = document.querySelector('.slide-footer');
        if (footer) {
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
        }
        
        document.querySelectorAll('.content-card').forEach(card => {
            card.style.background = 'rgba(255,255,255,0.8)';
            card.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.note-box').forEach(note => {
            note.style.background = 'rgba(96, 165, 250, 0.12)';
            note.style.color = '#2c3e50';
        });
        
        document.querySelectorAll('.math-block').forEach(block => {
            block.style.background = 'rgba(0,0,0,0.05)';
            block.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.btn').forEach(btn => {
            btn.style.color = '#2d3748';
        });
        
        const statusBadge = document.querySelector('.status-badge');
        if (statusBadge) {
            statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
            statusBadge.style.color = '#2b6cb0';
        }
        
        const slideCounter = document.querySelector('.slide-counter');
        if (slideCounter) {
            slideCounter.style.color = '#4a5568';
        }
        
        const autoIndicator = document.querySelector('.auto-indicator');
        if (autoIndicator) {
            autoIndicator.style.color = '#718096';
        }
        
        document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
            if (!el.closest('.note-box')) {
                el.style.color = '#2c3e50';
            }
        });
        
        document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
            if (!el.closest('.note-box') && !el.closest('.math-block')) {
                el.style.color = '#2d3748';
            }
        });
        
        const themeBtn = document.getElementById('themeToggle');
        if (themeBtn) {
            themeBtn.textContent = '🌓';
            themeBtn.title = 'Passer en mode nuit';
        }
    });
</script>
