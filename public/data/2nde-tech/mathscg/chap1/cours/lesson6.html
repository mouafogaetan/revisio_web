<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Présentation mobile</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' },
            options: { skipHtmlTypes: 'script' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 500px;
        margin: 0 auto;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    .slide-header {
        flex-shrink: 0;
        padding: 18px 16px 10px 16px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        z-index: 10;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .slide-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
    }

    .content-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 18px 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        flex-shrink: 0;
    }

    .content-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .content-card li {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        line-height: 1.5;
    }

    .content-card li:last-child {
        border-bottom: none;
    }

    .bullet-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
    }

    .math-block {
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        overflow-x: auto;
        flex-shrink: 0;
        margin: 4px 0;
    }

    .math-block .math {
        font-size: 1.2rem;
        color: #e2e8f0;
    }

    .note-box {
        background: rgba(96, 165, 250, 0.08);
        border-left: 4px solid #60a5fa;
        padding: 12px 16px;
        border-radius: 12px;
        font-style: italic;
        font-size: 0.9rem;
        color: #cbd5e1;
        flex-shrink: 0;
    }

    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        border-radius: 0;
        flex-direction: column;
    }

    .loading-card {
        background: #1e293b;
        padding: 32px 28px;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #334155;
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px auto;
    }

    .loading-text {
        font-weight: 600;
        font-size: 1.1rem;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    .loading-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 16px;
    }
    .loading-progress {
        height: 3px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        animation: loadingProgress 30s ease-out forwards;
    }

    .loading-timeout {
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 12px;
    }

    .btn-cancel-loading {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 40px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #f87171;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }

    .btn-cancel-loading:active {
        transform: scale(0.94);
        background: rgba(239, 68, 68, 0.25);
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
    }

    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .slide-counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255,255,255,0.05);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(255,255,255,0.04);
    }

    .status-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 30px;
        background: rgba(96, 165, 250, 0.12);
        color: #93bbfc;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
    }

    .status-badge .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: pulse-dot 1.2s infinite;
        flex-shrink: 0;
    }

    .status-badge.idle .dot {
        animation: none;
        background: #64748b;
    }
    .status-badge.speaking .dot {
        background: #34d399;
        animation: pulse-dot 0.8s infinite;
    }
    .status-badge.error .dot {
        background: #f87171;
        animation: none;
    }
    .status-badge.paused .dot {
        animation: none;
        background: #fbbf24;
    }
    .status-badge.waiting .dot {
        animation: pulse-dot 1.5s infinite;
        background: #fbbf24;
    }
    .status-badge.loading .dot {
        animation: pulse-dot 0.5s infinite;
        background: #60a5fa;
    }

    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.7); }
    }

    .footer-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(255,255,255,0.1);
    }

    .btn-secondary {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-play {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
        min-width: 80px;
        justify-content: center;
    }
    .btn-play:active {
        background: rgba(52, 211, 153, 0.25);
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
    }

    .auto-indicator {
        font-size: 0.65rem;
        color: #64748b;
        text-align: center;
        letter-spacing: 0.3px;
        padding: 2px 0;
    }

    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.2rem;
        }
        .content-card li {
            font-size: 0.9rem;
            padding: 8px 0;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .btn-play {
            min-width: 60px;
        }
        .footer-buttons {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
        .loading-card {
            padding: 20px 16px;
        }
        .math-block .math {
            font-size: 1rem;
        }
    }

    @media (min-width: 600px) {
        .app-container {
            max-width: 480px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
        .loading-overlay {
            border-radius: 32px;
        }
    }

    /* Mode jour (par défaut) */
    html, body {
        background: #f0f4f8 !important;
        color: #1a202c !important;
    }
    .app-container {
        background: linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%) !important;
    }
    .slide-header {
        background: rgba(255, 255, 255, 0.85) !important;
        border-bottom: 1px solid rgba(0,0,0,0.08) !important;
    }
    .slide-header h1 {
        background: linear-gradient(135deg, #2b6cb0, #6b46c1) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        background-clip: text !important;
    }
    .slide-footer {
        background: rgba(255, 255, 255, 0.9) !important;
        border-top: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card {
        background: rgba(255,255,255,0.8) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card li {
        border-bottom: 1px solid rgba(0,0,0,0.05) !important;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.12) !important;
        border-left: 4px solid #4299e1 !important;
        color: #2c3e50 !important;
    }
    .math-block {
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .math-block .math {
        color: #2d3748 !important;
    }
    .slide-counter {
        color: #4a5568 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .status-badge {
        background: rgba(96, 165, 250, 0.15) !important;
        color: #2b6cb0 !important;
        border: 1px solid rgba(96, 165, 250, 0.15) !important;
    }
    .btn {
        color: #2d3748 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .btn-secondary {
        background: rgba(0,0,0,0.04) !important;
        border-color: rgba(0,0,0,0.08) !important;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15) !important;
        border-color: rgba(52, 211, 153, 0.2) !important;
        color: #38a169 !important;
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15) !important;
        border-color: rgba(251, 191, 36, 0.2) !important;
        color: #d69e2e !important;
    }
    .auto-indicator {
        color: #718096 !important;
    }
    .loading-card {
        background: #ffffff !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .loading-text {
        color: #1a202c !important;
    }
    .loading-sub {
        color: #4a5568 !important;
    }
</style>
</head>
<body>

<div class="app-container">

    <header class="slide-header">
        <h1 id="slideTitle">Chargement...</h1>
    </header>

    <main class="slide-body" id="slideBody"></main>

    <!-- LOADING OVERLAY AVEC BOUTON ANNULER -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Préparation vocale...</div>
            <div class="loading-sub" id="loadingSub">Synthèse en cours</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loadingProgressBar"></div>
            </div>
            <div class="loading-timeout" id="loadingTimeout">⏱️ 30 secondes maximum</div>
            <button class="btn-cancel-loading" id="cancelLoadingBtn">
                <span>✕</span> Annuler
            </button>
        </div>
    </div>

    <footer class="slide-footer">
        <div class="footer-top">
            <span class="slide-counter" id="slideCounter">1 / 3</span>
            <span class="status-badge idle" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">Prêt</span>
            </span>
        </div>

        <div class="footer-buttons">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-secondary" id="replayBtn">
                <span class="btn-icon">🔁</span> <span class="btn-label">Relire</span>
            </button>
            <button class="btn btn-play" id="playBtn">
                <span class="btn-icon">▶</span> <span class="btn-label">Play</span>
            </button>
        </div>

        <div class="auto-indicator" id="autoIndicator">⏸ Lecture manuelle</div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // SLIDES
    // ================================================================
   const slides = [
  {
    "titre": "Le calcul approché : introduction",
    "contenu": "<div style='background-color: #E8EAF6; padding: 20px; border-radius: 10px; color: #1A237E;'><h3 style='margin-top: 0;'>Qu'est-ce que le calcul approché ?</h3><p>En mathématiques et en sciences, il est souvent impossible ou inutile de donner la valeur exacte d'un nombre. On utilise alors une <strong>valeur approchée</strong>.</p><ul style='text-align: left; list-style-type: disc; padding-left: 20px; font-size: 1rem;'><li><strong>Troncature</strong> : on coupe le nombre après un certain nombre de décimales.</li><li><strong>Arrondi</strong> : on donne la valeur la plus proche selon une précision donnée.</li><li><strong>Notation scientifique</strong> : on écrit le nombre sous la forme <span class='math'>\\( a \\times 10^n \\)</span>.</li><li><strong>Ordre de grandeur</strong> : on donne la puissance de 10 la plus proche.</li></ul></div><div style='background-color: #FFF3E0; padding: 15px; border-radius: 8px; margin-top: 10px; color: #E65100;'><h4 style='margin-top: 0;'>Pourquoi est-ce important ?</h4><p>En sciences physiques, en ingénierie et en économie, on travaille constamment avec des valeurs approchées. Savoir arrondir correctement et estimer un ordre de grandeur est essentiel.</p></div>",
    "texteParle": "Dans cette leçon, nous allons étudier le calcul approché. En mathématiques et en sciences, il est souvent impossible ou inutile de donner la valeur exacte d'un nombre. On utilise alors une valeur approchée. Il existe plusieurs techniques : la troncature, qui consiste à couper le nombre après un certain nombre de décimales ; l'arrondi, qui donne la valeur la plus proche selon une précision donnée ; la notation scientifique, qui écrit le nombre sous la forme a fois 10 puissance n ; et l'ordre de grandeur, qui donne la puissance de 10 la plus proche. Ces techniques sont essentielles en sciences physiques, en ingénierie et en économie.",
    "note": "Le calcul approché permet de travailler avec des valeurs simplifiées mais précises."
  },
  {
    "titre": "Troncature d'un nombre",
    "contenu": "<div style='background-color: #E3F2FD; padding: 20px; border-radius: 10px; color: #0D47A1;'><h3 style='margin-top: 0;'>Définition de la troncature</h3><p><strong>Tronquer</strong> un nombre à une précision donnée, c'est <strong>couper</strong> son écriture décimale après un certain nombre de chiffres, sans arrondir.</p><ul style='text-align: left; list-style-type: disc; padding-left: 20px; font-size: 1rem;'><li>Troncature à l'unité : on garde la partie entière.</li><li>Troncature à 1 décimale : on garde 1 chiffre après la virgule.</li><li>Troncature à 2 décimales : on garde 2 chiffres après la virgule.</li><li>etc.</li></ul></div><div style='background-color: #FFF3E0; padding: 15px; border-radius: 8px; margin-top: 10px; color: #E65100;'><h4 style='margin-top: 0;'>Exemples avec π ≈ 3,14159...</h4><p>Troncature à l'unité : <span class='math'>\\( 3 \\)</span></p><p>Troncature à 1 décimale : <span class='math'>\\( 3,1 \\)</span></p><p>Troncature à 2 décimales : <span class='math'>\\( 3,14 \\)</span></p><p>Troncature à 3 décimales : <span class='math'>\\( 3,141 \\)</span></p><p>Troncature à 4 décimales : <span class='math'>\\( 3,1415 \\)</span></p></div><div style='background-color: #E8F5E9; padding: 15px; border-radius: 8px; margin-top: 10px; color: #1B5E20;'><h4 style='margin-top: 0;'>Autres exemples</h4><p><span class='math'>\\( \\sqrt{2} \\approx 1,41421... \\)</span></p><p>Troncature à 2 décimales : <span class='math'>\\( 1,41 \\)</span></p><p>Troncature à 3 décimales : <span class='math'>\\( 1,414 \\)</span></p></div>",
    "texteParle": "Commençons par la troncature. Tronquer un nombre à une précision donnée, c'est couper son écriture décimale après un certain nombre de chiffres, sans arrondir. Par exemple, avec pi qui vaut environ 3,14159, la troncature à l'unité donne 3. La troncature à 1 décimale donne 3,1. La troncature à 2 décimales donne 3,14. La troncature à 3 décimales donne 3,141. La troncature à 4 décimales donne 3,1415. Autre exemple : racine de 2 vaut environ 1,41421. La troncature à 2 décimales donne 1,41. La troncature à 3 décimales donne 1,414. La troncature ne tient pas compte du chiffre suivant : on coupe simplement.",
    "note": "Tronquer = couper sans arrondir."
  },
  {
    "titre": "Arrondi d'un nombre",
    "contenu": "<div style='background-color: #F3E5F5; padding: 20px; border-radius: 10px; color: #4A148C;'><h3 style='margin-top: 0;'>Définition de l'arrondi</h3><p><strong>Arrondir</strong> un nombre à une précision donnée, c'est donner la valeur la plus proche en tenant compte du chiffre suivant.</p><p><strong>Règle :</strong></p><ul style='text-align: left; list-style-type: disc; padding-left: 20px; font-size: 1rem;'><li>On regarde le chiffre qui suit la précision demandée.</li><li>Si ce chiffre est <strong>inférieur à 5</strong> : on arrondit en dessous (troncature).</li><li>Si ce chiffre est <strong>supérieur ou égal à 5</strong> : on arrondit au-dessus (on ajoute 1 à la dernière décimale conservée).</li></ul></div><div style='background-color: #FFF3E0; padding: 15px; border-radius: 8px; margin-top: 10px; color: #E65100;'><h4 style='margin-top: 0;'>Exemples avec π ≈ 3,14159...</h4><p>Arrondi à l'unité : <span class='math'>\\( 3 \\)</span> (car 1 < 5)</p><p>Arrondi à 1 décimale : <span class='math'>\\( 3,1 \\)</span> (car 4 < 5)</p><p>Arrondi à 2 décimales : <span class='math'>\\( 3,14 \\)</span> (car 1 < 5)</p><p>Arrondi à 3 décimales : <span class='math'>\\( 3,142 \\)</span> (car 5 ≥ 5, on ajoute 1 à 141)</p><p>Arrondi à 4 décimales : <span class='math'>\\( 3,1416 \\)</span> (car 9 ≥ 5, on ajoute 1 à 1415)</p></div><div style='background-color: #E8F5E9; padding: 15px; border-radius: 8px; margin-top: 10px; color: #1B5E20;'><h4 style='margin-top: 0;'>Comparaison troncature/arrondi</h4><p>π à 3 décimales : troncature = 3,141 ; arrondi = 3,142</p><p><span class='math'>\\( \\sqrt{2} \\)</span> à 3 décimales : troncature = 1,414 ; arrondi = 1,414</p></div>",
    "texteParle": "Passons à l'arrondi. Arrondir un nombre à une précision donnée, c'est donner la valeur la plus proche en tenant compte du chiffre suivant. La règle est la suivante : on regarde le chiffre qui suit la précision demandée. Si ce chiffre est inférieur à 5, on arrondit en dessous, c'est-à-dire qu'on tronque. Si ce chiffre est supérieur ou égal à 5, on arrondit au-dessus, c'est-à-dire qu'on ajoute 1 à la dernière décimale conservée. Par exemple, avec pi qui vaut 3,14159. L'arrondi à l'unité donne 3, car le chiffre suivant est 1, qui est inférieur à 5. L'arrondi à 1 décimale donne 3,1, car le chiffre suivant est 4, inférieur à 5. L'arrondi à 2 décimales donne 3,14, car le chiffre suivant est 1. L'arrondi à 3 décimales donne 3,142, car le chiffre suivant est 5, donc on ajoute 1 à 141. L'arrondi à 4 décimales donne 3,1416, car le chiffre suivant est 9, donc on ajoute 1 à 1415. Comparez avec la troncature : pour pi à 3 décimales, la troncature donne 3,141 et l'arrondi donne 3,142.",
    "note": "Arrondir = donner la valeur la plus proche. Si le chiffre suivant ≥ 5, on ajoute 1."
  },
  {
    "titre": "Arrondi et troncature : exemples avancés",
    "contenu": "<div style='background-color: #E0F7FA; padding: 20px; border-radius: 10px; color: #006064;'><h3 style='margin-top: 0;'>Exemples avec différentes précisions</h3><p><strong>Nombre :</strong> <span class='math'>\\( \\frac{1}{3} = 0,3333... \\)</span></p><ul style='text-align: left; list-style-type: disc; padding-left: 20px; font-size: 1rem;'><li>Troncature à 2 décimales : <span class='math'>\\( 0,33 \\)</span></li><li>Arrondi à 2 décimales : <span class='math'>\\( 0,33 \\)</span></li><li>Troncature à 3 décimales : <span class='math'>\\( 0,333 \\)</span></li><li>Arrondi à 3 décimales : <span class='math'>\\( 0,333 \\)</span></li></ul></div><div style='background-color: #FFF3E0; padding: 15px; border-radius: 8px; margin-top: 10px; color: #E65100;'><h4 style='margin-top: 0;'>Nombre : <span class='math'>\\( \\frac{2}{3} = 0,6666... \\)</span></h4><ul style='text-align: left; list-style-type: disc; padding-left: 20px; font-size: 1rem;'><li>Troncature à 2 décimales : <span class='math'>\\( 0,66 \\)</span></li><li>Arrondi à 2 décimales : <span class='math'>\\( 0,67 \\)</span> (car 6 ≥ 5)</li><li>Troncature à 3 décimales : <span class='math'>\\( 0,666 \\)</span></li><li>Arrondi à 3 décimales : <span class='math'>\\( 0,667 \\)</span> (car 6 ≥ 5)</li></ul></div><div style='background-color: #E8F5E9; padding: 15px; border-radius: 8px; margin-top: 10px; color: #1B5E20;'><h4 style='margin-top: 0;'>Nombre : <span class='math'>\\( \\sqrt{5} \\approx 2,236067... \\)</span></h4><ul style='text-align: left; list-style-type: disc; padding-left: 20px; font-size: 1rem;'><li>Troncature à 3 décimales : <span class='math'>\\( 2,236 \\)</span></li><li>Arrondi à 3 décimales : <span class='math'>\\( 2,236 \\)</span> (car 0 < 5)</li><li>Troncature à 4 décimales : <span class='math'>\\( 2,2360 \\)</span></li><li>Arrondi à 4 décimales : <span class='math'>\\( 2,2361 \\)</span> (car 6 ≥ 5)</li></ul></div>",
    "texteParle": "Voyons d'autres exemples avec différentes précisions. Pour un tiers qui vaut 0,3333, la troncature à 2 décimales donne 0,33 et l'arrondi donne aussi 0,33, car le chiffre suivant est 3, inférieur à 5. Pour deux tiers qui vaut 0,6666, la troncature à 2 décimales donne 0,66, mais l'arrondi donne 0,67, car le chiffre suivant est 6, supérieur ou égal à 5. Pour racine de 5 qui vaut environ 2,236067, la troncature à 3 décimales donne 2,236, et l'arrondi donne aussi 2,236, car le chiffre suivant est 0, inférieur à 5. Mais à 4 décimales, la troncature donne 2,2360, tandis que l'arrondi donne 2,2361, car le chiffre suivant est 6, supérieur ou égal à 5. Il est important de bien distinguer troncature et arrondi.",
    "note": "La troncature coupe, l'arrondi ajuste selon le chiffre suivant."

  {
    "titre": "Notation scientifique",
    "contenu": "<div style='background-color: #E3F2FD; padding: 20px; border-radius: 10px; color: #0D47A1;'><h3 style='margin-top: 0;'>Écriture scientifique d'un nombre</h3><p>Un nombre est écrit en <strong>notation scientifique</strong> sous la forme :</p><div class='math-block'><div class='math'>$$ a \\times 10^n \\quad \\text{avec } 1 \\le a < 10 \\text{ et } n \\in \\mathbb{Z} $$</div></div><ul style='text-align: left; list-style-type: disc; padding-left: 20px; font-size: 1rem;'><li><strong>a</strong> est un nombre décimal avec un seul chiffre avant la virgule (non nul).</li><li><strong>n</strong> est un entier relatif (positif ou négatif).</li><li>Cette notation est très utilisée en sciences pour les grands et petits nombres.</li></ul></div><div style='background-color: #FFF3E0; padding: 15px; border-radius: 8px; margin-top: 10px; color: #E65100;'><h4 style='margin-top: 0;'>Exemples</h4><p><span class='math'>\\( 4500 = 4,5 \\times 10^3 \\)</span></p><p><span class='math'>\\( 320000 = 3,2 \\times 10^5 \\)</span></p><p><span class='math'>\\( 0,00045 = 4,5 \\times 10^{-4} \\)</span></p><p><span class='math'>\\( 0,00000012 = 1,2 \\times 10^{-7} \\)</span></p><p><span class='math'>\\( 7 = 7 \\times 10^0 \\)</span></p></div><div style='background-color: #E8F5E9; padding: 15px; border-radius: 8px; margin-top: 10px; color: #1B5E20;'><h4 style='margin-top: 0;'>Méthode</h4><p>On place la virgule après le premier chiffre non nul, puis on compte le nombre de rangs déplacés.</p><ul style='text-align: left; list-style-type: disc; padding-left: 20px; font-size: 1rem;'><li>Si le nombre est grand (> 1) : exposant positif.</li><li>Si le nombre est petit (< 1) : exposant négatif.</li></ul></div>",
    "texteParle": "Passons à la notation scientifique. Un nombre est écrit en notation scientifique sous la forme a fois 10 puissance n, où a est un nombre décimal avec un seul chiffre avant la virgule, non nul, donc compris entre 1 et 10, et n est un entier relatif. Cette notation est très utilisée en sciences pour les grands et petits nombres. Par exemple, 4500 s'écrit 4,5 fois 10 puissance 3. 320000 s'écrit 3,2 fois 10 puissance 5. 0,00045 s'écrit 4,5 fois 10 puissance moins 4. 0,00000012 s'écrit 1,2 fois 10 puissance moins 7. Et 7 s'écrit 7 fois 10 puissance 0. La méthode est la suivante : on place la virgule après le premier chiffre non nul, puis on compte le nombre de rangs déplacés. Si le nombre est grand, l'exposant est positif. Si le nombre est petit, l'exposant est négatif.",
    "note": "a × 10^n avec 1 ≤ a < 10."

  {
    "titre": "Calcul avec la notation scientifique",
    "contenu": "<div style='background-color: #F3E5F5; padding: 20px; border-radius: 10px; color: #4A148C;'><h3 style='margin-top: 0;'>Opérations en notation scientifique</h3><p><strong>Multiplication :</strong></p><div class='math-block'><div class='math'>$$ (a \\times 10^m) \\times (b \\times 10^n) = (a \\times b) \\times 10^{m+n} $$</div></div><p><strong>Division :</strong></p><div class='math-block'><div class='math'>$$ \\frac{a \\times 10^m}{b \\times 10^n} = \\frac{a}{b} \\times 10^{m-n} $$</div></div></div><div style='background-color: #FFF3E0; padding: 15px; border-radius: 8px; margin-top: 10px; color: #E65100;'><h4 style='margin-top: 0;'>Exemples</h4><p><span class='math'>\\( (3 \\times 10^4) \\times (2 \\times 10^3) = 6 \\times 10^7 \\)</span></p><p><span class='math'>\\( (4 \\times 10^{-2}) \\times (5 \\times 10^6) = 20 \\times 10^4 = 2 \\times 10^5 \\)</span></p><p><span class='math'>\\( \\frac{8 \\times 10^5}{2 \\times 10^2} = 4 \\times 10^3 \\)</span></p><p><span class='math'>\\( \\frac{6 \\times 10^{-3}}{3 \\times 10^{-5}} = 2 \\times 10^{2} = 200 \\)</span></p></div><div style='background-color: #E8F5E9; padding: 15px; border-radius: 8px; margin-top: 10px; color: #1B5E20;'><h4 style='margin-top: 0;'>Attention</h4><p>Le résultat doit toujours être remis en notation scientifique : <span class='math'>\\( 1 \\le a < 10 \\)</span>.</p><p><span class='math'>\\( 20 \\times 10^4 = 2 \\times 10^5 \\)</span></p></div>",
    "texteParle": "Voyons comment effectuer des calculs avec la notation scientifique. Pour multiplier deux nombres en notation scientifique, on multiplie les coefficients entre eux et on additionne les exposants. Par exemple, 3 fois 10 puissance 4 fois 2 fois 10 puissance 3 égale 6 fois 10 puissance 7. Autre exemple : 4 fois 10 puissance moins 2 fois 5 fois 10 puissance 6 égale 20 fois 10 puissance 4. Mais attention, il faut remettre le résultat en notation scientifique : 20 fois 10 puissance 4 égale 2 fois 10 puissance 5. Pour diviser, on divise les coefficients et on soustrait les exposants. Par exemple, 8 fois 10 puissance 5 sur 2 fois 10 puissance 2 égale 4 fois 10 puissance 3. Et 6 fois 10 puissance moins 3 sur 3 fois 10 puissance moins 5 égale 2 fois 10 puissance 2, soit 200. Le résultat doit toujours être remis en notation scientifique, avec un coefficient compris entre 1 et 10.",
    "note": "Multiplier : coefficients × coefficients, exposants + exposants."

  {
    "titre": "Ordre de grandeur",
    "contenu": "<div style='background-color: #E0F7FA; padding: 20px; border-radius: 10px; color: #006064;'><h3 style='margin-top: 0;'>Définition de l'ordre de grandeur</h3><p>L'<strong>ordre de grandeur</strong> d'un nombre est la puissance de 10 la plus proche de ce nombre.</p><p><strong>Méthode :</strong></p><ol style='text-align: left; padding-left: 20px; font-size: 1rem;'><li>Écrire le nombre en notation scientifique : <span class='math'>\\( a \\times 10^n \\)</span>.</li><li>Si <span class='math'>\\( a < 5 \\)</span> : l'ordre de grandeur est <span class='math'>\\( 10^n \\)</span>.</li><li>Si <span class='math'>\\( a \\ge 5 \\)</span> : l'ordre de grandeur est <span class='math'>\\( 10^{n+1} \\)</span>.</li></ol></div><div style='background-color: #FFF3E0; padding: 15px; border-radius: 8px; margin-top: 10px; color: #E65100;'><h4 style='margin-top: 0;'>Exemples</h4><p><span class='math'>\\( 4,5 \\times 10^{-4} \\)</span> : ordre de grandeur <span class='math'>\\( 10^{-4} \\)</span> (car 4,5 < 5)</p><p><span class='math'>\\( 6,2 \\times 10^3 \\)</span> : ordre de grandeur <span class='math'>\\( 10^4 \\)</span> (car 6,2 ≥ 5)</p><p><span class='math'>\\( 3 \\times 10^8 \\)</span> : ordre de grandeur <span class='math'>\\( 10^8 \\)</span></p><p><span class='math'>\\( 8,7 \\times 10^{-6} \\)</span> : ordre de grandeur <span class='math'>\\( 10^{-5} \\)</span></p></div><div style='background-color: #E8F5E9; padding: 15px; border-radius: 8px; margin-top: 10px; color: #1B5E20;'><h4 style='margin-top: 0;'>Application</h4><p>L'ordre de grandeur permet de vérifier rapidement la vraisemblance d'un résultat.</p><p><strong>Exemple :</strong> <span class='math'>\\( 4,2 \\times 10^3 \\times 7,8 \\times 10^4 \\approx 3 \\times 10^8 \\)</span></p></div>",
    "texteParle": "Passons à l'ordre de grandeur. L'ordre de grandeur d'un nombre est la puissance de 10 la plus proche de ce nombre. La méthode est la suivante : on écrit d'abord le nombre en notation scientifique, sous la forme a fois 10 puissance n. Si le coefficient a est inférieur à 5, l'ordre de grandeur est 10 puissance n. Si le coefficient a est supérieur ou égal à 5, l'ordre de grandeur est 10 puissance n plus 1. Par exemple, 4,5 fois 10 puissance moins 4 a pour ordre de grandeur 10 puissance moins 4, car 4,5 est inférieur à 5. 6,2 fois 10 puissance 3 a pour ordre de grandeur 10 puissance 4, car 6,2 est supérieur ou égal à 5. 3 fois 10 puissance 8 a pour ordre de grandeur 10 puissance 8. 8,7 fois 10 puissance moins 6 a pour ordre de grandeur 10 puissance moins 5. L'ordre de grandeur permet de vérifier rapidement la vraisemblance d'un résultat.",
    "note": "Ordre de grandeur = puissance de 10 la plus proche."
  },
  {
    "titre": "Encadrement et approximation",
    "contenu": "<div style='background-color: #FCE4EC; padding: 20px; border-radius: 10px; color: #880E4F;'><h3 style='margin-top: 0;'>Encadrement d'un nombre</h3><p><strong>Encadrer</strong> un nombre, c'est donner deux valeurs entre lesquelles il se situe.</p><div class='math-block'><div class='math'>$$ a < x < b $$</div></div><p>On peut encadrer à une précision donnée :</p><ul style='text-align: left; list-style-type: disc; padding-left: 20px; font-size: 1rem;'><li>Encadrement à 0,1 près : <span class='math'>\\( a < x < a + 0,1 \\)</span></li><li>Encadrement à 0,01 près : <span class='math'>\\( a < x < a + 0,01 \\)</span></li><li>Encadrement à 10⁻ⁿ près : <span class='math'>\\( a < x < a + 10^{-n} \\)</span></li></ul></div><div style='background-color: #FFF3E0; padding: 15px; border-radius: 8px; margin-top: 10px; color: #E65100;'><h4 style='margin-top: 0;'>Exemples avec π ≈ 3,14159...</h4><p>Encadrement à 0,1 près : <span class='math'>\\( 3,1 < \\pi < 3,2 \\)</span></p><p>Encadrement à 0,01 près : <span class='math'>\\( 3,14 < \\pi < 3,15 \\)</span></p><p>Encadrement à 0,001 près : <span class='math'>\\( 3,141 < \\pi < 3,142 \\)</span></p></div><div style='background-color: #E8F5E9; padding: 15px; border-radius: 8px; margin-top: 10px; color: #1B5E20;'><h4 style='margin-top: 0;'>Amplitude d'un encadrement</h4><p>L'amplitude est la différence entre la borne supérieure et la borne inférieure.</p><p><strong>Exemple :</strong> <span class='math'>\\( 3,14 < \\pi < 3,15 \\)</span> a pour amplitude 0,01.</p></div>",
    "texteParle": "Voyons maintenant l'encadrement d'un nombre. Encadrer un nombre, c'est donner deux valeurs entre lesquelles il se situe. On peut encadrer à une précision donnée. Par exemple, encadrer à 0,1 près signifie trouver deux nombres séparés de 0,1 entre lesquels se trouve le nombre. Avec pi qui vaut environ 3,14159, l'encadrement à 0,1 près est 3,1 inférieur à pi inférieur à 3,2. L'encadrement à 0,01 près est 3,14 inférieur à pi inférieur à 3,15. L'encadrement à 0,001 près est 3,141 inférieur à pi inférieur à 3,142. L'amplitude d'un encadrement est la différence entre la borne supérieure et la borne inférieure. Par exemple, l'encadrement 3,14 inférieur à pi inférieur à 3,15 a une amplitude de 0,01. L'encadrement permet de connaître la précision d'une valeur approchée.",

    "titre": "En résumé : le calcul approché",
    "contenu": "<div style='background-color: #BBDEFB; padding: 20px; border-radius: 10px; text-align: center; color: #0D47A1;'><h3 style='margin-top: 0;'>Ce qu'il faut retenir</h3><ul style='text-align: left; list-style-type: disc; padding-left: 20px; font-size: 1rem;'><li><strong>Troncature :</strong> couper après n décimales, sans arrondir.</li><li><strong>Arrondi :</strong> si le chiffre suivant est ≥ 5, on ajoute 1 ; sinon on tronque.</li><li><strong>Notation scientifique :</strong> <span class='math'>\\( a \\times 10^n \\)</span> avec <span class='math'>\\( 1 \\le a < 10 \\)</span>.</li><li><strong>Multiplication :</strong> coefficients × coefficients, exposants + exposants.</li><li><strong>Division :</strong> coefficients / coefficients, exposants − exposants.</li><li><strong>Ordre de grandeur :</strong> puissance de 10 la plus proche.</li><li><strong>Encadrement :</strong> donner une borne inférieure et une borne supérieure.</li><li><strong>Applications :</strong> physique, chimie, astronomie, biologie, économie.</li></ul></div>",
    "texteParle": "Pour conclure cette leçon sur le calcul approché, retenons les points essentiels. La troncature consiste à couper un nombre après un certain nombre de décimales, sans arrondir. L'arrondi consiste à donner la valeur la plus proche : si le chiffre suivant est supérieur ou égal à 5, on ajoute 1 à la dernière décimale conservée, sinon on tronque. La notation scientifique écrit un nombre sous la forme a fois 10 puissance n, avec a compris entre 1 et 10. Pour multiplier, on multiplie les coefficients et on additionne les exposants. Pour diviser, on divise les coefficients et on soustrait les exposants. L'ordre de grandeur est la puissance de 10 la plus proche. L'encadrement donne une borne inférieure et une borne supérieure. Ces techniques sont utilisées en physique, en chimie, en astronomie, en biologie et en économie. Le calcul approché est indispensable en sciences expérimentales.",

    function setStatus(text, type) {
        $statusText.text(text);

        if (type === 'speaking') $statusBadge.addClass('speaking');
        else if (type === 'error') $statusBadge.addClass('error');
        else if (type === 'paused') $statusBadge.addClass('paused');

            $play.removeClass('playing');
            $play.find('.btn-icon').text('▶');
            $play.find('.btn-label').text('Play');
        }
    }

    function showLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        
        loadingCancelled = false;
        isLoading = true;
        
        // Réinitialiser la barre de progression
        $loadingProgressBar.css('animation', 'none');
        $loadingProgressBar.css('width', '0%');
        // Forcer un reflow
        $loadingProgressBar[0].offsetHeight;
        $loadingProgressBar.css('animation', 'loadingProgress 30s ease-out forwards');
        
        $loadingText.text('Préparation vocale...');
        $loadingSub.text('Synthèse en cours');
        $loadingTimeout.text('⏱️ 30 secondes maximum');
        $loading.fadeIn(300);
        setStatus("⏳ Chargement...", 'loading');
        
        // 🔥 TIMEOUT DE 30 SECONDES
        loadingTimeout = setTimeout(() => {
            if (isLoading && !loadingCancelled) {
                hideLoading();
                setStatus("⚠️ Délai dépassé (30s)", 'error');
                isPlaying = false;
                updatePlayButton();
                $loadingSub.text('La synthèse vocale a pris trop de temps');
                $loadingTimeout.text('❌ Délai dépassé');
            }
        }, 30000);
    }

    function hideLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        isLoading = false;
        loadingCancelled = false;
        $loading.fadeOut(300);
        // Ne pas changer le statut si on est en train de parler
        if (!isSpeaking && !isPlaying) {
            setStatus("⏸ Lecture arrêtée", 'paused');
        }
    }

    function cancelLoading() {
        loadingCancelled = true;
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        hideLoading();
        stopSpeaking();
        setStatus("⏸ Annulé", 'paused');
        isPlaying = false;
        updatePlayButton();
        $loadingText.text('Annulé par l\'utilisateur');
        $loadingSub.text('Vous pouvez réessayer');
        $loadingTimeout.text('✕ Annulation');
    }

    // Arrêter la parole proprement
    function stopSpeaking() {
        try {
            if (synth && (synth.speaking || synth.pending)) {
                synth.cancel();
            }
        } catch(e) {
            console.warn('Erreur stopSpeaking:', e);
        }
        if (currentUtterance) {
            try {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance.onstart = null;
            } catch(e) {}
            currentUtterance = null;
        }
        isSpeaking = false;
        isPlaying = false;
        updatePlayButton();
    }

    // Mettre en pause la parole
    function pauseSpeaking() {
        try {
            if (synth && synth.speaking) {
                synth.pause();
                isPaused = true;
                isPlaying = false;
                setStatus("⏸ Lecture en pause", 'paused');
                updatePlayButton();
            }
        } catch(e) {
            console.warn('Erreur pauseSpeaking:', e);
            stopSpeaking();
        }
    }

    // Reprendre la parole
    function resumeSpeaking() {
        try {
            if (synth && synth.paused) {
                synth.resume();
                isPaused = false;
                isPlaying = true;
                setStatus("🔊 Lecture en cours", 'speaking');
                updatePlayButton();
            } else if (!isSpeaking && !synth.speaking && !synth.pending) {
                speakSlide(currentIndex);
            }
        } catch(e) {
            console.warn('Erreur resumeSpeaking:', e);
            speakSlide(currentIndex);
        }
    }

    function renderSlide(index) {
        const slide = slides[index];
        $title.text(slide.titre);

        let html = '';
        html += `<div class="content-card">${slide.contenu}</div>`;
        if (slide.note) {
            html += `<div class="note-box">${slide.note}</div>`;
        }
        $body.html(html);
        $counter.text(`${index+1} / ${total}`);

        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
        }
    }

    // ================================================================
    // LECTURE VOCALE
    // ================================================================
    function speakSlide(index) {
        return new Promise((resolve) => {
            const slide = slides[index];
            const text = slide.texteParle;
            
            if (!text || text.trim() === '' || !speechSupported) {
                resolve();
                return;
            }

            if (!window.speechSynthesis) {
                setStatus("❌ Synthèse vocale non supportée", 'error');
                speechSupported = false;
                resolve();
                return;
            }

            // Arrêter toute lecture en cours
            stopSpeaking();
            
            // Réinitialiser l'état de pause
            isPaused = false;
            
            showLoading();
            setStatus("Initialisation...", 'loading');

            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.92;
                utterance.pitch = 1.05;
                utterance.volume = 1;

                let isFinished = false;
                let errorHandled = false;

                utterance.onstart = function() {
                    if (loadingCancelled) {
                        stopSpeaking();
                        resolve();
                        return;
                    }
                    hideLoading();
                    isSpeaking = true;
                    isPlaying = true;
                    isPaused = false;
                    setStatus("🔊 Lecture en cours", 'speaking');
                    updatePlayButton();
                };

                utterance.onend = function() {
                    if (isFinished) return;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    setStatus("✅ Terminé", 'idle');
                    hideLoading();
                    updatePlayButton();
                    resolve();
                };

                utterance.onerror = function(e) {
                    if (isFinished || errorHandled) return;
                    errorHandled = true;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    hideLoading();
                    updatePlayButton();
                    
                    if (e.error === 'not-allowed') {
                        setStatus("⚠️ Permission refusée", 'error');
                    } else if (e.error === 'synthesis-unavailable') {
                        setStatus("⚠️ Synthèse indisponible", 'error');
                    } else if (e.error === 'canceled') {
                        setStatus("⏸ Annulé", 'paused');
                    } else {
                        setStatus("❌ Erreur audio: " + (e.error || 'inconnue'), 'error');
                    }
                    
                    resolve();
                };

                // Gestion du chargement des voix
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = function() {
                        if (!loadingCancelled) {
                            try {
                                synth.speak(utterance);
                            } catch(err) {
                                // Silencieux
                            }
                        }
                        synth.onvoiceschanged = null;
                    };
                }

                currentUtterance = utterance;
                
                if (!loadingCancelled) {
                    try {
                        synth.speak(utterance);
                    } catch(err) {
                        setTimeout(() => {
                            if (!loadingCancelled) {
                                try {
                                    synth.speak(utterance);
                                } catch(e) {
                                    setStatus("❌ Erreur de lecture", 'error');
                                    isPlaying = false;
                                    updatePlayButton();
                                    hideLoading();
                                    resolve();
                                }
                            } else {
                                resolve();
                            }
                        }, 100);
                    }
                } else {
                    resolve();
                }

            } catch(err) {
                hideLoading();
                setStatus("❌ Erreur générale", 'error');
                isPlaying = false;
                updatePlayButton();
                console.error('Erreur speakSlide:', err);
                resolve();
            }
        });
    }

    // ================================================================
    // NAVIGATION
    // ================================================================
    async function goToSlide(index) {
        if (isTransitioning) return;
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        
        // Si on est en train de lire, on met en pause avant de naviguer
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        // Arrêter complètement la lecture
        stopSpeaking();
        
        await new Promise(r => setTimeout(r, 50));
        
        if (index === currentIndex) {
            setStatus("📄 Slide actuel", 'idle');
            return;
        }

        isTransitioning = true;
        currentIndex = index;
        renderSlide(index);
        
        // Réinitialiser l'état de lecture
        isPlaying = false;
        updatePlayButton();
        setStatus("⏸ Lecture arrêtée", 'paused');

        await new Promise(r => setTimeout(r, 150));
        isTransitioning = false;
    }

    async function goToNext() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex + 1 < total) {
            await goToSlide(currentIndex + 1);
        } else {
            setStatus("🏁 Dernier slide", 'idle');
        }
    }

    async function goToPrev() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex - 1 >= 0) {
            await goToSlide(currentIndex - 1);
        } else {
            setStatus("🔁 Premier slide", 'idle');
        }
    }

    // ================================================================
    // GESTION PLAY/PAUSE
    // ================================================================
    function togglePlay() {
        if (!userInteracted) {
            userInteracted = true;
        }

        // Si le chargement est en cours, on l'annule
        if (isLoading) {
            cancelLoading();
            return;
        }

        // Si le synthétiseur est en pause, on reprend
        if (synth && synth.paused) {
            resumeSpeaking();
            return;
        }

        // Si la lecture est en cours, on met en pause
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
            return;
        }

        // Sinon, on démarre la lecture du slide courant
        if (!isSpeaking && !isPlaying) {
            stopSpeaking();
            speakSlide(currentIndex);
        }
    }

    // ================================================================
    // INIT
    // ================================================================
    async function init() {
        // Vérifier la compatibilité
        if (!window.speechSynthesis) {
            setStatus("❌ Synthèse vocale non supportée", 'error');
            speechSupported = false;
        }

        // Précharger les voix
        try {
            if (synth.getVoices) {
                synth.getVoices();
                setTimeout(() => {
                    try {
                        synth.getVoices();
                    } catch(e) {}
                }, 200);
            }
        } catch(e) {
            console.warn('Erreur chargement voix:', e);
        }

        // Afficher le premier slide
        renderSlide(0);
        $counter.text(`1 / ${total}`);
        
        // État initial
        setStatus("⏸ Appuie sur Play", 'paused');
        updatePlayButton();
        $autoIndicator.text('⏸ Lecture manuelle');

        // ================================================================
        // ÉVÉNEMENTS
        // ================================================================
        
        // Bouton Play/Pause
        $play.on('click', function() {
            togglePlay();
        });

        // Bouton Annuler le chargement
        $cancelLoading.on('click', function() {
            cancelLoading();
        });

        // Navigation
        $prev.on('click', function() {
            // Si chargement en cours, on annule
            if (isLoading) cancelLoading();
            goToPrev();
        });

        $next.on('click', function() {
            if (isLoading) cancelLoading();
            goToNext();
        });

        // Replay - relire le slide courant
        $replay.on('click', function() {
            if (isLoading) cancelLoading();
            stopSpeaking();
            setTimeout(() => {
                speakSlide(currentIndex);
            }, 100);
        });

        // Support du clavier (espace pour play/pause)
        $(document).on('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });

        // Nettoyage
        $(window).on('beforeunload', function() {
            try {
                if (synth.speaking) synth.cancel();
            } catch(e) {}
            hideLoading();
        });

        // Gérer les cas où la synthèse se termine de manière inattendue
        setInterval(() => {
            if (isPlaying && !synth.speaking && !synth.pending && !isPaused && !isLoading) {
                isPlaying = false;
                updatePlayButton();
                setStatus("⏸ Lecture arrêtée", 'paused');
            }
        }, 1000);
    }

    init();
});



    // ================================================================
    // GESTION DU THÈME JOUR/NUIT
    // ================================================================
    let isDarkMode = false;

    function toggleTheme() {
        isDarkMode = !isDarkMode;
        const body = document.body;
        const appContainer = document.querySelector('.app-container');
        const header = document.querySelector('.slide-header');
        const footer = document.querySelector('.slide-footer');
        const contentCards = document.querySelectorAll('.content-card');
        const noteBoxes = document.querySelectorAll('.note-box');
        const mathBlocks = document.querySelectorAll('.math-block');
        const buttons = document.querySelectorAll('.btn');
        const statusBadge = document.querySelector('.status-badge');
        const slideCounter = document.querySelector('.slide-counter');
        const autoIndicator = document.querySelector('.auto-indicator');
        const themeBtn = document.getElementById('themeToggle');

        if (isDarkMode) {
            // Mode nuit
            body.style.background = '#0b1120';
            body.style.color = '#f1f5f9';
            appContainer.style.background = 'linear-gradient(145deg, #0f172a 0%, #1e293b 100%)';
            header.style.background = 'rgba(15, 23, 42, 0.85)';
            footer.style.background = 'rgba(15, 23, 42, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.05)';
                card.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.08)';
                note.style.color = '#cbd5e1';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.25)';
                block.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#e2e8f0';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.12)';
                statusBadge.style.color = '#93bbfc';
            }
            if (slideCounter) {
                slideCounter.style.color = '#94a3b8';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#64748b';
            }
            if (themeBtn) {
                themeBtn.textContent = '☀️';
                themeBtn.title = 'Passer en mode jour';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#e2e8f0';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#e2e8f0';
                }
            });
        } else {
            // Mode jour (par défaut)
            body.style.background = '#f0f4f8';
            body.style.color = '#1a202c';
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
            header.style.background = 'rgba(255, 255, 255, 0.85)';
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.8)';
                card.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.12)';
                note.style.color = '#2c3e50';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.05)';
                block.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#2d3748';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
                statusBadge.style.color = '#2b6cb0';
            }
            if (slideCounter) {
                slideCounter.style.color = '#4a5568';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#718096';
            }
            if (themeBtn) {
                themeBtn.textContent = '🌓';
                themeBtn.title = 'Passer en mode nuit';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#2c3e50';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#2d3748';
                }
            });
        }
    }

    // Initialiser en mode jour
    document.addEventListener('DOMContentLoaded', function() {
        // Appliquer le mode jour par défaut
        const body = document.body;
        body.style.background = '#f0f4f8';
        body.style.color = '#1a202c';
        
        const appContainer = document.querySelector('.app-container');
        if (appContainer) {
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
        }
        
        const header = document.querySelector('.slide-header');
        if (header) {
            header.style.background = 'rgba(255, 255, 255, 0.85)';
        }
        
        const footer = document.querySelector('.slide-footer');
        if (footer) {
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
        }
        
        document.querySelectorAll('.content-card').forEach(card => {

            card.style.borderColor = 'rgba(0,0,0,0.08)';
        });

            note.style.background = 'rgba(96, 165, 250, 0.12)';
            note.style.color = '#2c3e50';

            block.style.background = 'rgba(0,0,0,0.05)';
            block.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.btn').forEach(btn => {
            btn.style.color = '#2d3748';
        });

        if (slideCounter) {

        }
        
        const autoIndicator = document.querySelector('.auto-indicator');

        document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {

        const themeBtn = document.getElementById('themeToggle');
        if (themeBtn) {

        }
    });
