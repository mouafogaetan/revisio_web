<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = [
  {
    "titre": "Introduction à l'exécution d'algorithmes",
    "contenu": "<div style='text-align: center;'><h2 style='color: #2c3e50;'>🧠 Bienvenue dans le monde des algorithmes !</h2><p style='font-size: 1.1rem; color: #34495e;'>Un algorithme est une suite d'instructions qui permet de résoudre un problème ou d'effectuer une tâche.</p><div style='background-color: #e8f4f8; padding: 15px; border-radius: 10px; margin: 15px 0;'><p style='color: #1a5276; font-weight: bold;'>🎯 Objectif de la leçon :</p><ul style='text-align: left; color: #2c3e50;'><li>Exécuter manuellement des algorithmes simples</li></ul></div><div style='background-color: #fdebd0; padding: 10px; border-radius: 8px;'><p style='color: #935116;'>💡 Savoir exécuter un algorithme à la main est essentiel pour comprendre son fonctionnement.</p></div></div>",
    "texteParle": "Bonjour à tous ! Aujourd'hui, nous allons apprendre à exécuter manuellement des algorithmes simples. Un algorithme, c'est comme une recette de cuisine : une série d'étapes à suivre dans un ordre précis pour obtenir un résultat. Dans cette leçon, nous allons jouer le rôle de l'ordinateur et suivre pas à pas les instructions d'un algorithme. Cela vous aidera à mieux comprendre comment les ordinateurs résolvent des problèmes.",
    "note": "L'exécution manuelle est une étape clé pour maîtriser l'algorithmique."
  },
  {
    "titre": "Qu'est-ce qu'un algorithme ?",
    "contenu": "<div><h3 style='color: #2c3e50;'>📝 Définition et caractéristiques</h3><div style='background-color: #f0f3f5; padding: 15px; border-radius: 8px; margin: 10px 0;'><p style='color: #2c3e50;'>Un algorithme est une <strong>séquence finie</strong> d'<strong>instructions</strong> claires et non ambiguës qui permet de résoudre un problème.</p><h4 style='color: #1a5276;'>Caractéristiques :</h4><ul style='color: #2c3e50;'><li><strong>Entrées</strong> : des données fournies au départ</li><li><strong>Instructions</strong> : des actions à réaliser</li><li><strong>Sorties</strong> : le résultat final</li><li><strong>Finitude</strong> : l'algorithme doit se terminer</li><li><strong>Déterminisme</strong> : à chaque étape, la prochaine action est clairement définie</li></ul></div><div style='background-color: #d5e8d0; padding: 10px; border-radius: 8px; margin-top: 10px;'><p style='color: #1e4a2b;'>📌 Exemple simple : une recette de cuisine est un algorithme !</p></div></div>",
    "texteParle": "Un algorithme, c'est une suite d'instructions organisées pour réaliser une tâche ou résoudre un problème. Il doit être fini, c'est-à-dire qu'il doit se terminer après un nombre défini d'étapes. Il doit aussi être déterministe : à chaque étape, on sait exactement quoi faire. Un algorithme a des entrées, des instructions et des sorties. Par exemple, une recette de cuisine est un algorithme : vous avez des ingrédients (entrées), des étapes de préparation (instructions), et un plat préparé (sortie).",
    "note": "Un algorithme est comme une recette de cuisine : suivez les étapes pour obtenir le résultat."
  },
  {
    "titre": "Les variables dans un algorithme",
    "contenu": "<div><h3 style='color: #2c3e50;'>📦 Les variables : des boîtes qui contiennent des données</h3><div style='background-color: #eaf2f8; padding: 15px; border-radius: 8px;'><p style='color: #2c3e50;'>Une <strong>variable</strong> est un espace mémoire qui peut contenir une donnée (nombre, texte, etc.).</p><div style='background-color: #d4e6f1; padding: 10px; border-radius: 5px; margin: 10px 0;'><p style='color: #1a5276;'><strong>Exemple :</strong></p><ul style='color: #2c3e50;'><li><code>age = 17</code> ➜ la variable 'age' contient le nombre 17</li><li><code>nom = \"Jean\"</code> ➜ la variable 'nom' contient le texte \"Jean\"</li></ul></div><p style='color: #2c3e50;'>Une variable a un <strong>nom</strong> (pour l'identifier) et une <strong>valeur</strong> (le contenu).</p></div><div style='background-color: #fdebd0; padding: 10px; border-radius: 8px; margin-top: 10px;'><p style='color: #935116;'>🔑 Les variables permettent de stocker et de modifier des données au cours de l'exécution.</p></div></div>",
    "texteParle": "Dans un algorithme, nous utilisons des variables. Une variable, c'est comme une boîte qui peut contenir une valeur, comme un nombre ou un texte. Par exemple, on peut avoir une variable 'age' qui contient 17, ou une variable 'nom' qui contient 'Jean'. Les variables ont un nom pour les identifier et une valeur qui peut changer au fil de l'exécution de l'algorithme. Elles sont essentielles pour stocker et manipuler des données.",
    "note": "Les variables sont les éléments de base pour stocker des données dans un algorithme."
  },
  {
    "titre": "Les opérations de base",
    "contenu": "<div><h3 style='color: #2c3e50;'>➕ Les opérations arithmétiques et logiques</h3><div style='background-color: #f4f6f7; padding: 15px; border-radius: 8px;'><h4 style='color: #1a5276;'>Opérations arithmétiques :</h4><ul style='color: #2c3e50;'><li><strong>Addition</strong> : <code>+</code> (ex: <code>x = 5 + 3</code>)</li><li><strong>Soustraction</strong> : <code>-</code> (ex: <code>x = 10 - 4</code>)</li><li><strong>Multiplication</strong> : <code>*</code> (ex: <code>x = 6 * 7</code>)</li><li><strong>Division</strong> : <code>/</code> (ex: <code>x = 15 / 3</code>)</li></ul><h4 style='color: #1a5276;'>Opérations de comparaison :</h4><ul style='color: #2c3e50;'><li><code>=</code> (égal à)</li><li><code>></code> (supérieur à)</li><li><code><</code> (inférieur à)</li><li><code>>=</code> (supérieur ou égal)</li><li><code><=</code> (inférieur ou égal)</li></ul></div><div style='background-color: #d5f5e3; padding: 10px; border-radius: 8px; margin-top: 10px;'><p style='color: #1e4a2b;'>💡 Ces opérations sont utilisées pour effectuer des calculs et prendre des décisions.</p></div></div>",
    "texteParle": "Dans un algorithme, on peut effectuer des opérations sur les variables. Il y a les opérations arithmétiques comme l'addition, la soustraction, la multiplication et la division. Par exemple, on peut écrire 'x = 5 + 3' pour mettre 8 dans la variable x. Il y a aussi les opérations de comparaison qui permettent de comparer deux valeurs, comme 'est-ce que x est plus grand que y ?'. Ces opérations sont utilisées pour faire des calculs et pour prendre des décisions dans l'algorithme.",
    "note": "Les opérations sont le cœur des calculs et des décisions dans un algorithme."
  },
  {
    "titre": "Exécution pas à pas d'un algorithme simple",
    "contenu": "<div><h3 style='color: #2c3e50;'>👣 Suivre l'exécution étape par étape</h3><div style='background-color: #eaf2f8; padding: 15px; border-radius: 8px;'><h4 style='color: #1a5276;'>Algorithme : Calculer le périmètre d'un rectangle</h4><div style='background-color: #d4e6f1; padding: 10px; border-radius: 5px; margin: 10px 0;'><p style='color: #1a5276;'><strong>Instructions :</strong></p><ol style='color: #2c3e50;'><li>Déclarer les variables <code>longueur</code>, <code>largeur</code>, <code>perimetre</code></li><li>Lire la longueur et la stocker dans <code>longueur</code></li><li>Lire la largeur et la stocker dans <code>largeur</code></li><li>Calculer : <code>perimetre = 2 * (longueur + largeur)</code></li><li>Afficher <code>perimetre</code></li></ol></div></div><div style='background-color: #d5f5e3; padding: 10px; border-radius: 8px; margin-top: 10px;'><p style='color: #1e4a2b;'>📝 Suivez les étapes pour comprendre le fonctionnement.</p></div></div>",
    "texteParle": "Prenons un exemple concret pour comprendre comment exécuter un algorithme. Nous allons calculer le périmètre d'un rectangle. L'algorithme demande de lire la longueur et la largeur, puis de calculer le périmètre avec la formule 2 fois la somme de la longueur et de la largeur. Suivons les étapes : on déclare les variables, on lit les valeurs, on effectue le calcul, et on affiche le résultat. En exécutant ces étapes dans l'ordre, on obtient le périmètre du rectangle.",
    "note": "L'exécution pas à pas permet de comprendre chaque étape d'un algorithme."
  },
  {
    "titre": "Tableau de suivi des variables",
    "contenu": "<div><h3 style='color: #2c3e50;'>📊 Suivi des variables dans un tableau</h3><div style='background-color: #f4f6f7; padding: 15px; border-radius: 8px;'><p style='color: #2c3e50;'>Pour exécuter un algorithme manuellement, on utilise un <strong>tableau de suivi</strong> qui montre l'évolution des variables à chaque étape.</p><div style='background-color: #eaf2f8; padding: 10px; border-radius: 5px; margin: 10px 0;'><p style='color: #1a5276;'><strong>Exemple pour l'algorithme du périmètre :</strong></p><table style='width: 100%; border-collapse: collapse; color: #2c3e50;'><tr style='background-color: #d4e6f1;'><th style='padding: 8px; border: 1px solid #2c3e50;'>Étape</th><th style='padding: 8px; border: 1px solid #2c3e50;'>longueur</th><th style='padding: 8px; border: 1px solid #2c3e50;'>largeur</th><th style='padding: 8px; border: 1px solid #2c3e50;'>perimetre</th></tr><tr><td style='padding: 8px; border: 1px solid #2c3e50;'>Début</td><td style='padding: 8px; border: 1px solid #2c3e50;'>?</td><td style='padding: 8px; border: 1px solid #2c3e50;'>?</td><td style='padding: 8px; border: 1px solid #2c3e50;'>?</td></tr><tr><td style='padding: 8px; border: 1px solid #2c3e50;'>Lire longueur</td><td style='padding: 8px; border: 1px solid #2c3e50;'>10</td><td style='padding: 8px; border: 1px solid #2c3e50;'>?</td><td style='padding: 8px; border: 1px solid #2c3e50;'>?</td></tr><tr><td style='padding: 8px; border: 1px solid #2c3e50;'>Lire largeur</td><td style='padding: 8px; border: 1px solid #2c3e50;'>10</td><td style='padding: 8px; border: 1px solid #2c3e50;'>5</td><td style='padding: 8px; border: 1px solid #2c3e50;'>?</td></tr><tr><td style='padding: 8px; border: 1px solid #2c3e50;'>Calcul</td><td style='padding: 8px; border: 1px solid #2c3e50;'>10</td><td style='padding: 8px; border: 1px solid #2c3e50;'>5</td><td style='padding: 8px; border: 1px solid #2c3e50;'>30</td></tr></table></div></div><div style='background-color: #fdebd0; padding: 10px; border-radius: 8px; margin-top: 10px;'><p style='color: #935116;'>🔎 Le tableau permet de visualiser comment les variables évoluent au fil des instructions.</p></div></div>",
    "texteParle": "Pour exécuter un algorithme manuellement, on peut utiliser un tableau de suivi des variables. Ce tableau permet de voir comment les variables changent à chaque étape. Reprenons notre exemple du périmètre du rectangle. Au début, les variables n'ont pas de valeur. Après avoir lu la longueur, la variable 'longueur' devient 10. Après avoir lu la largeur, 'largeur' devient 5. Et après le calcul, 'perimetre' devient 30. Ce tableau est un outil très utile pour suivre pas à pas l'exécution d'un algorithme.",

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
