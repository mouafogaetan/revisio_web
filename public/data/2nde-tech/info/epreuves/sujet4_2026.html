<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Informatique",
  "classe": "2nde technique",
  "sequence": "Séquence 4",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Notions de base en algorithmique et structures de contrôle",
      "points": "4 pts",
      "enonce": "<div style='font-size: 16px; line-height: 1.6; color: #333; padding: 10px;'>Cet exercice porte sur les concepts fondamentaux de l'algorithmique vus en cours.<br><br> Un <strong>algorithme</strong> est une suite d'instructions organisées permettant de résoudre un problème. Parmi les éléments qui le composent, on distingue :<br><br>- Les <strong>variables</strong> : conteneurs de données (ex: un nombre, un texte).<br>- Les <strong>instructions simples</strong> : les actions élémentaires (ex: lire, afficher, affecter).<br>- Les <strong>structures de contrôle</strong> : qui modifient l'ordre d'exécution des instructions (ex: la condition <code>Si...Alors...Sinon</code>).<br>- Les <strong>boucles</strong> : qui permettent de répéter des instructions (ex: <code>Pour</code>, <code>TantQue</code>).</div>",
      "questions": [
        {
          "question": "<div style='margin-bottom: 12px;'><strong>1)</strong> Donnez la définition d'une variable en algorithmique.</div>",
          "reponse": "<div style='background-color: #f0f8ff; padding: 12px; border-radius: 8px; color: #1a1a1a;'>Une variable est un espace mémoire nommé qui peut contenir une valeur. Cette valeur peut changer (varier) au cours de l'exécution de l'algorithme. Elle est caractérisée par un nom, un type et une valeur.</div>"
        },
        {
          "question": "<div style='margin-bottom: 12px;'><strong>2)</strong> Expliquez à quoi sert une structure conditionnelle dans un algorithme.</div>",
          "reponse": "<div style='background-color: #f0f8ff; padding: 12px; border-radius: 8px; color: #1a1a1a;'>Une structure conditionnelle (comme <code>Si...Alors...Sinon</code>) permet de prendre des décisions. Elle exécute un bloc d'instructions seulement si une condition est vraie, et un autre bloc si elle est fausse. Cela permet à l'algorithme de s'adapter à différentes situations.</div>"
        },
        {
          "question": "<div style='margin-bottom: 12px;'><strong>3)</strong> Quelle est la différence entre une boucle <code>Pour</code> et une boucle <code>TantQue</code> ?</div>",
          "reponse": "<div style='background-color: #f0f8ff; padding: 12px; border-radius: 8px; color: #1a1a1a;'>La boucle <code>Pour</code> est utilisée lorsque l'on connaît à l'avance le nombre de répétitions. La boucle <code>TantQue</code> est utilisée lorsque le nombre de répétitions dépend d'une condition qui peut ne pas être vraie au départ (on peut ne pas l'exécuter).</div>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Application des connaissances - Calcul de moyenne",
      "points": "5 pts",
      "enonce": "<div style='font-size: 16px; line-height: 1.6; color: #333; padding: 10px;'>Un professeur souhaite calculer la moyenne de ses élèves pour une matière donnée. Il dispose de la liste des notes de chaque élève. Voici un algorithme qui calcule la moyenne d'une série de notes entrées par l'utilisateur.<br><br><div style='background-color: #f5f5f5; padding: 15px; border-radius: 8px; font-family: monospace; color: #1a1a1a;'><strong>Algorithme CalculMoyenne</strong><br>Variables : <br>   note, somme, moyenne : réels<br>   n, i : entiers<br>Début<br>   Afficher(\"Entrez le nombre de notes : \")<br>   Lire(n)<br>   somme ← 0<br>   Pour i de 1 à n faire<br>      Afficher(\"Entrez la note \", i, \" : \")<br>      Lire(note)<br>      somme ← somme + note<br>   Fin Pour<br>   moyenne ← somme / n<br>   Afficher(\"La moyenne est : \", moyenne)<br>Fin</div></div>",
      "questions": [
        {
          "question": "<div style='margin-bottom: 12px;'><strong>1)</strong> Exécutez manuellement cet algorithme pour les notes suivantes : 12, 15, 8, 10.</div>",
          "reponse": "<div style='background-color: #f0f8ff; padding: 12px; border-radius: 8px; color: #1a1a1a;'><strong>Étape 1 :</strong> L'utilisateur entre le nombre de notes <strong>n = 4</strong>.<br><strong>Étape 2 :</strong> Initialisation de <strong>somme = 0</strong>.<br><strong>Étape 3 (Boucle) :</strong><br>- i=1 → note=12 → somme=0+12=12<br>- i=2 → note=15 → somme=12+15=27<br>- i=3 → note=8  → somme=27+8=35<br>- i=4 → note=10 → somme=35+10=45<br><strong>Étape 4 :</strong> Calcul de <strong>moyenne = 45 / 4 = 11.25</strong>.<br><strong>Résultat affiché :</strong> \"La moyenne est : 11.25\"</div>"
        },
        {
          "question": "<div style='margin-bottom: 12px;'><strong>2)</strong> Identifiez toutes les variables utilisées dans cet algorithme et précisez leur type.</div>",
          "reponse": "<div style='background-color: #f0f8ff; padding: 12px; border-radius: 8px; color: #1a1a1a;'><ul style='list-style-type: none; padding-left: 0;'><li>- <strong>note</strong> (réel) : stocke chaque note saisie.</li><li>- <strong>somme</strong> (réel) : accumule la somme des notes.</li><li>- <strong>moyenne</strong> (réel) : stocke le résultat du calcul.</li><li>- <strong>n</strong> (entier) : stocke le nombre total de notes.</li><li>- <strong>i</strong> (entier) : variable de contrôle de la boucle.</li></ul></div>"
        },
        {
          "question": "<div style='margin-bottom: 12px;'><strong>3)</strong> Modifiez l'algorithme pour qu'il affiche également la note la plus élevée de la série.</div>",
          "reponse": "<div style='background-color: #f0f8ff; padding: 12px; border-radius: 8px; color: #1a1a1a;'><p>Il faut ajouter une variable <code>max</code> initialisée à la première note, et comparer chaque nouvelle note avec cette valeur.</p><div style='background-color: #f5f5f5; padding: 12px; border-radius: 8px; font-family: monospace; color: #1a1a1a;'><strong>Algorithme CalculMoyenne</strong><br>Variables : <br>   note, somme, moyenne, max : réels<br>   n, i : entiers<br>Début<br>   Afficher(\"Entrez le nombre de notes : \")<br>   Lire(n)<br>   somme ← 0<br>   Afficher(\"Entrez la note 1 : \")<br>   Lire(note) // On lit la première note<br>   max ← note<br>   somme ← note<br>   Pour i de 2 à n faire<br>      Afficher(\"Entrez la note \", i, \" : \")<br>      Lire(note)<br>      somme ← somme + note<br>      Si note > max Alors<br>         max ← note<br>      Fin Si<br>   Fin Pour<br>   moyenne ← somme / n<br>   Afficher(\"La moyenne est : \", moyenne)<br>   Afficher(\"La note maximale est : \", max)<br>Fin</div></div>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Problème de la vie courante - Gestion d'un stock",
      "points": "5 pts",
      "enonce": "<div style='font-size: 16px; line-height: 1.6; color: #333; padding: 10px;'>Un petit commerçant souhaite gérer son stock de marchandises. Pour chaque article, il connaît la quantité en stock et le seuil d'alerte (quantité minimale avant de commander). Il veut un algorithme simple pour l'aider à passer ses commandes.</div>",
      "questions": [
        {
          "question": "<div style='margin-bottom: 12px;'><strong>1)</strong> Écrivez l'algorithme qui permet de :<br>a) Lire la quantité en stock et le seuil d'alerte.<br>b) Afficher \"Commande à passer\" si la quantité en stock est inférieure au seuil d'alerte, sinon afficher \"Stock suffisant\".</div>",
          "reponse": "<div style='background-color: #f0f8ff; padding: 12px; border-radius: 8px; color: #1a1a1a;'><div style='background-color: #f5f5f5; padding: 15px; border-radius: 8px; font-family: monospace; color: #1a1a1a;'><strong>Algorithme GestionStock</strong><br>Variables : qte, seuil : réels<br>Début<br>   Afficher(\"Entrez la quantité en stock : \")<br>   Lire(qte)<br>   Afficher(\"Entrez le seuil d'alerte : \")<br>   Lire(seuil)<br>   Si qte < seuil Alors<br>       Afficher(\"Commande à passer\")<br>   Sinon<br>       Afficher(\"Stock suffisant\")<br>   Fin Si<br>Fin</div></div>"
        },
        {
          "question": "<div style='margin-bottom: 12px;'><strong>2)</strong> Un article a un stock de 15 unités et un seuil d'alerte de 20. Quel message l'algorithme affichera-t-il ?</div>",
          "reponse": "<div style='background-color: #f0f8ff; padding: 12px; border-radius: 8px; color: #1a1a1a;'>Étant donné que <strong>15 < 20</strong>, la condition est vraie. L'algorithme affichera donc : \"Commande à passer\".</div>"
        },
        {
          "question": "<div style='margin-bottom: 12px;'><strong>3)</strong> Modifiez l'algorithme pour qu'il affiche, en plus, la quantité à commander pour que le stock soit au niveau du seuil d'alerte.</div>",
          "reponse": "<div style='background-color: #f0f8ff; padding: 12px; border-radius: 8px; color: #1a1a1a;'><p>Il faut ajouter le calcul de la quantité manquante <code>qte_a_commander = seuil - qte</code>.</p><div style='background-color: #f5f5f5; padding: 15px; border-radius: 8px; font-family: monospace; color: #1a1a1a;'><strong>Algorithme GestionStockV2</strong><br>Variables : qte, seuil, qte_a_commander : réels<br>Début<br>   Afficher(\"Entrez la quantité en stock : \")<br>   Lire(qte)<br>   Afficher(\"Entrez le seuil d'alerte : \")<br>   Lire(seuil)<br>   Si qte < seuil Alors<br>       qte_a_commander ← seuil - qte<br>       Afficher(\"Commande à passer : \", qte_a_commander, \" unités\")<br>   Sinon<br>       Afficher(\"Stock suffisant\")<br>   Fin Si<br>Fin</div></div>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Défis algorithmiques",
      "points": "6 pts",
      "enonce": "<div style='font-size: 16px; line-height: 1.6; color: #333; padding: 10px;'>Pour les plus rapides, voici deux problèmes supplémentaires qui mobilisent des notions plus avancées.</div>",
      "questions": [
        {
          "question": "<div style='margin-bottom: 12px;'><strong>1)</strong> Écrire un algorithme qui, pour un nombre entier saisi par l'utilisateur, affiche \"Pair\" si le nombre est divisible par 2 et \"Impair\" sinon.</div>",
          "reponse": "<div style='background-color: #f0f8ff; padding: 12px; border-radius: 8px; color: #1a1a1a;'><div style='background-color: #f5f5f5; padding: 15px; border-radius: 8px; font-family: monospace; color: #1a1a1a;'><strong>Algorithme PairImpair</strong><br>Variables : nombre : entier<br>Début<br>   Afficher(\"Entrez un nombre entier : \")<br>   Lire(nombre)<br>   Si (nombre mod 2) = 0 Alors<br>       Afficher(\"Pair\")<br>   Sinon<br>       Afficher(\"Impair\")<br>   Fin Si<br>Fin</div><br><strong>Explication :</strong> L'opérateur <code>mod</code> donne le reste de la division entière. Si le reste de la division par 2 est 0, le nombre est pair.</div>"
        },
        {
          "question": "<div style='margin-bottom: 12px;'><strong>2)</strong> Proposer un algorithme qui calcule la factorielle d'un nombre entier N saisi par l'utilisateur. Rappel : N! = 1 × 2 × ... × N.</div>",
          "reponse": "<div style='background-color: #f0f8ff; padding: 12px; border-radius: 8px; color: #1a1a1a;'><div style='background-color: #f5f5f5; padding: 15px; border-radius: 8px; font-family: monospace; color: #1a1a1a;'><strong>Algorithme Factorielle</strong><br>Variables : n, i, resultat : entiers<br>Début<br>   Afficher(\"Entrez un nombre entier : \")<br>   Lire(n)<br>   resultat ← 1<br>   Pour i de 1 à n faire<br>       resultat ← resultat * i<br>   Fin Pour<br>   Afficher(\"La factorielle de \", n, \" est : \", resultat)<br>Fin</div><br><strong>Explication :</strong> On initialise le résultat à 1 (élément neutre de la multiplication), puis on multiplie successivement par tous les entiers de 1 à N.</div>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
