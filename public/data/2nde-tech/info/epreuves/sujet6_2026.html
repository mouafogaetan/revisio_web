<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Informatique",
  "classe": "2nde technique",
  "sequence": "Séquence 6",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Définitions et concepts (4 pts)",
      "points": "4 pts",
      "enonce": "Cet exercice évalue vos connaissances sur les concepts fondamentaux des chapitres 4 à 8 du programme.",
      "questions": [
        {
          "question": "1) Définissez les termes suivants :<br/><br/>a) Multimédia :<br/><br/>b) Numérisation :<br/><br/>c) Algorithmique :",
          "reponse": "a) Le multimédia désigne l'utilisation simultanée de plusieurs formes de médias (texte, image, son, vidéo) dans un même support ou application [citation:1].<br/><br/>b) La numérisation est le processus de conversion d'informations analogiques (comme une photo papier ou un son) en données numériques compréhensibles par un ordinateur [citation:1].<br/><br/>c) L'algorithmique est la science qui étudie la conception et l'analyse des algorithmes, c'est-à-dire des suites d'instructions permettant de résoudre des problèmes."
        },
        {
          "question": "2) Quelles sont les principales différences entre une image matricielle et une image vectorielle ?",
          "reponse": "Les principales différences sont :<br/><br/>- L'image matricielle (bitmap) est composée d'une grille de pixels. Sa qualité dépend de la résolution et elle se dégrade lorsqu'on l'agrandit [citation:1].<br/>- L'image vectorielle est composée d'objets géométriques (lignes, courbes, polygones). Elle peut être agrandie à l'infini sans perte de qualité [citation:1].<br/><br/>Exemples : JPEG, PNG (matricielles) ; SVG, AI (vectorielles)."
        }
      ]
    },
    {
      "titre": "Exercice 2 : PowerPoint et présentation assistée (5 pts)",
      "points": "5 pts",
      "enonce": "Vous devez créer un diaporama pour présenter votre établissement scolaire.",
      "questions": [
        {
          "question": "1) Quelles sont les étapes à suivre pour insérer une image dans une diapositive de PowerPoint ?",
          "reponse": "Pour insérer une image dans PowerPoint :<br/><br/>1. Ouvrez le logiciel PowerPoint et créez une nouvelle diapositive.<br/>2. Allez dans l'onglet 'Insertion'.<br/>3. Cliquez sur le bouton 'Images'.<br/>4. Sélectionnez 'Parcourir' pour choisir une image sur votre ordinateur ou 'Images en ligne' pour rechercher sur internet.<br/>5. Sélectionnez l'image souhaitée et cliquez sur 'Insérer'."
        },
        {
          "question": "2) Citez trois fonctionnalités de PowerPoint qui permettent d'améliorer la qualité d'une présentation. Expliquez brièvement comment les utiliser.",
          "reponse": "Trois fonctionnalités utiles de PowerPoint sont :<br/><br/>- Les animations : elles permettent d'animer le texte ou les objets (apparition, disparition, déplacement). Pour les utiliser, sélectionnez l'objet, puis allez dans l'onglet 'Animation' et choisissez un effet.<br/>- Les transitions : elles définissent l'effet visuel entre deux diapositives. Pour les utiliser, allez dans l'onglet 'Transitions' et choisissez un effet.<br/>- Les modèles (thèmes) : ils donnent une apparence cohérente à tout le diaporama (couleurs, polices, fonds). Pour les utiliser, allez dans l'onglet 'Conception' et choisissez un thème."
        },
        {
          "question": "3) Comment enregistrer votre diaporama au format PDF ?",
          "reponse": "Pour enregistrer un diaporama PowerPoint au format PDF :<br/><br/>1. Cliquez sur 'Fichier'.<br/>2. Sélectionnez 'Enregistrer sous'.<br/>3. Choisissez l'emplacement de sauvegarde.<br/>4. Dans le champ 'Type', sélectionnez 'PDF (*.pdf)'.<br/>5. Cliquez sur 'Enregistrer'."
        }
      ]
    },
    {
      "titre": "Exercice 3 : Multimédia et fichiers (4 pts)",
      "points": "4 pts",
      "enonce": "Les fichiers multimédias sont omniprésents dans notre quotidien numérique.",
      "questions": [
        {
          "question": "1) Citez quatre formats de fichiers multimédias différents en précisant leur type (image, son, vidéo, etc.).",
          "reponse": "Quatre formats de fichiers multimédias :<br/><br/>- MP3 : format audio compressé pour la musique et les sons [citation:1].<br/>- MP4 : format vidéo compressé pour les films et clips [citation:1].<br/>- JPEG : format d'image compressé pour les photos [citation:1].<br/>- PNG : format d'image avec transparence pour les logos et graphiques [citation:1]."
        },
        {
          "question": "2) Un fichier vidéo de 2 Go est trop volumineux pour être envoyé par e-mail. Quelles solutions pouvez-vous envisager ?",
          "reponse": "Plusieurs solutions sont possibles :<br/><br/>- Compresser la vidéo : utiliser un logiciel de compression (comme HandBrake) pour réduire la taille du fichier.<br/>- Convertir le format : certains formats sont plus compressés que d'autres (ex: MP4 avec codec H.265).<br/>- Utiliser un service de stockage en ligne : déposer le fichier sur Google Drive, OneDrive ou un service similaire et partager un lien [citation:1].<br/>- Découper la vidéo en plusieurs parties."
        }
      ]
    },
    {
      "titre": "Exercice 4 : Réseaux sociaux (4 pts)",
      "points": "4 pts",
      "enonce": "L'utilisation des réseaux sociaux est courante, mais elle doit être responsable.",
      "questions": [
        {
          "question": "1) Quelles sont les règles à respecter pour une utilisation responsable des réseaux sociaux ?",
          "reponse": "Pour une utilisation responsable des réseaux sociaux :<br/><br/>- Protéger sa vie privée : ne pas partager d'informations personnelles (adresse, téléphone, etc.).<br/>- Vérifier les sources : ne pas partager d'informations non vérifiées pour éviter la désinformation.<br/>- Respecter les autres : éviter les propos haineux, le harcèlement et les insultes.<br/>- Utiliser des mots de passe forts et la double authentification.<br/>- Limiter le temps passé sur les réseaux pour préserver sa santé mentale."
        },
        {
          "question": "2) Comment créer un groupe WhatsApp et quelles sont ses principales fonctionnalités ?",
          "reponse": "Pour créer un groupe WhatsApp :<br/><br/>1. Ouvrez WhatsApp.<br/>2. Cliquez sur le menu (trois points en haut à droite) puis 'Nouveau groupe'.<br/>3. Sélectionnez les contacts à ajouter.<br/>4. Cliquez sur 'Suivant'.<br/>5. Donnez un nom au groupe et ajoutez éventuellement une photo.<br/><br/>Les principales fonctionnalités d'un groupe WhatsApp sont :<br/>- Envoyer des messages à tous les membres simultanément.<br/>- Partager des images, vidéos et documents.<br/>- Appels audio et vidéo de groupe.<br/>- L'administrateur peut gérer les membres (ajout/suppression) et les paramètres du groupe."
        }
      ]
    },
    {
      "titre": "Exercice 5 : Algorithmique et organigrammes (3 pts)",
      "points": "3 pts",
      "enonce": "Cet exercice porte sur les bases de l'algorithmique vues dans le chapitre 8.",
      "questions": [
        {
          "question": "1) Qu'est-ce qu'un organigramme ? À quoi sert-il en algorithmique ?",
          "reponse": "Un organigramme (ou flowchart) est une représentation graphique d'un algorithme. Il utilise des symboles normalisés pour représenter les différentes étapes :<br/><br/>- Rectangle : action ou instruction.<br/>- Losange : décision/condition.<br/>- Ovale : début/fin.<br/>- Flèches : direction du flux d'exécution.<br/><br/>L'organigramme permet de visualiser clairement la logique d'un algorithme et facilite sa compréhension et sa vérification."
        },
        {
          "question": "2) Dessinez l'organigramme d'un algorithme simple qui lit deux nombres A et B, puis affiche le plus grand des deux.",
          "reponse": "L'organigramme de l'algorithme est :<br/><br/>Début (Ovale) → Saisir A et B (Rectangle) → Condition : A > B ? (Losange) → Si Oui : Afficher A (Rectangle) → Fin (Ovale)<br/>Si Non : Afficher B (Rectangle) → Fin (Ovale)"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
