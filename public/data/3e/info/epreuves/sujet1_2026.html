<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>
    <!-- MathJax -->
    <script>
        MathJax = {

                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }
    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }
    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }
    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }
    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }
    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }
    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }
    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }
    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }
    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }
    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }
    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }
    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }
    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }
    .exercise-statement .math {
        color: #1e40af;
    }
    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }
    .question-block.revealed {
        border-left-color: #059669;
    }
    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }
    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }
    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }
    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }
    .question-answer .math {
        color: #065f46;
    }
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }
    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }
    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }
    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }
    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }
    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }
    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }
    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }
    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }
    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }
    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }
    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }
    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }
    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }
    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }
    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>
<div class="app-container">
    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>
    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>
    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>
        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

      "questions": [
        {
          "question": "<p><strong>1. Définition et identification (2 pts)</strong></p><p>a) (0,5 pt) Définis l'expression : <strong>Architecture d'un ordinateur</strong>.</p><p>b) (0,5 pt) Identifie les composants représentés sur l'<strong>Image 1</strong> et l'<strong>Image 2</strong>.</p><p>c) (1 pt) Donne le rôle de chacun de ces deux composants dans le fonctionnement de l'ordinateur.</p>",
          "reponse": "<p><strong>a) (0,5 pt)</strong> L'<strong>architecture d'un ordinateur</strong> est l'organisation et la structure interne de ses composants matériels, ainsi que la manière dont ils communiquent entre eux pour traiter l'information.</p><p><strong>b) (0,5 pt)</strong></p><ul><li><strong>Image 1 :</strong> Le <strong>processeur</strong> (ou CPU, Central Processing Unit).</li><li><strong>Image 2 :</strong> Une <strong>barrette de mémoire RAM</strong> (Random Access Memory), ou mémoire vive.</li></ul><p><strong>c) (1 pt)</strong></p><ul><li><strong>Le processeur (CPU) :</strong> C'est le cerveau de l'ordinateur. Il exécute les instructions des programmes, effectue les calculs arithmétiques et logiques, et contrôle les autres composants.</li><li><strong>La mémoire RAM :</strong> C'est la mémoire de travail. Elle stocke temporairement les données et les programmes en cours d'utilisation pour un accès rapide par le processeur. Elle est volatile (son contenu est effacé à l'extinction de l'ordinateur).</li></ul>"
        },
        {
          "question": "<p><strong>2. Schéma du modèle de Von Neumann (2 pts)</strong></p><p>Dessine le schéma du modèle de l'architecture de Von Neumann en représentant ses composants principaux et leurs connexions.</p>",
          "reponse": "<p>Le schéma de l'architecture de Von Neumann comprend les éléments suivants :</p><ul><li><strong>La mémoire :</strong> stocke les données et les instructions.</li><li><strong>L'unité centrale (processeur) :</strong> composée de l'Unité de Contrôle (UC) et de l'Unité Arithmétique et Logique (UAL).</li><li><strong>Les périphériques d'entrée :</strong> clavier, souris, etc.</li><li><strong>Les périphériques de sortie :</strong> écran, imprimante, etc.</li></ul><p>Les composants sont reliés par des <strong>bus</strong> (bus de données, bus d'adresses, bus de contrôle) qui permettent la circulation des informations. Le principe fondamental est que les <strong>données et les instructions sont stockées dans la même mémoire</strong>.</p><p><em>(Schéma attendu : mémoire ↔ unité centrale ↔ périphériques d'E/S, avec les bus de communication.)</em></p>"
        },
        {
          "question": "<p><strong>3. Les deux architectures du processeur (2 pts)</strong></p><p>L'<strong>Image 1</strong> peut fonctionner selon deux types d'architecture différents.</p><p>a) (1 pt) Nomme ces deux (02) architectures.</p><p>b) (1 pt) Donne un (01) avantage de chacune de ces architectures.</p>",
          "reponse": "<p><strong>a) (1 pt)</strong> Les deux types d'architecture du processeur sont :</p><ol><li>L'architecture <strong>RISC</strong> (Reduced Instruction Set Computer).</li><li>L'architecture <strong>CISC</strong> (Complex Instruction Set Computer).</li></ol><p><strong>b) (1 pt)</strong></p><ul><li><strong>Avantage du RISC :</strong> Il est plus rapide car ses instructions simples s'exécutent en un seul cycle d'horloge, et il consomme moins d'énergie. Exemples : ARM, PowerPC.</li><li><strong>Avantage du CISC :</strong> Ses instructions sont plus puissantes et permettent de réaliser une tâche avec moins d'instructions, ce qui simplifie le travail du compilateur. Exemples : Intel x86, AMD.</li></ul>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Intelligence Artificielle (4 pts)",
      "points": "4 pts",
      "enonce": "<div class='exercise-block'><p>Un influenceur numérique publie sur son compte Facebook une fausse information sur la modification de la date de la rentrée scolaire. Plusieurs internautes abonnés à cette page sont troublés et l'un se rapproche de toi pour distinguer l'information vraie de la fausse.</p><p><em>À l'aide du texte ci-dessus et de tes connaissances sur l'IA, réponds aux questions suivantes :</em></p></div>",
      "questions": [
        {
          "question": "<p><strong>1. Définition de l'IA (1 pt)</strong></p><p>Définis l'expression : <strong>Intelligence Artificielle (IA)</strong>.</p>",
          "reponse": "<p>L'<strong>Intelligence Artificielle</strong> (IA) est l'ensemble des techniques et des programmes informatiques qui permettent à une machine de simuler des capacités humaines comme apprendre, raisonner, comprendre, percevoir ou prendre des décisions.</p>"
        },
        {
          "question": "<p><strong>2. Les dangers de l'IA (1 pt)</strong></p><p>Donne le nom générique attribué aux fausses informations publiées dans les réseaux sociaux, puis cite deux (02) dangers liés à l'utilisation de l'IA.</p>",
          "reponse": "<p>Les fausses informations publiées dans les réseaux sociaux sont appelées <strong>fake news</strong> (ou infox).</p><p>Deux dangers liés à l'utilisation de l'IA :</p><ul><li><strong>La désinformation :</strong> l'IA peut créer et diffuser de fausses informations (deepfakes, fake news).</li><li><strong>La dépendance :</strong> l'utilisation excessive de l'IA peut rendre paresseux et empêcher de réfléchir par soi-même.</li></ul><p>On peut aussi citer : la perte d'emplois, l'atteinte à la vie privée, la tricherie à l'école.</p>"
        },
        {
          "question": "<p><strong>3. Usage responsable de l'IA (2 pts)</strong></p><p>a) (1 pt) Cite deux (02) avantages de l'utilisation de l'IA dans la vie quotidienne.</p><p>b) (1 pt) Donne une (01) règle d'or pour un usage responsable de l'IA à l'école.</p>",
          "reponse": "<p><strong>a) (1 pt)</strong> Deux avantages de l'IA :</p><ul><li><strong>Gain de temps :</strong> elle réalise des tâches répétitives très rapidement.</li><li><strong>Aide à l'apprentissage :</strong> elle explique des notions et corrige des exercices.</li></ul><p>On peut aussi citer : la précision, la disponibilité (24h/24), l'accessibilité pour les personnes handicapées.</p><p><strong>b) (1 pt)</strong> Une règle d'or pour un usage responsable de l'IA à l'école : <strong>comprendre avant de copier</strong>. L'IA est un outil pour t'aider à apprendre, pas pour apprendre à ta place. Il faut toujours vérifier les informations et citer l'IA comme source si elle a été utilisée.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Maintenance informatique (6 pts)",
      "points": "6 pts",
      "enonce": "<div class='exercise-block'><p>Cet exercice porte sur les types de maintenance informatique, l'installation d'applications et le scan des disques.</p></div>",
      "questions": [
        {
          "question": "<p><strong>1. Les types de maintenance (2,5 pts)</strong></p><p>a) (1 pt) Définis l'expression : <strong>Maintenance informatique</strong>.</p><p>b) (1,5 pt) Cite les trois (03) types de maintenance informatique et donne un exemple d'action pour chacun.</p>",
          "reponse": "<p><strong>a) (1 pt)</strong> La <strong>maintenance informatique</strong> désigne l'ensemble des actions techniques, logicielles et organisationnelles visant à maintenir ou rétablir un système informatique dans un état de fonctionnement optimal. Son objectif est de prolonger la durée de vie du matériel et des logiciels, assurer la sécurité des données et garantir la continuité du travail.</p><p><strong>b) (1,5 pt)</strong> Les trois types de maintenance informatique sont :</p><ol><li><strong>La maintenance corrective :</strong> réparer ce qui est cassé, intervenir après une panne. <em>Exemple : remplacer un disque dur défectueux.</em></li><li><strong>La maintenance préventive :</strong> agir avant que la panne n'arrive, planifiée régulièrement. <em>Exemple : scanner le disque avec un antivirus.</em></li><li><strong>La maintenance évolutive :</strong> faire évoluer le système en ajoutant de nouvelles fonctionnalités ou en améliorant le matériel. <em>Exemple : ajouter de la RAM ou installer un SSD.</em></li></ol>"
        },
        {
          "question": "<p><strong>2. Installation d'une application (2 pts)</strong></p><p>a) (1 pt) Cite les trois (03) premières étapes pour installer une application sur un ordinateur.</p><p>b) (1 pt) Donne deux (02) raisons pour lesquelles il est important de mettre à jour ses applications.</p>",

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};
    const totalExercises = examData.exercices.length;
    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');
    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;
        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);
        // Construire le contenu
        let html = '';
        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;
        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;
            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });
        html += `</div>`;
        $body.html(html);
        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);
        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }
        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }
    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }
        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;
        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);
        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }
    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }
    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }
    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }
    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }
    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }
    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });
        // Afficher le premier exercice
        renderExercise(0);
        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);
        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }
    init();
});
</script>
