<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],

            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"

    crossorigin="anonymous">

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Apprentissage par Renforcement Avancé - L3",
  "classe": "Licence 3 Data Science",
  "sequence": "Séquence 3",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Processus de Décision Markovien (MDP) et Équation de Bellman",
      "points": "4 pts",
      "enonce": "<p>Un agent d'apprentissage par renforcement évolue dans un environnement simple représenté par un <strong>Processus de Décision Markovien (MDP)</strong> [citation:4]. L'environnement est composé de deux états : <strong>S0</strong> (état initial) et <strong>S1</strong> (état terminal). L'agent dispose de deux actions : <strong>A0</strong> et <strong>A1</strong>.</p><p>Les dynamiques de l'environnement et les récompenses sont données par le tableau suivant :</p><div style=\"overflow-x: auto;\"><table style=\"width: 100%; border-collapse: collapse; font-size: 0.9em;\"><thead><tr style=\"background: #1a237e; color: white;\"><th style=\"padding: 10px; border: 1px solid #283593;\">État (s)</th><th style=\"padding: 10px; border: 1px solid #283593;\">Action (a)</th><th style=\"padding: 10px; border: 1px solid #283593;\">État suivant (s')</th><th style=\"padding: 10px; border: 1px solid #283593;\">Récompense (r)</th></tr></thead><tbody><tr><td style=\"padding: 8px; border: 1px solid #ddd;\">S0</td><td style=\"padding: 8px; border: 1px solid #ddd;\">A0</td><td style=\"padding: 8px; border: 1px solid #ddd;\">S1</td><td style=\"padding: 8px; border: 1px solid #ddd;\">+5</td></tr><tr style=\"background: #e8eaf6;\"><td style=\"padding: 8px; border: 1px solid #ddd;\">S0</td><td style=\"padding: 8px; border: 1px solid #ddd;\">A1</td><td style=\"padding: 8px; border: 1px solid #ddd;\">S0</td><td style=\"padding: 8px; border: 1px solid #ddd;\">+1</td></tr><tr><td style=\"padding: 8px; border: 1px solid #ddd;\">S1</td><td style=\"padding: 8px; border: 1px solid #ddd;\">A0</td><td style=\"padding: 8px; border: 1px solid #ddd;\">S1</td><td style=\"padding: 8px; border: 1px solid #ddd;\">0</td></tr><tr style=\"background: #e8eaf6;\"><td style=\"padding: 8px; border: 1px solid #ddd;\">S1</td><td style=\"padding: 8px; border: 1px solid #ddd;\">A1</td><td style=\"padding: 8px; border: 1px solid #ddd;\">S1</td><td style=\"padding: 8px; border: 1px solid #ddd;\">0</td></tr></tbody></table></div><p>L'objectif de l'agent est de maximiser la récompense cumulée sur le long terme, avec un facteur de discount \\( \\gamma = 0,9 \\).</p>",
      "questions": [
        {
          "question": "1) Expliquez ce qu'est un Processus de Décision Markovien (MDP) et énumérez ses composants principaux.",
          "reponse": "Un MDP est un cadre mathématique pour modéliser la prise de décision dans des environnements où les résultats sont en partie aléatoires et en partie sous le contrôle d'un agent. Ses composants sont : l'ensemble des états (S), l'ensemble des actions (A), la fonction de transition d'état \\(P(s'|s,a)\\), la fonction de récompense \\(R(s,a)\\) et le facteur de discount \\(\\gamma\\). [citation:4]"
        },
        {
          "question": "2) Définissez la fonction de valeur d'état \\(V(s)\\) et écrivez l'équation de Bellman associée.",
          "reponse": "La fonction de valeur d'état \\(V(s)\\) estime la récompense totale future attendue en partant de l'état s. L'équation de Bellman est : \\( V(s) = \\max_a \\left[ R(s,a) + \\gamma \\sum_{s'} P(s'|s,a) V(s') \\right] \\). [citation:4]"
        },
        {
          "question": "3) Appliquez l'équation de Bellman pour calculer la fonction de valeur d'état \\(V(s)\\) dans ce MDP. Quelle est la politique optimale ?",
          "reponse": "Comme S1 est un état terminal, \\(V(S1)=0\\). Pour S0, nous calculons pour chaque action : \\(Q(S0,A0) = R(S0,A0) + \\gamma * V(S1) = 5 + 0,9 * 0 = 5\\). \\(Q(S0,A1) = R(S0,A1) + \\gamma * V(S0) = 1 + 0,9 * V(S0)\\). En substituant \\(V(S0) = \\max(5, 1 + 0,9 * V(S0))\\), la solution est \\(V(S0) = 5\\). La politique optimale est de prendre \\(A0\\) depuis \\(S0\\)."
        }
      ]
    },
    {
      "titre": "Exercice 2 : Dilemme Exploration vs Exploitation",
      "points": "5 pts",
      "enonce": "<p>Vous travaillez sur un système de recommandation de produits pour une plateforme e-commerce. Vous utilisez un algorithme d'apprentissage par renforcement qui doit recommander des produits à un utilisateur pour maximiser le nombre de clics sur le long terme.</p><p>Le système est confronté au compromis fondamental entre l'<strong>exploration</strong> et l'<strong>exploitation</strong> [citation:2]. À chaque interaction, l'agent doit choisir entre :</p><ul><li><strong>Exploitation</strong> : Recommander un produit dont l'algorithme sait qu'il a déjà généré des clics.</li><li><strong>Exploration</strong> : Recommander un nouveau produit pour évaluer son potentiel.</li></ul>",
      "questions": [
        {
          "question": "1) Définissez le compromis 'exploration vs exploitation' dans le contexte de l'apprentissage par renforcement.",
          "reponse": "Le compromis 'exploration vs exploitation' est un dilemme central en RL : l'agent doit décider entre exploiter ses connaissances actuelles (actions dont il sait qu'elles donnent de bonnes récompenses) ou explorer de nouvelles actions (pour découvrir potentiellement de meilleures stratégies, mais au risque de moins bonnes récompenses à court terme). [citation:2][citation:4]"
        },
        {
          "question": "2) L'algorithme utilise une stratégie \\(\\epsilon\\)-greedy avec \\(\\epsilon = 0,1\\). Calculez la probabilité que le système choisisse une action d'exploration à chaque recommandation. Que se passe-t-il si \\(\\epsilon\\) est trop élevé ou trop faible ?",
          "reponse": "Avec \\(\\epsilon = 0,1\\), la probabilité d'exploration est de 10%. Si \\(\\epsilon\\) est trop élevé, l'agent explore trop et n'apprend pas assez vite. S'il est trop faible, l'agent exploite excessivement et peut ne pas découvrir de meilleures stratégies. [citation:4]"
        },
        {
          "question": "3) Proposez une stratégie alternative à \\(\\epsilon\\)-greedy pour gérer ce compromis. Justifiez votre choix.",
          "reponse": "Une alternative est l'exploration par <strong>curiosité intrinsèque</strong>, où l'agent est récompensé pour avoir réduit son incertitude sur l'environnement [citation:3]. Cela permet une exploration plus intelligente, guidée par la nouveauté des interactions, plutôt qu'une exploration aléatoire comme dans \\(\\epsilon\\)-greedy."
        }
      ]
    },
    {
      "titre": "Exercice 3 : Deep Q-Learning (DQN) et ses Améliorations",
      "points": "6 pts",
      "enonce": "<p>Vous devez développer un agent d'apprentissage par renforcement pour un jeu vidéo. Les états sont des images écran (haute dimension) et les actions sont discrètes. Vous décidez d'utiliser un algorithme <strong>Deep Q-Network (DQN)</strong>.</p><p>L'algorithme DQN utilise un réseau de neurones profond pour approximer la fonction Q [citation:7]. Il a introduit deux innovations majeures pour stabiliser l'apprentissage : l'<strong>Experience Replay</strong> et le <strong>Target Network</strong>.</p>",
      "questions": [
        {
          "question": "1) Expliquez le principe de l'Experience Replay dans DQN. En quoi permet-il d'améliorer l'apprentissage par rapport à un Q-Learning tabulaire ?",
          "reponse": "L'Experience Replay consiste à stocker les transitions \\((s, a, r, s')\\) dans une mémoire (buffer) et à échantillonner aléatoirement des mini-batchs pour l'entraînement. Cela brise la corrélation entre les observations successives et permet de réutiliser les données, ce qui stabilise et accélère l'apprentissage. [citation:2]"
        },
        {
          "question": "2) Décrivez le rôle du Target Network dans DQN et comment il est mis à jour. Pourquoi est-il crucial pour la stabilité de l'algorithme ?",
          "reponse": "Le Target Network est une copie du réseau Q principal, mis à jour périodiquement (ou avec une mise à jour lente). Il fournit des cibles stables pour le calcul de l'erreur TD, ce qui évite les oscillations et la divergence qui peuvent survenir lors de l'utilisation d'un réseau qui change à chaque pas. [citation:7]"
        },
        {
          "question": "3) Double DQN (DDQN) améliore DQN en résolvant le problème de la surestimation de la fonction Q. Expliquez ce problème et comment DDQN le résout.",
          "reponse": "DQN surestime souvent les valeurs Q car il utilise le même réseau pour sélectionner et évaluer l'action maximale. DDQN utilise le réseau principal pour sélectionner l'action (\\(\\arg\\max_a Q(s',a;\\theta)\\)) et le Target Network pour évaluer sa valeur. Cela réduit la surestimation et améliore les performances. [citation:2]"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Proximal Policy Optimization (PPO)",
      "points": "5 pts",
      "enonce": "<p>Vous êtes ingénieur en IA et devez entraîner un agent pour un environnement complexe avec des actions continues. Vous choisissez d'utiliser l'algorithme <strong>Proximal Policy Optimization (PPO)</strong>, reconnu pour sa robustesse et son efficacité [citation:8].</p><p>PPO est un algorithme de politique de gradient qui limite l'ampleur des changements de politique pour garantir une mise à jour stable. Contrairement à son prédécesseur TRPO, PPO utilise un mécanisme de <strong>clipping</strong> pour mettre en œuvre cette contrainte.</p>",
      "questions": [
        {
          "question": "1) Expliquez l'objectif de la 'région de confiance' dans les algorithmes de politique de gradient comme PPO et TRPO.",
          "reponse": "La 'région de confiance' est une zone autour de la politique actuelle dans laquelle les mises à jour sont confinées pour éviter des changements de politique trop brusques qui pourraient dégrader les performances. PPO réalise cela de manière simple avec un mécanisme de clipping. [citation:2]"
        },
        {
          "question": "2) Décrivez le mécanisme de <strong>clipping</strong> utilisé par PPO. Quelle est l'utilité du paramètre \\(\\epsilon\\) dans l'objectif clippé ?",
          "reponse": "Le clipping de PPO limite le ratio de probabilité \\(r(\\theta) = \\frac{\\pi_\\theta(a|s)}{\\pi_{\\theta_{old}}(a|s)}\\) entre \\(1-\\epsilon\\) et \\(1+\\epsilon\\). \\(\\epsilon\\) (généralement 0.2) définit l'ampleur maximale du changement de politique autorisé à chaque mise à jour, assurant la stabilité de l'entraînement. [citation:2]"
        },
        {
          "question": "3) Comparez brièvement PPO avec DQN. Quels sont les avantages de PPO pour des problèmes d'actions continues ?",
          "reponse": "DQN est conçu pour les actions discrètes et les espaces d'états de grande dimension. PPO gère naturellement les actions continues (via une distribution gaussienne) et est plus stable que les méthodes de politique de gradient classiques. PPO est souvent préféré pour des tâches complexes en robotique ou en contrôle. [citation:4][citation:8]"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
