<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Apprentissage par Renforcement Avancé - L3",
  "classe": "Licence 3 Data Science",
  "sequence": "Séquence 2",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Fondements - MDP et Équations de Bellman",
      "points": "6 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; padding: 10px;'> <p style='font-size: 0.95em; line-height: 1.5; color: #333;'>On considère un processus décisionnel de Markov (MDP) représenté par le tuple \\( (S, A, P, R, \\gamma) \\).</p> <p style='font-size: 0.95em; line-height: 1.5; color: #333;'>Un agent évolue dans un environnement simple avec 3 états \\( S = \\{s_1, s_2, s_3\\} \\) et 2 actions \\( A = \\{a_1, a_2\\} \\). Le facteur d'actualisation est \\( \\gamma = 0.9 \\).</p> <p style='font-size: 0.95em; line-height: 1.5; color: #333;'>Les récompenses immédiates sont : \\( R(s_1, a_1) = 1 \\), \\( R(s_1, a_2) = 0 \\), \\( R(s_2, a_1) = 2 \\), \\( R(s_2, a_2) = -1 \\), \\( R(s_3, a_1) = 3 \\), \\( R(s_3, a_2) = 1 \\).</p> <p style='font-size: 0.95em; line-height: 1.5; color: #333;'>Les probabilités de transition sont les suivantes :</p> <ul style='font-size: 0.95em; line-height: 1.6; color: #333;'> <li>\\( P(s_2|s_1, a_1) = 0.7, P(s_3|s_1, a_1) = 0.3 \\)</li> <li>\\( P(s_1|s_1, a_2) = 1.0 \\)</li> <li>\\( P(s_3|s_2, a_1) = 0.6, P(s_1|s_2, a_1) = 0.4 \\)</li> <li>\\( P(s_2|s_2, a_2) = 1.0 \\)</li> <li>\\( P(s_1|s_3, a_1) = 0.5, P(s_2|s_3, a_1) = 0.5 \\)</li> <li>\\( P(s_3|s_3, a_2) = 1.0 \\)</li> </ul> </div>",
      "questions": [
        {
          "question": "<div style='font-size: 0.95em; color: #333;'>1) Définir formellement un MDP. Expliquer le rôle de chaque élément \\( (S, A, P, R, \\gamma) \\).</div>",
          "reponse": "<div style='font-size: 0.95em; color: #1a3a5c;'> <p>Un MDP est défini par :</p> <ul> <li><strong>\\( S \\)</strong> : l'ensemble des états de l'environnement.</li> <li><strong>\\( A \\)</strong> : l'ensemble des actions possibles pour l'agent.</li> <li><strong>\\( P \\)</strong> : la fonction de transition \\( P(s'|s,a) \\) qui donne la probabilité d'atteindre \\( s' \\) en prenant l'action \\( a \\) depuis l'état \\( s \\).</li> <li><strong>\\( R \\)</strong> : la fonction de récompense immédiate \\( R(s,a,s') \\) ou \\( R(s,a) \\).</li> <li><strong>\\( \\gamma \\)</strong> : le facteur d'actualisation, \\( 0 \\leq \\gamma \\leq 1 \\), qui pondère l'importance des récompenses futures.</li> </ul> </div>"
        },
        {
          "question": "<div style='font-size: 0.95em; color: #333;'>2) Écrire l'équation de Bellman pour la fonction de valeur \\( V^\\pi(s) \\) pour une politique \\( \\pi \\) donnée.</div>",
          "reponse": "<div style='font-size: 0.95em; color: #1a3a5c;'> <p>L'équation de Bellman pour \\( V^\\pi \\) est :</p> <div class='math-block' style='background-color: #f5f5f5; padding: 10px; border-radius: 8px; margin: 5px 0;'> <div class='math' style='font-size: 1em; text-align: center; color: #1a1a1a;'> $$ V^\\pi(s) = \\sum_{a} \\pi(a|s) \\sum_{s'} P(s'|s,a) \\left[ R(s,a,s') + \\gamma V^\\pi(s') \\right] $$ </div> </div> <p>C'est l'espérance de la récompense immédiate plus la valeur actualisée de l'état suivant, sous la politique \\( \\pi \\).</p> </div>"
        },
        {
          "question": "<div style='font-size: 0.95em; color: #333;'>3) En utilisant l'équation de Bellman, calculer \\( V^\\pi(s_1) \\) pour la politique aléatoire \\( \\pi(a_1|s) = \\pi(a_2|s) = 0.5 \\) pour tout état \\( s \\).</div>",
          "reponse": "<div style='font-size: 0.95em; color: #1a3a5c;'> <p>On doit résoudre le système linéaire \\( V = R_\\pi + \\gamma P_\\pi V \\).</p> <p>Les équations pour les trois états :</p> <ul> <li>\\( V(s_1) = 0.5 \\times [0.7(1 + 0.9 V(s_2)) + 0.3(1 + 0.9 V(s_3))] + 0.5 \\times [1.0(0 + 0.9 V(s_1))] \\)</li> <li>\\( V(s_2) = 0.5 \\times [0.6(2 + 0.9 V(s_3)) + 0.4(2 + 0.9 V(s_1))] + 0.5 \\times [1.0(-1 + 0.9 V(s_2))] \\)</li> <li>\\( V(s_3) = 0.5 \\times [0.5(3 + 0.9 V(s_1)) + 0.5(3 + 0.9 V(s_2))] + 0.5 \\times [1.0(1 + 0.9 V(s_3))] \\)</li> </ul> <p>En simplifiant et en résolvant le système, on obtient (résultats approximatifs) :</p> <ul> <li>\\( V(s_1) \\approx 2.41 \\)</li> <li>\\( V(s_2) \\approx 3.15 \\)</li> <li>\\( V(s_3) \\approx 4.82 \\)</li> </ul> </div>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Deep Q-Learning et Améliorations (DQN, DDQN, Dueling DQN)",
      "points": "7 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; padding: 10px;'> <p style='font-size: 0.95em; line-height: 1.5; color: #333;'>Un agent utilise l'algorithme <strong>Deep Q-Network (DQN)</strong> pour apprendre une politique à partir de données d'expérience. L'environnement est un jeu Atari avec un espace d'action discret de 4 actions.</p> <p style='font-size: 0.95em; line-height: 1.5; color: #333;'>L'agent implémente DQN avec un <strong>replay buffer</strong> de taille 100 000, un <strong>target network</strong> mis à jour toutes les 1000 étapes, et une exploration \\( \\epsilon \\)-greedy avec \\( \\epsilon \\) qui décroît de 1.0 à 0.01 sur les premiers 1 million d'étapes.</p> </div>",
      "questions": [
        {
          "question": "<div style='font-size: 0.95em; color: #333;'>1) Expliquer les rôles du replay buffer et du target network dans DQN. Pourquoi sont-ils nécessaires ?</div>",
          "reponse": "<div style='font-size: 0.95em; color: #1a3a5c;'> <p><strong>Replay buffer :</strong> Stocke les transitions \\( (s_t, a_t, r_t, s_{t+1}, done_t) \\) et les échantillonne aléatoirement pour l'entraînement. Il réduit la corrélation entre les données et permet de réutiliser les expériences passées, améliorant l'efficacité des échantillons.</p> <p><strong>Target network :</strong> Un réseau séparé utilisé pour calculer la cible \\( y = r + \\gamma \\max_{a'} Q_{\\text{target}}(s', a') \\). Mis à jour périodiquement, il stabilise l'apprentissage en évitant les mises à jour instables causées par le bootstrapping.</p> <p>Ces deux mécanismes sont nécessaires pour stabiliser l'apprentissage et surmonter les problèmes de la Deadly Triad (approximation + bootstrapping + off-policy).</p> </div>"
        },
        {
          "question": "<div style='font-size: 0.95em; color: #333;'>2) Décrire le problème de surestimation dans DQN et expliquer comment Double DQN le résout.</div>",
          "reponse": "<div style='font-size: 0.95em; color: #1a3a5c;'> <p><strong>Problème de surestimation :</strong> DQN utilise \\( y = r + \\gamma \\max_{a'} Q_{\\text{target}}(s', a') \\). L'opérateur \\( \\max \\) introduit un biais positif : la valeur maximale d'estimations bruitées est surestimée.</p> <p><strong>Solution Double DQN :</strong> Séparer la sélection et l'évaluation de l'action. La cible devient :</p> <div class='math-block' style='background-color: #f5f5f5; padding: 10px; border-radius: 8px; margin: 5px 0;'> <div class='math' style='font-size: 1em; text-align: center; color: #1a1a1a;'> $$ y = r + \\gamma \\cdot Q_{\\text{target}}(s', \\arg\\max_a Q(s', a)) $$ </div> </div> <p>L'action est sélectionnée par le réseau principal, mais évaluée par le target network, réduisant la surestimation.</p> </div>"
        },
        {
          "question": "<div style='font-size: 0.95em; color: #333;'>3) L'architecture Dueling DQN sépare la valeur \\( V(s) \\) et l'avantage \\( A(s,a) \\). Expliquer en quoi cela améliore l'apprentissage.</div>",
          "reponse": "<div style='font-size: 0.95em; color: #1a3a5c;'> <p>Dueling DQN décompose \\( Q(s,a) = V(s) + (A(s,a) - \\frac{1}{|A|}\\sum_{a'}A(s,a')) \\).</p> <p><strong>Avantages :</strong></p> <ul> <li><strong>Généralisation :</strong> Le réseau apprend \\( V(s) \\) qui est utile pour tous les états, même sans avoir visité toutes les actions.</li> <li><strong>Efficacité :</strong> Dans certains états, la valeur \\( V(s) \\) domine, et l'agent n'a pas besoin d'apprendre la valeur de chaque action séparément.</li> <li><strong>Stabilité :</strong> L'apprentissage est plus stable car les deux composantes sont apprises séparément.</li> </ul> </div>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Méthodes Actor-Critic et Policy Gradient",
      "points": "7 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; padding: 10px;'> <p style='font-size: 0.95em; line-height: 1.5; color: #333;'>On considère un agent utilisant l'algorithme <strong>Actor-Critic</strong> avec un avantage (advantage) pour apprendre dans un environnement continu. L'agent est composé de deux réseaux :</p> <ul style='font-size: 0.95em; line-height: 1.6; color: #333;'> <li><strong>Actor</strong> : paramétré par \\( \\theta \\), représentant la politique \\( \\pi_\\theta(a|s) \\).</li> <li><strong>Critic</strong> : paramétré par \\( \\phi \\), représentant la fonction de valeur \\( V_\\phi(s) \\).</li> </ul> <p style='font-size: 0.95em; line-height: 1.5; color: #333;'>L'agent collecte des trajectoires et met à jour les paramètres en utilisant le gradient de la politique et la fonction d'avantage \\( A(s,a) = Q(s,a) - V(s) \\).</p> </div>",
      "questions": [
        {
          "question": "<div style='font-size: 0.95em; color: #333;'>1) Rappeler le théorème du gradient de la politique pour une politique paramétrée \\( \\pi_\\theta \\).</div>",
          "reponse": "<div style='font-size: 0.95em; color: #1a3a5c;'> <p>Le théorème du gradient de la politique s'écrit :</p> <div class='math-block' style='background-color: #f5f5f5; padding: 10px; border-radius: 8px; margin: 5px 0;'> <div class='math' style='font-size: 1em; text-align: center; color: #1a1a1a;'> $$ \\nabla_\\theta J(\\theta) = \\mathbb{E}_{s \\sim d^\\pi, a \\sim \\pi_\\theta} \\left[ \\nabla_\\theta \\log \\pi_\\theta(a|s) \\, Q^\\pi(s,a) \\right] $$ </div> </div> <p>Il permet de mettre à jour la politique en suivant la direction qui maximise le retour espéré. L'utilisation de l'avantage \\( A(s,a) \\) à la place de \\( Q(s,a) \\) réduit la variance.</p> </div>"
        },
        {
          "question": "<div style='font-size: 0.95em; color: #333;'>2) Expliquer le rôle du critic (fonction de valeur) dans l'architecture Actor-Critic. Comment le critic est-il mis à jour ?</div>",
          "reponse": "<div style='font-size: 0.95em; color: #1a3a5c;'> <p>Le critic estime la fonction de valeur \\( V_\\phi(s) \\) ou \\( Q_\\phi(s,a) \\) pour évaluer la qualité des actions choisies par l'actor. Il fournit une estimation plus stable que les retours bruts de Monte Carlo, réduisant la variance.</p> <p><strong>Mise à jour du critic :</strong> Le critic est mis à jour par descente de gradient en minimisant l'erreur TD :</p> <div class='math-block' style='background-color: #f5f5f5; padding: 10px; border-radius: 8px; margin: 5px 0;'> <div class='math' style='font-size: 1em; text-align: center; color: #1a1a1a;'> $$ \\mathcal{L}(\\phi) = \\mathbb{E} \\left[ (r_t + \\gamma V_\\phi(s_{t+1}) - V_\\phi(s_t))^2 \\right] $$ </div> </div> <p>L'erreur TD est utilisée à la fois pour le critic et pour calculer l'avantage utilisé par l'actor.</p> </div>"
        },
        {
          "question": "<div style='font-size: 0.95em; color: #333;'>3) Comparer <strong>A2C</strong> (Advantage Actor-Critic) et <strong>A3C</strong> (Asynchronous Advantage Actor-Critic). Quels sont les avantages de l'approche asynchrone ?</div>",
          "reponse": "<div style='font-size: 0.95em; color: #1a3a5c;'> <p><strong>A2C (synchrone) :</strong> Plusieurs workers collectent des données en parallèle, puis une mise à jour centralisée est effectuée. L'apprentissage est stable et peut utiliser des GPUs efficacement.</p> <p><strong>A3C (asynchrone) :</strong> Chaque worker met à jour le réseau global indépendamment. L'asynchronisme réduit la corrélation entre les données, ce qui stabilise l'apprentissage et permet une meilleure exploration. A3C peut utiliser des CPUs multiples efficacement.</p> <p><strong>Avantages de l'asynchrone :</strong></p> <ul> <li>Diversité des données : les workers explorent différentes parties de l'espace d'état.</li> <li>Pas besoin de synchronisation : plus flexible.</li> <li>Moins de temps de calcul par étape.</li> </ul> </div>"
        }

    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
