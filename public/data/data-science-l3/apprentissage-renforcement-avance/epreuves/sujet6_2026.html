<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Apprentissage par Renforcement Avancé - L3",
  "classe": "Licence 3 Data Science",
  "sequence": "Évaluation Séquentielle 6",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Fondements et Composantes de l'Apprentissage par Renforcement",
      "points": "4 pts",
      "enonce": "<p>L'apprentissage par renforcement (RL) est une branche de l'intelligence artificielle qui permet à un agent d'apprendre à prendre des décisions en interagissant avec son environnement [citation:3]. Cette interaction est guidée par un système de récompenses et de pénalités, où l'agent cherche à maximiser les récompenses cumulées sur le long terme [citation:6].</p><p><strong>Définitions :</strong></p><ul><li>Un <strong>Processus de Décision Markovien (MDP)</strong> est un cadre mathématique qui formalise la prise de décision séquentielle en environnement incertain. Il repose sur la propriété de Markov, qui stipule que la probabilité de transition vers un nouvel état ne dépend que de l'état actuel et de l'action choisie [citation:6].</li><li>Les composantes clés d'un système RL sont : l'<strong>agent</strong>, l'<strong>environnement</strong>, l'<strong>état</strong>, l'<strong>action</strong>, la <strong>récompense</strong> et la <strong>politique</strong> [citation:6].</li></ul>",
      "questions": [
        {
          "question": "<p><strong>1.1 (2 pts)</strong> Expliquez ce qu'est un Processus de Décision Markovien (MDP) et citez ses principales composantes. Quelle est la propriété clé qui le caractérise ?</p>",
          "reponse": "<p>Un Processus de Décision Markovien (MDP) est un cadre mathématique pour modéliser des problèmes de décision séquentielle où les résultats sont partiellement aléatoires et partiellement sous le contrôle d'un décideur. Ses principales composantes sont : l'ensemble des états (S), l'ensemble des actions (A), la fonction de transition (P) qui définit la probabilité de passer d'un état à un autre après une action, et la fonction de récompense (R). La propriété clé qui caractérise un MDP est la <strong>propriété de Markov</strong> : la probabilité de transition vers un nouvel état et la récompense associée ne dépendent que de l'état actuel et de l'action choisie, et non de l'historique des états et actions précédents [citation:6].</p>"
        },
        {
          "question": "<p><strong>1.2 (2 pts)</strong> Distinguez et comparez l'apprentissage par renforcement (RL) des autres formes d'apprentissage automatique (supervisé et non supervisé) [citation:3]. Pour chaque type, précisez l'objectif principal et la nature des données utilisées.</p>",
          "reponse": "<p>Ces trois formes d'apprentissage se distinguent par leur objectif et la nature des données utilisées [citation:3] :</p><ul><li><strong>Apprentissage supervisé :</strong> L'objectif est la prédiction ou la classification à partir d'exemples étiquetés (entrées et sorties désirées). Il apprend à mapper des entrées sur des sorties.</li><li><strong>Apprentissage non supervisé :</strong> L'objectif est la découverte de structures cachées dans des données non étiquetées. Il cherche à regrouper ou à réduire la dimensionnalité des données.</li><li><strong>Apprentissage par renforcement :</strong> L'objectif est l'apprentissage d'une politique de prise de décision séquentielle optimale. Il utilise un signal de récompense pour guider l'apprentissage par essais et erreurs, sans données étiquetées [citation:6].</li></ul><p>En résumé, l'apprentissage supervisé permet d'apprendre à partir d'exemples, l'apprentissage non supervisé permet d'apprendre à comprendre les données, et l'apprentissage par renforcement permet d'apprendre à bien agir pour atteindre un objectif [citation:6].</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Exploration de l'Environnement MuJoCo",
      "points": "6 pts",
      "enonce": "<p>Vous êtes un data scientist dans un laboratoire de robotique. Vous devez entraîner un agent à contrôler un robot humanoïde pour qu'il apprenne à marcher. Vous avez choisi l'environnement <strong>Humanoid-v4</strong> de <strong>MuJoCo</strong> (Multi-Joint dynamics with Contact), un moteur physique conçu pour la recherche en robotique. MuJoCo simule des corps rigides avec des contacts et des frottements, ce qui en fait un outil de référence pour les tâches de contrôle continu [citation:2].</p><p><strong>Problématique :</strong> La tâche est complexe car l'espace d'états est continu (positions, vitesses, angles de 21 articulations) et l'espace d'actions est également continu (forces à appliquer aux articulations). Vous devez choisir un algorithme de RL adapté pour entraîner votre agent efficacement.</p>",
      "questions": [
        {
          "question": "<p><strong>2.1 (2 pts)</strong> Identifiez les défis spécifiques posés par l'environnement Humanoid-v4 (espaces continus, physique réaliste). Proposez une famille d'algorithmes adaptée à ce type d'environnement en justifiant votre choix.</p>",
          "reponse": "<p>Les défis de l'environnement Humanoid-v4 sont :</p><ul><li><strong>Espace d'états continu :</strong> Les états sont des vecteurs de grande dimension (positions, vitesses, angles), ce qui rend l'approche tabulaire impossible.</li><li><strong>Espace d'actions continu :</strong> Les actions sont des forces à appliquer, ce qui nécessite des algorithmes capables de produire des valeurs réelles.</li><li><strong>Physique réaliste :</strong> La simulation de la gravité, des frottements et des contacts rend l'apprentissage plus difficile [citation:2].</li></ul><p>La famille d'algorithmes adaptée est celle des <strong>méthodes Actor-Critic pour espaces d'actions continus</strong>, comme <strong>SAC</strong> (Soft Actor-Critic) ou <strong>DDPG</strong> (Deep Deterministic Policy Gradient). Ces algorithmes utilisent un réseau de neurones pour l'acteur (politique) et un autre pour le critique (fonction de valeur), ce qui leur permet de traiter des espaces continus.</p>"
        },
        {
          "question": "<p><strong>2.2 (2 pts)</strong> Définissez la fonction de récompense pour cette tâche. Que doit-elle encourager ? Quels comportements doit-elle pénaliser pour que le robot apprenne à marcher correctement ?</p>",
          "reponse": "<p>La fonction de récompense doit être conçue pour encourager le robot à avancer tout en maintenant son équilibre. Elle pourrait inclure :</p><ul><li><strong>Récompense positive :</strong> pour la vitesse de déplacement vers l'avant (proportionnelle à la vitesse x), pour le maintien d'une posture droite (hauteur du centre de masse).</li><li><strong>Pénalités :</strong> pour la chute (coût important), pour des mouvements trop brusques ou énergivores (coût d'énergie), pour un écart trop important par rapport à la position verticale.</li></ul><p>L'objectif est d'atteindre un compromis entre la vitesse de progression et la stabilité, en maximisant la récompense cumulative.</p>"
        },
        {
          "question": "<p><strong>2.3 (2 pts)</strong> Expliquez le concept de <strong>compromis exploration-exploitation</strong> et son importance dans ce contexte [citation:3]. Quelle stratégie d'exploration pourrait être efficace pour un environnement continu ?</p>",
          "reponse": "<p>Le <strong>compromis exploration-exploitation</strong> est un équilibre crucial entre :</p><ul><li><strong>Exploration :</strong> Essayer de nouvelles actions pour découvrir des stratégies potentiellement plus efficaces [citation:3].</li><li><strong>Exploitation :</strong> Utiliser les actions qui ont déjà prouvé leur efficacité pour maximiser la récompense.</li></ul><p>Dans un environnement continu, l'exploration purement aléatoire est inefficace car l'espace des actions est infini. Une stratégie efficace est l'<strong>exploration paramétrique</strong> (ajout de bruit gaussien aux actions) comme dans DDPG, ou l'<strong>exploration par entropie</strong> comme dans SAC, qui encourage la diversité des actions tout en restant proche de la politique actuelle.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 3 : Conception d'une Fonction de Récompense",
      "points": "4 pts",
      "enonce": "<p>Vous travaillez sur un projet de <strong>RL en robotique</strong> pour un drone agricole. Le drone doit survoler un champ et pulvériser des pesticides uniquement sur les zones infestées par des parasites [citation:1].</p><p><strong>Objectif :</strong> Le drone doit maximiser la précision de la pulvérisation tout en minimisant la consommation de pesticides et en évitant les obstacles.</p>",
      "questions": [
        {
          "question": "<p><strong>3.1 (2 pts)</strong> Proposez une fonction de récompense détaillée pour ce problème. Expliquez chaque terme de la récompense et quel comportement il encourage.</p>",
          "reponse": "<p>La fonction de récompense pourrait être définie comme suit :</p><div class='math-block'><div class='math'>$$ R = \\alpha \\cdot R_{pulvérisation} - \\beta \\cdot C_{pesticide} - \\gamma \\cdot R_{obstacle} - \\delta \\cdot C_{énergie} $$</div></div><ul><li><strong>R_{pulvérisation} :</strong> Récompense positive pour avoir pulvérisé sur une zone infestée. Elle peut être proportionnelle à la surface correctement traitée.</li><li><strong>C_{pesticide} :</strong> Coût de la pulvérisation. Plus le drone utilise de pesticides, plus la pénalité est élevée.</li><li><strong>R_{obstacle} :</strong> Pénalité en cas de collision avec un obstacle (arbre, pylône).</li><li><strong>C_{énergie} :</strong> Coût énergétique du vol. Plus le drone vole longtemps, plus la pénalité est élevée.</li></ul><p>Les coefficients α, β, γ, δ permettent de pondérer l'importance relative de chaque objectif.</p>"
        },
        {
          "question": "<p><strong>3.2 (2 pts)</strong> Discutez des difficultés liées à la conception de cette fonction de récompense. Comment pourriez-vous résoudre le problème des récompenses rares (sparse rewards) [citation:2] ?</p>",
          "reponse": "<p>Les difficultés sont :</p><ul><li><strong>Récompenses rares :</strong> Le drone peut passer beaucoup de temps sans trouver de zone infestée, ce qui ralentit l'apprentissage [citation:2].</li><li><strong>Équilibrage des objectifs :</strong> Il est difficile de trouver les bons coefficients pour équilibrer les différents objectifs (précision vs économie de pesticides).</li><li><strong>Généralisation :</strong> La fonction de récompense doit être adaptable à différents types de champs.</li></ul><p>Pour résoudre le problème des récompenses rares, on peut utiliser des <strong>récompenses intrinsèques</strong> (curiosité) comme l'<strong>ICM</strong> (Intrinsic Curiosity Module), qui récompense l'agent pour avoir visité des états nouveaux [citation:5]. On peut aussi utiliser l'<strong>exploration par comptage</strong> ou le <strong>pseudo-comptage</strong> pour estimer la nouveauté des états.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 4 : Étude de Cas - DQN sur un Environnement de Jeu",
      "points": "6 pts",
      "enonce": "<p>Vous développez un agent pour jouer à un jeu vidéo de type Atari. Vous avez choisi d'utiliser l'algorithme <strong>DQN</strong> (Deep Q-Network), qui combine les réseaux de neurones profonds avec le Q-learning [citation:4].</p><p><strong>Définition :</strong> DQN utilise un réseau de neurones pour approximer la fonction Q(s,a). Il intègre deux mécanismes clés : le <strong>replay buffer</strong> (tampon d'expérience) et le <strong>target network</strong> (réseau cible) pour stabiliser l'apprentissage.</p>",
      "questions": [
        {
          "question": "<p><strong>4.1 (2 pts)</strong> Expliquez le fonctionnement du <strong>replay buffer</strong> (tampon d'expérience) et son rôle dans l'algorithme DQN. Pourquoi est-il important pour l'apprentissage ?</p>",
          "reponse": "<p>Le <strong>replay buffer</strong> est une mémoire qui stocke les expériences de l'agent sous forme de transitions (s, a, r, s') au fur et à mesure de son interaction avec l'environnement. Lors de l'entraînement, des mini-batchs de transitions sont échantillonnés aléatoirement dans ce buffer [citation:4].</p><p>Son rôle est double :</p><ul><li><strong>Casser la corrélation :</strong> Les transitions successives sont souvent corrélées (ex: images d'un jeu vidéo). En échantillonnant aléatoirement, on réduit cette corrélation et on stabilise l'apprentissage.</li><li><strong>Réutiliser les données :</strong> Chaque expérience peut être utilisée plusieurs fois, ce qui améliore l'efficacité d'échantillonnage.</li></ul>"

          "reponse": "<p>Le <strong>target network</strong> est un deuxième réseau de neurones qui est une copie du réseau principal, mais dont les poids sont mis à jour moins fréquemment (par exemple, toutes les N étapes). Il est utilisé pour calculer la cible Q-learning [citation:4].</p><p>En ayant une cible qui évolue plus lentement que la fonction Q elle-même, on réduit les oscillations et les divergences dans l'apprentissage. Sans target network, la cible change à chaque mise à jour du réseau, ce qui crée un problème de 'cible mouvante' et peut empêcher la convergence.</p>"

          "question": "<p><strong>4.3 (2 pts)</strong> Comparez l'approche DQN (Deep Q-Network) avec une méthode de Policy Gradient comme REINFORCE. Quels sont les avantages et inconvénients de chaque approche ?</p>",
          "reponse": "<table style='width:100%; border-collapse:collapse; font-size:0.9em;'><tr style='background-color:#f2f2f2;'><th style='border:1px solid #ddd; padding:8px;'>Critère</th><th style='border:1px solid #ddd; padding:8px;'>DQN (méthode basée sur la valeur)</th><th style='border:1px solid #ddd; padding:8px;'>REINFORCE (méthode basée sur la politique)</th></tr><tr><td style='border:1px solid #ddd; padding:8px;'><strong>Principe</strong></td><td style='border:1px solid #ddd; padding:8px;'>Apprend la fonction Q(s,a) pour en déduire une politique.</td><td style='border:1px solid #ddd; padding:8px;'>Apprend directement la politique π(a|s).</td></tr><tr><td style='border:1px solid #ddd; padding:8px;'><strong>Avantages</strong></td><td style='border:1px solid #ddd; padding:8px;'>Efficace pour les espaces d'actions discrets, peut utiliser le replay buffer pour plus de stabilité.</td><td style='border:1px solid #ddd; padding:8px;'>Fonctionne dans les espaces d'actions continus, convergence théorique.</td></tr><tr><td style='border:1px solid #ddd; padding:8px;'><strong>Inconvénients</strong></td><td style='border:1px solid #ddd; padding:8px;'>Difficile à adapter aux actions continues, peut surestimer les valeurs.</td><td style='border:1px solid #ddd; padding:8px;'>Variance élevée, nécessite souvent beaucoup d'épisodes pour converger.</td></tr></table>"
        }

};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
