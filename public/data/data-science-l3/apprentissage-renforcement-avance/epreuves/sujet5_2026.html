<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Apprentissage par Renforcement Avancé - L3",
  "classe": "Licence 3 Data Science",
  "sequence": "Séquence 5",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Questions de Cours (8 pts)",
      "points": "8 pts",
      "enonce": "<div style='font-size:1.1em; line-height:1.6; color:#333;'>Ce premier exercice vise à évaluer votre compréhension des concepts fondamentaux et avancés vus en cours. Répondez aux questions suivantes de manière concise et précise.</div>",
      "questions": [
        {
          "question": "<div style='font-size:1.05em; line-height:1.6;'><strong>1.1 (2 pts)</strong> Expliquez clairement la différence entre un algorithme <strong>On-Policy</strong> et <strong>Off-Policy</strong> en apprentissage par renforcement. Donnez un exemple concret pour chaque catégorie que nous avons étudiée.</div>",
          "reponse": "<div style='font-size:1.05em; line-height:1.6; background:#f0f8ff; padding:15px; border-radius:8px; border-left:4px solid #2196F3;'><p><strong>Éléments de réponse :</strong></p><ul><li><strong>On-Policy</strong> : L'algorithme évalue et améliore la même politique qui est utilisée pour prendre des décisions (politique de comportement = politique cible). Il apprend à partir des actions qu'il exécute. <strong>Exemple : SARSA</strong> [citation:10].</li><li><strong>Off-Policy</strong> : L'algorithme apprend la valeur de la politique optimale indépendamment de la politique utilisée pour explorer (politique de comportement ≠ politique cible). Il peut apprendre à partir de données générées par une autre politique. <strong>Exemple : Q-Learning</strong> [citation:3].</li></ul></div>"
        },
        {
          "question": "<div style='font-size:1.05em; line-height:1.6;'><strong>1.2 (2 pts)</strong> L'algorithme <strong>DQN (Deep Q-Network)</strong> introduit deux innovations majeures par rapport au Q-Learning tabulaire pour stabiliser l'apprentissage avec des réseaux de neurones. Nommez et expliquez brièvement ces deux mécanismes.</div>",
          "reponse": "<div style='font-size:1.05em; line-height:1.6; background:#f0f8ff; padding:15px; border-radius:8px; border-left:4px solid #2196F3;'><p><strong>Éléments de réponse :</strong></p><ul><li><strong>Experience Replay (Replay Buffer)</strong> : Les transitions (<em>s, a, r, s'</em>) sont stockées dans une mémoire tampon. L'apprentissage se fait sur des mini-batchs tirés aléatoirement de cette mémoire, ce qui brise les corrélations temporelles entre les données et stabilise l'apprentissage [citation:1].</li><li><strong>Target Network</strong> : Un réseau de neurones séparé (copie du réseau principal) est utilisé pour calculer la cible <em>y = r + γ max<sub>a'</sub> Q(s', a' ; θ<sup>-</sup>)</em>. Les paramètres de ce réseau (<em>θ<sup>-</sup></em>) sont mis à jour plus lentement (par copie périodique ou mise à jour douce [citation:1]), ce qui réduit l'instabilité liée aux mises à jour brusques.</li></ul></div>"
        },
        {
          "question": "<div style='font-size:1.05em; line-height:1.6;'><strong>1.3 (2 pts)</strong> Dans l'architecture <strong>Actor-Critic</strong>, quels sont les rôles respectifs de l'<strong>Actor</strong> et du <strong>Critic</strong> ? Expliquez leur interaction.</div>",
          "reponse": "<div style='font-size:1.05em; line-height:1.6; background:#f0f8ff; padding:15px; border-radius:8px; border-left:4px solid #2196F3;'><p><strong>Éléments de réponse :</strong></p><ul><li><strong>Actor</strong> : C'est la politique. Son rôle est de sélectionner les actions en fonction de l'état courant. Il est paramétré par des poids θ et produit une distribution de probabilité sur les actions (ou une action déterministe).</li><li><strong>Critic</strong> : C'est l'évaluateur. Son rôle est d'estimer la fonction de valeur (V(s) ou Q(s,a)) pour juger de la qualité des actions choisies par l'Actor. Il est paramétré par des poids w.</li><li><strong>Interaction</strong> : L'Actor choisit une action. Le Critic évalue cette action (via l'avantage). Cette évaluation est utilisée pour calculer le gradient de politique et mettre à jour l'Actor dans le sens de l'amélioration. Le Critic est mis à jour pour être plus précis dans ses évaluations.</li></ul></div>"
        },
        {
          "question": "<div style='font-size:1.05em; line-height:1.6;'><strong>1.4 (2 pts)</strong> Citez et décrivez brièvement deux techniques d'<strong>exploration avancée</strong> vues en cours, en expliquant leur principe et dans quel contexte elles sont utiles.</div>",
          "reponse": "<div style='font-size:1.05em; line-height:1.6; background:#f0f8ff; padding:15px; border-radius:8px; border-left:4px solid #2196F3;'><p><strong>Éléments de réponse :</strong></p><ul><li><strong>Exploration par Curiosité (ICM)</strong> : L'agent est récompensé pour avoir accompli des actions qui le mènent vers des états qu'il ne sait pas prédire. Un module de prédiction de la dynamique (ou des caractéristiques) est entraîné, et l'erreur de prédiction sert de récompense intrinsèque [citation:6]. Utile dans les environnements avec récompenses très éparses.</li><li><strong>Exploration par Incertitude Bayésienne (Bootstrapped DQN)</strong> : On utilise plusieurs estimateurs de valeur Q (un réseau avec plusieurs têtes). L'incertitude est mesurée par la variance entre les prédictions de ces têtes. L'agent est encouragé à explorer les actions pour lesquelles cette incertitude est élevée (principe d'optimisme face à l'incertitude). Utile pour guider l'exploration de manière structurée dans des espaces d'états complexes.</li></ul></div>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Mise en Situation Pratique (12 pts)",
      "points": "12 pts",
      "enonce": "<div style='font-size:1.1em; line-height:1.6; color:#333;'>Dans cet exercice, vous êtes un ingénieur en Data Science chargé de résoudre un problème de contrôle robotique. Vous devez concevoir une solution et comparer différentes approches.</div>",
      "questions": [
        {
          "question": "<div style='font-size:1.05em; line-height:1.6;'><strong>2.1 (4 pts)</strong> On vous confie la tâche d'apprendre à un bras robotique à saisir un objet. L'état est un vecteur de 100 dimensions (positions, vitesses, forces). Les actions sont les couples (torques) à appliquer à 7 articulations, chaque couple étant une valeur continue entre -1.0 et 1.0. Expliquez pourquoi les méthodes comme <strong>DQN</strong> ne sont pas directement adaptées à ce problème et justifiez le choix des algorithmes que vous utiliseriez.</div>",
          "reponse": "<div style='font-size:1.05em; line-height:1.6; background:#f0f8ff; padding:15px; border-radius:8px; border-left:4px solid #2196F3;'><p><strong>Éléments de réponse :</strong></p><p><strong>Problème de DQN :</strong> DQN est conçu pour des espaces d'actions discrets. Dans ce cas, l'espace des actions est continu (7 actions avec des valeurs continues). Pour utiliser DQN, il faudrait discrétiser l'espace des actions, ce qui est impraticable car le nombre d'actions grandirait exponentiellement avec la dimension (fléau de la dimensionnalité) et entraînerait une perte de précision [citation:3].</p><p><strong>Algorithmes adaptés :</strong> Il faut utiliser des algorithmes conçus pour les actions continues, comme :</p><ul><li><strong>DDPG (Deep Deterministic Policy Gradient)</strong> : Un algorithme Actor-Critic pour les actions continues, utilisant un replay buffer et un target network [citation:1, 3].</li><li><strong>TD3 (Twin Delayed DDPG)</strong> : Une amélioration de DDPG qui corrige la surestimation des valeurs en utilisant deux critiques et des mises à jour retardées.</li><li><strong>SAC (Soft Actor-Critic)</strong> : Un algorithme très robuste qui maximise l'entropie en plus de la récompense, ce qui encourage l'exploration et est souvent le plus performant en robotique.</li></ul><p>Ces algorithmes apprennent directement une politique (l'Actor) qui mappe les états vers les actions continues.</p></div>"
        },
        {
          "question": "<div style='font-size:1.05em; line-height:1.6;'><strong>2.2 (4 pts)</strong> Vous décidez de comparer trois algorithmes : <strong>PPO (Proximal Policy Optimization)</strong>, <strong>SAC (Soft Actor-Critic)</strong> et <strong>TD3 (Twin Delayed DDPG)</strong> sur le problème de saisie. Décrivez le protocole de comparaison que vous mettriez en place. Citez au moins 3 métriques et expliquez pourquoi vous les choisissez.</div>",
          "reponse": "<div style='font-size:1.05em; line-height:1.6; background:#f0f8ff; padding:15px; border-radius:8px; border-left:4px solid #2196F3;'><p><strong>Éléments de réponse pour le protocole :</strong></p><ul><li><strong>Environnement commun :</strong> Utiliser la même simulation (ex: MuJoCo, PyBullet avec un modèle de bras robotique) et la même graine aléatoire pour chaque algorithme.</li><li><strong>Budget total :</strong> Fixer un nombre maximal de pas d'interaction (ex: 1 million ou 5 millions) ou un temps d'entraînement maximal.</li><li><strong>Évaluations régulières :</strong> Tous les N pas (ex: 10 000), évaluer la politique actuelle sur un ensemble fixe de M épisodes (ex: 20) sans exploration.</li><li><strong>Répétitions :</strong> Lancer chaque algorithme plusieurs fois (ex: 5 à 10) avec des graines aléatoires différentes pour mesurer la robustesse.</li></ul><p><strong>Métriques proposées :</strong></p><ul><li><strong>Récompense cumulative moyenne</strong> : La performance finale de l'algorithme. Une récompense plus élevée (taux de succès de saisie, vitesse, précision) est meilleure.</li><li><strong>Efficacité d'échantillonnage (Sample Efficiency)</strong> : Nombre de pas nécessaires pour atteindre un seuil de performance donné (ex: 80% de succès). Cela mesure la rapidité d'apprentissage, cruciale si l'interaction est coûteuse.</li><li><strong>Stabilité / Robustesse</strong> : Écart-type des performances sur les différentes exécutions. Un algorithme robuste a une variance faible, ce qui est important pour une utilisation fiable.</li><li><strong>Temps d'entraînement</strong> : Mesurer le temps CPU/GPU nécessaire pour atteindre une bonne performance. Pratique si les ressources sont limitées.</li></ul></div>"
        },
        {
          "question": "<div style='font-size:1.05em; line-height:1.6;'><strong>2.3 (4 pts)</strong> Décrivez brièvement l'architecture d'un réseau de neurones pour l'<strong>Actor</strong> dans le cadre du problème de saisie. Quelle est la fonction d'activation de la couche de sortie et pourquoi ? En quoi l'aspect 'entropie' de SAC pourrait-il être particulièrement bénéfique pour cette tâche ?</div>",
          "reponse": "<div style='font-size:1.05em; line-height:1.6; background:#f0f8ff; padding:15px; border-radius:8px; border-left:4px solid #2196F3;'><p><strong>Éléments de réponse pour l'architecture :</strong></p><ul><li><strong>Entrée :</strong> L'état de dimension 100.</li><li><strong>Couches cachées :</strong> Typiquement 2 à 3 couches denses (fully connected) de tailles 256 ou 512 neurones chacune, avec des activations ReLU.</li><li><strong>Sortie (Action) :</strong> Une couche de dimension 7 (une par articulation).</li><li><strong>Fonction d'activation de sortie :</strong> <strong>Tanh</strong>. L'action est bornée entre -1 et 1. La fonction Tanh est parfaitement adaptée car elle produit directement des valeurs dans cet intervalle. Si les actions ont d'autres bornes, on peut les mettre à l'échelle après la sortie Tanh.</li></ul><p><strong>Bénéfice de l'entropie dans SAC :</strong></p><ul><li>SAC maximise la récompense <em>et</em> l'entropie de la politique. En pratique, cela signifie que la politique est encouragée à être aussi aléatoire que possible tout en étant performante.</li><li><strong>Dans le contexte de la saisie robotique :</strong> Cela force le robot à essayer différentes façons de se déplacer pour attraper l'objet, même si l'agent pense déjà connaître une bonne stratégie. Cela permet de découvrir des stratégies plus robustes, d'éviter de se bloquer dans des minima locaux (ex: toujours essayer la même trajectoire qui échoue), et de généraliser à différentes positions de l'objet. En d'autres termes, cela améliore l'exploration dans l'espace des actions continues, rendant SAC particulièrement efficace pour ce type de tâches complexes [citation:3].</li></ul></div>"

};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
