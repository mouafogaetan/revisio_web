<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>

            <span id="sequenceInfo">Séquence</span>

        </div>

    <!-- BODY -->

                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>

            </button>

                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
 "matiere": "Apprentissage par Renforcement Avancé - L3",
 "classe": "Licence 3 Data Science",
 "sequence": "Séquence 1",
 "anneeScolaire": "2025-2026",
 "exercices": [
   {
     "titre": "Processus Décisionnels de Markov et Équations de Bellman",
     "points": "6 pts",
     "enonce": "<p>Dans cette première partie, nous allons vérifier votre compréhension des fondements mathématiques de l'apprentissage par renforcement.</p><p>Considérez un environnement simple avec trois états <strong>A</strong>, <strong>B</strong> et <strong>C</strong>. L'agent peut effectuer deux actions : <strong>gauche</strong> (G) et <strong>droite</strong> (D). Les transitions sont déterministes :</p><ul><li>Depuis A : G → B, D → C</li><li>Depuis B : G → A, D → C</li><li>Depuis C : G → A, D → B (état terminal)</li></ul><p>La récompense est de +1 pour toute transition entrant dans l'état C, et de 0 autrement. Le facteur d'actualisation est \\( \\gamma = 0.9 \\).</p>",
     "questions": [
       {
         "question": "<p><strong>1) (2 pts)</strong> Définissez formellement ce problème comme un Processus Décisionnel de Markov (MDP) en identifiant clairement les quatre éléments \\( (S, A, P, R) \\) [citation:3][citation:12]. Décrivez la fonction de transition \\( P(s'|s,a) \\) et la fonction de récompense \\( R(s,a,s') \\) pour chaque transition possible.</p>",
         "reponse": "<p><strong>Corrigé :</strong></p><ul><li><strong>États (S)</strong> : \\( S = \\{A, B, C\\} \\)</li><li><strong>Actions (A)</strong> : \\( A = \\{G, D\\} \\)</li><li><strong>Transitions (P)</strong> : \\( P(B|A,G)=1, P(C|A,D)=1, P(A|B,G)=1, P(C|B,D)=1, P(A|C,G)=1, P(B|C,D)=1 \\)</li><li><strong>Récompenses (R)</strong> : \\( R = 1 \\) si la transition arrive en C, sinon \\( R = 0 \\)</li></ul>"
       },
       {
         "question": "<p><strong>2) (2 pts)</strong> En utilisant l'équation de Bellman pour la fonction de valeur d'état \\( V^{\\pi}(s) \\), calculez la valeur de chaque état pour une politique aléatoire où l'agent choisit G ou D avec une probabilité de 0.5 [citation:3][citation:9].</p><p>Rappel : \\( V^{\\pi}(s) = \\sum_a \\pi(a|s) \\sum_{s'} P(s'|s,a) [R(s,a,s') + \\gamma V^{\\pi}(s')] \\)</p>",
         "reponse": "<p><strong>Corrigé :</strong></p><p>Soit \\( V_A, V_B, V_C \\) les valeurs des états A, B et C. Pour la politique aléatoire :</p><p>Pour A : \\( V_A = 0.5(0 + 0.9V_B) + 0.5(1 + 0.9V_C) = 0.45V_B + 0.5 + 0.45V_C \\)</p><p>Pour B : \\( V_B = 0.5(0 + 0.9V_A) + 0.5(1 + 0.9V_C) = 0.45V_A + 0.5 + 0.45V_C \\)</p><p>Pour C (état terminal) : \\( V_C = 0 \\)</p><p>En résolvant ce système d'équations :</p><p>\\( V_A = 0.45V_B + 0.5 \\)</p><p>\\( V_B = 0.45V_A + 0.5 \\)</p><p>En substituant : \\( V_A = 0.45(0.45V_A + 0.5) + 0.5 = 0.2025V_A + 0.225 + 0.5 = 0.2025V_A + 0.725 \\)</p><p>Donc \\( V_A(1 - 0.2025) = 0.725 \\) → \\( V_A \\approx 0.909 \\)</p><p>Et \\( V_B \\approx 0.909 \\), \\( V_C = 0 \\)</p>"
       },
       {
         "question": "<p><strong>3) (2 pts)</strong> Expliquez le concept de point fixe d'une application contractante en lien avec l'équation de Bellman [citation:3][citation:9]. Pourquoi cette propriété est-elle fondamentale pour l'apprentissage par renforcement ?</p>",
         "reponse": "<p><strong>Corrigé :</strong></p><p>L'opérateur de Bellman est une application contractante dans l'espace des fonctions de valeur. Un point fixe est une fonction \\( V \\) telle que \\( V = T(V) \\), où \\( T \\) est l'opérateur de Bellman. La propriété de contraction garantit que :</p><ul><li>L'équation de Bellman admet une solution unique</li><li>Les algorithmes itératifs (comme Value Iteration) convergent vers cette solution quelle que soit l'initialisation</li></ul><p>Cette propriété est fondamentale car elle assure que les méthodes d'apprentissage par renforcement, comme Q-Learning, peuvent converger vers une politique optimale à partir de n'importe quelle estimation initiale [citation:3].</p>"
       }
     ]
   },
   {
     "titre": "Q-Learning et SARSA : Comparaison Off-Policy vs On-Policy",
     "points": "7 pts",
     "enonce": "<p>Cette partie explore les différences fondamentales entre les algorithmes Q-Learning et SARSA. Vous allez analyser leurs comportements dans un environnement avec des risques [citation:6].</p><p>Considérez le chemin suivant où l'agent doit aller de S (départ) à G (but) en évitant le précipice (P) :</p><div style='background: #f0f0f0; padding: 15px; border-radius: 8px; text-align: center;'><p style='font-family: monospace; color: #2c3e50;'>[S] → [ ] → [ ] → [P] → [G]</p></div><p>Les actions possibles sont : Avancer (A) ou Sauter (S). Sauter permet d'éviter le précipice mais peut être risqué.</p>",
     "questions": [
       {
         "question": "<p><strong>1) (2 pts)</strong> Définissez clairement les concepts d'apprentissage <strong>on-policy</strong> et <strong>off-policy</strong> [citation:3][citation:6]. À quelle catégorie appartient SARSA ? Et Q-Learning ? Justifiez votre réponse.</p>",
         "reponse": "<p><strong>Corrigé :</strong></p><ul><li><strong>On-policy</strong> : L'algorithme évalue et améliore la même politique qui est utilisée pour prendre les décisions. SARSA est on-policy car il met à jour les Q-valeurs en utilisant l'action réellement exécutée par l'agent [citation:3].</li><li><strong>Off-policy</strong> : L'algorithme apprend une politique optimale différente de celle utilisée pour explorer. Q-Learning est off-policy car il met à jour les Q-valeurs en utilisant l'action optimale (max) plutôt que l'action réellement exécutée [citation:6].</li></ul>"
       },
       {
         "question": "<p><strong>2) (3 pts)</strong> Écrivez les règles de mise à jour de Q-Learning et SARSA. Identifiez clairement la différence dans la formule et expliquez son impact sur l'apprentissage [citation:8].</p><p>Q-Learning : \\( Q(s,a) \\leftarrow Q(s,a) + \\alpha [R + \\gamma \\max_{a'} Q(s',a') - Q(s,a)] \\)</p><p>SARSA : \\( Q(s,a) \\leftarrow Q(s,a) + \\alpha [R + \\gamma Q(s',a') - Q(s,a)] \\)</p>",
         "reponse": "<p><strong>Corrigé :</strong></p><p>La différence cruciale est que Q-Learning utilise la valeur maximale \\( \\max_{a'} Q(s',a') \\) pour la mise à jour, tandis que SARSA utilise la valeur de l'action réellement choisie \\( Q(s',a') \\) selon la politique.</p><p><strong>Impact :</strong></p><ul><li>Q-Learning (off-policy) apprend directement la politique optimale, ce qui peut être plus risqué dans des environnements stochastiques</li><li>SARSA (on-policy) apprend la politique tout en tenant compte de l'aléatoire de l'exploration, ce qui le rend plus prudent [citation:6]</li></ul>"
       },
       {
         "question": "<p><strong>3) (2 pts)</strong> Dans le scénario du précipice, quel algorithme serait le plus prudent si \\( \\epsilon \\) est grand (exploration importante) ? Expliquez votre réponse [citation:6].</p>",
         "reponse": "<p><strong>Corrigé :</strong></p><p>SARSA serait plus prudent car il apprend en tenant compte de l'aléatoire de l'exploration. Si l'agent explore avec une probabilité \\( \\epsilon \\), SARSA intègre cette exploration dans son apprentissage et va apprendre à éviter le précipice en anticipant les actions risquées [citation:6].</p><p>Q-Learning, en revanche, apprend la politique optimale qui peut être risquée (avancer), mais comme l'agent explore encore, il pourrait tomber dans le précipice [citation:6].</p>"
       }
     ]
   },
   {
     "titre": "Exploration : ε-Greedy vs Exploration Profonde",
     "points": "7 pts",
     "enonce": "<p>L'exploration est un défi majeur en apprentissage par renforcement, particulièrement dans les environnements où les récompenses sont rares [citation:2].</p><p>Un agent doit effectuer une séquence spécifique de 5 actions pour obtenir une récompense. L'espace d'actions contient 4 actions possibles. L'agent utilise une politique \\( \\epsilon \\)-greedy avec \\( \\epsilon = 0.1 \\).</p>",
     "questions": [
       {
         "question": "<p><strong>1) (2 pts)</strong> Calculez la probabilité que l'agent exécute la séquence correcte en utilisant la politique \\( \\epsilon \\)-greedy. Montrez vos calculs [citation:2].</p>",
         "reponse": "<p><strong>Corrigé :</strong></p><p>La séquence correcte de 5 actions a une probabilité de :</p><p>Pour que la séquence entière soit exécutée, l'agent doit choisir la bonne action à chaque étape. Avec \\( \\epsilon = 0.1 \\) :</p><ul><li>Probabilité de choisir la bonne action selon la politique : \\( (1-\\epsilon) + \\epsilon/4 = 0.9 + 0.025 = 0.925 \\)</li><li>Probabilité totale pour 5 actions : \\( (0.925)^5 \\approx 0.677 \\)</li></ul><p>Si la séquence nécessite des actions d'exploration spécifiques, la probabilité serait de : \\( \\epsilon^5 = (0.1)^5 = 0.00001 \\) [citation:2].</p>"
       },
       {
         "question": "<p><strong>2) (3 pts)</strong> Expliquez pourquoi la stratégie \\( \\epsilon \\)-greedy échoue souvent dans des environnements à récompenses rares nécessitant de longues séquences d'actions [citation:2]. Quelle est la probabilité d'exécuter une séquence de N actions spécifiques en utilisant \\( \\epsilon \\)-greedy ?</p>",
         "reponse": "<p><strong>Corrigé :</strong></p><p>La stratégie \\( \\epsilon \\)-greedy échoue dans les environnements à récompenses rares car :</p><ul><li>La probabilité d'exécuter une séquence de N actions spécifiques est approximativement \\( (1-\\epsilon)^N \\) si l'agent doit exploiter, ou \\( \\epsilon^N \\) s'il doit explorer</li><li>Pour N grand, cette probabilité devient extrêmement faible</li><li>L'agent a peu de chances de \"tomber\" sur la séquence correcte par hasard</li></ul><p>Par exemple, pour \\( N=10 \\) et \\( \\epsilon=0.1 \\), la probabilité est \\( (0.9)^{10} \\approx 0.348 \\) (exploitation) ou \\( (0.1)^{10} = 10^{-10} \\) (exploration) [citation:2].</p><p>C'est pourquoi des techniques d'exploration avancées comme Bootstrapped DQN ou ICM sont nécessaires [citation:2].</p>"
       },
       {
         "question": "<p><strong>3) (2 pts)</strong> Décrivez le principe de l'exploration par curiosité (ICM) et expliquez comment il résout le problème des récompenses rares [citation:2].</p>",
         "reponse": "<p><strong>Corrigé :</strong></p><p>L'Intrinsic Curiosity Module (ICM) ajoute une récompense intrinsèque basée sur l'erreur de prédiction d'un réseau de neurones. L'agent est récompensé lorsqu'il rencontre des situations qu'il ne peut pas prédire correctement [citation:2].</p><p><strong>Comment il résout le problème des récompenses rares :</strong></p><ul><li>L'agent n'attend plus une récompense externe pour apprendre</li><li>Il est motivé à explorer des régions de l'espace d'états où il peut progresser</li><li>La récompense intrinsèque guide l'agent vers les bonnes actions même sans récompense externe [citation:2]</li></ul>"
       }
     ]
   }
 ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
