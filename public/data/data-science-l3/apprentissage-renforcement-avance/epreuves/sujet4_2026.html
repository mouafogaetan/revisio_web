<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Apprentissage par Renforcement Avancé - L3",
  "classe": "Licence 3 Data Science",
  "sequence": "Évaluation Séquentielle n°4",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Optimisation de Politique : PPO vs TRPO",
      "points": "6 pts",
      "enonce": "<div style='background-color: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 15px; color: #212529;'><p style='font-weight: bold;'>Objectif :</p><p>Cet exercice évalue votre compréhension des algorithmes d'optimisation de politique proximale (PPO et TRPO) et de leurs fondements théoriques.</p></div><p>Répondez aux questions suivantes en justifiant vos réponses.</p>",
      "questions": [
        {
          "question": "<div style='margin-bottom: 10px;'><span style='font-weight: bold;'>1.</span> Expliquez en quelques lignes le concept de <span style='font-weight: bold;'>région de confiance</span> (trust region) dans TRPO. Pourquoi est-elle importante pour la stabilité de l'apprentissage ?</div>",
          "reponse": "<div style='background-color: #e9ecef; padding: 12px; border-radius: 6px; color: #212529;'><p>La région de confiance dans TRPO est une zone dans l'espace des paramètres où la <span style='font-weight: bold;'>divergence de Kullback-Leibler (KL)</span> entre l'ancienne et la nouvelle politique est inférieure à un seuil δ :</p><div class='math-block'><div class='math'>$$\\{\\theta : D_{KL}(\\pi_{\\theta_{\\text{old}}} \\parallel \\pi_\\theta) \\leq \\delta\\}$$</div></div><p>Elle est importante car elle <span style='font-weight: bold;'>garantit une amélioration monotone</span> de la politique en évitant les mises à jour trop brusques qui pourraient dégrader les performances. Cela permet de stabiliser l'apprentissage et d'éviter l'effondrement de la politique.</p></div>"
        },
        {
          "question": "<div style='margin-bottom: 10px;'><span style='font-weight: bold;'>2.</span> PPO simplifie l'approche de TRPO en utilisant une <span style='font-weight: bold;'>fonction de clipping</span>. Expliquez le principe de cette technique et son avantage en termes d'implémentation.</div>",
          "reponse": "<div style='background-color: #e9ecef; padding: 12px; border-radius: 6px; color: #212529;'><p>PPO utilise une fonction de <span style='font-weight: bold;'>clipping</span> sur le ratio de probabilité <span style='font-weight: bold;'>\(r_t(\\theta) = \\frac{\\pi_\\theta(a_t|s_t)}{\\pi_{\\theta_{\\text{old}}}(a_t|s_t)}\)</span> :</p><div class='math-block'><div class='math'>$$\\mathcal{L}^{\\text{CLIP}}(\\theta) = \\mathbb{E}[\\min(r_t(\\theta)A_t, \\text{clip}(r_t(\\theta), 1-\\epsilon, 1+\\epsilon)A_t)]$$</div></div><p><span style='font-weight: bold;'>Avantage :</span> Cette approche évite les calculs complexes de second ordre (matrice de Fisher) de TRPO, rendant l'implémentation <span style='font-weight: bold;'>plus simple et plus efficace</span> tout en conservant des performances comparables.</p></div>"
        },
        {
          "question": "<div style='margin-bottom: 10px;'><span style='font-weight: bold;'>3.</span> Comparez les approches <span style='font-weight: bold;'>PPO-clip</span> et <span style='font-weight: bold;'>PPO-penalty</span>. Quelles sont leurs différences et dans quel cas privilégier l'une ou l'autre ?</div>",
          "reponse": "<div style='background-color: #e9ecef; padding: 12px; border-radius: 6px; color: #212529;'><p><span style='font-weight: bold;'>PPO-clip :</span> Utilise un clipping du ratio de probabilité pour limiter les mises à jour. C'est la variante la plus utilisée car elle est <span style='font-weight: bold;'>simple et efficace</span>.</p><p><span style='font-weight: bold;'>PPO-penalty :</span> Ajoute une pénalité adaptative sur la divergence KL dans la fonction objectif :</p><div class='math-block'><div class='math'>$$\\mathcal{L}^{\\text{PENALTY}}(\\theta) = \\mathcal{L}(\\theta) - \\beta \\cdot D_{KL}(\\pi_{\\text{old}} \\parallel \\pi_\\theta)$$</div></div><p>PPO-clip est généralement préféré pour sa <span style='font-weight: bold;'>simplicité</span> et ses performances. PPO-penalty peut être utile lorsque la divergence KL doit être contrôlée plus finement, mais il est moins utilisé en pratique.</p></div>"
        }
      ]
    },
    {
      "titre": "Apprentissage par Renforcement Basé sur les Modèles",
      "points": "7 pts",
      "enonce": "<div style='background-color: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 15px; color: #212529;'><p style='font-weight: bold;'>Objectif :</p><p>Cet exercice aborde les concepts du Model-Based Reinforcement Learning, de l'architecture Dyna et d'AlphaZero.</p></div>",
      "questions": [
        {
          "question": "<div style='margin-bottom: 10px;'><span style='font-weight: bold;'>1.</span> Distinguez clairement les approches <span style='font-weight: bold;'>Model-Free</span> et <span style='font-weight: bold;'>Model-Based</span> en apprentissage par renforcement. Quels sont les avantages et inconvénients de chacune ?</div>",
          "reponse": "<div style='background-color: #e9ecef; padding: 12px; border-radius: 6px; color: #212529;'><p><span style='font-weight: bold;'>Model-Free RL :</span> Apprend directement une politique ou une fonction de valeur sans modéliser l'environnement.</p><ul><li><span style='font-weight: bold;'>Avantages :</span> Plus simple, robuste, bien adapté aux environnements complexes.</li><li><span style='font-weight: bold;'>Inconvénients :</span> Nécessite beaucoup d'interactions, peu d'efficacité des données.</li></ul><p><span style='font-weight: bold;'>Model-Based RL :</span> Apprend un modèle de l'environnement (transition et récompense) et l'utilise pour planifier.</p><ul><li><span style='font-weight: bold;'>Avantages :</span> Plus efficace en données, permet la planification.</li><li><span style='font-weight: bold;'>Inconvénients :</span> Complexe, propagation d'erreur, moins robuste en environnement stochastique.</li></ul></div>"
        },
        {
          "question": "<div style='margin-bottom: 10px;'><span style='font-weight: bold;'>2.</span> Décrivez l'<span style='font-weight: bold;'>architecture Dyna</span> et expliquez comment elle combine apprentissage et planification.</div>",
          "reponse": "<div style='background-color: #e9ecef; padding: 12px; border-radius: 6px; color: #212529;'><p>L'architecture Dyna combine trois composants :</p><ol><li><span style='font-weight: bold;'>Interaction directe</span> : L'agent interagit avec l'environnement réel pour collecter des transitions.</li><li><span style='font-weight: bold;'>Apprentissage du modèle</span> : Le modèle apprend à partir des transitions collectées.</li><li><span style='font-weight: bold;'>Planification</span> : Le modèle génère des transitions simulées qui sont utilisées pour mettre à jour la fonction de valeur ou la politique.</li></ol><p>Le cycle Dyna alterne entre l'interaction réelle et la planification, ce qui permet d'<span style='font-weight: bold;'>accélérer l'apprentissage</span> en utilisant des données générées par le modèle.</p></div>"
        },
        {
          "question": "<div style='margin-bottom: 10px;'><span style='font-weight: bold;'>3.</span> Expliquez le rôle de <span style='font-weight: bold;'>MCTS (Monte Carlo Tree Search)</span> dans AlphaZero. Comment interagit-il avec les réseaux de neurones de l'algorithme ?</div>",
          "reponse": "<div style='background-color: #e9ecef; padding: 12px; border-radius: 6px; color: #212529;'><p>Dans AlphaZero, <span style='font-weight: bold;'>MCTS</span> est utilisé pendant la phase d'inférence pour explorer l'arbre de jeu.</p><p>Il combine :</p><ul><li>Les prédictions du <span style='font-weight: bold;'>policy network</span> (\(p(s, a)\)) pour guider l'exploration vers les coups prometteurs.</li><li>Les évaluations du <span style='font-weight: bold;'>value network</span> (\(v(s)\)) pour estimer la valeur des positions.</li><li>Des simulations pour explorer les branches de l'arbre.</li></ul><p>L'équation de sélection dans MCTS est :</p><div class='math-block'><div class='math'>$$U(s, a) = Q(s, a) + c_{\\text{puct}} \\cdot P(s, a) \\cdot \\frac{\\sqrt{\\sum_b N(s, b)}}{1 + N(s, a)}$$</div></div><p>Le résultat est une sélection de coups de qualité supérieure qui permet à AlphaZero de battre les meilleurs joueurs humains.</p></div>"
        }
      ]
    },
    {
      "titre": "Exploration Avancée : Comptage, Curiosity et Incertitude",
      "points": "7 pts",
      "enonce": "<div style='background-color: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 15px; color: #212529;'><p style='font-weight: bold;'>Objectif :</p><p>Cet exercice évalue votre compréhension des techniques d'exploration avancées pour améliorer l'apprentissage dans des environnements complexes.</p></div>",
      "questions": [
        {
          "question": "<div style='margin-bottom: 10px;'><span style='font-weight: bold;'>1.</span> Qu'est-ce que l'<span style='font-weight: bold;'>exploration par comptage</span> (count-based exploration) ? Expliquez son principe et sa limitation dans les grands espaces d'états.</div>",
          "reponse": "<div style='background-color: #e9ecef; padding: 12px; border-radius: 6px; color: #212529;'><p>L'exploration par comptage consiste à attribuer une <span style='font-weight: bold;'>récompense intrinsèque</span> basée sur la fréquence de visite des états :</p><div class='math-block'><div class='math'>$$r_i(s) = \\frac{1}{\\sqrt{N(s)}}$$</div></div><p>où \(N(s)\) est le nombre de fois que l'état \(s\) a été visité.</p><p><span style='font-weight: bold;'>Limitation :</span> Dans les grands espaces d'états (comme les images), il est <span style='font-weight: bold;'>impossible de compter</span> chaque état distinct. On utilise alors des techniques comme le <span style='font-weight: bold;'>pseudo-comptage</span> avec des modèles de densité.</p></div>"
        },
        {
          "question": "<div style='margin-bottom: 10px;'><span style='font-weight: bold;'>2.</span> Décrivez le principe de l'<span style='font-weight: bold;'>exploration par curiosité (ICM)</span>. Comment l'erreur de prédiction est-elle utilisée comme récompense intrinsèque ?</div>",
          "reponse": "<div style='background-color: #e9ecef; padding: 12px; border-radius: 6px; color: #212529;'><p>ICM (Intrinsic Curiosity Module) utilise l'<span style='font-weight: bold;'>erreur de prédiction</span> d'un modèle de transition comme récompense intrinsèque.</p><p>L'architecture ICM comprend :</p><ol><li>Un <span style='font-weight: bold;'>encodeur</span> qui transforme l'état en une représentation latente.</li><li>Un <span style='font-weight: bold;'>modèle de transition</span> qui prédit la représentation de l'état suivant à partir de l'état courant et de l'action.</li><li>L'<span style='font-weight: bold;'>erreur de prédiction</span> mesure la nouveauté : plus l'erreur est grande, plus l'état est nouveau et intéressant.</li></ol><p>La récompense intrinsèque est :</p><div class='math-block'><div class='math'>$$r_i = \\frac{1}{2} \\|\\phi(s_{t+1}) - \\hat{\\phi}(s_{t+1})\\|^2$$</div></div><p>Cela encourage l'agent à explorer les états qu'il ne peut pas encore prédire.</p></div>"
        },
        {
          "question": "<div style='margin-bottom: 10px;'><span style='font-weight: bold;'>3.</span> Expliquez le principe de l'<span style='font-weight: bold;'>exploration par incertitude bayésienne</span> et décrivez le fonctionnement de <span style='font-weight: bold;'>Bootstrapped DQN</span>.</div>",
          "reponse": "<div style='background-color: #e9ecef; padding: 12px; border-radius: 6px; color: #212529;'><p>L'exploration par incertitude bayésienne utilise l'<span style='font-weight: bold;'>incertitude épistémique</span> (manque de connaissances) pour guider l'exploration.</p><p><span style='font-weight: bold;'>Bootstrapped DQN</span> est une approche pratique qui utilise un <span style='font-weight: bold;'>ensemble de K têtes</span> sur un réseau partagé :</p><ul><li>Chaque tête est initialisée différemment.</li><li>Chaque tête est entraînée sur un sous-ensemble de données (bootstrap).</li><li>L'<span style='font-weight: bold;'>incertitude</span> est mesurée par la variance entre les têtes.</li></ul><p>La stratégie de sélection d'action est :</p><div class='math-block'><div class='math'>$$a^* = \\arg\\max_a [\\mu(s, a) + \\beta \\cdot \\sigma(s, a)]$$</div></div><p>où \(\mu\) est la moyenne des prédictions et \(\sigma\) l'écart-type.</p></div>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
