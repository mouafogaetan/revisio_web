<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>

                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Traitement Automatique du Langage (NLP) - L3",
  "classe": "Licence 3 Data Science",
  "sequence": "Séquence 2",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Modèles de Langage N-grammes",
      "points": "5 pts",
      "enonce": "<div><p>Cet exercice porte sur les modèles de langage N-grammes. Vous devez calculer des probabilités, analyser les limites et proposer des solutions de lissage.</p><p>On considère le corpus d'entraînement suivant (phrases en français) :</p><ul><li>le chat mange la souris</li><li>le chien mange la viande</li><li>le chat dort sur le tapis</li></ul></div>",
      "questions": [
        {
          "question": "<p><strong>1.1</strong> Calculer la probabilité de la phrase \"le chat mange la viande\" en utilisant un modèle bigramme (N=2) sans lissage. Montrez vos calculs.</p><div class='math-block'><div class='math'>$$P(le\\ chat\\ mange\\ la\\ viande) = P(le) \\times P(chat|le) \\times P(mange|chat) \\times P(la|mange) \\times P(viande|la)$$</div></div>",
          "reponse": "<p><strong>Réponse 1.1</strong></p><p>**Étape 1 : Calcul des probabilités**</p><ul><li>P(le) = 3/14 ≈ 0.214 (3 occurrences de 'le' sur 14 mots)</li><li>P(chat|le) = 2/3 ≈ 0.667 (2 fois 'chat' après 'le')</li><li>P(mange|chat) = 1/2 = 0.5 (1 fois 'mange' après 'chat')</li><li>P(la|mange) = 0/1 = 0 (0 fois 'la' après 'mange')</li><li>P(viande|la) = 1/2 = 0.5 (1 fois 'viande' après 'la')</li></ul><p>**Étape 2 : Calcul final**</p><div class='math-block'><div class='math'>$$P = 0.214 \\times 0.667 \\times 0.5 \\times 0 \\times 0.5 = 0$$</div></div><p>La probabilité est nulle car la séquence 'mange la' n'apparaît pas dans le corpus.</p>"
        },
        {
          "question": "<p><strong>1.2</strong> Proposer une technique de lissage pour résoudre le problème de la probabilité nulle de la phrase précédente. Appliquez le lissage de Laplace (add-1) pour recalculer la probabilité de la phrase.</p>",
          "reponse": "<p><strong>Réponse 1.2</strong></p><p>**Lissage de Laplace (add-1)**</p><p>Le lissage de Laplace ajoute 1 à chaque comptage de n-gramme et ajuste le dénominateur.</p><div class='math-block'><div class='math'>$$P_{Laplace}(w_i|w_{i-1}) = \\frac{count(w_{i-1}, w_i) + 1}{count(w_{i-1}) + V}$$</div></div><p>où V est la taille du vocabulaire (mots uniques = 8).</p><p>**Nouveaux calculs :**</p><ul><li>P(le) = (3+1)/(14+8) = 4/22 ≈ 0.182</li><li>P(chat|le) = (2+1)/(3+8) = 3/11 ≈ 0.273</li><li>P(mange|chat) = (1+1)/(2+8) = 2/10 = 0.2</li><li>P(la|mange) = (0+1)/(1+8) = 1/9 ≈ 0.111</li><li>P(viande|la) = (1+1)/(2+8) = 2/10 = 0.2</li></ul><div class='math-block'><div class='math'>$$P_{Laplace} = 0.182 \\times 0.273 \\times 0.2 \\times 0.111 \\times 0.2 \\approx 0.00022$$</div></div>"
        }
      ]
    },
    {
      "titre": "Word Embeddings et Plongements Contextuels",
      "points": "3 pts",
      "enonce": "<div><p>Cet exercice porte sur les représentations vectorielles des mots et les embeddings contextuels modernes.</p></div>",
      "questions": [
        {
          "question": "<p><strong>2.1</strong> Expliquer la différence fondamentale entre un embedding statique (Word2Vec, GloVe) et un embedding contextuel (ELMo, BERT). Illustrer avec un exemple concret montrant pourquoi un embedding contextuel est plus performant pour la levée d'ambiguïté.</p>",
          "reponse": "<p><strong>Réponse 2.1</strong></p><p>**Différence fondamentale :**</p><ul><li><strong>Embedding statique :</strong> Un mot a un seul vecteur fixe, quel que soit le contexte où il apparaît. Word2Vec et GloVe sont des exemples classiques.</li><li><strong>Embedding contextuel :</strong> Le vecteur d'un mot change en fonction du contexte de la phrase. ELMo et BERT génèrent des représentations dynamiques.</li></ul><p>**Exemple :** Le mot 'basse'</p><ul><li>Dans 'basse cour' (animaux) → le vecteur statique serait identique à</li><li>Dans 'basse fréquence' (son) → mais BERT produirait des vecteurs différents !</li></ul><p>Les embeddings contextuels capturent le sens du mot dans son environnement, ce qui est crucial pour la levée d'ambiguïté (ex. 'basse' = animal ou son).</p>"
        },
        {
          "question": "<p><strong>2.2</strong> Comparer Word2Vec (Skip-gram) et FastText. Expliquer l'avantage principal de FastText par rapport à Word2Vec dans le contexte des langues riches en morphologie comme le français ou les langues camerounaises.</p>",
          "reponse": "<p><strong>Réponse 2.2</strong></p><p>**Comparaison :**</p><ul><li><strong>Word2Vec (Skip-gram) :</strong> Prédit les mots contextuels à partir d'un mot central. Représente chaque mot comme un vecteur unique.</li><li><strong>FastText :</strong> Représente chaque mot comme une somme de vecteurs de n-grammes de caractères (subword information).</li></ul><p>**Avantage de FastText :**</p><ul><li>Gère les mots inconnus (OOV - Out of Vocabulary) en décomposant en sous-mots.</li><li>Pour les langues riches en morphologie (français, langues camerounaises comme le bamiléké, le fulfuldé), FastText capture les racines et affixes, améliorant la représentation.</li><li>Exemple : même si 'mangeaient' n'est pas dans le vocabulaire, FastText peut le décomposer en 'mang', 'mange', 'aient' pour en déduire le sens.</li></ul>"
        }
      ]
    },
    {
      "titre": "Classification de Texte avec Deep Learning",
      "points": "4 pts",
      "enonce": "<div><p>Vous travaillez sur un projet d'analyse de sentiments pour une entreprise de mobile money au Cameroun. Les données sont des avis clients en français. Vous devez choisir une architecture de classification.</p></div>",
      "questions": [
        {
          "question": "<p><strong>3.1</strong> Proposer une architecture LSTM pour la classification de texte, en détaillant les différentes couches et leur rôle. Justifier le choix d'une architecture séquentielle par rapport à une CNN.</p>",
          "reponse": "<p><strong>Réponse 3.1</strong></p><p>**Architecture LSTM proposée :**</p><ol><li><strong>Couche d'embedding :</strong> Convertit chaque token en vecteur dense de dimension 100-300.</li><li><strong>Couche LSTM (1 ou 2 couches) :</strong> <br/>- Traite la séquence de tokens de manière récurrente.<br/>- Capture les dépendances à long terme (ex. négation qui porte sur plusieurs mots).</li><li><strong>Couche Dropout :</strong> Évite le surapprentissage (taux 0.3-0.5).</li><li><strong>Couche Dense (fully connected) :</strong> Couche finale avec activation softmax pour la classification en 3 classes (positif, négatif, neutre).</li></ol><p><strong>Justification du choix du LSTM vs CNN :</strong></p><ul><li>Le LSTM est plus adapté aux textes longs (comme les avis clients) car il capture l'ordre et les dépendances séquentielles (ex. 'pas bon' est différent de 'bon').</li><li>La CNN est efficace pour les motifs locaux mais peut manquer des dépendances à distance.</li><li>Pour l'analyse de sentiments, l'ordre des mots est crucial, donc le LSTM est plus approprié.</li></ul>"
        },
        {
          "question": "<p><strong>3.2</strong> Expliquer comment vous utiliseriez un modèle pré-entraîné comme BERT (ou son équivalent français CamemBERT) pour cette tâche. Quels sont les avantages par rapport à un LSTM entraîné de zéro ?</p>",
          "reponse": "<p><strong>Réponse 3.2</strong></p><p>**Utilisation de BERT/CamemBERT :**</p><ol><li><strong>Chargement du modèle pré-entraîné :</strong> Utiliser la bibliothèque Hugging Face <code>transformers</code>.</li><li><strong>Tokenization :</strong> Utiliser le tokenizer associé (ex. CamemBERT pour le français).</li><li><strong>Fine-tuning :</strong> Ajouter une couche de classification sur le token [CLS] et entraîner sur les données d'avis clients.</li></ol><p><strong>Avantages :</strong></p><ul><li><strong>Transfert d'apprentissage :</strong> Le modèle a déjà appris les subtilités de la langue française sur un énorme corpus.</li><li><strong>Capte le contexte bidirectionnel :</strong> BERT lit les mots dans les deux sens, ce qui est crucial pour comprendre le sens d'une phrase.</li><li><strong>Moins de données nécessaires :</strong> Le fine-tuning nécessite beaucoup moins de données que l'entraînement d'un LSTM from scratch.</li><li><strong>Performance supérieure :</strong> Les modèles Transformers surpassent généralement les RNN/LSTM sur les tâches de classification [citation:4].</li></ul>"
        }
      ]
    },
    {
      "titre": "Génération de Texte avec Transformers",
      "points": "4 pts",
      "enonce": "<div><p>Vous développez un chatbot pour une entreprise camerounaise. Vous devez générer des réponses cohérentes à partir de questions fréquentes.</p></div>",
      "questions": [
        {
          "question": "<p><strong>4.1</strong> Comparer les stratégies de décodage Greedy Search et Beam Search pour la génération de texte avec GPT. Expliquer pourquoi Beam Search est généralement préférée pour les tâches de génération longue.</p>",
          "reponse": "<p><strong>Réponse 4.1</strong></p><p><strong>Greedy Search :</strong></p><ul><li>Choisit le token de probabilité maximale à chaque étape.</li><li>Avantage : simple et rapide.</li><li>Inconvénient : peut conduire à des répétitions et à des séquences sous-optimales (pas de retour en arrière possible).</li></ul><p><strong>Beam Search :</strong></p><ul><li>Conserve les K meilleures séquences (le 'beam') à chaque étape.</li><li>Avantage : explore plusieurs chemins et choisit la séquence de probabilité maximale globale.</li><li>Inconvénient : plus coûteux en calcul.</li></ul><div class='math-block'><div class='math'>$$Score(séquence) = \\log P(y_1) + \\log P(y_2|y_1) + ... + \\log P(y_T|y_{1:T-1})$$</div></div><p>Beam Search est préférée pour la génération longue (réponses de chatbot) car elle produit des séquences plus cohérentes et diversifiées, tandis que Greedy Search peut bloquer sur une sous-séquence de probabilité élevée mais de mauvaise qualité globale.</p>"
        },
        {
          "question": "<p><strong>4.2</strong> Expliquer le concept de Top-K sampling et Top-P (nucleus) sampling dans le contexte de la génération de texte. Quand privilégier ces méthodes par rapport à Beam Search ?</p>",
          "reponse": "<p><strong>Réponse 4.2</strong></p><p><strong>Top-K Sampling :</strong> Limite le vocabulaire aux K tokens les plus probables à chaque étape, puis échantillonne parmi eux selon leurs probabilités normalisées.</p><div class='math-block'><div class='math'>$$P'(w_i) = \\begin{cases} \\frac{P(w_i)}{\\sum_{j \\in TopK} P(w_j)} & \\text{si } w_i \\in TopK \\\\ 0 & \\text{sinon} \\end{cases}$$</div></div><p><strong>Top-P (Nucleus) Sampling :</strong> Sélectionne le plus petit ensemble de tokens dont la probabilité cumulée dépasse un seuil p (ex. 0.9), puis échantillonne parmi eux.</p><p><strong>Quand les utiliser :</strong></p><ul><li>Ces méthodes sont privilégiées pour la génération <strong>créative</strong> (poésie, histoire, chatbots conversationnels) car elles produisent des textes plus diversifiés et naturels.</li><li>Beam Search est plus adaptée aux tâches <strong>déterministes</strong> (traduction, résumé) où la cohérence factuelle est primordiale.</li><li>Pour un chatbot, le Top-P ou le Top-K permet d'éviter la monotonie tout en gardant un certain contrôle sur la qualité.</li></ul>"

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
