<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Traitement Automatique du Langage (NLP) - L3",
  "classe": "Licence 3 Data Science",
  "sequence": "Sequence 3",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Fondamentaux du Traitement du Langage et Représentations Vectorielles (Chap 1 & 2)",
      "points": "6 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; line-height: 1.6;'> <h3>Prétraitement et Vectorisation de Textes</h3> <p>Vous travaillez sur un projet d'analyse de sentiments pour des tweets en français. Vous recevez le tweet suivant :</p> <div style='background-color: #f0f8ff; padding: 15px; border-radius: 8px; margin: 10px 0; color: #000;'> <p style='margin:0;'><strong>Texte :</strong> \"Je suis vraiment trop content de ce nouveau téléphone ! Il est génial, mais la batterie est un peu décevante... #Tech\"</p> </div> <p>Répondez aux questions suivantes :</p> </div>",
      "questions": [
        {
          "question": "<strong>1. Prétraitement (2 pts)</strong> <p>Décrivez et appliquez les étapes de prétraitement suivantes sur le texte fourni :</p> <ul><li><strong>Tokenisation :</strong> Séparez le texte en tokens (mots et ponctuations).</li><li><strong>Normalisation :</strong> Mettez le texte en minuscules et supprimez les accents.</li><li><strong>Suppression des stop words :</strong> Supprimez les mots vides (ex: 'je', 'de', 'un').</li><li><strong>Stemming :</strong> Appliquez un stemming simple (ex: tronquer les suffixes) sur les mots restants.</li></ul> <p>Présentez le résultat final après toutes ces étapes sous forme de liste de tokens.</p>",
          "reponse": "<div style='background-color: #f5f5f5; padding: 15px; border-radius: 8px; color: #000;'> <p><strong>Étapes de prétraitement :</strong></p> <ol><li><strong>Tokenisation :</strong> <code>['Je', 'suis', 'vraiment', 'trop', 'content', 'de', 'ce', 'nouveau', 'téléphone', '!', 'Il', 'est', 'génial', ',', 'mais', 'la', 'batterie', 'est', 'un', 'peu', 'décevante', '...', '#Tech']</code></li><li><strong>Normalisation (minuscules et suppression des accents) :</strong> <code>['je', 'suis', 'vraiment', 'trop', 'content', 'de', 'ce', 'nouveau', 'telephone', '!', 'il', 'est', 'genial', ',', 'mais', 'la', 'batterie', 'est', 'un', 'peu', 'decevante', '...', '#tech']</code></li><li><strong>Suppression des stop words :</strong> On enlève 'je', 'suis', 'de', 'ce', 'il', 'est', ',', 'mais', 'la', 'est', 'un'. <br>Résultat : <code>['vraiment', 'trop', 'content', 'nouveau', 'telephone', '!', 'genial', 'batterie', 'peu', 'decevante', '...', '#tech']</code></li><li><strong>Stemming (exemple : troncature) :</strong> <code>['vraim', 'trop', 'content', 'nouveau', 'telephon', '!', 'genial', 'batteri', 'peu', 'decev', '...', '#tech']</code></li></ol> <p><strong>Résultat final :</strong> <code>['vraim', 'trop', 'content', 'nouveau', 'telephon', '!', 'genial', 'batteri', 'peu', 'decev', '...', '#tech']</code></p> </div>"
        },
        {
          "question": "<strong>2. Vectorisation : Sac-de-mots (BoW) et TF-IDF (2 pts)</strong> <p>Considérez les deux documents suivants (après prétraitement) :</p> <ul><li><strong>Doc1 :</strong> \"telephon super genial\"</li><li><strong>Doc2 :</strong> \"batteri decev\"</li></ul> <p>a) Construisez la représentation <strong>Bag-of-Words (BoW)</strong> binaire et en comptage (fréquence) pour ces deux documents. Utilisez le vocabulaire suivant : <code>['telephon', 'super', 'genial', 'batteri', 'decev']</code>.</p><p>b) Expliquez brièvement pourquoi le <strong>TF-IDF</strong> serait plus adapté que le BoW pour ce corpus et calculez le poids TF-IDF du terme 'telephon' dans le Doc1.</p>",
          "reponse": "<div style='background-color: #f5f5f5; padding: 15px; border-radius: 8px; color: #000;'> <p><strong>a) Représentations BoW :</strong></p> <ul><li><strong>BoW Binaire :</strong> <ul><li>Doc1 : [1, 1, 1, 0, 0]</li><li>Doc2 : [0, 0, 0, 1, 1]</li></ul></li><li><strong>BoW Fréquence :</strong> <ul><li>Doc1 : [1, 1, 1, 0, 0]</li><li>Doc2 : [0, 0, 0, 1, 1]</li></ul></li></ul> <p><strong>b) TF-IDF :</strong> Le TF-IDF est plus adapté car il pénalise les mots fréquents dans tous les documents (comme 'telephon' ici) et donne plus de poids aux mots rares et discriminants (comme 'super' ou 'decev'). <br> <strong>Calcul pour 'telephon' dans Doc1 :</strong> <ul><li>TF(telephon, Doc1) = 1/3 ≈ 0.33</li><li>IDF(telephon, corpus) = log(2/2) = log(1) = 0</li><li>TF-IDF(telephon, Doc1) = 0.33 * 0 = 0</li></ul> Le mot 'telephon' n'apporte pas d'information discriminante pour ce corpus.</p> </div>"
        },
        {
          "question": "<strong>3. Word Embeddings (2 pts)</strong> <p>Expliquez la différence entre une représentation <strong>count-based</strong> (comme BoW ou TF-IDF) et une représentation <strong>distributive</strong> (comme Word2Vec). Donnez un avantage majeur des embeddings de mots comme Word2Vec par rapport à BoW/TF-IDF, notamment en termes de <strong>similarité sémantique</strong>.</p>",
          "reponse": "<div style='background-color: #f5f5f5; padding: 15px; border-radius: 8px; color: #000;'> <p><strong>Différence :</strong> Les représentations <strong>count-based</strong> (BoW, TF-IDF) sont des vecteurs de grande dimension (taille du vocabulaire) et clairsemés (beaucoup de zéros). Chaque dimension correspond à un mot spécifique et l'ordre des mots est ignoré. Les représentations <strong>distributives</strong> (Word2Vec) sont des vecteurs denses de faible dimension (ex: 300). Chaque dimension capture des caractéristiques sémantiques et syntaxiques latentes du mot, apprises à partir de son contexte d'utilisation.</p> <p><strong>Avantage majeur :</strong> Les embeddings de mots capturent la <strong>similarité sémantique</strong>. Les mots avec des significations proches (ex: 'voiture' et 'automobile') auront des vecteurs similaires dans l'espace vectoriel, ce qui permet de calculer des distances (ex: similarité cosinus). BoW/TF-IDF ne peuvent pas capturer cette proximité sémantique car chaque mot est représenté de manière indépendante. De plus, les embeddings permettent des opérations vectorielles comme les analogies (ex: roi - homme + femme ≈ reine).</p> </div>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Modèles de Langage et Classification (Chap 3 & 4)",
      "points": "7 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; line-height: 1.6;'> <h3>Modélisation et Classification de Texte</h3> <p>On s'intéresse à la construction d'un modèle de langage pour prédire le prochain mot dans une phrase. On utilise un corpus d'entraînement composé de trois phrases :</p> <ul><li>\"le chat dort sur le tapis\"</li><li>\"le chien joue dans le jardin\"</li><li>\"le chat et le chien sont amis\"</li></ul> <p>Répondez aux questions suivantes :</p> </div>",
      "questions": [
        {
          "question": "<strong>1. Modèle de Langage N-gramme (2 pts)</strong> <p>Calculez les probabilités pour un modèle <strong>bigramme</strong> (N=2) non lissé. Utilisez le début de phrase <code>&lt;s&gt;</code> et fin <code>&lt;/s&gt;</code>.</p><p>a) Calculez <code>P('tapis' | 'le')</code>.</p><p>b) Calculez <code>P('chien' | 'le')</code>.</p><p>c) Estimez la probabilité de la phrase : \"le chat dort sur le tapis\".</p>",
          "reponse": "<div style='background-color: #f5f5f5; padding: 15px; border-radius: 8px; color: #000;'> <p><strong>a) P('tapis' | 'le') :</strong> Le bigramme 'le tapis' apparaît 1 fois. Le mot 'le' apparaît 6 fois au total. Donc P = 1/6 ≈ 0.167</p><p><strong>b) P('chien' | 'le') :</strong> Le bigramme 'le chien' apparaît 2 fois ('le chien joue' et 'le chien sont'). P = 2/6 ≈ 0.333</p><p><strong>c) Probabilité de la phrase :</strong> P('le chat dort sur le tapis') = P('chat'|'le') * P('dort'|'chat') * P('sur'|'dort') * P('le'|'sur') * P('tapis'|'le') * P('&lt;/s&gt;'|'tapis') <br> = (1/6) * (1/1) * (1/1) * (1/1) * (1/6) * (1/1) = 1/36 ≈ 0.0278</p> </div>"
        },
        {
          "question": "<strong>2. Lissage de Laplace (1 pt)</strong> <p>Le modèle bigramme non lissé donne une probabilité nulle pour des séquences jamais vues. Appliquez le <strong>lissage de Laplace (add-1 smoothing)</strong> pour estimer <code>P('jardin' | 'dans')</code>. Le vocabulaire total est de 10 mots uniques : <code>[&lt;s&gt;, &lt;/s&gt;, 'le', 'chat', 'dort', 'sur', 'tapis', 'chien', 'joue', 'dans', 'jardin', 'et', 'sont', 'amis']</code>.</p>",
          "reponse": "<div style='background-color: #f5f5f5; padding: 15px; border-radius: 8px; color: #000;'> <p><strong>Lissage de Laplace :</strong> P_lisse('jardin' | 'dans') = (compte('dans jardin') + 1) / (compte('dans') + V) <br> Le bigramme 'dans jardin' n'apparaît pas (0). 'dans' apparaît 1 fois ('dans le jardin'). <br> V = 14 (taille du vocabulaire). <br> P_lisse = (0 + 1) / (1 + 14) = 1/15 ≈ 0.067</p> </div>"
        },
        {
          "question": "<strong>3. Perplexité (1 pt)</strong> <p>Définissez la <strong>perplexité</strong> d'un modèle de langage. La phrase de test est : \"le chat joue\". Estimez la perplexité de ce modèle bigramme lissé avec Laplace (add-1).</p>",
          "reponse": "<div style='background-color: #f5f5f5; padding: 15px; border-radius: 8px; color: #000;'> <p><strong>Perplexité :</strong> La perplexité est une mesure de l'incertitude d'un modèle de langage. Plus elle est faible, meilleur est le modèle. Elle est définie comme l'inverse de la probabilité géométrique moyenne du test set : <code>Perplexité = 2^{- (1/N) * log2(P(w1...wN))}</code>.</p> <p><strong>Calcul pour la phrase de test :</strong> On utilise les probabilités lissées : <br> P_lisse('chat'|'le') = (1+1)/(6+14) = 2/20 = 0.1 <br> P_lisse('joue'|'chat') = (0+1)/(1+14) = 1/15 ≈ 0.067 <br> P_lisse('&lt;/s&gt;'|'joue') = (0+1)/(1+14) = 1/15 ≈ 0.067 <br> P(phrase) = 0.1 * 0.067 * 0.067 ≈ 0.000449 <br> Perplexité = (1 / 0.000449)^(1/3) ≈ 13.1</p> </div>"
        },
        {
          "question": "<strong>4. Classification de Texte (3 pts)</strong> <p>Vous devez classifier des avis clients en positif ou négatif. Expliquez pourquoi les modèles basés sur <strong>BERT</strong> surpassent généralement les modèles classiques comme la régression logistique ou les SVM pour cette tâche, en vous appuyant sur les notions de <strong>contexte</strong> et de <strong>représentations contextuelles</strong>.</p>",
          "reponse": "<div style='background-color: #f5f5f5; padding: 15px; border-radius: 8px; color: #000;'> <p><strong>Supériorité de BERT :</strong> Les modèles classiques (régression logistique, SVM) utilisent des représentations statiques comme BoW ou TF-IDF, qui ignorent le contexte et l'ordre des mots. BERT est un modèle de langage basé sur les Transformers qui génère des <strong>représentations contextuelles</strong> : le vecteur d'un mot dépend de son contexte dans la phrase. Par exemple, le mot 'bon' aura une représentation différente dans 'bon produit' et 'bon marché'.</p> <p>De plus, BERT est pré-entraîné sur un très grand corpus de textes et capture des relations sémantiques complexes. Il peut être <strong>fine-tuné</strong> sur une tâche spécifique comme la classification de sentiments, ce qui lui permet d'atteindre des performances proches de l'humain. En résumé : <br> - <strong>Contextualisation :</strong> Capture le sens précis des mots en fonction de leur contexte. <br> - <strong>Fine-tuning :</strong> Transfert d'apprentissage efficace. <br> - <strong>Compréhension profonde :</strong> Apprend les relations syntaxiques et sémantiques.</p> </div>"

          "reponse": "<div style='background-color: #f5f5f5; padding: 15px; border-radius: 8px; color: #000;'> <p><strong>QA extractive :</strong> Le modèle sélectionne un segment de texte (span) dans le document source comme réponse. Il ne génère pas de nouveau texte. <br> <strong>Exemple de modèle :</strong> BERT fine-tuné pour QA (SQuAD). Il prédit la position de début et de fin de la réponse.</p> <p><strong>QA générative :</strong> Le modèle génère une réponse en texte libre, parfois en reformulant l'information ou en combinant plusieurs sources. <br> <strong>Exemple de modèle :</strong> T5 ou GPT. Ces modèles peuvent produire des réponses plus naturelles et complètes.</p> </div>"

          "reponse": "<div style='background-color: #f5f5f5; padding: 15px; border-radius: 8px; color: #000;'> <p><strong>Mécanisme d'attention :</strong> Dans un modèle Seq2Seq, l'encodeur transforme la séquence source (la question) en un vecteur de contexte fixe. Le décodeur génère la réponse mot par mot. Sans attention, le décodeur n'a accès qu'à ce vecteur fixe, ce qui est limitant pour les longues séquences. <br> <strong>Rôle de l'attention :</strong> L'attention permet au décodeur de 'regarder' sélectivement toutes les positions de la séquence source à chaque étape de la génération. Il calcule un score d'attention pour chaque mot source, qui indique son importance pour générer le mot courant. Cela permet de : <br> - <strong>Gérer les longues séquences :</strong> L'encodeur n'a pas besoin de tout compresser en un seul vecteur. <br> - <strong>Focus sur les informations pertinentes :</strong> Le décodeur peut se concentrer sur les parties de la question les plus utiles pour générer le prochain mot. <br> - <strong>Améliorer la précision :</strong> Réduit les problèmes de dégradation du gradient et améliore la qualité de la traduction/génération.</p> </div>"

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
