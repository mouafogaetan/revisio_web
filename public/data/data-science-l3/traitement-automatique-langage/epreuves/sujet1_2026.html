                ignoreHtmlClass: 'no-mathjax'

    </script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Traitement Automatique du Langage (NLP) - L3",
  "classe": "Licence 3 Data Science",
  "sequence": "Sequence 1",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Fondamentaux de l'Analyse de Sentiments (4 pts)",
      "points": "4 pts",
      "enonce": "<p>Cet exercice porte sur les concepts fondamentaux de l'analyse de sentiments, une tache essentielle du Traitement Automatique du Langage (NLP).</p><p>Dans le cadre du cours, nous avons vu que l'analyse de sentiments consiste à identifier et extraire les opinions, émotions et attitudes exprimées dans un texte à l'égard d'un sujet particulier.</p>",
      "questions": [
        {
          "question": "<p><strong>1) Définir l'analyse de sentiments</strong> (2 pts)</p><p>a) Proposer une définition de l'analyse de sentiments.</p><p>b) Donner deux domaines d'application concrets de cette technique.</p><p>c) Expliquer la différence entre une analyse de sentiments standard (polarité positive/négative/neutre) et une analyse fine-grained.</p>",
          "reponse": "<p><strong>Réponse :</strong></p><p><strong>a) Définition :</strong> L'analyse de sentiments (ou opinion mining) est une tâche du NLP qui vise à déterminer automatiquement l'opinion, l'émotion ou l'attitude exprimée dans un texte envers un sujet, produit, service ou événement. Elle consiste généralement à classifier le texte comme positif, négatif ou neutre.</p><p><strong>b) Domaines d'application :</strong> 1) Marketing : analyse des avis clients sur les réseaux sociaux pour évaluer la perception d'une marque. 2) Service client : classification automatique des retours clients pour prioriser les réclamations.</p><p><strong>c) Différence :</strong> L'analyse standard se limite à la classification en trois catégories (positif, négatif, neutre). L'analyse fine-grained propose des niveaux de sentiment plus nuancés, par exemple une échelle de 1 à 5 étoiles ou la détection d'émotions spécifiques comme la colère, la joie ou la tristesse.</p>"
        },
        {
          "question": "<p><strong>2) Analyse de sentiments par aspect (Aspect-Based Sentiment Analysis)</strong> (2 pts)</p><p>Expliquer l'intérêt de l'analyse de sentiments par aspect par rapport à une classification de polarité simple, en prenant l'exemple des avis clients pour un restaurant.</p>",
          "reponse": "<p><strong>Réponse :</strong> L'analyse de sentiments par aspect permet de comprendre non seulement si l'avis est globalement positif ou négatif, mais aussi <strong>pourquoi</strong>. En identifiant les aspects évoqués (service, nourriture, ambiance, prix) et en associant un sentiment à chacun, le restaurant peut savoir précisément ce qui fonctionne bien et ce qui doit être amélioré. Par exemple, un avis peut être globalement positif (4/5) mais contenir un sentiment négatif sur le service, ce qui est une information précieuse pour le management. L'approche standard ne permettrait pas de détecter cette nuance.</p>"
        }
      ]
    },
    {
      "titre": "Exercice 2 : Mise en œuvre d'un Pipeline de Classification (6 pts)",
      "points": "6 pts",
      "enonce": "<p>On souhaite construire un système de classification de polarité (positif/négatif) pour des avis clients, en utilisant un SVM (Support Vector Machine).</p><p>Le jeu de données contient 5000 avis annotés en positif ou négatif.</p>",
      "questions": [
        {
          "question": "<p><strong>1) Prétraitement des données</strong> (2 pts)</p><p>Décrire les étapes de prétraitement à appliquer sur le corpus d'avis avant l'entraînement du modèle SVM, en justifiant chacune d'elles.</p>",
          "reponse": "<p><strong>Réponse :</strong> Les étapes de prétraitement sont les suivantes :</p><ul><li><strong>Tokenisation :</strong> Segmentation du texte en tokens (mots).</li><li><strong>Mise en minuscules :</strong> Standardisation du texte pour éviter de traiter 'Bon' et 'bon' comme des mots différents.</li><li><strong>Suppression des stop words :</strong> Élimination des mots vides (comme 'le', 'et', 'un') qui n'apportent pas de sens pour la classification.</li><li><strong>Stemming ou lemmatisation :</strong> Réduction des mots à leur racine (ex. 'manger', 'mangé', 'mangeant' deviennent 'mang').</li><li><strong>Suppression de la ponctuation et des caractères spéciaux :</strong> Pour ne garder que les mots significatifs.</li><li><strong>Vectorisation :</strong> Transformation du texte en vecteurs numériques, par exemple avec TF-IDF, qui donne un poids aux mots importants du document tout en pénalisant les mots trop fréquents dans l'ensemble du corpus.</li></ul>",
          "sousQuestions": []
        },
        {
          "question": "<p><strong>2) Entraînement et évaluation du modèle</strong> (2 pts)</p><p>a) Décrire le principe de la marge maximale dans un SVM et son intérêt pour la classification de sentiments.</p><p>b) Proposer une stratégie pour évaluer la performance de ce classifieur.</p>",
          "reponse": "<p><strong>Réponse :</strong></p><p><strong>a) Marge maximale :</strong> Un SVM cherche à trouver l'hyperplan qui sépare au mieux les classes en maximisant la marge, c'est-à-dire la distance entre l'hyperplan et les points les plus proches de chaque classe (les vecteurs supports). Maximiser la marge permet de créer un classifieur plus robuste, moins sensible aux points aberrants, et d'améliorer la généralisation sur de nouvelles données. En analyse de sentiments, cela permet de mieux séparer les avis positifs des négatifs, même lorsqu'ils sont très similaires.</p><p><strong>b) Stratégie d'évaluation :</strong> 1) Diviser le jeu de données en un ensemble d'entraînement (70%) et un ensemble de test (30%). 2) Entraîner le SVM sur l'ensemble d'entraînement. 3) Prédire les polarités sur l'ensemble de test. 4) Calculer les métriques de performance : précision (accuracy), précision (precision), rappel (recall) et F1-score. Une validation croisée (par exemple, 10-fold) peut également être utilisée pour obtenir des résultats plus robustes.</p>",
          "sousQuestions": []
        },
        {
          "question": "<p><strong>3) Limites et améliorations</strong> (2 pts)</p><p>Identifier deux limites de l'utilisation d'un SVM avec des caractéristiques TF-IDF pour l'analyse de sentiments, et proposer pour chacune une solution d'amélioration.</p>",
          "reponse": "<p><strong>Réponse :</strong></p><ul><li><strong>Limite 1 : Gestion du contexte et de la sémantique.</strong> TF-IDF ne capture pas le sens des mots ni le contexte. <em>Solution :</em> Utiliser des modèles d'embeddings comme Word2Vec ou GloVe, ou des modèles transformers comme BERT, qui prennent en compte le contexte.</li><li><strong>Limite 2 : Gestion du langage non standard (fautes, émoticônes, sarcasme).</strong> Les avis contiennent souvent des fautes d'orthographe ou des tournures familières. <em>Solution :</em> Appliquer un prétraitement plus poussé (correction orthographique), utiliser des embeddings sous-word (FastText) ou des modèles pré-entraînés sur des corpus de réseaux sociaux.</li></ul>",
          "sousQuestions": []
        }
      ]
    },
    {
      "titre": "Exercice 3 : Analyse de Sentiments avec un Modèle Transformers (10 pts)",
      "points": "10 pts",
      "enonce": "<p>Une entreprise souhaite déployer un système d'analyse de sentiments pour ses avis sur Google Maps. Elle dispose d'un jeu de données de 10 000 avis annotés en positif, négatif ou neutre.</p><p>Comme vu en cours, les modèles de type Transformers (comme BERT) sont aujourd'hui l'état de l'art pour ce type de tâche.</p>",
      "questions": [
        {
          "question": "<p><strong>1) Fine-tuning de BERT</strong> (5 pts)</p><p>a) Expliquer ce qu'est le fine-tuning dans le contexte de BERT.</p><p>b) Décrire les étapes nécessaires pour adapter BERT à la classification de sentiments sur ce jeu de données.</p><p>c) Quels sont les avantages d'utiliser un modèle pré-entraîné comme BERT plutôt que de construire un modèle à partir de zéro ?</p>",
          "reponse": "<p><strong>Réponse :</strong></p><p><strong>a) Fine-tuning :</strong> Le fine-tuning consiste à reprendre un modèle pré-entraîné sur une tâche générique (comme la modélisation du langage) et à l'adapter à une tâche spécifique en le ré-entraînant sur un jeu de données plus petit et spécifique. On conserve l'architecture du modèle et on ajuste ses poids.</p><p><strong>b) Étapes :</strong> 1. Charger le modèle BERT pré-entraîné (ex: 'bert-base-uncased') avec son tokenizer. 2. Préparer les données : tokenization des avis en sous-mots, ajout des tokens spéciaux [CLS] et [SEP], padding des séquences à longueur égale. 3. Ajouter une couche de classification linéaire au-dessus de la sortie du token [CLS]. 4. Entraîner (fine-tune) le modèle sur les 10 000 avis annotés avec un optimiseur comme AdamW et une fonction de perte cross-entropy. 5. Évaluer le modèle sur un ensemble de validation.</p><p><strong>c) Avantages :</strong> 1) BERT capture des connaissances linguistiques riches (contexte, syntaxe, sémantique) grâce à son pré-entraînement sur de vastes corpus. 2) Le fine-tuning nécessite beaucoup moins de données et de temps de calcul que l'entraînement à partir de zéro. 3) BERT gère mieux le contexte et les ambiguïtés du langage naturel que les modèles classiques (SVM, TF-IDF).</p>",
          "sousQuestions": []
        },
        {
          "question": "<p><strong>2) Déploiement et défis</strong> (5 pts)</p><p>a) Décrire comment vous déploieriez le modèle fine-tuné pour qu'il soit accessible via une API.</p><p>b) Analyser les défis spécifiques à l'analyse de sentiments des avis Google Maps (texte court, fautes d'orthographe, sarcasme, coût de calcul).</p><p>c) Proposer des solutions pour atténuer ces défis.</p>",
          "reponse": "<p><strong>Réponse :</strong></p><p><strong>a) Déploiement :</strong> 1. Sauvegarder le modèle fine-tuné. 2. Créer une API (par exemple, avec FastAPI ou Flask) pour recevoir des requêtes textuelles. 3. Pour chaque requête, prétraiter le texte, tokeniser, inférer avec le modèle et renvoyer la polarité prédite (par exemple, sous forme de JSON). 4. Déployer l'application sur un serveur ou un service cloud comme AWS, GCP, ou OVHcloud.</p><p><strong>b) Défis :</strong> 1. Longueur des textes : les avis Google Maps sont souvent courts (moins de 10 mots). 2. Fautes d'orthographe et langage familier : le tokenizer de BERT peut mal les gérer. 3. Sarcasme et ironie : difficiles à détecter même pour les modèles avancés. 4. Coût de déploiement : BERT est un modèle volumineux, l'inférence peut être coûteuse en temps de calcul.</p><p><strong>c) Solutions :</strong> 1. Pour les textes courts, envisager des modèles conçus pour les phrases courtes comme SBERT. 2. Ajouter un prétraitement spécifique (correction orthographique, normalisation des émoticônes). 3. Utiliser des modèles BERT distillé comme DistilBERT, plus légers et rapides. 4. Pour le sarcasme, intégrer des données d'entraînement contenant des exemples de sarcasme ou utiliser des modèles spécialisés.</p>",
          "sousQuestions": []
        }
      ]
    },
    {
      "titre": "Exercice 4 : Visualisation des Résultats (4 pts)",
      "points": "4 pts",
      "enonce": "<p>Un analyste a réalisé une analyse de sentiments sur 1000 tweets concernant le lancement d'un nouveau produit. Voici les résultats obtenus :</p><ul><li>47% de tweets positifs</li><li>32% de tweets négatifs</li><li>21% de tweets neutres</li></ul><p>Un graphique en courbes montre une forte augmentation du sentiment négatif entre le jour 1 et le jour 3 du lancement.</p>",
      "questions": [
        {
          "question": "<p><strong>1) Interprétation des résultats</strong> (2 pts)</p><p>a) Comment interpréter ces résultats du point de vue de la marque ?</p><p>b) Quelle recommandation feriez-vous à l'équipe marketing ?</p>",
          "reponse": "<p><strong>Réponse :</strong></p><p><strong>a) Interprétation :</strong> Le sentiment global est mitigé avec une majorité (47%) de tweets positifs mais une part significative (32%) de tweets négatifs. L'augmentation de la proportion de tweets négatifs entre le jour 1 et le jour 3 est un signal d'alarme qui mérite une investigation. Cela peut indiquer un problème avec le produit (bug, qualité), un problème de communication (attentes non satisfaites), ou l'effet d'une polémique.</p><p><strong>b) Recommandation :</strong> Lancer une analyse approfondie des tweets négatifs, notamment ceux du jour 2 et 3, pour identifier les causes spécifiques (aspects évoqués). Organiser une veille active sur les réseaux sociaux pour répondre rapidement aux clients insatisfaits et corriger la communication si nécessaire.</p>",
          "sousQuestions": []
        },
        {
          "question": "<p><strong>2) Choix de visualisation</strong> (2 pts)</p><p>Proposer un type de visualisation supplémentaire qui permettrait de mieux comprendre la répartition des sentiments par sujet (aspects).</p>",
          "reponse": "<p><strong>Réponse :</strong> Je recommanderais un graphique en barres ou un heatmap montrant la répartition des sentiments pour chaque aspect identifié (ex: 'prix', 'qualité', 'service client', 'interface'). Cela permettrait de voir rapidement quels aspects sont les plus appréciés ou les plus critiqués. Une visualisation alternative serait un graphique en radar pour comparer les scores de satisfaction sur différents aspects.</p>"
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
