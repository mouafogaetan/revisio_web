<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
 "matiere": "Traitement Automatique du Langage (NLP) - L3",
 "classe": "Licence 3 Data Science",
 "sequence": "Évaluation Séquentielle n°6",
 "anneeScolaire": "2025-2026",
 "exercices": [
   {
     "titre": "Fondamentaux du NLP et Prétraitement",
     "points": "4 pts",
     "enonce": "<p>Le traitement automatique du langage (NLP) est au cœur des systèmes modernes capables de comprendre et de générer du texte. Avant d'analyser un texte, il est indispensable de le préparer afin d'en extraire les informations pertinentes.</p><p>Pour les questions suivantes, basez-vous sur la phrase : <em>\"Le Cameroun, pays d'Afrique centrale, a rejoint la Francophonie en 1991.\"</em></p>",
     "questions":[
       {
          "question": "1) a) Définissez en une phrase le rôle du NLP.<br><br>b) Identifiez et justifiez deux défis spécifiques que pose le traitement de cette phrase pour un système NLP.",
          "reponse": "a) Le NLP est le domaine de l'intelligence artificielle qui permet aux machines de comprendre, d'interpréter et de générer le langage humain.<br><br>b) Les défis sont :<br>- L'ambiguïté lexicale (ex: le mot 'pays' peut désigner une nation ou une région rurale).<br>- La gestion du contexte (la phrase contient une localisation 'd'Afrique centrale' et une date '1991', que le système doit relier correctement au sujet 'Cameroun')."
       },
       {
          "question": "2) Appliquez les étapes de prétraitement suivantes sur la phrase donnée :<br>a) Tokenisation<br>b) Suppression des stop words<br>c) Lemmatisation (ou stemming) du mot 'a rejoint'",
          "reponse": "a) Tokens : ['Le', 'Cameroun', ',', 'pays', \"d'Afrique\", 'centrale', ',', 'a', 'rejoint', 'la', 'Francophonie', 'en', '1991', '.']<br>b) Stop words supprimés (mots-outils comme 'le', 'la', 'en') : ['Cameroun', 'pays', \"d'Afrique\", 'centrale', 'rejoint', 'Francophonie', '1991']<br>c) Lemmatisation du verbe 'a rejoint' : Le verbe se lemmatise en 'rejoindre' (ou selon l'usage, 'rejoindre')."
       }
     ]
   },
   {
     "titre": "Représentations Vectorielles et Embeddings",
     "points": "4 pts",
     "enonce": "<p>Pour qu'un modèle de NLP puisse traiter un texte, il faut le convertir en une représentation numérique. Plusieurs approches existent, des plus simples (sac-de-mots) aux plus complexes (plongements contextuels).</p><p>Soit le corpus suivant :<br>Document 1 (D1) : <em>\"Le Mont Cameroun est un volcan actif.\"</em><br>Document 2 (D2) : <em>\"Le sommet du Mont Cameroun culmine à plus de 4000 mètres.\"</em></p>",
     "questions":[
       {
          "question": "3) a) Expliquez brièvement le principe du modèle sac-de-mots (Bag of Words).<br><br>b) Calculez le vecteur TF-IDF pour le mot 'Mont' dans le document D2. Justifiez votre calcul en montrant les étapes (TF, IDF).",
          "reponse": "a) Le modèle sac-de-mots représente un texte par un vecteur qui compte la fréquence d'apparition de chaque mot du vocabulaire, sans tenir compte de l'ordre.<br><br>b) Calcul :<br>- TF (Term Frequency) pour 'Mont' dans D2 = 1/8 (une occurrence sur 8 mots).<br>- IDF (Inverse Document Frequency) pour 'Mont' = log(2/2) = log(1) = 0 (le mot apparaît dans les deux documents).<br>- TF-IDF = 1/8 * 0 = 0. La valeur est nulle car le mot est présent dans tous les documents et n'est donc pas discriminant."
       },
       {
          "question": "4) a) Distinguez clairement un embedding statique (ex: Word2Vec) d'un embedding contextuel (ex: BERT).<br><br>b) Pourquoi BERT est-il généralement plus performant que Word2Vec pour mesurer la similarité sémantique entre deux phrases ?",
          "reponse": "a) Un embedding statique (Word2Vec) associe un vecteur fixe à un mot, quel que soit son contexte. Un embedding contextuel (BERT) génère un vecteur pour le mot en fonction des autres mots de la phrase, capturant ainsi la polysémie.<br><br>b) BERT est plus performant car il utilise un mécanisme d'attention qui permet de prendre en compte l'ensemble du contexte (gauche et droite). Cela permet de distinguer les différents sens d'un mot et de capturer des relations sémantiques complexes."
       }
     ]
   },
   {
     "titre": "Modèles de Langage et Gestion de la Sparse",
     "points": "4 pts",
     "enonce": "<p>Les modèles de langage permettent d'estimer la probabilité d'une séquence de mots. Ils sont essentiels pour la génération de texte, la traduction et la correction automatique.</p>",
     "questions":[
       {
          "question": "5) On considère un modèle de langage trigramme entraîné sur un petit corpus. Expliquez le problème de la sparsité des données et présentez deux techniques de lissage qui permettent de le résoudre.",
          "reponse": "Le problème de sparsité survient lorsque le modèle rencontre une séquence de mots (trigramme) qu'il n'a jamais vue dans ses données d'entraînement, ce qui donne une probabilité nulle.<br>Deux techniques de lissage :<br>- Lissage de Laplace (add-1 ou add-k) : On ajoute une constante (1 ou k) à tous les comptes pour éviter les probabilités nulles.<br>- Backoff : Si le trigramme est inconnu, on utilise le bigramme, puis le unigramme, en les pondérant pour estimer la probabilité."
       },
       {
          "question": "6) Comparez les modèles de langage neuronaux (RNN, LSTM) et les Transformers (GPT). Quels sont les avantages des Transformers pour la modélisation du langage ?",
          "reponse": "Les modèles neuronaux (RNN/LSTM) traitent les séquences de manière séquentielle, ce qui les rend lents et limite leur capacité à capturer les dépendances à long terme.<br>Les Transformers (GPT) traitent l'ensemble de la séquence en parallèle grâce au mécanisme d'auto-attention, ce qui leur permet de mieux capturer le contexte et d'être entraînés plus efficacement sur de grandes quantités de données."
       }
     ]
   },
   {
     "titre": "Tâches Avancées : Classification et Génération",
     "points": "4 pts",
     "enonce": "<p>Le NLP ne se limite pas à la compréhension, il permet aussi de générer du contenu et de structurer l'information. La classification et la génération automatique sont deux piliers de ce domaine.</p>",
     "questions":[
       {
          "question": "7) Dans le cadre d'une analyse de sentiments sur des tweets camerounais, vous devez classifier des avis clients. Décrivez brièvement comment un modèle comme BERT (ou un modèle de deep learning) peut être utilisé pour cette classification. Quelles étapes suivriez-vous ?",
          "reponse": "Pour classifier des tweets avec BERT :<br>1. Collecter un jeu de données de tweets camerounais annotés (positif, négatif, neutre).<br>2. Nettoyer et pré-traiter les tweets.<br>3. Fine-tuner un modèle BERT pré-entraîné (ou CamemBERT) sur ce jeu de données.<br>4. Évaluer le modèle sur un ensemble de test et le déployer pour analyser de nouveaux tweets."
       },
       {
          "question": "8) a) Expliquez la différence entre un résumé extractif et un résumé abstractif.<br><br>b) Pour un chatbot destiné à renseigner les touristes sur la région de l'Ouest du Cameroun, quelle approche de génération de texte (RNN, Transformers) recommanderiez-vous ? Justifiez votre choix.",
          "reponse": "a) Un résumé extractif sélectionne et juxtapose des phrases ou passages du texte original. Un résumé abstractif reformule et synthétise les idées dans un nouveau texte, plus proche de ce qu'écrirait un humain.<br><br>b) Je recommanderais les Transformers (GPT) pour plusieurs raisons : ils sont capables de générer un texte plus fluide et naturel, ils gèrent mieux le contexte, et ils peuvent être fine-tunés pour un domaine spécifique (le tourisme)."
       }
     ]
   },
   {
     "titre": "Projet : Traduction et Extraction d'Informations",
     "points": "4 pts",
     "enonce": "<p>La traduction automatique et l'extraction d'informations sont des applications majeures du NLP. Elles permettent de passer d'une langue à l'autre ou d'organiser des données non structurées.</p>",
     "questions":[
       {
          "question": "9) a) Présentez l'architecture séquence-à-séquence (seq2seq) dans le contexte de la traduction automatique neuronale (NMT).<br><br>b) Expliquez le rôle du mécanisme d'attention dans cette architecture.",
          "reponse": "a) L'architecture seq2seq est composée de deux RNN/LSTM : un encodeur qui lit la phrase source et la compresse en un vecteur de contexte, et un décodeur qui utilise ce vecteur pour générer la phrase traduite mot par mot.<br><br>b) Le mécanisme d'attention permet au décodeur de 'regarder' directement les différents mots de la phrase source à chaque étape de la traduction. Il pondère l'importance de chaque mot source, ce qui permet de mieux gérer les phrases longues et les cas où l'alignement mot-à-mot est complexe."
       },
       {
          "question": "10) Vous devez extraire des entités nommées (NER) à partir d'articles de presse camerounais. Décrivez deux approches différentes : une classique (ex: CRF) et une basée sur les Transformers (ex: BERT). Quels sont les avantages de l'approche Transformers ?",
          "reponse": "Approche classique (CRF) : On utilise des caractéristiques linguistiques (mot, contexte, POS tags) pour entraîner un modèle de séquence.<br>Approche moderne (BERT-NER) : On fine-tune un modèle BERT pré-entraîné sur un corpus annoté. BERT capture le contexte bidirectionnel.<br>Avantages de BERT : Il apprend des représentations contextuelles, il est plus robuste et performant sur des données variées, et il nécessite moins d'ingénierie de caractéristiques."
       }
     ]
   }
 ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
