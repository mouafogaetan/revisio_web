<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Traitement Automatique du Langage (NLP) - L3",
  "classe": "Licence 3 Data Science",
  "sequence": "Évaluation Séquentielle n°4 (Chapitres 5, 6, 7 et 8)",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Questions de Cours et Concepts Fondamentaux (6 pts)",
      "points": "6 pts",
      "enonce": "<div style='font-family: Arial, sans-serif; line-height: 1.6; color: #333; background: #f9f9f9; padding: 15px; border-radius: 8px;'>Répondez de manière concise et précise aux questions suivantes. Chaque réponse doit démontrer une compréhension claire des concepts abordés dans les chapitres 5 à 8.</div>",
      "questions": [
        {
          "question": "<span style='font-weight:bold;'>1.</span> Distinguez la <strong>génération de texte extractive</strong> de la <strong>génération abstractive</strong> en donnant un exemple pour chaque.",
          "reponse": "La <strong>génération extractive</strong> consiste à sélectionner des passages directement du texte source pour former le résumé ou la réponse. Exemple : pour résumer un article, on reprend des phrases telles quelles. <br>La <strong>génération abstractive</strong> produit un nouveau texte qui reformule l'information dans ses propres mots. Exemple : un résumé qui synthétise l'article avec des phrases nouvelles et une reformulation."
        },
        {
          "question": "<span style='font-weight:bold;'>2.</span> Expliquez le rôle du mécanisme d'<strong>attention</strong> dans les modèles de traduction neuronale (NMT).",
          "reponse": "Le mécanisme d'<strong>attention</strong> permet au décodeur de se concentrer sur les parties les plus pertinentes de la phrase source à chaque étape de la génération. Il calcule un score d'importance pour chaque mot de la source, puis crée un vecteur de contexte dynamique (moyenne pondérée des états de l'encodeur). Cela améliore la qualité de la traduction, surtout pour les longues phrases, et rend le modèle plus interprétable."
        },
        {
          "question": "<span style='font-weight:bold;'>3.</span> Citez deux métriques d'évaluation pour la traduction automatique et expliquez brièvement le principe de l'une d'elles.",
          "reponse": "<b>Métriques :</b> BLEU et METEOR.<br><b>Principe de BLEU :</b> BLEU mesure la précision des N-grammes entre la traduction candidate et une ou plusieurs traductions de référence. Il calcule la moyenne géométrique des précisions des N-grammes (1 à 4) et applique une pénalité de brièveté pour pénaliser les traductions trop courtes. Plus le score BLEU est élevé, meilleure est la traduction."
        },
        {
          "question": "<span style='font-weight:bold;'>4.</span> Qu'est-ce que la <strong>similarité sémantique</strong> et comment SBERT permet-il de la mesurer ?",
          "reponse": "La <strong>similarité sémantique</strong> mesure à quel point deux textes ou mots ont des significations proches. <strong>SBERT</strong> (Sentence-BERT) utilise BERT pour encoder chaque phrase en un vecteur fixe (via un pooling), puis calcule la similarité cosinus entre ces vecteurs. Contrairement aux embeddings statiques comme Word2Vec, SBERT prend en compte le contexte de la phrase entière, ce qui permet une meilleure mesure de la similarité."
        },
        {
          "question": "<span style='font-weight:bold;'>5.</span> Décrivez les étapes clés pour mener à bien un projet de <strong>chatbot</strong> avec un modèle de langage.",
          "reponse": "Les étapes clés sont :<br>1. <b>Définir le domaine</b> du chatbot (ex: support client, éducation).<br>2. <b>Préparer les données</b> d'entraînement (paires question-réponse, conversations).<br>3. <b>Choisir une architecture</b> (Seq2Seq avec attention ou Transformer comme GPT).<br>4. <b>Entraîner ou fine-tuner</b> le modèle sur le jeu de données.<br>5. <b>Déployer</b> le chatbot avec une interface utilisateur (web, mobile) et une API.<br>6. <b>Tester et améliorer</b> en continu avec des retours utilisateurs."
        }
      ]
    },
    {
      "titre": "Exercice 2 : Stratégies de Décodage en Génération (5 pts)",
      "points": "5 pts",
      "enonce": "<div style='background: #e3f2fd; padding: 15px; border-radius: 8px; border-left: 5px solid #1976d2;'><p style='margin:0; color: #0d47a1;'>La génération de texte avec les Transformers nécessite de choisir une stratégie de décodage. Ces stratégies influencent la qualité, la diversité et la cohérence du texte généré.</p></div>",
      "questions": [
        {
          "question": "<span style='font-weight:bold;'>1.</span> Expliquez le principe du <strong>Greedy Decoding</strong>. Quelles sont ses principales limites ?",
          "reponse": "Le <strong>Greedy Decoding</strong> choisit systématiquement le token avec la probabilité la plus élevée à chaque étape de la génération. Il est rapide et déterministe. <br><b>Limites :</b> Il peut produire des textes répétitifs et manquer de diversité. Il ne peut pas revenir sur une décision, ce qui peut conduire à des sous-optimaux locaux (ex: une séquence de mots qui semble bonne localement mais qui est mauvaise globalement)."
        },
        {
          "question": "<span style='font-weight:bold;'>2.</span> Décrivez le <strong>Beam Search</strong> et expliquez comment le paramètre <em>beam size</em> influence les résultats.",
          "reponse": "Le <strong>Beam Search</strong> maintient un ensemble des K meilleures séquences (le <em>beam</em>) à chaque étape de la génération. À chaque token, il étend ces K séquences avec tous les tokens possibles, puis ne garde que les K meilleures selon leur score global. <br><b>Influence de la taille du beam :</b> Un <em>beam size</em> plus grand explore plus de possibilités et peut donner de meilleurs résultats, mais il est plus lent et peut aussi conduire à des textes trop génériques ou répétitifs. Un <em>beam size</em> de 3 à 5 est souvent un bon compromis."
        },
        {
          "question": "<span style='font-weight:bold;'>3.</span> Quelle est la différence entre le <strong>Top-k Sampling</strong> et le <strong>Top-p (Nucleus) Sampling</strong> ?",
          "reponse": "Le <strong>Top-k Sampling</strong> restreint le choix aux k tokens les plus probables, puis échantillonne parmi eux. C'est simple mais le nombre k est fixe.<br>Le <strong>Top-p (Nucleus) Sampling</strong> sélectionne dynamiquement les tokens dont la probabilité cumulée atteint un seuil p (par exemple 0.9). Cela permet d'adapter le nombre de tokens à la distribution : plus de tokens pour les distributions plates, moins pour les distributions pointues. Cela donne souvent une meilleure diversité et un meilleur contrôle de la qualité."
        },
        {
          "question": "<span style='font-weight:bold;'>4.</span> Proposez une stratégie pour un chatbot conversationnel et justifiez votre choix.",
          "reponse": "Je recommanderais le <strong>Top-p Sampling</strong> avec un p entre 0.9 et 0.95, et une température de 0.8. <br><b>Justification :</b> Le Top-p sampling permet une diversité contrôlée, évitant les réponses trop répétitives (problème du greedy) tout en maintenant une bonne cohérence. La température de 0.8 donne un bon équilibre entre créativité et pertinence. Cette combinaison est souvent utilisée dans les chatbots modernes pour générer des réponses naturelles et variées."
        }
      ]
    },
    {
      "titre": "Exercice 3 : Traduction et Évaluation (4 pts)",
      "points": "4 pts",
      "enonce": "<div style='background: #e8f5e9; padding: 15px; border-radius: 8px; border-left: 5px solid #388e3c;'><p style='margin:0; color: #1b5e20;'>Considérons un système de traduction automatique anglais-français. On vous donne une phrase source, une traduction de référence, et deux traductions candidates produites par des modèles différents.</p></div>",
      "questions": [
        {
          "question": "<span style='font-weight:bold;'>1.</span> Voici les données :<br><b>Source :</b> \"The cat is sleeping on the mat.\"<br><b>Référence :</b> \"Le chat dort sur le tapis.\"<br><b>Candidate A :</b> \"Le chat dort sur le tapis.\"<br><b>Candidate B :</b> \"Le chat dort sur la natte.\"<br>Calculez le score BLEU (unigramme) pour chaque candidate (arrondi à 2 décimales).",
          "reponse": "<b>Candidate A :</b> Exactement identique à la référence. Précision unigramme = 4/4 = 1.00. Score BLEU = 1.00 (100%).<br><b>Candidate B :</b> Les mots sont : 'Le', 'chat', 'dort', 'sur', 'la', 'natte'. Mots présents dans la référence : 'Le', 'chat', 'dort', 'sur', 'la' (5 mots sur 6). 'natte' n'est pas dans la référence. Précision = 5/6 = 0.8333 ≈ 0.83.<br>Le score BLEU unigramme est donc 1.00 pour A et 0.83 pour B."
        },
        {
          "question": "<span style='font-weight:bold;'>2.</span> Pourquoi la Candidate B a un score plus faible, même si le sens est proche ? Que manque-t-il à BLEU ?",
          "reponse": "La Candidate B a un score plus faible car BLEU ne considère que les correspondances exactes de mots (ou N-grammes) avec la référence. 'natte' est un synonyme de 'tapis' mais BLEU ne le sait pas. Cela montre une <b>limite de BLEU</b> : il ne capture pas la sémantique ni la synonymie. Il est également sensible aux variations morphologiques (ex: 'dort' vs 'dormir'). C'est pourquoi des métriques comme METEOR ou BERTScore sont parfois préférées."
        },
        {
          "question": "<span style='font-weight:bold;'>3.</span> Quelle métrique alternative proposeriez-vous pour mieux évaluer ces traductions et pourquoi ?",
          "reponse": "Je proposerais <b>METEOR</b> (Metric for Evaluation of Translation with Explicit ORdering) ou <b>BERTScore</b>.<br><b>METEOR</b> prend en compte la synonymie, la racine des mots (stemming), et la ponctuation. Il utilise une moyenne harmonique de la précision et du rappel, ce qui lui donne une meilleure corrélation avec les jugements humains.<br><b>BERTScore</b> utilise des embeddings BERT pour comparer la similarité sémantique entre la candidate et la référence, capturant mieux la synonymie et les reformulations. Il serait particulièrement utile ici car 'tapis' et 'natte' sont sémantiquement proches."
        }
      ]
    },
    {
      "titre": "Exercice 4 : Similarité Sémantique et Moteur de Recherche (5 pts)",
      "points": "5 pts",
      "enonce": "<div style='background: #fce4ec; padding: 15px; border-radius: 8px; border-left: 5px solid #c62828; color: #4a148c;'>Vous êtes chargé de développer un moteur de recherche sémantique pour une bibliothèque numérique. Le but est de retrouver des documents pertinents en fonction de la requête, en utilisant la similarité sémantique.</div>",
      "questions": [
        {
          "question": "<span style='font-weight:bold;'>1.</span> Expliquez pourquoi un moteur de recherche basé sur la similarité cosinus avec des embeddings Word2Vec pourrait échouer pour certaines requêtes.",
          "reponse": "Un moteur de recherche basé sur Word2Vec utilise des <b>embeddings statiques</b> où chaque mot a un seul vecteur. Cela pose plusieurs problèmes :<br>- <b>Polysémie</b> : le mot 'banque' n'a pas le même sens dans 'je vais à la banque' et 'la banque de données'. Le même vecteur serait utilisé, ce qui peut donner des résultats confus.<br>- <b>Contexte ignoré</b> : la signification dépend du contexte, mais Word2Vec ne le prend pas en compte.<br>- <b>Mots hors vocabulaire (OOV)</b> : les mots inconnus n'ont pas de vecteur, ce qui limite la recherche.<br>- <b>Représentation de phrases</b> : la moyenne des embeddings des mots perd l'ordre et la structure de la phrase, ce qui peut dégrader la pertinence des résultats."
        },
        {
          "question": "<span style='font-weight:bold;'>2.</span> Proposez une approche utilisant <strong>SBERT</strong> pour améliorer ce système. Décrivez les étapes.",
          "reponse": "Voici une approche avec SBERT :<br>1. <b>Indexation :</b> Pour chaque document, on génère un vecteur fixe avec SBERT (en faisant passer le document entier ou un résumé). On stocke ces vecteurs dans une base de données vectorielle (ex: FAISS).<br>2. <b>Requête :</b> On encode la requête de l'utilisateur avec le même modèle SBERT pour obtenir un vecteur de requête.<br>3. <b>Recherche :</b> On calcule la similarité cosinus entre le vecteur de la requête et les vecteurs des documents indexés.<br>4. <b>Classement :</b> On trie les documents par similarité décroissante et on retourne les plus pertinents.<br>Cette approche capture le contexte de la phrase et donne des résultats plus pertinents."
        },
        {
          "question": "<span style='font-weight:bold;'>3.</span> Comparez <strong>TF-IDF</strong> et <strong>SBERT</strong> pour cette tâche de recherche d'information.",
          "reponse": "<b>TF-IDF (Term Frequency - Inverse Document Frequency) :</b><br>- Avantages : Simple, rapide, interprétable, fonctionne bien avec des requêtes exactes.<br>- Inconvénients : Ne capture pas la sémantique (synonymes, contextes), mots importants non présents dans la requête ignorés.<br><br><b>SBERT :</b><br>- Avantages : Capture la sémantique, gestion des synonymes, compréhension du contexte, meilleure pour les requêtes informelles ou longues.<br>- Inconvénients : Plus lent, nécessite des ressources de calcul, moins interprétable.<br><br><b>Recommandation :</b> Pour une bibliothèque numérique, SBERT est plus adapté car les requêtes peuvent être variées et les utilisateurs cherchent le sens plus que des mots exacts."
        }
      ]
    }
  ]
};
    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>

</body>
</html>
