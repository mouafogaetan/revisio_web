<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Épreuve</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: { fontCache: 'global' },
            options: {
                skipHtmlTypes: 'script',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"

    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f0f4f8;
        color: #1e293b;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }

    /* ===== HEADER ===== */
    .slide-header {
        flex-shrink: 0;
        padding: 14px 16px 10px 16px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(0,0,0,0.08);
        z-index: 10;
        min-height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
    }

    .slide-header h1 {
        font-size: 1.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .header-sub {
        font-size: 0.75rem;
        color: #64748b;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
    }

    .header-sub span {
        background: rgba(0,0,0,0.04);
        padding: 2px 10px;
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== CORPS ===== */
    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.04);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* ===== EXERCICE ===== */
    .exercise-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px 16px 12px 16px;
        flex-shrink: 0;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e2e8f0;
    }

    .exercise-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #1e40af;
    }

    .exercise-points {
        font-size: 0.75rem;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 2px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
    }

    .exercise-statement {
        color: #1e293b;
        line-height: 1.7;
        margin-bottom: 12px;
        font-size: 0.95rem;
        padding: 0 4px;
    }

    .exercise-statement .math {
        color: #1e40af;
    }

    /* ===== QUESTIONS ===== */
    .question-block {
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
        border-left: 3px solid #e2e8f0;
        transition: border-color 0.3s ease;
    }

    .question-block.revealed {
        border-left-color: #059669;
    }

    .question-text {
        font-size: 0.92rem;
        color: #1e293b;
        line-height: 1.6;
        margin-bottom: 8px;
        display: flex;
        gap: 8px;
    }

    .question-label {
        font-weight: 600;
        color: #2563eb;
        flex-shrink: 0;
    }

    .question-answer {
        background: rgba(5, 150, 105, 0.06);
        border: 1px solid rgba(5, 150, 105, 0.15);
        border-radius: 8px;
        padding: 10px 14px;
        margin-top: 8px;
        display: none;
        font-size: 0.9rem;
        color: #065f46;
        line-height: 1.6;
        transition: all 0.3s ease;
    }

    .question-answer.visible {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    .question-answer .math {
        color: #065f46;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .btn-reveal {
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.15);
        border-radius: 20px;
        padding: 4px 14px;
        font-size: 0.75rem;
        font-weight: 600;
        color: #2563eb;
        cursor: pointer;
        transition: all 0.15s ease;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        margin-top: 4px;
    }

    .btn-reveal:active {
        transform: scale(0.94);
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-reveal.revealed {
        background: rgba(5, 150, 105, 0.1);
        border-color: rgba(5, 150, 105, 0.2);
        color: #059669;
    }

    /* ===== FOOTER ===== */
    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .footer-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(0,0,0,0.08);
    }

    .btn-secondary {
        background: rgba(0,0,0,0.03);
        border-color: rgba(0,0,0,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-primary {
        background: rgba(37, 99, 235, 0.08);
        border-color: rgba(37, 99, 235, 0.12);
        color: #2563eb;
    }
    .btn-primary:active {
        background: rgba(37, 99, 235, 0.15);
    }

    .btn-success {
        background: rgba(5, 150, 105, 0.08);
        border-color: rgba(5, 150, 105, 0.12);
        color: #059669;
    }
    .btn-success:active {
        background: rgba(5, 150, 105, 0.15);
    }

    .btn-warning {
        background: rgba(217, 119, 6, 0.08);
        border-color: rgba(217, 119, 6, 0.12);
        color: #d97706;
    }
    .btn-warning:active {
        background: rgba(217, 119, 6, 0.15);
    }

    .counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #64748b;
        background: rgba(0,0,0,0.04);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.1rem;
        }
        .header-sub {
            font-size: 0.65rem;
            gap: 6px;
        }
        .exercise-title {
            font-size: 1rem;
        }
        .exercise-statement {
            font-size: 0.85rem;
        }
        .question-text {
            font-size: 0.82rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .footer-actions {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
    }

    @media (min-width: 700px) {
        .app-container {
            max-width: 600px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
    }
</style>
</head>
<body>

<div class="app-container">

    <!-- HEADER -->
    <header class="slide-header">
        <h1 id="examTitle">Épreuve</h1>
        <div class="header-sub" id="examInfo">
            <span id="subjectInfo">Matière</span>
            <span id="classInfo">Classe</span>
            <span id="sequenceInfo">Séquence</span>
            <span id="yearInfo">Année</span>
        </div>
    </header>

    <!-- BODY -->
    <main class="slide-body" id="slideBody"></main>

    <!-- FOOTER -->
    <footer class="slide-footer">
        <div class="footer-top">
            <span class="counter" id="exerciseCounter">Exercice 1 / 3</span>
            <span class="counter" id="questionCounter">Q: 0 / 0</span>
        </div>

        <div class="footer-actions">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-primary" id="revealAllBtn">
                <span class="btn-icon">👁️</span> <span class="btn-label">Tout voir</span>
            </button>
            <button class="btn btn-warning" id="hideAllBtn">
                <span class="btn-icon">🙈</span> <span class="btn-label">Tout cacher</span>
            </button>
        </div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // DONNÉES DE L'ÉPREUVE - MODIFIEZ ICI
    // ================================================================
    const examData = {
  "matiere": "Traitement Automatique du Langage (NLP) - L3",
  "classe": "Licence 3 Data Science",
  "sequence": "Séquence 5",
  "anneeScolaire": "2025-2026",
  "exercices": [
    {
      "titre": "Exercice 1 : Questions de cours (Prétraitement et Représentations)",
      "points": "8 pts",
      "enonce": "<div style='font-size:1.1em; line-height:1.6;'>Cet exercice porte sur les chapitres 1 et 2 du cours. Répondez de manière concise mais précise.</div>",
      "questions": [
        {
          "question": "1) Définissez le <strong>Traitement Automatique du Langage (NLP)</strong> et citez deux défis majeurs liés à la compréhension du langage humain par les machines.",
          "reponse": "Le Traitement Automatique du Langage (NLP) est un domaine de l'intelligence artificielle qui vise à doter les machines de la capacité de comprendre, d'interpréter et de générer le langage humain. Parmi les défis majeurs, on trouve l'<strong>ambiguïté</strong> (un mot ou une phrase peut avoir plusieurs sens) et la gestion du <strong>contexte</strong> (le sens d'un mot dépend de son environnement)."
        },
        {
          "question": "2) Expliquez brièvement les trois techniques de prétraitement de texte suivantes : <strong>Tokenization</strong>, <strong>Stemming</strong> et <strong>Lemmatisation</strong>. Donnez un exemple pour chacune avec le mot 'couraient'.",
          "reponse": "<ul><li><strong>Tokenization</strong> : C'est la segmentation d'un texte en unités plus petites (tokens), comme les mots ou les phrases. Exemple : 'couraient' → ['couraient'].</li><li><strong>Stemming</strong> : C'est un processus de réduction des mots à leur radical (stem) en supprimant les affixes, souvent de manière heuristique. Exemple : 'couraient' → 'courr'.</li><li><strong>Lemmatisation</strong> : C'est le processus de réduction des mots à leur forme canonique ou lemme, en utilisant un dictionnaire et l'analyse morphologique. Exemple : 'couraient' → 'courir' (verbe à l'infinitif).</li></ul>"
        },
        {
          "question": "3) Quelles sont les principales limites du modèle <strong>Bag-of-Words (BoW)</strong> ? En quoi le modèle <strong>TF-IDF</strong> améliore-t-il le BoW ?",
          "reponse": "Les principales limites du modèle BoW sont la perte de l'ordre des mots (aucune information syntaxique), l'ignorance de la sémantique (tous les mots sont indépendants), et une forte dimensionnalité creuse (sparse). De plus, il donne le même poids à tous les mots, y compris les mots très fréquents qui ne sont pas discriminants. Le modèle <strong>TF-IDF</strong> améliore le BoW en pondérant les termes en fonction de leur fréquence dans le document (TF) et de leur rareté dans l'ensemble du corpus (IDF). Ainsi, les mots qui apparaissent souvent dans un document mais rarement ailleurs obtiennent un poids plus élevé, ce qui permet de mieux capturer l'importance des termes pour la représentation du document."
        },
        {
          "question": "4) Définissez un <strong>Word Embedding</strong> et nommez les deux architectures principales du modèle <strong>Word2Vec</strong>. Quelle est la principale propriété de ces représentations vectorielles ?",
          "reponse": "Un <strong>Word Embedding</strong> est une représentation vectorielle dense d'un mot dans un espace continu de faible dimension. Les mots sémantiquement proches se retrouvent dans des régions proches de cet espace. Les deux architectures principales de Word2Vec sont : <ul><li><strong>CBOW (Continuous Bag-of-Words)</strong> : Prédit un mot cible à partir de son contexte.</li><li><strong>Skip-gram</strong> : Prédit les mots du contexte à partir d'un mot cible.</li></ul>La principale propriété des embeddings est leur capacité à capturer les relations sémantiques et syntaxiques entre les mots, ce qui permet de résoudre des analogies (par exemple, 'roi' - 'homme' + 'femme' ≈ 'reine')."
        }
      ]
    },
    {
      "titre": "Exercice 2 : Modèles de Langage et Lissage",
      "points": "6 pts",
      "enonce": "<div style='font-size:1.1em; line-height:1.6;'>Les questions suivantes concernent les modèles de langage et les techniques de lissage vues au chapitre 3.</div>",
      "questions": [
        {
          "question": "1) Définissez un modèle de langage N-gramme et expliquez comment il estime la probabilité d'une séquence de mots. Quelle est la limite principale de cette approche ?",
          "reponse": "Un modèle de langage N-gramme est un modèle statistique qui estime la probabilité d'une séquence de mots en se basant sur la fréquence des séquences (N-grammes) observées dans un corpus d'entraînement. Il estime la probabilité d'un mot \( w_i \) en fonction des \( N-1 \) mots qui le précèdent : \( P(w_i \\mid w_{i-1}, ..., w_{i-N+1}) \\). La limite principale est le problème de <strong>sparsité</strong> : de nombreuses séquences de mots ne sont jamais observées dans le corpus, ce qui conduit à des probabilités nulles."
        },
        {
          "question": "2) Expliquez le principe du <strong>lissage de Laplace</strong> (add-k smoothing) et quel problème il résout. Donnez l'équation de la probabilité lissée pour un bigramme avec un paramètre de lissage \\( k \\).",
          "reponse": "Le lissage de Laplace (ou add-k smoothing) est une technique de lissage qui ajoute un petit nombre \\( k \\) (souvent 1) aux dénombrements de tous les N-grammes, y compris ceux qui ne sont pas observés. Cela permet d'éviter les probabilités nulles et d'attribuer une probabilité non nulle aux N-grammes non observés. Pour un bigramme, la probabilité lissée est calculée comme suit : <div class='math-block'> <div class='math'>$$ P_{\\text{Laplace}}(w_i \\mid w_{i-1}) = \\frac{C(w_{i-1}, w_i) + k}{C(w_{i-1}) + k \\times |V|} $$</div></div> où \\( C(w_{i-1}, w_i) \\) est le dénombrement du bigramme, \\( C(w_{i-1}) \\) est le dénombrement du mot précédent, \\( |V| \\) est la taille du vocabulaire, et \\( k \\) est la constante de lissage."
        },
        {
          "question": "3) Qu'est-ce que la <strong>perplexité</strong> et comment est-elle utilisée pour évaluer un modèle de langage ? Interprétez un score de perplexité de 100 pour un test set.",
          "reponse": "La <strong>perplexité</strong> est une métrique d'évaluation pour les modèles de langage. Elle mesure l'incertitude du modèle lorsqu'il prédit le prochain mot dans une séquence. Elle est définie comme l'inverse de la probabilité moyenne du test set, exponentielle. Une perplexité plus faible indique un meilleur modèle, car elle signifie que le modèle est plus 'confiant' dans ses prédictions. Un score de perplexité de 100 signifie que, en moyenne, le modèle est aussi incertain que s'il devait choisir entre 100 mots également probables pour la prochaine position."
        }
      ]
    },
    {
      "titre": "Exercice 3 : Classification de Texte",
      "points": "4 pts",
      "enonce": "<div style='font-size:1.1em; line-height:1.6;'>Cet exercice se concentre sur le chapitre 4, Classification de texte. Vous êtes un data scientist et devez résoudre un problème de classification.</div>",
      "questions": [
        {
          "question": "1) Vous travaillez sur un projet de classification de tweets en trois catégories : 'positif', 'négatif' et 'neutre'. Décrivez les étapes clés de prétraitement que vous appliqueriez aux tweets avant de les vectoriser.",
          "reponse": "Les étapes clés de prétraitement pour des tweets incluraient : <ol><li><strong>Mise en minuscules</strong> : pour uniformiser le texte.</li><li><strong>Suppression des mentions (@utilisateur) et des hashtags</strong> : s'ils ne sont pas considérés comme pertinents pour la classification.</li><li><strong>Suppression des URLs</strong> : remplacement par un token spécial ou suppression.</li><li><strong>Suppression de la ponctuation et des caractères spéciaux</strong> : en fonction du besoin.</li><li><strong>Tokenization</strong> : segmentation du texte en mots.</li><li><strong>Suppression des stop words</strong> : mots courants (le, de, à, ...) qui n'apportent pas de sens spécifique au contexte.</li><li><strong>Stemming ou Lemmatisation</strong> : pour réduire les mots à leur racine.</li></ol>"
        },
        {
          "question": "2) Pour votre projet de classification de tweets, vous décidez d'utiliser à la fois un modèle <strong>LSTM</strong> et un modèle <strong>BERT</strong> fine-tuné. Expliquez brièvement en quoi ces deux approches diffèrent et quels sont leurs avantages respectifs pour la classification de texte.",
          "reponse": "<ul><li><strong>LSTM</strong> (Long Short-Term Memory) est un type de RNN qui est capable de capturer les dépendances à long terme dans une séquence. Pour la classification de texte, le LSTM traite le texte de manière séquentielle, de gauche à droite. Son avantage est sa simplicité et son efficacité pour des séquences de longueur modérée, mais il peut avoir du mal à capturer des contextes complexes ou des relations à longue distance.</li><li><strong>BERT</strong> (Bidirectional Encoder Representations from Transformers) est un modèle de langage basé sur l'architecture Transformer, qui traite tout le texte simultanément et de manière bidirectionnelle. Son principal avantage est sa capacité à capturer un contexte riche et bidirectionnel, ce qui le rend très performant sur une grande variété de tâches de NLP. Le fine-tuning de BERT sur une tâche de classification permet d'atteindre des performances de pointe, mais nécessite plus de ressources de calcul.</li></ul>"
        },
        {
          "question": "3) Quelle métrique d'évaluation privilégieriez-vous pour ce problème de classification à 3 classes (positif, négatif, neutre) si vos données sont déséquilibrées (par exemple, la classe 'neutre' est très majoritaire) ? Justifiez votre réponse.",
          "reponse": "Avec des données déséquilibrées, l'accuracy (précision globale) ne serait pas une métrique fiable car un modèle qui prédit toujours 'neutre' obtiendrait une bonne accuracy. Je privilégierais le <strong>score F1-macro</strong> ou le <strong>score F1-weighted</strong>. Le F1-macro calcule le F1-score pour chaque classe de manière indépendante puis en fait la moyenne, donnant ainsi le même poids à chaque classe. Le F1-weighted pondère chaque classe par son support (nombre d'exemples), ce qui peut être plus représentatif de la performance globale. D'autres métriques comme la matrice de confusion et le rappel par classe sont également très utiles pour diagnostiquer les performances du modèle sur chaque catégorie."
        }
      ]
    },
    {
      "titre": "Exercice 4 : Problème Pratique sur la Classification de Texte (avec BERT)",
      "points": "7 pts",
      "enonce": "<div style='font-size:1.1em; line-height:1.6;'>On vous donne un petit corpus de 5 avis clients sur des smartphones. Votre tâche est de les classifier manuellement comme 'Positif' ou 'Négatif'. Ensuite, vous devez décrire comment vous utiliseriez BERT pour automatiser cette tâche.</div>",
      "questions": [
        {
          "question": "1) Lisez les 5 avis suivants et assignez manuellement une étiquette (Positif ou Négatif) à chacun : <ul><li>Avis 1 : 'Le nouveau modèle est incroyable, la batterie tient deux jours ! Je suis ravi.'</li><li>Avis 2 : 'Très déçu. L'écran est fragile et le téléphone chauffe beaucoup.'</li><li>Avis 3 : 'Bon produit, mais le prix est trop élevé pour ce que c'est.'</li><li>Avis 4 : 'La qualité des photos est excellente, le design est magnifique !'</li><li>Avis 5 : 'Je regrette mon achat. L'autonomie est catastrophique et l'interface est lente.'</li></ul>",
          "reponse": "<ul><li>Avis 1 : <span style='color:green;'>Positif</span></li><li>Avis 2 : <span style='color:red;'>Négatif</span></li><li>Avis 3 : <span style='color:orange;'>Neutre/Négatif</span> (Critique positive mais le prix est un point négatif important)</li><li>Avis 4 : <span style='color:green;'>Positif</span></li><li>Avis 5 : <span style='color:red;'>Négatif</span></li></ul><p style='font-style:italic;'>Remarque : L'avis 3 pourrait être considéré comme neutre ou négatif selon le contexte. Pour un modèle de classification binaire, on pourrait le classer en Négatif si le prix est le facteur le plus important.</p>"

          "reponse": "Le processus de fine-tuning d'un modèle BERT pour la classification binaire se déroule en plusieurs étapes : <ol><li><strong>Chargement du modèle et du tokenizer</strong> : Charger un modèle BERT pré-entraîné (ex: 'bert-base-uncased') et son tokenizer correspondant depuis une bibliothèque comme Hugging Face Transformers.</li><li><strong>Prétraitement des données</strong> : Tokeniser tous les textes en utilisant le tokenizer de BERT. Cela inclut l'ajout des tokens spéciaux ([CLS], [SEP]) et le padding/truncation des séquences à une longueur maximale fixe (ex: 512 tokens).</li><li><strong>Préparation des données</strong> : Créer des DataLoaders (par ex. avec PyTorch ou TensorFlow) pour les ensembles d'entraînement et de validation.</li><li><strong>Configuration de l'entraînement</strong> : Ajouter une couche de classification linéaire sur la sortie du token [CLS] pour la classification binaire. Définir les hyperparamètres : taux d'apprentissage (ex: 2e-5), nombre d'époques, taille de lot, etc.</li><li><strong>Entraînement (Fine-tuning)</strong> : Entraîner le modèle sur le jeu de données d'entraînement. Le modèle ajuste tous ses poids, y compris ceux de BERT, pour minimiser la fonction de perte (ex: cross-entropy) sur la tâche de classification.</li><li><strong>Évaluation</strong> : Évaluer le modèle fine-tuné sur le jeu de données de validation à l'aide de métriques comme l'accuracy, le F1-score, la matrice de confusion.</li><li><strong>Prédiction</strong> : Utiliser le modèle fine-tuné pour prédire l'étiquette de nouveaux avis clients.</li></ol>"

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentExerciseIndex = 0;
    let revealedAnswers = {};

    const totalExercises = examData.exercices.length;

    // Références jQuery
    const $title = $('#examTitle');
    const $subjectInfo = $('#subjectInfo');
    const $classInfo = $('#classInfo');
    const $sequenceInfo = $('#sequenceInfo');
    const $yearInfo = $('#yearInfo');
    const $body = $('#slideBody');
    const $exerciseCounter = $('#exerciseCounter');
    const $questionCounter = $('#questionCounter');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $revealAll = $('#revealAllBtn');
    const $hideAll = $('#hideAllBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function renderExercise(index) {
        const exercise = examData.exercices[index];
        const totalQuestions = exercise.questions.length;

        // Mettre à jour le header
        $title.text(examData.matiere + ' - Épreuve');
        $subjectInfo.text('📚 ' + examData.matiere);
        $classInfo.text('🏫 ' + examData.classe);
        $sequenceInfo.text('📖 ' + examData.sequence);
        $yearInfo.text('📅 ' + examData.anneeScolaire);

        // Construire le contenu
        let html = '';

        // En-tête de l'exercice
        html += `
            <div class="exercise-card">
                <div class="exercise-header">
                    <span class="exercise-title">${exercise.titre}</span>
                    <span class="exercise-points">${exercise.points}</span>
                </div>
                <div class="exercise-statement">
                    ${exercise.enonce}
                </div>
        `;

        // Questions
        exercise.questions.forEach((q, qIndex) => {
            const isRevealed = revealedAnswers[index] && revealedAnswers[index][qIndex] || false;
            const questionId = `q-${index}-${qIndex}`;

            html += `
                <div class="question-block ${isRevealed ? 'revealed' : ''}" id="block-${questionId}">
                    <div class="question-text">
                        <span class="question-label">${qIndex + 1}.</span>
                        <span>${q.question}</span>
                    </div>
                    <button class="btn-reveal ${isRevealed ? 'revealed' : ''}" 
                            data-exercise="${index}" 
                            data-question="${qIndex}"
                            id="btn-${questionId}">
                        ${isRevealed ? '🙈 Masquer' : '👁️ Voir réponse'}
                    </button>
                    <div class="question-answer ${isRevealed ? 'visible' : ''}" id="answer-${questionId}">
                        ${q.reponse}
                    </div>
                </div>
            `;
        });

        html += `</div>`;

        $body.html(html);

        // Mettre à jour les compteurs
        $exerciseCounter.text(`Exercice ${index + 1} / ${totalExercises}`);
        $questionCounter.text(`Q: ${totalQuestions} question${totalQuestions > 1 ? 's' : ''}`);

        // Rafraîchir MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            setTimeout(() => {
                MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
            }, 100);
        }

        // Attacher les événements aux boutons de révélation
        $('.btn-reveal').on('click', function() {
            const exIndex = parseInt($(this).data('exercise'));
            const qIndex = parseInt($(this).data('question'));
            toggleAnswer(exIndex, qIndex);
        });
    }

    function toggleAnswer(exIndex, qIndex) {
        if (!revealedAnswers[exIndex]) {
            revealedAnswers[exIndex] = {};
        }

        const isRevealed = revealedAnswers[exIndex][qIndex] || false;
        revealedAnswers[exIndex][qIndex] = !isRevealed;

        const questionId = `q-${exIndex}-${qIndex}`;
        const $block = $(`#block-${questionId}`);
        const $btn = $(`#btn-${questionId}`);
        const $answer = $(`#answer-${questionId}`);

        if (revealedAnswers[exIndex][qIndex]) {
            $block.addClass('revealed');
            $btn.addClass('revealed');
            $btn.html('🙈 Masquer');
            $answer.addClass('visible');
        } else {
            $block.removeClass('revealed');
            $btn.removeClass('revealed');
            $btn.html('👁️ Voir réponse');
            $answer.removeClass('visible');
        }
    }

    function goToExercise(index) {
        if (index < 0) index = 0;
        if (index >= totalExercises) index = totalExercises - 1;
        currentExerciseIndex = index;
        renderExercise(index);
    }

    function goToNext() {
        if (currentExerciseIndex + 1 < totalExercises) {
            goToExercise(currentExerciseIndex + 1);
        }
    }

    function goToPrev() {
        if (currentExerciseIndex - 1 >= 0) {
            goToExercise(currentExerciseIndex - 1);
        }
    }

    function revealAll() {
        const exercise = examData.exercices[currentExerciseIndex];
        exercise.questions.forEach((_, qIndex) => {
            if (!revealedAnswers[currentExerciseIndex]) {
                revealedAnswers[currentExerciseIndex] = {};
            }
            revealedAnswers[currentExerciseIndex][qIndex] = true;
        });
        renderExercise(currentExerciseIndex);
    }

    function hideAll() {
        if (revealedAnswers[currentExerciseIndex]) {
            revealedAnswers[currentExerciseIndex] = {};
        }
        renderExercise(currentExerciseIndex);
    }

    // ================================================================
    // INIT
    // ================================================================
    function init() {
        // Initialiser l'état des réponses
        examData.exercices.forEach((_, index) => {
            revealedAnswers[index] = {};
        });

        // Afficher le premier exercice
        renderExercise(0);

        // Événements
        $prev.on('click', goToPrev);
        $next.on('click', goToNext);
        $revealAll.on('click', revealAll);
        $hideAll.on('click', hideAll);

        // Support du clavier
        $(document).on('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                goToNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                goToPrev();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                revealAll();
            } else if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                hideAll();
            }
        });
    }

    init();
});
</script>
