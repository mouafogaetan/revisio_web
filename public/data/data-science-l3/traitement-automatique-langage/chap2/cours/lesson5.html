<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Présentation mobile</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' },
            options: { skipHtmlTypes: 'script' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 500px;
        margin: 0 auto;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    .slide-header {
        flex-shrink: 0;
        padding: 18px 16px 10px 16px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        z-index: 10;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .slide-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
    }

    .content-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 18px 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        flex-shrink: 0;
    }

    .content-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .content-card li {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        line-height: 1.5;
    }

    .content-card li:last-child {
        border-bottom: none;
    }

    .bullet-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
    }

    .math-block {
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        overflow-x: auto;
        flex-shrink: 0;
        margin: 4px 0;
    }

    .math-block .math {
        font-size: 1.2rem;
        color: #e2e8f0;
    }

    .note-box {
        background: rgba(96, 165, 250, 0.08);
        border-left: 4px solid #60a5fa;
        padding: 12px 16px;
        border-radius: 12px;
        font-style: italic;
        font-size: 0.9rem;
        color: #cbd5e1;
        flex-shrink: 0;
    }

    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        border-radius: 0;
        flex-direction: column;
    }

    .loading-card {
        background: #1e293b;
        padding: 32px 28px;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #334155;
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px auto;
    }

    .loading-text {
        font-weight: 600;
        font-size: 1.1rem;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    .loading-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 16px;
    }
    .loading-progress {
        height: 3px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        animation: loadingProgress 30s ease-out forwards;
    }

    .loading-timeout {
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 12px;
    }

    .btn-cancel-loading {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 40px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #f87171;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }

    .btn-cancel-loading:active {
        transform: scale(0.94);
        background: rgba(239, 68, 68, 0.25);
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
    }

    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .slide-counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255,255,255,0.05);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(255,255,255,0.04);
    }

    .status-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 30px;
        background: rgba(96, 165, 250, 0.12);
        color: #93bbfc;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
    }

    .status-badge .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: pulse-dot 1.2s infinite;
        flex-shrink: 0;
    }

    .status-badge.idle .dot {
        animation: none;
        background: #64748b;
    }
    .status-badge.speaking .dot {
        background: #34d399;
        animation: pulse-dot 0.8s infinite;
    }
    .status-badge.error .dot {
        background: #f87171;
        animation: none;
    }
    .status-badge.paused .dot {
        animation: none;
        background: #fbbf24;
    }
    .status-badge.waiting .dot {
        animation: pulse-dot 1.5s infinite;
        background: #fbbf24;
    }
    .status-badge.loading .dot {
        animation: pulse-dot 0.5s infinite;
        background: #60a5fa;
    }

    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.7); }
    }

    .footer-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(255,255,255,0.1);
    }

    .btn-secondary {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-play {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
        min-width: 80px;
        justify-content: center;
    }
    .btn-play:active {
        background: rgba(52, 211, 153, 0.25);
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
    }

    .auto-indicator {
        font-size: 0.65rem;
        color: #64748b;
        text-align: center;
        letter-spacing: 0.3px;
        padding: 2px 0;
    }

    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.2rem;
        }
        .content-card li {
            font-size: 0.9rem;
            padding: 8px 0;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .btn-play {
            min-width: 60px;
        }
        .footer-buttons {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
        .loading-card {
            padding: 20px 16px;
        }
        .math-block .math {
            font-size: 1rem;
        }
    }

    @media (min-width: 600px) {
        .app-container {
            max-width: 480px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
        .loading-overlay {
            border-radius: 32px;
        }
    }

    /* Mode jour (par défaut) */
    html, body {
        background: #f0f4f8 !important;
        color: #1a202c !important;
    }
    .app-container {
        background: linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%) !important;
    }
    .slide-header {
        background: rgba(255, 255, 255, 0.85) !important;
        border-bottom: 1px solid rgba(0,0,0,0.08) !important;
    }
    .slide-header h1 {
        background: linear-gradient(135deg, #2b6cb0, #6b46c1) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        background-clip: text !important;
    }
    .slide-footer {
        background: rgba(255, 255, 255, 0.9) !important;
        border-top: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card {
        background: rgba(255,255,255,0.8) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card li {
        border-bottom: 1px solid rgba(0,0,0,0.05) !important;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.12) !important;
        border-left: 4px solid #4299e1 !important;
        color: #2c3e50 !important;
    }
    .math-block {
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .math-block .math {
        color: #2d3748 !important;
    }
    .slide-counter {
        color: #4a5568 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .status-badge {
        background: rgba(96, 165, 250, 0.15) !important;
        color: #2b6cb0 !important;
        border: 1px solid rgba(96, 165, 250, 0.15) !important;
    }
    .btn {
        color: #2d3748 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .btn-secondary {
        background: rgba(0,0,0,0.04) !important;
        border-color: rgba(0,0,0,0.08) !important;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15) !important;
        border-color: rgba(52, 211, 153, 0.2) !important;
        color: #38a169 !important;
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15) !important;
        border-color: rgba(251, 191, 36, 0.2) !important;
        color: #d69e2e !important;
    }
    .auto-indicator {
        color: #718096 !important;
    }
    .loading-card {
        background: #ffffff !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .loading-text {
        color: #1a202c !important;
    }
    .loading-sub {
        color: #4a5568 !important;
    }
</style>
</head>
<body>

<div class="app-container">

    <header class="slide-header">
        <h1 id="slideTitle">Chargement...</h1>
    </header>

    <main class="slide-body" id="slideBody"></main>

    <!-- LOADING OVERLAY AVEC BOUTON ANNULER -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Préparation vocale...</div>
            <div class="loading-sub" id="loadingSub">Synthèse en cours</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loadingProgressBar"></div>
            </div>
            <div class="loading-timeout" id="loadingTimeout">⏱️ 30 secondes maximum</div>
            <button class="btn-cancel-loading" id="cancelLoadingBtn">
                <span>✕</span> Annuler
            </button>
        </div>
    </div>

    <footer class="slide-footer">
        <div class="footer-top">
            <span class="slide-counter" id="slideCounter">1 / 3</span>
            <span class="status-badge idle" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">Prêt</span>
            </span>
        </div>

        <div class="footer-buttons">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-secondary" id="replayBtn">
                <span class="btn-icon">🔁</span> <span class="btn-label">Relire</span>
            </button>
            <button class="btn btn-play" id="playBtn">
                <span class="btn-icon">▶</span> <span class="btn-label">Play</span>
            </button>
        </div>

        <div class="auto-indicator" id="autoIndicator">⏸ Lecture manuelle</div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // SLIDES
    // ================================================================
    const slides = [
  {
    "titre": "Word Embeddings : Word2Vec",
    "contenu": "<div style='display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center; padding: 20px;'> <h1 style='font-size: 1.8rem; margin-bottom: 20px; color: #2c3e50;'>🧠 Word Embeddings : Word2Vec</h1> <div style='background: linear-gradient(135deg, #2c3e50, #3498db); padding: 30px; border-radius: 15px; color: white; margin: 20px 0; width: 100%;'> <p style='font-size: 1.2rem; margin: 0;'>Leçon 5 - Traitement Automatique du Langage (NLP)</p> <p style='font-size: 1rem; margin-top: 10px; opacity: 0.9;'>Licence 3 Data Science - Cameroun</p> </div> <div style='background: #ecf0f1; padding: 20px; border-radius: 10px; width: 100%; margin-top: 15px;'> <h3 style='color: #2c3e50; margin: 0;'>🎯 Objectifs de la leçon</h3> <ul style='text-align: left; color: #2c3e50;'> <li>Comprendre le principe des word embeddings</li> <li>Maîtriser les architectures Word2Vec : CBOW et Skip-gram</li> <li>Analyser les propriétés des embeddings (analogies, proximité sémantique)</li> </ul> </div> </div>",
    "texteParle": "Bonjour à tous. Bienvenue dans ce cours sur les Word Embeddings et Word2Vec. Aujourd'hui, nous allons découvrir l'une des innovations les plus importantes en traitement automatique du langage. Les word embeddings sont des représentations vectorielles des mots qui capturent leur signification sémantique. Word2Vec, développé par Google en 2013, a révolutionné le NLP en permettant de représenter les mots sous forme de vecteurs denses dans un espace continu. Nous allons explorer les deux architectures principales : CBOW et Skip-gram, et voir comment ces représentations capturent des relations sémantiques et syntaxiques fascinantes entre les mots.",
    "note": "Word2Vec a marqué un tournant majeur dans le NLP en remplaçant les représentations creuses par des embeddings denses."
  },
  {
    "titre": "Des Représentations Creuses aux Embeddings",
    "contenu": "<div style='padding: 15px;'> <h2 style='color: #2c3e50; font-size: 1.5rem;'>📊 Des Représentations Creuses aux Embeddings Denses</h2> <div style='display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin: 10px 0;'> <div style='background: #f8f9fa; padding: 15px; border-radius: 10px; border: 2px solid #e74c3c;'> <h3 style='color: #2c3e50; font-size: 1rem; text-align: center;'>❌ One-Hot Encoding</h3> <ul style='color: #2c3e50;'> <li>Vecteurs de taille = vocabulaire</li> <li>Très <strong>creux</strong> (1 pour un mot, 0 ailleurs)</li> <li>Aucune <strong>relation sémantique</strong> entre mots</li> <li>Ex: [0,0,1,0,0,0,...]</li> </ul> </div> <div style='background: #e8f4fd; padding: 15px; border-radius: 10px; border: 2px solid #27ae60;'> <h3 style='color: #2c3e50; font-size: 1rem; text-align: center;'>✅ Word Embeddings</h3> <ul style='color: #2c3e50;'> <li>Vecteurs de taille <strong>fixe</strong> (100-300 dimensions)</li> <li>Vecteurs <strong>denses</strong> (valeurs réelles)</li> <li>Capturent les <strong>relations sémantiques</strong></li> <li>Ex: [0.25, -0.33, 0.89, ...]</li> </ul> </div> </div> <div style='background: #fff3cd; padding: 15px; border-radius: 10px; margin-top: 10px; border: 1px solid #ffc107;'> <p style='color: #856404; font-style: italic; margin: 0;'>💡 <strong>Idée clé :</strong> \"You shall know a word by the company it keeps\" — Des mots similaires apparaissent dans des contextes similaires</p> </div> </div>",
    "texteParle": "Pour comprendre les word embeddings, il faut d'abord voir comment on représentait les mots avant. La méthode classique, le one-hot encoding, crée des vecteurs de la taille du vocabulaire avec un seul 1 et des zéros partout. Ces vecteurs sont énormes, creux, et ne capturent aucune relation entre les mots. Les embeddings sont complètement différents : ce sont des vecteurs denses de taille fixe, généralement entre 100 et 300 dimensions. Chaque dimension capture une caractéristique sémantique du mot. L'idée fondamentale est que les mots qui apparaissent dans des contextes similaires ont des significations similaires. C'est ce qu'on appelle l'hypothèse distributionnelle, et c'est le pilier des word embeddings.",
    "note": "Les embeddings denses sont plus compacts et capturent mieux le sens des mots que les représentations creuses."
  },
  {
    "titre": "Principe de Word2Vec",
    "contenu": "<div style='padding: 15px;'> <h2 style='color: #2c3e50; font-size: 1.5rem;'>🔬 Principe de Word2Vec</h2> <div style='background: #f8f9fa; padding: 15px; border-radius: 10px; margin: 10px 0;'> <h3 style='color: #2c3e50; font-size: 1.1rem;'>L'idée fondamentale</h3> <ul style='color: #2c3e50;'> <li>Apprendre des représentations vectorielles <strong>en prédisant le contexte</strong></li> <li>Un mot est représenté par un vecteur de nombres réels</li> <li>Les mots avec des <strong>contextes similaires</strong> ont des vecteurs proches</li> <li>Entraînement sur de <strong>grands corpus</strong> de texte</li> </ul> </div> <div style='background: #e8f4fd; padding: 15px; border-radius: 10px; margin-top: 10px;'> <h3 style='color: #2c3e50; font-size: 1.1rem;'>Deux architectures</h3> <div style='display: grid; grid-template-columns: 1fr 1fr; gap: 10px;'> <div style='background: white; padding: 10px; border-radius: 8px; text-align: center;'> <p style='color: #2c3e50; font-weight: bold;'>CBOW</p> <p style='color: #2c3e50; font-size: 0.85rem;'>Prédire le mot à partir du contexte</p> </div> <div style='background: white; padding: 10px; border-radius: 8px; text-align: center;'> <p style='color: #2c3e50; font-weight: bold;'>Skip-gram</p> <p style='color: #2c3e50; font-size: 0.85rem;'>Prédire le contexte à partir du mot</p> </div> </div> <p style='color: #2c3e50; font-size: 0.9rem; margin-top: 5px; text-align: center;'>Différence : CBOW est plus rapide, Skip-gram est meilleur pour les mots rares</p> </div> </div>",
    "texteParle": "Le principe de Word2Vec est élégant. On apprend des représentations vectorielles en entraînant un réseau de neurones à prédire des mots à partir de leur contexte. L'idée est que les mots qui partagent des contextes similaires auront des vecteurs proches dans l'espace vectoriel. Il y a deux architectures principales dans Word2Vec. CBOW, ou Continuous Bag of Words, prédit le mot central à partir des mots du contexte. Skip-gram fait l'inverse : à partir d'un mot, il prédit les mots du contexte. CBOW est plus rapide à entraîner, tandis que Skip-gram donne de meilleurs résultats pour les mots rares. Les deux approches produisent des embeddings de qualité.",
    "note": "Word2Vec utilise un réseau de neurones à une seule couche cachée pour apprendre les représentations."
  },
  {
    "titre": "CBOW : Continuous Bag of Words",
    "contenu": "<div style='padding: 15px;'> <h2 style='color: #2c3e50; font-size: 1.5rem;'>📦 CBOW (Continuous Bag of Words)</h2> <div style='background: #f8f9fa; padding: 15px; border-radius: 10px; margin: 10px 0;'> <h3 style='color: #2c3e50; font-size: 1.1rem;'>Principe de fonctionnement</h3> <ul style='color: #2c3e50;'> <li>Objectif : Prédire le mot central à partir des mots du contexte</li> <li>Contexte : fenêtre de mots avant et après le mot cible</li> <li>Entrée : les embeddings des mots du contexte (moyenne ou somme)</li> <li>Sortie : distribution de probabilité sur le vocabulaire</li> </ul> </div> <div style='background: #e8f4fd; padding: 15px; border-radius: 10px; margin-top: 10px;'> <h3 style='color: #2c3e50; font-size: 1.1rem;'>Exemple</h3> <div style='background: white; padding: 15px; border-radius: 8px; text-align: center;'> <p style='color: #2c3e50; font-family: monospace;'>Phrase : \"Le chat <strong>mange</strong> une souris\"</p> <p style='color: #2c3e50;'>Contextes : [\"Le\", \"chat\", \"une\", \"souris\"] → Prédire : \"mange\"</p> </div> </div> <div style='background: #d4edda; padding: 15px; border-radius: 10px; margin-top: 10px; border-left: 4px solid #28a745;'> <p style='color: #155724; margin: 0;'>✅ <strong>Avantage :</strong> CBOW est plus rapide et mieux pour les mots fréquents</p> </div> </div>",
    "texteParle": "CBOW, ou Continuous Bag of Words, est la première architecture de Word2Vec. Son objectif est de prédire un mot à partir des mots qui l'entourent dans une fenêtre de contexte. Par exemple, avec la phrase 'Le chat mange une souris', si le mot cible est 'mange', le contexte est ['Le', 'chat', 'une', 'souris']. CBOW prend les embeddings de ces mots de contexte, en fait la moyenne ou la somme, et essaie de prédire le mot central. Ce processus est répété sur des millions d'exemples, ce qui permet d'apprendre des embeddings qui capturent les relations sémantiques. CBOW est particulièrement efficace pour les mots fréquents et est plus rapide à entraîner que Skip-gram.",
    "note": "CBOW est souvent plus rapide que Skip-gram car il traite tout le contexte en une seule fois."
  },
  {
    "titre": "Skip-gram",
    "contenu": "<div style='padding: 15px;'> <h2 style='color: #2c3e50; font-size: 1.5rem;'>⏭️ Skip-gram</h2> <div style='background: #f8f9fa; padding: 15px; border-radius: 10px; margin: 10px 0;'> <h3 style='color: #2c3e50; font-size: 1.1rem;'>Principe de fonctionnement</h3> <ul style='color: #2c3e50;'> <li>Objectif : Prédire les mots du contexte à partir du mot central</li> <li>Inverse de CBOW</li> <li>Entrée : l'embedding du mot central</li> <li>Sortie : distribution de probabilité sur le vocabulaire pour chaque mot du contexte</li> </ul> </div> <div style='background: #e8f4fd; padding: 15px; border-radius: 10px; margin-top: 10px;'> <h3 style='color: #2c3e50; font-size: 1.1rem;'>Exemple</h3> <div style='background: white; padding: 15px; border-radius: 8px; text-align: center;'> <p style='color: #2c3e50; font-family: monospace;'>Phrase : \"Le chat <strong>mange</strong> une souris\"</p> <p style='color: #2c3e50;'>Mot central : \"mange\" → Prédire : [\"Le\", \"chat\", \"une\", \"souris\"]</p> </div> </div> <div style='background: #d4edda; padding: 15px; border-radius: 10px; margin-top: 10px; border-left: 4px solid #28a745;'> <p style='color: #155724; margin: 0;'>✅ <strong>Avantage :</strong> Skip-gram est meilleur pour les mots rares et les petites données</p> </div> </div>",
    "texteParle": "Skip-gram est l'architecture jumelle de CBOW. Au lieu de prédire le mot central à partir du contexte, Skip-gram fait l'inverse : à partir d'un mot central, il prédit les mots du contexte. C'est comme si vous connaissiez un mot et deviez deviner les mots qui l'entourent. Avec la même phrase 'Le chat mange une souris', le mot central est 'mange' et les mots du contexte sont 'Le', 'chat', 'une', 'souris'. Skip-gram est généralement plus lent que CBOW parce qu'il doit prédire plusieurs mots pour chaque exemple, mais il donne de meilleurs résultats pour les mots rares. C'est donc un bon choix si votre corpus contient beaucoup de mots peu fréquents.",
    "note": "Skip-gram est préféré pour les corpus où les mots rares sont importants."
  },
  {
    "titre": "L'Architecture Neuronale",
    "contenu": "<div style='padding: 15px;'> <h2 style='color: #2c3e50; font-size: 1.5rem;'>🏗️ Architecture Neuronale</h2> <div style='background: #f8f9fa; padding: 15px; border-radius: 10px; margin: 10px 0;'> <h3 style='color: #2c3e50; font-size: 1.1rem;'>Structure du réseau</h3> <ul style='color: #2c3e50;'> <li><strong>Couche d'entrée</strong> : One-hot encoding ou indices des mots</li> <li><strong>Couche cachée</strong> : Les embeddings (matrice de poids)</li> <li><strong>Couche de sortie</strong> : Distribution de probabilité sur le vocabulaire</li> </ul> </div> <div style='background: #e8f4fd; padding: 15px; border-radius: 10px; margin-top: 10px;'> <h3 style='color: #2c3e50; font-size: 1.1rem;'>Matrice des embeddings</h3> <div style='background: white; padding: 15px; border-radius: 8px; text-align: center;'> <p style='color: #2c3e50; font-family: monospace;'>Vocabulaire (V mots) × Dimension (D)</p> <p style='color: #2c3e50;'>Chaque ligne = l'embedding d'un mot</p> </div> </div> <div style='background: #fff3cd; padding: 15px; border-radius: 10px; margin-top: 10px; border: 1px solid #ffc107;'> <p style='color: #856404; font-style: italic; margin: 0;'>💡 <strong>Remarque :</strong> La couche cachée n'a pas d'activation (linéaire), les embeddings sont les poids de cette couche</p> </div> </div>",
    "texteParle": "L'architecture neuronale de Word2Vec est en réalité assez simple. Elle se compose de trois couches : une couche d'entrée, une couche cachée, et une couche de sortie. La couche d'entrée reçoit les mots sous forme de one-hot encoding ou d'indices. La couche cachée est ce qui nous intéresse vraiment : c'est une matrice de poids où chaque ligne correspond à l'embedding d'un mot. La dimension de cette matrice est Vocabulaire × Dimension, où la dimension est généralement de 100 à 300. Enfin, la couche de sortie produit une distribution de probabilité sur l'ensemble du vocabulaire. Les embeddings sont donc les poids de la couche cachée, appris pendant l'entraînement.",
    "note": "Les embeddings sont les poids de la couche cachée, appris par rétropropagation."
  },
  {
    "titre": "Entraînement de Word2Vec",
    "contenu": "<div style='padding: 15px;'> <h2 style='color: #2c3e50; font-size: 1.5rem;'>⚡ Entraînement de Word2Vec</h2> <div style='background: #f8f9fa; padding: 15px; border-radius: 10px; margin: 10px 0;'> <h3 style='color: #2c3e50; font-size: 1.1rem;'>Processus d'entraînement</h3> <ul style='color: #2c3e50;'> <li>Parcourir le corpus avec une <strong>fenêtre glissante</strong></li> <li>Créer des paires (mot central, mot contexte)</li> <li>Entraîner le réseau à prédire les paires</li> <li>Ajuster les embeddings par <strong>rétropropagation</strong></li> <li>Répéter sur plusieurs <strong>époques</strong></li> </ul> </div> <div style='background: #e8f4fd; padding: 15px; border-radius: 10px; margin-top: 10px;'> <h3 style='color: #2c3e50; font-size: 1.1rem;'>Fonction de perte</h3> <div class='math-block' style='background: white; padding: 15px; border-radius: 8px; text-align: center;'> <div class='math'>$$J(\\theta) = - \\frac{1}{T} \\sum_{t=1}^{T} \\sum_{-m \\leq j \\leq m, j \\neq 0} \\log P(w_{t+j} | w_t)$$</div> </div> <p style='color: #2c3e50; font-size: 0.9rem; margin-top: 5px; text-align: center;'>Skip-gram : Maximiser la log-vraisemblance des mots de contexte</p> </div> </div>",
    "texteParle": "L'entraînement de Word2Vec est un processus itératif. On parcourt le corpus avec une fenêtre glissante de taille définie (par exemple, 5 mots à gauche et 5 à droite). Pour chaque mot central, on crée des paires avec les mots du contexte. Ensuite, on entraîne le réseau à prédire ces paires, et on ajuste les embeddings via rétropropagation. La fonction de perte pour Skip-gram est la log-vraisemblance négative : on maximise la probabilité d'observer les mots du contexte étant donné le mot central. Ce processus est répété sur plusieurs époques, ce qui permet aux embeddings de capturer progressivement les relations sémantiques entre les mots.",
    "note": "La fonction de perte de Word2Vec est une version de la cross-entropy pour la prédiction de contexte."
  },
  {
    "titre": "Propriétés des Embeddings",
    "contenu": "<div style='padding: 15px;'> <h2 style='color: #2c3e50; font-size: 1.5rem;'>✨ Propriétés des Embeddings</h2> <div style='background: #f8f9fa; padding: 15px; border-radius: 10px; margin: 10px 0;'> <h3 style='color: #2c3e50; font-size: 1.1rem;'>Relations sémantiques</h3> <ul style='color: #2c3e50;'> <li>Les mots similaires ont des vecteurs <strong>proches</strong> (cosinus proche de 1)</li> <li>Les mots opposés ont des vecteurs <strong>éloignés</strong> (cosinus proche de -1)</li> <li>Capturent des relations <strong>analogiques</strong></li> </ul> </div> <div style='background: #e8f4fd; padding: 15px; border-radius: 10px; margin-top: 10px;'> <h3 style='color: #2c3e50; font-size: 1.1rem;'>Exemples d'analogies</h3> <ul style='color: #2c3e50;'> <li><strong>Roi - Homme + Femme ≈ Reine</strong></li> <li><strong>Paris - France + Italie ≈ Rome</strong></li> <li><strong>Manger - Nourriture + Eau ≈ Boire</strong></li> <li><strong>Pluriel : chat → chats, chien → chiens</strong></li> </ul> </div> <div style='background: #d4edda; padding: 15px; border-radius: 10px; margin-top: 10px; border-left: 4px solid #28a745;'> <p style='color: #155724; margin: 0;'>🔑 <strong>Propriété clé :</strong> Les opérations vectorielles (addition, soustraction) sur les embeddings capturent des relations sémantiques</p> </div> </div>",
    "texteParle": "Ce qui rend les word embeddings vraiment fascinants, c'est qu'ils capturent des relations sémantiques de manière mathématique. Les mots similaires ont des vecteurs proches dans l'espace vectoriel : on peut mesurer cette proximité avec le cosinus. Mais surtout, les embeddings permettent des opérations vectorielles qui révèlent des analogies ! Par exemple, l'embedding de 'Roi' moins celui de 'Homme' plus celui de 'Femme' donne un vecteur très proche de celui de 'Reine'. De même, 'Paris' moins 'France' plus 'Italie' donne 'Rome'. Ces propriétés montrent que les embeddings capturent non seulement le sens des mots, mais aussi les relations entre eux.",
    "note": "Les analogies sont une démonstration puissante de la qualité des embeddings de Word2Vec."
  },
  {
    "titre": "Word2Vec avec Gensim en Python",
    "contenu": "<div style='padding: 15px;'> <h2 style='color: #2c3e50; font-size: 1.5rem;'>💻 Word2Vec avec Gensim</h2> <div style='background: #f8f9fa; padding: 15px; border-radius: 10px; margin: 10px 0;'> <h3 style='color: #2c3e50; font-size: 1.1rem;'>Installation et import</h3> <div style='background: #2c3e50; padding: 12px; border-radius: 8px; overflow-x: auto;'> <pre style='color: #ecf0f1; font-size: 0.75rem; margin: 0;'>from gensim.models import Word2Vec\nfrom nltk.tokenize import word_tokenize\n\n# Préparer les données\nsentences = [\n    ['le', 'chat', 'mange', 'une', 'souris'],\n    ['le', 'chien', 'court', 'dans', 'le', 'jardin']\n]\n\n# Entraîner le modèle\nmodel = Word2Vec(sentences, vector_size=100, window=5, min_count=1, workers=4)</pre> </div> </div> <div style='background: #e8f4fd; padding: 15px; border-radius: 10px; margin-top: 10px;'> <h3 style='color: #2c3e50; font-size: 1.1rem;'>Paramètres clés</h3> <ul style='color: #2c3e50;'> <li><strong>vector_size</strong> : Dimension des embeddings (100-300)</li> <li><strong>window</strong> : Taille de la fenêtre de contexte</li> <li><strong>min_count</strong> : Fréquence minimale des mots</li> <li><strong>sg</strong> : 0 pour CBOW, 1 pour Skip-gram</li> <li><strong>workers</strong> : Nombre de threads parallèles</li> </ul> </div> </div>",
    "texteParle": "La bibliothèque Gensim rend l'utilisation de Word2Vec très simple en Python. On commence par importer Word2Vec. Ensuite, on prépare nos données sous forme d'une liste de listes de mots tokenisés. On crée le modèle en spécifiant la dimension des embeddings (vector_size), la taille de la fenêtre de contexte (window), et d'autres paramètres. Le paramètre sg permet de choisir l'architecture : 0 pour CBOW, 1 pour Skip-gram. Avec Gensim, on peut entraîner le modèle en quelques lignes de code, puis utiliser les embeddings pour des tâches comme la recherche de mots similaires, les analogies, ou comme entrée pour d'autres modèles de NLP.",

  {
    "titre": "Visualisation des Embeddings",
    "contenu": "<div style='padding: 15px;'> <h2 style='color: #2c3e50; font-size: 1.5rem;'>📊 Visualisation des Embeddings</h2> <div style='background: #f8f9fa; padding: 15px; border-radius: 10px; margin: 10px 0;'> <h3 style='color: #2c3e50; font-size: 1.1rem;'>Réduction de dimension</h3> <ul style='color: #2c3e50;'> <li>Les embeddings sont en 100-300 dimensions</li> <li>On utilise <strong>t-SNE</strong> ou <strong>PCA</strong> pour les visualiser en 2D</li> <li>Permet de voir les <strong>clusters</strong> de mots</li> </ul> </div> <div style='background: #e8f4fd; padding: 15px; border-radius: 10px; margin-top: 10px;'> <h3 style='color: #2c3e50; font-size: 1.1rem;'>Exemple de code</h3> <div style='background: #2c3e50; padding: 12px; border-radius: 8px; overflow-x: auto;'> <pre style='color: #ecf0f1; font-size: 0.75rem; margin: 0;'>from sklearn.manifold import TSNE\nimport matplotlib.pyplot as plt\n\n# Extraire les embeddings\nwords = ['chat', 'chien', 'souris', 'oiseau', 'poisson']\nvectors = [model.wv[w] for w in words]\n\n# t-SNE\ntsne = TSNE(n_components=2, random_state=42)\nvectors_2d = tsne.fit_transform(vectors)\n\n# Visualisation\nplt.scatter(vectors_2d[:,0], vectors_2d[:,1])\nfor i, word in enumerate(words):\n    plt.annotate(word, (vectors_2d[i,0], vectors_2d[i,1]))</pre> </div> </div> </div>",
    "texteParle": "Visualiser les embeddings permet de comprendre intuitivement comment les mots sont organisés dans l'espace vectoriel. Comme les embeddings ont typiquement 100 à 300 dimensions, on utilise des techniques de réduction de dimension comme t-SNE ou PCA pour les projeter en 2D ou 3D. La visualisation révèle souvent des clusters de mots liés sémantiquement : les mots d'animaux se regroupent, les mots de couleurs se regroupent, etc. En Python, on peut facilement utiliser scikit-learn pour t-SNE et matplotlib pour le tracé. Ces visualisations sont utiles pour vérifier la qualité des embeddings et pour communiquer les résultats.",

  {
    "titre": "Limites de Word2Vec",
    "contenu": "<div style='padding: 15px;'> <h2 style='color: #2c3e50; font-size: 1.5rem;'>⚠️ Limites de Word2Vec</h2> <div style='background: #f8f9fa; padding: 15px; border-radius: 10px; margin: 10px 0;'> <h3 style='color: #2c3e50; font-size: 1.1rem;'>Les principales limites</h3> <ul style='color: #2c3e50;'> <li><strong>Embeddings statiques</strong> : Un même mot a toujours le même vecteur, indépendamment du contexte</li> <li><strong>Polysémie</strong> : Ne peut pas distinguer les différents sens d'un mot (ex: \"banc\" (école) vs \"banc\" (poisson))</li> <li><strong>Mots hors vocabulaire</strong> : Les mots non vus à l'entraînement n'ont pas d'embedding</li> <li><strong>Biais</strong> : Les embeddings peuvent capturer des biais sociaux présents dans les données</li> <li><strong>Données massives</strong> : Nécessite de grandes quantités de texte pour de bons résultats</li> </ul> </div> <div style='background: #e8f4fd; padding: 15px; border-radius: 10px; margin-top: 10px;'> <h3 style='color: #2c3e50; font-size: 1.1rem;'>Solutions et alternatives</h3> <ul style='color: #2c3e50;'> <li><strong>Embeddings contextuels</strong> : ELMo, BERT, GPT (représentations dépendantes du contexte)</li> <li><strong>FastText</strong> : Gère les mots hors vocabulaire avec des sous-mots (n-grammes de caractères)</li> <li><strong>Débiaisage</strong> : Techniques pour réduire les biais dans les embeddings</li> </ul> </div> <div style='background: #fff3cd; padding: 15px; border-radius: 10px; margin-top: 10px; border: 1px solid #ffc107;'> <p style='color: #856404; font-style: italic; margin: 0;'>💡 <strong>À noter :</strong> Les modèles plus récents (BERT, GPT) ont largement dépassé Word2Vec, mais celui-ci reste important pour son efficacité et sa simplicité</p> </div> </div>",
    "texteParle": "Malgré leur succès, les embeddings de Word2Vec ont des limites importantes. La principale est qu'ils sont statiques : un mot a toujours le même embedding, quel que soit son contexte. Cela pose problème pour la polysémie, comme le mot 'banc' qui a des sens différents selon le contexte. De plus, les mots qui n'apparaissent pas dans le corpus d'entraînement n'ont pas d'embedding. Enfin, les embeddings peuvent capturer des biais sociaux présents dans les données. Pour pallier ces limites, des approches plus récentes comme les embeddings contextuels (BERT, ELMo) ou FastText (qui utilise des n-grammes de caractères) ont été développées. Word2Vec reste néanmoins une excellente introduction aux embeddings.",
    "note": "Word2Vec a ouvert la voie aux embeddings modernes, mais a été dépassé par des approches contextuelles."

        $loadingProgressBar.css('animation', 'loadingProgress 30s ease-out forwards');
        
        $loadingText.text('Préparation vocale...');
        $loadingSub.text('Synthèse en cours');
        $loadingTimeout.text('⏱️ 30 secondes maximum');
        $loading.fadeIn(300);
        setStatus("⏳ Chargement...", 'loading');
        
        // 🔥 TIMEOUT DE 30 SECONDES
        loadingTimeout = setTimeout(() => {
            if (isLoading && !loadingCancelled) {
                hideLoading();
                setStatus("⚠️ Délai dépassé (30s)", 'error');
                isPlaying = false;
                updatePlayButton();
                $loadingSub.text('La synthèse vocale a pris trop de temps');
                $loadingTimeout.text('❌ Délai dépassé');
            }
        }, 30000);
    }

    function hideLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        isLoading = false;
        loadingCancelled = false;
        $loading.fadeOut(300);
        // Ne pas changer le statut si on est en train de parler
        if (!isSpeaking && !isPlaying) {
            setStatus("⏸ Lecture arrêtée", 'paused');
        }
    }

    function cancelLoading() {
        loadingCancelled = true;
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        hideLoading();
        stopSpeaking();
        setStatus("⏸ Annulé", 'paused');
        isPlaying = false;
        updatePlayButton();
        $loadingText.text('Annulé par l\'utilisateur');
        $loadingSub.text('Vous pouvez réessayer');
        $loadingTimeout.text('✕ Annulation');
    }

    // Arrêter la parole proprement
    function stopSpeaking() {
        try {
            if (synth && (synth.speaking || synth.pending)) {
                synth.cancel();
            }
        } catch(e) {
            console.warn('Erreur stopSpeaking:', e);
        }
        if (currentUtterance) {
            try {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance.onstart = null;
            } catch(e) {}
            currentUtterance = null;
        }
        isSpeaking = false;
        isPlaying = false;
        updatePlayButton();
    }

    // Mettre en pause la parole
    function pauseSpeaking() {
        try {
            if (synth && synth.speaking) {
                synth.pause();
                isPaused = true;
                isPlaying = false;
                setStatus("⏸ Lecture en pause", 'paused');
                updatePlayButton();
            }
        } catch(e) {
            console.warn('Erreur pauseSpeaking:', e);
            stopSpeaking();
        }
    }

    // Reprendre la parole
    function resumeSpeaking() {
        try {
            if (synth && synth.paused) {
                synth.resume();
                isPaused = false;
                isPlaying = true;
                setStatus("🔊 Lecture en cours", 'speaking');
                updatePlayButton();
            } else if (!isSpeaking && !synth.speaking && !synth.pending) {
                speakSlide(currentIndex);
            }
        } catch(e) {
            console.warn('Erreur resumeSpeaking:', e);
            speakSlide(currentIndex);
        }
    }

    function renderSlide(index) {
        const slide = slides[index];
        $title.text(slide.titre);

        let html = '';
        html += `<div class="content-card">${slide.contenu}</div>`;
        if (slide.note) {
            html += `<div class="note-box">${slide.note}</div>`;
        }
        $body.html(html);
        $counter.text(`${index+1} / ${total}`);

        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
        }
    }

    // ================================================================
    // LECTURE VOCALE
    // ================================================================
    function speakSlide(index) {
        return new Promise((resolve) => {
            const slide = slides[index];
            const text = slide.texteParle;
            
            if (!text || text.trim() === '' || !speechSupported) {
                resolve();
                return;
            }

            if (!window.speechSynthesis) {
                setStatus("❌ Synthèse vocale non supportée", 'error');
                speechSupported = false;
                resolve();
                return;
            }

            // Arrêter toute lecture en cours
            stopSpeaking();
            
            // Réinitialiser l'état de pause
            isPaused = false;
            
            showLoading();
            setStatus("Initialisation...", 'loading');

            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.92;
                utterance.pitch = 1.05;
                utterance.volume = 1;

                let isFinished = false;
                let errorHandled = false;

                utterance.onstart = function() {
                    if (loadingCancelled) {
                        stopSpeaking();
                        resolve();
                        return;
                    }
                    hideLoading();
                    isSpeaking = true;
                    isPlaying = true;
                    isPaused = false;
                    setStatus("🔊 Lecture en cours", 'speaking');
                    updatePlayButton();
                };

                utterance.onend = function() {
                    if (isFinished) return;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    setStatus("✅ Terminé", 'idle');
                    hideLoading();
                    updatePlayButton();
                    resolve();
                };

                utterance.onerror = function(e) {
                    if (isFinished || errorHandled) return;
                    errorHandled = true;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    hideLoading();
                    updatePlayButton();
                    
                    if (e.error === 'not-allowed') {
                        setStatus("⚠️ Permission refusée", 'error');
                    } else if (e.error === 'synthesis-unavailable') {
                        setStatus("⚠️ Synthèse indisponible", 'error');
                    } else if (e.error === 'canceled') {
                        setStatus("⏸ Annulé", 'paused');
                    } else {
                        setStatus("❌ Erreur audio: " + (e.error || 'inconnue'), 'error');
                    }
                    
                    resolve();
                };

                // Gestion du chargement des voix
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = function() {
                        if (!loadingCancelled) {
                            try {
                                synth.speak(utterance);
                            } catch(err) {
                                // Silencieux
                            }
                        }
                        synth.onvoiceschanged = null;
                    };
                }

                currentUtterance = utterance;
                
                if (!loadingCancelled) {
                    try {
                        synth.speak(utterance);
                    } catch(err) {
                        setTimeout(() => {
                            if (!loadingCancelled) {
                                try {
                                    synth.speak(utterance);
                                } catch(e) {
                                    setStatus("❌ Erreur de lecture", 'error');
                                    isPlaying = false;
                                    updatePlayButton();
                                    hideLoading();
                                    resolve();
                                }
                            } else {
                                resolve();
                            }
                        }, 100);
                    }
                } else {
                    resolve();
                }

            } catch(err) {
                hideLoading();
                setStatus("❌ Erreur générale", 'error');
                isPlaying = false;
                updatePlayButton();
                console.error('Erreur speakSlide:', err);
                resolve();
            }
        });
    }

    // ================================================================
    // NAVIGATION
    // ================================================================
    async function goToSlide(index) {
        if (isTransitioning) return;
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        
        // Si on est en train de lire, on met en pause avant de naviguer
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        // Arrêter complètement la lecture
        stopSpeaking();
        
        await new Promise(r => setTimeout(r, 50));
        
        if (index === currentIndex) {
            setStatus("📄 Slide actuel", 'idle');
            return;
        }

        isTransitioning = true;
        currentIndex = index;
        renderSlide(index);
        
        // Réinitialiser l'état de lecture
        isPlaying = false;
        updatePlayButton();
        setStatus("⏸ Lecture arrêtée", 'paused');

        await new Promise(r => setTimeout(r, 150));
        isTransitioning = false;
    }

    async function goToNext() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex + 1 < total) {
            await goToSlide(currentIndex + 1);
        } else {
            setStatus("🏁 Dernier slide", 'idle');
        }
    }

    async function goToPrev() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex - 1 >= 0) {
            await goToSlide(currentIndex - 1);
        } else {
            setStatus("🔁 Premier slide", 'idle');
        }
    }

    // ================================================================
    // GESTION PLAY/PAUSE
    // ================================================================
    function togglePlay() {
        if (!userInteracted) {
            userInteracted = true;
        }

        // Si le chargement est en cours, on l'annule
        if (isLoading) {
            cancelLoading();
            return;
        }

        // Si le synthétiseur est en pause, on reprend
        if (synth && synth.paused) {
            resumeSpeaking();
            return;
        }

        // Si la lecture est en cours, on met en pause
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
            return;
        }

        // Sinon, on démarre la lecture du slide courant
        if (!isSpeaking && !isPlaying) {
            stopSpeaking();
            speakSlide(currentIndex);
        }
    }

    // ================================================================
    // INIT
    // ================================================================
    async function init() {
        // Vérifier la compatibilité
        if (!window.speechSynthesis) {
            setStatus("❌ Synthèse vocale non supportée", 'error');
            speechSupported = false;
        }

        // Précharger les voix
        try {
            if (synth.getVoices) {
                synth.getVoices();
                setTimeout(() => {
                    try {
                        synth.getVoices();
                    } catch(e) {}
                }, 200);
            }
        } catch(e) {
            console.warn('Erreur chargement voix:', e);
        }

        // Afficher le premier slide
        renderSlide(0);
        $counter.text(`1 / ${total}`);
        
        // État initial
        setStatus("⏸ Appuie sur Play", 'paused');
        updatePlayButton();
        $autoIndicator.text('⏸ Lecture manuelle');

        // ================================================================
        // ÉVÉNEMENTS
        // ================================================================
        
        // Bouton Play/Pause
        $play.on('click', function() {
            togglePlay();
        });

        // Bouton Annuler le chargement
        $cancelLoading.on('click', function() {
            cancelLoading();
        });

        // Navigation
        $prev.on('click', function() {
            // Si chargement en cours, on annule
            if (isLoading) cancelLoading();
            goToPrev();
        });

        $next.on('click', function() {
            if (isLoading) cancelLoading();
            goToNext();
        });

        // Replay - relire le slide courant
        $replay.on('click', function() {
            if (isLoading) cancelLoading();
            stopSpeaking();
            setTimeout(() => {
                speakSlide(currentIndex);
            }, 100);
        });

        // Support du clavier (espace pour play/pause)
        $(document).on('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });

        // Nettoyage
        $(window).on('beforeunload', function() {
            try {
                if (synth.speaking) synth.cancel();
            } catch(e) {}
            hideLoading();
        });

        // Gérer les cas où la synthèse se termine de manière inattendue
        setInterval(() => {
            if (isPlaying && !synth.speaking && !synth.pending && !isPaused && !isLoading) {
                isPlaying = false;
                updatePlayButton();
                setStatus("⏸ Lecture arrêtée", 'paused');
            }
        }, 1000);
    }

    init();
});



    // ================================================================
    // GESTION DU THÈME JOUR/NUIT
    // ================================================================
    let isDarkMode = false;

    function toggleTheme() {
        isDarkMode = !isDarkMode;
        const body = document.body;
        const appContainer = document.querySelector('.app-container');
        const header = document.querySelector('.slide-header');
        const footer = document.querySelector('.slide-footer');
        const contentCards = document.querySelectorAll('.content-card');
        const noteBoxes = document.querySelectorAll('.note-box');
        const mathBlocks = document.querySelectorAll('.math-block');
        const buttons = document.querySelectorAll('.btn');
        const statusBadge = document.querySelector('.status-badge');
        const slideCounter = document.querySelector('.slide-counter');
        const autoIndicator = document.querySelector('.auto-indicator');
        const themeBtn = document.getElementById('themeToggle');

        if (isDarkMode) {
            // Mode nuit
            body.style.background = '#0b1120';
            body.style.color = '#f1f5f9';
            appContainer.style.background = 'linear-gradient(145deg, #0f172a 0%, #1e293b 100%)';
            header.style.background = 'rgba(15, 23, 42, 0.85)';
            footer.style.background = 'rgba(15, 23, 42, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.05)';
                card.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.08)';
                note.style.color = '#cbd5e1';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.25)';
                block.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#e2e8f0';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.12)';
                statusBadge.style.color = '#93bbfc';
            }
            if (slideCounter) {
                slideCounter.style.color = '#94a3b8';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#64748b';
            }
            if (themeBtn) {
                themeBtn.textContent = '☀️';
                themeBtn.title = 'Passer en mode jour';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#e2e8f0';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#e2e8f0';
                }
            });
        } else {
            // Mode jour (par défaut)
            body.style.background = '#f0f4f8';
            body.style.color = '#1a202c';
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
            header.style.background = 'rgba(255, 255, 255, 0.85)';
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.8)';
                card.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.12)';
                note.style.color = '#2c3e50';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.05)';
                block.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#2d3748';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
                statusBadge.style.color = '#2b6cb0';
            }
            if (slideCounter) {
                slideCounter.style.color = '#4a5568';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#718096';
            }
            if (themeBtn) {
                themeBtn.textContent = '🌓';
                themeBtn.title = 'Passer en mode nuit';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#2c3e50';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#2d3748';
                }
            });
        }
    }

    // Initialiser en mode jour
    document.addEventListener('DOMContentLoaded', function() {
        // Appliquer le mode jour par défaut
        const body = document.body;
        body.style.background = '#f0f4f8';
        body.style.color = '#1a202c';
        
        const appContainer = document.querySelector('.app-container');
        if (appContainer) {
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
        }
        
        const header = document.querySelector('.slide-header');
        if (header) {
            header.style.background = 'rgba(255, 255, 255, 0.85)';
        }
        
        const footer = document.querySelector('.slide-footer');
        if (footer) {
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
        }
        
        document.querySelectorAll('.content-card').forEach(card => {
            card.style.background = 'rgba(255,255,255,0.8)';
            card.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.note-box').forEach(note => {
            note.style.background = 'rgba(96, 165, 250, 0.12)';
            note.style.color = '#2c3e50';
        });
        
        document.querySelectorAll('.math-block').forEach(block => {
            block.style.background = 'rgba(0,0,0,0.05)';
            block.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.btn').forEach(btn => {
            btn.style.color = '#2d3748';
        });
        
        const statusBadge = document.querySelector('.status-badge');
        if (statusBadge) {
            statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
            statusBadge.style.color = '#2b6cb0';
        }
        
        const slideCounter = document.querySelector('.slide-counter');
        if (slideCounter) {
            slideCounter.style.color = '#4a5568';
        }
        
        const autoIndicator = document.querySelector('.auto-indicator');
        if (autoIndicator) {
            autoIndicator.style.color = '#718096';
        }
        
        document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
            if (!el.closest('.note-box')) {
                el.style.color = '#2c3e50';
            }
        });
        
        document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
            if (!el.closest('.note-box') && !el.closest('.math-block')) {
                el.style.color = '#2d3748';
            }
        });
        
        const themeBtn = document.getElementById('themeToggle');
        if (themeBtn) {
            themeBtn.textContent = '🌓';
            themeBtn.title = 'Passer en mode nuit';
        }
    });
</script>
