<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Présentation mobile</title>

    <!-- MathJax -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' },
            options: { skipHtmlTypes: 'script' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous">
</script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #ffffff;
        overflow: hidden;
        touch-action: manipulation;
    }

    .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        max-width: 500px;
        margin: 0 auto;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    .slide-header {
        flex-shrink: 0;
        padding: 18px 16px 10px 16px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        z-index: 10;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .slide-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.3;
        padding: 0 4px;
        word-break: break-word;
    }

    .slide-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 18px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
    }

    .slide-body::-webkit-scrollbar {
        width: 4px;
    }
    .slide-body::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
    }
    .slide-body::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
    }

    .content-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 20px;
        padding: 18px 16px;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        flex-shrink: 0;
    }

    .content-card ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .content-card li {
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1rem;
        line-height: 1.5;
    }

    .content-card li:last-child {
        border-bottom: none;
    }

    .bullet-icon {
        font-size: 1.5rem;
        flex-shrink: 0;
        width: 32px;
        text-align: center;
    }

    .math-block {
        background: rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        overflow-x: auto;
        flex-shrink: 0;
        margin: 4px 0;
    }

    .math-block .math {
        font-size: 1.2rem;
        color: #e2e8f0;
    }

    .note-box {
        background: rgba(96, 165, 250, 0.08);
        border-left: 4px solid #60a5fa;
        padding: 12px 16px;
        border-radius: 12px;
        font-style: italic;
        font-size: 0.9rem;
        color: #cbd5e1;
        flex-shrink: 0;
    }

    .loading-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
        border-radius: 0;
        flex-direction: column;
    }

    .loading-card {
        background: #1e293b;
        padding: 32px 28px;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid #334155;
        border-top: 3px solid #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 16px auto;
    }

    .loading-text {
        font-weight: 600;
        font-size: 1.1rem;
        color: #f1f5f9;
        margin-bottom: 4px;
    }
    .loading-sub {
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 16px;
    }
    .loading-progress {
        height: 3px;
        background: #334155;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
    }
    .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #60a5fa, #a78bfa);
        animation: loadingProgress 30s ease-out forwards;
    }

    .loading-timeout {
        font-size: 0.75rem;
        color: #64748b;
        margin-bottom: 12px;
    }

    .btn-cancel-loading {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 40px;
        padding: 8px 20px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #f87171;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
    }

    .btn-cancel-loading:active {
        transform: scale(0.94);
        background: rgba(239, 68, 68, 0.25);
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    @keyframes loadingProgress {
        0% { width: 0%; }
        100% { width: 100%; }
    }

    .slide-footer {
        flex-shrink: 0;
        padding: 12px 14px 16px 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
    }

    .footer-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
    }

    .slide-counter {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255,255,255,0.05);
        padding: 4px 14px;
        border-radius: 30px;
        letter-spacing: 0.5px;
        border: 1px solid rgba(255,255,255,0.04);
    }

    .status-badge {
        font-size: 0.7rem;
        padding: 4px 12px;
        border-radius: 30px;
        background: rgba(96, 165, 250, 0.12);
        color: #93bbfc;
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(96, 165, 250, 0.1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 55%;
    }

    .status-badge .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #60a5fa;
        border-radius: 50%;
        animation: pulse-dot 1.2s infinite;
        flex-shrink: 0;
    }

    .status-badge.idle .dot {
        animation: none;
        background: #64748b;
    }
    .status-badge.speaking .dot {
        background: #34d399;
        animation: pulse-dot 0.8s infinite;
    }
    .status-badge.error .dot {
        background: #f87171;
        animation: none;
    }
    .status-badge.paused .dot {
        animation: none;
        background: #fbbf24;
    }
    .status-badge.waiting .dot {
        animation: pulse-dot 1.5s infinite;
        background: #fbbf24;
    }
    .status-badge.loading .dot {
        animation: pulse-dot 0.5s infinite;
        background: #60a5fa;
    }

    @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.7); }
    }

    .footer-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .btn {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 40px;
        padding: 8px 14px;
        font-size: 0.85rem;
        font-weight: 600;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 40px;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        flex: 0 1 auto;
    }

    .btn:active {
        transform: scale(0.94);
        background: rgba(255,255,255,0.1);
    }

    .btn-secondary {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.06);
    }

    .btn-icon {
        font-size: 1.1rem;
        line-height: 1;
    }

    .btn-play {
        background: rgba(52, 211, 153, 0.15);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
        min-width: 80px;
        justify-content: center;
    }
    .btn-play:active {
        background: rgba(52, 211, 153, 0.25);
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15);
        border-color: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
    }

    .auto-indicator {
        font-size: 0.65rem;
        color: #64748b;
        text-align: center;
        letter-spacing: 0.3px;
        padding: 2px 0;
    }

    @media (max-width: 400px) {
        .slide-header h1 {
            font-size: 1.2rem;
        }
        .content-card li {
            font-size: 0.9rem;
            padding: 8px 0;
        }
        .btn {
            font-size: 0.75rem;
            padding: 6px 10px;
            min-height: 34px;
        }
        .btn-play {
            min-width: 60px;
        }
        .footer-buttons {
            gap: 5px;
        }
        .slide-body {
            padding: 12px 12px 16px 12px;
        }
        .loading-card {
            padding: 20px 16px;
        }
        .math-block .math {
            font-size: 1rem;
        }
    }

    @media (min-width: 600px) {
        .app-container {
            max-width: 480px;
            border-radius: 32px;
            margin-top: 20px;
            margin-bottom: 20px;
            height: 90vh;
            height: 90dvh;
        }
        .loading-overlay {
            border-radius: 32px;
        }
    }

    /* Mode jour (par défaut) */
    html, body {
        background: #f0f4f8 !important;
        color: #1a202c !important;
    }
    .app-container {
        background: linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%) !important;
    }
    .slide-header {
        background: rgba(255, 255, 255, 0.85) !important;
        border-bottom: 1px solid rgba(0,0,0,0.08) !important;
    }
    .slide-header h1 {
        background: linear-gradient(135deg, #2b6cb0, #6b46c1) !important;
        -webkit-background-clip: text !important;
        -webkit-text-fill-color: transparent !important;
        background-clip: text !important;
    }
    .slide-footer {
        background: rgba(255, 255, 255, 0.9) !important;
        border-top: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card {
        background: rgba(255,255,255,0.8) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .content-card li {
        border-bottom: 1px solid rgba(0,0,0,0.05) !important;
    }
    .note-box {
        background: rgba(96, 165, 250, 0.12) !important;
        border-left: 4px solid #4299e1 !important;
        color: #2c3e50 !important;
    }
    .math-block {
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .math-block .math {
        color: #2d3748 !important;
    }
    .slide-counter {
        color: #4a5568 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .status-badge {
        background: rgba(96, 165, 250, 0.15) !important;
        color: #2b6cb0 !important;
        border: 1px solid rgba(96, 165, 250, 0.15) !important;
    }
    .btn {
        color: #2d3748 !important;
        background: rgba(0,0,0,0.05) !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .btn-secondary {
        background: rgba(0,0,0,0.04) !important;
        border-color: rgba(0,0,0,0.08) !important;
    }
    .btn-play {
        background: rgba(52, 211, 153, 0.15) !important;
        border-color: rgba(52, 211, 153, 0.2) !important;
        color: #38a169 !important;
    }
    .btn-play.playing {
        background: rgba(251, 191, 36, 0.15) !important;
        border-color: rgba(251, 191, 36, 0.2) !important;
        color: #d69e2e !important;
    }
    .auto-indicator {
        color: #718096 !important;
    }
    .loading-card {
        background: #ffffff !important;
        border: 1px solid rgba(0,0,0,0.08) !important;
    }
    .loading-text {
        color: #1a202c !important;
    }
    .loading-sub {
        color: #4a5568 !important;
    }
</style>
</head>
<body>

<div class="app-container">

    <header class="slide-header">
        <h1 id="slideTitle">Chargement...</h1>
    </header>

    <main class="slide-body" id="slideBody"></main>

    <!-- LOADING OVERLAY AVEC BOUTON ANNULER -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Préparation vocale...</div>
            <div class="loading-sub" id="loadingSub">Synthèse en cours</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="loadingProgressBar"></div>
            </div>
            <div class="loading-timeout" id="loadingTimeout">⏱️ 30 secondes maximum</div>
            <button class="btn-cancel-loading" id="cancelLoadingBtn">
                <span>✕</span> Annuler
            </button>
        </div>
    </div>

    <footer class="slide-footer">
        <div class="footer-top">
            <span class="slide-counter" id="slideCounter">1 / 3</span>
            <span class="status-badge idle" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">Prêt</span>
            </span>
        </div>

        <div class="footer-buttons">
            <button class="btn btn-secondary" id="prevBtn">
                <span class="btn-icon">◀</span> <span class="btn-label">Préc.</span>
            </button>
            <button class="btn btn-secondary" id="nextBtn">
                <span class="btn-label">Suiv.</span> <span class="btn-icon">▶</span>
            </button>
            <button class="btn btn-secondary" id="replayBtn">
                <span class="btn-icon">🔁</span> <span class="btn-label">Relire</span>
            </button>
            <button class="btn btn-play" id="playBtn">
                <span class="btn-icon">▶</span> <span class="btn-label">Play</span>
            </button>
        </div>

        <div class="auto-indicator" id="autoIndicator">⏸ Lecture manuelle</div>
    </footer>
</div>

<script>
$(function() {

    // ================================================================
    // SLIDES
    // ================================================================
    const slides = [
  {
    "titre": "Rapport de Projet",
    "contenu": "<div style='display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; text-align: center; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: #f8fafc; padding: 20px; border-radius: 16px;'> <h1 style='font-size: 2.2rem; font-weight: 700; margin-bottom: 10px; color: #38bdf8;'>📝 Rapport de Projet</h1> <h2 style='font-size: 1.5rem; font-weight: 300; margin-bottom: 20px; color: #cbd5e1;'>Projet de Fin d'Études - L3 Data Science</h2> <div style='background: #334155; padding: 15px 25px; border-radius: 40px; font-size: 1.1rem; color: #facc15; border: 1px solid #475569;'> Chapitre 6 - Communication et Restitution </div> <p style='margin-top: 30px; font-size: 1.1rem; color: #94a3b8; max-width: 400px;'>\"Un bon rapport est celui qui raconte une histoire claire et convaincante à partir des données.\"</p> </div>",
    "texteParle": "Bonjour à toutes et à tous. Aujourd'hui, nous abordons une étape essentielle de votre projet de fin d'études : la rédaction du rapport de projet. C'est le document qui synthétise tout votre travail et qui sera lu et évalué par votre jury. Un bon rapport est celui qui raconte une histoire claire et convaincante à partir de vos données et de vos analyses. Nous allons voir ensemble comment structurer et rédiger un rapport de qualité.",
    "note": "Introduction générale de la leçon sur le rapport de projet."
  },
  {
    "titre": "Objectifs de la Leçon",
    "contenu": "<div style='background: #1e293b; border-radius: 16px; padding: 18px; color: #e2e8f0; border-left: 6px solid #3b82f6;'> <p style='font-weight: 600; color: #60a5fa; margin-bottom: 12px;'>🎯 À la fin de ce cours, vous saurez :</p> <ul style='list-style: none; padding: 0; margin: 0;'> <li style='background: #2d3748; margin-bottom: 8px; padding: 12px; border-radius: 8px; display: flex; align-items: flex-start; gap: 10px;'> <span style='background: #3b82f6; color: white; border-radius: 50%; min-width: 24px; height: 24px; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 0.8rem;'>1</span> <div><strong>Rédiger un rapport structuré</strong><br><span style='font-size: 0.9rem; color: #94a3b8;'>Organiser les sections de manière logique</span></div> </li> <li style='background: #2d3748; margin-bottom: 8px; padding: 12px; border-radius: 8px; display: flex; align-items: flex-start; gap: 10px;'> <span style='background: #f59e0b; color: black; border-radius: 50%; min-width: 24px; height: 24px; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 0.8rem;'>2</span> <div><strong>Inclure les sections clés</strong><br><span style='font-size: 0.9rem; color: #94a3b8;'>Introduction, méthodologie, résultats, discussion, conclusion</span></div> </li> <li style='background: #2d3748; margin-bottom: 0; padding: 12px; border-radius: 8px; display: flex; align-items: flex-start; gap: 10px;'> <span style='background: #10b981; color: white; border-radius: 50%; min-width: 24px; height: 24px; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 0.8rem;'>3</span> <div><strong>Maîtriser les notions clés</strong><br><span style='font-size: 0.9rem; color: #94a3b8;'>Rapport, structure, style académique</span></div> </li> </ul> </div>",
    "texteParle": "Les objectifs de cette leçon sont triples. D'abord, apprendre à rédiger un rapport de projet structuré et professionnel. Ensuite, connaître les sections clés à inclure : introduction, méthodologie, résultats, discussion et conclusion. Enfin, maîtriser les notions de rapport, de structure et de style académique. Un bon rapport est un rapport qui se lit facilement et qui convainc le lecteur de la qualité de votre travail.",
    "note": "Rappel des objectifs pédagogiques de la leçon."
  },
  {
    "titre": "Structure du Rapport",
    "contenu": "<div style='background: #1e293b; border-radius: 16px; padding: 18px; color: #e2e8f0;'> <p style='margin-top: 0; font-weight: 500;'>La structure standard d'un rapport de projet Data Science :</p> <div style='display: flex; flex-direction: column; gap: 8px;'> <div style='background: #2d3748; padding: 10px 15px; border-radius: 8px; display: flex; align-items: center; gap: 10px; border-left: 6px solid #3b82f6;'> <span style='font-weight: bold; min-width: 30px;'>📄</span> <div><span style='font-weight: 600;'>Page de garde</span> et <span style='font-weight: 600;'>Sommaire</span></div> </div> <div style='background: #2d3748; padding: 10px 15px; border-radius: 8px; display: flex; align-items: center; gap: 10px; border-left: 6px solid #f59e0b;'> <span style='font-weight: bold; min-width: 30px;'>🔍</span> <div><span style='font-weight: 600;'>Introduction</span> - Contexte, problématique, objectifs</div> </div> <div style='background: #2d3748; padding: 10px 15px; border-radius: 8px; display: flex; align-items: center; gap: 10px; border-left: 6px solid #10b981;'> <span style='font-weight: bold; min-width: 30px;'>📊</span> <div><span style='font-weight: 600;'>Méthodologie</span> - Données, prétraitement, modèles</div> </div> <div style='background: #2d3748; padding: 10px 15px; border-radius: 8px; display: flex; align-items: center; gap: 10px; border-left: 6px solid #ec4899;'> <span style='font-weight: bold; min-width: 30px;'>📈</span> <div><span style='font-weight: 600;'>Résultats</span> - Présentation des résultats obtenus</div> </div> <div style='background: #2d3748; padding: 10px 15px; border-radius: 8px; display: flex; align-items: center; gap: 10px; border-left: 6px solid #8b5cf6;'> <span style='font-weight: bold; min-width: 30px;'>💬</span> <div><span style='font-weight: 600;'>Discussion</span> - Interprétation et analyse des résultats</div> </div> <div style='background: #2d3748; padding: 10px 15px; border-radius: 8px; display: flex; align-items: center; gap: 10px; border-left: 6px solid #facc15;'> <span style='font-weight: bold; min-width: 30px;'>🎯</span> <div><span style='font-weight: 600;'>Conclusion</span> - Synthèse et perspectives</div> </div> </div> </div>",
    "texteParle": "Un rapport de projet Data Science suit généralement une structure standard. On commence par la page de garde et le sommaire. Puis l'introduction qui présente le contexte, la problématique et les objectifs. Vient ensuite la méthodologie où vous décrivez les données, le prétraitement et les modèles utilisés. Les résultats présentent ce que vous avez obtenu. La discussion interprète ces résultats. Enfin, la conclusion synthétise le travail et ouvre des perspectives. Cette structure permet au lecteur de suivre facilement votre raisonnement.",
    "note": "Présentation de la structure type d'un rapport de projet."
  },
  {
    "titre": "L'Introduction",
    "contenu": "<div style='background: #1e293b; border-radius: 16px; padding: 18px; color: #e2e8f0;'> <p style='margin-top: 0; font-weight: 500;'>L'introduction doit contenir :</p> <div style='display: flex; flex-direction: column; gap: 10px;'> <div style='background: #2d3748; padding: 12px; border-radius: 12px; border-left: 6px solid #3b82f6;'> <span style='font-weight: 600; color: #60a5fa;'>1. Contexte</span><br> <span style='font-size: 0.95rem; color: #94a3b8;'>Présenter le domaine, l'importance du sujet, et pourquoi il est pertinent.</span> </div> <div style='background: #2d3748; padding: 12px; border-radius: 12px; border-left: 6px solid #f59e0b;'> <span style='font-weight: 600; color: #fbbf24;'>2. Problématique</span><br> <span style='font-size: 0.95rem; color: #94a3b8;'>Décrire le problème métier et la question de recherche.</span> </div> <div style='background: #2d3748; padding: 12px; border-radius: 12px; border-left: 6px solid #10b981;'> <span style='font-weight: 600; color: #34d399;'>3. Objectifs</span><br> <span style='font-size: 0.95rem; color: #94a3b8;'>Présenter les objectifs SMART du projet.</span> </div> <div style='background: #2d3748; padding: 12px; border-radius: 12px; border-left: 6px solid #ec4899;'> <span style='font-weight: 600; color: #f472b6;'>4. Contributions</span><br> <span style='font-size: 0.95rem; color: #94a3b8;'>Expliquer l'apport original du projet (novation, amélioration).</span> </div> <div style='background: #334155; padding: 10px; border-radius: 12px; text-align: center; margin-top: 5px; border: 1px solid #475569;'> <span style='font-size: 0.9rem;'>L'introduction doit captiver le lecteur et donner envie de lire la suite !</span> </div> </div> </div>",
    "texteParle": "L'introduction est la première section que lira votre jury. Elle doit être captivante et donner envie de lire la suite. Elle doit présenter le contexte de votre projet, expliquer pourquoi le sujet est important. Ensuite, vous devez formuler clairement la problématique et la question de recherche. Puis, annoncer les objectifs que vous vous êtes fixés. Enfin, mentionner les contributions originales de votre travail. Une bonne introduction est essentielle pour donner une première impression positive.",
    "note": "Les éléments essentiels de l'introduction d'un rapport."
  },
  {
    "titre": "La Méthodologie",
    "contenu": "<div style='background: #1e293b; border-radius: 16px; padding: 18px; color: #e2e8f0;'> <p style='margin-top: 0; font-weight: 500;'>La méthodologie décrit :</p> <div style='display: flex; flex-direction: column; gap: 10px;'> <div style='background: #2d3748; padding: 12px; border-radius: 12px; border-left: 6px solid #3b82f6;'> <span style='font-weight: 600; color: #60a5fa;'>📊 Données</span><br> <span style='font-size: 0.95rem; color: #94a3b8;'>Sources, volume, caractéristiques, qualité des données.</span> </div> <div style='background: #2d3748; padding: 12px; border-radius: 12px; border-left: 6px solid #f59e0b;'> <span style='font-weight: 600; color: #fbbf24;'>🧹 Prétraitement</span><br> <span style='font-size: 0.95rem; color: #94a3b8;'>Nettoyage, transformation, feature engineering réalisés.</span> </div> <div style='background: #2d3748; padding: 12px; border-radius: 12px; border-left: 6px solid #10b981;'> <span style='font-weight: 600; color: #34d399;'>🤖 Modèles</span><br> <span style='font-size: 0.95rem; color: #94a3b8;'>Modèles utilisés, choix justifiés, hyperparamètres.</span> </div> <div style='background: #2d3748; padding: 12px; border-radius: 12px; border-left: 6px solid #ec4899;'> <span style='font-weight: 600; color: #f472b6;'>📈 Évaluation</span><br> <span style='font-size: 0.95rem; color: #94a3b8;'>Métriques, protocole de validation (train/test, cross-validation).</span> </div> <div style='background: #334155; padding: 10px; border-radius: 12px; text-align: center; margin-top: 5px; border: 1px solid #475569;'> <span style='font-size: 0.9rem;'>La méthodologie doit être détaillée pour permettre la reproductibilité du projet.</span> </div> </div> </div>",
    "texteParle": "La section méthodologie est cruciale car elle décrit comment vous avez mené votre projet. Elle doit détailler les données utilisées : leurs sources, leur volume, leurs caractéristiques. Ensuite, vous décrivez le prétraitement effectué : nettoyage, transformation, création de nouvelles variables. Puis, vous présentez les modèles choisis en justifiant vos choix. Enfin, vous expliquez comment vous avez évalué vos modèles avec des métriques adaptées. L'objectif est que quelqu'un puisse reproduire votre travail à partir de cette description.",
    "note": "Les composantes de la section méthodologie."
  },
  {
    "titre": "Les Résultats",
    "contenu": "<div style='background: #1e293b; border-radius: 16px; padding: 18px; color: #e2e8f0;'> <p style='margin-top: 0; font-weight: 500;'>Présenter les résultats efficacement :</p> <div style='display: flex; flex-direction: column; gap: 10px;'> <div style='background: #2d3748; padding: 12px; border-radius: 12px; border-left: 6px solid #3b82f6;'> <span style='font-weight: 600; color: #60a5fa;'>📊 Tableaux</span><br> <span style='font-size: 0.95rem; color: #94a3b8;'>Présenter les métriques de performance de manière structurée.</span> </div> <div style='background: #2d3748; padding: 12px; border-radius: 12px; border-left: 6px solid #10b981;'> <span style='font-weight: 600; color: #34d399;'>📈 Graphiques</span><br> <span style='font-size: 0.95rem; color: #94a3b8;'>Visualiser les résultats (courbes, matrices de confusion, etc.).</span> </div> <div style='background: #2d3748; padding: 12px; border-radius: 12px; border-left: 6px solid #f59e0b;'> <span style='font-weight: 600; color: #fbbf24;'>📝 Commentaires</span><br> <span style='font-size: 0.95rem; color: #94a3b8;'>Expliquer ce que montrent les tableaux et graphiques.</span> </div> <div style='background: #2d3748; padding: 12px; border-radius: 12px; border-left: 6px solid #ec4899;'> <span style='font-weight: 600; color: #f472b6;'>⚖️ Comparaisons</span><br> <span style='font-size: 0.95rem; color: #94a3b8;'>Comparer les performances des différents modèles testés.</span> </div> <div style='background: #334155; padding: 10px; border-radius: 12px; text-align: center; margin-top: 5px; border: 1px solid #475569;'> <span style='font-size: 0.9rem;'>Les résultats doivent être présentés de manière claire, sans interprétation excessive.</span> </div> </div> </div>",
    "texteParle": "La section résultats présente ce que vous avez obtenu. Il ne s'agit pas encore de discuter ou d'interpréter, mais de montrer les faits. Utilisez des tableaux pour présenter les métriques de manière structurée. Les graphiques sont utiles pour visualiser les tendances ou les performances. Ajoutez des commentaires pour expliquer ce que montrent ces tableaux et graphiques. Et surtout, comparez les performances des différents modèles. Les résultats doivent être présentés de manière objective et claire.",

  {
    "titre": "La Discussion",
    "contenu": "<div style='background: #1e293b; border-radius: 16px; padding: 18px; color: #e2e8f0;'> <p style='margin-top: 0; font-weight: 500;'>La discussion analyse et interprète :</p> <div style='display: flex; flex-direction: column; gap: 10px;'> <div style='background: #2d3748; padding: 12px; border-radius: 12px; border-left: 6px solid #3b82f6;'> <span style='font-weight: 600; color: #60a5fa;'>🔍 Interprétation</span><br> <span style='font-size: 0.95rem; color: #94a3b8;'>Expliquer la signification des résultats (ex: importance des variables).</span> </div> <div style='background: #2d3748; padding: 12px; border-radius: 12px; border-left: 6px solid #f59e0b;'> <span style='font-weight: 600; color: #fbbf24;'>⚠️ Limitations</span><br> <span style='font-size: 0.95rem; color: #94a3b8;'>Identifier les faiblesses du modèle ou de l'approche.</span> </div> <div style='background: #2d3748; padding: 12px; border-radius: 12px; border-left: 6px solid #10b981;'> <span style='font-weight: 600; color: #34d399;'>💡 Implications</span><br> <span style='font-size: 0.95rem; color: #94a3b8;'>Quelles sont les conséquences pratiques des résultats ?</span> </div> <div style='background: #2d3748; padding: 12px; border-radius: 12px; border-left: 6px solid #ec4899;'> <span style='font-weight: 600; color: #f472b6;'>🔬 Comparaison</span><br> <span style='font-size: 0.95rem; color: #94a3b8;'>Mettre les résultats en perspective avec la littérature existante.</span> </div> <div style='background: #334155; padding: 10px; border-radius: 12px; text-align: center; margin-top: 5px; border: 1px solid #475569;'> <span style='font-size: 0.9rem;'>La discussion est la section la plus critique du rapport !</span> </div> </div> </div>",
    "texteParle": "La discussion est souvent la section la plus critique du rapport. C'est ici que vous analysez et interprétez vos résultats. Vous expliquez ce qu'ils signifient, par exemple l'importance des différentes variables. Vous identifiez les limitations de votre modèle ou de votre approche. Vous discutez des implications pratiques de vos résultats pour le métier. Enfin, vous mettez vos résultats en perspective avec ceux de la littérature. Une bonne discussion montre que vous maîtrisez votre sujet et que vous avez une réflexion critique.",
    "note": "Les éléments clés de la section discussion d'un rapport."
  },
  {
    "titre": "La Conclusion",
    "contenu": "<div style='background: #1e293b; border-radius: 16px; padding: 18px; color: #e2e8f0;'> <p style='margin-top: 0; font-weight: 500;'>La conclusion doit contenir :</p> <div style='display: flex; flex-direction: column; gap: 10px;'> <div style='background: #2d3748; padding: 12px; border-radius: 12px; border-left: 6px solid #3b82f6;'> <span style='font-weight: 600; color: #60a5fa;'>📌 Synthèse</span><br> <span style='font-size: 0.95rem; color: #94a3b8;'>Rappeler brièvement le contexte, la problématique et la méthodologie.</span> </div> <div style='background: #2d3748; padding: 12px; border-radius: 12px; border-left: 6px solid #10b981;'> <span style='font-weight: 600; color: #34d399;'>✅ Principaux résultats</span><br> <span style='font-size: 0.95rem; color: #94a3b8;'>Résumer les résultats clés obtenus.</span> </div> <div style='background: #2d3748; padding: 12px; border-radius: 12px; border-left: 6px solid #f59e0b;'> <span style='font-weight: 600; color: #fbbf24;'>🎯 Réponse aux objectifs</span><br> <span style='font-size: 0.95rem; color: #94a3b8;'>Montrer que les objectifs initiaux ont été atteints.</span> </div> <div style='background: #2d3748; padding: 12px; border-radius: 12px; border-left: 6px solid #ec4899;'> <span style='font-weight: 600; color: #f472b6;'>🚀 Perspectives</span><br> <span style='font-size: 0.95rem; color: #94a3b8;'>Proposer des améliorations ou des pistes de recherche futures.</span> </div> <div style='background: #334155; padding: 10px; border-radius: 12px; text-align: center; margin-top: 5px; border: 1px solid #475569;'> <span style='font-size: 0.9rem;'>La conclusion doit laisser une impression positive et durable.</span> </div> </div> </div>",
    "texteParle": "La conclusion est la dernière section de votre rapport. Elle doit laisser une impression positive et durable. Elle synthétise brièvement le contexte, la problématique et la méthodologie. Elle résume les principaux résultats obtenus. Elle montre que les objectifs que vous vous étiez fixés ont été atteints. Enfin, elle ouvre des perspectives en proposant des améliorations ou des pistes de recherche futures. La conclusion est votre dernière chance de convaincre votre jury.",
    "note": "Les éléments constitutifs d'une bonne conclusion."
  },
  {
    "titre": "Style et Rédaction",
    "contenu": "<div style='background: #1e293b; border-radius: 16px; padding: 18px; color: #e2e8f0;'> <p style='margin-top: 0; font-weight: 500;'>Conseils pour une bonne rédaction :</p> <div style='display: flex; flex-direction: column; gap: 10px;'> <div style='background: #2d3748; padding: 12px; border-radius: 12px; border-left: 6px solid #3b82f6;'> <span style='font-weight: 600; color: #60a5fa;'>📖 Clarté</span><br> <span style='font-size: 0.95rem; color: #94a3b8;'>Utiliser des phrases courtes et un vocabulaire précis.</span> </div> <div style='background: #2d3748; padding: 12px; border-radius: 12px; border-left: 6px solid #f59e0b;'> <span style='font-weight: 600; color: #fbbf24;'>🎯 Objectivité</span><br> <span style='font-size: 0.95rem; color: #94a3b8;'>Éviter le langage subjectif ou les opinions personnelles.</span> </div> <div style='background: #2d3748; padding: 12px; border-radius: 12px; border-left: 6px solid #10b981;'> <span style='font-weight: 600; color: #34d399;'>🔗 Cohérence</span><br> <span style='font-size: 0.95rem; color: #94a3b8;'>Assurer la fluidité entre les sections et les paragraphes.</span> </div> <div style='background: #2d3748; padding: 12px; border-radius: 12px; border-left: 6px solid #ec4899;'> <span style='font-weight: 600; color: #f472b6;'>✏️ Correction</span><br> <span style='font-size: 0.95rem; color: #94a3b8;'>Relire attentivement pour corriger les fautes d'orthographe et de grammaire.</span> </div> <div style='background: #334155; padding: 10px; border-radius: 12px; text-align: center; margin-top: 5px; border: 1px solid #475569;'> <span style='font-size: 0.9rem;'>Un rapport bien écrit est un rapport qui sera bien évalué.</span> </div> </div> </div>",
    "texteParle": "Le style et la qualité de la rédaction sont aussi importants que le contenu. Utilisez des phrases courtes et un vocabulaire précis pour plus de clarté. Soyez objectif : évitez les opinions personnelles, basez-vous sur les faits. Assurez la cohérence entre les différentes sections de votre rapport. Et surtout, relisez attentivement pour corriger les fautes d'orthographe et de grammaire. Un rapport bien écrit sera mieux compris et mieux évalué par votre jury.",
    "note": "Conseils pour un style de rédaction académique."
  },
  {
    "titre": "Annexes et Bibliographie",
    "contenu": "<div style='background: #1e293b; border-radius: 16px; padding: 18px; color: #e2e8f0;'> <div style='display: flex; flex-direction: column; gap: 12px;'> <div style='background: #2d3748; padding: 14px; border-radius: 12px; border-left: 6px solid #3b82f6;'> <span style='font-weight: 600; color: #60a5fa;'>📚 Bibliographie</span><br> <span style='font-size: 0.95rem; color: #94a3b8;'>Toutes les références citées dans le rapport doivent être listées avec un format cohérent (APA, IEEE, etc.).</span> </div> <div style='background: #2d3748; padding: 14px; border-radius: 12px; border-left: 6px solid #10b981;'> <span style='font-weight: 600; color: #34d399;'>📎 Annexes</span><br> <span style='font-size: 0.95rem; color: #94a3b8;'>Contenus supplémentaires : code détaillé, jeux de données, détails techniques, etc.</span> </div> <div style='background: #2d3748; padding: 14px; border-radius: 12px; border-left: 6px solid #f59e0b;'> <span style='font-weight: 600; color: #fbbf24;'>💡 Conseils</span><br> <span style='font-size: 0.95rem; color: #94a3b8;'>• Les annexes ne doivent pas contenir d'informations essentielles à la compréhension principale.</span><br> <span style='font-size: 0.95rem; color: #94a3b8;'>• Utiliser un gestionnaire de références (Zotero, Mendeley) pour gérer la bibliographie.</span> </div> <div style='background: #334155; padding: 10px; border-radius: 12px; text-align: center; border: 1px solid #475569;'> <span style='font-size: 0.9rem;'>Les annexes enrichissent le rapport sans alourdir le corps du texte.</span> </div> </div> </div>",
    "texteParle": "N'oubliez pas les annexes et la bibliographie. La bibliographie liste toutes les références que vous avez citées dans le rapport. Elle doit être présentée dans un format cohérent, comme le format APA ou IEEE. Les annexes contiennent des informations supplémentaires qui ne sont pas essentielles à la compréhension principale : code détaillé, jeux de données, détails techniques, etc. Utilisez un gestionnaire de références comme Zotero pour organiser vos sources. Ces éléments ajoutent de la crédibilité à votre rapport.",
    "note": "Importance des annexes et de la bibliographie."
  },
  {
    "titre": "Exemple de Structure",
    "contenu": "<div style='background: #1e293b; border-radius: 16px; padding: 18px; color: #e2e8f0;'> <div style='background: #2d3748; padding: 15px; border-radius: 12px;'> <h4 style='margin: 0 0 10px 0; color: #fbbf24;'>📋 Plan type pour un PFE Data Science</h4> <ul style='list-style: none; padding: 0; font-size: 0.95rem;'> <li style='padding: 6px 0; border-bottom: 1px solid #475569;'><span style='color: #60a5fa;'>1.</span> Introduction (2-3 pages)</li> <li style='padding: 6px 0; border-bottom: 1px solid #475569;'><span style='color: #60a5fa;'>2.</span> État de l'art (4-5 pages)</li> <li style='padding: 6px 0; border-bottom: 1px solid #475569;'><span style='color: #60a5fa;'>3.</span> Méthodologie (4-5 pages)</li> <li style='padding: 6px 0; border-bottom: 1px solid #475569;'><span style='color: #60a5fa;'>4.</span> Résultats (3-4 pages)</li> <li style='padding: 6px 0; border-bottom: 1px solid #475569;'><span style='color: #60a5fa;'>5.</span> Discussion (3-4 pages)</li> <li style='padding: 6px 0; border-bottom: 1px solid #475569;'><span style='color: #60a5fa;'>6.</span> Conclusion (2 pages)</li> <li style='padding: 6px 0;'><span style='color: #60a5fa;'>7.</span> Annexes et Bibliographie</li> </ul> </div> <div style='background: #334155; padding: 12px; border-radius: 12px; text-align: center; margin-top: 12px; border: 1px solid #475569;'> <span style='font-size: 0.9rem;'>Total recommandé : 20-25 pages pour un PFE de Licence 3.</span> </div> </div>",
    "texteParle":;

    // ================================================================
    // ÉTAT
    // ================================================================
    let currentIndex = 0;
    let isSpeaking = false;
    let isPaused = false;
    let currentUtterance = null;
    let isLoading = false;
    let loadingTimeout = null;
    let isTransitioning = false;
    let speechSupported = true;
    let userInteracted = false;
    let isPlaying = false;
    let loadingCancelled = false;

    const total = slides.length;
    const synth = window.speechSynthesis;

    // Références jQuery
    const $title = $('#slideTitle');
    const $body = $('#slideBody');
    const $counter = $('#slideCounter');
    const $statusText = $('#statusText');
    const $statusBadge = $('#statusBadge');
    const $loading = $('#loadingOverlay');
    const $loadingText = $('#loadingText');
    const $loadingSub = $('#loadingSub');
    const $loadingTimeout = $('#loadingTimeout');
    const $loadingProgressBar = $('#loadingProgressBar');
    const $autoIndicator = $('#autoIndicator');
    const $prev = $('#prevBtn');
    const $next = $('#nextBtn');
    const $replay = $('#replayBtn');
    const $play = $('#playBtn');
    const $cancelLoading = $('#cancelLoadingBtn');

    // ================================================================
    // FONCTIONS
    // ================================================================
    function setStatus(text, type) {
        $statusText.text(text);
        $statusBadge.removeClass('idle speaking error paused waiting loading');
        if (type === 'speaking') $statusBadge.addClass('speaking');
        else if (type === 'error') $statusBadge.addClass('error');
        else if (type === 'paused') $statusBadge.addClass('paused');
        else if (type === 'waiting') $statusBadge.addClass('waiting');
        else if (type === 'loading') $statusBadge.addClass('loading');
        else $statusBadge.addClass('idle');
    }

    function updatePlayButton() {
        if (isPlaying) {
            $play.addClass('playing');
            $play.find('.btn-icon').text('⏸');
            $play.find('.btn-label').text('Pause');
        } else {
            $play.removeClass('playing');
            $play.find('.btn-icon').text('▶');
            $play.find('.btn-label').text('Play');
        }
    }

    function showLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        
        loadingCancelled = false;
        isLoading = true;
        
        // Réinitialiser la barre de progression
        $loadingProgressBar.css('animation', 'none');
        $loadingProgressBar.css('width', '0%');
        // Forcer un reflow
        $loadingProgressBar[0].offsetHeight;
        $loadingProgressBar.css('animation', 'loadingProgress 30s ease-out forwards');
        
        $loadingText.text('Préparation vocale...');
        $loadingSub.text('Synthèse en cours');
        $loadingTimeout.text('⏱️ 30 secondes maximum');
        $loading.fadeIn(300);
        setStatus("⏳ Chargement...", 'loading');
        
        // 🔥 TIMEOUT DE 30 SECONDES
        loadingTimeout = setTimeout(() => {
            if (isLoading && !loadingCancelled) {
                hideLoading();
                setStatus("⚠️ Délai dépassé (30s)", 'error');
                isPlaying = false;
                updatePlayButton();
                $loadingSub.text('La synthèse vocale a pris trop de temps');
                $loadingTimeout.text('❌ Délai dépassé');
            }
        }, 30000);
    }

    function hideLoading() {
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        isLoading = false;
        loadingCancelled = false;
        $loading.fadeOut(300);
        // Ne pas changer le statut si on est en train de parler
        if (!isSpeaking && !isPlaying) {
            setStatus("⏸ Lecture arrêtée", 'paused');
        }
    }

    function cancelLoading() {
        loadingCancelled = true;
        if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
        }
        hideLoading();
        stopSpeaking();
        setStatus("⏸ Annulé", 'paused');
        isPlaying = false;
        updatePlayButton();
        $loadingText.text('Annulé par l\'utilisateur');
        $loadingSub.text('Vous pouvez réessayer');
        $loadingTimeout.text('✕ Annulation');
    }

    // Arrêter la parole proprement
    function stopSpeaking() {
        try {
            if (synth && (synth.speaking || synth.pending)) {
                synth.cancel();
            }
        } catch(e) {
            console.warn('Erreur stopSpeaking:', e);
        }
        if (currentUtterance) {
            try {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance.onstart = null;
            } catch(e) {}
            currentUtterance = null;
        }
        isSpeaking = false;
        isPlaying = false;
        updatePlayButton();
    }

    // Mettre en pause la parole
    function pauseSpeaking() {
        try {
            if (synth && synth.speaking) {
                synth.pause();
                isPaused = true;
                isPlaying = false;
                setStatus("⏸ Lecture en pause", 'paused');
                updatePlayButton();
            }
        } catch(e) {
            console.warn('Erreur pauseSpeaking:', e);
            stopSpeaking();
        }
    }

    // Reprendre la parole
    function resumeSpeaking() {
        try {
            if (synth && synth.paused) {
                synth.resume();
                isPaused = false;
                isPlaying = true;
                setStatus("🔊 Lecture en cours", 'speaking');
                updatePlayButton();
            } else if (!isSpeaking && !synth.speaking && !synth.pending) {
                speakSlide(currentIndex);
            }
        } catch(e) {
            console.warn('Erreur resumeSpeaking:', e);
            speakSlide(currentIndex);
        }
    }

    function renderSlide(index) {
        const slide = slides[index];
        $title.text(slide.titre);

        let html = '';
        html += `<div class="content-card">${slide.contenu}</div>`;
        if (slide.note) {
            html += `<div class="note-box">${slide.note}</div>`;
        }
        $body.html(html);
        $counter.text(`${index+1} / ${total}`);

        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(err => console.warn('MathJax error:', err));
        }
    }

    // ================================================================
    // LECTURE VOCALE
    // ================================================================
    function speakSlide(index) {
        return new Promise((resolve) => {
            const slide = slides[index];
            const text = slide.texteParle;
            
            if (!text || text.trim() === '' || !speechSupported) {
                resolve();
                return;
            }

            if (!window.speechSynthesis) {
                setStatus("❌ Synthèse vocale non supportée", 'error');
                speechSupported = false;
                resolve();
                return;
            }

            // Arrêter toute lecture en cours
            stopSpeaking();
            
            // Réinitialiser l'état de pause
            isPaused = false;
            
            showLoading();
            setStatus("Initialisation...", 'loading');

            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 0.92;
                utterance.pitch = 1.05;
                utterance.volume = 1;

                let isFinished = false;
                let errorHandled = false;

                utterance.onstart = function() {
                    if (loadingCancelled) {
                        stopSpeaking();
                        resolve();
                        return;
                    }
                    hideLoading();
                    isSpeaking = true;
                    isPlaying = true;
                    isPaused = false;
                    setStatus("🔊 Lecture en cours", 'speaking');
                    updatePlayButton();
                };

                utterance.onend = function() {
                    if (isFinished) return;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    setStatus("✅ Terminé", 'idle');
                    hideLoading();
                    updatePlayButton();
                    resolve();
                };

                utterance.onerror = function(e) {
                    if (isFinished || errorHandled) return;
                    errorHandled = true;
                    isFinished = true;
                    isSpeaking = false;
                    isPlaying = false;
                    isPaused = false;
                    hideLoading();
                    updatePlayButton();
                    
                    if (e.error === 'not-allowed') {
                        setStatus("⚠️ Permission refusée", 'error');
                    } else if (e.error === 'synthesis-unavailable') {
                        setStatus("⚠️ Synthèse indisponible", 'error');
                    } else if (e.error === 'canceled') {
                        setStatus("⏸ Annulé", 'paused');
                    } else {
                        setStatus("❌ Erreur audio: " + (e.error || 'inconnue'), 'error');
                    }
                    
                    resolve();
                };

                // Gestion du chargement des voix
                if (synth.getVoices().length === 0) {
                    synth.onvoiceschanged = function() {
                        if (!loadingCancelled) {
                            try {
                                synth.speak(utterance);
                            } catch(err) {
                                // Silencieux
                            }
                        }
                        synth.onvoiceschanged = null;
                    };
                }

                currentUtterance = utterance;
                
                if (!loadingCancelled) {
                    try {
                        synth.speak(utterance);
                    } catch(err) {
                        setTimeout(() => {
                            if (!loadingCancelled) {
                                try {
                                    synth.speak(utterance);
                                } catch(e) {
                                    setStatus("❌ Erreur de lecture", 'error');
                                    isPlaying = false;
                                    updatePlayButton();
                                    hideLoading();
                                    resolve();
                                }
                            } else {
                                resolve();
                            }
                        }, 100);
                    }
                } else {
                    resolve();
                }

            } catch(err) {
                hideLoading();
                setStatus("❌ Erreur générale", 'error');
                isPlaying = false;
                updatePlayButton();
                console.error('Erreur speakSlide:', err);
                resolve();
            }
        });
    }

    // ================================================================
    // NAVIGATION
    // ================================================================
    async function goToSlide(index) {
        if (isTransitioning) return;
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        
        // Si on est en train de lire, on met en pause avant de naviguer
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        // Arrêter complètement la lecture
        stopSpeaking();
        
        await new Promise(r => setTimeout(r, 50));
        
        if (index === currentIndex) {
            setStatus("📄 Slide actuel", 'idle');
            return;
        }

        isTransitioning = true;
        currentIndex = index;
        renderSlide(index);
        
        // Réinitialiser l'état de lecture
        isPlaying = false;
        updatePlayButton();
        setStatus("⏸ Lecture arrêtée", 'paused');

        await new Promise(r => setTimeout(r, 150));
        isTransitioning = false;
    }

    async function goToNext() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex + 1 < total) {
            await goToSlide(currentIndex + 1);
        } else {
            setStatus("🏁 Dernier slide", 'idle');
        }
    }

    async function goToPrev() {
        if (isTransitioning) return;
        
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
        }
        
        if (currentIndex - 1 >= 0) {
            await goToSlide(currentIndex - 1);
        } else {
            setStatus("🔁 Premier slide", 'idle');
        }
    }

    // ================================================================
    // GESTION PLAY/PAUSE
    // ================================================================
    function togglePlay() {
        if (!userInteracted) {
            userInteracted = true;
        }

        // Si le chargement est en cours, on l'annule
        if (isLoading) {
            cancelLoading();
            return;
        }

        // Si le synthétiseur est en pause, on reprend
        if (synth && synth.paused) {
            resumeSpeaking();
            return;
        }

        // Si la lecture est en cours, on met en pause
        if (isSpeaking || isPlaying) {
            pauseSpeaking();
            return;
        }

        // Sinon, on démarre la lecture du slide courant
        if (!isSpeaking && !isPlaying) {
            stopSpeaking();
            speakSlide(currentIndex);
        }
    }

    // ================================================================
    // INIT
    // ================================================================
    async function init() {
        // Vérifier la compatibilité
        if (!window.speechSynthesis) {
            setStatus("❌ Synthèse vocale non supportée", 'error');
            speechSupported = false;
        }

        // Précharger les voix
        try {
            if (synth.getVoices) {
                synth.getVoices();
                setTimeout(() => {
                    try {
                        synth.getVoices();
                    } catch(e) {}
                }, 200);
            }
        } catch(e) {
            console.warn('Erreur chargement voix:', e);
        }

        // Afficher le premier slide
        renderSlide(0);
        $counter.text(`1 / ${total}`);
        
        // État initial
        setStatus("⏸ Appuie sur Play", 'paused');
        updatePlayButton();
        $autoIndicator.text('⏸ Lecture manuelle');

        // ================================================================
        // ÉVÉNEMENTS
        // ================================================================
        
        // Bouton Play/Pause
        $play.on('click', function() {
            togglePlay();
        });

        // Bouton Annuler le chargement
        $cancelLoading.on('click', function() {
            cancelLoading();
        });

        // Navigation
        $prev.on('click', function() {
            // Si chargement en cours, on annule
            if (isLoading) cancelLoading();
            goToPrev();
        });

        $next.on('click', function() {
            if (isLoading) cancelLoading();
            goToNext();
        });

        // Replay - relire le slide courant
        $replay.on('click', function() {
            if (isLoading) cancelLoading();
            stopSpeaking();
            setTimeout(() => {
                speakSlide(currentIndex);
            }, 100);
        });

        // Support du clavier (espace pour play/pause)
        $(document).on('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });

        // Nettoyage
        $(window).on('beforeunload', function() {
            try {
                if (synth.speaking) synth.cancel();
            } catch(e) {}
            hideLoading();
        });

        // Gérer les cas où la synthèse se termine de manière inattendue
        setInterval(() => {
            if (isPlaying && !synth.speaking && !synth.pending && !isPaused && !isLoading) {
                isPlaying = false;
                updatePlayButton();
                setStatus("⏸ Lecture arrêtée", 'paused');
            }
        }, 1000);
    }

    init();
});



    // ================================================================
    // GESTION DU THÈME JOUR/NUIT
    // ================================================================
    let isDarkMode = false;

    function toggleTheme() {
        isDarkMode = !isDarkMode;
        const body = document.body;
        const appContainer = document.querySelector('.app-container');
        const header = document.querySelector('.slide-header');
        const footer = document.querySelector('.slide-footer');
        const contentCards = document.querySelectorAll('.content-card');
        const noteBoxes = document.querySelectorAll('.note-box');
        const mathBlocks = document.querySelectorAll('.math-block');
        const buttons = document.querySelectorAll('.btn');
        const statusBadge = document.querySelector('.status-badge');
        const slideCounter = document.querySelector('.slide-counter');
        const autoIndicator = document.querySelector('.auto-indicator');
        const themeBtn = document.getElementById('themeToggle');

        if (isDarkMode) {
            // Mode nuit
            body.style.background = '#0b1120';
            body.style.color = '#f1f5f9';
            appContainer.style.background = 'linear-gradient(145deg, #0f172a 0%, #1e293b 100%)';
            header.style.background = 'rgba(15, 23, 42, 0.85)';
            footer.style.background = 'rgba(15, 23, 42, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.05)';
                card.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.08)';
                note.style.color = '#cbd5e1';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.25)';
                block.style.borderColor = 'rgba(255,255,255,0.06)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#e2e8f0';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.12)';
                statusBadge.style.color = '#93bbfc';
            }
            if (slideCounter) {
                slideCounter.style.color = '#94a3b8';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#64748b';
            }
            if (themeBtn) {
                themeBtn.textContent = '☀️';
                themeBtn.title = 'Passer en mode jour';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#e2e8f0';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#e2e8f0';
                }
            });
        } else {
            // Mode jour (par défaut)
            body.style.background = '#f0f4f8';
            body.style.color = '#1a202c';
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
            header.style.background = 'rgba(255, 255, 255, 0.85)';
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
            contentCards.forEach(card => {
                card.style.background = 'rgba(255,255,255,0.8)';
                card.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            noteBoxes.forEach(note => {
                note.style.background = 'rgba(96, 165, 250, 0.12)';
                note.style.color = '#2c3e50';
            });
            mathBlocks.forEach(block => {
                block.style.background = 'rgba(0,0,0,0.05)';
                block.style.borderColor = 'rgba(0,0,0,0.08)';
            });
            buttons.forEach(btn => {
                btn.style.color = '#2d3748';
            });
            if (statusBadge) {
                statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
                statusBadge.style.color = '#2b6cb0';
            }
            if (slideCounter) {
                slideCounter.style.color = '#4a5568';
            }
            if (autoIndicator) {
                autoIndicator.style.color = '#718096';
            }
            if (themeBtn) {
                themeBtn.textContent = '🌓';
                themeBtn.title = 'Passer en mode nuit';
            }
            // Couleurs des titres dans les slides
            document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
                if (!el.closest('.note-box')) {
                    el.style.color = '#2c3e50';
                }
            });
            document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
                if (!el.closest('.note-box') && !el.closest('.math-block')) {
                    el.style.color = '#2d3748';
                }
            });
        }
    }

    // Initialiser en mode jour
    document.addEventListener('DOMContentLoaded', function() {
        // Appliquer le mode jour par défaut
        const body = document.body;
        body.style.background = '#f0f4f8';
        body.style.color = '#1a202c';
        
        const appContainer = document.querySelector('.app-container');
        if (appContainer) {
            appContainer.style.background = 'linear-gradient(145deg, #ffffff 0%, #f0f4f8 100%)';
        }
        
        const header = document.querySelector('.slide-header');
        if (header) {
            header.style.background = 'rgba(255, 255, 255, 0.85)';
        }
        
        const footer = document.querySelector('.slide-footer');
        if (footer) {
            footer.style.background = 'rgba(255, 255, 255, 0.9)';
        }
        
        document.querySelectorAll('.content-card').forEach(card => {
            card.style.background = 'rgba(255,255,255,0.8)';
            card.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.note-box').forEach(note => {
            note.style.background = 'rgba(96, 165, 250, 0.12)';
            note.style.color = '#2c3e50';
        });
        
        document.querySelectorAll('.math-block').forEach(block => {
            block.style.background = 'rgba(0,0,0,0.05)';
            block.style.borderColor = 'rgba(0,0,0,0.08)';
        });
        
        document.querySelectorAll('.btn').forEach(btn => {
            btn.style.color = '#2d3748';
        });
        
        const statusBadge = document.querySelector('.status-badge');
        if (statusBadge) {
            statusBadge.style.background = 'rgba(96, 165, 250, 0.15)';
            statusBadge.style.color = '#2b6cb0';
        }
        
        const slideCounter = document.querySelector('.slide-counter');
        if (slideCounter) {
            slideCounter.style.color = '#4a5568';
        }
        
        const autoIndicator = document.querySelector('.auto-indicator');
        if (autoIndicator) {
            autoIndicator.style.color = '#718096';
        }
        
        document.querySelectorAll('.slide-body h1, .slide-body h2, .slide-body h3, .slide-body h4').forEach(el => {
            if (!el.closest('.note-box')) {
                el.style.color = '#2c3e50';
            }
        });
        
        document.querySelectorAll('.slide-body p, .slide-body li, .slide-body td, .slide-body th').forEach(el => {
            if (!el.closest('.note-box') && !el.closest('.math-block')) {
                el.style.color = '#2d3748';
            }
        });
        
        const themeBtn = document.getElementById('themeToggle');
        if (themeBtn) {
            themeBtn.textContent = '🌓';
            themeBtn.title = 'Passer en mode nuit';
        }
    });
</script>
